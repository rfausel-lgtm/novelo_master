summary: Ex-presidente da República, condenado pelo STF em 11/09/2025 por tentativa de golpe, segundo
  o Intercept. É o biografado do filme 'Dark Horse' e, segundo contrato descrito pelo Intercept, cedeu
  os 'direitos de história de vida' para a produção. Mensagens indicam que Vorcaro topou recebê-lo em
  sua mansão em Brasília em março de 2025, sem confirmação de que o encontro ocorreu.
why_in_novelo: É o objeto do filme 'Dark Horse', cujo financiamento por Daniel Vorcaro está sob investigação;
  cedeu direitos de história de vida à produtora, segundo a imprensa.
