summary: Irmão do Min. André Mendonça. Nomeado Superintendente da SP Regula em julho/2024, atuando na área
  funerária e cemiterial, e promovido a Secretário-Executivo da agência em 26/05/2026 — durante a
  pendência do julgamento da cautelar sobre preços dos serviços funerários de São Paulo, cautelar essa em
  que seu irmão votou contra a posição do relator, Min. Flávio Dino, e a favor das concessionárias privadas
  (incluindo a Cortel SP).
why_in_novelo: A decisão do Min. Dino na ADPF 1.196 (15/09/2026) registra sua posição na agência municipal
  que regula os serviços funerários de SP como um dos pontos de "convergência temporal" a esclarecer, ao
  lado do encontro Mendonça-Vorcaro e dos contratos do Instituto ITER — sem afirmar relação causal.
