summary: >-
  Eleito presidente do Conselho de Administração do BRB na 802ª Reunião do Consad, de 30/01/2023 (ata publicada
  pela área de Relações com Investidores do banco). Segundo o fato relevante do BRB de 28/01/2026 noticiado
  pelo Money Times, renunciou ao conselho com efeito imediato. Segundo o Metrópoles, o SBT News e o Congresso
  em Foco, é um dos cinco ex-dirigentes alcançados pela cautelar de indisponibilidade de bens do TCDF de
  23/09/2026 (cautelar, sem julgamento de mérito).
why_in_novelo: Presidente do Conselho de Administração do BRB eleito em 30/01/2023 conforme ata do banco, e um dos cinco ex-dirigentes alcançados pela cautelar do TCDF de 23/09/2026, segundo a imprensa.
cited_position:
- kind: not_located
  by_id: marcelo-talarico
  date: '2026-10-15'
  summary: >-
    Quanto à cautelar do TCDF, o Poder360 informou, em 23/09/2026, não ter localizado contato válido para ele;
    busca do Novelo em 15/10/2026 por nota de defesa ou manifestação pública, pelo nome, não retornou posição.
  source_ids:
  - src-poder360-2026-09-23-tc-df-bloqueia-r-27-bi-em-bens-de-ex-dirigentes-do-brb
open_questions:
- O Metrópoles (13/01/2026) afirma que ele presidia o conselho desde 2022; a ata prova apenas a eleição de
  30/01/2023 para o novo mandato, e não se apurou se presidia antes.
- A renúncia de janeiro de 2026 é conhecida só pelo fato relevante do BRB de 28/01/2026 noticiado pelo Money
  Times (o comunicado não foi aberto), por isso não consta como data final do cargo.
- Defesa nos 30 dias dados pelo TCDF a partir de 23/09/2026; nada localizado até 15/10/2026.
