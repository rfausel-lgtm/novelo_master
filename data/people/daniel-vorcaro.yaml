summary: 'Banqueiro, controlador do Banco Master. Foi preso na deflagração da Operação Compliance Zero
  (18/11/2025), solto em seguida por decisão do TRF segundo a imprensa, e teve prisão preventiva decretada
  pelo STF em 04/03/2026 (PET 15556), mantida pela Segunda Turma em 20/03/2026. Sua origem patrimonial
  é objeto de apuração: declarava R$ 2,8 milhões à Receita Federal em 2015, dois anos antes de contratar
  a compra de 56,87% do Banco Máxima por R$ 40 milhões, dos quais apenas R$ 4 milhões em espécie. A diferença
  foi preenchida, segundo o Banco Central e a imprensa, por reavaliações imobiliárias de valorização extraordinária
  e por transferências circulares entre o próprio banco, empresas suas e fundos de investimento. Foi alvo
  da Operação Fundo Fake, sobre desvio de recursos de previdências municipais, e teve mandado de prisão
  expedido nessa frente — nunca cumprido, depois anulado, com o inquérito trancado pelo TRF-1 em 2023.
  Sua defesa sustenta que ele foi formalmente excluído da investigação, por não manter vínculo com o Banco
  Máxima à época dos fatos apurados, que são de dezembro de 2010 a abril de 2016.'
why_in_novelo: É o controlador do Banco Master, instituição liquidada pelo Banco Central em novembro de
  2025, e investigado central da Operação Compliance Zero conduzida pela Polícia Federal sob relatoria
  do STF.
