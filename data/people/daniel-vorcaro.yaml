open_questions:
- Não há, no corpus, a íntegra das decisões judiciais; o conteúdo registrado é o das comunicações oficiais
  do STF.
- As alegações da PF sobre pagamentos a agentes públicos permanecem sob investigação e não foram julgadas.
- 'Há contradição não resolvida entre fontes sobre o jato Gulfstream G700: uma linha de reportagem (Revista
  Oeste, aeroin.net) indica que a aeronave estaria em nome do grupo ''Prime You'' e teria sido revendida
  a uma empresa de táxi aéreo de San Marino em dezembro de 2025, antes do bloqueio patrimonial; outra
  (InfoMoney, decisão de 23/03/2026) inclui o mesmo modelo na lista oficial de bens sob indisponibilidade.
  Não localizamos fonte que reconcilie as duas versões.'
- Vorcaro tentou, sem sucesso, levar as investigações da Operação Carbono Oculto (PCC) e da Operação Quasar
  ao STF por suposta conexão com o caso Master; a Justiça negou o pedido em 19/12/2025, afastando expressamente
  essa conexão. A sobreposição real entre os dois casos é indireta, via gestoras de nicho (Reag, Trustee),
  não identidade entre os esquemas.
- 'Há duas versões incompatíveis sobre o primeiro negócio de Vorcaro: a dele próprio, em perfil de 2021,
  de que comprou dos herdeiros um sistema educacional a que prestava consultoria; e a de reportagens posteriores,
  de que administrava uma editora de livros didáticos do próprio pai. A distinção é relevante porque uma
  versão o apresenta como empreendedor que se fez sozinho e a outra como gestor de ativo familiar.'
- 'PARCIALMENTE ESCLARECIDO (lote 175): reportagem de fonte única (Times Brasil, 08/05/2026) descrevia-o
  como detido ''uma segunda vez'', em março de 2026, por suspeita de planejar atos violentos contra
  opositores — motivo aparentemente distinto do que o corpus registrava para a prisão preventiva decretada
  pelo STF em 04/03/2026 (PET 15.556). O agravo regimental da própria defesa (e-Doc 86), lido pela equipe,
  confirma que a prisão de 04/03/2026 É a mesma da PET 15.556 — a conversão do monitoramento eletrônico
  vigente desde novembro de 2025 em prisão em estabelecimento penal, fundamentada exatamente nos fatos de
  ''A Turma'' já mapeados (lote 170) —, não uma prisão distinta por planejamento de atos violentos. A
  caracterização da Times Brasil parece ser paráfrase imprecisa do mesmo fato, não uma segunda prisão com
  motivo próprio; segue sem confirmação em segunda fonte que a trate como evento distinto.'
- A PF concluiu em agosto de 2026 o inquérito-mãe (1ª fase) e preparou indiciamento de Vorcaro, remetido
  ao MPF/PGR — até 05/09/2026, sem denúncia formal oferecida no núcleo do caso Master.
- Em 02/09/2026, a PGR pediu ao STF o arquivamento de uma notícia/reclamação apresentada pelo PRÓPRIO
  Vorcaro sobre supostas ameaças na prisão — não é uma denúncia contra ele, e não deve ser confundida
  com a denúncia que o MPF/PGR poderá eventualmente oferecer no inquérito-mãe, ainda não apresentada até
  a data desta apuração.
- Condenado pela CVM em 08/09/2026, por unanimidade, a R$ 20 milhões de multa por operação fraudulenta
  na 3ª emissão do Brazil Realty FII (2018-2020) — processo autônomo da CVM, distinto da Operação Compliance
  Zero, sobre esquema anterior ao colapso do banco. Sua advogada, Ana Paula Casagrande, questionou na
  sessão a falta de provas individualizadas de dolo. Cabe recurso ao CRSFN.
- Segundo relatório da Kroll (contratada pelo BRB), o advogado maranhense Daniel de Faria Jerônimo Leite
  atuou como 'figura instrumental' dele, de Maurício Quadrado e de João Carlos Mansur na tentativa de
  compra de ações do BRB, com empréstimo de R$ 93,7 milhões em abril de 2025 — única conexão documentada
  entre a rede Master e o Maranhão localizada pela equipe.
- 'Sua defesa mudou de estratégia: desistiu de insistir em nova proposta de delação premiada e passou
  a concentrar esforços no mérito da ação penal, contestando a cadeia de custódia dos celulares apreendidos.
  Não localizada reação específica da defesa ao conteúdo da delação de João Carlos Mansur (distinta de
  reagir ao fato de ela existir).'
- 'NOVO: em 24/07/2026, o STF autorizou a CVM a colhê-lo em depoimento, preso, para instruir três
  Investigações Administrativas sancionadoras da autarquia — sobre a Ambipar (mercados à vista e de
  derivativos, 2024-2025, já no acervo por outra via) e sobre notas comerciais e CRIs adquiridos por cinco
  fundos até então não registrados no corpus (CITY-02 FIDC, CITY FIDC, Máxima FIM – Crédito Privado 2, MN
  I FIDC, ST 1001 FIDC) — sem detalhamento disponível sobre valores ou mecanismo em cada um.'
- 'NOVO (lote 234): a procuração e os substabelecimentos anexados aos autos da PET 15.198 revelam os
  números completos do processo pré-STF, na 10ª Vara Federal Criminal da SJDF — Processo nº
  1096304-87.2025.4.01.3400, Pedido de Prisão Preventiva nº 1117065-42.2025.4.01.3400 e Pedido de Busca e
  Apreensão nº 1117412-75.2025.4.01.3400 —, até aqui só existentes truncados num slug de fonte do acervo.
  A própria defesa dele confirmou, em petição de 14/01/2026, que ele foi alvo da busca e apreensão daquele
  dia — corroborando por fonte independente o que já constava, de forma genérica, na cobertura oficial do
  STF. A PF havia fundamentado o pedido de nova busca no endereço atual dele citando o "Projeto DV"
  (campanha de influenciadores, já mapeada no acervo via INQ 5.035) como indício de novos crimes — elo
  entre as duas frentes até então não registrado.'
