summary: Banqueiro, controlador do Banco Master. Foi preso na deflagração da Operação Compliance Zero
  (18/11/2025), solto em seguida por decisão do TRF segundo a imprensa, e teve prisão preventiva decretada
  pelo STF em 04/03/2026 (PET 15556), mantida pela Segunda Turma em 20/03/2026.
why_in_novelo: É o controlador do Banco Master, instituição liquidada pelo Banco Central em novembro de
  2025, e investigado central da Operação Compliance Zero conduzida pela Polícia Federal sob relatoria
  do STF.
cited_position:
- date: '2026-03-04'
  kind: denial
  summary: Segundo a CNN Brasil, após a prisão de 04/03/2026 a defesa do banqueiro negou que ele tenha
    obstruído as investigações relacionadas à instituição financeira.
  source_ids:
  - src-cnn-2026-03-04-relembre-crise-master
  by_id: daniel-vorcaro
- kind: version
  summary: Em depoimento de 02/09/2026 ao gabinete de André Mendonça, afirmou ter sofrido tortura psicológica,
    maus-tratos e ameaças veladas na prisão para não citar a Polícia Federal em eventual delação.
  source_ids:
  - src-ndmais-2026-09-02-vorcaro-alega-tortura
  - src-contrapontoms-2026-09-02-investigadores-veem-teatro
  by_id: daniel-vorcaro
  date: '2026-09-02'
- kind: version
  summary: 'Sobre as ordens de agressão a adversários: disse que as deu porque ''estava nervoso'' e que
    não se concretizaram.'
  source_ids:
  - src-jbrasilia-2026-09-vorcaro-admite-ordens
  by_id: daniel-vorcaro
  date: '2026-09-02'
- kind: version
  summary: Em depoimento à PF de 28/08/2026, tornado público em 04/09, disse ter passado 'um terror' e
    reconheceu 'erros' no processo do Master, mas insistiu que a venda ao BRB e a liquidação precisam
    ser esclarecidas, afirmando ter sido surpreendido pela decisão de liquidar o banco.
  source_ids:
  - src-ndmais-2026-09-04-vorcaro-terror-depoimento-pf
  by_id: daniel-vorcaro
  date: '2026-09-04'
open_questions:
- Não há, no corpus, a íntegra das decisões judiciais; o conteúdo registrado é o das comunicações oficiais
  do STF.
- As alegações da PF sobre pagamentos a agentes públicos permanecem sob investigação e não foram julgadas.
- 'Há contradição não resolvida entre fontes sobre o jato Gulfstream G700: uma linha de reportagem (Revista
  Oeste, aeroin.net) indica que a aeronave estaria em nome do grupo ''Prime You'' e teria sido revendida
  a uma empresa de táxi aéreo de San Marino em dezembro de 2025, antes do bloqueio patrimonial; outra
  (InfoMoney, decisão de 23/03/2026) inclui o mesmo modelo na lista oficial de bens sob indisponibilidade.
  Não localizamos fonte que reconcilie as duas versões.'
- Vorcaro tentou, sem sucesso, levar as investigações da Operação Carbono Oculto (PCC) e da Operação Quasar
  ao STF por suposta conexão com o caso Master; a Justiça negou o pedido em 19/12/2025, afastando expressamente
  essa conexão. A sobreposição real entre os dois casos é indireta, via gestoras de nicho (Reag, Trustee),
  não identidade entre os esquemas.
