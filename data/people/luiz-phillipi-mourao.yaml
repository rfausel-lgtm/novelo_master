role: Apontado pela Polícia Federal como integrante do chamado núcleo de intimidação; morreu sob custódia
  em março de 2026
positions: []
summary: 'Preso na 3ª fase da Operação Compliance Zero em 04/03/2026, teve morte cerebral horas depois,
  sob custódia da PF em Belo Horizonte. A corporação informou que ele havia tentado se matar, disse que
  entregaria os registros em vídeo ao relator no STF e abriria procedimento apuratório. A família afirma
  não ter tido acesso às imagens, aos autos nem ao laudo do IML, e contesta o apelido que lhe foi atribuído
  pelos investigadores, por falta de prova pública. Segundo a decisão da 6ª fase, a autoridade policial
  o apontava como gestor de um núcleo subordinado ao comando central. ATUALIZAÇÃO (09/09/2026): a Polícia
  Federal concluiu o inquérito sobre sua morte em abril de 2026, com a conclusão de que ele atentou contra
  a própria vida e de que ''não houve intervenção externa na ocorrência''; o relatório foi enviado ao
  ministro André Mendonça. Não foi localizada divulgação do laudo do IML, nem qualquer apuração externa
  — de corregedoria ou do Ministério Público — sobre as circunstâncias da morte, e não há registro de
  que a família tenha obtido, depois disso, o acesso aos autos e às imagens que reclamava. Registro societário:
  era sócio-administrador único de duas empresas em Belo Horizonte, ambas com capital social declarado
  de R$ 1 milhão — a King Participações Imobiliárias, apontada como receptora dos repasses mensais destinados
  ao grupo, e a King Motors Locação de Veículos —, ambas com atividades suspensas por determinação judicial
  em 03/03/2026. A REPRESENTAÇÃO DA PF DE 27/02/2026 (lote 170) — a própria petição que fundamentou sua
  prisão preventiva de 04/03/2026 — é a fonte documental primária do apelido ''Sicário'' e do papel a ele
  atribuído: segundo a PF, comandava, a mando de Daniel Vorcaro, o núcleo de intimidação ''A Turma'', com
  Marilson Roseno da Silva como líder operacional em campo, remunerado em R$ 1 milhão por mês; a petição
  transcreve mensagens de WhatsApp em que ele aprova ou executa ameaças de morte contra um ex-funcionário
  de Vorcaro e sua família, invasão de dispositivos de um crítico do banco, e um documento forjado com
  aparência de ser da Interpol.'
why_in_novelo: É apontado pela Polícia Federal como peça do núcleo que teria monitorado e intimidado adversários
  de Daniel Vorcaro, e morreu sob custódia policial, em circunstâncias que a própria PF disse que apuraria.
cited_position:
- kind: denial
  summary: 'A família contesta o apelido atribuído pelos investigadores: ''trata-se de acusação gravíssima,
    sem apresentação pública, até o momento, de qualquer prova nesse sentido. Seus familiares jamais tiveram
    conhecimento de envolvimento em atos de violência e muito menos de homicídio''.'
