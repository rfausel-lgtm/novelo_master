open_questions:
- 'ATUALIZAÇÃO (lote 170): a leitura direta da representação da PF de 27/02/2026 relativiza, em parte,
  a alegação da família de que a acusação carecia de ''apresentação pública... de qualquer prova'' — a
  petição transcreve mensagens de WhatsApp atribuídas a ele nesse sentido. Continua sem resposta, porém,
  se essas mensagens foram objeto de perícia de autenticidade, e ele morreu antes de qualquer contraditório
  judicial sobre elas.'
- 'A causa da morte não está estabelecida no corpus: não há laudo do IML público nem conclusão do procedimento
  apuratório.'
- As imputações são da autoridade policial e não houve julgamento de mérito; ele morreu antes de qualquer
  defesa em juízo.
- O inquérito sobre sua morte foi conduzido pela própria instituição sob cuja custódia ela ocorreu e concluído
  sem que a família, até onde se apurou publicamente, tivesse acesso às imagens, aos autos ou ao laudo
  do IML — assimetria que o corpus registra.
- 'Não foi localizado registro de que tivesse sido policial ou profissional de segurança privada: os dados
  objetivos disponíveis sobre sua trajetória são cadastrais — empresário, sócio único de uma locadora
  de veículos desde 2020 e de uma imobiliária desde 2022, ambas em Belo Horizonte.'
