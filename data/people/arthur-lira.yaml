summary: 'Presidente da Câmara dos Deputados de 2021 a 2025. Nomeou Mariângela Fialek para a Chefia da
  Assessoria Especial do Gabinete da Presidência em março/2021 — cargo que ela manteve mesmo após a saída
  dele, sob a presidência de Hugo Motta, descrito pela imprensa como seu "afilhado político". Em
  depoimento de 13/02/2025 à PF, o deputado Glauber Braga (PSOL-RJ) o responsabilizou por concentrar o
  direcionamento de emendas parlamentares e citou Fialek como operadora ligada diretamente à Presidência —
  alegação de testemunha, sem prova documental equivalente à que embasou as buscas contra Fialek e
  Valdemar Costa Neto. Lira não é alvo formal da Operação Transparência até esta coleta.'
why_in_novelo: Ex-presidente da Câmara que nomeou Mariângela Fialek — a operadora central tanto do esquema
  de emendas ligado a Valdemar Costa Neto quanto da investigação de tráfico de influência sobre Cezinha de
  Madureira (lotes 314/316) — e é apontado por depoimento de parlamentar, não por prova documental, como
  articulador de um esquema mais amplo de desvio de emendas.
cited_position:
- kind: not_located
  summary: Manifestação pública dele sobre a acusação de Glauber Braga não localizada até esta coleta.
open_questions:
- 'A acusação de Glauber Braga (que o chama de "pai do orçamento secreto") é alegação de testemunha
  (classe A), datada de fevereiro/2025 — não há, até esta coleta, mandado, indiciamento ou prova
  documental equivalente contra ele nesta operação. Manter essa distinção em qualquer atualização futura.'
