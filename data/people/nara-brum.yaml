open_questions:
- Cargo de carreira exato (um resultado de busca falou em analista legislativo, não aberto; conferir no
  Portal da Transparência da Câmara). Divergência entre servidora (Itatiaia, O Liberal, CNN) e assessora
  (Poder360).
- A expressão do resumo entre aspas, atribuída à PF, não foi conferida no texto da decisão de Flávio Dino.
- Se responde a inquérito ou procedimento próprio, distinto do que atinge Fialek, não está esclarecido
  nas fontes lidas.
