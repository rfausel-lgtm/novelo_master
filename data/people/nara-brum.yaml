id: nara-brum
kind: person
name: Nara Brum
category: public_official
role: Servidora da Câmara dos Deputados; apontada pela PF como uma das executoras das indicações de emendas
  em nome de Valdemar Costa Neto (Operação Transparência)
summary: Servidora da Câmara dos Deputados apontada pela Polícia Federal, ao lado de Mariângela Fialek e
  de Garigham Amarante Pinto, como integrante do "arranjo funcional informal" que operacionalizava, dentro
  da Câmara, indicações de emendas parlamentares em nome de Valdemar Costa Neto (presidente do PL, sem
  mandato) — ao menos 21 emendas, R$ 119,2 milhões, dos quais cerca de R$ 104 milhões já pagos quando o
  ministro Flávio Dino determinou o bloqueio em 10/07/2026. A Itatiaia, O Liberal (Estadão Conteúdo) e
  a CNN Brasil, em 10/07/2026, a identificam como Nara Benedetti Nicolau Brum, servidora lotada na Liderança
  do PL na Câmara (a Itatiaia diz servidora efetiva); o Poder360 a descreve como assessora lotada na liderança
  do PL. O cargo de carreira exato não foi apurado em fonte oficial.
why_in_novelo: Apontada pela PF como uma das executoras das indicações de emendas em nome de Valdemar Costa Neto
  que levaram ao bloqueio de R$ 119,2 milhões — mesma base documental que já sustenta o verbete de Mariângela
  Fialek.
