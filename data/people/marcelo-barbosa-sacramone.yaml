name: Marcelo Barbosa Sacramone
category: lawyer
role: Advogado; ex-juiz titular da 2ª Vara de Falências e Recuperações Judiciais de São Paulo (2015-2021)
positions: []
summary: Advogado com doutorado em Direito Comercial pela USP, foi juiz titular da 2ª Vara de Falências,
  Recuperações Judiciais e Conflitos Empresariais da Comarca de São Paulo entre 2015 e 2021, quando fundou
  o escritório Sacramone, Orleans e Bragança Advogados, do qual é sócio-administrador ao lado de Gabriel
  José de Orleans e Bragança. O escritório recebeu R$ 6,4 milhões do Banco Master. A equipe NÃO localizou,
  e não afirma, qualquer vínculo entre Sacramone e processos judiciais específicos envolvendo o Master
  ou empresas ligadas a Vorcaro — o dado relevante aqui é apenas o perfil profissional (ex-magistrado
  especializado exatamente em falência e recuperação judicial, contratado por instituição financeira sob
  escrutínio regulatório crescente), não uma alegação de conflito de interesse concreto.
why_in_novelo: Integra a rede de escritórios pagos pelo Master com um perfil profissional particular —
  ex-magistrado de vara de falências —, sem que isso implique, por si só, qualquer irregularidade.
