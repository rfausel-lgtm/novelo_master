  Felipe Woyceichoski, no mesmo episódio de intimidação que atingiu também Woyceichoski e Leandro Garcia.
why_in_novelo: É testemunha direta do episódio de intimidação em massa (seis a sete homens) na Marina Bracuhy, corroborando
  a escala do grupo mobilizado contra Woyceichoski.
