role: Ex-deputado federal (PL-SP), mandato cassado; produtor-executivo do filme 'Dark Horse' segundo contrato
positions: []
summary: Filho de Jair Bolsonaro, teve o mandato de deputado federal cassado. Segundo contrato obtido
  pelo Intercept (datado de novembro de 2023, assinado digitalmente em 30/01/2024), consta como produtor-executivo
  de 'Dark Horse' ao lado de Mario Frias, com atribuições ligadas a financiamento e orçamento. Em publicação
  no Instagram (14/05/2026) disse ter apenas cedido direitos de imagem.
why_in_novelo: Consta como produtor-executivo, em contrato divulgado pela imprensa, do filme cujo financiamento
  por Daniel Vorcaro está sob investigação.
