role: Ex-chefe de cozinha de embarcação de Daniel Vorcaro; vítima de ameaça em Angra dos Reis (04/06/2024)
summary: Ex-chefe de cozinha ligado à embarcação de Daniel Vorcaro. Segundo a decisão de 13/05/2026, foi abordado
  e intimidado, ao lado de Luís Felipe Woyceichoski, no Hotel Nacional Inn em Angra dos Reis/RJ, em 04/06/2024,
  por grupo que incluía Luiz Phillipi Mourão e um homem identificado como "Manoel/Emanuel". Em procedimento formal
  de reconhecimento fotográfico (art. 226 do CPP, Resolução CNJ 484/2022), descreveu com precisão as características
  físicas do agressor e reconheceu, com alto grau de certeza, Manoel Mendes Rodrigues entre cinco fotografias.
why_in_novelo: É a vítima cujo reconhecimento fotográfico formal identificou Manoel Mendes Rodrigues como participante
  da ameaça de Angra dos Reis — o elemento probatório mais direto contra ele.
