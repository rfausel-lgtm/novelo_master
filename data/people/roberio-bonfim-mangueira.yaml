  summary: Quanto à cautelar do TCDF, o Poder360 informou não ter localizado telefone ou e-mail válido para ele;
    busca do Novelo em 15 e 16/10/2026 por nota de defesa ou manifestação nos autos não localizou posição. O
    prazo de 30 dias dado pelo TCDF tem termo inicial não informado (depende da intimação), em princípio ainda
    em curso.
