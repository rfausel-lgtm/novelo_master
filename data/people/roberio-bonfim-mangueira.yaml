summary: 'Superintendente de Operações Financeiras do BRB, cossignatário, ao lado de Paulo Henrique Costa
  e Dário Oswaldo Garcia Júnior, do Ofício PRESI-2025/051 (18/06/2025) — a primeira manifestação institucional
  própria do BRB sobre a aquisição de carteiras do Banco Master já lida diretamente pela equipe. O Ministério
  Público Federal o nomeia, no despacho que fundamenta o IPL 2025.0087917, como um dos responsáveis por
  entregar ao Banco Central a documentação hoje questionada. Investigado formal no INQ 5.026. Segundo o
  Metrópoles, o SBT News e o Congresso em Foco, é um dos cinco ex-dirigentes do BRB alcançados pela
  indisponibilidade cautelar de bens decretada pelo TCDF em 23/09/2026 (Decisão RES nº 361/2026, cautelar,
  sem julgamento de mérito; a nota oficial do tribunal não nomeia os atingidos).'
why_in_novelo: É apontado pelo MPF como um dos responsáveis, do lado do BRB, por entregar ao Banco Central
  a documentação sobre a aquisição de carteiras do Master hoje questionada.
cited_position:
- kind: version
  date: '2026-01-27'
  summary: 'Posição processual, não negativa de mérito. Segundo o Poder360 e a Agência Brasil, a PF cancelou/adiou o
    depoimento previsto para 27/01/2026 no inquérito do STF porque as defesas disseram não ter tido acesso ao
    conteúdo das investigações e, por isso, não responderiam aos questionamentos. Depoimento posterior: não
    localizado.'
  source_ids:
