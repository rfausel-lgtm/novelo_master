id: pedro-paulo-carvalho
kind: person
name: Pedro Paulo Carvalho
category: politician
role: Deputado federal; presidente do PSD no Rio de Janeiro
summary: Deputado federal e presidente do PSD-RJ. Segundo o documento comprobatório da PF (Pet 15.497), foi
  a pessoa a quem Gilberto Kassab telefonou em 01/10/2024, após ser acionado por interlocutores de Daniel
  Vorcaro (Augusto Lima e Fernando de Goes) para tentar conter a repercussão de um vídeo do deputado estadual
  Luiz Paulo crítico aos aportes da RioPrevidência no Banco Master. Segundo a CNN Brasil, afirma sempre ter
  feito oposição ao governo de Cláudio Castro e ter apoiado as denúncias de Luiz Paulo, dizendo ter informado
  Kassab "da gravidade das denúncias".
why_in_novelo: É o destinatário confirmado da ligação de Kassab na tentativa de conter a repercussão do
  vídeo do Dep. Luiz Paulo sobre a RioPrevidência — elo com posição pública própria na cadeia de pressão de
  outubro de 2024.
