summary: É a única acusada no PAS 19957.011252/2025-50, instaurado pela CVM para apurar supostas
  irregularidades na não elaboração das demonstrações financeiras anuais de 2024 e dos formulários de
  informações trimestrais do 1º e 2º trimestres de 2025 da REAG Investimentos S.A., da qual era diretora
  financeira, segundo a CVM. Em reunião de 23/06/2026, o Colegiado rejeitou, por unanimidade, a proposta de
  termo de compromisso que ela apresentou (oferta de R$ 150.000,00). A rejeição não é condenação, não é
  julgamento do mérito nem reconhecimento de culpa; o diretor Igor Muniz foi sorteado relator do processo, que
  não consta da pauta de 09/10/2026. A ata e a nota da CVM não reproduzem as razões da proponente, e nenhum
  pronunciamento público dela foi localizado.
why_in_novelo: Acusada em processo sancionador da CVM sobre a Reag Investimentos, teve sua proposta de termo
  de compromisso rejeitada pelo Colegiado em 23/06/2026.
