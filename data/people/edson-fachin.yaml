summary: Presidente do STF. Assinou a nota dos dez ministros de 12/02/2026 e promoveu a redistribuição
  do caso Master, sorteado para André Mendonça. Foi surpreendido, na manhã de 09/09/2026, pela decisão
  de Flávio Dino que reintegrou Andrei Rodrigues à PF — havia passado o dia anterior tentando uma solução
  própria via recurso da AGU, sem conhecimento de articulação paralela entre o governo e Dino (ver evidência
  correlata). Cancelou a sessão plenária de 09/09/2026 após a decisão de Dino. Não havia respondido, até
  a publicação da reportagem, aos ministros que o questionaram sobre se barraria a decisão.
why_in_novelo: Presidiu o STF quando o caso Master foi redistribuído de Dias Toffoli para André Mendonça.
cited_position:
- kind: version
  summary: Em discurso no Palácio do Planalto, em 04/09/2026, afirmou que haveria resposta 'firme' sobre
    a situação de Moraes — segundo a Poder360, na prática, os prazos que fixou posteriormente empurraram
    qualquer decisão do plenário para depois de 22/09/2026, data posterior ao 1º turno da eleição (04/10)
    e possivelmente ao 2º turno (25/10).
  source_ids:
  - src-poder360-2026-09-06-planalto-supremo-negociam-preservar-moraes-eleicao
  date: '2026-09-04'
open_questions:
- A decisão de Flávio Dino de 09/09/2026 (Pet 16.669) invoca a Pet 16.704, de sua autoria, como fundamento
  para afirmar que a matéria do afastamento de Andrei Rodrigues já estaria afetada ao Plenário — não localizada,
  até a data desta apuração, manifestação direta de Fachin sobre essa leitura específica dada por Dino
  ao alcance da Pet 16.704.
- Segundo apuração da Poder360 (09/09/2026), Fachin estaria cedendo à estratégia do Planalto e do grupo
  Gilmar Mendes-Dino-Moraes de não decidir nada sobre a crise até depois do período eleitoral — avaliação
  da própria reportagem, não confirmada por manifestação direta dele nem por fonte independente até a
  data desta apuração; permanece registrada como leitura jornalística, não fato estabelecido.
- 'Em 09/09/2026 revogou a designação de Alexandre de Moraes como relator do Inquérito 4.781 e assumiu
  pessoalmente sua condução, invocando o art. 43 do regimento interno e o entendimento do Plenário na
  ADPF 572. É o terceiro ato seu, em uma semana, sobre o mesmo eixo: em 03/09 abriu procedimento, em 04/09
  separou do inquérito das fake news o pedido de Moraes contra Mendonça e o avocou, e em 09/09 retirou
  a relatoria. Anunciou que remeterá os autos à autoridade policial e à Procuradoria-Geral da República
  para denúncia ou arquivamento, o que encaminha a um desfecho procedimento aberto desde março de 2019.
  Pendente: obter a íntegra da decisão, que a equipe conhece apenas por cobertura jornalística.'
- 'Praticou três atos no mesmo 09/09/2026: suspendeu simultaneamente as decisões de Mendonça e de Dino
  sobre o comando da Polícia Federal, retirou de Moraes a relatoria do Inquérito 4.781 e convocou sessão
  extraordinária do Plenário para 15/09, às 10h. O efeito combinado é retirar dos gabinetes individuais
  as três frentes em que a disputa vinha sendo travada por decisão monocrática. Pendente: obter as íntegras,
  hoje conhecidas apenas por cobertura jornalística, e estabelecer se a sessão de 15/09 tem um item ou
  dois.'
- 'A íntegra da decisão de 09/09 mostra alcance maior do que a cobertura registrou: o quarto item do dispositivo
  suspende ''todo e qualquer procedimento que verse sobre potencial investigação em face de integrantes
  deste Supremo Tribunal Federal'', que passam a ser previamente remetidos à Presidência, e a decisão
  ainda suspende o procedimento de controle externo da atividade policial instaurado pela Procuradoria-Geral
  da República e reserva à Presidência poder de supervisão sobre feitos já distribuídos. Reconhece que
  suspender decisão de ministro é providência ''absolutamente excepcional'', citando como únicos precedentes
  as SL 1.395/SP, de 2020, e SL 1.188/DF, de 2018.'
- 'Quarto ato na mesma linha em oito dias: em 10/09/2026, na própria PET 16.704, determinou a Mendonça a
  remessa em HD de todos os procedimentos da PET 15.556 (a petição-mãe do caso Master) a todos os gabinetes
  do STF, e o levantamento do sigilo dela, ressalvadas diligências pendentes cujo sigilo seja imprescindível.
  A equipe obteve e leu a íntegra do despacho (lote 168): uma página, assinatura digital verificável. Antecede
  em cinco dias a sessão de 15/09. Mendonça anunciou cumprimento no mesmo dia, mas a checagem direta da equipe
  no portal do STF, às 23h53 de 10/09/2026, mostrou a PET 15.556 ainda com a etiqueta ''Sigiloso'' (lote 169)
  — discrepância entre o anunciado e o status público ao vivo, não reconciliada.'
- 'NOVO: em 09/09/2026, um dia antes do despacho de levantamento do sigilo, o PT peticionou diretamente
  a André Mendonça (não a Fachin) pedindo o mesmo levantamento do sigilo da PET 15.556 e de oito feitos
  conexos, invocando paridade de armas eleitoral e o precedente da Operação Spoofing. Não está estabelecido
  se essa petição influenciou o despacho de Fachin, que correu por procedimento distinto (PET 16.704) já
  aberto por ele seis dias antes — mas ambos convergiram no mesmo resultado em 48 horas.'
