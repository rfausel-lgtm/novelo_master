name: Ângelo Rezende
category: lawyer
role: Advogado do senador Jaques Wagner, apontado pela imprensa como sócio indireto da PKL One Participações
positions: []
summary: 'Advogado que atua para o senador Jaques Wagner, apontado por reportagem do UOL (replicada de
  forma mutuamente consistente por quatro veículos regionais) como sócio indireto — via uma cadeia detalhada
  de fundos de investimento — da PKL One Participações. A cadeia descrita: PKL One → Diamond FIP–Multiestratégia
  (ex-''Reag34'') → controlado por Gardênia (~50%) e Fortress (~50%) → Gardênia tem entre seus cotistas
  o fundo MMPG, de cotista único, apontado como pertencente a Rezende → Fortress é controlado pela offshore
  WNT Master Fortress (Bahamas), já ligada no corpus a Valério Marega Júnior. Dados públicos de CVM confirmam
  a existência e a contagem de cotistas de cada fundo (estrutura corroborada), mas não a identidade nominal
  dos cotistas — a identificação de Rezende permanece classe A. O UOL contatou Wagner, Augusto Lima, Rezende
  e Guilherme Sodré para comentário; nenhum respondeu até a publicação. Há dúvida adicional, não resolvida:
  buscas independentes da equipe apontaram outros nomes (Pablo Domingues e Pablo Rodrigues) como os advogados
  constituídos no pedido de anulação da 9ª fase perante o STF — não está confirmado se Rezende atua formalmente
  nos autos, em outra frente da defesa, ou se há imprecisão nas fontes consultadas.'
why_in_novelo: É apontado pela imprensa como o advogado de Jaques Wagner com participação societária indireta
  na mesma sociedade (PKL One) que o corpus já liga ao núcleo financeiro de Augusto Lima — uma potencial
  sobreposição de interesse entre a defesa do senador e a estrutura societária sob investigação.
