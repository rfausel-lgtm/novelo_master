open_questions:
- A identidade nominal do cotista único do fundo MMPG (apontado pelo UOL como Ângelo Rezende) não foi
  confirmada por registro público — dados de CVM (via agregador) confirmam a existência do fundo e a contagem
  de cotistas, mas não revelam nomes.
- Não confirmado se atua formalmente como advogado constituído de Jaques Wagner nos autos do STF — buscas
  independentes apontaram Pablo Domingues e Pablo Rodrigues como advogados no pedido de anulação da 9ª
  fase; pode atuar em outra frente da defesa, ou haver imprecisão nas fontes.
- Nenhuma manifestação pública dele localizada além do silêncio registrado à reportagem do UOL.
