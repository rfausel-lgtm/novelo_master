open_questions:
- O corpus não tem manifestação formal da Polícia Federal sobre as alegações.
- Não há decisão do relator sobre os pedidos de prisão e de afastamento apresentados pelo Partido Novo.
  A PGR já se manifestou pelo arquivamento da apuração sobre as alegações de 'graves intimidações' de
  Vorcaro que embasaram esses pedidos, por ausência de provas.
- O atrito com Mendonça teve origem em fevereiro de 2026, na restrição de acesso aos dados da Compliance
  Zero, e escalou com determinações na condução da Operação Sem Desconto (remessa de documentação ao gabinete
  do relator, notificação prévia para troca de policiais). A PF recorreu à AGU, que optou por diálogo
  em vez de embate jurídico direto. Sem resolução até setembro de 2026.
- Não há manifestação pública dele sobre o mérito das menções no relatório — apenas resposta institucional
  da PF sobre o custeio da viagem, uma declaração genérica anterior à divulgação, e relatos de interlocutores.
  Procurado por veículos em fevereiro, abril e setembro de 2026, não respondeu. O corpus registra a lacuna
  e a mantém aberta a direito de resposta.
- O prazo de cinco dias úteis da Petição 16.704, aberta por Fachin em 03/09/2026, vence por volta de 10/09/2026
  — posterior à data desta atualização. A resposta dele não é conhecida.
- O relatório não esclarece qual 'Ministro' teria feito o convite a ele em 03/04/2024, nem a identidade
  do contato 'Marcio Conjur' e do interlocutor não identificado que propôs o convite.
- Os pedidos do partido Novo de afastamento cautelar (02/09/2026) e de prisão preventiva (03/09/2026)
  seguem sem decisão do relator. O arquivamento das alegações de intimidação é apenas parecer da PGR,
  sem homologação. E a resposta da corporação às acusações veio apenas por interlocutores, sem nota institucional
  assinada.
- Nenhuma fonte localizada registra manifestação pública de Andrei Rodrigues sobre seu próprio afastamento,
  nem nota formal da PF, da Fenapef ou dos 27 superintendentes regionais reagindo a este episódio específico
  (distinto da manifestação de agosto/2026 já registrada).
- Resultado do referendo pendente na 2ª Turma (vista de Gilmar Mendes) e do recurso da AGU não localizados
  até a data desta apuração.
- A leitura integral da decisão de Mendonça (08/09/2026) confirma que o fundamento do afastamento foi
  o monitoramento ilícito de Mendonça e do AGU pela PF — não as alegações de corrupção do Partido Novo
  baseadas no depoimento de Vorcaro, que Mendonça reservou expressamente para apuração posterior, sem
  se pronunciar sobre elas nesta decisão.
- Sua namorada, a jornalista Renata Varandas, fez lobby formal e registrado (e-Agendas) para a Ambipar
  — empresa investigada na própria Compliance Zero — em quatro reuniões federais ao longo de 2026. Nenhuma
  fonte disponível atribui a ele qualquer ação ou omissão decorrente dessa relação; nenhuma das partes
  (Ambipar, Renata, Andrei) respondeu à reportagem que revelou o caso.
- A banca em que sua namorada, Renata Varandas, é sócia (Figueiredo & Velloso) é a mesma que defendeu
  Augusto Lima, um dos dois investigados centrais da Compliance Zero, até agosto de 2026 — segunda sobreposição
  de interesse potencial identificada, além do lobby para a Ambipar.
- 'Detalhado o dia do afastamento (08/09/2026): a 2ª Turma formou maioria de 3 a 0 (Mendonça, Fux, Nunes
  Marques) antes de Gilmar Mendes pedir vista às 10h05, com prazo regimental de até 90 dias para devolvê-la;
  a AGU anunciou recurso por violação de competência presidencial, sem confirmação de protocolo nem do
  dispositivo legal exato invocado; onze diretores da PF e a APCF (peritos) se manifestaram em apoio/pedindo
  julgamento pelo plenário; superintendentes regionais debatem, sem decisão, entrega coletiva de cargos.
  Verificação direta do site da Fenapef em 08/09/2026 não encontrou nenhuma nota sobre o episódio.'
- Reintegrado em 09/09/2026 por decisão do ministro Flávio Dino (Pet 16.669), que considerou ilegítimo
  o pedido do Partido Novo e usurpada a competência do Plenário — decisão lida integralmente pela equipe,
  com tensões processuais próprias registradas em evidência correlata. A decisão de Dino ressalva que
  se submete exclusivamente ao Plenário; desfecho final não confirmado até a data desta apuração.
- Foi indicado à Direção-Geral da PF por Flávio Dino (então futuro ministro da Justiça), em coletiva ao
  lado de Lula em dezembro de 2022, com posse em janeiro de 2023 — mesmo Dino que, em 09/09/2026, determinou
  sua reintegração ao cargo após o afastamento decidido por Mendonça.
- 'Ficou no centro do choque entre gabinetes: afastado por Mendonça em 08/09/2026, reintegrado por Dino
  em 09/09 e, no mesmo dia, alcançado pela decisão de Fachin que suspendeu os dois atos. As coberturas
  divergem sobre sua situação imediata — parte afirma que permanece no cargo até a sessão de 15/09, parte
  registra que foi intimado a prestar informações em 48 horas, cabendo à Presidência decidir depois. A
  divergência segue aberta.'
