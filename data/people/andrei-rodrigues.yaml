summary: 'Diretor-Geral da Polícia Federal. Gaúcho de Pelotas/RS, formado em Direito (1997), com mestrado
  em Alta Gestão em Segurança Internacional pela Universidad Carlos III de Madri (2020). Delegado de carreira
  há quase 20 anos: coordenou a segurança de Dilma Rousseff (2010 e 2013-2017), chefiou a Secretaria Extraordinária
  de Segurança de Grandes Eventos (Copa 2014, Olimpíadas Rio 2016) e depois a Divisão de Relações Internacionais
  da PF, e coordenou a segurança de Lula na campanha de 2022. Assumiu a Direção-Geral no início do terceiro
  mandato de Lula, por indicação de Flávio Dino. O relatório da PF sobre o celular de Vorcaro contém seção
  de pesquisa pelos termos ''Andrei Passos'' e identifica notas e mensagens do banqueiro que ''podem indicar''
  referência ao diretor-geral, inclusive sobre convite a evento em Londres; o relatório não conclui pela
  prática de crime. Em agosto de 2026, em meio a atrito com o ministro André Mendonça sobre determinações
  na ''Operação Sem Desconto'', os 27 superintendentes regionais da PF divulgaram nota em defesa de sua
  autonomia administrativa, e Rodrigues declarou publicamente que a corporação trabalha ''sem proteger
  ou perseguir''. É um dos quatro chamados por Fachin, em 03/09/2026, a apresentar explicações por escrito
  em cinco dias úteis. A leitura da íntegra do relatório da PF pela equipe acrescenta o elemento mais
  favorável a ele no documento: não há contato salvo com seu nome no celular de Vorcaro, nem uma única
  mensagem trocada entre os dois — todas as menções são de terceiros, e o relatório usa o condicional
  (''podem indicar''). O mesmo documento, porém, transcreve a trilha do convite ao fórum de Londres de
  abril de 2024, incluindo pergunta atribuída a sua assistente sobre quem cobriria hospedagem e passagem,
  respondida com ''todas as despesas bancadas por nós''. A PF confirmou por LAI que o organizador custeou
  diretamente as despesas. Ele permanece no cargo e não há inquérito, indiciamento ou denúncia contra
  ele. Em 03/09/2026 foi intimado a prestar informações na PET 16.704, aberta de ofício pela Presidência
  do STF, cujo objeto inclui as medidas de controle externo da atividade policial e eventuais indícios
  de revelação de informação sob sigilo judicial a pessoa investigada. ATUALIZAÇÃO DE 08/09/2026: foi
  afastado cautelarmente por 90 dias por decisão de André Mendonça na Pet 16.662, sob alegação de monitoramento
  ilícito do próprio ministro pela PF durante mais de 30 dias — concessão, cinco dias depois, de pedido
  que o partido Novo já havia protocolado em 03/09/2026. A decisão está pendente de referendo definitivo
  da 2ª Turma (Gilmar Mendes pediu vista) e é contestada pela AGU por suposta violação de competência
  presidencial (Lei 9.266/1996) — o governo orientou cumprimento enquanto recorre. William Marcel Murad
  assumiu interinamente. Nenhuma das fontes consultadas registra manifestação direta de Andrei Rodrigues
  sobre seu próprio afastamento.'
why_in_novelo: É mencionado em relatório da Polícia Federal sobre o celular de Daniel Vorcaro e dirige
  o órgão que conduz a Operação Compliance Zero.
cited_position:
- kind: denial
  summary: Interlocutores do diretor-geral afirmam que ele jamais teve relação com Daniel Vorcaro e que
    os dois se encontraram uma única vez, casualmente, em Londres, em seminário jurídico do grupo Voto
    patrocinado pelo Banco Master.
