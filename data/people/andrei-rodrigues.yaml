  summary: Segundo resposta da PF a pedido de acesso à informação, 'não foram pagas diárias ao servidor'
    e 'o organizador do evento custeou diretamente as respectivas despesas extraordinárias'; ele 'não
    recebeu remuneração, cachê, honorário, ajuda de custo ou qualquer outro benefício dos organizadores'.
    A corporação declarou desconhecer os valores aplicados pelos entes privados.
