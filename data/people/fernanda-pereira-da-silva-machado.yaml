name: Fernanda Pereira da Silva Machado
category: public_official
role: Advogada; ex-gerente de controle interno do Rioprevidência e ex-presidente do Itaprevi
positions:
- title: Presidente
  organization_id: itaprevi-itaguai
  source_ids:
