summary: Assinou, como gerente, o atestado de credenciamento do Banco Master no Rioprevidência em 19/10/2023.
  Deixou o fundo estadual em 10/06/2024 e foi nomeada presidente do regime próprio de Itaguaí em 12/06/2024
  — dois dias depois. Naquele mesmo mês começaram as aplicações do Itaprevi em letras financeiras do banco,
  que somaram R$ 59,6 milhões. O Tribunal de Contas do Estado do Rio de Janeiro a notificou por atos relativos
  à abertura de conta no banco e à resolução que, com efeitos retroativos, retirou do regimento do comitê
  as restrições que impediriam o credenciamento e o aporte. Segundo reportagem, a Polícia Federal lhe
  atribui ter assinado atestado de credenciamento fraudulento — imputação relativa ao Rioprevidência,
  não ao Itaprevi. O Termo de Análise e Atestado de Credenciamento nº 001/2024 do Itaprevi tem data de
  16/01/2024 (documento do acervo), anterior à nomeação dela, em 12/06/2024; isso é compatível com a parte da
  versão dela segundo a qual o credenciamento antecedeu a posse e não afasta a notificação do TCE-RJ sobre a
  abertura de conta e a resolução com efeitos retroativos. Não é ré nem denunciada.
why_in_novelo: 'É o vetor humano documentado entre dois regimes próprios: assinou o credenciamento do
  banco em um fundo e passou a dirigir outro, onde as aplicações começaram no mês de sua posse.'
cited_position:
- kind: alternative_explanation
  date: '2026-01-27'
  summary: Segundo a reportagem (InfoMoney/Agência O Globo, 27/01/2026; data e meio do contato não informados),
    procurada, respondeu por nota que as aplicações do Itaprevi no Master não decorreram de decisão pessoal,
    discricionária ou direcionada; que o banco apresentou a melhor proposta em duas ocasiões; que não alterou a
    política de investimentos, que, diz, já previa expressamente alocação de 2% a 20% em letras financeiras; que é
    inverídica a afirmação de que relatórios da consultoria se opunham a esse tipo de papel; e que o credenciamento
    do Master no Itaprevi ocorreu antes de sua posse, por gestão anterior. Na mesma matéria, o atual presidente do
    Itaprevi sustenta o contrário quanto ao teto de letras financeiras e ao aviso da consultoria; as duas versões
    convivem e nenhuma é tomada como fato.
