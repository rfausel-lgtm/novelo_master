id: felipe-cancado-vorcaro
kind: person
name: Felipe Cançado Vorcaro
category: businessperson
role: Primo de Daniel Vorcaro; apontado pela PF como operador financeiro; condenado pela CVM por fraude
  no Brazil Realty FII
summary: Teve prisão temporária de cinco dias decretada pelo STF em 07/05/2026 (Pet 15873). Segundo a
  PF, integraria o núcleo financeiro-operacional do grupo investigado. É primo de Daniel Vorcaro e responsável
  pela MGI Desenvolvimento Imobiliário. Condenado pela CVM em 08/09/2026, no PAS 19957.007976/2020-94,
  a R$ 5 milhões de multa por operação fraudulenta na 3ª emissão do Brazil Realty FII — a MGI teve suas
  quotas sobreavaliadas em cerca de R$ 56 milhões, servindo de base à integralização de cotas do fundo
  pela Milo Investimentos. Em defesa apresentada individualmente em 13/10/2025, sustentou nunca ter sido
  sócio ou administrador da Milo ou de qualquer contraparte das operações, e que nem ele nem a MGI se
  enquadrariam na definição subjetiva de sujeito passível de responsabilização pela norma invocada —
  argumento rejeitado pelo colegiado, que o condenou mesmo assim. Reportagem da Folha de 07/03/2026, baseada
  em documentos da PF, já o nomeava como um dos destinatários do mecanismo de desvio de recursos do Master
  via CDBs e fundos cativos, ao lado do tio Henrique e da prima Natália.
why_in_novelo: Teve prisão temporária decretada pelo STF em fase da Operação Compliance Zero, sendo apontado
  pela Polícia Federal como operador financeiro de Daniel Vorcaro — e é um dos parentes dele condenados
  pela CVM no processo do Brazil Realty FII, ao lado do pai, Henrique Vorcaro, evidenciando o padrão familiar
  de participação nos veículos societários envolvidos na fraude.
