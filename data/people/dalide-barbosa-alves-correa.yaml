open_questions:
- 'Nenhum documento público liga o CNPJ da sociedade ativa a um pagamento específico do Banco Master: a identificação
  da pessoa jurídica que recebeu os valores se dá por convergência entre o registro da Receita Federal e o levantamento
  do ND Mais, que a nomeia por extenso.'
- O que significa, nos diálogos entre os executivos do Master, a expressão 'canal direto com o STF' — as reportagens
  registram que os próprios diálogos não explicam e que nenhum ministro é nomeado no trecho.
- 'Quais serviços jurídicos concretos correspondem aos valores: as publicações do DJEN em nome dela e do sócio não
  registram processo com o Banco Master como parte, o que é compatível tanto com atuação em nome de empresas cedentes
  quanto com serviços não contenciosos. O teste definitivo depende da lista das empresas que venderam créditos ao
  banco.'
- 'Em que pessoa jurídica do Grupo Monte Sião está o vínculo societário que a imprensa regional lhe atribui: o quadro
  societário da Agropecuária Monte Sião, no registro público, não a inclui.'
