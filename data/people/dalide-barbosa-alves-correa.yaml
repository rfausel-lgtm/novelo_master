summary: 'Advogada de Brasília cujo escritório, a Alves Corrêa & Veríssimo Advocacia, recebeu R$ 33 milhões do Banco
  Master em 2024, segundo documentos da auditoria interna do BRB apreendidos pela Polícia Federal e revelados pelo
  Estadão em 17/09/2026. Em diálogos entre executivos do banco, o pagamento é ordenado sob o argumento de que ela
  seria ''canal direto com o STF'' — expressão que os próprios diálogos não explicam e que não vem acompanhada do
  nome de nenhum ministro. Ela nega: afirma jamais ter atuado para o Master no Supremo nem procurado ministros,
  e diz que sua atuação se restringiu a processos de primeira e segunda instâncias em favor de empresas que venderam
  créditos ao banco. Na trajetória pública anterior, foi diretora jurídica nacional da Caixa Econômica Federal,
  procuradora-geral da ANAC e diretora-geral do IDP, instituição fundada por Gilmar Mendes, de onde saiu em 2017
  após divergências sobre a gestão. No Tocantins, é apontada pela imprensa regional como sócia do Grupo Monte Sião
  e filiada ao Agir, com domicílio eleitoral em Porto Nacional.'
why_in_novelo: É a advogada cujo escritório aparece, em documentos de auditoria apreendidos pela PF, recebendo R$
  33 milhões do Banco Master em um único ano sob a justificativa de ser 'canal direto com o STF'.
