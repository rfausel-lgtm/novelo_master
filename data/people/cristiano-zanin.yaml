summary: Ministro do STF. Relator do MS 40791 após a suspeição de Toffoli; em 12/03/2026 rejeitou o pedido
  de instalação da CPI do Banco Master na Câmara.
why_in_novelo: Decidiu, no STF, o mandado de segurança que pedia a instalação da CPI do Banco Master na
  Câmara dos Deputados.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- Segundo apuração da Poder360 (06/09 e 09/09/2026), integra, com outros ministros, um grupo que articula
  preservar Alexandre de Moraes das suspeitas envolvendo Vorcaro e que deseja retirar a relatoria do caso
  Banco Master de André Mendonça — leitura da reportagem, sem corroboração jornalística independente localizada
  até a data desta apuração.
- 'Em ofícios de 11/09/2026 (nº 13 e 14/2026-GMCZ), pediu a Fachin que a cópia dos dados do celular de Vorcaro,
  mantida lacrada no gabinete de Mendonça desde março, fosse compartilhada com todos os ministros antes do
  julgamento de 15/09 — ato formal, em processo público, distinto da articulação de bastidores descrita pela
  Poder360 acima; não se pronuncia sobre proteger ou não Moraes, apenas sobre paridade de acesso probatório
  entre os julgadores.'
- 'NOVO (13/09/2026): escalou o pedido para determinação formal, com prazo de 23h de domingo (48h antes da
  sessão), para que a PF entregasse a cópia ao seu gabinete — argumentando que "não existe hierarquia entre
  os ministros do STF". Não verificado se o prazo foi cumprido.'
