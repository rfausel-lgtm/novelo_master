summary: Governador do Amapá desde janeiro de 2023, eleito em 2022 pelo Solidariedade. Assinou o Decreto
  nº 0028, de 02/01/2023, que nomeou Jocildo Silva Lemos diretor-presidente da Amapá Previdência, e, no
  mesmo lote de decretos do primeiro dia de governo, os Decretos nº 0018 e nº 0019, que nomearam Alberto
  Samuel Alcolumbre Tobelem para o Colégio e para a presidência da Junta Comercial do Estado. Em 11/02/2026
  assinou a exoneração de Lemos, a pedido. Pela Lei estadual 0915/2005, a escolha da diretoria da Amprev
  é ato de livre nomeação do governador — o que torna a posição dele o elo institucional necessário em
  qualquer hipótese de indicação externa.
why_in_novelo: É o titular exclusivo do poder de nomear a direção da Amapá Previdência, autoridade que
  assinou tanto a nomeação quanto a exoneração do dirigente investigado.
