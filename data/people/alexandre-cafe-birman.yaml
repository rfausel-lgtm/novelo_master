  summary: Manifestação não localizada até esta coleta.
why_in_novelo: Vendeu um imóvel de R$ 50 milhões à Super Empreendimentos e Participações, empresa ligada a
  Daniel Vorcaro e administrada por Fabiano Zettel, numa transação sinalizada ao COAF por discrepância de
  valor fiscal.
open_questions:
- Não há no acervo confirmação do vínculo formal dele com o grupo Arezzo (fundador, sócio ou familiar de
  fundador) — associação feita por reconhecimento do nome, a confirmar com fonte própria.
- Nenhuma alegação de irregularidade recai sobre ele especificamente; a comunicação ao COAF decorre da
  diferença entre valor declarado e avaliação fiscal, prática comum em transações imobiliárias de alto
  valor.
