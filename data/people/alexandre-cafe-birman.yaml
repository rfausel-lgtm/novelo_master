name: Alexandre Café Birman
category: businessperson
role: Empresário (grupo Arezzo); vendeu imóvel de R$ 50 milhões à Super Empreendimentos e Participações
summary: 'Empresário do setor calçadista, ligado ao grupo Arezzo. O RIF nº 140515 do COAF (fev/2026, anexo
  à Pet 15.645/DF) registra escritura de 10/05/2024, lavrada em São Paulo/SP, na qual vendeu um imóvel à
  Super Empreendimentos e Participações S.A. (já no acervo, ligada a Daniel Vorcaro e administrada por
  Fabiano Zettel) por R$ 50 milhões — valor superior a 100% da avaliação fiscal, o que motivou a comunicação
  ao COAF pelo tabelião nos termos do Provimento CN nº 149/2023 do CNJ. Não há, no relatório, qualquer
  outra menção a ele nem alegação de irregularidade de sua parte — a comunicação decorre exclusivamente do
  descompasso entre valor declarado e avaliação fiscal, prática rotineiramente sinalizada em transações
  imobiliárias.'
cited_position:
