id: garigham-amarante-pinto
kind: person
name: Garigham Amarante Pinto
category: public_official
role: Servidor da Câmara dos Deputados; apontado pela PF como um dos executores das indicações de emendas
  em nome de Valdemar Costa Neto (Operação Transparência)
summary: Servidor da Câmara dos Deputados apontado pela Polícia Federal, ao lado de Mariângela Fialek e
  de Nara Brum, como integrante do "arranjo funcional informal" que operacionalizava, dentro da Câmara,
  indicações de emendas parlamentares em nome de Valdemar Costa Neto (presidente do PL, sem mandato) —
  ao menos 21 emendas, R$ 119,2 milhões, dos quais cerca de R$ 104 milhões já pagos quando o ministro
  Flávio Dino determinou o bloqueio em 10/07/2026. Reportagens de 10/07/2026 (Metrópoles; Bahia Notícias,
  citando O Globo) o descrevem como advogado, ex-diretor do Fundo Nacional de Desenvolvimento da Educação
  (FNDE) no governo de Jair Bolsonaro e ocupante de cargo de natureza especial na Câmara dos Deputados;
  o cargo e a lotação exatos não foram conferidos em fonte oficial.
why_in_novelo: Apontado pela PF como um dos executores das indicações de emendas em nome de Valdemar Costa Neto
  que levaram ao bloqueio de R$ 119,2 milhões — mesma base documental que já sustenta o verbete de Mariângela
  Fialek.
