open_questions:
- Propôs a Fachin, em setembro de 2026, a retirada dos delegados da PF cedidos ao STF, sob justificativa
  de risco de influência sobre os ministros investigados; proposta ainda não deliberada.
- 'CONFIRMADO POR FONTE PRIMÁRIA (lote 215): o texto integral do voto de vista de 08/09/2026 (sobre o
  afastamento de Andrei Rodrigues) foi lido diretamente do portal do STF. Além da tese de vício de
  legitimidade ativa (partido político, art. 282 §2º CPP, art. 230-B RISTF) e da citação à ADPF 1.017/AL já
  conhecidas via transcrição na decisão de Flávio Dino (Pet 16.669), o voto original traz uma leitura de
  Gilmar sobre a própria decisão de Mendonça: que ela ''sugere'' que o relatório de inteligência foi
  produzido ''por provocação de membro da Primeira Turma'' — expressão que não é citação literal da decisão
  de Mendonça (conferido), e que, sem nomear ninguém, é compatível com referência indireta a Alexandre de
  Moraes, único ministro da Primeira Turma citado alhures nessa cadeia de atribuição.'
- 'Segundo apuração da Poder360 (06/09 e 09/09/2026), integra, com outros ministros, um grupo que articula
  preservar Alexandre de Moraes das suspeitas envolvendo Vorcaro e que deseja retirar a relatoria do caso
  Banco Master de André Mendonça — leitura da reportagem, sem corroboração jornalística independente localizada
  até a data desta apuração. NOTA (13/09/2026): em 12/09/2026, a relatoria da Pet 16.662 foi de fato retirada
  de Mendonça, mas por ato formal de Fachin fundado em possível suspeição (art. 144, IV, CPC) — não há
  indício de que essa substituição tenha decorrido da articulação política relatada pela Poder360; são
  eventos convergentes no resultado, mas de fundamentação distinta e não confirmada como relacionada.'
- 'Em ofício nº 005/MGM de 11/09/2026, aderiu ao pedido de Zanin de que a cópia dos dados do celular de Vorcaro,
  lacrada no gabinete de Mendonça desde março, fosse compartilhada com todos os ministros antes do julgamento
  de 15/09, falando em "acesso assimétrico" que compromete a "paridade entre os integrantes da Corte".'
- 'NOVO (13/09/2026): no mesmo 11/09/2026, publicamente questionou se a Pet 16.662 estava pronta para
  julgamento: "A rigor, na Pet 16.662, não há nem sequer pedido a ser decidido." Apontou indefinição sobre
  quem é investigado, o objeto da apuração e o rito a seguir, e propôs que Fachin primeiro reunisse os
  procedimentos correlatos e assumisse a coordenação, em vez de levar o caso ao Plenário no estado em que
  se encontrava.'
- 'CORRIGIDO (15/09/2026): em 11/09/2026 (mesmo dia da entrevista já registrada acima), formalizou em ofício
  a Fachin o pedido de adiamento do julgamento e de reunião dos processos de Moraes e Mendonça sob a
  relatoria do próprio Fachin; alternativamente, que ele mesmo apresentasse o caso ao plenário, com as
  preliminares (inclusive o pedido de nulidade da PGR) examinadas antes do mérito. Fachin respondeu no dia
  seguinte, 12/09/2026: indeferiu a reunião, manteve a sessão de 15/09 exclusiva à Pet 16.662, e remeteu a
  Pet 16.704 (caso Mendonça) para 23/09 — despacho já publicado no acervo antes deste item ter sido
  registrado.'
