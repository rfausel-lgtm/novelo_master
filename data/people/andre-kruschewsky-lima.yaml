open_questions:
- 'Data de saída da diretoria: nenhum documento lido a registra; o intervalo mar/2023–ago/2024 vem de reportagem
  e o início diverge dos 13/02/2023 da Receita.'
- O parentesco com Eugênio de Souza Kruschewsky é afirmado por três veículos, sem documento de filiação; o com Matheus
  Kruschewsky Silva é inferência.
- Segundo o Metrópoles (24/08/2026), recebeu R$ 22 milhões em salários e honorários em 2023–2024 e visitou gabinetes
  da Câmara com Augusto Lima; não conferido pela equipe.
