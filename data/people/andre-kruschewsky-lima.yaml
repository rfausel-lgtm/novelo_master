name: André Kruschewsky Lima
category: executive
role: Diretor jurídico do Banco Master (mar/2023–ago/2024), segundo reportagem
positions: []
summary: Assina digitalmente, em 08/04/2024, o termo de credenciamento do Banco Master na Alagoas Previdência,
  na condição de representante legal da instituição interessada no credenciamento, ao lado de Alberto
  Felix de Oliveira Neto. O corpus não apurou seu cargo formal no banco. Segundo reportagem que afirma
  ter obtido relatório da PF citado em decisão do ministro André Mendonça, exerceu o cargo de diretor
  jurídico do Banco Master entre março de 2023 e agosto de 2024, e é situado no contexto da emenda nº
  11 à PEC 65/2023, sobre ampliação da cobertura do FGC. A mesma reportagem atribui a ele a contratação
  do escritório de seu primo, Eugênio de Souza Kruschewsky — atribuição não confirmada pela equipe em
  documento primário.
why_in_novelo: Um dos dois signatários, pelo banco, do termo de credenciamento cujo texto a auditoria
  federal descreve como replicado em vários regimes próprios.
