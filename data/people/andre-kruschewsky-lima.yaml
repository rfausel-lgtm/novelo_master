summary: Advogado. Foi procurador do Banco Master de 23/02/2022 a 13/02/2023, segundo a Junta Comercial do Rio de
  Janeiro, e consta como diretor desde 13/02/2023 nos dados da Receita Federal, mesma data de Augusto Lima. Documentos
  de 2024 juntados aos autos do TJAP — relatório de visita da Amprev, apresentação institucional e questionário
  de due diligence do banco — o identificam como diretor jurídico, a quem se reportava o compliance. Assinou em
  08/04/2024, como representante legal do Master, o termo de credenciamento na Alagoas Previdência, e, segundo a
  PF citada na decisão da Pet 15.873, enviou a Vorcaro o texto da emenda do FGC. Segundo a representação da PF da
  9ª fase, que registra que ele "foi diretor jurídico", falou com Daniel Lopes Monteiro em 21/11/2025 e lhe repassou
  o telefone de Guilherme Sodré. Segundo relatório da PF noticiado pelo Estado de Minas, ofereceu ajuda a Vorcaro
  para "tirar de pauta" o caso Alcídia no STF. Três veículos o apontam como primo de Eugênio Kruschewsky, cujo escritório
  recebeu R$ 54 milhões do Master.
why_in_novelo: Um dos dois signatários, pelo banco, do termo de credenciamento cujo texto a auditoria federal descreve
  como replicado em vários regimes próprios.
cited_position:
