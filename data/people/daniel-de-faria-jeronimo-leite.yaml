open_questions:
- A caracterização de 'figura instrumental' é atribuída ao relatório da Kroll (contratada pelo BRB, parte
  interessada), não é fato provado em juízo — o corpus a mantém como alegação, devidamente atribuída.
- Não localizada manifestação pública dele sobre as acusações, além da contestação do valor patrimonial
  atribuído pelo BRB.
- Não foi possível confirmar, em fonte primária, o número exato do processo do MPMA nem o teor integral
  da decisão de Toffoli — recomenda-se verificação direta antes de qualquer nova camada editorial sobre
  este caso.
