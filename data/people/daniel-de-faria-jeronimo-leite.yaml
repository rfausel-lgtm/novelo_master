id: daniel-de-faria-jeronimo-leite
kind: person
name: Daniel de Faria Jerônimo Leite
category: lawyer
role: Advogado de São Luís (MA); alvo de ação civil do BRB e da Operação Sem Desconto
positions: []
summary: 'Advogado de São Luís (MA), conselheiro federal da OAB, ex-procurador do município de São Luís,
  sócio-fundador do escritório Daniel Leite & Advogados (fundado em 2007). É réu, junto com Daniel Vorcaro,
  o Banco Master e outros, em ação civil movida pelo BRB (7ª Vara da Fazenda Pública do DF) por suposta
  tentativa coordenada e oculta de assumir o controle acionário do banco — a imprensa atribuiu a um relatório
  da consultoria Kroll (contratada pelo BRB) a caracterização dele como ''figura instrumental'' dessa
  operação, mas a própria Kroll contestou publicamente ter divulgado relatório que atribua responsabilidade
  a pessoas, o que qualifica a força dessa caracterização. Em abril de 2025, tomou empréstimo de R$ 93,7
  milhões, usado majoritariamente para comprar ações do BRB via fundos de investimento, incluindo o fundo
  Verbier, administrado por Maurício Quadrado. Seu escritório mantinha contrato de prestação de serviços
  jurídicos com a Câmara Municipal de Imperatriz (MA) desde abril de 2023 (Pregão 002/2023, R$ 10.900/mês);
  um aditivo de 06/04/2024 elevou o valor para R$ 15.000/mês (~R$ 180 mil/ano) e prorrogou por 12 meses,
  o que motivou apuração do Ministério Público do Maranhão (Notícia de Fato nº 003773-253/2025) por possível
  improbidade administrativa. O ministro Dias Toffoli (STF) trancou essa apuração em 30/09/2025 (PET 14.601/MA,
  lida integralmente pela equipe), com fundamento na tese de repercussão geral do Tema 309 (de sua própria
  relatoria — não há improbidade sem dolo, e a inexigibilidade de licitação para serviços advocatícios
  especializados é constitucional) — decisão que NÃO menciona Vorcaro, a Kroll, o BRB, Quadrado ou Mansur;
  a ligação com o caso Master foi feita pela imprensa, não pelo STF. O acordo entre ele e o BRB na ação
  civil foi homologado em 31/07/2026, com sua saída do processo sob cláusula de confidencialidade. É também,
  desde agosto de 2026, alvo da Operação Sem Desconto (fraudes no INSS, frente distinta), ligada a suposto
  núcleo de lavagem de dinheiro do senador Weverton Rocha (PDT-MA). Em 06/08/2026, outro advogado pediu
  publicamente à OAB-MA seu afastamento da profissão, citando o episódio BRB/Kroll. Patrimônio declarado:
  BRB estimou R$ 6 milhões (renda de R$ 35 mil/mês); ele contrapôs R$ 75 milhões (renda de R$ 579 mil/mês),
  incluindo propriedades rurais.'
why_in_novelo: É a única ponte concreta e multissourced encontrada entre o Maranhão e a rede financeira
  de Daniel Vorcaro — via a tentativa de compra de ações do BRB, com contrato público municipal sob suspeita
  de improbidade e investigação trancada pelo mesmo ministro (Toffoli) já central a outras frentes do
  caso Master.
