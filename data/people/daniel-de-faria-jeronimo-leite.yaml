open_questions:
- A caracterização de 'figura instrumental' é atribuída pela imprensa a um relatório da Kroll (contratada
  pelo BRB, parte interessada) — mas a própria Kroll nega ter divulgado relatório que atribua responsabilidade
  a pessoas; a origem exata da caracterização na imprensa permanece não esclarecida. Não é fato provado
  em juízo.
- Não localizada manifestação pública dele sobre as acusações, além da contestação dos valores de renda
  e patrimônio atribuídos pelo BRB.
- Não localizado se o MPMA recorreu (agravo regimental) da decisão de Toffoli na PET 14.601; a própria
  decisão trancou apenas a Notícia de Fato nº 003773-253/2025 (sobre o aditivo de 2024) — há, segundo
  a mesma decisão, uma tentativa distinta de nova contratação por inexigibilidade em 2025, que o MPMA
  tentou obstar por outro procedimento (nº 000938-509/2025), não necessariamente alcançado pelo trancamento.
- A decisão de Toffoli (30/09/2025) é anterior, em mais de quatro meses, à revelação pública (fevereiro
  de 2026) do vínculo societário dele com a empresa Maridt, ligada ao cunhado de Vorcaro, e ao seu afastamento
  da relatoria do caso Master — cronologia que fundamenta a suspeita levantada pela imprensa, sem constituir
  prova de irregularidade na decisão específica.
