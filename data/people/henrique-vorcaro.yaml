summary: Pai de Daniel Vorcaro. Teve prisão preventiva decretada pelo STF em 14/05/2026 (Pet 15978, 6ª
  fase da Compliance Zero), mantida pela Segunda Turma em 16/06/2026 por maioria. Segundo a PF, seria
  o principal operador financeiro e responsável por repassar ao grupo as ordens do filho. Em março de
  2026, teve bens bloqueados pela Justiça a pedido da EFB (liquidante do Banco Master) e é réu, ao lado
  da filha Natália Vorcaro Zettel, em ação civil movida pela EFB nos Estados Unidos por dissipação de
  mais de US$ 1 bilhão em ativos do banco. É apontado como presidente da holding Sozo Real Estate, usada
  na tentativa frustrada de venda da mansão de Orlando à Chosen Vessel LLC.
why_in_novelo: Teve prisão preventiva decretada e mantida pelo STF na 6ª fase da Operação Compliance Zero,
  sendo descrito pela Polícia Federal como operador financeiro do grupo investigado.
