open_questions:
- A posição pessoal e direta da defesa de Henrique Vorcaro (fora da menção feita na petição do filho) não
  foi localizada em fonte verificada do corpus; o ministro Gilmar Mendes propôs prisão domiciliar em
  divergência parcial.
- Condenado pela CVM em 08/09/2026, por unanimidade, a R$ 20 milhões de multa por operação fraudulenta
  no Brazil Realty FII — mesmo valor aplicado ao filho, Daniel Vorcaro.
