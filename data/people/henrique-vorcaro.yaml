  date: '2026-03-04'
- kind: denial
  summary: 'RESOLVIDO (lote 178): manifestação pessoal e direta, em petição própria de 09/03/2026 (não
    apenas por menção na petição do filho) — nega que a conta dele na Reag tenha qualquer saldo ou tenha
    sido usada para repasse de valores, classificando a cobertura de imprensa (que anexa) como ''linchamento''
    baseado em informação ''gravemente equivocada, senão falsa em si mesma''.'
