name: Henrique Vorcaro
category: businessperson
role: Pai de Daniel Vorcaro; apontado pela PF como operador financeiro do grupo investigado
positions: []
summary: 'Pai de Daniel Vorcaro. Teve prisão preventiva decretada pelo STF em 14/05/2026 (Pet 15978, 6ª
  fase da Compliance Zero), mantida pela Segunda Turma em 16/06/2026 por maioria. Segundo a PF, seria
  o principal operador financeiro e responsável por repassar ao grupo as ordens do filho. Em março de
  2026, teve bens bloqueados pela Justiça a pedido da EFB (liquidante do Banco Master) e é réu, ao lado
  da filha Natália Vorcaro Zettel, em ação civil movida pela EFB nos Estados Unidos por dissipação de
  mais de US$ 1 bilhão em ativos do banco. É apontado como presidente da holding Sozo Real Estate, usada
  na tentativa frustrada de venda da mansão de Orlando à Chosen Vessel LLC. Na 6ª fase, a PF apreendeu
  em busca contra ele documento impresso extraído do sistema Sinapse, banco de inteligência de acesso
  restrito, com consulta detalhada aos dados pessoais de Augusto Conte, ex-sócio de seu filho — indício,
  segundo a corporação, de que dispunha de servidores dispostos a acessar ilicitamente os sistemas internos.
  RETROCESSO NA LINHA DO TEMPO (lote 171) — antes de tudo isso, já na 2ª fase da Compliance Zero (14/01/2026),
  a PF bloqueara R$ 2.245.235.850,24 em conta dele na CBSF DTVM (nova denominação da Reag Trust) — instituição
  liquidada pelo BC em 15/01/2026 e alvo direto da Operação Carbono Oculto, que revelou vínculo da Reag
  com o PCC. A representação da PF de 27/02/2026 cita esse bloqueio como indício de ocultação bilionária
  de recursos que se perpetuou mesmo após a soltura de Daniel Vorcaro em 28/11/2025. Reportagem da Folha
  de 07/03/2026, anexada à petição em que ele nega saldo na Reag, descreve-o como um dos destinatários do
  mecanismo de desvio via CDBs e fundos cativos do Master — ao lado da irmã Natália e do primo Felipe.
  A DECISÃO DA 6ª FASE (13/05/2026, lote 191), lida na íntegra, é muito mais específica que a cobertura
  de imprensa: reproduz mensagens de WhatsApp em que ele cobra e paga o núcleo ''A Turma'' mesmo após a
  1ª e a 2ª fases da operação (09/01/2026: ''no momento em que estou é que preciso de vocês''; 06/01/2026:
  promete enviar ''400'' a Marilson Roseno, que pede ''800k''), usa número estrangeiro (Colômbia) e troca
  de terminal com frequência, e se reuniu pessoalmente com Marilson em 03/03/2026 na empresa One
  Investimentos, na véspera da 3ª fase (identificado apenas como ''H'' numa mensagem de Marilson à esposa,
  decifrado por cruzamento de dados pela PF). Documentação contábil da empresa Roseno & Ribeiro Gestão
  Empresarial (de Marilson) mostra repasses da King Participações (de Mourão) que continuaram em
  novembro/dezembro de 2025 e janeiro/fevereiro de 2026. NOVO RETROCESSO NA LINHA DO TEMPO (lote 229): o
  IPL paulista 5004641-31.2025.4.03.6181 — segunda linha investigativa sobre o Master, aberta em
  27/05/2025 a partir de denúncia anônima, formalmente distinta da Compliance Zero — traz, em análise de
  FIDCs anexada ao inquérito, o apontamento de uma transferência de R$ 9 milhões de um intermediário não
  identificado a ele. É alegação da autoridade policial em fase de apuração, anterior a qualquer outro
  registro do acervo sobre ele.'
why_in_novelo: Teve prisão preventiva decretada e mantida pelo STF na 6ª fase da Operação Compliance Zero,
  sendo descrito pela Polícia Federal como operador financeiro do grupo investigado.
cited_position:
- kind: denial
  summary: Em petição própria de 04/03/2026, referida no agravo regimental do filho (lote 175), nega que
    exista bloqueio de R$ 2,24 bilhões em conta sua, afirmando não possuir tal valor à sua disposição —
    negativa que contrasta com comprovantes de protocolamento SISBAJUD lidos pela equipe (lote 171),
    registrando bloqueio processado na CBSF DTVM sob o CPF dele, classificado como ativo de baixa liquidez.
