summary: Ministro do STF. Relator da PET 15556 e do INQ 5026, que apuram os fatos conhecidos como caso
  Master; decretou prisões preventivas e autorizou fases da Operação Compliance Zero a pedido da PF.
why_in_novelo: É o relator, no STF, das investigações do caso Master e assina as decisões que autorizaram
  fases da Operação Compliance Zero.
cited_position:
- date: '2026-09-02'
  by_id: andre-mendonca
  kind: clarification
  summary: O gabinete confirmou encontro único com Vorcaro em março de 2025, por iniciativa do empresário,
    limitado a ação sobre precatórios, em que o ministro se restringiu a ouvi-lo; não comenta diálogos
    privados entre terceiros.
  source_ids:
  - src-cnn-2026-09-02-mendonca-admite-encontro
- kind: version
  summary: Após a decisão de Dino que o neutralizou, afirmou que a PF produzia 'relatórios paralelos'
    sobre sua própria atuação no caso Master, chamando a prática de 'arapongagem institucional'.
  source_ids:
  - src-poder360-2026-09-09-planalto-engana-fachin-articula-volta-andrei-dino
  date: '2026-09-09'
open_questions:
- 'NOVO (15/09/2026): respondeu a Fachin, em 14/09, sobre a determinação de identificar pessoas citadas numa
  nota de Vorcaro que mencionava o diretor-geral da PF e o procurador-geral da República — diz ter agido por
  cautela, "sem imputar qualquer suspeita a quem quer que seja" (ver
  ev-mendonca-explica-identificacao-nota-vorcaro-pf-pgr). No mesmo dia, Moraes apresentou defesa formal
  acusando-o diretamente de vazamento à imprensa e de gravar vídeo político por motivação eleitoral (ver
  ev-moraes-acusa-mendonca-vazamento-motivacao-eleitoral) — Mendonça não respondeu a essas acusações
  específicas até esta coleta.'
- 'NOVO (14/09/2026): em sessão pública da Segunda Turma de 16/06/2026, relatou ter recebido, por advogado de
  Vorcaro, proposta de "delação premiada seletiva", que diz ter recusado ("perderam o pudor... delação
  seletiva, comigo não") — episódio coberto por CNN Brasil e Gazeta do Povo (Gilmar Mendes reagiu chamando a
  situação de "muito invertida"). Em 14/09/2026, Benjamim Botelho de Almeida (investigado na Compliance Zero)
  apresentou arguição de suspeição contra Mendonça citando esse episódio e o encontro de março de 2025 com
  Vorcaro sobre a STP 976 (créditos de precatórios do FIDC MEG, ligado ao ecossistema de Vorcaro) como
  fundamentos — ver ev-suspeicao-benjamim-botelho-fundamentos. A petição também alega, sem confirmação
  independente localizada até a publicação, amizade próxima com o advogado Ciro Rocha Soares e que o voto do
  ministro pela prisão preventiva do pai de Vorcaro se apoiou em relatórios policiais com conteúdo de
  comunicações entre advogados de defesa e seus clientes — tratado como alegação de parte interessada, não
  fato estabelecido.'
- 'NOVO (13/09/2026): mensagens de 2022 reveladas com a queda de sigilo mostram Cláudio Castro escrevendo-lhe
  sobre o "caso Cabral" (ex-governador Sérgio Cabral), com arquivos de pedidos de habeas corpus; dias depois,
  votou pela soltura de Cabral. Mendonça é hoje relator do caso RioPrevidência/Master, no qual Castro é
  investigado, e indeferiu em julho de 2026 pedido de nova busca contra Castro, mesmo com parecer favorável
  do PGR. Não aprofundado se há relação entre a proximidade de 2022 e as decisões de 2026.'
- 'NOVO (13/09/2026): o diretor-geral da PF, Andrei Rodrigues, afirmou publicamente que foi o gabinete de
  Mendonça que pediu a cópia dos dados do celular de Vorcaro (atendida em 08/03/2026) — contradizendo a
  versão do próprio Mendonça, de que a PF entregou o material por iniciativa própria, voluntariamente. A
  divergência sobre quem tomou a iniciativa permanecia em aberto na véspera da sessão de 15/09.'
- O corpus não contém avaliação oficial sobre impedimento ou suspeição do relator em razão do encontro
  de março de 2025.
- 'Em 08/09/2026, na Pet 16.662 (sua própria relatoria), determinou o afastamento cautelar do diretor-geral
  da PF — decisão tomada em paralelo à Pet 16.704, que o presidente do STF Fachin havia avocado cinco
  dias antes para tratar da mesma crise; não há, nas fontes disponíveis, manifestação de Fachin especificamente
  sobre essa aparente sobreposição de procedimentos. ATUALIZAÇÃO (12/09/2026): não é mais o relator da Pet
  16.662 — Fachin, diante da possibilidade de aplicação do art. 144, IV, do CPC (suspeição), formalizou a
  substituição da relatoria para a própria Presidência.'
- Formalizou, em 06/09/2026, pedido para que o plenário do STF — não apenas Fachin — julgue o caso da
  acusação de Moraes contra ele (art. 5º RISTF) — sem data de pauta definida.
- Sua decisão de afastamento de Andrei Rodrigues (08/09/2026) foi neutralizada, um dia depois, por decisão
  de Flávio Dino (Pet 16.669), que a considerou fundada em pedido de parte ilegítima (Partido Novo) e
  como usurpação da competência do Plenário — chegando a caracterizá-la como possível 'decisão em causa
  própria', por Mendonça figurar como mencionado nos relatórios objeto da Pet 16.704, da qual é parte.
  Dino citou, como agravante, uma reunião entre Mendonça e Vorcaro 'nas dependências de uma empresa privada'
  — fato já registrado no corpus desde março de 2025 (Instituto ITER, classe A), sem juízo de valor antecipado
  por parte de Dino.
- Um dia antes da decisão de Dino que reintegrou Andrei, a AGU (Jorge Messias) já havia pedido a suspensão
  da decisão de afastamento diretamente a Fachin. Apuração da Poder360 (09/09/2026) afirma que houve,
  na noite anterior, articulação paralela entre integrantes do governo Lula e Dino para reverter a decisão
  — mas busca por corroboração independente dessa articulação específica (fora da Poder360) não localizou
  outra fonte até a data desta apuração; permanece registrada como apuração exclusiva de um único veículo,
  não fato confirmado por múltiplas fontes.
- 'Homologou em 09/09/2026, na condição de relator, a colaboração premiada de Antonio Carlos Freixo Júnior.
  Nota de contexto para leitura futura, registrada para evitar inferência indevida: é também o relator
  da ADI 7900 e da ADPF 1306, julgadas em abril de 2026, que derrubaram as medidas de Mato Grosso restritivas
  ao cartão consignado de benefício, a pedido de entidades do sistema financeiro. A coincidência de relatoria
  tem pouco peso inferencial: a distribuição de ações de controle concentrado é por sorteio, o mérito
  das duas ações foi decidido por unanimidade do Plenário e o fundamento foi de competência privativa
  da União para legislar sobre direito civil e política de crédito, matéria alheia ao objeto criminal.'
- O levantamento de sigilo que determinou em 1º/09/2026, no caso Master, deflagrou a crise institucional
  que culminou, em 09/09, na retirada da relatoria do Inquérito 4.781 de Alexandre de Moraes — que havia
  se valido daquele inquérito para pedir apuração contra ele.
- Foi dele o pedido que levou o presidente do tribunal a convocar a sessão extraordinária de 15/09/2026,
  na qual o Plenário decidirá se autoriza investigação contra Alexandre de Moraes. Seu ato de 08/09, que
  afastou o diretor-geral da Polícia Federal e o diretor de Inteligência, foi suspenso por Fachin no dia
  seguinte, junto com a decisão de Dino que o havia neutralizado. A Procuradoria-Geral da República sustenta
  que ele direcionou a apuração contra Moraes sem autorização prévia do Plenário.
- 'Em ofício de 11/09/2026, Moraes formalizou por escrito, com lista numerada, a acusação de que Mendonça
  usurpou a direção de investigações, conduziu irregularmente colaboração premiada e direcionou alvos —
  o próprio Moraes e o senador Davi Alcolumbre — "por motivos pessoais e políticos"; denunciou ainda que o
  levantamento de sigilo de 10/09 excluiu 180 documentos dos 15 processos liberados. No mesmo dia, três
  ministros (Moraes, Zanin, Gilmar Mendes) cobraram que a cópia dos dados do celular de Vorcaro — entregue
  ao gabinete de Mendonça pela PF em 08/03/2026 e mantida lacrada (lacre nº B0003311945) — fosse compartilhada
  com todo o colegiado antes do julgamento de 15/09; Mendonça respondeu que a cópia permanece intocada, sem
  se opor abertamente ao compartilhamento nem promovê-lo.'
- 'Em 13/09/2026, reconheceu "divergência de informações" sobre como o HD com a extração do celular de
  Vorcaro chegou ao seu gabinete em março, "não tendo sido indicada nenhuma decisão que contivesse a referida
  determinação", e pediu que a Presidência intimasse os quatro delegados subscritores da representação
  original da Pet 15.556 a explicar as circunstâncias e relatar eventuais "constrangimentos sofridos". No
  mesmo despacho, recusou incluir o conteúdo integral do celular nos autos antes do julgamento de 15/09, por
  risco de "tumultuar" a sessão.'
- 'NOVO (13/09/2026, lido via OCR): apesar de ele mesmo afirmar, em despachos de 11 e 13/09, que "todo o
  material" estava disponível a todos os ministros, Moraes contestou isso por escrito no mesmo período
  (Ofício GMAM 09/2026, 11/09): "Não é o que consta dos autos", acusando-o de "levantamento seletivo e
  direcionado do sigilo... na proteção ostensiva de determinado grupo político" e de suprimir do colegiado
  "18 PETs e 180 documentos".'
