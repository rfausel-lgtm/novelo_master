open_questions:
- A posição pública de Cláudio Castro sobre a operação não foi localizada em fonte verificada do corpus.
- 'Assinou, em 27/05/2021, o decreto que acrescentou ao rol de consignatárias fluminenses a categoria
  residual ''outras entidades consignatárias devidamente autorizadas pelo Estado'' — cláusula em branco
  cujo requisito de habilitação é definido pelo mesmo Executivo que credencia — e que fixou para o cartão
  de benefício margem de 20% do líquido que, nos termos do §1º, ''não compõe a margem consignável''. Cinco
  dias depois foi autorizada a operadora do CredCesta. CORREÇÃO ao que este acervo registrara: o decreto
  de 2016 não exigia autorização do Banco Central de todas as consignatárias, e sim apenas no inciso V;
  o inciso III já admitia administradoras de cartões de benefícios sem essa exigência. O decreto de 2021
  não revogou exigência que alcançasse o produto — abriu categoria nova e aberta. O ato não teve referendo
  de secretário e origina-se do Processo SEI-150001/006360/2021, cuja obtenção mostraria quem propôs o
  inciso VIII e como se justificou o limite de 20%.'
