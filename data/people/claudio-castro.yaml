summary: Ex-governador do Rio de Janeiro. Em 26/05/2026 o STF autorizou busca e apreensão em sua casa
  na 8ª fase da Compliance Zero, em investigação sobre aportes da RioPrevidência em produtos do Banco
  Master; a PF apontou proximidade pessoal com Vorcaro e atuação política para viabilizar os investimentos,
  segundo comunicação oficial do STF.
why_in_novelo: É investigado, segundo comunicação oficial do STF, por suposto envolvimento em aportes
  da RioPrevidência em produtos financeiros do Banco Master.
