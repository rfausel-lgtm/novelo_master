name: Ticiano Figueiredo de Oliveira
category: lawyer
role: Advogado criminalista; sócio-fundador da Figueiredo & Velloso Advogados
positions: []
summary: Advogado criminalista, sócio-administrador da Figueiredo & Velloso Advogados Associados desde
  06/05/2010 (CNPJ 11.428.814/0001-48) — a mesma banca em que Renata Varandas, namorada do diretor-geral
  afastado da PF, Andrei Rodrigues, é sócia da área de comunicação desde 31/01/2025. Integrou, junto com
  Pedro Ivo Velloso, a defesa de Augusto Ferreira Lima desde a prisão dele (18/11/2025) até renunciar
  ao caso em 04-05/08/2026.
why_in_novelo: É um dos dois sócios-fundadores da banca que, ao mesmo tempo em que empregava a namorada
  do diretor-geral da PF, defendia um dos dois investigados centrais da própria operação conduzida por
  essa corporação — sem que nenhuma fonte associe Ticiano Figueiredo pessoalmente a qualquer conduta irregular
  decorrente disso.
