summary: Juiz federal titular da 4ª Vara Federal Criminal da Seção Judiciária do Amapá. Assinou a decisão
  que autorizou as buscas da operação Zona Cinzenta contra três gestores da Amapá Previdência, deferiu
  a quebra de sigilo telemático junto a Apple e Google, o compartilhamento de provas com MP-AP, Receita
  Federal, CGU e Banco Central, e determinou contraditório diferido e sigilo de nível máximo no PJe.
why_in_novelo: Autorizou, como juiz federal no Amapá, a operação que apura a aplicação de R$ 400 milhões
  da previdência estadual em títulos do Banco Master.
