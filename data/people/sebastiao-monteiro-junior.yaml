summary: Agente aposentado da PF, preso na 6ª fase da Operação Compliance Zero, em 14/05/2026, como integrante
  do núcleo apontado pela corporação como responsável por obter informações sigilosas em favor da família
  Vorcaro. Em 19/06/2026, sua defesa protocolou pedido de revogação da prisão preventiva, alegando falta
  de provas e afirmando que ele estaria 'exposto a risco concreto e atual à sua integridade física e à
  sua vida'; a decisão sobre esse pedido não foi localizada. Não há denúncia oferecida nem julgamento.
