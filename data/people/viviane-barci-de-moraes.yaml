open_questions:
- O corpus não contém o valor efetivamente pago; a imprensa cita R$ 80,2 milhões (Receita Federal, via
  CPI) sem que a equipe tenha lido o documento de origem.
- A relação entre os serviços descritos na nota e o objeto contratual não foi avaliada pela equipe.
