summary: Assinou digitalmente, em 16/01/2024, o Termo de Análise e Atestado de Credenciamento nº 001/2024
  do Banco Master no regime próprio de Itaguaí — firmando, com dois minutos de diferença, os dois campos
  distintos que o modelo do Ministério da Previdência reserva ao dirigente da unidade gestora e ao gestor
  de recursos. O processo fora aberto cinco dias antes, e a documentação chegara por mensagem do próprio
  banco. O voto condutor do Acórdão nº 26.458/2026 do TCE-RJ (processo 206.599-7/26, assinado em 03/08/2026) o
  designa Presidente do Itaprevi e Presidente do Comitê de Investimentos e determina a sua notificação, no
  prazo de 15 dias a contar da decisão, para apresentar as razões pelas quais (a) assinou e validou o termo de
  credenciamento e (b) como presidente do Comitê, não incluiu o credenciamento na pauta. O mesmo voto registra
  que a abertura efetiva da conta e as aplicações em letras financeiras do banco (R$ 59 milhões, segundo o voto)
  ocorreram na gestão seguinte, de Fernanda Pereira da Silva Machado, nomeada em 12/06/2024. A notificação pede
  esclarecimentos; não é julgamento de mérito. Não é réu, denunciado nem indiciado.
why_in_novelo: Assinou o termo que atestou a aptidão do Banco Master para receber recursos previdenciários
  em Itaguaí, documento que o tribunal de contas concluiu ter sido preenchido pelo próprio banco.
cited_position:
