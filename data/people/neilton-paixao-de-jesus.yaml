open_questions:
- O voto grafa a data do termo como 16/01/2023 nos itens da notificação; o documento do Itaprevi é de 16/01/2024
  (doc-2024-01-16-termo-credenciamento-001-itaprevi). Erro material do tribunal; o Novelo usa 2024.
- Consultar os autos 206.599-7/26 (prazo de 15 dias contado da decisão) para eventual juntada de razões de defesa.
- Não se apurou por que os dois campos de assinatura, reservados a funções distintas, foram firmados pela
  mesma pessoa.
