summary: Aparece em duas frentes do caso. Na esfera administrativa, é um dos acusados no PAS CVM SEI 19957.008699/2019-01,
  sobre operação fraudulenta caracterizada pelo oferecimento de vantagens a prefeitos e gestores de regimes
  próprios de previdência; sua proposta de termo de compromisso foi rejeitada pelo Colegiado em 2021.
  Decisão da Justiça Federal do Rio, em ação sobre terrenos em Queimados, registra que Agera Negócios
  Imobiliários, Aquilla FII e Verona FII 'são geridas pelas mesmas pessoas, Gustavo Cleto Marsiglia e
  Benjamim Botelho de Almeida'. Na esfera criminal, respondeu como corréu na ação penal sobre o Banco
  Máxima e foi absolvido pela sentença de 25/04/2025, com fundamento no art. 386, V, do CPP; o MPF apelou.
why_in_novelo: Administrador de fundos que aparece ao lado de Benjamim Botelho nas estruturas do Grupo
  Aquilla e como corréu absolvido na ação penal sobre o Banco Máxima.
