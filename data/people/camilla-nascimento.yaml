role: Vice-prefeita de Campo Grande (MS); secretária municipal de Assistência Social; ex-presidente do IMPCG
summary: Vice-prefeita de Campo Grande e secretária municipal de Assistência Social. Presidiu o Instituto Municipal
  de Previdência de Campo Grande (IMPCG) em abril de 2024, quando o órgão aplicou R$ 1,2 milhão em letras financeiras
  do Banco Master. Em 25/08/2026 a Polícia Federal deflagrou a Operação Presciência, com diligências tanto no endereço
  do instituto quanto na secretaria que ela hoje comanda, para apurar possível gestão temerária e corrupção passiva
  e ativa no processo decisório daquele investimento.
why_in_novelo: É a atual vice-prefeita de Campo Grande e presidia o instituto de previdência municipal no momento
  em que este aplicou recursos no Banco Master, sob investigação da Polícia Federal.
