summary: Presidente do União Brasil. Segundo registros da Receita Federal enviados à CPI do Crime Organizado,
  conforme o Poder360, dois escritórios ligados a Rueda receberam R$ 6,4 milhões do Banco Master desde
  2023. Sua assessoria não confirmou as informações, disse que os dados foram 'vazados de forma ilícita'
  e que os serviços são legais e regularmente contratados.
why_in_novelo: Escritórios ligados a ele constam, segundo registros fiscais enviados a CPI e divulgados
  pela imprensa, entre os destinatários de pagamentos do Banco Master; sua posição está registrada.
