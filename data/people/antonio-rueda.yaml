summary: 'Presidente do União Brasil, filho de médica e engenheiro espanhol, formado em direito tributário; aproximou-se
  de Luciano Bivar em 1998, fundou o escritório Rueda & Rueda com a irmã em 2008 (hoje administra mais de 250 mil
  processos), assumiu a presidência interina do PSL em 2018 e articulou, em 2021, a fusão com o DEM que criou o
  União Brasil — hoje a maior bancada do Congresso —, aliando-se então ao ex-presidente da Câmara Arthur Lira.
  Rompeu com Bivar em agosto de 2023, crise durante a qual imóveis dele e de sua irmã no litoral de Pernambuco
  foram incendiados, caso apurado pelo STF (sem relação estabelecida com o caso Master). Disputa publicamente,
  com o presidente do Senado e correligionário Davi Alcolumbre, os rumos do partido para 2026 — Alcolumbre busca
  estreitar laços com o governo Lula, Rueda defende, com ACM Neto, postura mais distante e crítica. Segundo registros da Receita Federal enviados à CPI
  do Crime Organizado, conforme o Poder360, dois escritórios ligados a Rueda receberam R$ 6,4 milhões do Banco Master
  desde 2023. Sua assessoria não confirmou as informações, disse que os dados foram ''vazados de forma ilícita'' e
  que os serviços são legais e regularmente contratados. Em 10/09/2026, o UOL revelou que a mesma proposta atribui a
  ele, com ACM Neto, a intermediação dos mesmos aportes institucionais mediante comissão de 10%, com pagamentos
  possivelmente somando R$ 3 milhões mensais via o escritório Rueda & Rueda Advogados. Rueda negou irregularidades.
  Em frente distinta, a PF apura desde 17/09/2025, na Operação Carbono Oculto, se ele seria dono oculto de jatos
  executivos e de fundos de investimento (Bariloche e Viena) ligados ao esquema de combustíveis do PCC — um piloto
  da empresa que operava as aeronaves o identificou como financiador por trás do crescimento da frota; Rueda nega e
  fala em acusação política. Até setembro de 2026, sem oitiva, indiciamento, denúncia ou arquivamento em nenhuma
  das duas frentes.'
why_in_novelo: Escritórios ligados a ele constam, segundo registros fiscais enviados a CPI e divulgados pela imprensa,
  entre os destinatários de pagamentos do Banco Master; sua posição está registrada.
