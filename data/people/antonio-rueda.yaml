open_questions:
- 'Achado em 13/09/2026: um relatório de inteligência da PF, citado por Alexandre de Moraes contra Mendonça
  (decisão de 03/09/2026), levanta a hipótese de que Mendonça poderia ver em Rueda uma "rota de acesso"
  ao presidente do Senado, Davi Alcolumbre, tratado no mesmo documento como "provável alvo estratégico".
  É hipótese de inteligência formulada pela própria PF sobre a conduta de Mendonça, não uma imputação
  a Rueda; não há investigação, cautelar ou oitiva contra ele que qualquer autoridade vincule a esse motivo.'
- 'Achado em 13/09/2026: a frente Carbono Oculto (jatos e fundos ocultos) é INTEIRAMENTE DISTINTA da frente
  Master (comissão de 10% sobre RPPS) — apuradas por autoridades diferentes (PF/MP-SP vs. PF/PGR no caso
  Master), sem relação documental estabelecida entre elas além da coincidência da mesma pessoa. A única
  ponte estrutural encontrada é que a Trustee DTVM (de Maurício Quadrado, ex-sócio de Vorcaro) também
  apareceu na Carbono Oculto, mas em fundos distintos (Zeus FIDC, Gran Capital FIDC-NP, FIDC DB Crédito
  Global) dos citados para Rueda (Bariloche, Viena) — nenhum elo direto encontrado entre as duas pontas.'
- Os registros da Receita não foram lidos pela equipe; os valores são os reportados pelo Poder360.
- 'A nova acusação de comissão de 10% é distinta dos R$ 6,4 milhões já documentados por registros fiscais enviados
  à CPI (2022-2025): aquele valor é pagamento a escritório por serviços; este é comissão alegada sobre captação
  de terceiros, sem comprovação de repasse efetivo.'
- 'Duas camadas distintas (16/10/2026): (1) a comissão de 10% é alegação da terceira proposta de colaboração de
  Vorcaro (classe A, disputada; rejeitada pela PF e pela PGR, segundo o UOL); (2) as mensagens publicadas pelo
  UOL em 16/10/2026 descrevem contatos, a oferta de jatos e hospedagem e a contratação do escritório em quatro
  ações (R$ 15,4 milhões), sem mostrar pagamento de comissão a ele, segundo o próprio veículo. A "comissão
  Amapá" registrada pela tesouraria do Master em 01/08/2024 é, nas mensagens, da consultoria de terceiros.'
- 'Segundo o UOL (16/10/2026), a PF pediu busca e apreensão em endereços ligados a ele e a ACM Neto com base nas
  mensagens, e a operação não chegou a ser autorizada pelo STF; o Novelo não localizou a decisão, a data nem o
  relator. Não confundir com a decisão sobre busca contra ACM Neto na Operação Overclean, outro caso.'
- 'Pedido de 12/07/2024 para que Vorcaro apagasse mensagens (UOL): o conteúdo das mensagens apagadas e o fuso
  horário não são informados; a ata do comitê da Amprev registra a reunião daquele dia entre 10h49 e 11h13 e
  não o menciona (seq-12-07-2024-mensagem-de-rueda-e-aprovacao-de-r-200-mi-no-amapa).'
