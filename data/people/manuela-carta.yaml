summary: Publisher de CartaCapital. Segundo o UOL (15/10/2026), com base em mensagens extraídas pela PF do
  celular de Daniel Vorcaro, ela tratou com o banqueiro de recursos para a revista em 2021, de uma possível
  entrada dele como sócio em 2023 (não concretizada) e de um adiantamento de publicidade em 2024. Em nota, diz
  que o contrato com o Master foi de publicidade regular e que Vorcaro nunca pediu notícias positivas.
why_in_novelo: Publisher de CartaCapital citada pelo UOL, com base em mensagens de Daniel Vorcaro, sobre
  contrato de publicidade do Banco Master com a revista.
