    by_id: manuela-carta
    date: 2026-10-15
    summary: 'Em nota: "contrato regular de veiculação de anúncio, conforme as regras do mercado publicitário"
      (2021 a 2023); o grupo voltou a anunciar por meio da Kovr e do Will; "Daniel Vorcaro nunca me procurou
      para pedir a publicação de notícias positivas ou interferir em qualquer tipo de conteúdo jornalístico";
      diz que isso seria um erro, dada a separação entre a área comercial e a redação.'
