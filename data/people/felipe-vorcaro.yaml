role: Primo de Daniel Vorcaro, condenado pela CVM por fraude no Brazil Realty FII
positions: []
summary: Primo de Daniel Vorcaro, responsável pela MGI Desenvolvimento Imobiliário. Condenado pela CVM
  em 08/09/2026, no PAS 19957.007976/2020-94, a R$ 5 milhões de multa por operação fraudulenta na 3ª emissão
  do Brazil Realty FII — a MGI teve suas quotas sobreavaliadas em cerca de R$ 56 milhões, servindo de
  base à integralização de cotas do fundo pela Milo Investimentos. Em defesa apresentada individualmente
  em 13/10/2025, sustentou nunca ter sido sócio ou administrador da Milo ou de qualquer contraparte das
  operações, e que nem ele nem a MGI se enquadrariam na definição subjetiva de sujeito passível de responsabilização
  pela norma invocada — argumento rejeitado pelo colegiado, que o condenou mesmo assim.
why_in_novelo: É um dos parentes de Daniel Vorcaro condenados pela CVM no mesmo processo, ao lado do pai,
  Henrique Vorcaro, evidenciando o padrão familiar de participação nos veículos societários envolvidos
  na fraude do Brazil Realty FII.
