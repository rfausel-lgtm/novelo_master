id: eduardo-mendonca-sodre-martins
kind: person
name: Eduardo Mendonça Sodré Martins
category: businessperson
role: Enteado do senador Jaques Wagner, conforme identificação por reportagens (O Antagonista/DCM, Jornal
  Sete, coluna da Metrópoles)
positions: []
summary: Identificado pela imprensa, sob a alcunha 'Dudu', como o 'enteado pessoa física' do senador Jaques
  Wagner a quem a PF atribui, segundo decisão do STF já lida diretamente pela equipe (Pet 16.229), o recebimento
  de R$ 2,34 milhões — valor que o corpus já registrava como classe D antes desta identificação nominal,
  sem nome do beneficiário. A identificação de que esse beneficiário é Eduardo Mendonça Sodré Martins
  vem de fonte secundária (a matéria original do Diário do Centro do Mundo não pôde ser lida diretamente
  — bloqueio de acesso automatizado — apenas replicações equivalentes), o que a mantém como classe A até
  confirmação por leitura do documento primário ou por fonte independente adicional. As mesmas reportagens
  atribuem a ele, em mensagem de 04/09/2025 a Augusto Ferreira Lima, a frase 'Amanhã vence os boletos
  e são altos' — citação que as fontes atribuem a decisão judicial reproduzindo apuração da PF, mas que
  a equipe não confirmou por leitura direta do documento primário.
why_in_novelo: É a pessoa física identificada pela imprensa, com base em decisão judicial que cita apuração
  da PF, como destinatário de parte dos recursos que saíram da PKL One Participações (núcleo Augusto Lima)
  rumo ao núcleo familiar do senador Jaques Wagner — preenchendo, com ressalva de fonte secundária, uma
  lacuna nominal que o corpus já registrava como fato de classe D sem nome.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- A identificação nominal ('Eduardo Mendonça Sodré Martins') não foi confirmada por leitura direta do
  documento judicial primário nem por consulta a registro público (CNPJ/QSA da BN Financeira) que o vincule
  por nome — o corpus já sabe, por fonte primária, que a BN Financeira tem como sócia Bonnie Toaldo Bonilha
  (nora do senador) e Moisés Dantas dos Santos (advogado sócio), não este nome; a relação exata entre
  'enteado pessoa física' e o quadro societário da BN Financeira não foi reconciliada pela equipe.
- A citação literal 'Amanhã vence os boletos e são altos' não foi verificada por leitura direta da decisão
  judicial que a reproduziria — apenas por reportagens que a atribuem a essa origem.
- Nenhuma manifestação pública dele ou de representante localizada até a data desta apuração.
