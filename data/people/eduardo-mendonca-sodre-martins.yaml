id: eduardo-mendonca-sodre-martins
kind: person
name: Eduardo Mendonça Sodré Martins
category: businessperson
role: Enteado do senador Jaques Wagner, identificado por decisão do STF (Pet 16.229)
positions: []
summary: 'CONFIRMADO POR LEITURA DIRETA (lote 117): a decisão de Mendonça na Pet 16.229 (17/06/2026, autenticação
  STF verificada) identifica, no item I.3, Eduardo Mendonça Sodré Martins como enteado de Jaques Wagner,
  filho de Guilherme Henrique Sodré Martins, pessoa vinculada à BN Financeira Ltda. A mesma decisão transcreve
  a mensagem de 04/09/2025, de Eduardo a Augusto Ferreira Lima: ''Amanhã vence os boletos e são altos''
  — ao que Augusto respondeu que o cenário estava ''crítico'', vinculando a dificuldade financeira ao
  insucesso da operação Banco Master/BRB e sugerindo cancelar a nota para reemissão. O documento cita,
  separadamente, a transferência de R$ 3,5 milhões (PKL One→BN Financeira, 17/10/2025) e mais de R$ 2,34
  milhões em planilhas de pagamentos a ele sob a alcunha ''Dudu'', via estruturas societárias interpostas
  — sem somar os dois valores em um total. A relação exata entre ele e o quadro societário formal da BN
  Financeira (cuja sócia-administradora é Bonnie Toaldo Bonilha, nora do senador, e cujo sócio é o advogado
  Moisés Dantas dos Santos) permanece não reconciliada: o documento judicial o identifica como beneficiário
  e interlocutor das mensagens, mas não como sócio formal.'
why_in_novelo: É a pessoa física identificada, por leitura direta da decisão do STF na Pet 16.229, como
  destinatário de recursos e interlocutor de mensagens que saíram do núcleo Augusto Lima (PKL One) rumo
  ao núcleo familiar do senador Jaques Wagner.
