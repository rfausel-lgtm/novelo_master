summary: Segundo depoimento de Daniel Vorcaro à PF em 28/08/2026, representa a SL Consulting, empresa
  de concierge que organizou a viagem à Disney/Universal (Orlando) oferecida a Paulo Sérgio Neves de Souza
  no início de 2024. A decisão de 07/05/2026 na Pet 15.873 o descreve como quem intermediava as operações de
  pagamentos relacionados a viagens internacionais cujas despesas a representação da PF atribui ao senador Ciro
  Nogueira. Segundo reportagens de 16/06/2026, um "Leo Serrano" foi o interlocutor das reservas de hotel em
  Lisboa pedidas por Vorcaro em junho de 2024; a identidade com este verbete é inferida, não documentada.
why_in_novelo: Nomeado por Vorcaro, em depoimento à PF, como representante da empresa que organizou a
  viagem oferecida a ex-diretor do Banco Central.
