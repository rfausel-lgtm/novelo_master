summary: Nome que a newsletter 'A Investigação' (David Ágape) associa, por indício de metadados de um
  arquivo PDF ('Jefferson.Silva' como autor/criador registrado no documento), a um dossiê anônimo de 50
  páginas que teria embasado, em grande parte verbatim, a decisão do ministro Alexandre de Moraes de 03/09/2026
  contra André Mendonça. O PRÓPRIO ARTIGO qualifica essa associação como 'indício, não prova' — não uma
  afirmação de autoria confirmada. A equipe editorial verificou, por leitura direta do texto publicado,
  que a matéria de fato contém essa ressalva explícita do autor. Não há confirmação independente, de qualquer
  outra fonte, de que Jefferson Pessoa da Silva integre o gabinete de Moraes ou tenha qualquer relação
  com o dossiê.
why_in_novelo: É o nome que uma reportagem específica associa, por indício técnico de metadados — não
  por confirmação —, à possível origem de um dossiê anônimo central na crise institucional Moraes-Mendonça
  no STF; entra no grafo com o peso exato da fonte que o cita, sinalizado pela classificação de evidência.
