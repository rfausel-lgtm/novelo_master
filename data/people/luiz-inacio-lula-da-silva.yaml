  date: '2026-09-08'
open_questions:
- Não há, no corpus, documento oficial que registre o encontro; a confirmação vem do próprio presidente
  e de mensagens do banqueiro citadas pela imprensa.
- 'Verificação da equipe em documentos primários: Lula não aparece no relatório da PF sobre o celular
  de Vorcaro (218 páginas), não está entre os quatro indiciamentos propostos no relatório final da CPI
  do Crime Organizado, não consta das minutas de delação e não é interlocutor de nenhuma mensagem apreendida.
  Não é investigado, indiciado nem alvo. O que existe é a audiência de 04/12/2024, que ele próprio confirmou.'
- 'Há duas versões não conciliadas sobre o teor da reunião de 04/12/2024: a de que o presidente encaminhou
  o tema ao Banco Central para tratamento técnico, sustentada por Galípolo em depoimentos com notas taquigráficas;
  e a publicada pelo UOL, com base em documento apreendido, de que teria aconselhado Vorcaro a não vender
  o banco ao BTG. Nem o Planalto, nem o BC, nem a defesa de Vorcaro se manifestaram sobre a segunda.'
- Segundo apuração da Poder360 (09/09/2026), integrantes de seu governo teriam articulado, na noite de
  08/09/2026, com o ministro Flávio Dino, a reversão da decisão de Mendonça antes que Fachin se posicionasse
  — apuração exclusiva, sem corroboração jornalística independente localizada até a data desta atualização.
- Segundo a mesma Poder360 (06/09/2026), seu grupo político planejaria divulgar um 'arsenal de suspeitas
  de ilegalidades' contra o senador Flávio Bolsonaro cerca de 20 dias antes do 1º turno da eleição, incluindo
  extensão da delação de Antonio Carlos Freixo Júnior sobre o filme 'Dark Horse' — apuração de um único
  veículo, não confirmada por fonte independente.
