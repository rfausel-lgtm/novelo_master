- kind: version
  summary: 'Após a decisão de Mendonça que afastou Andrei Rodrigues, recebeu no Palácio da Alvorada, em
    08/09/2026, o Advogado-Geral da União Jorge Messias e o ministro da Justiça Wellington César Lima
    e Silva. O líder do governo na Câmara, José Guimarães, declarou sobre a decisão de Mendonça: ''essa
    medida me cheira como eleitoral. Isso não pode!'''
  source_ids:
