summary: Presidente da República. Recebeu Daniel Vorcaro no Palácio do Planalto em 04/12/2024, em encontro
  fora da agenda oficial articulado por Guido Mantega, com a participação de Gabriel Galípolo e de ministros;
  confirmou o encontro em entrevista ao UOL e afirmou ter dito ao banqueiro que 'não haverá posição política
  pró ou contra o Banco Master'. A Presidência informou, por LAI, não ter produzido registros da reunião.
  Em 03/09/2026, fez sua primeira manifestação pública sobre a crise institucional aberta pelas mensagens
  Vorcaro-Moraes, chamando o caso Master de 'o maior roubo da história do Brasil', defendendo reforma
  do Judiciário e cobrando apuração 'doa a quem doer'.
why_in_novelo: Recebeu Daniel Vorcaro em reunião fora da agenda no Palácio do Planalto em dezembro de
  2024, fato confirmado pelo próprio presidente.
cited_position:
- kind: version
  summary: Em entrevista ao UOL, conforme a Gazeta do Povo e a Brasil Paralelo, Lula confirmou o encontro
    e disse que Vorcaro relatou perseguição; afirmou ter respondido que haveria apenas investigação técnica
    do Banco Central, sem posição política; em evento em Maceió disse que 'falta vergonha na cara' de
    quem defende Vorcaro (CNN).
  source_ids:
