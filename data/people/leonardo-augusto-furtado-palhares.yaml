open_questions:
- 'A Polícia Federal e a imprensa o descrevem por vezes como ''operador financeiro'' de Vorcaro, mas a
  decisão do STF e o requerimento do Senado são mais específicos: ele é o operador jurídico-documental
  — quem redigia e assinava os instrumentos —, enquanto a execução das movimentações financeiras é atribuída
  a Ana Cláudia Queiroz de Paiva. A distinção importa e o corpus a preserva.'
- 'Hipótese de identidade não confirmada, mas REFORÇADA (lote 180): um advogado homônimo, atuante em direito
  digital e ex-presidente da câmara brasileira de comércio eletrônico, assina como ''Leonardo A. F. Palhares''
  e tem perfil compatível em base, idade e área de atuação — mas nenhuma reportagem sobre o caso fazia essa
  ligação, os endereços empresariais não coincidem e não há CPF público do segundo para cruzamento. O dossiê
  interno do BC (e-Doc 7 da PET 15.556) cita, como material de apoio ao relato de Belline Santana, um link
  para ''camara-e.net/leonardo-palhares-e-reeleito-presidente-da-camara-e-net'' — ou seja, os próprios
  investigadores do BC associaram esse ''Leonardo Palhares'' à Câmara e.Net (câmara de comércio eletrônico)
  ao apurar o caso da Varajo. Isso aproxima as duas pontas da hipótese sem fechá-la: pode ser o mesmo
  ''Leonardo Palhares'' descrito de duas formas, ou o investigado pode ter se apresentado a Belline citando
  vínculo com a entidade sem de fato presidi-la. Registrado como pendência reforçada, não como conclusão.'
- Não foi localizada explicação para sua entrada na diretoria da Super Empreendimentos exatamente no mês
  em que Fabiano Zettel deixou a empresa, nem reconstituição de como e quando passou a atuar para Daniel
  Vorcaro.
- 'Convocado pela CPI do Crime Organizado para 01/04/2026, nunca depôs: a reunião foi cancelada sem que
  a presidência da comissão divulgasse o motivo, e o relatório final da CPI foi rejeitado duas semanas
  depois.'
- Não foi localizada denúncia formal da PGR contra ele até a data desta apuração, nem decisão posterior
  que revogue, substitua ou agrave suas cautelares — a presunção razoável é que sigam vigentes, mas isso
  não está confirmado documentalmente.
- 'Ele entrou na diretoria da Super Empreendimentos em julho de 2024: parte relevante dos repasses atribuídos
  à empresa, incluindo os pagamentos mensais ao grupo ''A Turma'' e os cerca de R$ 68,6 milhões declarados
  por Vorcaro em 2023, é anterior ao seu mandato.'
- 'Alerta de precisão: o número de inscrição OAB/MG 79456, atribuído a ele por resultado de busca, pertence
  a outra pessoa — o dado é falso e não deve ser reproduzido. Seu registro profissional não foi confirmado.'
