id: leonardo-augusto-furtado-palhares
kind: person
name: Leonardo Augusto Furtado Palhares
category: businessperson
role: Advogado; sócio único da Varajo Consultoria, diretor da Super Empreendimentos e da associação SOLAR;
  investigado sob cautelares na Operação Compliance Zero
positions: []
summary: 'Advogado, com CPF terminado em 356 registrado de forma idêntica nos três CNPJs em que figura,
  e faixa etária entre 41 e 50 anos segundo a Receita Federal. É sócio único e administrador da Varajo
  Consultoria Empresarial Sociedade Unipessoal Ltda (CNPJ 39.665.366/0001-15), aberta em 04/11/2020, com
  capital social de R$ 10 mil e sede em endereço de coworking na Avenida Paulista. A decisão da PET 15.556,
  lida integralmente pela equipe, dedica-lhe seção própria e o descreve como quem assinou a proposta de
  contratação do servidor do Banco Central Belline Santana para um suposto estudo sobre inserção de jovens
  no mercado financeiro, conferindo ''aparência de legitimidade à contratação'' e possibilitando ''a utilização
  da pessoa jurídica como intermediária''; a petição da Polícia Federal, transcrita na decisão, sustenta
  que as vantagens indevidas aos servidores do BC passavam pela ''estrutura de lavagem de dinheiro orquestrada
  com o auxílio'' dele, sendo as contas da Varajo a ''conta de passagem'' dos recebimentos ilícitos. Não
  foi preso: cumpre, desde 03/03/2026, proibição de contato com investigados, proibição de deixar o município
  e o País com entrega do passaporte, e monitoração eletrônica por tornozeleira. A sindicância do Banco
  Central apurou dois contratos entre Belline e a Varajo somando cerca de R$ 4 milhões, classificados
  como ''negócio simulado''. Além da Varajo, é diretor da Super Empreendimentos e Participações desde
  23/07/2024 — mesmo mês da saída de Fabiano Zettel — e diretor único da associação SOLAR, aberta em fevereiro
  de 2025, que gere recursos de uma ONG representada por uma filha menor de idade de Daniel Vorcaro. Material
  cujo sigilo foi levantado em setembro de 2026 mostra que foi ele quem estruturou, em maio de 2025, as
  minutas do contrato de até R$ 50 milhões entre a Viking Participações e o escritório da esposa do ministro
  Alexandre de Moraes, alertando Vorcaro sobre o ''risco reputacional'' da operação.'
why_in_novelo: 'É o operador jurídico-documental do esquema: quem redigia e assinava os instrumentos que
  davam aparência de legalidade aos pagamentos — do contrato apontado como fictício para remunerar um
  servidor do Banco Central às minutas do contrato com o escritório da esposa de um ministro do STF.'
