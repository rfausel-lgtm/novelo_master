  summary: Não foi localizada nenhuma manifestação dele, de advogado seu ou da Varajo Consultoria. Reportagens
    que trataram das acusações registram explicitamente que 'outras defesas não se manifestaram até a
    publicação' e que ele não respondeu aos pedidos de comentário. O nome de seu advogado não foi localizado,
    nem qualquer petição pública em seu nome na PET 15.556.
