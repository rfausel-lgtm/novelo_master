role: Governador da Bahia desde 2023; candidato à reeleição
positions: []
summary: Governador da Bahia desde 2023. NÃO é alvo, investigado ou citado nominalmente em peça policial
  do caso. Sob sua gestão, entre maio de 2024 e novembro de 2025, o Estado repassou R$ 140,1 milhões à
  ASSEBA, associação de servidores da saúde ligada a Augusto Lima, segundo relatório do Coaf enviado à
  CPI do Crime Organizado — repasses que o governo baiano sustenta serem descontos em folha de taxa de
  associação autorizados pelos próprios servidores, e não recursos do erário. Em março de 2026 submeteu
  o contrato do CredCesta à Procuradoria-Geral do Estado e passou a avaliar sua revogação, afirmando que
  a prioridade é proteger os servidores; antes sustentara que, sendo o programa administrado pela iniciativa
  privada desde 2018, não caberia falar em falhas do Estado. Eduardo Mendonça Sodré Martins, enteado de
  Jaques Wagner e nomeado na representação da PF como intermediário, é secretário de Meio Ambiente de
  seu governo — vínculo funcional que não implica imputação ao governador.
why_in_novelo: Chefe do Executivo estadual no período dos repasses à ASSEBA apontados pelo Coaf, e responsável
  pela decisão sobre a continuidade do contrato do CredCesta.
cited_position:
