  summary: 'Por nota do governo do Estado: ''Não é verdade que o governo injetou 140 milhões em uma associação
    de servidores controlada por Augusto Lima.'' Sustenta que os valores são descontos em folha da taxa
    de associação, autorizados pelos próprios servidores.'
