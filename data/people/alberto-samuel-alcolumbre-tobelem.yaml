open_questions:
- O parentesco com o senador Davi Alcolumbre é afirmado pela imprensa; a equipe não o confirmou em documento
  oficial.
- As datas exatas de entrada e saída nos colegiados da Amprev não foram lidas pela equipe nos decretos
  correspondentes.
- Não há defesa pública localizada.
- 'Achado em 13/09/2026: a assessoria de Davi Alcolumbre classificou como "falsa e irresponsável qualquer
  tentativa de vincular o presidente do Senado a essas nomeações ou decisões" — nota institucional sobre
  o senador, não uma manifestação pessoal dele sobre seu próprio papel nos colegiados da Amprev. A apuração
  da PF/MP-AP sobre o alerta ignorado, até esta coleta, não resultou em ato concreto (indiciamento, cautelar)
  contra ele especificamente.'
