summary: Advogado, nomeado presidente da Junta Comercial do Estado do Amapá pelo Decreto nº 0019, de 02/01/2023
  — publicado na mesma edição do Diário Oficial e com a mesma data do decreto que nomeou Jocildo Silva
  Lemos para a Amprev. Integrou o Conselho Estadual de Previdência do Amapá em 2023-2024 como representante
  do Poder Executivo e, a partir de 2025, passou ao Conselho Fiscal da própria Amprev — órgão de fiscalização
  criado depois das três deliberações do Comitê de Investimentos, em julho de 2024, que aprovaram cerca
  de R$ 400 milhões em letras do Banco Master. O expediente do Diário Oficial de 11/02/2026 ainda o registra
  à frente da Junta Comercial. Reportagens de fevereiro de 2026 (Gazeta do Povo, O Tempo) identificam-no
  como irmão do senador Davi Alcolumbre e relatam que a PF e o Ministério Público do Amapá apuram se o
  fundo foi formalmente alertado sobre riscos antes de aportar os recursos — nominalmente o alerta do
  conselheiro Gláucio Bezerra, em reunião de 30/07/2024, sobre "um problema envolvendo questão política
  e de governança junto à Caixa Econômica Federal" do emissor. **Não é investigado, indiciado, acusado
  nem réu** em nenhuma apuração relativa ao Banco Master, e não integrava o Comitê de Investimentos, colegiado
  que deliberou as aplicações — nem o corpus localizou ata que o situe presente na reunião do alerta.
why_in_novelo: Ocupa cargos de nomeação do mesmo governador e no mesmo período do dirigente investigado,
  inclusive assento em colegiado de fiscalização da autarquia que aplicou R$ 400 milhões no Banco Master.
cited_position:
- kind: not_located
  summary: Defesa não localizada. A Gazeta do Povo registra que ele foi procurado e não se manifestou
    até a publicação.
  source_ids:
