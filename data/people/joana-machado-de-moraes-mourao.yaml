role: Parente de Luiz Phillipi Machado de Moraes Mourão; requereu restituição de veículo apreendido
summary: Requereu ao STF, em 29/05/2026, a restituição de um Range Rover SE 4x4 (placa TYM9F99) apreendido
  durante busca e apreensão contra Luiz Phillipi Machado de Moraes Mourão — de quem compartilha o
  sobrenome, sugerindo parentesco não esclarecido no corpus. Alega ser proprietária de boa-fé; a PGR opinou
  pelo indeferimento, por suspeita de que o veículo tenha sido comprado com recursos de origem ilícita
  ligados a Mourão, e observou que ela não apresentou informações sobre a origem dos recursos usados na compra.
why_in_novelo: É requerente de restituição de bem apreendido na investigação sobre o núcleo de intimidação
  "A Turma", ligado por sobrenome a Luiz Phillipi Mourão, líder do grupo.
