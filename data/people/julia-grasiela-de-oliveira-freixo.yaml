id: julia-grasiela-de-oliveira-freixo
kind: person
category: other
name: Julia Grasiela de Oliveira Freixo
role: Alvo de busca e apreensão na PET 15.198 (Banco Master), no mesmo endereço de Antonio Carlos Freixo
  Júnior
summary: Nomeada entre os 39 alvos complementares de busca e apreensão da decisão de Dias Toffoli de
  08/01/2026 na PET 15.198, no mesmo endereço, em São Paulo, de Antonio Carlos Freixo Júnior ("Mineiro").
  Em 14/01/2026, peticionou em conjunto com ele pedindo acesso aos autos e apensos, por meio das mesmas
  advogadas.
why_in_novelo: Compartilha sobrenome e endereço com Antonio Carlos Freixo Júnior — delator premiado do
  caso Master — e peticionou ao lado dele no mesmo dia, mas nenhuma peça lida afirma expressamente qual é
  o vínculo entre os dois.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica dela foi localizada no corpus, além da petição conjunta
    de habilitação nos autos.
open_questions:
- 'Vínculo com Antonio Carlos Freixo Júnior não confirmado em documento: o sobrenome e o endereço
  compartilhados sugerem parentesco (possivelmente cônjuge), mas nenhuma peça lida afirma isso
  expressamente — tratado como hipótese, não fato.'
- Por que ela foi incluída entre os alvos de busca, além da coincidência de endereço com Antonio Carlos
  Freixo Júnior, não está explicado nas peças lidas.
