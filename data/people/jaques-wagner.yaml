open_questions:
- O relatório da PF de 30/07/2026 (PDF de 33 MB) não foi lido pela equipe; o corpus registra a síntese
  do Poder360.
- O corpus não contém denúncia ou decisão de mérito sobre o senador.
- 'Resolvida a divergência sobre a empresa da família: BN Financeira e BK Financeira são a mesma pessoa
  jurídica — razão social e nome fantasia do CNPJ 42.645.396/0001-74. Empresa distinta, da mesma sócia,
  é a BN Representações Tecnológicas, antiga Vamos Florir Comércio de Flores. Os valores também se reconciliam:
  R$ 3,5 milhões é uma transferência documentada de outubro de 2025; R$ 11 milhões, o acumulado alegado
  de 2022 a 2025. O número de R$ 5,5 milhões não existe nos autos.'
- 'Valores apreendidos na busca de 18/06/2026 (US$ 55 mil, € 33 mil): defesa alega origem lícita e pede
  anulação da medida ao STF — pendente de decisão.'
- Mendonça registrou, ao publicizar a Pet 16.210, uma coincidência tratada como possível indício de vazamento
  (pedido de audiência de investigado no mesmo dia da chegada das representações da PF) — sem conclusão
  sobre autoria.
- A representação por quebra de decoro contra ele, no Conselho de Ética do Senado, não avança por paralisia
  estrutural do próprio órgão desde 2024 — não por decisão específica sobre o mérito do caso.
- Em entrevista de 08/09/2026, atribuiu o escândalo a Bolsonaro/Campos Neto, chamou Vorcaro de 'marginal'
  e citou 'setenta e tantos milhões' como valor dado por Vorcaro a Flávio Bolsonaro.
- Reportagens (O Antagonista/DCM, Jornal Sete, Metrópoles) identificam Eduardo Mendonça Sodré Martins,
  alcunha 'Dudu', como o enteado a quem a PF atribui R$ 2,34 milhões (fato já classe D no corpus, antes
  sem nome) — identificação nominal não confirmada por leitura direta de documento primário, e não reconciliada
  com o quadro societário já conhecido da BN Financeira.
- O advogado Ângelo Rezende, que o representa, é apontado por reportagem do UOL (replicada) como sócio
  indireto da PKL One Participações — não verificado por consulta direta a registro societário público.
- 'Confirmado, por leitura direta: o parecer da PGR de 16/06/2026 (ASSCRIM nº 940922/2026) foi assinado
  por Paulo Gonet, e se opôs especificamente à busca no gabinete parlamentar (separação de poderes) e
  à apreensão de bens de luxo (desproporcionalidade) — não à operação como um todo. Mendonça não acolheu
  integralmente essa posição.'
- 'Confirmado, por leitura direta da decisão de Mendonça na Pet 16.229 (item I.3, §34): o enteado citado
  pela PF é Eduardo Mendonça Sodré Martins, e a mensagem ''amanhã vence os boletos e são altos'' é dele,
  de 04/09/2025, dirigida a Augusto Lima — a decisão não formula um valor ''total'' somando a transferência
  de R$ 3,5 milhões com os R$ 2,34 milhões atribuídos a ele; qualquer soma consolidada citada pela imprensa
  é inferência jornalística, não afirmação do documento.'
