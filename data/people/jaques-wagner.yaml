summary: 'Senador pela Bahia e líder do governo no Senado. Em 14/08/2024 pediu vista da PEC 65/2023 na
  CCJ. Em 18/06/2026 foi alvo de busca e apreensão na 9ª fase da Compliance Zero, autorizada por André
  Mendonça, que apura corrupção e lavagem; não respondeu ao Poder360 na ocasião. Seu depoimento à PF,
  marcado para 07/08/2026, foi adiado a pedido da defesa por falta de acesso aos autos, sem nova data
  marcada até setembro de 2026. Confirmou candidatura à reeleição pela Bahia e negou publicamente qualquer
  negócio com o Master ou com Augusto Lima; Lula o defendeu nominalmente. É citado no relatório da PF
  que embasou a decisão de Moraes contra Mendonça em 03/09/2026, apenas como referência comparativa de
  prazo processual. Apuração posterior da equipe esclarece o ponto mais mal reportado da frente: a Emenda
  nº 30 à MP 1.106/2022, de autoria dele, propunha um TETO de juros — 300% do CDI — e não a ampliação
  de margem consignável, e não foi incorporada ao texto final. O que a PF lhe imputa, em suas próprias
  expressões, é correlação temporal e de comportamento: ele é ''interlocutor relevante'', sua participação
  na pauta é ''elemento de correlação'', e o fluxo de mensagens sugere, ''em juízo preliminar'', ''relação
  funcionalmente direcionada e não meramente social''. Até setembro de 2026 não houve depoimento, indiciamento,
  denúncia nem arquivamento; a 10ª fase da operação não o teve como alvo. Ele segue senador e disputa
  a reeleição — na mesma chapa de Rui Costa.'
why_in_novelo: Foi alvo de busca e apreensão na 9ª fase da Operação Compliance Zero, segundo a imprensa,
  e atuou na tramitação da PEC 65/2023 no Senado.
