role: Ex-assessora do ex-presidente da Câmara Arthur Lira; apontada pela PF como operadora do esquema de
  destinação de emendas parlamentares investigado na Operação Transparência
positions: []
summary: Ex-assessora de Arthur Lira na Câmara dos Deputados. Segundo a Polícia Federal (Operação
  Transparência), enviava a Cezinha de Madureira memoriais de processos sob relatoria de ministros do STF
  (entre eles Kassio Nunes Marques) e preparava contratos de honorários de êxito, condicionados ao
  resultado de julgamentos, com valores entre R$ 500 mil e R$ 2 milhões, em nome do escritório da esposa de
  Cezinha, Valéria Rodrigues Linhares. Teve seu gabinete (como ex-assessora) alvo de busca na primeira fase
  da mesma operação.
why_in_novelo: Apontada pela PF como a operadora que conectava processos sob relatoria de ministros do STF
  aos contratos de honorários condicionados negociados por Cezinha de Madureira e Valéria Linhares — nó
  central do esquema de tráfico de influência investigado na Operação Transparência.
