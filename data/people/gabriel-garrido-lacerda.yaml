name: Gabriel Garrido Lacerda
role: Acusado por Daniel Vorcaro de tê-lo roubado na Venezuela
summary: 'Nacional acusado por Daniel Vorcaro, em setembro de 2024, de tê-lo roubado na Venezuela junto
  com André Flores Tavares ("Esse é pra ir pra c forca"). A análise do chat entre Vorcaro e Felipe Mourão
  (IPJ-A nº 1070759/2026, PET 15.978) mostra que, a partir dessa acusação, "A Turma" compilou dados
  pessoais dele, Mourão mencionou uma "entrada na Interpol" contra ele, e Vorcaro chegou a pedir que
  alguém da Polícia Federal afirmasse, no mesmo dia, haver denúncia de crime contra o sistema financeiro
  envolvendo-o.'
why_in_novelo: É um dos alvos nomeados do aparato de vigilância e pressão de Daniel Vorcaro — não por
  crítica pública ao banco, mas por acusação pessoal de roubo feita pelo próprio Vorcaro, sem elemento
  independente que a sustente.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação dele foi localizada no corpus.
open_questions:
- 'A acusação de roubo é alegação exclusiva de Daniel Vorcaro, sem corroboração independente no acervo:
  não se sabe a natureza da disputa, se houve queixa formal, nem o desfecho da mobilização de "A Turma"
  contra ele.'
