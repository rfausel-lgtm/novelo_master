summary: 'Senador pelo Amapá e presidente do Senado Federal. Consta entre os coautores da PEC 65/2023,
  matéria à qual foi apresentada a emenda sobre o FGC citada pela Polícia Federal. Aparece no novelo por
  uma via indireta e contestada: o então diretor-presidente da Amapá Previdência, Jocildo Silva Lemos,
  atribuiu-lhe publicamente, em duas ocasiões registradas em documentos oficiais da autarquia, o convite
  para assumir o cargo — o que o senador nega em termos categóricos. **Não é investigado, indiciado, acusado
  nem réu** em nenhuma apuração relativa ao Banco Master ou à Amprev, e a decisão judicial que autorizou
  a operação Zona Cinzenta não o menciona uma única vez. Separadamente, a revista Veja noticiou relato
  de proposta de delação — rejeitada pela PF — sobre suposto repasse de US$ 30 milhões, alegação que ele
  nega e que nenhum documento público corrobora.'
why_in_novelo: Preside o Senado e é coautor da PEC 65/2023, matéria à qual foi apresentada a emenda sobre
  o FGC citada pela Polícia Federal.
