open_questions:
- 'HIPÓTESE EM ABERTO (levantada pelo editor, 10/09/2026): há uma possível ligação entre a blindagem que
  Alcolumbre dá a Moraes contra o impeachment e o fato de que dois nomes de peso do próprio partido dele
  (União Brasil) — Antônio Rueda e ACM Neto — são acusados por Vorcaro, em proposta de delação, de cobrar
  comissão de 10% sobre aportes de RPPS ao Master. A equipe NÃO localizou nenhuma fonte que estabeleça relação
  causal ou mesmo correlação direta entre os dois fatos; a proposta de delação (revelada em 10/09/2026) cita
  institutos do Rio, Amapá e Amazonas de forma genérica, sem nomear Alcolumbre nem seu ex-tesoureiro Jocildo
  Lemos. O que está confirmado é apenas a coincidência de partido e o fato de que Alcolumbre, ao ser cobrado
  sobre o impeachment de Moraes, reagiu citando o financiamento do Dark Horse por Vorcaro (lote 167) — não
  uma ligação com o esquema de comissões de Rueda/ACM Neto. Fica como fio a apurar, não como fato estabelecido.
  ANTECEDENTE ENCONTRADO (lote 179): a mesma tese de conflito de interesse já havia sido articulada formalmente
  seis meses antes, em representação individual ao STF de 09/03/2026 (e-Doc 82 da PET 15.556), que pediu seu
  afastamento cautelar da presidência do Senado citando a perda de R$ 400 milhões do Amprev no Master — sem
  que o corpus tenha localizado notícia de que o STF deu seguimento ao pedido.'
- O corpus não registra se e quando o requerimento da CPMI do Master foi lido.
- O senador não é investigado na operação Zona Cinzenta, segundo a CNN; o corpus não contém documento
  que corrobore o relato da Veja.
- Não há documento oficial que registre indicação, ofício ou correspondência dele relativa à nomeação
  de Jocildo Lemos — a atribuição repousa exclusivamente na declaração do nomeado.
- A negativa da assessoria cobre 'nomeações e decisões administrativas'; o corpus não localizou manifestação
  dele sobre a relação pessoal com Jocildo Lemos nem sobre o vínculo de campanha.
