summary: 'Diretor Executivo de Finanças e Controladoria do BRB, cossignatário, ao lado de Paulo Henrique
  Costa e Robério César Bonfim Mangueira, do Ofício PRESI-2025/051 (18/06/2025) — a primeira manifestação
  institucional própria do BRB sobre a aquisição de carteiras do Banco Master já lida diretamente pela
  equipe. Investigado formal no INQ 5.026, com pedido de habilitação de defesa em novembro de 2025. ACHADO
  NOVO (lote 240) — a decisão de 22/06/2026 na PET 15.478 atribui a ele conduta pessoal, não apenas
  institucional: segundo a autoridade policial, já desde novembro/dezembro de 2024 tinha conhecimento de
  inconsistências graves na carteira CREDCESTA (manipulação, ausência de lastro, movimentação atípica de
  créditos entre fundos) e manteve conversas diretas com Paulo Henrique Costa sobre o tema. Segundo o
  Metrópoles, o SBT News e o Congresso em Foco, é um dos cinco ex-dirigentes do BRB alcançados pela
  indisponibilidade cautelar de bens decretada pelo TCDF em 23/09/2026 (Decisão RES nº 361/2026, cautelar,
  sem julgamento de mérito; a nota oficial do tribunal não nomeia os atingidos).'
why_in_novelo: É um dos dirigentes do BRB apontados pelo Ministério Público Federal como responsáveis por
  entregar ao Banco Central a documentação hoje questionada sobre a aquisição de carteiras do Master.
