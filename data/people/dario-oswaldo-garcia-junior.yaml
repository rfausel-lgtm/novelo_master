  summary: Quanto à cautelar do TCDF de 23/09/2026, o Poder360 informou não ter localizado contato válido
    para ele; busca do Novelo em 15/10/2026 por nota de defesa ou manifestação nos autos não localizou
    posição. O prazo de 30 dias dado pelo TCDF tem termo inicial não informado, em princípio ainda em curso.
