summary: 'Diretor Executivo de Finanças e Controladoria do BRB, cossignatário, ao lado de Paulo Henrique
  Costa e Robério César Bonfim Mangueira, do Ofício PRESI-2025/051 (18/06/2025) — a primeira manifestação
  institucional própria do BRB sobre a aquisição de carteiras do Banco Master já lida diretamente pela
  equipe. Investigado formal no INQ 5.026, com pedido de habilitação de defesa em novembro de 2025.'
why_in_novelo: É um dos dirigentes do BRB apontados pelo Ministério Público Federal como responsáveis por
  entregar ao Banco Central a documentação hoje questionada sobre a aquisição de carteiras do Master.
