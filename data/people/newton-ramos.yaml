open_questions:
- Nome completo não confirmado em página do TRF-1 (a página de perfil do tribunal não abriu em 16/10/2026); grafias mais longas do nome encontradas em atos antigos do tribunal e em agência de notícias não foram associadas a ele pelo Novelo, por falta de documento que confirme a identidade.
- Número da sindicância e da reclamação disciplinar; a decisão de 22/09/2026 que, segundo o Metrópoles, instaurou a sindicância não foi localizada.
- Votos atribuídos a ele pela imprensa em processos do setor sucroalcooleiro não verificados (acórdãos não abertos).
- A leitura de "Turma do KN" como referência ao ministro Nunes Marques é da imprensa e não está demonstrada por documento acessível ao Novelo.
