summary: >-
  Desembargador federal do TRF-1. Em nota publicada em 21/09/2026 pelo Metrópoles, afirmou ser casado com a
  advogada Camilla Ramos, "que atua em causas cíveis para o Banco Master", sócia, segundo a Agência Brasil e o
  Times Brasil, do escritório que, segundo o Metrópoles e a CNN Brasil, firmou com o Master contrato de
  honorários de êxito em ações de precatórios do setor sucroalcooleiro. Na mesma nota disse que o casal mantinha
  relação pessoal com Daniel Vorcaro antes dos fatos investigados, mencionou a empresa Prime You e afirmou
  "nunca julguei qualquer causa de interesse do Banco Master". Segundo o Metrópoles e a CNN Brasil, mensagens de
  assessores de Vorcaro referem-se ao casal como "Turma do KN"; a leitura da sigla como referência ao ministro
  Nunes Marques é da imprensa. Em 24/09/2026, segundo a Agência Brasil, o Times Brasil e A Crítica, seu gabinete
  foi objeto de correição extraordinária determinada pelo corregedor nacional de Justiça, com extração de dados
  de equipamentos pela Polícia Federal; segundo o Metrópoles, há sindicância aberta contra ele no CNJ. Continua
  no cargo.
why_in_novelo: Desembargador federal do TRF-1 cujo gabinete foi objeto de correição extraordinária do CNJ em 24/09/2026, segundo a imprensa, e cuja mulher integra o escritório que, segundo a imprensa, firmou contrato de honorários com o Banco Master; ele nega ter julgado causa de interesse do banco.
cited_position:
- kind: clarification
  by_id: newton-ramos
  date: '2026-09-21'
  summary: >-
    Em nota: "Esclareço que sou casado com a advogada Camilla Ramos, que atua em causas cíveis para o Banco
    Master. Vale destacar que mantínhamos relação pessoal com o ex-banqueiro antes dos fatos ora objeto de
    investigação. Em razão da participação societária na empresa Prime You, o empresário foi consultado sobre a
    disponibilidade de imóveis e transportes. Tratou-se de situação privada articulada com a profissional que
    presta serviços para o referido banco, sem qualquer vínculo com funções públicas. Por fim, nunca julguei
    qualquer causa de interesse do Banco Master". A CNN Brasil publica a mesma nota a partir da menção à relação
    pessoal.
