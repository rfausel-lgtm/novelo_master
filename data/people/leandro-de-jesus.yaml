name: Leandro de Jesus
category: politician
role: Deputado estadual pela Bahia (PL), mandato 2023-2027
positions: []
summary: Deputado estadual pela Bahia, pelo PL, com mandato 2023-2027. Advogado e gestor público, nascido
  em Salvador em 19/11/1981, eleito em 2022 com 39.206 votos; em 2026 é candidato a deputado federal.
  Em 19/04/2023 protocolou no Supremo Tribunal Federal a Petição 11.228, notícia-crime contra o então
  ministro da Justiça Flávio Dino e o então ministro-chefe do Gabinete de Segurança Institucional, general
  Marco Edson Gonçalves Dias, por omissão imprópria diante dos atos de 8 de janeiro de 2023. A petição
  ficou 1.219 dias sem movimentação processual pública — fato verificado pela equipe no andamento do STF
  — e foi decidida em 21/08/2026, três dias após reportagem revelar que estava parada. Segundo a reportagem
  que obteve o despacho, que corre sob segredo de justiça, o relator arquivou a acusação e, no mesmo ato,
  determinou que a Polícia Federal o ouvisse por possível comunicação falsa de crime — invertendo a posição
  processual de denunciante para investigado.
why_in_novelo: É o autor da notícia-crime que ficou 1.219 dias sem movimentação no STF e que, ao ser decidida,
  converteu o denunciante em alvo de apuração — episódio que expõe o tratamento processual desigual entre
  três petições sobre os mesmos fatos, todas no mesmo relator.
cited_position:
- kind: version
  summary: 'Em vídeo nas redes sociais, em 09/09/2026: ''Alexandre de Moraes coloca a Polícia Federal
    atrás de mim, para me ouvir e me investigar. Já fiz uma apuração inicial e de fato saiu a determinação
    do Moraes. Ainda não sei as motivações e vou me aprofundar sobre o que está acontecendo''; e ''para
    mim não é surpresa estar na mira do Moraes. Mas quero deixar um recado para os meus apoiadores: não
    vou recuar''. À imprensa baiana, caracterizou a decisão como perseguição política.'
  source_ids:
  - src-bnews-2026-09-09-leandro-de-jesus-pronunciamento
  by_id: leandro-de-jesus
  date: '2026-09-09'
open_questions:
- 'Não há registro público de que a oitiva determinada tenha efetivamente ocorrido: o prazo de quinze
  dias venceria por volta de 05/09/2026, a carta de intimação foi expedida em 25/08/2026, e em 09/09 ele
  declarava ainda não conhecer as motivações da decisão — o que sugere que tomou conhecimento pela imprensa,
  não por intimação cumprida.'
- Como deputado estadual, ele não detém foro por prerrogativa de função perante o STF; não foi localizada
  explicação, no material público, sobre por que eventual apuração a seu respeito permaneceria na Corte
  após o arquivamento da acusação que atraíra o caso.
- O teor integral do despacho não é verificável por terceiros, por correr o processo em segredo de justiça
  — de modo que o corpus registra a determinação de oitiva a partir de reportagem e de movimentos processuais
  compatíveis, não da leitura da decisão.
