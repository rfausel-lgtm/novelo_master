id: joao-manoel-pinho-de-mello
name: João Manoel Pinho de Mello
category: public_official
role: Diretor de Organização do Sistema Financeiro e de Resolução do Banco Central (2019)
summary: Relatou o voto BCB 218/2019, de 14 de outubro de 2019, que aprovou a transferência do controle
  do Banco Máxima, já sob a presidência de Roberto Campos Neto. Segundo o Valor Econômico, o voto registrou
  que a origem dos recursos foi regularmente demonstrada pelos novos acionistas e considerou aportes de
  capital de R$ 100 milhões deliberados entre março e junho daquele ano.
why_in_novelo: Relatou o voto do Banco Central que autorizou Daniel Vorcaro a assumir o controle do banco
  que viria a se chamar Master.
