name: Leandro Almada da Costa
category: police
role: Diretor de Inteligência Policial da PF, afastado junto com Andrei Rodrigues
positions: []
summary: Diretor de Inteligência Policial da Polícia Federal, afastado cautelarmente por 90 dias na mesma
  decisão de André Mendonça de 08/09/2026 que afastou o diretor-geral Andrei Rodrigues — sob a alegação
  de monitoramento ilícito do próprio ministro por meio de relatórios de inteligência produzidos entre
  03 e 31/08/2026.
why_in_novelo: É o segundo nome afastado, junto com o diretor-geral, na decisão de Mendonça que produziu
  nova escalada da crise institucional no STF.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- Reintegrado em 09/09/2026 por decisão de Flávio Dino (Pet 16.669), junto com Andrei Rodrigues, pelos
  mesmos fundamentos — desfecho final não confirmado até a data desta apuração.
- A suspensao determinada pela Presidencia em 09/09/2026 alcanca o ato que o afastou, mas o comando de
  intimacao para prestar informacoes em 48 horas, e a subsequente apreciacao de permanencia reservada
  ao presidente do tribunal, referem-se expressamente apenas a Direcao-Geral. Esclarecer sua situacao
  funcional efetiva.
- A associacao nacional dos delegados da Policia Federal registrou, em nota de 08/09/2026, nao haver inquerito,
  acao penal ou processo disciplinar instaurado contra ele.
