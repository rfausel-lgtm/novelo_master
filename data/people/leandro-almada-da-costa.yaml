open_questions:
- Reintegrado em 09/09/2026 por decisão de Flávio Dino (Pet 16.669), junto com Andrei Rodrigues, pelos
  mesmos fundamentos — desfecho final não confirmado até a data desta apuração.
- A suspensão determinada pela Presidência em 09/09/2026 alcança o ato que o afastou, mas o comando de
  intimação para prestar informações em 48 horas, e a subsequente apreciação de permanência reservada
  ao presidente do tribunal, referem-se expressamente apenas à Direção-Geral. Esclarecer sua situação
  funcional efetiva.
