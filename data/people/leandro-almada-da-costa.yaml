summary: Diretor de Inteligência Policial da Polícia Federal, afastado cautelarmente — por 90 dias, segundo o
  Metrópoles; Poder360 e Estadão falam em afastamento preventivo sem confirmar o prazo — na mesma
  decisão de André Mendonça de 08/09/2026 que afastou o diretor-geral Andrei Rodrigues — sob a alegação
  de monitoramento ilícito do próprio ministro por meio de relatórios de inteligência produzidos entre
  03 e 31/08/2026. Segundo a Agência Brasil (classe A; documento não localizado), a PGR enviou ao STF, na noite
  de 13/10/2026, parecer contrário ao afastamento dele e do diretor-geral Andrei Rodrigues.
why_in_novelo: É o segundo nome afastado, junto com o diretor-geral, na decisão de Mendonça que produziu
  nova escalada da crise institucional no STF.
