summary: 'Ex-procurador do Banco Central por mais de quinze anos e ex-diretor da CVM, hoje sócio-administrador
  da Warde Advogados. Foi advogado pessoal de Daniel Vorcaro desde 2017 e deixou a defesa em janeiro de
  2026. A leitura direta da representação da PF de 27/02/2026 (lote 171) confirma e detalha o episódio:
  na manhã de 17/11/2025, horas antes da operação Compliance Zero, enviou mensagens urgentes a Vorcaro
  às 07h28, recebeu dele o link de matéria de Diego Escosteguy sobre o caso, e no mesmo dia protocolou
  petição pedindo acesso aos autos sigilosos da 10ª Vara Federal citando a matéria como fonte — dizendo
  a Vorcaro estar ''infernizando'' o juiz federal por mensagens diretas de WhatsApp. O escritório nega
  acesso indevido, afirmando que a informação sobre a investigação veio do próprio cliente e de outros
  advogados da defesa.'
why_in_novelo: É o único, entre os advogados identificados, que combina porta giratória regulatória (ex-Banco
  Central, ex-CVM) com alegação direta e grave de proximidade indevida com o Judiciário.
cited_position:
- kind: denial
  summary: O escritório declarou que recebeu a informação sobre a investigação do próprio cliente e de
    outros escritórios que o representavam, negando acesso indevido a informação sigilosa.
