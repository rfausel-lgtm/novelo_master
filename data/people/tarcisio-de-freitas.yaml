summary: Governador de São Paulo (eleito em 2022). Segundo alegação de Daniel Vorcaro em proposta de delação
  premiada rejeitada pela PF e pela PGR em agosto de 2026, R$ 2 milhões doados por Fabiano Zettel à sua
  campanha de 2022 teriam sido propina articulada por Gilberto Kassab para manter o Credcesta em vigor
  no governo estadual. A equipe de Tarcísio negou qualquer vínculo com Vorcaro, afirmando que a campanha
  contou com mais de 600 doadores e seguiu estritamente a legislação eleitoral.
why_in_novelo: Nomeado em alegação de delação rejeitada de Daniel Vorcaro como beneficiário indireto de
  suposto esquema de doações eleitorais ligado ao Credcesta.
