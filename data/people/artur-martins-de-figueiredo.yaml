role: Codiretor da Banvox Holding Financeira S.A. ao lado de Maurício Quadrado
positions: []
summary: Diretor da Banvox Holding Financeira S.A. desde a constituição da sociedade em 2020 (entrada
  registrada em 25/09/2020, dez dias depois da de Maurício Quadrado), segundo registro da Receita Federal.
  A holding emitiu debêntures que capitalizaram o Banco Master, com fiança solidária de Daniel Vorcaro,
  Augusto Lima e Quadrado, e é apontada por apuração jornalística como o veículo pelo qual Nelson Tanure
  teria participação indireta no ecossistema Master.
why_in_novelo: É codiretor, ao lado de Maurício Quadrado, da holding que emitiu as debêntures usadas para
  capitalizar o Banco Master — nome até então não mapeado no acervo, identificado por registro oficial
  da Receita Federal.
