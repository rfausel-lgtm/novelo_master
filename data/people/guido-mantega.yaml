id: guido-mantega
kind: person
name: Guido Mantega
category: businessperson
role: Ex-ministro da Fazenda; consultor do Banco Master, segundo a imprensa
positions: []
summary: Ex-ministro da Fazenda. Segundo CNN Brasil, Gazeta do Povo e Brasil Paralelo, prestava consultoria
  ao Banco Master e articulou o encontro de 04/12/2024 entre Vorcaro e Lula no Planalto, chegando acompanhado
  do banqueiro e de Augusto Lima; teria ido ao Planalto ao menos seis vezes, recebido pelo chefe de gabinete
  de Lula. Sua empresa, a Pollaris Consultoria, aberta em 30/04/2024 e transferida em setembro do mesmo
  ano para Barueri, recebeu R$ 14 milhões do Banco Master entre 2024 e 2025, segundo registros da Receita
  Federal confirmados no relatório final da CPI do Crime Organizado — que ressalva que os pagamentos,
  isoladamente, não configuram a priori prática ilícita. Não é indiciado no relatório da CPI, não consta
  do relatório da PF sobre o celular de Vorcaro e não foi localizado como alvo de operação ou indiciamento.
why_in_novelo: É apontado pela imprensa como consultor do Banco Master e articulador do encontro de dezembro
  de 2024 entre Daniel Vorcaro e o presidente Lula.
cited_position:
- kind: clarification
  summary: Afirmou que foi contratado como consultor entre 2024 e 2025 mas que, à época, 'não tinha conhecimento
    de irregularidades eventualmente cometidas' pelo banco; que 'a Pollaris é uma empresa registrada em
    meu nome, que emite notas fiscais e paga os tributos devidos'; que não mantém sala fixa porque o trabalho
    é feito 'principalmente por videoconferências e reuniões nos escritórios dos clientes'; e que não
    escolheu Barueri 'com a finalidade de reduzir carga tributária', por ser o município 'um grande centro
    de bancos e empresas de serviços'.
