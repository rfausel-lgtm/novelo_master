name: Guido Mantega
category: businessperson
role: Ex-ministro da Fazenda; consultor do Banco Master, segundo a imprensa
positions: []
summary: 'Ex-ministro da Fazenda. Segundo CNN Brasil, Gazeta do Povo e Brasil Paralelo, prestava consultoria
  ao Banco Master e articulou o encontro de 04/12/2024 entre Vorcaro e Lula no Planalto, chegando acompanhado
  do banqueiro e de Augusto Lima; teria ido ao Planalto ao menos seis vezes, recebido pelo chefe de gabinete
  de Lula. Segundo o Metrópoles, sua tarefa concreta no Master era ''azeitar a venda da empresa de Vorcaro
  para o Banco de Brasília (BRB)'' — a descrição mais precisa disponível sobre o escopo do trabalho. Sua
  empresa, a Pollaris Consultoria, aberta em 30/04/2024 e transferida em setembro do mesmo ano para Barueri,
  recebeu R$ 14 milhões do Banco Master entre 2024 e 2025, segundo registros da Receita Federal enviados
  à CPI do Crime Organizado e citados no relatório do relator Alessandro Vieira — relatório rejeitado
  por 6 votos a 4 pela própria comissão em 14/04/2026, portanto não uma conclusão oficial, ainda que os
  dados da Receita ali anexados sejam formais. Reportagens do Metrópoles trazem valores e prazos que não
  se reconciliam entre si nem com a declaração do próprio Mantega: ele afirma (08/04/2026) que o contrato
  formal terminou em agosto de 2025, enquanto outra coluna do mesmo veículo (24/01/2026) fala em lobby
  pelo Master até novembro de 2025, por R$ 1 milhão/mês, ''ao menos R$ 16 milhões'' no período — valor
  que aparece como R$ 11 milhões em uma réplica do mesmo texto por outro veículo, e cuja aritmética (R$
  1 milhão × 5 meses = R$ 5 milhões) não bate com o total citado. ACHADO POR LEITURA DIRETA: o nome ''Mantega''
  não aparece nenhuma vez nas 218 páginas do relatório da PF sobre o celular de Vorcaro, verificação cruzada
  contra outras contagens já publicadas do mesmo documento (''Moraes'': 109, ''Alcolumbre'': 0), que batem
  exatamente — indício, não prova, de que a relação foi majoritariamente institucional, sem contato pessoal
  direto identificado. Não é indiciado no relatório da CPI, não consta do relatório da PF sobre o celular
  de Vorcaro e não foi localizado como alvo de operação ou indiciamento.'
why_in_novelo: É apontado pela imprensa como consultor do Banco Master e articulador do encontro de dezembro
  de 2024 entre Daniel Vorcaro e o presidente Lula.
cited_position:
- kind: clarification
  summary: Afirmou que foi contratado como consultor entre 2024 e 2025 mas que, à época, 'não tinha conhecimento
    de irregularidades eventualmente cometidas' pelo banco; que 'a Pollaris é uma empresa registrada em
    meu nome, que emite notas fiscais e paga os tributos devidos'; que não mantém sala fixa porque o trabalho
    é feito 'principalmente por videoconferências e reuniões nos escritórios dos clientes'; e que não
    escolheu Barueri 'com a finalidade de reduzir carga tributária', por ser o município 'um grande centro
    de bancos e empresas de serviços'.
