open_questions:
- A posição de Mantega sobre a consultoria e o encontro não foi localizada em fonte verificada do corpus
  além das notas já citadas; o valor da consultoria (R$ 1 milhão mensal, segundo a imprensa) não foi confirmado
  em documento.
- Os valores e prazos do contrato da Pollaris (R$ 14mi/16mi/11mi; fim em agosto ou lobby até novembro
  de 2025) não foram reconciliados por nenhuma fonte disponível — inclusive dentro do próprio Metrópoles,
  que publicou as duas versões conflitantes.
- Não foi localizado qualquer indício de contato pessoal direto (mensagem, encontro informal, viagem)
  entre Mantega e Vorcaro além da mediação institucional já registrada.
