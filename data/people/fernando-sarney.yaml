summary: Empresário maranhense, filho do ex-presidente José Sarney. Apontado por Karina Ferreira da Gama, em ata
  notarial apreendida pela Polícia Federal na Operação Make Up (10/09/2026), como uma das pessoas que a teriam pressionado
  a depor contra o senador Flávio Bolsonaro sob ameaça de prisão. Nega qualquer contato com ela.
why_in_novelo: É apontado, em documento apreendido pela PF, como um dos supostos articuladores de pressão sobre
  uma testemunha-chave do financiamento do filme 'Dark Horse' — episódio que toca diretamente a apuração do dinheiro
  de Daniel Vorcaro no filme.
