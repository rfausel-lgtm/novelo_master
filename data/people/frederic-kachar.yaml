summary: "Executivo do Grupo Globo por 29 anos, segundo a nota da empresa: dirigiu a Editora Globo desde 2008,
  a Infoglobo desde 2015 e o Sistema Globo de Rádio desde 2020. Em 15/10/2026 o grupo comunicou seu
  desligamento, dizendo que conversas privadas dele com Daniel Vorcaro (outubro de 2023 a julho de 2025)
  revelaram relação inadequada com um anunciante. Segundo o UOL (15/10/2026), as mensagens extraídas pela PF
  tratam de patrocínios do Master a eventos do grupo e de reclamações de Vorcaro sobre a cobertura, às quais
  Kachar respondeu defendendo os repórteres; a Gazeta do Povo diz ter confirmado as conversas e que não há
  confirmação de que a cobertura tenha sido modificada. Não há acusação formal contra ele."
why_in_novelo: Executivo desligado pelo Grupo Globo em 15/10/2026 por conversas com Daniel Vorcaro, segundo nota da empresa.
