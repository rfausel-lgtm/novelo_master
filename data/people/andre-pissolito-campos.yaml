id: andre-pissolito-campos
kind: person
name: André Pissolito Campos
category: businessperson
role: Alvo de constrição na PET 16.230, no eixo do apartamento Poème Horto
positions: []
summary: Alvo de constrição patrimonial na PET 16.230 (item I.20, teto de R$ 2.455.250, eixo do apartamento Poème
  Horto). A decisão de 19/06/2026 relata que Daniel Lopes Monteiro lhe encaminhou documentos e depois lhe cobrou
  o envio do contrato de compra e venda e do instrumento de cessão de direitos aquisitivos referentes à unidade
  1.702, descrevendo sua atuação como inserida no circuito jurídico-documental de formalização ou reorganização
  dos direitos sobre o imóvel. Em 21/07/2026, a PGR opinou pelo levantamento do bloqueio, com vedação a novos bloqueios
  sobre a mesma rubrica. Segundo o termo de oitiva de 16/07/2026, é ex-sócio de Daniel Lopes Monteiro.
why_in_novelo: É alvo de constrição patrimonial na PET 16.230 no eixo do apartamento Poème Horto, com parecer favorável
  da PGR ao levantamento do bloqueio ainda sem decisão.
