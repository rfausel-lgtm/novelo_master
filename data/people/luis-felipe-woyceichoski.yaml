name: Luís Felipe Woyceichoski
category: other
role: Ex-funcionário de Daniel Vorcaro (capitão de embarcação)
summary: 'Ex-funcionário de Daniel Vorcaro, capitão da embarcação do banqueiro. Segundo a representação da PF de
  27/02/2026, foi alvo de campanha de intimidação determinada por Vorcaro a partir de 28/05/2024, após um episódio
  descrito nas mensagens como ''extorsão''. Vorcaro determinou levantamento de dados sobre ele e sua família e ordenou
  que a Turma ''desse um sacode'' nele; em 11/07/2025, segundo relato do próprio Woyceichoski em gravação obtida pela
  investigação, sete pessoas identificadas por ele como milicianos foram até a marina onde trabalhava e o ameaçaram
  de morte, a ele e à família, em nome de Vorcaro. DETALHADO PELA DECISÃO DA 6ª FASE (13/05/2026, lote 192, PET
  15.978): a mesma campanha teve um episódio concreto em 04/06/2024, na Marina Bracuhy e no Hotel Nacional Inn,
  em Angra dos Reis/RJ, executado por grupo de cerca de sete homens que incluía Luiz Phillipi Mourão e Manoel
  Mendes Rodrigues (''amigo de Daniel Vorcaro'', segundo o próprio agressor se identificou, ligado ao jogo do
  bicho) — também atingiu Leandro Garcia e teve testemunha em Tatiana Dantas Carta. RESOLVIDO EM PARTE (lote
  199, manifestação da PGR de 05/05/2026, e-Doc 26): duas fontes independentes da PET 15.978 (a decisão do
  lote 192 e esta manifestação da PGR) convergem em 04/06/2024 como data da ameaça em Angra dos Reis, com
  riqueza de detalhe coincidente — Fabiano Zettel enviado junto ao grupo por ordem de Vorcaro, confirmação
  de ''100% resolvido'' por Zettel no mesmo dia, e a própria gravação em áudio de Woyceichoski (''Sete
  milicianos... Me ameaçaram de morte. A mim e a minha família. Em nome do próprio Daniel Vorcaro'') —
  que, segundo esta manifestação, Vorcaro enviou a Felipe Mourão em 11/07/2024 (não 2025). Dado esse duplo
  alinhamento entre fontes da mesma apuração, o mais provável é que 04/06/2024 seja a data correta e que
  ''11/07/2025'', na representação de 27/02/2026 (PET 15.556), decorra de erro de transcrição do ano — mas
  o corpus não confirmou isso diretamente com aquele documento, e a hipótese de dois episódios distintos
  não pode ser descartada com certeza. A EXTRAÇÃO DO CELULAR DE VORCARO (lote 203) esclarece a origem do
  áudio em que ele relata a ameaça: são 25 minutos de conversa, aparentemente captação de ambiente, entre
  ele e provavelmente Marcus Vinícius da Mata, presidente da Solar Administração de Bem Próprio S.A. —
  empresa em que atuava como comandante. No relato, diz ter os nomes e contatos de quem lhe telefonou
  para adverti-lo, identificando dois deles como Naldo Armando e Emanuel Luiz. Ao repassar o áudio a
  Mourão, Vorcaro pediu que o apagasse ("preciso que você apague e não mande pra ninguém. Vou ter
  problema com esse cara") e avaliou: "tiro saiu pela culatra. Esse cara era o principal". A DECISÃO DE BUSCAS
  DA PET 15.562 (03/03/2026, lote 251) o incluiu entre os alvos de busca e apreensão sem que figurasse como
  investigado, com a finalidade exclusiva de apreender vídeos e contatos que ele teria declarado guardar sobre a
  Turma, a quem se refere como milícia.'
why_in_novelo: É a vítima nomeada de um episódio concreto de ameaça de morte determinada por Daniel Vorcaro e executada
  pelo núcleo de intimidação 'A Turma', segundo a representação da PF que fundamentou a prisão preventiva de Vorcaro
  e de Luiz Phillipi Mourão.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública dele foi localizada no corpus até a data desta apuração; o relato de ameaça
    consta da transcrição de um áudio dele obtido pela investigação, não de declaração pública própria.
open_questions:
- O corpus não localizou notícia de imprensa sobre este episódio específico antes da leitura direta da representação
  da PF; não há registro de boletim de ocorrência ou processo próprio dele contra Vorcaro.
- 'Divergência de data parcialmente esclarecida (lote 199): duas peças da PET 15.978 (decisão do lote 192 e
  manifestação da PGR) convergem em 04/06/2024; só a representação isolada de 27/02/2026 (PET 15.556) cita
  11/07/2025. Provável erro de ano naquele documento, mas não confirmado diretamente.'
