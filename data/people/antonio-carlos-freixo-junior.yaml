id: antonio-carlos-freixo-junior
kind: person
name: Antonio Carlos Freixo Júnior
category: businessperson
role: Diretor da Entre Investimentos ('Mineiro'), condenado pela CVM e delator premiado da PGR no caso
  Master
positions: []
summary: Fundador e diretor da Entre Investimentos e Participações desde 26/03/2018, conhecido como 'Mineiro'.
  Apontado como o operador que intermediou as remessas de recursos ligados a Daniel Vorcaro ao Havengate
  Development Fund, destinadas ao financiamento do filme 'Dark Horse'. Em 03/09/2026 fechou acordo de
  colaboração premiada com a PGR — a segunda delação do caso, após a de João Carlos Mansur. Segundo o
  acordo, confirmou as transferências ao fundo administrado por Paulo Calixto, mas alegou desconhecer
  a destinação final dos recursos; relatou ter operado transferências que considerava 'não ortodoxas',
  incluindo repasses sem lastro documental e movimentação de dinheiro em espécie. Segundo trecho vazado
  da própria colaboração, reportado pela imprensa (não confirmado pela equipe em documento primário),
  teria movimentado cerca de US$ 1 bilhão para Vorcaro através de sua rede de operações, incluindo repasses
  relacionados a Flávio Bolsonaro — extensão, em nova ordem de grandeza, do que já era conhecido sobre
  o financiamento do filme 'Dark Horse'. Separadamente, foi condenado pela CVM em 08/09/2026 a R$ 5 milhões
  de multa por operação fraudulenta no Brazil Realty FII — a Entre atuou, segundo a CVM, como 'câmara
  de liquidação' das cotas fraudadas, realizando 177 operações no mercado secundário entre 2018 e 2020.
  Propôs termo de compromisso de R$ 2,47 milhões, rejeitado pelo colegiado.
why_in_novelo: Firmou a segunda delação premiada do caso Banco Master, sobre os repasses ao filme 'Dark
  Horse' — e é, separadamente, o operador que a CVM identifica como responsável pela 'câmara de liquidação'
  de cotas fraudadas do Brazil Realty FII, duas frentes distintas do mesmo personagem.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- Seu acordo de colaboração premiada foi assinado com a PGR em 08/08/2026, segundo o Poder360 — a formalização
  e o envio ao STF, amplamente noticiados, ocorreram em 03/09/2026.
- Segundo a Poder360 (06/09/2026), indícios de sua delação estariam entre as bases de um plano do grupo
  político de Lula para divulgar suspeitas contra o senador Flávio Bolsonaro, sugerindo que doações de
  Vorcaro ao filme 'Dark Horse' atribuídas a Jair Bolsonaro teriam sido direcionadas a integrantes da
  família Bolsonaro — extensão específica e ainda não confirmada em documento primário da colaboração,
  distinta do que já está registrado no acervo sobre sua delação.
- 'A colaboração foi homologada pelo relator do caso no Supremo em 09/09/2026, um dia após sua oitiva,
  passando a ter validade processual. O conteúdo confirmado detalha sete transferências somando US$ 12,3
  milhões ao fundo norte-americano, entre fevereiro e setembro de 2025, e o relato de entrega de grandes
  quantias em espécie a pessoas indicadas pelo banqueiro, parte transportada em malas. Segundo uma das
  coberturas, teria afirmado dispor de vídeos das entregas — elemento a apurar, que converteria o relato
  em prova material. Divergência registrada: a data de assinatura do acordo aparece como 08/08/2026 em
  uma cobertura e como 03/09/2026 no registro anterior do corpus.'
