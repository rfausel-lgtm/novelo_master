role: Empresário identificado pela PF como interlocutor de Vorcaro sobre créditos de carbono
positions: []
summary: Empresário que a Polícia Federal identifica, na IPJ-A nº 2290463/2026, como o contato salvo no celular
  de Daniel Vorcaro sob o apelido 'José Antonio Carbono'. Em 22/10/2023 enviou ao banqueiro três emendas ao PL 412/2022,
  de autoria do senador Efraim Filho, dizendo serem 'fundamentais serem aplicadas ao PL'; em 29/10 encaminhou, a
  pedido de Vorcaro, estudos sobre estoques de carbono de uma fazenda no Amazonas, entre eles um relatório de consultoria
  que a própria PF descreve como confidencial e restrito aos proprietários e à empresa que o contratou; e em 08/12
  mandou notícia sobre o tema com a frase 'Nosso projeto'. A PF registra vínculos societários dele em cerca de dez
  empresas. O relatório não lhe imputa crime.
why_in_novelo: É o interlocutor por quem, segundo a análise da PF, o assunto dos créditos de carbono e as emendas
  ao PL 412/2022 chegaram ao celular de Daniel Vorcaro.
