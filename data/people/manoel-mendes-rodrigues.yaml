name: Manoel Mendes Rodrigues
category: other
role: Apontado como 'operador do jogo do bicho' e líder do braço fluminense de 'A Turma'; preso preventivamente
  em 14/05/2026
summary: Preso preventivamente na 6ª fase da Operação Compliance Zero (decisão de 13/05/2026). Descrito pela PF
  como "operador do jogo do bicho" e líder de um braço local de 'A Turma' no Rio de Janeiro, composto por pessoas
  ainda não identificadas, incluindo possivelmente milicianos e policiais. Apontado como executor da campanha de
  intimidação contra Luís Felipe Woyceichoski (capitão da embarcação de Daniel Vorcaro) e Leandro Garcia (ex-chefe
  de cozinha), ocorrida em 04/06/2024 na Marina Bracuhy e no Hotel Nacional Inn, em Angra dos Reis/RJ, a mando de
  Vorcaro — que em 28/05/2024 havia determinado a Luiz Phillipi Mourão o "levantamento de tudo" sobre Woyceichoski
  e Garcia e ordenado que "teriam que ir pra cima". Woyceichoski relatou ter sido ameaçado de morte por cerca de
  sete homens, um dos quais se identificou como "Manoel, amigo de Daniel Vorcaro", que "mexia com jogo do bicho";
  Garcia reconheceu Manoel, com alto grau de certeza, em procedimento formal de reconhecimento fotográfico (art.
  226 CPP). Entre 02 e 03/03/2026, véspera da 3ª fase da operação, trocou 58 mensagens de WhatsApp com Mourão.
why_in_novelo: É o elo entre o núcleo central da organização e um braço de intimidação territorializado no Rio de
  Janeiro, com uso declarado de conexões com o jogo do bicho e possivelmente milícias — e o executor apontado de
  uma ameaça de morte específica, com reconhecimento fotográfico formal por uma das vítimas.
