summary: Publicitário que prestava serviços a Daniel Vorcaro. Segundo mensagens divulgadas pelo Intercept
  e pela Gazeta do Povo, organizou o encontro de Flávio Bolsonaro com Vorcaro em 11/12/2024 e intermediou
  o patrocínio ao filme 'Dark Horse'. Em 09/07/2026 foi alvo de busca e apreensão na 10ª fase da Compliance
  Zero, autorizada por André Mendonça, que cita o 'Projeto DV' (contratação de influenciadores contra
  o BC) e levantamento de dados de jornalistas e executivos. Em depoimento à PF (12/05/2026) confirmou
  o plano com influenciadores, dizendo que sua atuação se limitava a fechar contratos e repassar recursos.
why_in_novelo: Alvo da 10ª fase da Operação Compliance Zero e apontado pela imprensa como intermediário
  entre Daniel Vorcaro e Flávio Bolsonaro no financiamento do filme 'Dark Horse'.
