open_questions:
- 'CORREÇÃO (09/09/2026): o corpus registrava que a decisão da 10ª fase não havia sido lida integralmente.
  O registro estava desatualizado — a decisão foi lida na íntegra pela equipe, mediante conversão das
  24 páginas em imagem e aplicação de OCR, e dela derivam seis evidências de classe documental já publicadas.'
- 'O ponto que decide o caso dele é uma coincidência de valores não esclarecida: recebeu R$ 3,5 milhões
  pela venda de 10% do portal Leo Dias a Vorcaro, pagos pela Super Empreendimentos, e repassou R$ 3,5
  milhões a influenciadores. A defesa diz que o dinheiro da campanha era próprio, produto daquela venda;
  a investigação diz que veio do esquema, pela mesma Super. Nenhuma fonte apresenta a documentação bancária
  que permitiria distinguir as hipóteses.'
- O CNPJ da Agência MiThi, que assinou os contratos do 'Projeto DV', não foi localizado — de modo que
  não é possível verificar sua situação cadastral nem se houve suspensão judicial de atividades, e nenhuma
  fonte registra tal suspensão. A empresa individual que ele mantinha anteriormente foi baixada voluntariamente
  em julho de 2020.
- 'Há contradição sobre sua saída do Grupo LeoDias: o grupo informou que ele deixou a gestão em junho
  de 2025 e iniciou a transferência de participação minoritária no fim daquele ano; ele afirmou manter
  10%; e o registro da Receita Federal ainda o listava como Administrador da sociedade em conta de participação
  na data desta apuração. O anúncio público da venda ocorreu dois dias antes de ele se tornar alvo da
  operação.'
- 'Contradição sobre o encontro entre Flávio Bolsonaro e Vorcaro: mensagens de 08/12/2024 registram-no
  confirmando reunião para a semana seguinte na casa do banqueiro, dizendo que ''Flávio está ciente de
  tudo''; ele afirma que a reunião não aconteceu. Não foi localizada manifestação específica do senador
  ou de sua assessoria sobre a participação dele.'
- Não foi localizada denúncia formal da PGR nem indiciamento nominal contra ele até a data desta apuração,
  nem qualquer fase posterior da operação que o atinja. Ele nunca foi preso, e a monitoração por tornozeleira,
  requerida ao STF por um parlamentar, não foi deferida.
- O procedimento em que sua atuação vinha sendo mapeada é objeto de pedido de anulação e extinção formulado
  pelo procurador-geral da República em 01/09/2026 — pendente de decisão. Caso acolhido, há risco de contaminação
  das provas relativas a ele.
