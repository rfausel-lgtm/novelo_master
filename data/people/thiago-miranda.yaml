id: thiago-miranda
kind: person
name: Thiago Miranda
category: businessperson
role: Publicitário; ex-CEO do Grupo LeoDias e dono da Agência MiThi; apontado como articulador do 'Projeto
  DV'
positions: []
summary: 'Publicitário de Brasília, com CPF terminado em 451 confirmado em registro da Receita Federal.
  Foi CEO do Grupo LeoDias e dono da Agência MiThi, com carteira que incluía marcas de luxo, instituições
  financeiras e celebridades. A decisão de André Mendonça na PET 16.346, que autorizou a 10ª fase da Operação
  Compliance Zero em 09/07/2026 e foi lida integralmente pela equipe, o aponta como articulador do ''Projeto
  DV'' — campanha para recrutar influenciadores, sob acordo de confidencialidade com multa de R$ 800 mil,
  para questionar a liquidação do Banco Master e atacar o Banco Central. Foram cerca de R$ 8 milhões em
  contratos assinados pela MiThi, dos quais R$ 3,5 milhões efetivamente repassados entre o fim de dezembro
  de 2025 e 5 de janeiro de 2026. A mesma decisão lhe atribui o levantamento de dados pessoais da jornalista
  Malu Gaspar — renda, cartão de crédito, movimentações bancárias, filhos e veículo, com uso de plataforma
  de venda não autorizada de dados — e um dossiê sobre o CEO do Itaú, Milton Maluhy Filho, e sua esposa,
  localizado com a identidade visual da própria agência; além de contatos com a jornalista Consuelo Dieguez,
  da piauí, e com o consultor Renato Breia, da Nord, pedindo retirada de conteúdo. Admitiu publicamente
  ter intermediado o investimento de Vorcaro no filme ''Dark Horse''. Não foi preso: em 11/07/2026 teve
  o passaporte apreendido e a saída do país proibida, por risco de fuga — tinha passagem marcada para
  Miami dois dias depois. Em 13/07/2026 anunciou o encerramento da agência e um ano sabático. A PORTARIA
  DE ABERTURA DO INQUÉRITO (28/01/2026, lote 210, INQ 5.035) — peça mais primitiva que a decisão da 10ª
  fase — descreve o objetivo do ''Projeto DV'' de forma mais ampla do que já registrado: influenciar
  decisões ''tanto perante o Supremo Tribunal Federal, quanto perante o Tribunal de Contas da União''. Um
  dos influenciadores abordados relatou, em vídeo de denúncia, que a proposta fazia referência a uma
  sessão de plenário do TCU marcada para 21/01/2026 sobre a liquidação do Master — relato não confirmado
  por apuração independente. O MESMO DESPACHO QUE O INTIMOU (lote 211) também convocou, no mesmo IPL,
  Leonardo Antônio Lima Dias (''Léo Dias'') para depor — reportagem citada na Portaria de abertura aponta
  vínculo societário e telefônico entre a Miranda Comunicação e uma empresa ''Léo Dias Comunicação e
  Jornalismo S.A.'', da qual o mesmo sócio-administrador de Miranda teria sido administrador até 2025,
  além de apontar Flávio Carneiro como possível sócio majoritário (60%) do ''Grupo Leo Dias''. A partir
  de maio de 2026, os despachos de intimação a Miranda passaram a usar o e-mail
  ''thiagomiranda@agenciamentha.com.br'', ao lado do já conhecido ''@agenciamithi.com.br'' — sem
  explicação documentada do que seria essa ''Agência Mentha''.'
why_in_novelo: 'É apontado como o operador da frente de comunicação do esquema: quem contratava influenciadores
  para atacar o regulador que liquidara o banco, quem encomendava dossiês sobre jornalistas e executivos
  incômodos, e quem intermediava o dinheiro do filme sobre Bolsonaro.'
