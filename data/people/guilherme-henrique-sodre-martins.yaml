summary: Ex-marido de Fátima Mendonça, atual esposa de Jaques Wagner, e pai biológico de Eduardo Mendonça
  Sodré Martins (enteado do senador, ligado à BN Financeira). Descrito pela PF como 'pessoa próxima e
  de confiança' de Wagner, apelidado 'Guiga', suposto articulador entre o núcleo empresarial ligado ao
  Banco Master, o círculo pessoal do parlamentar e o gabinete. Foi alvo de medidas da PF na 9ª fase da
  Compliance Zero (junho de 2026). Não é parente consanguíneo de Jaques Wagner.
why_in_novelo: É apontado pela PF como articulador de confiança entre o núcleo Master e o gabinete de
  Jaques Wagner — apesar de não ter parentesco de sangue com o senador, é pai do enteado dele (Eduardo
  Mendonça Sodré Martins), já central a outra frente do caso (BN Financeira/PKL One).
