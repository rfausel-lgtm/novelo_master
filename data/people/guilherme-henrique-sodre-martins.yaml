id: guilherme-henrique-sodre-martins
kind: person
name: Guilherme Henrique Sodré Martins
category: businessperson
role: Pai do enteado de Jaques Wagner, apontado pela PF como pessoa de confiança do senador; alvo da 9ª fase da
  Compliance Zero
positions: []
summary: Ex-marido de Fátima Mendonça, atual esposa de Jaques Wagner, e pai de Eduardo Mendonça Sodré Martins, enteado
  do senador; apresentado pela imprensa como publicitário. A representação da PF da 9ª fase o chama de "Tio Guiga"
  e o descreve como operador e pessoa de confiança de Wagner. Segundo o documento, intermediou os primeiros contatos
  de Wagner com Vorcaro em 19/06/2024; foi mencionado pelo diretor comercial do Master em "vou mandar então pra
  tio guiga e Jaques"; recebeu de Augusto Lima, em dezembro de 2024, presentes enviados ao mesmo tempo ao senador;
  e, depois da primeira fase da operação, tratou com o advogado Daniel Lopes Monteiro da cessão dos direitos sobre
  o apartamento do Poème Horto, inclusive na mensagem "A altura do vão é 2,45m", que a PF lê como o valor do imóvel.
  É sócio-administrador da MMSM Patrimonial, de que o filho é sócio. Segundo a imprensa, o Master patrocinou em
  2022 o livro sobre o pai dele, e ele é coproprietário com Wagner, desde 2015, de um sítio em Andaraí (BA). Mendonça
  negou-lhe viagem à Itália em setembro de 2026.
why_in_novelo: É apontado pela PF como articulador de confiança entre o núcleo Master e o gabinete de Jaques Wagner
  — apesar de não ter parentesco de sangue com o senador, é pai do enteado dele (Eduardo Mendonça Sodré Martins),
  já central a outra frente do caso (BN Financeira/PKL One).
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- Nenhuma manifestação pública dele sobre o mérito das imputações da PF foi localizada; a defesa só se manifestou
  no pedido de viagem.
- Não se sabe se a MMSM Patrimonial é a empresa grafada "MMSS" pela Época na compra do sítio de Andaraí, nem se
  a fração de 24% ainda é dele.
- A empresa de energia de que a MMSM é sócia, segundo a Folha, não foi identificada.
- Em 19/06/2026 teve bens constritos até R$ 5.955.250 na PET 16.230, com a GF4.15 Participações e Consultoria, que
  administra, e a Sodré Martins Serviços Administrativos; recorreu por agravo em julho de 2026.
