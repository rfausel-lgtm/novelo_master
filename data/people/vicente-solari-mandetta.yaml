id: vicente-solari-mandetta
kind: person
name: Vicente Solari de Moraes Rêgo Mandetta
category: prosecutor
role: Procurador da República em São Paulo
summary: Subscreveu, em 23/12/2025, o Ofício nº 18794/2025 à Secretaria Judiciária do STF, identificando
  os autos de origem do processo que embasaria a decisão de Dias Toffoli de 06/01/2026 na PET 15.198 — o
  Pedido de Prisão Preventiva n. 5009071-26.2025.4.03.6181 e o Inquérito Policial n. 5004641-31.2025.4.03.6181,
  ambos da 8ª Vara Criminal Federal de São Paulo — e remetendo a documentação "com o máximo sigilo" por
  meio de links do Google Drive. Também atuou nos próprios autos paulistas, manifestando-se favoravelmente
  ao pedido policial de prisão preventiva de Daniel Vorcaro (27/10/2025) e, ao final, requerendo a remessa
  do feito ao STF vinculada à PET nº 15.198 "com a finalidade de preservar o sigilo da autuação".
why_in_novelo: É o procurador que formalmente conectou, por ofício próprio, o processo paulista de origem
  (prisão preventiva de Daniel Vorcaro) ao processo STF que produziu a decisão fundadora das medidas
  cautelares contra o núcleo do Banco Master.
cited_position:
- kind: not_located
  summary: Atuou em capacidade estritamente oficial, subscrevendo manifestações e o ofício de vinculação
    processual; nenhuma declaração pública dele à imprensa foi localizada, e não há alegação sobre sua
    conduta a exigir contraditório.
