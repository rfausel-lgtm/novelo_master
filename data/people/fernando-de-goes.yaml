name: Fernando de Goes
category: other
role: Diretor comercial do Banco Master, segundo a PF; interlocutor de Daniel Vorcaro
summary: 'Segundo o documento comprobatório da PF (Pet 15.497), foi acionado por Daniel Vorcaro em 01/10/2024 —
  no mesmo dia em que Vorcaro pediu a Augusto Lima que ligasse "urgente pro kassab" — como um segundo canal paralelo:
  "Pedi o nando pra ajudar e tentar falar com o kassab". Respondeu tê-lo pressionado ("Dei uma porrada grande aqui
  em kassab") e, em seguida, informou à equipe de Vorcaro que Kassab de fato havia ligado para o deputado Pedro
  Paulo Carvalho (presidente do PSD no Rio de Janeiro) — confirmação interna, distinta da versão dada pela assessoria
  de Kassab à imprensa. Relatou o teor da ligação em termos que atribuem a Kassab uma queixa sobre o deputado estadual
  Luiz Paulo ("o cara não ouve ninguém, xiita"), e afirma ter contestado essa caracterização junto a Kassab/Pedro
  Paulo ("falei com ele que era tudo inverdade o q estava falando"). A representação da PF da 9ª fase o identifica
  como Fernando de Goes Mascarenhas Filho, diretor comercial do Master, e registra que, em conversa com Vorcaro
  sobre o banco ser visto como próximo do governo, escreveu "vou mandar então pra tio guiga e Jaques", que a PF
  lê como referência a Guilherme Sodré e ao senador Jaques Wagner. Segundo a análise cadastral da PF, foi diretor
  da PKL One de outubro de 2020 a julho de 2021, e em 10/03/2022 assinou como procurador do Master o contrato com
  a BN Financeira.'
why_in_novelo: É um segundo canal, paralelo a Augusto Lima, que Vorcaro usou na mesma tentativa de pressão política
  sobre Gilberto Kassab em outubro de 2024 — e a fonte da confirmação interna de que Kassab de fato ligou para Pedro
  Paulo.
