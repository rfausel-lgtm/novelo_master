  summary: Nenhuma manifestação pública dele localizada até a data desta apuração.
open_questions:
- 'RESOLVIDO (13/09/2026): a referência a "neto" na mesma conversa é Luiz Rennó Netto, advogado de confiança de
  Vorcaro (ver verbete próprio).'
- Vorcaro menciona, na mesma conversa, uma suposta segunda matéria da qual "já tirei nome do banco" — o próprio
  relatório da PF registra não ter encontrado a notícia do site "expresso222.com.br" que Vorcaro alegava ter tirado
  do ar; não está definitivamente esclarecido se são a mesma peça ou peças distintas.
