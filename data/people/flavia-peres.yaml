summary: Ex-deputada federal pelo Distrito Federal e ex-titular da Secretaria de Governo no governo Jair
  Bolsonaro, então usando o nome Flávia Arruda. Casou-se, em janeiro de 2024, na Ilha dos Frades (Salvador),
  com Augusto Ferreira Lima — ex-CEO e ex-sócio do Banco Master, hoje em prisão domiciliar na Operação
  Compliance Zero. É presidente do Instituto Terra Firme, associação privada sem fins lucrativos ligada
  às estruturas empresariais do marido.
why_in_novelo: É a atual esposa de Augusto Lima, figura política de projeção nacional (ex-deputada federal,
  ex-ministra de fato como titular da Secretaria de Governo) — conexão relevante para mapear a rede de
  relações do ex-sócio do Master, sem que isso implique qualquer imputação a ela própria.
