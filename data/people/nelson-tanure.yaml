name: Nelson Tanure
category: businessperson
role: Empresário
positions: []
summary: 'Empresário baiano (Salvador, 1951), formado em Administração pela UFBA, com passagem pela Universidade
  de Paris I. Investidor especializado em ativos em dificuldade financeira (distressed assets): compra
  participações em empresas endividadas para reestruturá-las. Ao longo da carreira esteve envolvido em
  mais de 200 empresas, entre elas Jornal do Brasil, Oi, Light, Gafisa, TIM Brasil e a Copel Telecom/Ligga,
  adquirida em 2020. Em 14/01/2026 o STF (relator Dias Toffoli) deferiu busca pessoal em Tanure na investigação
  sobre o Banco Master, abordado por agentes da PF no Aeroporto do Galeão. Investigadores apuram — sem
  confirmação judicial — a hipótese de que seria ''sócio oculto'' do Master; ele nega qualquer vínculo
  societário. Uma ação distinta, sobre negociação de ações da Gafisa, foi remetida ao STF por conexão
  com o caso, também sob relatoria de Toffoli. Reportagem posterior (Metrópoles, coluna Grande Angular)
  aponta participação indireta de Tanure na holding da Banvox — gestora do mesmo ecossistema, liquidada
  pelo BC em 03/09/2026 — via debêntures conversíveis no fundo Estocolmo, com termos contratuais sigilosos.
  Tanure mantém a negativa de qualquer vínculo societário com o Master ou suas gestoras. A leitura integral
  da decisão de 06/01/2026 precisa a natureza da imputação: a expressão ''sócio oculto'' está dentro da
  transcrição da manifestação do procurador-geral, que reporta o que a autoridade policial afirmou, e
  o relator consigna que sua cognição, nessa fase, é necessariamente limitada. No caso Master ele é investigado,
  alvo de busca pessoal e de bloqueio de bens — não preso, não indiciado, não denunciado. É réu em ação
  penal distinta, sobre uso de informação privilegiada na aquisição da Upcon pela Gafisa, cuja conexão
  com o caso Master o próprio relator rejeitou em 27/01/2026.'
why_in_novelo: Foi alvo de busca pessoal deferida pelo STF em fase da investigação sobre o Banco Master.
cited_position:
- kind: denial
  summary: Negou categoricamente qualquer vínculo societário com o Master, classificando a relação como
    'estritamente comercial, como cliente'; disse jamais ter enfrentado processo criminal.
