open_questions:
- Testada na base da CVM, não há cotista de regime próprio de previdência nos veículos identificados como
  dele; o corpus não localizou nenhum caminho documental entre o dinheiro previdenciário público e ativos
  seus.
- No núcleo do caso Master (distinto do processo Gafisa/Upcon, onde já é réu), a PF concluiu em agosto
  de 2026 o inquérito-mãe e preparou seu indiciamento, remetido ao MPF/PGR — sem denúncia formal oferecida
  até 05/09/2026.
- 'Checagem de 08/09/2026: não está preso (apenas alvo de busca e bloqueio de bens); sem denúncia do MPF/PGR
  até esta data. Reportagem de 04/09/2026 indica que bancos fecharam linhas de crédito para ele após ''sequência
  de reveses'' — mesma fonte confirma que eventual indiciamento ''não representa condenação''.'
- 'Reconciliados os valores de aporte no Master: R$ 2,5 bilhões e ''ao menos R$ 1,6 bilhão'' medem o mesmo
  fenômeno (apurações de datas/metodologias distintas, a segunda mais específica e posterior); R$ 1,112
  bilhão é o fluxo inverso (Master emprestando a empresas dele), não deve ser somado aos outros dois —
  ver evidência correlata.'
- As debêntures da Banvox Holding não são conversíveis em ações, mas desde dezembro de 2022 alguns títulos
  passaram a poder pagar cupons com ações da Banvox (Bloomberg Línea) — a defesa dele nega qualquer conversão
  mesmo em cenário de inadimplência.
- Confirmado, por registro da Receita Federal, que a Banvox Holding Financeira (emissora das debêntures)
  tem como diretores Maurício Quadrado e Artur Martins de Figueiredo — o QSA de sociedade anônima fechada
  não registra o quadro acionário completo, de modo que eventual participação dele via debêntures (instrumento
  de dívida) não apareceria nesse registro.
- 'Confirmado, por checagem em 09/09/2026: o indiciamento no núcleo Master, anunciado como ''preparado''
  pela PF em agosto de 2026, ainda não se consumou; ele não consta entre os condenados da CVM no caso
  Brazil Realty FII (08/09/2026); e não há menção a ele nos anexos conhecidos da delação de João Carlos
  Mansur — com a ressalva lateral, mencionada de passagem pela imprensa, de que a Reag (empresa de Mansur)
  já prestou serviços a empresas dele no passado, relação comercial anterior não atribuída ao conteúdo
  da colaboração.'
- Leitura direta de 17 comunicações do processo Gafisa/Upcon (via DJEN/CNJ) confirma capitulação penal
  por uso de informação privilegiada, denúncia recebida em 28/01/2026, negativa de ANPP a ele (concedido
  ao corréu Gilberto Benevides, que recusou), e audiências de instrução marcadas para 20/10/2026 e 18/11/2026.
- 'Detalhamento da pressão bancária sobre seu patrimônio (04/09/2026): UBS antecipou ''collar finance''
  de R$ 2 bilhões (garantido por ações da Prio); XP antecipou R$ 520 milhões em debêntures (Emae/Ambipar,
  com perda da Emae); BTG Pactual, Prisma, Farallon e Santander executaram cerca de R$ 1,5 bilhão (financiamento
  da Copel Telecom/Ligga), assumindo participações em Light e Alliança Saúde — sem atualização localizada
  após essa data.'
