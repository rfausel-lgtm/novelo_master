open_questions:
- A cifra de R$ 2,5 bilhões aportados no banco desde 2020 não consta da decisão judicial; vem de reportagem,
  e outra apuração jornalística, apoiada em documentos próprios, indica R$ 1,6 bilhão. As duas metodologias
  não foram divulgadas.
- 'A natureza das debêntures da holding da Banvox é objeto de três versões inconciliáveis: conversíveis
  em ações, não conversíveis mas com cupom pagável em ações, e nem uma coisa nem outra, segundo a defesa.
  A equipe não teve acesso à escritura.'
- Testada na base da CVM, não há cotista de regime próprio de previdência nos veículos identificados como
  dele; o corpus não localizou nenhum caminho documental entre o dinheiro previdenciário público e ativos
  seus.
- Não foi confirmado se o indiciamento anunciado como iminente em agosto de 2026 chegou a ocorrer.
