summary: 'Empresário citado em reportagem (colacionada na Portaria de instauração do IPL sobre o "Projeto
  DV", INQ 5.035) como detentor de 60% de participação no "Grupo Leo Dias" — do qual Thiago Miranda
  possuía os outros 10%, com os demais 30% não descritos na fonte. O documento primário apresenta a
  informação com alguma ambiguidade textual entre duas reportagens diferentes sobre se os 60% seriam do
  "grupo" (Grupo Leo Dias) ou "da agência" (Agência MiThi) — lido em conjunto, o texto indica tratar-se
  do Grupo Leo Dias.'
why_in_novelo: É apontado como sócio majoritário da estrutura empresarial em torno do nome "Leo Dias",
  que tem Thiago Miranda — apontado como articulador do "Projeto DV" — como sócio minoritário e ex-CEO.
