summary: Executivo bancário, CEO do Itaú Unibanco desde 2021. Segundo a decisão de André Mendonça na PET
  16.346, mensagens entre Daniel Vorcaro e Thiago Miranda revelam pedido de 'levantamento' sobre sua pessoa
  — 'Estou precisando fazer um levantamento do Milton Maluhy. Esta me causando muito problema. Me ajuda
  nisso?', ao que Miranda responde 'Deixa comigo'. Foi localizado documento intitulado 'Família Maluhy
  — Relatório sobre Execução Fiscal', com dados pessoais e patrimoniais dele e de sua esposa, produzido
  ou circulado no âmbito da Agência MiThi, de Thiago Miranda.
why_in_novelo: CEO de banco apontado, em decisão judicial da Operação Compliance Zero, como alvo de levantamento
  de dados pessoais e patrimoniais encomendado por Daniel Vorcaro.
