name: Leonardo Antônio Lima Dias
role: Comunicador conhecido como "Léo Dias"; intimado como testemunha no inquérito sobre o "Projeto DV"
summary: 'Comunicador brasileiro, apresentador e dono do portal de entretenimento associado à marca "Léo
  Dias" (portalleodias.com), conhecido publicamente por esse nome artístico. Identificado nos autos pelo nome civil e pelo CPF. Foi
  intimado, no mesmo despacho que convocou Thiago Miranda a depor sobre o "Projeto DV" (Mandado de
  Intimação nº 1783075/2026, IPL 2026.0009625, INQ 5.035), para prestar Termo de Declarações em
  29/04/2026 na sede da PF em Brasília. Por meio de advogados do escritório KLA (Koury Lopes Advogados),
  pediu vista integral dos autos e redesignação da oitiva, alegando desconhecer o teor da investigação e
  residir em São Paulo por compromissos profissionais (programas televisivos gravados naquela capital).
  Já constava do acervo, indiretamente, como ex-empregador de Thiago Miranda ("Grupo LeoDias", de que
  Miranda foi CEO e sócio de 10%) — este documento o traz, pela primeira vez, como pessoa própria,
  formalmente intimada como testemunha na mesma investigação.'
why_in_novelo: É intimado como testemunha na mesma frente investigativa que apura o "Projeto DV" de
  Thiago Miranda, com quem mantém vínculo societário na empresa que leva seu próprio nome — sem que o
  documento o aponte como investigado ou beneficiário dos recursos da campanha.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública dele sobre o episódio foi localizada no corpus até a data desta
    apuração; a petição de seus advogados pedindo vista e redesignação da oitiva é o único registro
    formal da posição dele nos autos.
open_questions:
- Não há denúncia oferecida, indiciamento concluído ou decisão de mérito contra ele no corpus. O
  documento o convoca como testemunha ("Termo de Declarações"), não como investigado.
- 'O acervo registra múltiplas pessoas jurídicas com nomes semelhantes ligadas a ele — "Léo Dias
  Comunicação e Jornalismo Ltda SCP VTG" (já registrada, CNPJ 55.062.879/0001-98), "Léo Dias Comunicação
  e Jornalismo S.A." (citada por reportagem, sem CNPJ localizado) e "Leo Dias Comunicação e Jornalismo"
  Ltda (CNPJ 51.568.337/0001-30, administrada por Ivan Carlos de Oliveira) — sem que as fontes disponíveis
  esclareçam a relação exata entre as três.'
