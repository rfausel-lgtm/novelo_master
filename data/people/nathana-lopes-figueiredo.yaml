role: Requereu restituição de celular apreendido na busca contra Luiz Phillipi Mourão
summary: Requereu ao STF, em 29/05/2026, a restituição de um iPhone 17 Pro Max apreendido durante busca e
  apreensão contra Luiz Phillipi Machado de Moraes Mourão, alegando ser proprietária de boa-fé e pedindo
  perícia e extração de dados do aparelho. A PGR não se opôs diretamente, mas pediu manifestação da
  autoridade policial sobre a necessidade de manter o aparelho apreendido para fins periciais.
why_in_novelo: É requerente de restituição de bem apreendido na investigação sobre o núcleo de intimidação
  "A Turma", ligado a Luiz Phillipi Mourão. O corpus não esclarece sua relação com ele.
