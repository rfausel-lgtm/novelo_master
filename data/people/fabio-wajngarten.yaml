summary: Advogado e ex-secretário de Comunicação Social. Sua empresa, a WF Comunicação, recebeu ao menos
  R$ 3,8 milhões para atuar na defesa de Daniel Vorcaro, segundo documentos da Receita encaminhados à
  CPI. Ele confirmou integrar a equipe de defesa desde o primeiro semestre de 2025.
why_in_novelo: Recebeu pagamentos do Banco Master para integrar a defesa de Daniel Vorcaro, segundo dados
  fiscais encaminhados à CPI; ele mesmo confirmou a atuação.
