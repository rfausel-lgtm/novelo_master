id: andre-salvador-unltd
kind: person
name: André Salvador
category: businessperson
role: Sócio da agência UNLTD Network Brazil (Unlimited)
positions: []
summary: Apontado como sócio, ao lado de Anderson Antunes, da agência UNLTD Network Brazil Ltda (CNPJ
  47.643.948/0001-29), também referida como 'Unlimited'. Segundo a apuração da GloboNews relatada pelo
  Estadão Conteúdo (08/01/2026), foi ele quem procurou o vereador Rony Gabriel (PL, Erechim-RS) com a
  proposta de gravar conteúdos; o Estadão Conteúdo diz que ele consta na Receita Federal como um dos sócios,
  ao passo que o quadro societário da base da Receita lido pelo Novelo traz outro nome como único sócio-administrador
  (divergência não resolvida). Segundo a decisão de André Mendonça na PET 16.346, a agência foi apontada
  como executora do chamado 'Projeto DV' — a aproximação de influenciadores e formadores de opinião para
  defender o Banco Master e questionar a atuação do Banco Central; segundo a PF, citada pelo Poder360
  (09/07/2026), Thiago Miranda foi o principal articulador do 'Projeto DV' por meio da contratação da
  agência Unlimited. A decisão reproduz um 'Acordo de Confidencialidade — Projeto UNLTD' firmado com um
  vereador, com multa de R$ 800 mil por quebra contratual.
why_in_novelo: Sócio de agência apontada, em decisão judicial da Operação Compliance Zero, como executora
  de campanha coordenada de influenciadores a favor do Banco Master.
