role: Sócio da agência UNLTD Network Brazil (Unlimited)
positions: []
summary: Sócio, ao lado de Anderson Antunes, da agência UNLTD Network Brazil Ltda (CNPJ 47.643.948/0001-29),
  também referida como 'Unlimited'. Segundo a decisão de André Mendonça na PET 16.346 e o depoimento de
  Thiago Miranda à PF, a agência foi contratada para desenvolver o chamado 'Projeto DV' — a aproximação
  de influenciadores e formadores de opinião para defender o Banco Master e questionar a atuação do Banco
  Central. A decisão reproduz um 'Acordo de Confidencialidade — Projeto UNLTD' firmado com um vereador,
  com multa de R$ 800 mil por quebra contratual.
why_in_novelo: Sócio de agência apontada, em decisão judicial da Operação Compliance Zero, como executora
  de campanha coordenada de influenciadores a favor do Banco Master.
