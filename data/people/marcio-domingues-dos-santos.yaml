open_questions:
- A petição em que pede a revisão do bloqueio (28/07/2026) atribui a decisão que o atinge à 'PET 16.229', numeração
  distinta da PET 16.230 sob a qual a própria petição é protocolada. A manifestação conjunta da PGR de 16/06/2026
  trata as Pets 16.201, 16.210, 16.229 e 16.230 como quatro processos correlatos com manifestação comum; não está
  esclarecido, a partir das peças reunidas, se a decisão de 19/06/2026 sobre o eixo do apartamento Poème Horto foi
  proferida separadamente na PET 16.229 ou se há erro de citação na petição do próprio investigado.
- Não há, no corpus, decisão sobre o pedido de revisão do bloqueio de 28/07/2026.
- Se recebeu, e de quem, os documentos do apartamento antes de reenviá-los a Daniel Monteiro — ele cogita Luiz Lombardi,
  sem certeza.
