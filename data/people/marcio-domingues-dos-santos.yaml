id: marcio-domingues-dos-santos
kind: person
name: Márcio Domingues dos Santos
category: businessperson
role: Prestador de serviços administrativos do advogado Daniel Monteiro, alvo de constrição na PET 16.230
positions: []
summary: 'Alvo de constrição patrimonial na PET 16.230 (item I.24, teto de R$ 2.455.250, eixo do apartamento Poème
  Horto), por ser apontado como destinatário de documentos que Daniel Lopes Monteiro teria enviado sobre o instrumento
  de aquisição e o primeiro aditivo do imóvel. Vem de trinta anos de carreira na indústria do alumínio — organizou
  desde o início a fábrica Alussin — e deixou, em 16/04/2026, os treze ou catorze anos no emprego anterior para
  se dedicar, desde fevereiro ou março de 2025, a prestar apoio administrativo e organizacional ao ''escritório
  pessoal'' de investimentos de Daniel Monteiro, amigo de longa data, faturando pela empresa M QUATTRO à Mytra.
  Em depoimento de 28/07/2026, corrige o sentido atribuído pela representação policial: diz que foi ele quem enviou
  a Daniel Monteiro os documentos do apartamento, retirados da rede do escritório a pedido dele, e não o contrário.
  No mesmo dia, pediu a revisão do bloqueio, mas identificou a decisão que o atinge como proferida na ''PET 16.229'',
  numeração distinta da PET 16.230 em que a própria petição foi protocolada.'
why_in_novelo: É alvo de constrição patrimonial na PET 16.230 e, em depoimento próprio, descreve por dentro o escritório
  pessoal de investimentos de Daniel Monteiro — as tentativas de montar uma gestora cativa (Noctua, depois Excelsior)
  e o papel de David Lopes Monteiro no controle financeiro — além de corrigir, com base na própria memória dos fatos,
  a direção atribuída pela PF ao envio dos documentos do apartamento.
