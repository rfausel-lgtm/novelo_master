open_questions:
- Foi autor da Petição 10.829/STF, notícia-crime contra Flávio Dino por omissão diante dos atos de 8 de
  janeiro de 2023, protocolada em 11/01/2023 e arquivada por Alexandre de Moraes em 12/01/2023 — um dia
  depois, em processo público e com dispositivo publicado no Diário de Justiça, sem qualquer consequência
  ao denunciante. É a petição que gerou a prevenção pela qual as demais notícias-crime sobre os mesmos
  fatos foram distribuídas ao mesmo relator, e serve de termo de comparação para a disparidade de tratamento
  registrada em evidência correlata.
