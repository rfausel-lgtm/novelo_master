summary: 'Diretor do Banco Master desde 07/07/2017 (Receita Federal). Assinou, ao lado de Daniel Vorcaro,
  o contrato de R$ 3 milhões líquidos mensais com o escritório Barci de Moraes (16/01/2024) e, ao lado de
  Luiz Bull, a resposta do Master ao Banco Central sobre a recompra de carteiras originadas pela The-Pay
  Soluções de Pagamentos (25/03/2025). Foi solto da prisão preventiva pelo TRF-1 em 28/11/2025, junto com
  Vorcaro, Augusto Lima, Luiz Bull e Alberto Félix de Oliveira. Tem histórico sancionador prévio e distinto
  do caso Master: em processo administrativo da CVM concluído em 2022 (PAS 19957.006441/2021-87 + PA
  19957.010180/2022-81), por manipulação de preços do ativo CARE11 enquanto operava pelo Banco Máxima, foi
  identificado como responsável pelas ordens — a decisão inclui trechos de gravações telefônicas entre ele
  e operadores de mesa, obtidas pela BSM, que a CVM cita como evidência de coordenação de preço ("dá uma
  protegida no papel", "pra não cair"). Firmou termo de compromisso aceito pelo Comitê em 13/09/2022, com
  pagamento de R$ 736 mil (o Banco Máxima pagou R$ 2,208 milhões pelo mesmo processo).'
why_in_novelo: É diretor do Banco Master desde 2017, signatário de atos centrais da defesa institucional
  do grupo (o contrato com o escritório Barci de Moraes, a resposta ao Banco Central sobre a The-Pay), e
  tem histórico sancionador prévio da CVM por manipulação de preços, anterior e distinto do caso Master.
