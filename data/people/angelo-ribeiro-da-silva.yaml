open_questions:
- Não confirmado se é ou foi diretor estatutário do Banco Master ou ocupa função executiva não estatutária.
- O termo de compromisso da CVM de 2022 é instrumento de autocomposição, não confissão de culpa — não
  encontrada, até esta data, qualquer conexão documental entre esse episódio (CARE11, Banco Máxima) e a
  investigação atual da Operação Compliance Zero.
