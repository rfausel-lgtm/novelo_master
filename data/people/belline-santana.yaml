role: Chefe do Departamento de Supervisão Bancária do Banco Central (2019-2024)
summary: Servidor de carreira do Banco Central, chefiou entre 2019 e 2024 o departamento responsável pela
  supervisão direta das instituições financeiras. Foi alvo de busca e apreensão na fase de 04/03/2026
  da Operação Compliance Zero e cumpre medida cautelar com monitoramento eletrônico. Convocado pela CPI
  do Crime Organizado, obteve decisão do ministro André Mendonça que tornou o comparecimento facultativo.
why_in_novelo: Chefiou a supervisão bancária do Banco Central no período em que o banco cresceu e é alvo
  da investigação e de convocação parlamentar.
