  by_id: belline-santana
  date: '2026-04-10'
open_questions:
- As fontes divergem entre as grafias Belline e Bellini; a forma usada pela Agência Senado foi adotada.
- 'Há divergência entre as fontes sobre o período em que chefiou o Departamento de Supervisão Bancária:
  de 2019 a 2024, segundo a Agência Senado, ou de 2019 até janeiro de 2026, segundo outras reportagens.'
- Segundo fonte única, teria pedido exoneração em janeiro de 2026, já afastado — não foi localizado ato
  de exoneração publicado no Diário Oficial que confirme o deferimento, e a legislação permite à Administração
  recusar exoneração de servidor em curso de processo disciplinar.
- Sua própria versão, registrada em reportagem, é de que recebeu de Leonardo Palhares oferta de cerca
  de R$ 2 milhões por 'serviços de treinamento', com duas parcelas de R$ 500 mil pagas em 2023 — declaração
  de coinvestigado, registrada como versão, não como fato apurado.
- 'Ao contrário do que ocorre com Paulo Sérgio Neves de Souza, não foi localizado documento de supervisão
  específico apontado como adulterado por ele: os atos que lhe são atribuídos são menos individualizados
  — revisão prévia de minutas do banco supervisionado e participação em grupo de mensagens com Vorcaro.'
- O contraste entre o valor contratado (cerca de R$ 4 milhões) e a contrapartida individualizada permanece,
  no caso dele, menos fechado do que a acusação sugere.
