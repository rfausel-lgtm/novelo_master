role: Chefe do Departamento de Supervisão Bancária do Banco Central (2019-2024)
summary: 'Servidor de carreira do Banco Central, chefiou entre 2019 e 2024 o departamento responsável
  pela supervisão direta das instituições financeiras. Foi alvo de busca e apreensão na fase de 04/03/2026
  da Operação Compliance Zero e cumpre medida cautelar com monitoramento eletrônico. Convocado pela CPI
  do Crime Organizado, obteve decisão do ministro André Mendonça que tornou o comparecimento facultativo.
  A sindicância interna do Banco Central, aberta em 08/01/2026 e concluída em 04/03/2026, apurou dois
  contratos entre ele e a Varajo Consultoria — empresa de Leonardo Palhares — somando cerca de R$ 4 milhões:
  o primeiro, de R$ 2 milhões, por um estudo de 50 páginas sobre educação financeira descrito pela comissão
  como compilação de conteúdo já existente, sem produção autoral relevante; o segundo, referente ao projeto
  ''Jovens Potentes''. A comissão classificou o arranjo como ''negócio simulado''. Foi afastado cautelarmente
  pelo próprio Banco Central em 19/01/2026, antes da decisão do STF, e responde a processo administrativo
  disciplinar aberto pela CGU em 23/03/2026, prorrogado em julho, ainda sem desfecho. Registro que complica
  a leitura acusatória: em 15/07/2025, foi ele próprio quem enviou ao Ministério Público Federal documento
  apontando irregularidades nas carteiras de crédito do Master vendidas ao BRB — sete dias antes das mensagens
  em que Vorcaro e Zettel tratam de pagá-lo.'
why_in_novelo: Chefiou a supervisão bancária do Banco Central no período em que o banco cresceu e é alvo
  da investigação e de convocação parlamentar.
cited_position:
- kind: denial
  summary: Sua defesa afirma que ele 'sempre exerceu suas atividades no Banco Central de forma técnica
    e, principalmente, lícita, dentro dos limites legais', que não houve 'favorecimento a qualquer Instituição
    Financeira, muito menos ao Banco Master', e que 'as atividades dele no BC não se confundem com outras
    atividades igualmente lícitas, não havendo desvio de finalidade ou obtenção de vantagem indevida'.
    Sustenta ainda que ele não adotou medidas para beneficiar o conglomerado e que encerrou a relação
    ao identificar possível vínculo entre Palhares e o banco supervisionado, criticando a 'divulgação
    fragmentada e descontextualizada de informações sigilosas'.
  source_ids:
