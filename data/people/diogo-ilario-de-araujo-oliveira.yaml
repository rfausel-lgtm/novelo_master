name: Diogo Ilário de Araújo Oliveira
role: Diretor Executivo de Atacado e Governo do BRB à época das aquisições de carteiras do Master, segundo
  a PF; indiciado em relatório parcial do Inq 5026 (28/10/2026)
summary: Segundo o relatório parcial da PF de 28/10/2026 no Inq 5026/STF, era então Diretor Executivo de
  Atacado e Governo do BRB e membro da Diretoria Colegiada do banco (p. 694). Está entre os 15 indiciados
  desse relatório. O relatório é parcial e a PF pediu mais 60 dias. Indiciamento é ato da polícia; não é
  denúncia nem condenação. Seu nome também aparece em despacho de 28/08/2026 no mesmo inquérito, que se
  refere a informações prestadas por ele; o ofício que comunica esse despacho foi endereçado à delegada
  Janaina Pereira Lima Palazzo, da Delegacia de Inquéritos Especiais (DELEINQUE/DRPJ/SR/PF/DF).
why_in_novelo: Dirigente do BRB indiciado pela PF no relatório parcial de 28/10/2026 sobre as aquisições de
  carteiras do Banco Master.
