id: humberto-costa
name: Humberto Costa
category: politician
role: Senador (PT-PE)
summary: Autor, com o senador Alessandro Vieira, dos requerimentos que convocaram o ex-chefe do Departamento
  de Supervisão Bancária do Banco Central à CPI do Crime Organizado, sob o argumento de que cabe à comissão
  investigar a atuação do crime organizado em órgãos públicos.
why_in_novelo: Assina os requerimentos de convocação de servidor do Banco Central à CPI do Crime Organizado
  no âmbito do caso.
cited_position:
- kind: public_note
  by_id: humberto-costa
  date: '2026-03'
  summary: 'Justificativa de autoria, não resposta a imputação. Segundo a Agência Senado (20/03/2026),
    em um dos requerimentos de convocação de Belline Santana (REQs 232/2026 e 239/2026, apresentados com
    Alessandro Vieira; o texto não identifica qual), ele sustentou que a convocação não excede os limites
    do plano de trabalho da CPI e que cabe à comissão investigar a atuação do crime organizado em órgãos
    públicos, como o Banco Central, no âmbito dos novos ilegalismos. A data exata do protocolo não foi
    conferida.'
  source_ids:
  - src-senado-2026-03-20-belline-santana-convocado-a-cpi
- kind: not_located
  date: '2026-10-16'
  summary: 'Nenhuma declaração dele sobre a decisão de Mendonça que tornou facultativo o depoimento de Belline
    Santana (24/03/2026) nem sobre a crise PF–STF de setembro localizada. Busca em 16/10/2026 (WebSearch
    ''Humberto Costa Banco Master CPI do Crime Organizado Belline Santana requerimento'', com ''outubro
    2026'' e com ''Belline habeas corpus reação'').'
