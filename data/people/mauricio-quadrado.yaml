open_questions:
- Administrava o fundo Verbier, usado pelo advogado maranhense Daniel Leite (apontado pela Kroll como
  'figura instrumental' de Vorcaro) para comprar ações do BRB com empréstimo de R$ 93,7 milhões em abril
  de 2025.
- Um vínculo entre a Trustee e Nelson Tanure é mencionado por uma única fonte de baixa força probatória
  (O Brasilianista) — não aprofundado, não deve ser tratado como fato até nova apuração.
- Há um vídeo de YouTube (não verificado, força fraca) alegando R$ 122 milhões gastos por Quadrado com
  advogados não identificados — conteúdo não lido/confirmado, não deve ser usado como fonte até checagem
  direta.
- Diversas empresas 'Fraction NNN Administração de Bem Próprio S.A.' (inclusive a 'Fraction 032', usada
  na venda subavaliada de imóvel) e a coincidência com o mesmo padrão de nome usado por Artur Martins
  de Figueiredo sugerem uma estrutura comum de planejamento patrimonial — hipótese, não fato provado;
  o escritório/family office responsável não foi identificado.
