id: mauricio-quadrado
kind: person
name: Maurício Quadrado
category: businessperson
role: Ex-diretor de investimentos do Banco Master; controlador da Trustee DTVM e da Banvox DTVM
positions: []
summary: Ex-diretor de investimentos do Banco Master sob Daniel Vorcaro. Antes, teve carreira no Bradesco
  (anos 1990, incluindo a coordenação do IPO/ADR da Aracruz Celulose na NYSE) e esteve à frente da corretora
  Planner entre 2007 e 2020. Vendeu sua fatia (estimada entre 20% e 30%) no Master em 2024 para montar
  plataforma financeira própria — corretora, gestora e o banco digital Letsbank —, hoje controlando a
  Trustee DTVM e a Banvox DTVM, ambas liquidadas extrajudicialmente pelo Banco Central em 03/09/2026.
  Foi fiador solidário, ao lado de Vorcaro e Augusto Lima, em emissão de R$ 470,5 milhões em debêntures
  da Banvox Holding Financeira que capitalizaram o Master. Alvo de busca e apreensão da Operação Compliance
  Zero em 14/01/2026. Consta também em bloqueio cautelar de R$ 24,2 milhões determinado pelo ministro
  Dias Toffoli (STF), ao lado de Vorcaro, do Master e da Banvox. Documento do próprio BRB (abril/2025)
  identifica Quadrado pelo CPF 032.718.208-00 como dono integral do Fundo Albali FIM e da Banvox — o Albali
  tornou-se acionista do BRB (3,4 milhões de ações ordinárias + 8,1 milhões adicionais) via R$ 100 milhões
  pagos ao fundo Asterope e R$ 28,6 milhões em recursos próprios, em aumento de capital aprovado em 27/12/2024.
  Debenturistas da Banvox apontaram conflito de interesse por Quadrado acumular a posição de fiador solidário
  e de controlador da Trustee, agente fiduciária da própria emissão. Firmou acordo com o liquidante do
  Master (~09/05/2026) mantendo bens bloqueados por 90 dias, na tentativa de recuperar R$ 230 milhões
  transferidos em 2024 ao Fundo Albali — que usou o valor para comprar o Hotel Fasano Itaim por R$ 330
  milhões. O liquidante alega doações de quatro imóveis a familiares (set-out/2025) e venda subavaliada
  de um quinto à empresa própria 'Fraction 032', com bloqueio adicional do TJSP em março de 2026 — alegações
  ainda sob litígio. Foi também réu, em processo anterior e distinto da fraude Master, na Operação Greenfield/Caixa
  Econômica Federal (denúncia recebida em 07/05/2019, ainda sem sentença).
why_in_novelo: Ex-sócio de Vorcaro no Master e controlador atual da Trustee e da Banvox, as duas gestoras
  liquidadas pelo Banco Central em 03/09/2026 por ligação com o caso Master.
cited_position:
- kind: denial
  summary: No dia da busca e apreensão da PF (14/01/2026), o escritório do executivo declarou à imprensa
    que ele 'sempre atua dentro da lei' — não localizada, até 09/09/2026, manifestação direta e pessoal
    dele sobre a liquidação da Trustee/Banvox (03/09/2026).
