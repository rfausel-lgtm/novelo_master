name: Georges Seigneur
category: prosecutor
role: Membro do Ministério Público do Distrito Federal e Territórios (MPDFT)
positions: []
summary: Concorreu à presidência do Conselho Nacional de Procuradores-Gerais (CNPG) em 2024. Segundo o
  relatório da PF sobre o celular de Daniel Vorcaro, o advogado Ciro Soares disse ao banqueiro ter pedido
  a Paulo Gonet que o convencesse a retirar sua candidatura em favor de Jarbas Soares Júnior; no dia seguinte,
  Ciro relatou a Vorcaro que 'o cara vai desistir'. Jarbas foi eleito por aclamação em 17/04/2024, o que
  é compatível com uma candidatura única, mas o relatório não confirma que Seigneur tenha efetivamente
  desistido em razão do contato, nem que Gonet o tenha feito.
why_in_novelo: Nomeado no relatório da Polícia Federal como o concorrente que teria sido convencido a
  desistir da disputa pela presidência do CNPG.
