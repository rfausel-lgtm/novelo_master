id: ricardo-batista-de-siqueira-xavier
kind: person
name: Ricardo Batista de Siqueira Xavier
category: businessperson
role: Preside as securitizadoras Base, Confiança e Humaitá; alvo de busca e apreensão e bloqueio de bens
  na PET 15.198 (Banco Master)
summary: Segundo o traslado do IPL paulista 5004641-31.2025.4.03.6181 (peça 13 da PET 15.198), preside as
  securitizadoras Base, Confiança e Humaitá — companhias citadas como parte da rede de veículos financeiros
  ligados ao esquema investigado do Banco Master. Foi nomeado entre os 38 alvos de busca e apreensão da
  representação policial que fundamentou a decisão de Dias Toffoli de 06/01/2026 na PET 15.198, com
  bloqueio individualizado de R$ 1.012.025.000,00 — mesmo valor atribuído a Antônio Augusto Conte, Vicente
  Conte Neto e César Reginato Ligeiro.
why_in_novelo: É um dos quatro alvos, ao lado de Daniel Vorcaro e do próprio Banco Master, com valor
  individualizado de bloqueio de bens acima de R$ 1 bilhão na decisão fundadora da PET 15.198 — o único dos
  quatro com papel corporativo identificado nas peças lidas (presidência de três securitizadoras).
cited_position:
- kind: not_located
  summary: Nenhuma manifestação dele foi localizada no corpus, e a equipe não conseguiu contato.
open_questions:
- Qual exatamente sua relação operacional com o núcleo Vorcaro/Master, além da presidência das três
  securitizadoras citadas, não está detalhada nas peças lidas.
