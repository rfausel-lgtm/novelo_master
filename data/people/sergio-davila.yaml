summary: Diretor de Redação da Folha de S.Paulo. O Metrópoles (16/10/2026) afirmou, com base em mensagens de
  Guilherme Barros a Daniel Vorcaro, que ele atendeu a pedidos do banqueiro e que o jornal segurou e
  amenizou um perfil de Vorcaro publicado em 30/08/2024; a Folha, em resposta às perguntas enviadas a ele, nega que a reportagem tenha sido
  segurada ou amenizada e diz que ele só soube do valor oferecido a Barros pelas mensagens vazadas. As duas
  versões são registradas como disputa entre veículos.
why_in_novelo: Diretor de Redação citado pelo Metrópoles, em disputa com a Folha, sobre a reportagem de agosto
  de 2024 a respeito de Daniel Vorcaro.
