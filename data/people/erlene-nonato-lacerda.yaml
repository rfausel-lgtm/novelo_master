id: erlene-nonato-lacerda
kind: person
name: Erlene Nonato Lacerda
category: other
role: Apontada como interposta pessoa e gestora financeira de Marilson Roseno da Silva; cautelar de proibição de
  deixar o país em 14/05/2026
summary: Alvo de cautelar de proibição de se ausentar da comarca e do país na 6ª fase da Operação Compliance Zero
  (decisão de 13/05/2026). Apontada pela PF como interposta pessoa e gestora financeira informal de Marilson Roseno
  da Silva, responsável por administrar pagamentos, receitas e despesas dele sem vínculo empregatício formal. Recebeu,
  em nome próprio, dois pagamentos de R$ 50 mil cada (26/10/2023 e 16/02/2024) da King Participações Imobiliária
  (de Luiz Phillipi Mourão), que segundo a PF eram na verdade destinados a Marilson. Enviava a ele planilhas com
  depósitos em sua própria conta no Santander, prestando contas dos ingressos financeiros formalmente registrados
  em seu nome mas com destinação real a Marilson.
why_in_novelo: É a peça da engrenagem de lavagem/ocultação patrimonial que separava formalmente o recebedor (ela)
  do beneficiário real (Marilson Roseno) dos repasses de Mourão.
