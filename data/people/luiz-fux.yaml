summary: >-
  Ministro do STF, integrante da Segunda Turma que referendou em 20/03/2026 a prisão preventiva
  de Daniel Vorcaro e outros investigados (PET 15556). No ARE 1.312.127 (União x Raízen Energia S.A. e outras),
  sobre indenizações a usinas sucroalcooleiras, pediu vista em 02/10/2026, na sessão virtual da 2ª Turma em que o
  relator, Gilmar Mendes, indicou a afetação do julgamento ao Plenário para referendo de decisão de 24/09/2026,
  segundo os andamentos oficiais do STF.
why_in_novelo: Votou, na Segunda Turma do STF, no referendo da prisão preventiva de investigados do caso
  Master, conforme comunicação oficial do tribunal.
