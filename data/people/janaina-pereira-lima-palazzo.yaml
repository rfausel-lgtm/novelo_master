name: Janaina Pereira Lima Palazzo
role: Delegada de Polícia Federal — Delegacia de Inquéritos Especiais (DELEINQUE/DRPJ/SR/PF/DF)
summary: Chefe da Delegacia de Inquéritos Especiais da PF no DF, designada em 18/12/2025 pelo diretor-geral da
  PF, Andrei Rodrigues, para conduzir a investigação do caso Master após a Reclamação 88.121 levá-la ao STF. Em
  28/08/2026, foi a destinatária de ofício do STF sobre o INQ 5.026 comunicando despacho relativo às informações
  prestadas por Diogo Ilário de Araújo Oliveira e a documentos sobre o estado de saúde de um investigado (e-Doc.
  1021-1024).
why_in_novelo: É a autoridade policial identificada como responsável, na Delegacia de Inquéritos
  Especiais, pelo andamento dessa linha específica do INQ 5.026.
