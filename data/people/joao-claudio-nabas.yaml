id: joao-claudio-nabas
kind: person
name: João Cláudio Nabas
category: other
role: Perito Criminal Federal
summary: 'Perito Criminal Federal que atuava em apoio às análises da Operação Compliance Zero, com acesso ao
  Laudo Pericial nº 4281/2025 (extração do celular de Daniel Vorcaro). Segundo representação da Polícia Federal
  na Pet 15.625, acessou o laudo em 01/12/2025, criou em 04/12/2025 os arquivos "Moraes.pdf" (prints de
  conversas entre Vorcaro e a advogada Viviane Barci de Moraes, e trechos do contrato dela com o Banco Master) e
  "Toffoli e esposa.pdf", e em 05/12/2025 enviou os arquivos à delegada Janaína Palazzo, incentivando-a a
  conversar com a jornalista Malu Gaspar, de quem disse ser fonte "há anos". Em 09/12/2025 O Globo publicou
  reportagem com conteúdo coincidente com o "Moraes.pdf". Auditorias da PF (SISCRIM, SARD) confirmam os acessos;
  o arquivo foi excluído do OneDrive institucional horas antes de uma reportagem de março de 2026 sobre
  conversas entre Vorcaro e o ministro Alexandre de Moraes. Em 18/05/2026, Mendonça, com anuência da PGR,
  suspendeu-o da função, autorizou busca e apreensão e afastou o sigilo telemático de sua conta.'
why_in_novelo: É o suspeito formalmente identificado pela PF e pelo STF como fonte do vazamento à imprensa de
  material sigiloso do celular de Daniel Vorcaro, incluindo o material que deu origem à cobertura sobre o
  contrato de Viviane Barci de Moraes com o Master e, possivelmente, às conversas entre Vorcaro e o ministro
  Alexandre de Moraes.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública dele localizada no corpus até a data desta apuração.
open_questions:
- 'A ligação entre o "Moraes.pdf" (confirmado pela PF como fonte provável da reportagem de 09/12/2025) e as
  reportagens de março de 2026 sobre as conversas Vorcaro-Moraes é apontada pela PF como hipótese reforçada
  pela coincidência temporal da exclusão do arquivo, mas não como fato definitivamente estabelecido.'
- 'RESOLVIDO EM PARTE (13/09/2026): a busca e apreensão foi efetivamente cumprida em 19/05/2026, um dia após
  a autorização, segundo ofício da PF juntado aos autos. Ainda não há notícia do desfecho do inquérito.'
- O conteúdo e o destino do arquivo "Toffoli e esposa.pdf" não são detalhados na decisão lida — apenas sua
  criação, ao lado do "Moraes.pdf", no mesmo dia.
- 'NOVO (13/09/2026): sua defesa pediu, em 02/07/2026, perícia de informática e documentoscopia para contestar
  a autenticidade do "Moraes.pdf" — linha de defesa ainda sem resultado conhecido. Em 21/08/2026, o caso passou
  a tramitar também na Corregedoria-Geral da PF, para eventual sanção disciplinar, com a PGR caracterizando
  formalmente a investigação como apuração de violação de sigilo funcional por fornecimento indevido de
  informações a jornalista.'
- 'NOVO (13/09/2026): entre junho e agosto de 2026, sua defesa disputou com a PF o acesso a novas juntadas do
  inquérito e usou isso para pedir adiamento de sua oitiva (inicialmente 06/08/2026) — a PF manteve a data,
  remarcada para 27/08/2026 por videoconferência. Não há notícia do que foi perguntado nem da posição dele
  na oitiva, nem do resultado da perícia pedida em 02/07 ou do desfecho do PAD na Corregedoria.'
