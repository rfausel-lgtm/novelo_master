summary: 'Conselheiro do Comitê de Investimentos da Amprev à época dos fatos — hoje é o Procurador-Geral
  de Justiça do Amapá, empossado em 10/03/2025. Segundo a ata do Conselho Estadual de Previdência publicada
  no Diário Oficial, foi ele quem provocou a convocação da 12ª reunião do CIAP, em 19/07/2024, por
  preocupação com as movimentações do mercado financeiro e com as notícias já veiculadas sobre o Banco
  Master — e votou contra a proposta aprovada pela maioria, sugerindo que o comitê só decidisse depois de
  apreciar o parecer da visita técnica. Não é alvo da operação Zona Cinzenta. NOVO (19/09/2026): em
  30/07/2024 — onze dias depois desse voto contrário, e depois de a Caixa Econômica Federal ter rejeitado
  R$ 500 milhões em letras do Master por risco —, votou, por unanimidade, a favor de um terceiro aporte de
  R$ 100 milhões, dizendo-se "mais tranquilo" com a "diversificação" do investimento e citando pareceres
  técnicos que atestavam a "solidez" do banco.'
why_in_novelo: 'É hoje o Procurador-Geral de Justiça do Amapá — mas, à época dos fatos, foi um dos dois
  conselheiros que votaram contra a continuidade das aplicações no Banco Master, identificados por
  documento oficial, e depois revisou a própria posição para aprovar por unanimidade um terceiro aporte,
  onze dias após alertar sobre o risco.'
