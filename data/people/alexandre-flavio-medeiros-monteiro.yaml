summary: Conselheiro do Comitê de Investimentos da Amprev. Segundo a ata do Conselho Estadual de Previdência
  publicada no Diário Oficial, foi ele quem provocou a convocação da 12ª reunião do CIAP, em 19/07/2024,
  por preocupação com as movimentações do mercado financeiro e com as notícias já veiculadas sobre o Banco
  Master — e votou contra a proposta aprovada pela maioria, sugerindo que o comitê só decidisse depois
  de apreciar o parecer da visita técnica. Não é alvo da operação Zona Cinzenta.
why_in_novelo: Um dos dois conselheiros que votaram contra a continuidade das aplicações no Banco Master,
  identificados por documento oficial.
