id: valeria-vieira-pereira-da-silva
kind: person
name: Valéria Vieira Pereira da Silva
category: police
role: Delegada da Polícia Federal em Minas Gerais
positions: []
summary: 'Afastada preventivamente do cargo por decisão do ministro André Mendonça em 14/05/2026, na 6ª
  fase da Operação Compliance Zero, com proibição de contato com outros policiais, de acesso a instalações
  da PF, proibição de deixar o país e entrega do passaporte em 24 horas. Não foi presa. Segundo a decisão,
  sua conduta foi ''além da mera proximidade com investigados'', assumindo ''relevante papel no fornecimento
  de informações sigilosas ao grupo criminoso'': teria acessado, sem atribuição legal, pelo sistema e-Pol,
  inquérito de 2024 da Superintendência da PF em São Paulo — exatamente aquele em que Henrique Vorcaro
  fora intimado. É casada com o agente aposentado Francisco José Pereira da Silva, apontado como intermediário
  do repasse. Sua defesa nega. Não há denúncia oferecida nem julgamento.'
why_in_novelo: Apontada pela PF como a delegada que acessou indevidamente o inquérito que interessava
  à família Vorcaro.
cited_position:
- kind: denial
  summary: 'O advogado Bruno Correia Lemos negou o vazamento, sustentando que o acesso aos sistemas da
    PF é controlado por matrícula funcional e que nem ela nem o marido estavam cadastrados no procedimento
    citado: ''não é possível que um agente público não cadastrado em uma investigação sigilosa acesse
    aquela investigação e extraia informações sensíveis''. A acusação, disse, ''não prospera''.'
