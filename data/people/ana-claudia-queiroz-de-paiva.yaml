open_questions:
- Sua permanência como diretora da Super Empreendimentos após a saída formal de Fabiano Zettel, somada
  à direção de três empresas dele, indica sobreposição de administração entre as estruturas — não foi
  localizada manifestação dela sobre esses vínculos nem sobre as menções na decisão do STF.
