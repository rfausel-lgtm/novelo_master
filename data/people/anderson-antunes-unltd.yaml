summary: Sócio, ao lado de André Salvador, da agência UNLTD Network Brazil Ltda (CNPJ 47.643.948/0001-29).
  Segundo a decisão de André Mendonça na PET 16.346, a agência foi apontada como executora do 'Projeto
  DV', de aproximação de influenciadores e formadores de opinião a favor do Banco Master.
why_in_novelo: Sócio de agência apontada, em decisão judicial da Operação Compliance Zero, como executora
  de campanha coordenada de influenciadores a favor do Banco Master.
