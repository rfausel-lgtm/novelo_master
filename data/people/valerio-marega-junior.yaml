open_questions:
- A decisão descreve a narrativa da PF; não há juízo de mérito sobre a conduta.
- Segundo reportagem do UOL (replicada por quatro veículos), a offshore WNT Master Fortress (Bahamas),
  a ele ligada, controlaria cerca de metade do fundo Fortress — um dos dois fundos controladores do Diamond
  FIP–Multiestratégia, que por sua vez detém a PKL One Participações (Credcesta, núcleo Augusto Lima).
  Conexão de fonte secundária, não verificada por registro primário pela equipe.
