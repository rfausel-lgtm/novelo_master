summary: 'Aparece na decisão da Petição 16.229 do STF, que reproduz a narrativa da Polícia Federal: Augusto
  Lima teria acionado Valério Marega Júnior, identificado como ''Valério Fundos'', para tratar da operacionalização
  da aquisição do apartamento nº 1.702 do empreendimento Poème Horto. A descrição é da autoridade policial
  e não houve juízo de mérito.'
why_in_novelo: É nomeado em decisão pública do STF como quem teria sido acionado para operacionalizar
  a compra do imóvel no centro do primeiro eixo da investigação sobre Jaques Wagner.
