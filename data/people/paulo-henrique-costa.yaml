open_questions:
- O status de custódia entre julho e setembro de 2026 não foi confirmado por nenhuma fonte localizada — não se sabe
  se o pedido de liberdade provisória de 23/06/2026 foi decidido, nem o resultado.
- Nenhuma nota formal da defesa nega categoricamente os fatos centrais (recebimento dos imóveis, mensagens com Vorcaro)
  — a defesa tem focado em contestar a necessidade da prisão e negociar delação, não em negar a materialidade.
- O teor exato do indiciamento formal de agosto de 2026 (se reproduziu os mesmos crimes da decisão de prisão ou
  adicionou outros) não foi confirmado por fonte que cite o relatório final diretamente.
- Não há denúncia do MPF/PGR contra ele até a data desta apuração (08/09/2026).
- A PGR (Paulo Gonet) rejeitou formalmente sua proposta de delação em 25/06/2026, classificando-a como de 'reduzida
  utilidade e débil eficácia potencial', por 'ausência de ineditismo' nas informações oferecidas.
