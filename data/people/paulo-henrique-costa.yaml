id: paulo-henrique-costa
kind: person
name: Paulo Henrique Costa
full_name: Paulo Henrique Bezerra Rodrigues Costa
category: executive
role: Ex-presidente do Banco de Brasília (BRB); preso preventivamente desde 16/04/2026
positions:
- title: Presidente
  organization_id: banco-de-brasilia-brb
  source_ids:
  - src-stf-2026-04-16-prisao-ex-presidente-brb
summary: 'Ex-presidente do BRB (2019 a novembro de 2025), por indicação do governador do Distrito Federal Ibaneis
  Rocha. Formado em Administração de Empresas pela Universidade Católica de Pernambuco, com pós-graduação em Desenvolvimento
  Gerencial (EAESP/FGV) e Inovação Corporativa (Stanford), mestrado pela Universidade de Birmingham e mestrado executivo
  pela Kellogg School of Management. Carreira anterior: HSBC (1999), Caixa Econômica Federal (2001-2018/2019, até
  vice-presidente de Clientes, Negócios e Transformação Digital) e CEO da Ebserh (2017-2018, governo Temer). Foi
  afastado da presidência do BRB pelo próprio Ibaneis Rocha em novembro de 2025, já sob suspeita de descumprimento
  de governança na aquisição de carteiras do Master, e preso preventivamente em 16/04/2026 (Pet 15.771, STF, relator
  André Mendonça), decisão referendada por 4x0 pela 2ª Turma em 24/04/2026 (Toffoli impedido/suspeito, não votou).
  A decisão, lida integralmente pela equipe, descreve atuação ''bifronte'': agente público que teria colocado o
  BRB a serviço da liquidez do Master (que comprou cerca de R$ 12,2 bilhões em carteiras que se revelaram falsas,
  mesmo após alerta interno de fevereiro/2025) e beneficiário de R$ 146,58 milhões em seis imóveis de alto padrão,
  com pagamentos já rastreados superiores a R$ 74,6 milhões, tratados em mensagens de WhatsApp com Vorcaro (extraídas
  do celular deste) como ''cronograma pessoal''. Foi transferido para custódia mais branda (''Papudinha'') em maio
  de 2026 em meio a tratativas de delação, que a PGR recusou em junho por ''reduzida utilidade''. É um dos apenas
  três indiciados no inquérito-mãe da Compliance Zero (agosto/2026, junto de Vorcaro e Nelson Tanure); nenhuma denúncia
  do MPF/PGR foi oferecida até a data desta apuração. O status de sua custódia entre julho e setembro de 2026 não
  foi confirmado por nenhuma fonte localizada, após pedido de liberdade provisória de seu terceiro advogado em 23/06/2026
  — lacuna documentada, não resolvida. Cinco meses antes do afastamento, em 18/06/2025, assinou como presidente
  do BRB o Ofício PRESI-2025/051 ao Banco Central — a primeira manifestação institucional própria dele sobre a aquisição
  de carteiras do Master já lida diretamente pela equipe (até então só havia reportagens sobre sua atuação). No
  documento, reconhece tranches de crédito com origem em promotores de vendas contratados pelo Master e atribui
  as medidas adicionais de garantia à documentação incompleta entregue pelo Master e à auditoria independente não
  concluída. Perícia da PF de 13/08/2026 (sigilo levantado em 11/09/2026) qualifica a gestão da diretoria do BRB
  sob sua presidência como ''gestão fraudulenta'' na compra de carteiras do Master, por manipulação de procedimentos
  de governança e formalização retroativa de controles — R$ 7,6 bilhões em 22 operações pagos antes da conclusão
  dos laudos técnicos obrigatórios. Segundo o Metrópoles, o SBT News e o Congresso em Foco, é um dos cinco
  ex-dirigentes do BRB alcançados pela indisponibilidade cautelar de bens decretada pelo TCDF em 23/09/2026
  (Decisão RES nº 361/2026, sem julgamento de mérito; a nota oficial do tribunal não nomeia os atingidos).
  Segundo a CNN Brasil (15/10/2026), a PF pretende ouvi-lo depois de Vorcaro, sem data informada.'
why_in_novelo: É um dos apenas três nomes formalmente indiciados no inquérito-mãe da Compliance Zero, com decisão
  de prisão que documenta, por mensagens diretas com Daniel Vorcaro, o que a autoridade policial descreve como esquema
  de vantagem indevida via imóveis em troca da compra pelo BRB de carteiras de crédito fraudulentas do Master —
  alegação sob apuração, sem denúncia ou condenação até a data desta atualização.
cited_position:
- kind: denial
  summary: Seu primeiro advogado, Cleber Lopes, classificou a prisão preventiva como 'absolutamente desnecessária',
    em entrevista a jornalistas no dia da prisão.
  source_ids:
  - src-cnnbrasil-2026-04-16-quem-e-paulo-henrique-costa
  by_id: paulo-henrique-costa
  date: '2026-04-16'
- kind: clarification
  summary: 'Seu segundo advogado, Eugênio Aragão (ex-ministro da Justiça), ao deixar a defesa em meio à negociação
    de delação: ''só participa de iniciativas jurídicas pautadas por absoluta seriedade, confiança profissional
    e responsabilidade'' — sem detalhar o motivo da saída.'
  source_ids:
  - src-cartacapital-2026-05-19-eugenio-aragao-deixa-defesa-phc
  by_id: paulo-henrique-costa
  date: '2026-05-19'
- kind: denial
  summary: Seu terceiro advogado, Davi Tangerino, pediu liberdade provisória classificando a posição da PGR sobre
    a delação recusada como 'leviana e assustadora', e afirmando que 'não há rigorosamente nada que se apure no
    inquérito' quanto ao período posterior ao afastamento dele da presidência do BRB.
  source_ids:
  - src-cnnbrasil-2026-06-23-defesa-phc-pede-soltura
  by_id: paulo-henrique-costa
  date: '2026-06-23'
- kind: no_response
  summary: Sobre a cautelar do TCDF de 23/09/2026, o Poder360 informou que a defesa foi procurada e não
    respondeu até a publicação.
  source_ids:
  - src-poder360-2026-09-23-tc-df-bloqueia-r-27-bi-em-bens-de-ex-dirigentes-do-brb
  by_id: paulo-henrique-costa
  date: '2026-09-23'
- kind: version
  summary: 'Segundo O Tempo (fonte única), a defesa disse em 15/10/2026 que ele foi presidente do BRB, "não
    seu dono", que decisões dessa envergadura exigiam aprovação do Conselho de Administração e que o
    acionista majoritário era o Governo do Distrito Federal. O Metrópoles (09/10) e a CNN Brasil (10/10)
    informam não haver manifestação da defesa dele sobre o relatório da PF até as respectivas publicações.'
