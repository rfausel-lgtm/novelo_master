  by_id: flavio-bolsonaro
  date: '2026-05-14'
- kind: clarification
  summary: À GloboNews, admitiu ter negado a relação ('Eu menti'), alegando cláusula de confidencialidade com investidores,
    sem apresentar o contrato; prometeu prestação de contas em 30 dias.
  source_ids:
