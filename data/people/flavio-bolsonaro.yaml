summary: Senador pelo Rio de Janeiro e filho de Jair Bolsonaro. Mensagens e áudios divulgados pelo Intercept em
  maio de 2026 mostram tratativas com Daniel Vorcaro para financiar o filme 'Dark Horse', com cobrança de parcelas
  atrasadas; em 14/05/2026 admitiu à GloboNews ter negado a relação anteriormente ('Eu menti'), atribuindo a negativa
  a contrato de confidencialidade. Em 01/09/2026, diante do registro do Coaf de nova transferência em setembro de
  2025, remeteu explicações à produtora.
why_in_novelo: 'Aparece em mensagens e áudios, divulgados pela imprensa, tratando com Daniel Vorcaro do financiamento
  do filme ''Dark Horse''; sua posição pública está registrada. NOVO: notícia-crime de deputado federal (desentranhada
  da PET 15.556 em 12/07/2026) relata que ele visitou Vorcaro em sua residência particular no final de 2025, período
  em que o banqueiro já cumpria restrições cautelares — fato confirmado pelo próprio senador ao O Globo.'
cited_position:
- kind: version
  summary: Afirmou que se tratava de 'um filho procurando investidores privados para fazer um filme privado sobre
    a história do seu próprio pai', sem dinheiro público, e que conheceu Vorcaro em dezembro de 2024, quando 'não
    havia absolutamente nenhuma acusação contra ele'.
  source_ids:
