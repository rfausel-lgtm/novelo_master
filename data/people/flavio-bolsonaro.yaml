open_questions:
- A prestação de contas do filme prometida em maio de 2026 não foi localizada pela equipe.
- O corpus não contém o contrato de confidencialidade mencionado pelo senador.
- Os inquéritos no STF (relatores André Mendonça e Flávio Dino) não foram lidos pela equipe; o corpus registra apenas
  a descrição da imprensa.
- A colaboração premiada de Antonio Carlos Freixo Júnior ('Mineiro'), fechada em 03/09/2026, alega repasses relacionados
  a ele dentro de uma movimentação de cerca de US$ 1 bilhão para Vorcaro — alegação do colaborador, não confirmada
  por prova independente, e sem manifestação pública dele especificamente sobre esse ponto.
- O publicitário Marcello Lopes, amigo pessoal do senador e marqueteiro de sua pré-campanha presidencial até 20/05/2026,
  é o remetente de R$ 1 milhão à produtora de 'Dark Horse' citado na decisão do STF de 03/09/2026. Nenhum documento
  lido pela equipe liga o aporte ao senador; o que está documentado é a relação profissional e pessoal entre os
  dois e a coincidência de que a saída de Lopes da campanha se deu em meio à repercussão das mensagens do senador
  com Daniel Vorcaro sobre o financiamento do filme.
