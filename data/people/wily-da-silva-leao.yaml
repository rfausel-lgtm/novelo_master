open_questions:
- O cargo exato no BRB não está apurado, pois o SBT News fala em ex-gerente de Tesouraria e da Superintendência
  de Operações Financeiras e o Metrópoles, em ex-integrante dessa superintendência; não há ato de nomeação
  localizado.
- Confirmação do nome e do cargo por documento oficial (extrato do DODF de 05/10/2026, págs. 53-54, não
  aberto; matéria individual do DODF com ele como gestor de contrato).
- 'Defesa: o prazo de 30 dias dado pelo TCDF está, em princípio, ainda em curso; o termo inicial não é documentado
  (depende da intimação); nada localizado até 16/10/2026.'
