summary: >-
  Segundo o Metrópoles, o SBT News e o Congresso em Foco, é um dos cinco ex-dirigentes do BRB alcançados pela
  indisponibilidade cautelar de bens decretada pelo TCDF em 23/09/2026 (Decisão RES nº 361/2026, cautelar, sem
  julgamento de mérito). O SBT News o descreve como ex-gerente de Tesouraria e da Superintendência de
  Operações Financeiras; o Metrópoles, como ex-integrante dessa superintendência. Nenhum ato de nomeação foi
  localizado.
why_in_novelo: Um dos cinco ex-dirigentes do BRB alcançados pela cautelar de indisponibilidade de bens do TCDF de 23/09/2026, segundo a imprensa; a nota oficial do tribunal não nomeia os atingidos.
