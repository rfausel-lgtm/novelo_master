id: augusto-de-arruda-botelho
kind: person
name: Augusto de Arruda Botelho
category: lawyer
role: Advogado criminalista que defende Luiz Antonio Bull no caso Banco Master
positions: []
summary: 'Advogado criminalista, nascido em São Paulo (16/08/1977), bacharel em Direito pela Universidade
  Paulista (2002), com especialização em Direito Penal pela Universidade de Salamanca (Espanha) e em Direito
  Penal Econômico pela Universidade de Coimbra (Portugal). Iniciou a carreira no escritório de Márcio
  Thomaz Bastos, ex-ministro da Justiça. Fundador da Arruda Botelho Sociedade de Advogados (São Paulo),
  banca especializada em Direito Penal e Direito Penal Econômico. Atuou em casos notórios: defesa da TÜV
  Süd (rompimento da barragem de Brumadinho), de Preta Ferreira e Sidney Ferreira da Silva (movimento
  de moradia de São Paulo, desabamento do Edifício Wilton Paes de Almeida), e da Odebrecht/Novonor na
  Operação Lava Jato. Foi Secretário Nacional de Justiça no governo Lula (empossado por Flávio Dino em
  janeiro/2023, até 31/01/2024). É conselheiro da Human Rights Watch e um dos fundadores do Instituto
  de Defesa do Direito de Defesa (IDDD). No caso Master, defende Luiz Antonio Bull, ex-diretor de compliance/riscos
  do banco, investigado na Operação Compliance Zero. Viajou com o ministro Dias Toffoli — então relator
  do caso Master no STF — a Lima (Peru), entre 28 e 30/11/2025, no jato do empresário Luiz Osvaldo Pastore,
  para assistir à final da Libertadores (Palmeiras x Flamengo); Toffoli e Botelho são ambos palmeirenses.
  Dois dias depois, Toffoli decretou sigilo no processo — episódio que se tornou uma das três frentes
  citadas pela PF num pedido de suspeição contra o ministro em fevereiro de 2026, posteriormente arquivado
  por Fachin.'
why_in_novelo: É o advogado cuja viagem com o relator do caso Master, dias antes de o ministro decretar
  sigilo no processo, motivou parte de um pedido formal de suspeição da PF contra Toffoli e uma discussão
  ética na OAB-SP sobre transporte gratuito de magistrados por particulares.
