summary: Presidente do Banco Central. Segundo a CNN Brasil e a Gazeta do Povo, participou, ainda como
  indicado à presidência do BC, do encontro de 04/12/2024 entre Lula e Vorcaro no Planalto, chamado por
  Lula para tratar tecnicamente das questões apresentadas. Como presidente, autorizou a liquidação extrajudicial
  do Master em 18/11/2025, segundo a CNN.
why_in_novelo: Presidia o Banco Central quando a compra do Master pelo BRB foi rejeitada e quando o banco
  foi liquidado, e participou, como indicado ao cargo, do encontro de dezembro de 2024 no Planalto.
