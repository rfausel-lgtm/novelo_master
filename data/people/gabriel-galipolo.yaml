open_questions:
- 'Depoimento à PF de 06/10/2026: registrado só pelo SBT News (fonte única, classe A); conteúdo não divulgado; sem nota do Banco Central.'
- 'A sequência a registrar sem insinuação: participou da reunião de 04/12/2024 como diretor do BC já indicado
  à presidência; assumiu em janeiro de 2025; em setembro de 2025 a diretoria colegiada barrou a compra
  do Master pelo BRB; e em 18/11/2025 o BC decretou a liquidação. Não há apuração pessoal contra ele;
  a inspeção do TCU recai sobre a liquidação e a supervisão da autarquia.'
