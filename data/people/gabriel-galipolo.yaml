name: Gabriel Galípolo
category: public_official
role: Presidente do Banco Central do Brasil (desde 2025); diretor do BC em 2024
positions:
- title: Presidente
  organization_id: banco-central-do-brasil
  start_date: 2025-01
  source_ids:
  - src-cnn-2025-11-18-bc-rejeitou-compra-setembro
summary: 'Presidente do Banco Central. Segundo a CNN Brasil e a Gazeta do Povo, participou, ainda como
  indicado à presidência do BC, do encontro de 04/12/2024 entre Lula e Vorcaro no Planalto, chamado por
  Lula para tratar tecnicamente das questões apresentadas. Como presidente, autorizou a liquidação extrajudicial
  do Master em 18/11/2025, segundo a CNN. Correção de registro: ele não negou ter tratado do Banco Master
  com ministros do STF — confirmou reuniões com Alexandre de Moraes e recusou-se a dizer se o Master foi
  discutido, invocando dever fiduciário de sigilo, e o relator da CPI consignou em ata que o depoente
  ''não afirmou que não tratou de Banco Master''. Em audiência na CAE do Senado, em 19/05/2026, negou
  categoricamente, a questionamento do senador Renan Calheiros, ter defendido a venda do banco ao BRB
  ou intercedido junto ao FGC: ''A informação está errada. Não há nenhuma carta com valor de R$ 11 bilhões,
  o Banco Central jamais tentou viabilizar a venda.'' Segundo a Agência Estado, disse em 24/09/2026 ter
  sido intimado pela PF para depor sobre a fiscalização do Master; segundo o SBT News (fonte única), prestou
  depoimento como testemunha em 06/10/2026, de conteúdo não divulgado. No Acórdão 5163/2026 do TCU (13/10/2026),
  que sobrestou o julgamento das contas de 2025 do Banco Central, consta como responsável pela prestação das
  contas, condição que não implica imputação.'
why_in_novelo: Presidia o Banco Central quando a compra do Master pelo BRB foi rejeitada e quando o banco
  foi liquidado, e participou, como indicado ao cargo, do encontro de dezembro de 2024 no Planalto.
