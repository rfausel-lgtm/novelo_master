summary: Jornalista, editor do ConJur. Segundo a Folha de S.Paulo (Mônica Bergamo, 05/03/2026), foi
  contratado pelos organizadores do fórum jurídico em Londres — o mesmo evento de abril de 2024 patrocinado
  pelo Banco Master que reuniu ministros do STF e do STJ, o então procurador-geral da República e o
  diretor-geral da PF — para formatar as mesas do evento, e negociou diretamente com Daniel Vorcaro a
  composição da lista de convidados. Segundo a revista piauí (10/09/2026), com base em relatório da PF, o
  convite ao evento apresentava ConJur, Correio Braziliense e Banco Master como organizadores, e Chaer
  tranquilizou Vorcaro — preocupado com a exposição do banco como financiador — dizendo que a formulação do
  convite ficava "sóbria". Em 01/09/2026 (Estadão Conteúdo, via UOL), o próprio Chaer confirmou publicamente
  ter organizado a edição de 2024 e que o ConJur recebeu patrocínio do Master, mas disse ter declinado de
  organizar a edição de 2025.
why_in_novelo: É o jornalista/editor apontado por relatório da PF e por reportagens independentes como
  intermediário direto entre Daniel Vorcaro e a organização de um evento jurídico de alto nível — no mesmo
  fórum de Londres já registrado no acervo — negociando lista de convidados e gerenciando a exposição do
  banco como patrocinador.
cited_position:
- kind: clarification
  summary: Confirmou ter organizado a edição de 2024 do fórum em Londres e que o ConJur recebeu patrocínio
    do Banco Master; disse ter declinado do convite para a edição de 2025. Descreveu as interlocuções com
    Vorcaro sobre a lista de convidados como prática usual entre organizadores e patrocinadores.
