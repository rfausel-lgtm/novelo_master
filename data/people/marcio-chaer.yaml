open_questions:
- Uma petição de terceiro interessado na Pet 16.662/DF (Luiz Eduardo Bottura, litigante antigo de Chaer em
  disputa reputacional não relacionada ao Master) alega vínculo comercial entre a assessoria de imprensa de
  Chaer (Original 123) e partes de um litígio arbitral distinto, sob investigação de corrupção na Corte
  Especial do STJ (Pet 16.036/DF, Pet 16.087/DF) — sem qualquer alegação de que Chaer tenha participado dos
  atos de corrupção ali investigados. Trata-se de matéria estranha ao caso Banco Master, registrada aqui
  apenas para nota, não incorporada ao acervo.
