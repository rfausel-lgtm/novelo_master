  summary: Nenhuma manifestação dele foi localizada no corpus, e a equipe não conseguiu contato.
open_questions:
- 'RESOLVIDO EM PARTE (15/09/2026): identidade e ocupação agora vêm da imprensa (Gazeta Mercantil; O Bastidor
  via ADPF 1.196) — conselheiro da Cortel, diretor da Zion Capital, cofundador do Brazilian Graveyard,
  sócio da Blackwood. Continua não documentado: que o alvo da Pet 15.198 seja essa pessoa (ver
  ev-conte-bloqueados-pet15198-coincidem-com-irmaos-da-imprensa) e por que o bloqueio chegou a R$ 1 bilhão.'
- 'RESOLVIDO EM PARTE (15/09/2026): a Gazeta Mercantil descreve ele e Antônio Augusto Conte como irmãos —
  fonte única, sem documento de registro civil.'
- Nenhum registro societário da Cortel, da Zion Capital ou da Blackwood foi lido pela equipe.
- A resposta da CVM à requisição do Min. Dino (prazo de 15 dias a partir de 15/09/2026) sobre fundos ligados
  a cemitérios de São Paulo pode trazer o primeiro documento oficial sobre seu papel.
