id: anderson-wander-da-silva-lima
kind: person
name: Anderson Wander da Silva Lima
category: police
role: Agente da Polícia Federal lotado na Superintendência Regional do Rio de Janeiro
positions: []
summary: 'Preso preventivamente em 14/05/2026, na 6ª fase da Operação Compliance Zero. Segundo a Polícia
  Federal, seria ''agente infiltrado funcionalmente na Polícia Federal em benefício da organização criminosa''
  e atuaria como ''longa manus'' de Marilson Roseno da Silva, tendo recebido propina para realizar consultas
  em sistemas restritos da corporação — dados migratórios, inquéritos e registros reservados. Em 26/06/2026,
  segundo o ICL Notícias, foi citado nominalmente entre os alvos de processo administrativo disciplinar
  aberto pela Corregedoria da PF. Não há denúncia oferecida nem julgamento: as imputações são da autoridade
  policial, acolhidas em cognição sumária para fins cautelares. Procurada, sua defesa não se manifestou.
  DETALHADO PELA DECISÃO DA 6ª FASE (13/05/2026, lote 193, PET 15.978): mensagens de WhatsApp mostram
  padrão de consultas indevidas desde pelo menos agosto de 2023 — verificação de viagem internacional de
  uma pessoa (05/08/2023), sondagem de inquéritos envolvendo Daniel e Henrique Vorcaro (fevereiro de 2024),
  consulta sobre um DJ a pedido de Marilson (outubro de 2024, com alegação não verificada dele sobre o
  alvo). Recebeu contrapartidas via Pix, incluindo presente pelo vestibular da filha (agosto de 2023) e
  ''oferenda'' de fim de ano já em 31/12/2025, meses depois da 1ª fase da operação. No mesmo dia 13/05/2026,
  na PET 16.019 (processo formal de bloqueio patrimonial, distinto da PET 15.978), teve R$ 9,6 milhões em
  bens e valores bloqueados por decisão de Mendonça.'
why_in_novelo: Apontado pela PF como o agente da ativa que fornecia informações sigilosas ao núcleo que
  atuava em favor da família Vorcaro.
