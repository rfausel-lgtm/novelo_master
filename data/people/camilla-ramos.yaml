role: Advogada; sócia do escritório Queiroga, Vieira, Queiroz & Ramos Advocacia, segundo a Agência Brasil e o Times Brasil
positions: []
summary: >-
  Advogada. A Agência Brasil e o Times Brasil a descrevem como sócia do escritório Queiroga, Vieira, Queiroz &
  Ramos Advocacia, que, segundo o Metrópoles e a CNN Brasil, firmou com o Banco Master contrato de honorários de
  êxito de 5% em 12 ações do setor sucroalcooleiro; segundo o Metrópoles, o contrato prevê a prestação de
  serviços por ela. Em nota de 21/09/2026, o desembargador federal Newton Ramos (TRF-1), que se declarou casado
  com ela, afirmou que ela "atua em causas cíveis para o Banco Master". O escritório declarou ter o contrato em
  nota de 23/09/2026 e disse nunca ter recebido pagamento. Segundo o Metrópoles e a CNN Brasil, mensagens de
  assessores de Vorcaro referem-se a ela e ao marido como "Turma do KN"; a leitura da sigla como referência ao
  ministro Nunes Marques é da imprensa e não está demonstrada por documento acessível ao Novelo.
why_in_novelo: Sócia, segundo a imprensa, do escritório que, segundo o Metrópoles e a CNN Brasil, firmou com o Banco Master contrato de honorários de êxito em ações de precatórios; o escritório declara ter o contrato e diz não ter recebido pagamento.
