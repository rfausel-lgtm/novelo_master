open_questions:
- 'A pedido do próprio jornalista, por e-mail de 08/09/2026, a ficha foi revisada: a versão anterior citava
  formação pela Uninove e ESPM, e ''onze anos no Grupo Comunique-se, de estagiário a editor sênior'' —
  informação sem fonte própria no corpus, agora removida por falta de verificação; mantida apenas a passagem
  pela Comunique-se enquanto veículo de imprensa que noticiou sua chegada à Revista Oeste, corroborada
  de forma independente. As afirmações do próprio site dele (Vaticano, Congresso dos EUA, prêmio ''Civilization
  Works'', citações internacionais) são mantidas como autodescrição atribuída, não como fato verificado
  — o corpus não confirmou nenhuma delas por fonte independente.'
- 'Aplicação da diretriz editorial registrada nesta ficha, em 09/09/2026: sua reportagem sobre o arquivamento
  da Petição 11.228 foi submetida a verificação direta contra o andamento processual público do STF. A
  espinha factual e cronológica CONFIRMOU-SE integralmente — existência e classe do processo, partes,
  datas de protocolo e autuação, relator por prevenção, o intervalo de exatamente 1.219 dias sem movimentação
  e a decisão de 21/08/2026 com vista à PGR e remessa à autoridade policial. Duas ressalvas permanecem:
  o teor do despacho não é conferível por terceiros, por correr o processo em segredo de justiça; e a
  matéria descreve o denunciante como deputado federal, quando o registro oficial confirma tratar-se de
  deputado estadual — imprecisão que, no entanto, reforça em vez de enfraquecer a crítica de competência
  que ela própria levanta.'
- 'Correção de 16/10/2026: o instrumento era uma representação criminal, e não uma ação penal. O número
  (Pet 14.760) consta do nome do arquivo PDF dos autos hospedado pelo Poder360 e linkado na matéria de
  27/01/2026; nem esse PDF nem o da decisão foram abertos em texto pelo Novelo. A caracterização da autora
  da representação como colaboradora do TSE é dos dois autores; a imprensa a descreve como jornalista
  e pesquisadora da UnB. O Novelo não nomeia a autora da representação.'
- 'Datas divergentes: a petição teria sido protocolada em 25/10/2025 e arquivada em 28/01/2026, segundo
  Ágape; a Gazeta do Povo diz 21/10/2025 para o protocolo e 30/10 para o envio à PGR; o Poder360 publicou
  a notícia do arquivamento em 27/01/2026, um dia antes da data dada por Ágape. A data da assinatura da
  decisão não foi conferida em texto.'
