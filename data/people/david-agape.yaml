id: david-agape
kind: person
name: David Ágape
category: journalist
role: Jornalista; autor da newsletter 'A Investigação' (ainvestigacao.com)
positions: []
summary: Jornalista formado pela Uninove, com especialização em jornalismo digital pela ESPM. Onze anos
  no Grupo Comunique-se (de estagiário a editor sênior); atuou como freelancer no Metrópoles e na Gazeta
  do Povo; é colunista da Revista Oeste (linha editorial conservadora). Autor da série 'Twitter Files
  Brazil' e de 'Vaza Toga' (com Eli Vieira), pela qual ambos foram alvo de ação penal apresentada ao STF
  por ex-colaboradora do TSE, sob acusação de incitação, perseguição e 'tentativa de subversão do Estado
  Democrático de Direito' — ação arquivada pelo próprio ministro Alexandre de Moraes por falta de indícios
  mínimos de crime. Publica, na newsletter 'A Investigação', cobertura de linha editorial declaradamente
  crítica ao STF e ao governo, com conteúdo parcialmente restrito a assinantes. A equipe editorial NÃO
  localizou fact-checking institucional (Aos Fatos, Lupa, Comprova) desmentindo publicações específicas
  dele. Em checagem direta de um de seus artigos contra o documento primário citado, a equipe não confirmou
  nenhum erro factual na redação do texto (ver evidência correlata) — mas, dado o histórico de atrito
  pessoal direto com o ministro que é alvo central de suas matérias atuais sobre a crise Moraes-Mendonça,
  o corpus trata sua reportagem como posição atribuída, nunca como lastro factual autônomo sem verificação
  direta contra documento primário.
why_in_novelo: É a fonte de múltiplas reportagens recentes sobre a crise institucional Moraes-Mendonça
  no STF, com linha editorial declarada e histórico de atrito com um dos ministros centrais ao caso —
  perfil relevante para calibrar o padrão de verificação aplicado às suas alegações.
