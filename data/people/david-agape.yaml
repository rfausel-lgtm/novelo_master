name: David Ágape
category: journalist
role: Jornalista investigativo; fundador de A Investigação (ainvestigacao.com); colunista da Revista Oeste;
  segundo autodescrição em seu site oficial, diretor de comunicação da Free Speech Union Brasil
positions: []
summary: Jornalista investigativo brasileiro, fundador da newsletter 'A Investigação'. É colunista da
  Revista Oeste (linha editorial conservadora) — vínculo corroborado de forma independente pela página
  de autor do próprio veículo e por nota do portal de mídia Comunique-se sobre sua chegada à redação.
  Idealizador da série 'Twitter Files Brazil' (com Michael Shellenberger e Eli Vieira) e de 'Vaza Toga
  2 e 4' (com Eli Vieira) — por esta última, ambos foram alvo de ação penal apresentada ao STF por ex-colaboradora
  do TSE, sob acusação de incitação, perseguição e 'tentativa de subversão do Estado Democrático de Direito',
  ação arquivada pelo próprio ministro Alexandre de Moraes por falta de indícios mínimos de crime. Segundo
  autodescrição em seu site oficial (davidagape.com) — não verificada de forma independente pela equipe
  —, é também diretor de comunicação da Free Speech Union Brasil, coautor do livro 'In Verbo Veritas',
  vencedor do 'Free Speech Courage Award' (Civilization Works, Londres, 2026), e seu trabalho já provocou
  depoimentos no Senado Federal, na Câmara dos Deputados, no Congresso dos Estados Unidos e 'intervenção
  direta do Vaticano' em 2019, após reportagem sobre os Arautos do Evangelho; o mesmo site lista citações
  por veículos como NYT, Reuters, BBC e WSJ sem links de verificação. Publica, na 'A Investigação', cobertura
  de linha editorial declaradamente crítica ao STF e ao governo, com conteúdo parcialmente restrito a
  assinantes. A equipe editorial NÃO localizou fact-checking institucional (Aos Fatos, Lupa, Comprova)
  desmentindo publicações específicas dele. Em checagem direta de um de seus artigos contra o documento
  primário citado, a equipe não confirmou nenhum erro factual na redação do texto — mas, dado o histórico
  de atrito pessoal direto com o ministro que é alvo central de suas matérias atuais sobre a crise Moraes-Mendonça,
  o corpus trata sua reportagem como posição atribuída, nunca como lastro factual autônomo sem verificação
  direta contra documento primário.
why_in_novelo: É a fonte de múltiplas reportagens recentes sobre a crise institucional Moraes-Mendonça
  no STF, com linha editorial declarada e histórico de atrito com um dos ministros centrais ao caso —
  perfil relevante para calibrar o padrão de verificação aplicado às suas alegações.
