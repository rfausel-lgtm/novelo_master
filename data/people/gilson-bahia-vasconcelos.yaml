id: gilson-bahia-vasconcelos
kind: person
name: Gilson Bahia Vasconcelos
category: other
role: Titular formal ("laranja" apontado pela PF) das empresas Mídias Promotora Ltda
summary: Segundo o documento comprobatório da PF na Pet 15.497/DF, é a pessoa física titular das
  duas empresas "Mídias Promotora Ltda" (CNPJ 37.565.625/0001-00 e 44.758.763/0001-71) usadas para receber
  pagamentos de comissão do Banco Master a Ricardo Siqueira Rodrigues. A PF observa que o telefone cadastrado
  na Receita Federal para essas empresas está vinculado a Ricardo Siqueira, não a ele — indício de que atua
  como testa de ferro. Tem histórico de boletins de ocorrência por estelionato e organização criminosa,
  mandado de prisão recente, e recebeu cinco parcelas de Auxílio Emergencial (2020-2021) — perfil incompatível
  com o de titular de empresas que movimentaram dezenas de milhões de reais.
why_in_novelo: Apontado como testa de ferro na estrutura usada para pagar a comissão de Ricardo Siqueira
  Rodrigues pela intermediação dos aportes do Rioprevidência no Banco Master.
cited_position:
