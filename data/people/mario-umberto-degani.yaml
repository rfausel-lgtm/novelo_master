role: Fundador do Resort Tayayá e sócio da DGEP Empreendimentos; primo do ministro Dias Toffoli
summary: 'Empresário de Ribeirão Claro (PR), conhecido como Beto Degani. Segundo a imprensa, é primo do ministro Dias
  Toffoli — filho de Iracema Dias Degani, irmã da mãe do ministro —, comprou em 2000, com o advogado Euclides Gava, as
  terras onde surgiu o Resort Tayayá e esteve na DGEP Empreendimentos e Participações, incorporadora do empreendimento.
  Vendeu sua parte no resort em julho de 2025 ao advogado Paulo Humberto Barbosa e a empresas ligadas a ele. Foi citado
  nos Requerimentos 160 e 161/2026 da CPI do Crime Organizado, do senador Alessandro Vieira, como tendo relação
  societária com a Maridt ou a DGEP, empresas que transferiram cotas do resort ao fundo Arleen e à PHD Holding.'
why_in_novelo: É o terceiro nome, ao lado dos irmãos Dias Toffoli, cuja oitiva a CPI do Crime Organizado vinculou à
  cadeia societária do Tayayá e ao fundo Arleen, ligado ao cunhado de Daniel Vorcaro.
cited_position:
- kind: not_located
  summary: A reportagem do Jornal de Brasília registra não ter conseguido falar com ele; nenhuma manifestação pública
    localizada.
open_questions:
- Não se sabe se ele próprio foi convocado por requerimento autônomo da CPI nem se consta como investigado em processo
  do STF; os documentos lidos só o citam na justificação dos requerimentos sobre os irmãos Dias Toffoli.
- As fontes descrevem de modo diferente a ligação dele com a DGEP (sócio-fundador segundo uma, incorporadora registrada
  em 2006 segundo outra); os atos na Junta Comercial não foram consultados.
