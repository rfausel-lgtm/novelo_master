open_questions:
- 'RESOLVIDO EM PARTE (lote 241): a decisão primária de 26/02/2026 foi lida por inteiro — confirma a
  dispensa e a suposta "relação ilícita" alegada pela própria defesa como fundamento da convocação, mas
  não detalha qual conduta lhe é especificamente atribuída no INQ 5.026/DF além de figurar como
  investigado.'
