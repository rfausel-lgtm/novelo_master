role: Investigado no Inquérito 5.026/DF, dispensado de comparecimento obrigatório à CPI do Crime Organizado
summary: 'Citado na petição de Ibaneis Rocha (e-Doc 216) como uma das pessoas que, no âmbito do Inquérito 5.026/DF,
  tiveram a obrigatoriedade de comparecimento à CPI do Crime Organizado afastada por decisão do ministro André Mendonça
  em 26/02/2026 — mesma data da dispensa dos irmãos Dias Toffoli. ACHADO NOVO (lote 241): a decisão primária (Petição
  21112/2026, e-Doc. 376), lida por inteiro, revela que o Requerimento nº 145/2026 que motivou sua convocação pela
  CPI tinha fundamentação idêntica à dos irmãos Toffoli (mesmo texto-modelo), e que sua própria defesa caracteriza
  o requerimento como baseado em suposta "relação ilícita" entre ele e outros convocados — alegação da defesa sobre
  o que a CPI teria usado contra ele, não fato apurado. O corpus não localizou, além disso, nenhum outro documento
  que explique seu papel nas investigações do caso Master. ACHADO (lote 263): segundo o Jornal de Brasília e o FatoNews,
  é o advogado que comprou em 2025, com empresas ligadas a ele, a participação de Mario Umberto Degani, primo de Dias
  Toffoli, no Resort Tayayá — e, segundo o FatoNews, as de todos os sócios, inclusive as de Toffoli e parentes.'
why_in_novelo: Investigado no INQ 5.026 que, segundo a imprensa, comprou em 2025 participações no Resort Tayayá, empreendimento
  ligado à família de Dias Toffoli e ao fundo Arleen.
