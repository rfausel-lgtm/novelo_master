open_questions:
- 'Número do inquérito no Superior Tribunal de Justiça e ministro relator não localizados: o tribunal
  opõe sigilo e sua consulta processual bloqueou o acesso automatizado. Sem o número não é possível verificar
  o objeto exato da apuração nem eventuais coinvestigados.'
- Sua defesa afirma que 24 instituições foram credenciadas em sua gestão e que o Banco Master não foi
  a primeira. O número é cumulativo até 2025; apurar quantos convênios existiam na data da assinatura
  de 2023 para aferir o peso do argumento.
- Número da portaria de 01/06/2023 que oficializou a autorização, com validade declarada até maio de 2028,
  não localizado.
