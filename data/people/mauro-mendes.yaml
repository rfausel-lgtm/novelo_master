id: mauro-mendes
kind: person
name: Mauro Mendes
category: public_official
role: Ex-governador de Mato Grosso (2019–2026), do União Brasil; renunciou ao cargo em 31/03/2026 para
  disputar o Senado
positions: []
summary: Assinou, em 05/05/2023, o decreto que criou em Mato Grosso a margem consignável exclusiva de
  10% para cartão de benefício. É investigado no Superior Tribunal de Justiça, a pedido da Procuradoria-Geral
  da República, por suposto favorecimento ao Banco Master no credenciamento que se seguiu ao decreto.
why_in_novelo: Engenheiro civil e empresário, foi prefeito de Cuiabá antes de eleger-se governador. Sua
  assinatura está no ato normativo que abriu, na folha do funcionalismo mato-grossense, o espaço em que
  o CredCesta viria a operar. O texto integral do decreto, recuperado na base da Secretaria de Fazenda
  estadual, mostra que a margem de 10% foi desenhada para não concorrer com as demais e que a exigência
  de autorização do Banco Central foi deslocada da operadora para o parceiro bancário. Três dias após
  a publicação o Banco Master pediu credenciamento; o convênio, de cinco anos, foi assinado menos de um
  mês depois. A margem exclusiva viria a ser encerrada em junho de 2025 por lei estadual. Reportagem de
  junho de 2026 revelou que o Superior Tribunal de Justiça apura o episódio sob sigilo, e registrou que
  ele estava em Nova York, em evento empresarial, na véspera da aprovação.
cited_position:
