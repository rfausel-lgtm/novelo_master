open_questions:
- 'Se Motta é investigado: as reportagens (IstoÉ, Gazeta do Povo) dizem que não; o Novelo não localizou documento
  oficial que o confirme ou o negue.'
- 'Número de diárias em Lisboa: duas, segundo Motta; cinco, segundo a PF descrita pela imprensa. O relatório não
  foi localizado.'
- 'Origem processual dos registros de chamadas e encontros (CNN Brasil) e do grupo de WhatsApp (UOL): não citada
  pelas fontes.'
