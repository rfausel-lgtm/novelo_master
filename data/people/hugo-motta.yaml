summary: >-
  Presidente da Câmara dos Deputados, descrito pela imprensa como "afilhado político" de seu antecessor, Arthur
  Lira. No MS 40791, o deputado Rodrigo Rollemberg alegou omissão de Motta na instalação da CPI do Banco Master
  (requerimento de 02/02/2026 com 201 assinaturas); o STF rejeitou o pedido em 12/03/2026 por falta de prova de
  omissão ilegal. Segundo o Poder360, a Mesa Diretora da Câmara, sob sua presidência, pediu ao Min. Flávio Dino,
  em dezembro/2025, a anulação das provas obtidas pela PF contra Mariângela Fialek, servidora nomeada por Lira e
  investigada em apuração sobre emendas parlamentares, e o retorno dela ao cargo. Segundo reportagens de
  16/06/2026 que descrevem relatório da PF não localizado pelo Novelo, Vorcaro pagou hospedagem de "Ciro" e
  "Hugo", identificados pela PF como Ciro Nogueira e Motta, em hotel de Lisboa em junho de 2024; Motta afirmou
  em 16 e 17/06 que viajou no jato de Vorcaro a convite de Ciro, que teve duas diárias pagas por Vorcaro (a PF
  conta cinco) e que se tratava de evento corporativo, um encontro jurídico. Segundo a CNN Brasil (29/09/2026),
  registros extraídos pela PF do celular de Vorcaro mostram ao menos 100 chamadas concluídas e 102 não concluídas entre
  os dois e ao menos 19 encontros combinados de 03/2024 a 10/2025; segundo o UOL (30/09/2026), participava com Vorcaro, Ciro e Fábio
  Faria de um grupo de WhatsApp. As reportagens registram que Motta não é investigado; o Novelo não localizou
  documento oficial sobre isso.
why_in_novelo: >-
  Presidente da Câmara dos Deputados; citado em reportagens sobre relatórios da PF como hóspede, em Lisboa em
  06/2024, de hotel pago por Daniel Vorcaro; Motta afirma ter tido duas diárias pagas.
