- date: '2026-06-17'
  by_id: hugo-motta
  kind: version
  summary: >-
    Afirmou que viajou a Lisboa no jato de Vorcaro a convite de Ciro Nogueira e que Vorcaro pagou a hospedagem,
    mas que teve apenas duas diárias pagas; descreveu a viagem como evento corporativo, um encontro jurídico;
    disse, segundo o Correio da Manhã, que em 2024 desconhecia as irregularidades atribuídas ao banqueiro, e,
    segundo a Gazeta do Povo (16/06), que tem tranquilidade sobre suas relações e defende que as investigações
    prossigam.
