summary: 'Presidente da Câmara dos Deputados, descrito pela imprensa como "afilhado político" de seu
  antecessor, Arthur Lira. No MS 40791, o deputado Rodrigo Rollemberg alegou omissão de Motta na instalação
  da CPI do Banco Master (requerimento de 02/02/2026 com 201 assinaturas); o STF rejeitou o pedido em
  12/03/2026 por falta de prova de omissão ilegal. NOVO (15/09/2026): a Mesa Diretora da Câmara, sob sua
  presidência, pediu ao Min. Flávio Dino, em dezembro/2025, a anulação das provas obtidas pela PF contra
  Mariângela Fialek — servidora nomeada por Lira, investigada por peculato-desvio e associação criminosa
  num esquema de R$ 119,2 milhões em emendas — e o retorno dela ao cargo.'
why_in_novelo: Foi apontado como autoridade coatora em mandado de segurança sobre a instalação da CPI
  do Banco Master, rejeitado pelo STF — e, desde dezembro/2025, a Mesa Diretora sob sua presidência pediu
  ao STF a anulação de provas contra uma servidora investigada por desvio de emendas, ação institucional
  da própria cúpula da Câmara.
