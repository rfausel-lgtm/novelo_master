id: joao-doria
kind: person
name: João Doria
category: public_official
role: Ex-governador de São Paulo (2019–2022) e ex-prefeito da capital paulista
positions: []
summary: Assinou, no último dia de seu mandato como governador, o decreto que criou na folha do funcionalismo
  paulista a espécie 'cartão de benefício' — a categoria em que o CredCesta viria a operar no maior estado
  do país.
why_in_novelo: Empresário e comunicador, elegeu-se prefeito de São Paulo em 2016 e governador em 2018,
  deixando o cargo em 31 de março de 2022 para uma tentativa frustrada de disputar a Presidência. O decreto
  de consignações que assinou nessa mesma data acrescentou ao regulamento estadual de 2014 a consignação
  facultativa por cartão de benefício, limitada a 15% da margem consignável, e admitiu como consignatárias
  empresas administradoras de cartões conveniadas a instituições financeiras autorizadas pelo Banco Central
  — fórmula que transfere ao parceiro bancário a exigência de autorização, e que Mato Grosso reproduziria
  em 2023. Quinze dias depois, já sob outro governo, a Fazenda estadual elevou de 35% para 50% a margem
  consignável global. O credenciamento da PKL One veio 55 dias após o decreto.
