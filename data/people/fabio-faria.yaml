name: Fábio Faria
category: politician
role: Empresário e ex-ministro das Comunicações (2020-2022); ex-deputado federal
positions: []
summary: Ex-ministro das Comunicações do governo Bolsonaro e ex-deputado federal. Segundo o relatório
  da PF sobre o celular de Vorcaro, compartilhou com o banqueiro, em 26/12/2023, contatos salvos como
  'Alexandre de Moraes BRASILIA', participou de tratativas sobre o prazo do contrato com o escritório
  Barci de Moraes (janeiro de 2024) e da articulação de encontros. Em nota, afirmou ter sugerido o escritório
  para um caso na Justiça de São Paulo, não ter se reunido com a banca e não conhecer os valores. Não
  é alvo da investigação, segundo a CNN Brasil.
why_in_novelo: É apontado pela Polícia Federal, em relatório sobre o celular de Daniel Vorcaro, como intermediário
  de contatos entre o banqueiro e o ministro Alexandre de Moraes; sua posição está registrada.
