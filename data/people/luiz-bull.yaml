summary: Ex-diretor de Compliance, Riscos, RH, Operações e Tecnologia do Banco Master. É citado, junto
  com Augusto Lima, no documento apócrifo encontrado nos e-mails de Vorcaro (revelado pela Gazeta do Povo
  em 11/03/2026), que o descreve como 'capataz' de Lima na gestão do banco. Sua defesa classificou o documento
  como 'carta anônima' repleta de 'adjetivos, mentiras e acusações desvinculadas de qualquer prova', pedindo
  cautela por se tratar de material de autoria não confirmada.
why_in_novelo: É o segundo nome, além de Augusto Lima, citado no documento apócrifo sobre o controle de
  fato do Master — sua reação é a única manifestação direta e nomeada localizada sobre esse documento
  específico.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- Em depoimento à PF, disse ter assinado documentos sem lê-los, alegando não ter formação jurídica nem
  em compliance — declaração relevante para apurar se houve falha estrutural ou conduta dolosa, sem que
  o corpus tome partido sobre essa distinção.
- Foi preso na primeira fase da Compliance Zero (18/11/2025); teve um Porsche financiado pelo Safra apreendido
  pela PF e, posteriormente, autorizada busca civil pelo credor após parar de pagar as parcelas alegando
  bloqueio judicial de contas.
- Não foi localizada ligação direta e documentada com Augusto Lima além do vínculo institucional comum
  como diretores do Banco Master, ambos investigados na Compliance Zero — o corpus não infla essa relação
  além do que as fontes sustentam.
