summary: Ex-diretor de Compliance, Riscos, RH, Operações e Tecnologia do Banco Master. Preso na 1ª fase
  da Compliance Zero e solto pelo TRF-1 em 28/11/2025 (HC 1045014-48.2025.4.01.0000, desembargadora Solange
  Salgado), com medidas cautelares (comparecimento periódico, proibição de contato com investigados, proibição
  de deixar o município, suspensão de atividades de gestão, monitoração eletrônica, retenção de passaporte).
  É citado, junto com Augusto Lima, no documento apócrifo encontrado nos e-mails de Vorcaro (revelado
  pela Gazeta do Povo em 11/03/2026), que o descreve como 'capataz' de Lima na gestão do banco. Sua defesa
  classificou o documento como 'carta anônima' repleta de 'adjetivos, mentiras e acusações desvinculadas
  de qualquer prova', pedindo cautela por se tratar de material de autoria não confirmada.
why_in_novelo: É o segundo nome, além de Augusto Lima, citado no documento apócrifo sobre o controle de
  fato do Master — sua reação é a única manifestação direta e nomeada localizada sobre esse documento
  específico.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
- kind: clarification
  summary: 'Por seu advogado, Augusto de Arruda Botelho, em 27/01/2026: ''Luiz Bull sempre esteve e continuará
    à disposição das autoridades. Respondeu hoje absolutamente todas as perguntas, tanto da autoridade
    policial quanto do Ministério Público e do juiz-instrutor aqui do STF, no interesse de colaborar com
    as investigações.'''
  source_ids:
  - src-metropoles-2026-01-27-botelho-bull-responde-todas-perguntas-pf
  by_id: augusto-de-arruda-botelho
  date: '2026-01-27'
open_questions:
- Em depoimento à PF, disse ter assinado documentos sem lê-los, alegando não ter formação jurídica nem
  em compliance — declaração relevante para apurar se houve falha estrutural ou conduta dolosa, sem que
  o corpus tome partido sobre essa distinção.
- Foi preso na primeira fase da Compliance Zero (18/11/2025); teve um Porsche financiado pelo Safra apreendido
  pela PF e, posteriormente, autorizada busca civil pelo credor após parar de pagar as parcelas alegando
  bloqueio judicial de contas.
- Não foi localizada ligação direta e documentada com Augusto Lima além do vínculo institucional comum
  como diretores do Banco Master, ambos investigados na Compliance Zero — o corpus não infla essa relação
  além do que as fontes sustentam.
- Seu advogado, Augusto de Arruda Botelho, viajou com o então relator do caso Master no STF, Dias Toffoli,
  a Lima, em 28-30/11/2025, num jato de terceiro — episódio que motivou pedido de suspeição contra Toffoli
  (arquivado). Nenhuma fonte atribui a Bull qualquer participação ou conhecimento sobre a viagem.
- Assinou, como diretor do Banco Master, o Termo de Convênio de Consignação nº 026/2023 com a Secretaria
  de Estado de Planejamento e Gestão de Mato Grosso, publicado em 01/06/2023, que habilitou o banco a
  operar cartão consignado de benefício na folha do funcionalismo estadual com vigência de cinco anos
  — instrumento hoje objeto de investigação no Superior Tribunal de Justiça quanto ao credenciamento.
