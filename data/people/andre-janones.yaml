name: André Janones
category: politician
role: Deputado Federal (Avante-MG)
summary: 'Deputado federal, já registrado no acervo por pedido, ao lado de outros parlamentares do PT/base
  aliada, para que Fachin declarasse a suspeição de André Mendonça (04/09/2026, após a revelação do encontro
  dele com Vorcaro no Instituto ITER). Em 09/09/2026, publicou vídeo atacando publicamente Mendonça — chamando-o
  de "vagabundo" e acusando-o de ter afastado o diretor-geral da PF, Andrei Rodrigues, para proteger a si
  mesmo — horas depois da decisão de Mendonça que determinou esse afastamento (ver
  ev-relatorio-apocrifo-autodescrito-sem-valor-probatorio.yaml). Dois advogados sem vínculo processual com
  o caso (Paulo César R. de Faria, OAB/GO, e Filipe Rocha de Oliveira, OAB/ES) protocolaram notícia-crime
  contra ele na Pet 16.662/DF, pedindo prisão em flagrante, quebra de sigilo/imunidade parlamentar e remessa
  ao TSE — petição de terceiros sem vínculo processual claro com o caso, ainda sem notícia de que tenha sido
  processada.'
why_in_novelo: Alvo de notícia-crime protocolada nos autos da Pet 16.662/DF por críticas públicas a André
  Mendonça, no auge da crise institucional STF/PF em torno do afastamento de Andrei Rodrigues.
