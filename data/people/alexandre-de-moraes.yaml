open_questions:
- O corpus não contém manifestação do ministro posterior ao levantamento do sigilo da PET 16.662 (01/09/2026).
- O relatório da PF atribui o número a um contato salvo pelo banqueiro; a titularidade da linha não está
  demonstrada no material lido pela equipe.
- Não há, no corpus, registro oficial (agenda) dos encontros referidos nas mensagens.
