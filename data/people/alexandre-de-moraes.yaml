summary: Ministro do STF. O relatório da PF sobre o celular de Daniel Vorcaro (IPJ-A 3298613/2026), tornado
  público em 01/09/2026, registra contato salvo como 'Alexandre de Moraes BRASILIA' compartilhado por
  Fábio Faria em 26/12/2023, referências a encontros e cinco mensagens de visualização única enviadas
  ao contato em 17/11/2025. O gabinete do ministro negou, em nota de 06/03/2026, ser o destinatário das
  mensagens. O relatório não conclui que o ministro tenha cometido crime e a PF informa não ter feito
  diligências contra magistrados. O escritório de advocacia de sua esposa, Viviane Barci de Moraes, manteve
  contrato com o Banco Master entre 2024 e 2025.
why_in_novelo: Aparece em relatório da Polícia Federal sobre o celular de Daniel Vorcaro como contato
  salvo e interlocutor referido em mensagens, e é cônjuge da titular do escritório contratado pelo Banco
  Master; sua posição de negativa está registrada.
cited_position:
- date: '2026-03-06'
  by_id: alexandre-de-moraes
  kind: denial
  summary: 'Nota do gabinete divulgada pela Secom do STF: ''análise técnica'' nos dados telemáticos de
    Vorcaro teria constatado que as mensagens de visualização única de 17/11/2025 ''não conferem com os
    contatos do ministro''; o material estaria vinculado a outros contatos da agenda do banqueiro.'
  source_ids:
