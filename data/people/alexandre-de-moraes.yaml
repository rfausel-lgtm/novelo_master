open_questions:
- O corpus não contém manifestação do ministro posterior ao levantamento do sigilo da PET 16.662 (01/09/2026);
  ele atuou por despacho no INQ 4.781, não por nota.
- O relatório da PF atribui o número a um contato salvo pelo banqueiro e compartilhado por Fábio Faria;
  a titularidade da linha não está demonstrada — não consta consulta cadastral à operadora.
- Os metadados da minuta de contrato registram 'Ministro Alexandre de Moraes' como usuário da última modificação;
  nome de conta de editor de texto não demonstra autoria pessoal, e a própria PF não extrai conclusão
  do dado.
- A equivalência entre os apelidos usados nas conversas e o ministro é feita pela PF em legendas de figura,
  sem critério explicitado.
- A nota do gabinete de 06/03/2026 e o relatório de 27/08/2026 são frontalmente contraditórios sobre o
  destinatário das mensagens de 17/11/2025; nenhuma das versões foi arbitrada.
- Segundo apuração da Poder360 (06/09 e 09/09/2026), Palácio do Planalto e um grupo do STF (Gilmar Mendes,
  Flávio Dino, Cristiano Zanin) articulam preservá-lo ao máximo das suspeitas envolvendo Vorcaro, adiando
  decisões do plenário até depois do período eleitoral — leitura da reportagem, sem corroboração jornalística
  independente localizada até a data desta apuração; não há manifestação dele sobre essa caracterização
  específica.
- Espelho dessa mesma dinâmica no Senado — Flávio Bolsonaro acusa publicamente Davi Alcolumbre,
  presidente do Senado, de bloquear pedidos de impeachment contra o ministro por amizade pessoal — 109 pedidos
  contra os dez ministros do STF, segundo o próprio Alcolumbre (01/09/2026). Cobrado sobre o caso, em 02/09/2026,
  Alcolumbre reagiu citando o financiamento de R$ 130 milhões do filme Dark Horse por Daniel Vorcaro, sem
  confirmar nem negar que protege o ministro. Um editorial de opinião da Gazeta do Povo (30/08/2026) chama isso
  de 'grande acordo nacional' entre Lula, Moraes, Alcolumbre e Motta — tese de opinião, não fato apurado.
- 'Relatou três notícias-crime sobre os mesmos fatos de 8 de janeiro de 2023, distribuídas a ele por prevenção,
  com tratamento processual radicalmente diverso — disparidade verificada pela equipe diretamente no andamento
  público do STF: a de Nikolas Ferreira contra Flávio Dino foi arquivada em um dia, em processo público,
  com decisão no Diário de Justiça; a do Partido Novo contra o general Gonçalves Dias, em 117 dias, também
  publicamente e com vista prévia à PGR; e a do deputado estadual Leandro de Jesus contra ambos ficou
  1.219 dias sem qualquer movimentação, sob segredo de justiça, sendo decidida em 21/08/2026 — três dias
  depois de reportagem revelar que estava parada. Segundo a reportagem que obteve o despacho sigiloso,
  o arquivamento veio acompanhado de determinação para que a PF ouvisse o próprio denunciante. Não foi
  localizada manifestação do gabinete sobre a disparidade de prazos, sobre o sigilo ou sobre a coincidência
  de datas.'
- 'Perdeu em 09/09/2026 a relatoria do Inquérito 4.781, que exercia desde março de 2019 por designação,
  revogada pelo presidente do tribunal com efeitos a partir daquela data e preservação dos atos praticados.
  A decisão declara fundamento institucional — segurança jurídica e delimitação — e não formula juízo
  disciplinar. O contexto imediato é o caso Master: peças cujo sigilo foi levantado em 1º/09 traziam mensagens
  suas trocadas com Daniel Vorcaro, e ele havia recorrido àquele mesmo inquérito para alcançar o relator
  do caso.'
- O Plenário do Supremo decidirá em 15/09/2026, em sessão extraordinária convocada a pedido de Mendonça,
  se autoriza a abertura de investigação contra ele — o que seria, segundo a cobertura, a primeira deliberação
  do colegiado sobre abrir inquérito contra um de seus integrantes. A suspeita se apoia no relatório preliminar
  de 218 páginas da Polícia Federal, produzido sobre o material do celular de Daniel Vorcaro. A Procuradoria-Geral
  da República sustenta a nulidade desse relatório, por vício de método na sua produção.
