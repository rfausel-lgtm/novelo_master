summary: Advogado-Geral da União (AGU). Segundo a decisão de André Mendonça de 08/09/2026 na Pet 16.662 (lida
  integralmente pela equipe), foi, junto com o próprio Mendonça, alvo do que a decisão descreve como monitoramento
  ilícito, por relatório de inteligência apócrifo da PF — o documento questiona, com base em 'matriz religiosa comum' entre ele
  e Mendonça, por que a AGU não recorreu de decisões nas investigações 'Sem Desconto' e 'Compliance Zero'
  a pedido do diretor-geral da PF, chegando a especular sobre risco à eventual recondução dele ao STF.
  Na manhã de 08/09/2026, após a decisão de Mendonça que afastou Andrei Rodrigues, esteve no Palácio da
  Alvorada com Lula e o ministro da Justiça Wellington César Lima e Silva, saindo por volta de 12h45.
  Em seguida, assinou petição da AGU a Fachin pedindo a suspensão da decisão de Mendonça, com base em
  suposta violação da prerrogativa presidencial de nomear/exonerar a direção-geral da PF. A reportagem
  da Poder360 sobre a articulação paralela entre o governo e o ministro Flávio Dino, na noite do mesmo
  dia, não cita Messias nominalmente — a ligação entre ele e essa articulação específica é inferência
  a partir de seu papel institucional (presença na reunião, autoria da petição), não uma afirmação textual
  das fontes consultadas. A AGU, que chefia, é a requerente do Pedido de Providências 0007917-89.2026.2.00.0000
  no CNJ, contra o TRF-1, em que o corregedor nacional determinou em 22 e 28/09/2026 o cancelamento de 30
  precatórios e requisições de usinas sucroalcooleiras; as decisões não o mencionam pessoalmente.
why_in_novelo: Advogado-Geral da União, citado na decisão de André Mendonça na Pet 16.662 entre os alvos de relatório de inteligência apócrifo da PF e signatário de petição da AGU a Fachin pela suspensão da decisão que afastou o diretor-geral da PF em 08/09/2026.
