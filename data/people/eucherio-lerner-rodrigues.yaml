  date: '2026-01-09'
  summary: Indireta. Segundo a NeoFeed, que cita a ata do Comitê de Investimentos da reunião de outubro (a
    matéria situa-a após a interrupção dos aportes, em julho de 2024), ele e o suplente afirmaram na reunião
    que houve due diligence e análise de balanço feitas internamente, exceto a avaliação de rating, e que os
    papéis de outras instituições não apresentavam retorno tão atrativo quanto a oferta do Master. O Novelo não
    leu o corpo da ata.
