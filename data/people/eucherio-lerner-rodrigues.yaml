summary: Assinou, em 19/10/2023, o atestado de credenciamento do Banco Master no Rioprevidência. Conduziu
  a reunião do Comitê de Investimentos de 30/11/2023 em que se aprovou a liberação genérica de teto regulatório
  para letras financeiras — sem que a ata nomeasse o Banco Master —, na mesma semana em que a autarquia
  fez sua primeira aplicação nos papéis do banco. Segundo reportagem, afirmou perante o comitê, em outubro
  de 2024, que houve due diligence e análise de balanço da instituição, com ressalva de que a avaliação
  de rating não foi feita internamente. Não é réu nem indiciado; não localizada manifestação pública direta
  sobre as acusações de credenciamento acelerado.
why_in_novelo: É o dirigente que assinou o credenciamento e conduziu a reunião em que se liberou o teto
  regulatório na mesma semana da primeira compra — sem que a decisão específica constasse da ata.
