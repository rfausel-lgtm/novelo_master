summary: 'NOVO (13/09/2026): segundo o TCE-RJ, citado em cadeia (PF cita O Globo, que cita o TCE), é "notável
  coincidência" que, em 04/10/2023, no mesmo dia em que ele iniciou suas atividades como diretor de
  investimentos, o Banco Master tenha enviado e-mail solicitando credenciamento e tido o procedimento aberto
  pelo órgão — 15 dias antes de ele assinar, em 19/10/2023, o atestado de credenciamento do Banco Master no
  Rioprevidência propriamente dito. Conduziu
  a reunião do Comitê de Investimentos de 30/11/2023 em que se aprovou a liberação genérica de teto regulatório
  para letras financeiras — sem que a ata nomeasse o Banco Master —, de três a quatro semanas depois das duas
  primeiras aplicações da autarquia nos papéis do banco (01 e 10/11/2023). Segundo a NeoFeed (09/01/2026), que
  cita a ata do Comitê, afirmou perante o comitê, em reunião de outubro (de 2024, pela sequência da matéria), que houve due diligence e análise de
  balanço da instituição, com ressalva de que a avaliação de rating não foi feita internamente. Não é réu nem
  indiciado; nota, entrevista ou manifestação própria sobre as acusações não foi localizada (ver cited_position).'
why_in_novelo: É o dirigente que assinou o credenciamento e conduziu a reunião em que se liberou o teto
  regulatório, de três a quatro semanas depois da primeira compra — sem que a decisão específica constasse da ata.
