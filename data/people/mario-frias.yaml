  by_id: mario-frias
  date: 2026-05
open_questions:
- O corpus não registra manifestação de Frias sobre o áudio de 11/12/2024 divulgado pelo Intercept em 19/05/2026.
- Alvo de busca e apreensão domiciliar e pessoal na Operação Make Up, deflagrada em 10/09/2026, e sujeito a proibição
  de deixar o país, de se comunicar com outros 28 investigados e a entrega de passaporte. A decisão que autorizou
  a operação registra que ele transferiu R$ 645.400,00 à produtora Go Up Entertainment entre 10/11 e 30/12/2025
  e observa que seus rendimentos mensais são de R$ 44.008,52, o que, no texto, 'coloca em questão o lastro financeiro'
  das transferências. A mesma decisão o aponta, na transcrição da representação policial, como integrante do núcleo
  político da organização investigada — hipótese de investigação, não juízo condenatório.
- Em 10/09/2026, o publicitário Marcello Lopes declarou à imprensa que aportou R$ 1 milhão na produtora do filme
  A PEDIDO DE MÁRIO FRIAS, em dezembro de 2025, depois que os repasses de Daniel Vorcaro pararam em outubro daquele
  ano e a produção 'abriu cotas para investimento'. É declaração de terceiro, atribuída, e contrasta com a nota
  do próprio deputado, de 13/05/2026, segundo a qual não haveria 'um único centavo' de Vorcaro na obra. O corpus
  não localizou resposta de Frias a essa declaração específica.
