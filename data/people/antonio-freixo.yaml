  Master
positions: []
summary: Fundador e diretor da Entre Investimentos e Participações desde 26/03/2018, conhecido como 'Mineiro'.
  Condenado pela CVM em 08/09/2026 a R$ 5 milhões de multa por operação fraudulenta no Brazil Realty FII
  — a Entre atuou, segundo a CVM, como 'câmara de liquidação' das cotas fraudadas, realizando 177 operações
  no mercado secundário entre 2018 e 2020. Propôs termo de compromisso de R$ 2,47 milhões, rejeitado pelo
  colegiado. Separadamente, é apontado pela imprensa como proprietário da Entre Investimentos, de onde
  partiram, segundo o Intercept e o Congresso em Foco, recursos de Daniel Vorcaro para o Havengate Development
  Fund, que financiou o filme 'Dark Horse' — e fechou, em 03/09/2026, acordo de colaboração premiada com
  a PGR sobre essas remessas, a segunda delação do caso Banco Master.
why_in_novelo: É o operador que a CVM identifica como responsável pela 'câmara de liquidação' de cotas
  fraudadas do Brazil Realty FII, e que separadamente se tornou delator premiado da PGR sobre remessas
  de Vorcaro a um fundo de financiamento de cinema — duas frentes distintas do mesmo personagem.
