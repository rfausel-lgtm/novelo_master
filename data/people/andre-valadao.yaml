summary: 'Pastor e principal liderança da Igreja Batista da Lagoinha, de Belo Horizonte. Segundo mensagens e áudios
  revelados pelo ICL Notícias, em abril de 2024 atendeu a pedido de Daniel Vorcaro para conter críticas do deputado
  Nikolas Ferreira ao fórum de Londres patrocinado pelo Master e relatou ao banqueiro que o deputado "nem sabia
  sobre o banco" e "pediu perdão" — intermediação que o próprio Valadão confirmou em vídeo de 03/09/2026 como
  "interlocução entre pessoas que eu conheço". Diz conhecer Vorcaro há mais de 30 anos. Segundo O Globo, em abril de
  2025, na inauguração de templo da Lagoinha em Belo Horizonte, chamou os pais do banqueiro de "amigos da minha
  vida" e exaltou Fabiano Zettel e Natália Vorcaro; segundo a Folha, celebrou o casamento dos dois em 2018 e teve
  a dívida de um BMW quitada com ajuda de Henrique Vorcaro, cerca de 25 anos antes. Relatório do COAF citado pela
  imprensa aponta repasse de R$ 3,9 milhões do Master, em 2022, a produtora da qual ele e a esposa são sócios —
  negado pela empresa. Hoje se diz decepcionado com a família e nega irregularidades.'
why_in_novelo: Amigo declarado de décadas da família Vorcaro e líder da igreja que recebeu dezenas de milhões de Fabiano
  Zettel, atuou, segundo mensagens reveladas pela imprensa e confirmadas por ele, como intermediário entre Vorcaro e
  o deputado Nikolas Ferreira em 2024.
