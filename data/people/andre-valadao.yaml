open_questions:
- 'A origem das mensagens e áudios de abril de 2024 não é declarada pela reportagem que os revelou; o teor tem fonte
  única (ICL Notícias). O que tem confirmação é a intermediação em si, admitida pelo próprio Valadão.'
- 'O repasse de R$ 3,897 milhões do Master à Amando Vidas Produtora e Gravadora (março-abril de 2022) vem de relatório
  do COAF não lido pela equipe e é negado pela empresa, que diz não haver entrada compatível nos extratos.'
- 'A fintech Clava Forte Bank, criada por ele e pela esposa em 2024, saiu do ar em novembro de 2025; um deputado pediu
  na CPMI do INSS a quebra de sigilo de Valadão para verificar eventual atuação conjunta com o Master. Não há vínculo
  documentado — apenas o pedido de investigação.'
