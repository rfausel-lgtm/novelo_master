summary: Procurador do Estado da Bahia desde 2000 e sócio-administrador do escritório Gabino Kruschewsky
  Advogados Associados, que recebeu R$ 54 milhões do Banco Master entre 2022 e 2025. Segundo reportagem,
  é primo de André Kruschewsky Lima, então diretor jurídico do Master, a quem se atribui a contratação
  do escritório — atribuição não confirmada por documento lido pela equipe.
why_in_novelo: Acumula a função pública de procurador do Estado da Bahia com a advocacia privada para
  o Banco Master, o que levou parlamentar a apontar, em requerimento não lido pela equipe, possível conflito
  de interesse.
