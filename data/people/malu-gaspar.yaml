summary: 'Jornalista, colunista de O Globo, com cobertura sobre a Operação Compliance Zero e o Banco Master.
  Segundo decisão de André Mendonça na PET 16.346 e mensagens reproduzidas pela CNN Brasil (31/03 a 08/04/2025),
  Daniel Vorcaro e Thiago Miranda discutiram estratégias para ''frear'' sua cobertura, incluindo levantamento
  de dados pessoais, financeiros e familiares, e cogitaram contratá-la. Apuração posterior detalha o episódio:
  o levantamento, entre março e abril de 2025, abrangeu familiares, endereço, contas bancárias e informações
  veiculares, e a execução é atribuída ao publicitário Thiago Miranda, que teria informado não ter encontrado
  nada comprometedor. Trecho atribuído a Daniel Vorcaro: ''Vamos ter que tentar pegar algo dessa mulher
  no pessoal''. Antes da devassa houve tentativa de cooptação — proposta de contratá-la por R$ 120 mil
  mensais mais R$ 1,5 milhão a título de luvas, com o objetivo de interromper as apurações —, e em outra
  mensagem Vorcaro reclama que ''Malu e Lauro vieram com mais fúria após a aproximação''. A Abraji, a
  ANJ e a Fenaj divulgaram notas de repúdio em 04/03/2026. Mensagens adicionais divulgadas registram a
  determinação de ''freá-la'' porque ela ''daria trabalho nos próximos dias'', e a intenção de ''calar
  essa mulher''. O Globo repudiou em nota ''a devassa determinada pelo acusado na vida da colunista Malu
  Gaspar'', classificando-a como tentativa explícita de silenciar a imprensa e afirmando que seus profissionais
  não se intimidarão; a ANJ classificou a conduta como ''métodos mafiosos''.'
why_in_novelo: Jornalista apontada, em decisão judicial da Operação Compliance Zero, como alvo de levantamento
  de dados pessoais encomendado por Daniel Vorcaro em razão de sua cobertura do caso.
