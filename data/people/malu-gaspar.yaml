summary: 'Jornalista, colunista de O Globo, com cobertura sobre a Operação Compliance Zero e o Banco Master.
  Segundo decisão de André Mendonça na PET 16.346 e mensagens reproduzidas pela CNN Brasil (31/03 a 08/04/2025),
  Daniel Vorcaro e Thiago Miranda discutiram estratégias para ''frear'' sua cobertura, incluindo levantamento
  de dados pessoais, financeiros e familiares, e cogitaram contratá-la. Apuração posterior detalha o episódio:
  o levantamento, entre março e abril de 2025, abrangeu familiares, endereço, contas bancárias e informações
  veiculares, e a execução é atribuída ao publicitário Thiago Miranda, que teria informado não ter encontrado
  nada comprometedor. Trecho atribuído a Daniel Vorcaro: ''Vamos ter que tentar pegar algo dessa mulher
  no pessoal''. Segundo mensagens reproduzidas pela CNN Brasil e pela Gazeta do Povo, Vorcaro e Miranda trataram
  de uma possível contratação dela (a CNN cita ''Luva de 1,5 mm e salário de 120k''); as fontes lidas não registram
  que a proposta tenha chegado a ela nem resposta dela. Em outra mensagem, Vorcaro reclama que ela e o jornalista
  Lauro Jardim teriam reagido com mais intensidade após uma abordagem (segundo O Globo e a Gazeta do Povo).
  Em 04/03/2026, Abraji (cuja nota nomeia Lauro Jardim e registra que outros jornalistas também foram
  ameaçados), ANJ e Fenaj repudiaram, em termos gerais, as tentativas de intimidar jornalistas reveladas na
  operação. Em 02/07/2026, a ANJ repudiou especificamente o levantamento sobre Malu Gaspar e pediu apuração do
  acesso aos dados da jornalista; na mesma data, a Abraji repudiou ataques on-line contra ela desferidos após
  reportagem sobre conversas entre Alexandre de Moraes e Gabriel Galípolo (Gazeta do Povo, 02/07/2026). Mensagens adicionais divulgadas registram a intenção de ''frear a
  Malu Gaspar'', que ''iria dar trabalho nos próximos dias'', e a de ''calar essa mulher''. Em nota publicada em
  01/07/2026, O Globo repudiou ''a devassa ordenada pelo investigado na vida da colunista'', afirmando que a ação
  visava calar a voz da imprensa e que seus profissionais não se intimidarão; a ANJ classificou a conduta como
  ''métodos mafiosos''.'
why_in_novelo: Jornalista apontada, em decisão judicial da Operação Compliance Zero, como alvo de levantamento
  de dados pessoais encomendado por Daniel Vorcaro em razão de sua cobertura do caso.
