  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- Ela é uma das quatro pessoas que constam nominalmente da decisão como alvos de monitoramento, mas apuração
  jornalística indica que o número total de alvos pode passar de vinte — os demais não foram identificados
  publicamente.
- Não foi localizada manifestação pública dela própria sobre o episódio; o registro do corpus vem da decisão
  judicial e da cobertura de terceiros.
- 'Ela não foi a única alvo: a mesma decisão registra contatos para retirada de conteúdo com a jornalista
  Consuelo Dieguez, da revista piauí, que recusou, e com o consultor Renato Breia, da Nord Investimentos,
  que removeu publicação em que recomendava não investir no CDB do Master — único dos três a ceder.'
