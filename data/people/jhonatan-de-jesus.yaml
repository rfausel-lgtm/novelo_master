- kind: version
  date: '2026-03-24'
  summary: 'Ato do relator. Despacho no TC 022.950/2025-7: não pautará a análise até receber informações das apurações
    do BC, da CGU e do STF e pediu à área técnica a reavaliação do nível de sigilo (eventual levantamento total ou
    parcial). Ver lote 353 para o conteúdo da cópia.'
