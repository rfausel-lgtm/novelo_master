id: jhonatan-de-jesus
kind: person
name: Jhonatan de Jesus
category: public_official
role: Ministro do Tribunal de Contas da União, relator da inspeção sobre a liquidação do Banco Master
positions:
- title: Ministro
  organization_id: tribunal-de-contas-da-uniao
  source_ids:
  - src-correiobraziliense-2026-02-12-tcu-conclui-inspecao
summary: Relator, no TCU, do processo de inspeção no Banco Central sobre a liquidação do Banco Master.
  Recebeu o relatório final em fevereiro de 2026 e, em seguida, segundo o Correio Braziliense, citando
  interlocutores da Corte, ampliou o sigilo do processo, retirando o acesso automático do próprio BC aos autos;
  o Diário do Nordeste (11/02/2026) descreve a mudança como exigência de autorização específica para acesso, com
  acesso do BC mediante pedido formal ao gabinete, e diz que o relator recuou em parte e suspendeu a inspeção até
  decisão do plenário. Segundo cópia de despacho de 24/03/2026 hospedada pelo
  Poder360 (autenticidade não conferida), é o relator do TC 022.950/2025-7, representação do MPTCU sobre a
  atuação do BC na supervisão e na resolução do Master, e sobrestou esse processo, inclusive a apreciação do
  relatório de inspeção, até elementos oficiais da sindicância do BC, do PAD da CGU e das apurações no STF; em 13/10/2026 o
  TCU sobrestou as contas de 2025 do BC até o trânsito em julgado desse processo (Acórdão 5163/2026). Presidiu a sessão de 20/10/2026 da 2ª Câmara, em que o Acórdão 5184/2026 (relator Jorge Oliveira) levantou esse sobrestamento e julgou regulares as contas; o acórdão não cita o processo que ele relata.
why_in_novelo: Conduz, como relator no TCU, a fiscalização sobre como o Banco Central decidiu liquidar
  o Banco Master.
cited_position:
- kind: version
  date: '2025-12-18'
  summary: Ato do relator, não entrevista. Segundo o Estadão Conteúdo (Jornal de Brasília, 19/12/2025), em despacho de
    18/12/2025 deu 72 horas ao Banco Central para justificar a liquidação e apontou precipitação na adoção da
    medida, indícios de cronologia atípica e demora na condução de alternativas (citou proposta do Grupo Fictor); a
    matéria registra que o BC não emitiu nota e que interlocutores falaram ao Broadcast que o BC estaria munido de
    documentos.
  source_ids:
  - src-jornaldebrasilia-2025-12-19-ministro-do-tcu-ve-precipitacao-na-liquidacao-do-master-bc-diz-estar-munido-com-documentos
- kind: version
  date: '2026-02-11'
  summary: 'Ato do relator. Sigilo: trocou a classificação de "sigiloso" para "sigiloso com exigência de autorização
    específica para acesso", segundo o Diário do Nordeste; nenhuma justificativa dele foi atribuída pelas matérias.'
  source_ids:
