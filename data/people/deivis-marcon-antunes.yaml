summary: Ex-presidente do Rioprevidência, preso preventivamente na Operação Barco de Papel, apontado como
  responsável por direcionar cerca de R$ 1 bilhão em aplicações irregulares e suspeito de tentar obstruir
  a coleta de provas — a imprensa noticiou formatação de sistema de câmeras e movimentação atípica de
  dinheiro em espécie durante a operação. O STJ manteve sua prisão preventiva em 19/03/2026. É investigado
  e réu em ação penal; a defesa nega interferência nas investigações, alega colaboração com as autoridades
  e pediu substituição da prisão por medidas cautelares, pedido negado.
why_in_novelo: É o principal alvo da Operação Barco de Papel, a investigação sobre os aportes do Rioprevidência
  no grupo Master.
cited_position:
- kind: denial
  summary: A defesa nega interferência nas investigações, afirma colaboração com as autoridades — entregou
    senhas e se colocou à disposição — e pediu substituição da prisão preventiva por medidas cautelares,
    pedido negado pelo STJ.
  source_ids:
  - src-stj-2026-03-19-mantem-prisao-deivis
  date: '2026-03-19'
open_questions:
- O corpus não registra manifestação pública mais extensa da defesa sobre o mérito das acusações.
- 'NOVO (13/09/2026): o documento comprobatório da PF (Pet 15.497) mostra que, em 12/03/2024, ele repassou a
  interlocutores do Master uma cotação de LFs do Banco Pine (concorrente), com a PF notando "estranheza" na
  conduta — enquanto recusava, no mesmo período, a tentativa de venda de LFs do Banco Voiter (do qual Vorcaro
  é presidente) ao Rioprevidência, alegando falta de credenciamento. Sete dias após o repasse da cotação
  concorrente, o Rioprevidência fez novo aporte de R$120 milhões no Master. A própria PF, porém, não liga
  esse achado à identidade do "dono" citada por Ricardo Siqueira — trata como indício de proximidade
  informal com o Master, não confirmação de que ele seja essa figura.'
