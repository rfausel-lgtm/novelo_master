role: Advogada e influenciadora digital
summary: Advogada e influenciadora digital. Em reportagem de 16/10/2026 (Aguirre Talento, Luiz Vassallo,
  Gustavo Côrtes e Vinícius Valfré), o Estadão afirmou que mensagens extraídas do celular de Daniel Vorcaro
  indicariam que ela gravou vídeos em defesa do Banco Master sob contrato de 12 meses, com roteiros submetidos
  à aprovação do banqueiro; segundo o jornal, os diálogos não revelam valor pago. No mesmo dia, em vídeo nas
  redes sociais, Prioli negou ter feito reunião com qualquer pessoa do banco ou representante de Vorcaro, ter
  assinado contrato com o banco ou empresas ligadas ao banqueiro e ter recebido pagamentos; cobrou a
  apresentação do contrato e dos pagamentos mencionados e disse que tomará as medidas cabíveis. Ao Estadão,
  afirmou que Vorcaro “jamais editou” seu conteúdo. As mensagens não constam de documento público lido pelo
  Novelo; mensagem em aparelho não prova o que diz, e não há acusação formal contra ela.
why_in_novelo: Citada pelo Estadão, em 16/10/2026, como contratada pelo Banco Master para vídeos, segundo
  mensagens do celular de Daniel Vorcaro, o que ela nega.
