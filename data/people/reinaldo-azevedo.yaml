open_questions:
  - O contrato e os comprovantes de pagamento não são públicos; os valores registrados são os declarados por
    Azevedo.
  - Os prints divulgados pelo influenciador não foram autenticados nem checados por veículo de apuração
    própria até 17/10/2026.
  - Não foi apurado se a empresa Super citada na nota corresponde a alguma empresa já registrada no acervo; o
    Novelo não faz essa ligação.
