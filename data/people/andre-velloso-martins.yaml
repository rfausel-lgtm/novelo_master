name: André Velloso Martins
role: Escrivão de Polícia Federal, lotado no NUPROC/DRPJ/SR/PF/MG
summary: 'Escrivão de Polícia Federal (matrícula 20.932). A análise do celular de Marilson Roseno da
  Silva (IPJ nº 1752768/2026, PET 15.978) mostra que, em março de 2024, atendeu a pedidos de Marilson
  para consultar um processo SEI — que se revelou vinculado ao inquérito em que Henrique Moura Vorcaro
  fora intimado — verificando primeiro sua escala de plantão e depois checando o conteúdo do processo a
  pedido do escrivão aposentado. A PF o descreve como policial que, ao contrário de Marilson, Sebastião
  Monteiro Júnior e Anderson Wander da Silva Lima, não integrava "A Turma" propriamente, mas atendeu
  pedidos pontuais de consulta.'
why_in_novelo: É um dos policiais federais da ativa identificados, fora do núcleo "A Turma", que teria
  atendido a pedidos de consulta indevida a sistemas internos em favor de Marilson Roseno.
