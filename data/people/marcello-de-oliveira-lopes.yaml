open_questions:
- A origem dos recursos do aporte não foi objeto de exame em nenhum documento lido pela equipe.
- O corpus não localizou o contrato em si — apenas a descrição e as imagens publicadas pela coluna que o recebeu
  do próprio investidor.
- Não há, nos documentos lidos, elemento que ligue o aporte a Flávio Bolsonaro; o que está documentado é a relação
  profissional e pessoal entre os dois.
