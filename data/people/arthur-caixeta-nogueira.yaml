name: Arthur Caixeta Nogueira
category: other
role: Representante da REAG Portfolio Solutions
summary: Apontado, na decisão de 15/04/2026 que autorizou busca e apreensão no esquema de propina imobiliária
  ao ex-presidente do BRB Paulo Henrique Costa (Pet 15.771/15.772, STF), como representante formal da REAG
  Portfolio Solutions — gestora do FIP Alucard (depois Abbiamo), fundo que passou a deter participação
  majoritária nas seis empresas de fachada compradoras dos imóveis de R$ 146,6 milhões atribuídos a Paulo
  Henrique Costa (ver ev-pf-seis-empresas-e-um-fundo-da-reag-compraram-os-imoveis-de-paulo-henrique-costa).
why_in_novelo: É apontado como o representante formal da gestora do fundo usado para estruturar a compra dos
  imóveis atribuídos ao ex-presidente do BRB no esquema de propina imobiliária.
