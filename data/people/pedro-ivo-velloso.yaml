summary: Advogado criminalista, sócio-administrador da Figueiredo & Velloso Advogados Associados desde
  24/06/2015 (CNPJ 11.428.814/0001-48) — a mesma banca em que Renata Varandas, namorada do diretor-geral
  afastado da PF, Andrei Rodrigues, é sócia da área de comunicação desde 31/01/2025. Integrou, junto com
  Ticiano Figueiredo, a defesa de Augusto Ferreira Lima desde a prisão dele (18/11/2025) até renunciar
  ao caso em 04-05/08/2026.
why_in_novelo: É o segundo sócio-fundador da banca no centro dessa sobreposição — mesma ressalva do sócio
  Ticiano Figueiredo, sem indício de conduta irregular pessoal.
