summary: Como presidente da Comissão de Assuntos Econômicos do Senado, pediu ao STF autorização para a
  apresentação de Daniel Vorcaro perante a comissão — deferida em 19/02/2026 para 24/02/2026, mas
  condicionada à adesão voluntária e expressa do próprio Vorcaro (direito à não autoincriminação), e
  depois estendida para 10/03/2026 —, uma frente institucional distinta e paralela à já conhecida CPI do
  Crime Organizado. Também presidiu a audiência de 19/05/2026 na CAE em que questionou o presidente do
  Banco Central, Gabriel Galípolo, sobre uma alegada carta de R$ 11 bilhões ao FGC — acusação que Galípolo
  negou publicamente.
why_in_novelo: Conduz, como presidente da CAE, uma linha própria de apuração parlamentar sobre o caso
  Master — distinta da CPI do Crime Organizado — que já produziu ao menos um confronto público direto com
  o presidente do Banco Central.
cited_position:
- kind: public_note
  summary: 'Em publicação nas redes sociais, disse que a CAE "vai acompanhar de perto as fraudes do Banco
    Master, uma das maiores da história" e que "o Senado não se curva a abusos do sistema financeiro.
    Vamos fiscalizar, cobrar explicações e proteger a economia do país sem blindar quem quer que seja,
    esteja onde estiver."'
