summary: Alvo de constrição patrimonial na PET 16.230 (item I.19, teto de R$ 3,5 milhões). A decisão de 19/06/2026
  o aponta como irmão de Bonnie Toaldo Bonilha e como pessoa que teria integrado a estrutura societária da BN Representações
  Tecnológicas, empresa que a representação da PF descreve como do mesmo núcleo familiar da BN Financeira, com elementos
  operacionais e cadastrais compartilhados. A decisão registra ainda alterações cadastrais posteriores ao início
  das investigações como reforço, em juízo indiciário, à necessidade de preservação patrimonial.
why_in_novelo: É alvo de constrição patrimonial na PET 16.230 pelo vínculo familiar e societário com Bonnie Toaldo
  Bonilha e com a BN Representações Tecnológicas, do mesmo núcleo da BN Financeira.
