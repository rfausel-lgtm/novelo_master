summary: Sócio da Foco DTVM, administradora de fundos que aparece em mais de uma frente do caso. Segundo
  documento protocolado na CPI do Crime Organizado, recebeu R$ 2 milhões da Milo Investimentos, empresa
  ligada a Vorcaro, em 31/10/2016, sendo descrito na peça como 'elo financeiro central' da cadeia investigada
  em Rondônia. Seu nome aparece também na delação premiada de João Carlos Mansur, como beneficiário formal
  do fundo Jaguar Multimarket Fund Ltd (Cayman Islands), cujo controlador real seria Vorcaro segundo o
  colaborador — alegação não comprovada. São registros de origens distintas e nenhum deles constitui imputação
  formal contra ele no corpus.
why_in_novelo: Nome recorrente, por vias independentes, na estrutura de fundos associada às operações
  de Vorcaro.
