  by_id: benjamim-botelho-de-almeida
  date: '2026-03-09'
- kind: clarification
  summary: Afirma ter sido 'diretor contratado da Aquilla por um curto período', nunca responsável pelas
    áreas de Compliance e Know Your Client, e ter se desligado voluntariamente 'há mais de 10 anos'.
  source_ids:
  - src-iclnoticias-2026-03-09-nota-defesa-botelho
  by_id: benjamim-botelho-de-almeida
  date: 2026-05
open_questions:
- A absolvição na ação penal sobre o Banco Máxima é afirmada pela defesa e não foi confirmada em fonte
  independente; os acórdãos do TRF3 associados ao nome não puderam ser lidos pela equipe.
- O desfecho do PAS CVM SEI 19957.008699/2019-01, em que é acusado de oferecer vantagens a prefeitos e
  gestores de RPPS, não foi localizado — consta apenas a rejeição do termo de compromisso em 2021.
- Não há manifestação dele sobre a menção ao fundo Jaguar Multimarket na delação de João Carlos Mansur;
  nenhum veículo o procurou sobre esse ponto específico.
- Não foi localizada denúncia, indiciamento formal ou prisão contra ele no caso Master; as medidas existentes
  são patrimoniais e investigativas.
