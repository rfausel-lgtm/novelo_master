id: benjamim-botelho-de-almeida
kind: person
name: Benjamim Botelho de Almeida
category: businessperson
role: Proprietário e controlador da Foco DTVM (depois Índigo, depois Sefer Investimentos); principal executivo
  do Grupo Aquilla
positions: []
summary: 'Fundou em 2003 a distribuidora que passaria por três nomes — Foco DTVM, Índigo Investimentos
  DTVM e Sefer Investimentos —, tendo antes passado pelo Banco Garantia nos anos 1990. Registros da CVM
  o identificam como diretor responsável da Foco DTVM de 19/10/2009 a 24/04/2013 e da gestora do Grupo
  Aquilla de 08/07/2011 a 11/01/2016; decisão de Dias Toffoli, de 06/01/2026, o descreve como proprietário
  e controlador da casa. Reside em Portugal há cerca de cinco anos e mantém estruturas no exterior, segundo
  o Estadão. Responde a três frentes documentadas na CVM: foi condenado a R$ 450 mil em 2022 por irregularidades
  na administração do FII São Domingos; é acusado, em processo cujo desfecho não foi localizado, de operação
  fraudulenta caracterizada pelo oferecimento de vantagens a prefeitos e gestores de regimes próprios
  de previdência; e pagou R$ 300 mil em termo de compromisso sobre emissões de debêntures, acordo que
  não implica confissão. Foi denunciado pelo MPF por gestão fraudulenta no Banco Máxima entre 2014 e 2016,
  pelo suposto uso do fundo Aquilla Veyron para mascarar a insuficiência de capital do banco — sua defesa
  afirma que o processo terminou em absolvição, o que a equipe não conseguiu confirmar de forma independente.
  Foi alvo da 2ª fase da Operação Compliance Zero, em 14/01/2026, e teve os bens tornados indisponíveis
  quando o Banco Central liquidou a Sefer, em 26/06/2026. Não há, até onde a apuração alcança, denúncia
  oferecida contra ele no caso Master, indiciamento formal ou prisão: é investigado com medidas patrimoniais,
  não réu nessa frente.'
why_in_novelo: 'Nome que atravessa, por vias independentes, a origem do Banco Master: administrava os
  fundos usados na aquisição do Banco Máxima, controlava a distribuidora que a Justiça e o Banco Central
  alcançaram no caso, e é apontado pelo MPF como responsável pelo fundo usado na fraude contábil que precedeu
  a venda.'
cited_position:
- kind: denial
  summary: Em nota de seus advogados, afirma ter deixado definitivamente o Brasil em 2018, contesta com
    datas específicas a afirmação de que seria visto semanalmente na Faria Lima, 'repudia veementemente'
    ser descrito como operador financeiro de Vorcaro nos Estados Unidos, e sustenta que a ação penal sobre
    o Banco Máxima resultou em sua absolvição.
