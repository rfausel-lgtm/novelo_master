  date: '2026-09-03'
open_questions:
- Não há manifestação dele sobre a menção ao fundo Jaguar Multimarket na delação de João Carlos Mansur;
  nenhum veículo o procurou sobre esse ponto específico.
- Não foi localizada denúncia, indiciamento formal ou prisão contra ele no caso Master; as medidas existentes
  são patrimoniais e investigativas.
- 'A absolvição na ação penal sobre o Banco Máxima foi confirmada em sentença, mas não é definitiva: o
  MPF apelou, e a Apelação Criminal nº 5003557-34.2021.4.03.6181 aguardava julgamento na 11ª Turma do
  TRF3, com pedido de vista registrado em 11/06/2026.'
- 'O PAS CVM SEI 19957.008699/2019-01, em que é acusado de operação fraudulenta pelo oferecimento de vantagens
  a prefeitos e gestores de RPPS, segue PENDENTE DE JULGAMENTO — consta da planilha oficial de processos
  a julgar da CVM, posição de 31/01/2026, sob relatoria do diretor João Accioly, sem registro público
  de movimentação desde 24/05/2022. Fica sinalizada, sem afirmação de mérito, a hipótese de prescrição
  intercorrente: a Lei 9.873/1999, art. 1º, §1º, prevê prescrição em três anos para processo administrativo
  paralisado pendente de julgamento ou despacho. A equipe não confirmou se a Lei 13.506/2017, que reorganizou
  o processo sancionador do BCB e da CVM, traz disciplina própria que prevaleça sobre esse regime, nem
  se houve atos internos não publicados capazes de afastar a paralisação.'
