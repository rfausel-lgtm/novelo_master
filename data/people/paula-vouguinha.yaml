summary: Apresentou o Banco Master ao Comitê de Investimentos da Amapá Previdência em 14/03/2024, em reunião
  solicitada pelo próprio banco. Segundo a ata, expôs o histórico da instituição, informou que o Master
  se tornara segmento S3 em julho de 2023 e que 'a partir desse momento o banco se preparou para atender
  o mercado de cliente institucional, como RPPS e Fundo de Pensão', recomendou o prazo de dez anos como
  o que 'paga melhor taxa' e quantificou a operação de captação institucional então em curso.
why_in_novelo: É a executiva que apresenta formalmente o Banco Master ao fundo previdenciário que viria
  a se tornar o segundo maior comprador público de suas letras financeiras.
