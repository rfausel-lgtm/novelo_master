role: Apontado como operador do núcleo 'Os Meninos', subordinado a David Henrique Alves
summary: Integrante identificado do núcleo 'Os Meninos' na decisão de 13/05/2026 (6ª fase), conhecido como 'Rodriguinho'.
  Sua participação emerge do depoimento de Victor Lima Sedlmaier, que afirmou já ter pedido a ele a realização de
  'trabalhos para David [Henrique Alves]', incluindo pagar boletos e adquirir domínios na internet. Foi identificado
  como a pessoa que acompanhava Victor no deslocamento ao apartamento de David em Lagoa Santa/MG, em 05/03/2026,
  no contexto de esvaziamento do imóvel após a fuga de David. No mesmo dia 13/05/2026, a decisão na PET 15.978
  decretou a sua prisão preventiva (dispositivo, item iv), noticiada pelo STF em 14/05/2026 entre as prisões da
  6ª fase; a preventiva é medida cautelar, não condenação. Na PET 16.019 (processo de bloqueio patrimonial,
  distinto da PET 15.978) a decisão fixou bloqueio individualizado com teto de R$ 1,8 milhão; teto não é o valor
  encontrado (ver lote 252). Em 22/09/2026, segundo O Antagonista e o Metrópoles, a defesa pediu ao presidente do
  STF, Edson Fachin, a revogação da preventiva (ver cited_position). O Novelo não localizou decisão sobre o pedido
  nem o resultado do depoimento à PF que, segundo a defesa, estava marcado para 06/10/2026.
why_in_novelo: É o terceiro integrante identificado do núcleo hacker 'Os Meninos', com papel de apoio técnico-operacional
  subordinado a David Henrique Alves.
cited_position:
- kind: version
  date: '2026-09-22'
  summary: Posição processual, não negativa de mérito. Segundo O Antagonista e o Metrópoles (que relatam a mesma
    petição, uma origem), a defesa pediu ao presidente do STF a revogação da prisão preventiva, argumentando que
    não há nos autos elemento concreto de risco de não comparecimento e que ele estava intimado a depor na PF em
    06/10/2026 e compareceria mesmo solto; pediu, subsidiariamente, medidas cautelares diversas (entrega de
    passaporte, proibição de deixar o país e de contato, comparecimento periódico). Segundo O Antagonista, um
    primeiro pedido fora feito em 20/08/2026 e a PGR se manifestou em 18/09/2026 pela manutenção da prisão. Tal
    como relatada, a petição não discute os fatos imputados.
