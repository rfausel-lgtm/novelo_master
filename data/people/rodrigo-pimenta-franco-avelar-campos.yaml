    Fachin não foram localizados.
open_questions:
- Não há denúncia oferecida, indiciamento concluído ou decisão de mérito contra ele no corpus.
- Segundo o parecer da PGR relatado por O Antagonista, a 2ª Turma referendou a decretação da prisão; o acórdão não
  foi localizado.
- 'Cumprimento da prisão: O Antagonista diz 14/05, o Metrópoles diz 13/05; a decisão é de 13/05 e a nota do STF é
  de 14/05.'
- Depoimento de 06/10/2026 e decisão de Fachin sobre o pedido de revogação não foram localizados até 16/10/2026.
