summary: Fundou a Reag Investimentos em 2012 e a comandou até 2025, quando vendeu o controle a executivos
  internos. Segundo documento do BRB ao BC (23/04/2025) noticiado pelo Metrópoles e pela CNN, adquiriu
  em 04/04/2025 ações do BRB por R$ 193,3 milhões por meio do fundo Celeno, administrado pelo Banco Master,
  passando a deter 4,5% da estatal. Foi alvo da operação Carbono Oculto. Sua defesa não respondeu à CNN.
why_in_novelo: Comprou ações do BRB por meio de fundo administrado pelo Banco Master, segundo documento
  do próprio BRB noticiado pela imprensa.
