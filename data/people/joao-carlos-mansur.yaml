id: joao-carlos-mansur
kind: person
name: João Carlos Mansur
category: businessperson
role: Fundador da Reag Investimentos; acionista do BRB
positions: []
summary: Fundou a Reag Investimentos em 2012 e a comandou até 2025, quando vendeu o controle a executivos
  internos. Segundo documento do BRB ao BC (23/04/2025) noticiado pelo Metrópoles e pela CNN, adquiriu
  em 04/04/2025 ações do BRB por R$ 193,3 milhões por meio do fundo Celeno, administrado pelo Banco Master,
  passando a deter 4,5% da estatal. Foi alvo da operação Carbono Oculto. Sua defesa não respondeu à CNN.
  Em 02/09/2026, assinou com a PGR a primeira delação da Operação Compliance Zero — 17 temas, multa de
  R$ 40 milhões —, prometendo revelar o paradeiro de R$ 20 bilhões em ativos atribuídos a Vorcaro. Audiência
  de voluntariedade ocorreu em 03/09/2026; a homologação, pelo relator André Mendonça, seguia pendente
  até a data desta atualização. Em 29/09/2026 foi condenado pela CVM, com Rodolfo Turelli, à multa individual
  de R$ 170 mil por não elaborar as demonstrações financeiras de 2024 e os ITR do 1º e 2º trimestres de 2025 da
  REAG Capital Holding S.A., da qual era diretor presidente, segundo o voto da diretora Marina Copola; é infração
  formal de dever de informação, decisão de primeira instância administrativa e recorrível.
why_in_novelo: Comprou ações do BRB por meio de fundo administrado pelo Banco Master, segundo documento
  do próprio BRB noticiado pela imprensa. Firmou a primeira delação premiada da Operação Compliance Zero.
