open_questions:
- O documento do BRB ao BC não foi lido pela equipe.
- O corpus não registra a situação atual da participação de Mansur no BRB após a auditoria independente.
- Os 17 temas/anexos da colaboração não foram discriminados individualmente por nenhum veículo consultado
  — provavelmente sob sigilo até a homologação. Trechos vazados sobre um fundo em Cayman (Jaguar Multimarket
  Fund) e sobre a mecânica da operação Tirreno-BRB não foram confirmados pela equipe em documento primário
  nem em fonte com acesso verificável.
- Segundo sua proposta de delação (26/08/2026), Jaques Wagner recebeu ingressos para show da Taylor Swift
  (R$ 63,3 mil) e ACM Neto é cotista do fundo Seattle 95 (R$ 7,92 milhões aplicados, ganho de R$ 4,01
  milhões) — ambos negam ou minimizam as alegações, conforme registrado nos respectivos perfis.
- Alega que o Jaguar Multimarket Fund (Cayman), que recebeu R$ 494 milhões do Master e tem Benjamim Botelho
  como beneficiário formal, teria Vorcaro como 'verdadeiro dono' — alegação própria, sem corroboração
  documental independente localizada.
- 'Detalha o paradeiro do patrimônio de R$ 20 bilhões atribuído a Vorcaro: imóveis, fundos (incluindo
  o Astralo, já conhecido no corpus), direitos creditórios e ativos em nome de terceiros — com ressalva
  de que não é necessariamente líquido disponível.'
- Até 09/09/2026, a homologação da delação pelo relator André Mendonça segue pendente.
