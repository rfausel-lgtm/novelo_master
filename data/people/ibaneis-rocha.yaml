- Segundo resultado de busca não confirmado por leitura direta de artigo-fonte, seu escritório (Ibaneis
  Advocacia) teria vendido R$ 38 milhões em honorários de precatório ao fundo Reag Legal Claims — sua
  defesa afirma que ele está afastado das atividades do escritório desde 2018; alegação classe I, não
  verificada diretamente pela equipe, mantida para eventual aprofundamento.
