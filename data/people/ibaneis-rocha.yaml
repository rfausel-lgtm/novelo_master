  summary: 'Em 16/04/2026, a defesa usou diálogos entre Paulo Henrique Costa e Daniel Vorcaro da 4ª fase da
    operação para sustentar que "O ex-governador não acompanhava, não pressionou e tampouco teve qualquer
    ingerência em operações realizadas pelas referidas instituições financeiras…" (manifestação que o
    verbete não registrava até então).'
