summary: 'Governador do Distrito Federal à época da tentativa de compra do Master pelo BRB. Seu governo enviou à CLDF, em regime de urgência, o PL 1882/2025
  que autorizou o BRB, banco controlado pelo GDF, a adquirir participação no Banco Master; o projeto foi
  aprovado em 19/08/2025 e seguia para sanção. CONFIRMADO COMO INVESTIGADO FORMAL (lote 176): decisão do
  STF de 02/04/2026, que o dispensou de depor na CPI do Crime Organizado por essa condição, reproduz a
  justificativa da própria CPI de que ele está ''no centro de dois eixos de investigação'' — as relações
  comerciais do escritório de advocacia que leva seu nome com entidades investigadas nas operações Compliance
  Zero e Carbono Oculto, e seu papel institucional nas decisões do BRB sobre a compra do Master. Em
  09/10/2026, segundo o Metrópoles, a CNN Brasil, o g1 (via Brasil 247) e a Jovem Pan, veio a público
  relatório da Polícia Federal enviado ao STF em 28/09/2026 que afirma que ele, como acionista controlador
  do BRB, não se limitou ao exercício regular de suas prerrogativas institucionais e que decisões
  estratégicas relevantes eram submetidas previamente à sua apreciação; a defesa nega ingerência (ver o
  evento do dia). Já era tratado como "ex-governador" pela defesa em 16/04/2026 (CNN Brasil); a data e o
  ato oficial da saída do cargo não foram abertos pelo Novelo.'
why_in_novelo: Chefiava o Executivo distrital que propôs a autorização legislativa para o BRB comprar
  participação no Banco Master, e é formalmente investigado, segundo decisão do STF, em dois eixos ligados
  ao caso — um envolvendo seu próprio escritório de advocacia.
cited_position:
- kind: denial
  summary: 'Em petição de 01/04/2026 (e-Doc 216), a defesa dele afirma: (1) confirma duas cessões de
    créditos de honorários advocatícios de uma ação de 2008 contra a União (29/05/2024 e 23/12/2021, esta
    ao Fundo Laguz I, administrado pela Reag/CBSF), caracterizando-as como prática lícita de mercado sem
    relação com o Banco Master; (2) nega qualquer ligação entre o escritório e a parceria do PicPay com o
    GDF para antecipação salarial; (3) confirma que o escritório presta serviços ao Grupo J&F "em centenas
    de ações", mas nega relevância disso ou da compra, pelo filho dele, de imóvel que antes pertenceu a um
    sobrinho dos irmãos Batista; (4) nega qualquer papel operacional nas decisões do BRB sobre o Master,
    afirmando que nunca escolheu diretores do banco e que sua atuação se limitou ao dever de vigilância
    institucional.'
  source_ids:
  - src-stf-pet15556-edoc216-pedido-extensao-ibaneis-01-04-2026
  by_id: ibaneis-rocha
  date: '2026-04-01'
- kind: denial
  summary: Sobre o relatório da PF divulgado em 09/10/2026, a defesa (por Antônio Carlos de Almeida Castro,
    o Kakay, segundo o Metrópoles) afirmou que ele não pressionou e tampouco teve qualquer ingerência nas
    operações realizadas pelo BRB, que Paulo Henrique Costa detinha total autonomia, que ele não é
    interlocutor direto em nenhuma mensagem com Vorcaro e que seu nome é mencionado pela PF em quatro
    oportunidades.
