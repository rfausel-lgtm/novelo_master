open_questions:
- O número da PET, o ministro que levantou o sigilo e a data do relatório da PF divulgado em 09/10/2026 não
  foram identificados nas fontes lidas; o Novelo não localizou o relatório nos autos públicos.
- A pessoa tratada como "Léo" ou "Leonardo", descrita pela imprensa como presente na reunião de Zurique de
  23/01/2025 segundo o relatório, não é identificada nas fontes.
- 'ATUALIZADO (lote 177): a própria petição de Ibaneis Rocha (e-Doc 216, 01/04/2026) confirma que houve,
  sim, uma cessão de créditos a um fundo administrado pela Reag/CBSF (Fundo Laguz I, 23/12/2021) — mas
  a CPI, no mesmo requerimento, cita uma OUTRA operação, com o fundo Reag Legal Claims (hoje Pedra Azul
  FIDC), sem que nenhum documento do corpus detalhe valor ou data dela. Ou seja: a existência de cessões
  de crédito ao grupo Reag está confirmada pela própria defesa; o valor de R$ 38 milhões e a operação
  específica com a Reag Legal Claims/Pedra Azul FIDC seguem sem confirmação documental direta — corpus
  não resolve se são a mesma operação, descrita de forma diferente pelas duas partes, ou duas operações
  distintas.'
