  date: '2026-02-13'
open_questions:
- Rui Costa não é alvo nem investigado em nenhuma frente do caso. Sua presença no corpus decorre de ser
  o signatário dos atos administrativos que estruturaram o produto, e de ter estado na reunião de 04/12/2024
  — não de imputação de qualquer natureza.
- Rui Costa e Jaques Wagner disputam, em 2026, as duas vagas do Senado pela Bahia na mesma chapa — contexto
  político que o corpus registra por transparência, sem que dele decorra qualquer imputação.
