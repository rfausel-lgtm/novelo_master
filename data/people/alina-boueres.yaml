name: Alina Boueres
role: Servidora do Ministério Público Federal, lotada no gabinete PR4-MNM (Procuradoria da República no
  Maranhão)
summary: 'Servidora do MPF, matrícula 14.103, lotada no gabinete do procurador da República Marcílio
  Nunes Medeiros (PR4-MNM), em São Luís/MA. Segundo a representação da PF de maio de 2026 (PET 15.978),
  o login institucional dela foi usado, de forma reiterada entre março e julho de 2025, para consultas
  não autorizadas a procedimentos sigilosos do sistema Único do MPF — incluindo inquéritos envolvendo
  Daniel Vorcaro, Nelson Tanure, Maurício Quadrado e a aquisição do Banco Master pelo BRB — repassadas
  a Felipe Mourão e a Daniel Vorcaro. O login dela também aparece como aparente origem de um ofício forjado
  endereçado à Interpol, com timbre do MPF, usado numa tentativa de intimidação contra um músico. A PF
  registra não saber, até a data do documento, se ela foi vítima de um ataque (as credenciais tendo sido
  obtidas sem o conhecimento dela) ou se anuiu com a cessão delas.'
why_in_novelo: O login institucional dela é o canal identificado pela PF para o acesso ilícito e reiterado
  da organização de Daniel Vorcaro a sistemas sigilosos do Ministério Público Federal — um dos achados
  mais graves da representação, por atingir a integridade de outra instituição de persecução penal.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública dela localizada no corpus até a data desta apuração.
open_questions:
- 'A própria PF registra explicitamente não ter, até a data do documento, elementos para concluir se
  houve ataque hacker às credenciais dela ou cessão consciente delas — a incerteza é central ao caso,
  não fato resolvido contra ela.'
