summary: Conselheiro do Comitê de Investimentos da Amprev e um dos três alvos da operação Zona Cinzenta.
  A decisão que autorizou as buscas descreve a imputação policial de que teria funcionado como o 'elemento
  validador' do esquema, formando maioria ao aderir às propostas de José Milton Afonso Gonçalves sem pedir
  vista, diligência complementar ou parecer técnico independente — inclusive depois de alertas sobre concentração
  de 40% da carteira líquida em um único emissor e sobre procedimentos do TCU contra o banco. A ata de
  19/07/2024 o nomeia entre os três votos que aprovaram a segunda proposta por maioria, contra dois votos
  contrários. São imputações de investigação em curso; não há ação penal conhecida.
why_in_novelo: Formou, com seu voto, a maioria que aprovou a continuidade das aplicações da previdência
  estadual do Amapá no Banco Master, contra dois votos contrários no colegiado.
