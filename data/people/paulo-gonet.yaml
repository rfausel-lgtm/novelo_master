summary: Procurador-Geral da República. O relatório da PF sobre o celular de Vorcaro contém seção de pesquisa
  pelos termos 'Paulo Gonet' e identifica menções, em conversas do banqueiro com terceiros, a pessoa que
  'pode se tratar' do PGR. A PGR manifestou-se favoravelmente a medidas nas fases da Compliance Zero.
  O relatório não conclui pela prática de crime.
why_in_novelo: É mencionado em relatório da Polícia Federal sobre o celular de Daniel Vorcaro e chefia
  o órgão que se manifestou nas fases da Operação Compliance Zero.
