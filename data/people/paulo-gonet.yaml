open_questions:
- A posição pública de Gonet sobre as menções no relatório da PF não foi localizada em fonte verificada
  do corpus.
- O corpus não tem a manifestação formal da PGR ao relator; o prazo de cinco dias estava em curso quando
  o registro foi feito.
- O filho do procurador-geral é pessoa privada e não integra o mapa; as reportagens o nomeiam.
- Gonet pediu o arquivamento das alegações de intimidação de Vorcaro sendo ele próprio nominalmente citado
  nas mensagens do celular do banqueiro. Segundo o Jornal de Brasília, há divisão interna no MPF sobre
  se ele deveria se afastar do processo por prudência; a cúpula avalia que não há elemento capaz de torná-lo
  alvo de investigação.
