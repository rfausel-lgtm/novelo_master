summary: Foi condenado pela CVM em 29/09/2026, com João Carlos Mansur, à multa individual de R$ 170 mil pela
  não elaboração das demonstrações financeiras de 2024 e dos ITR do 1º e 2º trimestres de 2025 da REAG Capital
  Holding S.A., da qual era diretor financeiro, segundo o voto da diretora Marina Copola (PAS
  19957.011231/2025-34). É infração formal de dever de informação, decisão de primeira instância
  administrativa, e cabe recurso, com efeito suspensivo, ao CRSFN. O voto e a nota da CVM não relacionam a
  condenação ao Banco Master.
why_in_novelo: Condenado pela CVM, em 29/09/2026, à multa de R$ 170 mil por não elaborar demonstrações
  financeiras e ITR da REAG Capital Holding S.A., da qual era diretor financeiro.
