name: Yves Ribeiro
category: politician
role: Ex-prefeito de Paulista (PE)
summary: Ex-prefeito de Paulista (PE). Sob sua gestão, em fevereiro de 2024, a PreviPaulista aplicou cerca de R$
  3 milhões em Letras Financeiras do Banco Master — decisão que a administração seguinte descreve como tomada à
  revelia da governança interna do instituto, contrariando o parecer da consultoria de investimentos contratada
  e sem aprovação do Comitê de Investimentos. É investigado na Operação Take Over da Polícia Federal, deflagrada
  em 10/06/2026, que investiga suspeita de pagamento de propina a gestores do fundo.
why_in_novelo: Era prefeito de Paulista quando o instituto de previdência municipal aplicou recursos no Banco Master
  de forma que a própria administração seguinte descreve como irregular desde a origem.
cited_position:
