name: Bellini Santana
category: public_official
role: Ex-chefe-adjunto do Departamento de Supervisão Bancária (Desup) do Banco Central
positions: []
summary: Ocupava cargo de chefia na Desup, com responsabilidade direta pela supervisão de instituições
  financeiras monitoradas pelo Banco Central, entre elas o Banco Master. Segundo mensagens de WhatsApp
  entre Fabiano Zettel e Daniel Vorcaro reproduzidas pela imprensa a partir da decisão do ministro André
  Mendonça, teria recebido pagamentos ('Belline cobrando. Paga?' / 'Claro') operacionalizados por Zettel
  e por Ana Cláudia Queiroz de Paiva através do mesmo contrato fictício com a Varajo Consultoria Empresarial.
  Teria participado de encontros com Vorcaro fora das dependências do Banco Central e pedido contato por
  telefone para evitar registro escrito. Recebeu medida cautelar de tornozeleira eletrônica em 04/03/2026;
  não houve prisão preventiva.
why_in_novelo: Ex-chefe da Desup apontado, na decisão do STF que decretou a prisão preventiva de Vorcaro,
  como alvo de medidas cautelares por suposto recebimento de pagamentos do Banco Master.
