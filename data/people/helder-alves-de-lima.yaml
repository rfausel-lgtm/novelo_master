name: Helder Alves de Lima
category: other
role: Contador da Roseno & Ribeiro Gestão Empresarial (empresa de Marilson Roseno da Silva); cautelar de proibição
  de deixar o país em 14/05/2026
summary: Alvo de cautelar de proibição de se ausentar da comarca e do país na 6ª fase da Operação Compliance Zero
  (decisão de 13/05/2026). Contador da Roseno & Ribeiro Gestão Empresarial, controlada por Marilson Roseno da Silva,
  responsável pela emissão das notas fiscais que davam aparência formal aos pagamentos da King Participações Imobiliárias
  (de Luiz Phillipi Mourão) a Marilson. Segundo a PF, permaneceu emitindo notas mesmo após a 2ª fase da operação
  — em 08/10/2025, Marilson lhe pediu 'outra nota de 50k' por um 'serviço adicional'. Comunicava-se com Marilson
  por dois números salvos como 'Heldera' e 'Heldeira Resenha'.
why_in_novelo: É o operador contábil-documental que dava roupagem formal e lícita aos repasses financeiros recebidos
  por Marilson Roseno em nome do núcleo 'A Turma'.
