name: Cezinha de Madureira
full_name: Antônio Cezar Correia Freire
category: politician
role: Deputado federal (PL-SP)
positions: []
summary: 'Nome político de Antônio Cezar Correia Freire (nascido em 12/12/1973, Ipiaú/BA); radialista de
  origem, mudou-se para São Paulo, onde construiu carreira política. Deputado estadual por SP (2015-2019),
  deputado federal desde 2019 (reeleito 2022), filiado ao PSD por anos até migrar para o PL em 2026. Pastor
  e liderança da Assembleia de Deus Ministério de Madureira — uma das maiores comunidades evangélicas do
  país —, de onde vem o apelido. Foi líder da Frente Parlamentar Evangélica ("bancada da Bíblia"). Segundo
  o Brasil de Fato, articulou com Ciro Soares o encontro de 14/03/2025 entre Vorcaro e o ministro André
  Mendonça e enviou mensagem confirmando que o ministro aguardava o banqueiro — relação que remonta a pelo
  menos 12/09/2021, quando Mendonça, recém-indicado ao STF, participou de culto na Assembleia de Deus de
  Madureira onde Cezinha era liderança. Em 14/09/2026, ele e a esposa, a advogada Valéria Rodrigues
  Linhares, foram alvos da terceira fase da Operação Transparência (quatro mandados de busca e apreensão
  no DF e em SP, autorizados pelo Min. Flávio Dino), por suspeita de exploração de prestígio, tráfico de
  influência, corrupção passiva e lavagem de dinheiro — negociação, via a ex-assessora de Arthur Lira
  Mariângela Fialek, de contratos de honorários condicionados ao resultado de processos sob relatoria de
  ministros do STF, entre eles Kassio Nunes Marques.'
why_in_novelo: É apontado pela imprensa, com base em mensagens do celular de Daniel Vorcaro, como articulador
  do encontro entre o banqueiro e o ministro André Mendonça — e, desde 14/09/2026, é também alvo formal de
  investigação da PF, autorizada pelo mesmo Min. Flávio Dino que na véspera da sessão do STF sobre o caso
  Master citou esse mesmo encontro na decisão da ADPF 1.196 (lote 313).
