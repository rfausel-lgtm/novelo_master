id: cezinha-de-madureira
kind: person
name: Cezinha de Madureira
category: politician
role: Deputado federal (PL-SP)
positions: []
summary: Deputado federal e liderança da Assembleia de Deus Ministério de Madureira. Segundo o Brasil
  de Fato, articulou com Ciro Soares o encontro de 14/03/2025 entre Vorcaro e o ministro André Mendonça
  e enviou mensagem confirmando que o ministro aguardava o banqueiro. Em 14/09/2026, ele e a esposa,
  Valéria Rodrigues Linhares, foram alvos da terceira fase da Operação Transparência (quatro mandados de
  busca e apreensão no DF e em SP, autorizados pelo Min. Flávio Dino), por suspeita de exploração de
  prestígio, tráfico de influência, corrupção passiva e lavagem de dinheiro — negociação de valores
  condicionados ao resultado de processos judiciais em tribunais superiores.
why_in_novelo: É apontado pela imprensa, com base em mensagens do celular de Daniel Vorcaro, como articulador
  do encontro entre o banqueiro e o ministro André Mendonça — e, desde 14/09/2026, é também alvo formal de
  investigação da PF, autorizada pelo mesmo Min. Flávio Dino que na véspera da sessão do STF sobre o caso
  Master citou esse mesmo encontro na decisão da ADPF 1.196 (lote 313).
cited_position:
- date: '2026-09-02'
  by_id: cezinha-de-madureira
  kind: denial
  summary: Negou ato ilícito; à época do encontro não havia informação pública de investigação sobre Vorcaro.
  source_ids:
