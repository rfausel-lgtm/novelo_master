open_questions:
- 'NOVO (15/09/2026): a investigação de tráfico de influência (Operação Transparência) é formalmente
  distinta da apuração sobre o encontro Mendonça-Vorcaro — nenhuma fonte, até esta coleta, afirma que a PF
  ou o Min. Dino tenham ligado formalmente os dois fatos entre si; a proximidade temporal e o fato de ambos
  envolverem o mesmo intermediário e o mesmo relator são registradas aqui como coincidência relevante a
  observar, não como conexão processual estabelecida.'
- 'NOVO (15/09/2026): um fork delegado apurou, sem confirmação por fonte independente localizada por esta
  equipe, que ele teria articulado diretamente junto ao Congresso a aprovação do nome de Mendonça ao STF em
  2021 (a alegação original citava incorretamente Rodrigo Pacheco como presidente da Câmara — ele presidia
  o Senado). O que está confirmado é sua presença, como liderança evangélica, no culto de 12/09/2021 em que
  Mendonça declarou submissão espiritual aos bispos presentes (ver
  evt-2021-09-12-mendonca-culto-madureira-bispos). Tratado como open_question, não como fato.'
- 'NOVO (15/09/2026): seu patrimônio declarado ao TSE saltou de R$ 602 mil (candidatura de 2022) para R$
  3,1 milhões (candidatura de 2026, PL, número 2223/SP) — período que coincide com o intervalo em que a PF
  situa o esquema de honorários condicionados. Nenhuma fonte localizada por esta equipe compara diretamente
  esse crescimento aos valores dos contratos investigados; registrado como coincidência temporal a observar,
  não como fato provado.'
