  o registro de uma arma de fogo a partir do número de série, enviando print de sistema interno da PF com
  os dados do armamento e de seu proprietário, José Utsch de Lima.'
why_in_novelo: É um dos policiais federais da ativa identificados, fora do núcleo "A Turma", que teria
  atendido a pedido de consulta indevida a sistemas internos em favor de Marilson Roseno.
