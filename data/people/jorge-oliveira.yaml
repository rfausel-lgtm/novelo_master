summary: >-
  Ministro do TCU desde a posse de 31/12/2020, segundo o próprio tribunal, e vice-presidente do tribunal para
  2026, segundo o Poder360. É relator do Acórdão 5163/2026 da 2ª Câmara, de 13/10/2026, que sobrestou o
  julgamento das contas de 2025 do Banco Central, e, segundo o mesmo acórdão, do TC 008.216/2025-8, em que está
  sobrestado pedido de reexame relacionado a representação do MPTCU sobre a atuação do Banco Central na operação
  entre o BRB e o Banco Master. Em 20/10/2026, também como relator, a 2ª Câmara levantou o sobrestamento e julgou regulares essas contas, com quitação plena (Acórdão 5184/2026). Antes do TCU, foi ministro-chefe da Secretaria-Geral da Presidência da
  República.
why_in_novelo: >-
  Relator do acórdão da 2ª Câmara do TCU de 13/10/2026 que sobrestou as contas de 2025 do Banco Central e do TC
  008.216/2025-8 (operação BRB–Master), conforme o acórdão.
