open_questions:
- A Ata 35/2026 da 2ª Câmara, referida no acórdão, não foi lida.
- 'O conteúdo do TC 008.216/2025-8 não é público no acervo: o acórdão informa apenas que lá está sobrestado o pedido de reexame "até que sobrevenham elementos decisivos da Reclamação 88.121".'
- Identidade estabelecida pelo cargo (ministro do TCU, relator do acórdão); homônimos sem esse cargo não são associados a ele.
