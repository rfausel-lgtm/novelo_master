open_questions:
- O corpus não registra defesa técnica de Lemos posterior à operação; a decisão determinou contraditório
  diferido, a ser exercido apenas em eventual ação penal.
- A alegação de que teria sido tesoureiro da campanha de Alcolumbre em 2022 circula na imprensa sem que
  nenhum veículo cite o documento; a equipe não conseguiu confirmá-la em fonte primária do TSE.
