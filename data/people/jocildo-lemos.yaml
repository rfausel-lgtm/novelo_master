summary: Diretor-presidente da Amapá Previdência e coordenador de seu Comitê de Investimentos. Segundo
  a PF (operação Zona Cinzenta, 06/02/2026), teve 'papel central' nas reuniões que aprovaram, em julho
  de 2024, R$ 400 milhões em letras financeiras do Banco Master sem documentação técnica prévia; a Justiça
  Federal autorizou buscas. Foi tesoureiro da campanha de Alcolumbre em 2022 e indicado ao cargo com apoio
  do senador, segundo a imprensa. Em comunicado oficial de 19/11/2025 anunciou a habilitação da Amprev
  na liquidação do Master. A leitura integral da decisão acrescenta que a PF lhe atribui o papel de 'garante
  institucional' — e não o de idealizador, que a autoridade policial reserva ao conselheiro José Milton
  Afonso Gonçalves —, sustentando que ele tinha ciência da recusa da Caixa Econômica Federal em adquirir
  os mesmos ativos por alto risco e que validou uma visita técnica ao Banco Master, às vésperas do terceiro
  aporte, como ato de mera formalidade. A decisão também registra documento de autorização com sua assinatura
  no contexto das transferências. Foi nomeado pelo Decreto nº 0028, de 02/01/2023, do governador Clécio
  Luís, e exonerado a pedido pelo Decreto nº 0757, de 11/02/2026, cinco dias depois da operação. Atribuiu
  publicamente o convite para o cargo ao senador Davi Alcolumbre em duas ocasiões registradas em documentos
  oficiais da própria autarquia — no site institucional, em 02/05/2024, e na ata do Conselho Estadual
  de Previdência de 17/09/2025 —, o que o senador nega. Em setembro de 2025, dois meses antes da liquidação
  do banco, sustentava perante o conselho que o investimento era 'regular, líquido e seguro'.
why_in_novelo: Dirigia a autarquia previdenciária do Amapá que investiu R$ 400 milhões no Banco Master,
  investimento hoje sob investigação da PF, e tem ligação política com o presidente do Senado, segundo
  a imprensa.
