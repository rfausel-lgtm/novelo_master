role: Procurador da República, 28º Ofício da PR-DF
summary: 'Procurador da República responsável, desde abril de 2025, pela Notícia de Fato 1.16.000.001223/2025-35
  — origem de toda a apuração do caso Banco Master. Determinou as seis diligências iniciais (10/04/2025):
  acesso a RIFs do Coaf, ofícios à CVM, ao Banco Central, à Caixa, à Previc e à Secretaria de Regime Próprio
  e Complementar/MPS. Requisitou formalmente a instauração do IPL 2025.0087917 à Corregedoria da PF
  (07-08/08/2025), após receber comunicação de crime do Banco Central. Atua em sua capacidade funcional,
  sem que os documentos lidos até agora indiquem qualquer questionamento à sua condução.'
why_in_novelo: É o procurador da República cuja atuação, desde abril de 2025, deu origem a toda a
  investigação sobre o caso Banco Master hoje conhecida como Operação Compliance Zero.
