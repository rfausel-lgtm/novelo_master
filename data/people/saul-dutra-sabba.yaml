open_questions:
- 'A ligação de Saul Dutra Sabbá com a tradicional família Sabbá do Amazonas — sugerida pela coincidência
  do sobrenome composto Benayon Sabbá, pela origem judaico-marroquina e por afirmação da Revista Cenarium
  que o vincula ao contexto da Refinaria Isaac Sabbá — não pôde ser confirmada documentalmente: a genealogia
  pública de Isaac Benayon Sabbá não registra o pai declarado por Saul entre os familiares. Não se publica
  o parentesco como fato.'
- 'Há versões incompatíveis sobre a fundação do Banco Máxima: a autobiografia de Sabbá indica 1984, ao
  lado do pai, enquanto a imprensa registra 1990, como transformação da Máxima Corretora (de 1974) em
  banco múltiplo.'
- Sabbá foi o único dos cinco réus condenado na ação penal sobre o Banco Máxima; os outros quatro foram
  absolvidos por ausência de prova de concorrência para a infração. Consta ainda condenação por gestão
  fraudulenta em ação distinta, no Rio de Janeiro (nº 5041756-94.2021.4.02.5101), por fatos de 2010 a
  junho de 2014 envolvendo o Grupo Marsans — dado não verificado na íntegra pela equipe.
