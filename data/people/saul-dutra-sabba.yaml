id: saul-dutra-sabba
name: Saul Dutra Sabbá
category: businessperson
role: Antigo controlador do Banco Máxima; inabilitado pelo BC em 2018 e condenado por gestão fraudulenta
  em 2025
summary: 'Controlava o Banco Máxima antes da entrada de Daniel Vorcaro. Em contrato de 15/09/2017, vendeu
  a Vorcaro 56,87% do capital do banco por R$ 40 milhões, pagos em R$ 36 milhões em cotas do fundo Brazil
  Realty e apenas R$ 4 milhões em espécie; segundo o voto BCB 20/2019, sua participação foi comprada pelo
  fundo Brazil Realty. Não se tratava de um ativo saudável vendido por sucessão: o banco estava desenquadrado
  das regras prudenciais e à beira da liquidação. Em 19/07/2018, o Banco Central o inabilitou para atuar
  como administrador de instituições financeiras, por simular valorização de investimento em controlada
  para reduzir prejuízos contábeis e por prestar informações incorretas ao BC, de forma intencional e
  sistemática, para ocultar grave insuficiência de capital. Em abril de 2025 foi condenado pela 6ª Vara
  Criminal Federal de São Paulo a três anos de reclusão em regime aberto por gestão fraudulenta, por fatos
  de 2014 a 2016. Em dezembro de 2025 firmou acordo de não persecução penal com o MPF — que havia resistido
  ao acordo —, homologado em 05/02/2026, com extinção da punibilidade. Não consta como alvo nas fases
  divulgadas da Operação Compliance Zero; seu processo é anterior e autônomo.'
why_in_novelo: Era o controlador do banco cuja transferência de controle deu origem ao Conglomerado Master
  — e foi punido pelo Banco Central e condenado criminalmente por ocultar a insuficiência de capital da
  mesma instituição, no período imediatamente anterior à venda.
