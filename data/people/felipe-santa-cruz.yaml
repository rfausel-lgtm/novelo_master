summary: Advogado carioca (nome civil Felipe de Santa Cruz Oliveira Scaletsky), presidiu o Conselho Federal
  da OAB entre 2019 e 2022, período de atritos públicos com o governo Bolsonaro. Seu escritório, Felipe
  Santa Cruz Advogados (CNPJ 11.820.663/0001-79, aberto em 2010, Rio de Janeiro/RJ), recebeu R$ 1,55 milhão
  do Banco Master em 2025, em dois pagamentos de R$ 776 mil.
why_in_novelo: Recebeu pagamentos do Banco Master por meio de seu escritório, segundo dados da Receita
  Federal enviados à CPI do Crime Organizado — de perfil político oposto ao de outro ex-presidente da
  OAB (Furtado Coêlho) que também recebeu do banco, mostrando que a rede de honorários atravessa espectros
  políticos distintos.
