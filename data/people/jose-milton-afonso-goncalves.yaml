summary: Conselheiro do Comitê de Investimentos da Amprev e um dos três alvos da operação Zona Cinzenta
  (06/02/2026). É a ele — e não ao diretor-presidente — que a Polícia Federal atribui o papel de 'mentor
  intelectual e principal articulador' das operações no colegiado. Segundo a decisão que autorizou as
  buscas, propôs na 11ª reunião extraordinária do CIAP, em 12/07/2024, a alocação de R$ 200 milhões em
  letras financeiras do Banco Master com vencimento em 10 anos e taxa de IPCA + 8,35% ao ano, avocou para
  si a relatoria das propostas e sustentou a aprovação nas reuniões de 19 e 30 de julho. A mesma decisão
  registra que teria omitido comparativos de risco de crédito e rejeitado ofertas de Santander, BTG Pactual
  e Safra sob o argumento de que a taxa do Master era superior. As imputações são de investigação em curso;
  não há ação penal conhecida.
why_in_novelo: É a ele que a Polícia Federal atribui a iniciativa e a relatoria das propostas que levaram
  R$ 400 milhões da previdência dos servidores do Amapá para letras financeiras do Banco Master.
