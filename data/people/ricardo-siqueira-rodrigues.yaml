open_questions:
- 'Suas mensagens citam um "dono" do Rioprevidência e um "operador político" sem nomeá-los expressamente; a
  PF não esclarece, na petição lida, a quem se refere. CONFIRMADO (13/09/2026): em áudio transcrito no
  documento comprobatório, ele nega ser o "dono" ("Eu não vou te enrolar não, cara. Lá, o dono é outro."),
  mas também não o nomeia — nem para a própria PF em depoimento. Em entrevista ao Metrópoles
  publicada em 31/05/2026 (CORRIGIDO no lote 321: o acervo registrara 13/09/2026), dias depois de ser alvo da 8ª
  fase da Compliance Zero, prometeu revelar a identidade à PF ou à PGR "dentro dos próximos dias" — disse que é
  um político ainda não citado nas investigações, mas não o nomeou publicamente. Três meses e meio depois, a
  identidade segue desconhecida e não há notícia pública do depoimento.'
- 'NOVO (13/09/2026): em 11/08/2026, Mendonça indeferiu pedido formulado por ele na Pet 15.676 (caso Cláudio
  Castro), mantendo as investigações contra ele em curso — o teor do pedido não foi lido, apenas o dispositivo
  público que o nega.'
- 'Percentuais divergentes (16/10/2026): o UOL diz que a consultoria dele praticava comissão de 10% com o
  Master; o acervo registra, para o Rioprevidência, 0,6% sobre valores captados em mensagem dele próprio. Não
  reconciliado; não há documento da tesouraria do Master sobre os R$ 8,9 milhões, a nota de R$ 8 milhões e os
  R$ 11 milhões descritos pelo UOL, e "Raphael" não é identificado.'
