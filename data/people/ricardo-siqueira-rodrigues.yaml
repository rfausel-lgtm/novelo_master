id: ricardo-siqueira-rodrigues
kind: person
name: Ricardo Siqueira Rodrigues
category: other
role: Operador financeiro, apontado como intermediário de aportes de RPPS no Banco Master
summary: 'Operador financeiro apontado pela PF e pela PGR como intermediário dos aportes da RioPrevidência
  (RPPS do Rio de Janeiro) no Banco Master. Segundo a representação da PF na Pet 15.497 (20/02/2026), mensagens
  suas afirmam que a liberação dos investimentos dependia de "alinhamento político", referindo-se a um "dono"
  do órgão e a um "operador político" que "manda lá de verdade" — sem nomear expressamente quem seriam. O
  Master teria pago a ele ao menos R$ 22,1 milhões pela intermediação (cerca de 0,6% do total aportado), e a
  empresa Mídias Promotora recebeu R$ 126 milhões do banco entre 2022 e 2025, descrita nas peças como veículo
  de recebimento e distribuição de comissões. NOVO (13/09/2026): o documento comprobatório da PF (Pet 15.497)
  revela que ele não é um operador estreante nesse tipo de esquema — é alvo, em outras apurações, de mandado
  de prisão preventiva na Operação Rizoma (fraude em fundos de pensão Postalis e Serpro), citação na Operação
  Circus Maximus (vantagens indevidas a diretores do BRB), e confissão, na Operação Encilhamento, de pagamento
  de R$ 1 milhão em comissões a Renato de Matteo. Foi apresentado a Vorcaro por Fabiano Zettel em 18/10/2023.
  Foi também condenado pela CVM em dezembro de 2024 — antes do episódio RioPrevidência — por fraude no
  empreendimento imobiliário LSH Hotel (ex-licenciado com a marca Trump, na Barra da Tijuca): R$ 17,7
  milhões de condenação individual dentro de um esquema total de R$ 45 milhões, ao lado do coréu Paulo
  Figueiredo Filho.
  NOVO (13/09/2026): em mensagem de 18/06/2024, ele mesmo confirma o percentual da comissão — 0,6% sobre
  valores captados — ao calcular seu "bônus de desempenho por coordenação" em R$ 7,2 milhões sobre R$ 1,2
  bilhão captado. A PF aponta que a Mídias Promotora é formalmente titulada por Gilson Bahia Vasconcelos,
  mas o telefone da empresa na Receita Federal está vinculado a ele, indício de uso de testa de ferro.'
why_in_novelo: É apontado por PF e PGR como o operador que intermediou os aportes bilionários da
  RioPrevidência no Banco Master, e suas mensagens são citadas como indício de interferência política sobre
  o RPPS fluminense.
