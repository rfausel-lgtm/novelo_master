  summary: Nenhuma manifestação pública dele localizada no corpus até a data desta apuração.
open_questions:
- 'Suas mensagens citam um "dono" do Rioprevidência e um "operador político" sem nomeá-los expressamente; a
  PF não esclarece, na petição lida, a quem se refere. CONFIRMADO (13/09/2026): em áudio transcrito no
  documento comprobatório, ele nega ser o "dono" ("Eu não vou te enrolar não, cara. Lá, o dono é outro."),
  mas também não o nomeia — nem para a própria PF em depoimento. Em entrevista à imprensa no mesmo dia
  (13/09/2026), a primeira desde que passou a ser publicamente investigado, prometeu revelar a identidade
  à PF — disse que é um político ainda não citado nas investigações, mas não o nomeou publicamente. A
  identidade segue desconhecida até esta coleta.'
- 'NOVO (13/09/2026): em 11/08/2026, Mendonça indeferiu pedido formulado por ele na Pet 15.676 (caso Cláudio
  Castro), mantendo as investigações contra ele em curso — o teor do pedido não foi lido, apenas o dispositivo
  público que o nega.'
