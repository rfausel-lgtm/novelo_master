open_questions:
- 'Tensão não resolvida entre discurso e conduta: a crítica pública a Moraes na campanha de reeleição
  (janeiro/2025) e a recusa de pautar seu afastamento em setembro/2026, já com evidência concreta em mãos
  — nenhuma fonte liga expressamente os dois fatos; fica registrada como tensão documentável, não como
  contradição provada (ver ev-simonetti-critica-moraes-campanha-depois-recusa-pautar).'
- Não localizada indicação de vínculo financeiro ou profissional entre o escritório Simonetti e Paiva
  Advogados (Manaus) e o Banco Master, Daniel Vorcaro, CredCesta ou a Amazonprev — busca negativa
  especificamente testada pela equipe, dado ele ser de Manaus e a Amazonprev (RPPS do Amazonas) já estar
  mapeada no acervo como investidora do Master.
- Não está estabelecido se a comissão criada em 09/09/2026 tem prazo para concluir os trabalhos, nem se
  seu relatório será público.
