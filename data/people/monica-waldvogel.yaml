summary: Jornalista da GloboNews. Em programa de 03/09/2026, relatou ter apurado, em conversa com Andrei
  Rodrigues, que a PF vinha produzindo havia muito tempo relatórios de inteligência para 'consumo próprio'
  sobre o que considerava irregularidades na conduta de André Mendonça em suas relatorias — cerca de 5
  ou 6 relatórios — e que esses relatórios 'foram solicitados pelo Ministro Alexandre [de Moraes]'. A
  fala foi citada literalmente pelo próprio Mendonça em sua decisão de 08/09/2026 na Pet 16.662.
why_in_novelo: Sua fala em programa de TV, citada pelo próprio ministro relator em decisão oficial do
  STF, é a única fonte disponível para a alegação de que Alexandre de Moraes teria solicitado os relatórios
  de inteligência da PF sobre Mendonça — atribuída a ela, que por sua vez atribui a informação a Andrei
  Rodrigues em conversa reservada, não a documento ou declaração pública dele.
