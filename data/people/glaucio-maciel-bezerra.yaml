- 'Achado em 13/09/2026: reportagens sobre a apuração da PF/MP-AP a respeito de um alerta ignorado atribuem
  a ele, em reunião de 30/07/2024, a afirmação de que estava "propenso a se posicionar pela suspensão
  desse investimento até que se faça diligências adicionais aos órgãos reguladores e ao TCU", citando um
  "problema envolvendo questão política e de governança junto à Caixa Econômica Federal" do emissor. Data
  e teor distintos do voto contrário já registrado (19/07/2024, ata do CIAP) — não reconciliado se é o
  mesmo episódio ou um segundo alerta, ver ev-glaucio-bezerra-alerta-30-07-2024-fundo-com-irmao-de-alcolumbre.'
