summary: Banqueiro, controlador do BTG Pactual. Mensagens de Vorcaro à namorada (30/03 a 04/04/2025),
  divulgadas por Poder360 e CNN, sugerem que Esteves teria tentado dissuadi-lo da operação com o BRB e
  apresentado proposta para o Master; em 04/04/2025 Vorcaro relata encontro 'a pedido do Banco Central'.
  O BTG afirmou nunca ter tido interesse na aquisição do Banco Master, apenas na compra pontual de ativos
  não problemáticos para prover liquidez.
why_in_novelo: É mencionado em mensagens de Daniel Vorcaro, divulgadas pela imprensa, sobre a disputa
  em torno da venda do Banco Master ao BRB; a posição do BTG está registrada.
