open_questions:
- O diretor de redação da piauí, André Petry, falou ao SBT News em 29/09/2026 sobre fato distinto (ataque ao site
  em outubro de 2024 e mensagens atribuídas ao grupo de Vorcaro sobre invasão de e-mail); a fala não confirma nem
  desmente o pedido de retirada e não é registrada aqui.
- Segundo o Poder360 (09/07/2026), a PF afirma que Miranda ficou contrariado com a recusa dela.
