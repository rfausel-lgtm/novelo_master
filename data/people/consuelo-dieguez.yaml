summary: Jornalista da revista Piauí. Segundo a decisão de André Mendonça na PET 16.346, foi contatada
  por Thiago Miranda, a mando de Daniel Vorcaro, para retirar de circulação reportagem considerada prejudicial
  aos interesses do banqueiro; recusou-se e orientou que ele enviasse carta à revista com sua versão dos
  fatos.
why_in_novelo: Jornalista apontada, em decisão judicial da Operação Compliance Zero, como alvo de tentativa
  de supressão de reportagem a mando de Daniel Vorcaro.
