- kind: not_located
  date: '2026-10-16'
  summary: Nenhuma manifestação própria da jornalista, nem nota da revista piauí sobre o pedido de retirada de
    reportagem (decisão de Mendonça na PET 16.346), localizada. Busca em 16/10/2026 (WebSearch sobre Consuelo Dieguez,
    piauí, Thiago Miranda, Vorcaro, retirada de reportagem, carta, e sobre nota da revista, intimidação e Mendonça;
    leitura de CNN Brasil de 09 e 10/07/2026 e Poder360 de 09/07/2026, que atribuem tudo à PF e à decisão e não
    trazem declaração da piauí nem dela). Site e redes oficiais da piauí e da jornalista não consultados.
