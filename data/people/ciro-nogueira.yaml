open_questions:
- 'RESOLVIDO (lote 264): a Emenda nº 11 à PEC 65/2023 foi apresentada em 13/08/2024, elevava a garantia do FGC a R$ 1
  milhão e foi rejeitada pela CCJ em 10/06/2026 (ver ev-emenda-11-de-ciro-nogueira-elevava-o-fgc-a-1-milhao-e-foi-rejeitada-na-ccj).'
- 'RESOLVIDO (lote 350): a PET 15.873, que a PGR listara em 11/09/2026 entre os processos fora do levantamento
  de sigilo de 10/09/2026 (ver ev-pgr-lista-17-processos-omitidos-do-levantamento-de-sigilo), teve o sigilo
  levantado por despacho de André Mendonça de 11/09/2026 na Pet 16.704 (ver
  doc-2026-09-11-despacho-pet-16704-levanta-sigilo-de-lista-de-pets).'
- 'Achado em 13/09/2026: reportagens de fevereiro de 2026 o identificam, ao lado de Davi Alcolumbre, entre
  os presentes/debatedores do 1º Fórum Jurídico Brasil de Ideias (Londres, 24-26/04/2024), evento patrocinado
  pelo Banco Master. Sem indicação de presença na degustação de Macallan mais restrita, do dia seguinte,
  custeada por Vorcaro; sem manifestação dele sobre o próprio fórum localizada pela equipe.'
- 'Em qual Pet (15.873, 15.978 ou 15.674) está o relatório da PF sobre a hospedagem em Lisboa e qual a data dele
  (a IstoÉ diz abril de 2026): não identificado. O sigilo da Pet 15.978 foi restabelecido em 24/06/2026 e ela
  não consta da lista de 11/09/2026.'
- 'Número de diárias e valores da hospedagem em Lisboa: as fontes usam unidades distintas (por diária, cinco
  diárias, fatura em euros convertida, valor por pessoa), e a diferença para as diárias pagas pelo Senado no
  mesmo período, segundo o Correio Braziliense, não é explicada.'
- 'Grupo de WhatsApp: o conteúdo anterior a 20/08/2025 foi apagado automaticamente, segundo o UOL, e a origem
  processual do material (relatório, Pet ou decisão) não é conhecida.'
