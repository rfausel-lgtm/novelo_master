summary: Senador pelo Piauí. Em 07/05/2026 o STF autorizou fase da Compliance Zero que, segundo a PF,
  envolve suposta atuação do senador em favor de Daniel Vorcaro; o ministro relator impôs ao parlamentar
  medidas cautelares (proibição de contato com testemunhas e investigados). Segundo reportagens de 16/06/2026
  (CNN Brasil, Poder360, IstoÉ, Metrópoles e Agência O Globo) que descrevem relatório da PF não localizado pelo
  Novelo, Vorcaro pediu em 18/06/2024 reservas de hotel em Lisboa para "Ciro" e "Hugo", identificados pela PF
  como o senador e o deputado Hugo Motta; segundo a Agência O Globo, a PF estima em R$ 468.721,78 o "benefício
  econômico direto" do senador em viagens e jantares pagos por Vorcaro; os valores da hospedagem divergem entre os veículos. Segundo
  o UOL (30/09/2026), participava com Vorcaro, Motta e Fábio Faria de grupo de WhatsApp que criou em abril de
  2024. O sigilo das Pets 15.873 e 15.978 foi levantado em 16/06/2026, restabelecido em 24/06 e, quanto à Pet
  15.873, levantado de novo em 11/09/2026. A defesa diz que prestará esclarecimentos nos autos. Candidato à
  reeleição ao Senado pelo Piauí, não foi reeleito; teve 904.961 votos (24,68% dos válidos) no 1º turno de
  04/10/2026, terceiro colocado numa eleição de duas vagas, segundo o TSE.
why_in_novelo: É citado em comunicação oficial do STF como investigado em fase da Operação Compliance
  Zero, por suposta atuação em favor de interesses de Daniel Vorcaro, segundo a Polícia Federal.
