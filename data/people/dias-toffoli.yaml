summary: Ministro do STF. Segundo comunicação oficial do tribunal de 20/03/2026, declarou suspeição, por
  razões de foro íntimo, para participar de julgamentos relacionados ao caso Master, após ter sido sorteado
  relator do MS 40791. Entre 28 e 30/11/2025, viajou a Lima (Peru) no jato particular do empresário Luiz
  Osvaldo Pastore, seu amigo de longa data, para assistir à final da Libertadores — também a bordo estava
  o advogado Augusto de Arruda Botelho, que defende Luiz Antonio Bull, investigado no caso Master. Dois
  dias depois, em 02/12/2025, decretou sigilo no processo do Master. Em fevereiro de 2026, a PF citou
  esse voo como uma de três frentes (junto de mensagens no celular de Vorcaro e da venda de participação
  de sua empresa Maridt ao fundo Arllen, ligado ao cunhado de Vorcaro, Fabiano Zettel) num pedido de afastamento
  por suspeição — pedido arquivado por Fachin em 21/02/2026, já após Toffoli ter deixado a relatoria (12/02/2026,
  substituído por André Mendonça). O episódio motivou a OAB-SP a estudar, a partir de fevereiro de 2026,
  restrições éticas ao transporte gratuito de ministros por particulares. Na Reclamação 88.121, ajuizada por
  Vorcaro, suspendeu em 09/12/2025 as investigações de primeira instância e trouxe a Compliance Zero ao STF, e em
  22/12/2025 fixou essa competência com base em indícios envolvendo o deputado federal João Carlos Bacelar,
  mencionado em documento apreendido. Como relator do INQ 5.026, em
  janeiro de 2026 mandou reservar salas do STF para as oitivas da PF, estendeu a quebra de sigilo bancário
  aos dados consolidados do FGC e ratificou as medidas de primeiro grau; no dia em que deixou a relatoria,
  determinou que a PF enviasse ao STF, na íntegra, o conteúdo dos aparelhos apreendidos.
why_in_novelo: Declarou suspeição, por foro íntimo, para julgamentos relacionados ao caso Master, conforme
  comunicação oficial do STF.
