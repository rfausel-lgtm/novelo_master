open_questions:
- 'PISTA ENCONTRADA (lote 174), não prova: seus irmãos José Eugênio e José Carlos Dias Toffoli — sócios,
  junto com ele, da empresa familiar Maridt — constam como investigados no INQ 5.026/DF (o eixo BRB-Master),
  e obtiveram dispensa de comparecimento à CPI do Crime Organizado em 26/02/2026, poucas semanas antes de
  ele próprio declarar suspeição no caso irmão (PET 15.556). Nenhuma fonte consultada liga expressamente
  as duas coisas — é leitura da equipe a partir da cronologia e do tema comum (registrada como inferência
  classe I), não fato relatado por qualquer autoridade. A relatoria anterior do caso e as razões formais da
  suspeição, tais como declaradas por ele, continuam sem documentação em fonte primária no corpus.'
- Não há confirmação pública dele sobre o conteúdo das conversas durante o voo, além de declaração a interlocutores
  (não em nota formal) de que conversou 'só sobre futebol' e de que é amigo de Pastore há anos, sem proximidade
  com Botelho.
- Leitura direta da decisão na PET 14.601/MA (30/09/2025) confirma que ela trata exclusivamente de descumprimento
  da tese de repercussão geral do Tema 309 (de sua própria relatoria) — não menciona Vorcaro, a Kroll,
  o BRB, Quadrado ou Mansur em nenhum momento; a ligação do caso com o Master foi feita pela imprensa,
  não pelo STF. A decisão é anterior, em mais de quatro meses, à revelação pública do vínculo dele com
  a empresa Maridt e ao seu afastamento da relatoria do caso Master (12/02/2026) — cronologia citada pela
  imprensa como fundamento de suspeita, sem constituir prova de irregularidade nesta decisão específica.
- A Poder360 (06/09/2026) data sua declaração de impedimento no caso Master em 11/03/2026 — data que diverge
  da de 20/03/2026 já registrada no acervo a partir de comunicação oficial do STF; divergência sinalizada,
  não resolvida, sem impacto sobre o fato em si (o impedimento).
