role: Médico; cunhado de Daniel Lopes Monteiro; diretor de empresa de fachada usada no esquema imobiliário
summary: 'Médico, casado com Maria de Fátima Monteiro Suaki, irmã do advogado Daniel Lopes Monteiro. Segundo
  a decisão de 15/04/2026 que autorizou busca e apreensão contra ele (Pet 15.771/15.772, STF), tornou-se
  diretor da empresa de fachada Allora S.A. — com endereço coincidente ao do escritório Monteiro Rusu — após a
  renúncia dos sócios originais Sueli Ferretti e Cleber Fernandes. A Allora está entre as seis sociedades de
  prateleira controladas pelo FIP Alucard (depois Abbiamo), da REAG Portfolio Solutions, usadas para comprar
  imóveis de R$ 146,6 milhões atribuídos ao ex-presidente do BRB Paulo Henrique Costa (ver
  ev-pf-seis-empresas-e-um-fundo-da-reag-compraram-os-imoveis-de-paulo-henrique-costa).'
why_in_novelo: É apontado, na decisão que autorizou busca e apreensão no esquema de propina imobiliária ao
  BRB, como o diretor colocado à frente de uma das seis empresas de fachada que compraram os imóveis.
