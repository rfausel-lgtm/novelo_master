summary: Presidente nacional do PSD. Segundo relatório da PF citado pela CNN Brasil, em outubro de 2024
  Vorcaro pediu a Augusto Lima que acionasse Kassab para que o deputado estadual Luiz Paulo (PSD-RJ) apagasse
  vídeo crítico aos aportes da RioPrevidência no Master. Kassab afirmou ter sido procurado, ter conversado
  com o deputado federal Pedro Paulo para entender o tema e ter orientado que as denúncias prosseguissem;
  o vídeo não foi removido.
why_in_novelo: É citado em relatório da Polícia Federal como pessoa que Daniel Vorcaro tentou acionar,
  por intermediários, para conter críticas aos aportes da RioPrevidência no Banco Master; sua posição
  está registrada.
