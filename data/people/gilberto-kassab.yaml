  kind: clarification
  summary: 'Assessoria: foi procurado e, por desconhecer o tema, conversou com Pedro Paulo; este esclareceu
    a importância das denúncias; Kassab reforçou que prosseguissem e alertou que ninguém estava autorizado
    a falar em seu nome.'
