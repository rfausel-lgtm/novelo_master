open_questions:
- Não foi incluído no indiciamento de agosto/2026 (só Vorcaro, Paulo Henrique Costa e Tanure); depoimento
  adiado pela terceira vez, sem data fixada até 19/08/2026.
- Casou-se em janeiro de 2024 com Flávia Peres (ex-Arruda), ex-deputada federal e ex-secretária de Governo
  de Bolsonaro.
- O documento apócrifo 'dono e presidente de fato' segue sem qualquer avaliação formal da PF sobre sua
  credibilidade, estagnado desde março de 2026 — a narrativa dominante de toda a demais cobertura investigativa
  trata Vorcaro, não Lima, como o controlador do esquema.
- A divergência entre R$ 160 milhões (aportes formais de capital no Voiter/Pleno) e R$ 600 milhões (gasto
  total de patrimônio pessoal, segundo O Tempo) segue sem reconciliação por nenhuma fonte disponível.
- Sua defesa até 04-05/08/2026 (Ticiano Figueiredo e Pedro Ivo Velloso) era da mesma banca em que Renata
  Varandas, namorada de Andrei Rodrigues, é sócia da área de comunicação — sobreposição confirmada por
  CNPJ, sem indício de que ela tenha atuado no caso dele especificamente.
- 'Checagem dirigida em 08/09/2026 não localizou desenvolvimento novo em nenhuma frente: depoimento à
  PF segue sem data marcada; prisão domiciliar sem alteração; ação cível do Voiter sem decisão posterior
  a abril/2026; sem indiciamento ou denúncia do MPF contra ele. Resultado negativo documentado para evitar
  nova checagem redundante no curto prazo.'
- 'A origem de seu patrimônio está documentada com precisão maior do que o corpus registrava: a autorização
  para vender a Ebal é de lei de 2014, sancionada por Jaques Wagner como governador; a venda ocorreu em
  11/04/2018, no governo Rui Costa, após dois leilões desertos com lance mínimo de R$ 81 milhões, sendo
  arrematada por R$ 15 milhões com um único participante. Rui Costa declarou publicamente que ''se alguém
  pagou uma merreca de R$ 15 milhões, é porque tinha o cartão''.'
- 'O produto que ele levou ao sistema financeiro rendia mais com a REVENDA das carteiras do que com juros:
  em 2024, R$ 1,6 bilhão com venda de carteiras contra R$ 709 milhões de juros, segundo o balanço do Master
  — o que reposiciona a natureza do negócio.'
- A exclusividade de quinze anos sobre a folha dos servidores baianos, invocada como lastro para estruturar
  novo fundo e seguir operando o CredCesta, não consta dos decretos estaduais, que a equipe leu artigo
  por artigo; é atribuída ao contrato de aquisição, não obtido em fonte oficial.
