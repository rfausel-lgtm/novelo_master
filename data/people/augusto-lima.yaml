summary: Ex-CEO e ex-sócio do Banco Master. Preso na 1ª fase da Compliance Zero e solto pelo TRF-1 em
  28/11/2025 com medidas cautelares; acompanhou Vorcaro e Mantega no encontro de 04/12/2024 no Planalto,
  segundo a CNN. Segundo a CNN, controlava o Banco Pleno, liquidado pelo BC em fevereiro de 2026. Segundo
  a representação da PF, foram as carteiras do CredCesta, criado no contexto da Empresa Baiana de Alimentos,
  que o credenciaram a entrar na sociedade do Master em 2019.
why_in_novelo: Foi executivo e sócio do Banco Master, alvo da Operação Compliance Zero, e participou do
