id: ricardo-nunes
kind: person
name: Ricardo Nunes
category: public_official
role: Prefeito do município de São Paulo
positions: []
summary: Assinou o decreto municipal de julho de 2022 que criou margem consignável adicional e exclusiva
  de 10% para cartão de benefício na folha do funcionalismo da capital — fundamento invocado seis semanas
  depois no credenciamento da PKL One pela prefeitura.
why_in_novelo: Diferentemente do desenho estadual paulista, que tratou os 15% como sublimite dentro da
  margem, o decreto municipal usa a fórmula 'majorada, adicionalmente, em mais 10%', a mesma adotada no
  Rio de Janeiro e em Mato Grosso. A prefeitura credenciou a empresa em 19/08/2022 e assinou com ela o
  Termo de Adesão nº 003/2022 em 25/08/2022, aditado em outubro de 2023, com extensão da operação ao Serviço
  Funerário e ao Hospital do Servidor Público Municipal. Em agosto de 2026 a própria prefeitura descredenciou
  a empresa e denunciou o convênio — postura mais rigorosa do que a do governo estadual, que se limitou
  a suspender o código de desconto.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- 'ALEGAÇÃO NÃO APURADA, TRATAR COM CAUTELA REFORÇADA: em 06/07/2026, a Deputada Luciene Cavalcante
  apresentou, no INQ 5.026, pedido de inclusão dele como investigado, por suposta conexão entre o Banco
  Master, a Concessionária Cortel SP e a Prefeitura de São Paulo na concessão de serviços funerários e
  cemiteriais de 2023 — tema distinto do decreto de margem consignável já registrado abaixo. A decisão do
  STF apenas relata a existência da suspeita alegada pela parlamentar, sem reproduzir qualquer prova; não
  há, até esta data, nenhuma outra fonte que mencione ''Cortel SP''.'
- Não foi localizada manifestação da prefeitura sobre o intervalo entre o decreto de 07/07/2022 e o credenciamento
  de 19/08/2022, nem sobre quem solicitou a criação da margem adicional. Buscar posicionamento.
- Apurar o número de servidores municipais com contratos ativos do produto e o volume descontado entre
  2022 e 2026, dado que o descredenciamento não cancela as dívidas.
