id: marilson-roseno-da-silva
kind: person
name: Marilson Roseno da Silva
category: police
role: Policial federal aposentado, alvo da Operação Compliance Zero
positions: []
summary: 'Policial federal aposentado, apontado pela Polícia Federal como líder operacional do núcleo
  apelidado de ''A Turma'' — descrito pela corporação como composto por policiais federais da ativa e
  aposentados, bicheiros e milicianos, e financiado por Henrique Moura Vorcaro. Segundo a apuração, cooptou
  policiais para consultas indevidas em sistemas internos em favor da família Vorcaro, com o objetivo
  de descobrir o teor de inquérito em que Henrique Vorcaro fora intimado, negociando valores com o pai
  do banqueiro e pedindo ''800k''. Os policiais foram identificados na 6ª fase da operação, em 14/05/2026:
  o agente Anderson Wander da Silva Lima e a delegada Valéria Vieira Pereira da Silva, da ativa, e os
  aposentados Francisco José Pereira da Silva e Sebastião Monteiro Júnior. Preso preventivamente em 04/03/2026
  na 3ª fase, foi transferido em 15/05/2026 para presídio federal em Brasília, por determinação de Mendonça,
  sob o fundamento de que continuava recebendo informações sigilosas sobre operações policiais mesmo preso.
  Não há denúncia oferecida nem julgamento. Dados funcionais: tem 56 anos, ingressou na Polícia Federal
  por concurso em 2008 e está aposentado desde 2022, recebendo cerca de R$ 21,9 mil mensais de aposentadoria.
  A REPRESENTAÇÃO DA PF que fundamenta a 6ª fase (maio de 2026, lote 196, PET 15.978) traz o fundamento
  concreto da transferência para o presídio federal: já preso, soube por colegas de cárcere não
  identificados que a PF havia buscado sua residência em 13/03/2026 — nove dias após sua prisão —, e
  recusou-se a identificar a fonte alegando risco à sua segurança ("Doutor, eu tô correndo um risco
  grande lá que o senhor não tem noção"). O mesmo documento revela consultas ilegais dele ao sistema
  ePol, já na ativa, com os termos "André Beraldo Vorcaro", "Daniel Vorcaro", "Daniel Bueno Vorcaro" e
  "Banco Máxima", entre 7 e 13/12/2021 — quase três anos antes do episódio do drone de 2024, a evidência
  mais antiga do acervo de um vínculo dele com o interesse da família Vorcaro. A ANÁLISE DO SEU PRÓPRIO
  CELULAR (IPJ nº 1752768/2026, lote 207, PET 15.978) revela que mantinha conta secundária de WhatsApp
  Business associada a número da Turquia, sob o codinome "MISTER", com mensagens temporárias
  auto-apagáveis. Em oitiva, tentou desqualificar as acusações contra si como "fake news", dizendo que
  gravava áudios falsos a pedido de Mourão sem receber nada em troca — versão que a PF considera
  contraditória, já que ele próprio relatou, na mesma oitiva, um padrão recorrente de dois anos em que
  Vorcaro o questionava todo fim de ano sobre mandados de prisão pendentes contra o grupo. Confirmou usar
  o codinome "SP" ou "São Paulo" para se referir a Daniel Vorcaro, só depois de negar inicialmente.'
why_in_novelo: É apontado pela Polícia Federal como o agente aposentado que teria cooptado policiais para
  acessar informações sigilosas em favor da família Vorcaro.
cited_position:
- kind: version
  summary: 'RESOLVIDO (lote 185): primeira manifestação dele localizada no corpus, em petição de 02/04/2026
    pedindo a revogação da prisão preventiva. Não nega os fatos centrais (coleta e repasse de informações),
    mas argumenta ausência de violência ou ameaça atribuída a ele, contato apenas com Mourão (já falecido)
    e não com Vorcaro, cooperação integral com a PF (interrogatório de 26/03/2026) e ausência de recomendação
    da PGR pela prisão. Cita como dependentes dele uma filha de 12 anos e a mãe, de 87 anos, enferma.'
  source_ids:
  - src-stf-pet15556-edoc221-peticao-marilson-revogacao-prisao-02-04-2026
  by_id: marilson-roseno-da-silva
  date: '2026-04-02'
- kind: version
  summary: 'ATUALIZAÇÃO (lote 187): em manifestação de 21/07/2026 sobre o próprio pedido de revogação
    acima, a PGR opinou pelo indeferimento, caracterizando-o como ''um dos principais operadores do núcleo
    de coerção da organização criminosa'' — linguagem mais forte que a usada em documentos anteriores. A
    referência dele à ''ausência de recomendação da PGR'' dizia respeito à manifestação original sobre o
    decreto de prisão (março de 2026), não a esta manifestação, na qual a PGR se posiciona contra a soltura.'
  source_ids:
