  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- As imputações são da autoridade policial, sem juízo de mérito.
- Não há manifestação de Marilson Roseno da Silva ou de sua defesa em nenhuma das fontes consultadas,
  embora ele esteja preso e seja pessoa identificada sob imputação grave — situação que o corpus registra
  com destaque, por dever de contraditório.
- 'Há divergência entre fontes sobre a natureza do pagamento: reportagem de fevereiro de 2026 registra
  que ele ouviu que receberia R$ 400 mil; relatório da PF divulgado em junho de 2026, veiculado sobretudo
  por veículos de menor porte, aponta R$ 400 mil MENSAIS repassados por Henrique Vorcaro, além de pagamentos
  por Pix, presentes e bônus de fim de ano. A equipe não localizou a versão mensal em veículos de grande
  porte.'
