name: Michael Brian Davis
category: businessperson
role: Sócio e diretor da Goup Entertainment LLC, nos Estados Unidos
summary: Brasileiro naturalizado nos Estados Unidos, é sócio de Karina Ferreira da Gama na Goup Entertainment LLC,
  empresa americana da produção de 'Dark Horse', sediada em Miami. Em 17/07/2026 assinou com ela, em Miami, na condição
  de acionista e diretor, o memorando dirigido à Ancine em que a empresa americana é declarada titular dos direitos
  sobre a obra. Procurado pela reportagem que revelou o contrato de produção, em maio de 2026, não respondeu.
why_in_novelo: É o sócio, nos Estados Unidos, da empresa que a própria produtora brasileira aponta como responsável
  por contratar e pagar o elenco principal do filme financiado com recursos remetidos por Daniel Vorcaro.
