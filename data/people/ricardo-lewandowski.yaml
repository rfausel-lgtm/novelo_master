summary: Ex-ministro do STF e ex-ministro da Justiça. Segundo a CNN Brasil, o escritório em que atuava
  manteve contrato com o Banco Master, inclusive após sua posse no ministério, sob comando de familiares;
  em nota, confirmou a prestação de serviços ao Master, disse ter se retirado do escritório ao assumir
  o cargo em janeiro de 2024 e atribuiu sua saída do ministério (10/01/2026) a motivos pessoais.
why_in_novelo: Seu escritório prestou serviços ao Banco Master, fato confirmado por ele em nota, segundo
