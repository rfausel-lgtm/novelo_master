summary: Governadora do Distrito Federal. Em 01/04/2026 mandou afastar servidores e comissionados do BRB
  que participaram da aprovação da compra de ativos do Master, após auditoria independente, segundo a
  CNN Brasil. Em 15/09/2026, segundo a Folha de S.Paulo (conforme o Poder360) e segundo o Congresso em Foco,
  vieram a público mensagens de 05/04/2025 entre Daniel Vorcaro e o publicitário Thiago Miranda em que ela é
  mencionada; não há conversa direta entre Vorcaro e ela. Ela nega ter participado das negociações do BRB com
  o Master (ver o evento do dia). No 1º turno da eleição para governador do Distrito Federal de 04/10/2026 teve
  825.530 votos (49,93% dos válidos) e disputa o 2º turno, em 25/10/2026, com Leandro Grass, que teve 569.930
  votos (34,47% dos válidos), segundo o TSE.
why_in_novelo: Como governadora, determinou o afastamento de funcionários do BRB envolvidos na aprovação
  das operações com o Banco Master, segundo a imprensa.
cited_position:
- kind: public_note
  summary: 'Cobrou punição dos responsáveis pela operação, pediu o afastamento de todos os ocupantes de
    cargos que tiveram relação com o episódio e reiterou não ter sido convidada para qualquer decisão ou
    tratativa envolvendo as negociações: "A minha fala é muito dura com as pessoas que deixaram o banco
    nessa situação. Espero que a Justiça traga clareza e transparência."'
  source_ids:
  - src-expressaobrasiliense-2026-04-12-celina-leao-cobra-punicao
  by_id: celina-leao
  date: '2026-04-12'
- kind: denial
  summary: Em vídeo de 15/09/2026, sobre as mensagens entre Vorcaro e Thiago Miranda, afirmou "Seis meses
    antes de qualquer tipo de operação, eu já era contrária", segundo o Poder360.
  source_ids:
  - src-poder360-2026-09-16-celina-rebate-vorcaro-e-diz-que-era-contraria-a-compra-do-master
  by_id: celina-leao
  date: '2026-09-15'
- kind: denial
  summary: Em sabatina ao SBT Brasília de 16/09/2026, afirmou "Eu não tenho o contato do Daniel Vorcaro",
    segundo o SBT News.
  source_ids:
  - src-sbtnews-2026-09-16-celina-contesta-vorcaro-e-nega-participacao-em-negociacao
  by_id: celina-leao
  date: '2026-09-16'
- kind: denial
  summary: Em sabatina de O Globo/CBN de 18/09/2026, afirmou "Não tem um diálogo onde ele fala que eu
    participei, que dia que eu participei", disse que as mensagens foram tiradas de contexto e que só viu
    Vorcaro em festas públicas, segundo o Estadão Conteúdo.
