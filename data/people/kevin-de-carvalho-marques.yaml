name: Kevin de Carvalho Marques
category: lawyer
role: Advogado; filho do ministro Nunes Marques
positions: []
summary: Advogado, filho do ministro do STF Nunes Marques. Segundo relatório do Coaf noticiado pelo Estadão
  e outros veículos, seu escritório recebeu R$ 281,6 mil em 11 transferências (2024-2025) da Consult Inteligência
  Tributária, consultoria que recebeu R$ 6,6 milhões do Banco Master e R$ 11,3 milhões da JBS. Afirmou
  que os valores são lícitos, decorrentes de assessoria jurídica 'voltada ao fisco administrativo', e
  que nunca atuou em caso no STF.
why_in_novelo: Seu escritório recebeu pagamentos de consultoria contratada pelo Banco Master, segundo
  relatório do Coaf noticiado pela imprensa; sua posição está registrada.
cited_position:
- kind: clarification
  summary: Os valores recebidos são lícitos e decorrem de atuação profissional 'voltada ao fisco administrativo'
    (assessoria por 11 meses); o escritório 'nunca defendeu nenhum caso' no STF; criticou 'tentativas
    de criminalização da advocacia'.
