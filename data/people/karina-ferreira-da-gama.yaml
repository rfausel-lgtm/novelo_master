id: karina-ferreira-da-gama
kind: person
name: Karina Ferreira da Gama
category: businessperson
role: Presidente do Instituto Conhecer Brasil e responsável pela produtora Go Up Entertainment
positions: []
summary: Preside o Instituto Conhecer Brasil, associação que firmou com a Prefeitura de São Paulo o Termo
  de Colaboração 01/SMIT/2024, de R$ 108 milhões, para 5 mil pontos de wi-fi gratuito, e responde pela
  Go Up Entertainment, produtora do filme 'Dark Horse'. Foi alvo da Operação Wi-Fi Livre da Polícia Civil
  de São Paulo em 01/06/2026. Nega os crimes de organização criminosa, evasão de divisas e lavagem de
  dinheiro e comprometeu-se a entregar à PF a prestação de contas do filme.
why_in_novelo: É a pessoa que liga o contrato de wi-fi da Prefeitura de São Paulo à produtora do filme
  financiado por Daniel Vorcaro, e foi alvo de operação policial sobre esse contrato.
