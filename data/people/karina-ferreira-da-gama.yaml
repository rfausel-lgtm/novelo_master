open_questions:
- O corpus não tem o Termo de Colaboração 01/SMIT/2024 nem os relatórios do TCM; os números vêm da imprensa.
- Não há denúncia nem decisão de mérito sobre a empresária no corpus.
- Alvo de busca e apreensão domiciliar e pessoal na Operação Make Up, deflagrada em 10/09/2026, com proibição de
  deixar o país e de se comunicar com os demais investigados. A decisão registra que preside tanto o Instituto Conhecer
  Brasil quanto a Academia Nacional de Cultura, ambas com atividade econômica suspensa, e que adquiriu em 13/01/2025
  um veículo de R$ 102.190,00 pago integralmente em espécie, circunstância que motivou comunicação ao Coaf.
- Durante os mandados da Operação Make Up, a PF apreendeu uma ata notarial em que ela relata pressão de pessoas
  ligadas ao governo Lula, entre elas Fernando Sarney (que nega o contato), para que depusesse contra o senador
  Flávio Bolsonaro sob ameaça de prisão. O corpus não tem acesso ao texto integral do documento, apenas ao relato
  da imprensa.
