  date: '2026-09-21'
  summary: >-
    Em nota ao Metrópoles: "O ministro Kassio Nunes Marques nunca votou a favor de Daniel Vorcaro ou do Banco
    Master, nunca trocou mensagens com o banqueiro e nem pediu nada a ele. O ministro também nunca autorizou
    ninguém a falar em nome dele. São irresponsáveis quaisquer tentativas de relacionar a atuação do Ministro com
    os serviços prestados pelo filho ou quaisquer terceiros."
