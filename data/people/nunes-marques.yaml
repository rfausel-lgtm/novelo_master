- kind: clarification
  by_id: nunes-marques
  date: '2026-09-21'
  summary: >-
    Sobre o processo da usina (ARE 1.327.995), afirmou que "estava impedido por anotação da Secretaria porque
    decidiu o caso como vice-presidente do TRF-1", que depois compreendeu não estar impedido "por se tratar de
    tese ampla", pediu retificação e votou, e que "não se tratava de ação sobre o Master". Na nota do gabinete
    reproduzida pelo Poder360 em 22/09, o julgamento é descrito como "um caso específico e delimitado". Os
    andamentos oficiais do STF registram o impedimento lançado no sistema e o despacho que o afastou.
