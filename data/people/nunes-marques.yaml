open_questions:
- 'A nota de 21/09/2026 trata genericamente dos serviços do filho ("São irresponsáveis quaisquer tentativas de relacionar a atuação do Ministro com os serviços prestados pelo filho ou quaisquer terceiros"), sem detalhar os pagamentos da Consult ao escritório dele.'
- A leitura de "KN" como referência ao ministro é da imprensa (o Times Brasil a atribui à PF) e não está demonstrada por documento acessível ao Novelo.
- Número e distribuição da notícia de fato apresentada ao STF em 12/10/2026 não localizados.
- 'As duas versões da nota de 21 e 22/09/2026 descrevem o alcance do julgamento do ARE 1.327.995 de formas diferentes ("tese ampla", no Metrópoles; "caso específico e delimitado", no Poder360); os acórdãos não foram abertos.'
