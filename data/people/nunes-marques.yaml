positions:
- title: Ministro
  organization_id: supremo-tribunal-federal
  source_ids:
  - src-stf-2026-03-20-segunda-turma-mantem-prisao
summary: >-
  Ministro do STF, integrante da Segunda Turma que referendou em 20/03/2026 a prisão preventiva
  de Daniel Vorcaro e outros investigados (PET 15556); presidente do TSE, segundo o Poder360 (12/10/2026). No
  ARE 1.327.995 (União x Destilaria Alcidia S.A., relator Edson Fachin), os andamentos oficiais do STF registram
  o impedimento dele lançado no sistema em 21/02/2024, o despacho de 07/03/2024 em que o afastou ("Afasto o
  impedimento lançado no sistema, declarando-me habilitado a votar"), pedido de vista em 17/09/2024 e decisões da
  2ª Turma de 01/10/2024 e 03/06/2025 contra a União, por maioria; os andamentos não mencionam o Banco Master e
  são compatíveis com a descrição feita por ele em nota de 21/09/2026. Segundo o Metrópoles e a CNN Brasil
  (21/09/2026), mensagens de assessores de Vorcaro referem-se ao desembargador Newton Ramos e à advogada Camilla
  Ramos, cujo escritório declara ter contrato de honorários de êxito com o Master, como "Turma do KN", e as reportagens
  leem a sigla como referência a ele; nenhum documento acessível ao Novelo confirma essa leitura, e ele não é parte
  do contrato. Ele nega ter votado a favor de Vorcaro ou do Master, ter trocado mensagens com o banqueiro ou
  autorizado alguém a falar em seu nome. Em 12/10/2026, segundo o Poder360 e o Times Brasil, deputados do PT
  apresentaram ao STF notícia de fato pedindo sua investigação; o Poder360 registra que as suspeitas dependem de
  apuração.
why_in_novelo: Votou, na Segunda Turma do STF, no referendo da prisão preventiva de investigados do caso
  Master, conforme comunicação oficial do tribunal.
