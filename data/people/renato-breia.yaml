id: renato-breia
kind: person
name: Renato Breia
category: businessperson
role: Sócio da consultoria Nord Investimentos
positions: []
summary: Sócio da consultoria financeira Nord Investimentos. Segundo a decisão de André Mendonça na PET
  16.346, foi contatado por Thiago Miranda, a mando de Daniel Vorcaro, para retirar conteúdo considerado
  prejudicial; atendeu ao pedido, mas registrou contrariedade com a forma da abordagem em mensagem de
  resposta a Miranda. O conteúdo removido era uma publicação de outubro de 2024 no Instagram recomendando não
  investir no CDB do Master (nota da Nord, segundo o Brasil de Fato).
why_in_novelo: Apontado, em decisão judicial da Operação Compliance Zero, como alvo de pedido de retirada
  de conteúdo a mando de Daniel Vorcaro.
cited_position:
- kind: public_note
  date: '2026-07-10'
  summary: Em nota à imprensa reproduzida pelo Brasil de Fato (10/07/2026), a Nord e o sócio-fundador confirmaram que
    foram procurados por Thiago Miranda de forma insistente para que Breia retirasse conteúdo publicado no Instagram
    em outubro de 2024 que recomendava aos clientes não investir no CDB do Banco Master; disseram que o executivo
    foi acionado extrajudicialmente pela instituição (o texto não identifica qual) e que está "à disposição das
    autoridades" para os esclarecimentos necessários. O texto original da nota não foi localizado; a nota chega
    pelo veículo.
