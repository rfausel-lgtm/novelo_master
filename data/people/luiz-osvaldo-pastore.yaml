open_questions:
- A conexão entre Pastore e Flávia Arruda/Peres é anterior em anos ao caso Master e ao casamento dela
  com Augusto Lima — tratada no corpus como correlação factual documentada de círculo social/político,
  não como evidência de qualquer conluio ou conhecimento prévio do esquema.
- Não localizado nenhum vínculo financeiro ou societário direto entre Pastore e o Banco Master, Daniel
  Vorcaro, ou demais figuras centrais do caso.
- Não localizado, em pesquisa dirigida, qualquer relação comercial ou societária dele (ou da Ibrame) com
  o Banco Master, com fundos/gestoras do ecossistema Master (Reag, CBSF, Trustee DTVM, Banvox) ou com
  a PKL One/Credcesta; nenhuma menção a ele no relatório de 218 páginas sobre o celular de Vorcaro nem
  em glossários de envolvidos no caso; nenhuma doação a Jaques Wagner ou Rui Costa; nenhum CDB ou aplicação
  pessoal no Master — resultados negativos documentados, não prova de inexistência.
