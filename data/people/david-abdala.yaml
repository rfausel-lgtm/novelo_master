summary: Diretor responsável pela administração fiduciária da Sefer Investimentos de 30/04/2019 a 22/11/2019.
  Em defesa apresentada ao PAS CVM, sustentou que o início da oferta questionada e as integralizações
  em ativos ocorreram antes de sua gestão, relatando cenário desorganizado, falta de acesso a documentos
  e tokens de contas dos fundos, e negando qualquer prática de ardil. Foi absolvido pela CVM em 08/09/2026,
  segundo a Agência Brasil.
why_in_novelo: É um dos três ex-diretores da Sefer absolvidos pela CVM por incompatibilidade cronológica
  com os fatos apurados no processo do Brazil Realty FII.
