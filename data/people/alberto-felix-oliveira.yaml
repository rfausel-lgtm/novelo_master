summary: Identificado na ata da Amprev como tesoureiro do Banco Master, participou com Paula Vouguinha
  da apresentação da instituição ao Comitê de Investimentos em 14/03/2024. Segundo a imprensa, seu cargo
  formal era o de superintendente executivo de Tesouraria — a ata da Amprev o registra como 'tesoureiro'.
  Foi preso em 18/11/2025, na Operação Compliance Zero, e permaneceu em silêncio em depoimento por videoconferência
  ao STF em 26/01/2026. Assina, em 08/04/2024, como representante legal do Banco Master, o termo de credenciamento
  da instituição na Alagoas Previdência — o espécime do documento que a auditoria federal descreve como
  replicado em outros regimes próprios. É a mesma pessoa que, um mês antes, apresentara o banco ao comitê
  de investimentos do Amapá. No INQ 5.026, sob o nome 'Alberto Felix de Oliveira Neto', por abril/2026 já
  cumpria prisão domiciliar com monitoramento eletrônico (não mais custódia fechada) — em 30/04/2026, obteve
  autorização excepcional do STF para viajar a Passos/MG e comparecer ao velório e sepultamento do pai,
  Gerson Felix de Oliveira. Em 12/06/2026, foi intimado a depor em Brasília no inquérito policial nº
  2025.0087917-SR/PF/DF, distinto e ainda não identificado no acervo.
why_in_novelo: Integrava a dupla que apresentou o Banco Master ao comitê que viria a aplicar R$ 400 milhões
  em suas letras financeiras.
