open_questions:
- 'Identidade entre ''Alberto Félix Oliveira'' (fonte: ata da Amprev) e ''Alberto Felix de Oliveira Neto''
  (fonte: decisões do INQ 5.026) tratada como a mesma pessoa, dado o contexto idêntico — tesoureiro do
  Master, preso em 18/11/2025 na Compliance Zero, silêncio em depoimento — mas sem confirmação por CPF.'
- Número do inquérito policial 2025.0087917-SR/PF/DF, em que figura como investigado, não identificado em
  nenhuma outra fonte do acervo.
- O corpus não registra o período em que ocupou a tesouraria do banco.
- A equipe não confirmou, no cadastro de administradores do Banco Central, se ele era diretor estatutário
  do Banco Master ou ocupava função executiva não estatutária.
