id: oliver-ortiz-de-zarate-martin
kind: person
name: Oliver Ortiz de Zarate Martin
category: other
role: Cidadão espanhol preso no Brasil em 2013; segundo o ICL Notícias, condenado por tráfico internacional
  e lavagem de dinheiro
positions: []
summary: 'Preso pela Polícia Federal em 27/06/2013, em cobertura na Barra da Tijuca (RJ), com apreensão
  de cerca de R$ 20 milhões em bens; segundo a PF à época, chefiava quadrilha espanhola ligada a cartéis
  colombianos. Segundo o ICL Notícias (09/03/2026), reproduzido pelo Cubo Jornalismo, foi condenado a
  16 anos de prisão por lavagem de dinheiro e tráfico internacional de drogas; só o ICL situa a condenação
  em dezembro de 2013 (fonte única para a data). A sentença e o número do processo não foram localizados
  pela equipe.
  Aparece no caso Master por uma via indireta e disputada: decisão da Justiça Federal do Rio, em ação
  de restituição de terrenos em Queimados, o descreve como cotista de fundos do Grupo Aquilla geridos
  por Benjamim Botelho de Almeida, e requerimento aprovado na CPI do Crime Organizado sustenta que ele
  constava como cotista de fundos da antiga Foco DTVM em registros da CVM de outubro de 2015. Nenhuma
  fonte localizada o liga pessoalmente a Daniel Vorcaro, e nenhuma investigação oficial incorporou a alegação
  de que recursos seus teriam financiado a compra do Banco Máxima. Procurado por reportagens do ICL Notícias
  em 2026, não respondeu.'
why_in_novelo: Citado, em alegação em disputa e em decisão judicial sobre terrenos, como cotista de fundos
  do grupo que administrava os veículos usados na aquisição do Banco Máxima.
