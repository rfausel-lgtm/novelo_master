  date: '2026-03-09'
  summary: 'Segundo o ICL Notícias (09/03/2026), foi procurado por e-mail e não respondeu. O Cubo Jornalismo
    repete a tentativa: “Benjamim Botelho foi procurado por email, assim como Oliver Ortiz. Nenhum dos
    dois enviou resposta.” A tentativa é do ICL; o Cubo não a corrobora de forma independente (o ICL registra
    que os advogados de Botelho enviaram nota após a publicação).'
