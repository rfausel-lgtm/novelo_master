open_questions:
- O teor exato das irregularidades que levaram ao termo de compromisso de 2021 da Cartos com o Banco Central
  não está disponível nos documentos lidos até agora.
- Se ele efetivamente criou o mecanismo de fabricação de créditos da Tirreno, ou apenas assumiu a direção de
  uma empresa já constituída por Daniel Moreira Bezerra, permanece em apuração — os documentos mostram
  assunção formal da direção, não a autoria do esquema em si.
