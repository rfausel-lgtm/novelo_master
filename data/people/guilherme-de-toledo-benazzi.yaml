summary: Figura como administrador da sociedade de advogados nos dois contratos firmados com o grupo de
  Daniel Vorcaro, lidos pela equipe nos autos da PET 16.662 — o de 16/01/2024, com o Banco Master, e o
  de 12/05/2025, com a Viking Participações. É também o nome que consta como autor nos metadados da minuta
  de contrato descrita no relatório da Polícia Federal sobre o celular de Vorcaro; segundo o próprio acervo
  (ev-metadados-da-minuta-de-contrato-barci), trata-se do nome da conta de usuário do editor de texto,
  e não de assinatura ou demonstração de autoria pessoal.
why_in_novelo: Assina, como administrador do escritório, os contratos de honorários que somam até cerca
  de R$ 181 milhões com o grupo investigado.
cited_position:
- kind: public_note
  by_id: barci-de-moraes-sociedade-de-advogados
  date: '2026-03-09'
  summary: 'Nota de esclarecimento do escritório, sem signatário individual, que não nomeia Guilherme
    Benazzi: contratado entre fevereiro de 2024 e novembro de 2025; 15 advogados e três escritórios terceirizados;
    94 reuniões de trabalho; 36 pareceres; segundo a nota, o escritório nunca conduziu causa do Banco Master
    no STF (nota reproduzida pelo Poder360).'
  source_ids:
  - src-poder360-2026-03-09-nota-barci
- kind: public_note
  by_id: barci-de-moraes-sociedade-de-advogados
  date: '2026-09-02'
  summary: 'Nova nota do escritório ao Poder360 (ver evt-2026-09-02-escritorio-confirma-edicao-do-contrato-por-moraes):
    segundo o escritório, o setor de compliance solicitou ao ministro Alexandre de Moraes informações sobre
    eventuais impedimentos legais à contratação, pelo Banco Master, dos serviços do escritório de sua mulher;
    segundo a nota, sem previsão de atuação no STF nem impedimento legal, o contrato foi assinado e os
    serviços prestados. A nota não o nomeia.'
