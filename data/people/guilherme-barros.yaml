role: Assessor de imprensa e consultor do Banco Master até 2025, segundo nota dele
summary: Consultor de comunicação. Em nota ao Metrópoles (16/10/2026), diz que prestou serviços de assessoria
  de imprensa ao Banco Master até 2025. Segundo o UOL (15/10/2026), levou Lilian Tahan a um café com Daniel
  Vorcaro em maio de 2024. Segundo o Metrópoles, mensagens dele com Vorcaro tratam de um perfil do banqueiro
  na Folha (agosto de 2024) e de um valor prometido por Vorcaro; a Folha diz que o pedido de visita feito por
  ele serviu para Vorcaro dar sua versão. Não há acusação formal contra ele.
why_in_novelo: Assessor de imprensa do Banco Master até 2025, segundo nota dele, citado em mensagens de Daniel
  Vorcaro publicadas pelo UOL e pelo Metrópoles.
