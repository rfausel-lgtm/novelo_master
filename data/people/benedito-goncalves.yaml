summary: >-
  Ministro do STJ e Corregedor Nacional de Justiça. Segundo o Poder360, com base em documentos encaminhados pela
  PF à CPMI do INSS, participou da degustação de uísque no George Club, em Londres, em 25/04/2024, evento pago por
  Vorcaro durante fórum patrocinado pelo Banco Master. Segundo o Jornal de Brasília (18/09/2026), mensagens do
  celular de Vorcaro registram trocas cordiais entre os dois em maio e julho de 2024. Segundo o Estadão Conteúdo
  (republicado pelo Money Times em 07/04/2026), apresentou pelo sistema eletrônico do STJ declaração de
  impedimento para julgar processos relacionados ao Master, e o tribunal juntou certidão de impedimento aos
  processos do banco em 31/03/2026, inclusive em recurso do Master sobre precatórios do setor sucroalcooleiro.
  Como corregedor nacional, assinou em 22/09/2026 a cautelar no PP 0007917-89.2026.2.00.0000 que mandou cancelar
  16 precatórios expedidos no âmbito do TRF-1 (R$ 4.738.065.026,73) e, em 28/09/2026, o aditamento que estendeu
  a medida a 14 requisições (R$ 1.877.143.674,66 nas datas-base); as duas decisões não
  mencionam o Banco Master nem Vorcaro e aguardam referendo do Plenário do CNJ. Segundo a Agência Brasil, o Times
  Brasil e A Crítica, determinou a correição extraordinária realizada em 24/09/2026 no gabinete do desembargador
  Newton Ramos, no TRF-1.
why_in_novelo: Ministro do STJ e Corregedor Nacional de Justiça que assinou em 22 e 28/09/2026 as decisões do CNJ sobre precatórios do TRF-1 e que, segundo a imprensa, esteve em evento em Londres pago por Vorcaro em 2024 e declarou-se impedido em processos do Master no STJ.
