open_questions:
- Segundo o Estadão Conteúdo (Money Times, 07/04/2026), o STJ juntou certidão de impedimento em 31/03/2026, inclusive em recurso do Master sobre precatórios do setor sucroalcooleiro; o sistema do STJ não foi consultado diretamente e a data da declaração não está confirmada.
- O Times Brasil (26/09/2026), citando coluna de Lauro Jardim (O Globo), relaciona o impedimento declarado no STJ às decisões tomadas como corregedor nacional; as decisões do CNJ de 22 e 28/09 não mencionam o Master, e o Novelo não localizou posição do ministro sobre o ponto.
