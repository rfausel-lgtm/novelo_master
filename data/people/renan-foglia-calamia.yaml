summary: CEO da consultoria Crédito e Mercado, antes chamada PAR Engenharia Financeira. Consta da ata da 140ª
  reunião do Comitê de Investimentos de Congonhas, de 07/05/2024, como o consultor financeiro que sugeriu a compra
  de cerca de R$ 14 milhões em letras financeiras com vencimento em dez anos, fixando como critério que se optasse
  por instituições no mínimo S3 e presentes na lista exaustiva da Secretaria de Previdência. Vinte dias depois a
  autarquia comprou do Banco Master, que não constava da lista. É alvo da apuração da PF sobre a atuação da
  consultoria junto ao Iprev de Maceió, segundo decisão que autorizou a operação de 10/08/2026, suspeito de
  'omitir alertas de segurança' para favorecer a aplicação de R$ 97 milhões do instituto no Master — segundo
  caso, além de Congonhas, em que ele aparece nominalmente. Em 19/01/2026, a Justiça Federal em São Paulo já o
  havia condenado a dois anos de prisão em regime aberto (convertidos em prestação de serviços comunitários e
  multa) por gestão temerária, em caso anterior e não relacionado ao Master — a recomendação, em 2017, de aplicação
  de R$ 1,5 milhão do mesmo Iprem de Santo Antônio de Posse — um dos sete institutos que a consultoria assessorou
  na compra de letras do Master — no fundo multimercado Horus Vetor, incompatível com as regras de RPPS. No mesmo
  julgamento foi absolvido de acusação de causar prejuízo de R$ 5,1 milhões ao instituto em outros investimentos.
why_in_novelo: É quem propõe a compra de letras financeiras na ata de um dos quatro regimes próprios em
  que a auditoria federal teria identificado pareceres idênticos.
cited_position:
- kind: denial
  summary: Por meio da consultoria, sustenta que a empresa não direcionou os aportes, nunca foi consultada
    sobre os investimentos no Master, e que sua participação se limitou a uma reunião remota de apresentação
    de cenário econômico.
