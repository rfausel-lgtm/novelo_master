summary: A decisão da Petição 16.229 registra que a compra formal de um apartamento do Poème Horto
  teria sido realizada pela Epítome S.A., representada por Luiz Antônio Lombardi. A descrição é da representação
  policial e não houve juízo de mérito.
why_in_novelo: É nomeado em decisão pública do STF como representante da empresa que teria feito a compra
  formal do imóvel examinado na 9ª fase.
