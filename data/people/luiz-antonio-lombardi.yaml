- kind: denial
  summary: Por meio de defesa, afirmou que não é proprietário da Epítome S.A. e que exerceu apenas a
    administração da empresa durante o período em que esteve vinculado a ela — contrapondo a versão da PF,
    que o aponta como "pessoa interposta" para ocultar os reais responsáveis pela operação.
