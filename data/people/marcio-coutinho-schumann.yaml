id: marcio-coutinho-schumann
kind: person
name: Marcio Coutinho Schumann
category: businessperson
role: Irmão de Roberto Coutinho Schumann; condenado pela CVM por prática não equitativa na negociação de
  cotas do CARE11
summary: 'Irmão de Roberto Coutinho Schumann, então diretor financeiro da Cortel. A CVM (PAS
  19957.013886/2022-02, voto de 25/11/2025) condenou-o a R$ 54.048,02 por prática não equitativa —
  reproduziu, em escala menor, a estratégia do irmão: negociou cotas do CARE11 entre fevereiro e maio de
  2022 (ganho de R$ 18.734,57), com posições que coincidiam em data e sentido com as ordens institucionais
  da Cortel, sem que houvesse prova direta de como recebeu a informação privilegiada — a condenação se
  apoiou em indícios múltiplos e convergentes: era a primeira vez que negociava cotas de fundo imobiliário,
  começou a comprar cerca de um mês antes de a Cortel operar e liquidou a posição no mesmo dia da máxima
  do ativo, coincidindo com o fim da atuação relevante da Cortel. Segundo O Fator (27/11/2025), o voto da
  relatora foi acompanhado por outros diretores da CVM.'
why_in_novelo: Foi condenado pela CVM por prática não equitativa ao negociar cotas do CARE11 em data e sentido
  coincidentes com as ordens da Cortel, no mesmo episódio em que a Cortel — ligada a Fabiano Zettel e ao Banco Master via CARE11 —
  comprava cotas do próprio fundo que a participa.
cited_position:
- kind: version
  date: '2025-11-24'
  summary: Posição dentro dos autos do PAS CVM 19957.013886/2022-02. Segundo o Relatório da Diretora Marina Copola
    (§§ 78 a 86), a defesa conjunta dele e do irmão sustentou que a acusação partia de premissas fáticas equivocadas;
    que a 'prática não equitativa' estaria sendo usada como substituto de insider trading sem tipificação para
    fundo imobiliário; que, ainda que fosse considerado insider secundário, não haveria evidência de ciência
    prévia; e que ele teria agido apenas como investidor pessoa física, atraído por notícias positivas sobre o
    fundo. O voto (§ 66) avalia como frágeis as justificativas econômicas apresentadas e reconhece a ausência de
    provas diretas de que ele tenha tido acesso às informações do irmão.
