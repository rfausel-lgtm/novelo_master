open_questions:
- O corpus não obteve o teor da decisão de 26/02/2026 (Petição 20501/2026 do INQ 5.026/DF) que o qualifica como
  investigado, apenas a menção feita em petição de terceiro (Belline Santana) que a cita como precedente.
- Não está estabelecido, em fonte primária, qual conduta especificamente lhe é atribuída no INQ 5.026/DF — apenas
  que figura como investigado.
