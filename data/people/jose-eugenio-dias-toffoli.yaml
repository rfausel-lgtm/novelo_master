role: Engenheiro eletricista; irmão do ministro Dias Toffoli; sócio da Maridt Participações
summary: Irmão do ministro do STF Dias Toffoli. Engenheiro eletricista, sócio, junto com o irmão José Carlos, da
  Maridt Serviços e Participações — empresa familiar já mapeada no acervo por deter participação, até 21/02/2025,
  no grupo do Resort Tayayá (PR), cujo negócio incluiu venda de participação ao fundo Arllen, ligado a Fabiano Zettel,
  cunhado de Daniel Vorcaro. Consta como investigado no Inquérito 5.026/DF — a apuração sobre a relação financeira
  entre o Banco Master e o BRB —, tendo obtido, em 26/02/2026, dispensa de comparecimento à CPI do Crime Organizado
  em razão dessa condição.
why_in_novelo: É irmão e sócio empresarial do ministro Dias Toffoli, e consta formalmente como investigado no mesmo
  inquérito (5.026/DF) cujo desdobramento levou o ministro a declarar suspeição no caso Master — conexão que o acervo
  registra como pista relevante, não como fato provado quanto à motivação da suspeição.
cited_position:
