open_questions:
- O teor exato das irregularidades que levaram ao termo de compromisso de 2021 da Cartos com o Banco Central
  não está disponível nos documentos lidos até agora.
- 'PARCIALMENTE ESCLARECIDO (lote 238): a decisão de 22/06/2026 na PET 15.478 confirma vínculo operacional
  direto dele com a Tirreno (antedatação de ata, presença na assinatura dos contratos, reuniões no BRB) —
  mas não confirma nem refuta especificamente que ele a tenha "criado", questão que segue em aberto.'
