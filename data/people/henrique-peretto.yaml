summary: 'Fundou a Cartos SCD em 03/11/2014 e segue como seu representante formal perante o Banco Central
  em janelas sucessivas até pelo menos 2025. Firmou termo de compromisso com o Banco Central em 2021 (Decisão
  158/2021-BCB/DEGEF), ao lado de André Seixas Maia, Yim Kyu Lee e da própria Cartos — teor exato das
  irregularidades ainda não localizado nos documentos lidos. Segundo o Poder360, Daniel Vorcaro atribuiu
  publicamente a criação da Tirreno a Peretto — versão que a reportagem, com base em documentos societários,
  considera falsa (a criação é atribuída a Daniel Moreira Bezerra, sob o nome original ''SX 016'', com Seixas
  Maia assumindo a direção depois da renomeação). É investigado formal no INQ 5.026: pediu adiamento de
  oitiva agendada para 26/01/2026 por conflito de agenda com audiência em processo distinto (10ª Vara
  Criminal de São Paulo), e renunciou a procuradores em novembro de 2025. ACHADO NOVO (lote 238) — a
  decisão de 22/06/2026 na PET 15.478 muda sua caracterização de figura periférica para partícipe
  operacional direto do aparato documental da Tirreno, independente da disputa sobre quem a "criou": a
  autoridade policial afirma que ele tinha ciência irrestrita dos termos espúrios da empresa, acompanhou
  André Seixas Maia durante longa permanência no Banco Master no dia da assinatura dos contratos, e
  compareceu a reuniões no BRB ao lado de Augusto Lima e Paulo Henrique Costa — elo até então ausente do
  acervo, que só o ligava à Cartos. A mesma decisão narra que ele encaminhou a Seixas Maia, em 17/04/2025,
  uma ata de assembleia extraordinária da Tirreno supostamente de 02/12/2024, dois dias depois de a
  empresa ter sido formalmente registrada na JUCESP em 15/04/2025 — indício, segundo a autoridade
  policial, de documento fabricado a posteriori. ACHADO (lote 260): segundo a PF, repassava a Vorcaro as
  requisições do Banco Central à Cartos no dia em que eram assinadas e submetia a ele as respostas, e o celular dele
  mostra um FIDC de R$ 31,44 milhões que dizia reservado ao aumento de capital da Tirreno.'
why_in_novelo: É apontado por Daniel Vorcaro como o criador da Tirreno — atribuição que o Poder360 considera
  falsa, mas que o torna, de qualquer forma, uma das figuras centrais na disputa sobre a origem da empresa
  usada para vender créditos fabricados ao BRB.
