role: Irmã de Daniel Vorcaro; vice-presidente da holding Sozo Real Estate
positions: []
summary: Irmã de Daniel Vorcaro. Apontada como vice-presidente da holding Sozo Real Estate, usada segundo
  a EFB (liquidante do Banco Master) para deter a titularidade da mansão de Windermere (Orlando/FL). Foi
  incluída, em 23/03/2026, na decisão que ampliou o bloqueio patrimonial contra a família Vorcaro, e é
  ré, ao lado do pai Henrique Vorcaro, em ação civil movida pela EFB nos Estados Unidos por dissipação
  de mais de US$ 1 bilhão em ativos do banco.
why_in_novelo: Alvo do bloqueio patrimonial brasileiro e de ação civil nos EUA movida pelo liquidante
  do Banco Master, por suposta participação na ocultação de bens da família Vorcaro.
