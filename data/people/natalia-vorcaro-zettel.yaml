id: natalia-vorcaro-zettel
kind: person
name: Natália Vorcaro Zettel
category: businessperson
role: Irmã de Daniel Vorcaro; vice-presidente da holding Sozo Real Estate
positions: []
summary: 'Irmã de Daniel Vorcaro. Apontada como vice-presidente da holding Sozo Real Estate, usada segundo
  a EFB (liquidante do Banco Master) para deter a titularidade da mansão de Windermere (Orlando/FL). Foi
  incluída, em 23/03/2026, na decisão que ampliou o bloqueio patrimonial contra a família Vorcaro, e é
  ré, ao lado do pai Henrique Vorcaro, em ação civil movida pela EFB nos Estados Unidos por dissipação
  de mais de US$ 1 bilhão em ativos do banco. Casou-se com o advogado Fabiano Campos Zettel em 2018; consta
  como diretora da Rogue Participações desde 24/03/2014, sociedade em que o marido é presidente. Registro
  adicional: a ação civil da EFB nos Estados Unidos pede US$ 113,6 milhões — a cifra de mais de US$ 1
  bilhão citada nas reportagens refere-se à dissipação total alegada, não ao valor do pedido. Reportagem
  da Folha de 07/03/2026, baseada em documentos da PF, nomeia-a como uma das destinatárias do mecanismo
  de desvio de recursos do Master via CDBs e fundos cativos, ao lado do pai Henrique e do primo Felipe
  Cançado Vorcaro. Deu à luz gêmeos (Samuel e Sarah) em 08/04/2026, com gravidez de risco pré-existente;
  teve complicações graves no pós-parto (síndrome HELLP, com reinternação, e agravamento de quadro
  psiquiátrico preexistente), citadas por seu marido, Fabiano Zettel, em pedido de prisão domiciliar.
  ACHADO NOVO (lote 236): a decisão de 19/06/2026 na PET 15.693 cita elementos da IPJ nº 2293065/2026,
  segundo os quais ela teria assumido o papel de operadora financeira do núcleo "A Turma" após a prisão
  do marido em 04/03/2026 — alegação da autoridade policial, sem denúncia ou decisão de mérito contra ela
  até esta data.'
why_in_novelo: Alvo do bloqueio patrimonial brasileiro e de ação civil nos EUA movida pelo liquidante
  do Banco Master, por suposta participação na ocultação de bens da família Vorcaro.
