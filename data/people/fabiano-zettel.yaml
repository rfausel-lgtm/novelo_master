- kind: no_response
  summary: Sobre os R$ 485 milhões recebidos da Super Empreendimentos e sobre o aporte de R$ 48,5 milhões
    na forma de AFAC, procurada, a defesa não se manifestou. Não foi localizada nenhuma declaração do
    próprio Zettel, em nome próprio, em qualquer momento — nem negativa específica quanto aos pagamentos
    a Belline Santana, nem quanto à acusação de ter atuado como interposta pessoa nas doações eleitorais.
  source_ids:
