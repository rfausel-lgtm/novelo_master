open_questions:
- Está preso preventivamente há seis meses sem que tenha sido localizada denúncia formal da PGR, recebimento
  de denúncia ou ação penal — o caso segue em inquérito, com relatório da PF previsto para o fim de setembro
  de 2026. Não foram localizados habeas corpus em seu favor nem arguição de excesso de prazo.
- Gilmar Mendes determinou, no voto de referendo, que a substituição da preventiva por domiciliar 'deve
  ser reavaliada' assim que concluídas as diligências, por ele ter filho de tenra idade e gêmeos por nascer
  em gravidez de risco (art. 318, III, do CPP). Nenhuma decisão que aprecie essa reavaliação foi localizada.
- Sua proposta de colaboração premiada caminhou para rejeição por PF e PGR em junho de 2026, por falta
  de elementos novos — embora a PF tenha chegado a considerá-la potencialmente mais valiosa que a do próprio
  Vorcaro. Não há homologação nem rejeição formal publicada.
- 'Trocou de defesa em 25/03/2026: os advogados anteriores saíram alegando motivos de foro íntimo, após
  divergência sobre a possibilidade de delação; assumiu Celso Vilardi, em coordenação com o defensor de
  Vorcaro.'
- A tese da defesa de que as doações de 2022 respeitaram o limite de 10% da renda bruta exigiria rendimento
  declarado de cerca de R$ 50 milhões em 2021 — em tensão com a renda mensal de R$ 66 mil apontada pelo
  Coaf no mesmo período. A declaração de rendimentos de 2021 não foi localizada, e nenhuma apuração eleitoral
  sobre sua capacidade financeira para essas doações foi identificada.
- Não foi localizada nenhuma fonte que descreva como ele conheceu a família Vorcaro, nem vínculo profissional
  anterior ao casamento de 2018 — a origem do relacionamento permanece desconhecida.
- Abriu a SL 18 Participação Ltda em 22/02/2026, dez dias antes da prisão preventiva, como sócio administrador
  único e em endereço distinto do das demais empresas do grupo. Nenhuma cobertura jornalística sobre essa
  empresa foi localizada, e sua finalidade é desconhecida.
- 'Nunca depôs em comissão parlamentar: foi desobrigado por Mendonça de comparecer à CPI do Crime Organizado
  e foi preso no dia em que deporia à CPMI do INSS, que se encerrou sem relatório final.'
- 'Registros da Receita mostram que ele saiu formalmente da diretoria da Super Empreendimentos em julho
  de 2024, mas a sobreposição de administradores permaneceu: Ana Cláudia Queiroz de Paiva é diretora da
  Super e também de três empresas dele (Adonay, Storm e REN).'
