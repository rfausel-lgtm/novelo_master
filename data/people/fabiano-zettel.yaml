id: fabiano-zettel
kind: person
name: Fabiano Zettel
category: businessperson
role: Advogado e empresário; descrito pelo STF como cunhado de Daniel Vorcaro e apontado pela PF como
  seu operador financeiro; preso preventivamente desde 04/03/2026
summary: 'Advogado e empresário mineiro, casado desde 2018 com Natália Bueno Vorcaro, irmã do banqueiro.
  Antes do Banco Master teve carreira de advogado empresarial e imobiliário — graduado pela Faculdade
  de Direito Milton Campos, mestre pela UFMG, professor em instituições mineiras e advogado com atuação
  de massa, tendo a MRV Engenharia como principal cliente. Criou a Moriah Asset, gestora de private equity
  de saúde e bem-estar (Oakberry, Desinchá, Les Cinq Gym), e é pastor da Igreja Batista da Lagoinha, afastado
  das funções pastorais desde novembro de 2025. A decisão de prisão preventiva na PET 15.556, assinada
  em 03/03/2026 e lida integralmente pela equipe, dedica-lhe seção própria: descreve-o como participante
  da ''estrutura operacional responsável pela execução e viabilização financeira'' das iniciativas do
  grupo, atuando na ''intermediação e operacionalização de pagamentos'' e na estruturação de ''instrumentos
  contratuais utilizados para justificar tais repasses''; a PF o qualifica como ''operador financeiro
  e cunhado'' de Vorcaro. Três frentes específicas lhe são atribuídas na decisão: a elaboração da proposta
  de contratação fictícia, via Varajo Consultoria, para remunerar o servidor do Banco Central Belline
  Santana; a operacionalização do pagamento mensal de R$ 1 milhão ao grupo ''A Turma'', descrito como
  estrutura de monitoramento e de coação e intimidação de concorrentes, ex-empregados e jornalistas; e
  o acompanhamento dos fluxos financeiros do grupo. Foi preso duas vezes: temporariamente em 14/01/2026,
  quando embarcava para o exterior no aeroporto de Guarulhos, e solto no mesmo dia por decisão de Dias
  Toffoli; e preventivamente em 04/03/2026, permanecendo desde 05/03/2026 na Penitenciária 2 de Potim
  (SP). Registro do TSE confirma que foi o 6º maior doador da eleição de 2022, com R$ 5,01 milhões — R$
  3 milhões a Jair Bolsonaro, R$ 2 milhões a Tarcísio de Freitas e R$ 10 mil a um candidato a deputado
  pelo Novo em Minas. Seu patrimônio declarado passou de R$ 67,5 milhões (2021) para R$ 204,3 milhões
  (2024), e relatório do Coaf aponta R$ 99,4 milhões movimentados em sete meses contra renda mensal declarada
  de R$ 66 mil.'
why_in_novelo: É apontado pela Polícia Federal e pela decisão do STF que decretou sua prisão como o operador
  financeiro de Daniel Vorcaro — o nó que liga, numa só pessoa, o dinheiro que saiu do banco, os pagamentos
  a um servidor do Banco Central, o custeio do grupo de intimidação e o financiamento eleitoral de 2022.
cited_position:
- kind: denial
  summary: Antes da prisão, seus advogados afirmaram que ele 'tem atividades empresariais conhecidas e
    lícitas, sem relação alguma com a gestão do Banco Master'.
