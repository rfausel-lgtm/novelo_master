  summary: Ao se entregar à Polícia Federal, sua defesa declarou que ele 'já se apresentou à Polícia Federal'
    e que, 'em que pese não ter tido acesso ao objeto das investigações, Fabiano está à inteira disposição
    das autoridades'.
