  summary: Em petição ao STF, a defesa sustentou 'o não preenchimento dos requisitos para a sua segregação
    cautelar' e pediu prisão domiciliar por razões humanitárias — filho de dois anos e gêmeos por nascer,
    em gravidez de risco. Gilmar Mendes considerou a tese 'relevante', mas referendou a prisão 'por ora'.
  source_ids:
