summary: 'CARGO CONFIRMADO (lote 171): a representação da PF de 27/02/2026 na PET 15.556 — assinada pela
  Coordenação de Inquéritos nos Tribunais Superiores (CINQ/CGRC/DICOR/PF) — o identifica nominalmente como
  Diretor de Investigação e Combate ao Crime Organizado e à Corrupção, participante de reunião reservada
  com o Banco Central em 17/10/2025 sobre o caso Master, cujos nomes Daniel Vorcaro obteve de forma
  irregular. Achado anterior, de menor confiança: a newsletter ''A Investigação'' (David Ágape) também
  associa seu nome a uma diretoria da PF identificada pela sigla ''UADIP/CINQ/CGRC/DICOR'', presente no
  rodapé de dois documentos anônimos relacionados ao dossiê usado contra André Mendonça na crise institucional
  do STF — essa segunda alegação segue sem confirmação em documento primário nem em outra fonte.'
why_in_novelo: É o diretor da PF cujos nomes, junto aos de outros participantes de uma reunião reservada
  com o Banco Central sobre o caso Master, Daniel Vorcaro obteve de forma irregular dois dias antes da
  Operação Compliance Zero — e é também o nome que uma reportagem de fonte única associa, sem confirmação
  independente, à possível cadeia institucional de origem do dossiê anônimo na crise Moraes-Mendonça.
