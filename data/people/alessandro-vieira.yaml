summary: Relator da CPI do Crime Organizado. Seu relatório final, que pedia o indiciamento por crimes
  de responsabilidade de Toffoli, Moraes, Gilmar Mendes e Gonet, foi rejeitado por 6 a 4 em 14/04/2026.
  No mesmo dia, Gilmar Mendes acionou a PGR pedindo a investigação dele por suposto abuso de autoridade,
  em razão das conclusões do relatório contra o próprio ministro. Coautor da PEC 65/2023. Em 15/09/2026
  impetrou no STF o Mandado de Segurança 41.085 contra o Presidente do Senado, para obter a instalação de CPI
  sobre o caso Master requerida em 09/03; o relator, Cristiano Zanin, indeferiu a liminar em 22/09/2026, e ele
  pediu reconsideração em 25/09 e interpôs agravo regimental em 29/09, segundo o portal do STF.
why_in_novelo: Relatou a CPI do Crime Organizado, cujo relatório sobre o caso Master foi rejeitado, e
  é coautor da PEC 65/2023.
cited_position:
- kind: clarification
  summary: 'Ao pedido de investigação de Gilmar Mendes na PGR, respondeu que reagiria "com absoluta
    tranquilidade" e que "ameaças e tentativas de constrangimento não vão mudar o curso da história" —
    sustentando estar protegido por imunidade parlamentar, já que avaliação jurídica em voto de CPI não
    configura abuso de autoridade.'
