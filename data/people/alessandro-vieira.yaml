  summary: 'Ao pedido de investigação de Gilmar Mendes na PGR, respondeu que reagiria "com absoluta
    tranquilidade" e que "ameaças e tentativas de constrangimento não vão mudar o curso da história" —
    sustentando estar protegido por imunidade parlamentar, já que avaliação jurídica em voto de CPI não
    configura abuso de autoridade.'
