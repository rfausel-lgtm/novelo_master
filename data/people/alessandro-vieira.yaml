summary: Relator da CPI do Crime Organizado. Seu relatório final, que pedia o indiciamento por crimes
  de responsabilidade de Toffoli, Moraes, Gilmar Mendes e Gonet, foi rejeitado por 6 a 4 em 14/04/2026.
  No mesmo dia, Gilmar Mendes acionou a PGR pedindo a investigação dele por suposto abuso de autoridade,
  em razão das conclusões do relatório contra o próprio ministro. Coautor da PEC 65/2023.
why_in_novelo: Relatou a CPI do Crime Organizado, cujo relatório sobre o caso Master foi rejeitado, e
  é coautor da PEC 65/2023.
