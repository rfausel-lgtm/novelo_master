open_questions:
- 'NOVO (lote 180): em relato verbal à Corregedoria-Geral do BC em 07/01/2026 — antes de qualquer
  repercussão pública —, admitiu ter vendido, em janeiro de 2020, por R$ 4,5 milhões, um sítio em
  Guaxupé/MG (que planejava lotear) a um comprador que só descobriu, um ano depois, na escritura, ser
  Fabiano Campos Zettel; recebeu o valor em cinco parcelas em conta conjunta com o irmão, que depois
  passou a arrendar a mesma terra de Zettel para lavoura de café. Não está estabelecido se essa venda é
  a mesma já registrada abaixo (fazenda de café, R$ 3 milhões, 2021, a fundo ligado a Zettel) descrita de
  forma diferente, ou uma segunda operação distinta — datas, valores, tipo de comprador (pessoa física vs.
  fundo) e natureza do imóvel divergem o suficiente para não presumir identidade.'
- 'As fontes divergem sobre o período em que dirigiu a área de Fiscalização: 2017-2023 em alguns veículos,
  2019-2023 em outros.'
- Responde a processo administrativo disciplinar aberto pela CGU em 23/03/2026 e prorrogado em 23/07/2026,
  sem desfecho localizado — nem demissão, nem cassação de aposentadoria, nem absolvição administrativa.
- 'Não foi localizada denúncia formal da PGR contra ele, nem qualquer negociação de colaboração premiada.
  Ele nunca foi preso: cumpre medidas cautelares desde março de 2026. Registro de imprecisão: ao menos
  um veículo publicou manchete afirmando que o ex-diretor estaria preso, enquanto o próprio corpo da matéria
  informa o contrário.'
- 'Vorcaro nega tê-lo remunerado: ''O Paulo Sérgio nunca fez trabalho para mim, nenhum membro do Banco
  Central'' — embora admita ter oferecido o serviço de concierge como ''um agrado''.'
