id: paulo-sergio-neves-de-souza
name: Paulo Sérgio Neves de Souza
category: public_official
aliases:
- Paulo Sérgio Neves de Sousa
role: Diretor de Fiscalização do Banco Central (até 2023) e, a partir de outubro de 2023, chefe-adjunto
  do Departamento de Supervisão Bancária
summary: 'Servidor de carreira do Banco Central. Segundo o Valor Econômico, afirmou na reunião de diretoria
  de outubro de 2019 que eventuais problemas de conduta do pretendente ao controle do Máxima poderiam
  ser coibidos pela supervisão. Em março de 2026 foi alvo de busca e apreensão na Operação Compliance
  Zero e passou a cumprir medidas cautelares determinadas pelo STF, entre elas monitoramento eletrônico;
  a Polícia Federal o considera suspeito de ter usado influência no Banco Central em favor de Daniel Vorcaro.
  Já estava afastado no âmbito de apuração interna da própria autarquia. CORREÇÃO DE TRAJETÓRIA (09/09/2026):
  ele não deixou o Banco Central em 2023. Servidor de carreira desde 1998, deixou a diretoria de Fiscalização
  e, em outubro de 2023, voltou a cargo de chefia como chefe-adjunto do Departamento de Supervisão Bancária
  — passando a atuar subordinado a Belline Santana, no departamento que supervisionava o Banco Master.
  Não há, portanto, ''porta giratória'' entre regulador e regulado no caso dele: a cooptação alegada teria
  ocorrido com ele dentro da autarquia o tempo todo. A apuração lhe atribui atos de ofício concretos:
  o envio a Vorcaro, um dia depois de apresentada, da emenda que elevava a cobertura do FGC de R$ 250
  mil para R$ 1 milhão; parecer favorável à aquisição do Master pelo BRB sem responder questões de outro
  departamento; e estudo sobre carteiras de crédito que levou a diretoria à convicção de que não havia
  motivo para preocupação. A sindicância patrimonial aponta ainda a venda de uma fazenda de café por R$
  3 milhões em 2021 a fundo ligado a Fabiano Zettel, serviço de concierge de luxo em Orlando custeado
  por Vorcaro, e aquisições de cerca de R$ 915 mil, entre elas um terreno pago com R$ 210 mil em dinheiro
  vivo.'
why_in_novelo: Dirigiu a área de fiscalização do Banco Central no período de supervisão do banco e é alvo
  de medidas cautelares determinadas pelo STF na investigação.
