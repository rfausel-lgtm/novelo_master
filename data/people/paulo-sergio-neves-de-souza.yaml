  summary: Sobre a suspeita de manipulação de dados internos, sua defesa afirma que 'nunca houve manipulação',
    que ele jamais foi indagado pela cúpula do Banco Central sobre a atuação do Master, e que 'diversas
    equipes' interagem com as informações, sendo que 'todo processo é documentado, não sendo passível
    de manipulação por uma única pessoa'. Em outras reportagens — sobre a venda da fazenda e sobre o serviço
    de concierge custeado por Vorcaro — a defesa não se manifestou, e os veículos registraram o espaço
    aberto.
