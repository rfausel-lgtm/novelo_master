id: paulo-sergio-neves-de-souza
kind: person
name: Paulo Sérgio Neves de Souza
category: public_official
role: Ex-diretor de Fiscalização do Banco Central do Brasil (2019-2023)
positions: []
summary: 'Servidor de carreira do Banco Central desde 1998 (inspetor, supervisor, gerente técnico, chefe
  de divisão na Desup, consultor, chefe de gestão estratégica, chefe da Desup e diretor de Fiscalização/Supervisão
  entre 2019 e 2023). Segundo a decisão do ministro André Mendonça na PET 15556 e apuração da PF, teria
  atuado como consultor informal de Daniel Vorcaro: revisava documentos do Banco Master antes do envio
  ao Banco Central, alertava sobre achados do sistema de monitoramento e orientava Vorcaro sobre postura
  e argumentos para reuniões com a diretoria do BC. Em contrapartida, teria recebido vantagens por meio
  de contrato fictício de consultoria com a empresa Varajo Consultoria Empresarial e uma viagem à Disney/Universal,
  em Orlando. Recebeu medidas cautelares em 04/03/2026: tornozeleira eletrônica, proibição de contato
  com testemunhas, proibição de acesso ao Banco Central, restrição de viagem, entrega de passaporte em
  48 horas e suspensão da função pública. Não houve prisão preventiva.'
why_in_novelo: Ex-diretor do Banco Central apontado, na decisão do STF que decretou a prisão preventiva
  de Vorcaro, como alvo de medidas cautelares por suposta prestação de consultoria informal ao Banco Master
  em troca de vantagens indevidas.
