role: Ex-prefeito de Salvador (União Brasil); nome civil Antonio Carlos Peixoto de Magalhães Neto
positions: []
summary: 'Ex-prefeito de Salvador (2017-2024), neto do falecido senador Antônio Carlos Magalhães, figura de peso
  do União Brasil. Recebeu pagamentos do Banco Master não por escritório de advocacia, mas por uma empresa de consultoria
  em gestão — a A&M Consultoria Ltda, da qual é sócio-administrador. Os valores divergem entre
  fontes: R$ 5,4 milhões entre 2023 e 2025, segundo declaração do próprio ACM Neto; R$ 3,6 milhões combinando Master
  e Reag Investimentos até maio de 2024, segundo relatório do Coaf citado pelo Correio Braziliense — divergência
  não reconciliada. Segundo a proposta de delação de João Carlos Mansur (26/08/2026), é cotista exclusivo do fundo
  Seattle 95, que aplicou R$ 7,92 milhões em fundos ligados ao Master, com ganho de R$ 4,01 milhões — ele confirma
  a condição de cotista, mas afirma que são ''recursos próprios de origem declarada e lícita''. Em 10/09/2026, o
  UOL publicou uma terceira proposta de colaboração de Vorcaro — ainda não aceita pelas autoridades — atribuindo
  a ele, junto com Antônio Rueda, a intermediação de aportes de institutos de previdência do Rio, do Amapá e do
  Amazonas, e da Cedae, no Master, mediante comissão de 10% (ou 1% ao ano). ACM Neto classificou as insinuações
  como falsas. Em 16/10/2026, o UOL publicou mensagens extraídas pela PF do celular de Vorcaro que, segundo o
  veículo, registram encontros dele e de Antônio Rueda com Vorcaro em 2024; o UOL ressalva que as mensagens não
  mostram pagamento de comissão a ele, e ACM Neto diz que os vazamentos são seletivos e fora de contexto.
  Candidato ao governo da Bahia pelo União Brasil em 2026, não foi eleito: teve 3.625.227 votos (43,72% dos
  válidos) no 1º turno de 04/10/2026, segundo o TSE (arquivo oficial de resultados de Governador da Bahia,
  eleição 6259).'
why_in_novelo: Sócio-administrador da A&M Consultoria, que recebeu pagamentos do Banco Master entre 2023 e 2025,
  segundo declaração do próprio ACM Neto, e citado pela terceira proposta de colaboração de Vorcaro, que ele nega.
