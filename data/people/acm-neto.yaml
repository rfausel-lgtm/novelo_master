open_questions:
- A nova acusação de comissão de 10% não especifica ato concreto praticado por ele em nenhum dos quatro institutos
  citados; a proposta soma R$ 2 bilhões captados por essa via, quando os quatro entes juntos investiram R$ 3,62
  bilhões no banco — diferença não explicada por Vorcaro nem pela imprensa.
- 'Mensagens de 16/10/2026 (UOL): descrevem encontros com Vorcaro em setembro e outubro de 2024 sem indicar o
  assunto; o UOL não informa a Pet, o relatório ou a decisão de origem, e diz que a PF pediu buscas em endereços
  ligados a ele e a Rueda sem autorização do STF (decisão não localizada pelo Novelo).'
- 'Segundo o UOL (16/10/2026), o Master atribui a ele a inclusão do banco em uma lista do Ministério da
  Previdência; na nota, ele nega ter tido participação no governo federal e na inclusão do Master na "lista
  exaustiva" de instituições elegíveis para receber recursos de RPPS. Não registrado como fato: o acervo
  documenta (D) que o Master não constava da Lista Exaustiva de 06/05/2024 e só entrou nela em 11/04/2025
  (ev-master-nao-estava-na-lista-exaustiva-em-maio-de-2024, ev-master-so-entrou-na-lista-exaustiva-em-abril-de-2025);
  a reportagem de 16/10 não data a inclusão, e falta verificar de que lista e de que data trata a reportagem do
  UOL de 12/10.'
- 'Cargo e resultado eleitoral de 2026 não atualizados neste verbete; ficam para registro com fonte oficial (TSE).'
