summary: Sócio-administrador da Monteiro Sociedade de Advogados, banca de mercado de capitais reconhecida
  em rankings do setor. Preso em 16/04/2026, acusado pela PGR de ter operado 'compliance paralelo' do
  Banco Master fora dos canais internos de controle, e de estruturar empresas de fachada para ocultar
  imóveis de luxo repassados ao ex-presidente do BRB, Paulo Henrique Costa. A PGR estima vantagem econômica
  pessoal dele em cerca de R$ 86,1 milhões; o Master declarou à Receita R$ 109 milhões em pagamentos a
  empresas de que é sócio.
why_in_novelo: É o único advogado da rede de fornecedores jurídicos do Master preso e formalmente acusado
  de operar esquema de propina, e não apenas de prestar serviço jurídico questionável.
cited_position:
- kind: denial
  summary: Nega ilegalidade, afirma que a criação de empresas e fundos é atividade regular da advocacia,
    que o uso indevido por clientes não pode ser automaticamente atribuído ao advogado sem provas, e destaca
    trajetória 'estritamente técnica'.
  source_ids:
  - src-cnn-2026-04-18-defesa-monteiro-nega
  by_id: daniel-lopes-monteiro
  date: '2026-04-18'
open_questions:
- 'NOVO (13/09/2026): a decisão de 15/04/2026 nomeia mais dois alvos ligados a ele — o cunhado Hamilton Suaki,
  colocado como diretor da empresa de fachada Allora S.A. (endereço coincidente ao do escritório Monteiro
  Rusu), e a advogada Thaísa Menzato, apontada como participante qualificada do mesmo esquema. Indica ainda
  um indício de repasse de R$ 86 milhões a ele relacionado a tratativas do BRB, encontrado em documento
  apreendido na residência de Daniel Vorcaro — sem confirmação de que esse valor é o mesmo já citado (R$ 86,1
  milhões) ou um achado distinto.'
