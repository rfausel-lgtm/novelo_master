summary: Segundo o Poder360, com base em registros da Receita enviados à CPI do Crime Organizado, o escritório
  de advocacia de Temer recebeu R$ 10 milhões do Banco Master em 2025, em dois pagamentos. Os citados
  na reportagem afirmam que os valores correspondem a serviços prestados.
why_in_novelo: Seu escritório consta, segundo registros fiscais divulgados pela imprensa, entre os destinatários
  de pagamentos do Banco Master.
