id: daniel-penido-de-britto
kind: person
name: Daniel Penido de Britto
category: police
role: Delegado da Polícia Federal (DELECOR/DRPJ/SR/PF/SP), autoridade responsável pelo caso Banco Master
  em São Paulo
summary: Assinou, em 26/05/2025, a portaria que instaurou o Inquérito Policial n. 5004641-31.2025.4.03.6181
  a partir de denúncia-crime anônima recebida por e-mail institucional da PF ("INFORMAÇÕES BANCO MASTER"),
  e a representação subsequente pelo Pedido de Prisão Preventiva n. 5009071-26.2025.4.03.6181 contra
  Daniel Vorcaro. Segue como autoridade policial responsável pelo caso na fase de execução das medidas
  cautelares deferidas pelo STF em janeiro de 2026, subscrevendo representações sobre buscas e apreensões
  complementares.
why_in_novelo: É o delegado que instaurou a linha investigativa paulista sobre o Banco Master — anterior e
  formalmente distinta, segundo o próprio Ministério Público Federal, da Operação Compliance Zero — e que
  segue conduzindo diligências na fase cautelar já sob supervisão do STF.
cited_position:
- kind: not_located
  summary: Atuou em capacidade estritamente policial, subscrevendo portaria e representações oficiais;
    nenhuma declaração pública dele à imprensa foi localizada.
