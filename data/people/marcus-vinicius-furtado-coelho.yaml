summary: Advogado brasiliense, presidiu o Conselho Federal da OAB entre 2013 e 2016. Seu escritório, Marcus
  Vinicius Furtado Coelho Advocacia (CNPJ 15.478.361/0001-15, aberto em 2012, Brasília/DF), recebeu R$
  27,5 milhões do Banco Master em 2025 — o segundo maior valor pago a qualquer escritório naquele ano,
  atrás apenas do de Viviane Barci de Moraes.
why_in_novelo: Recebeu, por meio de seu escritório, um dos maiores valores pagos pelo Banco Master a qualquer
  prestador de serviços jurídicos em 2025, segundo dados da Receita Federal enviados à CPI do Crime Organizado.
