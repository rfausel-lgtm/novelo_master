summary: Sócio-administrador da MSMG Patrimonial Ltda., empresa de Lauro de Freitas (BA) que comprou de Jaques Wagner
  o apartamento nº 1302 do condomínio Mansão Victory Tower, em Salvador, por R$ 10 milhões, e teve o registro da
  compra barrado pela indisponibilidade cadastrada na PET 16.230. Assinou, em nome da empresa, o compromisso de
  compra e venda de 23/12/2025 e a petição de terceira adquirente de boa-fé.
