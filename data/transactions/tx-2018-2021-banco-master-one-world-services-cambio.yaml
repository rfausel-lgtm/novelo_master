description: Remessas realizadas entre dezembro de 2018 e abril de 2021, quando a instituição ainda se
  chamava Banco Máxima. Segundo a Polícia Federal, foram 331 operações justificadas como aumento de capital
  de uma offshore da empresa em Miami, e apenas 15 das atas societárias exigidas pela regra da época foram
  apresentadas. O banco afirmou que o tema foi objeto de acordo com o Banco Central encerrado na esfera
  administrativa, sem reconhecimento de irregularidade.
