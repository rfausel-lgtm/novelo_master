date_precision: day
source_ids:
- src-stf-inq5026-despacho-12-02-2026-toffoli-integra-aparelhos-ao-stf
summary: 'Para cumprir a Súmula Vinculante 14 diante de pedidos de defesas, determina à Polícia Federal que
  encaminhe imediatamente ao STF (i) na íntegra, o conteúdo dos aparelhos e mídias apreendidos, (ii) os laudos
  periciais sobre esse material, incluindo dados telemáticos, informáticos e telefônicos, e (iii) outros
  elementos de prova já documentados e ainda não juntados ao inquérito.'
