summary: 'Decisão de 20 páginas que acolhe a representação da PF e o parecer da PGR: suspende João Cláudio Nabas
  do cargo de Perito Criminal Federal, defere busca e apreensão domiciliar, pessoal, profissional e veicular,
  proíbe contato com servidores da PF e afasta o sigilo telemático de sua conta Google, com base em indícios de
  que ele acessou o laudo pericial do celular de Vorcaro, criou os arquivos "Moraes.pdf" e "Toffoli e esposa.pdf",
  e os repassou à jornalista Malu Gaspar por meio da delegada que presidia a investigação.'
