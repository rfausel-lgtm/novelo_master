summary: 'Moraes informa a Fachin que a Pet 15.645 — distribuída por prevenção a André Mendonça — não teve
  o sigilo levantado apesar da ordem de 11/09/2026, e que ela contém "elementos essenciais para o julgamento
  da PET 16662", marcado para 15/09/2026. Pede que Fachin determine o levantamento do sigilo e a
  disponibilização dos autos a todo o colegiado antes do julgamento.'
