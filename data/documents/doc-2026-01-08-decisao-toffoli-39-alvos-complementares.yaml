summary: 'Toffoli defere parcialmente pedido complementar de busca e apreensão contra 39 alvos (34 pessoas
  físicas e 5 pessoas jurídicas — entre elas Banco Master, Sefer Investimentos, Clínica Mais Médicos,
  Acura Gestora de Recursos e WNT Gestora de Recursos), "exceto em relação aos indivíduos sob n. 2
  (endereço 1), 12 e 33" — respectivamente um dos endereços de Daniel Vorcaro, André Felipe de Oliveira
  Seixas Maia e o próprio Banco Master, por já terem sido alvo de diligências de igual natureza. Entre os
  alvos com busca deferida: Nelson Tanure (item 7) e Fabiano Zettel, com a esposa Natália Vorcaro Zettel
  (item 4). Determina que as diligências sejam "o mais discreto possível", vedado acompanhamento de
  imprensa ou terceiros.'
