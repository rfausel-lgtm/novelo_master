summary: Peça de 4.340 páginas lida em 27/03/2026 e REJEITADA pela comissão por 19 votos a 12 na madrugada
  de 28/03; a CPMI encerrou sem relatório aprovado. O texto propunha o indiciamento de 216 pessoas e dedica
  a seção 8.3.9 ao Banco Master, os itens 10.3.3.2 e 10.3.3.3 a Daniel Vorcaro e Augusto Ferreira Lima,
  e a seção 12.3 a recomendações sobre integrantes e familiares do STF. Sendo proposta vencida, seus indiciamentos
  e recomendações não têm efeito institucional.
