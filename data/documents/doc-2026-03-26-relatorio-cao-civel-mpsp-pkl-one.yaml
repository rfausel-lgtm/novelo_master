summary: Relatorio publicado nos termos do art. 108 da Resolucao 1342/2021-CPJ, referente ao periodo de
  17 a 23/03/2026, area consumidor. Registra o procedimento no 0726.0000657/2025, com o Banco Master como
  reclamado e a PKL One Participacoes S.A. como representada, sob a ementa irregularidade no atendimento.
  E o unico procedimento do Ministerio Publico paulista com a empresa nominada localizado em fonte oficial,
  e tem natureza consumerista, nao versando sobre o credenciamento.
