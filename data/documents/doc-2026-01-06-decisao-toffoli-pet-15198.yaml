title: Decisão de Dias Toffoli na PET 15.198/DF — medidas cautelares na investigação do Banco Master
doc_type: judicial_decision
date: '2026-01-06'
source_ids:
- src-stf-decisao-toffoli-2026-01-06-pet-15198
summary: Peça central da investigação. Defere sequestro com teto de R$ 5.775.234.097,25, buscas contra
  38 alvos e afastamento de sigilo de 101 pessoas e entidades. Descreve a hipótese policial de que o banco
  teria direcionado recursos captados por meio de CDBs a fundos dos quais era cotista único, usados para
  adquirir notas comerciais e direitos creditórios de empresas ligadas aos próprios sócios. Quanto a Nelson
  Tanure, a expressão 'sócio oculto' aparece dentro da transcrição da manifestação do procurador-geral,
  que reporta o que 'a autoridade policial salientou'. O relator consigna que sua cognição, nessa fase,
  é necessariamente limitada.
