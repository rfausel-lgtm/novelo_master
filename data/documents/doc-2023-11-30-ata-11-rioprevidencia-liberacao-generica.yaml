title: Ata da 11ª reunião do Comitê de Investimentos do Rioprevidência — liberação genérica de teto
doc_type: corporate_record
date: '2023-11-30'
source_ids:
- src-rioprevidencia-ata-11-2023-11-30
summary: 'Documento central do achado: na semana em que a autarquia fez sua primeira aplicação em letras
  financeiras do Banco Master, o Comitê de Investimentos deliberou apenas sobre a liberação genérica de
  teto regulatório para letras financeiras, com base na Resolução CMN 4.963/2021, sem nomear nenhuma instituição
  financeira específica. A ata registra manifestação favorável unânime dos presentes, sem voto contrário
  ou alerta técnico registrado. Diferentemente do padrão documentado em outros regimes próprios, aqui
  a decisão de comprar papéis do Banco Master não foi individualizada no colegiado.'
