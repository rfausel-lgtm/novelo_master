excerpt: Euchério Rodrigues, Diretor de Investimentos desta autarquia, relatou que a proposta a ser apresentada
  consiste na liberação do limite para letra financeira no Plano Previdenciário segundo o CMN 4.963 (...)
  Todos os presentes deliberaram e se manifestaram de forma favorável à proposta que ali foi apresentada
  e esmiuçada.
