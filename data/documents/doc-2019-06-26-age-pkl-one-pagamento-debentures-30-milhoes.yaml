title: Atos societários da PKL One — de R$ 100 de capital a R$ 30 milhões pagos ao debenturista
doc_type: corporate_record
date: '2019-06-26'
source_ids:
- src-doesp-empresarial-2017-2019-atos-societarios-pkl-one
summary: A anatomia da empresa, lida em seus próprios atos societários. Constituída em março de 2017 com
  capital de R$ 100,00 e sede num apartamento em Perdizes, tinha ao fim daquele ano ativo total de R$
  100,00. Em 24/04/2018 — doze dias após o leilão da estatal baiana de alimentos e três dias antes dos
  decretos que criariam a margem na Bahia — muda-se para a Avenida Cidade Jardim, eleva o capital a R$
  1 milhão e recebe Andrea Lima Novaes na diretoria. Duas semanas depois aprova emissão de debêntures
  de subscrição privada cuja remuneração é fixada como percentual do lucro líquido; em outubro o teto
  mensal é removido e a remuneração passa a 50% do lucro líquido da companhia. Em maio de 2019 a assembleia
  aprova o pagamento de R$ 30,575 milhões 'ao debenturista', que os extratos não nomeiam. Metade do lucro
  do CredCesta saía, portanto, por debênture de participação nos lucros — não por dividendo. O estatuto
  consolidado de dezembro de 2018 inscreve no objeto social o 'licenciamento de ativos intangíveis não
  financeiros', que é como a empresa descreve, juridicamente, o que faz.
