summary: 'Decisão de 31 páginas, assinada em Brasília em 17/06/2026, que defere as medidas requeridas
  pela PF na Petição 16.229. Descreve a narrativa policial em três eixos: entrega de vantagens econômicas,
  com destaque para a aquisição do apartamento nº 1.702 do empreendimento Poème Horto, em Salvador (BA),
  avaliado em cerca de R$ 2.450.000,00; pagamentos e cobranças ligados à BN Financeira Ltda., empresa
  associada ao núcleo familiar de Jaques Wagner; e atuação parlamentar em pautas de interesse do Banco
  Master. Determina proibição de contato entre investigados, proibição de contato com pessoas ligadas
  à MD BA Parque Florestal Construções Ltda., ao Grupo Moura Dubeux e ao empreendimento, suspensão de
  passaportes e impedimento de saída do país.'
