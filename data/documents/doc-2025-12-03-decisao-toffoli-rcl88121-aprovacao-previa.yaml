summary: 'Em 02/12/2025, Luiz Antônio Bull pediu habilitação na Reclamação 88.121/DF (relator Dias Toffoli),
  relatando ter sido preso por onze dias na Operação Compliance Zero e pedindo suspensão das investigações.
  Em 03/12/2025, Toffoli deferiu acesso a Bull e à Polícia Federal, mas determinou que ''novas diligências e
  medidas devem ser previamente submetidas ao crivo desta Suprema Corte, cuja competência originária se
  encontra estabelecida... inclusive sobre outras investigações conexas'', diante de investigação
  ''supostamente dirigida contra pessoas com foro por prerrogativa de função''. É, com a leitura direta do
  IPL em 12/09/2026, o primeiro ato de supervisão do STF ao caso já lido pela equipe — doze dias anterior à
  decisão de 15/12/2025 até aqui registrada como marco documental mais antigo.'
