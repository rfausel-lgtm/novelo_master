summary: Audiência requerida pelo vereador Isaac Martins, com a presidente do AparecidaPrev, Márcia Tinoco,
  e o diretor Khayo Eduardo Pires de Oliveira. A autarquia confirma que a assessoria de investimentos
  não emitiu parecer porque o conselho não aprovou a operação, e que não houve documento formal de aprovação.
  Informa habilitação como credora na liquidação, com crédito atualizado próximo de R$ 47 milhões, e denúncias
  encaminhadas ao Ministério Público, ao Ministério da Previdência e ao Tribunal de Contas dos Municípios
  em março de 2025.
