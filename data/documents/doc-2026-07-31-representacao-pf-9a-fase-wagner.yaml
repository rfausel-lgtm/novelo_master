summary: Representação lida na íntegra pela equipe. Documenta a transferência de R$ 3,5 milhões de 17/10/2025
  com comprovante bancário, registra a constituição da BN Financeira em 08/07/2021 com capital de R$ 45
  mil, e consigna expressamente que o total de repasses às empresas vinculadas ao núcleo familiar do senador
  é maior que a transferência tratada e possivelmente desconhecido. Ao datar a contratação em 2022 e descrever
  o objeto contratual, remete em nota de rodapé a reportagem de imprensa e a declarações atribuídas ao
  sócio da empresa — e não a contratos.
