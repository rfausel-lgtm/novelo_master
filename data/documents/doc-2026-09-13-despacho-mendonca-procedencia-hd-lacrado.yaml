summary: Mendonça reconhece divergência sobre como o material do Ofício 33V/2026 chegou ao seu gabinete, sem
  decisão que o determinasse, e pede que quatro delegados da PF prestem informações em 24h sobre as
  circunstâncias da entrega e eventuais constrangimentos sofridos na investigação. Recusa incluir o conteúdo
  integral do celular de Vorcaro nos autos antes do julgamento de 15/09.
