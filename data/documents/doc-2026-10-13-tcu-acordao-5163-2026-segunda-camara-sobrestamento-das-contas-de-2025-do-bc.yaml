summary: >-
  Acórdão de relação na prestação de contas de 2025 do Banco Central do Brasil. Com fundamento no art. 10,
  § 1º, da Lei 8.443/1992 e nos arts. 201, § 1º, e 143, I, "b", do Regimento Interno, e de acordo com o parecer
  do MPTCU, a 2ª Câmara sobrestou o julgamento das contas até o trânsito em julgado da deliberação no TC
  022.950/2025-7 (relator Jhonatan de Jesus; segundo cópia de despacho hospedada pelo Poder360, representação
  sobre a atuação do BC na supervisão e na resolução do Banco Master), quando a unidade técnica deverá avaliar
  se o TC 008.216/2025-8 (relator Jorge Oliveira) e a Reclamação 88.121 do STF podem influir no mérito. A
  unidade técnica propunha julgar as contas regulares, com quitação plena. Os responsáveis listados são o
  presidente do Banco Central e outros oito gestores, que prestam as contas; o acórdão não aponta
  irregularidade de nenhum deles e não traz determinações ou recomendações. É ato de tribunal de contas, não
  decisão judicial. Captura de texto em raw/ (CPFs mascarados omitidos); o sha256 é o da captura.
excerpt: >-
  ACORDAM em sobrestar o julgamento destas contas até o trânsito em julgado da deliberação a ser proferida no
  TC Processo 022.950/2025-7
