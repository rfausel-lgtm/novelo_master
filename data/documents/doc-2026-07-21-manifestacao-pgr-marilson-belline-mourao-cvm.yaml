excerpt: 'Os elementos coligidos aos autos apontam que Marilson Roseno da Silva seria um dos principais
  operadores do núcleo de coerção da organização criminosa. Valendo-se de sua experiência e contatos na
  carreira policial, ele realizava diligências informais para monitorar alvos, obter dados pessoais e
  mapear informações estratégicas.'
