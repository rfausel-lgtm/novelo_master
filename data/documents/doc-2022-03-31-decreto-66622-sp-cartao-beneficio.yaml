title: Decreto nº 66.622/2022 (SP) — cria o cartão de benefício no último dia do governo Doria
doc_type: legislative_act
date: '2022-03-31'
source_ids:
- src-alesp-decreto-66622-2022-cartao-beneficio
summary: Ato que abre, na folha do funcionalismo paulista, a espécie em que o CredCesta viria a operar.
  Foi assinado por João Doria em 31 de março de 2022, seu último dia de mandato, na véspera da posse do
  sucessor. Cria o cartão de benefício como consignação facultativa 'limitada a 15% da margem consignável'
  e admite como consignatárias empresas administradoras de cartões 'conveniadas com instituições financeiras
  devidamente autorizadas pelo Banco Central do Brasil' — a mesma fórmula que Mato Grosso adotaria em
  2023, e que desloca a exigência de autorização da operadora para o parceiro bancário. Diferentemente
  do Rio de Janeiro, São Paulo não dispensou a referência ao Banco Central; transferiu-a. O art. 3º delega
  ao secretário da Fazenda a fixação dos limites da margem.
