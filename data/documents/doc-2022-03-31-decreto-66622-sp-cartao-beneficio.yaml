excerpt: XI - aquisição de bens e serviços, à vista ou financiada, assim como saques emergenciais, por
  meio de cartão de benefício, limitada a 15% da margem consignável. [...] IX - empresas administradoras
  de cartões de benefícios, conveniadas com instituições financeiras devidamente autorizadas pelo Banco
  Central do Brasil.
