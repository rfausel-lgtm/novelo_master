summary: Documento que responde como foi financiada a aquisição da Copel Telecom, arrematada em leilão
  na B3 em 09/11/2020 por R$ 2.395.000.000,00. A emissão foi de debêntures conversíveis em ações, com
  garantia real, em colocação privada e expressamente sem intermediação de instituições do sistema de
  distribuição de valores mobiliários. As garantias incluem alienação fiduciária de cem por cento da Copel
  Telecom. Nelson Tanure foi eleito presidente do conselho na mesma assembleia. O Banco Master não figura
  no documento.
