summary: 'O caso municipal mais bem documentado desta rodada, e o de maior volume conhecido. O convênio
  foi assinado em 15/09/2021, com vigência de doze meses prorrogáveis até sessenta, e nunca foi rescindido
  administrativamente. Os repasses à operadora somaram R$ 37,99 milhões entre 2023 e junho de 2026, em
  subconta extra-orçamentária. Registre-se a coincidência de escala federativa: no mesmo estado, a operadora
  fora inabilitada pelo Executivo estadual em 2023, sob o fundamento de que ''não se enquadra dentre os
  tipos de consignatárias'' — mas seguiu operando na folha da capital.'
