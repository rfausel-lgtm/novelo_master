kind: document
title: Edital 001/2023 da SEAD-AP — a PKL One inabilitada por não se enquadrar como consignatária
doc_type: administrative_act
date: '2023-06-05'
source_ids:
- src-doe-ap-2023-06-05-edital-001-2023-sead-pkl-one-inabilitada
summary: 'O contraexemplo mais nítido do acervo. Depois de o Amapá criar, por decreto de março de 2023,
  uma reserva de 5% da margem exclusivamente para cartão consignado de benefício, o processo de habilitação
  inabilitou a PKL One com a motivação de que ela ''não se enquadra dentre os tipos de consignatárias''
  — e habilitou, no mesmo despacho, o Banco Master. Rondônia chegaria a resultado equivalente por caminho
  normativo: a lei complementar de abril de 2024 criou a margem, mas exigiu instituição autorizada pelo
  Banco Central e aderente à autorregulação bancária. Dois estados abriram a margem e barraram a operadora
  pelo mesmo fundamento que outros ignoraram: ela não é instituição financeira.'
