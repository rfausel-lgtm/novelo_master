summary: 'A Polícia Federal relata a execução, em 04/03/2026, de mandados de busca e apreensão em São Paulo e Minas
  Gerais contra nove pessoas físicas e cinco pessoas jurídicas. Cumpridos contra Daniel Bueno Vorcaro, Paulo Sérgio
  Neves de Souza, Belline Santana, Leonardo Augusto Furtado Palhares, Moriah Asset, Fabiano Campos Zettel, Ana Cláudia
  Queiroz de Paiva, Luis Felipe Woyceichoski, Luiz Phillipi Machado de Moraes Mourão e Marilson Roseno da Silva.
  Não cumpridos, por inexistência de funcionamento real no endereço ou por o alvo não residir mais ali: Varajo Consultoria
  Empresarial, Super Empreendimentos e Participações, King Participações Imobiliárias e King Motors Locação de Veículos.'
