summary: 'Primeira medida restritiva de um ente estadual contra o produto, anterior em quase três meses
  à suspensão paulista. Bloqueia, a partir de 24/11/2025, novos lançamentos de descontos vinculados ao
  código 5420, identificado como ''CREDCESTA – PKL ONE''. Dois registros importam: a medida não foi publicada
  em diário oficial, tendo sido veiculada apenas como comunicado administrativo; e o documento hoje só
  é acessível por captura arquivada, porque a página oficial passou a responder que o conteúdo ficaria
  indisponível em razão da legislação eleitoral.'
