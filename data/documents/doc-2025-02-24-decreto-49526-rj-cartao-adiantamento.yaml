excerpt: IV - O cartão de adiantamento salarial não compõe a margem consignável prevista neste artigo.
  Parágrafo Único - Poderá ser utilizado o cartão de adiantamento salarial até o limite máximo de 40%
  (quarenta por cento), sem incidência de juros, sobre o valor líquido
