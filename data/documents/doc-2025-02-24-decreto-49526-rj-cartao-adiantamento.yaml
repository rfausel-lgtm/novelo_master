title: Decreto nº 49.526/2025 (RJ) — cartão de adiantamento salarial, 40% fora da margem
doc_type: legislative_act
date: '2025-02-24'
source_ids:
- src-doerj-2025-02-decreto-49526-cartao-adiantamento
summary: 'Repete, quatro anos depois, a mesma engenharia normativa: inclui o inciso IX no rol de consignatárias
  (''As administradoras de Cartão de Adiantamento Salarial''), cria a rubrica correspondente no art. 4º
  e determina, no art. 6º, que esse cartão também não compõe a margem consignável, com limite de até 40%
  do valor líquido, ''sem incidência de juros''. Somado ao decreto de 2021, produz o empilhamento de margens
  que está na origem dos contracheques com quase toda a renda comprometida. RESSALVA: a existência deste
  ato com o número e a data aqui registrados NÃO foi confirmada em apuração documental de 10/09/2026.
  Buscas por número, data e objeto em bases de legislação e de diários oficiais não o retornaram. Trate-se
  o registro como não confirmado até que se obtenha o texto.'
