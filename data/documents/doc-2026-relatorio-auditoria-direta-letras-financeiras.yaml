summary: 'Documento sigiloso, não lido pela equipe. Sua existência e denominação oficial foram confirmadas
  pela própria Polícia Federal em nota pública de 25/08/2026, que o aponta como origem da investigação
  sobre o regime próprio de Campo Grande. Não é um relatório sobre quatro entes: é um instrumento federal
  por classe de ativo, que percorreu regimes próprios compradores de letras financeiras do Banco Master
  em vários estados. Segundo a reportagem de O Globo, que afirma tê-lo obtido, o relatório registra que
  os termos de credenciamento eram idênticos entre entes, variando apenas os valores, e que os técnicos
  da Amapá Previdência admitiram aos auditores que a documentação fora elaborada pelo próprio Banco Master.'
