summary: Peça de 98 páginas dirigida ao ministro André Mendonça, com pedido de interceptação telefônica
  e acesso a registros de chamadas. Descreve a origem das investigações na Operação Compliance Zero, os
  diálogos entre Jaques Wagner e Augusto Ferreira Lima, o apartamento nº 1.702 do Poème Horto, os pagamentos
  à BN Financeira, outras vantagens econômicas (uso gratuito de aeronaves e ingressos para show) e a atuação
  parlamentar em dois atos legislativos de interesse do grupo. Teve o sigilo retirado e foi publicada
  pelo Poder360. As imputações são da autoridade policial e não representam juízo de mérito.
