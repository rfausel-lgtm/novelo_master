summary: >-
  Registro oficial dos andamentos do recurso, relator Gilmar Mendes. Em 16/09/2024, a 2ª Turma deu provimento,
  por maioria, ao agravo regimental da União, vencidos Edson Fachin e Nunes Marques. Em 22/09/2026, despacho do
  relator e inclusão de questão de ordem na lista da sessão virtual da 2ª Turma de 25/09 a 02/10/2026; em
  24/09/2026, decisão monocrática registrada como "Deferido", sem descrição; na sessão virtual, o relator indicou
  a afetação do julgamento ao Plenário, para referendo da decisão de 24/09, acompanhado por Dias Toffoli, e Luiz
  Fux pediu vista (andamento de 02/10/2026). Não menciona o Banco Master. Inteiro teor da decisão de 24/09 não
  aberto.
excerpt: >-
  "Após a indicação pelo Ministro Gilmar Mendes (Relator) de afetação do julgamento do feito ao Plenário, para
  referendo da decisão monocrática exarada em 24.9.2026, no que foi acompanhado pelo Ministro Dias Toffoli,
  pediu vista dos autos o Ministro Luiz Fux."
