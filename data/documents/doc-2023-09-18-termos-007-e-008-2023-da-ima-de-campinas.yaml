title: Em Campinas, o edital criou a categoria que acomoda quem o Banco Central não autoriza
doc_type: contract
date: '2023-09-18'
source_ids:
- src-dom-campinas-2023-09-19-termos-007-e-008-2023-ima
summary: 'A empresa municipal de tecnologia de Campinas credenciou, no mesmo dia e na mesma página do diário, a
  operadora (Termo nº 007/2023) e o Banco Master (Termo nº 008/2023), ambos por 24 meses contados da publicação,
  derivados do Chamamento Público nº 003/2023 e da Inexigibilidade nº 008/2023. O achado não é a coincidência, e
  sim a redação do objeto: o chamamento divide os interessados entre ''Instituições Bancária/Financeiras (autorizadas
  pelo Banco Central do Brasil)'' e ''Gestoras de Cartão de Crédito (isentas de autorização do Banco Central do
  Brasil)''. É a formulação administrativa que torna a ausência de autorização não um defeito, mas uma categoria
  de habilitação — e ela aparece aqui por escrito, num edital municipal, ao lado do credenciamento do banco que
  detém metade do produto.'
