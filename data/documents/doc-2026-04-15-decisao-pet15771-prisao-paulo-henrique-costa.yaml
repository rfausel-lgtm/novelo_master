summary: Decisão monocrática que decreta a prisão preventiva de Paulo Henrique Costa, descrevendo atuação
  'bifronte' — agente público que teria colocado o BRB a serviço da liquidez do Master e beneficiário
  de R$ 146.582.649,50 em seis imóveis de alto padrão — com transcrição de mensagens de WhatsApp trocadas
  com Daniel Vorcaro. Referendada por 4x0 pela 2ª Turma em 24/04/2026.
