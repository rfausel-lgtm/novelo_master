summary: Relatório de 218 páginas produzido em 72 horas por determinação de André Mendonça, lido na íntegra
  pela equipe. Subscrito pelos delegados Guilherme Alves de Siqueira, Wedson Cajá Lopes, Victor Arruda
  de Oliveira e Daniel Mostardeiro Cola, e pelos agentes Bruno Cavalcanti Teixeira, Lucas Daniel de Sá
  Soares de Matos e Paulo Danilo Batista Diniz Leite. A determinação foi endereçada ao CINQ/DICOR, para
  repasse aos delegados subscritores da representação inicial da Pet 15.556 — não passou formalmente pela
  direção-geral da corporação. O documento declara não ter realizado atos de aprofundamento investigativo
  e não possuir caráter exaustivo.
