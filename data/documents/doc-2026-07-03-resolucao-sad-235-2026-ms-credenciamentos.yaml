kind: document
title: Resolução SAD nº 235/2026 (MS) — suspende credenciamentos novos, ressalva renovações
doc_type: administrative_act
date: '2026-07-03'
source_ids:
- src-doems-2026-07-03-resolucao-sad-235-credenciamentos
summary: Ato que institui grupo de trabalho sobre superendividamento por consignações e, no art. 10, suspende
  novos credenciamentos de entidades consignatárias enquanto durar o colegiado. O parágrafo único, porém,
  ressalva expressamente a possibilidade de deferimento de pedidos de renovação — de modo que a medida
  não alcança convênios vigentes, como o da PKL One.
is_official: true
