- src-idest-2025-11-19-sgoprev-3-4-milhoes-letra-financeira
summary: 'Parecer técnico assinado pela Crédito & Mercado Consultoria de Investimentos, contratada pelo SGOPrev
  (São Gabriel do Oeste), datado de 12/09/2025 — pouco mais de dois meses antes da liquidação do Banco Master —,
  concluindo que a instituição ''atendia aos requisitos legais e de risco'' previstos na Resolução CMN nº 4.963/2021.
  O parecer embasou a aplicação de R$ 3,4 milhões em Letra Financeira, aprovada pelo Comitê de Investimentos e pelo
  Conselho Administrativo do instituto. É relevante por um motivo que extrapola São Gabriel do Oeste: a mesma consultoria
  — já registrada no acervo como assessora de sete regimes próprios que compraram papel do Master, somando R$ 232
  milhões — afirmou publicamente, em agosto de 2026, que ''nunca foi consultada'' sobre os investimentos no banco
  e que ''não emitiu parecer técnico''. Este documento, específico e datado, contradiz esse enunciado geral no caso
  concreto de São Gabriel do Oeste.'
