title: Edital nº 001/2015 de alienação da estatal baiana — a cláusula do Credicesta antes da privatização
doc_type: administrative_act
date: '2015-11-19'
source_ids:
- src-doeba-2015-11-19-edital-001-2015-alienacao-ebal-credicesta
summary: Prospecto da primeira tentativa de venda da estatal de alimentos, que não se consumou. Interessa
  por dois registros. Primeiro, atesta que o cartão foi criado em 1999 pela própria empresa pública, como
  instrumento de compra na rede estatal de supermercados. Segundo, já continha a cláusula que transferiria
  ao comprador, por cinco anos, 'a titularidade e a gestão plenas do Cartão Credicesta', com 'o direito
  de modificar, ampliar, aperfeiçoar e/ou diversificar as finalidades do programa'. A engenharia que o
  decreto de 2018 formalizaria estava desenhada desde 2015.
