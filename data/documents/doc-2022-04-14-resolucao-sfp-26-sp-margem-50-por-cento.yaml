reference: Resolução SFP nº 26, de 14/04/2022; DOE-SP 15/04/2022, Executivo I, p. 26
excerpt: Artigo 1º - A margem consignável a que se refere o caput do artigo 1º do Decreto nº 61.750, de
  23 de dezembro de 2015, fica alterada para 50% (cinquenta por cento).
