title: Resolução SFP nº 26/2022 (SP) — a margem consignável salta de 35% para 50%
doc_type: administrative_act
date: '2022-04-14'
source_ids:
- src-doesp-2022-04-15-resolucao-sfp-26-margem-50
- src-alesp-decreto-61750-2015-margem-35-por-cento
summary: 'Quinze dias depois de criada a espécie ''cartão de benefício'', a Fazenda paulista elevou a
  margem consignável global de 35% para 50% — exatamente os quinze pontos percentuais do sublimite reservado
  ao novo produto. Formalmente, os 15% não são margem adicional: o §4º condiciona a averbação à existência
  de margem disponível, e o §2º os define como limite interno. Na prática, porém, o mesmo movimento normativo
  que criou o produto abriu na folha espaço novo do tamanho exato dele. O contraste com 2015 é instrutivo:
  quando quis criar margem verdadeiramente adicional, a administração escreveu ''majorada, adicionalmente''.
  Em 2022 escolheu outra arquitetura para chegar ao mesmo resultado — por resolução de secretário, ato
  infralegal, e não por decreto.'
