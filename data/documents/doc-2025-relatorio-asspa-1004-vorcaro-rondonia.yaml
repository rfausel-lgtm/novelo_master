summary: 'Pesquisa da Assessoria de Pesquisa e Análise do MPF, com base na Folha de Antecedentes Criminais
  da PF e no sistema PJE-TRF1/Radar-PDPJ, mostrando que Daniel Vorcaro foi indiciado em 07/05/2020 por
  organização criminosa (art. 2º da Lei 12.850/2013) em inquérito conduzido pela PF em Vilhena/RO, e figura
  como parte em ao menos três processos federais em Rondônia entre 2020-2022: um sequestro de bens de
  28/07/2020 com outros 19 corréus (processo 1009187-68.2020.4.01.4100, em grau de recurso), um inquérito
  policial de 2021 na SSJ de Ji-Paraná (processo 1001403-03.2021.4.01.4101, suspenso), e um recurso em
  sentido estrito de 2022, também em Ji-Paraná (processo 1004425-35.2022.4.01.4101, suspenso). Também
  registra boletim de ocorrência na Bahia em que Vorcaro figura como suposto autor/infrator, sem detalhamento
  do fato.'
