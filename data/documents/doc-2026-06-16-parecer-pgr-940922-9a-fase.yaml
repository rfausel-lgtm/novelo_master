summary: Parecer assinado por Paulo Gustavo Gonet Branco (PGR), referente conjuntamente às Petições 16.201,
  16.210, 16.229 e 16.230/DF. Anui à operação de busca e apreensão da 9ª fase da Compliance Zero, mas
  opõe-se especificamente à busca no gabinete parlamentar de Jaques Wagner (separação de poderes) e à
  apreensão de bens de alto valor/dinheiro/joias (desproporcionalidade e prematuridade). Mendonça não
  acolheu integralmente essa posição na decisão da Pet 16.229.
