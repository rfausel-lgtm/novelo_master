summary: 'Captura HTML, feita diretamente pela equipe às 23h53 de 10/09/2026, de três páginas do portal
  público de acompanhamento processual do STF (portal.stf.jus.br/processos/detalhe.asp): a PET 15.556
  (incidente 7514886) e a PET 15.978 (incidente 7576893) exibiam a etiqueta ''Sigiloso''; a PET 16.704
  (incidente 7687920), processo do próprio despacho de Fachin publicado no mesmo dia, exibia ''Público''.
  A captura serve de controle negativo: descarta a hipótese de que a etiqueta do portal seja estática ou
  não reflita mudanças de status em tempo real.'
