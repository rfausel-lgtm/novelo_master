summary: 'Unico ato municipal paulista posterior a liquidacao que trata diretamente do banco, e e um indeferimento
  com fundamento expresso. O municipio negou requerimento de troca de titularidade de conta corrente no
  ambito de operacao de credito consignado firmada entre o Banco de Brasilia e o Banco Master, invocando
  a inexistencia de amparo legal e regulamentar junto ao Banco Central e os riscos ao erario e a seguranca
  financeira dos servidores. Registre-se o contexto: em 06/01/2026 o municipio publicara termo de cooperacao
  com a Camara Interbancaria de Pagamentos para gestao das consignacoes, assinado em 22/12/2025.'
