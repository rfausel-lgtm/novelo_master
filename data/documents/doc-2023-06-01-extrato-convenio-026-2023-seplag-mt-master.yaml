summary: 'Instrumento que habilitou o Banco Master a operar cartão consignado de benefício na folha do
  funcionalismo mato-grossense, com vigência de cinco anos, até maio de 2028. Assinado pelo secretário
  de Planejamento e Gestão e, pelo banco, pelo diretor Luiz Antonio Bull — nome já mapeado no acervo em
  outra frente do caso — e por um procurador. Correção metodológica que o documento impõe: não existe
  portaria de credenciamento publicada; o ato levado a diário oficial é o extrato do convênio.'
