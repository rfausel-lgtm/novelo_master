summary: Parecer lido na íntegra pela equipe. Fixa os cargos de Benjamim Botelho de Almeida, descreve
  a acusação de operação fraudulenta caracterizada pelo oferecimento de vantagens financeiras ilícitas
  a prefeitos e gestores de regimes próprios de previdência, e registra que a estrutura Foco DTVM / A.A.M.
  Ltda. já era objeto de investigação da Polícia Federal desde 31/01/2013, na Operação Miquéias. Consigna
  que o inquérito administrativo da CVM foi instaurado em 02/03/2016 e concluiu pela responsabilização
  de 20 pessoas naturais e 9 jurídicas.
