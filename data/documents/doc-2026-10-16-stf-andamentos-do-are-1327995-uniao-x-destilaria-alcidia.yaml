summary: >-
  Registro oficial dos andamentos do recurso, relator Edson Fachin. Em 21/02/2024, julgamento do agravo
  regimental suspenso por empate, com o registro "Impedido o Ministro Nunes Marques"; em 07/03/2024, despacho
  de Nunes Marques afastando o impedimento lançado no sistema; na sessão virtual de 15 a 22/03/2024, o registro
  de que ele afastou o impedimento e se declarou habilitado a votar; em 17/09/2024, pedido de vista dele; em
  01/10/2024, a 2ª Turma negou provimento ao agravo da União, por maioria, nos termos do voto do relator,
  vencidos André Mendonça e Gilmar Mendes; em 03/06/2025, rejeitou os embargos de declaração da União, por
  maioria, vencidos Gilmar Mendes e André Mendonça; trânsito em julgado em 10/10/2025. Os andamentos não nomeiam
  os ministros da maioria e não mencionam o Banco Master. Acórdãos não abertos.
excerpt: '"Afasto o impedimento lançado no sistema, declarando-me habilitado a votar."'
