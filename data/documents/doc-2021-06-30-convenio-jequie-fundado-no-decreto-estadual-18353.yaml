summary: A peça que liga documentalmente as duas escalas. O extrato do convênio municipal declara como
  fundamento legal o decreto estadual de 27 de abril de 2018 — aquele que foi assinado no dia do leilão
  da estatal de alimentos e que assegurou ao 'detentor dos direitos de exploração comercial' a faculdade
  de associar ao cartão serviços creditícios, financeiros e securitários. Um município invoca, como base
  jurídica de seu próprio ajuste, a norma estadual que criou o produto. O convênio foi assinado em 14/06/2021,
  e o decreto municipal que reservou 30% da remuneração exclusivamente ao programa veio dois dias depois
  — a operação precede a norma local, e a norma que a autoriza é a do Estado.
