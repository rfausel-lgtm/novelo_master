summary: Consulta ao conjunto de dados abertos da Receita, feita pela equipe. Metrópoles Mídia e Comunicação
  S/A, CNPJ 23.035.415/0001-04, aberta em 07/08/2015, capital de R$ 50 mil. Metrópoles Marketing e Comunicação
  S/A, CNPJ 34.008.137/0001-04, aberta em 24/06/2019, capital de R$ 1 milhão — é a empresa que recebeu
  os pagamentos do Banco Master. Metrópoles Produções, CNPJ 34.457.314/0001-30, associação privada. Nas
  três, a administração é de Luiz Eduardo Estevão de Oliveira e Luiza Meireles Estevão de Oliveira. Luiz
  Estevão de Oliveira Neto, tratado publicamente como controlador, não figura no quadro de nenhuma delas.
