summary: 'Peça que fecha o círculo da capital e explica por que o vínculo durou tanto. O aditamento ao
  termo de adesão, assinado em outubro de 2023, tinha vigência ''até que ocorra o recadastramento bienal
  do exercício de 2025''. Esta portaria, de agosto de 2026, registra que esse recadastramento ''não foi
  realizado'' e mantém, em caráter excepcional, o credenciamento das consignatárias ativas na data da
  publicação. Ou seja: o convênio sobreviveu por inércia administrativa, e não por decisão. A operadora,
  descredenciada seis dias antes, ficou de fora dessa prorrogação.'
