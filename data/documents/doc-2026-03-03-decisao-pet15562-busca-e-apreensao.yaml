summary: 'Com base nos arts. 240 e 244 do CPP, defere busca e apreensão e mandado específico de busca pessoal contra os
  investigados listados pela PF, com autorização de acesso a dados telemáticos, apreensão de dispositivos, de
  dinheiro em espécie acima de R$ 20 mil e de bens de luxo sem origem justificada, e acompanhamento da OAB em
  escritórios de advocacia. Classifica as cinco pessoas jurídicas-alvo como "típicas empresas de fachada" e
  estende a busca a Luís Felipe Woyceichoski, não investigado, para localizar provas que ele próprio disse guardar
  sobre a "Turma".'
