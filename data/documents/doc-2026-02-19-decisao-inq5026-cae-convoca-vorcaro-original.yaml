summary: 'Autoriza o pedido da CAE do Senado (Petição 16015/2026, e-Doc. 310) para colher depoimento de
  Daniel Vorcaro em 24/02/2026, mas "condicionado à prévia manifestação expressa, formal e inequívoca
  quanto à sua opção por comparecer" — o comparecimento é "de caráter estritamente facultativo". Fixa
  ainda as condições de custódia e deslocamento (escolta da Polícia Federal, vedado transporte em
  aeronave particular).'
