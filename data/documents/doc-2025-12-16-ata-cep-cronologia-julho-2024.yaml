excerpt: Na 12ª Reunião do CIAP, os Conselheiros Alexandre e Gláucio votaram contrariamente à proposta
  aprovada pela maioria, sugerindo que, após a visita técnica, o Comitê voltasse a se reunir para deliberar
  sobre o parecer da comissão, e só então decidir sobre a aplicação.
