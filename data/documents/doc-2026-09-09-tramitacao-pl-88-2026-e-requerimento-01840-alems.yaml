summary: Registro da consulta feita pela equipe ao sistema público de proposições da assembleia sul-mato-grossense.
  O projeto de lei que suspenderia os descontos vinculados ao CredCesta e ao Banco Master, do deputado
  Pedro Kemp, foi lido em 23/06/2026, recebeu relator na Comissão de Constituição e Justiça em 01/07/2026
  e não registra movimentação desde então. O Requerimento 01840/2026, único a nomear a PKL One e a pedir
  à secretaria os convênios e os descontos, aguarda ordem do dia desde 23/06/2026 sem jamais ter sido
  pautado — enquanto requerimentos de teor genérico sobre endividamento por consignados foram aprovados
  por unanimidade em semanas.
