id: doc-2016-02-25-estatuto-fgc-anexo-i-res-4469
kind: document
title: Estatuto do FGC (Anexo I da Resolução CMN nº 4.222/2013), com redação dada pela Resolução nº 4.469,
  de 25/2/2016 — redação vigente em dezembro de 2017
doc_type: regulatory_record
date: '2016-02-25'
source_ids:
- src-bcb-normativos-res-4222-estatuto-fgc
summary: 'Redação do Estatuto do FGC vigente em dezembro de 2017, época do aporte atribuído ao fundo na
  entrada de Daniel Vorcaro no Banco Máxima. O art. 4º prevê expressamente que integra o objeto do FGC
  a contratação de operações de assistência ou de suporte financeiro, inclusive de liquidez, com as instituições
  associadas — diretamente ou por intermédio de empresas por estas indicadas — e ''inclusive com seus
  acionistas controladores''; o § 1º admite que tais operações sejam contratadas ''inclusive, com o objetivo
  de promover a transferência de controle acionário''. O § 2º impõe limites: as operações não podem exceder
  o valor projetado dos instrumentos financeiros garantidos da associada, e observam tetos de 25% do patrimônio
  líquido do FGC por associada ou conglomerado e 50% para o conjunto das operações. Na redação atual do
  Estatuto (Anexo I com redação dada pela Resolução nº 4.688, de 25/9/2018), a mesma previsão passou ao
  art. 3º, inciso II, com o § 2º dispondo que as operações serão contratadas ''preferencialmente'' com
  o objetivo de promover a transferência de controle acionário ou a saída organizada do mercado.'
