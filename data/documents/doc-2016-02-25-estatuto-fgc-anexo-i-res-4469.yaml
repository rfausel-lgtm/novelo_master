url: https://normativos.bcb.gov.br/Lists/Normativos/Attachments/48942/Res_4222_v15_P.pdf
reference: Resolução CMN nº 4.222/2013, Anexo I, art. 4º (redação da Resolução nº 4.469/2016)
excerpt: Art. 4º Integra também o objeto do FGC, consideradas as finalidades previstas nos incisos II
  e III do art. 2º, a contratação de operações de assistência ou de suporte financeiro, incluindo operações
  de liquidez com as instituições associadas, diretamente ou por intermédio de empresas por estas indicadas,
  inclusive com seus acionistas controladores. § 1º As operações referidas no caput poderão ser contratadas,
  inclusive, com o objetivo de promover a transferência de controle acionário, a transformação, a incorporação,
  a fusão, a cisão ou outras formas de reorganização societária legalmente admitidas de interesse das
  instituições associadas.
