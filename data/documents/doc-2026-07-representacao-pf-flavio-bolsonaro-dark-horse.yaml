summary: 'A PF representa pela apuração de lavagem de dinheiro, evasão de divisas, corrupção e organização
  criminosa no financiamento internacional do filme "Dark Horse", com possível participação de Flávio
  Bolsonaro, Eduardo Bolsonaro, Mário Frias, Thiago Miranda, Fabiano Zettel, Antônio Freixo, Altieres Santana e
  Paulo Calixto. Reconstrói uma sequência de mensagens entre Vorcaro e Flávio Bolsonaro entre dezembro/2024 e
  novembro/2025.'
