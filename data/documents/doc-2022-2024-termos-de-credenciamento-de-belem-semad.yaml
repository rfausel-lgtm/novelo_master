date: '2024-04-18'
source_ids:
- src-dom-belem-2022-2024-termos-credenciamento-semad
summary: Dois termos de credenciamento sucessivos fecham a lacuna do Pará, estado que o mapa de cobertura do produto
  listava desde fevereiro de 2024 sem que a investigação tivesse localizado qualquer instrumento. O primeiro, nº
  05/2022-SEMAD, foi assinado em 25/04/2022, com vigência de 24 meses prorrogáveis, fundado no Edital de Credenciamento
  nº 001/2022-SEMAD e no Decreto Municipal nº 103.487/2022-PMB. O segundo, nº 02/2024-SEMAD, foi assinado em 18/04/2024,
  também por 24 meses, o que projeta o vínculo até abril de 2026 — cinco meses depois da liquidação do banco. O
  objeto alcança servidores ativos, aposentados e pensionistas da administração direta e indireta. Nenhum ato de
  rescisão foi localizado. O texto de 2024 imprime um cadastro nacional que não é o da empresa.
