summary: 'Segundo despacho de Fachin na Pet 16.704, distinto do de 03/09: abre trilha sequencial e mais
  restrita, tratando especificamente da admissibilidade da acusação que Moraes apresentou contra Mendonça
  (oriunda do Inq 4.781/DF) — primeiro vista à PGR (5 dias úteis), depois, sucessivamente, manifestação
  de Mendonça (mais 5 dias úteis).'
