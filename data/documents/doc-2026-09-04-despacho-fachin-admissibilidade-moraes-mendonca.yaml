excerpt: À Procuradoria-Geral da República, dê-se vista para que, no prazo de 5 (cinco) dias úteis, apresente
  parecer acerca da admissibilidade e da regularidade do procedimento [...]. Sucessivamente, ao Ministro
  André Mendonça, faculte-se, no prazo de 5 (cinco) dias úteis, a apresentação de manifestação [...].
