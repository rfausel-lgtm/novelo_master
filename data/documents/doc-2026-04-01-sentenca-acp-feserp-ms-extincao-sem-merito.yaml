summary: 'Localiza o número dos autos que o acervo registrava como pendente e precisa o desfecho: a ação
  foi distribuída em 27/02/2026 — e não em 03/03/2026, como a própria autora divulgou —, e a sentença
  de 26/03/2026 acolheu as preliminares dos réus, extinguindo o feito sem resolução do mérito com base
  no inciso VI do art. 485 do Código de Processo Civil. Não houve condenação em custas nem honorários,
  por não se ter reconhecido má-fé da federação. A apelação, interposta em abril, seguia sem subir ao
  tribunal em setembro de 2026 por falta de manifestação das procuradorias.'
