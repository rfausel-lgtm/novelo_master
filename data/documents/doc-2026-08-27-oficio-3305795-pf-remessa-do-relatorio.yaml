summary: 'Ofício de uma página pelo qual a Polícia Federal encaminha ao ministro André Mendonça a Informação
  de Polícia Judiciária de Análise nº 3298613/2026, em atendimento a requisição judicial exarada nos autos
  da PET nº 15.556/STF. Assinado digitalmente em 27/08/2026, entre 18h27 e 18h49, por quatro delegados
  de Polícia Federal: Daniel Mostardeiro Cola (coordenador-geral de Repressão à Corrupção, Crimes Financeiros
  e Lavagem de Dinheiro), Wedson Cajé Lopes (coordenador de Repressão à Corrupção), Victor Arruda de Oliveira
  (coordenador de Inquéritos nos Tribunais Superiores) e Guilherme Alves de Siqueira (chefe da Divisão
  de Repressão aos Crimes Financeiros). Lido integralmente pela equipe editorial.'
