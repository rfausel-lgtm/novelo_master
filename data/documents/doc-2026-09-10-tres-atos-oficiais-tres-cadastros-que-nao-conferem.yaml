summary: 'Três atos administrativos de três estados imprimem, ao identificar a mesma empresa, números de cadastro
  nacional que não conferem. Em São Bernardo do Campo (SP), em dezembro de 2023, o cadastro correto da operadora
  aparece também na linha de outra empresa, a Neo Crédito. Em Belém (PA), em junho de 2024, o extrato do termo de
  credenciamento traz 24.490.629/0001-13, número que a base pública da Receita Federal recusa como inválido — e
  que difere do correto por um único dígito. Em Petrolina (PE), em dezembro de 2021, o aviso do convênio traz 05.196.530/0001-70,
  que é o cadastro do município de Tomé-Açu, no Pará. Isoladamente, cada um é erro material corriqueiro de diário
  oficial. Reunidos, dizem algo sobre o controle exercido na porta de entrada: em três estados, o ente público assinou
  com a empresa sem que o número que a identifica tenha sido conferido — o mesmo tipo de porta pela qual já se documentou
  que ela foi qualificada como instituição financeira em pelo menos três atos, sem autorização do Banco Central.'
