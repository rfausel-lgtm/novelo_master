summary: 'Autoriza a aquisição de cerca de R$ 14 milhões em letras financeiras com vencimento em dez anos,
  por sugestão do consultor financeiro, sem nomear o emissor e fixando expressamente que se optasse por
  instituições no mínimo S3 e presentes na lista exaustiva da Secretaria de Previdência. Detalha a origem
  dos recursos: cerca de R$ 9 milhões da reserva da taxa de administração, R$ 3 milhões do caixa e R$
  2,5 milhões de cupom de NTN. Não há análise de risco de crédito do emissor.'
