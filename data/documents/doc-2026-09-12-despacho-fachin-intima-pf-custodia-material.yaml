summary: 'Na Pet 16.704, a Presidência do STF (Fachin) determina: "Intime-se a Polícia Federal para que
  preste informações, em até 24 (vinte e quatro) horas, sobre a custódia do material e o estado em que se
  encontra." Consultado apenas pelo andamento público (sem o teor completo da petição/certidão associada);
  o contexto imediato — ofícios de Moraes e Gilmar Mendes sobre o compartilhamento do HD do celular de
  Vorcaro, seguidos por este despacho — indica que o "material" é essa mesma cópia de segurança lacrada.'
