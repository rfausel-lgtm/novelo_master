title: Carta-proposta do City Football Group para aquisição do terreno de Jaques Wagner em Camaçari
doc_type: letter
date: '2025-02-27'
date_precision: day
issuer: City Football Group (Midco) Limited
reference: Juntada pela defesa de Jaques Wagner na PET 16.230
source_ids:
- src-stf-pet16230-autos-pecas
summary: Enviada de Manchester a Jaques Wagner e Maria de Fátima Mendonça. Descreve o empreendimento do Grupo City
  — centro de formação de atletas City Football Academy Bahia e condomínio residencial — em área de 458.794 m² no
  lugar Tererê, distrito de Abrantes, Camaçari, da qual a área de Wagner representaria cerca de 44.000 m² (9,6%),
  ao lado de áreas das famílias Guanaes e Neves e do "Grupo City/Terere". Afirma que a área da matrícula "foi parcialmente
  desapropriada em função da construção do anel metropolitano". Oferece permuta financeira ou física equivalente
  a 3,36% do VGV ou da área de lotes, com adiantamento de R$ 4 milhões em duas parcelas, sob condições suspensivas.
