date_precision: day
source_ids:
- src-stf-pet15563-decisao-03-03-2026-medidas-assecuratorias
summary: 'Com base nos arts. 125 a 132 do CPP, na Lei 9.613/1998 e no Decreto-Lei 3.240/1941, defere o bloqueio de
  valores em contas e a indisponibilidade de ativos, créditos, valores mobiliários, imóveis, veículos, embarcações,
  aeronaves e criptoativos das pessoas e empresa listadas na fl. 169 da representação da PF, "considerando os
  valores individualizados para cada um dos alvos", a operar por SISBAJUD, CNIB e RENAJUD e por ofícios ao Banco
  Central, CVM, SUSEP, ANAC e corretoras de criptoativos. Descreve o papel atribuído pela PF a cada alvo.'
