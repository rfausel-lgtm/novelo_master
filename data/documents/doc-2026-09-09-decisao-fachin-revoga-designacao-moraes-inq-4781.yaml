summary: 'Decisão que encerra a relatoria mais longeva e mais disputada do tribunal. O presidente do Supremo
  revoga a designação de Alexandre de Moraes como relator do inquérito instaurado por portaria em março
  de 2019 e assume pessoalmente sua condução, invocando o art. 43 do regimento interno e o entendimento
  do Plenário na ADPF 572 — precisamente o julgamento em que a corte validou o inquérito e lhe fixou limites.
  A justificativa declarada é a ''necessidade de estabelecer segurança jurídica e adequada delimitação
  institucional''. Dois efeitos foram delimitados com cuidado: a revogação vale só a partir da data da
  decisão, preservando os atos já praticados, e as ações penais conexas com denúncia recebida seguem o
  rito em curso. O ponto de maior alcance está no encaminhamento anunciado: após análise, os autos irão
  à autoridade policial e à Procuradoria-Geral da República para oferecimento de denúncia ou pedido de
  arquivamento — ou seja, o presidente sinaliza conduzir a um desfecho um procedimento aberto havia sete
  anos e meio. Para este acervo, o que importa é a origem do conflito: ela está no caso Master.'
