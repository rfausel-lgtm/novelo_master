summary: Memorando de Entendimento e Declaração de Relação Jurídica assinado em Miami, em 17/07/2026, por Karina
  Ferreira da Gama e Michael Brian Davis na condição de acionistas e diretores da Goup Entertainment LLC, e dirigido
  à Ancine no mesmo processo administrativo em que a empresa brasileira apresentaria sua defesa semanas depois.
  Nele a LLC é nomeada expressamente como 'Licenciante e titular declarada dos direitos sobre a Obra', e a cláusula
  5.1 declara, 'de forma expressa e para fins de resposta à exigência administrativa', que a produção 'foi realizada
  parcialmente no território da República Federativa do Brasil'. O mesmo documento licencia à Cannes Produções Ltda,
  sediada em Barueri, os direitos de distribuição e exploração comercial do filme no Brasil. É a declaração, feita
  pela própria estrutura ao regulador brasileiro, de que a titularidade e o comando da obra estão na empresa americana.
  Não lido pela equipe.
