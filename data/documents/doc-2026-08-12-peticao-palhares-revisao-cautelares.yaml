excerpt: 'a única conduta atribuível ao PETICIONÁRIO no contexto sob apuração consiste na celebração de
  contrato para o desenvolvimento de projeto social em conjunto com Belline Santana, servidor do Banco
  Central do Brasil, do qual decorreram pagamentos correspondentes às atividades contratadas. E, nada mais.'
