summary: 'A PF representa pela apuração autônoma de suposta corrupção do governador Cláudio Castro, apontando
  proximidade pessoal com Vorcaro (jantares em Nova York, evento de "degustação de whiskey" de mais de US$ 1
  milhão) e mensagens do operador Ricardo Siqueira Rodrigues sobre "alinhamento político" para liberar os
  aportes da RioPrevidência no Master. Pede que o feito não seja avocado de imediato, para preservar a
  Operação Barco de Papel em curso no Rio.'
