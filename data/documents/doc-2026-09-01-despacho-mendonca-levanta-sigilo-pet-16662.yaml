summary: 'Registra a origem da PET 16.662 no desentranhamento da PET 15.556, por força do art. 5º, I,
  do Regimento Interno, e define o objeto: identificar os integrantes de suposta rede de influência e
  monitoramento atribuída a Daniel Vorcaro, com indícios de infiltração em instâncias de instituições
  da República. Determina o levantamento do sigilo e afirma que a matéria deve ir a Plenário, em sessão
  presencial e pública, em data a ser definida pela Presidência.'
