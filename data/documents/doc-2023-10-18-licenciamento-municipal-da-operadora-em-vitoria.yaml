summary: 'Duas relações municipais de licenciamento, de 02/10/2023 e 18/10/2023, registram a PKL One Participações
  S.A. com endereço próprio na avenida Nossa Senhora da Penha, 714, Edifício RS Trade Tower, lojas 03 e 04, no bairro
  Praia do Canto. A primeira descreve a atividade como ''Holdings de Instituições Não-Financeiras'' — a mesma do
  cadastro federal —, e a segunda registra validade até 05/09/2028. O registro é de presença física licenciada,
  não de credenciamento em folha, e ajuda a aterrissar a rede de 49 unidades em vinte e quatro estados que a captura
  do site do produto mostrava em janeiro de 2026: ao menos uma dessas portas tem ato municipal que a autoriza.'
