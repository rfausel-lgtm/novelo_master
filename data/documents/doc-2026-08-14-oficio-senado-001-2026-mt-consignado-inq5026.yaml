summary: Os senadores Jayme Campos, Wellington Fagundes e Carlos Fávaro, representantes do Mato Grosso,
  solicitam "especial atenção" à apuração de fatos relacionados a operações de crédito consignado
  incidentes sobre a remuneração de servidores públicos do Estado, "algumas das quais envolvendo
  instituições e estruturas empresariais que vêm sendo relacionadas ao denominado Caso Banco Master" —
  descrevendo denúncias de valor desembolsado substancialmente inferior ao posteriormente cobrado.
