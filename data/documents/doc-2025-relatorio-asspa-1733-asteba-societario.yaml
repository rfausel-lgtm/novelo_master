summary: 'Documentação CCS/CENSEC pesquisada pela Assessoria de Pesquisa e Análise do MPF sobre a Asteba,
  mostrando que Augusto Ferreira Lima foi presidente estatutário da associação de 01/09/2005 a 28/02/2008
  — não apenas procurador, seu papel documentado no período mais recente —, sucedido por Roque Ribeiro
  Damásio (2008-2018, falecido em 2017) e por Nanci Maria Prates Pereira (presidente desde 2018, atual).
  Joselita Nascimento dos Santos aparece como representante/procuradora recorrente nas contas bancárias
  da associação (Banco Master, Bradesco, Banco do Brasil) de 2017 a 2025.'
