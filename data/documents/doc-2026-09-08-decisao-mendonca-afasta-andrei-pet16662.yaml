excerpt: A par de existirem outras questões em torno das inadequações, disfuncionalidades, irregularidades
  e potenciais ilicitudes na conduta do Senhor Andrei Augusto Passos Rodrigues, a superlativa gravidade
  e ilicitude na produção dos 'relatórios de inteligência' publicizados pelo Ministro Alexandre de Moraes
  impõe a adoção de providências imediatas [...]. Por isso, ante a urgência e extrema gravidade que a
  situação apresenta, essa decisão se centrará no exame deste fato específico.
