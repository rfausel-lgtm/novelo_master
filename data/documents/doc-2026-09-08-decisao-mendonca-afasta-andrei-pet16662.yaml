summary: 'Decisão monocrática de 33 páginas na Pet 16.662, lida integralmente pela equipe a partir de
  cópia obtida pelo editor via peticionamento eletrônico do STF. FUNDAMENTO REAL, que corrige a leitura
  anterior baseada em imprensa: Mendonça registra expressamente, no §6, que ''existem outras questões''
  sobre inadequações na conduta de Andrei Rodrigues (as alegações do Partido Novo, baseadas no depoimento
  de Vorcaro), mas que ''esta decisão se centrará'' exclusivamente na ''superlativa gravidade'' de um
  relatório de inteligência apócrifo — sem timbre, autodescrito como ''documento de trabalho'', ''sem
  valor probatório'', ''difusão restrita'', com ''confiança agregada BAIXA'' nos elos mais frágeis de
  sua própria cadeia inferencial — produzido pela UADIP/CINQ/CGRC/DICOR/PF (subordinada à Diretoria de
  Inteligência Policial) ao longo de mais de 30 dias (03 a 31/08/2026), monitorando o próprio Mendonça
  e o Advogado-Geral da União, Jorge Messias. Esse relatório foi encaminhado por Andrei Rodrigues (ofício
  às 18h45 de 01/09/2026) e chegou a Alexandre de Moraes, que o usou para acusar Mendonça de ''usurpação
  da direção das investigações'' (decisão de 03/09/2026, já registrada no corpus). A decisão determina:
  (i) afastamento cautelar por 90 dias de Andrei Rodrigues e Leandro Almada da Costa; (ii) abertura de
  procedimento criminal e administrativo-disciplinar pela Corregedoria da PF (Aletea Vega Marona Kunde);
  (iii) suspensão da produção de qualquer relatório de inteligência sobre magistrados, advocacia pública
  ou policiais. NÃO concede a prisão preventiva pedida pelo Partido Novo, nem se pronuncia sobre as alegações
  de corrupção contra Andrei — essas questões ficam expressamente reservadas para momento posterior. Cita
  precedentes (AC 4.070-Ref/DF, Eduardo Cunha; Inq 4.879-Ref/DF, Ibaneis Rocha) para justificar a constitucionalidade
  do afastamento cautelar de autoridade pública por decisão monocrática referendada pelo colegiado.'
