summary: Decisão monocrática na Pet 16.662 determinando o afastamento cautelar, por 90 dias, de Andrei
  Rodrigues (diretor-geral) e Leandro Almada da Costa (diretor de Inteligência Policial), sob alegação
  de monitoramento ilícito do relator por mais de 30 dias; determina abertura de procedimento criminal
  e administrativo-disciplinar pela Corregedoria da PF, e proíbe novos relatórios de inteligência sobre
  magistrados, advocacia pública ou policiais. Submetida a referendo da 2ª Turma em sessão virtual extraordinária
  (08/09/2026, 10h-23h59). A equipe não teve acesso à íntegra do documento — o teor é conhecido por citações
  da imprensa.
