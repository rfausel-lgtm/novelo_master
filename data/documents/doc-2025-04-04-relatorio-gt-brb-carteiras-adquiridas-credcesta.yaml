summary: 'Relatório reservado da Diretoria de Finanças e Controladoria do BRB, do grupo de trabalho instituído pela
  Portaria DIFIC 2025/004, de 26/02/2025. Traz o panorama da carteira Credcesta adquirida do Master (52 tranches, 1,79
  milhão de contratos, R$ 7,62 bilhões de saldo contábil), registra que as CCBs ainda não tinham sido acessadas,
  descreve a amostra de 399 contratos e aponta 114.626 contratos com numeração padronizada em convênios da Bahia.'
