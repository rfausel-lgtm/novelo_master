summary: 'Comunicado oficial do Banco Central que decretou a liquidação extrajudicial do Banco Master S.A. e
  determinou indisponibilidade de bens de seus controladores e ex-administradores. Lista como controladoras
  pessoas jurídicas Master Holding Financeira S.A. e 113 Investimentos e Participações Ltda, e como
  controladores pessoas físicas Daniel Bueno Vorcaro, Armando Miguel Gallo Neto e Felipe Wallace Simonsen;
  como ex-administradores, Angelo Ribeiro da Silva, Daniel Bueno Vorcaro, Felipe Wallace Simonsen e Luiz
  Antonio Bull. Reproduzido (via OCR) em petição de Augusto Ferreira Lima no INQ 5.026.'
