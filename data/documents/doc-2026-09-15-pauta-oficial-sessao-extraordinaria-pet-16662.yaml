summary: 'Resolve, por documento, a dúvida que o acervo registrara em aberto. A sessão plenária extraordinária
  nº 28/2026, de 15/09/2026 às 10h, tem um único incidente em pauta: a Petição 16.662, de relatoria de
  André Mendonça, no grupo de matéria penal. Não há dois itens. E a controvérsia sobre o comando da Polícia
  Federal não está lá: por decisão do próprio presidente, ela migrou para a suspensão de liminar pedida
  pela União, de competência exclusiva da Presidência, onde será apreciada por ele pessoalmente. A cobertura
  que descreveu a sessão como destinada a julgar as decisões conflitantes sobre os dirigentes da corporação
  não encontra respaldo na pauta.'
