summary: Tabela de demonstrativo de carteiras, com posição de 29/02/2024, publicada na ata GEROI de março
  de 2024. É a única ocorrência nomeada do Banco Master em toda a série de atas de 2023 e 2024 lida pela
  equipe — nos demais meses, a mesma linha de ativo aparece apenas como 'LETRA FINANCEIRA IPCA + X%',
  sem identificar o emissor.
