summary: 'Levantamento que produz uma conclusão negativa e sólida: as rupturas contratuais existem, mas
  nenhuma delas decorre das liquidações. Pio XII rescindiu unilateralmente em agosto de 2021, quatro meses
  depois de assinar; Canapi em fevereiro de 2022, com o extrato trazendo ''BANCO MASTER S/A'' na linha
  de assinatura de um contrato firmado com a operadora; Jeremoabo em junho de 2022; e em Juazeiro foi
  a própria operadora quem rescindiu, em abril de 2024. Lauro de Freitas suspendeu e restabeleceu o ajuste
  três vezes, por descumprimento de margem. Depois de novembro de 2025, a varredura nacional não encontrou
  um único ato municipal de rescisão em rede alguma.'
