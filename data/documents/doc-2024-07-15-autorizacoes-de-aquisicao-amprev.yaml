summary: 'Dois despachos de mesma data, assinados pela diretora financeira e atuarial, encaminhando o
  despacho de gabinete com a autorização do diretor-presidente para a aquisição e transferência de valores:
  o documento nº 130204.0077.1551.0031/2024, referente ao Plano Previdenciário, e o nº 130204.0077.1551.0032/2024,
  referente ao Plano Financeiro, ambos com fundamento na deliberação da 11ª reunião extraordinária do
  comitê, de 12/07/2024. São as peças de execução operacional que a decisão da operação Zona Cinzenta
  descreve como documento de autorização assinado pelo diretor-presidente.'
