- src-doego-2026-09-09-ausencia-de-pkl-one-e-master-no-diario-de-goias
summary: 'Goiás é o único caso examinado em que a margem exclusiva veio por lei, aprovada pelo Legislativo,
  e não por decreto do Executivo — os dez por cento ''somam-se'' ao limite das facultativas, reduzidos
  a cinco por cento para celetistas. O contraste que o caso oferece é outro: o estado consta da lista
  de cobertura do produto desde maio de 2022, mas o levantamento da equipe no índice do diário oficial
  goiano, com controle metodológico, não encontrou uma única ocorrência da operadora, do produto ou do
  banco. Se houve operação em Goiás, ela não passou pelo diário estadual — o que remete os convênios ao
  nível municipal.'
