excerpt: solicitamos também esclarecimentos quanto aos motivos que ensejaram a negativa do Banco Central
  do Brasil em relação à negociação de aquisição de parte do Banco Master pelo Banco de Brasília – BRB,
  haja vista que tal decisão pode refletir diretamente na percepção de risco e na avaliação de solvência
  desta instituição junto aos investidores institucionais, como é o caso da AMPREV.
