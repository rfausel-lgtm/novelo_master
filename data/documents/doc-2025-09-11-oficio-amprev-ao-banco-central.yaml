summary: Ofício nº 130204.0076.1547.1278/2025, de 11/09/2025, dirigido ao presidente do Banco Central.
  O assunto começa com a palavra 'REITERO' — é a segunda vez que a autarquia pergunta. Pede informações
  oficiais sobre a existência de processos administrativos, sanções, investigações ou outras ocorrências
  regulatórias que envolvam o Banco Master, seus dirigentes ou controladores, e pede também esclarecimentos
  sobre os motivos que levaram o Banco Central a negar a aquisição de parte do banco pelo Banco de Brasília,
  por entender que a decisão reflete na percepção de risco e na avaliação de solvência da instituição.
  Foi enviado dois meses antes da liquidação extrajudicial.
