summary: Nota oficial divulgada no dia seguinte à liquidação, reproduzida na íntegra pela Abrapp porque
  a URL original do órgão passou a exigir autenticação. Informa que o regime de previdência complementar
  fechada não possui aplicações ou posições em ativos financeiros do Banco Master, conforme consulta da
  equipe técnica de auditores nos demonstrativos mensais de investimentos. É a medida da assimetria entre
  fundos privados e regimes próprios de previdência.
