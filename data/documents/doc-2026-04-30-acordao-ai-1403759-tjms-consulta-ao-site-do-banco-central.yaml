summary: 'Acórdão que preserva a fundamentação da primeira instância em sua forma completa, incluindo
  a menção ao endereço eletrônico consultado. Tem duplo valor: fixa a origem exata da frase que a imprensa
  reproduziu, e mostra que o Judiciário estadual realizou, por iniciativa própria, a mesma verificação
  na base pública do Banco Central que a equipe fez e registrou em lote anterior — chegando ao mesmo resultado,
  de que a empresa não consta da relação de instituições autorizadas.'
