summary: O BRB denuncia o desvio de fluxos do produto de consignado Credcesta para estruturas ligadas à PKL One
  Participações e ao Banco Pleno, apontando Augusto Ferreira Lima — ex-sócio de Vorcaro no Master, controlador do
  Pleno — como possível centro de comando do desvio. Cita a ação cível nº 4010622-66.2025.8.26.0011, em curso em
  São Paulo, e representação criminal ao MPF (Tombo 20260027699/2026). Pede a segregação dos fluxos do Credcesta
  sob controle do liquidante do Master e a intimação de Andréa Lima Novaes, diretora da PKL One à época.
