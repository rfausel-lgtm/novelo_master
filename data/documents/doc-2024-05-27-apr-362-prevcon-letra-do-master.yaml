summary: Documento que formaliza a operação. Identifica o ativo como letra financeira do Banco Master,
  com o CNPJ do banco, e declara enquadramento no art. 7º, IV — o dispositivo que trata de ativos emitidos
  por instituição financeira. No campo de histórico, porém, descreve a operação como 'aplicação em títulos
  públicos', que é categoria distinta. Os campos de patrimônio do fundo, cota e retorno estão em branco
  e a data de início do ativo consta como 01/01/1900.
