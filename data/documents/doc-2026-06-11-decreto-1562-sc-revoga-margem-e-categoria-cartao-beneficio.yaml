reference: Decreto nº 926, de 14/04/2025, art. 13 §4º e art. 6º VII, revogados pelo Decreto nº 1.562,
  de 11/06/2026
excerpt: Será admitida liberação da margem adicional equivalente a 10% (dez por cento), além da margem
  consignável prevista no caput deste artigo, destinada exclusivamente para desconto de valores relativos
  a cartão consignado de benefícios
