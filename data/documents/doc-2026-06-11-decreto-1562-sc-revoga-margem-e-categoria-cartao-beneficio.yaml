title: Decreto nº 1.562/2026 (SC) — Santa Catarina revoga a margem e a própria categoria de consignatária
doc_type: legislative_act
date: '2026-06-11'
source_ids:
- src-sea-sc-decreto-926-2025-e-1562-2026-margem-cartao-beneficio
summary: 'A reação regulatória mais completa entre as localizadas. Santa Catarina havia instituído em
  abril de 2025 a margem adicional de dez por cento para cartão consignado de benefícios e admitido como
  consignatárias as administradoras desse tipo de cartão. Em 11 de junho de 2026 revogou os dois dispositivos
  de uma vez: extinguiu a margem e eliminou a própria figura jurídica que a tornava utilizável. Enquanto
  outros entes suspenderam códigos ou descredenciaram empresas, o estado catarinense fechou a categoria.'
is_official: true
