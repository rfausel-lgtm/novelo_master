summary: 'Pesquisa societária da Assessoria de Pesquisa e Análise do MPF sobre a The-Pay Soluções de
  Pagamentos (nome fantasia "Privilege", CNPJ 17.780.249/0001-60): Roberto Fernandes de Oliveira Filho como
  sócio-administrador com 100% de participação de 08/05/2020 a 05/09/2024; nessa data, o controle passou a
  uma holding identificada de forma inconsistente no próprio documento (ora "Sirius Participações S.A.",
  ora "Merope Participações S.A.", mesmo CNPJ 50.618.350/0001-94) e a novos administradores — Gustavo Franca
  Pianosi (ou Pianucci, grafia inconsistente), Pedro Vinicius Santana e Priscila Franca Parigine, esta
  assumindo formalmente a representação em 28/04/2025.'
