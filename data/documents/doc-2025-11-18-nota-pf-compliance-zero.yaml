- src-pf-2025-11-18-compliance-zero
summary: 'Comunicação oficial da PF: deflagração da Operação Compliance Zero em 18/11/2025 com sete mandados
  de prisão e 25 de busca e apreensão no DF, RJ, SP, BA e MG, para combater a emissão de títulos de crédito
  falsos; investigações iniciadas em 2024 a pedido do MPF; suspeita de carteiras de crédito sem lastro
  criadas pelo Banco Master e vendidas ao BRB.'
excerpt: A Polícia Federal deflagrou, nesta quarta-feira (18/11), a Operação Compliance Zero, com o objetivo
  de combater a emissão de títulos de crédito falsos por instituições financeiras que integram o Sistema
  Financeiro Nacional.
