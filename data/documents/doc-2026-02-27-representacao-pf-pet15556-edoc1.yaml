summary: 'Petição inicial de 164 páginas com que a Polícia Federal representou ao STF por prisão preventiva, afastamento
  de função pública e cautelares diversas contra Daniel Vorcaro e outros investigados. Estrutura: seção 2.1 detalha
  corrupção de servidores do Banco Central (Paulo Sérgio Neves de Souza, Belline Santana); seção 2.2 detalha o núcleo
  de intimidação ''A Turma'', liderado por Luiz Phillipi Mourão e Marilson Roseno da Silva, com casos de ameaça,
  invasão de dispositivos, forjamento de documento da Interpol e de ofícios de órgão público.'
