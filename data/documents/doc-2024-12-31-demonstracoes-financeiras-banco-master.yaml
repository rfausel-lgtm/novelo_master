excerpt: As LFs são emitidas em operações pós fixadas entre 115% e 150% do CDI (115% do CDI em 31 de dezembro
  de 2023) e em operações híbridas sendo 100% do IPCA, e taxa prefixada entre 6,5% e 8,35% (6,5% e 8,00%
  em 31 de dezembro de 2023).
