summary: As duas notas que medem a operação. A nota 20 registra o estoque de letras financeiras em R$
  2.110.455 mil, contra R$ 486.487 mil em 2023, com 95,7% do saldo em vencimentos acima de cinco anos,
  e descreve a faixa de taxas praticadas. A nota 21 registra as letras financeiras subordinadas em R$
  962.328 mil, contra R$ 16.976 mil no ano anterior. No mesmo período o estoque de letras de crédito imobiliário
  caiu de R$ 764.526 mil para R$ 181.741 mil — o banco não ampliou a captação por títulos em geral, trocou
  de instrumento.
