summary: 'Uberaba repete, em Minas Gerais, o padrão que a apuração paulista já registrara: o vínculo não fica só
  na administração direta. O Acordo de Cooperação com o município foi publicado em 29/04/2022 e aditado em 26/10/2022,
  com prorrogação publicada em 09/12/2024. A CODAU, companhia municipal de saneamento, abriu inexigibilidade própria
  (nº 15/2023, despacho de 24/08/2023) e celebrou o Convênio de Consignação em Folha nº 02/2023, publicado em 27/09/2023.
  O IPSERV, instituto de previdência dos servidores municipais, firmou termo próprio, publicado em 22/12/2023. São
  três instrumentos distintos, com três signatários distintos, sobre a mesma folha de pagamento municipal — e, no
  caso do instituto, sobre a folha de quem já se aposentou.'
