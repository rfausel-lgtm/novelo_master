title: 'A primeira condenação administrativa localizada: R$ 11.612,70 no Procon de Feira de Santana'
doc_type: administrative_act
date: '2025-12-13'
source_ids:
- src-dom-feira-de-santana-2025-2026-decisoes-do-procon
summary: Decisão do Procon municipal de Feira de Santana, publicada em 13/12/2025 — vinte e cinco dias depois da
  liquidação do Banco Master —, que acolhe a reclamação do processo nº 57613C/2025 e condena a PKL One Participações
  S.A. ao pagamento de penalidade administrativa de R$ 11.612,70, com fundamento no artigo 56, inciso I, e parágrafo
  único do Código de Defesa do Consumidor, determinando ainda sua inclusão no cadastro do artigo 44 do mesmo código.
  É a primeira sanção administrativa contra a operadora localizada na investigação. A empresa não tinha advogado
  constituído nos autos, e a decisão faculta recurso em dez dias úteis; a apuração não localizou recurso nem execução
  da multa. A publicação é uma lista de decisões e não descreve a conduta sancionada — no mesmo lote foram condenados,
  entre outros, o Banco BMG e a Vivo.
