summary: 'Defere o pleito formulado por Daniel Vorcaro na Petição 23612/2026 (e-Docs. 434), "para afastar
  a obrigatoriedade de comparecimento, transmudando-a em facultatividade" à sessão da CPI do Crime
  Organizado de 04/03/2026 — mesma fundamentação (nemo tenetur se detegere, ADPFs 395/444) já aplicada
  a outros investigados convocados pela CPI.'
