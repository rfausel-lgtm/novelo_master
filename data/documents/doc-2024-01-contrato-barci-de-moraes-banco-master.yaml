summary: 'Contrato tornado público na PET 16.662 (STF). Objeto: consultoria e atuação jurídica (compliance,
  due diligence, entre outros) para o Banco Master. Segundo o Poder360, previa R$ 108 milhões líquidos
  em 36 meses (R$ 131,3 milhões brutos). Lido integralmente pela equipe editorial a partir do PDF original:
  o texto extraído não traz os valores, que permanecem atribuídos ao Poder360. Segundo o laudo da PF,
  o contrato foi assinado por Daniel Bueno Vorcaro em 23/01/2024 às 15:15:11 e por Angelo Antonio Ribeiro
  da Silva às 15:35:38 do mesmo dia.'
