title: 'Decisão monocrática — ADPF 1.196/SP, Min. Flávio Dino, 15/09/2026'
date: '2026-09-15'
source_ids:
- src-stf-adpf1196-decisao-15-09-2026-zettel-cortel-mendonca
summary: 'Decisão de 11 páginas na ADPF 1.196/SP que: (i) recapitula os despachos de 24/11/2024, 23/02/2026
  e 07/04/2026 sobre a suspeita de vínculo entre a concessionária Cortel SP e o Banco Master/Banco Máxima
  via Fabiano Zettel; (ii) narra que o Município de SP juntou o Processo Administrativo
  9310.2026/0000600-9 e que há Inquérito Civil 0695.0000483/2025 no MP-SP sobre o tema; (iii) resume
  reportagens sobre a origem do "mercado da morte" do grupo Vorcaro desde 2016 (fundo CARE11/Graveyard
  Death and Care, cemitério da VHR Empreendimentos em Sabará/MG, fundo Brazilian Graveyard and Death Care
  Services com 20% da Cortel, multa da CVM aos irmãos Schumann por insider trading e menção a Vicente
  Conte Neto/Zion Capital); (iv) estabelece a cronologia entre o encontro Mendonça-Vorcaro de 14/03/2025
  (véspera do pedido de vista de Mendonça) e o voto de Mendonça, em 04/04/2025, contra a cautelar de Dino
  sobre preços dos serviços funerários — cautelar que afetava diretamente a Cortel; cita a entrevista de
  02/09/2026 em que Mendonça confirma ter recebido Vorcaro a pedido de membros da Igreja Batista da
  Lagoinha, com Cezinha de Madureira como intermediário; (v) registra que o irmão do ministro, Alexandre
  de Almeida Mendonça, é Secretário-Executivo da SP Regula (promovido em 26/05/2026, após ter sido
  nomeado Superintendente em julho/2024); (vi) registra que o Instituto ITER, fundado por Mendonça e local
  do encontro com Vorcaro, celebrou em 24/09/2025 — dias após o voto de Mendonça — contrato sem licitação
  de R$ 380 mil com a Prefeitura de SP (Termo de Contrato 32/SEGES/2025) e outro, também sem licitação, de
  ~R$ 1,63 milhão com a FDE/SP; (vii) determina diligências à Prefeitura/SP Regula, ao MP-SP e à CVM, e
  remete cópia da decisão ao Min. Fachin para juntada nos autos que apuram a conduta de Mendonça, mediante
  autorização do Plenário. O relator explicita que "não significa afirmar que exista relação causal", mas
  que a "convergência temporal" constitui "quadro indiciário suficientemente relevante" para apuração.'
