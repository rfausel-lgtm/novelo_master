summary: 'Nova busca e apreensão em endereços ligados a Daniel Vorcaro, prisão temporária de Fabiano Campos
  Zettel, busca pessoal em Nelson Tanure e carta de ordem para sequestro de bens requerido pela PGR. A
  leitura integral da decisão (peça 40 da PET 15.198) e da representação da PF que a fundamentou (peça 35)
  acrescenta: a decisão deferiu busca pessoal e apreensão de objetos contra os dois (inclusive celulares),
  mas prisão temporária e apreensão de passaporte/proibição de sair do país apenas para Zettel, até as
  07h00 de 14/01/2026; a PF havia identificado que Zettel tinha passagem para Dubai (voo Emirates EK0262,
  Guarulhos, comprada em 10/01) e Tanure para Curitiba (voo Latam LA3540, Galeão, comprada em 07/01),
  ambas horas antes do prazo de cumprimento das medidas; e a decisão determina que o Diretor-Geral da PF
  explique, em 24 horas, o descumprimento de ordem anterior de 12/01/2026.'
