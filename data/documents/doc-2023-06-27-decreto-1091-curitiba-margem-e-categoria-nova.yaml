summary: 'Se no Paraná estadual não foi preciso abrir porta alguma, na capital o desenho é o do Rio de
  Janeiro e o de Mato Grosso reunidos num só ato: reserva margem de 10% exclusiva para cartão consignado
  de benefício, determina que esses descontos não ficam limitados aos percentuais gerais, cria a categoria
  de consignatária ''empresas administradoras de cartão de crédito/benefício'' e dispensa expressamente
  essa categoria de uma das etapas do credenciamento. Em sentido oposto, exige sede ou filial no município
  — que a empresa mantinha desde agosto de 2021 — e certificado de autorização do Banco Central. Fica
  em aberto se a dispensa alcança essa exigência, porque o texto-base de 2011 não está acessível. O ato
  traz ainda limites de proteção ao consignado: custo efetivo total máximo de 4,5% ao mês, saque limitado
  a 70% do cartão e central de atendimento presencial na cidade.'
