title: Decreto nº 5482-R/2023 (ES) — a margem adicional que veio quase um ano depois da operação
doc_type: legislative_act
date: '2023-08-25'
source_ids:
- src-doe-es-2023-08-25-decreto-5482-r-margem-adicional
summary: 'Espírito Santo repete a fórmula da margem adicional e exclusiva de 10% para cartão consignado
  de benefício, assinada pelo governador José Renato Casagrande. A cronologia, porém, inverte a sequência
  observada em São Paulo e na Bahia: quando o decreto saiu, a operadora já atuava no estado havia quase
  um ano — credenciada não pelo Executivo, mas pela Assembleia Legislativa, em 15/09/2022, e pelo município
  da Serra, em 10/07/2023. A PKL One nunca foi credenciada pelo Executivo capixaba e não consta de nenhuma
  lista de consignatárias do estado; quem entrou por essa porta, em novembro de 2023, foi o Banco Master.'
