summary: Informa a Jaques Wagner e Maria de Fátima Mendonça a transferência de R$ 2.000.000,00 feita pela EC Bahia
  SAF em nome da CFG (Midco), como adiantamento do preço previsto na carta-proposta de 27/02/2025, aceita em 25/04/2025,
  a ser devolvido se as condições suspensivas não se cumprirem. Assinam, pela SAF, o CFO e Raul Aguirre como CEO,
  e, pela CFG (Midco), seu CFO.
excerpt: The Advance Payment has been made by EC Bahia SAF on behalf of CITY FOOTBALL GROUP (MIDCO) LIMITED
