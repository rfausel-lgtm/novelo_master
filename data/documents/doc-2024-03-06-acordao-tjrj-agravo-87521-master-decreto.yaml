source_ids:
- src-tjrj-2024-03-06-acordao-agravo-87521-master
summary: Julgado em que o Banco Master é agravante e no qual o tribunal transcreve integralmente o art.
  6º, III e §1º, do decreto fluminense na redação de 2021 — corroborando a literalidade do dispositivo
  por fonte judicial. O acórdão cita quatro precedentes no mesmo sentido, demonstrando que o banco invocava
  o decreto estadual para afastar o teto de margem em litígios com servidores, e que essa tese prevalecia.
