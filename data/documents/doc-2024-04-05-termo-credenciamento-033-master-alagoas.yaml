summary: 'O documento que a investigação procurava. Preenchido no modelo disponibilizado pelo Ministério
  da Previdência, cuja função é registrar as conclusões da análise feita pelo regime próprio, ele traz,
  no campo de histórico e experiência de atuação, texto de natureza promocional: o banco ''com mais de
  50 anos de história'', unindo ''tradição, solidez e credibilidade'', que se tornou ''digital, ágil e
  moderno'' após a mudança de controle de 2019 e viveu uma ''virada operacional''. No campo de qualificação
  do corpo técnico, uma única frase, sem um nome ou indicador: todos os envolvidos possuiriam as certificações
  necessárias e ''reputação ilibada''. O parecer final é favorável ao credenciamento. Assinam, pelo banco,
  André Kruschewsky Lima e Alberto Felix de Oliveira Neto.'
