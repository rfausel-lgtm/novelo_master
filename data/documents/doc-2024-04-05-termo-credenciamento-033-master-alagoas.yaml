excerpt: É um banco com mais de 50 (cinquenta) anos de história, unindo tradição, solidez e credibilidade
  para entregar soluções personalizadas aos seus clientes. (...) Implementações como essas contribuíram
  para a virada operacional da instituição e superação dos desafios do mercado, dando início a uma nova
  fase de crescimento sólido e gradativo.
