- src-doern-2023-06-01-decreto-32718-margem-cartao-de-beneficio
summary: Conjunto normativo reunido pela equipe a partir da leitura dos diarios oficiais. Pernambuco,
  pelo Decreto 51.760 de 03/11/2021, criou a especie e fixou teto de 48% dos rendimentos brutos, com faixa
  de 8% COMPARTILHADA entre liquidacao de dividas de cartao de credito consignado e amortizacao de despesas
  com cartao de beneficio — nao e margem exclusiva. O Piaui, pela Lei Complementar 280 de 12/07/2023,
  reservou 5% exclusivamente para amortizacao por cartao consignado de beneficio ou para saque, regulamentada
  pelo Decreto 22.415 de 15/09/2023. Sergipe, pela Lei Complementar 413 de 08/04/2024, elevou o teto a
  45% e destinou cinco pontos percentuais ao cartao de credito ou ao cartao consignado de beneficio, ou
  a utilizacao com finalidade de saque. O Rio Grande do Norte, pelo Decreto 32.718 de 31/05/2023, reservou
  10% e admitiu igualmente o saque. O detalhe que atravessa RN, PI e SE e a autorizacao expressa do saque
  — funcionalidade que converte o cartao de beneficio em emprestimo.
