summary: A PF identificou, por sobrevoo de drone comparado a fotos públicas de Instagram de Cláudia
  Resende Soares da Silva (nas quais aparecem Felipe Cançado Vorcaro e Karina Resende Oliveira Vorcaro), um
  imóvel de veraneio no distrito de Trancoso, Porto Seguro (BA), pertencente ou frequentado por Felipe
  Cançado Vorcaro. A PGR concordou com a extensão da busca e apreensão a esse endereço, além do já indicado
  em Nova Lima (MG).
