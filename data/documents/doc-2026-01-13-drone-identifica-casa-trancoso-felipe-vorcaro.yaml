summary: A PF identificou, por sobrevoo de drone comparado a fotos públicas de Instagram de uma
  particular sem qualquer alegação de irregularidade no corpus (identificada nos autos apenas por
  iniciais neste acervo, C.R.S.S.), um imóvel de veraneio no distrito de Trancoso, Porto Seguro (BA),
  pertencente ou frequentado por Felipe Cançado Vorcaro. Nas fotos usadas para a identificação aparece
  também outra particular sem alegação de irregularidade (K.R.O.V.). A PGR concordou com a extensão da
  busca e apreensão a esse endereço, além do já indicado em Nova Lima (MG).
