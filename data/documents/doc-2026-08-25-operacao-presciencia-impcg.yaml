summary: A Polícia Federal deflagrou em 25/08/2026 a Operação Presciência, com seis mandados de busca e apreensão
  e afastamento de sigilo bancário e fiscal, para apurar o investimento de R$ 1,2 milhão do Instituto Municipal
  de Previdência de Campo Grande (IMPCG) em letras financeiras do Master. A origem é um Relatório de Auditoria Direta
  — Letras Financeiras da Coordenação-Geral de Auditoria do Ministério da Previdência Social. O inquérito apura
  gestão temerária, corrupção passiva e corrupção ativa. À época do investimento, abril de 2024, o instituto era
  comandado por Camilla Nascimento — hoje vice-prefeita de Campo Grande e, simultaneamente, secretária municipal
  de Assistência Social —, e viaturas da PF estiveram também na secretaria que ela hoje comanda.
