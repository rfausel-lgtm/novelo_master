summary: Aberto em 11/01/2024 por André Luiz da Silva Miranda, diretor-geral financeiro, com fundamento
  no art. 24 da Lei Municipal 3.280/2014, na Resolução nº 30 de 27/12/2023 e no Edital de Credenciamento
  nº 001/2023 — o mesmo edital que o Tribunal de Contas do Estado apontou não contemplar a categoria de
  instituição financeira bancária emissora, e que portanto não alcançaria o Banco Master. Os autos contêm
  o e-mail do banco remetendo a documentação, as certidões por ele geradas, e o Termo de Análise e Atestado
  de Credenciamento nº 001/2024 em duas versões.
