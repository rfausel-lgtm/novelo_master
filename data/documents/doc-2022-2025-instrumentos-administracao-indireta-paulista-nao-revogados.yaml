id: doc-2022-2025-instrumentos-administracao-indireta-paulista-nao-revogados
kind: document
title: Os instrumentos paulistanos da administração indireta que ninguém revogou
doc_type: contract
date: '2025-04-24'
source_ids:
- src-doc-sp-2022-2025-sfmsp-hspm-iprem-instrumentos-do-grupo
summary: O descredenciamento de agosto de 2026 alcançou a secretaria municipal de gestão, mas não os instrumentos
  firmados por entidades da administração indireta. O serviço funerário municipal autorizou consignação
  em 2023; o hospital do servidor credenciou a operadora para cartão benefício em 2023 e novamente, para
  empréstimo consignado, em março de 2025; e deferiu credenciamento ao próprio banco em abril de 2025,
  sete meses antes da liquidação. Para nenhum deles se localizou ato de revogação. Enquanto isso, a ata
  do conselho deliberativo do instituto de previdência municipal, de janeiro de 2026, registra que os
  descontos seguiam sendo feitos e depositados 'enquanto a situação judicial do banco é regularizada'.
