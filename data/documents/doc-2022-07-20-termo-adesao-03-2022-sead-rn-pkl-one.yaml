summary: 'No Rio Grande do Norte a sequência se inverte de forma nítida: a empresa foi credenciada em
  19/07/2022 e a margem exclusiva de 10% para cartão de benefício só foi criada em 31/05/2023, dez meses
  depois. Dois detalhes merecem registro. O objeto declarado do termo é o ''credenciamento de instituição
  financeira'' — mais um ato oficial, ao lado dos de Mato Grosso do Sul e São Paulo, que enquadra nessa
  categoria uma holding de instituições não financeiras. E o instrumento é assinado, pela empresa, por
  Andrea Lima Novaes, a mesma signatária dos convênios de Mato Grosso do Sul e de Itapissuma.'
