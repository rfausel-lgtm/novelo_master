title: 'Ato do Presidente nº 1.376/2026 do Banco Central: liquidação extrajudicial, por extensão, da Will
  Financeira S.A. CFI'
doc_type: regulatory_record
date: '2026-01-21'
source_ids:
- src-willbank-2026-01-21-ato-presidente-1376
summary: Decreta, 'por extensão' da liquidação extrajudicial do Banco Master S.A. (decretada em 18/11/2025,
  PE 301874), a liquidação extrajudicial da Will Financeira S.A. Crédito, Financiamento e Investimento
  (CNPJ 23.862.762/0001-00), com base no art. 12, caput, XI, 'a', do Regimento Interno do BC (Resolução
  BCB 340/2023) e nos arts. 15, I, 'a', §2º, 16 e 51 da Lei 6.024/1974, por comprometimento da situação
  econômico-financeira, insolvência e vínculo de interesse evidenciado pelo exercício do poder de controle
  do Banco Master. Nomeia liquidante a EFB Regimes Especiais de Empresas Ltda. (CNPJ 43.336.034/0001-64),
  tendo como responsável técnico Eduardo Felix Bianchini. Fixa como termo legal da liquidação extrajudicial
  o dia 24/11/2025. Assinado por Gabriel Muricca Galípolo, com visto de Cristiano Cozer, Procurador-Geral
  do Banco Central.
