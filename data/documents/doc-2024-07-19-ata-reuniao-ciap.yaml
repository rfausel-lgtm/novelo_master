summary: Ata citada e transcrita em trechos pela decisão da 4ª Vara Federal Criminal da SJAP; não lida
  diretamente pela equipe. Registra que, após votos contrários de dois conselheiros, as propostas foram
  aprovadas por maioria dos conselheiros Jackson Rubens, José Milton Gonçalves e Jocildo Lemos, sendo
  que a segunda proposta incluía R$ 100 milhões em letras financeiras do Banco Master condicionados a
  diligência. A ata contém ainda referência a 'ruído de mercado' e ao entendimento de que seria interessante
  aprovar diligência em face desse ruído.
