summary: O Acting Justice Raynard S. Rigby KC, da Suprema Corte da Commonwealth das Bahamas (processo 2026/COM/com/00018),
  reconhece a EFB Regimes Especiais de Empresas Ltda. como representante estrangeira de cinco entidades do conglomerado
  Banco Master — Banco Master S.A., Banco Letsbank S.A., Banco Master de Investimento S.A., Master S/A Corretora
  de Câmbio Títulos e Valores Mobiliários e Banco Master Múltiplo S.A. Citada pelo BRB em petição de 30/06 e 01/07/2026
  para pedir prestação de contas dos administradores dos fundos internacionais e cooperação jurídica internacional.
