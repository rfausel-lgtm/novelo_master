summary: Acórdão da Segunda Turma do STF que referenda, por unanimidade, a decisão do relator André Mendonça de
  decretar prisão preventiva de Daniel Vorcaro, Fabiano Zettel, Luiz Phillipi Mourão e Marilson Roseno da Silva,
  e medidas cautelares diversas contra Paulo Sérgio Neves de Souza, Belline Santana, Leonardo Augusto Furtado Palhares
  e Ana Claudia Queiroz de Paiva, com suspensão das atividades de cinco empresas (Varajo, Moriah, Super, King Participações
  e King Motors). Gilmar Mendes acompanhou com ressalvas, incluindo capítulo próprio sobre vazamentos à imprensa;
  Dias Toffoli declarou suspeição. Sessão virtual de 13 a 20 de março de 2026, acórdão de 23/03/2026.
