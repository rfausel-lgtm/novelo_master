excerpt: A Turma, por unanimidade, referendou a liminar concedida, excetuado apenas o comando destinado ao investigado
  Luiz Phillipi Machado de Moraes Mourão, porque veio a falecer... O Ministro Gilmar Mendes acompanhou o Relator
  com ressalvas. Afirmou suspeição o Ministro Dias Toffoli.
