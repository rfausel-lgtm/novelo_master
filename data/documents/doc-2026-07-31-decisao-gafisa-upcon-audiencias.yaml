summary: Decisão que indeferiu a suspensão do processo até a conclusão do PAS CVM nº 19957.001817/2024-18,
  indeferiu alegação de inépcia da denúncia, manteve a habilitação de assistente de acusação, remeteu
  à 2ª CCR/MPF o pedido de reavaliação da recusa do ANPP a Nelson Tanure (sem efeito suspensivo) e designou
  audiências de instrução para 20/10/2026 e 18/11/2026.
