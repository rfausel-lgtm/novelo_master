summary: 'Transcrição literal e síntese oficial da oitiva de Márcio Domingues dos Santos pelo delegado Albert Paulo
  Sérgio Moura. Ele relata amizade de longa data com o advogado Daniel Monteiro e diz ter deixado, em 16/04/2026,
  os treze ou catorze anos de carreira na indústria do alumínio — onde organizara do zero a fábrica Alussin — para
  prestar, desde fevereiro ou março de 2025, serviços de apoio administrativo, técnico e de informações cadastrais
  ao ''escritório pessoal'' de investimentos de Daniel, faturando pela empresa M QUATTRO à Mytra. Descreve duas
  gestoras que Daniel tentou constituir para administrar os próprios investimentos sem pagar gestora externa — a
  Noctua Asset, assinada por volta de outubro ou novembro de 2025 e dissolvida sem operar, por falta dos dois CGAs
  exigidos pela ANBIMA a partir de janeiro de 2026, e a Excelsior Capital, o mesmo projeto com estrutura menor,
  que também não chegou a obter registro na CVM ou na ANBIMA nem a movimentar recursos. Identifica David Lopes Monteiro
  como irmão de Daniel e como quem de fato controlava as contas e a parte financeira, sendo o interlocutor mais
  frequente porque Daniel era de difícil acesso. Nega qualquer contato com Valério Marega Júnior ou com João Carlos
  Falbo Mansur, de quem só ouvira falar no escritório como ''o dono da REAG''. Sobre os documentos do apartamento
  1.702 do Poème Horto que a representação lhe atribuiu ter recebido de Daniel Monteiro, afirma o oposto: foi ele
  quem enviou os arquivos a Daniel, retirando-os da rede do escritório a pedido dele, e não recorda de quem os havia
  recebido — cogita que tenham vindo de Luiz Lombardi.'
