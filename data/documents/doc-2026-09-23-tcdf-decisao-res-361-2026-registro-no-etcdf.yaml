summary: >-
  Registro público da decisão na ficha do processo no e-TCDF: peça 227, relatora Conselheira Anilcéia Luzia
  Machado, saída do gabinete em 23/09/2026 às 14h32 e inclusão em atos em 23/09/2026 às 17h06; ementa e
  decisão marcadas como sigilosas ("Não disponível para download"); publicação no DODF de 05/10/2026, págs.
  53-54, segundo a ficha. A ficha lista ainda outras seis decisões reservadas no processo, de RES 82/2025
  (10/04/2025) a RES 354/2026 (17/09/2026). O Novelo não leu o inteiro teor da decisão: o registro vale
  apenas pelo que a ficha pública do e-TCDF informa, consultada em 15/10/2026.
