title: Decisão da 2ª Vara Bancária de Campo Grande — 'aparentemente, não é instituição financeira'
doc_type: judicial_decision
date: '2025-09-19'
source_ids:
- src-djems-2025-09-19-decisao-2a-vara-bancaria-pkl-one
summary: 'Decisão que a imprensa citou repetidamente e que o acervo registrava como não localizada. Localizada
  e lida no diário da Justiça, ela é mais contida do que a paráfrase que circulou: o juízo afirma que
  a empresa ''aparentemente, não é instituição financeira regulada pelo Banco Central'' e intima o autor
  a manifestar-se sobre a competência do juízo especializado. A formulação mais forte — a de que a empresa
  não compõe a lista de instituições financeiras — pertence a decisões de 2026 da mesma vara, e atribuí-la
  a esta seria impreciso. Registre-se ainda que há precedente anterior, de 21/05/2025, com afirmação equivalente.'
