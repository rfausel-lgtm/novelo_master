summary: Portaria publicada no Diario Oficial do Amapa designando viagem a Sao Paulo para reunioes tecnicas
  e diligencias junto ao Banco Master, conforme deliberacao da 12a reuniao extraordinaria do CIAP. A comissao
  era composta por Carlos Roberto dos Anjos Oliveira, chefe da Divisao de Investimento e Mercado, e por
  Jose Milton Afonso Goncalves, o proprio membro do comite que propusera as aplicacoes. O relatorio positivo
  destravou o segundo aporte de R$ 100 milhoes.
