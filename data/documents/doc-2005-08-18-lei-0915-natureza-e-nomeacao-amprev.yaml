id: doc-2005-08-18-lei-0915-natureza-e-nomeacao-amprev
kind: document
title: Lei estadual nº 0915/2005, arts. 98 e 101 — natureza jurídica da Amprev e escolha da diretoria
doc_type: legislative_act
date: '2005-08-18'
source_ids:
- src-amprev-lei-0915-2005-consolidada
summary: Dois dispositivos decisivos para entender o nó do Amapá, lidos no texto consolidado publicado
  pela própria Amprev. O art. 98 não define a entidade como autarquia, mas como serviço social autônomo
  de personalidade jurídica de direito privado. O art. 101, §2º (redação da Lei nº 0960/2005), sujeita
  a escolha da Diretoria Executiva à livre nomeação do governador, sem lista tríplice, sabatina, mandato
  fixo ou aprovação de conselho — exigindo apenas formação superior em área jurídica, econômica, contábil
  ou administrativa.
is_official: true
related_entity_ids:
- amapa-previdencia
issuer: Assembleia Legislativa do Estado do Amapá
date_precision: day
url: https://amprev.ap.gov.br/uploads/publico/lei915atualizada.pdf
reference: Lei estadual nº 0915, de 18/08/2005, arts. 98 e 101, §2º
excerpt: Art. 98. A AMAPÁ PREVIDÊNCIA – AMPREV, dotada de personalidade jurídica de direito privado, sem
  fins lucrativos, sob a forma de serviço social autônomo (...) § 2º Os membros da Diretoria Executiva
  serão nomeados livremente pelo Governador do Estado, entre cidadãos que tenham formação superior na
  área jurídica, econômica, contábil ou administrativa.
