summary: >-
  Registra o pedido do Vice-Procurador-Geral da República de levantamento do sigilo de 18 Pets, entre elas a
  15.873; anota que esses processos não guardam relação com o objeto da pauta da sessão extraordinária
  seguinte e afirma não haver impedimento ao levantamento dos sigilos; e, de ofício, determina também o
  levantamento do sigilo de outra lista, com os Inquéritos 5.050 e 5.070 e Pets, entre elas a 15.674. A Pet
  15.978 não consta de nenhuma das listas. O portal público lista como peças baixáveis despachos e decisões;
  o levantamento do sigilo dos autos não equivale à publicação de relatórios ou representações da PF. Hash do
  PDF lido no portal em 16/10/2026.
excerpt: >-
  De todo o modo, entendo não haver impedimento ao levantamento dos correspondentes sigilos.
