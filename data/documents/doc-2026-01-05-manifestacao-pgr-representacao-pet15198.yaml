summary: 'Reconstrói a cronologia processual completa: representação policial (21/10/2025) → manifestação
  favorável parcial da Procuradoria da República em São Paulo (27/10/2025) → pedido de esclarecimentos do
  juízo de origem (24/11/2025) → PF individualiza valores e acrescenta João Carlos Falbo Mansur como alvo,
  a partir de comunicação do Banco Central ao MPF (27/11/2025) → encampação da PR-SP (28/11/2025) →
  suspensão e remessa ao STF por vinculação à Rcl 88.121 (05/12/2025) → pedido de remessa da PGR
  (23/12/2025). Exclui o pedido de prisão preventiva de Daniel Vorcaro, por já substituída por medidas
  cautelares alternativas no HC 1045014-48.2025.4.01.0000. Nota de rodapé individualiza valores de bloqueio
  por pessoa/entidade.'
