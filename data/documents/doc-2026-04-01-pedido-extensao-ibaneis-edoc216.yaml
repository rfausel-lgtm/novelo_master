summary: Petição da defesa do governador do Distrito Federal, Ibaneis Rocha, pedindo ao STF a extensão dos
  efeitos das dispensas já concedidas a outros investigados (Vorcaro, Campos Neto, Paulo Humberto Barbosa,
  irmãos Toffoli, Belline Santana, Paulo Sérgio) para não comparecer à CPI do Crime Organizado. Rebate,
  ponto a ponto, a caracterização da CPI sobre os "dois eixos de investigação" que o envolveriam, confirmando
  a existência de cessões de créditos de honorários a um fundo administrado pela Reag e negando qualquer
  papel operacional nas decisões do BRB sobre o Banco Master.
