issuer: 3ª Vara Cível de Corumbá (TJMS) — juiz Alan Robson de Souza Gonçalves
url: https://esaj.tjms.jus.br/cjpg/
reference: Processo 0801486-79.2025.8.12.0008 — 3ª Vara Cível de Corumbá
excerpt: CONDENAR as requeridas PKL ONE PARTICIPAÇÕES S.A. e BANCO MASTER S.A., solidariamente, à obrigação
  de fazer consistente em limitar os descontos mensais em folha de pagamento do(a) autor(a), a título
  de 'Cartão Benefícios PKL Saque' ou rubrica equivalente, ao patamar máximo de 5% (cinco por cento) de
  sua remuneração bruta mensal consignável
