title: Sentença de Corumbá que condena PKL One e Banco Master solidariamente
doc_type: judicial_decision
date: '2025-09-29'
source_ids:
- src-tjms-2025-09-29-sentenca-corumba-0801486-condena-pkl-master
summary: 'Sentença que rejeita na prática a separação entre a operadora e o banco: condena as duas solidariamente
  à obrigação de limitar a 5% da remuneração bruta consignável os descontos lançados sob a rubrica do
  cartão de benefício. É o tipo de decisão que sustenta, no plano individual, a tese que a via coletiva
  não conseguiu levar adiante no estado.'
is_official: true
