summary: Defere interceptação telefônica e monitoramento de WhatsApp por 15 dias, a partir da efetiva
  implementação, contra dez pessoas dos núcleos "A Turma" e "Os Meninos", como desdobramento da perícia
  dos aparelhos apreendidos em fases anteriores. É a autorização secreta que antecedeu, em dois a três
  dias, as prisões e cautelares patrimoniais da 6ª fase da Compliance Zero (13-14/05/2026).
