title: 'Decisão na Pet 13.428/DF — busca e apreensão contra Cezinha de Madureira (Min. Flávio Dino, 05/09/2026)'
date: '2026-09-05'
source_ids:
- src-stf-pet13428-decisao-dino-05-09-2026
summary: 'Decisão de 27 páginas que acolhe em parte representação da PF: defere busca e apreensão contra o
  deputado Cezinha de Madureira e a sociedade de advocacia de sua esposa, Valéria Rodrigues Linhares, com
  autorização para apreender dinheiro acima de R$ 10 mil e bens de luxo; avoca os procedimentos sobre os
  R$ 510 mil apreendidos em Congonhas (25/08/2026); indefere a busca no gabinete parlamentar por falta de
  "fundadas razões". Registra a delimitação da própria PF de que não são objeto da apuração condutas de
  ministros de tribunais superiores, que aparecem "exclusivamente como destinatários cogitados da influência
  anunciada", e que os crimes investigados (arts. 357 e 332 do Código Penal) são formais — irrelevantes a
  existência real da influência e qualquer adesão do agente público cogitado.'
