summary: 'O credenciamento municipal paulista de maior alcance temporal localizado: assinado em 14/12/2023,
  com sessenta meses de vigência, o que o projeta até dezembro de 2028, e sem nenhum ato que o tenha interrompido.
  A extração integral da edição confirma que a expressão aparece uma única vez em suas 431 páginas. O
  julgamento de habilitação, publicado uma semana antes, traz uma anomalia que merece verificação: duas
  razões sociais distintas figuram deferidas sob o mesmo cadastro nacional de pessoa jurídica. Como um
  cadastro identifica uma única pessoa jurídica, ou há erro material em uma das linhas do diário, ou um
  dos registros foi lançado com número incorreto. A apuração retificou expressamente uma leitura anterior:
  o sufixo do número de processo não vincula as duas empresas entre si, pois é compartilhado com um terceiro
  credenciado alheio ao grupo. Registre-se que o Banco Master também está credenciado no município, por
  chamamento anterior.'
