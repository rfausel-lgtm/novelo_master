title: Decreto nº 46.174/2025 (PB) — reserva integral da margem e isenção de custas para a consignatária
doc_type: legislative_act
date: '2025-01-22'
source_ids:
- src-doepb-2025-01-22-decreto-46174-margem-reserva-integral-e-isencao
summary: 'O desenho mais favorável à consignatária encontrado em toda a apuração, e num estado onde a
  operadora do CredCesta não aparece: quem se credenciou para o produto foi outra empresa, uma instituição
  de pagamento que também consta credenciada no Rio Grande do Norte. Além de reservar 10% da margem, o
  decreto determina que ao solicitar o cartão ''o consignado autoriza que toda a sua margem disponível
  para o produto seja reservada pela Consignatária'', admite parcelamento em até 84 vezes e isenta de
  custas operacionais as instituições de pagamento credenciadas para a rubrica. Traz, em contrapartida,
  proteções ausentes de outros estados: teto de R$ 25,00 para a taxa de emissão, vedação de cartão benefício
  em mais de uma consignatária e exigência de reconhecimento biométrico na contratação.'
