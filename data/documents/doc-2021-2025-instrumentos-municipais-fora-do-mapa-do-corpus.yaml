summary: 'Instrumentos localizados em fonte primária que a investigação ainda não registrara, todos com a operadora
  como consignatária. Cuiabá firmou o Termo de Credenciamento nº 002/2022, publicado em 17/02/2022, por doze meses,
  e o aditou duas vezes, em fevereiro de 2023 e abril de 2024. Florianópolis a credenciou por Portaria nº 1218/2021,
  de 09/07/2021, com base no Decreto nº 22.958/2021. A Serra assinou o Termo nº 001/2023, publicado em 07/08/2023,
  aditado em 27/06/2025. Duque de Caxias a credenciou em julho de 2022, no processo nº 003/001291/2021, com a empresa
  representada pelo mesmo procurador que assina por ela em outros estados. Jaboatão dos Guararapes publicou parceria
  vigente de 24/05/2021 a 24/05/2023. Petrolina publicou o Termo de Convênio nº 002/2021 em 30/12/2021. Taubaté
  autorizou o credenciamento por despacho de 14/08/2023, regido pelo Decreto nº 15.602/23, e publicou em 18/08/2023
  o extrato do convênio assinado em 17/08/2023, que nomeia o produto entre parênteses: ''cartão Credcesta''. Em
  nenhum deles foi localizado ato de rescisão posterior às liquidações.'
