summary: 'Defere tutela incidental/habeas corpus preventivo em favor de José Eugênio e José Carlos Dias
  Toffoli (Petição 20501/2026, e-Doc. 355), dispensando-os de comparecimento compulsório à CPI do Crime
  Organizado por figurarem como investigados no INQ 5.026 — "a própria natureza e justificativa dos
  requerimentos evidencia que os Requerentes foram convocados na condição de investigados, de modo que
  não se pode deles obrigar comparecimento compulsório". Cita os Requerimentos 140/2026 e 161/2026 (José
  Eugênio) e 143/2026 e 160/2026 (José Carlos).'
