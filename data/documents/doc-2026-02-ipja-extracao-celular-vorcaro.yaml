summary: Análise de 126 páginas do conteúdo do iPhone apreendido com Daniel Vorcaro na 1ª fase da
  Compliance Zero. Além dos diálogos com Luiz Phillipi Mourão que sustentam os capítulos já conhecidos
  da investigação, traz as anotações do aplicativo "Notas" do próprio investigado — incluindo a lista
  dos policiais federais que participaram de reunião sigilosa no Banco Central e duas notas apagadas
  minutos após escritas, recuperadas na extração, sobre fontes dentro do Bacen e sobre pressionar as
  cúpulas da PF e da PGR.
