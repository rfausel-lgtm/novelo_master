summary: 'Certidão do que efetivamente ocorreu na sessão: leitura do relatório e questão de ordem de Gilmar Mendes
  para reunir as PET 16.662 e 16.704, redistribuir, certificar os magistrados citados no caso Master com indícios
  de recebimento de valores indevidos e abrir prazo à PGR e a esses juízes; três votos pela questão de ordem (Gilmar,
  Zanin, Moraes) e quatro contra (Fachin, Mendonça, Fux e Cármen Lúcia); impedimento de Nunes Marques; suspeição
  afirmada por Toffoli; vista de Flávio Dino. O mérito — se o Plenário autoriza investigação sobre Alexandre de
  Moraes — não foi votado.'
