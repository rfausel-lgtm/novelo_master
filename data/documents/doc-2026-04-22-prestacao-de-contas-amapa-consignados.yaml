summary: 'Primeira e única prestação de contas localizada nos autos. Cobre o período de novembro de 2025
  a março de 2026 e informa dois montantes: R$ 2.492.222,49 retidos pela Amprev, depositados em conta
  específica no Banco do Brasil, e R$ 5.441.269,38 retidos pela Secretaria de Estado da Administração.
  Total de R$ 7.933.491,87. Os autores sustentam que os valores estão integralmente segregados e comprovados
  por extratos e relatórios anexos.'
