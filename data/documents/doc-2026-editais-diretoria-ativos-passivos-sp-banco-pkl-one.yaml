title: Editais de 2026 da Fazenda paulista que arrolam Banco PKL One entre bancos
doc_type: administrative_act
date: '2026-08-27'
source_ids:
- src-doesp-2026-editais-diretoria-ativos-passivos-banco-pkl-one
summary: Quatro editais publicados em 2026 — n. 11/2026 de 02/04, n. 42/2026 de 14/05, n. 52/2026 de 07/07
  e n. 64/2026 de 27/08 — arrolam a empresa entre bancos sob a denominacao BANCO PKL ONE PARTICIPACOES
  S/A. Repete-se em Sao Paulo, e em serie ao longo de cinco meses, o mesmo equivoco registrado no diario
  oficial de Mato Grosso do Sul em 2023, sobre uma holding de instituicoes nao financeiras que a consulta
  da equipe ao Banco Central confirmou nao constar da relacao de instituicoes autorizadas a funcionar
  no pais.
