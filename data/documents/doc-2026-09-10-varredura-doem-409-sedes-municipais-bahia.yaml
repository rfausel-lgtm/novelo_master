summary: 'Registro do método e dos resultados negativos, que aqui valem tanto quanto os positivos. Foram
  consultadas 409 das 421 sedes municipais baianas, com sete grafias distintas e controle metodológico
  por termos inexistentes, que confirmou tratar-se de busca por token exato. Sete municípios retornaram
  atos com a operadora, e a convergência entre busca por cadastro nacional e por razão social foi total.
  Dois falsos positivos foram identificados e descartados: o termo ''PKL'' isolado retorna 38 municípios,
  quase todos por placas de veículo em editais de infração de trânsito; e a palavra ''Credicesta'' aparece
  em decretos municipais de consignação referindo-se ao programa estadual de 2018, sem menção à operadora.
  Nenhum ato de suspensão, rescisão ou descredenciamento posterior à liquidação do banco foi localizado
  — o ato mais recente em toda a série é de 31/07/2024.'
