summary: 'A íntegra mostra que a decisão vai bem além de suspender dois atos. O dispositivo tem quatro
  itens, e o quarto é o de maior alcance institucional: suspende ''todo e qualquer procedimento que verse
  sobre potencial investigação em face de integrantes deste Supremo Tribunal Federal'', determinando que
  sejam preliminarmente remetidos à Presidência. Na prática, centraliza ali toda apuração contra ministros.
  A decisão também suspende o procedimento de controle externo da atividade policial que a Procuradoria-Geral
  da República havia instaurado para apurar eventual interferência na produção do relatório policial,
  e reserva à Presidência ''poder de cautela e de supervisão da regularidade da tramitação de feitos,
  ainda que já distribuídos''. O diagnóstico é explícito: ''quadro de conflitos e sobreposições processuais
  que configuram grave lesão à ordem pública e à integridade deste Tribunal: decisões monocráticas sucessivas,
  proferidas por integrantes desta Corte em incidentes distintos, mas entrelaçados pelos mesmos fatos
  e autoridades''.'
