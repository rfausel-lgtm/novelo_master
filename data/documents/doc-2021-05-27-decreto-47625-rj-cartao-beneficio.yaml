summary: Decreto que altera o regime de consignações fluminense em dois pontos decisivos. Primeiro, acrescenta
  ao rol de consignatárias o inciso VIII — 'outras entidades consignatárias devidamente autorizadas pelo
  Estado' —, categoria cuja habilitação depende apenas de ato estadual, sem qualquer remissão ao Banco
  Central, ao lado do inciso V que a exige. Segundo, prevê margem de até 20% do valor líquido para cartão
  de benefício e determina, no §1º, que esse cartão não compõe a margem consignável. Não fixa contrapartida,
  prazo, teto de juros nem exclusividade. Cinco dias depois, a PKL One — holding não financeira, sem autorização
  do Banco Central — foi credenciada por despacho da Casa Civil.
