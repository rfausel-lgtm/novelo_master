title: Decreto n. 16.696/2025 (MS) — veda novas consignacoes e revoga a modalidade, preservando contratos
doc_type: legislative_act
date: '2025-11-18'
source_ids:
- src-doems-2025-11-18-decreto-16696-veda-novas-consignacoes
summary: 'Publicado na edicao n. 11.999, no dia seguinte a liquidacao extrajudicial do banco. Veda novas
  consignacoes e revoga a modalidade de cartao de beneficio na folha estadual, mas preserva expressamente
  os contratos existentes — o que e coerente com o fato, ja registrado neste acervo, de que o convenio
  com a operadora seguiu vigente ate 2027 e nunca foi rescindido. Precisao necessaria: parte da cobertura
  atribui a medida ao Decreto n. 16.690/2025; o ato correto e o de numero 16.696, de 17/11/2025.'
