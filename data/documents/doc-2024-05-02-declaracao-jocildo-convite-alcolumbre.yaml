summary: 'Declaração pública do próprio beneficiário da nomeação, reproduzida pelo site institucional
  da autarquia dois meses antes das deliberações de julho de 2024. Descreve uma arquitetura de dois atos:
  a nomeação formal pelo governador e o convite pelo senador. É a peça documental de onde nasce a atribuição
  a Davi Alcolumbre — que o senador nega.'
