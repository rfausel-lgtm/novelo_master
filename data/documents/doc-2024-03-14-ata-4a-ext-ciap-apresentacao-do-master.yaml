title: Ata da 4ª Reunião Extraordinária do CIAP — apresentação do Banco Master à Amprev
doc_type: corporate_record
date: '2024-03-14'
source_ids:
- src-amprev-ata-4a-ext-ciap-2024
summary: Documento mais revelador do caso do Amapá, e inédito na cobertura. Registra que a reunião ocorreu
  'por solicitação' do próprio Banco Master, representado por Paula Vouguinha e Alberto Félix Oliveira.
  A ata recita o histórico da instituição — corretora desde 1974, banco desde 1990, crédito desde 2000,
  'em 2018 sob a nova gestão de Daniel Vorcaro e Augusto Lima', conglomerado em 2021 — e descreve, em
  números, a operação de captação junto a investidores institucionais que o banco montara a partir de
  novembro de 2023. Registra ainda a recomendação do prazo de dez anos e o argumento jurídico, apoiado
  em parecer de escritório, de que o banco não precisaria constar da lista exaustiva da Secretaria de
  Previdência.
