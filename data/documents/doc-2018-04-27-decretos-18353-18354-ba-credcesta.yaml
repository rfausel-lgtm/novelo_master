summary: 'Par de decretos editados dezesseis dias após o leilão e um dia antes da homologação. O 18.353
  mantém o Credicesta ''gerido e operado pela EBAL'' — que já havia sido arrematada —, assegura margem
  de consignação de 30% da remuneração líquida e limita serviços financeiros a metade dessa margem, remetendo
  a contrato específico com o Estado. O 18.354 altera o regime geral de consignações para admitir como
  consignatárias pessoas jurídicas privadas que ofertem serviços creditícios ou financeiros. Verificação
  artigo por artigo pela equipe: nenhum dos dois estabelece prazo de quinze anos nem exclusividade.'
