summary: Publicado na mesma edição e com a mesma data do decreto que nomeou Jocildo Lemos para a Amprev.
  Cargo em comissão, código FGS-4. O Decreto nº 0018, imediatamente anterior, o nomeara vogal titular
  do Colégio da Junta Comercial, em substituição a Helder José Amaral Barbosa Santana. O expediente do
  Diário Oficial de 11/02/2026 ainda o registra como titular da Junta.
