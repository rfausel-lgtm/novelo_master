summary: Decisão que autorizou nova fase da operação, decretou prisão temporária de Felipe Cançado Vorcaro
  e impôs cautelares ao senador Ciro Nogueira e a outros investigados; descreve as suspeitas apresentadas
  pela PF (emenda à PEC 65/2023 sobre o FGC, pagamentos e vantagens).
excerpt: A PF aponta que Ciro Nogueira apresentou uma emenda à Proposta de Emenda à Constituição (PEC)
  65/2023, que ampliava a cobertura do Fundo Garantidor de Crédito (FGC) de R$ 250 mil para R$ 1 milhão
  por depositante. Segundo a investigação, o texto teria sido elaborado pela assessoria do Banco Master
  e entregue ao parlamentar.
