title: 'Decreto nº 45.563/2016 (RJ) — art. 3º, V: consignatária exige autorização do Banco Central'
doc_type: legislative_act
date: '2016-01-27'
source_ids:
- src-sefazrj-decreto-45563-2016-consignacoes
summary: Norma que disciplina as consignações facultativas em folha no Estado do Rio. Seu art. 3º, inciso
  V, condiciona a qualidade de consignatária, para instituições financeiras e administradoras de cartão,
  à detenção de autorização de funcionamento pelo Banco Central. É o dispositivo que o decreto de 2021
  contornaria, ao criar um inciso paralelo sem essa exigência.
