summary: Voto-vogal de 42 páginas no referendo das prisões da Operação Compliance Zero, lido integralmente
  pela equipe. Referenda a prisão de Fabiano Campos Zettel 'por ora', mas dedica capítulo próprio ao pedido
  de prisão domiciliar humanitária formulado pela defesa dele — filho de dois anos e gêmeos por nascer
  em gravidez de risco — reconhecendo que 'a tese de defesa é relevante' e determinando que, concluídas
  as diligências, a substituição por domiciliar 'deve ser reavaliada', com base no art. 318, III, do CPP.
