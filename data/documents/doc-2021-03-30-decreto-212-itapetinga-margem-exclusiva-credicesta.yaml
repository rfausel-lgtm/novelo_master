summary: 'O achado mais direto de toda a expansão, e o que melhor expõe a engenharia. Nos estados, os
  decretos criaram uma categoria genérica — ''cartão de benefício'' — e a operadora entrou depois, por
  credenciamento. Aqui a norma dispensa o rodeio e nomeia o programa privado: do teto de consignações,
  20% cabem a cartão de crédito, ''sendo 15% (quinze por cento) exclusivamente para o cartão de crédito
  previsto no Programa CREDICESTA e 05% (cinco por cento) para os outros cartões''. Três quartos da margem
  de cartão reservados a um programa, e um quarto para todos os concorrentes somados. O decreto é de 30/03/2021;
  o convênio com a operadora seria publicado em 08/07/2021, cerca de três meses depois.'
