summary: 'Resolve a anomalia que a apuração paulista deixara registrada para verificação. No julgamento de habilitação
  do Credenciamento GSA nº 001/2023, publicado em 08/12/2023, oito empresas foram deferidas, e duas delas aparecem
  com o mesmo número de cadastro nacional: ''PKL ONE PARTICIPACOES S.A. 27.490.629/0001-13'' e ''NEO CRÉDITO LTDA
  27.490.629/0001-13''. A consulta à base pública da Receita Federal mostra que as duas empresas existem e são distintas
  — a Neo Crédito é sociedade ativa de Florianópolis, com atividade de administração de cartões de crédito e cadastro
  próprio, 37.788.118/0001-36 —, de modo que o número publicado ao lado do nome da segunda é o da primeira. Em 22/12/2023
  o município publicou errata dos extratos, na fórmula ''onde se lê / leia-se'', mas para corrigir a descrição do
  objeto; o cadastro repetido permaneceu como publicado, e as duas seguem credenciadas pelo mesmo processo, com
  assinatura de 14/12/2023 e sessenta meses de vigência. Nada nos documentos permite dizer se o erro nasceu no requerimento
  da empresa ou na transcrição do município, e nenhum vínculo societário entre a Neo Crédito e o grupo investigado
  foi localizado.'
