summary: Trechos do texto consolidado publicado pelo BC que trazem a marca de redação, inclusão ou revogação
  pela Resolução CMN 5.279, de 22/1/2026, no estatuto (Anexo I) e no regulamento (Anexo II) do FGC. Entre
  eles, o art. 4º, § 1º, III, do estatuto (operações subsidiadas sob critérios de elegibilidade, processo
  competitivo e relato no relatório da administração), o § 2º (dever de manter o BC informado das operações de
  assistência, inclusive das tratativas), o art. 11, parágrafo único, III (divulgação pública de relatórios
  por associada), o art. 35-B (compromisso de indenidade) e, no regulamento, o art. 2º, §§ 10 a 12, e o art.
  3º. O consolidado não mostra a redação anterior nem data de início de vigência própria para essas
  alterações. O texto original da Resolução 5.279 não foi aberto.
excerpt: Redação dada pela Resolução CMN nº 5.279, de 22/1/2026.
