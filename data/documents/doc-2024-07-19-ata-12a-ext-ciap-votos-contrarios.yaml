- src-amprev-ata-12a-ext-ciap-2024
summary: Peça central do caso. Gláucio Bezerra relata ter consultado o Banco Central e verificado que
  a captação total do Master em letras financeiras somava cerca de R$ 680 milhões até abril de 2024, e
  propõe que o comitê peça explicações ao emissor, à Caixa Econômica e ao TCU antes de nova alocação.
  Alexandre Flávio Monteiro sustenta que a diligência deve ser prévia. Jocildo Lemos propõe aprovar condicionando
  a visita posterior, 'sem pedidos de documentos'. José Milton sustenta que a diligência já teria sido
  suprida no credenciamento. A proposta é aprovada por maioria com os votos contrários nominados de Alexandre
  e Gláucio.
