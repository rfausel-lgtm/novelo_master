summary: 'Registro da consulta feita pela equipe, em 09/09/2026, à base pública de instituições em funcionamento
  no país mantida pelo Banco Central. As buscas pelo CNPJ 27.490.629 e pelos termos ''PKL'' e ''CREDCESTA''
  retornaram conjunto vazio em todas as tabelas consultadas — sociedades, bancos comerciais e múltiplos,
  cooperativas e consórcios. Controle metodológico: a mesma consulta com o termo ''BRADESCO'' retornou
  registros, atestando a validade do método. Conclusão: a operadora do CredCesta não consta da relação
  oficial de instituições autorizadas a funcionar pelo Banco Central.'
