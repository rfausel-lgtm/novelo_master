summary: 'Representação de cerca de 100 páginas que fundamenta a constrição de 19/06/2026. Entre outros pontos:
  descreve a Epítome S.A., antes NK 322 Empreendimentos e Participações, cujo capital subiu de R$ 100 para R$ 2.000.100
  em 11/07/2024; transcreve planilha do celular de Daniel Lopes Monteiro com o fluxo "Mansur aporta no Sebastian.
  Sebastian aporta na Pegasus. Mytra emitirá Nota contra a Pegasus"; e registra pagamentos a "Dudu" acima de R$
  2,34 milhões.'
