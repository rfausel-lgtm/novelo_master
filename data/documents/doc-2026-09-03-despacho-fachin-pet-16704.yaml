title: Despacho de Edson Fachin que autua de ofício a PET 16.704 e intima quatro autoridades
doc_type: judicial_decision
date: '2026-09-03'
source_ids:
- src-stf-despacho-fachin-2026-09-03-pet-16704
summary: 'Peça que desloca o eixo da controvérsia: o objeto da apuração não é apenas a conduta do ministro
  citado no relatório, mas a da própria Polícia Federal e a via processual adotada. Os quatro pontos abrangem
  o cumprimento da Lei Orgânica da Magistratura em relação a autoridades com foro; eventuais indícios
  de uso de credenciais de acesso institucional para avaliar documento estritamente particular e de revelação
  de informação sob sigilo judicial a pessoa investigada; as circunstâncias do despacho que determinou
  a identificação das pessoas mencionadas; e as medidas de controle externo da atividade policial.'
