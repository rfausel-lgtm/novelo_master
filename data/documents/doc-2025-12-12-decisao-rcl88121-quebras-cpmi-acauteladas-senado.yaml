summary: 'Nega a liminar de anulação das quebras de sigilo de Daniel Vorcaro e da Moriah Asset aprovadas pela
  CPMI do INSS, mas, "como medida de prudência", manda Banco Central, Receita Federal e empresas telemáticas
  encaminharem as informações "diretamente à Presidência do Senado da República", onde devem permanecer
  "acauteladas até ulterior deliberação desta Suprema Corte", e ratifica as quebras ordenadas pela CPMI e pelo
  juízo da 10ª Vara Federal.'
