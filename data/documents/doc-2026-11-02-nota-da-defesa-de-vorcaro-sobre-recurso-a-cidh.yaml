summary: Nota da defesa, não petição nem documento da CIDH. Segundo a defesa, foram protocolados em 27/10/2026
  na Comissão Interamericana de Direitos Humanos pedido de medida cautelar e petição individual contra o
  Estado brasileiro, que a nota diz registrados sob os números MC-2068-26 e P-2913-26. A defesa invoca artigos
  da Convenção Americana sobre Direitos Humanos e da Convenção Interamericana para Prevenir e Punir a Tortura;
  alega falta de decisão sobre o pedido de liberdade de 18/09/2026, falta da revisão da prisão a cada 90 dias,
  instância única, uso de conversas com advogados em relatórios da PF e vazamentos; e pede liberdade com
  medidas cautelares ou decisão em cinco dias. Data impressa no rodapé, 03/11/2026; divulgação em 02/11/2026.
