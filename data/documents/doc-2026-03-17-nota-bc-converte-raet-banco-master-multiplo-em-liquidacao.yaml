summary: Nota do Banco Central, reproduzida na íntegra por Poder360 e Congresso em Foco. Informa a conversão
  do Raet do Banco Master Múltiplo S.A. em liquidação extrajudicial em 17/03/2026; que o Raet fora decretado
  pelo Ato do Presidente nº 1.370, de 18/11/2025, por 120 dias, com prazo até 18/03/2026; que o relatório do
  administrador, de 12/03/2026, indicou que, com a liquidação da Will Financeira (Ato 1.376, de 21/01/2026),
  não mais subsistiam motivos para o Raet; e que a indisponibilidade de bens de controladores e
  administradores é mantida. A nota não traz o número do ato de 17/03. Íntegra reproduzida por veículos; a
  publicação no DOU não foi verificada.
