excerpt: O Banco Central (BC) decretou nesta terça-feira (17/3) a convolação do Regime de Administração
  Especial Temporária – Raet, do Banco Master Múltiplo S.A. em liquidação extrajudicial. [...] A
  indisponibilidade dos bens dos controladores e dos administradores decorrentes da decretação do Raet é
  mantida com a decretação da liquidação extrajudicial.
