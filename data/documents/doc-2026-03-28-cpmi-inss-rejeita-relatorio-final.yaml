summary: Registro oficial da Agência Senado de que o relatório final da comissão parlamentar mista de
  inquérito sobre o INSS foi rejeitado por 19 votos a 12 e de que a comissão encerrou os trabalhos sem
  relatório aprovado. Os pedidos de indiciamento contidos naquele texto, de relator da oposição, não produziram
  efeito institucional.
