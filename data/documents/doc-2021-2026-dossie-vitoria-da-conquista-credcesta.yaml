- src-dom-vitoria-da-conquista-2023-12-22-suspensao-por-queixas-de-servidores
summary: 'Dossiê municipal mais completo da investigação, e o único que mostra o ciclo inteiro. Em maio
  de 2021 um decreto reserva 20% da margem ''exclusivamente para despesas com as operações de crédito
  realizadas através do Cartão do Programa Credcesta''; em junho vem o convênio, com sessenta meses; em
  maio de 2022 um novo regulamento geral repete a reserva nominal. Em dezembro de 2023 — quase dois anos
  antes da liquidação — a própria prefeitura suspende novas operações do produto após ''reiteradas queixas
  e denúncias'' de servidores e do sindicato. E em fevereiro de 2026, três meses depois da liquidação
  do banco e uma semana antes da de seu sucessor, novo decreto eleva a margem total a 55% e substitui
  a menção nominal ao programa por fórmula genérica — ''cartão de crédito consignado e cartão consignado
  de benefício''. A ressalva importa: o ato de 2026 altera expressamente apenas o caput, sem revogar de
  forma expressa o parágrafo que trazia o nome. O que está documentado é a desnominalização da margem,
  não o descredenciamento da empresa.'
