excerpt: o Conselho Administrativo de Defesa Econômica (“CADE”) aprovou, sem restrições, a operação de
  aquisição, pelo BRB, de ações representativas de 49,0% das ações ordinárias, 100% das ações preferenciais e
  58,04% da participação total do Banco Master S.A.
