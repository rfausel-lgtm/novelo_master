  - src-brb-2025-06-17-fato-relevante-aprovacao-cade-master
summary: Comunicado de uma página ao mercado, nos termos do art. 157, §4º da Lei das S.A. e da Resolução CVM
  nº 44/2021. O BRB informa que o Cade aprovou, sem restrições, a aquisição de 49,0% das ordinárias, 100% das
  preferenciais e 58,04% da participação total do Banco Master, e que a conclusão segue sujeita às demais
  condições precedentes e às aprovações regulatórias pendentes.
