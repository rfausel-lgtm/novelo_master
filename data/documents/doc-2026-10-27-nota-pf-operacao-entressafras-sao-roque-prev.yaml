summary: Nota de imprensa da Comunicação Social da PF em São Paulo. Informa nove mandados de busca e apreensão
  em São Paulo e Pernambuco na Operação Entressafras, sobre possíveis crimes contra o Sistema Financeiro
  Nacional na gestão de recursos do São Roque Prev entre 2022 e 2024, e investimentos de cerca de R$ 100
  milhões. Não nomeia banco, investigados nem juízo. Comunicação institucional, não a decisão judicial que
  autorizou as buscas.
