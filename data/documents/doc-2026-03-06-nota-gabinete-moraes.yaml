excerpt: Análise técnica realizada nos dados telemáticos de Daniel Vorcaro, tornados públicos pela CPMI
  do INSS, constatou que as mensagens de visualização única enviadas por ele no dia 17 de novembro de
  2025 não conferem com os contatos do ministro Alexandre de Moraes nos arquivos apreendidos.
