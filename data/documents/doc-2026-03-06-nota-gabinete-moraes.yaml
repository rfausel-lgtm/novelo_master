summary: 'Nega que Vorcaro tenha enviado mensagens ao ministro em 17/11/2025: ''análise técnica'' nos
  dados tornados públicos pela CPMI do INSS teria constatado que as mensagens de visualização única ''não
  conferem com os contatos do ministro''.'
