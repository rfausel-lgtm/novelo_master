summary: 'Na capital, o desenho é o oposto do estadual e idêntico ao do Rio de Janeiro e ao de Mato Grosso:
  a margem para cartão de benefício é expressamente adicional — ''majorada, adicionalmente, em mais 10%''
  sobre os 30% ordinários, além de até 5% para outra finalidade. Assinado por Ricardo Nunes, é o fundamento
  invocado seis semanas depois no credenciamento da PKL One pela prefeitura.'
