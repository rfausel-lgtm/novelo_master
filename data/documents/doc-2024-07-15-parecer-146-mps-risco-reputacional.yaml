summary: Parecer citado na ata do Conselho Estadual de Previdência; não lido diretamente pela equipe.
  Emitido três dias depois do primeiro aporte de R$ 200 milhões e quatro dias antes do segundo, recomendava
  a avaliação de riscos reputacionais antes de aplicações — enumerando sanções do Banco Central e da CVM,
  investigações, exposição negativa na mídia e estrutura societária.
