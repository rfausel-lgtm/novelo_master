summary: >-
  Nota conjunta da Secretaria de Comunicação do STF e da Coordenação Geral de Comunicação Social da PF sobre a
  audiência de 13/10/2026, solicitada pela PF, entre o presidente do STF, Edson Fachin, e o diretor-geral Andrei
  Rodrigues. Registra que o diretor-geral tratou do Ofício 3467748, de 02/10/2026 (sobre o formato de apresentação
  do material; o Informe não diz quem o expediu), que o presidente esclareceu depender de autorização do Plenário a eventual
  investigação de ministro e que a PF deve encaminhar todas as menções encontradas, sem exceção, com contexto e em
  caráter descritivo; registra ainda a segurança de ministros, a espera pelo pronunciamento da PGR na PET 16.704 e o
  pedido de celeridade no INQ 4781. Não fixa prazo nem nomeia ministros. Sem captura no Wayback; o hash refere-se
  à captura de texto guardada em raw/.
excerpt: a autoridade policial tem o dever de encaminhar todas as menções encontradas sem exceção, acompanhadas de seu contexto, em caráter estritamente descritivo
