title: Termo de Guarulhos — extinto por decurso de prazo, sem ato algum
doc_type: contract
date: '2024-06-11'
source_ids:
- src-dom-guarulhos-2022-2024-termos-cooperacao-pkl-one-e-master
summary: 'Caso que ilustra o desfecho mais comum: o vínculo não foi rompido, apenas expirou. O termo de
  cooperação assinado em 11/06/2024, com vinte e quatro meses, caducou em 11/06/2026 — quase sete meses
  depois da liquidação do banco — sem prorrogação e sem denúncia. Varredura de texto integral em mais
  de dois mil edições não localizou ato posterior. Em março de 2026, entre a liquidação e a caducidade,
  o município publicou três novos termos com outra empresa: substituição de fato, sem que nada tenha sido
  dito sobre a anterior.'
