summary: Declara que os valores devidos no contrato de 2022 são de responsabilidade exclusiva do Banco Master, mas
  que a PKL One, "por mera liberalidade", pagou R$ 3.500.000,00, e dá quitação integral à PKL. O certificado de
  conclusão do DocuSign registra o escritório Monteiro, Rusu, Cameirão e Bercht Advogados como emissor do envelope,
  concluído em 17/10/2025.
excerpt: a PKL, por mera liberalidade, optou por realizar o pagamento do valor de R$ 3.500.000,00
