summary: Documento regulatório publicado pela própria consultoria. Entre as atribuições do departamento
  de contratos e licitações, declara prestar auxílio aos clientes nos processos de credenciamento das
  instituições financeiras e, na linha seguinte, auxílio às instituições financeiras nos processos de
  credenciamento — os dois lados do mesmo procedimento. Registra a incorporação da Plena Consultoria de
  Investimentos em 31/12/2019 e informa 386 clientes que são regimes próprios, de 390 no total.
