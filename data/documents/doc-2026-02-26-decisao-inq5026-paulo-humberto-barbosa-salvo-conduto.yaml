summary: 'Defere tutela incidental/habeas corpus preventivo em favor de Paulo Humberto Barbosa (Petição
  21112/2026, e-Doc. 376), dispensando-o de comparecimento compulsório à CPI do Crime Organizado por
  figurar como investigado no INQ 5.026 — extensão direta, com fundamentação idêntica, da decisão do
  mesmo dia sobre os irmãos Dias Toffoli. A petição de defesa caracteriza o Requerimento nº 145/2026 como
  baseado em suposta "relação ilícita" entre ele e outros convocados — alegação da própria defesa sobre o
  que a CPI teria usado contra ele, não fato apurado.'
