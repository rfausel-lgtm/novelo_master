title: Convenio entre a Prefeitura de Itapissuma e a PKL One — o contrato-padrao do CredCesta
doc_type: contract
date: '2021-09-29'
source_ids:
- src-convenio-itapissuma-2021-credcesta-clausulas-operacionais
summary: 'Instrumento integral disponivel no portal de transparencia municipal, que serve de contrato-padrao
  do produto e revela sua arquitetura. Cabe ao municipio entregar os cartoes aos servidores pelo proprio
  departamento de recursos humanos; os saques sao liberados por instituicao financeira expressamente autorizada
  pela operadora, e nao o contrario; as operacoes nao podem ser canceladas a pedido do servidor sem anuencia
  da empresa; e a carteira de convenios publicos pode ser cedida a terceiros mediante simples aviso ao
  ente conveniado. O convenio e sem onus para o municipio. Assinado digitalmente em 29/09/2021 e publicado
  em 03/11/2021, com assinatura de Andrea Lima Novaes pela empresa. Achado adicional: sua redacao reproduz
  quase literalmente formulas do decreto baiano de 2018, o que indica minuta elaborada pela propria empresa
  e reaproveitada de estado a estado.'
