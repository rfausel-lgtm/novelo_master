summary: >-
  Decisão assinada eletronicamente em 28/09/2026, às 08h41, que defere o pedido de aditamento da União e
  estende a cautelar de 22/09 (Id 6777898) aos Cumprimentos de Sentença 0017910-79.2008.4.01.3400 (Companhia
  Agroindustrial Santa Helena), 0017882-14.2008.4.01.3400 (Agrovale Companhia Agroindustrial Vale do Curu S/A)
  e 0017886-51.2008.4.01.3400 (Borborema Agro Industrial Ltda.), derivados do mesmo título. Determina o
  cancelamento, em cinco dias, de 14 requisições (R$ 1.877.143.674,66 nas datas-base, depositados em
  26/12/2023, na modalidade "Precatório com Alvará") e a restituição com rendimentos; veda levantamentos e a
  expedição ou migração de novas requisições sem certidão de trânsito em julgado; pede informações sobre cada
  requisição em cinco dias; faculta manifestação das beneficiárias em 15 dias; submete a decisão a referendo
  junto com a de 22/09. Registra que a Santa Helena se manifestou contra o pedido (Id 6779871), alegando
  preclusão, e rejeita a alegação. O fato novo apontado pela União é decisão de 23/09/2026 da Presidência do
  TRF-1 na SLS 1010050-92.2026.4.01.0000. O texto não menciona o Banco Master nem Daniel Vorcaro. Hash da cópia
  em PDF hospedada pelo Poder360, lida em 16/10/2026.
excerpt: >-
  "Esta decisão não examina a existência ou a extensão do crédito, nem o cabimento dos recursos interpostos nas
  instâncias judiciais."
