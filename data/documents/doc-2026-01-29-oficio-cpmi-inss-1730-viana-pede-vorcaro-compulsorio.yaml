summary: 'O presidente da CPMI do INSS pede a Dias Toffoli que "determine a compulsoriedade do comparecimento do
  depoente Daniel Bueno Vorcaro", marcado para 05/02/2026, autorize seu transporte a Brasília e transfira a
  custódia à Polícia do Senado no Congresso. Argumenta que as ADPFs 395 e 444 tratam de investigações policiais e
  não alcançam as CPIs, cujo principal meio de apuração é a tomada de depoimentos.'
