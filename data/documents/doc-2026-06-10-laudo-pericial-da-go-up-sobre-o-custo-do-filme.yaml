summary: 'Perícia privada assinada em 10/06/2026, elaborada a pedido de Karina Ferreira da Gama, com base em materiais
  fornecidos por ela, e anexada ao processo sobre o contrato de wi-fi da Prefeitura de São Paulo. É o documento
  a que o senador Flávio Bolsonaro se refere ao dizer que já mostrou a prestação de contas do filme. Aponta custo
  total de produção de US$ 13.393.081,29 (R$ 75.182.282,80 pela taxa adotada), repartido entre US$ 9.664.996,63
  pagos diretamente pelo braço americano da produtora e US$ 3.728.084,66 gastos no Brasil entre 01/06/2025 e 04/06/2026,
  estes cobertos em sua maior parte por repasses da Go Up Entertainment LLC, dos Estados Unidos. Registra ter tido
  acesso ao contrato de investimento do Havengate Development Fund LP, fechado em 24/02/2025, cujo aporte somava,
  até a data do laudo, exatamente o custo total apurado. Afirma ausência de recursos públicos, incentivos ou patrocínio.
  O que não faz: não identifica os fornecedores que receberam da produtora, não apresenta documento fiscal do destino
  dos valores, apresenta apenas categorias gerais de despesa e não discute compatibilidade com o mercado. Não lido
  pela equipe.'
