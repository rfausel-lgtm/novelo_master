summary: Peça que documenta a atuação da mesma vendedora em dois estados. Registra que a pauta única da
  sessão extraordinária era a análise da proposta de credenciamento do Banco Master, e que compareceu
  por videoconferência a representante do banco, Paula Vouguinha — três meses antes de ela apresentar
  a instituição ao comitê da Amapá Previdência. A análise da documentação foi feita verbalmente pelo consultor
  da Sete Capital. Aprovado por oito votos, contra três.
