date: '2025-04-25'
source_ids:
- src-djen-cnj-2025-sentenca-acao-penal-5003557
summary: Sentença que julga a ação penal movida pelo MPF por gestão fraudulenta no Banco Máxima, por fatos
  de novembro de 2014 a março de 2016. Absolve Alberto Maurício Caló, Benjamim Botelho de Almeida, Gustavo
  Cleto Marsiglia e Octavio Pires Vaz Filho com fundamento no art. 386, V, do Código de Processo Penal
  — não existir prova de terem concorrido para a infração —, e condena Saul Dutra Sabbá pelo art. 4º da
  Lei 7.492/86 a três anos de reclusão em regime inicial aberto. Quanto a Botelho, a sentença reconhece
  que ele pode ter atuado nas operações de subscrição de quotas do Fundo Ravena, dada sua participação
  na Foco DTVM e na Aquilla Asset Management, mas assenta que o delito apurado se relaciona ao ato de
  gestão fraudulenta do Banco Máxima, instituição sobre a qual ele não detinha 'qualquer relação de controle,
  administração ou gerência', como exige o art. 25 da Lei 7.492/86.
