excerpt: Posto isso, dou parcial provimento à presente ação penal para absolver, nos termos do inciso
  V do artigo 386 do Código de Processo Penal, os Réus Alberto Mauricio Caló, Benjamim Botelho de Almeida,
  Gustavo Cleto Marsiglia e Octavio Pires Vaz Filho, uma vez que não existem provas de terem eles concorrido
  para a infração penal descrita na denúncia.
