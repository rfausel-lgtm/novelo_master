summary: 'Planilhas trimestrais oficiais publicadas no Portal da Transparência do Distrito Federal, com
  a coluna de veículo subcontratado, baixadas e somadas pela equipe. Resultado para o grupo Metrópoles,
  somados o site e a rádio, em valores brutos: R$ 6,53 milhões em 2022; R$ 11,26 milhões em 2023; R$ 13,08
  milhões em 2024; R$ 17,00 milhões em 2025; R$ 5,72 milhões no primeiro semestre de 2026 — total de R$
  53,58 milhões, de 7% a 10,1% do valor pago pela pasta a todos os veículos. O método é reprodutível e
  o total de controle impresso nas próprias planilhas confere com a soma.'
