summary: 'Ofício da Secretaria de Administração do Estado da Bahia (SEAB), citado em manifestação do MPF
  reproduzida em petição de Augusto Lima no INQ 5.026: em 2025, a Asteba e a Asseba somavam 52.176 e 51.111
  autorizações de desconto em contracheque, respectivamente; mesmo na hipótese mais generosa, o valor máximo
  agregado dessas autorizações giraria em torno de R$ 1 bilhão — muito aquém dos R$ 6,7 bilhões movimentados
  na operação Master-BRB atribuída às duas associações.'
