summary: 'Pernambuco é, depois da Bahia, o estado com maior concentração de instrumentos municipais localizados.
  Dez atos em nove municípios, entre junho de 2021 e novembro de 2024, com vigência padrão de sessenta
  meses. O caso de Aliança é instrutivo: o primeiro convênio foi tornado sem efeito cinco meses depois
  e substituído por outro na mesma semana. O de São Lourenço da Mata é o único em que o instituto de previdência
  municipal firmou instrumento próprio, em novembro de 2024, por cinco anos — já sob a crise do banco.
  Vários dos convênios se fundam em decreto ou lei municipal editados poucos meses antes, repetindo em
  escala local a sequência norma-depois-credenciamento observada nos estados.'
