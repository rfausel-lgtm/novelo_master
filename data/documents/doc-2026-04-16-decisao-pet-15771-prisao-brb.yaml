summary: Decisão que decretou a prisão preventiva de Paulo Henrique Bezerra Rodrigues Costa (ex-presidente
  do BRB) e do advogado Daniel Lopes Monteiro; descreve, segundo os autos, carteiras de crédito de R$
  12,2 bilhões adquiridas pelo BRB apesar de pareceres contrários e negociação estimada em R$ 146 milhões
  em imóveis entre Vorcaro e o então presidente do BRB.
excerpt: Conforme os autos, as operações teriam alcançado R$ 12,2 bilhões em carteiras de crédito supostamente
  irregulares adquiridas pelo BRB, apesar de pareceres técnicos e jurídicos contrários à operação financeira,
  desconsiderados pelo gestor do Banco de Brasília.
