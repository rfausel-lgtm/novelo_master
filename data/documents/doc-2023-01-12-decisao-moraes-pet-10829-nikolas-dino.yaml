summary: Decisão monocrática pública que arquivou, em 12/01/2023, a notícia-crime apresentada pelo deputado
  federal Nikolas Ferreira contra Flávio Dino por omissão diante dos atos de 8 de janeiro de 2023 — um
  dia após o protocolo e no mesmo dia da conclusão ao relator. Dispositivo publicado no Diário de Justiça
  Eletrônico em 16/01/2023; trânsito em julgado em 07/02/2023. É a petição que gerou a prevenção pela
  qual as demais notícias-crime sobre os mesmos fatos foram distribuídas ao mesmo relator, e serve de
  termo de comparação para a disparidade de tratamento processual registrada no acervo.
