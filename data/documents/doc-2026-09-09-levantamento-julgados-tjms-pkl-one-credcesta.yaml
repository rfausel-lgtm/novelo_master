summary: Registro do levantamento feito pela equipe na base pública de julgados do tribunal sul-mato-grossense.
  A série por ano de disponibilização para o termo 'PKL One' é 5 em 2023, 96 em 2024, 216 em 2025 e 114
  nos oito primeiros meses de 2026. O produto foi credenciado no estado em março de 2023. A base indexa
  julgados publicados, e não processos distintos, de modo que os números medem a intensidade do litígio
  e não substituem a contagem jornalística de mais de mil ações; a curva, porém, é o dado. O levantamento
  também não localizou a decisão da 2ª Vara Bancária da capital citada pela imprensa, o que é compatível
  com decisão interlocutória, não indexada.
