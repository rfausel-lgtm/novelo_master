summary: "Decisão de Flávio Dino, relator da ADI 7.791 no STF, em aditamento à decisão interlocutória de
  20/09/2026 (eDOC 190). Com base no relatório do grupo de trabalho da CVM (eDOC 182, 314 processos de 2017 a
  2026), registra que o Processo SEI nº 19957.001206/2022-08, instaurado em 18/02/2022 a partir de comunicação
  formal do FGC com denúncia relativa ao Grupo Master, foi classificado pela área técnica como denúncia
  anônima sem elementos suficientes e arquivado. No dispositivo: (i) requisita à PF a instauração de inquérito
  policial (art. 5º, II, do CPP); (ii) manda a autoridade policial informar o número do inquérito e apresentar
  relatório em 60 dias; (iii) manda a CVM enviar em 72 horas cópia integral do processo; (iv) manda a CVM
  informar, no mesmo prazo, unidades com acesso, agentes responsáveis pela análise e pelo arquivamento, regime
  de sigilo, compartilhamento e providências posteriores; ciência à PGR."
