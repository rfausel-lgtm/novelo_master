date: '2026-09-01'
source_ids:
- src-pgr-2026-09-01-manifestacao-asscrim-1428987-pet-16662
summary: 'Peça que define a posição do Ministério Público e cujo pedido final o acervo registrara de forma
  imprecisa. A tese é de nulidade por vício de método: o relator teria determinado à polícia a investigação
  de pessoa com foro por prerrogativa de função sem provocação do Ministério Público nem iniciativa da
  autoridade policial, em atividade que ''ao juiz não cabe''. Quantifica o foco do relatório: quase 190
  das 218 páginas dedicadas ao ministro. Sustenta que ''compete ao Plenário do Supremo Tribunal Federal
  investigar os seus integrantes'' e que o caminho devido seria dirigir-se ao presidente do tribunal para
  que o Plenário avaliasse previamente. O pedido, porém, não é que o Plenário decida: é que o próprio
  relator reconheça a nulidade e extinga a petição. A peça foi endereçada ao relator e protocolada antes
  de ele remeter o feito ao colegiado.'
