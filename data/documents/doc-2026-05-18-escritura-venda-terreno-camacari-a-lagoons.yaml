summary: Jaques Wagner e Maria de Fátima Mendonça vendem à Lagoons Empreendimentos SPE, representada pelos administradores
  Raul Aguirre Zegarra e Alex Grangeon Trancoso Neves, 4,3844 ha de área de 5,15 ha no lugar Tererê, distrito de
  Abrantes, Camaçari, havida por escritura de 02/03/2000. Preço de R$ 15.834.129,00, dado por quitado mediante nota
  promissória pro soluto com vencimento em 2029. A descrição do perímetro registra confrontação com a "ÁREA DECRETO
  Nº 15.159 DE 28 DE MAIO DE 2014" e com a Fazenda Terere da Traneves Patrimonial.
