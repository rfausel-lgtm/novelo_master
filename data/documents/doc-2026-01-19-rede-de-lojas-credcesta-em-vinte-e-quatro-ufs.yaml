summary: Resolve uma contradição aparente do acervo e fornece uma segunda reconstrução geográfica, independente
  da obtida pelo seletor de convênios. A operadora tinha apenas seis estabelecimentos inscritos no cadastro
  nacional, o que parecia incompatível com presença declarada em vinte e quatro estados. A página de lojas
  mostra rede física de 49 unidades espalhadas por vinte e quatro unidades da federação, com concentração
  na Bahia, no Rio de Janeiro e em São Paulo. A capilaridade, portanto, não vinha de filiais próprias,
  e sim de rede de lojas e de correspondentes bancários — o que é coerente com o convênio-padrão, que
  atribui ao departamento de recursos humanos do ente público a entrega dos cartões.
