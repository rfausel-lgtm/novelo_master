summary: 'O presidente do COAF informa que, em cumprimento a decisão na Reclamação 88.121, dois RIFs — um
  pedido pela CPMI do INSS e um espontâneo — foram compartilhados com o gabinete do ministro Dias Toffoli
  por pasta SEI-C, e pede orientação ao novo relator sobre difundi-los à CPMI, à PF e ao MPF, conforme o
  art. 15 da Lei 9.613/1998.'
