summary: Petição que pede a liberação de verbas de natureza alimentar — subsídio pago por órgão público estadual
  da Bahia e outras remunerações —, invocando o art. 580 do Código de Processo Penal e a identidade de circunstâncias
  com a decisão de 29/07/2026 que desbloqueou os proventos do Senado de Jaques Wagner. Até 17/09/2026 não havia
  vista à PGR nem decisão.
