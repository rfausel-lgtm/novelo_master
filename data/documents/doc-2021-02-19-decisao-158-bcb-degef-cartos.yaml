summary: 'Decisão do Departamento de Gestão de Fundos Garantidores e Gerenciamento de Crises (DEGEF) do
  Banco Central, Processo 165807, que lista como compromitentes de um termo de compromisso a Cartos (sob
  a razão social anterior, Solid Cred), André Seixas Maia, Henrique Peretto e Yim Kyu Lee. Conhecida por
  citação/cabeçalho reproduzido dentro do despacho do MPF que fundamenta o IPL 2025.0087917 — o teor
  integral (natureza das irregularidades, obrigação assumida) não foi lido diretamente.'
