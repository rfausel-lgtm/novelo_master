summary: 'Documento do próprio operador que expõe o incentivo econômico na ponta da venda. A página distingue
  os dois seguros oferecidos com o cartão: o seguro de vida ''não é passível de remuneração para o Correspondente'',
  enquanto o seguro prestamista ''é passível de comissão para o Correspondente'', com ativação no momento
  da contratação. Quem vendia o produto, portanto, era remunerado por um dos seguros e não pelo outro
  — desenho que orienta a oferta e que dialoga diretamente com as reclamações de servidores sobre contratação
  de itens não solicitados. A mesma página registra que o cartão não admitia portabilidade, o que dificultava
  a saída para outra instituição.'
