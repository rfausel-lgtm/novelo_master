title: A camada de consumo passa da Bahia ao Paraná, e continua depois das liquidações
doc_type: official_report
date: '2026-08-08'
source_ids:
- src-procons-2023-2026-reclamacoes-em-jundiai-londrina-taubate-e-outros
summary: 'Trinta edições de oito municípios, entre 03/10/2023 e 08/08/2026, publicam listas de atendimentos de Procon
  com a operadora como fornecedora reclamada — Feira de Santana (BA), Londrina (PR) e, em São Paulo, Campinas, Jundiaí,
  Taubaté, Marília, Barueri e a capital. A classificação predominante é ''fundamentada não atendida'': a reclamação
  foi julgada procedente e a empresa não respondeu. Em sete edições o Banco Master aparece no mesmo registro ou
  no protocolo vizinho, e em Taubaté, em 2023, quem figura ao lado da operadora é o Banco Máxima, nome anterior
  do banco. A camada estende para dois outros estados o que o corpus registrava apenas em Procons paulistas, e não
  se interrompe com as liquidações: dezesseis das trinta edições são posteriores a 18 de novembro de 2025.'
