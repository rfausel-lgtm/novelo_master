summary: Voto da relatora que conclui pela responsabilização de João Carlos Mansur e Rodolfo Turelli, diretor
  presidente e diretor financeiro da REAG Capital Holding S.A., por não fazerem elaborar as demonstrações
  financeiras de 2024 e os ITR do 1º e 2º trimestres de 2025; fixa pena-base de R$ 100.000,00 por infração,
  atenuante de 15% e multa individual de R$ 170.000,00. Registra que as demonstrações de 2024 e o ITR do 1º
  trimestre foram elaborados depois, fora do prazo e sem disponibilização no sistema da CVM, e que o
  cancelamento do registro da companhia não afasta a responsabilidade por infrações anteriores (art. 60 da
  Resolução CVM 80). Trata de infração formal de dever de informação; não relaciona a condenação ao Banco
  Master. O sha256 é o do PDF.
excerpt: voto por condenar João Carlos Mansur e Rodolfo Turelli, na qualidade de diretor presidente e diretor
  financeiro, respectivamente
