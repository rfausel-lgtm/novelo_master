summary: Peça da Polícia Federal, não decisão judicial. É um relatório parcial, assinado por quatro delegados
  da PF em 28/10/2026. Segundo a PF, entre 17/07/2024 e 13/10/2025 o Banco Master cedeu ao BRB ativos de
  crédito de cerca de R$ 17,5 bilhões, dos quais ao menos R$ 12,2 bilhões sem comprovação de existência (p.
  8); a própria PF registra, em nota, que os valores variam entre o laudo da PF, a ação do BRB e os
  documentos do Banco Central, embora diga que convergem na ordem de grandeza. O relatório indicia 15 pessoas com base em dispositivos das Leis 7.492/1986,
  12.850/2013 e 9.613/1998 (p. 697-699). Diz que ainda faltam laudos, a individualização de equipes
  operacionais e outras hipóteses, e pede mais 60 dias (p. 702-703). Indiciamento é ato da polícia; não é
  denúncia nem condenação.
