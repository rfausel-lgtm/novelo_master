title: Portaria SEGER nº 034-R/2025 (ES) — 'atividade privativa de instituição financeira'
doc_type: administrative_act
date: '2025-10-24'
source_ids:
- src-doe-es-2025-10-24-portaria-seger-034-r-atividade-privativa
summary: 'A afirmação normativa mais direta encontrada em todo o acervo sobre a natureza jurídica do produto.
  Um governo estadual declara, em ato publicado, que oferecer e administrar cartão consignado de benefício
  é atividade privativa de instituição financeira e depende de autorização do Banco Central. O peso do
  documento está no contraste: o mesmo estado havia criado, em 2023, a margem adicional de 10% para o
  produto, no mesmo desenho do Rio de Janeiro e de Mato Grosso. Dois anos depois restabeleceu por escrito
  o filtro que o Rio dispensou ao criar categoria autorizada apenas pelo Estado, e que São Paulo e Mato
  Grosso transferiram para o parceiro bancário. A tese de que a operadora não poderia consignar por não
  ser instituição financeira deixa de ser leitura de terceiros e passa a constar de norma estadual vigente.'
