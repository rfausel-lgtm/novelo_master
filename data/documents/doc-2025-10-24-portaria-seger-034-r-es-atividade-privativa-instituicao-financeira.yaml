reference: Portaria SEGER nº 034-R, de 22/10/2025, art. 2º §2º; DOE-ES 24/10/2025, p. 19
excerpt: A oferta e administração de cartão consignado de benefício constituem atividade privativa de
  instituição financeira, sendo obrigatória a autorização do Banco Central do Brasil - BACEN para o seu
  funcionamento.
