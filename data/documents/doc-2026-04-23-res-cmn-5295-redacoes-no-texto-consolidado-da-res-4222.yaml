summary: Trechos do texto consolidado publicado pelo BC marcados como redação ou inclusão, a partir de
  1º/6/2026, pela Resolução CMN 5.295, de 23/4/2026, no art. 2º-A (contribuição adicional) e no art. 2º-B
  (montante alocado em títulos públicos federais). O inciso III do art. 2º-B inclui o Ativo de Referência
  entre os gatilhos da alocação; o § 3º-B traz a fórmula do montante a alocar com fatores crescentes de 0,05
  (a partir de 1º de julho de 2026) a 1 (a partir de 1º de julho de 2028); o § 4º, I, atribui ao BC a forma de
  apuração do Ativo de Referência. O texto original da Resolução 5.295 não foi aberto.
excerpt: Redação dada, a partir de 1º/6/2026, pela Resolução CMN nº 5.295, de 23/4/2026.
