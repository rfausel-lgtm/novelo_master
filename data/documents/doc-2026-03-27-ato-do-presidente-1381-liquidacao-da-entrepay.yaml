summary: Em 27/03/2026 o Banco Central decretou a liquidação extrajudicial da Entrepay Instituição de Pagamento
  S.A., líder do conglomerado, e, por extensão, da Acqio Adquirência e da Octa Sociedade de Crédito Direto. A autarquia
  declarou como motivos o comprometimento da situação econômico-financeira da instituição líder, a infringência
  às normas que disciplinam sua atividade e prejuízos que sujeitam a risco anormal seus credores. Com a medida,
  os bens dos controladores e ex-administradores ficam indisponíveis, e as instituições, por serem de pagamento
  e de crédito direto, não têm captações cobertas pelo Fundo Garantidor de Créditos. A Entrepay é dirigida por Antonio
  Carlos Freixo Júnior desde fevereiro de 2022 — o mesmo empresário que, cinco meses depois, fecharia com a Procuradoria-Geral
  da República a segunda delação do caso Master, sobre as remessas ao fundo que financiou 'Dark Horse'. A liquidação
  está averbada na razão social registrada na Receita Federal, e a instituição não consta mais da base de instituições
  em funcionamento do Banco Central. O ato em si não foi lido pela equipe.
