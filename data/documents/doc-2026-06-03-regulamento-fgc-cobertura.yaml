id: doc-2026-06-03-regulamento-fgc-cobertura
kind: document
title: Regulamento do FGC, art. 2º e § 1º — o que é coberto e quem está excluído
doc_type: regulatory_record
date: '2026-06-03'
source_ids:
- src-fgc-regulamento-2026-06-03
summary: 'Anexo II à Resolução CMN 4.222/2013, lido integralmente. Duas conclusões independentes e cumulativas
  para o caso da Amprev: a letra financeira não integra o rol taxativo de instrumentos cobertos — a expressão
  não aparece uma única vez no regulamento —, e os créditos de titularidade de regimes próprios de previdência
  social estão expressamente excluídos da garantia ordinária.'
is_official: true
related_entity_ids:
- fundo-garantidor-de-creditos
- amapa-previdencia
- banco-master
issuer: Fundo Garantidor de Créditos / Conselho Monetário Nacional
date_precision: day
url: https://www.fgc.org.br/documents/52555/52623/Regulamento+FGC_20260603.pdf
reference: Regulamento do FGC, art. 2º, § 1º, V, 'a'
excerpt: '§ 1º Não são cobertos pela garantia ordinária: (...) V - os créditos: a) de titularidade de
  instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil,
  de entidades de previdência complementar e de regimes próprios de previdência social instituídos pela
  União, Estados, Distrito Federal e Municípios'
