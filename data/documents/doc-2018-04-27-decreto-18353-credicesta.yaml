url: http://www.legislabahia.ba.gov.br/documentos/decreto-no-18353-de-27-de-abril-de-2018
reference: Decreto estadual nº 18.353, de 27/04/2018
excerpt: Ao detentor dos direitos de exploração comercial relativos ao Cartão do Programa Credicesta é
  assegurado modificar, ampliar, aperfeiçoar ou diversificar as funcionalidades do cartão referido, a
  este podendo associar a ampliação da rede de compras e a contratação de serviços, inclusive comerciais,
  creditícios, financeiros, securitários e congêneres.
