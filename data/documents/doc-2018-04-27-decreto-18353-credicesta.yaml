id: doc-2018-04-27-decreto-18353-credicesta
kind: document
title: Decreto nº 18.353/2018 — estrutura o Programa Credicesta como plataforma de consignação
doc_type: legislative_act
date: '2018-04-27'
source_ids:
- src-doe-ba-decreto-18353-2018
summary: Assegura ao detentor privado dos direitos de exploração comercial do cartão a faculdade de diversificar
  suas funcionalidades para serviços creditícios, financeiros e securitários, com margem de consignação
  de 30% da remuneração líquida, e estabelece que o Estado não incorrerá em custo. Assinado dezesseis
  dias após o leilão da EBAL.
is_official: true
