summary: 'Despacho proferido na PET 16.704 (aberta de ofício por Fachin em 03/09/2026), determinando: tendo em vista
  a inclusão da PET 16.662 em calendário de julgamento da sessão extraordinária de 15/09/2026, e considerando que
  a PET 16.662 foi formada a partir da PET 15.556, solicita-se ao ministro André Mendonça, relator da PET 15.556,
  a remessa em HD próprio à Presidência e aos Gabinetes de todos os ministros de todos os procedimentos contidos
  ou relacionados à PET 15.556, bem como o levantamento do sigilo dela e dos procedimentos nela contidos ou a ela
  relacionados — ressalvado apenas o que diga respeito a diligências cujo sigilo seja imprescindível à sua realização.'
