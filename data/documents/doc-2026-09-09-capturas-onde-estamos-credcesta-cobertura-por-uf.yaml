summary: 'Fecha uma lacuna que o acervo carregava desde o início: a lista dos estados onde o CredCesta
  operou nunca foi divulgada, mas o próprio site a expunha. O seletor ''Convênios Atendidos'' listava
  apenas as unidades da federação com convênio ativo, e duas capturas foram recuperadas e lidas diretamente
  pela equipe. Em 24/05/2022 havia doze: AM, AP, BA, GO, MA, MS, PA, PE, PR, RJ, SC e SE. Em 21/02/2024
  já eram 21 mais a entrada federal ''BR'': acrescentam-se ES, MG, MT, PB, PI, RN, RO, SP e TO. Permaneciam
  ausentes AC, AL, CE, DF, RR e RS. A lista tem um limite importante: mede convênios do produto, não da
  PKL One — no Amapá, por exemplo, a operadora foi expressamente inabilitada em 2023 e quem se habilitou
  foi o Banco Master.'
