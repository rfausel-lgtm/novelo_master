summary: 'Conjunto de Termos de Apreensão e relatórios de diligência da PF sobre os bens arrecadados em cada endereço
  de busca da 3ª fase: dinheiro em espécie, joias e relógios de luxo com Fabiano Zettel; uma nota promissória de
  R$ 200 mil avalizada por Henrique Vorcaro, Aline Bueno Ribeiro Vorcaro e Daniel Vorcaro, apreendida na casa de
  Zettel; uma cédula de crédito bancário rural vinculada a Marilson Roseno da Silva; uma nota fiscal de veículo
  em nome de Ana Cláudia Queiroz de Paiva; e documentos diversos na residência de Luiz Phillipi Mourão, entre eles
  um cheque cancelado de R$ 1.802.200,00 nominal a um ''Antônio Mansur'' não identificado no material.'
