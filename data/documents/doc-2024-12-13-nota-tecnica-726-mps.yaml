reference: Nota Técnica SEI nº 726/2024/MPS
excerpt: As instituições financeiras não atendem aos requisitos estipulados no art. 21, § 2º, inciso I,
  da Resolução CMN nº 4.963/2021, apenas pelo fato de pertencerem a conglomerados prudenciais liderados
  por instituições que cumprem esses requisitos.
