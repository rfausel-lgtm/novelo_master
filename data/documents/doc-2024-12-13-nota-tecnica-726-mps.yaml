title: Nota Técnica SEI nº 726/2024/MPS — pertencer a conglomerado não torna o emissor elegível
doc_type: official_report
date: '2024-12-13'
source_ids:
- src-mps-nota-tecnica-726-2024
summary: Rejeita formalmente a tese de que uma instituição bancária se torne elegível a captar recursos
  de regimes próprios por pertencer a conglomerado prudencial liderado por instituição que cumpre os requisitos.
  Fixa que cada entidade deve cumpri-los individualmente e que a responsabilidade de certificar-se disso
  é dos gestores do regime próprio.
is_official: true
related_entity_ids:
- banco-master
issuer: Departamento dos Regimes de Previdência no Serviço Público / Ministério da Previdência Social
date_precision: day
