summary: 'Defere representação da PF e determina constrição patrimonial de 27 alvos: até R$ 5.955.250 (soma dos
  eixos Poème Horto e BN Financeira) para Andréa Lima Novaes, Augusto Ferreira Lima, BN Financeira, BN Representações
  Tecnológicas, Daniel e David Lopes Monteiro, Eduardo e Guilherme Sodré Martins, Gavazza Empreendimentos, GF4.15
  Participações e Consultoria, Jaques Wagner, João Carlos Falbo Mansur, PKL One, REAG Administradora de Recursos,
  Sodré Martins Serviços Administrativos e Terra Firme da Bahia; até R$ 3.500.000 para Bonnie e Patrich Toaldo Bonilha
  e Moisés Dantas dos Santos; até R$ 2.455.250 para André Pissolito Campos, Epítome S.A., Hockenheim FIP, Luiz Antônio
  Lombardi, Márcio Domingues dos Santos, Valério Marega Júnior, WNT Gestora e WNT Capital DTVM. Decreta ainda a
  indisponibilidade da unidade 1.702 do Poème Horto.'
excerpt: o valor global mínimo deve perfazer a importância de R$ 5.955.250,00, correspondente à soma dos referidos
  eixos
