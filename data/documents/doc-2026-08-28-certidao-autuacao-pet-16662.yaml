summary: 'Certidão que documenta o nascimento do processo autônomo: a e-Pet 16.662 foi autuada em 28/08/2026
  às 14h18 e distribuída às 14h50 ao ministro André Mendonça por prevenção (RISTF, art. 69, caput), tendo
  como processo justificador a PET 15.556. Assunto registrado: Direito Processual Penal / Investigação
  Penal. Requerente, advogados e autoridade policial constam ''sob sigilo''. Lido integralmente pela equipe
  editorial.'
