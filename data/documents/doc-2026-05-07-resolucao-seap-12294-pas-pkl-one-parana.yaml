title: Resolução SEAP nº 12.294/2026 (PR) — processo sancionatório contra a PKL One por cobrança indevida
doc_type: administrative_act
date: '2026-05-07'
source_ids:
- src-dioe-pr-2026-05-07-resolucao-seap-12294-pas-pkl-one
summary: 'Primeira apuração formal e publicada de um ente estadual contra a operadora, identificando nominalmente
  o produto. Imputa cobrança indevida ao consignado e conduta em prejuízo do consignado e da administração,
  com base em dispositivos que obrigam a devolver em cinco dias úteis valores cobrados a maior e a oferecer
  forma alternativa de pagamento quando o desconto é suspenso — precisamente o que se alega não ter ocorrido
  quando os descontos pararam. Ressalva necessária: no dia seguinte foi instaurado processo idêntico contra
  outro cartão de benefício, de modo que a medida integra uma leva de fiscalização e não é ato isolado
  dirigido à empresa.'
