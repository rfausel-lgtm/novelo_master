summary: 'Conjunto documental reunido pela varredura das sedes municipais baianas. Sete municípios firmaram
  instrumentos com a operadora, todos localizados em PDF de diário oficial com o cadastro nacional conferido:
  Senhor do Bonfim, com convênio assinado em 21/08/2020 e vigência até 21/08/2025 — o mais antigo desta
  varredura; Alagoinhas, em 09/02/2021, com segundo convênio em 31/07/2024; Juazeiro, em 12/03/2021, onde
  também a companhia estatal municipal de trânsito firmou termo próprio em 08/06/2021; Jacobina, com dois
  instrumentos, em março e em 13/11/2021; Itapetinga, publicado em 08/07/2021; Barra do Choça, assinado
  digitalmente em 24/11/2021, com as onze páginas do termo publicadas na íntegra; e Alcobaça, publicado
  em 31/03/2022. A vigência padrão é de sessenta meses improrrogáveis, e os mesmos dois representantes
  assinam pela empresa em vários deles — os mesmos que subscrevem os instrumentos de Itapissuma, de Mato
  Grosso do Sul e do Rio Grande do Norte.'
