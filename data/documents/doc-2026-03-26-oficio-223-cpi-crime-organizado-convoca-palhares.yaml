date: '2026-03-26'
source_ids:
- src-senado-2026-03-26-oficio-223-cpi-convoca-palhares
summary: Peça oficial que convoca Leonardo Augusto Furtado Palhares a depor em 01/04/2026. O requerimento
  que a fundamenta, do senador Alessandro Vieira, descreve a organização investigada em quatro núcleos
  e sustenta que a atuação de Palhares vai além da formalização documental pontual. A reunião foi cancelada,
  sem motivo divulgado pela presidência da comissão, e ele nunca depôs; o relatório final da CPI foi rejeitado
  em 14/04/2026.
