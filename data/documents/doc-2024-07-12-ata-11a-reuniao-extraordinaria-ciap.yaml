summary: Ata citada e transcrita em trechos pela decisão da 4ª Vara Federal Criminal da SJAP; não lida
  diretamente pela equipe. Registra que 'o coordenador Jocildo Silva Lemos deu início à reunião', que
  'o conselheiro José Milton Gonçalves propôs' a alocação em letras financeiras do Banco Master com vencimento
  em 10 anos e taxa de IPCA + 8,35% ao ano, e a aprovação por unanimidade do bloco deliberativo que incluiu
  R$ 200.000.000,00 no Banco Master.
