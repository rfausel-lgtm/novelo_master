summary: A construtora informa que a unidade 1.702 foi liberada por rescisão do primeiro comprador em 20/12/2024
  e vendida em 27/12/2024 à Epítome S.A., representada por Luiz Antônio Lombardi, por R$ 2.455.250,00 à vista. A
  proposta de reserva registra valor de tabela de R$ 2.827.000,00, com desconto de 10% e mais 3,5% de desconto da
  comissão. Os e-mails da personalização da unidade (out/2025 a fev/2026) foram dirigidos a "David Monteiro" e respondidos
  com a assinatura de Lombardi, que em 10/02/2026 pediu à construtora para "não copiar nenhum e-mail do David".
