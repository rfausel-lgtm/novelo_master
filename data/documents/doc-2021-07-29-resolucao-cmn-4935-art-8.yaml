reference: Resolução CMN nº 4.935/2021, art. 8º
excerpt: Depende de prévia autorização do Banco Central do Brasil a celebração de contrato de correspondente
  com entidade não integrante do Sistema Financeiro Nacional (SFN) cuja denominação ou nome fantasia empregue
  termos característicos das denominações das instituições do SFN.
