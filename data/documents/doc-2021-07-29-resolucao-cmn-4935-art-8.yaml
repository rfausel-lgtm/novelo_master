title: Resolução CMN nº 4.935/2021, art. 8º — autorização prévia para contratar correspondente fora do
  SFN
doc_type: legislative_act
date: '2021-07-29'
source_ids:
- src-bcb-resolucao-cmn-4935-2021-art-8
summary: Norma vigente durante todo o período do contrato entre o Banco Master e a BN Financeira. O art.
  8º exigia autorização prévia do Banco Central para a celebração de contrato de correspondente com entidade
  não integrante do Sistema Financeiro Nacional cuja denominação ou nome fantasia empregasse termos característicos
  das denominações das instituições do SFN — hipótese em que a BN/BK Financeira se enquadra. O dispositivo
  foi revogado pela Resolução Conjunta nº 17, de 28/11/2025.
