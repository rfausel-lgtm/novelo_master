date: '2026-02-10'
source_ids:
- src-jornalmg-2026-descredenciamento-banco-master-recadastramento
summary: 'Processo instaurado em janeiro de 2026 e concluído em fevereiro, com o descredenciamento do
  banco da folha mineira. Convém registrar o fundamento com precisão, porque ele contraria uma leitura
  fácil: não se trata de sanção por irregularidade no produto nem de revisão do credenciamento, e sim
  de omissão em apresentar documentação de recadastramento. É o desfecho mais prosaico entre os estados
  examinados.'
