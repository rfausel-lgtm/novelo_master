title: Voto condutor do Acórdão nº 26.458/2026 do TCE-RJ sobre o credenciamento do Master em Itaguaí
doc_type: judicial_decision
date: '2026-08-06'
source_ids:
- src-tcerj-voto-acordao-26458-2026
summary: Voto de 56 páginas que examina o processo de credenciamento peça a peça e conclui que o termo
  foi integralmente preenchido pelo próprio Banco Master, que toda a documentação comprobatória da aptidão
  da instituição era formada unicamente por certidões e relatórios gerados e enviados pelo próprio banco,
  e que a análise se deu em menos de dois dias úteis. Registra que o edital de credenciamento vigente
  sequer contemplava a categoria de instituição emissora, que o banco não constava da lista exaustiva
  do Ministério da Previdência e que seu rating era inferior ao mínimo exigido pelo regimento do comitê
  — restrições depois removidas por resolução com efeitos retroativos.
