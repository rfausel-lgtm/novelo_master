summary: 'Relatório de 218 páginas, destinado ao ministro André Mendonça e datado de 27/08/2026, com a
  análise do iPhone apreendido de Daniel Vorcaro (Laudo 4281/2025-SETEC/SR/PF/SP). Documenta mensagens
  e arquivos: compartilhamento, por Fábio Faria, de contato salvo como ''Alexandre de Moraes BRASILIA''
  em 26/12/2023; tratativas e cobranças sobre o contrato com o escritório Barci de Moraes; mensagens de
  visualização única enviadas ao contato em 17/11/2025; pesquisas por termos ''Paulo Gonet'' e ''Andrei
  Passos''. Tornado público com o levantamento do sigilo da PET 16.662 em 01/09/2026. Lido parcialmente
  (cabeçalho e trechos-chave) pela equipe editorial.'
