summary: 'Relatório de 218 páginas, destinado ao ministro André Mendonça e datado de 27/08/2026, com a
  análise do iPhone 17 Pro apreendido de Daniel Vorcaro em 18/11/2025 (Termo de Apreensão 4473731/2025;
  extração no Laudo 4281/2025-SETEC/SR/PF/SP). Produzido pela NADIP/DFIN/CGRC/DICOR em prazo de 72 horas
  e assinado por três agentes e quatro delegados de Polícia Federal. A perícia não recuperou o conteúdo
  das mensagens: correlacionou logs do sistema, registros de uso de aplicativos e PDFs residuais para
  demonstrar que textos escritos no aplicativo Notas eram fotografados e enviados por WhatsApp a um destinatário
  determinado. Documenta o compartilhamento, por Fábio Faria, de contato salvo como ''Alexandre de Moraes
  BRASILIA'' em 26/12/2023; a assinatura do primeiro contrato com o escritório Barci de Moraes em 23/01/2024;
  cobranças de pagamento; o segundo contrato, com a Viking; a adoção de mensagens temporárias de 24 horas
  pelo contato em 17/09/2025; cinco mensagens de visualização única em 17/11/2025; e pesquisas por termos
  relacionados a ''Paulo Gonet'' e ''Andrei Passos''. O documento traz duas ressalvas próprias: não é
  exaustivo, dado o prazo de 72 horas, e não houve atos de aprofundamento investigativo dirigidos a magistrados
  ou a membros do Ministério Público — não há imputação de crime. Traz quatro anexos: os dois contratos,
  o termo de dação em pagamento e a íntegra das conversas com o contato. Lido integralmente pela equipe
  editorial a partir do PDF original. Contagem e classificação feitas pela equipe: 109 menções a ''Moraes'',
  sendo 51 ao ministro ou ao contato salvo e 58 ao escritório; zero menções a ''Alcolumbre''. O conteúdo
  das 52 notas existe apenas como captura de tela de baixa resolução — apenas três, requisitadas judicialmente,
  têm teor parcialmente transcrito no corpo do relatório; as demais não são transcritíveis com confiabilidade.
  Os quatro anexos foram obtidos pelo editor nos autos e lidos pela equipe: os dois contratos com o escritório
  Barci de Moraes, o termo de dação em pagamento e a íntegra das conversas.'
