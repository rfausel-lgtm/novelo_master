title: 'Voto no PAS CVM 19957.013886/2022-02 — compras de cotas do CARE11 pela Cortel (25/11/2025)'
date: '2025-11-25'
source_ids:
- src-cvm-pas-19957-013886-2022-02-voto-cortel-schumann
summary: 'Voto da Diretora Relatora Marina Copola, acompanhado pelo presidente em exercício: condena Roberto e
  Marcio Schumann por prática não equitativa (multas de R$ 2.127.992,80 e R$ 54.048,02, equivalentes a duas
  vezes e meia os ganhos atualizados obtidos com informação sobre as compras da Cortel até maio de 2022 — R$
  471.904,93 do próprio Roberto e R$ 265.717,32 obtidos em nome de Priscila Oliveira Gomes, sua companheira, e
  R$ 18.734,57 de Marcio); absolve Priscila Gomes de toda imputação, por falta de prova de que soubesse ou
  autorizasse as ordens feitas em seu nome; absolve a Cortel e Roberto Schumann da acusação de manipulação de
  preços — não por ausência de indícios (a relatora reconhece "sinais que permitem cogitar a consumação do
  ilícito"), mas por dúvida razoável resolvida em favor dos acusados, e reconhecendo que o conselho de
  administração da Cortel contratou parecer jurídico externo antes de aprovar a estratégia e acompanhou a
  execução com reportes periódicos; absolve Roberto da acusação de operação fraudulenta, por entender que o
  uso da conta de Priscila, mesmo se configurasse ardil, seria só acessório à prática não equitativa já
  punida, não fraude autônoma voltada a vantagem própria; determina comunicação ao MPF-RS.'
