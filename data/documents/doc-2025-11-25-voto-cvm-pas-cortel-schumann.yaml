title: 'Voto no PAS CVM 19957.013886/2022-02 — compras de cotas do CARE11 pela Cortel (25/11/2025)'
date: '2025-11-25'
source_ids:
- src-cvm-pas-19957-013886-2022-02-voto-cortel-schumann
summary: 'Voto da Diretora Relatora Marina Copola, acompanhado pelo presidente em exercício: condena Roberto e
  Marcio Schumann por prática não equitativa (multas de R$ 2.127.992,80 e R$ 54.048,02, equivalentes a duas
  vezes e meia os ganhos atualizados obtidos com informação sobre as compras da Cortel até maio de 2022);
  absolve a Cortel e Roberto Schumann da acusação de manipulação de preços, reconhecendo que o conselho de
  administração acompanhou a operação e que as compras miravam posição abaixo do valor patrimonial da cota;
  absolve Roberto da acusação de operação fraudulenta; determina comunicação ao MPF.'
