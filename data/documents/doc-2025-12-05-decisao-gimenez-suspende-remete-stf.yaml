source_ids:
- src-stf-pet15198-peca012-pedido-prisao-preventiva-5009071
summary: O juiz federal Décio Gabriel Gimenez suspende a apreciação do Pedido de Prisão Preventiva n.
  5009071-26.2025.4.03.6181 "em cumprimento ao determinado pelo STF na Reclamação nº 88.121-DF", até
  definição do juízo competente para atuar como juiz de garantias — citando, como fonte dessa decisão do
  STF, reportagem do Poder360, não comunicação institucional direta. O MPF, em manifestação final de
  23/12/2025, reconhece "ausência de conexão entre as investigações" mas pede a remessa vinculada à PET
  15.198 apenas por cautela de sigilo.
