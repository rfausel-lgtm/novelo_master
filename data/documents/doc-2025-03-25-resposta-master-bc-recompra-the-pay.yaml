summary: 'Carta do Banco Master ao Banco Central (Ofício 7062/2025-BCB/DESUP), assinada por Angelo Ribeiro
  da Silva e Luiz Bull, relacionando cessões de carteira originadas por terceiros ao BRB e detalhando três
  recompras (12/02, 19/02 e 27/02/2025) — a primeira motivada por reclamações de clientes de carteira
  originada pela The-Pay Soluções de Pagamentos Ltda, as demais por análise de risco solicitada pelo próprio
  BRB. O Master informou o valor recomprado da The-Pay em cerca de R$ 303 milhões — muito inferior aos R$
  1,7 bilhão que o próprio Banco Central, em ofício posterior (agosto/2025), atribuiria à mesma operação.'
