summary: Primeiro ato de governo a preencher a direção da previdência estadual, publicado no Diário Oficial
  de 03/01/2023 e lido pela equipe. Cargo em comissão, código FGS-4, com efeitos a contar de 1º de janeiro
  de 2023. Na mesma edição e com a mesma data, os Decretos nº 0018 e nº 0019 nomeiam Alberto Samuel Alcolumbre
