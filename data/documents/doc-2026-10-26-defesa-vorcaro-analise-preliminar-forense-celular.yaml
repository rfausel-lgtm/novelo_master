summary: Documento de parte, não perícia oficial nem decisão. Segundo o assistente técnico da defesa, o
  material recebido da equipe de defesa (arquivos fornecidos pelo STF, segundo o Poder360, com relatório UFDR, visualizador e processamento IPED 4.2.2, sem os arquivos
  brutos da coleta) não permite verificar a integridade e a integralidade do que foi extraído do iPhone
  apreendido em 17/11/2025; o laudo da PF não informa a versão do GrayKey; o termo de apreensão não descreve
  elementos de identificação dos aparelhos nem os lacres; e há 657 arquivos com registro de modificação em
  18/11/2025 e 999 entre 18/11/2025 e 14/05/2026 (os 657 estão entre os 999), além de 94 imagens HEIC com
  registro de criação posterior à apreensão. No mesmo documento, o perito escreve que não é tecnicamente
  possível atribuir essas alterações a uma ação humana deliberada (sem que isso, para ele, autorize
  classificá-las como inofensivas), que suas conclusões não implicam juízo
  sobre autoria e que a diferença entre versões do IPED não indica, por si, erro ou adulteração; segundo o Poder360, o laudo não comprova que o material tenha
  sido adulterado.
excerpt: Elas se restringem à matéria técnica e não implicam
