summary: 'Segunda decisão do presidente do Supremo no mesmo dia, e a mais direta sobre o choque entre
  ministros. Suspende simultaneamente a decisão monocrática de André Mendonça, que afastara o diretor-geral
  da Polícia Federal e o diretor de Inteligência Policial, e a de Flávio Dino, que os reintegrara no dia
  seguinte — de modo que nenhum dos dois atos produz efeito. O fundamento declarado descreve o próprio
  tribunal: ''Delineia-se, assim, quadro de conflitos e sobreposições processuais que configuram grave
  lesão à ordem pública''. Três feitos são articulados: a petição instaurada pela Presidência, a petição
  de relatoria de Mendonça, sobrestada, e a suspensão de liminar pedida pela União. Na mesma decisão foi
  convocada sessão extraordinária do Plenário para 15/09/2026, às 10h, presencial. Divergência registrada
  entre coberturas: parte da imprensa afirma que o diretor-geral permanece no cargo até a sessão, ao passo
  que outra registra que ele foi intimado a prestar informações em 48 horas, cabendo à Presidência decidir
  depois sobre sua permanência.'
