summary: "Duas notas oficiais de 15/10/2026: o Grupo Globo comunica o desligamento de Frederic Kachar da
  direção-geral de Mídia Impressa e Rádio, diz que conversas privadas dele com Daniel Vorcaro (outubro de 2023
  a julho de 2025), às quais teve acesso em 14/10, revelam uma relação inadequada do executivo com um
  anunciante, reafirma a independência editorial de seus veículos e anuncia o interino."
