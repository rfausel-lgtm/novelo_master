summary: 'O consultor apresenta classificação que situa o Banco Master em ''grau altamente especulativo''.
  O conselheiro Delson pergunta expressamente se a mudança da política de investimentos seria ''para atender
  somente ao Banco Master'', e o diretor financeiro Khayo responde que o Master é a única instituição
  credenciada fora do enquadramento da política, por não constar da lista exaustiva da Secretaria de Previdência.
  A proposta de reduzir a exigência de rating é rejeitada: três votos a favor, sete contra.'
