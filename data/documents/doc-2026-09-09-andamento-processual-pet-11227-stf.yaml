summary: 'Registro processual público consultado diretamente pela equipe. Notícia-crime do Partido Novo
  contra o general Marco Edson Gonçalves Dias pelos fatos de 8 de janeiro de 2023, protocolada em 20/04/2023
  — um dia depois da Pet 11.228 — e distribuída a Alexandre de Moraes por prevenção da Pet 10.829. Processo
  PÚBLICO, sem segredo de justiça. Tramitação regular: despacho de vista à PGR em 12/05/2023, manifestação
  da PGR em 13/06/2023, arquivamento em 15/08/2023 com dispositivo publicado e trânsito em julgado em
  23/08/2023 — 117 dias entre protocolo e decisão.'
