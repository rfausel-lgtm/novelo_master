title: Impugnação do liquidante do Banco Master à prestação de contas do Estado do Amapá
doc_type: judicial_filing
date: '2026-08-19'
source_ids:
- src-tjap-autos-6102005-63-2025
summary: Peça de 19/08/2026, com vinte anexos extraídos dos sistemas internos do banco, contendo nome
  do servidor, documento, órgão de vinculação, produto contratado — cartão MFácil ou Credcesta —, data
  e valor de cada parcela. Sustenta que a prestação de contas foi apresentada com trinta e quatro dias
  de atraso, que a segunda prestação, vencida em 17/06/2026, não foi apresentada, que os valores declarados
  são globais e sem detalhamento analítico, e que o Estado do Amapá não comprovou o depósito — tendo juntado
  apenas ordens bancárias de retenção. Pelos registros do banco, o devido no período seria de R$ 16.632.115,61
  do lado do Estado, contra R$ 5.441.269,38 declarados, resultando em diferença de R$ 11.165.022,70 depois
  de compensado pequeno excesso do lado da Amprev.
