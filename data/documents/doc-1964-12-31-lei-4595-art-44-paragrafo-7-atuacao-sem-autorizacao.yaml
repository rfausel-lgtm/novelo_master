title: Lei n. 4.595/1964, art. 44, paragrafo 7 — atuar como instituicao financeira sem autorizacao
doc_type: legislative_act
date: '1964-12-31'
source_ids:
- src-bcb-lei-4595-1964-art-44-paragrafo-7
summary: 'Dispositivo conferido integralmente pela equipe para fixar o enquadramento correto do caso.
  Pune com multa e detencao de um a dois anos quem atue como instituicao financeira sem autorizacao do
  Banco Central, estendendo a pena a diretores e administradores quando se tratar de pessoa juridica.
  A lei nao contem vedacao textual ao uso da expressao Banco na denominacao social — restricao que existe
  em normas infralegais nao verificadas nesta apuracao. A distincao importa: a designacao Banco PKL One
  que consta do diario oficial sul-mato-grossense vale como indicio documental de como o Estado enxergava
  a empresa, nao como enquadramento legal autonomo, e o enquadramento relevante e mais grave e o do exercicio
  da atividade.'
