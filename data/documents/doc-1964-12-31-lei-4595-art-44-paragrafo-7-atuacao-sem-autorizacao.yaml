excerpt: Quaisquer pessoas fisicas ou juridicas que atuem como instituicao financeira, sem estar devidamente
  autorizadas pelo Banco Central do Brasil, ficam sujeitas a multa referida neste artigo e detencao de
  1 a 2 anos
