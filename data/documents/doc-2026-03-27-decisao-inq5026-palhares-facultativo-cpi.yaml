- src-stf-inq5026-decisao-27-03-2026-palhares-facultativo-cpi
summary: 'Defere o pleito de Leonardo Augusto Furtado Palhares (Petição 34376/2026, e-Doc. 543), "para
  afastar a obrigatoriedade de comparecimento, transmudando-a em facultatividade" à CPI do Crime
  Organizado — mesma fundamentação (nemo tenetur se detegere, ADPFs 395/444) já aplicada a outros
  convocados. O pedido também invocava sigilo profissional de advogado (art. 7º, XIX, Lei 8.906/1994),
  não especificamente enfrentado na fundamentação da decisão.'
