summary: 'Delegado Daniel Penido de Britto instaura inquérito policial a partir de denúncia-crime anônima
  recebida por e-mail institucional da PF ("INFORMAÇÕES BANCO MASTER", formalizada no SEI-PF
  08500.019096/2025-17), após a IPJ nº 90/2025 confirmar preliminarmente os fatos e recomendar a abertura.
  Nomeia como focos centrais Daniel Bueno Vorcaro (Banco Master) e Benjamim Botelho de Almeida (Foco DTVM,
  atual Sefer Investimentos), por suposta captação de recursos de Regimes Próprios de Previdência Social
  via fundos com ativos ilíquidos, agravada após a aquisição do Master.'
