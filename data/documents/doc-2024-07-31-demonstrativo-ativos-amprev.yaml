summary: Planilha oficial assinada, lida pela equipe. Registra as tres letras financeiras do Banco Master,
  todas de prazo de dez anos, somando R$ 401.241.332,00, e a carteira total de R$ 7.996.271.682,70 na
  mesma data. Mostra tambem que a entidade adquiriu, no mesmo mes, letras financeiras do Santander e do
  Safra, e ja detinha letras do BTG Pactual e do Bradesco.
