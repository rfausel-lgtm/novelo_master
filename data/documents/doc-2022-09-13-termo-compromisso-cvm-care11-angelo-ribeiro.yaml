summary: 'Parecer do Comitê de Termo de Compromisso da CVM (PAS 19957.006441/2021-87 + PA 19957.010180/2022-81)
  sobre manipulação de preços do ativo CARE11 pelo Banco Máxima, com Angelo Ribeiro da Silva identificado
  como responsável pelas ordens. Inclui trechos de gravações telefônicas entre ele e operadores de mesa,
  obtidas pela BSM (Supervisão de Mercados da B3), citadas como evidência de coordenação de preço ("dá uma
  protegida no papel", "pra não cair"). O Comitê aceitou a proposta de termo de compromisso em 13/09/2022:
  R$ 2,208 milhões pagos pelo Banco Máxima e R$ 736 mil por Angelo Ribeiro da Silva.'
