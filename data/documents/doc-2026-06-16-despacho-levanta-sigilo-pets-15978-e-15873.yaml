summary: >-
  Despacho que levanta o sigilo das Pets 15.978 e 15.873, tendo em vista a inclusão em pauta, no mesmo dia e
  "de última hora", da devolução da vista regimental das duas Pets na sessão presencial da Segunda Turma, a
  necessidade de permitir aos demais ministros do colegiado o acesso à integralidade dos feitos e a ausência
  de prejuízo à investigação. As partes do cabeçalho aparecem como "SOB SIGILO". O despacho não descreve o
  conteúdo das Pets nem determina a publicação de relatórios. Hash do PDF lido no portal em 16/10/2026.
excerpt: >-
  levanto o sigilo de ambos os processos (Pets nº 15.978 e 15.873).
