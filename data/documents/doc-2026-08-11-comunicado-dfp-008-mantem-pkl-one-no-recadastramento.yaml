- src-doesp-2026-08-11-comunicado-dfp-008-anexo-consignatarias
summary: Documento que expõe a contradição administrativa do Estado de São Paulo. Em março de 2026 a mesma
  diretoria determinara a suspensão do código de desconto 097337-4, com efeitos retroativos a 19/02/2026,
  por descumprimento do inciso que admitira a empresa no rol de consignatárias. Cinco meses depois, o
  comunicado que fixa o cronograma de recadastramento das consignatárias credenciadas traz, no anexo,
  exatamente aquela empresa e aquele código, com data de recadastramento marcada para novembro de 2026.
  As retificações de maio e junho de 2026 mantêm o mesmo registro. Código suspenso desde fevereiro; credenciamento
  formalmente preservado em agosto.
