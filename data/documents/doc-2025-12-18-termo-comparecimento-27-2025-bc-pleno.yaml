- src-stf-inq5026-pecas-1-100
summary: 'Termo de Comparecimento do Banco Central ao Banco Pleno, assinado por Belline Santana (Chefe do
  Desup) e Renata Leme Borges dos Santos (Diretora do Pleno), advertindo sobre agravamento do risco de
  liquidez: cerca de R$ 475 milhões em CDIs do Banco Master (em liquidação extrajudicial) e cerca de R$ 2,5
  bilhões em créditos FCVS como ativos de difícil monetização. Registra Índice de Basileia do Pleno em
  6,64% (data-base outubro/2025), abaixo do mínimo regulatório, e determina elevação do Fator de Ponderação
  de Risco de 20% para 150% sobre os CDIs do Master, com plano de solução em 30 dias. Registra também que
  Augusto Ferreira Lima não foi convocado "por se encontrar em vacância temporária, em virtude da operação
  Compliance Zero da Polícia Federal".'
