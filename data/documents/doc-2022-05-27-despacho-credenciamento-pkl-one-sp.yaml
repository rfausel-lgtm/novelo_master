reference: GDOC 1000581-2302/2022 - SFP-PRC-2022/12729; DOE-SP 27/05/2022, Executivo I, p. 24
excerpt: DEFIRO o pedido de credenciamento junto ao Sistema de Consignação em Folha de Pagamento do Estado
  de São Paulo, formulado pela PKL ONE PARTICIPAÇÕES S/A (fls. 02-03), concedendo-lhe a espécie de consignação
  270 (Cartão de Benefício).
