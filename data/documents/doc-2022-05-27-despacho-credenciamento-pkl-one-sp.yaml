summary: 'Ato pelo qual a empresa entra na folha paulista, 55 dias após o decreto que criou a espécie
  e 41 dias após a resolução que ampliou a margem. Confirma documentalmente a versão oficial de que o
  vínculo é credenciamento, e não contrato ou convênio: trata-se de despacho de deferimento do secretário
  da Fazenda, publicado impessoalmente, sem nome de signatário. Concede a espécie de consignação 270 (Cartão
  de Benefício); o código operacional 097337-4 seria informado no mês seguinte.'
