source_ids:
- src-metropoles-2026-09-10-marcelao-confirma-aporte-de-um-milhao
summary: Contrato entregue pelo próprio publicitário à coluna que o revelou, e por ela descrito e fotografado. Registra
  aporte financeiro de US$ 185.185,19 em favor da Go Up Entertainment Ltda., feito em dezembro de 2025, na condição
  de investidor da cinebiografia. A assinatura, porém, é de 04/06/2026 — seis meses depois da transferência e já
  sob a repercussão do caso Master. O signatário atribui a defasagem a 'ajustes de cláusulas entre as partes'. O
  valor em dólares corresponde ao R$ 1 milhão que a decisão do STF registra como enviado por ele à produtora entre
  10/11 e 30/12/2025. Não lido pela equipe.
