summary: Registro do Cadastro Nacional da Pessoa Jurídica consultado pela equipe. Empresa distinta da
  BN Financeira, tendo Bonnie Toaldo Bonilha como sócia única desde 20/05/2019. Constava como VAMOS FLORIR
  COMERCIO DE FLORES LTDA e passou a BN REPRESENTACOES TECNOLOGICAS LTDA, migrando de floricultura para
  desenvolvimento de software e mudando a sede de Salvador para Igaporã. Capital social de R$ 10.000,00.
  Declara à Receita o mesmo telefone e praticamente o mesmo e-mail da BN Financeira, ambos de escritório
  de contabilidade.
