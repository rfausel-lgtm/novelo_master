title: Despacho que descredencia a PKL One do sistema de consignações da capital paulista
doc_type: administrative_act
date: '2026-08-14'
source_ids:
- src-doc-2026-08-14-descredenciamento-pkl-one-pmsp
summary: 'A capital paulista foi mais longe do que o Estado e do que Mato Grosso do Sul: não apenas suspendeu,
  mas descredenciou a empresa e denunciou o convênio, após rejeitar a defesa administrativa apresentada.
  O fundamento é a não manutenção dos requisitos de credenciamento e o descumprimento reiterado de dispositivo
  do decreto municipal de 2019. Um detalhe expõe o cuidado do ato anterior: a publicação de 12/08/2026
  teve de ser tornada sem efeito porque grafara a razão social como ''PKL One Administrações S.A'', embora
  com o CNPJ correto.'
