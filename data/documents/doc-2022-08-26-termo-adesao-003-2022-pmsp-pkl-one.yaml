title: Termo de Adesão nº 003/2022 — Prefeitura de São Paulo e PKL One
doc_type: contract
date: '2022-08-26'
source_ids:
- src-doc-2022-08-26-termo-adesao-003-2022-pmsp-pkl-one
summary: Diferentemente do Estado, onde o vínculo é apenas credenciamento, na capital houve convênio assinado
  em 25/08/2022, sem ônus para a prefeitura, com vigência de dois anos ou até o recadastramento bienal,
  aditado em 26/10/2023. O credenciamento que o precede, autorizado em 19/08/2022, invoca expressamente
  o decreto municipal de 07/07/2022. A operação se estendeu à administração indireta, com autorizações
  no Serviço Funerário e no Hospital do Servidor Público Municipal.
