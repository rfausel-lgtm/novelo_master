date_precision: day
source_ids:
- src-stf-pet16704-despacho-12-09-2026-avocacao-e-substituicao-relatoria
summary: 'Fachin remete à Presidência as PETs 15.041 e 15.556, com todos os processos relacionados, e determina,
  com base no art. 13, XV, do RISTF, que a relatoria da PET 16.662 seja substituída para a Presidência, diante
  da possibilidade de aplicação do art. 144, IV, do CPC (suspeição). Registra que a PET 16.662 nasceu porque a
  IPJ-A nº 3298613/2026 identificou pessoa que atrai o art. 5º, I, do RISTF.'
