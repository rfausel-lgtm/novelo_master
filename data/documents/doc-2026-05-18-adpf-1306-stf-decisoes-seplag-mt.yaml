title: ADPF 1306/MT — STF anula as decisões da SEPLAG que suspenderam as consignações
doc_type: judicial_decision
date: '2026-05-18'
source_ids:
- src-stf-2026-adpf-1306-suspensao-consignacoes-seplag-mt
summary: 'Segunda frente do sistema financeiro contra as medidas de Mato Grosso, movida pela Associação
  Brasileira de Bancos e julgada na mesma sessão virtual da ADI 7900, sob a mesma relatoria. Enquanto
  a ADI derrubou o ato do Legislativo estadual, a ADPF derrubou os atos administrativos do próprio Executivo:
  as decisões da Secretaria de Planejamento e Gestão que suspenderam por 120 dias as consignações de cartão
  de crédito e de cartão de benefício e os repasses correspondentes. O resultado combinado é que nenhuma
  das duas vias — legislativa ou administrativa — sobreviveu ao controle de constitucionalidade.'
