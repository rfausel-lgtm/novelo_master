summary: Comunicado do próprio BRB, autor da ação, não peça processual nem decisão. Segundo o BRB, a ação
  social de responsabilidade civil foi ajuizada em 10/11/2026, com base nos arts. 158 e 159 da Lei 6.404/1976
  e autorização da assembleia geral extraordinária de 24/08/2026, contra sete ex-administradores, quatro deles
  registrados no acervo (Paulo Henrique Costa, Dário Oswaldo Garcia Júnior, Marcelo Talarico e Diogo Ilário de
  Araújo Oliveira) e outros três ex-gestores. O objeto, diz o banco, é apurar responsabilidades e reparar
  danos patrimoniais que alega ter sofrido em aquisições de carteiras de crédito do Banco Master e de
  sociedades relacionadas em 2025. O valor da causa é de R$ 1 milhão para fins processuais, sem quantificar o
  dano. O BRB diz ter formulado pedidos de natureza patrimonial em relação a seis empresas (Allora S.A.,
  Lenore S.A., Stanza S.A., Domani S.A., Chesapeake S.A. e Milano S.A.) e ter pedido, em caráter liminar, a
  indisponibilidade de bens dos ex-administradores demandados e de seis imóveis em São Paulo e Brasília. O
  banco ressalva que o ajuizamento não antecipa juízo sobre a responsabilidade dos demandados. Número do
  processo, vara e juízo não constam do documento. Prova o ato e os pedidos declarados, não os fatos alegados.
excerpt: não implica juízo antecipado sobre a responsabilidade dos demandados
