summary: 'Ofício do Banco Central ao MPF, assinado por Belline Santana, informando que em 12/02/2025 o
  Banco Master recomprou carteiras de crédito consignado cedidas ao BRB em 20 e 24/12/2024, originadas pela
  The-Pay Soluções de Pagamentos Ltda, no valor de aproximadamente R$ 1,7 bilhão — motivadas por reclamações
  de titulares que negavam conhecer as operações. O mesmo ofício registra que operações de consignado
  originadas pelo próprio Banco Master, e não por terceiros, historicamente não apresentaram indícios de
  irregularidade.'
