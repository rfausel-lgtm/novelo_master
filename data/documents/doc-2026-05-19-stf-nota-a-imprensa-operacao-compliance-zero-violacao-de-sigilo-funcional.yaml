summary: Nota oficial do STF que informa a autorização, em 18/05/2026, de operação para apurar eventual
  violação de sigilo funcional, o cumprimento em 19/05 de dois mandados de busca e apreensão e de medidas
  cautelares diversas da prisão (incluindo a suspensão do exercício da função pública do policial federal), a
  versão da PF de que o investigado, perito criminal federal, teria repassado a integrante da imprensa
  informações sigilosas obtidas de material apreendido, o caráter específico e instrumental das diligências e
  a ressalva de que não há direcionamento investigativo contra jornalistas ou veículos de imprensa. Não nomeia
  o investigado.
excerpt: as medidas não implicam qualquer direcionamento investigativo contra jornalistas ou veículos de imprensa
