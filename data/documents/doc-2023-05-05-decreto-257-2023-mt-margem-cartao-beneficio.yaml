id: doc-2023-05-05-decreto-257-2023-mt-margem-cartao-beneficio
kind: document
title: Decreto nº 257/2023 (Mato Grosso) — margens que não concorrem entre si e fim do teto de 24 meses
doc_type: legislative_act
date: '2023-05-05'
source_ids:
- src-iomat-2023-05-05-decreto-257-2023-consignacoes
summary: 'Editado 25 dias antes de o Banco Master assinar convênio de cinco anos, altera o regime de consignações
  mato-grossense em quatro pontos que, somados, viabilizaram a operação: cria margem própria de 10% para
  cartão de benefício e determina que as margens não concorrem entre si; remove o teto de 24 meses para
  a vigência dos convênios; move o produto para o inciso do rol que dispensa autorização expressa do governador,
  deixando a decisão na secretaria; e cria a figura da instituição financeira que intermedeia o produto
  para empresas de meios de pagamento.'
is_official: true
