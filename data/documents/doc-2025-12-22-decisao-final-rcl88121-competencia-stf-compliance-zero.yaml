kind: document
title: Decisão final da Rcl 88.121 que reconhece a competência do STF sobre a Compliance Zero
doc_type: judicial_decision
date: '2025-12-22'
date_precision: day
source_ids:
- src-stf-rcl88121-decisao-final-22-12-2025
summary: '"Julgo parcialmente procedente a presente reclamação, para reconhecer a competência desta Suprema Corte
  para supervisionar as investigações que envolvem a operação Compliance Zero." Fundamenta-se na existência de
  "indícios de que o Deputado Federal acima referido pode estar envolvido em prática delitiva" e na
  inconveniência de desmembrar as investigações; ratifica todas as decisões e constrições já proferidas e as
  cautelares diversas da prisão fixadas pelo TRF-1.'
