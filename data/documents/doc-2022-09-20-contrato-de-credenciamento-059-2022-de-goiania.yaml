title: 'Goiânia: inapta em 2021, apta em 2022, contratada por inexigibilidade'
doc_type: contract
date: '2022-09-20'
source_ids:
- src-dom-goiania-2021-2022-da-inaptidao-ao-contrato-059-2022
summary: 'A capital goiana produziu o ciclo administrativo completo, e com uma inversão: em 05/07/2021 a comissão
  declarou a empresa INAPTA ao credenciamento, no processo nº 86248174/2021; um ano depois, em 20/07/2022, outra
  ata a declarou APTA, no processo nº 22.5.000000352-2. Em 12/08/2022 o secretário municipal de Administração acatou
  parecer jurídico e autorizou o credenciamento pelo Chamamento Público nº 004/2022, mediante inexigibilidade de
  licitação, com fundamento no artigo 25 da Lei 8.666/93. O Contrato de Credenciamento nº 059/2022 foi assinado
  em 20/09/2022, por doze meses, e seu objeto alcança expressamente os aposentados e pensionistas vinculados ao
  regime próprio de previdência do município. Um primeiro aditivo prorrogou o prazo em setembro de 2023. A documentação
  lida não registra o motivo da inaptidão de 2021 nem o que mudou entre uma decisão e outra.'
