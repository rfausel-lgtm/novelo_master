summary: >-
  Notícia oficial do MPF (25/09/2026, 18:14) sobre a 1ª Sessão Extraordinária de 2026 do Conselho Superior do MPF.
  Registra que o Conselho, por unanimidade, acompanhando o relator Francisco Sanseverino, decidiu pelo não
  conhecimento dos pedidos de impedimento ou suspeição do procurador-geral Paulo Gonet, por não ter competência
  legal para analisá-los, e julgou prejudicados os pedidos de afastamento; e que, por cinco votos a quatro,
  rejeitou a abertura de investigação criminal e a designação de subprocurador-geral. É a única fonte oficial
  localizada sobre o resultado: a ata ou certidão da sessão não foi localizada no portal do MPF, e a notícia não
  nomeia o requerente, os demais votantes nem o número da Notícia de Fato, que consta só da convocação.
excerpt: por ausência de elementos mínimos para a tipificação do crime de prevaricação
