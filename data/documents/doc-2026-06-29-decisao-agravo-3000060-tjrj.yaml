summary: Reconhece a incompetência absoluta da câmara para prosseguir no julgamento, depois que os autos
  de origem migraram para a Justiça Federal — por força de pedido de intervenção do Banco Central — e
  desta para o Supremo Tribunal Federal. Registra que a decisão agravada fica sujeita à revisão pelo juízo
  competente, nos termos do art. 64, § 4º, do Código de Processo Civil, e julga o recurso prejudicado,
  não o conhecendo. O agravo interno interposto contra o indeferimento do efeito suspensivo também restou
  prejudicado.
