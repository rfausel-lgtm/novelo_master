- src-stf-pet15478-decisao-22-06-2026-sigilo-tirreno-brb
summary: 'Defere afastamento de sigilo bancário e fiscal (01/01/2024-31/12/2025) sobre representação
  policial encampada pelo MPF, descrevendo a venda fraudulenta ao BRB de R$ 17 bilhões em carteiras de
  crédito do Banco Master — R$ 12,2 bilhões das quais o próprio BRB admitia não conseguir auditar
  adequadamente — estruturada via a empresa de fachada Tirreno. Narra papel individualizado de 11 pessoas
  físicas (Daniel Vorcaro, Augusto Lima, Luiz Bull, Alberto Félix de Oliveira, Ângelo Ribeiro da Silva,
  André Seixas Maia, Henrique Peretto, Paulo Henrique Costa, Dario Oswaldo Garcia Junior) e inclui como
  alvos a própria Tirreno, a Viking Participações e as empresas do grupo Terra Firme (Construções e
  Incorporações; da Bahia).'
