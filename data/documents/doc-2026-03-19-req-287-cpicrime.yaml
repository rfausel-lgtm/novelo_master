summary: 'Requerimento aprovado pelo colegiado da CPI do Crime Organizado em 31/03/2026. Reproduz a tese
  veiculada pelo ICL Notícias e acrescenta corroboração própria: sustenta que documentos registrados na
  CVM em outubro de 2015 confirmariam Oliver Ortiz como cotista de fundos administrados pela antiga Foco
  DTVM, inclusive o Aquilla FII, e que registros da Receita Federal demonstram que Yan Felix Hirano e
  Benjamim Botelho de Almeida figuram conjuntamente como sócios-administradores da ASOCLQ desde junho
  de 2012. O texto preserva o condicional. Hirano não chegou a depor: a CPI encerrou em 14/04/2026 sem
  relatório aprovado.'
