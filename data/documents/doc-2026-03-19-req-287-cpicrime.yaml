reference: REQ 287/2026 – CPICRIME
excerpt: Documentos registrados na CVM em outubro de 2015 confirmam que Ortiz figurava como cotista de
  fundos administrados pela antiga Foco DTVM — atual Sefer Investimentos —, tanto em nome próprio quanto
  por meio de empresas a ele vinculadas, incluindo o Aquilla FII. Este fundo investiu no Fundo São Domingos,
  veículo utilizado na aquisição do Banco Máxima em 2017.
