summary: Ação ajuizada na Vara Especializada em Ações Coletivas de Cuiabá, originada do inquérito civil
  SIMP nº 009467-001/2025, sob a promotora Valnice Silva dos Santos, contra o que o órgão descreve como
  'uma estrutura montada para enganar o servidor'. São seis rés, encabeçadas pela Capital Consig. Nem
  o CredCesta, nem a PKL One, nem o Banco Master figuram no polo passivo — registro necessário para não
  somar ao caso Master o que pertence a caso distinto no mesmo estado.
