summary: Documento de entidade de classe, não perícia, laudo nem manifestação da PF. Segundo a APCF, a
  identificação de modificações em registros digitais não significa necessariamente que o conteúdo
  probatório tenha sido adulterado, nem demonstra, por si, comprometimento da integridade; o questionamento da defesa não comprova,
  por si só, falha da perícia; e cabe ao Poder Judiciário avaliar as alegações. A nota não examina arquivos
  específicos nem cita o laudo da PF ou o documento do perito da defesa.
excerpt: não significa necessariamente adulteração do conteúdo probatório
