excerpt: 'A Tirreno vendia créditos ao BRB por R$ 12,2 bilhões — embutindo um prêmio (lucro) ao banco.
  O Master não precisava pagar a Tirreno à vista, mas recebia do BRB à vista. A investigação aponta que
  esses créditos nunca existiram na origem: os contratos seriam fabricados.'
