date: 2026-03
source_ids:
- src-apublica-2026-03-reconstrucao-fraude-master
summary: 'Reportagem de investigação que descreve, a partir de apuração policial, o mecanismo por trás
  dos R$ 12,2 bilhões que o BRB pagou ao Master por carteiras de crédito: uma empresa de fachada, a Tirreno,
  vendia créditos fabricados ao banco comprador, com o Master recebendo o valor à vista sem pagar a Tirreno
  à vista. Registra que o Banco Central identificou, em amostra de 130 contratos, ausência total de lastro,
  e que a explicação do Master atribuindo a origem a associações de servidores da Bahia não se sustentou
  diante do uso de CPFs de diversas localidades do país.'
