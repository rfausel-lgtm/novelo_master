summary: Desobrigou o servidor do Banco Central de comparecer à CPI do Crime Organizado, transformando
  a convocação em facultativa e assegurando, em caso de comparecimento, o direito ao silêncio, a assistência
  de advogado, a dispensa do compromisso de dizer a verdade e a ausência de constrangimentos.
