title: Decisão do ministro André Mendonça que tornou facultativo o comparecimento de Belline Santana à
  CPI, conforme a Agência Senado
doc_type: judicial_decision
date: '2026-03-24'
issuer_id: andre-mendonca
issuer: Ministro André Mendonça (STF)
