summary: 'Portaria assinada pela Delegada Janaína Pereira Lima Palazzo às 18h54 de 17/08/2025, com base
  no Ofício nº 5462/2025/MPF/PRDF/28º Ofício (Notícia de Fato 1.16.000.001223/2025-35), instaurando o IPL
  para apurar os arts. 4º e 6º da Lei 7.492/1986 (crimes contra o Sistema Financeiro Nacional) e o art. 1º
  da Lei 6.385/1976 (mercado de valores mobiliários). Resume o fato investigado: desvio de recursos do BRB,
  transferidos ao Banco Master (operação avaliada em R$ 12,2 bilhões), por meio de simulação de cessão de
  carteiras de crédito inexistentes, com falsificação documental, empresas de fachada e pessoas interpostas.
  Determina consultar dados de pessoas jurídicas nominalmente citadas — Tirreno, SX 016 Empreendimentos e
  Participações S.A., Asteba, Asseba, Cartos SCD S/A e The-Pay Soluções de Pagamentos Ltda — e suas relações
  com funcionários, diretores e ex-diretores do Banco Master.'
