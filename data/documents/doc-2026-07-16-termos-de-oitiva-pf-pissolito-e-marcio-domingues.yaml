summary: Oitivas juntadas pela defesa de Márcio Domingues. Pissolito, ex-sócio de Daniel Lopes Monteiro, diz ter
  feito a pedido dele, em fevereiro de 2026, minuta de cessão com os dados comerciais em branco. Márcio afirma que
  o fundo Hockenheim "era do Daniel Monteiro", até onde sabia, e que a Epítome era ativo abaixo desse fundo.
excerpt: Esse é um fundo que é uma estrutura, até onde a gente sabe lá, que era do Daniel Monteiro
