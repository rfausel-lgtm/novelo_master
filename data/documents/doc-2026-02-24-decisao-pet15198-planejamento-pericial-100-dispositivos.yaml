summary: 'Defere o requerimento da Polícia Federal (Ofício nº 12/2026-CINQ/CGRC/DICOR/PF, e-doc. 380 da
  Pet. 15.198, e representação e-doc. 306 do INQ 5.026) para que as extrações, indexações e análises dos
  cerca de 100 dispositivos eletrônicos apreendidos na 2ª fase da Operação Compliance Zero sigam o fluxo
  ordinário de trabalho pericial da instituição, com distribuição regular entre peritos habilitados,
  dispensado o encaminhamento global das extrações à relatoria.'
