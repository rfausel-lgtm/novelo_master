summary: 'Decisão assinada em 19/02/2026 na Pet 15.198/DF, com referência cruzada ao INQ 5.026/DF (partes sob
  sigilo no cabeçalho). Defere o requerimento da Polícia Federal (Ofício nº 12/2026-CINQ/CGRC/DICOR/PF, e-doc.
  380 da Pet. 15.198, com a manifestação do INC sobre cerca de 100 dispositivos e 20 semanas de dedicação
  exclusiva de um único perito; e representação e-doc. 306 do INQ 5.026) e autoriza (a) o fluxo ordinário de
  trabalho pericial da instituição, dispensado o encaminhamento global das extrações à relatoria, (b)
  diligências ordinárias que não dependem de reserva de jurisdição, como oitivas na sede da PF, e (c) a
  custódia do material apreendido nos depósitos da PF; condiciona isso à compartimentação (Corregedoria-Geral,
  Diretoria de Inteligência, demais áreas, dever de sigilo inclusive perante superiores); determina que nova
  investigação ou inquérito seja antes requerido ao relator; mantém o sigilo padrão nível III para os autos da
  Operação Compliance Zero e concede acesso às autoridades policiais responsáveis. Data corrigida em 23/10/2026
  (lote 366): o registro estava datado de 24/02/2026, data que não consta do texto; o identificador foi mantido
  para não quebrar ligações.'
excerpt: determino a manutenção do nível de sigilo adotado em relação aos presentes autos
