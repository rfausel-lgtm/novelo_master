summary: 'Série extraída pela equipe: R$ 486.487.421,52 em 12/2023; R$ 774.941.011,04 em 03/2024; R$ 1.430.175.202,98
  em 06/2024; R$ 2.036.715.506,87 em 09/2024; R$ 2.110.454.439,68 em 12/2024; e R$ 2.168.296.373,46 em
  03/2025. Em 06/2025 o valor individual não é reportado e o conglomerado registra R$ 4.113.728.947,13.
  Os pontos de dezembro de 2023 e de 2024 e o de junho de 2024 batem ao centavo com as demonstrações financeiras
  auditadas. O Banco Master de Investimento S.A. registra zero em todas as datas-base — todo o estoque
  estava na instituição líder.'
