summary: 'Registra, lado a lado, as taxas cotadas naquele dia: BTG Pactual, cinco anos, IPCA + 6,65% ao
  ano; Santander, quatro anos, pré-fixado em 12,09%; Itaú e Safra, quatro anos, IPCA + 6,38% e 6,49%;
  e o Banco Master, dez anos, IPCA + 8,35%. Aprovadas por unanimidade a aplicação de R$ 100 milhões no
  BTG e de R$ 200 milhões no Master, com observação de Gláucio Bezerra de que todas as letras eram sênior,
  sem cláusula de subordinação.'
