summary: Relatório final da apuração que o BRB contratou sobre suas operações com o Banco Master, conduzida pelo
  escritório Machado Meyer Advogados, com perícia da Kroll Associates, iniciada em novembro de 2025, concluída em
  07/04/2026 e validada por uma Comissão Independente de Investigação. Toda a documentação foi enviada à Polícia
  Federal. Documentos dessa apuração foram depois apreendidos pela PF com dirigentes do BRB, e é deles que saem
  os números dos gastos do Master com advocacia em 2023 e 2024. O acervo não teve acesso ao relatório; o registro
  é do documento como descrito por fontes de imprensa.
