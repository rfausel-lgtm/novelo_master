- empresa-baiana-de-alimentos
- jaques-wagner
issuer: Governo do Estado da Bahia / Assembleia Legislativa
url: https://www.legislabahia.ba.gov.br/documentos/lei-no-13204-de-11-de-dezembro-de-2014
reference: Lei estadual nº 13.204/2014, art. 36
excerpt: Fica o Poder Executivo autorizado a promover a alienação onerosa, integral ou parcial, de sua
  participação no capital societário, inclusive do controle acionário, da Empresa Baiana de Alimentos
  S.A - EBAL, e/ou dos ativos, bens e direitos desta.
