title: Lei estadual nº 13.204/2014 (Bahia) — art. 36, autorização para alienar a Ebal
doc_type: legislative_act
date: '2014-12-11'
source_ids:
- src-legislabahia-lei-13204-2014-alienacao-ebal
summary: Lei de reforma administrativa cujo art. 36 autoriza a alienação onerosa do controle acionário
  da Empresa Baiana de Alimentos e de seus ativos, bens e direitos, prevendo ainda operações societárias
  e avaliação econômico-financeira para a modelagem da desestatização. Sancionada por Jaques Wagner em
  11/12/2014, último mês de seu segundo mandato como governador — quatro anos antes do leilão que efetivou
  a venda.
is_official: true
