excerpt: 'Reitero: o Banco Master não era problema quando contratamos, não demonstrou ser problema durante
  o processo e só pode vir a ser problema futuramente como qualquer instituição financeira, mas, naquele
  momento, não havia risco identificado. Aprovamos as três deliberações duas por unanimidade e uma após
  diligências.'
