title: 'Decreto nº 47.625/2021 (RJ) — texto integral: a categoria residual e a margem que não compõe a
  margem'
doc_type: legislative_act
date: '2021-05-28'
source_ids:
- src-doerj-2021-05-28-decreto-47625-texto-integral
