- src-sefazrj-decreto-45563-2016-consignacoes
summary: 'Peça que faltava ao acervo, agora lida por inteiro — e que corrige a leitura que o próprio acervo
  vinha fazendo. O art. 1º acrescenta ao rol de consignatárias o inciso VIII: ''outras entidades consignatárias
  devidamente autorizadas pelo Estado''. É uma categoria residual, aberta e sem critério objetivo, cuja
  única condição é a autorização do mesmo Poder Executivo que credencia. O art. 4º reescreve o art. 6º
  do decreto-matriz: fixa em 35% o teto das consignações facultativas e, no inciso III, admite o cartão
  de benefício até 20% do valor líquido, calculado depois de excluídos os descontos legais e as demais
  consignações — e o §1º remove qualquer dúvida: ''O cartão de benefícios não compõe a margem consignável
  prevista neste artigo''. É margem adicional, não sublimite. O §2º traz o dispositivo menos notado e
  talvez o mais revelador: manda que a margem do cartão de comércio local seja partida ao meio, metade
  para compras e metade ''para financiamento de despesas decorrentes de serviços creditícios, financeiros,
  securitários e congêneres''. Um cartão apresentado como instrumento de compras é, por norma, metade
  crédito. O art. 3º eleva a 96 meses o prazo de amortização e admite contratação por meios digitais e
  de telecomunicação. O ato é assinado apenas pelo governador, sem referendo de secretário.'
