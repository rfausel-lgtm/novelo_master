excerpt: VIII - outras entidades consignatárias devidamente autorizadas pelo Estado. [...] Poderá ser
  utilizado na forma de cartão de benefícios o limite máximo de 20% (vinte por cento) do valor líquido
  excluindo os descontos previstos em Lei, bem como, as consignações facultativas mencionadas nos incisos
  III ao XI do artigo 4º deste Decreto. § 1º - O cartão de benefícios não compõe a margem consignável
  prevista neste artigo.
