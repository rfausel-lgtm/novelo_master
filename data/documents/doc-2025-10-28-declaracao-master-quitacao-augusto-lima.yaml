summary: 'Declaração do Banco Master, assinada por Daniel Vorcaro, atestando que Augusto Ferreira Lima
  recebeu remuneração indevida de R$ 1.089.222,35 entre junho de 2024 e agosto de 2025 — período posterior
  à sua saída formal da sociedade (maio de 2024) —, que restituiu integralmente o valor, e concedendo-lhe
  quitação ampla e irrevogável.'
