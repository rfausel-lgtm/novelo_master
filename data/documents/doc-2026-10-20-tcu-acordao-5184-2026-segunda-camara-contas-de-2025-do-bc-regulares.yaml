summary: 'Acórdão de relação na prestação de contas de 2025 do Banco Central do Brasil. A 2ª Câmara acordou em
  levantar o sobrestamento determinado pelo Acórdão 5163/2026, julgar regulares as contas dos nove
  responsáveis listados, com quitação plena, e arquivar os autos, com fundamento nos arts. 1º, I, 16, I, 17 e
  23, I, da Lei 8.443/1992 e nos arts. 143, I, "a", 207 e 214, I, do Regimento Interno. Considerandos: a
  AudBancos propõe a regularidade; o MPTCU reconheceu que os elementos dos autos não evidenciam
  irregularidades capazes de comprometer a regularidade das contas. Sem determinações ou recomendações. A
  decisão trata das contas de 2025 do BC; o acórdão não menciona o TC 022.950/2025-7 nem o TC 008.216/2025-8.
  É ato de tribunal de contas, não decisão judicial. Texto lido no portal de jurisprudência do TCU em
  21/10/2026 e coincidente com o PDF hospedado pelo Poder360. A captura em raw/ omite os CPFs; o sha256 é o da
  captura.'
excerpt: ACORDAM em levantar o sobrestamento determinado pelo Acórdão 5163/2026-TCU-Segunda Câmara
