summary: 'Documento que confirma documentalmente a operação em Santa Catarina, estado que constava da
  lista de cobertura do produto já em maio de 2022. A empresa não figura entre as consignatárias ativas,
  mas o aviso final da relação orienta servidores com dúvidas sobre o ''Cartão Consignado de Benefícios
  do CREDCESTA (PKL ONE)'' a procurar a gerência de consignados — o que situa a empresa como operadora
  recém-saída da lista. A data de seu credenciamento no estado não foi localizada: o portal do diário
  oficial catarinense exige autenticação para busca de texto integral.'
