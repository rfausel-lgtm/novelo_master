summary: 'Assinada digitalmente em 01/09/2026 às 19h27, em resposta ao despacho de 31/08/2026 que abriu
  vista à PGR por cinco dias. Sustenta dupla nulidade da ordem de investigação e de seus resultados: (1)
  a determinação de investigar pessoas específicas, sem pedido do Ministério Público nem iniciativa da
  autoridade policial, excede a competência do magistrado na fase pré-processual (CPP, art. 3º-A); (2)
  ainda que houvesse indício contra um colega de Corte, a competência para investigar ministro do STF
  é do Plenário (CF, art. 102, I, ''b''; LOMAN, art. 33, parágrafo único), cabendo ao relator, no máximo,
  levar a suspeita ao presidente do tribunal — não aprofundar ele mesmo a apuração. Registra que a ordem
  de investigação data de 24/08/2026 e que, das mais de 200 páginas do informe policial, 188 foram dedicadas
  ao ministro Alexandre de Moraes. Pede que o relator reconheça a nulidade e extinga a Petição 16.662.
  Cita precedentes do próprio STF sobre imparcialidade judicial e sistema acusatório (Inq. 2.913, rel.
  Dias Toffoli; RHC 144.615, rel. Edson Fachin). Lida integralmente pela equipe editorial a partir do
  PDF original.'
