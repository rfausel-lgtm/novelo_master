summary: 'A defesa alegou não ter tido acesso ao caderno investigativo e pediu (i) acesso integral aos
  autos e (ii) adiamento de oitiva marcada para 27/08/2026. O relator invoca a Súmula Vinculante 14 mas
  julga ambos prejudicados: o acesso já fora concedido em 24/08/2026, e a data da oitiva já havia
  transcorrido.'
