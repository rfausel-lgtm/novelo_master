summary: Reúne a Nota 11/2026-BCB/COGER (relato circunstanciado de fatos e juízo de admissibilidade
  disciplinar contra Belline Santana e Paulo Sérgio Neves de Souza), os relatos verbais que ambos deram
  pessoalmente aos investigadores internos em 07/01/2026, a decisão de afastamento cautelar de ambos por
  60 dias, o despacho que instaura Sindicância Patrimonial para cada um, e o Ofício 935/2026-BCB/SECRE de
  09/01/2026, assinado pelo presidente Gabriel Galípolo, comunicando a Polícia Federal indícios de corrupção
  passiva.
