title: Termo de Análise e Atestado de Credenciamento nº 001/2024 do Itaprevi — as duas versões
doc_type: administrative_act
date: '2024-01-16'
source_ids:
- src-itaprevi-processo-200000015-2024
summary: O documento aparece duas vezes nos mesmos autos. A primeira versão está sem qualquer assinatura,
  com os campos já preenchidos e com a razão social do banco impressa no campo destinado à assinatura
  do representante legal da instituição interessada. A segunda está assinada digitalmente por Neilton
  Paixão de Jesus em 16/01/2024, às 17h15 e às 17h17, nos dois campos distintos reservados ao dirigente
  da unidade gestora e ao gestor de recursos do regime próprio. O campo de e-mail da instituição a ser
  credenciada traz o endereço pessoal da executiva de relações institucionais do banco. O campo destinado
  aos principais contatos com regimes próprios está em branco. As sete perguntas de verificação estão
  todas assinaladas com 'Sim', inclusive a que atesta o cumprimento do inciso I do § 2º do art. 21 da
  Resolução CMN 4.963/2021.
