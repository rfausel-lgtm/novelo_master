summary: 'Decisão monocrática que decretou a prisão preventiva de Daniel Vorcaro, Fabiano Campos Zettel,
  Luiz Phillipi Machado de Moraes Mourão e Marilson Roseno da Silva, suspendeu as atividades de empresas
  vinculadas — entre elas Moriah Asset, Super Empreendimentos, Varajo Consultoria, King Participações
  Imobiliárias e King Motors — e impôs cautelares a servidores do Banco Central. ATUALIZAÇÃO (09/09/2026):
  a íntegra de 48 páginas foi baixada do domínio oficial do STF e lida integralmente pela equipe, o que
  permitiu extrair a fundamentação individualizada quanto a cada investigado. A decisão está assinada
  em 3 de março de 2026; 04/03 é a data de cumprimento. Contém a seção I.2, dedicada a Fabiano Campos
  Zettel; a descrição do grupo ''A Turma'' e do pagamento mensal de R$ 1 milhão intermediado por ele;
  e as mensagens sobre a propina ao servidor do Banco Central Belline Santana, com a triangulação via
  Leonardo Augusto Furtado Palhares.'
excerpt: não é possível dissociar as condutas de DANIEL VORCARO de seu operador financeiro e cunhado FABIANO
  ZETTEL, cujas ações ilícitas contavam com o apoio incondicional de seu braço armado, conhecido como
  'A Turma'
