summary: Decisão monocrática que decretou a prisão preventiva de Daniel Vorcaro, Fabiano Zettel, Luiz
  Phillipi Machado de Moraes Mourão e Marilson Roseno da Silva, suspendeu empresas vinculadas e impôs
  cautelares a servidores do Banco Central. O conteúdo aqui registrado é o descrito na comunicação oficial
  do STF; a íntegra da decisão está vinculada na página.
excerpt: A investigação aponta a existência de esquema de fraudes bilionárias no mercado financeiro, supostamente
  comandado e coordenado por Vorcaro, que também atuaria na interlocução direta com servidores do Banco
  Central responsáveis pela supervisão bancária no órgão.
