summary: Contrato de três anos, datado de São Paulo, 16/01/2024, assinado digitalmente em 23/01/2024 por
  Daniel Bueno Vorcaro e por Angelo Antonio Ribeiro da Silva. A contratada é representada por seu administrador,
  Guilherme de Toledo Benazzi. O objeto abrange programa de integridade, consultoria estratégica e jurídica
  em inquéritos policiais e procedimentos administrativos — inclusive perante o Banco Central, a Receita
  Federal e o CADE — e processos judiciais em todas as instâncias, e estende-se expressamente aos sócios
  e acionistas controladores do contratante. Prevê a organização de cinco núcleos de atuação perante o
  Judiciário, o Ministério Público, a polícia judiciária, órgãos do Executivo e o Legislativo, este último
  para acompanhamento de projetos de lei de interesse do contratante. Os honorários são de 36 parcelas
  mensais de R$ 3.000.000,00 líquidos, com valor bruto declarado de R$ 3.646.529,77 por mês. Em caso de
  rescisão unilateral pelo contratante, é devido o valor integral do pró-labore.
