date: '2022-03-31'
source_ids:
- src-doem-alcobaca-2022-03-31-convenio-pkl-one-sem-numero
summary: 'Instrumento que o município publicou incompleto: o título traz o número em branco — ''CARTÃO
  DE BENEFÍCIO CONSIGNADO CREDCESTA Nº ___'' — e o fecho traz a data em branco, na fórmula '', de de de
  20''. A cláusula de vigência estabelece sessenta meses improrrogáveis ''a contar da assinatura'', que
  o próprio documento não data. Publicado em onze páginas de imagem, sem camada de texto, e recuperado
  por reconhecimento óptico. Assinam pela empresa os mesmos dois representantes que subscrevem os demais
  instrumentos do grupo.'
