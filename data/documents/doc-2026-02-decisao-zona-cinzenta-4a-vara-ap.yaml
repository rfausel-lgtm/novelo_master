summary: Decisão de 14 páginas do juiz federal Jucelio Fleury Neto em pedido de busca e apreensão criminal
  formulado pela Polícia Federal, com parecer favorável do MPF (manifestação de 26/01/2026). Baixada e
  lida integralmente pela equipe. Enquadra os fatos no art. 4º, caput e parágrafo único, da Lei 7.492/1986
  e firma a competência federal pelo art. 109, VI, da Constituição. Individualiza as condutas de José
  Milton Afonso Gonçalves ('mentor intelectual e principal articulador'), Jackson Rubens de Oliveira ('elemento
  validador') e Jocildo Silva Lemos ('garante institucional'), transcrevendo trechos das atas do CIAP
  de 12, 19 e 30 de julho de 2024. Registra as condições do primeiro aporte (IPCA + 8,35% a.a., vencimento
  em 10 anos), a rejeição de ofertas de Santander, BTG Pactual e Safra, alertas sobre concentração de
  40% da carteira líquida em um único emissor, procedimentos do TCU contra o banco e a recusa da Caixa
  Econômica Federal em adquirir os mesmos ativos. Descreve ainda uma trilha anterior — aportes de R$ 15
  milhões em cotas de FIDC Multisetorial deliberados em setembro de 2021. Defere as buscas na sede da
  Amprev e nos endereços dos três investigados, a quebra de sigilo telemático junto a Apple e Google,
  o compartilhamento de provas com MP-AP, Receita Federal, CGU e Banco Central, o contraditório diferido
  e o sigilo de nível máximo no PJe.
