summary: 'Pareceres do procurador-geral da República em dois incidentes: o da MSMG Patrimonial Ltda., terceira adquirente
  que alega ter comprado e quitado apartamento em Salvador antes da ordem de indisponibilidade, faltando apenas
  o registro; e o de Valério Marega Júnior com as empresas WNT. Em ambos, a PGR conclui pelo levantamento dos bloqueios.
  Na mesma data, em manifestação separada, a PGR deixa de contra-arrazoar o agravo de Guilherme Henrique Sodré Martins
  e da GF4.15, por ser o mesmo o motivo que já sustentara.'
