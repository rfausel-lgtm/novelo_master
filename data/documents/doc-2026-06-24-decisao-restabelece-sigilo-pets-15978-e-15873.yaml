summary: >-
  Restabelece o sigilo anteriormente vigente nas Pets 15.978 e 15.873 para a retomada do trâmite processual,
  com base no art. 20 do "CCP" (assim grafado no texto) e na Súmula Vinculante nº 14, considerando a
  necessidade de resguardar o aporte de novas informações aos autos para viabilizar futuras diligências. No
  cabeçalho, a Polícia Federal figura como interessada e, entre os requeridos, Ciro Nogueira e Felipe Cançado
  Vorcaro; os demais nomes não são reproduzidos. A decisão não menciona a divulgação de 16/06. Hash do PDF
  lido no portal em 16/10/2026.
excerpt: >-
  determino o restabelecimento do sigilo anteriormente vigente no âmbito das PETs nº 15.978 e nº 15.873, para
  a retomada do trâmite processual.
