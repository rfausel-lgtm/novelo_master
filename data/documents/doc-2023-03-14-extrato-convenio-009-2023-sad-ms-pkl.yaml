summary: 'Primeiro credenciamento da PKL One em Mato Grosso do Sul. Dois elementos objetivos o distinguem:
  a convenente é qualificada como ''Banco PKL One Participações S.A'', designação que não corresponde
  a nenhuma autorização do Banco Central; e o objeto declarado é o desconto de ''contribuições e mensalidades
  devidas por seus servidores filiados'', redação própria de convênio com entidade sindical ou associativa
  — não de cartão consignado de benefício, que só apareceria no instrumento de 2025.'
