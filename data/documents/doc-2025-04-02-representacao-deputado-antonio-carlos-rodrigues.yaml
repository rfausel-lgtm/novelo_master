summary: Ofício do Deputado Federal Antônio Carlos Rodrigues (PL/SP) ao Procurador-Geral da República
  Paulo Gonet, alegando "indícios de irregularidades e violações ao interesse público" na aquisição do
  Banco Master pelo BRB, e acusando o Banco Central, a CVM, o FGC e a Anbima de "omissão e inoperância", e
  a diretoria e o conselho do Master de "gestão temerária". O PGR encaminhou à PR-DF em 04/04/2025; Gabriel
  Pimenta Alves reconheceu correlação com a Notícia de Fato que originaria o IPL 2025.0087917 e determinou
  a juntada em 11/04/2025.
