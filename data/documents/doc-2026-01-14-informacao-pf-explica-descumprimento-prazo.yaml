summary: 'O Diretor-Geral da PF, Andrei Rodrigues, responde a determinação do relator para explicar o
  não cumprimento, em 24 horas, da ordem de 12/01/2026 — atribuindo o atraso à instabilidade de endereços
  de alvos em viagem e à sobreposição com sete outras operações da DICOR e a 9ª fase da Operação Overclean
  (distinta da Operação Compliance Zero). Registra que avisou o gabinete do relator por telefone (11/01)
  e WhatsApp (12/01), e que a PF ainda não tinha acesso ao sistema de peticionamento da PET 15.198. Pede
  reconsideração da ordem de lacrar e acautelar os aparelhos apreendidos no gabinete do relator, para
  explorar as "horas de ouro" de perícia em celulares antes de risco de autodestruição lógica de dados.'
