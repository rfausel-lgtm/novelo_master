summary: Decreta a liquidação extrajudicial do Banco Pleno S.A. (CNPJ 61.024.352/0001-71, sede em São
  Paulo/SP), com fundamento nos arts. 15, I, 'a' e 'b', e § 2º, e 16 da Lei nº 6.024/1974, em razão do
  comprometimento da situação econômico-financeira, deterioração da liquidez, infringência às normas da
  atividade bancária e inobservância de determinações do BC (processo PE 300232). Nomeia liquidante José
  Eduardo Victória e fixa como termo legal da liquidação o dia 22 de dezembro de 2025. Assinado por Gabriel
  Muricca Galípolo.
