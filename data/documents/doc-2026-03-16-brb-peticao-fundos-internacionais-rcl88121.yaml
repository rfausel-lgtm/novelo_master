summary: 'O BRB pede tutela de urgência para preservar cotas de três fundos internacionais — International Strategies
  Fund Ltd. e Global Navigator Fund Ltd. (Jersey/Cayman) e Liquidity Strategies Fund Ltd. (Bahamas) — que lhe foram
  alienados pelo Banco Master em 24/07/2025 em quitação compensada com créditos de dois Termos de Endosso de CCB
  (Recompra): o nº 45/2025, de US$ 114.218.734,00, e o nº 47/2025, de US$ 205.500.613,63. O tema específico da retenção
  de fluxos das carteiras cedidas foi desentranhado desta reclamação em 13/03/2026 e autuado como Petição nº 15.719/DF,
  remetida à Justiça Federal de primeiro grau.'
