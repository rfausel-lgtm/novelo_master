title: 'Ato do Presidente nº 1.375/2026 do Banco Central: liquidação extrajudicial da CBSF DTVM (ex-Reag
  Trust DTVM)'
doc_type: regulatory_record
date: '2026-01-15'
source_ids:
- src-cbsf-2026-01-15-comunicado-ato-1375
summary: 'Decreta a liquidação extrajudicial da CBSF Distribuidora de Títulos e Valores Mobiliários S.A.
  (nova denominação da Reag Trust Distribuidora de Títulos e Valores Mobiliários S.A., CNPJ 34.829.992/0001-86),
  por comprometimento da situação econômico-financeira e graves infrações às normas do Sistema Financeiro
  Nacional. Nomeia liquidante a APS Serviços Especializados de Apoio Administrativo Ltda. (CNPJ 46.033.690/0001-86),
  tendo como responsável técnico Antonio Pereira de Souza. O documento faz distinção expressa: a CBSF
  DTVM é pessoa jurídica distinta da REAG IP S.A. (Instituição de Pagamento, CNPJ 36.272.465/0001-49).
  Assinado por Gabriel Muricca Galípolo, com visto de Cristiano Cozer, Procurador-Geral do Banco Central.'
