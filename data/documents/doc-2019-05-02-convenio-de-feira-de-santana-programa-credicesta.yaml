summary: Termo de convênio entre o município de Feira de Santana e a operadora, assinado em 02/05/2019 pelo prefeito
  Colbert Martins da Silva Filho, com vigência de sessenta meses. O objeto é disponibilizar aos servidores ativos
  e inativos, por desconto em folha, 'uma linha de crédito rotativo, através do Programa CREDICESTA'. Antecede em
  quinze meses o instrumento até agora tido como o mais antigo localizado em município, o de Senhor do Bonfim, de
  agosto de 2020, e situa a expansão municipal a nove meses do credenciamento estadual baiano de 03/08/2018 — isto
  é, o produto desceu do estado para os municípios quase imediatamente.
