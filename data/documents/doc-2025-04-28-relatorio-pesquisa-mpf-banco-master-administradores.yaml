summary: Relatório emitido em 28/04/2025 que qualifica o Banco Master a partir dos dados da Receita Federal e junta
  tela da Junta Comercial do Rio de Janeiro. No quadro da Receita, André Kruschewsky Lima aparece como diretor a
  partir de 13/02/2023, mesma data de Augusto Ferreira Lima; na tela da Junta, como procurador de 23/02/2022 a 13/02/2023.
  Dados pessoais constantes do relatório não são reproduzidos.
