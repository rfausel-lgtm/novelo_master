summary: 'Ato que muda o estatuto processual da segunda delação do caso. Até aqui o corpus registrava
  apenas o fechamento do acordo com a Procuradoria-Geral da República; com a homologação pelo relator,
  um dia após a oitiva do colaborador, o material passa a ter validade processual e pode instruir as investigações
  em curso. O conteúdo confirmado é preciso: sete transferências somando US$ 12,3 milhões ao Havengate
  Development Fund, realizadas entre fevereiro e setembro de 2025 a pedido de Daniel Vorcaro. O colaborador
  declara ainda ter sido responsável por obter e entregar grandes quantias em espécie a pessoas indicadas
  pelo banqueiro, parte delas transportada em malas, dizendo desconhecer a finalidade final dos pagamentos.
  Registre-se que a homologação não atesta a veracidade do que é narrado: verifica a regularidade e a
  voluntariedade do acordo, cabendo às provas de corroboração sustentar cada alegação.'
