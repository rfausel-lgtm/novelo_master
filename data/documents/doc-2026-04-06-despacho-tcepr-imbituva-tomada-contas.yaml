summary: Despacho do Conselheiro Augustinho Zucchi, relator, convertendo Representação em Tomada de Contas Extraordinária
  contra o Fundo de Previdência Municipal de Imbituva (PR), por dano ao erário de aproximadamente R$ 4 milhões decorrente
  de aplicação em Letra Financeira do Banco Master. Cita como responsáveis solidários, com base no art. 8º-A da
  Lei 9.717/98, os gestores do fundo e a consultoria Crédito e Mercado Engenharia Financeira Ltda.
