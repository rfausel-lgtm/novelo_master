summary: 'Refuta reportagens de tentativa de venda após a operação: tratativas desde 2024, proposta do Grupo City
  aceita em abril de 2025, adiantamento de R$ 2 milhões em maio de 2025, imposto de ganho de capital pago em 30/06/2025
  e escrituras de 18/05/2026. Afirma que em 19/06/2026 a escritura foi apresentada a registro pela compradora, com
  procuração dada na própria escritura, que o cartório averbou a indisponibilidade e que o imóvel permaneceu em
  nome de Wagner, de cuja decisão a defesa só teve ciência em 26/06/2026.'
excerpt: O 1º Ofício de Registro de Imóveis averbou a indisponibilidade
