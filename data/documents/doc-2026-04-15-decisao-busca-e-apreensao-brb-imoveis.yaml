summary: 'Decisão de André Mendonça que autoriza busca e apreensão pessoal e domiciliar contra seis alvos —
  Paulo Henrique Bezerra Rodrigues Costa, Daniel Lopes Monteiro, Thaísa Menzato, Hamilton Edward Suaki, Arthur
  Caixeta Nogueira e o escritório Monteiro Rusu — no esquema de propina imobiliária ao ex-presidente do BRB,
  operado via seis empresas de fachada controladas pelo FIP Alucard (REAG Portfolio Solutions). Nomeia
  Hamilton Suaki como cunhado de Daniel Lopes Monteiro e diretor de uma das empresas (Allora S.A.).'
