summary: >-
  Registro oficial de andamentos do Mandado de Segurança 41.085 (impetrante Alessandro Vieira; impetrado o
  Presidente do Senado Federal; relator Cristiano Zanin), consultado em 16/10/2026: petição inicial em 15/09;
  distribuição em 22/09; liminar indeferida por decisão monocrática em 22/09 (DJE divulgado em 22/09);
  reconsideração em 25/09; Ofícios 22540/2026 e 22541/2026, ao Presidente do Senado e à AGU, em 28/09; agravo
  regimental e despacho em 29/09; petição do tipo "Informações" em 13/10; vista à PGR em 14/10. A certidão de
  distribuição registra a exclusão do Presidente do TSE da distribuição, somente para liminares, de 04/07 a
  24/11/2026, com base no art. 67, § 5º, do RISTF; o Novelo não extrai disso nenhuma consequência. O documento
  é o registro dos atos no portal; o inteiro teor da decisão de 22/09 não foi lido. Captura de texto em raw/
  (nomes de advogados omitidos); o sha256 é o da captura.
