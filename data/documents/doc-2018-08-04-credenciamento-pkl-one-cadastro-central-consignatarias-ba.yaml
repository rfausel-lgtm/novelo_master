summary: A empresa entra pela porta que o decreto abrira, três meses depois dele. A decisão é assinada
  pelo mesmo secretário da Administração que referendara o decreto do Programa Credicesta. Seguiu-se o
  Contrato de Cooperação nº 079/2018, assinado em 20/09/2018 com vigência de 48 meses, cujo objeto reproduz
  a fórmula do art. 3º do decreto — produtos e serviços 'inclusive comerciais, creditícios, financeiros,
  securitários e congêneres' — e que se fundamenta expressamente naquele ato. O contrato foi renovado
  em 21/09/2022, e nenhum ato estadual posterior sobre o programa foi localizado no diário baiano entre
  2023 e 2026.
