summary: Perícia da Polícia Federal, concluída em 13/08/2026 e com sigilo levantado em 11/09/2026 por ordem da Presidência
  do STF, sobre a aquisição pelo BRB de carteiras de crédito do Banco Master. Analisa R$ 17,5 bilhões em operações
  e conclui que o BRB concentrou 90,3% de suas carteiras adquiridas de terceiros no Master, com pico de R$ 19,8
  bilhões em junho de 2025; que R$ 7,6 bilhões, em 22 operações (43,41% do total desembolsado em varejo), foram
  pagos antes da conclusão dos ritos internos e laudos técnicos obrigatórios; e caracteriza a gestão da diretoria
  do BRB, então presidida por Paulo Henrique Costa, como 'gestão fraudulenta', por manipulação de procedimentos
  de governança e formalização retroativa de controles.
