summary: A PF pede reconsideração parcial da decisão de 06/01/2026 (que indeferira nova busca no endereço
  atual de Daniel Vorcaro), citando notícias sobre o "Projeto DV" — campanha de cerca de 40 influenciadores,
  ofertas de até R$ 2 milhões por contrato, para defender a imagem de Vorcaro e atacar a legitimidade do
  Banco Central — como indício de novos crimes (art. 3º da Lei 7.492/86). Pede, subsidiariamente,
  compartilhamento das provas da Compliance Zero caso a busca seja negada.
