title: Extrato do Convênio de Consignação nº 005/2025 - SAD/MS — renovação até 2027
doc_type: contract
date: '2025-03-12'
source_ids:
- src-doems-2025-03-12-extrato-convenio-005-2025-pkl
summary: Renovação do credenciamento, assinada em 11/03/2025 com vigência até 10/03/2027. O objeto agora
  menciona expressamente o cartão consignado de benefício, e o prefixo 'Banco' desaparece do nome da convenente.
  A fundamentação jurídica invocada permanece um parecer referencial de 2020, sem manifestação individualizada
  — o mesmo fundamento usado, na mesma página do diário oficial, para credenciar duas entidades sindicais.
  Assinam Frederico Felini pelo Estado e, pela empresa, Ana Paula de Almeida Pithon e Andrea Lima Novaes.
