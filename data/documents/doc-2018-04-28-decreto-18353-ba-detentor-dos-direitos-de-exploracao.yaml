- src-doeba-2015-11-19-edital-001-2015-alienacao-ebal-credicesta
summary: 'A peça de origem de todo o caso, e a mais explícita que a apuração encontrou. Assinado por Rui
  Costa em 27 de abril de 2018 — o mesmo dia em que se realizou o leilão que alienou a estatal de alimentos
  — e publicado no dia seguinte, o decreto converte um cartão de compras de rede de supermercados estatal
  em veículo de crédito. Fixa margem de consignação de 30% da remuneração líquida e, no art. 3º, assegura
  ao ''detentor dos direitos de exploração comercial'' a faculdade de ''diversificar as funcionalidades
  do cartão'', associando-lhe ''a contratação de serviços, inclusive comerciais, creditícios, financeiros,
  securitários e congêneres''. O beneficiário é nomeado em abstrato, por uma qualidade contratual, e não
  por identidade — de modo que o ato produz efeitos para quem viesse a adquirir os direitos. O art. 9º
  compromete a secretaria da Administração a ''garantir a efetivação dos descontos mensais''. A fórmula
  não era inédita: o edital de alienação de 2015, que não se consumou, já previa transferir ao comprador
  ''a titularidade e a gestão plenas'' do cartão com direito de ''diversificar as finalidades do programa''.'
