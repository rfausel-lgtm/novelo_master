excerpt: Ao detentor dos direitos de exploração comercial relativos ao Cartão do Programa Credicesta é
  assegurado modificar, ampliar, aperfeiçoar ou, por quaisquer mecanismos viáveis e juridicamente legítimos,
  diversificar as funcionalidades do cartão referido, a este podendo associar a ampliação da rede de compras
  e a contratação de serviços, inclusive comerciais, creditícios, financeiros, securitários e congêneres.
