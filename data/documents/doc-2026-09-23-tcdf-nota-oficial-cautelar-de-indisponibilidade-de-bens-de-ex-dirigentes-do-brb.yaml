summary: >-
  Nota institucional do TCDF sobre a decisão do Plenário de 23/09/2026 em sessão reservada: indisponibilidade
  cautelar de bens de ex-integrantes da alta administração do BRB, por um ano, com 30 dias para manifestação;
  instrução prioritária do processo para avaliar a extensão a outros agentes; conversão em Tomada de Contas
  Especial; 24 horas para o BRB enviar o relatório da auditoria independente; 30 dias para o atual
  diretor-presidente justificar o descumprimento de determinação anterior; 15 dias para o BRB esclarecer a
  representação do Ministério Público de Contas do DF. A nota não nomeia os atingidos nem informa valor ou
  relator.
excerpt: A medida tem por objetivo resguardar eventual ressarcimento aos cofres públicos diante de indícios
  apontados em apurações relacionadas a operações conduzidas pela instituição financeira.
