summary: Parecer de investimentos de 2024 do IPA (Instituto de Previdência dos Servidores Municipais de Angélica),
  que credenciou o Banco Master em abril daquele ano e concluiu, no mesmo documento, que 'não foram encontrados
  indícios ou números que possam prejudicar a aprovação das Aplicações e Aportes dos Recursos do IPA'. É o mesmo
  instituto que, cerca de dois anos depois, se tornaria alvo das operações Zehirut e Charitzut da Polícia Federal
  — mas que, segundo a própria administração, já havia resgatado o valor aplicado semanas antes da liquidação do
  banco e das prisões de seus executivos.
