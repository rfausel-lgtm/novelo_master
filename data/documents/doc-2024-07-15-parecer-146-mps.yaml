summary: Primeira manifestação oficial pública do ministério sobre a elegibilidade de emissores que não
  constam da Lista Exaustiva. Nasce de consultas feitas pelo sistema Gescon-RPPS e assenta que a lista
  é orientativa, mas que cabe ao regime próprio garantir o cumprimento integral dos requisitos mesmo quando
  a instituição ainda não esteja listada. Assinado três dias depois do primeiro aporte da Amprev no Banco
  Master.
