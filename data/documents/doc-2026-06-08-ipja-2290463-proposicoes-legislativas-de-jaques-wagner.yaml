summary: 'Informação de Polícia Judiciária de Análise do NAI/CRC/CGRC/DICOR/PF, de 38 páginas, juntada como peça
  005 da PET 16.230. Foi produzida em atendimento a requisição da própria Procuradoria-Geral da República (ofício
  ASSCRIM/PGR nº 726146/2026) sobre proposições apresentadas ou endossadas pelo senador Jaques Wagner que pudessem
  interessar ao Banco Master, a Daniel Vorcaro e a Augusto Ferreira Lima. A PF cruzou 105 relatorias, 879 autorias
  e 373 votos favoráveis do senador, de 2019 a 2026, com o conteúdo de dois celulares apreendidos em 2025, e concluiu
  que, na maior parte das proposições selecionadas, nada foi encontrado. O capítulo que avança é o do PL 412/2022,
  sobre o mercado regulado de carbono. É relatório de análise, não representação: não formula pedido algum.'
