title: E-mail de Paula Vouguinha, do Banco Master, remetendo a documentação de credenciamento ao Itaprevi
doc_type: letter
date: 2024-01
source_ids:
- src-itaprevi-processo-200000015-2024
summary: Duas mensagens juntadas aos autos, com os assuntos 'Credenciamento Banco Master S.A - Itaguaí/RJ
  - ITAPREVI' e a mesma linha com 'Parte 2'. O corpo enumera a documentação anexada — ato de autorização
  do Banco Central e certidão da situação da instituição, certidão conjunta negativa de débitos federais,
  certidões negativas municipais e estaduais, certificado de regularidade do FGTS, atas de assembleia
  com as eleições de diretoria e certidões de falência — e informa que os demais documentos seguiriam
  no e-mail seguinte. É assinado por Paula Vouguinha, Relações Institucionais, no endereço do banco na
  Avenida Brigadeiro Faria Lima. A mesma pessoa participou da sessão de credenciamento do regime próprio
  de Aparecida de Goiânia em dezembro de 2023 e apresentou a instituição ao comitê de investimentos do
  Amapá em março de 2024.
