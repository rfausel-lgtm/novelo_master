excerpt: Sendo assim, seguem em anexo os documentos listados abaixo (...) Encaminharemos os demais documentos
  no próximo e-mail. Peço que, por gentileza, acuse recebimento do presente e-mail. Atenciosamente, Paula
  Vouguinha — Relações Institucionais
