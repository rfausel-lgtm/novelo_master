title: 'Decisões de declínio de competência e de embargos na cautelar do Rioprevidência contra o Master (TJRJ, 10 e 11/03/2026)'
date: '2026-03-10'
source_ids:
- src-djen-cnj-cautelar-3049678-2025-tjrj
summary: 'Na Tutela Cautelar Antecedente 3049678-51.2025.8.19.0001, a 2ª Vara da Fazenda Pública da Capital do Rio
  de Janeiro declinou, em 10/03/2026, da competência para a Justiça Federal, com fundamento no art. 109, I, da
  Constituição e na Súmula 150 do STJ, sem outra motivação. Em 11/03/2026, acolheu embargos de declaração para
  manter os efeitos da tutela já deferida — que autorizava o Rioprevidência a reter repasses ao Master — "haja
  vista o potencial efeito lesivo aos cofres públicos de sua revogação", deixando eventual reanálise ao juízo
  competente.'
