summary: >-
  Despacho da Presidência na PET 16.704, transcrito nos andamentos do portal do STF (consulta de 16/10/2026; página
  dinâmica). Considerando os requerimentos pendentes, determina a oitiva da PGR, em cinco dias, sobre todas as
  providências postuladas nos Docs. 161, 163, 166, 175, 180, 184, 189 e 194, inclusive quanto à pertinência,
  necessidade, adequação e eventual repercussão sobre procedimentos investigativos em curso; no mesmo dia, "Vista à
  PGR". Os andamentos não identificam o conteúdo dos documentos citados nem os peticionantes das petições
  posteriores. O hash refere-se à captura de texto guardada em raw/.
excerpt: entendo necessária a oitiva da Procuradoria-Geral da República acerca de todas as providências postuladas
