summary: 'O relatório da administração de 2024 afirma que o cartão de benefício estava presente em 24
  estados e 176 municípios, ''ante 20 em 2023'' e 130 municípios. O problema é que o balanço do próprio
  exercício de 2023 dizia outra coisa: 23 estados e 135 municípios. E o de 2022 falava em 21 estados e
  130 municípios. São três números irreconciliáveis para a mesma série, em demonstrações auditadas sem
  ressalva. Duas notas explicativas acompanham a expansão: ''serviços pagos antecipadamente para apoio
  operacional de convênios'' salta de R$ 33,3 milhões para R$ 202,5 milhões em um ano, e ''valores a receber
  de vendas de ativos de crédito'' vai de R$ 1,23 bilhão a R$ 3,66 bilhões. Em nenhum dos três balanços
  a expressão ''PKL One'' aparece uma única vez: a empresa que consta do contracheque do servidor não
  figura nas contas do banco.'
