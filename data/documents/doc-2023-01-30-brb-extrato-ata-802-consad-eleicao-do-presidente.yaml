summary: >-
  Extrato publicado pela área de Relações com Investidores do BRB. No item 02, o Conselho de Administração elege
  o seu presidente (art. 24, §1º do Estatuto), "resultando eleito, por unanimidade, o senhor Marcelo Talarico";
  o extrato lista os conselheiros do mandato, entre eles Paulo Henrique Bezerra Rodrigues Costa. Prova a
  eleição de 30/01/2023; não informa se Talarico presidia o conselho antes dessa data.
