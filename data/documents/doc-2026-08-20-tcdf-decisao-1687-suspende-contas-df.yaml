summary: Decisão do conselheiro-relator Paulo Tadeu suspendendo o prazo regimental de 60 dias para
  apreciação das contas de 2025 do governo do Distrito Federal até que o BRB entregue balanço financeiro
  auditado completo, e concedendo 30 dias à Casa Civil do DF e ao BRB para esclarecer o atraso — inclusive
  se há vínculo com a contratação de um empréstimo de R$ 6,6 bilhões e se CVM ou Banco Central abriram
  procedimento próprio.
