summary: 'Petição de 47 páginas protocolada pelos advogados Paulo César R. de Faria (OAB/GO) e Filipe Rocha
  de Oliveira (OAB/ES), sem vínculo processual identificado com o caso, relatando vídeo do deputado federal
  André Janones chamando André Mendonça de "vagabundo" e acusando-o de ter afastado o diretor-geral da PF
  para se proteger. Pede prisão em flagrante de Janones, quebra de imunidade parlamentar e remessa ao TSE,
  citando o precedente da prisão de Daniel Silveira (Inq. 4.781, 2021), juntado como anexo.'
