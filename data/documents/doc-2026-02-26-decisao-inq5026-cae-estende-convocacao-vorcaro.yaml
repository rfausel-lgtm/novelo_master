summary: 'Registra que "a Comissão de Assuntos Econômicos do Senado Federal, na pessoa do seu Presidente,
  Senador Renan Calheiros, requer autorização para a apresentação do investigado DANIEL BUENO VORCARO, a
  fim de prestar depoimento perante a Comissão" — estende para 10/03/2026 autorização antes deferida para
  24/02/2026 (decisão de 19/02/2026, e-Doc. 323).'
