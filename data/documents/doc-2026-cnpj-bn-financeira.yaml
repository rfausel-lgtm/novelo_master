summary: 'Registro do Cadastro Nacional da Pessoa Jurídica, reproduzido do conjunto de dados abertos da
  Receita Federal e consultado pela equipe. Fixa a identidade que a imprensa tratou como duas empresas:
  razão social BN FINANCEIRA LTDA, nome fantasia BK FINANCEIRA. Abertura em 08/07/2021, microempresa,
  capital social de R$ 45.000,00, situação ativa, sede em Salvador. CNAE principal 6399-2/00, com secundário
  6619-3/02 — correspondentes de instituições financeiras. Quadro societário com Bonnie Toaldo Bonilha
  como sócia-administradora desde a constituição e Moisés Dantas dos Santos como sócio desde 30/08/2022.'
