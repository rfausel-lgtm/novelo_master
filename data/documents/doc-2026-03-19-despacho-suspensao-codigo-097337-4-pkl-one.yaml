title: Despacho que suspende o código de desconto da PKL One na folha estadual paulista
doc_type: administrative_act
date: '2026-03-19'
source_ids:
- src-doesp-2026-03-19-suspensao-codigo-097337-4-pkl-one
summary: 'O fecho do arco normativo: o Estado suspende o código 097337-4 com efeitos a partir de 19/02/2026
  invocando o descumprimento do art. 6º, inciso IX, do decreto de consignações — precisamente o inciso
  criado pelo decreto de 2022 para acolher a empresa. A exigência de convênio com instituição financeira
  autorizada pelo Banco Central, que servira de porta de entrada, tornou-se o fundamento da saída depois
  da liquidação extrajudicial do Banco Master. Trata-se de suspensão de código, não de descredenciamento.'
