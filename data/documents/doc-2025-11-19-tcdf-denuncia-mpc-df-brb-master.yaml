summary: Comunicado oficial do TCDF anunciando o recebimento de nova denúncia do Ministério Público de Contas
  do DF, com representação também de parlamentar da CLDF, no processo nº 00600-00003617/2025-75, que, segundo
  a ficha do e-TCDF consultada em 15/10/2026, foi autuado em 01/04/2025, sobre possível contorno, pelo BRB,
  de restrição do Banco Central à aquisição do Banco Master — apontando falhas de governança, ausência de
  diligência prévia e riscos ao erário distrital, e a insuficiência de documentos comprobatórios nas
  respostas do BRB.
