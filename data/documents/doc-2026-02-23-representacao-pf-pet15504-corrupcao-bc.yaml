summary: 'A Polícia Federal representa ao ministro André Mendonça pela instauração de petição sigilosa em apartado
  do INQ 5.026, "destinada exclusivamente à apuração dos fatos relacionados à possível prática de crimes de corrupção
  e correlatos envolvendo servidores do alto escalão do Banco Central do Brasil, no contexto da influência exercida
  por Daniel Bueno Vorcaro". Fundamenta-se na análise do celular de Vorcaro e em notícia-crime do próprio Banco
  Central sobre servidores do Departamento de Supervisão Bancária.'
