summary: Prova documental de que o produto seguiu operando e gerando conflito muito depois das liquidações.
  O diário de Santos publicado nesta data traz quatro protocolos contra a operadora sob a marca do produto,
  todos classificados como fundamentada não atendida — ou seja, o consumidor reclamou, o órgão considerou
  a reclamação procedente e a empresa não atendeu. Campinas registra processos em quatorze edições entre
  julho de 2025 e junho de 2026; Bauru, sete ocorrências até dezembro de 2025, com pares de protocolo
  que reúnem operadora e banco no mesmo atendimento.
