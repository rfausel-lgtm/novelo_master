summary: Levantamento cadastral pedido pela PGR. Registra que a Sodré Martins Serviços Administrativos, constituída
  em 19/02/2021 em São José do Rio Preto (SP), tem Guilherme Henrique Sodré Martins com 60% do capital e Eduardo
  Mendonça Sodré Martins com 10%, entre outros sócios; que a GF4.15 Participações e Consultoria tem Guilherme como
  único sócio administrador; e que Fernando de Góes Mascarenhas Filho integrou a diretoria da PKL One de 21/10/2020
  a 06/07/2021.
excerpt: possui como único sócio administrador GUILHERME HENRIQUE SODRÉ MARTINS
