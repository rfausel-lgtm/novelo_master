summary: Decisão de Flávio Dino, relator da ADI 7.791 no STF, em três páginas. Transcreve o dispositivo da
  decisão de 24/09/2026 (eDOC 199) e registra que a Gerência de Processos Originários Cíveis certificou a
  ausência de manifestação da CVM (eDOC 215), mas que as informações foram prestadas pela União, com a íntegra
  do processo administrativo SEI nº 19957.001206/2022-08 (eDOC 211) e o espelho de tramitação (eDOC 209); que
  foram informadas as unidades técnicas e identificados, nominalmente, os agentes responsáveis pela autuação,
  instrução e decisão de arquivamento, sem que a decisão os nomeie; que se esclareceu a classificação
  originária de sigilo e seu levantamento formal; e que não houve remessa ou compartilhamento externo de dados
  do processo com o MPF, o Banco Central, a PF ou o Coaf. Considera integralmente cumpridas as determinações
  do eDOC 199 e, tendo em vista a instauração de inquérito policial já comunicada pela PF em autos apartados,
  manda trasladar a decisão, a petição da União e os eDOCs 208-211 para a PET 16.814, com ciência à autoridade
  policial. Não traz o número do inquérito.
excerpt: Tendo em vista a instauração de inquérito policial, já comunicada pela Polícia Federal em autos apartados
