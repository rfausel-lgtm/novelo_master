reference: STF, PET 15.556, decisão monocrática de 24/07/2026 (e-Doc 353)
excerpt: 'as investigações em trâmite relativas à Operação Compliance Zero apontam que o Banco Master S.A.,
  então controlado por DANIEL BUENO VORCARO, teria estruturado esquema de captação agressiva de recursos
  mediante a emissão de Certificados de Depósito Bancário (CDBs)... os valores captados teriam sido
  direcionados a operações financeiras de elevado risco, à aquisição de ativos de baixa liquidez e à
  estruturação de fundos vinculados ao próprio conglomerado econômico'
