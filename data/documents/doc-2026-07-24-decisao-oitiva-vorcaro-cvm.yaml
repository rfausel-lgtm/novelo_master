summary: Decisão do ministro André Mendonça que autoriza a CVM a ouvir Daniel Vorcaro, preso, no interior
  do estabelecimento prisional, para instruir três Investigações Administrativas sancionadoras (Ambipar;
  notas comerciais dos fundos CITY-02, CITY, Máxima FIM, MN I e ST 1001 FIDC; CRIs dos mesmos fundos),
  resguardado o direito ao silêncio e a assistência de defesa técnica.
