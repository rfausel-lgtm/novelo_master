summary: O Tribunal de Contas de Mato Grosso do Sul abriu, por representação do Ministério Público de Contas do
  Estado, uma única auditoria para apurar a regularidade das aplicações em Banco Master feitas pelos regimes próprios
  de previdência de Fátima do Sul, Jateí, São Gabriel do Oeste, Angélica e Campo Grande — R$ 16 milhões somados.
  O processo, ainda em fase de planejamento dois meses após a liquidação do banco, examinará documentalmente o passo
  a passo de cada decisão de investimento, sem prazo de conclusão definido; a manifestação dos entes só ocorrerá
  depois de concluído o relatório técnico da Divisão de Fiscalização. É a mesma lógica de auditoria unificada que
  o TCE-RJ aplicou ao Rioprevidência, mas em escala municipal e coordenando cinco entes de uma vez.
