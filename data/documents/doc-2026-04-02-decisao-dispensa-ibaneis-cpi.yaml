summary: Decisão do ministro André Mendonça que afasta a obrigatoriedade de comparecimento do governador
  do Distrito Federal, Ibaneis Rocha Barros Júnior, à CPI do Crime Organizado, por já figurar como
  investigado — reproduzindo a justificativa da própria CPI de que ele está no centro de dois eixos de
  investigação ligados ao caso Master.
