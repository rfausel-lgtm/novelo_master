id: doc-2025-12-19-liminar-retencao-consignados-amapa
kind: document
title: Decisão liminar que autorizou a retenção dos consignados devidos ao Banco Master
doc_type: judicial_decision
date: '2025-12-19'
source_ids:
- src-tjap-autos-6102005-63-2025
summary: Concede a tutela para autorizar o Estado do Amapá e a Amprev a reter os valores devidos ao banco
  a título de repasses de empréstimos descontados em folha, provisionando-os em conta a ser aberta no
  Banco do Brasil até o julgamento de mérito. Impõe aos autores a obrigação de prestar contas ao juízo
  a cada noventa dias e proíbe o banco de adotar qualquer medida constritiva, administrativa ou judicial,
  contra servidores, aposentados e pensionistas, sob multa diária de R$ 100 mil limitada a R$ 200 milhões.
  Registra que a petição inicial veio acompanhada de planilhas de pagamentos de consignados, ofício da
  Amprev ao Banco Central, relatório de investimentos e ata do comitê.
