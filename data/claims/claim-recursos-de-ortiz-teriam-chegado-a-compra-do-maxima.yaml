id: claim-recursos-de-ortiz-teriam-chegado-a-compra-do-maxima
kind: claim
statement: Segundo fonte anônima do mercado financeiro ouvida pelo ICL Notícias, recursos oriundos de
  lavagem de dinheiro do narcotraficante espanhol Oliver Ortiz de Zarate Martin teriam chegado, por meio
  de fundos do Grupo Aquilla, à operação de compra do Banco Máxima em 2017.
classification: A
status: disputed
claimant: Fonte anônima do mercado financeiro, via ICL Notícias
date: '2026-03-09'
related_entity_ids:
- oliver-ortiz-de-zarate-martin
- benjamim-botelho-de-almeida
- grupo-aquilla
