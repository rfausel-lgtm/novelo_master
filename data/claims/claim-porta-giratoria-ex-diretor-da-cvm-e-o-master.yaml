id: claim-porta-giratoria-ex-diretor-da-cvm-e-o-master
kind: claim
statement: A Polícia Federal registrou como suspeita a sequência em que o diretor da CVM Henrique Machado
  relatou e votou pela aceitação de termo de compromisso favorável a Daniel Vorcaro em dezembro de 2020
  e, cerca de seis meses depois, ao fim do mandato, passou a integrar escritório de advocacia que presta
  serviços ao Banco Master e ao próprio Vorcaro.
classification: A
status: disputed
