id: claim-recursos-do-proprio-maxima-financiaram-a-compra-do-controle
statement: Parcela expressiva dos recursos usados para adquirir as ações do controlador do Banco Máxima
  teria se originado no próprio banco, por transferências sucessivas entre a instituição, empresas de
  Daniel Vorcaro e fundos de investimento.
