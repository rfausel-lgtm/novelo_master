  attempted_refutation: Tentou-se opor ao voto de fevereiro o voto de outubro do mesmo ano, que afirma
    o contrário sobre a origem dos recursos, e considerar que os extratos liberados têm trechos cobertos
    por tarjas justamente na descrição do fundo comprador. Nenhuma das duas versões pôde ser conferida
