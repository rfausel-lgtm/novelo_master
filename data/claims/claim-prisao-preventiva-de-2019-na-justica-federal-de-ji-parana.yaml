limits: 'A equipe editorial não localizou confirmação independente nem o número do processo, e a verificação
  conduzida em setembro de 2026 permaneceu negativa: não há peça processual, decisão, certidão, nota de
  tribunal ou cobertura contemporânea que comprove o mandado. Três ressalvas adicionais pesam contra a
  formulação original: a reportagem descreve ''prisão preventiva de cinco dias'', medida inexistente no
  direito brasileiro (preventiva não tem prazo; cinco dias prorrogáveis é temporária, da Lei 7.960/1989);
  a Folhapress, cobrindo o mesmo lote documental do BC, afirma que não havia inquérito policial ou ação
  criminal contra Vorcaro até então; e a Gazeta do Povo situa o esquema em Roraima, não em Rondônia. Existe,
  por outro lado, linha investigativa federal documentada em Ji-Paraná desde janeiro de 2019, o que torna
  a alegação plausível sem torná-la provada.'
