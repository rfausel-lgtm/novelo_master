id: claim-prisao-preventiva-de-2019-na-justica-federal-de-ji-parana
statement: Quatorze dias depois do voto que aprovou a transferência de controle, em 29 de outubro de 2019,
  a Justiça Federal de Ji-Paraná teria decretado prisão preventiva contra o banqueiro, nunca cumprida.
