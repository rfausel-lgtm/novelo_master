adversarial_review:
  reviewed_at: '2026-09-03'
  reviewer: orquestrador
  attempted_refutation: 'Nova rodada de verificação em setembro de 2026, com busca por peça processual,
    consulta ao DataJud/CNJ pelos números associados à frente rondoniense, e busca por cobertura contemporânea
    de 2019-2020: nada localizado. Encontrou-se, em sentido contrário, afirmação da Folhapress de que
    não havia inquérito ou ação criminal contra Vorcaro até então, e divergência entre fontes quanto ao
    estado (Rondônia x Roraima). Identificou-se também incoerência jurídica na descrição da medida. Em
    sentido favorável, confirmou-se a existência de linha investigativa federal em Ji-Paraná desde janeiro
    de 2019, o que explica por que haveria feito contra ele naquele juízo. Mantida como alegação de fonte
    única não verificada, com enfraquecimento adicional da formulação.'
  outcome: weakened
