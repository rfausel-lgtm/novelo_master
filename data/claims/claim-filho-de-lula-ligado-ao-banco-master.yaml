id: claim-filho-de-lula-ligado-ao-banco-master
kind: claim
statement: Fábio Luís Lula da Silva, filho do presidente da República, teria ligação com o Banco Master,
  tendo feito prospecção de negócios ao lado de empresários envolvidos na compra do banco.
classification: A
status: refuted
claimant: Coluna de opinião de Cláudio Humberto, replicada por agregadores
date: '2026-01-02'
related_entity_ids:
- banco-master
- grupo-fictor
event_ids: []
evidence_ids:
- ev-familia-presidencial-ausente-das-pecas-do-caso-master
- ev-armadilha-de-homonimia-do-apelido-careca
- ev-relatorio-da-cpmi-do-inss-foi-rejeitado
source_ids:
- src-verificacao-textual-equipe-filhos-de-lula
