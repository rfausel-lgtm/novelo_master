adversarial_review:
  reviewed_at: '2026-09-04'
  reviewer: orquestrador
  attempted_refutation: 'Buscou-se documento oficial que registrasse indicação, ofício ou correspondência
    do senador relativa à nomeação: nenhum localizado. Buscou-se, no inteiro teor da decisão judicial
    da operação, qualquer menção a ele: zero ocorrências. O que subsiste é a declaração do nomeado, documentada
    e repetida, contra a negativa do senador — sem terceiro elemento que decida entre as duas versões.'
  outcome: disputed
