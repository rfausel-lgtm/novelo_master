id: claim-alcolumbre-convidou-jocildo-para-a-amprev
kind: claim
statement: Davi Alcolumbre convidou Jocildo Silva Lemos para presidir a Amapá Previdência, cargo cuja
  nomeação formal coube ao governador Clécio Luís.
