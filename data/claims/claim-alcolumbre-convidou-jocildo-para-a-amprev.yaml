limits: 'A afirmação é do próprio beneficiário da nomeação, feita duas vezes em registro oficial da autarquia
  — em 02/05/2024 e em 17/09/2025 —, e não de fonte anônima ou de peça acusatória. Mas ''convite'' não
  é ato jurídico: a Lei estadual 0915/2005 atribui a escolha exclusivamente ao governador, e nenhum documento
  oficial registra participação do senador no processo. Alcolumbre nega em termos categóricos. A decisão
  judicial que autorizou a operação Zona Cinzenta não o menciona uma única vez, e ele não é investigado,
  indiciado, acusado nem réu em nenhuma apuração relativa ao caso.'
counter_position:
- kind: denial
  summary: É falsa e irresponsável qualquer tentativa de vincular o presidente do Senado a essas nomeações
    ou decisões; o senador não possui qualquer participação, influência ou atribuição em nomeações, decisões
    administrativas ou escolhas de investimento da Amapá Previdência.
