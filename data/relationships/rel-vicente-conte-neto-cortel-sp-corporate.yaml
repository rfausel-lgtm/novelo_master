description: 'Segundo reportagem do O Bastidor transcrita na decisão do Min. Flávio Dino na ADPF 1.196, Vicente
  Conte Neto é conselheiro da Cortel, diretor da Zion Capital e um dos fundadores do fundo Brazilian Graveyard.
  O voto da CVM de 25/11/2025 confirma que, em 2022, um conselheiro da Cortel identificado pelas iniciais V.C.N.
  acompanhou a compra de cotas do fundo, e a síntese das defesas registra que a Zion Capital, acionista relevante
  da Cortel, indicara V.C.N. ao conselho. A CVM usa só iniciais; a correspondência com o nome vem da imprensa.'
