label: mensagens e contatos (2023-2024), segundo o UOL
start_date: '2023-11'
description: >-
  Segundo o UOL (16/10/2026), mensagens extraídas pela PF do celular de Vorcaro registram contatos entre os
  dois desde novembro de 2023 em torno da captação de institutos estaduais de previdência pelo Master, a oferta
  de jatos e de hospedagem em hotel em São Paulo a Rueda, a apresentação a Vorcaro da contratação do escritório
  Rueda & Rueda em quatro ações (R$ 15,4 milhões), um pedido de Rueda, em 12/07/2024, para que Vorcaro apagasse
  mensagens, e encontros com ACM Neto em 2024. O UOL ressalva que as mensagens não mostram pagamento de comissão
  diretamente a Rueda. Uma só apuração, sem Pet, relatório ou decisão conhecidos. Rueda diz que a relação com o
  Master era eminentemente profissional e nega a viagem de novembro de 2023 e as negociações do Amapá.
