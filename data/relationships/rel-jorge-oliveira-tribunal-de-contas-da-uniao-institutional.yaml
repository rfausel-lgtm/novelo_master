description: >-
  Jorge Oliveira tomou posse como ministro do TCU em 31/12/2020, segundo o próprio tribunal, e é vice-presidente
  para 2026, segundo o Poder360. É o relator do Acórdão 5163/2026 da 2ª Câmara, de 13/10/2026, que sobrestou o
  julgamento das contas de 2025 do Banco Central, e, segundo o mesmo acórdão, do TC 008.216/2025-8, ligado à
  operação entre o BRB e o Banco Master. Relação de cargo; não descreve conduta.
