label: contrato de honorários de êxito (5%) em ações de precatórios, segundo a imprensa e o próprio escritório
description: >-
  Segundo o Metrópoles e a CNN Brasil (21/09/2026), que dizem ter obtido o documento, o Banco Master contratou o
  escritório para atuar em 12 ações do setor sucroalcooleiro, com honorários de êxito de 5% líquidos sobre o que
  o banco recebesse; pelo cálculo do Metrópoles sobre o valor de face das causas, os honorários chegariam a R$ 427
  milhões, apenas em caso de êxito (alegação atribuída). O escritório declarou, em nota de 23/09/2026, ter
  contrato formal com o Master para atuar em processos de precatórios, com taxa de êxito de 5%, e disse não ter
  recebido nenhum pagamento. O contrato não é público e sua data não está confirmada.
