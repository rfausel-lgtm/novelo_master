description: 'Flávio Bolsonaro acusa publicamente Alcolumbre de bloquear o andamento de pedidos de impeachment contra
  Moraes por amizade pessoal, em vez de deixá-los tramitar. Alcolumbre não negou nem confirmou a caracterização
  de ''proteção'': em vez de responder diretamente, contra-atacou citando o financiamento do Dark Horse por Daniel
  Vorcaro — o mesmo banqueiro cujas mensagens com Moraes estão no centro da crise institucional apurada pelo corpus.
  Achado em 13/09/2026: em 02/09/2026, na véspera da decisão de Moraes contra Mendonça, os dois se reuniram
  reservadamente por cerca de três horas na residência de Alcolumbre; horas depois, Alcolumbre saiu em defesa
  pública de Moraes. Nenhuma fonte relata o conteúdo da conversa nem estabelece que a decisão tenha sido combinada
  ali — a equipe registra apenas a sequência temporal.'
