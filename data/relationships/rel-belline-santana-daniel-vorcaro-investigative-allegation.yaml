description: O ex-chefe da supervisão bancária foi convocado pela CPI do Crime Organizado para falar sobre
  a suspeita de ter recebido vantagens indevidas em troca de serviços ao banco, segundo a Agência Senado,
  e é alvo da investigação da Polícia Federal. A equipe editorial não localizou manifestação sua. A apuração
  está em curso e não há decisão de mérito. Segundo o Times Brasil, com base em apuração da PF, mensagens
  de WhatsApp entre Fabiano Zettel e Daniel Vorcaro tratam de pagamentos a 'Belline' por meio de contrato
  fictício com a Varajo Consultoria Empresarial, e ele teria participado de encontros com Vorcaro fora
  das dependências do Banco Central.
