label: instituto da família, sancionado pelos EUA como apoio financeiro a ele
description: 'A ligação entre o ministro e o Instituto Lex é institucional e patrimonial, não societária: ele não
  integra o quadro de sócios, formado pela mulher e pelos três filhos do casal. O que liga os dois diretamente é
  um ato de governo estrangeiro — em 22/09/2025 o Departamento do Tesouro dos EUA designou o instituto pela Lei
  Magnitsky classificando-o como parte da rede de apoio financeiro do ministro, sanção retirada em 12/12/2025 —
  e o fato, noticiado pela imprensa, de o instituto deter o imóvel de residência do casal. A caracterização como
  ''rede de apoio'' é do governo americano, não do acervo.'
