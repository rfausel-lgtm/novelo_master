label: inspeção sobre a liquidação do Banco Master; contas de 2025 sobrestadas (13/10/2026)
start_date: 2026-01
description: O TCU inspecionou o Banco Central para verificar os documentos que embasaram a liquidação
  do Master. Segundo interlocutores da Corte, o relatório final, concluído em 11/02/2026, não aponta irregularidades
  na atuação da autoridade monetária. Em 13/10/2026, a 2ª Câmara sobrestou o julgamento das contas de 2025 do
  Banco Central até o trânsito em julgado da deliberação no TC 022.950/2025-7 (Acórdão 5163/2026), que é, segundo
  cópia de despacho do TCU hospedada pelo Poder360, a representação do MPTCU sobre a supervisão e a resolução do
  Master; o acórdão não aponta irregularidade de ninguém. A
  classe da relação segue a das evidências originais sobre a inspeção.
