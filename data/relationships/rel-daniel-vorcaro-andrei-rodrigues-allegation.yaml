label: menções em notas e mensagens; alegação de intimidação no depoimento de 02/09/2026
description: O relatório da PF contém seção de pesquisa por 'Andrei Passos' e identifica notas e mensagens
  de Vorcaro que 'podem indicar' referência ao diretor-geral da PF, inclusive sobre convite a evento ('Ministro
  fez convite ao andrei PF'). Não há registro de comunicação direta no material lido; o relatório não
  conclui pela prática de crime. Em 02/09/2026 Vorcaro afirmou, em depoimento ao gabinete de André Mendonça,
  que sofreu intimidações para não citar a PF e que a delação teria sido recusada porque poderia citar
  o diretor-geral. Integrantes da PF e da PGR dizem que não houve fatos concretos; interlocutores do diretor-geral
  afirmam que os dois se encontraram uma única vez, casualmente, em Londres, em seminário patrocinado
  pelo Master.
