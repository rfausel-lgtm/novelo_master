description: 'Rueda (presidente nacional do União Brasil) e Alcolumbre (presidente do Senado, também do
  partido) disputam publicamente os rumos da sigla para 2026: Alcolumbre busca estreitar laços com o governo
  Lula, enquanto Rueda, ao lado de ACM Neto, defende postura mais distante e crítica à gestão petista. Pontos
  de atrito incluem a indicação de Pedro Lucas Fernandes ao Ministério das Comunicações e a pauta de anistia
  aos réus de 8 de Janeiro. Contexto relevante para a hipótese, já registrada em ambos os verbetes, de que
  a PF suspeitaria de Mendonça usar uma investigação sobre Rueda como via de acesso a Alcolumbre — a rivalidade
  interna não confirma nem afasta essa hipótese, apenas mostra que os dois não formam bloco único dentro do
  próprio partido.'
