description: O TCDF comunicou em 19/11/2025 o recebimento de nova denúncia do MPC-DF (com representação
  também de parlamentar da CLDF) no processo nº 00600-00003617/2025-75, que, segundo a ficha do e-TCDF
  consultada em 15/10/2026, foi autuado em 01/04/2025, sobre se as operações de compra de carteiras de
  crédito entre BRB e Banco Master teriam contornado restrição do Banco Central à aquisição do Master
  pelo BRB — apontando possíveis falhas de governança, ausência de diligência prévia e riscos ao erário
  distrital.
