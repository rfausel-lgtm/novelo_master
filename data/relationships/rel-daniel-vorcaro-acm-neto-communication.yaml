label: encontros e pedido de conversa em 2024, segundo o UOL
start_date: '2024-09'
description: >-
  Segundo o UOL (16/10/2026), mensagens extraídas pela PF do celular de Vorcaro registram que ACM Neto e Antônio
  Rueda passaram um fim de semana com Vorcaro em Trancoso (BA) em setembro de 2024 e que, em outubro de 2024,
  ACM Neto pediu uma conversa com Vorcaro e Rueda, realizada em São Paulo. As mensagens descritas não indicam o
  assunto dos encontros, e o UOL ressalva que não mostram pagamento de comissão diretamente a ACM Neto. Uma só
  apuração, sem Pet, relatório ou decisão conhecidos. ACM Neto diz que os vazamentos são seletivos e fora de
  contexto e que jamais atuou para que institutos de previdência aplicassem no Master.
