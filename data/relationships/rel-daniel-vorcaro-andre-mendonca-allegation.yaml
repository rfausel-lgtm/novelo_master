description: 'Segundo mensagens do celular de Vorcaro publicadas pela newsletter Noites Húngaras e reproduzidas
  pelo Brasil de Fato, Vorcaro esteve com o ministro no Instituto ITER em 14/03/2025, em encontro articulado
  por Ciro Soares e Cezinha de Madureira. O gabinete do ministro confirmou um único encontro, para memoriais
  sobre precatórios, com decisão contrária ao banco. O encontro é anterior à relatoria de Mendonça no
  caso (fev/2026). NOVO (14/09/2026), via Migalhas — o assunto declarado do encontro era a Suspensão de Tutela
  Provisória (STP) 976, sobre créditos de precatórios do FIDC MEG — fundo do ecossistema de Vorcaro,
  administrado pela Trustee DTVM, alvo de busca e apreensão na própria Compliance Zero — e não apenas
  "memoriais sobre precatórios" em termos genéricos; usado como um dos dois fundamentos centrais de arguição
  de suspeição de Benjamim Botelho de Almeida contra o ministro (ver
  rel-benjamim-botelho-de-almeida-andre-mendonca-allegation). O corpus não contém registro oficial do encontro
  nem decisão sobre impedimento. NOVO (15/09/2026) — decisão do Min. Flávio Dino na ADPF 1.196 estabelece
  cronologia distinta e mais grave: o encontro de 14/03/2025 ocorreu um dia antes de Mendonça pedir vista
  (15/03/2025) de cautelar do próprio Dino sobre preços dos serviços funerários de São Paulo — cautelar
  que afetava diretamente a concessionária Cortel, onde Fabiano Zettel (cunhado de Vorcaro) era conselheiro
  com e-mails do Banco Master/Máxima. Na retomada do julgamento (04/04/2025), Mendonça abriu divergência e
  votou contra a cautelar de Dino, a favor das concessionárias. Dino cita a própria entrevista de Mendonça
  (02/09/2026) confirmando que recebeu Vorcaro a pedido de membros da Igreja Batista da Lagoinha, com
  Cezinha de Madureira como intermediário — mesma igreja à qual Zettel é vinculado. Dino qualifica
  expressamente a conexão como "quadro indiciário", não como relação causal provada, e remeteu cópia da
  decisão ao Min. Fachin para juntada nos autos de apuração da conduta de Mendonça (ver
  evt-2026-09-15-dino-decisao-adpf1196-converte-diligencia).'
