description: 'Em decisão de 03/09/2026, Moraes apontou ''fortes indícios'' de improbidade administrativa,
  abuso de autoridade e crime de responsabilidade por parte de Mendonça na condução das Petições 15.041
  e 15.556, com base em relatório da PF sobre tratamento assimétrico de casos por alinhamento político.
  Encaminhou o caso a Fachin. ESCALADA (14/09/2026): em ofício formal de 44 páginas e 121 tópicos, na
  véspera da sessão de 15/09, Moraes acusou diretamente Mendonça de vazamento à imprensa, de gravar vídeo
  político antes de atos de 7/9/2026 por motivação eleitoral, e de tentar incluí-lo (a ele e ao senador
  Davi Alcolumbre) em colaboração premiada "por motivos pessoais e políticos" — a acusação mais direta e
  detalhada de um ministro do STF contra outro registrada no acervo. Até a coleta de 15/09/2026, Mendonça não
  havia respondido publicamente a essas acusações específicas, e seu gabinete não respondeu ao Poder360 em
  03/09. RESPOSTA NOS AUTOS E PARECER DA PGR (17/10/2026): segundo a íntegra do parecer da PGR na Pet 16.704
  divulgada pelo Poder360 (cópia com a marca "Sigiloso", chave de validação não conferida), Mendonça reagiu
  nos autos ao pedido de investigação (Doc. 180), dizendo, em suma, que ele se embasa em relatórios internos
  da PF imprestáveis para esse fim; o Novelo não leu essa manifestação. No mesmo parecer, a PGR opinou que a
  representação "não apresenta condições de ter seguimento, ressalvado entendimento em contrário do
  Plenário", a quem cabe autorizar ou recusar investigação de integrante da Corte. O parecer não é decisão;
  até 20/10/2026 não foi localizada decisão do Plenário (ver
  evt-2026-10-17-pgr-opina-que-representacao-de-moraes-contra-mendonca-nao-tem-condicoes-de-seguimento).'
