description: 'Em decisão de 03/09/2026, Moraes apontou ''fortes indícios'' de improbidade administrativa,
  abuso de autoridade e crime de responsabilidade por parte de Mendonça na condução das Petições 15.041
  e 15.556, com base em relatório da PF sobre tratamento assimétrico de casos por alinhamento político.
  Encaminhou o caso a Fachin. ESCALADA (14/09/2026): em ofício formal de 44 páginas e 121 tópicos, na
  véspera da sessão de 15/09, Moraes acusou diretamente Mendonça de vazamento à imprensa, de gravar vídeo
  político antes de atos de 7/9/2026 por motivação eleitoral, e de tentar incluí-lo (a ele e ao senador
  Davi Alcolumbre) em colaboração premiada "por motivos pessoais e políticos" — a acusação mais direta e
  detalhada de um ministro do STF contra outro registrada no acervo. Mendonça não se manifestou publicamente
  sobre essas acusações específicas até esta coleta.'
