description: 'A extração do celular de Vorcaro (IPJ-A anexa à PET 15.978) registra 25 minutos de conversa,
  aparentemente captação de ambiente, entre o banqueiro e quem a PF identifica como provavelmente Marcus
  Vinícius da Mata, presidente da Solar Administração de Bem Próprio S.A., empresa em que Luís Felipe
  Woyceichoski atuava como comandante da embarcação. No relato, Vorcaro diz ter os nomes e contatos de
  quem lhe telefonou para adverti-lo, e, ao repassar o áudio a Luiz Phillipi Mourão, pede que o apague
  ("preciso que você apague e não mande pra ninguém. Vou ter problema com esse cara") e avalia: "tiro
  saiu pela culatra. Esse cara era o principal". A identificação do interlocutor é da PF, expressamente
  qualificada como probabilidade, não certeza.'
