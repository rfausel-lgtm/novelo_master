description: >-
  Em 15/09/2026 o senador Alessandro Vieira impetrou no STF o Mandado de Segurança 41.085 contra o Presidente do
  Senado Federal, cargo ocupado por Davi Alcolumbre, para obter a instalação de CPI sobre o caso Master; o
  relator, Cristiano Zanin, indeferiu a liminar em 22/09/2026, e o impetrante interpôs agravo regimental em
  29/09. Relação processual entre impetrante e autoridade impetrada; não descreve conduta pessoal de nenhum dos
  dois.
