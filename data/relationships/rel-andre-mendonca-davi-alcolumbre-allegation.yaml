description: 'Alexandre de Moraes, em decisão de 03/09/2026 e ofício formal de 11/09/2026, acusa André
  Mendonça de "direcionamento de determinados alvos para investigação" — nominalmente o próprio Moraes
  e o senador Davi Alcolumbre — "por motivos pessoais e políticos". Relatório de inteligência da PF citado
  na mesma decisão descreve Alcolumbre como "provável alvo estratégico" por seu controle da pauta de
  impeachment de ministros do STF, e levanta a hipótese de que Mendonça veria em Antônio Rueda uma "rota
  de acesso" a ele, relacionando a suspeita à resistência histórica de Alcolumbre à indicação de Mendonça
  ao STF em 2021. É acusação de uma parte contra outra em disputa institucional aberta; nenhuma investigação,
  cautelar ou oitiva concreta contra Rueda ou Alcolumbre é atribuída a esse motivo por qualquer autoridade.'
