description: Segundo nota de Reinaldo Azevedo de 16/10/2026, o Banco Master patrocinou o podcast Reconversa
  por meio da empresa Super, em contrato de março de 2024 de 12 parcelas de R$ 100 mil, das quais sete foram
  pagas, com valores declarados e impostos pagos. É relação comercial declarada pelo próprio citado; o
  contrato não é público, e patrocínio contratado não é, por si, irregularidade. O Novelo não liga a empresa
  Super a nenhum outro verbete.
