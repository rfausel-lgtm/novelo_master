description: 'Em depoimento de 13/02/2025 à PF, com mandato suspenso à época, Glauber Braga responsabilizou
  Arthur Lira por concentrar o direcionamento de emendas parlamentares e enfraquecer a transparência,
  citando Mariângela Fialek como operadora ligada diretamente à Presidência. Alega ser perseguido
  politicamente por Lira em razão dessas críticas. É a origem documentada da investigação que resultou,
  meses depois, na Operação Transparência. Lira não é alvo formal desta operação até esta coleta — a
  acusação permanece no nível de depoimento de testemunha, sem prova documental equivalente.'
