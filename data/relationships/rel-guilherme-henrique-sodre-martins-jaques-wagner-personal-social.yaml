label: descrito pela PF como pessoa próxima ao senador
description: Guilherme Henrique Sodré Martins, ex-marido da atual esposa de Jaques Wagner e pai do enteado do senador,
  é descrito pela Polícia Federal como pessoa próxima e de confiança de Wagner. Segundo a revista Época (2016),
  comprou com o senador, em 2015, um sítio em Andaraí (BA), com 24% para ele; Wagner confirmou a compra conjunta
  para lazer. Segundo a PF, recebeu de Augusto Lima presentes enviados ao mesmo tempo ao senador, e foi citado com
  ele pelo diretor comercial do Master. Foi alvo da 9ª fase da Operação Compliance Zero.
