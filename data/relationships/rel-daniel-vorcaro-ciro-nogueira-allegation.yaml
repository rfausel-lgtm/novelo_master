label: suposta atuação em favor de interesses (segundo a PF)
description: Segundo a PF, conforme comunicação oficial do STF de 07/05/2026, o senador teria atuado em
  favor de interesses de Daniel Vorcaro (inclusive por emenda à PEC 65/2023 sobre a cobertura do FGC)
  em troca de vantagens. O relator descreveu indícios de 'arranjo funcional' que extrapolaria 'relações
  de mera amizade'. Segundo reportagens de 16/06/2026 que descrevem relatório da PF não localizado pelo
  Novelo, Vorcaro também pagou hospedagem do senador em Lisboa em junho de 2024 e viagens (estimativa da PF de
  R$ 468.721,78 em viagens e jantares, segundo a Agência O Globo; valores da hospedagem disputados entre os
  veículos); a PF, segundo a mesma agência, pediu cautela com referências a 'Ciro' em listas de pagamentos e
  diálogos, por possível homônimo. Trata-se de suspeita da PF sob investigação; não há julgamento de mérito. O
  senador nega ter recebido valores ilícitos, e a defesa diz que prestará esclarecimentos nos autos.
