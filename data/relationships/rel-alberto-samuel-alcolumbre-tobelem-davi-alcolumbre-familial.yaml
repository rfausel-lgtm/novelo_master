description: 'Reportagens de fevereiro de 2026 (Gazeta do Povo, O Tempo) identificam Alberto Samuel Alcolumbre
  Tobelem como irmão do senador Davi Alcolumbre. Apuração de 14/09/2026 localizou reforço anterior e
  independente dessa cobertura: em março de 2022, por ocasião de apreensão policial de dinheiro pertencente
  a Alberto Samuel, o próprio gabinete do senador, em nota à imprensa, referiu-se a ele como "o irmão"
  (ver ev-gabinete-davi-alcolumbre-confirma-irmao-em-nota-2022). A equipe ainda não confirmou o parentesco
  em documento cartorial (certidão, registro civil, ficha TSE) — tentativa de cruzamento pela ficha de
  candidato de Davi Alcolumbre no TSE não localizou registro de Alberto Samuel como candidato ou doador.'
