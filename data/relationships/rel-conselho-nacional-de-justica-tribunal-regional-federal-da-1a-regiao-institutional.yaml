label: Corregedoria Nacional suspende decisões da Presidência do TRF-1 e manda cancelar precatórios (PP 0007917-89)
start_date: '2026-09-22'
description: >-
  No PP 0007917-89.2026.2.00.0000, a Corregedoria Nacional de Justiça suspendeu em 22/09/2026 decisões da
  Presidência do TRF-1 em três suspensões de liminar e determinou ao tribunal o cancelamento de 16 precatórios
  (R$ 4.738.065.026,73) e, em 28/09/2026, de mais 14 requisições (R$ 1.877.143.674,66 nas datas-base), com
  restituição dos valores à Conta Única do Tesouro Nacional e prestação de informações; as decisões aguardam
  referendo do Plenário do CNJ e não mencionam o Banco Master. Em 24/09/2026, segundo a imprensa, a Corregedoria
  realizou correição extraordinária no gabinete de um desembargador do tribunal.
