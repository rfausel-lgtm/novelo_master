label: troca de mensagens (2023-2024; grupo de WhatsApp em 2025, segundo o UOL)
start_date: '2023-12-21'
description: O relatório da PF sobre o celular de Vorcaro documenta mensagens entre Fábio Faria e o banqueiro
  entre dezembro de 2023 e novembro de 2024, sobre reuniões, compartilhamento de contato e o contrato
  com o escritório Barci de Moraes. Segundo o UOL (30/09/2026), Faria participava, com Vorcaro, Ciro Nogueira
  e Hugo Motta, de grupo de WhatsApp criado em abril de 2024, cujo conteúdo registrado vai de 20/08 a
  17/11/2025; segundo a Folha de S.Paulo (via Brasil 247), constava de lista de convidados de encontro em
  Lisboa em 2024, cidade em que diz não ter estado naquele ano. O trecho até 11/2024 é documentado pelo relatório da PF
  (classe D); o grupo de 2025 e a lista de Lisboa são de reportagem (classe A).
