label: grupo de WhatsApp, chamadas e encontros combinados (segundo UOL e CNN)
start_date: '2024-03'
description: >-
  Segundo o blog de Matheus Teixeira na CNN Brasil (29/09/2026), registros extraídos pela PF do celular de
  Vorcaro mostram, entre março de 2024 e outubro de 2025, ao menos 100 chamadas concluídas e 102 não concluídas
  entre os dois e ao menos 19 encontros combinados; segundo o UOL (30/09/2026), ambos participavam, com Ciro Nogueira e Fábio
  Faria, de grupo de WhatsApp criado em abril de 2024. As duas informações têm origens únicas, sem relatório,
  Pet ou decisão conhecidos; são metadados e descrição dos veículos, não conteúdo verificado pelo Novelo. A
  assessoria de Motta afirma que não há ilícito nos diálogos publicados.
