description: 'Documentado: a CVM encerrou, por termo de compromisso aceito pelo Colegiado em 16/11/2022 (parecer do
  Comitê de 13/09/2022), o processo 19957.006441/2021-87 sobre possível manipulação de mercado com o CARE11 pelo
  Banco Máxima, antiga denominação do Master — acordo sem confissão. Até 04/02/2026 a administração fiduciária do
  fundo coube à Master S.A. CCTVM, corretora do conglomerado, substituída pela Mérito DTVM em assembleia de
  cotistas (Fato Relevante resumido pela BTG Pactual). Segundo a imprensa, transcrita na ADPF 1.196: o Master era
  um dos principais cotistas (O Bastidor) e, segundo relatório da PF citado pelo UOL, como cotista aceitou cotas de
  empresa do próprio grupo "ao preço que ele mesmo havia estabelecido", na origem do banco em 2016.'
