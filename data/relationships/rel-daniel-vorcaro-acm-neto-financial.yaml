label: acusa de receber comissão de 10%
start_date: '2026-09-10'
description: Na terceira proposta de colaboração premiada, revelada em 10/09/2026, Vorcaro atribui a ACM Neto a
  intermediação da entrada de recursos de institutos de previdência e da Cedae no Master em troca de comissão de
  10%, paga por quatro modalidades incluindo espécie e contratos de consultoria via A&M Consultoria e B6 Capital.
  ACM Neto classificou a acusação como falsa. Em 16/10/2026, o UOL publicou mensagens extraídas pela PF do celular
  de Vorcaro sobre a captação de institutos de previdência e ressalvou que elas não mostram pagamento de comissão
  diretamente a ACM Neto; a comissão de 10% segue como alegação da proposta de colaboração, e as mensagens não a
  confirmam (ver rel-daniel-vorcaro-acm-neto-communication).
