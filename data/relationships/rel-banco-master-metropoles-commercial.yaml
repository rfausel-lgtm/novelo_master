description: O Banco Master e o Will Bank pagaram R$ 27,28 milhões ao Metrópoles entre o segundo semestre
  de 2024 e outubro de 2025, em contratos de publicidade e patrocínio esportivo cuja contrapartida — os
  naming rights da Série D de 2025 — é confirmada pela CBF. O Coaf classificou a movimentação como atípica.
  Não há acusação formal contra o veículo. Segundo o UOL (15/10/2026), com base em mensagens extraídas pela
  PF, o Master pagou R$ 1 milhão ao portal em junho de 2024, acertou R$ 900 mil em julho e fechou em novembro
  contrato de publicidade de R$ 20 milhões, quitado em 2025; a CEO Lilian Tahan diz que o contrato não tinha
  relação com a cobertura.
