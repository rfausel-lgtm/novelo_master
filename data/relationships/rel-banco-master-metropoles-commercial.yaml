description: O Banco Master e o Will Bank pagaram R$ 27,28 milhões ao Metrópoles entre o segundo semestre
  de 2024 e outubro de 2025, em contratos de publicidade e patrocínio esportivo cuja contrapartida — os
  naming rights da Série D de 2025 — é confirmada pela CBF. O Coaf classificou a movimentação como atípica.
  Não há acusação formal contra o veículo.
