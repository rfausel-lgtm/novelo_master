description: Segundo o relatório parcial da PF de 28/10/2026 no Inq 5026/STF, Daniel Vorcaro, ex-controlador
  do Banco Master, está entre os 15 indiciados. A PF o descreve como "principal centro de comando, coordenação
  e decisão" da estrutura que investiga (p. 531). A defesa responde que o indiciamento é "frágil e absurdo" e
  pede o arquivamento. Indiciamento não é denúncia nem condenação; o relatório é parcial e a PF pediu mais 60
  dias.
