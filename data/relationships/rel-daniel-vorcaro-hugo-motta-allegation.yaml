description: Mensagens do celular de Vorcaro, com sigilo levantado pelo STF e reproduzidas pelo Jornal
  da Paraíba, relatam encontros com o presidente da Câmara, entre eles jantar na 'residência oficial'
  com 'Hugo e seis empresários'. Motta disse não temer delação. Relato unilateral do banqueiro; sem registro
  oficial no corpus. Segundo reportagens de 16/06/2026 que descrevem relatório da PF não localizado pelo
  Novelo, Vorcaro pagou hospedagem de Motta em Lisboa em junho de 2024 (cinco diárias, segundo a PF); Motta
  afirmou que viajou no jato de Vorcaro a convite de Ciro Nogueira, que teve duas diárias pagas por Vorcaro e
  que se tratava de evento corporativo. As reportagens registram que Motta não é investigado; o Novelo não
  localizou documento oficial sobre isso.
