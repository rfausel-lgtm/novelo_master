description: Na terceira proposta de colaboração premiada, revelada em 10/09/2026, Vorcaro atribui a Rueda a intermediação
  da entrada de recursos de institutos de previdência e da Cedae no Master em troca de comissão de 10%, paga em
  espécie e por contratos com o escritório Rueda & Rueda Advogados, somando possivelmente R$ 3 milhões mensais junto
  com os repasses a ACM Neto. Rueda negou irregularidades. Em 16/10/2026, o UOL publicou mensagens extraídas pela
  PF do celular de Vorcaro sobre a captação de institutos de previdência e ressalvou que elas não mostram pagamento
  de comissão diretamente a Rueda; a comissão de 10% segue como alegação da proposta de colaboração, e as
  mensagens não a confirmam (ver rel-daniel-vorcaro-antonio-rueda-communication).
