description: Segundo o relatório parcial da PF de 28/10/2026 no Inq 5026/STF, Diogo Ilário de Araújo Oliveira,
  então Diretor Executivo de Atacado e Governo do BRB e membro da Diretoria Colegiada, está entre os 15
  indiciados. A PF trata da sua participação nas deliberações da Diretoria Colegiada que aprovaram aquisições
  de carteiras do Master e registra que nele não identificou a mesma vinculação funcional qualificada que
  atribui a outros dirigentes (p. 694). Indiciamento não é denúncia nem condenação; o relatório é parcial e a PF
  pediu mais 60 dias.
