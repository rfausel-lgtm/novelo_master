  para 'analisar e mapear a reputação' de Daniel Vorcaro na internet — uma fachada empresarial formal para a atividade
  de monitoramento e ataque digital do núcleo.
why_in_novelo: É o veículo empresarial que dava aparência lícita ao pagamento mensal ao líder do núcleo hacker da
  organização.
