summary: 'Órgão de controle interno do Poder Executivo federal. Foi a origem documental da investigação que resultou
  na Operação Make Up: a Nota Técnica nº 2180/2026/CINV/DIOPE/SFC, sobre a execução de quatro emendas parlamentares
  destinadas ao Instituto Conhecer Brasil e à Academia Nacional de Cultura, motivou a instauração do inquérito policial
  em 23/06/2026 por determinação do ministro Flávio Dino. A CGU produziu ainda o Relatório de Apuração nº 2007711
  e a Nota Técnica nº 2770/2026/DS/SFC, esta com aprofundamento mantido fora dos autos principais para preservar
  o sigilo da investigação.'
why_in_novelo: É o órgão cuja nota técnica deu origem à investigação sobre emendas parlamentares que corre no STF
  em conexão com o caso do filme 'Dark Horse'.
