summary: Segundo a PF, as investigações da Compliance Zero começaram em 2024 a pedido do MPF; a PGR manifestou-se
  favoravelmente a medidas nas fases posteriores. Em 25/09/2026 seu Conselho Superior não conheceu do pedido
  de suspeição do PGR e rejeitou, por 5 a 4, a abertura de investigação criminal sobre a atuação dele no caso
  Master (notícia oficial do MPF); segundo a Agência Brasil (classe A), a PGR enviou ao STF em 13/10/2026 parecer
  contrário ao afastamento do diretor-geral da PF.
why_in_novelo: Requereu a investigação que deu origem à Operação Compliance Zero, conforme nota oficial
  da PF.
