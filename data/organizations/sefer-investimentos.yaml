summary: Distribuidora de títulos e valores mobiliários, sucessora da Foco DTVM (via Índigo Investimentos
  DTVM), hoje em liquidação extrajudicial. Atuou como administradora fiduciária e intermediária líder
  da 3ª emissão de cotas do Brazil Realty FII (2018-2020), aceitando integralizações lastreadas em ativos
  sobreavaliados sem diligenciar a idoneidade dos laudos apresentados, e atuando como contraparte de negociações
  no mercado secundário que davam liquidez artificial às cotas. Era controlada por Benjamim Botelho de
  Almeida, único acionista da FG Participações, que a controlava por meio da Foco Participações. Condenada
  pela CVM em 08/09/2026 a R$ 1,3 milhão de multa; três de seus ex-diretores (Elisangela Capassi, David
  Abdala, Aluizio Moizinho) foram absolvidos.
why_in_novelo: É a distribuidora que administrava o Brazil Realty FII e cuja atuação — aceitar laudos
  questionáveis e servir de contraparte em negociações que davam liquidez artificial às cotas — foi central
  para a fraude apurada pela CVM, já conhecida no corpus pela cadeia Foco DTVM → Índigo Investimentos
  DTVM → Sefer Investimentos.
