name: NGVSPE Empreendimentos e Participações
aliases: []
org_type: company
summary: Sociedade anônima fechada (CNPJ 29.334.799/0001-34) que arrematou o leilão da Empresa Baiana
  de Alimentos em 11/04/2018, por R$ 15 milhões. Foi constituída em 29/12/2017 — 103 dias antes do certame
  —, com CNAE de holding de instituições não-financeiras, sede em São Paulo e telefone cadastrado com
  DDD da Bahia. Capital social hoje registrado de R$ 1 milhão; segundo a imprensa, o capital inicial era
  de R$ 500 e foi elevado pouco antes do leilão. O quadro de administradores na Receita traz um único
  nome, com entrada em fevereiro de 2018. Em 05/06/2018, mesmo dia da transferência efetiva do controle
  acionário da Ebal, cedeu à PKL One Participações os direitos do CredCesta. Situação cadastral ativa.
why_in_novelo: É o veículo societário pelo qual o controle da estatal baiana e, com ele, o direito de
  explorar a folha dos servidores passaram ao setor privado — constituída pouco mais de três meses antes
  do leilão que venceu.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- Por ser sociedade anônima fechada, o registro da Receita Federal traz apenas administradores, não o
  quadro acionário — de modo que a propriedade real da empresa não é verificável por essa via. A imprensa
  aponta um investidor estrangeiro e um dirigente do setor supermercadista à frente da operação, com Augusto
  Lima descrito como articulador de bastidores; nada disso é confirmável em registro público.
- Uma fonte única menciona que a cessão dos direitos do CredCesta à PKL One, em junho de 2018, teria sido
  feita por R$ 22 milhões — valor superior ao pago pela companhia inteira. Não confirmado.
- Não foram localizados, em fonte oficial, o edital do leilão nem o contrato de compra e venda; o Diário
  Oficial do Estado exige cadastro para acesso a edições históricas.
