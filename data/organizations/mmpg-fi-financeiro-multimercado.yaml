summary: Fundo de investimento (CNPJ 31.933.729/0001-44), administrado pela WNT Capital e gerido pela
  WNT Gestora de Recursos, com exatamente 1 cotista e patrimônio líquido de R$ 22,66 milhões (dado de
  2026) — consistente com a alegação do UOL de que o fundo pertence exclusivamente a uma única pessoa.
  Segundo a mesma reportagem, esse cotista único é o advogado Ângelo Rezende; o cadastro público consultado
  não revela a identidade nominal do cotista, o que mantém a identificação como classe A (fonte secundária).
why_in_novelo: É o fundo de cotista único que o UOL aponta como pertencente a Ângelo Rezende, e que integra
  a cadeia societária que o ligaria à PKL One Participações.
