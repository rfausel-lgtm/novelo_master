summary: Incorporadora e construtora brasileira listada em bolsa. Nelson Tanure tornou-se acionista relevante
  e conselheiro da empresa a partir de abril de 2019. É réu, desde 28/01/2026, por uso de informação privilegiada
  na aquisição da Upcon pela Gafisa em 2019-2020 — ação distinta da investigação sobre o Banco Master,
  cuja conexão foi expressamente rejeitada pelo STF (Toffoli, 27/01/2026). A CVM também examinou, em processo
  administrativo distinto julgado em 18/12/2024, um aumento de capital da Gafisa de 2019 com tratamento
  desigual entre acionistas — absolvido por empate 2x2.
why_in_novelo: É a empresa através da qual Nelson Tanure, hoje investigado no caso Master, responde como
  réu em ação penal por informação privilegiada — processo que o STF já determinou não ter conexão com
  o Master.
