summary: 'Empresa de Lauro de Freitas (Bahia), sócio-administrador Marcelo Passos de Araujo, que comprou de Jaques
  Wagner e de sua mulher, Maria de Fátima Carneiro de Mendonça, o apartamento nº 1302 do condomínio Mansão Victory
  Tower, em Salvador, por R$ 10 milhões. Não é uma das 27 pessoas ou empresas atingidas pela constrição de 19/06/2026
  na PET 16.230: apresentou-se aos autos como terceira, ao ser surpreendida, em julho de 2026, pela devolução do
  título de compra e venda pelo Cartório de Registro de Imóveis, que invocou a indisponibilidade cadastrada em nome
  de Wagner. Alega ter pago o preço integralmente antes da constrição e ter lavrado a escritura pública em 06/05/2026,
  restando pendente apenas o assento registral.'
why_in_novelo: É a compradora do apartamento de Jaques Wagner em Salvador, cujo registro ficou barrado pela indisponibilidade
  decretada na PET 16.230 — episódio distinto do terreno de Camaçari e da venda à Lagoons, já registrados no acervo.
