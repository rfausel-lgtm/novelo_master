open_questions:
- A petição da ação 26-01362 (54 páginas, com trechos tarjados, segundo o Metrópoles) não foi lida pelo Novelo; o
  docket foi lido no CourtListener, que espelha o PACER, sem conferência no PACER. O prazo de resposta das empresas
  (09/11/2026) vem do Rio Times, que cita a Jovem Pan (não aberta).
- Divergências entre os veículos sobre a data da ação (07/10/2026 no docket e nas reportagens; petições "de 8 de
  outubro" em reportagem posterior não aberta) e sobre os valores em reais; o Novelo usa dólares.
- Segundo a imprensa, o liquidante teria proposto em 02/10/2026 outra ação nos EUA, sobre valores ligados à venda
  de uma aeronave; tribunal, partes e número não conferidos pelo Novelo; não registrada.
- O Rio Times afirma reconhecimento do processo brasileiro sob o Chapter 15 em 08/01/2026, sem outra fonte aberta.
