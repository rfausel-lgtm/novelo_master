summary: Empresa liquidante do Banco Master (CNPJ 43.336.034/0001-64, responsável técnico Eduardo Felix Bianchini),
  reconhecida em 26/05/2026 pela Suprema Corte das Bahamas como representante estrangeira de cinco entidades do
  conglomerado Master — Banco Master S.A., Banco Letsbank S.A., Banco Master de Investimento S.A., Master S/A Corretora
  de Câmbio Títulos e Valores Mobiliários e Banco Master Múltiplo S.A. — para fins da liquidação de fundos internacionais
  em Jersey, Cayman e Bahamas. Em 07/10/2026, segundo a imprensa e o docket do tribunal, propôs no Tribunal de
  Falências dos EUA para o Distrito Sul da Flórida (processo nº 26-01362) ação contra Clear River Properties LLC
  e Goldbeach Properties LLC, titulares de três imóveis em Aspen e Miami, alegando que foram pagos com recursos do
  Master; são alegações do liquidante, não julgadas, e o Novelo não leu a petição.
why_in_novelo: É a liquidante formal do Banco Master, com reconhecimento judicial em jurisdição estrangeira para
  atuar sobre os fundos internacionais do conglomerado — o elo entre a liquidação decretada pelo Bacen e os ativos
  localizados fora do país.
