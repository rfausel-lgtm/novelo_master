  conglomerado Master — Banco Master S.A., Banco Letsbank S.A., Banco Master de Investimento S.A., Master S/A Corretora
  de Câmbio Títulos e Valores Mobiliários e Banco Master Múltiplo S.A. — para fins da liquidação de fundos internacionais
  em Jersey, Cayman e Bahamas.
why_in_novelo: É a liquidante formal do Banco Master, com reconhecimento judicial em jurisdição estrangeira para
  atuar sobre os fundos internacionais do conglomerado — o elo entre a liquidação decretada pelo Bacen e os ativos
  localizados fora do país.
