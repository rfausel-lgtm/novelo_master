org_type: financial_institution
summary: Instituição de pagamento do conglomerado da Entrepay. Teve a liquidação extrajudicial decretada pelo
  Banco Central em 27/03/2026, junto com a Entrepay e a Octa, pelo Ato do Presidente nº 1.382, segundo a
  ementa publicada em boletim de legislação. O BC apontou, para o conglomerado, comprometimento da situação
  econômico-financeira da líder, infringência às normas e prejuízos que sujeitam credores a risco anormal;
  suas captações não são cobertas pelo FGC.
why_in_novelo: Teve a liquidação extrajudicial decretada pelo Banco Central em 27/03/2026, com a Entrepay e a Octa.
