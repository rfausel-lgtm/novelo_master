    summary: O Grupo Entre, em nota ao Seu Dinheiro, disse tomar conhecimento da decisão do BC e que conduzia a
      descontinuação das operações da Acqio, da Entrepay e da Octa, comprometendo-se a colaborar com as
      autoridades.
