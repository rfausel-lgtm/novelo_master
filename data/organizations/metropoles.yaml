summary: Veículo de comunicação sediado em Brasília, do Grupo OK, de Luiz Estevão de Oliveira Neto. Opera
  por três pessoas jurídicas — Metrópoles Mídia e Comunicação S/A, Metrópoles Marketing e Comunicação
  S/A e Metrópoles Produções, esta última uma associação privada —, todas administradas por Luiz Eduardo
  Estevão de Oliveira e Luiza Meireles Estevão de Oliveira. Recebeu R$ 27,28 milhões do Banco Master e
  do Will Bank entre o segundo semestre de 2024 e outubro de 2025, em contratos de publicidade e patrocínio
  esportivo, movimentação que o Coaf classificou como atípica. O veículo sustenta tratar-se de relação
  comercial regular. Produziu, depois da liquidação, cobertura ampla e em vários pontos pioneira sobre
  o caso — foi ele que revelou o contrato de R$ 129 milhões entre o banco e o escritório Barci de Moraes.
why_in_novelo: É simultaneamente uma das fontes mais utilizadas deste corpus e destinatário de R$ 27,28
  milhões do banco investigado — condição que a plataforma declara por dever de transparência.
cited_position:
