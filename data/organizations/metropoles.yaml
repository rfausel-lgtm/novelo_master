open_questions:
- O relatório do Coaf não é público e não foi lido pela equipe; o corpus trabalha com os trechos citados
  pela imprensa.
- Não há acusação formal, indiciamento ou denúncia contra o veículo ou seus dirigentes por esses fatos.
- A equipe não localizou matéria do próprio Metrópoles sobre o relatório do Coaf que o cita.
- A afirmação de que o Banco Master teria se tornado a principal fonte de receita do veículo em 2025 foi
  localizada em uma única fonte.
- O veículo não publica política declarada de separação entre as áreas comercial e editorial; a página
  de princípios editoriais retorna erro.
