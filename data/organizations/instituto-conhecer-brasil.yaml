summary: Associação privada sem fins lucrativos presidida por Karina Ferreira da Gama. Venceu o chamamento
  que resultou no Termo de Colaboração 01/SMIT/2024, de R$ 108 milhões, para implantar, operar e manter
  5 mil pontos de wi-fi gratuito em comunidades periféricas de São Paulo, dentro do programa WiFi Livre
  SP. Foi o principal alvo da Operação Wi-Fi Livre em 01/06/2026.
why_in_novelo: Firmou com a Prefeitura de São Paulo o contrato de R$ 108 milhões investigado por suspeita
  de fraude, e é presidido pela mesma pessoa que responde pela produtora do filme 'Dark Horse'.
