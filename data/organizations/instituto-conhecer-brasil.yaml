org_type: association
summary: Associação privada sem fins lucrativos presidida por Karina Ferreira da Gama. Venceu o chamamento que resultou
  no Termo de Colaboração 01/SMIT/2024, de R$ 108 milhões, para implantar, operar e manter 5 mil pontos de wi-fi
  gratuito em comunidades periféricas de São Paulo, dentro do programa WiFi Livre SP. Foi o principal alvo da Operação
  Wi-Fi Livre em 01/06/2026.
why_in_novelo: Firmou com a Prefeitura de São Paulo o contrato de R$ 108 milhões investigado por suspeita de fraude,
  e é presidido pela mesma pessoa que responde pela produtora do filme 'Dark Horse'.
cited_position:
- kind: denial
  summary: Karina Ferreira da Gama, que preside a entidade, nega os crimes de organização criminosa, evasão de divisas
    e lavagem de dinheiro.
  source_ids:
  - src-cnn-2026-08-26-produtora-entrega-documentos
  by_id: karina-ferreira-da-gama
  date: '2026-08-26'
open_questions:
- O corpus não registra manifestação institucional própria do instituto.
- As notas fiscais consideradas irregulares (R$ 16,5 milhões) constam de uma única reportagem; o corpus não tem
  os documentos.
- Em 03/09/2026 o ministro Flávio Dino suspendeu qualquer atividade de natureza econômica ou financeira da entidade,
  com intimação do Banco Central e da Receita Federal, e avocou ao STF o inquérito e a cautelar de busca que tramitavam
  na Vara Estadual das Garantias de Organizações Criminosas de São Paulo, unificando a frente paulista do contrato
  de wi-fi com a frente federal das emendas parlamentares. As empresas de tecnologia que executavam o contrato —
  Complexsys, FastFuture, Ultra IP, Urban Connect e JP Grass — ficaram proibidas de contratar com o poder público,
  e os pagamentos de contratos públicos a elas foram suspensos.
