summary: Sociedade anônima de capital fechado da família Toffoli (o ministro Dias Toffoli e os irmãos
  José Eugênio e José Carlos Dias Toffoli), administrada por parentes do ministro, segundo nota de seu
  gabinete (12/02/2026). Deteve participação no grupo Tayayá Ribeirão Claro até 21/02/2025; a nota afirma
  que tudo foi declarado à Receita e que as vendas se deram a valor de mercado.
