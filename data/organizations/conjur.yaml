summary: Veículo de notícias jurídicas, editado por Márcio Chaer. Segundo revista piauí (10/09/2026), com base
  em relatório da PF, figurava ao lado do Correio Braziliense e do Banco Master como organizador declarado do
  fórum jurídico em Londres de abril de 2024 — evento já registrado no acervo (patrocinado pelo Master, reuniu
  ministros do STF/STJ, o então PGR e o diretor-geral da PF). Recebeu patrocínio do Master para o evento,
  segundo confirmação pública do próprio Chaer (01/09/2026). Em 10/06/2026, o STF sediou oficialmente o
  lançamento da 20ª edição do Anuário da Justiça Brasil, publicação do ConJur.
why_in_novelo: É o veículo jurídico que, segundo a PF e a imprensa, coorganizou e recebeu patrocínio do Banco
  Master para o fórum jurídico em Londres de 2024, evento central na rede de proximidade institucional
  construída por Daniel Vorcaro com autoridades.
