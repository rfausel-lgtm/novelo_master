org_type: company
summary: Grupo de consultoria de valores mobiliários especializado em regimes próprios de previdência, antes chamado
  PAR Engenharia Financeira. Declara à CVM, em formulário de referência público, ter 386 clientes que são regimes
  próprios, de 390 clientes totais. O mesmo formulário registra a incorporação da Plena Consultoria de Investimentos
  em 31/12/2019 — a Plena foi alvo da Operação Fundo Perdido, e três de seus ex-controladores figuram no quadro
  societário do grupo em períodos distintos. A decisão que autorizou a busca de 12/08/2026 na sua sede identifica
  sete institutos clientes que somaram cerca de R$ 232 milhões no Master — Maceió (R$ 97 mi), São Roque (R$ 93,15
  mi), Araras (R$ 29 mi), Santo Antônio de Posse (R$ 7 mi), São Gabriel do Oeste (R$ 3 mi), Angélica (R$ 2 mi) e
  Campo Grande (R$ 1,2 mi) —, além de Congonhas, mapeado à parte no corpus por ata própria, totalizando ao menos
  oito. Dois pareceres datados e específicos contradizem a negativa geral da empresa de nunca ter emitido parecer
  técnico sobre o Master — SGOPrev (12/09/2025) e Araras (fevereiro de 2024). Seu CEO, Renan Foglia Calamia, já
  havia sido condenado em 19/01/2026 por gestão temerária em caso anterior (2017) no mesmo instituto de Santo
  Antônio de Posse. NONO REGIME IDENTIFICADO (lote 173) — o Fundo de Previdência Municipal de Imbituva (PR), cerca
  de R$ 4 milhões aplicados — caso em que o TCE-PR foi além da assessoria e, em 06/04/2026, converteu representação
  em Tomada de Contas Extraordinária citando a própria consultoria como corresponsável solidária pelo dano ao
  erário, ao lado dos gestores do fundo — a medida de responsabilização mais formal já registrada contra a empresa
  no acervo.
why_in_novelo: Consultoria presente em pelo menos oito dos dezoito regimes próprios que compraram letras financeiras
  do Banco Master, e cujo formulário público declara assessorar os dois lados do mesmo processo de credenciamento.
cited_position:
- kind: denial
  summary: A consultoria afirma que nunca foi consultada sobre os investimentos no Banco Master, que não analisou
    nem recomendou as operações, que não emitiu parecer técnico e que a decisão cabe exclusivamente aos gestores
    dos regimes próprios.
  source_ids:
  - src-credito-e-mercado-formulario-referencia-cvm
  by_id: credito-e-mercado
  date: 2026-08
open_questions:
- A modalidade e os valores de contratação pelos regimes próprios não foram localizados nos portais de transparência.
- A lista de clientes publicada no site é atual e não retrata necessariamente a carteira de 2024.
- A equipe não teve acesso a eventual parecer da consultoria sobre o Banco Master.
- A PF suspeita que o advogado Cecílio Galvão seja laranja dos donos reais da consultoria, que é sucessora direta
  da Plena Consultoria de Investimentos (Operação Fundo Perdido, 2014) — ex-sócios da Plena condenados em 1ª instância,
  absolvidos por prescrição no TRF3 (maio/2025), sem julgamento de mérito.
- O parecer técnico de 12/09/2025 sobre o investimento do SGOPrev, obtido pela imprensa e datado, aprovando o Banco
  Master, contradiz diretamente a declaração da consultoria, de agosto de 2026, de que 'nunca foi consultada' e
  'não emitiu parecer técnico' sobre investimentos no banco — a empresa não foi reconfrontada com este caso específico.
