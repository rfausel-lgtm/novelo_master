summary: Grupo de consultoria de valores mobiliários especializado em regimes próprios de previdência.
  Declara à CVM, em formulário de referência público, ter 386 clientes que são regimes próprios, de 390
  clientes totais. O mesmo formulário registra a incorporação da Plena Consultoria de Investimentos em
  31/12/2019 — a Plena foi alvo da Operação Fundo Perdido, e três de seus ex-controladores figuram no
  quadro societário do grupo em períodos distintos. Assessorava sete dos regimes próprios que compraram
  letras financeiras do Banco Master, somando cerca de R$ 232 milhões; sua sede foi alvo de busca autorizada
  pelo STF em 12/08/2026. Seu principal executivo aparece propondo a compra de letras financeiras na ata
  do comitê de investimentos de Congonhas.
why_in_novelo: Consultoria presente em pelo menos sete dos dezoito regimes próprios que compraram letras
  financeiras do Banco Master, e cujo formulário público declara assessorar os dois lados do mesmo processo
  de credenciamento.
cited_position:
- kind: denial
  summary: A consultoria afirma que nunca foi consultada sobre os investimentos no Banco Master, que não
    analisou nem recomendou as operações, que não emitiu parecer técnico e que a decisão cabe exclusivamente
    aos gestores dos regimes próprios.
  source_ids:
  - src-credito-e-mercado-formulario-referencia-cvm
  by_id: credito-e-mercado
  date: 2026-08
open_questions:
- A modalidade e os valores de contratação pelos regimes próprios não foram localizados nos portais de
  transparência.
- A lista de clientes publicada no site é atual e não retrata necessariamente a carteira de 2024.
- A equipe não teve acesso a eventual parecer da consultoria sobre o Banco Master.
- A PF suspeita que o advogado Cecílio Galvão seja laranja dos donos reais da consultoria, que é sucessora
  direta da Plena Consultoria de Investimentos (Operação Fundo Perdido, 2014) — ex-sócios da Plena condenados
  em 1ª instância, absolvidos por prescrição no TRF3 (maio/2025), sem julgamento de mérito.
