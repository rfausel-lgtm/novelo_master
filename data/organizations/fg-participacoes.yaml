summary: Holding de Benjamim Botelho de Almeida, que detinha integralmente seu capital. Controlava a Sefer
  Investimentos por meio da Foco Participações e, entre 26/03/2018 e 30/07/2020, era titular de 70% do
  capital social da Entre Investimentos — vínculo que a CVM usou para caracterizar a atuação coordenada
  entre as duas distribuidoras na fraude do Brazil Realty FII, contra a alegação das defesas de que não
  havia relação societária relevante entre elas.
why_in_novelo: É a holding que unifica, sob o controle de Benjamim Botelho de Almeida, a Sefer e (parcialmente)
  a Entre — o vínculo societário que a CVM usou para caracterizar a atuação coordenada entre as duas no
  esquema de liquidez artificial do Brazil Realty FII.
