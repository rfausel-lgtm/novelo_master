open_questions:
- As atas do Comitê de Investimentos de 12, 19 e 30/07/2024 são conhecidas apenas pelos trechos transcritos
  na decisão judicial; a equipe não teve acesso ao inteiro teor.
- Não se sabe se o FIDC Multisetorial cujas cotas a Amprev adquiriu em 2021 tem qualquer relação com o
  Banco Master, com Daniel Vorcaro ou com o grupo — a decisão não faz essa ligação.
- Quem são os dois conselheiros que votaram contra as aplicações em 19/07/2024.
- Quais 'agentes públicos' estariam em conluio com os investigados, segundo a decisão que autorizou a
  quebra de sigilo telemático.
- A decisão fixou prazo de 30 dias para relatório circunstanciado da PF; o resultado dessa etapa não é
  conhecido pelo corpus.
- A decisão menciona cautelar anterior na mesma investigação, cujo conteúdo e data não são públicos.
