org_type: public_body
summary: 'Entidade que gere o regime próprio de previdência dos servidores do Estado do Amapá. Ao contrário
  do que a imprensa costuma registrar, não é autarquia: o art. 98 da Lei estadual 0915/2005 a define como
  pessoa jurídica de direito privado sob a forma de serviço social autônomo, enquadramento que o Diário
  Oficial do Estado ainda reproduzia em fevereiro de 2026. Sua Diretoria Executiva é de livre nomeação
  do governador. Investiu R$ 400 milhões em letras financeiras do Banco Master em três deliberações do
  Comitê de Investimentos em menos de vinte dias, em julho de 2024 — a primeira com vencimento em 10 anos
  e taxa de IPCA + 8,35% ao ano —, contra dois votos e depois de um parecer de alerta do Ministério da
  Previdência Social. A aprovação é investigada pela PF (operação Zona Cinzenta, 06/02/2026) e pelo MP-AP.
  A mesma investigação alcança deliberações de setembro de 2021 que destinaram R$ 15 milhões a cotas de
  um FIDC Multisetorial. A carteira somava R$ 9,041 bilhões em agosto de 2025.'
why_in_novelo: Fundo previdenciário público que investiu R$ 400 milhões no Banco Master, o segundo maior
  aporte de entes públicos segundo a CNN, com aprovação sob investigação.
cited_position:
- kind: public_note
  summary: Afirmou sentir-se 'lesada pelos malfeitos do banco Master', que 'não abre mão de ser ressarcida',
    que os recursos dos segurados estão protegidos e que se habilitou junto ao BC na liquidação.
