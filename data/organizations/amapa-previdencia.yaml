summary: Autarquia do Governo do Amapá que gere o regime próprio de previdência dos servidores estaduais
  (cerca de 30 mil segurados ativos, segundo a Agência Brasil). Investiu R$ 400 milhões em letras financeiras
  do Banco Master em três deliberações do Comitê de Investimentos em menos de vinte dias, em julho de
  2024 — a primeira delas com vencimento em 10 anos e taxa de IPCA + 8,35% ao ano. A aprovação é investigada
  pela PF (operação Zona Cinzenta, 06/02/2026) e pelo MP-AP. A mesma investigação alcança deliberações
  anteriores, de setembro de 2021, que destinaram R$ 15 milhões a cotas de um FIDC Multisetorial. Em 19/11/2025
  a autarquia informou ter se habilitado junto ao BC para reaver o valor aplicado no Master.
why_in_novelo: Fundo previdenciário público que investiu R$ 400 milhões no Banco Master, o segundo maior
  aporte de entes públicos segundo a CNN, com aprovação sob investigação.
cited_position:
- kind: public_note
  summary: Afirmou sentir-se 'lesada pelos malfeitos do banco Master', que 'não abre mão de ser ressarcida',
    que os recursos dos segurados estão protegidos e que se habilitou junto ao BC na liquidação.
