open_questions:
- A passagem da decisão judicial sobre deliberações de FIDC em setembro de 2021 é contraditada pelos registros
  públicos da própria Amprev em cinco pontos independentes; não se sabe se há erro de redação na peça
  ou fatos ocorridos em outro colegiado.
- As atas do Conselho Estadual de Previdência de 2021 estão listadas no site da entidade, mas todos os
  dezessete links retornam erro 404 — é a única via institucional que ficou fechada.
- O Parecer nº 146/2024 do Ministério da Previdência Social é conhecido apenas pela descrição em ata;
  o texto não foi lido pela equipe.
- Quais 'agentes públicos' estariam em conluio com os investigados, segundo a decisão que autorizou a
  quebra de sigilo telemático.
- A decisão fixou prazo de 30 dias para relatório circunstanciado da PF; o resultado dessa etapa não é
  conhecido pelo corpus.
- A Amprev não publicou demonstrativo da posição na data da liquidação do Banco Master.
- O Parecer nº 146/2024 do Ministério da Previdência Social é conhecido apenas pela descrição na ata do
  CEP; o texto não foi lido pela equipe.
- A imprensa noticiou transformação da Amprev em autarquia por lei complementar de julho de 2025; o texto
  consolidado publicado pela própria entidade e o Diário Oficial de fevereiro de 2026 mantêm o enquadramento
  como serviço social autônomo. A equipe não leu a lei complementar.
- Segundo a reportagem que obteve o relatório sigiloso de auditoria, técnicos da autarquia admitiram aos
  auditores federais que a documentação de credenciamento do Banco Master foi elaborada pelo próprio banco;
  a equipe não teve acesso ao documento nem à manifestação da entidade sobre esse ponto específico.
- A prestação de contas nos autos da cautelar soma R$ 7,93 milhões até março de 2026; o valor de R$ 63
  milhões anunciado publicamente em fevereiro daquele ano não tem correspondência no processo, e o corpus
  não apurou a que grandeza ele se refere.
- A segunda prestação de contas, vencida em 17/06/2026, não foi localizada nos autos.
- Não há decisão sobre a impugnação do liquidante, que aponta diferença de R$ 11,16 milhões do lado do
  Estado do Amapá.
- A autarquia oficiou o Banco Central pelo menos duas vezes, até 11/09/2025, pedindo informações sobre
  processos contra o Banco Master e sobre os motivos da negativa à compra pelo BRB; o corpus não localizou
  resposta.
- O liquidante sustenta que não houve ordem de resgate emitida pela Amprev antes da liquidação, apesar
  do desenquadramento; os autores sustentam ter notificado formalmente o banco. Não há decisão sobre o
  ponto.
