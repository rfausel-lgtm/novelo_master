open_questions:
  - A nota não nomeia o anunciante nem descreve o conteúdo das conversas; o Novelo não localizou documento
    oficial com as mensagens.
  - Os valores de patrocínio vêm de tabela citada pelo UOL nas mensagens; não há contrato publicado.
