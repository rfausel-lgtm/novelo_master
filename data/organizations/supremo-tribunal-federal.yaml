summary: Tribunal onde tramitam a PET 15556, o INQ 5026 e petições correlatas do caso Master, sob relatoria
  do ministro André Mendonça. Em 25/09/2026 a Presidência despachou na PET 16.704 pedindo a oitiva da PGR sobre
  todas as providências postuladas e, em 13/10/2026, segundo o Informe à Imprensa conjunto com a PF, registrou
  que a investigação de ministro depende de autorização do Plenário e que aguarda o pronunciamento da PGR na
  PET 16.704.
why_in_novelo: É o tribunal competente onde tramitam as investigações do caso Master.
