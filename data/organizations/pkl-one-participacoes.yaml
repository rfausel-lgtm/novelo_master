id: pkl-one-participacoes
kind: organization
name: PKL One Participações S.A.
aliases:
- CREDCESTA (nome fantasia)
- PKL One
org_type: company
summary: Sociedade (CNPJ 27.490.629/0001-13, nome fantasia CREDCESTA), confirmada por registro oficial
  da Receita Federal como a mesma pessoa jurídica referida em reportagens ora como 'PKL One' (disputa
  de repasses em Macapá), ora como 'PKL One Participações S.A.' (operação na Bahia e decisão do TJRJ)
  — os dois registros que o corpus mantinha separados são aqui unificados. Passou a deter os direitos
  de exploração do CredCesta após a privatização da Ebal, e da qual o Banco Máxima — depois Banco Master
  — adquiriu 50%. É o nome que aparece no contracheque dos servidores baianos, e não 'CredCesta' ou 'Banco
  Master' — o que ajuda a explicar por que muitos não identificavam a origem do desconto. Administrada
  por Andréa Lima Novaes, apontada pela imprensa como prima de Augusto Lima, até ser substituída, em 16/07/2026,
  por Marcelo Antonio Bullos Cerqueira — troca sem explicação causal localizada. Está em disputa judicial
  com o liquidante do Banco Master pelos repasses do Credcesta relativos à folha de servidores da Prefeitura
  de Macapá, sob contrato aditado em 11/08/2025, já sob a liquidação do banco. Na cautelar do Rio, o Estado
  e o Rioprevidência sustentam que o Master e a PKL One administravam de forma conjunta as carteiras de
  crédito consignado, com indícios de possível grupo econômico — alegação dos autores, sem reconhecimento
  judicial no material lido. A quebra de sigilo societário foi aprovada pela CPMI do INSS no fim de fevereiro
  de 2026 e suspensa por decisão do ministro Flávio Dino.
why_in_novelo: É a sociedade que detém os direitos do CredCesta e por meio da qual o Banco Master (antes
  Máxima) entrou na folha dos servidores baianos — também em disputa judicial com o liquidante do banco
  sobre repasses relativos à folha de Macapá.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- 'Há divergência sobre o valor pago pelo Banco Máxima pelos 50%: o Poder360 registra R$ 22 milhões; outra
  apuração, de veículo de menor confiabilidade, fala em R$ 30 milhões com retenção de 50% por Augusto
  Lima. A equipe não conciliou as versões.'
- A composição societária completa (acionistas, não apenas o diretor/representante legal) segue sob sigilo
  na Junta Comercial de São Paulo; a quebra aprovada pela CPMI do INSS foi suspensa por decisão do STF.
- A troca do diretor da PKL One Participações em 16/07/2026, de Andréa Lima Novaes para Marcelo Antonio
  Bullos Cerqueira, não tem explicação causal localizada em nenhuma fonte.
- 'Confirmado documentalmente em 09/09/2026, por consulta da equipe à base pública do Banco Central: a
  empresa NÃO consta da relação oficial de instituições autorizadas a funcionar no país, em nenhuma das
  tabelas — resultado obtido com controle metodológico. O dado converte em fato verificado o que o corpus
  registrava como alegação de parlamentares e de decisão judicial de primeira instância, e é coerente
  com seu CNAE principal de holding de instituições não-financeiras.'
- Em Mato Grosso do Sul, o instrumento que abriu a folha estadual à empresa em março de 2023 declarava
  como objeto o desconto de 'contribuições e mensalidades devidas por seus servidores filiados' — redação
  de convênio com entidade sindical — e qualificava a convenente como 'Banco PKL One Participações S.A',
  designação sem correspondência em qualquer autorização do Banco Central. O cartão consignado de benefício
  só apareceu por escrito na renovação de 2025, que invoca como fundamento apenas um parecer referencial
  genérico de 2020, o mesmo usado na mesma página do diário oficial para entidades sindicais. Esse convênio
  segue formalmente vigente até 10/03/2027, sem nenhum ato de rescisão publicado.
- 'Em São Paulo, o vínculo com o Estado nunca foi contrato nem convênio: a empresa entrou na folha por
  despacho de deferimento de credenciamento do secretário da Fazenda, em 25/05/2022, recebendo a espécie
  de consignação 270 e o código 097337-4. Esse código foi suspenso com efeitos a partir de 19/02/2026
  com fundamento no mesmo inciso que abrira a porta em 2022. Com a prefeitura da capital houve convênio
  — o Termo de Adesão nº 003/2022, de 25/08/2022, aditado em 2023 —, e ali a resposta foi mais dura: descredenciamento
  e denúncia do convênio em agosto de 2026, após rejeição da defesa administrativa da empresa.'
- 'Os atos societários publicados no caderno empresarial paulista descrevem a empresa por dentro: R$ 100,00
  de capital e sede em apartamento na constituição de 2017; capitalização a R$ 1 milhão e entrada de Andrea
  Lima Novaes em 24/04/2018, doze dias após o leilão da estatal baiana; debêntures de subscrição privada
  remuneradas em 50% do lucro líquido; R$ 30,575 milhões pagos ''ao debenturista'' em maio de 2019, sem
  que os extratos o nomeiem. Identificar o debenturista é a pergunta em aberto mais direta sobre quem
  realmente recebia o resultado do CredCesta.'
- Documento oficial da secretaria de administração catarinense, de março de 2026, identifica o produto
  como 'Cartão Consignado de Benefícios do CREDCESTA (PKL ONE)' e orienta servidores com dúvidas a procurar
  a gerência de consignados — confirmando a operação em Santa Catarina, estado que já constava da lista
  de cobertura em 2022. A empresa não figura entre as consignatárias ativas do mesmo documento, e a data
  de seu credenciamento no estado não foi localizada porque o portal do diário oficial catarinense exige
  autenticação para busca de texto integral.
- 'A presença em vinte e quatro estados não vinha de estrutura societária: a empresa tinha seis estabelecimentos
  inscritos, mas a captura da página de lojas em janeiro de 2026 mostra rede física de 49 unidades em
  vinte e quatro unidades da federação. Quem vendia na ponta era correspondente bancário, remunerado por
  comissão do seguro prestamista — não do seguro de vida, expressamente excluído —, num cartão que não
  admitia portabilidade para outra instituição.'
- 'Nos autos sul-mato-grossenses a empresa sustentou não possuir documentos da contratação, atribuindo
  a responsabilidade ao banco. A questão de sua natureza jurídica divide o tribunal estadual: câmaras
  distintas ora acolhem sua exclusão do polo passivo por não ser instituição financeira, ora a reconduzem
  por ser ''administradora operacional do produto Credcesta''. O efeito prático é que o mesmo argumento
  que aponta a falha do credenciamento serve, no processo, para retirá-la da lide. Precisão jurídica:
  a lei do sistema financeiro pune atuar como instituição financeira sem autorização, e não o uso da palavra
  ''Banco'' na denominação — a designação que consta do diário oficial é indício de como o Estado enxergava
  a empresa, não enquadramento autônomo.'
- O credenciamento inaugural foi na Bahia, em 03/08/2018, três meses após o decreto que abriu a porta,
  e assinado pelo mesmo secretário da Administração que o referendara; seguiu-se o Contrato de Cooperação
  nº 079/2018, de 48 meses, renovado em 21/09/2022. No Rio Grande do Norte, o credenciamento de 19/07/2022
  antecedeu em dez meses a criação da margem exclusiva, e o termo descreve o objeto como 'credenciamento
  de instituição financeira' — terceiro ato oficial, ao lado dos de Mato Grosso do Sul e São Paulo, a
  enquadrar nessa categoria uma holding de instituições não financeiras.
