name: PKL One Participações S.A.
aliases: []
org_type: company
summary: Sociedade que passou a deter os direitos de exploração do CredCesta após a privatização da EBAL,
  e da qual o Banco Máxima — depois Banco Master — adquiriu 50%. É o nome que aparece no contracheque
  dos servidores baianos, e não 'CredCesta' ou 'Banco Master' — o que ajuda a explicar por que muitos
  não identificavam a origem do desconto. Seus sócios estão sob sigilo na Junta Comercial de São Paulo.
  A quebra de sigilo da empresa foi aprovada pela CPMI do INSS no fim de fevereiro de 2026 e suspensa
  por decisão do ministro Flávio Dino.
why_in_novelo: Detentora dos direitos do CredCesta e sociedade por meio da qual o Banco Master entrou
  na folha dos servidores baianos.
