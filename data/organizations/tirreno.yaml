open_questions:
- Se a versão mais recente (Cartos/FIDCs) é a origem real dos créditos ou mais uma camada de simulação não
  está resolvido pelos documentos lidos até agora — o próprio Banco Central tratou como versão a apurar,
  não como fato estabelecido.
