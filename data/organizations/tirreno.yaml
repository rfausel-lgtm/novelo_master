summary: 'Empresa identificada pela Polícia Federal como de fachada, criada por Daniel Vorcaro, usada
  para vender ao BRB créditos por R$ 12,2 bilhões — o mesmo valor que o corpus já registrava, via decisão
  do STF, como o total das carteiras adquiridas pelo BRB do Banco Master apesar de pareceres técnicos
  e jurídicos contrários. O mecanismo: a Tirreno vendia os créditos ao BRB embutindo um prêmio ao banco
  comprador; o Master recebia o valor à vista do BRB, sem precisar pagar a Tirreno à vista. A investigação
  concluiu que os créditos nunca existiram na origem — os contratos seriam fabricados. Questionado pelo
  Banco Central em março de 2025 sobre a falta de documentação, o Master atribuiu a origem dos créditos
  a duas associações de servidores da Bahia; a explicação não se sustentou, pois CPFs de diversas localidades
  do país foram usados para simular a origem, e 130 contratos analisados aleatoriamente pelo Banco Central
  não tinham lastro algum.'
why_in_novelo: É a peça central do mecanismo por trás dos R$ 12,2 bilhões que o BRB pagou ao Master —
  não uma carteira de crédito real, mas contratos fabricados vendidos por uma empresa de fachada.
