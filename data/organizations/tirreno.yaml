summary: 'Empresa de fachada usada para vender ao BRB créditos por R$ 12,2 bilhões — o mesmo valor que o
  corpus já registrava, via decisão do STF, como o total das carteiras adquiridas pelo BRB do Banco Master
  apesar de pareceres técnicos e jurídicos contrários. O mecanismo: a Tirreno vendia os créditos ao BRB
  embutindo um prêmio ao banco comprador; o Master recebia o valor à vista do BRB, sem precisar pagar a
  Tirreno à vista. A Polícia Federal apurou que os créditos não puderam ser confirmados na origem — os
  contratos seriam fabricados. A leitura direta do IPL 2025.0087917 corrigiu a origem societária: a empresa
  foi constituída em 04/11/2024 por Daniel Moreira Bezerra sob o nome "SX 016 Empreendimentos e Participações
  S.A." — uma entre ~91 empresas semelhantes que ele registrou —, renomeada para Tirreno em 02/12/2024, dois
  dias antes da assinatura do contrato de parceria com o Master (05/12/2024); André Seixas Maia assumiu a
  direção em 15/04/2025. Não há, nos documentos primários lidos até agora, atribuição de autoria a Daniel
  Vorcaro sobre a criação da empresa. A explicação do Master para a origem dos créditos mudou ao menos três
  vezes perante o Banco Central: primeiro associações de servidores da Bahia (Asteba/Asseba), depois a
  própria Tirreno diretamente, depois a Cartos SCD via três FIDCs (Noto, Sueste, VCK) — nenhuma das três
  versões foi confirmada pelo Banco Central.'
why_in_novelo: É a peça central do mecanismo por trás dos R$ 12,2 bilhões que o BRB pagou ao Master —
  não uma carteira de crédito real, mas contratos fabricados vendidos por uma empresa de fachada cuja
  origem societária e cadeia de controle só a leitura direta do IPL esclareceu.
