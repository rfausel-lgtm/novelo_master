aliases: []
org_type: public_body
summary: Instituto de previdência municipal de Araras (SP). Aplicou R$ 29 milhões em Letras Financeiras
  do Master sem garantia do FGC, em três operações entre março e dezembro de 2024 (6,2%-6,8% da carteira
  total), atendido pela consultoria Crédito e Mercado. A Prefeitura de Araras confirmou apuração interna,
  encaminhada à Procuradoria-Geral do Município.
why_in_novelo: É um dos RPPS paulistas expostos ao Master, com apuração administrativa própria (não judicial)
  já aberta pelo município.
