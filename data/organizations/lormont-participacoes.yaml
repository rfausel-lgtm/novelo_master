summary: Segundo a decisão de Dias Toffoli de 06/01/2026 na PET 15.198, a autoridade policial aponta
  Nelson Tanure como beneficiário final da Lormont Participações S.A., cujas CCBs (Cédulas de Crédito
  Bancário) de R$ 73,7 milhões concentraram 97% da carteira do FIDC Maranta, em operação entre partes
  relacionadas.
why_in_novelo: É o veículo societário citado na peça central que fundamenta a hipótese policial de que
  Nelson Tanure seria "sócio oculto" do Banco Master — a mesma passagem em que se pede bloqueio do
  patrimônio dele "no mesmo volume" do de Daniel Vorcaro.
