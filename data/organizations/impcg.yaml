  date: '2026-01-31'
open_questions:
- 'A divergência entre R$ 1,2 milhão (valor original, agosto de 2026) e R$ 1.427.000,00 (valor atualizado citado
  em janeiro de 2026) não foi objeto de reconciliação explícita em nenhuma das fontes: a diferença é compatível
  com juros e correção monetária acumulados entre o aporte (abril de 2024) e as datas das duas reportagens.'
- Não localizada manifestação pública de Camilla Nascimento sobre a Operação Presciência.
