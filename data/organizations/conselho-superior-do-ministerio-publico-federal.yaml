org_type: public_body
jurisdiction: Brasil
summary: >-
  Colegiado do Ministério Público Federal que, em 25/09/2026, em sessão extraordinária, não conheceu do pedido de
  suspeição do procurador-geral da República e rejeitou por 5 a 4 a abertura de investigação criminal sobre sua
  atuação no caso Master, conforme notícia oficial do MPF (Notícia de Fato PGR-00385698/2026, número que consta
  só da convocação da sessão, de 23/09/2026). Segundo a convocação, é o órgão máximo de deliberação do MPF.
why_in_novelo: Apreciou, em 25/09/2026, a Notícia de Fato sobre a atuação do PGR nas apurações do caso Master, conforme o MPF.
cited_position:
- kind: version
  by_id: conselho-superior-do-ministerio-publico-federal
  date: '2026-09-25'
  summary: >-
    A notícia oficial do MPF de 25/09/2026 é a posição do órgão: não conhecimento dos pedidos de impedimento ou
    suspeição, por falta de competência legal, pedidos de afastamento prejudicados e, por cinco votos a quatro,
    rejeição da investigação criminal "por ausência de elementos mínimos para a tipificação do crime de
    prevaricação".
  source_ids:
  - src-mpf-2026-09-25-conselho-superior-do-mpf-nega-afastamento-e-apuracao-contra-paulo-gonet-por-conducao-no-caso-master
open_questions:
- Ata ou certidão da 1ª Sessão Extraordinária de 2026 e votos nominais não localizados em fonte oficial (busca no portal do MPF em 16/10/2026); os votos só aparecem na imprensa, com grafias divergentes.
- O número da Notícia de Fato (PGR-00385698/2026) consta só da convocação de 23/09/2026, não da notícia do resultado.
- O MPF não nomeia o requerente; Poder360 e Agência Brasil dizem ser o Partido Novo.
