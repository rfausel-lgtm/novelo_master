summary: Banco vendido ao Master junto com o Voiter em 2023/2024. Em novembro de 2024, Maurício Quadrado
  — ex-sócio de Vorcaro — acordou comprá-lo, passando a administrá-lo a partir de março de 2025 sob o
  nome BlueBank; o Banco Central vetou essa venda por dúvida sobre a origem dos recursos usados na aquisição,
  e autorizou a reversão do nome ao original em 29/10/2025. Diferentemente do Voiter, o Letsbank nunca
  efetivamente saiu do controle do Master, e foi liquidado junto com o banco em 18/11/2025, por compartilhamento
  de administração.
why_in_novelo: É o único braço em que o Banco Central interveio diretamente para impedir a saída do conglomerado
  — e o único, entre os quatro, liquidado na mesma data do Master, pela mesma causa.
