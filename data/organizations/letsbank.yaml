open_questions:
- 'Há uma inconsistência temporal não resolvida entre fontes secundárias sobre a cronologia veto/aquisição
  do Letsbank por Maurício Quadrado: nota-se referência a um veto do Banco Central em ''agosto'' (sem
  ano explícito em algumas matérias) e a uma tentativa de aquisição por Quadrado em novembro de 2024,
  mas a liquidação de todo o conglomerado em 18/11/2025 parece ter ocorrido antes de esse processo de
  venda avançar — sinalizado aqui para apuração futura em fonte primária (Diário Oficial da União/comunicados
  do BC), sem resolver a cronologia por inferência.'
