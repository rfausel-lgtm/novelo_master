summary: Plataforma de crédito consignado oferecida a servidores públicos e pensionistas do estado da
  Bahia. Segundo a representação da PF, foi criada e operacionalizada no contexto da Empresa Baiana de
  Alimentos, e foram as carteiras de crédito do CredCesta que credenciaram Augusto Ferreira Lima a se
  tornar sócio de Daniel Vorcaro no Banco Master em 2019. A mesma representação afirma que o ativo teria
  servido como um dos instrumentos de fraudes de larga escala entre 2024 e 2025, com desfalques ao Banco
  de Brasília. O relatório apresentado à CPMI do INSS, embora rejeitado, descreve o produto como o principal
  motor de crescimento do banco e o pilar da entrada de Augusto Ferreira Lima na sociedade em 2019.
why_in_novelo: É o ativo que, segundo a Polícia Federal, ligou Augusto Lima ao Banco Master e está no
  centro do modelo de crédito consignado do banco.
