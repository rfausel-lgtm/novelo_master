summary: 'Programa de crédito consignado a servidores, aposentados e pensionistas do Estado da Bahia,
  originado como cartão de compras da rede estatal Cesta do Povo e operado pela Empresa Baiana de Alimentos
  — existia pelo menos desde 2014, quando o próprio Tribunal de Contas do Estado firmou convênio para
  oferecê-lo a seus servidores. Em 11/04/2018 o Estado privatizou a EBAL por R$ 15 milhões, com o programa
  embutido no lote, sem que o direito de operar a folha de cerca de 280 mil servidores fosse objeto de
  licitação própria. Dezesseis dias depois, os Decretos 18.353 e 18.354 converteram o cartão em plataforma
  de consignado e deram ao operador privado margem própria de 30% da remuneração líquida, cumulativa com
  a dos bancos — margem antes reservada a benefícios do próprio poder público. Em 2022, o Decreto 21.041
  retirou do servidor o direito de portabilidade. Os direitos passaram à PKL One Participações, da qual
  o Banco Máxima comprou 50%: é essa a porta pela qual Augusto Lima entrou na sociedade com Daniel Vorcaro.
  O produto cobrava cerca de 5% ao mês, contra média de mercado inferior a 1,6%, e tornou-se o motor de
  crescimento do banco — 85,4% das operações em 2022. Rebatizado ''M Fácil Consignado'', foi levado ao
  INSS, onde análise conjunta INSS/CGU apontou indícios de fraude. É objeto de ação direta de inconstitucionalidade
  e de mais de dez mil processos individuais no TJ-BA. Parte da carteira de consignado do CredCesta foi
  dada em garantia, pelo Banco Master, a um empréstimo de US$ 300 milhões contraído pela Titan Holding
  — empresa pessoal de Daniel Vorcaro — junto à Tether Investments, braço de investimento da emissora
  do stablecoin USDT, em março de 2025. Parte dos mesmos contratos também integrava a carteira depois
  vendida ao BRB.'
why_in_novelo: É o ativo que, segundo a Polícia Federal, ligou Augusto Lima ao Banco Master e está no
  centro do modelo de crédito consignado do banco.
