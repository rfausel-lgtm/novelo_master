org_type: party
summary: Partido político que protocolou no STF, em 03/09/2026, pedidos de prisão preventiva e de afastamento
  cautelar do diretor-geral da Polícia Federal, com abertura de inquérito, no âmbito do inquérito da Operação
  Compliance Zero. Segundo o Poder360 e a Agência Brasil, é o requerente da Notícia de Fato apreciada pelo
  Conselho Superior do MPF em 25/09/2026; em 28/09/2026 pediu a Fachin a anulação do pedido de vista de Flávio
  Dino (Congresso em Foco; Times Brasil).
why_in_novelo: Apresentou ao STF os pedidos de prisão e de afastamento do diretor-geral da Polícia Federal
  no caso Master.
