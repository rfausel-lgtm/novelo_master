open_questions:
- Sem decisão localizada sobre o agravo interno de 14/09/2026 nem sobre o pedido de 28/09/2026 (andamentos das PET 16.704 e 16.662 consultados em 16/10/2026); a PET em que o pedido de 28/09 foi protocolado não foi identificada.
- Os pedidos são de parte; o corpus não registra decisão do relator sobre eles.
- 'NOVO (15/09/2026): em 14/09, interpôs agravo interno contra a decisão de Fachin de 09/09 que suspendeu
  a decisão de Mendonça e sobrestou a Pet 16.662, pedindo reconsideração ou submissão ao Plenário antes da
  sessão de 15/09 (ver ev-partido-novo-agravo-interno-decisao-fachin-09-09). Não localizada informação sobre
  apreciação antes do início da sessão.'
