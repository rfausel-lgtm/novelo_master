summary: Instituição líder do Conglomerado Master, controlada por Daniel Vorcaro. Teve liquidação extrajudicial
  decretada pelo Banco Central em novembro de 2025, junto com o Banco Master de Investimento, o Banco
  Letsbank e a Master CCTVM; o Banco Master Múltiplo foi submetido a RAET.
why_in_novelo: É a instituição financeira cuja liquidação extrajudicial pelo Banco Central e cujas operações
  investigadas pela Polícia Federal constituem o núcleo do caso.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- O CNPJ e os atos societários devem ser confirmados em registro oficial.
- A resposta oficial da Secretaria de Previdência à consulta GesCon invocada pelo banco não foi localizada,
  nem o parecer do escritório de advocacia citado na ata de março de 2024.
- 'As demonstrações financeiras não abrem a concentração da captação por contraparte: há nota sobre os
  dez maiores devedores, no ativo, mas nenhuma abertura equivalente do passivo.'
- A faixa de emissão de até 150% do CDI, declarada nas demonstrações de 2024, não foi localizada em nenhuma
  reportagem — a equipe não sabe quais operações foram contratadas nesse patamar.
