summary: 'Empresa citada em reportagem do G1 (colacionada na Portaria de instauração do IPL sobre o
  "Projeto DV", INQ 5.035) como contraparte contratual, ao lado da Miranda Comunicação, nos contratos
  oferecidos a influenciadores digitais. Segundo a reportagem, Thiago Miranda seria responsável por
  encaminhar ao influenciador, por meio da Olivetto, "as matérias, links e orientações do tema a ser
  tratado, com antecedência suficiente para produção e validação". Nenhum CNPJ, sócio ou outro dado
  cadastral foi localizado nas fontes disponíveis.'
