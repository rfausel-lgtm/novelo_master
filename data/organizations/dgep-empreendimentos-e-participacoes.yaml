summary: 'Empresa de Ribeirão Claro (PR) ligada à incorporação do Resort Tayayá, registrada para a obra em 2006 segundo a
  imprensa. O Requerimento 160/2026 da CPI do Crime Organizado a descreve como detentora de participação no Tayayá Aqua
  Resort, ao lado da Maridt, e diz que ambas transferiram cotas ao fundo Arleen e à PHD Holding. Mario Umberto Degani,
  primo do ministro Dias Toffoli, é apontado como tendo relação societária com ela.'
why_in_novelo: É a segunda empresa, além da Maridt, pela qual a CPI do Crime Organizado liga o resort Tayayá ao fundo
  Arleen, ligado ao cunhado de Daniel Vorcaro.
open_questions:
- CNPJ, quadro societário e datas de entrada e saída dos sócios não foram conferidos em registro oficial pelo acervo.
- A razão social da holding que comprou as cotas aparece como PHD Holding no requerimento do Senado e como PHB Holding em
  outras fontes; a grafia oficial não foi confirmada.
