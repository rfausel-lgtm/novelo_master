summary: "Podcast de entrevistas que o jornalista Reinaldo Azevedo diz ter apresentado em companhia do
  advogado Walfrido Warde (nota de 16/10/2026, em que o descreve no passado). Segundo a mesma nota, teve
  patrocínio do Banco Master, contratado por meio da empresa Super em março de 2024: 12 parcelas de R$ 100
  mil, das quais sete foram pagas. Azevedo afirma que o podcast não servia aos interesses do banco. A
  existência do contrato e os valores são os declarados por ele; o Novelo não teve acesso ao contrato."
