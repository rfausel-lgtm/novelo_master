open_questions:
- O corpus mantém dois registros distintos para o que provavelmente é a mesma empresa — 'PKL One' e 'PKL
  One Participações S.A.' —, descritos a partir de reportagens sobre operações diferentes, no Amapá e
  na Bahia. A decisão judicial do Rio nomeia a parte como PKL One Participações S.A. A equipe não localizou
  o CNPJ que permitiria confirmar a identidade e unificar os registros.
