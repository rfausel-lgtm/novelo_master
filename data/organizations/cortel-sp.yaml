open_questions:
- Resultado das diligências determinadas pelo Min. Dino em 15/09/2026 (Prefeitura/SP Regula, MP-SP,
  CVM) ainda não localizado — a decisão fixou prazos de 10 e 15 dias.
- 'Papel atual de Vicente Conte Neto na Cortel e na relação com o grupo Vorcaro: identidade e vínculos
  segundo a imprensa registrados no lote 318; o voto da CVM confirma um conselheiro de iniciais V.C.N. em 2022.
  Nenhum registro societário da Cortel foi lido.'
