summary: 'Concessionária de serviços funerários e cemiteriais do Município de São Paulo desde a
  privatização promovida pela gestão do prefeito Ricardo Nunes em 2023. Fabiano Zettel (cunhado de Daniel
  Vorcaro) integrou seu conselho até deixar o cargo em outubro/2025, tendo assinado, segundo apuração
  citada pelo Min. Flávio Dino na ADPF 1.196, cinco atas entre 2022 e 2025 usando e-mails institucionais
  do Banco Master e do Banco Máxima. A empresa nega vínculo financeiro ou societário com o banco ou com o
  signatário. O fundo imobiliário Brazilian Graveyard and Death Care Services (CARE11) detém 20% de suas
  ações. Entre março e maio de 2022 a Cortel Holding comprou cotas desse fundo; em 25/11/2025 a CVM absolveu
  a empresa da acusação de manipulação de preços e condenou o então diretor financeiro, Roberto Schumann, e o
  irmão dele, Marcio, por prática não equitativa — negociação própria com conhecimento das compras da
  Cortel (CORRIGIDO no lote 320: o texto anterior falava em "multa em 2022" por informação privilegiada). A
  defesa dos Schumann atribuiu as ordens a Vicente Conte Neto, conselheiro da Cortel indicado pela Zion
  Capital, e destacou a proximidade dele com Vorcaro; a Cortel sustentou ter sido vítima do diretor, demitido
  por justa causa. Roberto Schumann negociou parte das cotas em nome de sua companheira, Priscila Oliveira
  Gomes — nomeada por extenso no voto como acusada, e absolvida de toda imputação por falta de prova de que
  soubesse das ordens feitas em seu nome.'
why_in_novelo: Concessionária apontada pelo STF (ADPF 1.196) como o ponto de convergência entre Fabiano
  Zettel/Banco Master, a cautelar de preços funerários de SP e o voto de André Mendonça contra essa
  cautelar um dia após receber Daniel Vorcaro — objeto de apuração pela Prefeitura de SP, MP-SP e CVM por
  determinação do Min. Dino em 15/09/2026.
cited_position:
- kind: denial
  summary: Nega qualquer vínculo financeiro ou societário com o Banco Master, o Banco Máxima ou com
    Fabiano Zettel enquanto signatário das atas; afirma que ele não é acionista e deixou o conselho em
    outubro de 2025.
  source_ids:
