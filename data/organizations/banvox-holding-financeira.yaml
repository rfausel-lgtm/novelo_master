summary: 'Holding financeira (CNPJ 38.461.854/0001-48), distinta da corretora Banvox DTVM (CNPJ 02.671.743/0001-19,
  já liquidada pelo Banco Central em 03/09/2026). Emitiu R$ 470,5 milhões em debêntures para capitalizar
  o Banco Master, com fiança solidária de Daniel Vorcaro, Augusto Lima e Maurício Quadrado — depois transferidas
  à DV Holding Financeira. É apontada por apuração jornalística (Bloomberg Línea, Revista Oeste/Malu Gaspar)
  como o veículo pelo qual Nelson Tanure teria aportado entre R$ 1,6 e R$ 2,5 bilhões no Master, via debêntures
  que não são conversíveis em ações, mas que desde dezembro de 2022 alguns títulos passaram a poder pagar
  cupons com ações da própria Banvox — Tanure nega qualquer vínculo societário. Quadro de diretores registrado
  na Receita Federal: Maurício Quadrado (desde 15/09/2020) e Artur Martins de Figueiredo (desde 25/09/2020).'
why_in_novelo: É a holding cujas debêntures são o instrumento central da hipótese, ainda não confirmada
  judicialmente, de participação financeira indireta de Nelson Tanure no Banco Master.
