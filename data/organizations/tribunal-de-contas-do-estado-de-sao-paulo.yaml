org_type: court
jurisdiction: São Paulo
summary: Tribunal de contas do Estado de São Paulo. Segundo o Estadão e o g1, a conselheira substituta Silvia
  Cristina Monteiro Moraes julgou irregulares as contas de 2024 do São Roque Prev, em decisão publicada em
  19/10/2026, imputou ao ex-diretor-presidente do instituto o ressarcimento de R$ 93,15 milhões aplicados em
  letras financeiras do Banco Master e propôs à Presidência do tribunal procedimento próprio sobre a
  consultoria Crédito & Mercado. Cabe recurso; o texto da decisão não foi localizado.
why_in_novelo: Órgão que julgou as contas de 2024 do São Roque Prev, relativas às aplicações em letras do
  Banco Master, segundo a imprensa.
