summary: Escritório fundado em 19/11/2002, CNPJ 05.397.402/0001-95. O quadro societário registrado na
  Receita Federal tem como sócios-administradores Michel Miguel Elias Temer Lulia — nome civil completo
  do ex-presidente da República — e Adib Miguel Elias Temer Lulia. Recebeu do Banco Master, segundo o
  próprio Temer, R$ 7,5 milhões em dois pagamentos, valor distinto dos R$ 10 milhões que o banco declarou
  à Receita Federal.
why_in_novelo: É o escritório do próprio ex-presidente Michel Temer, administrador de fato, contratado
  pelo Banco Master — fato que ele mesmo confirmou publicamente.
cited_position:
- kind: clarification
  summary: Confirmou ter conhecido Daniel Vorcaro pessoalmente e que seu escritório foi contratado para
    tentar uma 'liquidação privada' do banco, sem sucesso; disse que prestou 'serviços de mediação' e
    que recebeu dois pagamentos, de R$ 5 milhões e R$ 2,5 milhões — R$ 7,5 milhões no total, contra os
    R$ 10 milhões declarados pelo banco.
