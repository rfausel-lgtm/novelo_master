org_type: public_body
jurisdiction: Angélica (MS)
summary: Gestor do regime próprio de previdência de Angélica (MS), descrito pela Prefeitura como autônomo do Executivo
  municipal. Credenciou o Banco Master em abril de 2024, aplicando R$ 2 milhões, com parecer próprio concluindo
  não haver indícios que prejudicassem a aprovação. É um dos sete institutos identificados, pela decisão que
  autorizou a busca de 12/08/2026 na sede da consultoria Crédito & Mercado, como cliente dela. Resgatou o valor semanas antes da liquidação de novembro de
  2025 e das prisões subsequentes — a única exposição líquida praticamente nula entre os seis institutos deste lote.
  Ainda assim, foi o principal alvo das operações Zehirut e Charitzut (27/05/2026), concentrando sete dos mandados
  de busca e apreensão, com medidas cautelares de afastamento de funções públicas cumpridas. Investigado por gestão
  temerária; é um dos cinco regimes de Mato Grosso do Sul sob auditoria conjunta do TCE-MS.
why_in_novelo: É um dos dezoito regimes próprios que aplicaram em papel do Banco Master, e o único caso de resgate
  integral antes da liquidação combinado com investigação criminal concentrada sobre o processo de decisão, não
  sobre o valor perdido.
cited_position:
- kind: clarification
  summary: A Prefeitura de Angélica declarou que o IPA é autônomo do Executivo municipal e que resgatou o valor
    investido semanas antes da liquidação do banco.
  source_ids:
