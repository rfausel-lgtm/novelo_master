  date: '2026-05-28'
open_questions:
- O que motivou o resgate antecipado, semanas antes da liquidação, não foi esclarecido em nenhuma fonte consultada
  — se decisão técnica preventiva ou coincidência de calendário.
- Os fundamentos das medidas cautelares de afastamento de funções públicas não foram detalhados pela imprensa consultada.
