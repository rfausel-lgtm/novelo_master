summary: 'Gestora/administradora fundada em 2012 por João Carlos Mansur, que a comandou até 2025. Segundo
  relatório do BC ao TCU citado pela CNN, entre julho de 2023 e julho de 2024 o Banco Master e fundos
  administrados pela Reag estruturaram operações em desacordo com as normas do SFN. Sob a denominação
  CBSF DTVM (CNPJ 34.829.992/0001-86), teve liquidação extrajudicial decretada pelo Ato do Presidente
  do BC nº 1.375/2026, de 15/01/2026, assinado por Gabriel Galípolo, por comprometimento econômico-financeiro
  e graves infrações às normas do SFN — liquidante: APS Serviços Especializados de Apoio Administrativo
  Ltda. O próprio ato registra que a CBSF DTVM é pessoa jurídica distinta da REAG IP S.A. (Instituição
  de Pagamento), não abrangida pela medida. Segundo a imprensa, o Master repassou pelo menos R$ 3,6 bilhões
  em créditos de dívidas (112 operações) à Reag, incluindo R$ 357 milhões ao fundo Astralo 95. A Reag
  também foi alvo direto da Operação Carbono Oculto (investigação sobre fraude de combustíveis e lavagem
  ligada ao PCC), com o fundador João Carlos Mansur acusado de dinâmica fraudulenta e ocultação de recursos.
  Segundo a representação da PF de 27/02/2026 (lote 171), na 2ª fase da Operação Compliance Zero (14/01/2026)
  a PF bloqueou R$ 2.245.235.850,24 em conta de Henrique Moura Vorcaro, pai do banqueiro, na CBSF DTVM.
  A pauta da CVM de 09/10/2026 inclui, para 03/11/2026, o PAS contra a Reag Trust DTVM (hoje CBSF DTVM) e Ramon
  Pessoa Dantas, seu diretor responsável pela administração de carteiras à época dos fatos, ambos acusados por
  infração ao art. 22 da Resolução CVM 21; não há julgamento (ver o evento de 03/11). Em 23/06/2026, o Colegiado
  da CVM rejeitou a proposta de termo de compromisso de Fabiana Franco, diretora financeira da REAG Investimentos
  S.A. segundo a CVM, no PAS 19957.011252/2025-50, sobre a suposta não elaboração das demonstrações financeiras de 2024
  e dos formulários trimestrais do 1º e 2º trimestres de 2025; a rejeição não é condenação, nem reconhecimento de culpa, nem julgamento do
  mérito (ver o evento de 23/06/2026). O Novelo não estabeleceu a relação entre essa companhia, a CBSF DTVM e a
  REAG Capital Holding S.A.'
why_in_novelo: Administradora de fundos citada pelo Banco Central em operações irregulares com o Banco
  Master e liquidada em 2026, segundo a imprensa.
