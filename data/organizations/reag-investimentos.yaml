summary: Gestora/administradora fundada em 2012 por João Carlos Mansur, que a comandou até 2025. Segundo
  relatório do BC ao TCU citado pela CNN, entre julho de 2023 e julho de 2024 o Banco Master e fundos
  administrados pela Reag estruturaram operações em desacordo com as normas do SFN. Sob a denominação
  CBSF DTVM, teve liquidação extrajudicial decretada pelo BC em janeiro de 2026, segundo o Migalhas.
why_in_novelo: Administradora de fundos citada pelo Banco Central em operações irregulares com o Banco
  Master e liquidada em 2026, segundo a imprensa.
