summary: 'Empresa de consultoria em gestão empresarial (não é escritório de advocacia), CNPJ 48.998.315/0001-04,
  Salvador/BA, aberta em 28/12/2022, capital social de R$ 2 mil. Sócios: Antonio Carlos Peixoto de Magalhães
  Neto (ACM Neto, administrador desde a abertura) e Mariana Almeida Barreto de Magalhães, sua esposa.
  Recebeu pagamentos do Banco Master — R$ 5,4 milhões (2023-2025, segundo ACM Neto) ou R$ 3,6 milhões
  (Master+Reag, até maio/2024, segundo relatório do Coaf) — valores não reconciliados entre si.'
