jurisdiction: Fátima do Sul (MS)
summary: Autarquia criada pela Lei municipal nº 898/2002, gestora do regime próprio de previdência dos servidores
  de Fátima do Sul (MS). Aplicou R$ 7 milhões em letras financeiras do Banco Master em julho de 2024, sob gestão
  municipal e presidência do instituto anteriores às atuais — mais de 15% do patrimônio total do fundo, segundo
  apuração da Polícia Federal. Alvo de mandado de busca e apreensão na Operação Zehirut (27/05/2026), parte da auditoria
  conjunta do TCE-MS sobre cinco regimes próprios do estado. O prefeito atual, Wagner da Garagem, estuda projeto
  de lei para restringir futuras aplicações a bancos oficiais.
why_in_novelo: É um dos dezoito regimes próprios de previdência que aplicaram em letras financeiras do Banco Master,
  com mais de 15% do patrimônio comprometido e alvo de operação da Polícia Federal.
cited_position:
- kind: not_located
  summary: A atual presidente do instituto, professora Claudete Santos, não respondeu a pedido de manifestação do
    Midiamax.
