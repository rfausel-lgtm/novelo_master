open_questions:
- Há divergência sobre o quadro societário entre a base da Receita Federal, que retorna um único sócio-administrador,
  e agregadores comerciais, que listam outros dois nomes — checagem que dependeria de certidão da Junta
  Comercial do Distrito Federal.
- 'Os nomes associados à agência foram mencionados na decisão do STF, mas não são alvos conhecidos de
  busca, medida cautelar ou denúncia: a 10ª fase teve Thiago Miranda como único alvo.'
- Não foi localizada explicação para a incongruência entre o CNAE principal (software sob encomenda),
  o capital social de R$ 5 mil e a atividade descrita de gerenciamento de reputação.
