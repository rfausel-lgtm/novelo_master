summary: Empresa histórica de Augusto Lima, fundada em 2001 (CNPJ raiz 04.241.549) — "porta de entrada"
  dele no setor financeiro, segundo reportagem da Folha de S.Paulo reproduzida pelo Farol da Bahia.
  Distinta, por raiz de CNPJ, da Terra Firme Realty S.A. (45.125.567), holding mais recente do mesmo
  Augusto Lima. Nomeada como alvo formal de afastamento de sigilo bancário e fiscal na decisão de
  22/06/2026 na PET 15.478/DF, junto com a Terra Firme Construções e Incorporações Ltda — a representação
  policial aponta que empresas do grupo Terra Firme receberam do Banco Master pagamentos em parcelas
  superiores a R$ 3 milhões, por supostos serviços prestados em período de crise aguda do banco, em
  coincidência temporal com as interferências de Augusto Lima junto ao BRB.
why_in_novelo: É uma das duas empresas "Terra Firme" nomeadas como alvo formal de quebra de sigilo na
  investigação sobre a venda fraudulenta de créditos do Master ao BRB — com valores de pagamento novos e
  maiores do que os R$457,2 mil já registrados para o Instituto Terra Firme (entidade distinta, uma
  associação civil presidida pela esposa de Augusto Lima).
cited_position:
