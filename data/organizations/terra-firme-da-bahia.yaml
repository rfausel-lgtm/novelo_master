  summary: Nenhuma manifestação pública em nome da empresa foi localizada no corpus.
open_questions:
- Os "pagamentos em parcelas superiores a R$ 3 milhões" citados na decisão de 22/06/2026 não são
  detalhados por data nem por qual das duas empresas "Terra Firme" nomeadas os recebeu especificamente —
  tratado, por ora, como valor agregado do grupo.
