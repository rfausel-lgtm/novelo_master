summary: 'Fundo de investimento imobiliário do setor funerário, negociado na B3 sob o código CARE11. Detinha 20% do
  capital da Cortel, concessionária de cemitérios de São Paulo — participação equivalente a 54% do patrimônio do
  fundo, segundo a síntese das defesas no processo da CVM. Gestão atribuída à Zion Gestão de Recursos, ligada à
  Zion Capital, acionista relevante da Cortel. A administração fiduciária coube à Master S.A. CCTVM, corretora do
  conglomerado Master, até 04/02/2026, quando os cotistas a substituíram pela Mérito DTVM. O ativo foi alvo de dois
  processos na CVM: o encerrado por termo de compromisso em 2022 sobre ordens do Banco Máxima (depois Master) nas
  cotas, e o processo sancionador sobre as compras da própria Cortel em 2022, julgado em 25/11/2025 com condenação
  dos irmãos Schumann por prática não equitativa e absolvição da Cortel. Reportagem do UOL, transcrita pelo Min.
  Flávio Dino na ADPF 1.196, liga o fundo à origem do Master em 2016 — um cemitério em Sabará/MG avaliado pela
  própria empresa em R$ 181 milhões. RESOLVIDO (19/09/2026, fonte lida diretamente — Revista Oeste, mesma
  apuração da PF republicada em 18/02/2026): o cemitério é o Terra Santa, de titularidade da VHR Empreendimentos,
  reavaliado para R$ 111,7 milhões em 2020 — número que o acervo publicara no lote 315 a partir de pesquisa
  delegada não conferida, e retirara por falta de fonte lida; agora republicado com fonte própria. O nome da
  empresa da família Vorcaro sócia do cemitério não é dado nem nessa reportagem, nem na decisão de Dino. O
  Ministério Público de Contas de Minas Gerais apura aplicações de regimes próprios de cinco municípios no
  fundo.'
why_in_novelo: Ativo em que convergem o conglomerado Master (operador das cotas, administrador do fundo e cotista),
  a Cortel ligada a Fabiano Zettel, os irmãos Conte e dinheiro de previdência municipal — a frente de cemitérios
  que o Min. Flávio Dino mandou a CVM apurar em 15/09/2026.
