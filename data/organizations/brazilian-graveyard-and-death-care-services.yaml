  summary: Manifestação pública do fundo ou de sua gestora sobre as apurações não localizada até esta coleta.
open_questions:
- 'RESOLVIDO (15/09/2026): o administrador até 04/02/2026 era a Master S.A. CCTVM, sucedida pela Mérito DTVM —
  não a Planner Trustee, como dissera a Revista Oeste e o acervo repetira no lote 315. Não foi localizado
  documento que ponha a Planner Trustee na administração do fundo em qualquer período.'
- Valores, datas e situação atual das aplicações dos RPPS de Extrema, Guanhães, Paraguaçu, São João del-Rei e
  Três Pontas — fonte única de imprensa; nenhum documento do MPC-MG ou do TCE-MG localizado.
- A resposta da CVM à requisição do Min. Dino (15 dias a partir de 15/09/2026) sobre fundos ligados a cemitérios
  de São Paulo, com prioridade para a Cortel.
- O regulamento e os informes do fundo não foram lidos; os papéis de Zion Gestão e Zion Capital vêm do processo
  da CVM, na parte que resume a defesa.
