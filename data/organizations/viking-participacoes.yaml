summary: 'Empresa tratada como do banqueiro nos votos do Banco Central sobre a transferência de controle
  do Banco Máxima: segundo o voto BCB 20/2019, na reconstituição publicada a partir dos extratos obtidos
  pelo Valor Econômico, seu patrimônio cresceu com laudos de reavaliação de imóveis de duas controladas
  e ela aportou no fundo que comprou a participação do antigo controlador. Segundo os documentos da PET
  16.662 divulgados pelo Poder360, firmou em maio de 2025 contrato de R$ 50 milhões com o escritório Barci
  de Moraes e um acordo de dação em pagamento.'
why_in_novelo: Aparece como origem dos recursos da aquisição do controle do banco, segundo os votos do
  Banco Central, e como contratante do escritório Barci de Moraes nos documentos da PET 16.662 tornados
  públicos pelo STF.
