summary: Tribunal de Justiça do DF. Em maio de 2025, segundo notas de sua própria assessoria de imprensa, a 1ª
  Vara da Fazenda Pública concedeu liminar que suspendia a assinatura do contrato do BRB para comprar parte do
  Banco Master, e o desembargador relator a revogou em pedidos de suspensão de liminar. O desfecho posterior
  do processo não foi verificado.
why_in_novelo: Órgão que decidiu, em 1ª e 2ª instância, o pedido de suspender a assinatura do contrato de
  compra do Master pelo BRB em 2025.
