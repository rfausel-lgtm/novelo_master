full_name: Agência Reguladora de Serviços Públicos do Município de São Paulo
aliases: []
org_type: public_body
summary: Agência reguladora municipal de São Paulo responsável, entre outras frentes, pela fiscalização
  dos serviços funerários e cemiteriais privatizados, incluindo a concessão à Cortel SP. Em 10/02/2026
  enviou o Ofício 028/SP REGULA/GSFC/2026 à Cortel exigindo esclarecimentos sobre sua estrutura societária
  e eventual vínculo com o Banco Master. Alexandre de Almeida Mendonça, irmão do Min. André Mendonça, foi
  nomeado Superintendente da agência em julho/2024 e promovido a Secretário-Executivo em 26/05/2026.
why_in_novelo: Agência municipal na linha de frente da apuração sobre o vínculo Cortel/Banco Master
  determinada pelo Min. Flávio Dino, e onde o irmão do Min. André Mendonça ocupa cargo de direção desde
  antes do julgamento da cautelar em que Mendonça votou favoravelmente às concessionárias.
