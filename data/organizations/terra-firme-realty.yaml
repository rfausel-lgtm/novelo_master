open_questions:
- É sócia de cinco SPEs administradas por Gustavo Amorim Araújo (Morro da Barra, Mark 71, Rsp 70, Barra
  Lodge, Gavazza) — na Mark 71, Andréa Lima Novaes (ex-administradora da PKL One Participações/CredCesta)
  consta como sócia/administradora ao lado de Araújo, conforme agregador de dados públicos de CNPJ não
  confirmado por consulta direta e independente à Receita Federal.
- O nome 'Mark 71' (SPE em que Andréa Lima Novaes apareceria como sócia, segundo o agregador Adv Dinâmico)
  não foi confirmado por pesquisa independente adicional — que localizou, entre as SPEs de Gustavo Amorim
  Araújo, uma 'Azure 71 Empreendimentos Imobiliários', não 'Mark 71'. Pode ser erro de transcrição do
  agregador original, nome real de outra SPE do mesmo padrão de nomenclatura, ou informação não indexada
  — recomenda-se verificação direta antes de tratar 'Mark 71' como nome confirmado.
