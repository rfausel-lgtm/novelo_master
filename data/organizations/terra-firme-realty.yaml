summary: 'Holding de Augusto Lima (CNPJ 45.125.567/0002-03, filial aberta em 17/07/2023, capital social
  de R$ 99.418.310,00, sede em Salvador). Controlava dois empreendimentos residenciais de luxo em Salvador
  (Amarama Barra e One), repassados à OR (Novonor/ex-Odebrecht) em outubro de 2025, em meio à crise do
  Master. Diretor: Gustavo Amorim Araújo. Possível ligação — não confirmada pela equipe — com a ''Terra
  Firme da Bahia Ltda'' já citada no corpus como vínculo documental (e-mail e telefone compartilhados)
  entre Augusto Lima e as associações Asteba/Asseba; podem ser a mesma estrutura societária ampliada (''Grupo
  Terra Firme'') ou entidades distintas com nome semelhante — não verificado.'
why_in_novelo: É uma das holdings pessoais de Augusto Lima, usada para repassar ativos imobiliários de
  luxo em meio à crise do Master — possivelmente parte do mesmo grupo empresarial já citado no corpus
  por outro vínculo documental (Asteba/Asseba).
