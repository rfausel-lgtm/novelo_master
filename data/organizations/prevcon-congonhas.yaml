name: Previdência do Município de Congonhas
aliases:
- PREVCON
org_type: public_body
summary: Autarquia que gere o regime próprio de previdência de Congonhas (MG), CNPJ 08.771.208/0001-16.
  Aplicou R$ 14 milhões em letras financeiras do Banco Master em 27/05/2024, vinte dias depois de seu
  Comitê de Investimentos autorizar a compra genérica de letras financeiras sob o critério de que a instituição
  estivesse na lista exaustiva da Secretaria de Previdência — condição que o Banco Master não cumpria
  naquela data. O saldo chegou a R$ 16,5 milhões em outubro de 2025 e foi baixado a R$ 0,01 já na posição
  de novembro. Consta entre os quatro entes em que a auditoria do Ministério da Previdência teria identificado
  o mesmo modelo de justificativa de credenciamento.
why_in_novelo: Quarto regime próprio documentado na mesma operação de captação, e o caso em que a compra
  violou o critério que o próprio colegiado havia fixado.
cited_position:
- kind: clarification
  summary: Em nota de 19/11/2025, informou que as letras foram adquiridas 'por meio de procedimento regular,
    em conformidade com as normas vigentes', que correspondiam a 2,7% do patrimônio líquido e que não
    colocavam esse patrimônio em risco. Em ata de 18/12/2025 sustentou que a aquisição seguiu as normas
    vigentes, sem indicadores que a desabonassem até abril de 2025, e atribuiu o ocorrido a falha de supervisão
    do Banco Central.
  source_ids:
  - src-prevcon-nota-esclarecimento-2025-11-19
  - src-prevcon-ata-232a-conselho-2025-12-18
  by_id: prevcon-congonhas
  date: '2025-12-18'
open_questions:
- O parecer ou termo de credenciamento do Banco Master não está publicado em nenhuma das seções do repositório
  da autarquia, no Diário Oficial do município ou no portal da transparência — embora o fluxograma da
  própria entidade exija aprovação do Comitê para o credenciamento.
- Nenhuma ata publicada do Comitê registra a aprovação do credenciamento do Banco Master.
- A equipe não localizou processo no Tribunal de Contas de Minas Gerais nem no Ministério Público estadual
  sobre o caso.
- A representação para auditoria da liquidação, mencionada em ata, não teve destinatário nem número identificados.
