- terra-firme-da-bahia
org_type: company
summary: Empresa nomeada como alvo formal de afastamento de sigilo bancário e fiscal na decisão de
  22/06/2026 na PET 15.478/DF, ao lado da Terra Firme da Bahia Ltda — a representação policial aponta que
  empresas do grupo Terra Firme receberam do Banco Master pagamentos em parcelas superiores a R$ 3
  milhões, por supostos serviços prestados em período de crise aguda do banco, em coincidência temporal
  com as interferências de Augusto Lima junto ao BRB.
why_in_novelo: A decisão a trata como pessoa jurídica distinta da Terra Firme da Bahia Ltda (item numerado
  separadamente), mas o acervo não localizou, até esta apuração, nenhum registro cadastral independente
  (CNPJ, Receita Federal) que confirme se é de fato uma quarta empresa "Terra Firme" ligada a Augusto Lima
  — distinta da Terra Firme Realty S.A. e da Terra Firme da Bahia Ltda — ou uma imprecisão de nome na
  própria representação policial.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública em nome da empresa foi localizada no corpus.
open_questions:
- 'Identidade não confirmada por registro cadastral independente: pode ser uma quarta entidade "Terra
  Firme" distinta, ligada a Augusto Lima, ou imprecisão de nome da autoridade policial referindo-se a uma
  das outras duas já mapeadas (Terra Firme Realty S.A. ou Terra Firme da Bahia Ltda). Tratado como
  entidade própria por ora, seguindo a numeração da própria decisão, que a lista separadamente.'
