summary: Distribuidora de títulos e valores mobiliários, posteriormente renomeada Sefer Investimentos.
  Administrava o FII São Domingos, fundo abastecido por regimes próprios de previdência de servidores
  públicos que comprou por R$ 57 milhões um terreno em Jequitibá (MG) regularizado por R$ 2,5 milhões
  dois anos antes. Em 2022, a CVM multou a Foco DTVM e o diretor do fundo em mais de R$ 1 milhão por má
  gestão, incluindo operações que beneficiaram empresas da família Vorcaro. Aparece também, em outras
  frentes de apuração, como administradora de fundos ligados ao Grupo Aquilla e ao esquema de desvio de
  recursos de regimes próprios de previdência investigado em Rondônia.
why_in_novelo: Administradora do fundo cuja compra de um terreno supervalorizado ajudou a lastrear a capacidade
  econômica apresentada por Vorcaro ao Banco Central, e nó recorrente em outras frentes do caso.
