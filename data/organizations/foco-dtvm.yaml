open_questions:
- 'Há divergência sobre o porte da casa: a Folhapress, a partir de base do Banco Central, aponta R$ 12,9
  bilhões sob administração em maio de 2026 e classificação S4 (pequeno porte); o Estadão atribui 102
  fundos e mais de R$ 20 bilhões, dos quais cerca de R$ 9,6 bilhões ligados ao ecossistema Master.'
