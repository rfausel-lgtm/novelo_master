- Sefer Investimentos
org_type: financial_institution
summary: 'Distribuidora de títulos e valores mobiliários fundada em 2003 por Benjamim Botelho de Almeida,
  que trocou de nome duas vezes: Foco DTVM, depois Índigo Investimentos DTVM e, por fim, Sefer Investimentos.
  Administrava o FII São Domingos, fundo abastecido por regimes próprios de previdência de servidores
  públicos que comprou por R$ 57 milhões um terreno em Jequitibá (MG) regularizado por R$ 2,5 milhões
  dois anos antes — operação que ajudou a lastrear a capacidade econômica apresentada por Vorcaro ao Banco
  Central. Em 05/07/2022, a CVM condenou a casa e dois administradores em multas que somam R$ 2,1 milhões
  por irregularidades na administração desse fundo. Geria também o fundo Monte Carlo, cujos recursos,
  como os do São Domingos, teriam sido direcionados a empresas ligadas à família Vorcaro, segundo a imprensa,
  e aparece em material da Operação Fundo Fake, de 2020. Foi alvo da 2ª fase da Operação Compliance Zero,
  em 14/01/2026, e teve a liquidação extrajudicial decretada pelo Banco Central em 26/06/2026, por comprometimento
  econômico-financeiro e graves violações às normas legais. A estrutura já era investigada muito antes
  do caso Master: em 31/01/2013, a Polícia Federal instaurou a ''Operação Miquéias'' sobre aplicações
  de regimes próprios de previdência em fundos administrados pela Foco e geridos pela A.A.M./Aquilla,
  com uso de ''pastinhas'' que ofereciam percentual sobre o aporte a prefeitos e gestores. A PF identificou
  aportes suspeitos de RPPS em pelo menos 20 municípios e dez estados direcionados à casa.'
why_in_novelo: Administradora do fundo cuja compra de um terreno supervalorizado ajudou a lastrear a capacidade
  econômica apresentada por Vorcaro ao Banco Central, e nó recorrente em outras frentes do caso.
cited_position:
- kind: clarification
  summary: Por sua assessoria, a Sefer declarou que todas as operações 'observam rigorosamente a legislação
    do mercado de capitais' e são 'lícitas, regulares e pautadas por critérios técnicos', negando que
    as pessoas citadas em reportagens sejam cotistas dos fundos.
