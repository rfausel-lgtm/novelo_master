jurisdiction: Imbituva (PR)
summary: Regime próprio de previdência do município de Imbituva (PR). Aplicou cerca de R$ 4 milhões em Letra Financeira
  do Banco Master, assessorado pela consultoria Crédito e Mercado Engenharia Financeira. Em 19/08/2025, seu Comitê
  de Investimentos deliberou por unanimidade manter a aplicação mesmo após alerta do TCE-PR sobre o risco do ativo
  (rating abaixo do mínimo exigido pela política de investimentos, sem garantia do Fundo Garantidor de Créditos).
  Após a liquidação do Master (18/11/2025), o TCE-PR converteu a representação contra o fundo em Tomada de Contas
  Extraordinária em 06/04/2026, nomeando dirigentes do fundo e a consultoria como responsáveis solidários pelo dano
  ao erário.
why_in_novelo: É mais um regime próprio de previdência exposto ao Banco Master, com a particularidade de que o TCE-PR
  moveu a mais formal das medidas de responsabilização já registradas no acervo entre os RPPS municipais — uma Tomada
  de Contas Extraordinária que nomeia expressamente a consultoria Crédito e Mercado como corresponsável pelo dano,
  ao lado dos gestores do fundo.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública do fundo ou de seus dirigentes foi localizada no corpus até a data desta
    apuração; os citados têm prazo de 15 dias, a partir do despacho de 06/04/2026, para apresentar defesa nos autos.
open_questions:
- O corpus não obteve o texto integral da Proposta de Representação Inicial nem das instruções técnicas da CAGE,
  apenas o despacho que as resume e converte o feito em Tomada de Contas Extraordinária.
- Não localizada manifestação da Crédito e Mercado especificamente sobre este caso — a negativa geral da consultoria
  (lote 164) antecede esta citação.
