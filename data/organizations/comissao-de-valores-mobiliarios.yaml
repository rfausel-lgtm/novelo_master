open_questions:
- A CVM nunca deu explicação pública sobre o PAS 19957.008699/2019-01, o processo sobre desvio de recursos
  de regimes próprios de previdência, que segue sem julgamento desde 2016 e sequer consta da apresentação
  levada ao Senado em fevereiro de 2026.
