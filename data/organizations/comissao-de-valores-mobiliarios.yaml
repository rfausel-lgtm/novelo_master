summary: 'Autarquia federal responsável pela regulação e fiscalização do mercado de capitais brasileiro.
  É o regulador que, antes do colapso do Banco Master, conduziu ao menos onze processos administrativos
  sancionadores envolvendo pessoas e empresas do caso — incluindo um em que o próprio Daniel Vorcaro figurou
  como acusado e fechou termo de compromisso, em dezembro de 2020. Segundo grupo de trabalho interno criado
  em fevereiro de 2026, foram 314 processos desde 2017 e 14 termos de acusação relacionados ao grupo.
  A autarquia enfrenta paralisia reconhecida judicialmente: em julho de 2026 o STF homologou plano emergencial
  de reestruturação na ADI 7.791, diante de cerca de 1.500 processos pendentes, e o Colegiado operou 2026
  com três de cinco cadeiras vagas. Entre os processos, destaca-se o do Brazil Realty FII (PAS 19957.007976/2020-94),
  em que o parecer técnico descreve laudo de avaliação sem assinatura, sobreavaliação de R$ 56 milhões,
  avaliadora que não reconheceu a autoria e recibo com assinatura aparentemente colada, com retorno irregular
  de R$ 84,9 milhões à Milo Investimentos e regimes próprios de previdência entre os lesados. Três propostas
  de acordo foram rejeitadas — a última, de R$ 21,285 milhões, por unanimidade em 02/12/2025, contra a
  recomendação do próprio Comitê. O julgamento ocorreu em 08/09/2026 (ver o evento da condenação de 08/09/2026). Em 29/09/2026
  o Colegiado condenou o diretor presidente e o diretor financeiro da REAG Capital Holding S.A. à multa de R$ 170 mil
  cada, por infração formal: não elaborar demonstrações financeiras e ITR (evento de 29/09). A pauta atualizada em
  09/10/2026 inclui, para 03/11/2026, o PAS contra a Reag Trust DTVM (hoje CBSF DTVM) e Ramon Pessoa Dantas, seu
  diretor responsável pela administração de carteiras à época dos fatos, ainda sem julgamento (evento de 03/11).
  Em 23/06/2026, o Colegiado rejeitou, por unanimidade, a proposta de termo de compromisso de Fabiana Franco,
  diretora financeira da REAG Investimentos S.A., no PAS 19957.011252/2025-50, acompanhando o parecer do
  Comitê; a rejeição não é condenação, julgamento do mérito nem reconhecimento de culpa (evento de 23/06/2026).
  Em 24/09/2026, com base no relatório do grupo de trabalho, o relator da ADI 7.791 no STF, Flávio Dino,
  requisitou à Polícia Federal inquérito sobre os fatos descritos na decisão, entre eles o arquivamento do
  Processo SEI nº 19957.001206/2022-08, aberto em 18/02/2022 a partir de comunicação do FGC sobre o Grupo Master,
  e deu à CVM 72 horas para enviar o processo e informar quem o analisou e arquivou; a decisão não nomeia
  investigados e não é condenação (evento de 24/09). Segundo O Povo, a CVM disse estar mobilizada para cumprir.'
why_in_novelo: Regulador do mercado de capitais que processou repetidamente as empresas e pessoas do caso
  Master antes do colapso, e cuja atuação passou a ser questionada no Senado.
cited_position:
