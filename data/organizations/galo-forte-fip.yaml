id: galo-forte-fip
kind: organization
name: Galo Forte FIP
org_type: fund
summary: Fundo de Investimento em Participações cujas cotas, segundo a decisão de Dias Toffoli de
  06/01/2026 na PET 15.198, eram 100% detidas pelo Astralo 95 até novembro de 2024 — quando passaram a ser
  detidas por Daniel Vorcaro (cerca de 80%) e pelo Astralo 95 (cerca de 20%), a partir de dezembro de 2024.
  A autoridade policial nota que isso contradiz "o conhecimento público", que desde o final de 2023 já
  indicava Daniel Vorcaro como proprietário do fundo.
why_in_novelo: A mudança formal de titularidade das cotas, meses depois de o mercado já tratar Daniel
  Vorcaro como dono do fundo, é apontada pela autoridade policial como indício de dissimulação societária
  no núcleo do esquema do Banco Master.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública em nome do fundo ou de seu administrador foi localizada no corpus.
open_questions:
- O acervo não localizou, até esta apuração, registro societário independente sobre a composição de cotas
  do fundo além do que a própria decisão do STF descreve.
