summary: 'Empresa brasileira de gestão ambiental e resposta a emergências. É investigada na Operação Compliance
  Zero por um mecanismo distinto do já registrado no corpus (Texas I FIA, compra coordenada de suas ações
  via Trustee DTVM para inflar artificialmente o preço, causando prejuízo de R$ 135,1 milhões ao Rioprevidência):
  aqui, a apuração é sobre a venda de títulos de crédito ''podres'' do Banco Master ao BRB envolvendo
  a empresa. A residência da então vice-diretora Luciana Freire Barca Nascimento foi alvo de busca e apreensão
  na 2ª fase da operação, em 14/01/2026. Contratou, em 2026, serviços de relações governamentais que incluíram
  Renata Varandas — namorada pública do diretor-geral da PF à época, Andrei Rodrigues — como representante
  em reuniões federais. A apuração sobre manipulação de preço corre como processo sancionador formal da
  CVM (Investigação Administrativa nº 19957.005195/2025-70, mercados à vista e de derivativos, 2024-2025)
  — em 24/07/2026 o STF autorizou a CVM a colher depoimento do próprio Daniel Vorcaro, preso, sobre o caso.'
why_in_novelo: É alvo de duas linhas distintas de apuração da Compliance Zero — manipulação de preço de
  ações (Texas I FIA) e venda de créditos podres ao BRB — e está no centro de um possível conflito de
  interesse envolvendo a namorada do diretor-geral afastado da PF.
