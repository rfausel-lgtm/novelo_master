summary: >-
  Escritório de advocacia que, segundo o Metrópoles e a CNN Brasil (21/09/2026), que dizem ter obtido o
  documento, firmou com o Banco Master contrato de honorários de êxito de 5% líquidos sobre o que o banco
  recebesse em 12 ações do setor sucroalcooleiro; pelo cálculo do Metrópoles sobre o valor de face das causas,
  os honorários chegariam a R$ 427 milhões em caso de êxito. A Agência Brasil e o Times Brasil o descrevem como
  escritório de que é sócia a advogada Camilla Ramos, casada com o desembargador federal Newton Ramos (TRF-1).
  Em nota de 23/09/2026, segundo a Agência Brasil, declarou ter contrato formal com o Master para atuar em
  processos de precatórios, com taxa de êxito de 5%, e não ter recebido pagamento "a título de pró-labore ou de
  êxito"; segundo o Times Brasil, disse desconhecer e não ter participado de negociações de transferência dos
  precatórios a terceiros. O contrato não é público.
why_in_novelo: Escritório que declarou ter contrato formal com o Banco Master para atuar em processos de precatórios, com taxa de êxito de 5%, e afirma não ter recebido pagamento.
