    envolvem precatórios, sem ter recebido qualquer pagamento "a título de pró-labore ou de êxito", e que "a taxa
    de êxito acordada com o banco para atuação nos casos de processos envolvendo precatórios foi de 5%, patamar
    inferior ao previsto no CPC e no estatuto da OAB"; segundo o Times Brasil, afirmou não ter conhecimento de
    negociações de transferência dos precatórios a terceiros nem ter participado delas.
