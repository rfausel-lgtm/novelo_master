org_type: company
summary: Empresa de Bonnie Toaldo Bonilha, sócia única, aberta em 20/05/2019 com capital social de R$
  10 mil. Constava anteriormente como Vamos Florir Comércio de Flores Ltda., com atividade de floricultura,
  e passou a BN Representações Tecnológicas Ltda., com atividade de desenvolvimento de software, mudando
  a sede de Salvador para Igaporã, no interior da Bahia — alteração registrada em janeiro de 2026, poucos
  meses antes da 9ª fase da Operação Compliance Zero. O endereço de Igaporã abriga vinte CNPJs, dezessete
  deles sob responsabilidade do mesmo contador, e as duas empresas de Bonnie declaram à Receita o mesmo
  telefone e praticamente o mesmo e-mail, ambos de escritório de contabilidade. Teve as atividades econômicas
  e financeiras suspensas por decisão do ministro André Mendonça em 17/06/2026.
why_in_novelo: Segunda empresa da mesma sócia alcançada pela suspensão de atividades determinada pelo
  STF, e cuja mudança de ramo e de endereço precedeu em poucos meses a operação.
