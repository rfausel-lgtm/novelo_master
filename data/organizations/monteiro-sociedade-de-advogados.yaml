id: monteiro-sociedade-de-advogados
kind: organization
name: Monteiro Sociedade de Advogados
aliases: []
org_type: law_firm
summary: Escritório com denominação oficial na Receita Federal distinta da usada pela imprensa ('Monteiro,
  Rusu, Cameirão e Bercht'), CNPJ 24.814.369/0001-04, fundado em 27/04/2016, tendo Daniel Lopes Monteiro
  como sócio-administrador. Banca de mercado de capitais reconhecida em rankings do setor. Monteiro foi
  preso na Operação Compliance Zero em 16/04/2026, acusado pela PGR de ter operado 'compliance paralelo'
  do Banco Master fora dos canais internos de controle e de estruturar empresas de fachada para ocultar
  imóveis repassados ao ex-presidente do BRB, Paulo Henrique Costa — a PGR estima vantagem econômica pessoal
  dele em cerca de R$ 86,1 milhões. O Master declarou à Receita R$ 109 milhões em pagamentos a empresas
  de que ele é sócio, entre 2022 e 2025.
why_in_novelo: 'É o caso mais grave entre os escritórios identificados: não se trata de honorário questionado,
  mas de prisão e imputação de operação paralela de esquema de propina, segundo a PGR, ligado à tentativa
  de compra do Master pelo BRB.'
cited_position:
- kind: denial
  summary: A defesa nega ilegalidade, afirma que a criação de empresas, fundos e outras estruturas é parte
    da atividade regular da advocacia, que o uso indevido por clientes não pode ser automaticamente atribuído
    ao advogado sem provas, e destaca trajetória 'estritamente técnica'.
