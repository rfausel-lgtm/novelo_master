summary: Casa legislativa do município de Imperatriz (MA). Manteve contrato de prestação de serviços jurídicos
  com o escritório do advogado Daniel de Faria Jerônimo Leite desde abril de 2023 (Pregão 002/2023, R$
  10.900/mês); um aditivo de 06/04/2024 elevou o valor para R$ 15.000/mês (~R$ 180 mil/ano) e prorrogou
  por 12 meses — motivo de apuração do Ministério Público do Maranhão por possível improbidade administrativa
  (Notícia de Fato nº 003773-253/2025), trancada pelo ministro Dias Toffoli em 30/09/2025 (PET 14.601/MA),
  com fundamento na tese de repercussão geral do Tema 309, sem menção a Vorcaro ou ao caso Master no texto
  da decisão.
why_in_novelo: É o ente público cujo contrato com o escritório de Daniel Leite, renovado sem licitação,
  motivou a apuração de improbidade que conecta o Maranhão à tentativa de compra de ações do BRB ligada
  a Vorcaro.
