summary: Casa legislativa do município de Imperatriz (MA). Manteve contrato de prestação de serviços jurídicos
  com o escritório do advogado Daniel de Faria Jerônimo Leite, de cerca de R$ 180 mil/ano, firmado em
  abril de 2023 e renovado em abril de 2025 sem nova licitação — motivo de apuração do Ministério Público
  do Maranhão por possível improbidade administrativa, suspensa monocraticamente pelo ministro Dias Toffoli
  em 30/09/2025.
why_in_novelo: É o ente público cujo contrato com o escritório de Daniel Leite, renovado sem licitação,
  motivou a apuração de improbidade que conecta o Maranhão à tentativa de compra de ações do BRB ligada
  a Vorcaro.
