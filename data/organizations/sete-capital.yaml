summary: Consultoria de investimentos que assessorava o regime próprio de Aparecida de Goiânia. Seu representante,
  Reiter Ferreira, fez a análise verbal da documentação de credenciamento do Banco Master na sessão de
  20/12/2023, afirmando estar de acordo com a Portaria MTP 1.467/2022. Em 28/02/2024, na discussão sobre
  a mudança da política de investimentos, apresentou classificação que situava o Banco Master em 'grau
  altamente especulativo'. Em setembro de 2024, questionada sobre risco de calote, respondeu que o banco
  'pode ser um banco mais fragilizado'.
why_in_novelo: Consultoria que atestou o credenciamento do Banco Master no regime próprio de Aparecida
  de Goiânia e depois classificou o mesmo banco como de grau altamente especulativo.
