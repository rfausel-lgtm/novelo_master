summary: 'Banco controlado pelo Governo do Distrito Federal. Segundo decisão do STF (PET 15771), teria adquirido
  carteiras de crédito do Banco Master que alcançariam R$ 12,2 bilhões, apesar de pareceres técnicos e jurídicos
  contrários. Reportagem baseada em apuração da Polícia Federal descreve o mecanismo dessa aquisição: uma empresa
  de fachada, a Tirreno, vendia os créditos ao BRB embutindo prêmio ao banco comprador, e a Polícia Federal apurou
  que os créditos não puderam ser confirmados na origem. Em ofício próprio de 18/06/2025 ao Banco Central, ainda
  sob a presidência de Paulo Henrique Costa, o BRB reconheceu ter identificado tranches de crédito com origem em
  promotores de vendas contratados pelo Master, documentação incompleta e auditoria independente não concluída —
  cinco meses antes do afastamento dele. Perícia da PF concluída em 13/08/2026, com sigilo levantado em 11/09/2026,
  analisou R$ 17,5 bilhões em operações e concluiu que o BRB concentrou 90,3% de suas carteiras adquiridas de terceiros
  no Master, com pico de R$ 19,8 bilhões em junho de 2025, e que R$ 7,6 bilhões foram pagos em 22 operações antes
  da conclusão dos ritos técnicos obrigatórios — caracterizando a gestão da própria diretoria do BRB à época como
  ''gestão fraudulenta''. Documento anterior da PF, de abril de 2026, já havia apontado ágio de R$ 2,4 bilhões (32%)
  entre o valor contábil e o valor pago pelas carteiras adquiridas entre julho de 2024 e janeiro de 2025.'
why_in_novelo: Adquiriu carteiras de crédito do Banco Master que são objeto central da Operação Compliance Zero,
  segundo comunicações oficiais da PF e do STF.
cited_position:
- kind: clarification
  summary: Em ofício de 18/06/2025 ao Banco Central (Ofício PRESI-2025/051), o BRB — sob a presidência de Paulo
    Henrique Costa — atribuiu as medidas adicionais de garantia à "intempestividade no envio das informações complementares"
    pelo Master e à "não conclusão dos trabalhos da auditoria independente" contratada.
  source_ids:
  - src-stf-inq5026-ipl1096304-completo
  by_id: paulo-henrique-costa
  date: '2025-06-18'
open_questions:
- 'RESOLVIDO EM PARTE (19/09/2026): em assembleia geral extraordinária de 24/08/2026, os acionistas do
  BRB aprovaram autorização processual (art. 159 da Lei 6.404/1976) para acionar judicialmente ex-gestores
  pelas perdas nas operações com o Master — só Paulo Henrique Costa é nominalmente citado; outros
  "ex-gestores" não são identificados individualmente, e o banco frisou que a autorização não constitui
  "definição prévia de responsabilidade". Ainda não apurado: se a ação foi de fato ajuizada, contra quem
  especificamente, e por qual valor.'
- Nelson Antônio de Souza (ex-presidente da Caixa) assumiu a presidência em 26/11/2025, aprovado pelo BC e pela
  Câmara Legislativa do DF, após o afastamento de Paulo Henrique Costa. O Banco Central determinou provisionamento
  de R$ 2,6 bilhões para cobrir a fraude nas carteiras do Master, com prazo até 29/05/2026 sob risco de intervenção
  — o novo presidente declarou publicamente que não haveria intervenção nem liquidação; resultado final desse processo
  regulatório não confirmado por fonte localizada.
- 'RESOLVIDO EM PARTE (19/09/2026): o requerimento de CPI na CLDF, protocolado por deputados do PL em
  março de 2026, tinha 7 das 8 assinaturas mínimas em 06/03/2026 — faltava a do deputado Thiago Manzoni
  (PL). Busca em 19/09/2026 não confirma instalação efetiva até esta data (ver camara-legislativa-do-
  distrito-federal). A sugestão de Izalci Lucas no Senado não teve desdobramento localizado.'
- 'NOVO (19/09/2026): o TCDF, órgão de controle externo do BRB — sem nenhuma ocorrência no acervo até
  esta coleta —, mantém duas frentes abertas: o processo nº 00600-00003617/2025-75 (denúncia do MPC-DF,
  19/11/2025, sobre possível contorno de restrição do BC na compra das carteiras) e a Decisão nº
  1.687/2026 (20/08/2026), que suspendeu a apreciação das contas de 2025 do governo do DF até o BRB
  entregar balanço financeiro auditado — o banco não divulga balanço desde novembro de 2025 (ver
  tribunal-de-contas-do-distrito-federal).'
