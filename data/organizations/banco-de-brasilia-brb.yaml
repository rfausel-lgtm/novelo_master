summary: 'Banco controlado pelo Governo do Distrito Federal. Segundo decisão do STF (PET 15771), teria
  adquirido carteiras de crédito do Banco Master que alcançariam R$ 12,2 bilhões, apesar de pareceres
  técnicos e jurídicos contrários. Reportagem baseada em apuração da Polícia Federal descreve o mecanismo
  dessa aquisição: uma empresa de fachada criada por Vorcaro, a Tirreno, vendia os créditos ao BRB embutindo
  prêmio ao banco comprador, e a investigação concluiu que os créditos nunca existiram na origem — contratos
  fabricados, segundo amostra de 130 casos analisados pelo Banco Central sem lastro algum.'
why_in_novelo: Adquiriu carteiras de crédito do Banco Master que são objeto central da Operação Compliance
  Zero, segundo comunicações oficiais da PF e do STF.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- A extensão da responsabilidade de dirigentes do BRB que aprovaram a compra apesar de pareceres técnicos
  e jurídicos contrários não foi apurada pela equipe neste lote.
- Nelson Antônio de Souza (ex-presidente da Caixa) assumiu a presidência em 26/11/2025, aprovado pelo
  BC e pela Câmara Legislativa do DF, após o afastamento de Paulo Henrique Costa. O Banco Central determinou
  provisionamento de R$ 2,6 bilhões para cobrir a fraude nas carteiras do Master, com prazo até 29/05/2026
  sob risco de intervenção — o novo presidente declarou publicamente que não haveria intervenção nem liquidação;
  resultado final desse processo regulatório não confirmado por fonte localizada.
- Pedidos de CPI sobre o caso BRB-Master foram apresentados na Câmara Legislativa do DF (PL) e sugeridos
  no Senado (Izalci Lucas) em fevereiro de 2026 — instalação efetiva e resultado dos trabalhos não confirmados
  por fonte localizada.
