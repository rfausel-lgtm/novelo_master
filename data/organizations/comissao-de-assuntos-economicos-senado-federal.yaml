summary: Comissão permanente do Senado Federal, presidida por Renan Calheiros, que conduz uma linha
  própria de apuração parlamentar sobre o caso Banco Master — distinta da CPI do Crime Organizado —,
  tendo pedido ao STF autorização para a apresentação de Daniel Vorcaro perante a comissão (inicialmente
  para 24/02/2026, depois estendida para 10/03/2026) e questionado publicamente o presidente do Banco
  Central, Gabriel Galípolo, em 19/05/2026.
why_in_novelo: É uma frente institucional de apuração sobre o caso Master até aqui não mapeada no acervo,
  paralela à CPI do Crime Organizado.
