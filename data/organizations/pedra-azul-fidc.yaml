org_type: fund
summary: Fundo mencionado pela CPI do Crime Organizado (Requerimento 310/2026) como tendo operado, sob a denominação
  anterior 'Reag Legal Claims', em uma segunda operação de cessão de direitos creditórios com o escritório Ibaneis
  Advocacia e Consultoria — sem que a CPI detalhe valor ou data dessa operação no documento consultado. A defesa
  de Ibaneis Rocha não contesta diretamente a existência da operação, apenas a caracteriza como prática de mercado
  lícita e sem relação com o caso Master.
why_in_novelo: É o fundo, ligado ao grupo Reag (já implicado em irregularidades com o Banco Master sob outra denominação),
  citado pela CPI como a contraparte de uma segunda cessão de créditos do escritório de Ibaneis Rocha — o mesmo
  fundo que um open_question anterior do verbete dele já citava, sem fonte primária, como tendo comprado R$ 38 milhões
  em honorários.
