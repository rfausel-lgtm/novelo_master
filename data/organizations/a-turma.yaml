open_questions:
- Não há denúncia oferecida nem decisão de mérito que reconheça a existência do grupo — o que há são imputações
  da autoridade policial acolhidas em cognição sumária para fins cautelares, e a negativa expressa da defesa de
  Daniel Vorcaro.
- 'A composição completa do núcleo não está fechada: a própria representação registra que haveria outros integrantes
  ainda não identificados.'
