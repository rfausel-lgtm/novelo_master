summary: Empresa da família Grangeon Trancoso Neves aberta em 1993. Segundo a Folha, reproduzida pela CNN, vendeu
  a Jaques Wagner em 2000, por R$ 28 mil, o terreno de Camaçari; a escritura de 2026 registra a Fazenda Terere da
  Traneves como confrontante. Alex Grangeon Trancoso Neves, seu sócio-administrador, administra a Lagoons, compradora
  do mesmo terreno em 2026.
