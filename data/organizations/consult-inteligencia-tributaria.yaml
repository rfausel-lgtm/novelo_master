name: Consult Inteligência Tributária
aliases:
- Consulte Inteligência Tributária
org_type: company
summary: Consultoria aberta em 2022 por Francisco Craveiro de Carvalho Junior, com endereços em Barueri
  (SP), Brasília e Teresina, segundo a imprensa. Relatório do Coaf noticiado pelo Estadão aponta R$ 6,6
  milhões recebidos do Banco Master (14 operações, out/2024–jul/2025) e R$ 11,3 milhões da JBS, contra
  faturamento declarado de R$ 25,5 mil, e 11 transferências (R$ 281,6 mil) ao escritório de Kevin de Carvalho
  Marques. A empresa diz ter prestado auditoria e consultoria tributária e serviços de sistemas.
why_in_novelo: Recebeu pagamentos do Banco Master e repassou valores ao escritório do filho de um ministro
  do STF, segundo relatório do Coaf noticiado pela imprensa.
cited_position:
- kind: clarification
  summary: Afirmou ter prestado 'serviços de auditoria e consultoria tributária, bem como de desenvolvimento
    e implantação de sistemas' aos grupos, e que contratou o advogado para 'prestação de serviços técnicos
    e de assessoria jurídica' entre 2024 e 2025, com pagamentos mensais de cerca de R$ 25 mil.
