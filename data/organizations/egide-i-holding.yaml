summary: Holding registrada nas Ilhas Virgens Britânicas, segundo investigadores em março de 2025 pelo
  empresário Alberto Leite. Recebeu cerca de R$ 34 milhões do Fundo Arleen em dezembro de 2025, antes da
  liquidação deste, e é a offshore citada pela Polícia Federal na apuração sobre Dias Toffoli e Daniel
  Vorcaro. Controla integralmente a Lino Properties, empresa de Delaware que comprou um apartamento de US$
  3,648 milhões em Miami.
why_in_novelo: É a offshore que a PF cita como possível instrumento de ocultação de recursos ligados ao Fundo
  Arleen na hipótese de que Dias Toffoli seja beneficiário final; controla a empresa que comprou o imóvel de
  luxo em Miami noticiado pelo Estadão.
