open_questions:
- Não foi localizada a ata/voto nominal da Diretoria Colegiada do BC que aprovou a venda em 24/07/2025,
  nem explicação oficial do órgão sobre a aparente contradição com os indícios de fraude já identificados.
- Os R$ 160 milhões (aportes formais de capital) e os R$ 600 milhões (gasto total de patrimônio pessoal,
  segundo o O Tempo) atribuídos a Augusto Lima no esforço de salvar o Voiter/Pleno não foram reconciliados
  por nenhuma fonte disponível.
