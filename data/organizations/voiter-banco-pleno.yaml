id: voiter-banco-pleno
kind: organization
name: Voiter / Banco Pleno
aliases: []
org_type: financial_institution
summary: Banco incorporado ao conglomerado Master no início de 2024, vendido em 24/07/2025 (efeitos a
  partir de 11/08/2025, pela Diretoria Colegiada do Banco Central) a Augusto Ferreira Lima — ex-sócio
  de Vorcaro no Master até maio de 2024 —, passando a se chamar Banco Pleno. Segundo o Poder360, o BC
  aprovou essa transferência de controle meses depois de técnicos da própria autarquia identificarem,
  no 1º semestre de 2025, cessão de créditos inexistentes do Master ao BRB, comunicada ao MPF em julho
  de 2025 — sem que o BC ou o Banco Pleno tenham respondido aos questionamentos da reportagem sobre a
  aparente contradição. Registros oficiais do BC, obtidos e reportados de forma independente por três
  veículos, mostram Augusto Lima em pelo menos 7 a 8 reuniões com a cúpula do órgão ao longo de 2025 (Galípolo,
  o diretor de fiscalização Ailton de Aquino, Renato Gomes e o procurador-geral Cristiano Cozer), incluindo
  datas próximas à aprovação e à efetivação da compra — sem que isso prove relação causal. Deixou o conglomerado
  Master antes da liquidação de novembro de 2025. O Banco Central decretou sua própria liquidação extrajudicial
  em 18/02/2026, por deterioração da percepção de risco e dificuldades de liquidez, descrito como instituição
  pequena — 0,04% dos ativos e 0,05% da captação do Sistema Financeiro Nacional. Segundo o O Tempo, Lima
  teria gasto cerca de R$ 600 milhões de patrimônio pessoal tentando cobrir o passivo de ~R$ 6 bilhões
  em CDBs herdados antes da liquidação — valor não reconciliado com os R$ 160 milhões em aportes formais
  de capital já registrados a partir de outra fonte. O banco nega ser alvo da Operação Compliance Zero
  e nega participação nos fatos investigados.
why_in_novelo: É o braço que saiu do grupo antes da crise, mas caiu por conta própria meses depois — sem
  relação formal declarada com o esquema do Master.
