name: Voiter / Banco Pleno
aliases: []
org_type: financial_institution
summary: Banco incorporado ao conglomerado Master no início de 2024, vendido em julho de 2025 a Augusto
  Ferreira Lima — ex-sócio de Vorcaro no Master até maio de 2024 —, passando a se chamar Banco Pleno.
  Deixou o conglomerado Master antes da liquidação de novembro de 2025. O Banco Central decretou sua própria
  liquidação extrajudicial em 18/02/2026, por deterioração da percepção de risco e dificuldades de liquidez,
  descrito como instituição pequena — 0,04% dos ativos e 0,05% da captação do Sistema Financeiro Nacional.
  O banco nega ser alvo da Operação Compliance Zero e nega participação nos fatos investigados.
why_in_novelo: É o braço que saiu do grupo antes da crise, mas caiu por conta própria meses depois — sem
  relação formal declarada com o esquema do Master.
