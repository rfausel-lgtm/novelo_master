summary: 'Comissão Parlamentar Mista de Inquérito do Congresso Nacional que investiga fraudes no INSS.
  Decretou quebras de sigilo de Daniel Vorcaro; em 20/02/2026 o STF determinou a devolução à comissão
  dos dados obtidos por essas quebras. Encerrou os trabalhos em 28/03/2026 sem relatório final aprovado:
  o texto do relator, de 4.340 páginas, foi rejeitado por 19 votos a 12, e o presidente anunciou o envio
  de cópias ao MPF e ao STF.'
why_in_novelo: Decretou quebras de sigilo de Daniel Vorcaro cujos dados foram objeto de decisões do STF.
