summary: 'Comissão Parlamentar Mista de Inquérito do Congresso Nacional que investiga fraudes no INSS.
  Convocou Daniel Vorcaro como testemunha para 26/02/2026 e pediu ao então relator, Dias Toffoli, que
  declarasse o comparecimento compulsório. Decretou quebras de sigilo de Daniel Vorcaro e da Moriah Asset em
  04/12/2025; em 12/12/2025 Dias Toffoli manteve as quebras, mas mandou os dados ficarem acautelados na Presidência
  do Senado; em 20/02/2026 o STF determinou a devolução à comissão
  dos dados obtidos por essas quebras. Encerrou os trabalhos em 28/03/2026 sem relatório final aprovado:
  o texto do relator, de 4.340 páginas, foi rejeitado por 19 votos a 12, e o presidente anunciou o envio
  de cópias ao MPF e ao STF. Após o encerramento, o texto rejeitado do relator (216 indiciamentos propostos)
  foi entregue pelo presidente Carlos Viana aos ministros do STF Luiz Fux e André Mendonça em 16/04/2026,
  para anexação ao inquérito já em curso na Corte; separadamente, um relatório paralelo da base governista,
  nunca votado, foi entregue a PF, CGU e PGR em 07/04/2026. Em julho de 2026, a PF concluiu que um vazamento
  de dados sigilosos de Vorcaro teve origem no próprio material disponibilizado à comissão.'
why_in_novelo: Decretou quebras de sigilo de Daniel Vorcaro cujos dados foram objeto de decisões do STF.
