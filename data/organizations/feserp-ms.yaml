id: feserp-ms
kind: organization
name: Feserp-MS — Federação Sindical dos Servidores Públicos Estaduais e Municipais de MS
aliases: []
org_type: association
summary: Federação que reúne os sindicatos de servidores estaduais e municipais de Mato Grosso do Sul
  e que levou o caso CredCesta à via coletiva. Ajuizou em 03/03/2026 ação civil pública contra o Estado
  e o município de Campo Grande pedindo a suspensão imediata dos descontos e dos repasses ao Banco Master
  e empresas do mesmo conglomerado, auditoria dos contratos consignados nas duas folhas e comunicação
  aos servidores de que a medida não significaria perdão de dívida. A ação foi extinta sem exame do mérito
  por ilegitimidade ativa, e a apelação seguia sem julgamento em setembro de 2026. Antes disso, em dezembro
  de 2025, a entidade já havia protocolado pedido de auditoria na prefeitura, sem resposta.
why_in_novelo: Foi a única tentativa de tratar coletivamente o endividamento dos servidores sul-mato-grossenses
  com o produto do Banco Master, e sua derrota processual — por questão de legitimidade, não de mérito
  — explica por que o litígio migrou integralmente para ações individuais, cuja curva no tribunal estadual
  quadruplicou entre 2023 e 2025.
cited_position:
