summary: Autoridade monetária e supervisora do Sistema Financeiro Nacional. Decretou a liquidação extrajudicial
  de instituições do Conglomerado Master em novembro de 2025. Em 13/10/2026, a 2ª Câmara do TCU sobrestou o
  julgamento das contas de 2025 do Banco Central até o trânsito em julgado da deliberação no TC 022.950/2025-7
  (Acórdão 5163/2026, classe D), representação sobre a atuação do BC na supervisão e na resolução do Master,
  segundo cópia de despacho do TCU hospedada pelo Poder360; a unidade técnica propunha julgá-las regulares, e o acórdão não aponta irregularidade de ninguém. Em 20/10/2026, a 2ª Câmara levantou o sobrestamento, julgou regulares as contas de 2025, com quitação plena aos nove responsáveis, e as arquivou (Acórdão 5184/2026, classe D); o acórdão não cita o TC 022.950/2025-7 nem o TC 008.216/2025-8, e o acórdão não é conclusão sobre a supervisão do Master. Segundo o SBT
  News, o presidente do BC, Gabriel Galípolo, foi ouvido pela PF como testemunha em 06/10/2026 (classe A, fonte
  única; conteúdo não divulgado).
why_in_novelo: Decretou a liquidação extrajudicial do Banco Master e de outras instituições do conglomerado,
  conforme ata oficial do Comef.
