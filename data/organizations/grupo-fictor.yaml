open_questions:
- Reportagem de fonte única atribui a Fábio Luís Lula da Silva prestação de consultoria ao grupo em 2024,
  com base em dois executivos anônimos — alegação negada pela defesa e pela Secretaria de Relações Institucionais,
  e anterior e alheia à oferta do grupo pelo Banco Master, de novembro de 2025. Nenhum nome da família
  presidencial consta do quadro societário das empresas do grupo na base da Receita.
