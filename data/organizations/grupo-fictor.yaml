name: Grupo Fictor
aliases: []
org_type: company
summary: Holding com atuação em infraestrutura, alimentos e setor financeiro. Em 17/11/2025 anunciou a
  compra do Banco Master com consórcio de investidores dos Emirados Árabes, sujeita a BC e Cade; no dia
  seguinte o BC liquidou o banco. Em 01/02/2026 protocolou no TJSP pedido de recuperação judicial da Fictor Holding
  e da Fictor Invest (dívidas de cerca de R$ 4 bilhões, segundo o grupo); em decisão reportada em 03/02, o juiz da
  3ª Vara de Falências e Recuperações Judiciais antecipou por 30 dias efeitos do stay period, sem deferir o processamento.
why_in_novelo: Anunciou a compra do Banco Master na véspera da liquidação decretada pelo Banco Central e pediu recuperação judicial em 01/02/2026.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus sobre a oferta de compra do Master.
- date: '2026-02-01'
  kind: version
  summary: Em comunicado sobre o pedido de recuperação judicial, o grupo atribuiu a crise de liquidez à reputação atingida
    por especulações do mercado após a liquidação do Master e disse que as subsidiárias não estão no pedido; o Novelo
    registra essa explicação como versão da empresa.
