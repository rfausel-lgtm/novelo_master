org_type: company
summary: Instituição de pagamento credenciada para operar cartão de benefício consignado nas folhas do
  Rio Grande do Norte, desde dezembro de 2022, e da Paraíba, onde o convênio com a previdência estadual
  foi assinado em 14/08/2025. CNPJ 39.330.901/0001-87.
why_in_novelo: Aparece no acervo como demonstração de que a margem exclusiva para cartão de benefício,
  criada estado a estado entre 2021 e 2025, não beneficiou apenas a operadora do CredCesta. Na Paraíba,
  é a credenciada do produto sob o decreto de janeiro de 2025 que obriga o consignado a reservar toda
  a sua margem disponível a uma única consignatária e isenta de custas operacionais as instituições de
  pagamento credenciadas para a rubrica. No Rio Grande do Norte foi credenciada meses depois da PKL One,
  sob o mesmo regulamento estadual.
