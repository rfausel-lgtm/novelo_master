name: São Roque Previdência (São Roque Prev)
aliases: []
org_type: public_body
summary: Instituto de previdência municipal de São Roque (SP). Aplicou R$ 93,15 milhões (cerca de 18,8%
  do patrimônio líquido) em letras financeiras do Banco Master, mais R$ 20 milhões no fundo imobiliário
  Neteagle (EAGL11), ligado ao mesmo grupo — rombo total de R$ 113 milhões apurado por CPI municipal aberta
  em abril de 2026. O ex-diretor-presidente Vanderlei Massarioli nega contato direto com o Master, atribuindo
  a operação à consultoria contratada pelo instituto — a Crédito & Mercado, que além de emitir pareceres de
  investimento também implementava no instituto o programa Pró-Gestão RPPS, acúmulo de papéis que o relatório
  final da CPI aponta como potencial conflito de interesse. Segundo o Estadão e o g1, em decisão publicada em
  19/10/2026, o TCE-SP julgou irregulares as contas de 2024 do instituto e imputou ao ex-diretor-presidente o
  ressarcimento de R$ 93,15 milhões aplicados em letras do Master; cabe recurso, a decisão não é definitiva e a
  defesa diz que vai recorrer. O Estadão calcula as aplicações em cerca de 18,2% da carteira ao fim de 2024,
  base diferente da usada pela CPI. Em 27/10/2026, segundo nota da PF, a Operação Entressafras cumpriu nove
  mandados de busca sobre a gestão de recursos do instituto entre 2022 e 2024; a nota não cita banco nem
  investigados, e o nexo com o Master é noticiado pela CNN e pelo Metrópoles.
why_in_novelo: É outro dos regimes próprios de previdência expostos ao Master não antes mapeado no corpus,
  com CPI municipal própria apurando o caso.
