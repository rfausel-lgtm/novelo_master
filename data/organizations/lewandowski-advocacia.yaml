org_type: law_firm
summary: Escritório fundado em 19/05/2023, CNPJ 50.750.253/0001-50. O quadro societário registrado na
  Receita Federal, consultado pela equipe em 05/09/2026, lista Enrique Ricardo Lewandowski — nome civil
  completo do ex-ministro do STF e ex-ministro da Justiça, conforme já registrado no corpus — como sócio-administrador,
  ao lado de Enrique de Abreu Lewandowski e Yara de Abreu Lewandowski, filho e esposa, como sócios com
  capital. Prestou serviços de consultoria jurídica ao Banco Master por cerca de R$ 250 mil mensais, entre
  2023 e setembro de 2025, somando R$ 6,1 milhões.
why_in_novelo: É o escritório do próprio ex-ministro Ricardo Lewandowski, cujo registro cadastral, na
  data desta consulta, ainda o lista como sócio-administrador — dado que precisa ser cotejado com sua
  própria declaração de afastamento em janeiro de 2024.
cited_position:
- kind: clarification
  summary: Confirmou a prestação de serviços ao Banco Master e disse ter se retirado do escritório e suspendido
    o registro na OAB ao assumir o Ministério da Justiça, em janeiro de 2024.
  source_ids:
