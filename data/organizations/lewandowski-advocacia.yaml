  by_id: ricardo-lewandowski
  date: '2026-01-27'
open_questions:
- 'O registro cadastral da Receita Federal, consultado pela equipe em 05/09/2026, ainda lista Enrique
  Ricardo Lewandowski como sócio-administrador do escritório — dado que contrasta com sua declaração de
  retirada em janeiro de 2024. Atualização de quadro societário na Receita pode ficar defasada em relação
  à saída efetiva do exercício profissional, e a equipe não afirma contradição: registra a divergência
  entre a data do registro e a data da declaração como pergunta em aberto, não como fato estabelecido.'
- Não confirmado se houve, de fato, atuação em ações judiciais correspondente aos pagamentos — alegação
  de fonte única não verificada pela equipe.
