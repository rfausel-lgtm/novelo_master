jurisdiction: São Gabriel do Oeste (MS)
summary: Gestor do regime próprio de previdência de São Gabriel do Oeste (MS). Aplicou R$ 3,4 milhões — 4,20% de
  sua carteira — em Letra Financeira do Banco Master indexada ao IPCA, prazo de dez anos, taxa de 7,15% ao ano,
  com base em parecer técnico de 12/09/2025 da Crédito & Mercado Consultoria de Investimentos, aprovado por Comitê
  de Investimentos e Conselho Administrativo, dois meses antes da liquidação do banco. Após a crise, a prefeitura
  instituiu comissão para apurar o processo de escolha da instituição financeira. É um dos cinco regimes de Mato
  Grosso do Sul sob auditoria conjunta do TCE-MS.
why_in_novelo: É um dos dezoito regimes próprios que aplicaram em papel do Banco Master, e o caso em que o parecer
  técnico datado de uma consultoria — a Crédito & Mercado — contradiz a negativa pública posterior da mesma empresa
  de ter assessorado investimentos no banco.
cited_position:
- kind: clarification
  summary: A diretoria do SGOPrev afirmou que a aplicação foi embasada por parecer técnico de consultoria contratada
    e passou por Comitê de Investimentos e Conselho Administrativo.
