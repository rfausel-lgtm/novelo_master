open_questions:
- O teor exato das irregularidades que levaram ao termo de compromisso de 2021 com o Banco Central (Decisão
  158/2021-BCB/DEGEF) não está disponível nos documentos lidos até agora — só o cabeçalho/qualificação das
  partes foi localizado.
- Se a Cartos de fato originou os créditos via os três FIDCs citados, ou se essa é mais uma camada de
  simulação, não está resolvido pelos documentos lidos — o próprio Banco Central tratou a explicação como
  nova versão a apurar, não como fato estabelecido.
