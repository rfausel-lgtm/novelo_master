org_type: public_body
jurisdiction: Jateí (MS)
summary: Gestor do regime próprio de previdência dos servidores de Jateí (MS), presidido por Luciano Francisco da
  Silva. Aplicou cerca de R$ 2,5 milhões em papel do Banco Master antes da liquidação de novembro de 2025; a prefeita
  Cileide Cabral da Silva Brito acionou acompanhamento jurídico para a recuperação dos valores. É um dos cinco regimes
  próprios de Mato Grosso do Sul sob auditoria conjunta do TCE-MS, e buscou, em março de 2026, apoio institucional
  da ADIMP-MS (associação de institutos de previdência do estado) para conduzir as demandas relacionadas ao caso.
why_in_novelo: É um dos dezoito regimes próprios de previdência que aplicaram em papel do Banco Master, entre os
  cinco de Mato Grosso do Sul sob auditoria do TCE-MS.
