summary: 'Empresa estatal baiana, conhecida como Ebal, citada na representação da PF como o contexto em
  que foram criados e operacionalizados o CredCesta e a relação comercial que depois levaria Augusto Ferreira
  Lima ao Banco Master. CORREÇÃO (09/09/2026): a autorização para alienar a companhia está no art. 36
  da Lei estadual nº 13.204, sancionada por Jaques Wagner em 11/12/2014, no último mês de seu segundo
  mandato como governador; a venda, porém, ocorreu em 11/04/2018, no governo de Rui Costa, com o leilão
  conduzido pela Comissão Especial da Secretaria de Desenvolvimento Econômico, então chefiada pelo próprio
  Wagner. O registro anterior do corpus, de que a venda se dera ''durante o governo de Jaques Wagner,
  segundo a assessoria do senador'', estava incorreto e atribuía à assessoria afirmação que ela não fez
  — a nota do senador limita-se a dizer que ele ''já forneceu todos os esclarecimentos necessários''.
  Era a gestora e operadora do programa CredCesta enquanto estatal — não sócia nem conveniada. Foi privatizada
  em 11/04/2018 por R$ 15 milhões, com o programa embutido no lote e as dívidas remanescentes permanecendo
  com o Estado, que pagou R$ 93 milhões entre 2019 e 2026. Consulta da equipe à Receita Federal em 05/09/2026
  confirma situação cadastral ATIVA, sem situação especial, com diretoria estatutária atual formada por
  Gustavo Castro Lima Carlos de Souza (desde 07/05/2018) e Luia Kruschewsky Monteiro (desde 16/07/2018)
  — nem Augusto Lima nem Andréa Lima Novaes constam do quadro societário formal, consistente com o registro
  já existente de que o arremate de 2018 foi feito pela NGVSPE Empreendimentos e Participações, apontada
  pela imprensa como empresa de prateleira.'
why_in_novelo: É a estatal em cujo contexto nasceu o CredCesta, ativo que a Polícia Federal aponta como
  origem da sociedade entre Augusto Lima e Daniel Vorcaro.
