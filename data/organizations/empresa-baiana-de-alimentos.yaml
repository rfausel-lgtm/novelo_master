open_questions:
- O corpus não tem os documentos da venda da rede estatal nem o contrato do CredCesta.
- 'A companhia foi a leilão três vezes: em 27/01/2016 e em março de 2018 o lance mínimo era de R$ 81 milhões
  e não houve interessados; em 11/04/2018, com um único participante, foi arrematada por R$ 15 milhões.
  O registro da Receita mostra capital social de R$ 929.443.700,00, e o Estado pagou cerca de R$ 93 milhões
  em dívidas remanescentes entre 2019 e 2026 — cuja composição exata não foi localizada em fonte pública.'
- Os Decretos 18.353 e 18.354, ambos de 27/04/2018, foram editados dezesseis dias após o leilão e um dia
  antes da homologação, e mantiveram o Credicesta 'gerido e operado pela EBAL' quando a empresa já havia
  sido arrematada — de modo que o direito de descontar na folha do funcionalismo foi transferido dentro
  da própria companhia vendida.
- Luia Kruschewsky Monteiro era gerente jurídica da empresa enquanto estatal e permaneceu após a privatização,
  tornando-se diretora em 16/07/2018 — continuidade de pessoa entre o lado público e o privado do mesmo
  ativo. O outro diretor registrado não foi identificado em nenhuma fonte além do cadastro.
- Não foi localizado registro do Tribunal de Contas do Estado da Bahia sobre a desestatização — resultado
  negativo com limitação declarada, já que o portal do tribunal bloqueia acesso automatizado.
