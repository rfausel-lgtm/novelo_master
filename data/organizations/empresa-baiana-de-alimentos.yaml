org_type: public_body
summary: Empresa estatal baiana, conhecida como Ebal, citada na representação da PF como o contexto em
  que foram criados e operacionalizados o CredCesta e a relação comercial que depois levaria Augusto Ferreira
  Lima ao Banco Master. A rede de supermercados estatal foi vendida a Augusto Lima durante o governo de
  Jaques Wagner, segundo a assessoria do senador ao Poder360. Era a gestora e operadora do programa CredCesta
  enquanto estatal — não sócia nem conveniada. Foi privatizada em 11/04/2018 por R$ 15 milhões, com o
  programa embutido no lote e as dívidas remanescentes permanecendo com o Estado, que pagou R$ 93 milhões
  entre 2019 e 2026.
why_in_novelo: É a estatal em cujo contexto nasceu o CredCesta, ativo que a Polícia Federal aponta como
  origem da sociedade entre Augusto Lima e Daniel Vorcaro.
