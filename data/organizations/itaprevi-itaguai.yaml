org_type: public_body
summary: 'Autarquia gestora do regime próprio de previdência de Itaguaí (RJ). Adquiriu R$ 59,6 milhões
  em letras financeiras do Banco Master em duas operações, de R$ 29,6 milhões em 28/06/2024 e R$ 30 milhões
  em 03/07/2024 — mais de 20% de sua carteira. O Tribunal de Contas do Estado do Rio de Janeiro apontou
  quatro achados no processo: aplicações irregulares, credenciamento irregular, falha do controle interno
  e falta de transparência, concluindo que o termo de credenciamento foi integralmente preenchido pelo
  próprio banco e analisado em menos de dois dias úteis.'
why_in_novelo: Regime próprio cujo processo de credenciamento do Banco Master foi examinado documento
  a documento por tribunal de contas, produzindo a constatação de que o parecer que aprovou o banco foi
  escrito pelo banco.
cited_position:
