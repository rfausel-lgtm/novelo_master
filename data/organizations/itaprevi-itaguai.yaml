open_questions:
- Os responsáveis notificados pelo tribunal têm prazo para defesa; o corpus não registra as manifestações
  apresentadas.
- O termo de credenciamento de Itaguaí não está publicado no portal da autarquia; existe apenas como anexo
  do processo examinado pelo tribunal.
