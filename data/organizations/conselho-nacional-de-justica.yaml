  - src-cnj-2026-09-28-corregedoria-amplia-medida-sobre-precatorios-do-trf-1-e-determina-devolucao-de-r-1-8-bilhao
open_questions:
- Referendo das decisões de 22 e 28/09/2026 pelo Plenário do CNJ; o PP 0007917-89.2026.2.00.0000 não consta da pauta da 15ª Sessão Virtual (08 a 16/10/2026).
- Decisão que instaurou a sindicância contra Newton Ramos (assinada em 22/09/2026, segundo o Metrópoles), número da sindicância e da reclamação disciplinar não localizados.
- Cumprimento das determinações pelo TRF-1 (cancelamento, restituição e informações sobre o levantamento de R$ 16.129.427,04 de 31/07/2026) não verificado.
