id: conselho-nacional-de-justica
kind: organization
name: Conselho Nacional de Justiça
aliases:
- CNJ
org_type: public_body
jurisdiction: Brasil
summary: >-
  Órgão de controle administrativo e financeiro do Poder Judiciário. Por sua Corregedoria Nacional, chefiada
  pelo ministro Benedito Gonçalves, decidiu no Pedido de Providências 0007917-89.2026.2.00.0000 (requerente
  AGU, requerido TRF-1), em 22/09/2026, suspender decisões da Presidência do TRF-1 e determinar o cancelamento
  de 16 precatórios (R$ 4.738.065.026,73) e, em 28/09/2026, estender a medida a 14 requisições
  (R$ 1.877.143.674,66 nas datas-base), com fundamento em acórdão do Plenário do CNJ no PP
  0003764-47.2025.2.00.0000; as duas decisões aguardam referendo do Plenário, não pautado na sessão virtual de
  08 a 16/10/2026. As decisões e as notícias oficiais do CNJ não mencionam o Banco Master nem Daniel Vorcaro; a
  ligação ao Master é feita pela imprensa. Em 24/09/2026, segundo a Agência Brasil, o Times Brasil e A Crítica,
  realizou correição extraordinária no gabinete do desembargador federal Newton Ramos, no TRF-1, com apoio da
  Polícia Federal; não há notícia oficial do CNJ sobre a diligência.
why_in_novelo: Órgão cuja Corregedoria Nacional determinou, no PP 0007917-89.2026.2.00.0000, o cancelamento de 30 precatórios e requisições do TRF-1 e realizou, segundo a imprensa, correição extraordinária no gabinete de um desembargador federal.
cited_position:
