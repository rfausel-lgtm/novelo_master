  by_id: conselho-nacional-de-justica
  date: '2026-09-24'
  summary: >-
    Segundo o Metrópoles (24/09/2026), em paráfrase do veículo, o CNJ afirma que ainda não foi comprovada
    eventual relação entre o crédito analisado por Newton Ramos e o Banco Master, nem a participação do
    escritório da mulher do desembargador no processo, circunstâncias que serão verificadas na sindicância.
  source_ids:
