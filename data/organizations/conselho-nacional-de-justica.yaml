  date: '2026-10-16'
  summary: >-
    Órgão decisor. As notícias oficiais de 23 e 28/09/2026 não mencionam o Banco Master; não foi localizada
    manifestação oficial do CNJ sobre a correição no gabinete de Newton Ramos nem sobre a relação entre os
    precatórios e o Master (busca no portal do CNJ em 16/10/2026).
  source_ids:
