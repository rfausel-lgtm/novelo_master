name: Kovr Seguradora
aliases: []
org_type: company
summary: Seguradora comprada pelo Banco Master em 2021 e controlada, até 2025, pela Kovr Participações,
  tendo o Master como controlador final. Foi segregada do conglomerado em 2025, antes das tratativas de
  venda do Master ao BRB, e vendida a executivos em operação apresentada como management buyout, sendo
  depois revendida ao PicPay por R$ 657,6 milhões. O Cade apontou indícios de 'gun jumping' e triangulação
  financeira nessa revenda — o valor de crédito concedido por dois bancos coincidia exatamente com o que
  os compradores intermediários precisavam pagar no fechamento — mas arquivou o processo em 28/05/2026
  por não atingir o faturamento mínimo de sua competência, sem ter ainda encaminhado os indícios de crime
  ao Banco Central e ao Ministério Público Federal.
why_in_novelo: É o único braço do grupo que saiu limpo antes da crise pública — mas sua revenda ao PicPay
  carrega suspeita própria de estrutura artificial, apontada pelo órgão antitruste.
