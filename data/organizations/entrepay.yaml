summary: Instituição de pagamento sediada em São Paulo, existente desde abril de 2013, com capital social de R$
  581,4 milhões e atividade principal de administração de cartões de crédito. É a líder do conglomerado liquidado
  pelo Banco Central em 27/03/2026, junto com a Acqio Adquirência e a Octa Sociedade de Crédito Direto, por comprometimento
  da situação econômico-financeira, infringência às normas e prejuízos que sujeitam credores a risco anormal. Antonio
  Carlos Freixo Júnior, o 'Mineiro', consta como diretor desde 18/02/2022 — e é, cinco meses depois da liquidação,
  o autor da segunda delação do caso Master. Segundo o próprio colaborador, técnicos do Banco Central identificaram
  na Entrepay fluxo atípico em que recursos deixavam o Brasil, passavam pelas Bahamas e seguiam para o Texas, onde
  está o fundo que financiou 'Dark Horse'. Em comunicação oficial ao STF no INQ 5.026 (e-Doc. 869, relatada
  em decisão de 06/07/2026), o próprio Banco Central detalhou quatro irregularidades do conglomerado —
  negociação de valores mobiliários sem lastro suficiente, indução do BCB a erro, uso de artifícios
  contábeis e desvio de recursos — e afirmou textualmente que os fatos 'guardam conexão com os ilícitos
  que estão sendo investigados no âmbito da Operação Compliance Zero'.
why_in_novelo: É a instituição de pagamento do delator do caso do filme, liquidada pelo Banco Central em março de
  2026, e o ponto em que o regulador identificou, segundo o próprio delator, o fluxo atípico de recursos para o
  exterior.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação da instituição ou de seu liquidante foi localizada pelo corpus.
open_questions:
- O Ato do Presidente nº 1.381, de 27/03/2026, não foi lido pela equipe; o que se registra vem da cobertura da agência
  pública e da averbação na Receita Federal.
- Não está esclarecido, nos documentos lidos, se o fluxo atípico identificado pelo Banco Central na Entrepay é o
  mesmo que abasteceu as sete transferências ao fundo americano, que segundo a cobertura partiram da Entre Investimentos
  e Participações — duas empresas distintas do mesmo grupo.
- A relação entre a indisponibilidade de bens decorrente da liquidação, em março, e o compromisso de pagar cerca
  de R$ 2 bilhões assumido na delação, em agosto, não foi examinada em nenhum documento lido pela equipe.
