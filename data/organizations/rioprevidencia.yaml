summary: 'Autarquia responsável pela gestão e pagamento das aposentadorias e pensões dos servidores do Estado do
  Rio de Janeiro. Segundo comunicação oficial do STF, a PF investiga aportes de cerca de R$ 3,7 bilhões da autarquia
  em fundos e letras financeiras do Banco Master. Em 10/09/2026, o UOL revelou proposta de colaboração de Vorcaro
  atribuindo a ACM Neto e a Antônio Rueda a intermediação política do acesso do Master à autarquia, mediante comissão
  de 10%; a proposta cita R$ 2,97 bilhões investidos pelo Rioprevidência entre 2023 e 2025, o maior entre os quatro
  entes citados. RECONCILIAÇÃO (10/09/2026): os R$ 970 milhões são o núcleo original em letras financeiras (nov/2023-jul/2024,
  Operação Barco de Papel, 23/01/2026); a partir de dez/2024, mesmo após dois alertas do TCE-RJ, abriu-se segunda
  frente em cotas de fundos do próprio Master (Arena, Revolution, Texas), que o TCE somava a R$ 2,6 bi em 25/11/2025
  e a PF, reapurando o mesmo conjunto, a R$ 2,01 bi em 26/05/2026 — juntos, ''cerca de R$ 3 bi''. Os R$ 3,7 bi da
  PGR, mesma data, seguem sem explicação encontrada. Os R$ 6,5 bi de outra auditoria do TCE NÃO são exposição ao
  Master: cobrem também Genial (mera custódia), Mirae Asset e Digimais. Decisão judicial de dez/2025 já retém os
  R$ 970 mi via desconto de consignados, com liquidação prevista em ~2 anos.'
why_in_novelo: Seus aportes em produtos do Banco Master são objeto da 8ª fase da Operação Compliance Zero, segundo
  comunicação oficial do STF.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- Em 17/07/2026, a PGE-RJ moveu ação cobrando cerca de R$ 640 milhões do grupo Master, apontando que a Trustee (gestora
  ligada ao Master, liquidada em 03/09/2026) comprou maciçamente papéis dos fundos Revolution e Texas I FIA entre
  jul-ago/2024, inflando artificialmente seus preços — alegação sob apuração judicial, não julgada.
- A cautelar do Rioprevidência migrou para a Justiça Federal, por pedido de intervenção do Banco Central, e depois
  ao Supremo; o corpus não apurou sob qual número os autos originários tramitam na corte.
- As atas do Comitê de Investimentos entre outubro de 2023 e dezembro de 2023, lidas integralmente pela equipe,
  não nomeiam o Banco Master em nenhum momento — apenas liberam teto regulatório genérico. As atas de janeiro a
  agosto de 2024 não foram lidas.
- Não foi localizado o número do processo em que a cautelar do Rioprevidência tramitou no STF antes da redistribuição
  por Toffoli à primeira instância.
- Há divergência entre fontes jornalísticas sobre se a CPI da Alerj, aprovada em 12/05/2026, chegou a ser efetivamente
  instalada.
- O número do processo da ação da Procuradoria-Geral do Estado do Rio de Janeiro, de 17/07/2026, não foi localizado;
  tramita sob sigilo.
- A proposta de colaboração não esclarece se a comissão de 10% incidiu sobre o total investido pelo Rioprevidência
  ou sobre parcela dele, nem distingue a atuação específica de ACM Neto e Rueda da atuação de Cláudio Castro, já
  investigada na 8ª fase da Compliance Zero.
- 'A diferença de R$ 700 milhões entre a estimativa de R$ 3 bi da PF e de R$ 3,7 bi da PGR, ambas de 26/05/2026,
  permanece sem explicação encontrada em nenhuma fonte consultada; hipótese não confirmada: juros e correção monetária,
  ou perdas projetadas, somados por uma das partes e não pela outra.'
