  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- Se o primeiro relatório semestral exigido pela Lei 11.193/2026 já foi publicado, e se ele detalha os
  fundos ligados ao Master, não apurado até esta coleta.
- 'NOVO (13/09/2026): em agosto de 2024, ao responder a perguntas do jornal Estadão sobre os aportes em
  LFs do Master, a redação da resposta da autarquia foi ditada, palavra por palavra, pelo próprio Daniel
  Vorcaro a um interlocutor interno (Fernando de Goes) — a PF conclui que isso demonstra "influência" de
  Vorcaro sobre a comunicação institucional do órgão. Não confirmado se a matéria do Estadão foi publicada
  nem seu conteúdo final.'
- 'RESOLVIDO EM PARTE (19/09/2026): a PGE-RJ ajuizou, em 16/07/2026 (não 17/07, como o acervo registrava
  — divergência de um dia entre fontes, não conferida), três ações — não uma — contra a Master
  Corretora, a Trustee DTVM e gestoras ligadas ao grupo (entre elas a Acura, votante pelo fundo
  Revolution), pedindo cautelares de R$ 616,6 milhões sobre uma perda total estimada em R$ 641,4 milhões:
  R$ 481,4 milhões no fundo Revolution e R$ 135,1 milhões no Texas I FIA. Números dos três processos
  seguem não divulgados; a imprensa registra que tramitam sob sigilo.'
- 'ATUALIZADO (lote 323): o trajeto da cautelar 3049678-51.2025.8.19.0001 está documentado no DJEN — a 2ª Vara da
  Fazenda Pública da Capital declinou da competência para a Justiça Federal em 10/03/2026 (art. 109, I, da
  Constituição; Súmula 150 do STJ) e, em embargos de 11/03, manteve a tutela por risco aos cofres públicos. Segundo
  a imprensa, o TRF2 negou recurso do Master e o processo seguiu ao STF em maio de 2026. A decisão de declínio não
  menciona o Banco Central, e o número dos autos no STF segue não localizado.'
- As atas do Comitê de Investimentos entre outubro de 2023 e dezembro de 2023, lidas integralmente pela equipe,
  não nomeiam o Banco Master em nenhum momento — apenas liberam teto regulatório genérico. As atas de janeiro a
  agosto de 2024 não foram lidas.
- Não foi localizado o número do processo em que a cautelar do Rioprevidência tramitou no STF antes da redistribuição
  por Toffoli à primeira instância.
- 'RESOLVIDO EM PARTE (19/09/2026): o requerimento de CPI (Rioprevidência e Cedae), do deputado Flávio
  Serafini — PSOL, protocolado em 06/05/2026 com as 24 assinaturas necessárias, foi travado pela
  presidência da Alerj (Douglas Ruas, PL), que o enviou à Procuradoria da Casa sob alegação de que um
  pedido de retirada de assinatura alterava requisito de admissibilidade. Serafini acionou o TJ-RJ em
  18/05/2026 pedindo liminar; o desembargador Cherubin Helcias Schwartz Junior negou-a em 26/05/2026 —
  reconheceu que os requisitos estavam cumpridos, mas preferiu ouvir a Alerj antes, questionando quantas
  CPIs já funcionavam (limite regimental de sete simultâneas). No mesmo dia, a Alerj anunciou a criação de
  quatro novas CPIs — não confirmado, em fonte lida, se a do Rioprevidência/Master está entre elas nem se
  chegou a funcionar.'
- A proposta de colaboração não esclarece se a comissão de 10% incidiu sobre o total investido pelo Rioprevidência
  ou sobre parcela dele, nem distingue a atuação específica de ACM Neto e Rueda da atuação de Cláudio Castro, já
  investigada na 8ª fase da Compliance Zero.
- 'A diferença de R$ 700 milhões entre a estimativa de R$ 3 bi da PF e de R$ 3,7 bi da PGR, ambas de 26/05/2026,
  permanece sem explicação encontrada em nenhuma fonte consultada; hipótese não confirmada: juros e correção monetária,
  ou perdas projetadas, somados por uma das partes e não pela outra.'
