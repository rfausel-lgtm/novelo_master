summary: 'Autarquia responsável pela gestão e pagamento das aposentadorias e pensões dos servidores do Estado do
  Rio de Janeiro. Segundo comunicação oficial do STF, a PF investiga aportes de cerca de R$ 3,7 bilhões da autarquia
  em fundos e letras financeiras do Banco Master. Em 10/09/2026, o UOL revelou proposta de colaboração de Vorcaro
  atribuindo a ACM Neto e a Antônio Rueda a intermediação política do acesso do Master à autarquia, mediante comissão
  de 10%; a proposta cita R$ 2,97 bilhões investidos pelo Rioprevidência entre 2023 e 2025, o maior entre os quatro
  entes citados. RECONCILIAÇÃO (10/09/2026): os R$ 970 milhões são o núcleo original em letras financeiras (nov/2023-jul/2024,
  Operação Barco de Papel, 23/01/2026); a partir de dez/2024, mesmo após dois alertas do TCE-RJ, abriu-se segunda
  frente em cotas de fundos do próprio Master (Arena, Revolution, Texas), que o TCE somava a R$ 2,6 bi em 25/11/2025
  e a PF, reapurando o mesmo conjunto, a R$ 2,01 bi em 26/05/2026 — juntos, ''cerca de R$ 3 bi''. Os R$ 3,7 bi da
  PGR, mesma data, seguem sem explicação encontrada. Os R$ 6,5 bi de outra auditoria do TCE NÃO são exposição ao
  Master: cobrem também Genial (mera custódia), Mirae Asset e Digimais. Decisão judicial de dez/2025 já retém os
  R$ 970 mi via desconto de consignados, com liquidação prevista em ~2 anos. NOVO (19/09/2026): em
  21/05/2026, foi sancionada a Lei estadual 11.193/2026 (Luiz Paulo — PSD, e Guilherme Delaroli — PL),
  exigindo que a autarquia publique relatórios semestrais detalhando suas aplicações — instituições,
  fundos por CNPJ, valores, taxas e custos de gestão.'
why_in_novelo: Seus aportes em produtos do Banco Master são objeto da 8ª fase da Operação Compliance Zero, segundo
  comunicação oficial do STF.
cited_position:
