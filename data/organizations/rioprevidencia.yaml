summary: Autarquia responsável pela gestão e pagamento das aposentadorias e pensões dos servidores do
  Estado do Rio de Janeiro. Segundo comunicação oficial do STF, a PF investiga aportes de cerca de R$
  3,7 bilhões da autarquia em fundos e letras financeiras do Banco Master.
why_in_novelo: Seus aportes em produtos do Banco Master são objeto da 8ª fase da Operação Compliance Zero,
  segundo comunicação oficial do STF.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- Em 17/07/2026, a PGE-RJ moveu ação cobrando cerca de R$ 640 milhões do grupo Master, apontando que a
  Trustee (gestora ligada ao Master, liquidada em 03/09/2026) comprou maciçamente papéis dos fundos Revolution
  e Texas I FIA entre jul-ago/2024, inflando artificialmente seus preços — alegação sob apuração judicial,
  não julgada.
- A cautelar do Rioprevidência migrou para a Justiça Federal, por pedido de intervenção do Banco Central,
  e depois ao Supremo; o corpus não apurou sob qual número os autos originários tramitam na corte.
