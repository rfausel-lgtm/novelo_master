org_type: financial_institution
summary: Distribuidora de títulos e valores mobiliários (DTVM), controlada por Maurício Quadrado, ex-diretor
  de investimentos do Banco Master. Era a principal administradora dos fundos da Master Asset Management
  e atuava como agente fiduciário em emissões de debêntures estruturadas do grupo — entre elas R$ 470,5
  milhões em debêntures da Banvox Holding Financeira, com fiança solidária de Daniel Vorcaro. Foi liquidada
  extrajudicialmente pelo Banco Central em 03/09/2026, por 'graves violações às normas legais que disciplinam
  as atividades das instituições financeiras' — motivação técnica detalhada não localizada em fonte pública
  até a data desta atualização. Em nota, negou irregularidades e destacou que nenhum de seus executivos
  consta na denúncia do Ministério Público na Operação Carbono Oculto, anunciada no mesmo dia. A Procuradoria-Geral
  do Estado do Rio de Janeiro a aponta como tendo comprado papéis maciçamente para inflar artificialmente
  preços de fundos que causaram prejuízo de R$ 640 milhões ao RioPrevidência. A Trustee também aparece,
  como CUSTODIANTE (não gestora), na fase 'Fluxo Oculto' (28/05/2026) da Operação Carbono Oculto, que
  bloqueou recursos do Zeus FIDC e do Gran Capital FIDC-NP — a empresa negou publicamente ter sido alvo
  dessa fase ou ter recebido intimação relacionada, afirmando prestar apenas serviço de custódia, sem
  seleção de ativos. A liquidante nomeada para a Trustee, Marilena Simões Valentim, é distinta do liquidante
  do núcleo Master/Will Bank/Letsbank — não há liquidante único para o ecossistema.
why_in_novelo: Uma das duas gestoras ligadas ao ecossistema do Banco Master liquidadas pelo Banco Central
  em 03/09/2026, com papel documentado na estrutura de debêntures e fundos do grupo.
cited_position:
- kind: denial
  summary: Em nota conjunta com a Banvox, negou irregularidades e violações às normas do mercado de capitais,
    afirmando nunca ter sido notificada pelo BC sobre problema de enquadramento.
  source_ids:
  - src-bpmoney-2026-trustee-banvox-negam-irregularidades
  date: 2026-09
open_questions:
- O ato normativo do Banco Central com a motivação técnica detalhada da liquidação não foi localizado
  em fonte pública até a data desta atualização.
- A Trustee era custodiante comum dos fundos Zeus FIDC e Gran Capital FIDC-NP, ambos atingidos por bloqueios
  judiciais da Operação Carbono Oculto (investigação sobre PCC, distinta do caso Master) — mostrando que
  a mesma gestora prestava serviço a fundos hoje sob suspeita nas duas investigações, sem que isso implique
  identidade entre os esquemas.
