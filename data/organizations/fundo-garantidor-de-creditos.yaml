open_questions:
- Não se conhece o instrumento nem as condições do aporte de R$ 15,447 milhões atribuído ao FGC em dezembro
  de 2017, nem como ele se relaciona com o empréstimo emergencial de R$ 20 milhões a R$ 30 milhões noticiado
  para 2019. O FGC declaradamente não divulga detalhes desse tipo de operação; fechar a lacuna exigiria
  a íntegra sem tarjas dos votos BCB 20/2019 e 218/2019 ou pedido de acesso ao próprio fundo.
- O rombo potencial para o FGC caso o Banco Máxima fosse liquidado saltou de R$ 827 milhões em 2016 para
  R$ 3,224 bilhões em 2019, segundo apuração do Valor Econômico sobre os votos do BC — dado relevante
  para avaliar o custo comparativo entre autorizar a venda e deixar o banco quebrar.
- O regulamento exclui expressamente da garantia ordinária os créditos de regimes próprios de previdência
  social, exclusão em vigor desde a Resolução CMN 4.620/2017 — de modo que nenhum dos dezoito RPPS expostos
  ao Master tem cobertura.
