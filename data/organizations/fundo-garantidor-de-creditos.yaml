summary: 'Entidade privada que garante depósitos e investimentos em instituições financeiras. Na liquidação
  do grupo Master, a maior operação de ressarcimento de sua história, estimou inicialmente cerca de 1,6
  milhão de credores elegíveis e R$ 41 bilhões em garantias; em 15/07/2026 já havia desembolsado R$ 40,03
  bilhões (98,5%) a mais de 718 mil credores nos três bancos do núcleo Master, restando R$ 1,83 bilhão
  a pagar em todo o conglomerado (incluindo Pleno e Will Bank). Enfrentou milhares de reclamações por
  demora e instabilidade de sistema nos primeiros meses, mesmo pagando em ritmo recorde. O Banco Central
  concluiu, em maio de 2026, que a operação não representou risco sistêmico ao SFN. Além de garantir depósitos,
  o FGC tem, por estatuto, instrumento ordinário de assistência financeira a instituições associadas e
  a seus acionistas controladores, inclusive com o objetivo de promover transferência de controle acionário
  (Anexo I da Resolução CMN nº 4.222/2013). Foi com base nesse tipo de operação que o fundo apareceu,
  segundo a imprensa, na origem do próprio Banco Master: há registro de um empréstimo emergencial de R$
  20 milhões a R$ 30 milhões ao Banco Máxima em 2019, na operação que viabilizou a troca de controle a
  Daniel Vorcaro, e a menção, em fonte única, a um aporte de R$ 15,447 milhões em dezembro de 2017. O
  fundo sustenta que não concede crédito com finalidade de compra. Seu estatuto e seu regulamento são
  aprovados pelo Conselho Monetário Nacional: a Resolução CMN 5.279, de 22/01/2026, alterou ambos, e a
  Resolução CMN 5.295, de 23/04/2026, incluiu o Ativo de Referência entre os gatilhos da obrigação de as
  associadas manterem títulos públicos federais, a partir de 01/06/2026 (classe D, texto consolidado publicado
  pelo BC). CNN Brasil e Folhapress enquadram as resoluções no contexto do caso Master; o Novelo não afirma
  nexo causal.'
why_in_novelo: Sua cobertura foi objeto de emenda parlamentar citada pela Polícia Federal em decisão do
  STF, e o fundo arcou com garantias após a liquidação do Banco Master, segundo a imprensa.
cited_position:
- kind: clarification
  summary: Segundo o FGC, o empréstimo ao Máxima foi quitado regularmente e não se destinava a financiar
    a aquisição do banco, mas a socorrer instituição em dificuldades — 'o FGC não concede crédito com
    finalidade de compra'.
