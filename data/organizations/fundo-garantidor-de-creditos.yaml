summary: Entidade privada que garante depósitos e investimentos em instituições financeiras. Na liquidação
  do grupo Master, a maior operação de ressarcimento de sua história, estimou inicialmente cerca de 1,6
  milhão de credores elegíveis e R$ 41 bilhões em garantias; em 15/07/2026 já havia desembolsado R$ 40,03
  bilhões (98,5%) a mais de 718 mil credores nos três bancos do núcleo Master, restando R$ 1,83 bilhão
  a pagar em todo o conglomerado (incluindo Pleno e Will Bank). Enfrentou milhares de reclamações por
  demora e instabilidade de sistema nos primeiros meses, mesmo pagando em ritmo recorde. O Banco Central
  concluiu, em maio de 2026, que a operação não representou risco sistêmico ao SFN.
why_in_novelo: Sua cobertura foi objeto de emenda parlamentar citada pela Polícia Federal em decisão do
  STF, e o fundo arcou com garantias após a liquidação do Banco Master, segundo a imprensa.
