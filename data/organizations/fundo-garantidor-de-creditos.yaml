  summary: Segundo a CNN Brasil (22/01/2026), o FGC afirmou que as mudanças aprovadas pelo CMN tornam o processo
    de pagamento de garantias mais rápido, previsível e alinhado às melhores práticas internacionais, e que
    não afetam as liquidações recentes de instituições financeiras.
