summary: Entidade privada que garante depósitos e investimentos em instituições financeiras. Segundo a
  imprensa, arcou com dezenas de bilhões de reais em garantias após as liquidações do grupo Master. A
  PEC 65/2023 e a emenda citada pela PF tratavam da ampliação de sua cobertura.
why_in_novelo: Sua cobertura foi objeto de emenda parlamentar citada pela Polícia Federal em decisão do
  STF, e o fundo arcou com garantias após a liquidação do Banco Master, segundo a imprensa.
