summary: Associação privada de servidores públicos estaduais da Bahia, fundada em 30/01/2002, sede em
  Salvador (CNPJ 04.890.235/0001-57). Presidida estatutariamente por Nanci Maria Prates Pereira, mas apontada
  pela Polícia Federal como controlada de fato por Augusto Lima, ex-CEO e ex-sócio do Banco Master, que
  atua como seu procurador perante instituições financeiras. Citada pelo Master, em ofício ao Banco Central
  de 25/03/2025, como originadora dos créditos de R$ 12,2 bilhões vendidos ao BRB via Tirreno — explicação
  que não se sustentou, pois CPFs de todo o país foram usados para simular a origem dos contratos. Também
  investigada na Operação Compliance Zero por R$ 6,7 bilhões em crédito consignado incompatível com o
  valor das mensalidades associativas cobradas. Recebeu R$ 5,95 milhões do Banco Master entre 2022 e 2025,
  segundo a PF.
why_in_novelo: 'É uma das duas associações apontadas pela Polícia Federal como peça central de dois esquemas
  distintos e conexos: a fabricação de lastro para o consignado baiano e a origem fictícia dos créditos
  revendidos ao BRB pela Tirreno.'
