summary: 'Operação da Polícia Federal e da CGU, deflagrada em 23/04/2025, que investiga esquema nacional
  de descontos associativos não autorizados sobre benefícios do INSS (aposentadorias e pensões), com prejuízo
  estimado em R$ 6,3 bilhões entre 2019 e 2024 — a mesma matriz de fraude investigada pela CPMI do INSS.
  Antônio Carlos Camilo Antunes (''Careca do INSS'') é apontado como articulador via entidades associativas.
  Tem conexão investigativa real, e não apenas circunstancial, com o caso Banco Master: o banco operava,
  entre 2020 e 2025, o consignado ''M Fácil Consignado'' (rebatização do CredCesta) dentro de convênio
  do INSS, onde análise conjunta INSS/CGU identificou indícios de fraude (05/03/2026). Em 25/02/2026,
  a PF obteve autorização de André Mendonça para cruzar formalmente os dados das duas investigações. A
  gestão dessa operação pelo relator tornou-se também a origem do atrito institucional entre Mendonça
  e a cúpula da PF (Andrei Rodrigues), que resultou na nota conjunta dos 27 superintendentes regionais
  em 06/08/2026.'
why_in_novelo: Operação distinta do caso Master no núcleo, mas com sobreposição investigativa real via
  o consignado do Master no INSS — e origem direta do atrito institucional Mendonça x cúpula da PF.
