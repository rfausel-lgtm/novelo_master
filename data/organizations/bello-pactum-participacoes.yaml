summary: 'Empresa citada como parte da operação sob investigação na Pet 15.198/DF (Operação Compliance Zero):
  segundo a hipótese que fundamentou o bloqueio cautelar de bens de Maurício Quadrado, Luís Fernando de
  Almeida e Flávio Daniel Aguetoni (decisão de 19/05/2026), operações envolvendo a Bello Pactum e o FIDC
  Alvarinho teriam causado prejuízo patrimonial estimado em ~R$ 24 milhões. Os três, em agravo regimental
  (03/06/2026), negam qualquer desvio e alegam que os R$ 18.268.809,43 captados via notas comerciais
  subscritas pelo FIDC Alvarinho foram integralmente destinados ao pagamento de 32 acordos trabalhistas do
  passivo do BANIF — Banco Internacional do Funchal (Brasil) S.A.'
why_in_novelo: Parte da hipótese investigativa específica (Bello Pactum/FIDC Alvarinho) que fundamenta o
  bloqueio de bens de Quadrado e dos dois ex-administradores da Trustee na Pet 15.198.
