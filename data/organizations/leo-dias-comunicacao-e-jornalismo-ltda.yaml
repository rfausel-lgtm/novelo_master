summary: 'Sociedade empresária limitada, CNPJ 51.568.337/0001-30, com sede na Rua Ministro Jesuíno
  Cardoso, Vila Olímpia, São Paulo/SP. Identificada em contrato de locação residencial (anexo ao IPL
  2026.0009625, INQ 5.035) como locatária de imóvel para uso de Leonardo Antônio Lima Dias ("Léo Dias"),
  representada por seu sócio Ivan Carlos de Oliveira (e-mail ivan.oliveira@portalleodias.com — associado
  ao portal de entretenimento "Léo Dias"). É pessoa jurídica distinta, por CNPJ, da já registrada "Léo
  Dias Comunicação e Jornalismo Ltda SCP VTG" (CNPJ 55.062.879/0001-98), da qual Thiago Miranda foi
  administrador até 2025, e de uma terceira entidade citada por reportagem, "Léo Dias Comunicação e
  Jornalismo S.A.", sem CNPJ localizado nas fontes disponíveis.'
why_in_novelo: É uma das pessoas jurídicas ligadas ao nome comercial "Léo Dias", cuja relação exata com
  as demais entidades de nome semelhante — inclusive a que teve Thiago Miranda como administrador — não
  está esclarecida pelas fontes disponíveis.
