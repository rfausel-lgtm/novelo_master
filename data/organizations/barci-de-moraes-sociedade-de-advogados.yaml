  summary: Em nota de 09/03/2026, o escritório informou ter sido contratado pelo Banco Master entre fevereiro
    de 2024 e novembro de 2025, com equipe de quinze advogados, noventa e quatro reuniões de trabalho
    e trinta e seis pareceres e opiniões legais, e afirmou nunca ter conduzido causa para o banco no âmbito
    do STF.
