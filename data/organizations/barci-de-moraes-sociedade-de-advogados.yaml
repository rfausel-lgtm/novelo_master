open_questions:
- 'O relatório da PF não examina a contraprestação: não avalia se houve serviço advocatício efetivo, matéria
  que está fora do seu escopo declarado e não pode ser tratada como lacuna incriminatória.'
- Segundo reportagem, o escritório produziu em julho de 2024 parecer para o Banco Master sobre riscos
  na captação de recursos de regimes próprios de previdência; a equipe não teve acesso ao texto do parecer.
