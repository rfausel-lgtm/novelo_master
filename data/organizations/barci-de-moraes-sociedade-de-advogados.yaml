summary: Escritório de advocacia de Viviane Barci de Moraes, em São Paulo. Contratado pelo Banco Master
  em janeiro de 2024 (contrato tornado público na PET 16.662), com serviços prestados de fevereiro de
  2024 a novembro de 2025 segundo sua nota de 09/03/2026; segundo contrato com a Viking Participações
  em maio de 2025 (R$ 50 milhões), segundo o Poder360.
why_in_novelo: Manteve contrato de honorários de grande valor com o Banco Master, documentado nos autos
  tornados públicos pelo STF.
