open_questions:
- 'O relatório da PF não examina a contraprestação: não avalia se houve serviço advocatício efetivo, matéria
  que está fora do seu escopo declarado e não pode ser tratada como lacuna incriminatória.'
- Os dois contratos e o termo de dação em pagamento foram lidos pela equipe nos autos da PET 16.662; o
  corpus não sabe quanto foi efetivamente pago sob cada instrumento.
- 'RESOLVIDO EM PARTE (19/09/2026): consulta direta ao cadastro de CNPJ mostra que o quadro de sócios da
  Fraction 024 (proprietária do jato Legacy 650) segue registrando os mesmos dois sócios desde 13/05/2021
  — Marcus Vinícius da Mata e Artur Martins de Figueiredo, este último já conhecido do acervo pela rede
  Trustee/Banvox de Maurício Quadrado. Nem Viviane Barci de Moraes nem o escritório constam em nenhuma
  data. Isso não prova que nenhuma cessão tenha ocorrido — o próprio termo vinculava a dação à conclusão
  dos serviços e vedava alienação sem autorização prévia —, mas indica que a transferência formal não foi
  registrada, ao menos até esta data.'
