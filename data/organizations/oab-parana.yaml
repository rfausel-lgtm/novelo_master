summary: Seccional estadual da OAB. Em 03/09/2026, por nota da diretoria e do conselho pleno, pediu o
  afastamento cautelar de Alexandre de Moraes 'do exercício de suas funções até o encerramento das apurações'
  e o reconhecimento da suspeição do procurador-geral Paulo Gonet para atuar na PET 16.662 — argumentando
  que, por ser citado no relatório da PF (ainda que por contato indireto), Gonet não poderia ao mesmo
  tempo supervisionar a investigação contra Moraes.
