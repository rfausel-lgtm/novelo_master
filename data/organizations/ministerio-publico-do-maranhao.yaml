summary: Órgão do Ministério Público estadual do Maranhão. Apurava, pela 6ª Promotoria de Justiça Especializada
  de Imperatriz (Notícia de Fato nº 003773-253/2025), possível improbidade administrativa no aditivo de
  06/04/2024 ao contrato entre a Câmara Municipal de Imperatriz e o escritório do advogado Daniel de Faria
  Jerônimo Leite — apuração trancada pelo ministro Dias Toffoli (STF) em 30/09/2025 (PET 14.601/MA), por
  descumprimento alegado da tese de repercussão geral do Tema 309. Não localizado se houve recurso do
  MPMA contra essa decisão.
why_in_novelo: É o órgão cuja apuração sobre o contrato de Daniel Leite com a Câmara de Imperatriz foi
  trancada por decisão do STF, episódio que conecta o Maranhão à rede de Vorcaro na tentativa de compra
  do BRB.
