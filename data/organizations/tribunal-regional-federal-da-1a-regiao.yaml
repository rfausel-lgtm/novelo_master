org_type: court
summary: >-
  Tribunal Regional Federal da 1ª Região. Em 28/11/2025 a desembargadora Solange Salgado substituiu
  a prisão preventiva de Vorcaro e de executivos do Master por medidas cautelares. É o requerido no Pedido de
  Providências 0007917-89.2026.2.00.0000, da AGU, no CNJ: em 22/09/2026 o corregedor nacional suspendeu decisões
  da Presidência do tribunal nas SLS 1010037-93.2026.4.01.0000, 1010048-25.2026.4.01.0000 e
  1010055-17.2026.4.01.0000, que haviam sustado o cancelamento de 16 precatórios de usinas sucroalcooleiras, e
  determinou o cancelamento e a restituição dos valores (R$ 4.738.065.026,73); em 28/09/2026 estendeu a medida a
  14 requisições (R$ 1.877.143.674,66 nas datas-base), após decisão de 23/09/2026 da Presidência do TRF-1 na SLS
  1010050-92.2026.4.01.0000. As decisões do CNJ não mencionam o Banco Master. Em 24/09/2026, segundo a Agência
  Brasil, o Times Brasil e A Crítica, o gabinete do desembargador federal Newton Ramos foi objeto de correição
  extraordinária do CNJ; em nota, o tribunal informou que colabora com o CNJ e que o procedimento não antecipa
  responsabilidade.
why_in_novelo: Tribunal em que uma desembargadora substituiu a prisão de Vorcaro em 28/11/2025 e cujas decisões da Presidência sobre precatórios de usinas sucroalcooleiras foram suspensas pela Corregedoria Nacional de Justiça em 22/09/2026.
cited_position:
