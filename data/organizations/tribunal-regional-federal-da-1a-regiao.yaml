  by_id: tribunal-regional-federal-da-1a-regiao
  date: '2026-09-24'
  summary: >-
    Sobre a correição no gabinete de Newton Ramos, o tribunal informou em nota, segundo o Times Brasil, ter
    determinado "integral colaboração" com as autoridades responsáveis e que o procedimento não representa
    antecipação de responsabilidade, devendo ser preservados a presunção de inocência e o direito de defesa;
    segundo A Crítica, a nota é da presidente, desembargadora federal Maria do Carmo Cardoso. Nenhuma
    manifestação do tribunal sobre as decisões do CNJ relativas aos precatórios foi localizada.
