name: Varajo Consultoria Empresarial
aliases: []
org_type: company
summary: 'Empresa apontada, segundo apuração da PF citada pela imprensa, como veículo de contrato fictício
  de consultoria usado para operacionalizar pagamentos a Paulo Sérgio Neves de Souza e a Belline Santana,
  servidores do Banco Central, descrevendo um estudo técnico inexistente sobre integração do mercado jovem.
  A leitura integral da decisão do STF na PET 15.556 identifica o administrador que assinou o instrumento:
  Leonardo Augusto Furtado Palhares, autor da ''proposta de prestação de serviços destinada à contratação
  de BELLINE SANTANA para participação em suposto projeto de elaboração de estudo técnico relacionado
  à inserção de jovens no mercado financeiro''. A decisão suspendeu as atividades da empresa por tempo
  indeterminado. Registro da Receita Federal (CNPJ 39.665.366/0001-15): sociedade unipessoal aberta em
  04/11/2020, capital social de R$ 10.000,00, sede em endereço de coworking na Avenida Paulista, tendo
  Leonardo Augusto Furtado Palhares como sócio único e administrador desde a constituição — não há sócio
  interposto. A situação cadastral consta como SUSPENSA desde 03/03/2026 por determinação judicial, registrando
  no cadastro fiscal a suspensão decretada pelo STF. A sindicância do Banco Central apurou dois contratos
  com Belline Santana somando cerca de R$ 4 milhões e apontou a incompatibilidade entre esses valores
  e o capital de R$ 10 mil e o endereço de coworking, classificando o arranjo como ''negócio simulado''.
  A empresa é anterior aos pagamentos relatados, o que afasta a hipótese de ter sido criada especificamente
  para o esquema.'
why_in_novelo: Entra no corpus como o instrumento contratual apontado para dissimular pagamentos a servidores
  do Banco Central no esquema atribuído a Daniel Vorcaro.
cited_position:
