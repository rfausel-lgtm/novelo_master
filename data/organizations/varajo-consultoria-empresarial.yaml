  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- 'Divergência de valores não conciliada: cerca de R$ 4 milhões em contratos apurados pelo Banco Central,
  contra R$ 1,3 milhão que o Master declarou à Receita ter pago à empresa (R$ 309,8 mil em 2024 e R$ 1
  milhão em 2025).'
- Não foi localizada manifestação da empresa ou de seu sócio único sobre a caracterização das contas como
  'conta de passagem' dos recebimentos ilícitos, feita pela Polícia Federal.
