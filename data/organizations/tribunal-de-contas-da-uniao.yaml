summary: Órgão de controle externo que inspecionou o Banco Central para verificar os documentos que embasaram
  a liquidação do Banco Master. A inspeção foi concluída em 11/02/2026; segundo interlocutores da Corte,
  o relatório não analisa o mérito da decisão nem aponta irregularidades na atuação da autoridade monetária.
why_in_novelo: Fiscaliza a atuação do Banco Central na liquidação do Banco Master; sua inspeção é o principal
  exame externo da decisão.
