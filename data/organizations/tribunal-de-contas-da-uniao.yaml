summary: Órgão de controle externo que inspecionou o Banco Central para verificar os documentos que embasaram
  a liquidação do Banco Master. A inspeção foi concluída em 11/02/2026; segundo interlocutores da Corte,
  o relatório não analisa o mérito da decisão nem aponta irregularidades na atuação da autoridade monetária.
  Há uma segunda frente documentada. Segundo cópia de despacho de 24/03/2026 hospedada pelo Poder360, o
  relator Jhonatan de Jesus sobrestou o TC 022.950/2025-7, representação do MPTCU sobre a atuação do BC na
  supervisão e na resolução do Master, inclusive a apreciação do relatório de inspeção, até elementos oficiais
  de apurações do BC, da CGU e do STF; e, em 13/10/2026, a 2ª Câmara, no Acórdão 5163/2026 (relator Jorge
  Oliveira), sobrestou o julgamento das contas de 2025 do Banco Central até o trânsito em julgado daquela
  representação. O acórdão não aponta irregularidade de ninguém.
why_in_novelo: Fiscaliza a atuação do Banco Central na liquidação do Banco Master; sua inspeção é o principal
  exame externo da decisão.
