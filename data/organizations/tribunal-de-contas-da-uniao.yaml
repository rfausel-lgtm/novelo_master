open_questions:
- O relatório da inspeção é sigiloso e não foi lido pela equipe; o conteúdo vem de interlocutores da Corte
  ouvidos pelo Correio Braziliense.
- A Ata 35/2026 da 2ª Câmara não foi lida; o TC 022.950/2025-7 tramita sob sigilo; o conteúdo do TC 008.216/2025-8 é desconhecido além do que diz o Acórdão 5163/2026.
- A autenticidade da cópia do despacho de 24/03/2026 (código 79923336) não foi conferida no portal do TCU.
