summary: 'Holding de Augusto Lima (CNPJ 33.084.900/0001-13, aberta em 20/03/2019, capital social de R$
  12.340.344,00, sede em São Paulo). Sócios, além de Lima como administrador: quatro familiares dele, que o
  Novelo não nomeia (dois sócios desde 13/12/2019 e dois desde 16/05/2025, representados por ele). Em
  dezembro de 2019, Lima e a então esposa doaram quotas a dois desses familiares, retendo usufruto vitalício
  dos direitos políticos e econômicos — ato apontado, na ação cível movida pela família ex-controladora do
  Voiter, como blindagem patrimonial.'
why_in_novelo: É a holding de Augusto Lima usada na doação de quotas com usufruto retido que a família
  ex-controladora do Voiter aponta, em ação cível, como blindagem patrimonial.
