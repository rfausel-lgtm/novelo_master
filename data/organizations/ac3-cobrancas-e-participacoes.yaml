summary: 'Holding de Augusto Lima (CNPJ 33.084.900/0001-13, aberta em 20/03/2019, capital social de R$
  12.340.344,00, sede em São Paulo). Sócios, além de Lima como administrador: seus quatro filhos — Catarina
  e Maria Clara Calmon Borges Lima (sócias desde 13/12/2019) e Arthur e Augusto Calmon Borges Lima (sócios
  menores, representados pelo pai, desde 16/05/2025). Em dezembro de 2019, Lima e a então esposa doaram
  as quotas às duas filhas mais velhas, retendo usufruto vitalício dos direitos políticos e econômicos
  — ato apontado, na ação cível movida pela família ex-controladora do Voiter, como parte de esquema de
  blindagem patrimonial.'
why_in_novelo: É a holding através da qual se identificam, pela primeira vez no corpus, os quatro filhos
  de Augusto Lima, e o veículo do ato de doação com usufruto retido apontado como blindagem patrimonial.
