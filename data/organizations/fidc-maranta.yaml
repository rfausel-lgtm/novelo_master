name: FIDC Maranta
org_type: fund
summary: Fundo de Investimento em Direitos Creditórios citado na decisão de Dias Toffoli de 06/01/2026 na
  PET 15.198 — 97% de sua carteira estava concentrada em CCBs de R$ 73,7 milhões da Lormont Participações
  S.A., em operação entre partes relacionadas, segundo apontamento da autoridade policial na apuração
  sobre o Banco Master.
why_in_novelo: É o fundo cuja concentração de carteira em um único emissor relacionado (Lormont) sustenta,
  na decisão fundadora da PET 15.198, a hipótese policial de que Nelson Tanure seria "sócio oculto" do
  Banco Master.
