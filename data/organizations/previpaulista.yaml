  date: '2025-11-20'
open_questions:
- O corpus não obteve a íntegra do parecer contrariado nem da ata (inexistente, segundo a própria prefeitura) do
  Comitê de Investimentos.
- Não localizada manifestação de Yves Ribeiro ou de Luiz Augusto da Silva Junior sobre a acusação de terem contornado
  a governança interna.
