summary: 'Banco de Augusto Lima, ex-sócio de Vorcaro no Master; operava como Voiter até a aquisição por
  Lima, aprovada pelo BC em julho de 2025. Em 18/02/2026 o BC decretou a liquidação extrajudicial do Banco
  Pleno S.A. e da Pleno DTVM por comprometimento econômico-financeiro e infringência às normas, segundo
  a imprensa. Augusto Lima fez dois aportes somando R$ 160 milhões, mas o banco havia herdado cerca de
  R$ 6 bilhões em CDBs emitidos na era Master e não formou carteira de crédito suficiente para cobrir
  os compromissos; a corrida de saques se intensificou após a prisão de Lima, em novembro de 2025. Dois
  meses antes, em 18/12/2025, o Banco Central já havia formalizado advertência ao Pleno (Termo de
  Comparecimento 27/2025-BCB/DESUP, assinado por Belline Santana e pela diretora do Pleno Renata Leme
  Borges dos Santos): Índice de Basileia de 6,64%, abaixo do mínimo regulatório, e cerca de R$ 475 milhões
  em CDIs do Master e R$ 2,5 bilhões em créditos FCVS como ativos de difícil monetização. Segundo
  o Poder360, o Banco Central já sabia, desde o primeiro semestre de 2025, de indícios de cessão de créditos
  inexistentes pelo Master ao BRB — e notificou o MPF em julho de 2025, mesmo mês em que aprovou a venda
  do banco (então Voiter) a Lima.

  Histórico: foi incorporado ao conglomerado Master no início de 2024 e vendido em 24/07/2025 (efeitos
  a partir de 11/08/2025, pela Diretoria Colegiada do Banco Central) a Augusto Ferreira Lima — ex-sócio
  de Vorcaro no Master até maio de 2024 —, passando a se chamar Banco Pleno. Registros oficiais do BC,
  obtidos e reportados de forma independente por três veículos, mostram Augusto Lima em pelo menos 7 a
  8 reuniões com a cúpula do órgão ao longo de 2025 (Galípolo, o diretor de fiscalização Ailton de Aquino,
  Renato Gomes e o procurador-geral Cristiano Cozer), incluindo datas próximas à aprovação e à efetivação
  da compra — sem que isso prove relação causal. Deixou o conglomerado Master antes da liquidação de
  novembro de 2025; sua própria liquidação, em 18/02/2026, foi por deterioração da percepção de risco e
  dificuldades de liquidez, descrito como instituição pequena — 0,04% dos ativos e 0,05% da captação do
  Sistema Financeiro Nacional. Segundo o O Tempo, Lima teria gasto cerca de R$ 600 milhões de patrimônio
  pessoal tentando cobrir o passivo de ~R$ 6 bilhões em CDBs herdados antes da liquidação — valor não
  reconciliado com os R$ 160 milhões em aportes formais de capital já registrados a partir de outra fonte.'
why_in_novelo: Instituição do ex-sócio de Daniel Vorcaro, liquidada pelo Banco Central em fevereiro de
  2026, segundo a imprensa — o braço que saiu do grupo antes da crise, mas caiu por conta própria meses
  depois, sem relação formal declarada com o esquema do Master.
