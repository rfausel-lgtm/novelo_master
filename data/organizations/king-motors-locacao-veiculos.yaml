org_type: company
summary: Sociedade limitada (CNPJ 36.944.533/0001-79) aberta em 16/04/2020, com capital social de R$ 1
  milhão, sede em Belo Horizonte, atividade principal de locação de automóveis sem condutor e atividade
  secundária de holding de instituições não-financeiras. Assim como a King Participações Imobiliárias,
  tem como sócio-administrador único Luiz Phillipi Machado de Moraes Mourão. Teve as atividades suspensas
  por determinação judicial em 03/03/2026, na mesma decisão que atingiu as demais empresas do grupo.
why_in_novelo: É a segunda das duas empresas de sócio único do chefe do grupo de intimidação alcançadas
  pela suspensão judicial de atividades na Operação Compliance Zero.
