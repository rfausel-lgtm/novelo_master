summary: Empresa do advogado Daniel Monteiro descrita, em depoimento de Márcio Domingues dos Santos à PF (28/07/2026),
  como o veículo do 'escritório pessoal' de investimentos de Daniel — organização administrativa e cadastral de
  suas sociedades e ativos, sem relação, segundo o depoente, com João Carlos Falbo Mansur ou com a REAG. Márcio
  prestava serviços a ela faturando por outra empresa, a M Quattro. O ND Mais, em levantamento de 14/09/2026 sobre
  honorários do Banco Master, atribui à Mytra cerca de R$ 30 milhões, ligados a Daniel Monteiro.
why_in_novelo: É o veículo do escritório pessoal de Daniel Monteiro, descrito por dentro no depoimento de um de
  seus próprios prestadores de serviço, e aparece entre os maiores recebedores de honorários do Master segundo o
  ND Mais.
