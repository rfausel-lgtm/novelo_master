open_questions:
- O corpus não tem o CNPJ nem o quadro societário da Mytra; o depoimento de Márcio Domingues a descreve apenas funcionalmente,
  como escritório pessoal de investimentos.
- Não verificado se os cerca de R$ 30 milhões que o ND Mais atribui à Mytra em honorários do Master correspondem
  a serviços jurídicos de Daniel Monteiro ou a outra frente de atuação.
