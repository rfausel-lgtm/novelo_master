summary: 'Instituição de ensino superior de Brasília fundada em 1998 por Gilmar Mendes, Paulo Gonet e Inocêncio
  Mártires Coelho. É um ponto de passagem recorrente de trajetórias do caso: Dalide Corrêa, advogada cujo escritório
  recebeu R$ 33 milhões do Banco Master em 2024, foi sua diretora-geral e rompeu com Gilmar Mendes em 2017 por divergências
  sobre a gestão; no mesmo ano, Paulo Gonet, hoje procurador-geral da República, deixou a sociedade vendendo sua
  participação a Francisco Schertel Mendes, filho do ministro e reitor da instituição.'
why_in_novelo: É o vínculo institucional que liga, em momentos distintos e sem contemporaneidade com os fatos do
  caso, a advogada Dalide Corrêa, o ministro Gilmar Mendes e o procurador-geral Paulo Gonet.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação da instituição sobre o caso foi localizada no corpus; o IDP não é objeto dos fatos
    investigados, e o registro aqui é de trajetória de pessoas.
open_questions:
- O acervo não registra nenhum vínculo do próprio IDP com o Banco Master ou com o ecossistema de Daniel Vorcaro;
  o nó é de trajetória das pessoas, não de negócio da instituição.
