summary: Empresa apontada pelo Intercept e pelo Congresso em Foco como ligada a Daniel Vorcaro e origem
  das transferências ao Havengate Development Fund para o filme 'Dark Horse'. É apontada como propriedade
  de Antonio Carlos Freixo Júnior ('Mineiro'), que fechou acordo de colaboração premiada com a PGR em
  03/09/2026 sobre essas remessas — a segunda delação do caso Banco Master.
why_in_novelo: Empresa de onde partiram, segundo a imprensa, os recursos de Daniel Vorcaro para o fundo
  que financiou 'Dark Horse'.
