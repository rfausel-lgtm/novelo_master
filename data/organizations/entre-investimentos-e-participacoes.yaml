- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- A composição societária da Entre Investimentos e Participações não foi verificada pela equipe em registros
  oficiais.
- Condenada pela CVM em 08/09/2026 a R$ 10 milhões de multa por atuar como 'câmara de liquidação' de cotas
  fraudadas do Brazil Realty FII (177 operações, 2018-2020) — controlada, à época, em 70% pela FG Participações,
  holding de Benjamim Botelho de Almeida. Propôs termo de compromisso de R$ 4,95 milhões, rejeitado pelo
  colegiado.
