open_questions:
- A estrutura societária da Go Up e sua relação formal com o Havengate Development Fund não foram verificadas em
  registros oficiais pela equipe.
- 'PRECISÃO trazida pela decisão do STF de 03/09/2026: são duas pessoas jurídicas com o mesmo nome — a Go Up Entertainment
  Ltda., inscrita no cadastro nacional sob o nº 44.447.509/0001-52, que é a produtora cujas contas foram analisadas
  e que teve suspenso o direito de contratar com o poder público, e a Go Up Entertainment LLC, sediada no exterior,
  citada pelo ministro como elemento do risco de evasão dos investigados. O corpus descrevia a produtora apenas
  como sediada nos Estados Unidos. A decisão registra que a empresa brasileira movimentou R$ 19.033.071,00 entre
  10/11/2025 e 30/12/2025, período das filmagens, tendo como principais remetentes a Moneycorp Banco de Câmbio (R$
  3,92 milhões), a GO7 (R$ 2,61 milhões), uma pessoa física (R$ 1 milhão), a NTT Brasil (R$ 750 mil) e o deputado
  federal Mário Frias (R$ 645,4 mil), e como principais destinatários o Hotel Unique (R$ 906,7 mil), a BAW Facilitadora
  de Pagamentos (R$ 896,7 mil) e a Foodflix Alimentação (R$ 653,1 mil).'
- 'Cadastro federal consultado em 10/09/2026: capital social declarado de R$ 100.000,00, atividade principal de
  estúdios cinematográficos, existência desde 01/12/2021 e uma única sócia-administradora — contra R$ 19 milhões
  movimentados em cinquenta e um dias. O maior remetente do período é a Moneycorp Banco de Câmbio, instituição autorizada
  pelo Banco Central, o que indica entrada de recursos do exterior liquidada em reais; quem remeteu de fora não
  está identificado em documento algum lido pela equipe. Um dos aportes, o de R$ 1 milhão do publicitário Marcello
  Lopes, está amparado em contrato denominado em dólares (US$ 185.185,19) e assinado seis meses depois do dinheiro,
  em 04/06/2026.'
- 'Resposta parcial à pergunta sobre a origem externa do dinheiro que entrou na conta brasileira: o laudo pericial
  contratado pela própria dona da produtora afirma que os gastos do filme no Brasil, de US$ 3.728.084,66 entre 01/06/2025
  e 04/06/2026, foram cobertos em sua maior parte por REPASSES DA GO UP ENTERTAINMENT LLC, dos Estados Unidos, enquanto
  outros US$ 9.664.996,63 foram pagos diretamente pelo braço americano. É a empresa descrevendo a entrada de dinheiro
  de fora para custear a produção — o formato exato do crédito que um banco de câmbio entrega em reais. O laudo
  não detalha datas, valores individuais nem instituições dessas remessas, não identifica fornecedores e não apresenta
  documento fiscal do destino dos valores. Pergunta que ele deixa em aberto: se o aporte do Havengate equivale a
  100% do custo, onde entram as ''cotas para investimento'' abertas em outubro de 2025 e o aporte de US$ 185.185,19
  cujo contrato foi assinado seis dias antes de o laudo ser assinado.'
- 'A ESTRUTURA, agora desenhada por documentos do processo administrativo da Ancine: a empresa americana é a Goup
  Entertainment LLC, sediada em Miami, com Karina Ferreira da Gama e Michael Brian Davis como sócios e diretores;
  a brasileira é o braço da mesma estrutura, e não prestadora de serviços de terceiro. Em 17/07/2026 os dois assinaram
  em Miami memorando dirigido à Ancine nomeando a LLC ''Licenciante e titular declarada dos direitos sobre a Obra'',
  com cláusula declarando produção realizada apenas parcialmente no Brasil, e licenciando a distribuição no país
  à Cannes Produções Ltda, de Barueri. Em 28/07/2026 a agência lavrou auto de infração por a produtora ter rodado
  no Brasil obra ESTRANGEIRA sem comunicação prévia; na defesa de 31/08/2026 a empresa brasileira se diz mera prestadora
  local e atribui a contratação e o pagamento do elenco principal a uma ''empresa estrangeira'' que nunca nomeia
  — a própria LLC —, pedindo multa no mínimo legal de R$ 2 mil, num processo que pode chegar a R$ 200 mil.'
