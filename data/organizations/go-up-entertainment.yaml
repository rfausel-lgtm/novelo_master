name: Go Up Entertainment
aliases:
- GoUp Entertainment
- GOUP Entertainment
org_type: company
summary: Produtora sediada nos Estados Unidos responsável pelo filme 'Dark Horse', biografia de Jair Bolsonaro.
  Consta como produtora no contrato de novembro de 2023 descrito pelo Intercept; recebia recursos encaminhados
  pelo Havengate Development Fund, segundo a CNN. Declarou, em perícia privada anexada a processo em São
  Paulo, custo de US$ 13,3 milhões para o filme (Metrópoles). Sua dona, segundo o Metrópoles, representa
  também o Instituto Conhecer Brasil, investigado por suspeita de desvio de contrato com a Prefeitura
  de São Paulo. É dirigida por Karina Ferreira da Gama, que também preside o Instituto Conhecer Brasil,
  contratado pela Prefeitura de São Paulo em termo de colaboração de R$ 108 milhões investigado pela Polícia
  Civil.
why_in_novelo: Produtora do filme 'Dark Horse', destinatária final, segundo a imprensa, dos recursos transferidos
  por Daniel Vorcaro a fundo nos Estados Unidos.
cited_position:
