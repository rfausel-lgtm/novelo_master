summary: >-
  Órgão que representa a União em juízo. É a requerente, contra o TRF-1, do Pedido de Providências
  0007917-89.2026.2.00.0000 no CNJ, no qual o corregedor nacional determinou em 22/09/2026 o cancelamento de 16
  precatórios e, em 28/09/2026, a pedido de aditamento da União, de mais 14 requisições, todos expedidos pela 6ª
  Vara Federal Cível da SJDF em execuções derivadas da Ação Ordinária 0001931-10.1990.4.01.3400. No STF,
  representa a União, recorrente nos ARE 1.312.127 (recorridas Raízen Energia S.A. e outras) e 1.327.995
  (recorrida Destilaria Alcidia S.A.), sobre indenizações a usinas sucroalcooleiras.
why_in_novelo: Requerente do Pedido de Providências no CNJ que levou ao cancelamento dos precatórios do TRF-1 e representante da União, recorrente nos ARE 1.312.127 e 1.327.995 no STF.
