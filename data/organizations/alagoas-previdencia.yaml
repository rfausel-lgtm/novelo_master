summary: Autarquia gestora do regime próprio de previdência do Estado de Alagoas, CNPJ 23.658.211/0001-11.
  Credenciou o Banco Master em abril de 2024 e publicou o termo em seu portal de transparência — é a única
  cópia do documento localizada em acesso aberto, e a que permitiu conferir, palavra por palavra, o texto
  que a auditoria federal descreve como replicado em outros entes. O corpus não apurou se a autarquia
  chegou a adquirir ativos do banco; ela não consta da relação dos dezoito regimes próprios que compraram
  letras financeiras.
why_in_novelo: Único ente que publicou em acesso aberto o termo de credenciamento do Banco Master, permitindo
  verificar o documento que a auditoria federal descreve como escrito pelo próprio banco.
