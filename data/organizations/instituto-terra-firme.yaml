open_questions:
- O repasse de R$ 457,2 mil do Master é, segundo a mesma reportagem, negado formalmente por Flávia Peres;
  não há decisão de mérito nem documento primário da Receita Federal lido diretamente pela equipe.
- 'Reforçada, não resolvida: o Mapa das OSC/IPEA confirma Maria Helena Santos Ferreira como presidente
  estatutária da Asseba desde 2008, o que aumenta a dúvida sobre a alegação de fonte única do Jornal Grande
  Bahia de que o Instituto Terra Firme ''geriria'' a Asseba — pode refletir gestão de fato não estatutária,
  ou imprecisão da fonte; segue não verificado.'
