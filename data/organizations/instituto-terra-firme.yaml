open_questions:
- O repasse de R$ 457,2 mil do Master é, segundo a mesma reportagem, negado formalmente por Flávia Peres;
  não há decisão de mérito nem documento primário da Receita Federal lido diretamente pela equipe.
- O repasse de R$ 457,2 mil do Master é, segundo a mesma reportagem, negado formalmente por Flávia Peres;
  não há decisão de mérito nem documento primário da Receita Federal lido diretamente pela equipe.
- 'Refinado (lote 119): a alegação de que o instituto ''geriria'' a Asseba, ao ser rastreada até sua origem
  em duas reportagens (JGB, Bahia Notícias), parece se apoiar num achado da PF/Coaf sobre sobreposição
  de e-mail/telefone que o próprio corpus já documenta como referente à empresa ''Terra Firme da Bahia
  Ltda'' (de Augusto Lima) — pessoa jurídica distinta deste instituto, presidido por Flávia Peres. É possível
  que a imprensa tenha confundido as duas entidades homônimas; sem o documento primário com o CNPJ exato
  citado, a equipe não pode decidir a questão, e mantém as duas hipóteses em aberto.'
