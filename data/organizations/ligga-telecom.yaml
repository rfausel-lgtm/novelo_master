name: Ligga Telecom
aliases: []
org_type: company
summary: Operadora de fibra óptica do Paraná, nascida como Copel Telecomunicações (2000), privatizada
  em novembro de 2020 por R$ 2,39 bilhões e arrematada pelo Bordeaux Fundo de Investimento, controlado
  por Nelson Tanure; rebatizada Ligga Telecom em 2021. Documentos internos mostram que a empresa aplicou
  entre R$ 353 milhões (dez/2022) e R$ 388,6 milhões (set/2025) de seu caixa em CCBs do Banco Master,
  decisão que não passou pelo Conselho de Administração; a Moody's rebaixou seu rating em dezembro de
  2025 por 'opacidade de informação'. Um sócio minoritário notificou extrajudicialmente a empresa em janeiro
  de 2026, alegando desvio de cerca de R$ 400 milhões de recursos de debêntures incentivadas para o Master.
why_in_novelo: Empresa de Nelson Tanure que aplicou recursos do caixa em títulos do Banco Master, segundo
  documentos internos citados pela imprensa.
cited_position:
- kind: denial
  summary: Afirmou não possuir, atualmente, qualquer aplicação financeira no Banco Master, direta ou indiretamente
    — nota que não desmente o histórico de aplicações entre 2022 e 2025.
  source_ids:
  - src-gazetadopovo-2026-ligga-notificacao-extrajudicial
  date: '2026-01-29'
open_questions:
- A aquisição da Copel Telecom foi financiada por emissão de R$ 1,53 bilhão em debêntures em colocação
  privada, sem intermediação; o Banco Master não figura no documento societário. O fluxo documentado entre
  a operadora e o banco corre no sentido inverso, do caixa da empresa para cédulas de crédito bancário
  do banco.
