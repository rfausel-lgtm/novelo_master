open_questions:
- Segundo a proposta de delação de João Carlos Mansur (26/08/2026), um fundo chamado 'Jaguar Multimarket
  Fund Ltd.' (Cayman) recebeu R$ 494 milhões do Banco Master e teria Daniel Vorcaro como 'verdadeiro dono',
  apesar de Benjamim Botelho figurar como beneficiário formal — alegação do delator, não corroborada.
  Não confirmado se é a mesma entidade que esta ('Jaguar Investments'), beneficiário do mesmo Botelho
  na condenação da CVM sobre o Brazil Realty FII, ou um veículo distinto de nome semelhante.
