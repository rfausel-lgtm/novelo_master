summary: Fundo estrangeiro (atual denominação da Centara Multimarket Investments LLC e Brazilian Multimarket
  Investments LLC), regularmente registrado na CVM, cujo beneficiário final no Brasil é Benjamim Botelho
  de Almeida — as ordens de compra e venda eram dadas por ele na qualidade de diretor. Realizou 32 operações
  com cotas do Brazil Realty FII entre outubro de 2018 e fevereiro de 2020, com lucro estimado de R$ 6,99
  milhões, e mantinha, segundo extrato de 13/09/2021 citado em sua própria defesa, 7.165.997 cotas do
  fundo avaliadas em cerca de R$ 113 milhões. A defesa argumentou que a retenção substancial de ativos
  descaracterizaria intuito especulativo — argumento não afastou a condenação de Botelho no processo.
why_in_novelo: É o veículo offshore de Benjamim Botelho de Almeida que manteve a maior posição em cotas
  do Brazil Realty FII entre as entidades ligadas ao esquema, avaliada em cerca de R$ 113 milhões.
