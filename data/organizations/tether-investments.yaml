org_type: financial_institution
summary: Braço de investimento da Tether, emissora do stablecoin USDT — distinto, segundo a própria empresa,
  das reservas que lastreiam a moeda digital. Emprestou US$ 300 milhões à Titan Holding, empresa pessoal
  de Daniel Vorcaro, em março de 2025, com garantia lastreada na carteira de crédito consignado do Banco
  Master. Moveu ação de cobrança no TJSP após o vencimento antecipado do contrato, disparado pelo rebaixamento
  de rating do banco e por sua liquidação em 18/11/2025. Também obteve na Justiça das Ilhas Cayman a liquidação
  da Titan Holding.
why_in_novelo: É a primeira credora internacional ligada a stablecoin identificada no caso Master — e
  a primeira vez que o corpus registra recebíveis de consignado brasileiro dados em garantia a credor
  externo do setor cripto.
