summary: Resort em Ribeirão Claro (PR), do grupo Tayayá Ribeirão Claro. A Maridt, empresa da família do
  ministro Dias Toffoli, deteve cotas do empreendimento até 21/02/2025 (venda ao Fundo Arllen em 27/09/2021
  e do saldo à PHD Holding em 21/02/2025, segundo nota do ministro). Mensagens de Vorcaro e Fabiano Zettel
  obtidas pela PF (via Estadão) tratam de aportes ao 'fundo Tayayá' em 2024 (R$ 20 milhões e R$ 15 milhões,
  segundo Zettel).
why_in_novelo: Empreendimento em que a empresa da família de Dias Toffoli foi sócia e que, segundo mensagens
  obtidas pela PF, recebeu aportes cobrados por Daniel Vorcaro.
