summary: Escritório de advocacia de Brasília identificado nos documentos da auditoria interna do BRB como destinatário
  de R$ 33 milhões pagos pelo Banco Master em 2024 — o segundo maior valor do ano, atrás do escritório Barci de
  Moraes. A sociedade ativa é a Alves Corrêa & Veríssimo Advocacia, aberta em 14/06/2016, com capital social de
  R$ 500 mil, tendo Dalide Barbosa Alves Corrêa como sócia-administradora desde a abertura e David Veríssimo de
  Souza como sócio desde 18/06/2019. A sociedade homônima anterior, Alves Corrêa & Advogados Associados, de 2007,
  foi extinta em 27/02/2013 e não podia receber pagamento em 2024. A auditoria citada pela imprensa nomeia o destinatário
  apenas como 'Alves Corrêa'; quem o nomeia por extenso é o levantamento do ND Mais de 14/09/2026, que atribui à
  Alves Corrêa Verissimo Advocacia cerca de R$ 32,9 milhões em honorários do banco.
why_in_novelo: É o escritório que, segundo documentos apreendidos pela PF, recebeu R$ 33 milhões do Banco Master
  em 2024, com o pagamento ordenado sob a justificativa de 'canal direto com o STF'.
cited_position:
- kind: not_located
  summary: Procurado por meio da advogada que o administra, o escritório não divulgou manifestação própria; a resposta
    ao caso veio em nota pessoal de Dalide Corrêa.
open_questions:
- Nenhum documento público — contrato, nota fiscal ou extrato — liga o CNPJ da sociedade ativa a um pagamento específico
  do Banco Master; a identificação da pessoa jurídica se dá por convergência de nome, titularidade e período de
  atividade.
- 'Quais serviços jurídicos concretos correspondem aos valores: as publicações judiciais no DJEN em nome dos dois
  sócios não registram processo com o Banco Master como parte.'
