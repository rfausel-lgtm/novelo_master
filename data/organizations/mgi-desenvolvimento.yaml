summary: Sociedade cujas quotas, sobreavaliadas em cerca de R$ 56 milhões segundo a CVM, foram usadas
  pela Milo Investimentos para integralizar cotas do Brazil Realty FII em 31/10/2018. O valor derivava
  da participação da MGI na Via Expressa S.A. (imóvel de 76 mil m² em Contagem/MG), avaliada pela Nova
  Aliança Engenharia em duas versões divergentes — a primeira, cuja autoria a própria avaliadora negou.
  Felipe Cançado Vorcaro, ligado à MGI, foi condenado pela CVM apesar de sustentar que nunca foi sócio
  ou administrador da Milo nem negociou cotas do fundo.
why_in_novelo: É a sociedade cuja sobreavaliação de R$ 56 milhões, por laudo de autoria contestada, serviu
  de base à integralização fraudulenta pela Milo Investimentos — e cuja condenação atingiu Felipe Vorcaro
  mesmo diante de sua defesa de que não teria ingerência sobre o laudo.
