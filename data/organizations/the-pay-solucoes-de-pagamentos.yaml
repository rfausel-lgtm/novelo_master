summary: 'Empresa de nome fantasia "Privilege" (CNPJ 17.780.249/0001-60), citada nominalmente na portaria
  de instauração do IPL 2025.0087917 como uma das cinco a apurar. Originou carteiras de crédito consignado
  cedidas pelo Banco Master ao BRB em 20 e 24/12/2024; o Master as recomprou em 12/02/2025 após reclamações
  de titulares que negavam conhecer as operações. O valor dessa recompra é contraditório entre as próprias
  fontes oficiais: o Master informou ao Banco Central, em 25/03/2025, cerca de R$ 303 milhões; o Banco
  Central, em ofício de agosto de 2025, atribuiu à mesma operação R$ 1,7 bilhão — o Ministério Público
  Federal classificou a divergência como "informação contraditória". Teve como sócio-administrador único,
  com 100% de participação, Roberto Fernandes de Oliveira Filho, de 08/05/2020 a 05/09/2024; nessa data, o
  controle passou a uma holding identificada de forma inconsistente no próprio processo (ora "Sirius
  Participações S.A.", ora "Merope Participações S.A.", mesmo CNPJ), com novos administradores formais —
  entre eles Priscila Franca Parigine, que assumiu a representação legal em 28/04/2025 e que o próprio
  despacho do MPF descreve como tendo vínculo empregatício atual como atendente de padaria/lanchonete,
  com remuneração incompatível com a administração de uma sociedade envolvida em cessões bilionárias.
  Segundo apurou o Banco Central, operações de consignado originadas pelo próprio Banco Master (e não por
  terceiros como a The-Pay) não apresentaram indícios de irregularidade.'
why_in_novelo: É a origem de um segundo vetor de fraude na relação Master-BRB, distinto da Tirreno, com
  indícios de que sua administração formal, ao menos desde 2024, é exercida por interpostas pessoas.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data desta atualização.
open_questions:
- A inconsistência entre "Sirius Participações S.A." e "Merope Participações S.A." para o mesmo CNPJ não
  foi esclarecida pelos documentos lidos até agora — pode ser erro de digitação do próprio MPF, ou indicar
  mudança de nome não registrada nos autos.
- A divergência de R$ 303 milhões (Master) para R$ 1,7 bilhão (Banco Central) sobre o mesmo episódio de
  recompra não foi resolvida por nenhuma fonte disponível.
- Não localizada, nos documentos lidos até agora, qualquer conexão direta entre Roberto Fernandes de
  Oliveira Filho ou os administradores posteriores e o Banco Master, além da relação comercial de
  originação de créditos.
