name: Havengate Development Fund LP
aliases: []
org_type: fund
summary: Fundo sediado no Texas (EUA) que, segundo o Intercept, recebeu ao menos US$ 10,6 milhões de empresas
  ligadas a Daniel Vorcaro (via Entre Investimentos e Participações) para financiar 'Dark Horse' e, segundo
  relatório do Coaf noticiado pela piauí, mais US$ 1,6 milhão em 16/09/2025. Foi criado originalmente
  para um projeto imobiliário em Melissa (Texas) que nunca saiu do papel, conforme registros oficiais
  checados pelo Intercept.
why_in_novelo: Veículo financeiro, nos Estados Unidos, por onde passaram os recursos de Daniel Vorcaro
  destinados ao filme 'Dark Horse', segundo a imprensa.
cited_position:
- kind: not_located
  summary: Nenhuma manifestação pública específica localizada no corpus até a data da última atualização.
open_questions:
- A equipe não consultou diretamente os registros do Texas citados pelo Intercept.
- O corpus não registra manifestação dos gestores do fundo.
- A soma que o corpus havia reconstruído de duas fontes independentes — US$ 10,6 milhões apurados pelo
  Intercept mais US$ 1,6 milhão de relatório do Coaf, totalizando US$ 12,2 milhões — foi praticamente
  confirmada pela delação homologada em 09/09/2026, que declara sete transferências somando US$ 12,3 milhões
  entre fevereiro e setembro de 2025. O fundo é administrado por Paulo Calixto, advogado descrito como
  próximo a Eduardo Bolsonaro, e a apuração busca esclarecer se todo o valor foi destinado à produção
  do filme.
