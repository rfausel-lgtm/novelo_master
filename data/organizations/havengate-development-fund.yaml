summary: Fundo sediado no Texas (EUA) que, segundo o Intercept, recebeu ao menos US$ 10,6 milhões de empresas
  ligadas a Daniel Vorcaro (via Entre Investimentos e Participações) para financiar 'Dark Horse' e, segundo
  relatório do Coaf noticiado pela piauí, mais US$ 1,6 milhão em 16/09/2025. Foi criado originalmente
  para um projeto imobiliário em Melissa (Texas) que nunca saiu do papel, conforme registros oficiais
  checados pelo Intercept.
why_in_novelo: Veículo financeiro, nos Estados Unidos, por onde passaram os recursos de Daniel Vorcaro
  destinados ao filme 'Dark Horse', segundo a imprensa.
