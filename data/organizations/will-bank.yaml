summary: Will Financeira S.A. CFI (marca Will Bank), controlada pelo Banco Master. Em 21/01/2026 o BC
  decretou sua liquidação extrajudicial por insolvência e vínculo de interesse com o Master, nomeando
  Eduardo Bianchini liquidante; o FGC estima R$ 6,3 bilhões em garantias. A defesa de Vorcaro disse que
  a instituição tinha administração apartada.
why_in_novelo: Instituição ligada ao Banco Master liquidada pelo Banco Central em 2026, com garantias
  pagas pelo FGC.
