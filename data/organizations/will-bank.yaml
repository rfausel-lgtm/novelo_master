summary: Will Financeira S.A. CFI (marca Will Bank), controlada pelo Banco Master. Em 21/01/2026 o BC
  decretou sua liquidação extrajudicial por insolvência e vínculo de interesse com o Master, nomeando
  Eduardo Bianchini liquidante; o FGC estima R$ 6,3 bilhões em garantias. A defesa de Vorcaro disse que
  a instituição tinha administração apartada. O Banco Central decretou sua liquidação extrajudicial em
  21/01/2026, dias depois de a Will Financeira não cumprir cronograma de pagamento com a bandeira Mastercard,
  em 19/01/2026, o que resultou no bloqueio de sua participação no arranjo de pagamentos. Estima-se base
  de cerca de 12 milhões de clientes. Por ter CNPJ próprio, distinto do Banco Master, a cobertura do FGC
  aos seus clientes é separada da garantia — inexistente — das letras financeiras dos regimes próprios
  de previdência, com estimativa de desembolso de R$ 6,3 bilhões.
why_in_novelo: Instituição ligada ao Banco Master liquidada pelo Banco Central em 2026, com garantias
  pagas pelo FGC. Traz ao caso uma classe de vítima nova e numerosa — o correntista de varejo.
