isolation_reason: A Comissão é só a destinatária declarada dos pedidos da defesa de Daniel Vorcaro; não
  agiu nem se manifestou em documento localizado até 03/11/2026. Por isso não figura como participante do
  evento de 02/11/2026, para não sugerir atuação dela no caso. Aparece no documento da nota da defesa e no
  contraditório (not_located) do evento.
