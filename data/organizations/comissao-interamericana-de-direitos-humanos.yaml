jurisdiction: Organização dos Estados Americanos (OEA); sede em Washington, D.C.
summary: Órgão da Organização dos Estados Americanos (OEA), com sede em Washington, D.C., segundo a nota da
  defesa de Daniel Vorcaro e o Metrópoles. Entra no acervo porque a defesa diz ter apresentado a ela, em
  27/10/2026, pedido de medida cautelar e petição individual contra o Estado brasileiro. O acervo não
  localizou documento nem manifestação da Comissão sobre o caso. O registro dos pedidos, com os números
  MC-2068-26 e P-2913-26, consta só na nota da defesa; o acervo não afirma registro, admissão nem andamento.
why_in_novelo: É o órgão que a defesa de Daniel Vorcaro diz ter acionado contra a prisão preventiva dele, em
  nota divulgada em 02/11/2026.
