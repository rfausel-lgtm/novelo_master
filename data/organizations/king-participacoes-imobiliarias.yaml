open_questions:
- O corpo da decisão do STF menciona 'King Empreendimentos Imobiliários e Participações Ltda' como destinatária
  da transferência de R$ 1 milhão, nome que corresponde a uma terceira empresa, de sócios sem relação
  identificada com o caso e que permanece ativa — trata-se de imprecisão da decisão, e o corpus não vincula
  aquela empresa ao caso.
- Não foi localizada manifestação da empresa ou do espólio de seu sócio único sobre a caracterização feita
  pela investigação.
