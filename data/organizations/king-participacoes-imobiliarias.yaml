org_type: company
summary: Sociedade limitada (CNPJ 47.855.227/0001-82) aberta em 06/09/2022, com capital social de R$ 1
  milhão, sede em Belo Horizonte e atividade declarada de corretagem no aluguel de imóveis. Tem como sócio-administrador
  único Luiz Phillipi Machado de Moraes Mourão, apontado pela Polícia Federal como chefe do grupo informal
  de monitoramento e intimidação conhecido como 'A Turma', morto sob custódia da PF em março de 2026.
  É a empresa que, segundo a apuração, recebia cerca de R$ 1 milhão por mês de sociedades do grupo Master,
  sobretudo da Super Empreendimentos — dos quais cerca de R$ 400 mil mensais eram distribuídos entre os
  integrantes do grupo. Teve as atividades suspensas por determinação judicial em 03/03/2026, na mesma
  decisão que atingiu a Varajo Consultoria, a Moriah Asset, a Super Empreendimentos e a King Motors.
why_in_novelo: É a pessoa jurídica pela qual passava o dinheiro destinado ao grupo apontado como responsável
  por monitorar e intimidar jornalistas, concorrentes e ex-empregados a mando de Daniel Vorcaro.
