description: Oito dias após o áudio em que o senador cobra parcelas atrasadas, o Coaf registra transferência de
  Vorcaro ao fundo que administrava os recursos do filme. O nexo documental existe (o mesmo relatório do Coaf e
  as mesmas mensagens são citados pela imprensa).
limits: 'RETRATADA em 11/09/2026. A sequência afirmava no título e na descrição um intervalo de oito dias entre
  o áudio de cobrança e a transferência, mas a datação do áudio não está estabelecida: a CartaCapital o situa em
  08/09/2025, o Metrópoles registra áudio de teor semelhante em 16/11/2025 e a Gazeta situa as cobranças em outubro
  e novembro. O evento de origem está registrado com precisão aproximada (2025-09). Se a datação do Metrópoles estiver
  correta, o áudio é posterior à transferência e a ordem cronológica da sequência se inverte, junto com o sentido
  que ela sugere. Enquanto a data não for fixada, a proximidade temporal — que era todo o fundamento da sequência
  — não se sustenta.'
