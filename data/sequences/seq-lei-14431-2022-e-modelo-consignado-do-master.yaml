description: A lei de agosto de 2022 ampliou a margem consignável e o universo de tomadores, e dois anos
  depois a Emenda nº 11 à PEC 65/2023 tratou do limite de cobertura do FGC. A representação da PF examina
  os dois atos no mesmo eixo de atuação parlamentar de interesse do grupo Master.
limits: A lei é geral e beneficiou todo o mercado de consignado; não se conclui que tenha sido editada
  em favor do Banco Master nem que a atuação parlamentar examinada tenha determinado seu conteúdo.
