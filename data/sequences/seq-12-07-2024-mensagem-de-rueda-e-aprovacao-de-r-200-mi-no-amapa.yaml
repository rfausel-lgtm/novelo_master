causality_proven: false
description: >-
  Em 12/07/2024, a ata da 11ª Reunião Extraordinária do Comitê de Investimentos da Amprev registra a aprovação
  por unanimidade de R$ 200 milhões em letras financeiras do Master, em reunião aberta às 10h49 e encerrada às
  11h13. No mesmo dia, segundo o UOL, Antônio Rueda pediu a Daniel Vorcaro, às 11h45, que apagasse mensagens,
  e cerca de uma hora depois o diretor comercial do Master, Fernando Mascarenhas, relatou a Vorcaro a aprovação
  no Amapá como ocorrida "agora". O primeiro passo é documentado; o segundo e qualquer elo entre os dois, não.
limits: >-
  Pelos horários da ata, a aprovação antecede as duas mensagens descritas pelo UOL, e o relato de Mascarenhas
  é posterior ao encerramento da reunião; a comparação supõe que os horários do UOL estejam no horário de
  Brasília, o que a reportagem não informa. O corpus não contém documento que ligue Rueda à aprovação; a ata
  não o menciona, e Rueda nega ter participado das negociações do Amapá. O Novelo não conclui que o pedido
  para apagar mensagens se refira à operação do Amapá, nem o que continham as mensagens apagadas.
