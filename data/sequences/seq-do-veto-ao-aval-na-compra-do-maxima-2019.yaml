description: Em fevereiro de 2019 o Banco Central indeferiu a transferência de controle do Banco Máxima
  por falta de comprovação da origem dos recursos e de capacidade financeira. Em 2 de maio foi protocolado
  novo pedido, com grupo de controle de três nomes e nova documentação. Em 14 de outubro, já sob outra
  presidência, a autarquia aprovou a operação, registrando que a origem dos recursos havia sido regularmente
  demonstrada.
limits: A sequência mostra a mudança de decisão, não sua causa. As fontes disponíveis são extratos dos
  votos, com trechos cobertos por tarjas, e relatos de fontes não identificadas. Não se conclui daqui
  qualquer irregularidade na aprovação, nem se atribui a decisão a interferência externa.
