description: >-
  Em 16/06/2026 Mendonça levanta o sigilo das Pets 15.978 e 15.873, no dia do julgamento das prisões na
  Segunda Turma; no mesmo dia a imprensa publica descrições de relatórios da PF sobre viagens e hospedagens
  pagas por Vorcaro; oito dias depois, em 24/06, o sigilo das duas Pets é restabelecido; em 11/09, na Pet
  16.704, o sigilo da Pet 15.873 é levantado de novo, em despacho que registra pedido do Vice-PGR, e o da 15.978 não consta da lista.
  Os três atos estão documentados e trazem o motivo declarado; nenhum documento liga o restabelecimento à
  divulgação.
limits: >-
  Cada ato informa o motivo declarado: inclusão em pauta de última hora e acesso dos demais ministros (16/06);
  resguardo do aporte de novas informações e retomada do trâmite processual (24/06); pedido do Vice-PGR e
  ausência de impedimento (11/09). O Novelo não conclui que o restabelecimento de 24/06 decorreu da divulgação
  de 16/06, nem que a Pet 15.978 permanece sigilosa depois de 11/09 (não consta da lista; o último ato
  localizado sobre o sigilo dela é o de 24/06). Os relatórios descritos pela imprensa não foram localizados, e
  não se sabe em qual Pet estão.
