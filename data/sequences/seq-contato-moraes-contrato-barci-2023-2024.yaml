description: 'Em 26/12/2023 Fábio Faria compartilha com Vorcaro o contato salvo como ''Alexandre de Moraes
  BRASILIA''; em janeiro de 2024 o Banco Master contrata o escritório de Viviane Barci de Moraes, com
  Faria tratando do prazo com o banqueiro; em 15/03/2024 Faria cobra o pagamento e Vorcaro o trata como
  prioritário. Os três passos estão no mesmo documento (relatório da PF), o que constitui nexo documental
  parcial: o documento liga as pessoas e as datas, não os motivos.'
limits: A sequência mostra proximidade temporal e um intermediário comum. Não demonstra que o contrato
  tenha sido celebrado em razão dos contatos com o ministro, nem que o ministro tenha praticado qualquer
  ato; o escritório afirma ter prestado serviços extensos e o gabinete do ministro nega comunicação com
  o banqueiro.
