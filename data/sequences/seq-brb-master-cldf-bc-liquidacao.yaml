description: Em 19/08/2025 a CLDF autoriza o BRB a comprar participação no Master; em setembro o Banco
  Central indefere a operação; em 17 e 18/11/2025 Vorcaro é preso e o BC decreta a liquidação. Os documentos
  oficiais (CLDF, ata do Comef, nota da PF) ligam os atos; a relação entre a rejeição do BC e a liquidação
  é objeto das investigações.
limits: A sequência não demonstra que a rejeição tenha causado a liquidação, nem que a autorização legislativa
  tenha sido obtida de forma irregular; a decisão do BC de setembro não foi lida na íntegra pela equipe.
