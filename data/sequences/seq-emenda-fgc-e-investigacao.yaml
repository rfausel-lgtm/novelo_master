description: A emenda que ampliava a cobertura do FGC foi apresentada em agosto de 2024 e rejeitada pelo
  relator; em maio de 2026 a PF, com autorização do STF, passou a investigar se o texto teria sido elaborado
  pela assessoria do Banco Master. O nexo documental existe (a decisão do STF cita a emenda), mas a autoria
  do texto é alegação da PF.
limits: Não se conclui que a emenda tenha sido escrita pelo banco nem que o senador tenha recebido vantagem
  por ela; ambas são hipóteses investigativas sob apuração, sem julgamento de mérito.
