description: Em petição com vinte anexos extraídos de seus sistemas, o liquidante sustenta que a prestação
  de contas do Estado do Amapá e da Amprev foi intempestiva, incompleta e desacompanhada de comprovação
  de depósito do lado do Estado, e que o valor devido no período seria três vezes maior que o declarado.
  Pede a intimação dos autores para complementar as contas em cinco dias e, subsidiariamente, a revogação
  da tutela ou a fixação de multa diária. O corpus não localizou decisão sobre esses pedidos.
