description: O Colegiado da CVM rejeitou por unanimidade a proposta de termo de compromisso de R$ 21,285
  milhões no processo sobre a terceira emissão de cotas do Brazil Realty FII — contrariando a recomendação
  do próprio Comitê de Termo de Compromisso, que havia sugerido aceitar. Foi a terceira proposta rejeitada,
  depois de R$ 1,5 milhão e R$ 3,8 milhões. O voto-vista cita como fatos supervenientes a liquidação do
  Banco Master, a prisão de Vorcaro e a Operação Compliance Zero. A área técnica estimou prejuízos individualizados
  em R$ 94,1 milhões.
