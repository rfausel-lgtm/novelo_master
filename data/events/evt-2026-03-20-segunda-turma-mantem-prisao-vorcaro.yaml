description: Por unanimidade, a Segunda Turma referendou a decisão do relator na PET 15556, mantendo a
  prisão preventiva de Daniel Vorcaro, Fabiano Zettel e Marilson Roseno da Silva; a medida foi excluída
  quanto a Luiz Phillipi Machado de Moraes Mourão em razão do falecimento. Gilmar Mendes ressalvou a possibilidade
  de reavaliar sua posição após manifestação da PGR ou conclusão das diligências.
