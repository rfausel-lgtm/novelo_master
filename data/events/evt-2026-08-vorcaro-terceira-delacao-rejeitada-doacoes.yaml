- tarcisio-de-freitas
description: Em depoimento de 27/08/2026, prestado na Papuda ao gabinete do relator André Mendonça, Vorcaro
  apresentou uma terceira proposta de delação premiada, rejeitada pela PF e pela PGR por 'ausência de
  fatos novos'. Nela, alegou que R$ 5 milhões doados por Fabiano Zettel em 2022 às campanhas de Tarcísio
  de Freitas e Jair Bolsonaro seriam contrapartida de um ajuste indevido com Gilberto Kassab para manter
  o programa Credcesta em vigor no governo paulista. Kassab negou veementemente qualquer tratativa sobre
  doações com Vorcaro ou Augusto Lima; a campanha de Tarcísio negou vínculo, citando mais de 600 doadores
  e conformidade com a legislação eleitoral. A alegação não foi corroborada por elemento novo, segundo
  os próprios investigadores.
