description: Segundo o relatório da PF sobre o celular de Vorcaro (IPJ-A 3298613/2026), na manhã de 26/12/2023
  Faria e Vorcaro trocaram mensagens sobre uma reunião ('Mesmo esquema entrar na garagem correto') e,
  uma hora após chegar ao local do segundo encontro, Faria compartilhou quatro contatos associados ao
  mesmo número, entre eles 'Alexandre de Moraes BRASILIA', salvo na agenda do banqueiro treze segundos
  depois. O documento registra o compartilhamento; a identidade do titular da linha e a ocorrência de
  encontro com o ministro são análises da PF, não verificadas de forma independente pela equipe.
