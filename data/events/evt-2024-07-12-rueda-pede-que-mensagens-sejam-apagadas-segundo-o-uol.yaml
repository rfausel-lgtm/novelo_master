id: evt-2024-07-12-rueda-pede-que-mensagens-sejam-apagadas-segundo-o-uol
kind: event
title: Rueda pede a Vorcaro que apague mensagens, segundo o UOL
event_type: communication
date: '2024-07-12'
date_precision: day
participant_ids:
- antonio-rueda
- daniel-vorcaro
- fernando-de-goes
description: >-
  Segundo o UOL (16/10/2026), às 11h45 de 12/07/2024 Antônio Rueda, que havia apagado dez mensagens seguidas na
  conversa, escreveu a Daniel Vorcaro pedindo que ele apagasse mensagens; cerca de uma hora depois, o diretor
  comercial do Master, Fernando Mascarenhas, escreveu a Vorcaro que o Amapá aprovara R$ 200 milhões "agora". A
  ata da 11ª Reunião Extraordinária do Comitê de Investimentos da Amprev registra a aprovação de R$ 200 milhões
  em letras do Master nesse dia, em reunião aberta às 10h49 e encerrada às 11h13 (ver evento correlato); a ata
  não menciona Rueda. O UOL não informa o fuso horário dos horários nem o que continham as mensagens apagadas.
  Rueda nega ter participado das negociações do Amapá e não comentou este ponto na nota publicada. Mensagem que
  exista no aparelho periciado não prova, por si, que o conteúdo seja verdadeiro.
