description: Em voto de 56 páginas no processo sobre as aplicações do regime próprio de Itaguaí, o conselheiro
  José Gomes Graciosa concluiu que o termo de credenciamento foi integralmente preenchido pelo próprio
  Banco Master, que toda a documentação comprobatória era formada unicamente por certidões e relatórios
  gerados e enviados pelo banco, sem qualquer consulta de iniciativa da autarquia, e que a análise durou
  menos de dois dias úteis. É a confirmação institucional, e independente da auditoria federal, do achado
  central da investigação.
