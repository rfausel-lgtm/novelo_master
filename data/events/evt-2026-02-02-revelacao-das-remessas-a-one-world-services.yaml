description: A Folha de S.Paulo publicou, e outros veículos reproduziram e confirmaram, que o banco então
  chamado Máxima remeteu US$ 531 milhões à One World Services entre dezembro de 2018 e abril de 2021,
  cerca de R$ 2,8 bilhões pela cotação da época da publicação. Segundo a Polícia Federal, foram 331 operações
  justificadas como aumento de capital de uma offshore da empresa em Miami, com apenas 15 dos documentos
  societários exigidos apresentados, e a empresa é investigada na Operação Colossus sob suspeita de destinar
  recursos a organizações criminosas. O banco respondeu que o tema foi objeto de acordo com o Banco Central
  encerrado na esfera administrativa, sem reconhecimento de irregularidade.
