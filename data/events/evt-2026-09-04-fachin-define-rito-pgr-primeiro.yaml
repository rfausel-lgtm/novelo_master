description: 'Fachin retirou a acusação de Moraes contra Mendonça do Inquérito das Fake News, avocando
  a análise à Presidência do STF, e sequenciou o prazo de cinco dias úteis já aberto (lote 28): primeiro
  a PGR avalia admissibilidade e regularidade do procedimento apresentado por Moraes, depois Mendonça
  se manifesta. O material que embasa a acusação de Moraes inclui um relatório de 50 páginas da PF (INQ
  4781) sobre a condução, por Mendonça, das tratativas de delação de Maurício Camisotti (Operação Sem
  Desconto) — no qual a PF alega, com confiança ''moderada'' sobre a ocorrência exata da fala, que Mendonça
  defendeu benefício fora das hipóteses legais.'
