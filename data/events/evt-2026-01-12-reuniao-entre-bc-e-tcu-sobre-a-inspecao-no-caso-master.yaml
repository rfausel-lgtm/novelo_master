    kind: public_note
    date: 2026-01-12
    summary: Em coletiva após o encontro, Vital do Rêgo disse, segundo a CNN Brasil, que "o Banco Central quer o
      selo de qualidade do TCU, a segurança jurídica que o TCU pode dar", e que o TCU não tem poder para
      reverter a liquidação.
