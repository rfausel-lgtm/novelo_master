description: Em 12/01/2026 o presidente do Banco Central, Gabriel Galípolo, recebeu o presidente do TCU, Vital
  do Rêgo, e o relator Jhonatan de Jesus. Segundo CNN Brasil e Agência Brasil, o encontro levou a entendimento
  para que a inspeção fosse feita pelos técnicos da AudBancos, com respeito ao sigilo bancário; segundo a
  Agência Brasil, restrita à documentação que embasou a liquidação. Segundo a CNN Brasil, os embargos do BC estavam
  previstos para o Plenário de 21/01.
