description: Segundo o Poder360, a emenda foi protocolada em agosto de 2024 como Emenda nº 11 à PEC 65/2023
  e propunha elevar a cobertura do FGC de R$ 250 mil para R$ 1 milhão por depositante; o relator Plínio
  Valério a rejeitou e ela não avançou. A PF sustenta, conforme comunicação oficial do STF de 07/05/2026,
  que o texto teria sido elaborado pela assessoria do Banco Master; trata-se de alegação sob investigação.
