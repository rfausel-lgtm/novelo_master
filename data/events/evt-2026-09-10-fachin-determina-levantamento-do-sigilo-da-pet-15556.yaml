description: No mesmo processo em que abrira de ofício, em 03/09/2026, apuração sobre a conduta da PF e o uso de
  credenciais de acesso institucional (PET 16.704), Fachin proferiu novo despacho em 10/09/2026 determinando a André
  Mendonça, relator, a remessa em HD de todos os procedimentos da PET 15.556 — a petição-mãe do caso Master, da
  qual a PET 16.662 foi extraída — a todos os gabinetes, e o levantamento do sigilo dela, ressalvadas apenas diligências
  pendentes que exijam sigilo para sua eficácia. A medida antecede em cinco dias a sessão extraordinária de 15/09/2026,
  que julgará o relatório da PF sobre as mensagens entre Moraes e Vorcaro e o pedido da PGR de nulidade desse relatório.
  Em cumprimento ao despacho, Mendonça anunciou no mesmo dia ter retirado o sigilo da PET 15.556 e de mais 14
  procedimentos relacionados. Mas às 23h53 do mesmo dia, o portal público do STF ainda exibia a PET 15.556 e a
  PET 15.978 (uma das 14) como 'Sigiloso' — só a PET 16.704, do próprio despacho de Fachin, aparecia como 'Público',
  o que descarta etiqueta travada. A discrepância entre o anúncio e o status ao vivo não foi reconciliada.
