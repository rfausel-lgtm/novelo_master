description: O Conselho Federal da OAB, sob a presidência de José Alberto Simonetti, em manifestação
  conjunta com dirigentes de 24 seccionais estaduais, pediu formalmente que o procurador-geral da República,
  Paulo Gonet Branco, se abstivesse de oficiar na Pet 16.662/DF, por ter sido pessoalmente chamado a prestar
  esclarecimentos na Pet 16.704/DF sobre os mesmos fatos — com base no art. 258 do CPP e no art. 27 da LC
  75/1993, que prevê a substituição pelo Vice-PGR. A OAB também pediu acesso aos elementos de prova reunidos
  na Pet 16.704/DF, inclusive sob sigilo, e a instauração de investigação sobre eventuais ilícitos penais
  "sem distinção em razão do cargo ou da função".
