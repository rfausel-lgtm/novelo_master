  - viviane-barci-de-moraes
description: Segundo o Poder360 (29/12/2025) e a Agência Brasil (30/12/2025), o procurador-geral Paulo Gonet
  arquivou, em despacho de 27/12/2025, a representação apresentada em 24/12/2025 pelo advogado Enio Martins
  Murad para investigar Alexandre de Moraes e a esposa, Viviane Barci de Moraes, a partir de reportagens sobre
  contatos do ministro com o presidente do BC, Gabriel Galípolo, e sobre o contrato do escritório Barci de
  Moraes com o Master. Gonet registrou a falta de lastro probatório mínimo, que a representação se baseia só
  em matérias jornalísticas e que, quanto ao contrato, não vê, a priori, ilicitude que justifique a
  intervenção da PGR. O despacho não foi lido na íntegra pelo Novelo.
