    by_id: paulo-gonet
    date: 2025-12-27
    summary: No despacho, segundo Poder360 e Agência Brasil, afirmou que a imprensa não apresentou elementos
      concretos ou indícios materiais, que o sigilo da fonte limita a apuração de relatos anônimos e que a
      ingerência em negócios jurídicos firmados entre particulares, no exercício da advocacia, foge ao escopo
      de atuação e à competência da Suprema Corte.
