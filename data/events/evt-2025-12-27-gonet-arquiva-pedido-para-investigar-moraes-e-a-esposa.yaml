id: evt-2025-12-27-gonet-arquiva-pedido-para-investigar-moraes-e-a-esposa
kind: event
title: Gonet arquiva pedido do advogado Enio Murad para investigar Alexandre de Moraes e Viviane Barci de Moraes
event_type: public_act
date: 2025-12-27
date_precision: day
participant_ids:
  - paulo-gonet
