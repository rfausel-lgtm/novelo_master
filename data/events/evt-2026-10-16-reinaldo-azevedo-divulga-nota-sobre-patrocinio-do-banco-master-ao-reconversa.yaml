description: Em nota enviada à TMC e publicada em 16/10/2026, o jornalista
  Reinaldo Azevedo afirmou que o Banco Master patrocinou o podcast Reconversa por meio da empresa Super, em
  contrato de março de 2024 de 12 parcelas de R$ 100 mil, das quais sete foram pagas, com valores declarados e
  impostos pagos; que os entendimentos foram feitos com a área comercial; que nunca escreveu em defesa do
  banco, que o podcast não servia aos interesses do banco e que jamais conversou com Daniel Vorcaro ou Fabiano
  Zettel. A nota responde a prints divulgados no mesmo dia, nas redes sociais, pelo influenciador Paulo Figueiredo, que os atribui a uma conversa de WhatsApp com Fabiano Zettel e que, segundo Brasil 247, mencionariam um suposto contrato relacionado ao jornalista. Os prints não foram autenticados nem, até 17/10/2026, checados por veículo de
  apuração própria localizado pelo Novelo; valem só como alegação atribuída a quem os divulgou, e o Novelo não
  reproduz o texto deles. Patrocínio contratado não é, por si, irregularidade.
