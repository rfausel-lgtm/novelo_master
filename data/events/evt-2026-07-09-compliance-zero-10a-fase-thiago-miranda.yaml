description: A PF cumpriu mandado de busca e apreensão contra o publicitário Thiago Miranda, autorizado
  por André Mendonça. A decisão cita o 'Projeto DV' (contratação de influenciadores e jornalistas para
  defender o Master e atacar o BC) e o levantamento de dados sigilosos de jornalistas (Malu Gaspar, Consuelo
  Dieguez) e executivos (Milton Maluhy, Renato Breia) a pedido de Vorcaro; até então Miranda não era tratado
  como investigado.
