description: Cerca de quatro meses após conhecer Vorcaro, Faria vendeu 90% de projeto eólico de 240 MW
  em Galinhos (RN), avaliado em R$ 75 milhões, por R$ 67,5 milhões, mantendo 10%. Segundo o UOL (via Oeste),
  a compradora foi a Super Empreendimentos e Participações, dirigida por Zettel; parte do pagamento foi
  um apartamento de R$ 50 milhões em São Paulo, revendido por R$ 54 milhões; a operação não foi formalizada
  na Junta Comercial nem na Receita e o projeto não avançou. Especialistas ouvidos pela piauí estimaram
  valor bem menor.
