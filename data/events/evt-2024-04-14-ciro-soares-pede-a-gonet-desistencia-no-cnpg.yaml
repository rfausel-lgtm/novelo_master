description: Segundo o IPJ-A 3298613/2026, o advogado Ciro Soares relatou a Daniel Vorcaro, por mensagem
  e áudio de WhatsApp, ter pedido a Paulo Gonet que convencesse um concorrente a desistir de candidatura
  à presidência do Conselho Nacional de Procuradores-Gerais em favor de outro nome — identificados pela
  imprensa, a partir de elementos externos ao laudo, como Georges Seigneur (MPDFT) e Jarbas Soares Júnior,
  então procurador-geral de Justiça de Minas Gerais. Segundo o áudio de Ciro Soares transcrito no laudo,
  Gonet teria confirmado a desistência na noite anterior. Jarbas Soares Júnior foi eleito por aclamação
  em 17/04/2024, três dias depois, para mandato de sete meses. O relatório da PF não localizou contato
  salvo como 'Gonet' no aparelho de Vorcaro e classifica a identificação como possível, não confirmada;
  a atribuição da ação a Paulo Gonet é alegação de Ciro Soares, relatada em segunda mão. Gonet, Ciro Soares
  e Jarbas Soares Júnior foram procurados pelo Poder360 e não responderam até a publicação da reportagem.
