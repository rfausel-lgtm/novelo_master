description: 'Dois dias depois da sessão interrompida por vista, a Presidência desfez a designação da sessão de
  23/09/2026 para a PET 16.704 — o procedimento que ela mesma autuou de ofício em 03/09 e que a imprensa vinha chamando
  de ''o caso Mendonça''. O fundamento é a própria questão de ordem pendente: se o Plenário decidir reunir e redistribuir
  os feitos, muda quem os relata. A pauta de 23/09 confirma o efeito prático — traz três processos, nenhum do caso
  Master. Não há nova data.'
