id: evt-2026-05-18-wagner-vende-terreno-de-camacari-a-lagoons
title: Jaques Wagner vende terreno de Camaçari à Lagoons, do Grupo City, por R$ 15,8 milhões em lotes e adiantamento
event_type: transaction
date: '2026-05-18'
date_precision: day
location: Camaçari (BA)
participant_ids:
- jaques-wagner
- lagoons-empreendimentos-spe
- alex-grangeon-trancoso-neves
- raul-aguirre-zegarra
description: Por escrituras lavradas em 18/05/2026, Jaques Wagner e Maria de Fátima Mendonça venderam à Lagoons
  Empreendimentos SPE 4,3844 ha do terreno comprado em 2000 por R$ 28 mil, pelo preço de R$ 15.834.129, pago com
  o adiantamento de R$ 2 milhões feito pela EC Bahia SAF em maio de 2025 e com 5.510,73 m² de lotes do condomínio
  planejado pelo Grupo City junto ao seu CT. A escritura foi levada a registro em 19/06/2026, dia seguinte à 9ª
  fase da Compliance Zero, e o cartório averbou a indisponibilidade da PET 16.230. Parte da área original confronta
  com terras declaradas de utilidade pública em 2014 para a Via Metropolitana.
evidence_class: D
