id: evt-2025-05-07-tjdft-vara-fazenda-liminar-suspende-assinatura-contrato-brb-master
kind: event
title: 1ª Vara da Fazenda Pública do DF concede liminar contra a assinatura do contrato do BRB para comprar
  parte do Master
event_type: judicial_decision
date: 2025-05-07
date_precision: day
participant_ids:
  - banco-de-brasilia-brb
  - banco-master
  - tribunal-de-justica-do-distrito-federal-e-dos-territorios
  - ministerio-publico-do-distrito-federal-e-territorios
description: Segundo nota do TJDFT publicada em 07/05/2025, a 1ª Vara da Fazenda Pública do DF concedeu
  liminar, em ação do MPDFT (processo 0721635-50.2025.8.07.0001), que suspende a assinatura do contrato
  definitivo do BRB para adquirir parte do Banco Master até a autorização prévia da assembleia de acionistas e
  a aprovação legislativa. Segundo a nota, o MPDFT argumentou que faltaram assembleia específica e autorização
  legislativa, requisitos que atribui à Lei das Estatais e à Lei Orgânica do DF, e o BRB alegou que a operação
  não é aquisição do controle total, o que dispensaria essas formalidades pela Lei 13.303/2016. A nota diz
  que, apesar das alegações do BRB, "persistem dúvidas importantes sobre a regularidade da transação", e
  reproduz do juízo o trecho "não se está a impedir que a parte Requerida proceda com os atos necessários e já
  previstos como preparatórios ao negócio almejado", afirmando que só a assinatura definitiva deveria
  aguardar. A nota diz que cabe recurso. É decisão liminar, sem julgamento final; a fonte é a nota de imprensa
  do tribunal, não o texto da decisão.
