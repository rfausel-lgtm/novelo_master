description: Segundo a representação da PF e a decisão de 13/05/2026, integrantes do núcleo 'A Turma' se deslocaram
  à Marina Bracuhy, em Angra dos Reis/RJ, para ameaçar Luís Felipe Woyceichoski, então capitão da embarcação usada
  por Daniel Vorcaro, e em seguida ao Hotel Nacional Inn para constranger o ex-chefe de cozinha Leandro Garcia.
  A cronologia descrita pela autoridade policial indica que, em 28/05/2024, Vorcaro encaminhou a Luiz Phillipi Mourão
  documentos das duas vítimas determinando 'levantamento de tudo' e que 'teriam que ir pra cima'. Woyceichoski relatou
  ter sido ameaçado de morte por cerca de sete homens, um dos quais se identificou como 'Manoel, amigo de Daniel
  Vorcaro, que mexia com jogo do bicho'; Leandro Garcia descreveu abordagem semelhante e reconheceu Manoel Mendes
  Rodrigues com elevado grau de certeza em procedimento formal de reconhecimento fotográfico (art. 226 do CPP).
  Tatiana Dantas Carta, chefe de comissários de bordo do Solar I, relatou ter sido abordada por seis a sete homens
  que procuravam pelo capitão. Woyceichoski, Garcia e Tatiana figuram no acervo como vítimas e testemunha, não como
  investigados.
