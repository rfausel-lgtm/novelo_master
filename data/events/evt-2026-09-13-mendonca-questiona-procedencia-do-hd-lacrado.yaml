description: 'Dois dias antes da sessão de 15/09, Mendonça admite não ter uma decisão que documente como o
  material do Ofício 33V/2026-CINQ/CGRC/DICOR/PF — o HD com a extração do celular de Vorcaro que está lacrado
  em seu gabinete desde março, alvo da disputa com Moraes, Zanin e Gilmar Mendes registrada no lote 265 — de
  fato chegou até ele. Pede que a Presidência intime os quatro delegados subscritores da representação
  original da Pet 15.556 a explicar as circunstâncias da entrega e relatar eventuais "constrangimentos" que
  tenham sofrido durante as investigações. No mesmo ato, recusa-se a incluir agora o conteúdo integral do
  celular de Vorcaro nos autos, por risco de tumultuar o julgamento.'
