description: Em resposta à crise aberta pela divulgação do relatório da PF (01/09), ao pedido de anulação
  de Gonet (01/09) e à decisão de Moraes contra Mendonça (mesmo dia), o presidente do STF abriu procedimento
  formal exigindo explicações por escrito, em até cinco dias úteis, de Alexandre de Moraes, André Mendonça,
  Paulo Gonet e do diretor-geral da PF, Andrei Rodrigues — inclusive sobre observância do art. 33 da LOMAN
  e eventual uso indevido de credenciais institucionais para acesso a material privado. Adiou para a segunda
  quinzena de setembro a sessão plenária sobre o tema. Nenhum dos citados se manifestou publicamente sobre
  a determinação até a data desta atualização.
