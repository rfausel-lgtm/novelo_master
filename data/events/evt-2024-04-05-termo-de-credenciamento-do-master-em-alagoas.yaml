description: A Alagoas Previdência credenciou o Banco Master e publicou o termo em seu portal de transparência
  — a única cópia localizada em acesso aberto. O campo destinado a registrar a análise técnica do regime
  próprio contém texto promocional, com as expressões exatas que a auditoria do Ministério da Previdência
  identificou como idênticas nos termos da Amapá Previdência, de Itaguaí, de Aparecida de Goiânia e de
  Congonhas. Assinam pelo banco André Kruschewsky Lima e Alberto Felix de Oliveira Neto — este último
  o mesmo executivo que, um mês antes, apresentara a instituição ao comitê de investimentos do Amapá.
