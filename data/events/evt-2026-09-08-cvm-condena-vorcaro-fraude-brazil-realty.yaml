description: O colegiado da CVM, por unanimidade e sob relatoria do diretor João Accioly, condenou Daniel
  Vorcaro, Henrique Vorcaro (pai), Felipe Cançado Vorcaro (primo), o Banco Master, Benjamim Botelho de
  Almeida, Antônio Carlos Freixo Júnior, a Viking Participações, a Entre Investimentos, a Sefer Investimentos
  e outros acusados por operação fraudulenta na 3ª emissão de cotas do Brazil Realty FII, com multas somando
  entre R$ 201 e R$ 201,5 milhões (divergência entre fontes não reconciliada). Três ex-diretores da Sefer
  foram absolvidos. Os termos de compromisso propostos pelos acusados foram rejeitados. É processo autônomo
  da CVM, distinto da Operação Compliance Zero.
