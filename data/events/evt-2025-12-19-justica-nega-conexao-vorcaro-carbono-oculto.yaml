description: 'O juiz Sandro Nogueira Leite negou o pedido de Vorcaro para que as investigações da Operação
  Carbono Oculto (PCC) e da Operação Quasar fossem remetidas ao STF por conexão com o caso Master, afastando
  expressamente essa conexão ''por agora''. É um registro relevante para não superdimensionar a ligação
  entre os dois casos: a Carbono Oculto é, em seu núcleo, investigação distinta, sobre fraude de combustíveis
  e lavagem ligada ao PCC — a sobreposição real com o ecossistema Master ocorre por vias indiretas, via
  gestoras de nicho como a Reag e a Trustee, não por identidade entre os dois esquemas.'
