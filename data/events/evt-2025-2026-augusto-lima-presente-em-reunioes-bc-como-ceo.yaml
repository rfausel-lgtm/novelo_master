description: Registros oficiais do Banco Central mostram Augusto Lima presente em pelo menos 7 a 8 reuniões
  com o órgão ao longo de 2025, identificado como 'CEO do Master' — apesar de sua saída formal da sociedade,
  anunciada em maio de 2024, com a transferência de 33,3 milhões de ações ordinárias (18,62% do capital)
  a Daniel Vorcaro. A discrepância entre a saída anunciada e a presença continuada em reuniões oficiais
  não foi explicada publicamente por Lima, pelo Master ou pelo Banco Central até a data desta atualização.
