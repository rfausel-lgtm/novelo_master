description: Relatório do Coaf enviado à CPI do Crime Organizado, revelado pelo Estadão, aponta repasses
  de R$ 140,1 milhões do Estado da Bahia à ASSEBA entre maio de 2024 e novembro de 2025, com R$ 101,3
  milhões seguindo para o Banco Master e R$ 21,7 milhões para empresas de Augusto Lima. O órgão classifica
  o fluxo como atípico. O governo baiano nega a caracterização, sustentando tratar-se de descontos em
  folha de taxa de associação autorizados pelos próprios servidores.
