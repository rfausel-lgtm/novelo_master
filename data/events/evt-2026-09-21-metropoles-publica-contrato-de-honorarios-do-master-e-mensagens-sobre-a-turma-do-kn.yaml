- daniel-vorcaro
description: >-
  Em 21/09/2026, o Metrópoles (coluna de Andreza Matais) publicou, e a CNN Brasil, que diz ter obtido o documento,
  relatou no mesmo dia, a existência de contrato entre o Banco Master e o escritório Queiroga, Vieira, Queiroz
  & Ramos Advocacia, do qual a advogada Camilla Ramos é sócia segundo a Agência Brasil e o Times Brasil, com
  honorários de êxito de 5% líquidos sobre o que o banco recebesse em 12 ações do setor sucroalcooleiro; pelo
  cálculo do Metrópoles sobre o valor de face das causas (cerca de R$ 8,5 bilhões), os honorários chegariam a
  R$ 427 milhões, valor devido apenas em caso de êxito. Camilla Ramos é casada com o desembargador federal Newton
  Ramos (TRF-1), segundo nota dele. Segundo o Metrópoles e a CNN Brasil, mensagens de assessores de Vorcaro, em
  material extraído do celular do banqueiro e enviado pela PF ao STF, referem-se ao casal como "Turma do KN"; as
  reportagens leem a sigla como referência ao ministro Kassio Nunes Marques (o Times Brasil atribui a leitura à
  PF), e nenhum documento acessível ao Novelo confirma essa leitura. O ministro não é parte do contrato. O
  conteúdo das mensagens, privado e em material não público, não é reproduzido. O escritório declarou ter o
  contrato em nota de 23/09 e afirma não ter recebido pagamento; Nunes Marques nega ter votado a favor de Vorcaro
  ou do Master, e Newton Ramos afirma nunca ter julgado causa de interesse do banco.
evidence_class: C
status: disputed
