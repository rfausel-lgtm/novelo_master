id: evt-2026-09-21-metropoles-publica-contrato-de-honorarios-do-master-e-mensagens-sobre-a-turma-do-kn
kind: event
title: Metrópoles noticia contrato de honorários de até R$ 427 mi, condicionado a êxito, entre o Master e o escritório de Camilla Ramos, e mensagens que citam a “Turma do KN”
event_type: publication
date: '2026-09-21'
date_precision: day
participant_ids:
- banco-master
- queiroga-vieira-queiroz-e-ramos-advocacia
