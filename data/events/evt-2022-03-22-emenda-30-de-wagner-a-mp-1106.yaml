description: O senador Jaques Wagner apresentou a Emenda nº 30 à Medida Provisória 1.106/2022, propondo
  que as taxas de juros de todas as modalidades de crédito consignado não excedessem 300% da taxa média
  do CDI. É dispositivo restritivo, e não de ampliação de margem, e não foi incorporado ao texto final
  da Lei 14.431/2022. O registro corrige leitura corrente na imprensa, que atribui à emenda conteúdo favorável
  ao Banco Master.
