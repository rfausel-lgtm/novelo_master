description: 'Em manifestação assinada digitalmente às 19h27 de 01/09/2026 (ASSCRIM/PGR nº 1428987/2026),
  em resposta ao despacho de 31/08/2026, o procurador-geral da República sustentou dupla nulidade da ordem
  que levou a Polícia Federal a investigar o destinatário das mensagens de Vorcaro: excesso de competência
  do relator na fase pré-processual, e usurpação da competência exclusiva do Plenário para investigar
  ministro do STF. Pediu que André Mendonça reconhecesse a nulidade e extinguisse a Petição 16.662. Não
  há, até a última atualização, decisão do relator sobre o pedido.'
