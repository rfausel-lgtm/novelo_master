id: evt-2026-10-16-uol-publica-mensagens-de-vorcaro-sobre-a-captacao-de-fundos-estaduais-de-previdencia
kind: event
title: UOL publica mensagens de Vorcaro sobre a captação de fundos estaduais de previdência que citam Rueda e ACM Neto
event_type: publication
date: '2026-10-16'
date_precision: day
