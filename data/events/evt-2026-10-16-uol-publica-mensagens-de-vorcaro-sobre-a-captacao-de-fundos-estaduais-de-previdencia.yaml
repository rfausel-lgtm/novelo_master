description: >-
  Em 16/10/2026 o UOL publicou mensagens de WhatsApp que diz terem sido extraídas pela Polícia Federal do
  celular de Daniel Vorcaro, citadas de novembro de 2023 a julho de 2025, sobre a captação de recursos de
  institutos estaduais de previdência pelo Banco Master. O UOL ressalva que as mensagens não mostram pagamento
  de comissão diretamente a Antônio Rueda nem a ACM Neto. Segundo o UOL, as mensagens registram contatos do
  presidente nacional do União Brasil, Rueda, com Vorcaro e com o diretor comercial do banco, Fernando
  Mascarenhas; jatos e hospedagem em hotel em São Paulo oferecidos a Rueda; a apresentação a Vorcaro da
  contratação do escritório Rueda & Rueda Advogados em quatro ações (R$ 15,4 milhões); uma lista de captações
  em andamento em 12/07/2024 (Amapá, Rio de Janeiro, Amazonas, Campos dos Goytacazes, Maricá, Belo Horizonte e
  Alagoas); a comissão de uma consultoria de terceiros, atribuída a Ricardo Siqueira Rodrigues, pela operação do
  Amapá, e o registro, em 01/08/2024, de R$ 11 milhões como "comissão Amapá"; e encontros de ACM Neto e Rueda
  com Vorcaro em 2024. A comissão de 10% a Rueda e ACM Neto continua sendo alegação da terceira proposta de
  colaboração de Vorcaro, rejeitada pela PF e pela PGR segundo o UOL. Os valores da lista são de operações em
  negociação, não de transferências. Rueda diz que a relação com o Master era "eminentemente profissional", que
  os serviços do escritório foram advocatícios, com notas fiscais, nega ter participado da viagem de novembro
  de 2023 e das negociações do Amapá e lamenta o uso político de trechos isolados; ACM Neto diz que os
  vazamentos são "seletivos, manipulados e fora de contexto", que nunca atuou para que institutos aplicassem
  no Master e que não conhece Fabiano Zettel. Segundo o UOL, a PF pediu buscas em endereços ligados aos dois e
  a operação não chegou a ser autorizada pelo STF. O UOL não informa a Pet, o relatório ou a decisão de que as
  mensagens teriam saído, e o Novelo não localizou documento oficial nem a decisão sobre as buscas. Mensagem
  que exista no aparelho periciado não prova, por si, que o conteúdo seja verdadeiro.
