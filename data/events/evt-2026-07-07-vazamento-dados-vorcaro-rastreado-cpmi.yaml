description: A Polícia Federal concluiu, com 'elevado grau de certeza técnica', que vazamentos de dados
  sigilosos de Daniel Vorcaro — incluindo conversas privadas com Martha Graeff — têm origem no material
  que havia sido disponibilizado à CPMI do INSS. O responsável não havia sido identificado até a data
  da reportagem; a PF pretendia requerer ao ministro Mendonça imagens do circuito de segurança do Congresso
  e registros de acesso à 'sala-cofre' onde o material ficava guardado.
