description: 'Daniel Vorcaro, investigado e preso preventivamente, prestou depoimento à PF em 15/10/2026, uma
  quinta-feira, presencialmente, na unidade onde está preso, sobre as operações entre o Banco Master e o BRB.
  Um vídeo de 2h28 do depoimento foi divulgado pelo Poder360 em 29/10, que diz tê-lo tornado público e
  encaminhado ao STF. O que segue é alegação de Vorcaro, atribuída. Segundo a CNN Brasil e o Poder360, ele
  negou irregularidade ("Fraude não teve", na transcrição da CNN), disse que "A crise do BRB não foi causada
  por mim" e a atribuiu à liquidação do Master e à sua prisão, citando saques de R$ 9 bilhões. Disse que nem o
  BRB nem clientes perderam dinheiro, que as carteiras questionadas foram substituídas por outros ativos e,
  com a analogia de uma promessa de compra de casa, que a negociação original não se concluiu. Segundo a CNN,
  reconheceu problemas com carteiras ligadas à Tirreno. Pediu perícia independente, o arquivamento do caso e a
  soltura. Sobre imóveis de cerca de R$ 146 milhões, disse que seriam para moradia de Paulo Henrique Costa se
  a fusão ocorresse ("Eu não prometi imóvel para ele"); segundo a CNN, que seriam cedidos em comodato; segundo
  o Poder360, que a reorganização não se concluiu e que Costa nunca morou neles. A posição da PF tem o mesmo
  peso: segundo o Poder360, a delegada contestou que a troca posterior de ativos afaste a necessidade de
  apurar a negociação original; no relatório parcial de 28/10/2026, já registrado no acervo, a PF indiciou
  Vorcaro, Costa e outras pessoas. Indiciamento não é denúncia nem condenação. A defesa de Vorcaro, em nota de
  15/10, sustentou que não houve prejuízo ao BRB e pediu o arquivamento e a revogação da prisão. Data: a CNN
  escreve 15 de setembro; Poder360, Rádio Itatiaia e Correio da Manhã informam 15/10/2026, data registrada
  aqui.'
