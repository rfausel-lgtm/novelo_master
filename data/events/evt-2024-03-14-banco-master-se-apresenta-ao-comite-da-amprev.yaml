description: 'Quatro meses antes das aplicações, o próprio Banco Master solicitou reunião com o Comitê
  de Investimentos da Amapá Previdência. Paula Vouguinha, de relações institucionais, e Alberto Félix
  Oliveira, tesoureiro, apresentaram a instituição e descreveram em números a captação institucional montada
  desde novembro de 2023: cinco clientes, quarenta credenciamentos em andamento e R$ 700 milhões já captados.
  Recomendaram o prazo de dez anos como o de melhor taxa e sustentaram que o banco não precisaria constar
  da lista exaustiva da Secretaria de Previdência. É o registro documental do canal de colocação — a evidência
  de que a compra de letras do Master por dezoito regimes próprios em todo o país não foi uma soma de
  decisões locais independentes, mas o resultado de uma operação de captação deliberada e datada.'
