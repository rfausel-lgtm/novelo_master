description: 'Dois dias após o levantamento do sigilo da PET 16.662, o presidente do STF abriu de ofício
  novo procedimento com fundamento no dever de velar pelas prerrogativas do Tribunal. O objeto desloca
  o eixo da controvérsia: além do cumprimento da Lei Orgânica da Magistratura em relação a autoridades
  com foro, apura eventuais indícios de uso de credenciais de acesso institucional para avaliar documento
  estritamente particular e de revelação de informação sob sigilo judicial a pessoa investigada, as circunstâncias
  do despacho que determinou a identificação das pessoas mencionadas e as medidas de controle externo
  da atividade policial. Prazo comum de cinco dias úteis.'
