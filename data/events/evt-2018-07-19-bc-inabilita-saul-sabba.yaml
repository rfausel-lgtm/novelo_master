- banco-central-do-brasil
- banco-master
description: 'Em sessão de 19/07/2018, o Banco Central aprovou por unanimidade a inabilitação de Saul
  Dutra Sabbá para atuar como administrador de instituições financeiras, por conduzir os negócios do Banco
  Máxima em desacordo com a regulamentação: simular valorização de investimento em controlada para reduzir
  prejuízos contábeis e prestar informações incorretas ao BC, de forma intencional e sistemática, para
  ocultar grave insuficiência de capital. A decisão é de onze meses após Vorcaro contratar a compra do
  controle e quinze meses antes de o mesmo Banco Central aprovar a transferência.'
