description: >-
  Segundo o SBT News (Coluna da Basília) e a Agência Estado, em 29/09/2026 o ministro Gilmar Mendes enviou
  ofícios aos presidentes do STF, Edson Fachin, e do STJ, Luís Felipe Salomão, sobre a expedição de
  precatórios. Segundo os dois veículos, o decano defendeu "sustar todas as decisões que determinaram
  indevidamente a expedição de precatório antes do trânsito em julgado" e uma correição extraordinária da
  Corregedoria Nacional de Justiça em todos os tribunais regionais federais, sobretudo no TRF-1, com atenção aos
  precatórios do setor sucroalcooleiro e da revisão da tabela do SUS; segundo a Agência Estado, cobrou também do
  Banco Central e da CVM a apuração de como esses créditos chegaram a fundos de investimento e a balanços de
  bancos. Os dois veículos atribuem ao ofício a afirmação de que as investigações sobre o Banco Master
  "revelaram um modelo de negócios parasitário, que drenava recursos públicos e a poupança de milhares de
  investidores". Os ofícios não foram publicados nem localizados pelo Novelo; não se localizou resposta de
  Fachin ou de Salomão.
