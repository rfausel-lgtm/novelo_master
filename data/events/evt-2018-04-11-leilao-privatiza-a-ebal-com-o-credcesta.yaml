description: Após dois leilões fracassados com lance mínimo de R$ 81 milhões, a Empresa Baiana de Alimentos
  foi arrematada por R$ 15 milhões, com 49 lojas da Cesta do Povo, por concorrente único — a NGV Empreendimentos
  e Participações. No lote ia embutido o programa CredCesta, com acesso à folha de cerca de 280 mil servidores,
  aposentados e pensionistas do Estado. O direito de operar essa folha nunca foi objeto de licitação própria.
  As dívidas da estatal permaneceram com o Estado, que pagou R$ 93 milhões entre 2019 e 2026 — 6,2 vezes
  o preço de venda.
