id: evt-2026-09-22-corregedor-nacional-cancela-16-precatorios-do-trf-1-no-pp-0007917-89
kind: event
title: Corregedor Nacional de Justiça manda cancelar 16 precatórios do TRF-1 (R$ 4,74 bi) em pedido de providências da AGU; a decisão não cita o Master
event_type: judicial_decision
date: '2026-09-22'
date_precision: day
participant_ids:
- benedito-goncalves
- conselho-nacional-de-justica
- advocacia-geral-da-uniao
- tribunal-regional-federal-da-1a-regiao
description: >-
  Em 22/09/2026 (assinatura eletrônica às 23h37; notícia oficial do CNJ em 23/09), o corregedor nacional de
  Justiça, ministro Benedito Gonçalves, deferiu cautelar no Pedido de Providências nº 0007917-89.2026.2.00.0000
  (requerente: AGU; requerido: TRF-1) para suspender os efeitos de decisões da Presidência do TRF-1 nas SLS
  1010037-93.2026.4.01.0000, 1010048-25.2026.4.01.0000 e 1010055-17.2026.4.01.0000, restabelecer decisões de
  10/09/2026 da 6ª Vara Federal Cível da SJDF e determinar o cancelamento, em cinco dias, de 16 precatórios
  (R$ 4.738.065.026,73) das beneficiárias Companhia Açucareira Usina Capricho, Una Agroindustrial S/A e
  Companhia Açucareira Vale do Ceará Mirim, com devolução dos valores à Conta Única do Tesouro Nacional e vedação
  de levantamentos e de destaque de honorários até a restituição. Fundamento: precatórios expedidos antes do
  trânsito em julgado da fase de execução e acórdão do Plenário do CNJ no PP 0003764-47.2025.2.00.0000. A
  decisão registra levantamento de R$ 16.129.427,04 em 31/07/2026 na conta do Precatório 866/2022 e pede
  informações sobre ele; afirma que a devolução não extingue nem reduz o crédito. A decisão e a notícia oficial
  do CNJ não mencionam o Banco Master nem Daniel Vorcaro. Segundo o SBT News e o Times Brasil, as três
  empresas constam de lista com o título "precatórios a receber" encontrada no celular de Vorcaro; o Novelo não
  localizou essa lista. A medida foi submetida a referendo do Plenário do CNJ, que não está na pauta da 15ª
  Sessão Virtual (08 a 16/10/2026).
