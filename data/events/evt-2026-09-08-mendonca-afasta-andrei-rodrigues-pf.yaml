description: 'André Mendonça, na Pet 16.662, determinou o afastamento cautelar por 90 dias de Andrei Rodrigues
  e Leandro Almada da Costa. LEITURA INTEGRAL DA DECISÃO PELA EQUIPE (33 páginas): o fundamento real,
  contrário ao que a cobertura de imprensa sugeria, não são as alegações de corrupção do Partido Novo
  (baseadas no depoimento de Vorcaro) — Mendonça as reserva expressamente para momento posterior. O fundamento
  é a produção, pela PF, de um relatório de inteligência apócrifo monitorando o próprio Mendonça e o Advogado-Geral
  da União por mais de 30 dias, que chegou a Alexandre de Moraes e embasou a acusação dele contra Mendonça.
  William Marcel Murad assumiu interinamente. A decisão foi submetida a referendo da 2ª Turma, com Nunes
  Marques e Fux acompanhando Mendonça e Gilmar Mendes pedindo vista. A AGU anunciou recurso, por entender
  que a nomeação/exoneração do diretor-geral da PF é prerrogativa do Presidente da República, mas orientou
  cumprimento enquanto contesta.'
