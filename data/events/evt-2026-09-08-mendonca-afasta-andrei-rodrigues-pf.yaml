description: André Mendonça, na Pet 16.662, determinou o afastamento cautelar por 90 dias de Andrei Rodrigues
  e Leandro Almada da Costa, sob alegação de monitoramento ilícito do próprio ministro pela PF. É a concessão,
  cinco dias depois, de pedido que o partido Novo já havia protocolado em 03/09/2026 (prisão preventiva
  e afastamento cautelar). William Marcel Murad assumiu interinamente. A decisão foi submetida a referendo
  da 2ª Turma, com Nunes Marques e Fux acompanhando Mendonça e Gilmar Mendes pedindo vista — portanto
  ainda não referendada de forma definitiva pelo colegiado. A AGU anunciou recurso, por entender que a
  nomeação/exoneração do diretor-geral da PF é prerrogativa exclusiva do Presidente da República (Lei
  9.266/1996), mas orientou cumprimento da decisão enquanto contesta.
