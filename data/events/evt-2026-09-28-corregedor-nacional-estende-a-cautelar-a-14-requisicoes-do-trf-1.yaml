id: evt-2026-09-28-corregedor-nacional-estende-a-cautelar-a-14-requisicoes-do-trf-1
kind: event
title: Corregedor Nacional estende a cautelar a mais 14 requisições de precatórios do TRF-1 (R$ 1,88 bi nas datas-base)
event_type: judicial_decision
date: '2026-09-28'
date_precision: day
participant_ids:
- benedito-goncalves
- conselho-nacional-de-justica
- advocacia-geral-da-uniao
- tribunal-regional-federal-da-1a-regiao
description: >-
  Em 28/09/2026 (assinatura às 08h41), no PP 0007917-89.2026.2.00.0000, o corregedor nacional deferiu pedido de
  aditamento da União e estendeu a cautelar de 22/09 aos Cumprimentos de Sentença 0017910-79.2008.4.01.3400,
  0017882-14.2008.4.01.3400 e 0017886-51.2008.4.01.3400, que têm como partes a Companhia Agroindustrial Santa
  Helena, a Agrovale Companhia Agroindustrial Vale do Curu S/A e a Borborema Agro Industrial Ltda., derivados do
  mesmo título. Determinou o cancelamento em cinco dias de 14 requisições (R$ 1.877.143.674,66 nas datas-base,
  depositados em 26/12/2023) e a restituição com rendimentos, vedou levantamentos e novas requisições sem
  trânsito em julgado e pediu informações em cinco dias. O fato novo apontado pela União foi decisão de
  23/09/2026 da Presidência do TRF-1 na SLS 1010050-92.2026.4.01.0000. A Santa Helena manifestou-se nos autos
  contra o aditamento, alegando preclusão; a decisão rejeitou a alegação e registra que não examina a
  existência ou a extensão do crédito. A decisão e a notícia oficial do CNJ não mencionam o Banco Master nem
  Daniel Vorcaro, e nenhuma fonte aberta liga estas três empresas ao Master.
