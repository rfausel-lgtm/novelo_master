id: evt-2026-11-10-brb-informa-ter-ajuizado-acao-de-responsabilidade-civil-contra-ex-administradores
kind: event
title: BRB informa ter ajuizado ação de responsabilidade civil contra sete ex-gestores e ter pedido liminar
  de indisponibilidade de bens (alegação do autor)
event_type: corporate_act
date: 2026-11-10
date_precision: day
participant_ids:
  - banco-de-brasilia-brb
  - paulo-henrique-costa
  - dario-oswaldo-garcia-junior
  - marcelo-talarico
  - diogo-ilario-de-araujo-oliveira
description: "Em fato relevante de 10/11/2026, o BRB informou ter ajuizado nessa data ação social de
  responsabilidade civil, com base nos arts. 158 e 159 da Lei 6.404/1976. Segundo o banco, o ajuizamento foi
  autorizado pelos acionistas na assembleia geral extraordinária de 24/08/2026, registrada no acervo no evento
  dessa data. Os demandados, segundo o BRB, são sete ex-administradores: Paulo Henrique Costa, Dário Oswaldo
  Garcia Júnior, Marcelo Talarico, Diogo Ilário de Araújo Oliveira e outros três ex-gestores; a demanda também
  contempla seis empresas, com “pedidos de natureza patrimonial”. O objeto, diz o banco, é apurar
  responsabilidades e reparar danos patrimoniais que alega ter sofrido em aquisições de carteiras de crédito
  do Banco Master e de sociedades relacionadas em 2025. O valor da causa é de R$ 1 milhão “para fins
  processuais”; segundo o BRB, não representa quantificação dos danos, a ser feita em fase processual própria.
  O BRB disse ter pedido, em caráter liminar, a indisponibilidade de bens dos ex-administradores demandados e
  de seis imóveis em São Paulo e Brasília, de titularidade formal dessas empresas. Tudo isso é alegação do autor da ação. O acervo
  não localizou decisão sobre o pedido liminar até 12/11/2026. Número do processo, vara e juízo não foram
  divulgados no comunicado. O BRB ressalva que a ação é cível, com tramitação independente das esferas
  criminal, administrativa e de controle, e que o ajuizamento “não implica juízo antecipado sobre a
  responsabilidade dos demandados”, a ser apurada com contraditório e ampla defesa. Manifestação dos
  demandados sobre a ação não foi localizada até 12/11/2026."
