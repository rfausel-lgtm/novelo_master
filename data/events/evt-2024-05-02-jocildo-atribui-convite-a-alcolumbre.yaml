description: 'Dois meses antes das deliberações que levaram R$ 400 milhões da previdência estadual ao
  Banco Master, o diretor-presidente da Amprev descreveu publicamente, em pronunciamento reproduzido pelo
  site oficial da própria autarquia, uma arquitetura de dois atos: a nomeação formal pelo governador Clécio
  Luís e o convite pelo senador Davi Alcolumbre. O senador nega ter participação em nomeações ou decisões
  da entidade.'
