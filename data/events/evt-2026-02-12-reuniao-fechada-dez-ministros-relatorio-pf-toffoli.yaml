description: 'Reunião fechada dos dez ministros do STF (uma vaga aberta desde a saída de Barroso), em duas
  etapas, para discutir relatório de 200 páginas da PF que investigava a permanência de Dias Toffoli como
  relator do caso Banco Master. Segundo apuração do Poder360, o placar antes da solução negociada era de 8
  votos pela permanência de Toffoli (Moraes, André Mendonça, Zanin, Dino, Gilmar Mendes, Fux, Nunes Marques e
  o próprio Toffoli) contra 2 (Cármen Lúcia e Fachin); Flávio Dino, classificando o relatório como "lixo
  jurídico", propôs a solução final: nota de apoio assinada pelos dez ministros, em troca da qual Toffoli
  encaminharia voluntariamente o processo para redistribuição. No mesmo dia, o STF divulgou nota oficial
  reconhecendo a validade dos atos praticados por Toffoli na relatoria e expressando apoio pessoal a ele; o
  caso foi redistribuído a André Mendonça.'
