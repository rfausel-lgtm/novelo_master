description: Convocado como testemunha para depor em 04/03/2026, Vorcaro teve o depoimento cancelado no
  mesmo dia por sua prisão preventiva, decretada horas antes pelo relator André Mendonça por suposto risco
  de obstrução. Mendonça decidiu então que o comparecimento de Vorcaro à CPI passaria a ser facultativo,
  por tratá-lo como investigado, e não testemunha. A CPI recorreu à Segunda Turma do STF em 10/03/2026,
  sustentando que a convocação original era como testemunha. A equipe editorial não localizou decisão
  colegiada final sobre o recurso nem registro de que Vorcaro tenha, em algum momento, efetivamente depoido
  à comissão antes de seu encerramento em 14/04/2026 sem relatório aprovado.
