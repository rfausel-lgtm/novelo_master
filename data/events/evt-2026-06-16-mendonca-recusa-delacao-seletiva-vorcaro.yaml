location: Segunda Turma do STF
description: 'Durante sessão de julgamento da Segunda Turma (que manteve a prisão preventiva do pai e do
  primo de Daniel Vorcaro), o relator André Mendonça relatou ter recebido, por meio de advogado de Vorcaro,
  proposta de "delação premiada seletiva": "Perderam o pudor. ''Queremos fazer uma delação seletiva''.
  Falaram na minha face isso... Não faço questão de delação. Agora, delação seletiva, comigo não." Gilmar
  Mendes reagiu: "Está tudo muito invertido" — a tratativa deveria ir à Polícia Federal ou à PGR, não ao
  relator. Na mesma semana, PF e PGR rejeitaram uma segunda proposta de delação de Vorcaro, por não trazer
  nada além do já apurado.'
