description: Um dia após a 9ª fase da Compliance Zero, André Mendonça deferiu a representação da PF por medidas
  assecuratórias e decretou a constrição de bens de 27 alvos, com tetos individuais de R$ 5.955.250, R$ 3,5 milhões
  ou R$ 2.455.250 conforme o eixo investigado — o apartamento do Poème Horto e a transferência da PKL One à BN Financeira
  —, além da indisponibilidade da unidade 1.702. A decisão registra as hipóteses da PF em juízo preliminar, sem
  exame de mérito, e foi tomada contra o parecer da PGR, que se opusera à medida assecuratória. Os bloqueios foram
  executados a partir de 22/06/2026.
