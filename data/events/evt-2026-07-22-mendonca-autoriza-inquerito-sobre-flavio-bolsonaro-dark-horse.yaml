description: 'A PF representou pela apuração de lavagem de dinheiro, evasão de divisas, corrupção e organização
  criminosa no financiamento internacional de "Dark Horse", citando Flávio Bolsonaro como interlocutor direto
  de Daniel Vorcaro — não apenas terceiro mencionado — em mensagens que vão de dezembro/2024 a novembro/2025,
  incluindo cobranças de pagamento e um recado de véspera da prisão do banqueiro ("Irmão, estou e estarei
  contigo sempre..."). Também descreve um print atribuído a Eduardo Bolsonaro com instruções sobre gestão de
  recursos nos EUA. Mendonça autorizou a instauração em 22/07/2026, com anuência da PGR; o feito, antes Pet
  16.369, foi reautuado como INQ 5.070 em 06/08/2026.'
