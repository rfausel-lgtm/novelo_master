kind: event
title: Deputados do PT apresentam ao STF notícia de fato pedindo a investigação de Nunes Marques, segundo a imprensa
event_type: public_act
date: '2026-10-12'
date_precision: day
participant_ids:
- nunes-marques
- supremo-tribunal-federal
description: >-
  Em 12/10/2026, segundo o Poder360 e o Times Brasil (este com base na coluna de Mônica Bergamo, da Folha de
  S.Paulo), os deputados federais Rui Falcão (PT-SP) e Rogério Correia (PT-MG) apresentaram ao STF notícia de fato
  pedindo a investigação do ministro Nunes Marques, presidente do TSE, por possíveis vínculos com o grupo do Banco
  Master, a remessa à PGR e a distribuição ao Plenário ou a ministro sem impedimento ou suspeição. Segundo os
  veículos, a petição cita o contrato de honorários do escritório de Camilla Ramos, a expressão "Turma do KN" e o
  julgamento da Destilaria Alcídia (ARE 1.327.995), e enquadra os fatos em tipos penais que são formulação dos
  autores; o Poder360 registra que as suspeitas dependem de apuração. Número e distribuição da petição não
  localizados.
