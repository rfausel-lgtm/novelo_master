description: Registros de controle de acesso do Gabinete de Segurança Institucional, obtidos por Lei de
  Acesso à Informação, documentam entradas de Daniel Vorcaro no Palácio do Planalto em 04/12/2023 às 15h42,
  01/03/2024 às 14h33 e 03/04/2024 às 17h29, e de seu pai, Henrique Moura Vorcaro, em 06/11/2024. O Planalto
  afirmou que essas entradas não corresponderam a reuniões com o presidente ou com ministros. A reunião
  de 04/12/2024 com Lula, essa sim confirmada, não consta nem dos registros de acesso nem da agenda oficial,
  e a Secom não explicou a ausência.
