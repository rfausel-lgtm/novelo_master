description: 'Fase intermediária da Operação Transparência: o Min. Flávio Dino bloqueou R$ 119.216.703,15
  em bens de Valdemar Costa Neto (presidente nacional do PL) e suspendeu despesas públicas ligadas a 21
  emendas parlamentares que a PF aponta como forjadas e desviadas em seu benefício, executadas por
  servidores da Câmara — Mariângela Fialek, Garigham Amarante Pinto e Nara Brum. Proibiu Fialek de exercer
  atividades ligadas a emendas parlamentares.'
