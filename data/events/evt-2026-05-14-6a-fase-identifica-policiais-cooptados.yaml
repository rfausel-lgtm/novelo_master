description: A 6ª fase da Operação Compliance Zero, autorizada por André Mendonça, nomeou o núcleo de
  policiais e ex-policiais que, segundo a PF, obtinha informações sigilosas em favor da família Vorcaro.
  Foram presos o agente Anderson Wander da Silva Lima, da Superintendência do Rio de Janeiro — descrito
  como 'agente infiltrado funcionalmente na Polícia Federal em benefício da organização criminosa' —,
  e o agente aposentado Sebastião Monteiro Júnior; afastada a delegada Valéria Vieira Pereira da Silva,
  de Minas Gerais; e alvo de busca o marido dela, o agente aposentado Francisco José Pereira da Silva.
  A decisão registra que as consultas indevidas de fato ocorreram e que o conteúdo repassado permitiu
  identificar o objeto da investigação que interessava a Henrique Vorcaro. Na mesma decisão, Mendonça
  determinou a transferência de Marilson Roseno da Silva para presídio federal, por constatar que ele
  seguia recebendo informações sobre diligências mesmo preso. Nenhum dos cinco foi julgado; os que se
  manifestaram negam as imputações.
