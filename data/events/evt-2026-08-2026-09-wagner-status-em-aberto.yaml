description: Entre agosto e setembro de 2026, Jaques Wagner manteve o mandato de senador em atividade
  normal — deixou apenas a liderança do governo no Senado em 24/06/2026 — e confirmou candidatura à reeleição
  pela Bahia. Seu depoimento à PF, marcado para 07/08/2026, foi adiado a pedido da defesa por falta de
  acesso aos autos, sem nova data marcada. Não há denúncia do MPF nem indiciamento formal. Negou publicamente
  qualquer negócio com o Master ou com Augusto Lima; Lula o defendeu nominalmente na TV Globo. É citado
  no relatório da PF que embasou a decisão de Moraes contra Mendonça (03/09/2026), mas apenas como referência
  comparativa de prazo processual, não como participante das mensagens Vorcaro-Moraes.
