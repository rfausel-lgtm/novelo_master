description: "Em reportagem de 16/10/2026 (Aguirre Talento, Luiz Vassallo, Gustavo Côrtes e Vinícius Valfré),
  o Estadão afirmou que mensagens extraídas do celular de Daniel Vorcaro indicariam que a advogada e
  influenciadora Gabriela Prioli gravou vídeos em defesa do Banco Master sob contrato de 12 meses, com
  roteiros submetidos à aprovação do banqueiro e pedidos de edição feitos por ele; segundo o jornal, nas
  mensagens a então superintendente de Comunicação e Marketing do banco, Ana Matos, relata a assinatura do
  contrato, e os diálogos não revelam o valor pago. No mesmo dia, em vídeo nas redes sociais relatado pelo
  Correio Braziliense, Prioli negou ter feito qualquer reunião com pessoa do banco ou representante de
  Vorcaro, ter assinado contrato com o banco ou empresas ligadas a ele e ter recebido pagamentos; cobrou a
  apresentação do contrato, dos pagamentos e de conversas suas e disse que tomará as medidas cabíveis. Ao
  Estadão, afirmou que Vorcaro “jamais editou” seu conteúdo. Ana Matos, procurada pelo jornal, não respondeu.
  O conteúdo é atribuído ao Estadão: as mensagens não constam de documento público lido pelo Novelo, e
  mensagem em aparelho não prova o que diz."
