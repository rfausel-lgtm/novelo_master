description: 'O colegiado da CPI do Crime Organizado aprovou o Requerimento nº 287/2026, do senador Alessandro
  Vieira, convocando Yan Felix Hirano. O requerimento reproduz a tese veiculada pelo ICL Notícias sobre
  a presença de Oliver Ortiz entre os cotistas de fundos da antiga Foco DTVM e acrescenta corroboração
  própria a partir de registros da CVM e da Receita Federal. É o único ponto em que a alegação atravessou
  para o plano oficial — e sem desdobramento: Hirano nunca depôs, e a comissão encerrou em 14/04/2026
  com a rejeição do relatório final, que sequer menciona o tema.'
