description: O Colegiado da CVM aceitou, por unanimidade, propostas de termo de compromisso somando R$
  2.325.000 no processo sobre as emissões de debêntures da Centara e da Simsan — equivalente a 4,7% dos
  R$ 49 milhões captados. Entre os proponentes estava Daniel Vorcaro, pessoalmente, na qualidade de diretor
  da Máxima CCTVM, que pagou R$ 250 mil. O acordo fora rejeitado pelo Comitê de Termo de Compromisso em
  agosto e novamente em setembro de 2020; o diretor Henrique Machado pediu vista em novembro, assumiu
  a relatoria e votou pela aceitação — embora o valor final tenha sido 48% maior que o recusado. O voto
  registra que a área técnica já apontava estruturação das emissões para transferir recursos de uma massa
  falida a familiares dos controladores, e que os proponentes já eram investigados por condutas semelhantes
  em processo aberto três semanas antes.
