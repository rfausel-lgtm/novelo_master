description: Em abril de 2026 vieram a público extratos dos votos BCB 20/2019 e 218/2019, obtidos por
  meio de pedidos de acesso à informação e divulgados pelo Valor Econômico e pela coluna de Malu Gaspar,
  em O Globo. Os documentos permitiram reconstituir a passagem da rejeição ao aval na transferência de
  controle. Trechos que descreviam a origem de recursos do fundo comprador foram cobertos por tarjas antes
  da liberação.
