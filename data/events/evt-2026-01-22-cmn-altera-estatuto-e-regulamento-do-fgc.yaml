description: O CMN aprovou em 22/01/2026 a Resolução 5.279, que altera o estatuto e o regulamento do FGC
  (Resolução CMN 4.222/2013, Anexos I e II). Segundo o Poder360, as mudanças haviam sido deliberadas em
  assembleias gerais do fundo em setembro de 2025 e janeiro de 2026. O texto consolidado do BC marca como da
  5.279, entre outros, dispositivos sobre operações subsidiadas, informação ao BC das tratativas de
  assistência, divulgação pública de relatórios por associada, compromisso de indenidade de administradores e
  valor limite e provisão no pagamento da garantia. Marca ainda como da 5.279, no estatuto, dispositivos sobre
  composição, mandato, quórum e quarentena do Conselho de Administração e da Diretoria Executiva, a gestão de
  fundos de investimentos de que o FGC seja cotista exclusivo e regras de contribuições; o consolidado não
  mostra a redação anterior. Segundo o FGC (CNN Brasil; o Poder360 relata o mesmo
  conteúdo), o pacote inclui apoio ampliado à transferência de controle em situação conjuntural adversa
  reconhecida pelo BC; CNN Brasil e Poder360 relatam também prazo máximo de três dias para o início dos
  pagamentos após o recebimento formal das informações dos liquidantes. O texto consolidado lido não traz
  esses dois pontos nesses termos, e eles ficam em classe A, atribuídos. A CNN Brasil liga a revisão ao caso Master; o Novelo registra o enquadramento como atribuído
  e não afirma nexo causal.
