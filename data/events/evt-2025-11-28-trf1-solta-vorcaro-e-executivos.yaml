description: A desembargadora Solange Salgado (10ª Turma) concedeu parcialmente habeas corpus, substituindo
  a prisão por comparecimento periódico, proibição de contato com investigados, proibição de deixar o
  município, suspensão de atividades de gestão, monitoração eletrônica e retenção de passaporte; estendeu
  os efeitos a Augusto Ferreira Lima, Luiz Antonio Bull, Alberto Félix de Oliveira e Angelo Antonio Ribeiro
  da Silva.
