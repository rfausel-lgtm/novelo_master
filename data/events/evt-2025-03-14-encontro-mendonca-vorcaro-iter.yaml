description: Segundo mensagens e registros do celular de Vorcaro publicados pela newsletter Noites Húngaras
  e reproduzidos pelo Brasil de Fato, Vorcaro esteve por cerca de duas horas na sede do Instituto ITER,
  fundado pelo ministro, em encontro articulado por Ciro Soares e Cezinha de Madureira. O gabinete do
  ministro confirmou ter recebido o empresário uma única vez, para memoriais sobre precatórios, e afirmou
  que sua decisão foi contrária aos interesses do banco. O encontro é anterior à relatoria de Mendonça
  no caso Master (fevereiro de 2026).
