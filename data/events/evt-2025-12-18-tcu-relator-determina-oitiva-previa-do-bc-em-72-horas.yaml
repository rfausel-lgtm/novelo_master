cited_position:
  - by_id: tribunal-de-contas-da-uniao
    kind: clarification
    date: 2025-12-18
    summary: O próprio despacho afirma que a decisão "possui natureza exclusivamente instrutória", sem juízo
      definitivo quanto à regularidade do ato regulatório, e que não cabe ao TCU substituir o BC no mérito
      regulatório, mas verificar legalidade, motivação, proporcionalidade e consideração de alternativas.
    source_ids:
      - src-poder360-2025-12-18-integra-despacho-tcu-tc-022-950-2025-7
  - by_id: banco-central-do-brasil
    kind: version
    date: 2025-12-19
    summary: Segundo o Estadão Conteúdo (Jornal de Brasília, 19/12/2025), que cita apuração do Broadcast, o BC
      recebeu o pedido de explicações com tranquilidade e avalia internamente ter cumprido o rito legal da
      liquidação, reunindo elementos e provas documentais; a matéria não registra nota oficial do BC. A
      manifestação do BC na oitiva não foi localizada.
