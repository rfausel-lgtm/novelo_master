description: Em 01/09/2026, Alcolumbre confirmou haver 109 pedidos de impeachment contra os dez ministros do STF,
  sem dizer se daria andamento ao de Moraes. No dia seguinte, 02/09/2026, em sessão do plenário do Senado, sob nova
  cobrança, respondeu citando o financiamento de R$ 130 milhões do filme sobre Bolsonaro por 'a mesma pessoa' (Daniel
  Vorcaro) — sem nomear Flávio, Vorcaro ou 'Dark Horse' explicitamente, mas em fala interpretada pela imprensa como
  recado velado. Dois dias depois, 04/09/2026, em ato de campanha, o senador e candidato Flávio Bolsonaro respondeu
  publicamente, acusando Alcolumbre de proteger um 'amigo' (Moraes) em vez da instituição, e afirmando que 54 pedidos
  de impeachment contra Moraes especificamente estariam parados.
