description: 'Na mesma decisão que decretou a prisão preventiva de Vorcaro e de outros três investigados
  (04/03/2026, PET 15556), o ministro André Mendonça impôs cautelares a dois servidores do Banco Central
  apontados como interlocutores diretos de Vorcaro na supervisão do Banco Master: Paulo Sérgio Neves de
  Souza, ex-diretor de Fiscalização, e Bellini Santana, ex-chefe-adjunto da Desup. Ambos receberam tornozeleira
  eletrônica; Paulo Sérgio recebeu também proibição de contato com testemunhas, proibição de acesso ao
  BC, restrição de viagem, entrega de passaporte em 48h e suspensão da função pública. Segundo a imprensa,
  com base em apuração da PF, os dois teriam prestado consultoria informal ao Master em troca de vantagens
  operacionalizadas por Fabiano Zettel e por Ana Cláudia Queiroz de Paiva através de contrato fictício
  com a Varajo Consultoria Empresarial. É o fato concreto por trás do inquérito referido no IPJ-A 3298613/2026
  (IPL 2026.0053200 / PET 15.504) sobre pagamento de vantagens indevidas a servidores do Banco Central.'
