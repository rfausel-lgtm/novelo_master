description: 'Diante do pedido de CPI protocolado por Rodrigo Rollemberg em 02/02/2026 com 201 assinaturas,
  o presidente da Câmara passou a invocar o critério de ordem cronológica de apresentação dos requerimentos
  — o pedido do Banco Master ocupava a 16ª posição entre 17, e o Regimento Interno permite apenas cinco
  CPIs em funcionamento simultâneo. Motta reiterou a posição em 26/02/2026 e, com formulação mais explícita,
  em maio de 2026, sem indicação de mudança até pelo menos 20/06/2026 (última atualização localizada pela
  equipe editorial). Na prática, o critério funciona como obstáculo à instalação: nenhuma das CPIs à frente
  do Master havia liberado vaga entre as cinco simultâneas.'
