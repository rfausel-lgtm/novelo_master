description: Tornou-se público que o Coaf registrou R$ 27.283.800 pagos pelo Banco Master à empresa do
  grupo Metrópoles entre o segundo semestre de 2024 e outubro de 2025, classificando a movimentação como
  atípica e apontando débito imediato para empresas ligadas à família do controlador do veículo. A contrapartida
  comercial existe e é verificável — patrocínio esportivo com contrato confirmado pela CBF —, e o veículo
  sustenta tratar-se de relação regular e pública. Não há acusação formal, indiciamento ou denúncia contra
  o veículo ou seus dirigentes.
