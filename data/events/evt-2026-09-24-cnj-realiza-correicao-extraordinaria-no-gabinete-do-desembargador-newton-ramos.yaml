id: evt-2026-09-24-cnj-realiza-correicao-extraordinaria-no-gabinete-do-desembargador-newton-ramos
kind: event
title: CNJ realiza correição extraordinária no gabinete do desembargador Newton Ramos, no TRF-1, segundo a imprensa
event_type: investigation_step
date: '2026-09-24'
date_precision: day
participant_ids:
