- tribunal-regional-federal-da-1a-regiao
- policia-federal
description: >-
  Em 24/09/2026 (quinta-feira), segundo a Agência Brasil, o Times Brasil e A Crítica, foi realizada diligência no
  gabinete do desembargador Newton Ramos, no TRF-1, determinada pelo corregedor nacional de Justiça, ministro
  Benedito Gonçalves, e cumprida pela Polícia Federal, com extração de dados de equipamentos eletrônicos e
  arquivos (A Crítica), no âmbito de correição extraordinária (Times Brasil e A Crítica) para levantar
  informações sobre processos do setor sucroalcooleiro. Não há notícia oficial do CNJ sobre a diligência;
  "operação" e "buscas" são termos dos veículos. Segundo o Metrópoles, decisão do corregedor assinada em
  22/09/2026 instaurou sindicância contra o desembargador a partir de reclamação disciplinar de um advogado,
  para apurar sua atuação em processos de precatórios do setor sucroalcooleiro e possíveis interesses do Banco
  Master (prazo inicial de 60 dias, prorrogável; 10 dias para defesa prévia); a decisão e o número da sindicância não
  foram localizados. Newton Ramos continua no cargo.
