kind: event
title: PF cumpre nove mandados de busca na Operação Entressafras sobre a gestão de recursos do São Roque Prev
event_type: investigation_step
date: 2026-10-27
date_precision: day
participant_ids:
  - policia-federal
  - sao-roque-prev
description: 'Segundo nota da PF publicada em 27/10/2026, a corporação cumpriu nove mandados de busca e
  apreensão em São Paulo e Pernambuco na Operação Entressafras, que investiga possíveis crimes contra o
  Sistema Financeiro Nacional na gestão de recursos do São Roque Prev entre 2022 e 2024. A nota diz que "a
  investigação apura investimentos de cerca de R$ 100 milhões, com aplicações não sendo amparadas por
  pareceres técnicos e fundamentação adequados" e que "os investigados poderão responder por gestão
  fraudulenta, peculato financeiro, crimes contra a Administração Pública e lavagem de dinheiro, entre outros
  delitos"; é a expectativa da PF numa fase de buscas, não denúncia nem acusação formal. A nota não nomeia
  banco, investigados nem o juízo que expediu os mandados, e nenhuma das fontes lidas nomeia os investigados.
  Segundo CNN Brasil e Metrópoles, o investimento foi
  feito no Banco Master; a CNN escreve que "a CNN apurou que o investimento foi feito no então banco Master".
  Os valores divergem e o corpus não os concilia: a nota da PF fala em cerca de R$ 100 milhões em
  investimentos apurados; segundo a CNN e o Metrópoles, foram R$ 80 milhões em letras financeiras e R$ 20
  milhões em um fundo imobiliário; a CNN atribui à PF, em seu subtítulo, um prejuízo estimado de "aproximadamente
  R$ 121 milhões", que o Metrópoles repete, ambos dizendo que o valor está bloqueado, número que não está na
  nota em gov.br; o TCE-SP, segundo o Estadão e o
  g1, imputou ressarcimento de R$ 93,15 milhões referentes a sete aplicações de 2024. São medidas diferentes
  (aplicado, estimado, bloqueado, imputado) e períodos diferentes. A operação é procedimento distinto da
  decisão de contas do TCE-SP; nenhuma fonte liga uma à outra.'
