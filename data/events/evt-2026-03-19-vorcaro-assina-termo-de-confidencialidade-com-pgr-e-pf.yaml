description: "Em 19/03/2026, segundo Poder360, Metrópoles e Band, Daniel Vorcaro, preso preventivamente desde
  04/03, assinou um termo de confidencialidade com a PGR e a PF, descrito pelas três reportagens como passo
  inicial das tratativas para uma eventual delação premiada. No mesmo dia, o ministro André Mendonça autorizou
  a transferência dele da Penitenciária Federal de Brasília para a Superintendência da PF na capital (o
  Metrópoles registra que ela foi realizada no mesmo dia); só o Metrópoles liga a mudança de custódia às
  tratativas, a pedido da defesa. O termo é sigiloso e não foi lido. O que este registro NÃO afirma: não há,
  nas fontes lidas, acordo de colaboração firmado nem homologado; o Novelo não registra conteúdo, nomes ou
  provas de eventual colaboração, que as próprias fontes dizem seguir sob sigilo; o acervo registra em eventos
  separados propostas posteriores (junho de 2026), que este registro não liga a esta assinatura."
