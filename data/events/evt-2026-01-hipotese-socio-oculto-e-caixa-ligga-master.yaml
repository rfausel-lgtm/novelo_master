- ligga-telecom
- joao-carlos-mansur
- vladimir-timerman
description: Documentos internos mostram que a Ligga Telecom, controlada por fundo de Nelson Tanure, direcionou
  entre R$ 353 milhões (dez/2022) e R$ 388,6 milhões (set/2025) de seu caixa a CCBs do Banco Master, decisão
  que não passou pelo Conselho de Administração. Um sócio minoritário notificou extrajudicialmente a empresa
  em 29/01/2026, alegando desvio de cerca de R$ 400 milhões de recursos de debêntures incentivadas para
  o Master. Paralelamente, PF, Banco Central e MPF apuram — sem confirmação judicial — se Tanure seria
  'sócio oculto' do banco, hipótese que remonta a depoimento de Vladimir Timerman à CPI em 19/03/2026.
  Tanure nega qualquer vínculo societário; a Ligga afirma não ter, atualmente, aplicação financeira no
  Master.
