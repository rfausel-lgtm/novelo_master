description: 'Em meio à crise institucional aberta pela divulgação das mensagens Vorcaro-Moraes e pela
  decisão de Moraes contra Mendonça (lote 28), múltiplos atores políticos se manifestaram: o deputado
  Nikolas Ferreira (PL) disse que ''Mendonça tem que dar voz de prisão a Moraes em plenário''; deputados
  do PT (Pedro Uczai, Lindbergh Farias, André Janones) pediram a Fachin que declare a suspeição de Mendonça,
  após a revelação do encontro dele com Vorcaro no Instituto ITER; o senador Carlos Viana (PSD) pediu
  o afastamento imediato do procurador-geral Gonet. Separadamente, a PGR se manifestou pelo arquivamento
  da apuração sobre as alegações de Vorcaro de ter sofrido ''graves intimidações'' durante tratativas
  de delação — as mesmas que embasaram o pedido do partido Novo pela prisão preventiva do diretor-geral
  da PF.'
