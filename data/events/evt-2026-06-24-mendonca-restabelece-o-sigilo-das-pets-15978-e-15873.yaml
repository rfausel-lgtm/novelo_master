description: >-
  Em 24/06/2026, oito dias depois de levantar o sigilo, o ministro André Mendonça, em decisão na Pet 15.873/DF,
  determinou "o restabelecimento do sigilo anteriormente vigente no âmbito das PETs nº 15.978 e nº 15.873, para
  a retomada do trâmite processual", com base no art. 20 do "CCP" (assim grafado no texto) e na Súmula
  Vinculante nº 14, considerando a necessidade de resguardar o aporte de novas informações aos autos para
  viabilizar futuras diligências. No cabeçalho, a Polícia Federal figura como interessada. A Agência O Globo
  (via InfoMoney, 25/06) noticiou o restabelecimento sem citar o número das Pets. A decisão não menciona a
  divulgação de 16/06 nem a relaciona ao restabelecimento.
