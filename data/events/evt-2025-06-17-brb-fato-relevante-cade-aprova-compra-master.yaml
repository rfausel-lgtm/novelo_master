  - conselho-administrativo-de-defesa-economica
description: Em Fato Relevante de 17/06/2025, o BRB informou aos acionistas e ao mercado que, nessa data, o
  Cade aprovou, sem restrições, a aquisição pelo BRB de 49,0% das ações ordinárias, 100% das preferenciais e
  58,04% da participação total do Banco Master. Segundo o mesmo comunicado, a conclusão da operação permanece
  sujeita às demais condições precedentes do contrato e às aprovações regulatórias pendentes. O fato
  registrado é o comunicado do BRB; o ato do Cade não foi localizado (comunicado do órgão, DOU ou SEI), e a
  aprovação consta aqui apenas como declaração do BRB. Este lote não trata do que ocorreu com a operação
  depois do comunicado.
