title: CVM condena Botelho e a antiga Foco DTVM por irregularidades na administração do FII São Domingos
event_type: regulatory_act
date: '2022-07-05'
date_precision: day
participant_ids:
- benjamim-botelho-de-almeida
- foco-dtvm
description: A CVM condenou a Índigo Investimentos DTVM (antiga Foco DTVM), Benjamim Botelho de Almeida
  e Sérgio Paulino Ferreira em multas que somam R$ 2,1 milhões, por irregularidades na administração fiduciária
  do FII São Domingos — o fundo que comprou por R$ 57 milhões o terreno de Jequitibá regularizado por
  R$ 2,5 milhões, operação usada para lastrear a capacidade econômica apresentada por Vorcaro ao Banco
  Central. A Botelho couberam R$ 450 mil; ele foi absolvido de uma das acusações e teve reconhecida ilegitimidade
  passiva em outra.
