description: O relatório, tornado público em 30/07/2026, aponta indícios que a PF classifica como preliminares
  e indiciários de 'vantagens econômicas diversas' a Wagner por Augusto Lima e Vorcaro (incluindo uso
  gratuito de aeronaves) e registra ao menos 70 contatos entre Lima e o senador; afirma que a proximidade
  com Vorcaro se deu por intermédio de Lima. A PF ressalva que a presença de pessoas no organograma não
  implica participação na fraude.
