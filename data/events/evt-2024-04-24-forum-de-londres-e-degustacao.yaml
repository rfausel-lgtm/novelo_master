description: 'O 1º Fórum Jurídico Brasil de Ideias, organizado pelo Grupo Voto e patrocinado pelo Banco
  Master, reuniu em Londres, de 24 a 26 de abril de 2024, ministros do STF e do STJ, o procurador-geral
  da República, o então ministro da Justiça e o diretor-geral da PF. Em 25/04, houve degustação de uísque
  Macallan com charutos no George Club, em Mayfair, custeada por Vorcaro ao custo documentado de US$ 640.831,88,
  com cerca de 40 presentes. O Banco Master era, à época, parte autora em ações no STF e no STJ. O relatório
  da PF sobre o celular de Vorcaro transcreve a trilha do convite ao diretor-geral, incluindo a pergunta
  atribuída a sua assistente sobre quem cobriria hospedagem e passagem, e a resposta do lado do organizador:
  ''todas as despesas bancadas por nós''. A PF confirmou, por Lei de Acesso à Informação, que o organizador
  custeou diretamente as despesas extraordinárias. Reportagens de fevereiro de 2026 (O Tempo, Jornal de
  Brasília) identificam entre os presentes/debatedores, além dos já registrados, os ministros Dias Toffoli
  e Gilmar Mendes, o ex-ministro Ricardo Lewandowski, o então advogado-geral da União Jorge Messias, o
  ex-presidente Michel Temer, e os senadores Davi Alcolumbre (União Brasil-AP) e Ciro Nogueira (PP-PI) —
  hoje, respectivamente, presidente do Senado e alvo de fase própria da Compliance Zero (Pet 15.873), já
  registrada no corpus por outra via. NOVO (14/09/2026): segundo Folha de S.Paulo e revista piauí, com base
  em relatório da PF, o convite ao evento apresentava ConJur, Correio Braziliense e Banco Master como
  organizadores — o editor do ConJur, Márcio Chaer, foi contratado pelos organizadores para formatar as mesas
  e negociou diretamente com Vorcaro a lista de convidados; Vorcaro se preocupou com a exposição do banco como
  financiador, e Chaer o tranquilizou dizendo que a formulação do convite ficava "sóbria". Chaer confirmou
  publicamente, em 01/09/2026, ter organizado a edição de 2024 e que o ConJur recebeu patrocínio do Master,
  dizendo ter declinado de organizar a edição de 2025.'
