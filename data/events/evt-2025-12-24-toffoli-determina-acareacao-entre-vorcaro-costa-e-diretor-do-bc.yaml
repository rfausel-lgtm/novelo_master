id: evt-2025-12-24-toffoli-determina-acareacao-entre-vorcaro-costa-e-diretor-do-bc
kind: event
title: Toffoli determina acareação entre Vorcaro, Paulo Henrique Costa e o diretor de Fiscalização do BC; PGR
  pede suspensão e o ministro mantém a data
event_type: judicial_decision
date: 2025-12-24
date_precision: approximate
participant_ids:
  - dias-toffoli
  - supremo-tribunal-federal
  - daniel-vorcaro
  - paulo-henrique-costa
  - banco-central-do-brasil
  - paulo-gonet
description: Segundo a Folha (24/12/2025) e O Globo (26/12/2025), Toffoli determinou no inquérito sigiloso sob
  sua relatoria, sem pedido da PF ou da PGR, uma acareação entre Daniel Vorcaro, Paulo Henrique Costa
  (ex-presidente do BRB) e o diretor de Fiscalização do Banco Central para 30/12/2025, no recesso. Segundo O
  Globo e a Gazeta do Povo, o procurador-geral Paulo Gonet pediu a suspensão do ato por considerá-lo prematuro
  antes dos depoimentos individuais, e Toffoli manteve a data. Segundo a Folha, O Globo e o despacho de 27/12,
  o diretor do BC não é investigado. A data exata
  do despacho que marcou a acareação não foi localizada (24/12 é a da divulgação); a manifestação da PGR não
  foi lida pelo Novelo.
