id: evt-2026-09-23-tcdf-decreta-indisponibilidade-cautelar-de-bens-de-ex-dirigentes-do-brb
kind: event
title: TCDF decreta, em caráter cautelar, a indisponibilidade de bens de ex-dirigentes do BRB e converte o processo em Tomada de Contas Especial
event_type: regulatory_act
date: '2026-09-23'
date_precision: day
location: Brasília (DF)
participant_ids:
- tribunal-de-contas-do-distrito-federal
- banco-de-brasilia-brb
description: >-
  Em sessão reservada de 23/09/2026, o Tribunal de Contas do Distrito Federal decidiu, em caráter cautelar,
  determinar a indisponibilidade de bens, por um ano, de ex-integrantes da alta administração do BRB, com 30
  dias para manifestação, com o objetivo de "resguardar eventual ressarcimento aos cofres públicos", conforme
  nota oficial do tribunal. A decisão (RES nº 361/2026, processo 00600-00003617/2025-75-e, relatora Anilcéia Luzia
  Machado, segundo o e-TCDF) prevê ainda instrução prioritária do processo para avaliar a extensão da medida a
  outros agentes, conversão em Tomada de Contas Especial, 24 horas para o BRB enviar o relatório da auditoria
  independente, 30 dias para o atual diretor-presidente justificar o descumprimento de determinação anterior
  sobre envio de informações e 15 dias para o banco esclarecer a representação do Ministério Público de Contas
  do DF. A nota não nomeia os atingidos nem informa valor. Segundo o Metrópoles, o SBT News e o Congresso em
  Foco, os cinco atingidos são Paulo Henrique Costa, Dario Oswaldo Garcia Júnior, Robério Cesar Bonfim
  Mangueira, Wily da Silva Leão e Marcelo Talarico; segundo a Agência Brasil, a decisão foi unânime e o valor
  total é de R$ 2.761.749.206,55 (os demais veículos falam em "até R$ 2,7 bilhões"). O inteiro teor é sigiloso;
  a ficha do e-TCDF indica publicação no DODF de 05/10/2026. A medida é cautelar: não é julgamento de mérito
  nem atribuição definitiva de responsabilidade, e as defesas dispunham de 30 dias para se manifestar.
