description: 'Segundo relatório da PF citado pela CNN, em outubro de 2024 Vorcaro pediu a Augusto Lima
  que ligasse ''urgente pro kassab'' para tentar remover vídeo do deputado estadual Luiz Paulo (PSD-RJ)
  crítico aos aportes de R$ 500 milhões da RioPrevidência no Master; Kassab conversou com o deputado federal
  Pedro Paulo; o vídeo não foi removido. Kassab e Pedro Paulo afirmam que orientaram a continuidade das
  denúncias. NOVO (13/09/2026, fonte primária da PF): o mesmo episódio é datado com precisão em 01/10/2024.
  Vorcaro afirmou a interlocutores ter conseguido tirar do ar uma notícia sobre o tema no site
  "expresso222.com.br" (hoje inexistente) — mas o próprio relatório da PF registra não ter encontrado essa
  notícia, ao contrário da postagem do Dep. Luiz Paulo, que seguia acessível; é alegação do próprio Vorcaro,
  não confirmação independente da PF. Também nesse dia, Vorcaro acionou um segundo canal paralelo, Fernando
  de Goes ("Pedi o nando pra ajudar e tentar falar com o kassab"), que informou internamente à equipe de
  Vorcaro que Kassab telefonara a Pedro Paulo — confirmação contemporânea por fonte interna, distinta da
  versão dada à imprensa depois.'
