description: Segundo relatório da PF citado pela CNN, em outubro de 2024 Vorcaro pediu a Augusto Lima
  que ligasse 'urgente pro kassab' para tentar remover vídeo do deputado estadual Luiz Paulo (PSD-RJ)
  crítico aos aportes de R$ 500 milhões da RioPrevidência no Master; Kassab conversou com o deputado federal
  Pedro Paulo; o vídeo não foi removido. Kassab e Pedro Paulo afirmam que orientaram a continuidade das
  denúncias.
