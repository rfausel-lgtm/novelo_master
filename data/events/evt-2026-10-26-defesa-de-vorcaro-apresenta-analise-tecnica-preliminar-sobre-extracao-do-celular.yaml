title: Defesa de Vorcaro apresenta análise técnica preliminar sobre a extração do celular (alegação da defesa)
event_type: statement
date: 2026-10-26
date_precision: day
participant_ids:
  - daniel-vorcaro
  - policia-federal
  - supremo-tribunal-federal
description: O assistente técnico contratado pela defesa de Daniel Vorcaro, Marcos Monteiro, entregou em
  26/10/2026 uma análise preliminar de 76 páginas sobre o HD que a equipe de defesa lhe entregou com os arquivos da extração do celular apreendido em
  17/11/2025 (arquivos fornecidos pelo STF, segundo o Poder360, que divulgou o documento em 29/10). Segundo o
  assistente técnico da defesa, o material recebido não inclui os arquivos brutos da coleta e por isso não
  permite verificar a integridade e a integralidade da extração; o laudo da PF não informa a versão da
  ferramenta GrayKey; o termo de apreensão não descreve elementos de identificação dos aparelhos nem os lacres, e o rompimento dos lacres originais ocorreu “em momento não documentado”; os registros do relatório indicam alteração do
  estado do aparelho entre a noite de 17/11 e a madrugada de 18/11/2025; e há 657 arquivos com modificação em
  18/11/2025 e 999 entre 18/11/2025 e 14/05/2026 (os 657 estão entre os 999), além de 94 imagens HEIC com
  registro de criação posterior à apreensão. No mesmo documento, o perito escreve que não é tecnicamente
  possível atribuir essas alterações a uma ação humana deliberada (o que, para ele, tampouco autoriza
  classificá-las como automáticas ou inofensivas), que suas conclusões não implicam juízo
  sobre autoria e que o teste em que editou um relatório UFDR foi feito em arquivo de treinamento e não
  demonstra alteração do relatório deste caso; segundo o Poder360, o laudo não comprova que o material tenha
  sido adulterado. A defesa pede a cópia
  integral dos dados extraídos, os registros e logs do GrayKey, o método de desbloqueio e a documentação da
  cadeia de custódia. Tudo é alegação da defesa; não foi localizada manifestação da PF nem do STF sobre a
  análise. O HD examinado não se confunde com a cópia de segurança lacrada no STF, objeto da disputa
  registrada no acervo em setembro de 2026. Em entrevista à CNN (texto de 29/10, atualizado em 30/10), o
  advogado Sergio Leonardo, que lidera a defesa de Vorcaro, disse que, se ficar comprovado que o celular foi
  alterado depois de apreendido, a defesa pedirá a anulação das provas dele decorrentes e, se a prova for
  considerada ilícita, pedirá ao STF que a retire dos autos. Segundo a CNN, o pedido feito em 29/10 foi para
  ter acesso ao material bruto em poder da PF, a fim de comparar com a análise do perito contratado; o
  advogado disse que só com esses dados o perito pode aferir a questão. A CNN resume, com base em nota da
  defesa, os achados que a defesa destaca (manuseio do aparelho depois da apreensão, centenas de arquivos
  criados e modificados sob custódia e registros posteriores à extração). Essas são afirmações da defesa. O
  perito, no próprio documento, escreve que não é tecnicamente possível atribuir as alterações a uma ação
  humana deliberada e que suas conclusões não implicam juízo sobre autoria; segundo o Poder360, o laudo não
  comprova que o material tenha sido adulterado. A matéria da CNN não cita trechos do laudo nem traz resposta
  da PF ou do STF, e não informa a quem o pedido de acesso foi dirigido.
