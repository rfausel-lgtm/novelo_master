- banco-de-brasilia-brb
description: >-
  Segundo o Metrópoles (09/10/2026), a CNN Brasil (10/10/2026), o g1 (conforme reproduzido pelo Brasil 247) e
  a Jovem Pan (10/10/2026), relatório da Polícia Federal enviado ao STF em 28/09/2026, com sigilo levantado em 09/10,
  afirma que Ibaneis Rocha, na qualidade de acionista controlador do BRB, "não se limitou ao exercício regular
  de suas prerrogativas institucionais" e que "decisões estratégicas relevantes eram submetidas previamente à
  sua apreciação" antes dos órgãos de governança; o g1 (via Brasil 247) reproduz a frase "Tal atuação é
  indicativa de captura institucional"; segundo o Metrópoles e a Jovem Pan, o relatório descreve reunião em
  Zurique em 23/01/2025 entre Ibaneis, Vorcaro, Paulo Henrique Costa e uma pessoa tratada como "Léo" ou
  "Leonardo" (não identificada nas fontes) e a autorização do aumento de capital do BRB de R$ 750 milhões. A
  defesa de Ibaneis nega: segundo o Metrópoles, a CNN Brasil e a Jovem Pan, ela (representada, segundo o
  Metrópoles, pelo advogado Antônio Carlos de Almeida Castro, o Kakay) afirmou que ele "não pressionou e
  tampouco teve qualquer ingerência nas operações realizadas pelo BRB", que Paulo Henrique Costa "detinha
  total autonomia para condução das negociações" e que Ibaneis "não é interlocutor direto em nenhuma mensagem
  com Daniel Vorcaro" e "seu nome somente é mencionado pela Polícia Federal em quatro oportunidades". O Novelo não localizou o relatório nos autos públicos: o número da PET, o ministro que
  levantou o sigilo e a data do documento não constam das fontes lidas, e os trechos acima são descrição da
  imprensa. O nome "Léo" ou "Leonardo" não é identificado nas fontes.
