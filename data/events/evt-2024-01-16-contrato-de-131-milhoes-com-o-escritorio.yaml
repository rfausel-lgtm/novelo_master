description: Contrato de três anos com trinta e seis parcelas mensais de R$ 3.000.000,00 líquidos — valor
  bruto de R$ 3.646.529,77 ao mês —, estruturando cinco núcleos de atuação perante o Judiciário, o Ministério
  Público, a polícia judiciária, órgãos do Executivo e o Legislativo. O objeto alcança expressamente os
  sócios e acionistas controladores do banco. Assinado digitalmente em 23/01/2024 por Daniel Vorcaro e
  por Angelo Antonio Ribeiro da Silva.
