description: O BC decretou a liquidação extrajudicial da Will Financeira S.A. CFI, controlada pelo Master,
  citando insolvência, descumprimento da grade de pagamentos com a Mastercard e vínculo de interesse com
  o banco já liquidado; nomeou Eduardo Bianchini liquidante e tornou indisponíveis os bens de controladores
  e ex-administradores.
