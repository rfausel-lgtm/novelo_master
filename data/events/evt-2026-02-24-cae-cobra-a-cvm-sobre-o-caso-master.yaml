description: Em audiência na Comissão de Assuntos Econômicos do Senado, o presidente interino da CVM,
  João Accioly, admitiu limitações da autarquia para fiscalizar o Banco Master, atribuindo-as sobretudo
  à redução de 70% do orçamento discricionário desde 2015, e afirmou que 'pode ter havido erro'. Sustentou
  que, 'se houve omissão da CVM, foi na divulgação do que a CVM fez'. Senadores cobraram omissão; Eduardo
  Braga afirmou que 'não dá pra dizer que a CVM não foi omissa'. A apresentação levada à comissão registra
  que fundos destinados a investidores profissionais ou exclusivos 'recebem menor ênfase da supervisão
  preventiva'.
