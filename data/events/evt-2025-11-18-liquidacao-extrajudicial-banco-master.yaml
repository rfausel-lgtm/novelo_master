description: O Banco Central decretou a liquidação extrajudicial do Banco Master S.A., do Banco Master
  de Investimento S.A., do Banco Letsbank S.A. e da Master S.A. CCTVM, e Regime de Administração Especial
  Temporária no Banco Master Múltiplo S.A. A ata do Comef avalia que a medida não traz risco sistêmico.
  A data de 18/11/2025 é a registrada pela imprensa; a ata do Comef (novembro de 2025) confirma a decretação
  sem indicar o dia.
