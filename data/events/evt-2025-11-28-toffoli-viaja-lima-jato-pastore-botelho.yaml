description: O ministro Dias Toffoli, então relator do caso Master no STF, viajou a Lima (Peru) entre
  28 e 30/11/2025, no jato particular do empresário Luiz Osvaldo Pastore, para assistir à final da Libertadores
  (Palmeiras x Flamengo, vitória do Flamengo). Também a bordo estava o advogado Augusto de Arruda Botelho,
  que defende Luiz Antonio Bull, investigado no caso Master, além do filho de Botelho e do ex-deputado
  Aldo Rebelo, totalizando cerca de 15 passageiros. Dois dias após o retorno, em 02/12/2025, Toffoli decretou
  sigilo no processo do Master no STF.
