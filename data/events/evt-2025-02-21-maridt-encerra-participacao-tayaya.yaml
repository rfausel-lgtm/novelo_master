description: 'Segundo nota do gabinete de Toffoli, a participação da Maridt no grupo Tayayá foi integralmente
  encerrada em duas operações: venda de cotas ao Fundo Arllen (27/09/2021) e alienação do saldo à PHD
  Holding (21/02/2025), ambas ''dentro de valor de mercado'' e declaradas à Receita. A Gazeta e o Metrópoles
  afirmam que os fundos compradores tinham Zettel como acionista.'
