description: 'Reportagem baseada em apuração da Polícia Federal revela o mecanismo por trás da venda de
  R$ 12,2 bilhões em créditos do Master ao BRB: uma empresa de fachada, a Tirreno, vendia os créditos
  embutindo prêmio ao banco comprador, e o Master recebia o valor à vista sem pagar a Tirreno à vista.
  A investigação concluiu que os créditos nunca existiram na origem — contratos fabricados, com CPFs de
  diversas localidades do país usados para simular a origem, identificados em amostra de 130 contratos
  sem lastro algum, verificada pelo Banco Central em março de 2025.'
