description: 'Em 03/09/2026, o Banco Central decretou a liquidação extrajudicial da Trustee DTVM e da
  Banvox DTVM, gestoras controladas por Maurício Quadrado, ex-diretor de investimentos do Banco Master
  sob Daniel Vorcaro. Ambas tinham atuação marginal no SFN (menos de 0,001% do ativo total), mas eram
  peças operacionais do ecossistema Master: a Trustee administrava os fundos da Master Asset Management
  e atuou como agente fiduciário em R$ 470,5 milhões de debêntures da Banvox Holding Financeira, com fiança
  solidária de Vorcaro. As empresas negaram, em nota, qualquer irregularidade e destacaram que nenhum
  de seus executivos consta na denúncia do MP na Operação Carbono Oculto, anunciada no mesmo dia.'
