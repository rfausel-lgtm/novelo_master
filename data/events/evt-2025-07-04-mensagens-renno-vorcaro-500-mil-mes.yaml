description: Segundo Metrópoles e Folha de S.Paulo, que publicaram em 15/09/2026 mensagens do celular de Daniel
  Vorcaro, Luiz Rennó encaminhou a Vorcaro em 04/07/2025 o contato de "Kevin Marques" com a pergunta "Esse aqui
  - 500 mil mês - mantém?" e, em 08/08/2025, disse que entre os "pagamentos essenciais" faltava a Consult, reenviando
  o contato. A imprensa associa o contato ao advogado Kevin de Carvalho Marques, filho do ministro Nunes Marques.
  As próprias reportagens ressalvam que as mensagens não comprovam pagamento de R$ 500 mil mensais; o Coaf registrou
  R$ 281,6 mil da Consult ao advogado. O material integral do celular segue sob sigilo no STF.
