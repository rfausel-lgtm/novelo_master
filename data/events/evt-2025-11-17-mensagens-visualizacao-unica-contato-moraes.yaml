description: Segundo o relatório da PF, em 17/11/2025, horas antes de sua primeira prisão, Vorcaro enviou
  cinco mensagens de visualização única ao contato salvo como 'Alexandre de Moraes BRASILIA'; o Poder360
  cita texto recuperado com a pergunta 'Alguma novidade? Conseguiu ter notícia ou bloquear?'. O gabinete
  do ministro negou, em 06/03/2026, ser o destinatário, atribuindo os arquivos a pastas de outros contatos;
  Viviane Barci de Moraes também negou ter recebido as mensagens.
