description: A Procuradoria-Geral do Estado do Rio de Janeiro moveu ação cobrando cerca de R$ 640 milhões
  do grupo Master, incluindo suas gestoras, por prejuízo ao RioPrevidência — cujos aportes de cerca de
  R$ 3,7 bilhões em produtos do Master já eram objeto da 8ª fase da Operação Compliance Zero. A PGE-RJ
  aponta que a Trustee comprou maciçamente papéis dos fundos Revolution e Texas I FIA entre julho e agosto
  de 2024, inflando artificialmente seus preços.
