id: evt-2026-01-06-bc-opoe-embargos-no-tcu-contra-inspecao-monocratica
kind: event
title: Banco Central opõe embargos no TCU contra a inspeção determinada pelo relator de forma monocrática
event_type: regulatory_act
date: 2026-01-06
date_precision: day
participant_ids:
  - banco-central-do-brasil
  - tribunal-de-contas-da-uniao
  - jhonatan-de-jesus
description: Depois da oitiva de dezembro, o relator Jhonatan de Jesus determinou de forma monocrática uma
  inspeção no Banco Central (segundo a Reuters, na segunda-feira, 05/01/2026; segundo o próprio relator,
  citado pela Itatiaia, por proposta da unidade técnica). Até 06/01 o BC opôs embargos de declaração,
  sustentando que o Regimento Interno do TCU reserva a órgão colegiado a determinação de inspeção em órgão
  federal e pedindo a indicação da deliberação colegiada correspondente. O TCU estava em recesso até 16/01.
evidence_class: C
status: verified
evidence_ids:
  - ev-bc-opoe-embargos-no-tcu-contra-inspecao-determinada-pelo-relator
source_ids:
  - src-mercadoeconsumo-2026-01-06-banco-central-questiona-decisao-monocratica-no-caso-master
  - src-moneytimes-2026-01-09-ministro-do-tcu-suspende-fiscalizacao-no-banco-central
  - src-itatiaia-2026-01-08-tcu-suspende-inspecao-do-bc-no-caso-master
cited_position:
  - by_id: banco-central-do-brasil
    kind: version
    date: 2026-01-06
    summary: Nos embargos, transcritos pelo Estadão Conteúdo, o BC afirma que não há na decisão monocrática
      "indicação de deliberação da Primeira Câmara do TCU determinando a inspeção no BCB" e pede que a omissão
      seja sanada.
    source_ids:
      - src-mercadoeconsumo-2026-01-06-banco-central-questiona-decisao-monocratica-no-caso-master
  - by_id: tribunal-de-contas-da-uniao
    kind: version
    date: 2026-01-08
    summary: Ao apreciar os embargos, o relator escreveu, segundo a Itatiaia, que "não procede a premissa — tal
      como posta nos embargos — de que a inspeção dependeria, necessariamente, de autorização exclusiva de
      órgão colegiado", e que o Regimento contempla poderes instrutórios do relator para determinar inspeções.
    source_ids:
      - src-itatiaia-2026-01-08-tcu-suspende-inspecao-do-bc-no-caso-master
