description: Convocado pelos requerimentos 232/2026 e 239/2026, o ex-chefe do Departamento de Supervisão
  Bancária obteve decisão do ministro André Mendonça que o desobrigou de comparecer e tornou a convocação
  facultativa, com direito ao silêncio e assistência de advogado em caso de comparecimento. A defesa informou
  impossibilidade de deslocamento porque ele cumpre medida cautelar com monitoramento eletrônico em São
  Paulo. Segundo o presidente da comissão, situação semelhante já havia ocorrido com Paulo Sérgio Neves
  de Souza.
