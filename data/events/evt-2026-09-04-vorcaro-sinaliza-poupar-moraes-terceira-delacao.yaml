description: Segundo apuração da CNN Brasil, Vorcaro sinalizou a interlocutores que não pretende apresentar
  acusações contra Moraes em uma nova proposta de delação — a terceira, após duas rejeitadas por PF e
  PGR —, mantendo a versão de relação de amizade e de contrato comercial de R$ 129 milhões com a advogada
  Viviane Barci de Moraes. Vorcaro atribui ao levantamento do sigilo do relatório da PF um prejuízo à
  sua estratégia de negociação. No MPF, a percepção é de que as chances de acordo se esgotaram.
