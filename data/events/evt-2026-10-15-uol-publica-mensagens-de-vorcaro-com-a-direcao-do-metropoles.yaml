description: "Em 15/10/2026 o UOL publicou levantamento em mensagens que diz terem sido extraídas pela PF do
  celular de Daniel Vorcaro: ao menos 14 textos do Metrópoles teriam sido enviados previamente a ele, 11 alterados
  após pedidos dele e duas reportagens publicadas a pedido dele, entre 2024 e 17/11/2025, numa interlocução
  direta com a CEO Lilian Tahan. Segundo o UOL, a interlocução começou em maio de 2024, num café organizado por Guilherme Barros,
  e o Master pagou ao portal R$ 1 milhão em junho, acertou R$ 900 mil em julho e fechou contrato de
  publicidade de R$ 20 milhões. Lilian Tahan responde que checar com a fonte é prática que adota com
  empresários, políticos e o Judiciário, que o contrato não tinha relação com a cobertura e que basta ver
  a quantidade de matérias do portal expondo a situação das empresas de Vorcaro. Publicidade contratada não é irregularidade por
  si."
