description: Segundo o Jornal de Brasília, com base em reportagem do portal Fatos Online, mensagens entre
  Thiago Miranda e Daniel Vorcaro discutem usar a companheira do presidente do Banco Central, Gabriel
  Galípolo, como 'cartada' — cogitando contratá-la para a revista IstoÉ ou clínica ligada ao grupo. Não
  há confirmação de que a contratação tenha ocorrido nem manifestação de Galípolo ou de sua companheira.
  Relato de imprensa a partir de mensagens não lidas diretamente pela equipe editorial (fonte primária
  bloqueada); classificado como alegação.
