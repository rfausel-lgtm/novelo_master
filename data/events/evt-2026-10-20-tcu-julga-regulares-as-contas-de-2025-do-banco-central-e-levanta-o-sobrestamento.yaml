description: 'Em sessão de 20/10/2026, sete dias depois do Acórdão 5163/2026, a 2ª Câmara do Tribunal de
  Contas da União, em acórdão de relação de relatoria do ministro Jorge Oliveira (Acórdão 5184/2026, Ata
  36/2026, com o ministro Jhonatan de Jesus na presidência da sessão), acordou em levantar o sobrestamento e
  julgar regulares as contas de 2025 do Banco Central do Brasil (TC 007.138/2026-1), dando quitação plena aos
  nove responsáveis listados, entre eles o presidente do BC, Gabriel Galípolo, e arquivar os autos, sem
  determinações ou recomendações. Segundo o acórdão, a AudBancos propôs a regularidade e o MPTCU, "embora
  tenha suscitado questão examinada em outro processo", reconheceu que os elementos dos autos não evidenciam
  irregularidades capazes de comprometer a regularidade das contas. O que a decisão não faz: o acórdão
  não cita o TC 022.950/2025-7 (representação do MPTCU sobre a atuação do BC na supervisão e na resolução do
  Master, relator Jhonatan de Jesus, sob sigilo) nem o TC 008.216/2025-8 (operação BRB–Master); segundo o
  Poder360, este "está paralisado" à espera de elementos do STF, e a reportagem descreve aquele como
  investigação em curso, sem informar decisão de mérito (classe A). A decisão não é conclusão sobre a atuação
  do BC no caso Master. O Novelo leu o acórdão no portal de jurisprudência do TCU, mas não a Ata 36/2026 nem
  os autos.'
