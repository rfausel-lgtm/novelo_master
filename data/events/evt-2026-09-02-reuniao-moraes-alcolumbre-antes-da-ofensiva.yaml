description: Alexandre de Moraes e Davi Alcolumbre se reuniram reservadamente por cerca de três horas na
  residência do senador, no Lago Sul, em 02/09/2026 — véspera do dia em que Moraes protocolou sua ofensiva
  formal contra André Mendonça (a decisão de 03/09/2026 que aponta "assimetria" e cita Alcolumbre como um
  dos alvos do suposto direcionamento de Mendonça). Segundo a imprensa, foram discutidos "os desdobramentos
  da crise judicial e os possíveis cenários no Congresso"; horas depois do encontro, Alcolumbre saiu em
  defesa pública de Moraes. Nenhuma fonte detalha o teor exato da conversa.
