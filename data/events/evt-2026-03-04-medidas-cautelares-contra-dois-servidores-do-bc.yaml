description: Na mesma fase da Operação Compliance Zero em que foi decretada a prisão preventiva do banqueiro,
  o ex-diretor de fiscalização Paulo Sérgio Neves de Souza e o ex-chefe do Departamento de Supervisão
  Bancária Belline Santana foram alvo de busca e apreensão, afastados de seus cargos por decisão judicial
  e submetidos a medidas cautelares, entre elas monitoramento eletrônico. Ambos já estavam afastados no
  âmbito de apuração interna do próprio Banco Central sobre eventuais omissões no caso. Segundo a Polícia
  Federal, são suspeitos de ter atuado em favor dos interesses do grupo investigado.
