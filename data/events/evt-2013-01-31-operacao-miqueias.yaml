description: 'A Superintendência Regional da Polícia Federal no Distrito Federal instaurou inquérito denominado
  ''Operação Miquéias'', a partir dos IPL 194/2012-SR/DPF/DF e IPL 148/2013-SR/DPF/DF, sobre aplicações
  de diversos regimes próprios de previdência em fundos administrados pela Foco DTVM e geridos pela A.A.M.
  Ltda. (Aquilla Asset Management). O esquema descrito envolvia ''pastinhas'', que percorriam o país oferecendo
  percentual sobre o aporte a prefeitos e gestores, e ''lobistas''. É antecedente relevante: a estrutura
  estava sob apuração federal sete anos antes da Operação Fundo Fake e quatro anos antes de Vorcaro contratar
  a compra do Banco Máxima.'
