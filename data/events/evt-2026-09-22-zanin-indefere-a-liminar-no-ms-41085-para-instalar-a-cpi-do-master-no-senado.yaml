id: evt-2026-09-22-zanin-indefere-a-liminar-no-ms-41085-para-instalar-a-cpi-do-master-no-senado
kind: event
title: Zanin indefere a liminar no MS 41.085, que pedia a instalação da CPI do Master no Senado
event_type: judicial_decision
date: '2026-09-22'
date_precision: day
participant_ids:
- cristiano-zanin
- alessandro-vieira
- davi-alcolumbre
- senado-federal
- supremo-tribunal-federal
description: >-
  No Mandado de Segurança 41.085 (número único 0185001-61.2026.1.00.0000), impetrado pelo senador Alessandro
  Vieira contra o Presidente do Senado Federal e protocolado em 15/09/2026, o relator, ministro Cristiano
  Zanin, indeferiu a liminar em 22/09/2026, por decisão monocrática (DJE divulgado em 22/09). Segundo os
  andamentos do portal do STF, houve pedido de reconsideração em 25/09; em 28/09 foram assinados ofícios ao
  Presidente do Senado, para informações, e à AGU; em 29/09 foi interposto agravo regimental e o relator
  despachou; em 13/10 foi registrada petição do tipo "Informações", sem identificação do autor no portal; e em
  14/10/2026 os autos foram com vista à PGR. Segundo a Agência Brasil e o Congresso em Foco, Zanin entendeu não
  comprovada, naquele momento, a omissão de Davi Alcolumbre, destacou a existência de outro requerimento sobre
  fatos ligados ao Master, pediu informações ao Senado, ressalvou que poderá reexaminar o pedido e lembrou a
  jurisprudência sobre o direito das minorias parlamentares de instalar CPI; o requerimento de CPI é de 09/03 e
  tem 41 assinaturas, segundo o senador. O processo é distinto do MS 40.791, sobre CPI na Câmara, já no acervo.
  O Novelo não leu o inteiro teor da decisão; decisão sobre liminar não resolve o mérito.
