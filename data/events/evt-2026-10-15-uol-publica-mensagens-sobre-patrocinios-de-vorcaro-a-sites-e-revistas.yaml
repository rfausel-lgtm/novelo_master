description: Em 15/10/2026 o UOL publicou mensagens que diz terem sido extraídas pela PF do celular de Daniel
  Vorcaro segundo as quais, por meio de patrocínios e investimentos de empresas ligadas a ele, o banqueiro era
  consultado sobre textos de sites e revistas antes da publicação ou pedia alterações. Sobre a CartaCapital, o
  UOL relata contrato de patrocínio de cinco anos fechado em 2021 com o Banco Máxima (depois Master),
  adiantamento de R$ 300 mil em dezembro de 2020, conversa em 2023 sobre a possível entrada de Vorcaro como
  sócio, que não se concretizou, e pedido de adiantamento de publicidade em 2024. Em nota, a publisher Manuela
  Carta diz que houve contrato regular de publicidade de 2021 a 2023, que o grupo voltou a anunciar por meio
  da Kovr e do Will e que Vorcaro nunca a procurou para pedir notícias positivas ou interferir em conteúdo
  jornalístico, dada a separação entre a área comercial e a redação. O Novelo registra desta reportagem
  apenas o trecho sobre a CartaCapital. Publicidade contratada não é irregularidade por si.
