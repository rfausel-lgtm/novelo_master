description: 'A CVM pautou para 08/09/2026 o julgamento do PAS 19957.007976/2020-94, sobre operação fraudulenta
  na terceira emissão de cotas do Brazil Realty FII, com dezenove acusados — entre eles Daniel Vorcaro,
  o pai, o irmão, o Banco Master, a Viking, a Milo, a Sefer, Benjamim Botelho de Almeida, a Entre Investimentos
  e Antônio Carlos Freixo Júnior —, e do PAS 19957.005363/2021-01, conexo, sobre criação de condições
  artificiais de demanda. É o mesmo processo que o voto de dezembro de 2020, ao aceitar acordo em que
  Vorcaro era acusado, considerou sem ''materialidade suficiente para obstar a aceitação das propostas''.
  Registro prospectivo: processos podem ser retirados de pauta na véspera, e o resultado do julgamento
  não é conhecido nesta atualização.'
