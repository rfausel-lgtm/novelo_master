description: 'Na ADPF 1.196/SP (privatização dos serviços funerários e cemiteriais de São Paulo), o
  relator, Min. Flávio Dino, profere decisão monocrática determinando diligências à Prefeitura de SP/SP
  Regula, ao MP-SP e à CVM sobre o vínculo entre a concessionária Cortel e o Banco Master/Banco Máxima via
  Fabiano Zettel, e remete cópia da decisão ao Min. Edson Fachin para juntada nos autos que apuram a
  conduta do Min. André Mendonça — narrando a cronologia entre o encontro Mendonça-Vorcaro de 14/03/2025,
  o pedido de vista do dia seguinte, o voto de Mendonça contra a cautelar de preços funerários em
  04/04/2025, os contratos sem licitação do Instituto ITER com entes públicos de SP posteriores a esse
  voto, e o cargo do irmão de Mendonça na SP Regula. Proferida no mesmo dia da sessão extraordinária do
  Plenário do STF sobre a investigação de Mendonça.'
