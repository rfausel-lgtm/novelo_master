description: O senador Eduardo Girão declarou que Alcolumbre barra a instalação da CPI do Banco Master no
  Senado por "conflito de interesses", citando nominalmente que o irmão do presidente do Senado, Alberto
  Alcolumbre, é conselheiro fiscal da Amapá Previdência, e que Jocildo Silva Lemos, ex-presidente da
  autarquia, foi tesoureiro de sua campanha. Disse ter reunido 53 assinaturas para o requerimento. A
  assessoria de Alcolumbre disse que não comentaria o assunto.
