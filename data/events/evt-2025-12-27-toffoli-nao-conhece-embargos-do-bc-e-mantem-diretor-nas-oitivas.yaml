  - supremo-tribunal-federal
  - banco-central-do-brasil
description: "Despacho de 27/12/2025 no INQ 5.026 (cópia divulgada pelo Poder360; trecho citado também pela
  Agência Brasil): Toffoli deixou de conhecer dos embargos de declaração do Banco Central e de seu diretor de
  Fiscalização, por não serem investigados; escreveu que a participação da autoridade reguladora nos
  depoimentos e acareações é de especial relevância; justificou a urgência das oitivas; determinou os atos sob
  a condução da autoridade policial, com organização por juiz auxiliar do gabinete; manteve o sigilo."
