description: Em conversa com jornalista, durante a negociação da venda do Banco Master ao BRB, Daniel Vorcaro
  foi questionado sobre quais nomes do governo Lula apoiavam a operação e respondeu "Rui, Jaques, Alexandre
  Silveira" — referindo-se a Rui Costa (então ministro da Casa Civil), Jaques Wagner (então líder do governo
  no Senado) e Alexandre Silveira (ministro de Minas e Energia). A Polícia Federal incluiu a mensagem no
  relatório entregue a André Mendonça, usando-a para sustentar o pedido de busca e apreensão contra Wagner
  na 9ª fase da Compliance Zero; Rui Costa e Silveira não são investigados por este fato.
