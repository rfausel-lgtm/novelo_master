description: 'Em audiência na Comissão de Assuntos Econômicos do Senado, o presidente do Banco Central
  foi questionado não pela oposição, mas pelo presidente da comissão, Renan Calheiros, que sustentou que
  ele teria defendido a venda do Master ao BRB e intercedido para que o FGC socorresse o banco com R$
  11 bilhões, citando correspondência de 18/04/2025. Galípolo respondeu: ''A informação está errada. Não
  há nenhuma carta com valor de R$ 11 bilhões, o Banco Central jamais tentou viabilizar a venda.'' E acrescentou:
  ''O Banco Central não tem que reagir a pressão. A minha posição é não reagir a pressão.'''
