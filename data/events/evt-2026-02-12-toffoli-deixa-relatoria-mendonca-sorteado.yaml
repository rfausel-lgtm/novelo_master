description: Após reunião, os dez ministros do STF assinaram nota declarando não caber suspeição de Toffoli,
  reconhecendo a validade de seus atos e acolhendo seu pedido de livre redistribuição dos processos; o
  ministro André Mendonça foi sorteado novo relator. Segundo a CNN, a mudança ocorreu depois de a PF informar
