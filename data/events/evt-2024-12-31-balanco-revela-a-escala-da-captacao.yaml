id: evt-2024-12-31-balanco-revela-a-escala-da-captacao
kind: event
title: Balanço de 2024 registra R$ 2,11 bilhões em letras financeiras, de um instrumento que não existia
  em 2022
event_type: publication
date: '2024-12-31'
date_precision: day
participant_ids:
- banco-master
description: As demonstrações financeiras auditadas medem a operação de captação institucional que o próprio
  banco descrevera ao comitê do Amapá em março de 2024. A letra financeira não constava do passivo em
  2022; somava R$ 486 milhões ao fim de 2023 e R$ 2,11 bilhões ao fim de 2024, com 95,7% vencendo acima
  de cinco anos, enquanto a letra de crédito imobiliário encolhia 76%. A faixa de taxas abriu de um ponto
  único de 115% do CDI para até 150%, e o teto do prefixado subiu de 8,00% para 8,35% ao ano — exatamente
  a taxa que a Amapá Previdência aceitou. Os dezoito regimes próprios responderam por cerca de 88% desse
  estoque.
