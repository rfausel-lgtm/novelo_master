description: 'O presidente do Supremo suspendeu simultaneamente a decisão de André Mendonça, que em 08/09
  afastara o diretor-geral da Polícia Federal e o diretor de Inteligência Policial, e a de Flávio Dino,
  que os reintegrara em 09/09, de modo que nenhum dos dois atos produz efeito. Invocou ''quadro de conflitos
  e sobreposições processuais que configuram grave lesão à ordem pública'' e articulou três feitos: a
  petição instaurada pela Presidência, a petição de relatoria de Mendonça, sobrestada, e a suspensão de
  liminar pedida pela União. Na mesma decisão convocou sessão extraordinária do Plenário para 15/09/2026,
  às 10h.'
