description: Segundo CNN Brasil e Congresso em Foco, o Banco Central indeferiu em setembro de 2025 (dia
  3, segundo a apuração da imprensa) o pedido do BRB, protocolado em março de 2025, para adquirir 49%
  das ordinárias e 100% das preferenciais do Master, apontando riscos excessivos nos ativos; o BRB confirmou
  o indeferimento em comunicado ao mercado e pediu acesso à íntegra da decisão. Em outubro, segundo a
  Reuters, o BRB desistiu da operação.
