description: A diretoria colegiada do Banco Central, sob a presidência de Roberto Campos Neto, aprovou
  por unanimidade a transferência de controle do Banco Máxima a Daniel Vorcaro (Voto BCB 218/2019). Quatro
  dos oito diretores presentes — Maurício Moura, Carolina de Assis Barros, Paulo Sérgio Neves de Souza
  e Otávio Ribeiro Damaso — já integravam a diretoria em fevereiro daquele ano, quando a mesma operação
  fora rejeitada (Voto BCB 20/2019) por falta de comprovação da origem dos recursos. Não há, até a data
  desta atualização, explicação pública individual desses quatro diretores para a mudança de posição,
  nem declaração de Campos Neto sobre a aprovação — ele evitou repetidamente depor sobre o tema à CPI
  do Crime Organizado, protegido por habeas corpus do STF.
