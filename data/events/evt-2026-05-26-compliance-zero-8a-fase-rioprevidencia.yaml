description: Na PET 15676, o relator autorizou busca e apreensão na casa do ex-governador Cláudio Castro,
  de ex-dirigentes da RioPrevidência e nas empresas Mídias Promotora e Planner Corretora. Segundo a PF,
  haveria proximidade pessoal entre Castro e Vorcaro e atuação política para viabilizar aportes de cerca
  de R$ 3,7 bilhões (estimativa da PGR) em produtos do Master, mesmo após pareceres técnicos desfavoráveis.
  Alegações sob investigação.
