description: Sete dias depois de firmado o segundo contrato, com teto de R$ 50 milhões, as partes assinaram
  termo pelo qual R$ 40 milhões seriam quitados com a transferência de 33,33% da sociedade proprietária
  de um jato Legacy 650 e de 20% da sociedade em vias de adquirir um helicóptero EC 155 B1. Os R$ 10 milhões
  restantes seriam pagos mediante reembolso das despesas de utilização das próprias aeronaves. A contratante
  permanece responsável por todo o custo de aquisição das ações, e o escritório não pode aliená-las sem
  autorização dela.
