description: No Relatório de Estabilidade Financeira de maio de 2026, o Comef do Banco Central concluiu
  que a liquidação do conglomerado Master, apesar de ser a maior operação da história do FGC, não representou
  risco sistêmico ao Sistema Financeiro Nacional — as instituições tinham participação inferior a 0,6%
  do SFN em ativos e depósitos.
