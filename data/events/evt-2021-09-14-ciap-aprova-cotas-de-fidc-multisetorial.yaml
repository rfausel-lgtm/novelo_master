title: CIAP delibera aquisição de cotas de FIDC Multisetorial, com aportes de R$ 15 milhões
event_type: corporate_act
date: '2021-09-14'
date_precision: day
participant_ids:
- amapa-previdencia
description: Em reuniões extraordinárias de setembro de 2021, o Comitê de Investimentos da Amprev deliberou
  a aquisição de cotas do FIDC Multisetorial, instruído pelo Parecer Técnico nº 36/2021, com aportes que
  totalizam R$ 15 milhões. A decisão da operação Zona Cinzenta consigna que as deliberações ocorreram
  com inobservância de alertas técnicos e ausência de certificação profissional de membros do comitê.
  O corpus não localizou elemento que ligue esse fundo ao Banco Master ou a Daniel Vorcaro; a trilha entrou
  no caso por integrar o acervo instrutório da mesma investigação.
