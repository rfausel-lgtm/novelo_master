description: A PGR rejeitou, em 15/06/2026, a segunda proposta de delação de Vorcaro, por entender que
  não trazia elementos novos em relação ao material já apreendido; a PF havia chegado à mesma conclusão.
  Vorcaro reorganizou sua defesa em seguida, com o criminalista Sérgio Leonardo assumindo a liderança
  do caso — antecedente direto da terceira tentativa de delação que Vorcaro prepara em setembro de 2026.
