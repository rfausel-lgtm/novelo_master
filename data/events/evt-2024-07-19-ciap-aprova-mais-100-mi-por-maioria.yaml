description: 'Segunda das três deliberações de julho de 2024. A ata registra dois votos contrários antes
  da aprovação por maioria dos conselheiros Jackson Rubens, José Milton Gonçalves e Jocildo Lemos; a proposta
  incluía R$ 100 milhões em letras financeiras do Banco Master condicionados a diligência. A mesma ata
  menciona ''ruído de mercado'' em torno do banco. Segundo a decisão judicial, havia nas sessões alertas
  sobre concentração de 40% da carteira líquida em um único emissor e sobre procedimentos do TCU contra
  a instituição. A ata do Conselho Estadual de Previdência publicada no Diário Oficial identifica os dois
  conselheiros vencidos: Alexandre Flávio Medeiros Monteiro — que provocou a convocação da reunião, preocupado
  com as notícias sobre o banco — e Gláucio Maciel Bezerra. A deliberação ocorreu quatro dias depois de
  o Ministério da Previdência Social emitir o Parecer nº 146/2024, recomendando avaliação de risco reputacional.'
