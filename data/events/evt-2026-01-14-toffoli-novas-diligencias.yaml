description: 'A pedido da PF, o então relator Dias Toffoli determinou nova busca e apreensão em endereços
  ligados a Vorcaro, decretou a prisão temporária de Fabiano Campos Zettel, deferiu busca pessoal em Nelson
  Tanure e expediu carta de ordem para sequestro e bloqueio de bens requeridos pela PGR. A PF havia
  identificado que Zettel embarcaria para Dubai e Tanure para Curitiba horas antes do prazo de cumprimento;
  a prisão de Zettel e a apreensão de passaporte/proibição de sair do país foram medidas específicas dele,
  não de Tanure. Na mesma data, Toffoli cobrou explicações da PF pelo descumprimento de prazo anterior — a
  Direção-Geral respondeu no mesmo dia, atribuindo o atraso a sobrecarga operacional.'
