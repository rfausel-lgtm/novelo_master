id: evt-2026-09-28-partido-novo-pede-a-fachin-a-anulacao-da-vista-de-dino
kind: event
title: O Partido Novo pede a Fachin a anulação do pedido de vista de Flávio Dino na questão de ordem sobre as PET 16.662 e 16.704, segundo a imprensa
event_type: public_act
date: '2026-09-28'
date_precision: day
participant_ids:
- partido-novo
- edson-fachin
- flavio-dino
description: >-
  Segundo o Congresso em Foco (28/09/2026, 18:16) e o Times Brasil, com Estadão Conteúdo (28/09/2026, 19:32), a
  executiva nacional do Partido Novo pediu ao presidente do STF, Edson Fachin, em 28/09/2026, a anulação do pedido
  de vista de Flávio Dino de 15/09/2026 na questão de ordem de Gilmar Mendes sobre reunir as PET 16.662 e 16.704,
  alegando "desvio de finalidade" (segundo o Congresso em Foco) e que a vista "deixou de servir ao exame do
  processo para servir à condução da sessão" (segundo o Times Brasil); pede também, segundo o Congresso em Foco, que
  o efeito suspensivo da vista seja afastado ou tido por ineficaz e, segundo os dois veículos, que, computada a
  posição já manifestada por Dino, se reconheça empate de 4 a 4 com voto de desempate do presidente. Os argumentos
  são do requerente. A PET em que o pedido foi protocolado não foi identificada, e não há decisão de Fachin nem
  resposta de Dino localizadas até 16/10/2026. A vista e a certidão de julgamento de 15/09 já estão no acervo.
