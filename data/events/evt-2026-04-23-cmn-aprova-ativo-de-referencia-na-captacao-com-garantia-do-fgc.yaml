id: evt-2026-04-23-cmn-aprova-ativo-de-referencia-na-captacao-com-garantia-do-fgc
kind: event
title: CMN aprova a Resolução 5.295, com o Ativo de Referência para captações com garantia do FGC
event_type: regulatory_act
date: 2026-04-23
date_precision: day
participant_ids:
  - conselho-monetario-nacional
  - fundo-garantidor-de-creditos
  - banco-central-do-brasil
description: O CMN aprovou em 23/04/2026 a Resolução 5.295, que altera as regras de alocação de títulos
  públicos federais pelas instituições associadas ao FGC. O texto consolidado do BC inclui o Ativo de
  Referência entre os gatilhos da alocação, com fatores escalonados de 1º de julho de 2026 a 1º de julho de
  2028, e marca a vigência dos dispositivos alterados a partir de 1º/6/2026. Segundo nota do BC citada pela
  Reuters, pelo Capital Aberto e pela Folhapress, as medidas visam mitigar o risco moral de captações
  excessivamente ancoradas na garantia do FGC. A Folhapress afirma que a decisão ocorre no rastro da crise do
  Banco Master; o Novelo registra o enquadramento como atribuído e não afirma nexo causal. O texto original da
  resolução e a nota do BC não foram abertos.
