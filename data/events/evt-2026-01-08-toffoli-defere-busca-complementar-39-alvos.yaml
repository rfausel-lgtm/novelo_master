description: 'Pedido complementar do PGR, encampando manifestação da Procuradoria da República em São
  Paulo, ampliou para 39 o número de alvos de busca e apreensão na investigação sobre o Banco Master —
  34 pessoas físicas e 5 pessoas jurídicas. Toffoli deferiu parcialmente, excluindo apenas três alvos já
  alcançados por diligências anteriores (um dos endereços de Daniel Vorcaro, André Felipe de Oliveira
  Seixas Maia e o próprio Banco Master). Entre os alvos com busca domiciliar deferida estão Nelson Tanure,
  em endereço no Leblon (Rio de Janeiro), e Fabiano Zettel com a esposa Natália Vorcaro Zettel, em
  endereço em Nova Lima (Minas Gerais). É medida de busca e apreensão, distinta e anterior à busca pessoal
  em aeroportos de 13-14/01/2026 já registrada no acervo — nenhuma das duas peças amplia ou repete a
  hipótese de "sócio oculto" contra Tanure.'
