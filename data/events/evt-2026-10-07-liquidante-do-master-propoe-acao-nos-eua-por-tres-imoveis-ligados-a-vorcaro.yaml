id: evt-2026-10-07-liquidante-do-master-propoe-acao-nos-eua-por-tres-imoveis-ligados-a-vorcaro
kind: event
title: Liquidante do Master propõe ação nos EUA para reaver o valor de três imóveis ligados a Vorcaro, segundo
  a imprensa
event_type: public_act
date: 2026-10-07
date_precision: day
participant_ids:
  - efb-regimes-especiais-de-empresas
  - banco-master
  - daniel-vorcaro
description: Segundo o Metrópoles (coluna de Demétrio Vecchioli, 09/10), o Times Brasil/CNBC (09/10) e o Rio
  Times (12/10), a EFB Regimes Especiais de Empresas, liquidante do Banco Master, propôs em 07/10/2026, no
  Tribunal de Falências dos EUA para o Distrito Sul da Flórida (Fort Lauderdale), ação contra Clear River
  Properties LLC e Goldbeach Properties LLC, empresas de Delaware titulares de três imóveis em Aspen e Miami.
  O liquidante alega que as compras à vista, entre abril de 2024 e fevereiro de 2025, foram pagas com recursos
  do Master que teriam passado por um fundo nas Bahamas (Mosaic Short Duration Fund). Pede o reconhecimento
  dos imóveis como patrimônio do Master ou, alternativamente, a restituição de ao menos US$ 77 milhões (Clear
  River) e US$ 92,5 milhões (Goldbeach), US$ 169,5 milhões no total, além do bloqueio da venda e da nomeação
  de administrador judicial. O docket do tribunal, espelhado pelo CourtListener, confirma a autuação em
  07/10/2026 do processo nº 26-01362 (juiz Scott M. Grossman) contra as duas empresas, com citações cumpridas
  em 15 e 16/10 e nenhuma decisão de mérito até 16/10. As alegações são do liquidante e não foram julgadas; o
  Novelo não leu a petição. Daniel Vorcaro não é réu; a imprensa descreve os imóveis como ligados a ele. Os
  valores em reais publicados variam entre os veículos e não são usados.
