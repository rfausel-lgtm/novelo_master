description: 'Em 01/09/2026, o Conselho Federal da OAB manifestou ''extrema preocupação'' com a crise
  institucional, sem pedir o afastamento de ninguém — postura mais moderada. Dois dias depois, a seccional
  paranaense da OAB foi além, pedindo o afastamento cautelar de Alexandre de Moraes e a suspeição de Paulo
  Gonet na condução da PET 16.662. As duas notas registram posições distintas dentro da própria entidade:
  não representam consenso nacional da advocacia.'
