description: 'Balanço do estado das alegações de que agentes da PF teriam intimidado Vorcaro para impedir
  uma delação. Ele não nomeou nenhum agente — os supostos autores estavam mascarados e são descritos genericamente
  —, não houve perícia, exame de corpo de delito ou qualquer verificação material, e nenhum agente foi
  formalmente investigado. Os pedidos do partido Novo contra o diretor-geral seguem sem decisão, e o arquivamento
  é apenas parecer da PGR, cuja homologação cabe ao relator. Do outro lado, a resposta da corporação veio
  apenas por interlocutores, sem nota institucional, e a versão do encontro casual em Londres é enfraquecida
  pelo próprio relatório da PF. Pesa contra a alegação o contexto: é a terceira tentativa de delação,
  feita no mesmo dia em que ele deveria depor à PF, e o pedido de reabertura da colaboração veio no mesmo
  ato. E pesa sobre o arquivamento o fato de o procurador-geral que o pediu ser ele próprio citado nas
  mensagens.'
