- daniel-vorcaro
- banco-master
description: 'O voto BCB nº 20/2019, relatado pelo diretor Sidnei Corrêa Marques, indeferiu o pedido de
  transferência do controle do Banco Máxima a Daniel Vorcaro. Os dois fundamentos foram a falta de comprovação
  da origem dos recursos empregados na operação e a falta de demonstração de capacidade econômica e financeira
  dos pretendentes. O voto registra que parcela expressiva dos recursos teria saído do próprio banco.
  A análise de reputação ilibada foi dispensada por economia processual, já que outros dois quesitos bastavam
  para barrar o pedido. As fontes divergem sobre o dia: a data de 13 de fevereiro aparece na reconstituição
  do Valor e a de 13 de janeiro no texto que a acompanha.'
