description: A Tether Investments transferiu a primeira parcela de um empréstimo de US$ 300 milhões à
  Titan Holding, empresa pessoal de Daniel Vorcaro, no mesmo dia em que o BRB anunciou publicamente a
  intenção de comprar o Banco Master. A segunda parcela foi transferida quatro dias depois. A garantia
  do empréstimo era a carteira de crédito consignado do banco, incluindo operações do CredCesta — parte
  da qual também integrava a carteira depois vendida ao BRB.
