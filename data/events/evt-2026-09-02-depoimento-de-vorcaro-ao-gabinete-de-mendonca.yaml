id: evt-2026-09-02-depoimento-de-vorcaro-ao-gabinete-de-mendonca
kind: event
title: Vorcaro depõe ao gabinete de Mendonça e alega intimidação para não delatar
event_type: statement
date: '2026-09-02'
date_precision: day
participant_ids:
- daniel-vorcaro
- andre-mendonca
- andrei-rodrigues
- policia-federal
description: Em depoimento por vídeo a juiz auxiliar do gabinete de André Mendonça e a um procurador da
  República, feito a requerimento da defesa, Vorcaro afirmou ter sofrido tortura psicológica, maus-tratos
  e ameaças veladas na prisão para não relatar fatos ligados à Polícia Federal, e disse acreditar que
  a delação foi recusada porque ele poderia citar o diretor-geral da corporação. Integrantes da PF e da
  PGR responderam que não houve apresentação de fatos concretos e que se trataria de pretexto para reabrir
  a negociação; interlocutores do diretor-geral afirmam que ele nunca teve relação com o banqueiro.
