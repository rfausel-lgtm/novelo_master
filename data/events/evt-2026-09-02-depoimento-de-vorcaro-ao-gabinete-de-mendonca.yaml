description: Em oitiva realizada na manhã de 27/08/2026, dentro da Papudinha, em Brasília, conduzida pelo
  juiz auxiliar João Azambuja, do gabinete de André Mendonça, com a presença de dois advogados de Vorcaro
  e de um integrante do MPF — e sem a Polícia Federal, ausência que gerou críticas na corporação —, o
  banqueiro alegou ter sofrido 'graves intimidações', tortura psicológica e maus-tratos para não citar
  a PF em eventual delação. O gabinete do ministro afirmou que a oitiva 'foi um ato processual regular',
  atendendo a pedido expresso da defesa. O conteúdo só veio a público em 02/09/2026, mesma data em que
  a PGR se manifestou pelo arquivamento — o corpus registrava antes essa data como a da oitiva, o que
  foi corrigido. No dia seguinte à oitiva, 28/08, Vorcaro prestou depoimento distinto à própria PF, por
  videoconferência, cujo vídeo veio a público em 04/09.
