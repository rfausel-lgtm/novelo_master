id: evt-2026-05-19-pf-deflagra-a-7a-fase-da-compliance-zero-contra-perito-criminal-federal
kind: event
title: PF cumpre mandados contra perito criminal federal investigado por suposto repasse de informações
  sigilosas à imprensa (operação que Band e Estadão chamam de 7ª fase da Compliance Zero)
event_type: investigation_step
date: 2026-05-19
date_precision: day
participant_ids:
  - policia-federal
  - supremo-tribunal-federal
  - andre-mendonca
  - joao-claudio-nabas
description: "Em 19/05/2026, segundo nota do STF, a PF cumpriu dois mandados de busca e apreensão e medidas
  cautelares diversas da prisão, entre elas a suspensão do exercício da função pública, contra um policial
  federal investigado na condição de perito criminal federal, por decisão do relator André Mendonça, de 18/05,
  que acolheu representação da PF em apuração de eventual violação de sigilo funcional. Band e Estadão chamam
  a operação de sétima fase da Compliance Zero (numeração da imprensa: a nota do STF não a usa, e a numeração
  oficial da PF não foi localizada); SBT News e Estadão nomeiam o perito João Cláudio Nabas, que
  consta dos autos da Pet 15.625 no verbete dele. Segundo a PF, na nota do STF, o investigado teria repassado
  a integrante da imprensa informações sigilosas obtidas da análise de material apreendido em uma das fases da
  operação; SBT News e Estadão dizem que a suspeita envolve o contrato do escritório da mulher do ministro
  Alexandre de Moraes com o Banco Master e conversas de Moraes com Vorcaro. Posição da defesa: o Estadão
  procurou a defesa do perito e não houve resposta; a Associação Nacional dos Peritos Criminais Federais
  (APCF) disse, em nota, prestar assistência a ele para assegurar o respeito à ampla defesa e ao contraditório
  e pediu cautela contra conclusões precipitadas. Depois, em 02/07/2026, a defesa pediu nos autos perícia
  para contestar a autenticidade de um dos arquivos que a PF atribui a ele (posição registrada no verbete). O STF afirmou que as medidas não têm como alvo jornalistas
  ou veículos de imprensa. O que este registro NÃO afirma: a suspeita é da PF e não foi julgada; a medida é
  cautelar e não é condenação; o STF não nomeou o investigado; o Novelo não registra o local das buscas. O
  evento de 18/05 (evt-2026-05-18-mendonca-suspende-perito-suspeito-de-vazar-material-vorcaro) traz a decisão
  lida nos autos; as fontes lidas aqui não trazem manifestação de Moraes sobre esta fase."
