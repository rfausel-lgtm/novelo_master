description: >-
  Segundo a Bahia Notícias e o SBT News (25/09/2026), a revista Veja publicou, em matéria de capa da edição que
  chegou às bancas em 25/09/2026, mensagens que teriam sido extraídas pela PF do celular de Daniel Vorcaro, com
  expressões de amizade entre ele e o presidente do Senado, Davi Alcolumbre, uma de 01/02/2025 e outra do fim
  de março de 2025. Na noite de 24/09, Alcolumbre respondeu em nota, chamando a matéria de "injusto ataque",
  dizendo tratar-se de mensagens de teor pessoal que não indicam ilegalidade e anunciando medidas judiciais; a
  defesa de Vorcaro criticou a divulgação "seletiva e fragmentada". A Veja não foi aberta pela equipe; nas
  fontes lidas, as mensagens não tratam de fundos de previdência, da Amprev nem de nomeações. O Novelo não
  transcreve as mensagens nem localizou documento oficial de origem.
