description: >-
  Em sessão de 13/10/2026, a 2ª Câmara do Tribunal de Contas da União, em acórdão de relação de relatoria do
  ministro Jorge Oliveira (Acórdão 5163/2026), decidiu sobrestar o julgamento das contas de 2025 do Banco
  Central do Brasil (TC 007.138/2026-1) até o trânsito em julgado da deliberação a ser proferida no TC
  022.950/2025-7, quando a unidade especializada, ao instruir novamente o processo, deverá avaliar se o TC
  008.216/2025-8 e a Reclamação 88.121 do STF têm potencial para influir no mérito das contas. Segundo o
  acórdão, a unidade técnica propunha julgá-las regulares, com quitação plena, e o sobrestamento acompanha o
  parecer do Ministério Público junto ao TCU. O TC 022.950/2025-7 (relator Jhonatan de Jesus) é, segundo cópia
  de despacho de 24/03/2026 hospedada pelo Poder360, a representação do MPTCU sobre a atuação do Banco Central
  na supervisão e na resolução do Banco Master, sobrestada por esse despacho até elementos oficiais de
  apurações internas do BC, da CGU e do STF; no TC 008.216/2025-8, de relatoria de Jorge Oliveira, está sobrestado pedido de reexame
  relacionado a representação do MPTCU sobre a atuação do Banco Central e, eventualmente, da CVM na operação
  entre o BRB e o Master. O acórdão não aponta irregularidade em ato de ninguém; os "responsáveis" listados,
  entre eles o presidente do Banco Central, são os gestores que prestam as contas. O Novelo não leu a Ata
  35/2026 nem os autos do TC 022.950/2025-7, que tramita sob sigilo.
