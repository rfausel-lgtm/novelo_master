id: evt-2026-10-13-tcu-sobresta-o-julgamento-das-contas-de-2025-do-banco-central
kind: event
title: TCU sobresta o julgamento das contas de 2025 do Banco Central até o desfecho da representação sobre a supervisão do Banco Master
