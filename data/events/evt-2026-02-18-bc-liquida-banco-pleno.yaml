description: O BC decretou a liquidação do Banco Pleno S.A. (ex-Voiter) e da Pleno DTVM por comprometimento
  econômico-financeiro, deterioração de liquidez e infringência às normas; grupo de pequeno porte (segmento
  S4), 0,04% do ativo total do SFN. O Ato do Presidente nº 1.377 fixa como termo legal da liquidação o
  dia 22 de dezembro de 2025 e nomeia liquidante; o Ato nº 1.378 alcança a Pleno DTVM.
