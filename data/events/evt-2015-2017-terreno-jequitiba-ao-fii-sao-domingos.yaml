description: Terreno em Jequitibá (MG), regularizado por R$ 2,5 milhões em 2015, foi vendido por R$ 57
  milhões ao FII São Domingos, administrado pela Foco DTVM e abastecido por regimes próprios de previdência
  de servidores públicos. A operação — valorização de 2.180% em dois anos — justificou receita operacional
  bruta de R$ 89 milhões da Viking Participações, usada para lastrear o aporte de R$ 50 milhões exigido
  pelo Banco Central na análise da compra do Banco Máxima. O fundo teve prejuízo de R$ 109 milhões em
  2017 e, em 2022, a CVM multou a administradora e o diretor do fundo em mais de R$ 1 milhão por má gestão,
  incluindo operações que beneficiaram empresas da família Vorcaro.
