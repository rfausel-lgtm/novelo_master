description: Segundo o Times Brasil (28/08/2026) e o Jurinews (29/08/2026), o ministro André Mendonça, do STF,
  determinou em 28/08/2026, ao analisar pedido do BRB, o cancelamento de indisponibilidades que ainda atingiam
  bens, direitos e garantias vinculados ao banco, entre eles seis Cédulas de Crédito Bancário (CCBs) e 23
  imóveis dados em garantia. Segundo o Jurinews, as CCBs foram cedidas pelo Banco Master ao BRB em junho de
  2025 e, segundo informações apresentadas pelo banco no processo, a cessão foi integral e sem coobrigação; os
  imóveis estão registrados em São Paulo. Segundo a imprensa, o ministro entendeu que a indisponibilidade só
  se mantém enquanto ligada à finalidade que a motivou, com critérios de "necessidade, pertinência e
  proporcionalidade" (Times Brasil), e que, como o BRB já havia sido excluído das medidas patrimoniais, os
  bloqueios não deveriam continuar produzindo efeitos contra ele. Ainda segundo as duas fontes, determinou
  providências urgentes na Central Nacional de Indisponibilidade de Bens (CNIB) e, segundo o Jurinews, a
  comunicação ao cartório das matrículas. O Jurinews registra que o ministro ressalvou que os bens podem
  voltar a ser bloqueados se surgirem elementos concretos que o justifiquem e preservou restrições impostas a
  terceiros ou por outras decisões. É decisão cautelar de indisponibilidade de bens, sem juízo de mérito sobre o BRB ou o Master. A
  decisão, o número do processo e o parecer do MPF não foram localizados; as fontes não declaram apuração
  própria nem acesso ao texto da decisão.
