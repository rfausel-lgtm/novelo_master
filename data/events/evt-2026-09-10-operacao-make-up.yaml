description: 'A Polícia Federal cumpriu na manhã de 10/09/2026 os mandados autorizados sete dias antes pelo ministro
  Flávio Dino na PET 16.669/DF, e a decisão perdeu o sigilo por cláusula que ela própria trazia: ''cumpridas as
  diligências de busca e apreensão, determino o levantamento do sigilo''. A apuração trata do desvio de recursos
  de emendas parlamentares repassadas a duas organizações sociais presididas por Karina Ferreira da Gama, e alcança
  o deputado federal Mário Frias, roteirista e produtor executivo do filme ''Dark Horse''. Além das buscas, a decisão
  suspendeu a atividade econômica das duas entidades, barrou 22 empresas de contratar com o poder público, suspendeu
  pagamentos de contratos públicos a elas, proibiu 29 investigados de deixar o país e de se comunicarem entre si,
  e avocou ao Supremo o inquérito paulista do contrato de wi-fi.'
