description: >-
  Em 16/06/2026, depois do despacho de André Mendonça que levantou o sigilo das Pets 15.873 e 15.978, a CNN
  Brasil, o Poder360, a IstoÉ, o Metrópoles e a Agência O Globo publicaram descrições de relatórios da Polícia
  Federal sobre viagens e hospedagens pagas por Daniel Vorcaro. Segundo essas reportagens, em 18/06/2024
  Vorcaro pediu a "Leo Serrano" reservas no hotel Four Seasons, em Lisboa, para si e para "Ciro" e "Hugo"; uma
  fatura do hotel registra cinco diárias e 3.155,71 euros, associada pela PF a duas suítes júnior; e a PF
  identifica "Ciro" e "Hugo" como o senador Ciro Nogueira e o deputado Hugo Motta a partir das mensagens, da
  lista de nomes enviada por Vorcaro e da fatura (leitura da PF; a mensagem não traz sobrenomes). Os valores
  divergem entre os veículos: R$ 91.280,59 por cinco diárias atribuídas a Ciro (R$ 18.256,12 por diária,
  segundo a Agência O Globo); custo de cerca de R$ 90 mil para cada um, segundo o Estadão Conteúdo; cerca de
  R$ 18 mil ou R$ 20.038,76 pela fatura em euros, conforme o veículo; e, segundo o Correio Braziliense,
  R$ 16.784,89 de diárias pagas pelo Senado ao senador na mesma data. A Agência O Globo registra estimativa da
  PF de R$ 468.721,78 em "benefício econômico direto" ao senador em viagens (Nova York, Lisboa e Courchevel) e
  jantares, e que os investigadores pediram "cautela" com referências a "Ciro" em listas de pagamentos e
  diálogos, por possível homônimo; a ressalva, tal como descrita, trata de listas e diálogos. Segundo o
  Correio da Manhã, Hugo Motta afirmou em 17/06 que viajou no jato de Vorcaro a convite de Ciro e que Vorcaro
  pagou a hospedagem, mas disse ter "ganho" apenas duas diárias; à Gazeta do Povo e ao Correio Braziliense,
  descreveu a viagem como "evento corporativo" e "encontro jurídico". A IstoÉ e a Gazeta do Povo registram que
  Motta não é investigado, o que o Novelo não localizou em documento oficial. Segundo a Folha de S.Paulo (via
  Brasil 247), Fábio Faria constava de lista de convidados e declarou que não esteve em Lisboa em 2024. A
  defesa de Ciro disse ao Poder360 que prestará esclarecimentos nos autos. O Novelo não localizou os relatórios
  nos autos públicos: a Pet, a data do documento (a IstoÉ diz que foi produzido em abril de 2026) e um PDF não
  constam das fontes, e tudo o que se registra deles é descrição da imprensa.
