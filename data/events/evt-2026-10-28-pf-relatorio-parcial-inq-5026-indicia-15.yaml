description: O relatório é parcial. A própria PF pediu mais 60 dias para concluir perícias e outras
  diligências. Indiciamento não é denúncia nem condenação, e o acervo não registra, até 29/10/2026, decisão do
  STF sobre o pedido nem manifestação da PGR. Segundo o relatório parcial da PF, datado de 28/10/2026 e
  assinado por quatro delegados da PF, foram indiciadas 15 pessoas no Inq 5026/STF. Por vínculo, são seis
  ligadas ao Banco Master, seis dirigentes do BRB à época, duas ligadas à Tirreno e um advogado. O relatório
  cita dispositivos das Leis 7.492/1986, 12.850/2013 e 9.613/1998. Segundo a CNN Brasil e o Poder360, o
  relatório foi encaminhado ao STF em 28/10. A PF afirma que o Master cedeu ao BRB cerca de R$ 17,5 bilhões
  em créditos entre julho de 2024 e outubro de 2025 e que ao menos R$ 12,2 bilhões não tiveram a existência
  comprovada; a PF ressalva que os valores variam entre o seu laudo, a ação do BRB e os documentos do Banco
  Central, embora diga que convergem na ordem de grandeza. A defesa de Daniel Vorcaro chama o indiciamento de
  "frágil e absurdo", diz que nenhuma perícia oficial apurou prejuízo, que os números vêm de uma ação do
  próprio BRB e que o pedido de mais prazo mostra que a investigação não terminou, e pede o arquivamento do
  inquérito e a revogação da prisão preventiva.
