id: evt-2026-06-23-cvm-rejeita-proposta-de-termo-de-compromisso-da-diretora-financeira-da-reag-investimentos
kind: event
title: CVM rejeita a proposta de termo de compromisso de Fabiana Franco, diretora financeira da Reag
  Investimentos, no PAS 19957.011252/2025-50
event_type: regulatory_act
date: 2026-06-23
date_precision: day
participant_ids:
  - comissao-de-valores-mobiliarios
  - fabiana-franco
  - reag-investimentos
description: Em reunião de 23/06/2026, divulgada pela CVM em 30/06, o Colegiado, por unanimidade e
  acompanhando o parecer do Comitê de Termo de Compromisso, rejeitou a proposta de termo de compromisso de
  Fabiana Franco, diretora financeira da Reag Investimentos S.A., no PAS 19957.011252/2025-50. O processo foi
  instaurado pela Superintendência de Relações com Empresas, sem outros acusados, para apurar supostas
  irregularidades na não elaboração das demonstrações financeiras anuais de 2024 e dos formulários de
  informações trimestrais do 1º e 2º trimestres de 2025; a proponente havia oferecido pagar R$ 150.000,00. A
  Procuradoria Federal Especializada não viu óbice jurídico ao acordo. O Comitê entendeu não ser conveniente
  nem oportuno aceitá-la, em razão da "gravidade, em tese, das condutas analisadas" e da existência de outros
  processos e procedimentos da CVM sobre o grupo econômico da Reag, que, segundo o parecer, guardam
  pertinência com "possível atuação em desvio no âmbito do referido grupo"; para o Comitê, "o melhor desfecho,
  no particular, seria o julgamento pelo Colegiado da CVM". Em seguida, o diretor Igor Muniz foi sorteado
  relator. A rejeição não é condenação, não é julgamento do mérito e não é reconhecimento de culpa; a CVM não
  decidiu se houve infração. A ata e a nota não reproduzem as razões da proponente, e nenhum pronunciamento
  público dela foi localizado.
