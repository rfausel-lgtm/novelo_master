id: evt-2026-11-03-cvm-pauta-o-julgamento-da-reag-trust-cbsf-e-de-ramon-pessoa-dantas
kind: event
title: CVM pauta para 03/11 o julgamento da Reag Trust DTVM (hoje CBSF, em liquidação) e de Ramon Pessoa Dantas
event_type: regulatory_act
date: 2026-11-03
date_precision: day
participant_ids:
