description: "A pauta oficial da CVM, atualizada em 09/10/2026 e com o processo publicado no Diário Eletrônico
  de 08/10, inclui na sessão de julgamento de 03/11/2026, às 15h, o PAS 19957.017563/2025-22, sob relatoria do
  diretor Igor Muniz, para apurar as responsabilidades da Reag Trust Distribuidora de Títulos e Valores
  Mobiliários S.A., atualmente denominada CBSF Distribuidora de Títulos e Valores Mobiliários Ltda. (em
  liquidação extrajudicial), e de Ramon Pessoa Dantas, diretor responsável pela administração de carteiras à
  época dos fatos, ambos por infração ao art. 22 da Resolução CVM 21. Registro prospectivo: a pauta não é
  julgamento e pode ser retirada ou adiada; Dantas é acusado, não condenado; a pauta não descreve os fatos
  imputados nem relaciona o processo ao Banco Master. O resultado não é conhecido nesta atualização; rever em
  04/11/2026."
