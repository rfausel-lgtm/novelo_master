date_precision: day
participant_ids:
  - daniel-vorcaro
  - edson-fachin
  - supremo-tribunal-federal
description: 'Segundo CNN Brasil, O Tempo e Agência Brasil, que relatam o conteúdo da petição, a defesa de
  Daniel Vorcaro enviou ao STF, na sexta-feira 16/10/2026, petição dirigida ao presidente da Corte, Edson
  Fachin, pedindo a abertura de investigação sobre a divulgação de áudios, mensagens e outros conteúdos
  extraídos do celular apreendido na Operação Compliance Zero. Segundo os veículos, a defesa requer uma
  "investigação criminal ampla" (O Tempo) que identifique os responsáveis, "agentes públicos" ou "terceiros";
  afirma que circulam conversas de Vorcaro com seus advogados, o que violaria o sigilo advogado-cliente;
  sustenta que o material divulgado não pode embasar novas investigações contra ele, sendo a "única
  repercussão jurídica" a instauração de inquérito para apurar os responsáveis (Agência Brasil); e fala em "processo de linchamento público"
  (Agência Brasil) e "espetacularização midiática" (O Tempo). Segundo a CNN Brasil, a defesa também diz não
  confirmar o teor de tudo o que veio a público e sustenta que os conteúdos podem ter sido manipulados. Tudo
  isso é alegação da defesa: o Novelo não leu a petição e não afirma a autenticidade nem a procedência do
  material, nem a tese de que ele não possa ser usado. Não foram localizados número de processo, despacho ou
  manifestação de Fachin, do STF, da PF ou da PGR. É pedido distinto do que levou à decisão de 06/03/2026 do
  relator André Mendonça na Pet 15612 (inquérito autuado como Pet 15.625; ver
  evt-2026-03-06-mendonca-inquerito-vazamento): este é de outubro e dirigido à Presidência do STF. Nenhuma das
  reportagens diz que ele se ligue àquele inquérito, e o Novelo não faz essa ligação.'
