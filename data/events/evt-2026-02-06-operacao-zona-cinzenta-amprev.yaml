description: A PF cumpriu quatro mandados de busca e apreensão em Macapá — na sede da Amprev e nos endereços
  de José Milton Afonso Gonçalves, Jackson Rubens de Oliveira e Jocildo Silva Lemos —, autorizados pela
  4ª Vara Federal Criminal da SJAP, por suspeita de gestão fraudulenta e temerária (art. 4º, caput e parágrafo
  único, da Lei 7.492/1986) na aplicação de R$ 400 milhões em letras financeiras do Banco Master. A decisão
  também deferiu a quebra de sigilo telemático junto a Apple e Google e o compartilhamento de provas com
  MP-AP, Receita Federal, CGU e Banco Central, e registra que cautelar anterior da mesma investigação
  já havia afastado sigilo telemático. Davi Alcolumbre não está entre os investigados, segundo a CNN.
