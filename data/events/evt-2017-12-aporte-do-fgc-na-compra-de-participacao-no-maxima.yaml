id: evt-2017-12-aporte-do-fgc-na-compra-de-participacao-no-maxima
title: Aporte de R$ 15,447 milhões do FGC na compra de participação no Máxima
event_type: transaction
date: 2017-12
date_precision: month
participant_ids:
- daniel-vorcaro
- fundo-garantidor-de-creditos
- banco-master
description: 'Os votos do Banco Central registram, segundo a reconstituição publicada a partir dos extratos
  obtidos pelo Valor Econômico, aporte de R$ 15,447 milhões do Fundo Garantidor de Créditos em dezembro
  de 2017 para a compra de participação no banco. Verificação posterior da equipe enfraqueceu o registro:
  o número aparece em um único veículo e não é reproduzido pelas demais coberturas dos mesmos votos, que
  listam outros valores sem mencionar o FGC. Permanece sem esclarecimento qual teria sido o instrumento
  e quais as condições. Registre-se, porém, que o Estatuto do FGC vigente à época previa expressamente
  operações de assistência financeira a instituições associadas e a seus acionistas controladores, inclusive
  para promover transferência de controle acionário — de modo que apoio do fundo nessa operação não seria,
  por si só, atípico. Há ainda notícia de um empréstimo emergencial distinto, de R$ 20 milhões a R$ 30
  milhões, concedido pelo FGC ao Máxima em 2019; nenhuma fonte localizada reconcilia os dois números.'
