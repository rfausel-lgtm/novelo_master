description: "Disputa entre veículos, registrada com as duas versões. Em 16/10/2026 o Metrópoles publicou
  mensagens que diz ter obtido entre Daniel Vorcaro e Guilherme Barros e afirmou que a Folha segurou e
  amenizou um perfil do banqueiro publicado em 30/08/2024: segundo o portal, Vorcaro prometeu a Barros um
  prêmio de R$ 1 milhão se a reportagem fosse segurada, Barros escreveu em 08/08 que o diretor de Redação
  Sérgio Dávila havia respondido, houve encontro na sede do jornal em 12/08 e trechos favoráveis foram depois
  retirados. No mesmo dia a Folha respondeu que a reportagem não foi segurada nem amenizada, que Vorcaro pediu
  prazo para ser ouvido, que a visita foi pedida por Barros para o banqueiro dar sua versão, que a atualização
  posterior incluiu a prisão de Vorcaro e que Dávila só soube do valor oferecido a Barros pelas mensagens
  vazadas; chamou a reportagem de retaliação à do UOL sobre o Metrópoles e informou ter recebido R$
  516.441,60 em anúncios veiculados de 2021 a 2025, segundo seu departamento comercial. Barros diz que a matéria saiu com
  independência editorial. O Novelo não comparou as versões da reportagem de 2024 e não afirma qual relato
  está correto."
evidence_class: A
