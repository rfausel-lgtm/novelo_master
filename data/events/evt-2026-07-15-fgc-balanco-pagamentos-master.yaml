description: 'Balanço mais recente localizado sobre a operação de ressarcimento: o FGC desembolsou R$
  40,03 bilhões (98,54% do previsto) a mais de 718 mil credores nos três bancos do núcleo Master. Somando
  Banco Pleno e Will Bank, o total pendente em todo o conglomerado era de R$ 1,83 bilhão. É a maior operação
  de ressarcimento da história do fundo, estimada inicialmente em 1,6 milhão de credores e R$ 41 bilhões.
  O processo não correu sem atrito: 50 dias após a liquidação, o FGC já acumulava milhares de reclamações
  por demora e instabilidade de sistema, mesmo pagando em ritmo classificado pela imprensa como recorde
  para o fundo.'
