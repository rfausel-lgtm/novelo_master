id: evt-2026-02-19-mendonca-autoriza-o-fluxo-ordinario-de-pericia-da-pf-na-compliance-zero
kind: event
title: Mendonça autoriza o fluxo ordinário de perícia da PF na Compliance Zero e exige pedido prévio para
  novas investigações
event_type: judicial_decision
date: 2026-02-19
date_precision: day
participant_ids:
  - andre-mendonca
  - policia-federal
  - supremo-tribunal-federal
description: "Uma semana depois de assumir a relatoria (sorteio de 12/02/2026), o ministro André Mendonça
  decidiu na Pet 15.198, em 19/02/2026, atendendo a pedido da PF, que a perícia dos cerca de 100 dispositivos
  apreendidos na 2ª fase da Operação Compliance Zero siga o fluxo ordinário de trabalho pericial da
  instituição, com distribuição entre peritos; autorizou diligências ordinárias, como oitivas na sede da PF, e
  a custódia do material nos depósitos da PF. Impôs compartimentação (Corregedoria-Geral, Diretoria de
  Inteligência, demais áreas) e dever de sigilo profissional inclusive perante superiores hierárquicos, e
  determinou que qualquer nova investigação ou inquérito seja antes requerido a ele. Segundo o Estadão
  Conteúdo e a CartaCapital, até então apenas quatro peritos autorizados por Toffoli podiam analisar os
  aparelhos. Sobre o sigilo, o texto da decisão determina a manutenção do nível III, como diz a notícia do
  STF; os veículos divergem: o título da CartaCapital e do InfoMoney fala em redução (a CartaCapital cita
  passagem do grau 4 para o 3), o do Jovem Pan fala em manutenção. O Novelo registra a divergência como limite
  e adota apenas o que o texto da decisão diz. A decisão não trata do mérito das suspeitas apuradas."
