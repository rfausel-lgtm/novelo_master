description: Em 15/10/2026 o Grupo Globo comunicou o desligamento de Frederic Kachar, diretor-geral de Mídia
  Impressa e Rádio havia 29 anos na empresa, e disse que o conteúdo de conversas privadas dele com Daniel
  Vorcaro, de outubro de 2023 a julho de 2025, às quais teve acesso em 14/10, "revela uma relação inadequada
  do executivo com um anunciante". A nota reafirma a independência editorial dos veículos do grupo e informa
  que Luis Henrique Guimarães assume interinamente o cargo. A nota não nomeia o anunciante nem descreve as
  mensagens. Kachar não respondeu à Gazeta do Povo; nenhuma manifestação dele foi localizada até 17/10/2026.
