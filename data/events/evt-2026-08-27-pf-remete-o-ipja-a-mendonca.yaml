description: Por meio do Ofício 3305795/2026-CINQ/CGRC/DICOR/PF, assinado digitalmente na noite de 27/08/2026
  por quatro delegados, a Polícia Federal encaminhou ao relator o IPJ-A 3298613/2026, em cumprimento a
  requisição judicial da PET 15.556. O laudo foi produzido em prazo de 72 horas e a própria PF registra
  que não é exaustivo e que não houve atos de aprofundamento dirigidos a magistrados ou a membros do Ministério
  Público.
