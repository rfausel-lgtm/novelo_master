description: Em 27/03/2026 o Banco Central decretou a liquidação extrajudicial da Entrepay Instituição de
  Pagamento, da Acqio Adquirência e da Octa Sociedade de Crédito Direto, pelos Atos do Presidente nº 1.381,
  1.382 e 1.383. Segundo a nota do BC reproduzida por Agência Brasil, Seu Dinheiro e Investidor10, a medida
  foi motivada pelo comprometimento da situação econômico-financeira da instituição líder, pela infringência
  às normas e por prejuízos que sujeitam credores a risco anormal; o conglomerado detinha cerca de 0,009% dos
  ativos do sistema financeiro, e as captações não são cobertas pelo FGC. Os bens de controladores e
  ex-administradores ficam indisponíveis. O Investidor10 ressalva que o BC não citou o Master ao decretar a
  liquidação. Segundo a averbação na Receita Federal, Antonio Carlos Freixo Júnior consta como diretor da
  Entrepay desde fevereiro de 2022. O BC afirmou que continuará apurando responsabilidades.
