- alexandre-de-moraes
description: O relator retirou o sigilo da PET 16.662, aberta após a PF apresentar (ofício de 27/08/2026)
  novas informações sobre suposta rede de influência atribuída a Vorcaro, e afirmou que os elementos seriam
  analisados pelo Plenário. Tornaram-se públicos o relatório IPJ-A 3298613/2026, a íntegra das conversas
  com o contato 'Alexandre de Moraes BRASILIA' e os contratos do escritório Barci de Moraes. Segundo o
  Poder360, o despacho não cita Moraes nominalmente; a identificação do interlocutor foi feita pela imprensa.
  O relator requisitou ao presidente do STF uma sessão pública do plenário para examinar as menções; a
  sessão não havia sido pautada. A própria PF registra que o relatório de 218 páginas, feito em 72 horas
  sobre um único celular, 'não possui caráter exaustivo'.
