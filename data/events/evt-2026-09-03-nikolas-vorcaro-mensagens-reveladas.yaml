description: 'Na esteira da crise institucional aberta pelas mensagens entre Vorcaro e o contato salvo
  como ''Alexandre de Moraes'', vieram à tona outras mensagens do mesmo celular envolvendo o deputado
  Nikolas Ferreira: um pedido, em março de 2025, para que Vorcaro ajudasse a liberar um ativo mineral
  de interesse de seu ex-assessor Thiago Rodrigues de Faria; e uma mensagem de abril de 2024 em que Vorcaro
  afirma ter bancado ''todos os voos'' de Nikolas na campanha presidencial de 2022 no Nordeste. As mesmas
  mensagens mostram que, em abril de 2024, Nikolas havia criticado publicamente um evento em Londres patrocinado
  pelo Master, levando Vorcaro a mobilizar interlocutores para conter o deputado. Nikolas confirma a ajuda
  logística de 2022, mas nega relação pessoal com o banqueiro. Deputados do PT pediram à PGR, no mesmo
  dia, a investigação de Nikolas, Vorcaro e Thiago Rodrigues de Faria.'
