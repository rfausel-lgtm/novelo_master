description: Os 27 superintendentes regionais da Polícia Federal divulgaram nota conjunta defendendo a
  autonomia administrativa da direção-geral, em meio a tensão com André Mendonça sobre determinações na
  'Operação Sem Desconto' — exigência de remessa ao STF de todas as peças investigativas e de comunicação
  prévia antes de qualquer afastamento ou troca de delegados. Em 31/08/2026, Fachin se reuniu com Andrei
  Rodrigues no CNJ, oficialmente sobre segurança da informação no sistema de Justiça — reunião que a imprensa
  contextualizou como parte do mesmo desgaste. Três dias antes da divulgação do laudo sobre o celular
  de Vorcaro (01/09/2026), em 28/08/2026, Rodrigues declarou publicamente que a PF trabalha 'sem proteger
  ou perseguir'.
