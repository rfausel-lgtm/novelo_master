date_precision: day
participant_ids:
- policia-federal
- andrei-rodrigues
- andre-mendonca
description: 'Os 27 superintendentes regionais da Polícia Federal divulgaram nota conjunta defendendo
  a autonomia administrativa da direção-geral, em meio a tensão com André Mendonça sobre determinações
  na ''Operação Sem Desconto'' — exigência de remessa ao STF de todas as peças investigativas e de comunicação
  prévia antes de qualquer afastamento ou troca de delegados. Em 31/08/2026, Fachin se reuniu com Andrei
  Rodrigues no CNJ, oficialmente sobre segurança da informação no sistema de Justiça — reunião que a imprensa
  contextualizou como parte do mesmo desgaste. Três dias antes da divulgação do laudo sobre o celular
  de Vorcaro (01/09/2026), em 28/08/2026, Rodrigues declarou publicamente que a PF trabalha ''sem proteger
  ou perseguir''. A Operação Sem Desconto investiga fraude de descontos associativos não autorizados sobre
  benefícios do INSS (R$ 6,3 bilhões estimados entre 2019 e 2024) e tem conexão investigativa real com
  o Master: o banco operava, dentro de convênio do INSS, o consignado ''M Fácil Consignado'' (ex-CredCesta),
  onde análise conjunta INSS/CGU identificou indícios de fraude; em 25/02/2026 a PF obteve autorização
  de Mendonça para cruzar formalmente os dados das duas investigações. O atrito teve origem em fevereiro
  de 2026, quando Mendonça restringiu o acesso da cúpula da PF aos dados da Compliance Zero, e escalou
  com as determinações na condução da Sem Desconto.'
