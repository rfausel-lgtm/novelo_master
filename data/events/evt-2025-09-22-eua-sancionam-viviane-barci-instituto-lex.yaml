description: O Departamento do Tesouro dos EUA ampliou para Viviane Barci de Moraes e para o Instituto
  Lex as sanções da Lei Magnitsky já aplicadas a Alexandre de Moraes em 30/07/2025, classificando-os como
  parte da 'rede de apoio financeiro' do ministro — congelamento de ativos nos EUA, proibição de cartões
  de crédito americanos e restrição de viagem. Em 12/12/2025 os três foram retirados da lista, sem explicação
  pública do Tesouro; Eduardo Bolsonaro, que dizia ter articulado as sanções originais, lamentou a decisão.
  Em 02/09/2026, Bolsonaro afirmou ter pedido aos EUA a retomada das sanções contra Moraes, articulando
  também a possível reinclusão de Viviane.
