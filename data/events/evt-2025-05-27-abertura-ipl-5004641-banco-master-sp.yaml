description: 'O Delegado Daniel Penido de Britto (DELECOR/DRPJ/SR/PF/SP) instaurou o IPL
  5004641-31.2025.4.03.6181 a partir de denúncia-crime anônima recebida por e-mail institucional da PF em
  um PDF intitulado "INFORMAÇÕES BANCO MASTER" — quase dois meses antes da notícia de fato do MPF sobre a
  compra do Master pelo BRB (16/07/2024) que o acervo já documentava como gênese da Operação Compliance
  Zero. É uma segunda linha de apuração sobre o Banco Master, autônoma e mais antiga enquanto operação
  nomeada, tendo como focos centrais Daniel Vorcaro e Benjamim Botelho de Almeida (Foco DTVM, atual Sefer
  Investimentos). O próprio Ministério Público Federal, em manifestação final de 23/12/2025, reconheceu
  "ausência de conexão entre as investigações", pedindo a vinculação processual à PET 15.198 apenas por
  cautela de preservação de sigilo, não por mérito de conexão estabelecido.'
