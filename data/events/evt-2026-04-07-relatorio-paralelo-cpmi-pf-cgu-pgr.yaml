description: Parlamentares da base governista na CPMI do INSS entregaram à Polícia Federal, à CGU e à
  PGR o relatório alternativo que nunca chegou a ser votado pelo colegiado — texto distinto do relatório
  do relator Alfredo Gaspar, rejeitado em 28/03/2026. O documento identifica Daniel Vorcaro como 'dono
  do Banco Master' e aponta Fabiano Zettel, cunhado do banqueiro, como o maior doador individual em campanhas
  de 2022, com R$ 2 milhões a Jair Bolsonaro e R$ 3 milhões a Tarcísio de Freitas.
