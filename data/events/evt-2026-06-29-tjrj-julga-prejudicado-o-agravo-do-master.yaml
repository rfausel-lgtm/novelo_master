description: Depois de o Banco Central pedir para intervir na cautelar de origem, o juízo estadual do
  Rio remeteu os autos à Justiça Federal, e esta ao Supremo Tribunal Federal. A 9ª Câmara de Direito Público
  reconheceu sua incompetência absoluta para prosseguir, registrou que a decisão agravada fica sujeita
  à revisão pelo juízo competente e julgou prejudicado o agravo do Banco Master, sem conhecê-lo. A liminar
  de retenção permanece, portanto, sem revisão de mérito por tribunal.
