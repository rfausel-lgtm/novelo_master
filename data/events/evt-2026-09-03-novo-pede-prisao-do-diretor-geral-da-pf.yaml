description: 'O partido protocolou duas petições perante o relator do caso Master: representação por prisão
  preventiva, com base no art. 313 do CPP, e pedido de afastamento cautelar com abertura de inquérito,
  com base no art. 319. Os pedidos citam mensagens de Vorcaro a Alexandre de Moraes reveladas em 01/09
  e o depoimento ao gabinete de Mendonça. São pedidos de parte; não há decisão. A PF não respondeu ao
  Poder360 até a publicação.'
