description: Mensagens de 08/12/2024 mostram Thiago Miranda confirmando com Vorcaro um encontro com Flávio
  Bolsonaro para 11/12 às 17h30 na casa do banqueiro em Brasília. Pouco menos de uma hora após o horário
  previsto, Mario Frias enviou áudio a Vorcaro agradecendo o apoio ao filme. Flávio disse ter conhecido
  Vorcaro em dezembro de 2024. A realização efetiva do encontro não é confirmada pelos documentos citados.
