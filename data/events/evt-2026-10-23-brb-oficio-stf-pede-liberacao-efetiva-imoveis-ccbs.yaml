description: 'Segundo o Metrópoles (coluna Grande Angular, 23/10/2026), o BRB enviou ofício ao ministro André
  Mendonça pedindo a liberação efetiva dos 23 imóveis dados em garantia das seis CCBs cedidas pelo Banco
  Master. A data exata do ofício não é informada; 23/10 é a data da publicação. Segundo o ofício, apesar da
  decisão do ministro de 28/08/2026, "as mesmas matrículas permanecem alcançadas por outra ordem de
  indisponibilidade". Ainda segundo o BRB, o banco pediu habilitação e cancelamento ao juízo responsável pelo
  cumprimento da carta de ordem e, em despacho de 19/10/2026, "a 8ª Vara Federal indeferiu a habilitação, sem
  exame do mérito", por considerar que as providências devem ser requeridas ao STF no processo originário; o
  Metrópoles identifica o juízo como a 8ª Vara Criminal Federal de São Paulo. O banco pede comunicação à
  autoridade responsável pela execução da carta de ordem, à CNIB e ao 18º Registro de Imóveis de São Paulo.
  Segundo a coluna, a indisponibilidade impede a transferência da titularidade e agrava a liquidez do BRB. É a
  versão do requerente: nem o ofício nem o despacho foram publicados ou localizados. Segundo o Metrópoles, "o
  novo pedido ainda não foi analisado por Mendonça"; o desfecho posterior não foi verificado.'
