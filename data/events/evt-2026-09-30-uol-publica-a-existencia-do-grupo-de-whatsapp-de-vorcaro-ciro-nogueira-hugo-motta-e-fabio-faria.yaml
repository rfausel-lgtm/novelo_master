- fabio-faria
description: >-
  Em 30/09/2026 o UOL publicou que o celular de Daniel Vorcaro continha um grupo de WhatsApp chamado "Ciro
  Daniel Fábio Hugo", de que participavam Vorcaro, o senador Ciro Nogueira, o deputado Hugo Motta e Fábio
  Faria. Segundo o UOL, o grupo foi criado por Ciro em abril de 2024, com apagamento automático das mensagens
  após 90 dias; o conteúdo registrado no aparelho vai de 20/08/2025 a 17/11/2025, dia da prisão de Vorcaro, e
  mensagens anteriores ainda poderiam ser resgatadas pela PF. Ainda segundo o UOL, os participantes
  combinavam encontros e viagens, entre elas uma viagem em aeronave de Vorcaro organizada em 28/08/2025. O UOL
  diz ter obtido o conteúdo; não cita relatório, Pet ou decisão, e o Novelo não localizou documento oficial
  sobre o grupo. A Gazeta do Povo diz ter confirmado a informação "com fontes a par da investigação", sem que
  a independência esteja demonstrada. Mensagem que exista no aparelho periciado não prova, por si, que o
  conteúdo seja verdadeiro. Não se registra o teor das mensagens.
