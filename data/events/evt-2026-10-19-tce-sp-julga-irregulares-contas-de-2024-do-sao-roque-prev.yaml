id: evt-2026-10-19-tce-sp-julga-irregulares-contas-de-2024-do-sao-roque-prev
kind: event
title: TCE-SP julga irregulares as contas de 2024 do São Roque Prev e imputa ressarcimento de R$ 93,15 milhões
  ao ex-presidente, em decisão recorrível
event_type: regulatory_act
date: 2026-10-19
date_precision: day
participant_ids:
  - tribunal-de-contas-do-estado-de-sao-paulo
  - sao-roque-prev
  - vanderlei-massarioli
  - credito-e-mercado
  - banco-master
description: Segundo o g1, a decisão foi publicada na segunda-feira, 19/10/2026; o Estadão a divulgou em
  21/10. Segundo o Estadão e o g1, a conselheira substituta Silvia Cristina Monteiro Moraes, relatora no
  TCE-SP, julgou irregulares as contas de 2024 do São Roque Prev e imputou ao ex-diretor-presidente Vanderlei
  Massarioli, que presidiu o instituto de 1º de janeiro a 30 de novembro de 2024, o ressarcimento de R$ 93,15
  milhões aplicados em letras financeiras do Banco Master, com correção e juros de mora a partir de
  18/11/2025, data da liquidação extrajudicial do banco, e dedução do que o instituto vier a recuperar; cabe
  recurso, a decisão não é definitiva e não é condenação criminal. Na mesma reportagem do g1, a defesa diz que
  a decisão "será objeto de recurso, com efeito suspensivo" e que as aplicações "foram aprovadas de forma
  colegiada pelo Comitê de Investimentos, com pareceres técnicos de consultoria especializada que não
  apontavam problemas à época"; segundo o Estadão, ele sustentou no processo que as decisões foram colegiadas
  e anteriores à deterioração financeira do banco. Segundo o Estadão, foram sete aplicações entre abril e
  setembro de 2024, cerca de 18,2% da carteira de investimentos ao fim daquele ano (a CPI municipal,
  registrada no acervo, calculou cerca de 18,8% do patrimônio líquido, base diferente), e a relatora
  determinou o envio dos autos ao Ministério Público do Estado, o que o g1 não menciona. Segundo os dois
  veículos, a relatora mandou os autos à Presidência do tribunal propondo procedimento próprio sobre a atuação
  da consultoria Crédito & Mercado, em que só o plenário poderá decidir sobre eventual declaração de
  inidoneidade; segundo o Estadão, a decisão ressalva que "não há, nesse processo, conclusão de que a
  consultoria tenha cometido fraude ou obtido vantagem ilícita", e a empresa respondeu ao g1 que "não possui
  vínculo econômico com o Banco Master, não recebeu qualquer remuneração pelas aplicações realizadas e não
  tinha poder para decidir ou executar investimentos". O texto da decisão e o número do processo não foram
  lidos; a decisão é distinta da Operação Entressafras da PF, e nenhuma fonte liga um procedimento ao outro.
