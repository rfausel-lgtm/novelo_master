    summary: Ao g1, a consultoria disse que "os pareceres da empresa são opinativos e não vinculantes, elaborados
      com base nas informações disponíveis à época", que as decisões de investimento cabem aos gestores do
      instituto e que, no procedimento proposto, "a empresa irá apresentar seus documentos e fundamentos
      técnicos". Segundo o Estadão, sustentou no processo que a exigência de classificação mínima não se
      aplicava às letras compradas diretamente pelo instituto.
    source_ids:
      - src-g1-2026-10-22-tce-sp-julga-irregulares-contas-sao-roque-prev
