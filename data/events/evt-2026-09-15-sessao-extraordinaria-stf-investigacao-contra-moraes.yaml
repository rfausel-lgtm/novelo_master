description: Sessão extraordinária convocada por Fachin em 09/09/2026, a pedido de André Mendonça, marcada
  para 15/09/2026 às 10h, presencial. Segundo a cobertura, o Plenário decidirá se autoriza a abertura
  de investigação contra Alexandre de Moraes, com base no relatório preliminar de 218 páginas da Polícia
  Federal produzido sobre o material do celular de Daniel Vorcaro — o que seria a primeira deliberação
  do colegiado sobre abrir inquérito contra um de seus integrantes. A Procuradoria-Geral da República
  sustenta a nulidade do relatório, por entender que a apuração foi direcionada contra o ministro sem
  autorização prévia do Plenário. Parte da cobertura descreve a mesma sessão como destinada às decisões
  conflitantes sobre o comando da Polícia Federal; se são dois itens da mesma pauta, o acervo ainda não
  estabeleceu. Evento futuro na data deste registro.
