description: Sessão extraordinária convocada por Fachin em 09/09/2026, a pedido de André Mendonça, realizada em
  15/09/2026 às 10h. O Plenário não chegou ao mérito. Depois da leitura do relatório, Gilmar Mendes suscitou questão
  de ordem para reunir a PET 16.662 e a PET 16.704 por continência, redistribuir os feitos, certificar todos os
  magistrados citados no caso Banco Master sobre os quais recaiam indícios de recebimento de valores indevidos e
  abrir prazo à PGR e a esses juízes. Acompanharam Zanin e Moraes; votaram contra Fachin — que a certidão identifica
  como Presidente e Relator, após a substituição da relatoria em 12/09 — e Mendonça, com votos antecipados de Fux
  e Cármen Lúcia no mesmo sentido. Nunes Marques está impedido, Toffoli afirmou suspeição e Flávio Dino pediu vista,
  suspendendo o julgamento com o placar parcial de 3 a 4. A ata foi publicada no DJE em 17/09/2026.
