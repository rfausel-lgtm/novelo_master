description: Na primeira sessão plenária do STF após a divulgação das mensagens (01/09/2026), o tema não
  constou da pauta e nenhum ministro o comentou publicamente; Moraes e Mendonça, sentados lado a lado
  por critério de antiguidade, não conversaram. No mesmo dia, em evento acadêmico separado (a 17ª Conferência
  Brasileiro-Ítalo-Espanhola de Direito Constitucional), o presidente Edson Fachin qualificou o episódio
  de 'especial gravidade' e prometeu anunciar, em 'tempo devido', as 'medidas cabíveis e necessárias'
  — sem especificar quais.
