description: Em 15/10/2026 o UOL publicou mensagens que diz terem sido extraídas pela PF do celular de Daniel
  Vorcaro com Frederic Kachar, entre 2023 e 2025. Segundo o UOL, elas tratam de patrocínios do Master a
  eventos do grupo (Baile da Vogue de 2024, R$ 825 mil; camarote do Carnaval de 2023, R$ 1,6 milhão, segundo
  tabela enviada por Kachar), de um pedido dele para destravar um novo contrato de publicidade e de
  reclamações de Vorcaro sobre colunas e reportagens de O Globo e do Valor, às quais Kachar respondeu
  defendendo os repórteres. A Gazeta do Povo diz ter confirmado as conversas e afirma não haver confirmação de
  que a cobertura tenha sido modificada. O Grupo Globo, em nota, reafirma a independência editorial de seus
  veículos; Kachar não respondeu à Gazeta do Povo. Mensagem no aparelho não prova, por si, o que diz;
  patrocínio contratado não é irregularidade por si.
