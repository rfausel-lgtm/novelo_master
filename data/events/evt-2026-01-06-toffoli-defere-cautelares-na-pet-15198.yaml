description: 'Decisão que estrutura a fase cautelar da investigação: teto de sequestro de R$ 5.775.234.097,25,
  38 alvos de busca, afastamento de sigilo de 101 pessoas e entidades no período de outubro de 2020 a
  outubro de 2025. Descreve a hipótese de que o banco direcionou recursos captados por CDBs a fundos dos
  quais era cotista único, usados para adquirir ativos de empresas ligadas aos próprios sócios. Quanto
  a Nelson Tanure, a caracterização como sócio oculto é atribuída à autoridade policial e transcrita da
  manifestação do procurador-geral; o relator registra que sua cognição, nessa fase, é limitada. Tanure
  nega qualquer vínculo societário e afirma ter mantido com o banco relações estritamente comerciais,
  na condição de cliente.'
