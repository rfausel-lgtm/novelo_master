description: O PAS 19957.008699/2019-01, que acusa 29 pessoas e empresas de operação fraudulenta pelo
  oferecimento de vantagens a prefeitos e gestores de regimes próprios de previdência, foi redistribuído
  em 24/05/2022 ao diretor João Carlos de Andrade Uzêda Accioly, após circular entre relatores por sucessivos
  impedimentos. Essa é a última menção pública ao processo em toda a base da CVM. Na posição de 31/01/2026,
  ele ainda constava da planilha oficial de processos pendentes de julgamento. O inquérito havia sido
  instaurado em 02/03/2016 e apurou prejuízos 'da ordem de centenas de milhões de reais'.
