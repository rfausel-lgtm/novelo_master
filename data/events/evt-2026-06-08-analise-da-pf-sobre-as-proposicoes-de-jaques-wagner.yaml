description: 'A pedido da própria PGR, a Polícia Federal cruzou oito anos de atividade parlamentar de Jaques Wagner
  com o conteúdo dos celulares de Daniel Vorcaro e Augusto Lima. O resultado, entregue em 08/06/2026 e juntado como
  peça 005 da PET 16.230, é majoritariamente negativo: na maior parte das proposições selecionadas nada foi encontrado.
  O único capítulo que avança é o do PL 412/2022, do mercado regulado de carbono, em que a PF registra interesse
  dos dois investigados — sem afirmar atuação do senador e sem nenhuma mensagem que o tenha como interlocutor.'
