description: Na noite de 03/09/2026, segundo relato do Jornal de Brasília e do Midiamax, André Mendonça pediu verbalmente
  a Edson Fachin o afastamento cautelar imediato de Alexandre de Moraes, com petição formal em preparação. É ação
  distinta do procedimento de cinco dias úteis aberto por Fachin no mesmo dia, com o qual o acervo chegou a registrá-la
  em conjunto. Não há registro público de decisão de Fachin sobre esse pedido específico.
