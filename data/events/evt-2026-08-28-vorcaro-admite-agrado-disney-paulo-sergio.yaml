description: Em depoimento por videoconferência da Papuda, em 28/08/2026, Vorcaro confirmou ter oferecido
  a Paulo Sérgio Neves de Souza, ex-diretor de Fiscalização do Banco Central, a viagem à Disney/Universal
  já referida em apuração anterior (lote 20) — organizada pela empresa SL Consulting, representada por
  Léo Serrano, no início de 2024. Classificou o gesto como cortesia pessoal ('agrado'), não como contrapartida
  por serviços, e negou que qualquer servidor do Banco Central tivesse 'trabalhado' para ele.
