id: evt-2026-09-29-cvm-condena-dois-administradores-da-reag-capital-holding-por-nao-elaborar-demonstracoes-e-itr
kind: event
title: CVM condena o diretor presidente e o diretor financeiro da REAG Capital Holding a multa de R$ 170 mil
  cada por não elaborarem demonstrações financeiras e ITR
event_type: regulatory_act
date: 2026-09-29
date_precision: day
participant_ids:
  - comissao-de-valores-mobiliarios
  - joao-carlos-mansur
  - rodolfo-turelli
description: Em sessão de julgamento de 29/09/2026, divulgada pela CVM em 02/10, o Colegiado da autarquia
  decidiu, por unanimidade e acompanhando o voto da diretora Marina Copola, condenar João Carlos Mansur e
  Rodolfo Turelli, diretor presidente e diretor financeiro da REAG Capital Holding S.A., à multa individual de
  R$ 170 mil, por não elaborarem as demonstrações financeiras de 2024 (art. 176 da Lei 6.404/1976) e os
  formulários de informações trimestrais do 1º e do 2º trimestres de 2025 (art. 31, II, da Resolução CVM
  80/2022). O processo (PAS 19957.011231/2025-34) seguiu o rito simplificado; os acusados apresentaram defesa
  conjunta e, em 02/02/2026, proposta de termo de compromisso, rejeitada pelo Colegiado em 26/05/2026. Segundo
  o voto, as demonstrações de 2024 e o ITR do 1º trimestre foram elaborados depois, fora do prazo e sem
  disponibilização no sistema da CVM, e o cancelamento do registro da companhia (deferido em 07/10/2025) não
  afasta a responsabilidade por infrações anteriores. A pena-base foi de R$ 100 mil por infração, com
  atenuante de 15% por bons antecedentes. Cabe recurso, com efeito suspensivo, ao Conselho de Recursos do
  Sistema Financeiro Nacional. A condenação é uma infração formal, de primeira instância administrativa, por
  omissão no dever de elaborar documentos periódicos; o voto e a nota não imputam ato intencional nem
  relacionam a decisão ao Banco Master.
