description: 'A 6ª Vara Criminal Federal de São Paulo condenou Saul Dutra Sabbá a três anos de reclusão
  em regime inicial aberto por gestão fraudulenta, com pena substituída por restritiva de direitos e multa,
  por fatos ocorridos entre novembro de 2014 e março de 2016 no Banco Máxima. Ele foi o único dos cinco
  réus condenado: a mesma sentença absolveu, com fundamento no art. 386, V, do CPP, o ex-diretor jurídico
  e contábil Alberto Maurício Caló, Benjamim Botelho de Almeida, Gustavo Cleto Marsiglia e Octavio Pires
  Vaz Filho. O MPF apelou das absolvições.'
