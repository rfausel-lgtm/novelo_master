description: Segundo o Poder360, com base em documentos da organização encaminhados pela PF à CPMI do
  INSS, cerca de 40 pessoas participaram em 25/04/2024 de degustação de Macallan no George Club (Mayfair),
  com custo de US$ 640.831,88 pago por Vorcaro, à margem do 1º Fórum Jurídico Brasil de Ideias (24 a 26/04/2024),
  patrocinado pelo Banco Master. A PF citou a participação de Toffoli no fórum em pedido de suspeição;
  Andrei Rodrigues também participou. A equipe não leu os documentos originais; a lista de participantes
  é a reproduzida pela imprensa.
