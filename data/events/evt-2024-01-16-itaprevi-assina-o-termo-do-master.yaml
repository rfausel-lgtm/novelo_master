description: 'O processo foi aberto em 11/01/2024 e o termo assinado em 16/01/2024 — cinco dias corridos,
  menos de dois dias úteis de análise, como apontou o Tribunal de Contas do Estado. A documentação foi
  remetida pelo próprio Banco Master, por mensagem assinada por sua executiva de relações institucionais.
  O termo aparece nos autos em duas versões: uma sem assinatura, já preenchida e com o CNPJ do banco impresso
  no campo do representante legal, e outra assinada pelo dirigente da autarquia — que firmou, com dois
  minutos de diferença, os dois campos distintos reservados ao dirigente e ao gestor de recursos. As sete
  atestações de conformidade estão todas marcadas com ''Sim''. Nos mesmos autos, poucas dezenas de páginas
  depois, está juntada a Lista Exaustiva do Ministério da Previdência — que não traz o Banco Master em
  nenhuma de suas seções.'
