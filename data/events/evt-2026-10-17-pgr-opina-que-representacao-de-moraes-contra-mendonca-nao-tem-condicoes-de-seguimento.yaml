id: evt-2026-10-17-pgr-opina-que-representacao-de-moraes-contra-mendonca-nao-tem-condicoes-de-seguimento
kind: event
title: Segundo íntegra divulgada pelo Poder360, PGR opina ao STF que a representação de Moraes contra Mendonça por abuso de autoridade não tem
  condições de seguimento (parecer na Pet 16.704)
event_type: public_act
date: 2026-10-17
date_precision: day
participant_ids:
  - ministerio-publico-federal
  - paulo-gonet
  - alexandre-de-moraes
  - andre-mendonca
  - edson-fachin
  - supremo-tribunal-federal
description: 'Segundo a íntegra divulgada pelo Poder360 em 19/10/2026 (cópia com a marca "Sigiloso", cuja
  chave de validação no portal do MPF o Novelo não conferiu), em 17/10/2026, em parecer dirigido ao
  presidente do STF, Edson Fachin, na Pet 16.704 (ASSCRIM/PGR n. 1753454/2026, assinado por Paulo Gonet
  Branco, Hindenburgo Chateaubriand Filho, Antônio Edílio Magalhães Teixeira e André de Carvalho Ramos), a
  Procuradoria-Geral da República tratou do Doc. 180,
  em que, segundo o parecer, Mendonça reage ao pedido de investigação deduzido por Moraes (ver
  evt-2026-09-03-moraes-pede-providencias-contra-mendonca e
  evt-2026-09-04-fachin-avoca-pedido-moraes-contra-mendonca). A PGR afirma que os relatórios internos da PF
  não geraram diligências investigatórias e advertem não ter valor probatório; registra que "Os relatórios
  sugerem direção das investigações com vieses desafeiçoados da posição de neutralidade do magistrado
  incumbido de supervisionar os procedimentos policiais"; mas afirma que a representação "não parece
  demonstrar que a conduta possa ser reconduzida a ato punido por algum tipo da Lei n. 13.869/2019", a Lei de
  Abuso de Autoridade, tema que diz caber examinar naquele momento. Observa que crimes de responsabilidade são
  da competência do Senado Federal e que ações por improbidade escapam da prévia autorização do Plenário.
  Conclui que a representação "não apresenta condições de ter seguimento, ressalvado entendimento em contrário
  do Plenário". O parecer é opinião do Ministério Público, não decisão: segundo o próprio documento, o
  Plenário do STF é o titular da decisão de admitir ou recusar autorização para investigar integrante da
  Corte, e até 20/10/2026 não foi localizada decisão sobre o tema. Segundo o Poder360, o parecer foi
  encaminhado ao STF em 17/10/2026. O portal do STF registra, nos andamentos da Pet 16704, a juntada de "Parecer da
  PGR" como petição sigilosa nº 131105 em 17/10/2026, às 16:06, seguida de conclusão ao relator no mesmo dia; o teor
  não é público no portal e vem, aqui, da cópia do Poder360. O mesmo parecer trata de outros sete documentos dos autos, não registrados neste evento. O
  Novelo não afirma o mérito da representação nem da resposta de Mendonça.'
