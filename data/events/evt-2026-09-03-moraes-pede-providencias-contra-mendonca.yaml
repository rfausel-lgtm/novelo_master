description: Dois dias depois de Mendonça derrubar o sigilo do relatório sobre seu próprio celular apreendido
  de Vorcaro, Alexandre de Moraes proferiu decisão apontando 'fortes indícios' de improbidade administrativa,
  abuso de autoridade e crime de responsabilidade por parte de Mendonça, com base em relatório da PF sobre
  tratamento assimétrico de casos por alinhamento político. Alegou 'usurpação da direção' das Petições
  15.041 (INSS) e 15.556 (Compliance Zero) e encaminhou o caso ao presidente da Corte, Edson Fachin. É
  a primeira medida formal de um ministro contra outro desde a divulgação das mensagens.
