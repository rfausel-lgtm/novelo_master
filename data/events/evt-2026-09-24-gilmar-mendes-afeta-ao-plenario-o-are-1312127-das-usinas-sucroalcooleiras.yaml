id: evt-2026-09-24-gilmar-mendes-afeta-ao-plenario-o-are-1312127-das-usinas-sucroalcooleiras
kind: event
title: No ARE 1.312.127 (usinas sucroalcooleiras), Gilmar Mendes decide em 24/09 e indica a afetação do referendo ao Plenário; Fux pede vista em 02/10
event_type: judicial_decision
date: '2026-09-24'
date_precision: day
end_date: '2026-10-02'
participant_ids:
- gilmar-mendes
- luiz-fux
- dias-toffoli
- advocacia-geral-da-uniao
- supremo-tribunal-federal
description: >-
  No ARE 1.312.127 (recorrente União; recorridas Raízen Energia S.A. e outras), o portal do STF registra que o
  relator, Gilmar Mendes, despachou e incluiu questão de ordem na lista da sessão virtual da 2ª Turma em
  22/09/2026, proferiu decisão monocrática registrada como "Deferido" em 24/09/2026 e, na sessão virtual de 25/09
  a 02/10/2026, indicou a afetação do julgamento ao Plenário, para referendo dessa decisão, acompanhado por Dias
  Toffoli; Luiz Fux pediu vista em 02/10. O Poder360 (22/09) diz que a questão de ordem busca uniformizar as
  regras de indenização das usinas pela União e liga o tema aos precatórios descritos nas mensagens do celular de
  Vorcaro; o portal não menciona o Banco Master. Outro processo, o ARE 1.327.995 (União x Destilaria Alcidia
  S.A., relator Edson Fachin), já transitado em julgado em 10/10/2025, registra o impedimento de Nunes Marques
  lançado no sistema em 21/02/2024 e afastado por ele em 07/03/2024, e decisões da 2ª Turma de 01/10/2024 e
  03/06/2025 contra a União, por maioria, vencidos André Mendonça e Gilmar Mendes; esses andamentos também não
  mencionam o Master e são compatíveis com a descrição feita por Nunes Marques em nota de 21/09/2026.
