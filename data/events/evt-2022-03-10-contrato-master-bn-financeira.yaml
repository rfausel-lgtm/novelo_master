description: Contrato de parceria pelo qual a BN Financeira, então de Bonnie Toaldo Bonilha e de um sócio fundador,
  passou a prospectar com exclusividade operações de consignado do cartão Credcesta para o Master, com 15% da receita
  mensal líquida e o convênio de Lauro de Freitas (BA). A PKL One, cedente do Credcesta ao Master em 2018, e a Terra
  Firme da Bahia, de Augusto Lima, assinaram como intervenientes. Em outubro de 2025, o termo de quitação atribuiu
  a dívida ao Master e registrou o pagamento de R$ 3,5 milhões pela PKL One "por mera liberalidade".
