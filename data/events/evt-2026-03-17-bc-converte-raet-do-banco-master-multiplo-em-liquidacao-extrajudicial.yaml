description: Segundo a nota do BC, reproduzida por Poder360 e Congresso em Foco, o Banco Central decretou em
  17/03/2026 a convolação do Regime de Administração Especial Temporária (Raet) do Banco Master Múltiplo S.A.
  em liquidação extrajudicial. Conforme a nota, o Raet fora decretado pelo Ato do Presidente nº 1.370, de
  18/11/2025, por 120 dias, com prazo até 18/03/2026. O BC descreve o Múltiplo como instituição do
  Conglomerado Master que não captava depósitos do público e foi submetida ao Raet "na tentativa de se
  viabilizar a continuidade dos negócios" da Will Financeira. Segundo a nota, o relatório do administrador, de
  12/03/2026, indicou que, com a liquidação da Will Financeira (Ato nº 1.376, de 21/01/2026), "não mais
  subsistem motivos" para o prosseguimento do Raet. Segundo a nota, a indisponibilidade dos bens dos
  controladores e dos administradores é mantida, e o BC continua adotando as medidas cabíveis para apurar
  responsabilidades. Segundo o Poder360, a EFB Regimes Especiais de Empresas foi designada para conduzir a
  liquidação. A nota não traz o número do ato de 17/03; o número consta do boletim Alerta Legislação nº 12 (16 a
  21/03/2026), da Biblioteca Jurídica do Governo de SP, que lista o Ato do Presidente nº 1.380, de 17 de
  março de 2026, com a ementa "Decreta a liquidação extrajudicial do Banco Master Múltiplo S.A. - em Regime
  de Administração Especial Temporária". O boletim apenas transcreve a ementa, sem o texto do ato. A íntegra
  da nota é conhecida por transcrição de veículos; a publicação no Diário Oficial não foi verificada.
