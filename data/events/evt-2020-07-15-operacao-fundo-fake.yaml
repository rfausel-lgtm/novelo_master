title: 'Operação Fundo Fake: PF apura desvio de recursos de previdências municipais em fundos da Foco
  DTVM'
event_type: investigation_step
date: '2020-07-15'
date_precision: day
participant_ids:
- foco-dtvm
- benjamim-botelho-de-almeida
- daniel-vorcaro
- maxx-consultoria
description: 'A Polícia Federal deflagrou a Operação Fundo Fake com cerca de 200 policiais e 71 mandados
  de busca e apreensão expedidos pela 3ª Vara Federal de Porto Velho (RO), em cinco estados. Apurou desvio
  de recursos de regimes próprios de previdência aplicados em fundos administrados pela Foco DTVM, no
  modelo do ''rebate'': a consultoria contratada indicava os fundos e, dias após o aporte, recebia de
  volta parte do dinheiro — às vezes mais de 20% —, repassando parcela a gestores do instituto. Prejuízo
  apurado somente ao RolimPrevi: R$ 17,4 milhões; outros 65 institutos aplicaram em fundos da mesma administradora;
  cerca de R$ 500 milhões foram objeto de bloqueio judicial. Daniel Vorcaro e Benjamim Botelho de Almeida
  estiveram entre os treze alvos de mandados de prisão expedidos na frente, nunca cumpridos e depois anulados.'
