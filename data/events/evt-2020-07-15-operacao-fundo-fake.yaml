description: A Polícia Federal deflagrou a Operação Fundo Fake, sobre desvio de recursos de regimes próprios
  de previdência de municípios de Rondônia aplicados em fundos administrados pela Foco DTVM. É a frente
  rondoniense que, segundo documento protocolado na CPI do Crime Organizado, alcança Vorcaro por meio
  de inquéritos sucessivos iniciados em janeiro de 2019 — nove meses antes de o Banco Central aprovar
  a transferência de controle do Banco Máxima.
