id: evt-2026-01-13-bc-desiste-dos-embargos-e-a-inspecao-do-tcu-prossegue
kind: event
title: Banco Central desiste dos embargos e o relator devolve o processo à AudBancos para a inspeção
event_type: regulatory_act
date: 2026-01-13
date_precision: day
participant_ids:
  - banco-central-do-brasil
  - tribunal-de-contas-da-uniao
  - jhonatan-de-jesus
description: Em 13/01/2026 o Banco Central desistiu dos embargos de declaração, e Jhonatan de Jesus restituiu
  os autos à AudBancos para prosseguimento. Segundo a Agência Brasil, com a retirada do recurso a análise
  técnica poderia ser feita sem apreciação pelo Plenário e voltava a valer a decisão original que autoriza a
  inspeção, a cargo da AudBancos na sede do BC; segundo o Times Brasil, o caso deixava de ser analisado pelo
  Plenário. Nenhuma fonte aberta descreve sessão do Plenário sobre o tema, e o Novelo não afirma que houve ou
  não houve uma. Segundo a Agência Brasil, Vital do Rêgo estimou em até 30 dias o trabalho. A inspeção foi concluída em
  11/02/2026 (evento próprio no acervo).
