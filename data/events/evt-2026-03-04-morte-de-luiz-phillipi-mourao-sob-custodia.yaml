description: Preso na 3ª fase da operação, teve morte cerebral no mesmo dia, sob custódia na Superintendência
  da PF em Minas Gerais. A PF informou em nota que ele tentara se matar, que agentes tentaram reanimá-lo,
  que entregaria os registros em vídeo ao relator no STF e abriria procedimento apuratório, sem descrever
  as circunstâncias em que foi encontrado. Em abril, a família informou não ter tido acesso às imagens,
  aos autos nem ao laudo do IML. O corpus não afirma causa de morte.
