description: Na semana da primeira aplicação da autarquia em letras financeiras do Banco Master, o Comitê
  de Investimentos aprovou por unanimidade a liberação de teto regulatório genérico para o segmento, com
  base na Resolução CMN 4.963/2021, sem que a ata nomeasse nenhuma instituição financeira específica.
  É o único caso, entre os regimes próprios já examinados, em que a decisão de investir no Banco Master
  não aparece individualizada em ata de colegiado.
