description: Ao autorizar a 9ª fase da Operação Compliance Zero, o ministro André Mendonça determinou
  a suspensão das atividades econômicas e financeiras da BN Financeira Ltda., da BN Representações Tecnológicas
  Ltda. e da Epítome S.A., e impôs a Bonnie Toaldo Bonilha, sócia das duas primeiras, proibição de contato
  com investigados, suspensão de passaporte e impedimento de saída do país. A decisão registra transferência
  de R$ 3,5 milhões da PKL One à BN Financeira em 17/10/2025, e anota que a suspensão de passaporte do
  senador Jaques Wagner não foi requerida.
