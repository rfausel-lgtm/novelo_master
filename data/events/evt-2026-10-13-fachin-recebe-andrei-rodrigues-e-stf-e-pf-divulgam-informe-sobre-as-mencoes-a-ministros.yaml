id: evt-2026-10-13-fachin-recebe-andrei-rodrigues-e-stf-e-pf-divulgam-informe-sobre-as-mencoes-a-ministros
kind: event
title: Fachin recebe o diretor-geral da PF, e o STF e a PF divulgam Informe sobre o encaminhamento das menções a ministros
event_type: meeting
