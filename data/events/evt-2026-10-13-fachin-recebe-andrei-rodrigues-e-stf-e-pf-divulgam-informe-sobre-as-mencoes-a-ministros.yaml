- supremo-tribunal-federal
description: >-
  Em 13/10/2026 o presidente do STF, Edson Fachin, recebeu o diretor-geral da PF, Andrei Rodrigues, "em audiência
  solicitada pela Polícia Federal". Segundo o Informe à Imprensa do mesmo dia (18:43), assinado pela Secretaria de
  Comunicação do STF e pela Coordenação Geral de Comunicação Social da PF: quanto às investigações do Master, o
  diretor-geral tratou do Ofício 3467748, de 02/10/2026, "solicitando informações sobre formato para apresentação
  do material respectivo"; o presidente esclareceu que "a eventual realização de atos de investigação de ministro
  depende de autorização do Plenário da Corte" e ressaltou que "a autoridade policial tem o dever de encaminhar
  todas as menções encontradas sem exceção, acompanhadas de seu contexto, em caráter estritamente descritivo";
  apresentados os elementos, o Plenário, ouvida a PGR, "pode deliberar" nos termos do art. 33, parágrafo único, da
  Lei Complementar 35/1979. Sobre ameaças a ministros, a PF "reiterou seu compromisso" com a segurança; sobre os
  inquéritos do INSS e do Master, a Presidência registrou que aguarda o pronunciamento da PGR na PET 16.704; sobre
  o INQ 4781, o presidente pediu celeridade à PF. Segundo a Agência Brasil (02/10/2026), Fachin havia enviado
  ofício à PF em 02/10 afirmando que, recebidas as informações, "sem exceção de pessoa, os fatos correlatos, serão
  dados os encaminhamentos devidos", e a agência informou que a audiência ocorreria em 13/10; esse ofício não foi
  localizado. O Informe cita o Ofício 3467748 sem dizer quem o expediu; o Novelo não fixa o remetente do nº 3467748 nem afirma se há um ou dois ofícios daquela data.
  O Informe não fixa prazo para a entrega do material nem nomeia ministros.
