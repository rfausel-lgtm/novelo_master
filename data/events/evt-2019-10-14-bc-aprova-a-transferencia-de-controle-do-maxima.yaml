id: evt-2019-10-14-bc-aprova-a-transferencia-de-controle-do-maxima
title: Banco Central aprova a transferência de controle do Banco Máxima
event_type: regulatory_act
date: '2019-10-14'
participant_ids:
- banco-central-do-brasil
- joao-manoel-pinho-de-mello
