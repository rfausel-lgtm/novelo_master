- paulo-sergio-neves-de-souza
- daniel-vorcaro
- banco-master
description: O voto BCB nº 218/2019, relatado pelo diretor João Manoel Pinho de Mello, aprovou a aquisição
  do controle oito meses depois da rejeição, já sob a presidência de Roberto Campos Neto. O voto considerou
  aportes de capital de R$ 100 milhões deliberados entre março e junho de 2019, fluxo de caixa futuro
  e laudos de avaliação a valor de mercado, e afirmou que a origem dos recursos foi regularmente demonstrada
  pelos novos acionistas. Segundo o Valor Econômico, o então diretor de fiscalização Paulo Sérgio Neves
  de Souza afirmou na reunião que eventuais problemas de conduta poderiam ser coibidos pela supervisão.
