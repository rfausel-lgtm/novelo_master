description: O ministro André Mendonça, relator da PET 15556, decretou a prisão preventiva de Daniel Vorcaro,
  Fabiano Zettel, Luiz Phillipi Machado de Moraes Mourão e Marilson Roseno da Silva, a pedido da PF, por
  'risco concreto de interferência nas investigações', e determinou a suspensão de empresas vinculadas
  e cautelares a servidores do Banco Central. A defesa do banqueiro negou obstrução, segundo a CNN Brasil.
