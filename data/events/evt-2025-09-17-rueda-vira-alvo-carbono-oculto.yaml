description: 'A PF passou a investigar se Antônio Rueda seria dono oculto de jatos executivos formalmente
  registrados em nome de terceiros e de fundos de investimento — o Fundo Bariloche e o Fundo Viena (gestora
  Genial), classificados como "fundos caixa-preta". O piloto Mauro Caputti Mattosinho afirmou à PF que
  Rueda seria dono oculto de 4 dos 10 jatos operados pela Táxi Aéreo Piracicaba (TAP), empresa que também
  operava aeronaves usadas por Roberto Augusto Leme da Silva ("Beto Louco") e Mohamad Hussein Mourad
  ("Primo"), foragidos apontados como líderes do esquema de combustíveis do PCC apurado pela Carbono
  Oculto. Rueda negou qualquer envolvimento, classificando as acusações como "ilações irresponsáveis sem
  fundamento" e "absolutamente infundadas", com motivação política. Até setembro de 2026, segundo fontes
  ligadas ao caso, não há provas formais contra ele — apenas indícios em análise, sem oitiva, indiciamento,
  denúncia ou arquivamento.'
