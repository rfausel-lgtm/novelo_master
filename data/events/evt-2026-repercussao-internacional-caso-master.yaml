description: 'O caso teve cobertura investigativa internacional substancial — Bloomberg com série própria
  sustentada, The Economist com análise institucional, FMI citando o caso em avaliação técnica sobre o
  arcabouço de resolução bancária do Brasil —, mas não gerou rebaixamento do rating soberano brasileiro
  (S&P manteve ''BB/B'' estável) nem ação formal identificada de reguladores estrangeiros, além da ação
  civil já registrada da EFB nos EUA. O achado de falha de avaliação de risco documentado é doméstico
  ao próprio Banco Master: a Fitch elevou sua nota em outubro de 2024, permitindo aportes de fundos de
  pensão públicos, antes de rebaixá-la a ''D'' após a liquidação.'
