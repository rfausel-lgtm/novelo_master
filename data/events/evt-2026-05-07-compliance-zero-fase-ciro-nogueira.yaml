description: O ministro André Mendonça autorizou, na Pet 15873, nova fase da operação, com prisão temporária
  de Felipe Cançado Vorcaro por cinco dias e medidas cautelares ao senador Ciro Nogueira (proibição de
  contato com testemunhas e investigados). A PF aponta suposta atuação do senador em favor de Vorcaro,
  incluindo emenda à PEC 65/2023 sobre a cobertura do FGC cujo texto teria sido elaborado pela assessoria
  do Banco Master, e vantagens ao parlamentar. As suspeitas são da PF e estão sob investigação.
