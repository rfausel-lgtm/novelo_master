description: Cinco meses depois da primeira fase da Operação Compliance Zero, o BRB concluiu a apuração independente
  sobre suas operações com o Banco Master, conduzida pelo Machado Meyer Advogados com perícia da Kroll Associates
  e validada por uma Comissão Independente de Investigação, e encaminhou toda a documentação à Polícia Federal.
  É dessa apuração que saem, cinco meses depois, os números dos gastos do Master com advocacia em 2023 e 2024.
