description: O ministro Flávio Dino, em tutela provisória de urgência na Pet 16.669/DF (processo próprio,
  sobre o caso 'Dark Horse'), determinou a imediata reintegração de Andrei Rodrigues e Leandro Almada
  da Costa à Polícia Federal, neutralizando os efeitos da decisão de André Mendonça de 08/09/2026 (Pet
  16.662). Fundamentou-se na ilegitimidade ativa do Partido Novo para requerer medida cautelar pessoal
  em processo penal e na usurpação da competência do Plenário do STF, já afetada pela Pet 16.704. Determinou
  vista ao PGR após o cumprimento e ressalvou que a decisão se submete exclusivamente ao Plenário.
