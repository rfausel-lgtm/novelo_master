description: O presidente do Supremo revogou a designação de Alexandre de Moraes como relator do Inquérito
  4.781, aberto por portaria em março de 2019, e assumiu pessoalmente sua condução, com fundamento no
  art. 43 do regimento interno e no entendimento do Plenário na ADPF 572, pela 'necessidade de estabelecer
  segurança jurídica e adequada delimitação institucional'. A revogação vale a partir da data da decisão
  e preserva os atos já praticados; ações penais conexas com denúncia recebida seguem o rito em curso.
  Fachin anunciou que remeterá os autos à autoridade policial e à Procuradoria-Geral da República para
  oferecimento de denúncia ou pedido de arquivamento. A medida encerra a escalada iniciada em 1º de setembro,
  quando Mendonça levantou o sigilo de peças do caso Master que continham mensagens entre Moraes e Daniel
  Vorcaro, e que levou Moraes a pedir apuração contra Mendonça valendo-se daquele mesmo inquérito.
