description: 'O presidente do STF abriu a Petição 16.704, derivada da Pet 16.662, dando cinco dias úteis
  para manifestação sobre quatro pontos: observância da LOMAN pela PF em apurações que atinjam autoridades
  com foro no Supremo; eventual uso indevido de credenciais institucionais para acesso a documentos privados;
  circunstâncias do despacho que determinou a identificação de pessoas na Pet 16.662; e medidas de controle
  externo da atividade policial. O prazo vence por volta de 10/09/2026.'
