description: Na noite de 03/09/2026, Moraes pediu formalmente a Fachin a abertura de apuração contra Mendonça,
  por 'abuso de autoridade, improbidade administrativa e crime de responsabilidade' na condução dos casos
  Master e INSS — um contra-ataque ao procedimento de cinco dias úteis já aberto por Fachin no mesmo dia
  03/09, e distinto do pedido verbal de Mendonça pelo afastamento cautelar de Moraes. Em 04/09, Fachin
  separou o pedido do inquérito das fake news, avocou-o para sua própria relatoria e deu à PGR cinco dias
  úteis para se manifestar sobre a admissibilidade e regularidade do procedimento adotado por Moraes;
  Mendonça terá mais cinco dias úteis após isso.
