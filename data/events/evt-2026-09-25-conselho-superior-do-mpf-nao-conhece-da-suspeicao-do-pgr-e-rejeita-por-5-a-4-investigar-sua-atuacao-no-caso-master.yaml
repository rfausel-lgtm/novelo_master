id: evt-2026-09-25-conselho-superior-do-mpf-nao-conhece-da-suspeicao-do-pgr-e-rejeita-por-5-a-4-investigar-sua-atuacao-no-caso-master
kind: event
title: O Conselho Superior do MPF não conhece da suspeição do PGR e rejeita, por 5 a 4, abrir investigação sobre sua atuação no caso Master
event_type: public_act
date: '2026-09-25'
date_precision: day
participant_ids:
- conselho-superior-do-ministerio-publico-federal
- paulo-gonet
- ministerio-publico-federal
- partido-novo
description: >-
  Na 1ª Sessão Extraordinária de 2026, em 25/09/2026, o Conselho Superior do Ministério Público Federal, com
  relatoria do subprocurador-geral da República Francisco Sanseverino e presidência prevista, na convocação de
  23/09, do vice-presidente do Conselho, Nicolao Dino, apreciou a Notícia de Fato PGR-00385698/2026, sobre a atuação do
  procurador-geral Paulo Gonet nas apurações do caso Master, especialmente nas PET 15.556 e 16.662, segundo a mesma
  convocação. Segundo a notícia oficial do MPF, o Conselho decidiu por unanimidade pelo não conhecimento dos
  pedidos de impedimento ou suspeição, por não ter competência legal para analisá-los (o questionamento, segundo o
  texto, deve ser feito no processo em trâmite no STF), e julgou prejudicados os pedidos de afastamento; por cinco
  votos a quatro, negou a abertura de investigação criminal "por ausência de elementos mínimos para a tipificação
  do crime de prevaricação". O MPF não nomeia o requerente; segundo o Poder360 e a Agência Brasil, é o Partido
  Novo. A decisão é do colegiado sobre a representação e não é manifestação sobre a veracidade de qualquer fato.
  O Novelo não localizou a ata da sessão nem os votos nominais em fonte oficial.
