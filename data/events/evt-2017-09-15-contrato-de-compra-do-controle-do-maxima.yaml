description: Vorcaro contratou a compra, junto a Saul Dutra Sabbá, de 56,87% do capital do Banco Máxima
  por R$ 40 milhões. A forma de pagamento foi depois alterada para R$ 36 milhões em cotas do fundo Brazil
  Realty e R$ 4 milhões em espécie. É a operação cuja aprovação o Banco Central negaria em fevereiro de
  2019 e concederia em outubro do mesmo ano.
