description: O ministro André Mendonça decretou, na PET 15771 (INQ 5026), a prisão preventiva de Paulo
  Henrique Bezerra Rodrigues Costa, ex-presidente do BRB, e do advogado Daniel Lopes Monteiro, a pedido
  da PF com manifestação favorável da PGR. Segundo os autos, o BRB teria adquirido carteiras de crédito
  do Master de até R$ 12,2 bilhões apesar de pareceres contrários; a investigação aponta negociação estimada
  em R$ 146 milhões em imóveis entre Vorcaro e o então presidente do BRB.
