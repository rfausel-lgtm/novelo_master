- banco-master
description: A 6ª Vara Criminal Federal de São Paulo, do juiz Nilson Martins Lopes Júnior, julgou a ação
  penal movida pelo MPF por gestão fraudulenta no Banco Máxima, por fatos de novembro de 2014 a março
  de 2016. Absolveu Alberto Maurício Caló, Benjamim Botelho de Almeida, Gustavo Cleto Marsiglia e Octavio
  Pires Vaz Filho, com fundamento no art. 386, V, do CPP — não existir prova de terem concorrido para
  a infração —, e condenou apenas Saul Dutra Sabbá, então controlador do banco, a três anos de reclusão
  em regime inicial aberto. Quanto a Botelho, a sentença assenta que, embora pudesse ter atuado nas operações
  de subscrição de quotas do Fundo Ravena, não detinha relação de controle, administração ou gerência
  sobre o Banco Máxima, elemento exigido pelo art. 25 da Lei 7.492/86. O MPF apelou, e o recurso segue
  pendente na 11ª Turma do TRF3.
