description: Segundo o relatório da PF, em 15/03/2024 Fábio Faria escreveu a Vorcaro 'O careca não pode
  atrasar'; imediatamente após, Vorcaro determinou a Angelo Silva o pagamento do contrato com o escritório
  Barci de Moraes e, minutos depois, disse a uma funcionária que o pagamento era 'o pgto mais importante
  que temos'. A CNN relata registro de transferência de R$ 3.422.268,14 em seguida. A identidade de 'o
  careca' é interpretação da PF/imprensa.
