id: evt-2025-12-29-stf-informa-que-pf-ouvira-antes-de-decidir-acareacao
kind: event
title: STF informa que a PF colherá os depoimentos separados antes de decidir sobre a acareação marcada para
  30/12/2025
event_type: statement
date: 2025-12-29
date_precision: day
participant_ids:
  - supremo-tribunal-federal
  - dias-toffoli
  - policia-federal
  - daniel-vorcaro
  - paulo-henrique-costa
  - banco-central-do-brasil
description: Segundo o Poder360 (30/12/2025) e o Jornal de Brasília (29/12/2025), o STF informou em 29/12/2025
  que a delegada da PF responsável colheria primeiro, em 30/12, os depoimentos de Vorcaro, Paulo Henrique
  Costa e do diretor de Fiscalização do BC, e que só então decidiria se haveria acareação, com acompanhamento
  de juiz auxiliar do gabinete de Toffoli e de membro do Ministério Público. Limite, não resolvido pelo
  Novelo — o Poder360 de 30/12, publicado antes das oitivas, previa que a acareação ficaria para janeiro de
  2026; a nota do gabinete de Toffoli de 29/01/2026, já no acervo, registra oitivas em 30/12/2025 com acareação
  entre Vorcaro e Paulo Henrique Costa. O Novelo não leu ata ou termo do ato de 30/12 e não confirmou em fonte
  aberta se o diretor do BC participou da acareação.
