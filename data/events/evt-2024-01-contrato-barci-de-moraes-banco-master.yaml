description: Contrato de prestação de serviços e honorários advocatícios firmado em janeiro de 2024 (documento
  tornado público na PET 16.662). Segundo o Poder360, previa R$ 108 milhões líquidos em 36 meses; a nota
  do escritório de 09/03/2026 situa os serviços entre fevereiro de 2024 e novembro de 2025. O relatório
  da PF registra que, em 17/01/2024, Viviane enviou a versão final do contrato a Vorcaro e que Fábio Faria
  tratou do prazo com o banqueiro.
