description: Reportagem do Intercept Brasil, relatada pelo Jornal GGN, revelou que o Instituto Conhecer
  Brasil se comprometeu a fornecer contatos telefônicos de usuários do WiFi Livre SP à Talk Communications
  (campanhas de disparo em massa) e ao Instituto Orbis (pesquisas de satisfação), sem consentimento dos
  usuários. A SMIT afirmou desconhecer o compartilhamento de dados pessoais e disse fiscalizar regularmente
  o contrato; a Talk Communications negou ter recebido os dados; o Instituto Conhecer Brasil e o Instituto
  Orbis não comentaram.
