description: Segundo o laudo da PF, em 03/04/2024 Fábio Faria encaminha a Vorcaro mensagens de interlocutor
  não identificado propondo convidar 'o DPF Andrei' e afirmando 'Aí fechamos o PGR e o DPF'. Faria aprova
  e pede que 'o Marcio' faça o convite formal ao 'delegado geral'; Vorcaro comunica a 'Marcio Conjur'
  que 'o Ministro fez convite ao andrei PF'. Em seguida, assistente do diretor-geral pergunta sobre custeio
  de hospedagem e passagem, e 'Marcio Conjur' responde que todas as despesas seriam bancadas pelos organizadores.
  O laudo não identifica os autores das mensagens encaminhadas, não confirma que 'Andrei' seja Andrei
  Rodrigues — não há contato com esse nome no aparelho — e não registra se a viagem ocorreu.
