id: evt-2025-08-19-cldf-aprova-compra-master-pelo-brb
kind: event
title: CLDF aprova o PL 1882/2025 autorizando o BRB a comprar participação no Banco Master
event_type: public_act
date: '2025-08-19'
date_precision: day
