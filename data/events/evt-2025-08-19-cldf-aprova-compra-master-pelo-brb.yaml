description: Projeto enviado pelo GDF em regime de urgência, aprovado por 14 a 7 em dois turnos, autorizando
  o BRB a adquirir 49% das ações ordinárias e 100% das preferenciais do Master; substitutivo do PT retirou
  autorizações genéricas. Antes da sessão, reunião fechada com Paulo Henrique Costa, que defendeu a operação;
  deputados de oposição criticaram o risco para o orçamento do DF e a falta de relatórios de risco. Seguiu
  para sanção do governador e dependia de aval do Banco Central.
