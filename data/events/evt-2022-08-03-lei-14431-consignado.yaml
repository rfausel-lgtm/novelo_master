description: A conversão da MP nº 1.106/2022 elevou o teto de comprometimento no consignado de 35% para
  40% (CLT) e de 35% para 45% (RGPS) e autorizou empréstimos a beneficiários do BPC e de programas federais
  de transferência de renda. A representação da PF examina a Emenda nº 30, apresentada na tramitação,
  como parte do eixo de atuação parlamentar em pautas de interesse do grupo.
