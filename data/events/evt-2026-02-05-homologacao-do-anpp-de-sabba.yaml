- saul-dutra-sabba
description: A Justiça Federal de São Paulo homologou o acordo de não persecução penal firmado entre o
  MPF e Saul Dutra Sabbá em dezembro de 2025, extinguindo a punibilidade mediante reconhecimento das irregularidades,
  prestação de serviços comunitários por dois anos e pagamento de cerca de R$ 100 mil. O MPF havia resistido
  ao acordo, sustentando que as condutas tinham alto potencial ofensivo e foram cometidas reiteradamente,
  e só cedeu após o STJ arquivar parte da acusação em 2021.
