description: Segundo o relatório da PF, o pedido chegou a Vorcaro pelo advogado Ciro Soares, apontado
  como interlocutor do procurador-geral; o banqueiro respondeu 'Óbvio, né' e, cerca de duas semanas depois,
  aprovou a inclusão do filho na lista de convidados custeados. O evento seria a 2ª edição do fórum jurídico
  em Londres, que não chegou a acontecer. As imputações são da autoridade policial; o procurador-geral
  foi intimado a se manifestar e o prazo estava em curso.
