description: O senador Carlos Viana, presidente da CPMI do INSS, entregou aos ministros do STF Luiz Fux
  e André Mendonça o texto do relator Alfredo Gaspar — rejeitado pelo colegiado em 28/03/2026, com proposta
  de 216 indiciamentos. Segundo Viana, Mendonça informou que o conteúdo seria anexado ao inquérito já
  em curso na Corte, dando ao material rejeitado um canal de instrução judicial mesmo sem aprovação formal
  da comissão.
