description: A PGR assinou, em 02/09/2026, o acordo de colaboração premiada com João Carlos Mansur, fundador
  da Reag — a primeira delação da Operação Compliance Zero. A proposta contempla ao menos 17 temas, prevê
  multa de R$ 40 milhões, e Mansur promete revelar o paradeiro de R$ 20 bilhões em ativos atribuídos a
  Vorcaro (dinheiro, direitos creditórios, imóveis), camuflados em nome de terceiros. Um dos anexos descreve
  remessa de R$ 494 milhões a um fundo em Cayman Islands formalmente em nome de terceiro, mas cujo controlador
  real seria Vorcaro — dado de confirmação cruzada ainda limitada. A audiência de voluntariedade ocorreu
  em 03/09/2026; Mendonça ainda não decidiu sobre a homologação.
