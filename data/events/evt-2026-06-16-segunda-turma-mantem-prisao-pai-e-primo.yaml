description: Por maioria, a Segunda Turma referendou as prisões preventivas (PETs 15873 e 15978). Gilmar
  Mendes divergiu parcialmente, propondo prisão domiciliar para Henrique e revogação da preventiva de
  Felipe; Toffoli não participou por suspeição. A defesa de Felipe sustentou a regularidade das operações
  financeiras. Mendonça afirmou que a investigação apura 'uma das maiores fraudes financeiras da história
  do nosso país'.
