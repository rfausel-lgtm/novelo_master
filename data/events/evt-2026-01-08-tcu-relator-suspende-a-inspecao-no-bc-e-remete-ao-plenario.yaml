  - src-itatiaia-2026-01-08-tcu-suspende-inspecao-do-bc-no-caso-master
cited_position:
  - by_id: tribunal-de-contas-da-uniao
    kind: version
    date: 2026-01-08
    summary: Na decisão, segundo a Reuters, o relator escreveu que "a dimensão pública assumida pelo caso, com
      contornos desproporcionais para providência instrutória corriqueira nesta Corte, recomenda que a
      controvérsia seja submetida ao crivo do Plenário". Em entrevista à Reuters em 07/01, o presidente do
      TCU, Vital do Rêgo, disse que o tribunal não tem competência para suspender a liquidação do Master.
    source_ids:
      - src-moneytimes-2026-01-09-ministro-do-tcu-suspende-fiscalizacao-no-banco-central
  - by_id: banco-central-do-brasil
    kind: version
    date: 2026-01-06
    summary: O BC sustentou nos embargos, segundo a Reuters e a Itatiaia, que a inspeção não poderia ser
      determinada monocraticamente por um ministro do tribunal. O Novelo não localizou nota do BC sobre a
      suspensão.
    source_ids:
