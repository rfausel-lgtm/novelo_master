id: evt-2026-01-08-tcu-relator-suspende-a-inspecao-no-bc-e-remete-ao-plenario
kind: event
title: Relator no TCU suspende a inspeção no Banco Central e remete os embargos ao Plenário
event_type: regulatory_act
date: 2026-01-08
date_precision: day
participant_ids:
  - tribunal-de-contas-da-uniao
  - jhonatan-de-jesus
  - banco-central-do-brasil
description: Em despacho de 08/01/2026, Jhonatan de Jesus suspendeu a inspeção no Banco Central e remeteu a
  controvérsia dos embargos ao Plenário do TCU, cuja primeira sessão, segundo a Reuters, estava marcada para
  21/01. Segundo
  Reuters e Itatiaia, o relator rejeitou a tese de que a inspeção dependeria de órgão colegiado, mas
  justificou a remessa pela repercussão pública do caso.
evidence_class: C
status: verified
evidence_ids:
  - ev-tcu-relator-suspende-inspecao-no-bc-e-remete-embargos-ao-plenario
source_ids:
