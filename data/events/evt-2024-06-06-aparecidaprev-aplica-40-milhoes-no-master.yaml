- banco-master
description: Três meses depois de o conselho recusar a alteração de política que era condição para o investimento,
  o instituto aplicou R$ 40 milhões em letras financeiras do Banco Master. A posição aparece pela primeira
  vez no demonstrativo de junho de 2024, equivalendo a 4,95% da carteira. O colegiado só registrou conhecimento
  da operação em setembro, quando seu presidente consignou que o valor fora aplicado sem consentimento
  do conselho. Em audiência pública de dezembro de 2025, a direção da autarquia confirmou não existir
  documento formal de aprovação da operação.
