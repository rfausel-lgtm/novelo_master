id: evt-2026-09-24-stf-requisita-a-pf-inquerito-sobre-a-atuacao-da-cvm-no-caso-master
kind: event
title: Na ADI 7.791, relator do STF requisita à PF inquérito sobre a atuação da CVM, incluindo o arquivamento,
  em 2022, da denúncia sobre o Grupo Master encaminhada pelo FGC
event_type: judicial_decision
date: 2026-09-24
date_precision: day
participant_ids:
  - supremo-tribunal-federal
  - flavio-dino
  - comissao-de-valores-mobiliarios
  - policia-federal
  - fgc
description: 'Em decisão de 24/09/2026 na ADI 7.791, o relator, Flávio Dino, em aditamento à decisão
  interlocutória de 20/09/2026 (eDOC 190), requisitou à Polícia Federal a instauração de inquérito policial
  "para apuração dos fatos descritos nesta decisão". A base é o relatório do grupo de trabalho da CVM (eDOC
  182), que examinou 314 processos administrativos de 2017 a 2026. Segundo a decisão, o relatório trata do
  Processo SEI nº 19957.001206/2022-08, instaurado em 18/02/2022 a partir de comunicação formal do FGC com
  denúncia relativa ao Grupo Master, que a área técnica da CVM classificou como "denúncia anônima desprovida
  de elementos suficientes para justificar o prosseguimento da apuração" e arquivou; o trecho do relatório
  reproduzido na decisão registra: "No caso em questão, não houve qualquer ação apuratória". A decisão afirma
  que os elementos dos autos "ultrapassam a esfera de possíveis irregularidades exclusivamente administrativas
  ou regulatórias" e lista, entre os pontos a apurar, as circunstâncias do arquivamento, "a eventual
  interferência indevida na atuação da CVM" (expressão da decisão) em 2021 e 2022, "a possível ocorrência de
  vazamento ou ocultação de informações relevantes por agentes da CVM" e as repercussões penais quanto ao FII
  CARE11 (PAS nº 19957.006441/2021-87). A PF deve informar o número do inquérito e apresentar relatório em 60
  dias; a CVM, em 72 horas, cópia integral do processo e informações sobre unidades com acesso, agentes
  responsáveis pela análise e pelo arquivamento, regime de sigilo, compartilhamento e providências
  posteriores; a PGR recebeu ciência. A decisão não nomeia investigados e registra que "A qualificação
  jurídica dos fatos, a identificação dos possíveis autores e a definição da competência jurisdicional deverão
  ser reavaliadas à medida que as diligências produzam novos elementos"; o Poder360 resume que ela "não
  atribui crimes a pessoas específicas". Decisão que manda investigar não é condenação nem prova de ilícito.
  Segundo o Poder360, a decisão de 20/09 deu 90 dias à União para avaliar e revisar as normas da autarquia,
  sob coordenação do Ministério da Fazenda. Até 21/10/2026 não foram localizadas notícias sobre a instauração
  do inquérito pela PF nem sobre o cumprimento do prazo de 72 horas pela CVM.'
