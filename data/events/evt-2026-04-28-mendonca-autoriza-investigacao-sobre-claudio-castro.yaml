description: 'Dois meses depois de a PF representar (20/02/2026, Pet 15.497) pela apuração autônoma de suposta
  corrupção do governador Cláudio Castro — apontando jantares e um evento de "degustação de whiskey" custeados
  por Vorcaro, e mensagens do operador Ricardo Siqueira Rodrigues sobre "alinhamento político" na
  RioPrevidência —, Mendonça autorizou, com anuência da PGR, a instauração do procedimento vinculado ao INQ
  5.026. A petição pediu explicitamente que o feito não fosse avocado de imediato ao STF, para preservar a
  Operação Barco de Papel em curso no Rio de Janeiro. É o ato de origem que antecede em um mês a busca e
  apreensão de 26/05/2026 (Pet 15.676), até então a única informação do acervo sobre o caso.'
