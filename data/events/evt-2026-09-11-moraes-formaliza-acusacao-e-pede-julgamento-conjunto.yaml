description: 'Oito dias depois de decisão judicial apontar "assimetria" nas condutas de Mendonça (ver
  evt-2026-09-03-moraes-pede-providencias-contra-mendonca), Moraes envia ofício formal a Fachin com lista
  numerada de condutas atribuídas ao colega — usurpação da direção de investigações, condução irregular de
  colaboração premiada, e direcionamento de alvos (o próprio Moraes e o senador Davi Alcolumbre) "por motivos
  pessoais e políticos". Pede julgamento conjunto das PETs 16.704 e 16.662 e denuncia levantamento de sigilo
  parcial, com 180 documentos excluídos dos 15 processos liberados por Mendonça em 10/09.'
