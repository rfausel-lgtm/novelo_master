description: A PGR fechou acordo de colaboração premiada com Antonio Carlos Freixo Júnior ('Mineiro'),
  doleiro que operacionalizou os repasses de recursos ligados a Vorcaro ao Havengate Development Fund,
  destinados ao financiamento do filme 'Dark Horse' — a segunda delação do caso, após a de João Carlos
  Mansur. Freixo confirmou as transferências, mas alegou desconhecer a destinação final dos recursos;
  relatou operações 'não ortodoxas', incluindo movimentação de dinheiro em espécie. Eduardo Bolsonaro
  negou ter recebido recursos; Flávio Bolsonaro reiterou que os valores foram integralmente destinados
  à produção.
