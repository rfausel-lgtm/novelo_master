- rui-costa
- credcesta
- empresa-baiana-de-alimentos
description: Os Decretos nº 18.353 e 18.354, assinados por Rui Costa, converteram o cartão de compras
  da Cesta do Povo em plataforma de crédito consignado. O primeiro assegurou ao detentor privado dos direitos
  a faculdade de diversificar as funcionalidades do cartão para serviços creditícios, financeiros e securitários,
  com margem de 30% da remuneração líquida, e estabeleceu que o Estado não teria custo. O segundo reescreveu
  o art. 19, II, do regime de consignações, transferindo ao operador privado uma margem de 30% que antes
  era reservada a benefícios concedidos pelo próprio poder público — tornando-a cumulativa com os 30%
  dos bancos. Os atos são de dezesseis dias após o leilão da EBAL.
