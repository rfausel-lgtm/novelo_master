description: 'Três dias antes da sessão plenária extraordinária convocada para 15/09/2026, com a PET 16.662 como item
  único, André Mendonça encaminhou os autos à Presidência. O despacho cita o item IV da decisão de Edson Fachin na
  Pet 16.704, que suspendeu os procedimentos sobre potencial investigação de integrantes do STF, e registra que o
  feito havia sido liberado para o Plenário em 06/09/2026. Não diz se a sessão se mantém.'
