id: evt-2026-09-25-presidencia-do-stf-pede-a-oitiva-da-pgr-na-pet-16704
kind: event
title: A Presidência do STF pede a oitiva da PGR sobre todas as providências postuladas na PET 16.704
event_type: judicial_decision
date: '2026-09-25'
date_precision: day
participant_ids:
- edson-fachin
- supremo-tribunal-federal
- ministerio-publico-federal
description: >-
  Em 25/09/2026, na PET 16.704, a Presidência do STF despachou: "Considerando os requerimentos pendentes, entendo
  necessária a oitiva da Procuradoria-Geral da República acerca de todas as providências postuladas (Docs. 161,
  163, 166, 175, 180, 184, 189 e 194), inclusive quanto à sua pertinência, necessidade, adequação e eventual
  repercussão sobre procedimentos investigativos em curso. À Procuradoria-Geral da República, para manifestação e
  parecer, no prazo de 5 (cinco) dias." No mesmo dia o portal registra "Vista à PGR". Em 13/10/2026 o Informe do
  STF registra que a Presidência aguarda o pronunciamento da PGR na PET 16.704. O portal lista petições posteriores
  (25, 26 e 29/09, duas em 08/10 e a Petição 128602, de 12/10) sem identificar os peticionantes, e o Novelo não as
  atribui a ninguém. Até 13/10/2026, última entrada na consulta de 16/10, não há petição identificável da PGR nem
  nova designação de pauta depois de 17/09.
