description: A Polícia Federal marcou depoimento de Daniel Vorcaro para 15/09/2026, sobre irregularidades no
  Banco Master e fraudes em operações com o BRB — o mesmo dia da sessão extraordinária do STF (Pet 16.662)
  que decide se Alexandre de Moraes deve ser investigado por suas comunicações com Vorcaro. A oitiva já havia
  sido adiada uma vez (do fim de agosto) a pedido da defesa; novo pedido de adiamento é esperado, com a
  alegação de acesso incompleto aos documentos tornados públicos em 11/09/2026.
