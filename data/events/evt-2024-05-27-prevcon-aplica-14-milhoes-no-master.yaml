id: evt-2024-05-27-prevcon-aplica-14-milhoes-no-master
kind: event
title: Congonhas compra R$ 14 milhões em letras do Master violando o critério fixado pelo próprio comitê
event_type: transaction
date: '2024-05-27'
date_precision: day
participant_ids:
- prevcon-congonhas
- banco-master
description: Vinte dias depois de o Comitê de Investimentos autorizar a compra genérica de letras financeiras
  sob a condição de que a instituição estivesse na lista exaustiva da Secretaria de Previdência, o PREVCON
  adquiriu R$ 14 milhões em letras do Banco Master — que não constava da lista e só passaria a constar
  em abril de 2025. A autorização de aplicação descreve a operação como 'aplicação em títulos públicos',
  embora identifique no mesmo documento o ativo como letra financeira do banco. O saldo chegou a R$ 16,5
  milhões em outubro de 2025 e foi baixado a R$ 0,01 no mês da liquidação.
