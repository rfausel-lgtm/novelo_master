description: 'Em 03/12/2025, dois atos distintos e no mesmo dia deslocaram o controle do caso Banco Master
  para o STF. Dias Toffoli, na Rcl 88.121/DF, determinou que novas diligências fossem previamente submetidas
  ao crivo do STF diante de suspeita de foro por prerrogativa de função. No juízo de origem, o juiz federal
  substituto Antônio Cláudio Macedo da Silva foi além: determinou que a Polícia Federal não praticasse mais
  nenhum ato investigatório no IPL 2025.0087917, remetendo-o ao STF ''com urgência'' — motivado por documento
  apreendido supostamente ligado a parlamentar federal não identificado nos autos. O MPF opôs embargos de
  declaração contra essa segunda decisão; foram rejeitados em 07/12/2025.'
