description: "Segundo o Poder360 e a Jovem Pan, a PF cumpriu em 14/01/2026 a 2ª fase da Operação Compliance
  Zero: 42 mandados de busca e apreensão em cinco estados (segundo a Jovem Pan), expedidos pelo STF em decisão do então relator Dias Toffoli (a decisão consta do evento de mesma
  data). O Poder360 lista como alvos Daniel Vorcaro, Fabiano Zettel, Felipe Cançado Vorcaro e Nelson Tanure, e
  informa que Zettel foi preso temporariamente. Conforme o Poder360, as medidas incluíram sequestro e bloqueio
  de bens e valores superiores a R$ 5,7 bilhões. A Jovem Pan, citando a PF, informa a apreensão de 39
  celulares, 31 computadores, 30 armas, 23 veículos avaliados em R$ 16 milhões e R$ 645 mil em espécie, e
  bloqueio de R$ 24 milhões em contas. Mandados e medidas cautelares não são condenação."
