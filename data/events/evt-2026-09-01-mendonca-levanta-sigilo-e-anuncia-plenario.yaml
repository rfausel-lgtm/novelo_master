description: O relator determinou o levantamento do sigilo dos autos e afirmou que o caminho inevitável
  do processo leva ao Plenário do Supremo, em sessão presencial e pública, em data a ser definida pela
  Presidência. O despacho registra que a PET 16.662 nasceu do desentranhamento da PET 15.556, por força
  do art. 5º, I, do Regimento Interno, e define o objeto como a identificação dos integrantes de suposta
  rede de influência e monitoramento atribuída a Daniel Vorcaro. No mesmo dia, o procurador-geral da República
  pediu a extinção do feito por nulidade.
