description: 'Terceira fase da Operação Transparência: quatro mandados de busca e apreensão no DF e em SP
  contra o deputado Cezinha de Madureira e sua esposa Valéria Rodrigues Linhares, por suspeita de
  exploração de prestígio, tráfico de influência, corrupção passiva e lavagem de dinheiro, autorizados pelo
  Min. Flávio Dino. Ocorre na véspera da sessão extraordinária do Plenário do STF de 15/09/2026 e um dia
  antes de Dino, na ADPF 1.196, citar o mesmo Cezinha de Madureira como intermediário do encontro entre o
  Min. André Mendonça e Daniel Vorcaro em 14/03/2025 (ver evt-2026-09-15-dino-decisao-adpf1196-converte-diligencia
  e rel-daniel-vorcaro-andre-mendonca-allegation).'
