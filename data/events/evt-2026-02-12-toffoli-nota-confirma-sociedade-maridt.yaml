description: Em nota de 12/02/2026, o gabinete de Toffoli admitiu que o ministro integra o quadro societário
  da Maridt, empresa familiar administrada por parentes, que foi sócia do grupo Tayayá até 21/02/2025;
  invocou o art. 36 da Loman; negou amizade com Vorcaro e recebimento de valores. No mesmo dia deixou
  a relatoria do caso.
