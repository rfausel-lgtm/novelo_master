description: A Polícia Federal deflagrou a Operação Compliance Zero com sete mandados de prisão e 25 de
  busca e apreensão no DF, RJ, SP, BA e MG, para combater a emissão de títulos de crédito falsos por instituições
  do Sistema Financeiro Nacional. Segundo a PF, as investigações começaram em 2024 a pedido do MPF e apontam
  que o Banco Master teria criado carteiras de crédito sem lastro, vendidas ao BRB. Daniel Vorcaro foi
  preso na operação, segundo a imprensa, e solto em menos de duas semanas por decisão do TRF.
