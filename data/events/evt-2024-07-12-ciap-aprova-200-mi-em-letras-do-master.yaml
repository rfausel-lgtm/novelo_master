description: Na 11ª reunião extraordinária do Comitê de Investimentos da Amprev, aberta por Jocildo Silva
  Lemos, o conselheiro José Milton Afonso Gonçalves propôs a alocação de R$ 200 milhões em letras financeiras
  do Banco Master, com vencimento em 10 anos e taxa de IPCA + 8,35% ao ano. O bloco deliberativo que incluía
  a aplicação foi aprovado por unanimidade. Comprovantes de TED para o Banco Master (banco 243) datam
  de três dias depois, 15/07/2024. A ata do Conselho Estadual de Previdência registra que os R$ 200 milhões
  saíram do resgate do Fundo BB Previdenciário Fluxo RF Simples e que, quatro dias antes, fora noticiada
  a destituição de dois gerentes da Caixa Asset por se oporem à compra de letras do Master.
