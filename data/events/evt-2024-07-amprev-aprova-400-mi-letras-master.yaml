description: Em julho de 2024, em menos de 20 dias, o Comitê de Investimentos da Amprev, coordenado por
  Jocildo Lemos, aprovou R$ 400 milhões em letras financeiras do Master (4,7% da carteira), sem documentação
  técnica prévia, segundo a Justiça Federal citada pelo Poder360; em uma deliberação de R$ 100 milhões,
  a aplicação foi condicionada apenas a visita posterior ao banco. Ata de 30/07/2024 registra alertas
  de dois conselheiros sobre risco, segundo a Gazeta.
