kind: event
title: Ministério da Previdência emite parecer de alerta entre o primeiro e o segundo aporte no Master
event_type: regulatory_act
date: '2024-07-15'
date_precision: day
participant_ids:
- banco-master
- amapa-previdencia
description: Três dias após o CIAP aprovar por unanimidade R$ 200 milhões em letras financeiras do Banco
  Master, o Ministério da Previdência Social emitiu o Parecer nº 146/2024, recomendando avaliação de riscos
  reputacionais antes de aplicações — sanções do Banco Central e da CVM, investigações, exposição negativa
  na mídia e estrutura societária. Quatro dias depois, o comitê aprovou novo aporte de R$ 100 milhões,
  dessa vez por maioria e contra dois votos.
