title: Lote 83b — a lista que desmentia o atestado estava no mesmo processo
summary: Varredura completa das 203 páginas dos autos de Itaguaí. A Lista Exaustiva do Ministério da Previdência
  está juntada ao próprio processo de credenciamento, nas páginas 182 e 183, e não traz o Banco Master
  S/A em nenhuma de suas seções — apenas a corretora do grupo, entre as elegíveis para administrar fundos,
  e fora da ordem de CNPJ; a seção de elegíveis apenas para emitir ativos do art. 7º, IV tem uma única
  entrada, o Banco C6. Na página 136 do mesmo processo, atestou-se com 'Sim' o cumprimento do requisito
  que essa lista espelha. Registrado ainda que o relatório de rating juntado aos autos já descrevia os
  precatórios entre as verticais de negócio mais relevantes do banco.
