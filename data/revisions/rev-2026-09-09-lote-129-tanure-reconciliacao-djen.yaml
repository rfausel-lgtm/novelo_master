title: 'Lote 129 — Nelson Tanure: valores reconciliados, e a decisão que marca audiências para outubro
  e novembro'
summary: 'Reconciliados os três valores díspares de aporte de Tanure no Master (R$ 2,5 bi e ''ao menos
  R$ 1,6 bi'' medem o mesmo fenômeno; R$ 1,1 bi é fluxo inverso). Esclarecida a natureza das debêntures
  da Banvox Holding (não conversíveis, mas com cupom pagável em ações desde dez/2022). Lidas diretamente,
  via DJEN/CNJ, 17 comunicações do processo Gafisa/Upcon: capitulação penal, ANPP negado a Tanure (mas
  oferecido e recusado por Gilberto Benevides), e audiências marcadas para 20/10 e 18/11/2026. Confirmado,
  por registro da Receita Federal, o codiretor da Banvox Holding até então não mapeado: Artur Martins
  de Figueiredo. Confirmados como resultado negativo: indiciamento no núcleo Master ainda não consumado;
  ausência na condenação da CVM de 08/09; ausência nos anexos conhecidos da delação de Mansur.'
