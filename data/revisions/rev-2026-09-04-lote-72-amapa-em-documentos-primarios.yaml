title: Lote 72 — o nó do Amapá em documentos primários
summary: 'Baixados e lidos integralmente: três edições do Diário Oficial do Estado do Amapá (7.825, 8.556
  e 8.594), a Lei estadual 0915/2005 consolidada, a ata da 9ª reunião ordinária do Conselho Estadual de
  Previdência e duas publicações do site oficial da Amprev. Achados: a atribuição do convite a Davi Alcolumbre
  não vem de fonte anônima nem de peça policial, mas de declaração do próprio Jocildo Lemos, repetida
  em dois registros oficiais; a decisão judicial da Zona Cinzenta não menciona o senador nenhuma vez;
  a nomeação da diretoria é ato de livre escolha do governador, sem participação legal de parlamentar;
  os dois conselheiros vencidos em 19/07/2024 são Alexandre Flávio Medeiros Monteiro e Gláucio Maciel
  Bezerra; o Ministério da Previdência emitiu o Parecer nº 146/2024 entre o primeiro e o segundo aporte;
  e a Amprev não é autarquia, mas serviço social autônomo. Corrigido o enquadramento jurídico da entidade
  e reconciliados os percentuais de concentração, que usavam denominadores distintos.'
