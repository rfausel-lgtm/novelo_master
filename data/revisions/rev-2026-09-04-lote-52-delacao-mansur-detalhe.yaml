title: 'Lote 52: a primeira delação da Compliance Zero em detalhe'
summary: 'Pesquisa conduzida por agente convocado em paralelo. Aprofunda a delação de João Carlos Mansur,
  já brevemente registrada: a assinatura do acordo em 02/09/2026, a audiência de voluntariedade em 03/09,
  os 17 temas e a multa de R$ 40 milhões, e a promessa de revelar o paradeiro de R$ 20 bilhões atribuídos
  a Vorcaro. Acrescenta, com ressalva de confirmação cruzada limitada, um indício sobre fundo em Cayman
  Islands citado em um dos anexos. Registra também, como antecedente relevante, a rejeição da segunda
  proposta de delação do próprio Vorcaro em 15/06/2026 — o episódio que precede diretamente sua terceira
  tentativa, já registrada no lote 51.'
