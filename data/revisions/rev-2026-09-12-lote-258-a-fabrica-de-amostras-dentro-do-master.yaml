title: 'Lote 258 — a fábrica de amostras dentro do Master, descrita numa investigação interna do próprio banco'
summary: 'No acervo digital que o liquidante do Master entregou à PF, os analistas acharam uma apresentação chamada
  "Investigações internas – Banco Master". Ela descreve funcionários gerando em lote, entre junho e outubro de 2025,
  CCBs, termos de consentimento e procurações a partir de dados de clientes Credcesta, em pastas batizadas "Demanda
  BRB-Tirreno 2700 amostras" — o mesmo kit que foi mandado ao BRB em 23/06/2025 como prova de 1.785 créditos da Tirreno.
  A apresentação aponta o diretor Alberto Félix como supervisor e registra a ordem de responder às falhas achadas pela
  Deloitte como "erro operacional na seleção". Registrado como alegação da PF; os funcionários citados não são nomeados.'
