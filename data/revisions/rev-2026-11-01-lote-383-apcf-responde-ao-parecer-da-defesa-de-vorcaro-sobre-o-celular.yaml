title: Peritos criminais federais (APCF) respondem em nota ao parecer da defesa de Vorcaro (atualização do 379)
summary: Atualiza o evento do lote 379 com a nota pública de 30/10/2026 da Associação Nacional dos Peritos
  Criminais Federais (APCF), entidade de classe que diz representar a carreira técnico-científica da Polícia
  Federal. Segundo a APCF, modificações em registros digitais não significam necessariamente adulteração, segundo a entidade, e o
  questionamento da defesa não comprova, por si só, falha da perícia; cabe ao Judiciário avaliar. A nota é
  posição da entidade, não da PF, e não examina arquivos nem afirma que o celular foi ou não alterado; a
  defesa pede os dados brutos e o perito dela não atribui as alterações a ação humana deliberada. Resposta da
  defesa à nota, manifestação da PF e decisão do STF não foram localizadas até 01/11.
