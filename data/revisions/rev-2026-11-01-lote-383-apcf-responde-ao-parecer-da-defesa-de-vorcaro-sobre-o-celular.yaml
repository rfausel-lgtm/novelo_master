reason: Documento primário íntegro da entidade, que fecha o contraditório institucional que faltava ao 379.
  Fonte única de conteúdo (a Gazeta do Povo é eco, sem apuração própria); por isso evidência D e unverified,
  com atribuição em toda frase, e evento mantido em D e unverified. Versão da defesa mantida em igual
  destaque. Ficaram de fora qualquer conclusão sobre a integridade do aparelho, republicações da nota, o
  título editorial da Gazeta, os dirigentes e o endereço da entidade, e o artigo do CPP além de uma menção.
