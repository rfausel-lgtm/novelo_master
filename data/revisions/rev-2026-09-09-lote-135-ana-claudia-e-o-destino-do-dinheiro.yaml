title: Lote 135 — Ana Cláudia Queiroz de Paiva, as empresas King e o destino do dinheiro da 'Turma'
summary: 'Terceira peça da divisão de trabalho descrita nos autos. A decisão do STF a descreve de duas
  formas incompatíveis — ''funcionária de Vorcaro'' num parágrafo, ''sócia da Super Empreendimentos''
  em outro —, e a apuração não sustenta a segunda: o registro da Receita a qualifica como diretora, e
  o principal acionista apontado da holding é um fundo administrado pela Reag. A contradição fica registrada
  como tal. Identidade fechada por um CNPJ cuja razão social embute o CPF dela. Dois fatos novos delimitam
  o personagem sem inflá-lo nem minimizá-lo: ela não apenas executou a transferência de R$ 1 milhão ao
  grupo de intimidação, como explicou a Vorcaro o mecanismo para que os pagamentos ao servidor do Banco
  Central não saíssem diretamente dele; e, em 2020, pedia justiça gratuita numa ação sobre aluguel de
  R$ 1.550, enquanto em 2024 assumia financiamentos imobiliários de R$ 3,7 milhões. Mapeadas as duas empresas
  King, de sócio único do chefe da ''Turma'', ambas suspensas judicialmente — com a ressalva de que o
  nome citado no corpo da decisão corresponde a uma terceira empresa, de terceiros sem relação com o caso,
  que o corpus não vincula. Registrada a devassa contra a jornalista Malu Gaspar e a tentativa de cooptá-la
  por R$ 120 mil mensais mais R$ 1,5 milhão de luvas. A menção ''DCM'' na mensagem sobre a divisão do
  dinheiro fica registrada como ambígua, sem atribuição a veículo ou jornalista: a decisão não identifica
  a sigla, ninguém do veículo apontado é investigado e o site nega. E o inquérito sobre a morte de Mourão
  sob custódia foi concluído pela própria PF, sem apuração externa e sem que a família tivesse acesso
  aos autos.'
