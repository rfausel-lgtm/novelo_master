title: Lote 123 — a CVM condena Vorcaro, o pai, o primo, o Master e mais 12 acusados por fraude no Brazil
  Realty
summary: Confirmado e analisado, por leitura direta do relatório de 19 páginas do processo mais duas fontes
  jornalísticas independentes, o julgamento da CVM de 08/09/2026 que condenou 16 acusados por operação
  fraudulenta na 3ª emissão do Brazil Realty FII (2018-2020) — laudos falsos/inconsistentes de imóveis
  e participações, negociações secundárias coordenadas para simular liquidez, R$ 201-201,5 milhões em
  multas (divergência entre fontes registrada). Mapeada a estrutura societária por trás do esquema (FG
  Participações controlando Sefer e Entre; Jaguar Investments como veículo offshore de Botelho) e os três
  ex-diretores da Sefer absolvidos por incompatibilidade cronológica. É processo autônomo da CVM, anterior
  e distinto da Operação Compliance Zero.
