title: 'Lote 214 — as regras do mandado, e a busca na sala da delegada'
summary: 'A partir da leitura direta das decisões públicas da PET 15.976/DF — o processo formal e distinto
  de busca e apreensão da 6ª fase da Operação Compliance Zero, gêmeo da PET 15.978 (prisão preventiva) e da
  PET 16.019 (bloqueio patrimonial), todos de 13/05/2026 e do mesmo relator —, o acervo registra dois fatos
  novos e concretos. Primeiro, os parâmetros operacionais fixados por André Mendonça para os mandados:
  limite de R$ 20.000,00 em espécie para apreensão, exigência de acompanhamento da OAB em buscas em
  escritórios de advocacia, determinação expressa de execução "sem qualquer espetacularização", e
  autorização de compartilhamento do material com a Corregedoria da PF — a base jurídica documental (D)
  que faltava para o PAD contra policiais investigados, até aqui registrado só via imprensa. Segundo, uma
  decisão complementar de 14/05/2026 que autoriza busca e apreensão especificamente na sala de trabalho da
  Delegada Valéria Vieira Pereira da Silva dentro da Superintendência da PF em Minas Gerais — distinta da
  busca domiciliar já conhecida.'
