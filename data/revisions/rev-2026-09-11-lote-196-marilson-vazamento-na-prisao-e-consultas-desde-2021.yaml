title: 'Lote 196 — Marilson: o vazamento dentro da prisão e as consultas ilegais desde dezembro de 2021'
summary: 'Primeiro lote extraído do e-Doc 2 da PET 15.978 — a representação de 243 páginas da PF que
  fundamenta a decisão da 6ª fase (13/05/2026, já no acervo desde o lote 190). Traz o fundamento concreto,
  até então não detalhado no acervo, da transferência de Marilson Roseno da Silva ao sistema penitenciário
  federal: mesmo preso, ele soube por colegas de cárcere, cuja identidade se recusou a revelar por temor,
  que a PF havia buscado sua própria residência em 13/03/2026. Revela também que suas consultas ilegais
  em favor da família Vorcaro remontam a dezembro de 2021 — quase três anos antes do episódio do drone
  já registrado no acervo —, quando pesquisou no sistema ePol os termos "André Beraldo Vorcaro", "Daniel
  Vorcaro", "Daniel Bueno Vorcaro" e "Banco Máxima". Registra, com cautela expressa, a suspeita da própria
  PF (não confirmada) de que o primeiro termo se refira a André Beraldo de Morais, ligado pela imprensa
  a empresas de fachada usadas para desviar recursos do Master. Registra ainda, como fato à parte e não
  confirmado, a especulação do próprio Marilson sobre um possível "ex-colega... lá dentro do banco" que
  teria avisado Henrique Vorcaro, antecipadamente, sobre seu próprio mandado de prisão.'
