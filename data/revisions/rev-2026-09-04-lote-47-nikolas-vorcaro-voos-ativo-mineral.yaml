title: 'Lote 47: o ''efeito bumerangue'' de Nikolas Ferreira'
summary: Pesquisa conduzida por agente convocado em paralelo. O corpus já registrava a declaração de Nikolas
  Ferreira pedindo a prisão de Moraes em plenário (lote 40); este lote acrescenta o desdobramento que
  a imprensa chamou de 'efeito bumerangue' — mensagens do próprio celular de Vorcaro mostrando que o banqueiro
  financiou voos da campanha de Nikolas em 2022 e que o deputado o procurou em 2025 para intermediar a
  liberação de um ativo mineral de interesse de um ex-assessor. Nikolas confirma a ajuda logística mas
  nega relação pessoal. Deputados do PT pedem investigação de ambos e do ex-assessor na PGR.
