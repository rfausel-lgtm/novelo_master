title: 'Lote 41: a reação da OAB e o escopo do trabalho de Wajngarten'
summary: Pesquisa conduzida por agentes convocados em paralelo. Registra as posições distintas do Conselho
  Federal e da seccional do Paraná da OAB sobre a crise Moraes-Mendonça — a segunda pedindo afastamento
  e suspeição, a primeira mais moderada. Esclarece que o trabalho de Fabio Wajngarten para Vorcaro é de
  comunicação e gestão de crise, não jurídico, com citação direta do próprio negando ser assessor jurídico.
  Registra a entrada do advogado Daniel Bialski na defesa de Vorcaro em agosto de 2026, sinalizando disposição
  de colaborar com a investigação.
