title: "Lote 380 — Decisão de 29/10/2026 na PET 16.704: Fachin devolve a Mendonça os autos da Operação Sem
  Desconto e mantém provisoriamente na Presidência os da Compliance Zero"
summary: "Registra a decisão do Presidente do STF de 29/10/2026 na PET 16.704: devolução ao relator originário
  dos autos da Operação Sem Desconto, manutenção provisória dos da Compliance Zero por até 90 dias contados de
  12/09/2026, limites da competência transitória da Presidência, eventos de reavaliação e referendo do
  Plenário. A decisão declara que não reconhece de forma definitiva competência, prevenção ou conexão nem
  antecipa juízo sobre o mérito, e que não é juízo sobre a representação pendente do Plenário. Cópia divulgada
  pelo Poder360, ainda não conferida no portal do STF: status unverified."
