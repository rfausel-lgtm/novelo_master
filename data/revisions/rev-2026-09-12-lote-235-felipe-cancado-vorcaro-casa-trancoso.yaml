title: 'Lote 235 — a segunda casa de Felipe Cançado Vorcaro: Trancoso, localizada por drone e cruzada com
  redes sociais'
summary: 'Um relatório de inteligência da PF de 13/01/2026, cruzado com a manifestação da PGR do mesmo
  dia, revela um método de investigação raro no acervo, documentado passo a passo: comparação entre fotos
  aéreas de drone e fotos públicas de Instagram de Cláudia Resende Soares da Silva para identificar uma
  segunda casa de veraneio de Felipe Cançado Vorcaro, no distrito de Trancoso (Porto Seguro, BA) — além do
  endereço já conhecido em Nova Lima (MG). Nas fotos usadas para a identificação aparece também Karina
  Resende Oliveira Vorcaro, cujo sobrenome sugere vínculo conjugal com ele, tratado como hipótese, não
  fato. Não há alegação de irregularidade contra nenhuma das duas mulheres — a menção decorre apenas de
  vigilância policial sobre paradeiro para fins de cumprimento de mandado. Como em todo o acervo, apenas a
  localidade do imóvel é registrada, nunca endereço ou coordenadas exatas.'
