corrections:
- 'O bloqueio do terreno não vem de ordem específica: a decisão de 19/06/2026 não o menciona, e a indisponibilidade
  foi averbada pela ordem geral na CNIB.'
- 'A Traneves Patrimonial não pertence a Wagner: é da família Trancoso Neves e vendeu-lhe o terreno em 2000.'
- A venda à Lagoons é de 18/05/2026, não de maio de 2025; em maio de 2025 houve o adiantamento pago pela EC Bahia
  SAF.
