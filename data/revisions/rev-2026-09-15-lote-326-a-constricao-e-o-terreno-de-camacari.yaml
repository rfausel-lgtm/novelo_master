title: Lote 326 — a constrição da PET 16.230 e o terreno de Wagner que o Grupo City comprou
summary: 'Os autos da PET 16.230 abrem o eixo patrimonial da 9ª fase. Em 19/06/2026, André Mendonça decretou a constrição
  de bens de 27 alvos — Wagner, Augusto Lima, Guilherme e Eduardo Sodré entre eles — até R$ 5.955.250, soma dos
  eixos Poème Horto e BN Financeira, contra o parecer da PGR, que se opusera à medida; em 29/07, liberou os proventos
  do Senado bloqueados de Wagner. Os documentos juntados pela defesa reconstituem o terreno de Camaçari: comprado
  em 2000 por R$ 28 mil, confrontando com área declarada de utilidade pública pelo Decreto 15.159/2014, assinado
  pelo próprio Wagner como governador, para a Via Metropolitana — obra pela qual ele diz ter aberto mão de indenização;
  oferecido ao Grupo City em fevereiro de 2025 para o condomínio junto ao CT do Bahia; R$ 2 milhões de adiantamento
  pagos pela EC Bahia SAF; e vendido em 18/05/2026 à Lagoons por R$ 15,8 milhões, em lotes e no adiantamento. A
  Lagoons, aberta em dezembro de 2025, é administrada pelo CEO da SAF e por Alex Trancoso Neves, cuja família vendeu
  o terreno a Wagner em 2000. O registro, pedido no dia seguinte à operação, foi barrado pela indisponibilidade.'
