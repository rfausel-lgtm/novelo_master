corrections:
  - 'Editor-master (23/10/2026): sai o documento novo doc-2026-02-19-decisao-pet15198-fluxo-ordinario-de-pericia-da-pf-e-compartimentacao, porque a decisão é a mesma já registrada como doc-2026-02-24-decisao-pet15198-planejamento-pericial-100-dispositivos (mesmo Ofício 12/2026, e-docs 380 e 306, cerca de 100 dispositivos, 20 semanas, dispensa do encaminhamento global das extrações). O registro existente passa a ter a data de assinatura do texto ("Brasília, 19 de fevereiro de 2026"), o PDF hospedado pelo STF, a notícia oficial e o resumo completo; o identificador fica como estava para não quebrar ligações.'
  - 'Editor-master: a fonte src-stf-pet15198-decisao-24-02-2026-planejamento-pericial-100-dispositivos e a evidência ev-compliance-zero-2fase-cerca-100-dispositivos-pericia passam de 24/02 para 19/02/2026; a evidência ev-toffoli-manda-integra-dos-aparelhos-ao-stf-no-dia-da-saida dizia "Doze dias depois" e passa a dizer "Sete dias depois, em 19/02/2026". A data de 24/02 não consta do texto conferido; pode corresponder a movimentação no portal, não verificada.'
  - 'Editor-master: o evento de 19/03 atribuía ao Metrópoles a transferência "à noite"; o Metrópoles diz que ela foi realizada naquela quinta-feira (quem fala em noite é o Band, que erra o dia), e o texto passa a dizer "no mesmo dia". O resumo da fonte do Poder360 deixa de dizer que Vorcaro "firmou acordo de confidencialidade" e passa a dizer que assinou termo de confidencialidade, para não sugerir acordo de colaboração; a fonte do Band anota que o subtítulo chama o termo de "Acordo firmado".'
  - 'Editor-master: o título do evento de 19/05 deixa de afirmar a "7ª fase" como fato e atribui a numeração ao Band e ao Estadão; a descrição diz que a nota do STF não usa a numeração; a posição da defesa ganha a contestação feita nos autos em 02/07/2026 (já registrada no verbete), para dar à defesa o mesmo destaque da suspeita. O nome do perito é mantido: SBT News, com apuração própria, e o Estadão o nomeiam pelo cargo público, e o verbete já existia com a decisão de 18/05 lida nos autos.'
  - 'Editor-master: o título literal da fonte do SBT News foi mantido, como nos títulos de fonte já publicados sobre o mesmo assunto; a pessoa referida tem verbete próprio por papel próprio e não é nomeada em texto próprio deste lote. A fonte da CartaCapital passa a anotar o endereço canônico.'
  - 'Editor-master: no verbete joao-claudio-nabas, além das duas fontes novas, a pergunta em aberto de 13/09/2026 dizia "fornecimento indevido de informações" em texto próprio; passa a dizer "suposto fornecimento de informações" (vocabulário da política editorial).'
