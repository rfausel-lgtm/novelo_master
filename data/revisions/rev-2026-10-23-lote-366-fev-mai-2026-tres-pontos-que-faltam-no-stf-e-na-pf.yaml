title: "Lote 366 — Compliance Zero e STF, fev–mai/2026: a decisão de 19/02 sobre a perícia da PF, o termo de
  confidencialidade de 19/03 e a operação de 19/05 contra perito da PF (a 7ª fase, segundo a imprensa)"
summary: 'Lote de fechamento de três lacunas. O que NÃO se afirma, em destaque: o Novelo não afirma que haja
  acordo de colaboração firmado ou homologado por Daniel Vorcaro (as três reportagens de 19/03 descrevem só o
  termo de confidencialidade como passo inicial, e dizem que o teor segue sob sigilo; nenhum conteúdo, nome ou
  prova de colaboração é registrado); não afirma que o sigilo do caso foi "reduzido" em 19/02 (o texto da
  decisão determina a manutenção do nível III; o título da CartaCapital e do InfoMoney fala em redução, o do
  Jovem Pan em manutenção, e a divergência fica como limite); e não afirma que o perito investigado na 7ª fase
  tenha cometido o crime apurado (a suspeita é da PF, a medida é cautelar). (1) Decisão de 19/02/2026 (Pet
  15.198, lida no PDF hospedado pelo próprio STF, com notícia oficial): Mendonça, uma semana após assumir a
  relatoria, autoriza o fluxo ordinário de trabalho pericial da PF para cerca de 100 dispositivos (a PF
  estimara 20 semanas de um único perito), diligências ordinárias e a custódia do material pela PF, impõe
  compartimentação e dever de sigilo inclusive perante superiores, exige pedido prévio ao relator para novas
  investigações e mantém o sigilo padrão nível III; segundo o Estadão Conteúdo e a CartaCapital, antes só
  quatro peritos autorizados por Toffoli podiam analisar os aparelhos (classe C; a decisão não cita o número).
  O acervo já tinha esta mesma decisão como
  doc-2026-02-24-decisao-pet15198-planejamento-pericial-100-dispositivos, datada por engano de 24/02; o lote não cria
  documento novo: reaproveita esse registro, completa-o e corrige a data para 19/02 (ver correções). (2) 19/03/2026 (classe C, Poder360, Metrópoles e Band): Vorcaro assina termo de
  confidencialidade com PGR e PF e Mendonça autoriza a transferência dele da Penitenciária Federal de Brasília
  para a Superintendência da PF; o termo e a decisão de transferência são sigilosos e não foram lidos; só o
  Metrópoles liga a mudança de custódia às tratativas (classe A); versão da defesa por interlocutores
  (Metrópoles) e expectativa dos advogados de concluir em 15 dias (Band) registradas; sem nota de PGR ou PF
  localizada. (3) 19/05/2026: nota do STF (classe D quanto ao que informa) diz que, por decisão de 18/05,
  foram cumpridos dois mandados de busca e apreensão e medidas cautelares, entre elas a suspensão da função,
  contra policial federal investigado como perito criminal federal, em apuração de eventual violação de sigilo
  funcional, e que não há direcionamento contra a imprensa; Band e Estadão chamam de sétima fase (numeração da imprensa; a nota do STF não a usa), o que
  completa a numeração das fases 1 a 10 no acervo; SBT News e Estadão nomeiam o perito João Cláudio Nabas, já
  presente no acervo pelos autos da Pet 15.625, e a posição da defesa (sem resposta ao Estadão; nota da APCF)
  tem o mesmo destaque que a suspeita. A cidade das buscas, citada por um veículo, não é registrada. Não
  confirmados: a numeração oficial da fase pela PF (o portal gov.br/pf devolve só a casca); o número da
  petição da decisão de 18/05 na nota do STF; qualquer manifestação de Moraes sobre esta fase. Não reaberto: o
  verbete e as fontes dos autos da Pet 15.625 (documentos autenticados), que seguem como estavam.'
