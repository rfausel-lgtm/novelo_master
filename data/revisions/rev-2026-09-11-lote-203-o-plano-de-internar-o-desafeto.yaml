title: 'Lote 203 — O plano de internar o desafeto, e a frase "preciso matar esse cara"'
summary: 'Quarto lote do e-Doc 4 da PET 15.978 (extração forense do celular de Daniel Vorcaro), extraído
  do capítulo sobre violência e coação. Duas passagens inéditas no acervo. A primeira: em 19/10/2024,
  Luiz Phillipi Mourão propôs a Vorcaro internar um desafeto, Antônio Augusto Conte, afirmando ter
  contato com dono de clínica psiquiátrica e de reabilitação e que conseguiriam a internação "com ordem
  judicial" — medida que a própria PF registra como aparentemente forjada. Cinco dias antes, Mourão o
  descrevera em termos ofensivos e o apontara como quem teria contratado jornalista para publicar
  informação falsa. Não há resposta de Vorcaro nos autos nem indício de execução. O mesmo nome já
  aparecia, por outro caminho, entre os termos que Marilson Roseno pesquisou em consultas indevidas aos
  sistemas da PF — e é por ser alvo, nunca suspeito, que ele entra no acervo. A segunda passagem: em
  25/07/2025, ao dizer que alguém o filmara com a filha e espalhava as imagens, Vorcaro escreveu "Preciso
  matar esse cara", ao que Mourão respondeu "sabe quem é? Vou pra cima". O lote acrescenta ainda a origem
  do áudio em que Woyceichoski relata a ameaça sofrida, e os dois nomes que ele próprio deu de quem lhe
  telefonou.'
