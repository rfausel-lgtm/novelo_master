title: 'Lote 48: o rastro da CPMI do INSS e os limites da conexão com a Carbono Oculto'
summary: 'Pesquisa conduzida por dois agentes convocados em paralelo. Parte A: após o encerramento sem
  relatório aprovado (28/03/2026), a CPMI do INSS teve dois textos rejeitados encaminhados informalmente
  a PF, CGU, PGR e STF em abril de 2026, e um vazamento de dados sigilosos de Vorcaro (incluindo conversas
  privadas) foi rastreado pela PF ao próprio material disponibilizado à comissão. Parte B: apura a relação
  entre a Operação Carbono Oculto (PCC) e o caso Master — a Justiça já negou formalmente, em dezembro
  de 2025, que exista conexão processual envolvendo Vorcaro; a sobreposição real é indireta, via a gestora
  Reag (que recebeu R$ 3,6 bilhões em repasses do Master e também foi alvo da Carbono Oculto) e a Trustee
  (custodiante comum de fundos bloqueados na operação). Registra-se essa distinção com cuidado para não
  superdimensionar a ligação entre os dois casos.'
