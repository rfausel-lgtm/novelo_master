title: 'Lote 293 — o Master forjava procurações e CCBs do CredCesta para legitimar transações com o BRB'
summary: 'Achado do agente de monitoramento de imprensa, verificado por WebFetch direto: relatório da PF,
  tornado público na quebra de sigilo de setembro de 2026, aponta que o Banco Master fabricava em escala
  procurações e cédulas de crédito usando dados de clientes do CredCesta — com ferramentas de automação
  gerando milhares de documentos em lote e manipulação digital sistemática (remoção de datas, exclusão de
  horários de assinaturas eletrônicas) para dificultar a rastreabilidade. Os documentos fabricados serviam
  de lastro documental para legitimar transações bilionárias com o BRB. Achado ainda sem acesso ao relatório
  primário da PF nem citação literal de seu texto — apenas paráfrase jornalística, classificado como A.'
