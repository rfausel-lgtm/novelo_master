title: 'Lote 222 — as duas holdings controladoras do Master, nomeadas pelo próprio Banco Central'
summary: 'O Comunicado 44.234 do Banco Central, que decretou a liquidação extrajudicial do Banco Master em
  18/11/2025, nomeia como controladoras sujeitas a indisponibilidade de bens duas pessoas jurídicas até
  então fora do acervo: Master Holding Financeira S.A. e 113 Investimentos e Participações Ltda — ao lado
  das pessoas físicas já mapeadas (Daniel Vorcaro, Armando Miguel Gallo Neto, Felipe Wallace Simonsen). O
  mesmo comunicado confirma que Angelo Ribeiro da Silva, Felipe Wallace Simonsen e Luiz Bull permaneceram
  como ex-administradores até a liquidação, ao lado do próprio Vorcaro.'
