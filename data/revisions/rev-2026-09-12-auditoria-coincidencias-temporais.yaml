title: 'Auditoria da aba de coincidências temporais: uma sequência retratada e um despacho que constava três vezes'
summary: 'Auditoria das nove sequências publicadas em /coincidencias, nos três eixos que a própria página
  promete separar — proximidade temporal, nexo documental e causalidade. A disciplina de fundo está
  intacta: causalidade comprovada é "não" em todas as nove, inclusive nas quatro em que o nexo documental
  existe, e todas trazem limites substantivos. Os problemas estavam na precisão. A sequência que ligava o
  áudio de cobrança de Flávio Bolsonaro à transferência de US$ 1,6 milhão ao Havengate foi retratada: ela
  afirmava no título um intervalo de oito dias, mas a data do áudio não está estabelecida — três veículos
  dão datações diferentes, e pela do Metrópoles o áudio seria posterior à transferência, invertendo a
  ordem cronológica e o sentido sugerido. A sequência já registrava a divergência nos próprios limites,
  mas seguia afirmando a data no título. Sai do ar até que a data se resolva. A página também passa a
  marcar com "≈" e a ressalva "(data aproximada)" os intervalos calculados a partir de datas sem precisão
  de dia — seis das nove sequências têm ao menos um passo nessa condição. Por fim, o despacho de Fachin de
  03/09/2026 constava do acervo três vezes, registrado conforme as fontes chegavam: fica o registro
  canônico, de classe D e ancorado no despacho oficial do STF, e o pedido de Mendonça pelo afastamento de
  Moraes, que estava pendurado num dos duplicados, ganha evento próprio.'
