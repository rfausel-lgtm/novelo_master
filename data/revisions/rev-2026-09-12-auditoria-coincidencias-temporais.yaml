corrections:
- 'RETRATAÇÃO: seq-dark-horse-cobranca-2025-09-08-e-transferencia-2025-09-16 sai do ar. O título e a
  descrição afirmavam um intervalo de oito dias entre o áudio de cobrança e a transferência ao Havengate,
  mas a datação do áudio diverge entre CartaCapital (08/09/2025), Metrópoles (16/11/2025) e Gazeta
  (outubro e novembro), e o evento de origem tem precisão aproximada. Pela datação do Metrópoles, o áudio
  é posterior à transferência e a sequência inverte de sentido. Como a proximidade temporal era todo o
  fundamento da sequência, ela não se sustenta enquanto a data não for fixada.'
- 'Correção de exibição: o intervalo em dias entre passos de uma sequência era apresentado como número
  exato mesmo quando uma das datas não tinha precisão de dia — nesses casos o cálculo assume o dia 1º do
  período. Passa a ser exibido com "≈" e a ressalva "(data aproximada)". Afeta seis das nove sequências.'
- 'Correção de título: a sequência sobre a Lei nº 14.431/2022 anunciava "o modelo de negócio do Banco
  Master", mas seu segundo passo é a Emenda nº 11 à PEC 65/2023, que trata da cobertura do FGC. O título
  passa a nomear o que os passos de fato contêm.'
- 'Consolidação de duplicatas: o despacho de Fachin de 03/09/2026, que abriu a PET 16.704 com prazo comum
  de cinco dias úteis, constava de três eventos distintos — registrados conforme a notícia chegava, primeiro
  pela imprensa e depois pelo despacho oficial. Permanece o registro canônico (classe D, ancorado no
  despacho do STF), que recebeu as evidências e fontes dos outros dois; os duplicados foram retratados.'
- 'Separação de fatos distintos: um dos registros duplicados carregava também o pedido verbal de André
  Mendonça a Fachin pelo afastamento cautelar de Alexandre de Moraes — ação distinta, como o próprio texto
  daquele registro reconhecia. O pedido passa a ter evento próprio, com as duas fontes e a evidência que
  lhe pertenciam.'
