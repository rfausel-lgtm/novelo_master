corrections:
- 'henrique-peretto: recharacterizado de figura periférica (só ligada à Cartos) para partícipe
  operacional direto do aparato documental da Tirreno.'
- 'andre-seixas-maia: acrescenta a compensação financeira pelo risco, a ausência de pagamento pelos
  créditos gerados, e sinaliza tensão não resolvida sobre sua qualificação como "sócio da Cartos" no
  presente (ele saiu da empresa em 2021, segundo registro já publicado).'
