title: 'Lote 238 — Henrique Peretto, de figura periférica a partícipe direto: a ata antedatada da Tirreno'
summary: 'A decisão de 22/06/2026 na PET 15.478/DF (Min. André Mendonça), sobre afastamento de sigilo
  bancário/fiscal no esquema de venda de créditos fabricados do Master ao BRB via Tirreno, muda a
  caracterização de Henrique Peretto: até aqui ele só aparecia ligado à Cartos, com a atribuição de
  "criador da Tirreno" feita por Daniel Vorcaro tratada como disputada e provavelmente falsa. A nova peça
  descreve ciência irrestrita dele sobre os termos espúrios da empresa, presença na assinatura dos
  contratos no Banco Master e reuniões no BRB ao lado de Augusto Lima e Paulo Henrique Costa — e revela
  que ele encaminhou a André Seixas Maia, em 17/04/2025, uma ata de assembleia extraordinária da Tirreno
  datada de 02/12/2024, dois dias depois de a empresa ter sido formalmente registrada na JUCESP em
  15/04/2025 — indício, segundo a autoridade policial, de documento fabricado a posteriori.'
