date: '2026-09-11'
title: 'Saneamento: as órfãs com lastro documental voltam ao grafo'
summary: 'Segunda etapa da manutenção de integridade aberta pela auditoria do grafo — não é apuração nova. Vinte
  e quatro relações religam entidades que estavam publicadas sem nenhuma conexão, embora os documentos já sustentassem
  o vínculo: o caso Gafisa/Upcon (Nelson Tanure, Gilberto Benevides), a estrutura de Leonardo Augusto Furtado Palhares
  (Varajo Consultoria, Super Empreendimentos, e o contrato que remunerou Belline Santana), a empresa ''Inspiração''
  criada pelo próprio servidor do Banco Central, a administração da PKL One por Andrea Lima Novaes, a ação coletiva
  da Feserp-MS contra o CredCesta, os dois fundos que receberam cessões do escritório de Ibaneis Rocha, a Kovr Seguradora
  dentro e fora do conglomerado Master, a Moriah Asset de Fabiano Zettel, e o Rioprevidência sob Deivis Marcon Antunes.
  Entra também a banca Figueiredo & Velloso como entidade, para dar lugar próprio ao nexo entre seus dois sócios
  criminalistas e a sócia de comunicação que namora o diretor-geral afastado da PF. Nenhum fato novo é acrescentado:
  o que muda é que fatos já publicados passam a ser percorríveis no grafo.'
