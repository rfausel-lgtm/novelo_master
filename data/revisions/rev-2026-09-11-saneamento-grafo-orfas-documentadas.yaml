corrections:
- 'Correção estrutural: vinte entidades que estavam publicadas sem nenhuma conexão no grafo passam a ter as relações
  que os documentos já sustentavam, entre elas Gafisa, Upcon, Gilberto Benevides, Leonardo Augusto Furtado Palhares,
  Inspiração, Câmara e.Net, Andrea Lima Novaes, Feserp-MS, Fundo Laguz I, Pedra Azul FIDC, Kovr Seguradora, Moriah
  Asset, Câmara Municipal de Imperatriz, Daniel de Faria Jerônimo Leite, Deivis Marcon Antunes, Aletéa Vega Marona
  Kunde, Renata Varandas, Pedro Ivo Velloso e Ticiano Figueiredo de Oliveira.'
- 'Cautela preservada: a ligação entre a Câmara e.Net e Leonardo Augusto Furtado Palhares entra como inferência
  (classe I), não como fato — a identidade entre o dirigente citado no dossiê do Banco Central e o investigado permanece
  hipótese reforçada, e não confirmada.'
- 'Cautela preservada: a relação entre Gafisa e Upcon registra expressamente que a ação penal por uso de informação
  privilegiada é distinta da investigação sobre o Banco Master, conexão rejeitada pelo STF em 27/01/2026.'
- O juiz federal Ricardo Soares Leite passa a constar como participante do evento da 1ª fase da Operação Compliance
  Zero, que ele autorizou — em vez de receber uma aresta direta com investigados, que insinuaria vínculo inexistente.
- 'Ajuste de classificação durante o próprio saneamento: oito relações redigidas inicialmente como classe D foram
  rebaixadas para C por não terem documento primário ligado — o lastro delas é de duas ou mais fontes independentes,
  não de peça documental. A regra é do próprio lint do acervo.'
- A dupla Daniel de Faria Jerônimo Leite / Câmara Municipal de Imperatriz havia ficado como ilha isolada, ligada
  entre si mas fora do corpo principal do grafo. Foram acrescentadas as relações com o BRB (ação civil, acordo homologado
  em 31/07/2026) e com Maurício Quadrado (compra de ações do BRB via fundo Verbier), que a trazem para a rede.
