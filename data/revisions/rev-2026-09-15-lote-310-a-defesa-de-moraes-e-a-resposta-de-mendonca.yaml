title: 'Lote 310 — na véspera da sessão, Moraes acusa Mendonça de vazamento e motivação eleitoral'
summary: 'Rafael baixou, na manhã de 15/09/2026, peças novas da Pet 16.704/DF datadas de 14/09 — véspera da
  sessão extraordinária. A mais relevante: ofício de 44 páginas e 121 tópicos (GMAM 13/2026) em que
  Alexandre de Moraes, em cumprimento a despacho de Fachin, apresenta defesa formal contra a investigação e
  acusa diretamente André Mendonça de ter vazado informações à imprensa antes de 7/9/2026, gravado vídeo
  político na véspera de atos por motivação eleitoral, e tentado incluir Moraes e o senador Davi Alcolumbre
  em colaboração premiada "por motivos pessoais e políticos" — a acusação mais direta já registrada no
  acervo de um ministro do STF contra outro. Moraes também insinua, sem prova anexada, que o relatório da
  PF poderia ter sido produzido com auxílio de "órgão externo, provavelmente estrangeiro". No mesmo dia,
  Mendonça respondeu separadamente a Fachin explicando a origem de um despacho controverso: determinou
  identificar pessoas citadas numa nota de Vorcaro que mencionava o diretor-geral da PF e o procurador-geral
  da República, agindo "por cautela... sem imputar qualquer suspeita a quem quer que seja". Mendonça não
  respondeu publicamente às acusações específicas de Moraes até esta coleta. Tudo tratado como alegação de
  parte interessada, não fato estabelecido.'
