title: 'Lote 116 — o nome por trás do ''enteado'': Eduardo Mendonça Sodré Martins, e a entrevista da ''patacoada'''
summary: Registrada, com classificação de evidência A (identificação nominal secundária sobre um valor
  já classe D), a identificação por reportagens de Eduardo Mendonça Sodré Martins como o enteado do senador
  Jaques Wagner a quem a PF atribui R$ 2,34 milhões. Acrescentado o advogado Ângelo Rezende como apontado
  sócio indireto da PKL One Participações. Registrada a entrevista de Wagner à Folha de S.Paulo (26/06/2026)
  em que classificou a ação da PF como 'patacoada' e acusou o STF de 'reinventar a Lava Jato'. Corrigida
  uma entrada da lote 115 (ev-andrea-novaes-suspeita-transferencia-3-5mi-familia-wagner) que duplicava,
  com classificação mais fraca, um fato já melhor documentado no corpus como classe D.
