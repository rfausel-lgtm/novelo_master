title: Alcolumbre esteve no fórum de Londres do Master, e é rival — não aliado — de Rueda no União Brasil
summary: 'Terceira rodada do aprofundamento Alcolumbre/Rueda. (1) Reportagens de fevereiro de 2026 (O Tempo,
  Jornal de Brasília) revelam que Davi Alcolumbre e Ciro Nogueira estiveram, pessoalmente, entre os presentes
  do 1º Fórum Jurídico Brasil de Ideias (Londres, 24-26/04/2024) — evento patrocinado pelo Banco Master já
  bem documentado no corpus (reuniu também Toffoli, Moraes, Gilmar Mendes, Lewandowski, Jorge Messias, Andrei
  Rodrigues, Paulo Gonet e Michel Temer) — é a primeira ligação pessoal direta de Alcolumbre com um evento
  custeado pelo banco, distinta das ligações via família e aliados já registradas. (2) Em 02/09/2026, véspera
  da decisão de Moraes contra Mendonça que cita Alcolumbre nominalmente, os dois se reuniram por três horas
  na residência do senador; horas depois, Alcolumbre saiu em defesa pública de Moraes — sequência registrada
  sem prova de causalidade. (3) Achado estrutural importante: Alcolumbre e Rueda não são aliados — disputam
  publicamente o comando estratégico do União Brasil para 2026, com posições opostas sobre a relação com o
  governo Lula. Isso não confirma nem afasta a hipótese da PF sobre Mendonça usar Rueda como "rota de acesso"
  a Alcolumbre, mas complica a leitura de qualquer aliança entre os dois. De brinde, o perfil de Rueda foi
  enriquecido com sua trajetória no PSL/DEM/União Brasil e o rompimento com Bivar em 2023.'
