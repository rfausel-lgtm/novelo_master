title: Lote 73 — o canal de colocação, e uma retratação
summary: 'As atas do Comitê de Investimentos da Amprev estão públicas e nunca foram usadas pela cobertura.
  Quatro foram baixadas e lidas. A de 14/03/2024 registra o próprio Banco Master pedindo reunião com o
  comitê e descrevendo em números a operação de captação junto a regimes próprios montada desde novembro
  de 2023 — cinco clientes, quarenta credenciamentos em andamento, R$ 700 milhões captados —, além de
  recomendar o prazo de dez anos. É o registro documental do canal de colocação. A ata de 19/07/2024 mostra
  que os R$ 400 milhões equivaliam a quase 59% de todo o estoque de letras financeiras do emissor. Corrigida
  a leitura sobre a rejeição de ofertas de bancos de primeira linha: elas não foram rejeitadas, foram
  aprovadas na mesma sessão. Estabelecido, por leitura do regulamento, que a Amprev não tem cobertura
  alguma do FGC. RETRATAÇÃO: o evento de deliberação de FIDC em 14/09/2021, publicado no lote 71 com base
  na decisão judicial, foi retirado — não houve reunião do comitê naquela data, não havia FIDC na carteira
  em nenhum mês de 2021 e nenhum dos investigados integrava o colegiado naquele ano. A evidência da existência
  da passagem no documento judicial permanece, reformulada.'
