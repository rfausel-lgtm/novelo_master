title: 'Lote 45: o cerco patrimonial contra a família Vorcaro'
summary: Pesquisa conduzida por agente convocado em paralelo, aprofundando o bloqueio de R$ 4,8 bilhões
  já registrado no lote 44. Acrescenta a liminar original de 17/03/2026, sua ampliação em 23/03/2026 (que
  inclui pai e irmã de Vorcaro como investigados), a tentativa frustrada de venda da mansão de Orlando
  à Chosen Vessel LLC via a holding Sozo Real Estate, e a ação civil da EFB nos Estados Unidos por mais
  de US$ 1 bilhão. Sinaliza como questão em aberto uma contradição entre fontes sobre o status do jato
  Gulfstream G700.
