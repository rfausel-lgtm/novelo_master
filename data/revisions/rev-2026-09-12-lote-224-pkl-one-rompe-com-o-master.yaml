title: 'Lote 224 — a PKL One rompe com o Master: da averbação negada à extinção do Credcesta'
summary: 'A disputa PKL One–Banco Master, até aqui registrada só pela via da imprensa (o litígio pelos
  repasses da folha de Macapá, agosto de 2025), ganha um capítulo anterior e mais concreto: duas cartas da
  PKL One documentam a ruptura contratual. Em 18/09/2025, a PKL One avisou o Master de que não poderia mais
  registrar novos produtos sob a marca Credcesta sem autorização prévia; em 02/10/2025, formalizou a
  extinção do direito de uso da marca. Registrado como relação própria, distinta da disputa por Macapá, com
  documentos primários (as próprias cartas, assinadas digitalmente) em vez de fonte jornalística única.
  Um achado lateral: uma semana antes de sua liquidação, em 10/11/2025, o Master autorizou compensar
  pagamentos entre cinco credores ligados ao mesmo ecossistema Credcesta — PKL One, Ametrino, uma "Terra
  Firme" ainda não identificada com precisão, o Banco Pleno e uma empresa nova para o acervo, Você Pode
  Saúde.'
