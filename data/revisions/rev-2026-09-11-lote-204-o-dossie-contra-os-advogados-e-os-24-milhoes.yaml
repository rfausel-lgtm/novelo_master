title: 'Lote 204 — O dossiê contra os advogados, a escalada contra Timerman, e os 24 milhões'
summary: 'Primeiro lote do e-Doc 3 da PET 15.978 — IPJ-A nº 1070759/2026, a análise técnica mais longa
  do acervo sobre o chat entre Daniel Vorcaro e Felipe Mourão (198 páginas, out/2023 a nov/2025). Dois
  achados inéditos e uma resolução aritmética. Primeiro: um dia depois de chamar de "depravado" o autor
  de um pedido de busca e apreensão contra o Master, Vorcaro recebeu de Mourão dossiês completos — telefone,
  endereço, vínculos empresariais e familiares — sobre os quatro advogados responsáveis pelo pedido;
  profissionais no exercício da função, sem qualquer ação de represália documentada depois disso.
  Segundo: em agosto de 2024, diante de nova notícia de fato movida por Vladimir Timerman, Mourão propôs
  "medida mais drástica" contra ele, e Vorcaro respondeu "E contra o advogado tb", mandando em seguida "A
  turma" a São Paulo para "matar esses negócios" — lido no contexto de disputa processual, e não como
  ameaça de vida direta, distinção que o lote registra explicitamente. Por fim, a análise financeira da
  PF resolve uma divergência aritmética que o acervo já registrava sem solução: o cálculo de R$ 9,6
  milhões para "A Turma" fecha exatamente com 24 meses de pagamento (não 36), e a mesma conta mostra que
  Mourão recebeu, no mínimo, R$ 24 milhões ao todo — a primeira vez que esse total cumulativo aparece no
  acervo.'
