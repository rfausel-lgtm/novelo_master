title: Girão acusa Alcolumbre de conflito de interesses, e Rueda é apontado como alvo oculto da Carbono Oculto
summary: 'Continuação do aprofundamento da linha Alcolumbre/Rueda. (1) Em 24/08/2026, o senador Eduardo Girão
  (novo verbete) acusou publicamente Davi Alcolumbre de bloquear a CPI do Banco Master por "conflito de
  interesses", citando nominalmente o irmão dele no Conselho Fiscal da Amprev (Alberto Samuel Alcolumbre
  Tobelem, já no acervo) e o ex-tesoureiro de campanha à frente da autarquia (Jocildo Lemos); a assessoria
  de Alcolumbre não contestou os fatos, apenas disse que não comentaria. (2) Antônio Rueda, além da acusação
  de comissão de 10% no caso Master, é apurado desde 17/09/2025 pela PF, na Operação Carbono Oculto, sob
  suspeita de ser dono oculto de jatos executivos e de fundos de investimento (Bariloche e Viena) ligados
  ao esquema de combustíveis do PCC — um piloto da empresa que operava as aeronaves o identificou perante
  a PF; Rueda nega e classifica como acusação política. É frente distinta da do Master, sem elo documental
  encontrado entre as duas, exceto a coincidência de que a Trustee DTVM (ligada a um ex-sócio de Vorcaro)
  também aparece na Carbono Oculto, em fundos diferentes. Até setembro de 2026, nenhuma das duas frentes
  resultou em oitiva, indiciamento, denúncia ou arquivamento contra Rueda.'
