title: 'Lote 195 — Sebastião, Valéria e Francisco: fecha a exploração do e-Doc 28'
summary: 'Sexto e último lote extraído do e-Doc 28 da PET 15.978 (decisão da 6ª fase, 13/05/2026, lote 190).
  Detalha Sebastião Monteiro Júnior — confirma a grafia "Monteiro" como a correta (resolvendo divergência
  já registrada), seu padrão de comunicação clandestino (terminal internacional dos EUA, mensagens
  autoapagadas) e a reconstrução, por cruzamento de dados, de uma sequência de encontros e contatos entre
  ele, Marilson, Mourão, Henrique Vorcaro e Manoel Mendes nos dias 01-03/03/2026, véspera da 3ª fase.
  Também precisa o papel de Valéria Vieira Pereira da Silva e Francisco José Pereira da Silva (ambos já no
  acervo) no acesso indevido ao Inquérito nº 2023.0064343 — o mesmo em que Henrique Vorcaro fora intimado —,
  registrando que a PF não localizou comunicação direta entre Valéria e Marilson, com Francisco na posição
  de intermediário.'
