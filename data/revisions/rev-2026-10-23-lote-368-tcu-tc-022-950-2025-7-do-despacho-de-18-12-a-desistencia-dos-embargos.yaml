title: "Lote 368 — TCU e Banco Central, dez/2025–jan/2026 (TC 022.950/2025-7): a oitiva de 18/12, os embargos
  do BC, a suspensão da inspeção e a desistência de 13/01"
summary: 'Lote que preenche o intervalo do TC 022.950/2025-7 entre dezembro de 2025 e a conclusão da inspeção
  em 11/02/2026. O que NÃO se afirma, em destaque: o Novelo não afirma que a liquidação do Master foi
  precipitada, tardia ou irregular (a hipótese é do relator, em juízo preliminar, num despacho que diz possuir
  "natureza exclusivamente instrutória"); não afirma que houve cautelar (o relator só diz vislumbrar a
  possibilidade de uma); não leu a decisão que mandou inspecionar, os embargos do BC, o despacho de 08/01 nem
  o de 13/01 na íntegra; e não afirma nada sobre sessão do Plenário em 21/01/2026, que nenhuma fonte aberta
  descreve: segundo Agência Brasil e Times Brasil, com a desistência dos embargos em 13/01 o caso deixava de
  ser analisado pelo Plenário. O despacho de 18/12/2025 de Jhonatan de Jesus foi lido em cópia hospedada pelo
  Poder360, cujo rodapé traz o código de autenticidade 79499517; em 23/10/2026 o portal de autenticidade do TCU
  reconheceu o número 79.499.517-9 como documento sigiloso de controle externo, sem exibir conteúdo nem
  assinantes, e a comparação do arquivo não foi feita. Por isso, pelo critério do lote 365 (cópia hospedada
  por veículo sem conferência no portal oficial), o despacho não ganha documento próprio e a evidência sobre
  ele, antes A (Estadão Conteúdo, "não localizado"), passa a C, não a D: oitiva prévia do BC em 72 horas sobre
  fundamentos, alternativas, tratativas, divergências internas e acesso a peças sigilosas, com envio à
  AudBancos. Também em camada C: os embargos do BC até 06/01 contra a inspeção determinada monocraticamente (Estadão Conteúdo, Reuters,
  Itatiaia); a suspensão da inspeção e a remessa ao Plenário em 08/01 (Reuters, Itatiaia); a reunião de 12/01
  entre Galípolo, Vital do Rêgo e o relator (CNN Brasil, Agência Brasil); a desistência dos embargos e a
  restituição dos autos à AudBancos em 13/01 (Agência Brasil, Times Brasil). Posições do BC e do TCU lado a
  lado em cada evento. Sem pessoa, organização ou relação nova; o presidente do TCU aparece só como autor de
  declarações, sem registro próprio.'
