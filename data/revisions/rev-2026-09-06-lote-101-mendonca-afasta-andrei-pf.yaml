title: 'Lote 101 — Mendonça afasta o diretor-geral da PF: nova escalada da crise no STF'
summary: 'A pedido do editor, apurado o afastamento cautelar de Andrei Rodrigues e Leandro Almada da Costa
  por decisão de André Mendonça (Pet 16.662, 08/09/2026), sob alegação de monitoramento ilícito do ministro
  pela própria PF — concessão de pedido que o partido Novo já havia protocolado em 03/09/2026. Decisão
  pendente de referendo definitivo na 2ª Turma (Gilmar Mendes pediu vista) e contestada pela AGU por violação
  de competência presidencial, com cumprimento orientado enquanto recorre. William Marcel Murad assume
  interinamente. Registrado, como resultado negativo relevante, que nenhuma fonte localizada traz reação
  pública de Fachin ao fato — apesar de a decisão ter sido tomada em processo próprio de Mendonça (Pet
  16.662), em paralelo ao procedimento (Pet 16.704) que o próprio presidente do STF avocara cinco dias
  antes para tratar da mesma crise. NOTA EDITORIAL: todas as fontes localizadas datam o fato de 08/09/2026,
  dois dias após a data corrente da sessão no momento em que a apuração foi solicitada (06/09/2026) —
  divergência sinalizada para checagem futura, sem prejuízo da convergência entre múltiplas fontes independentes
  sobre o núcleo do fato.'
