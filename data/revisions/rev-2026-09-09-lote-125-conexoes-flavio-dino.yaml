title: 'Lote 125 — as conexões de Flávio Dino: quem indicou Andrei à PF, e a colisão de frentes já prevista
  em julho'
summary: 'Confirmado, com data e justificativa (dezembro de 2022), que Flávio Dino indicou Andrei Rodrigues
  à Direção-Geral da PF quando era ministro da Justiça — o mesmo delegado que reintegrou ao cargo em 09/09/2026.
  Confirmado, por análise da CNN Brasil de julho de 2026 (anterior ao episódio), que a colisão entre as
  frentes de Dino e Mendonça no caso Dark Horse já era prevista pela imprensa especializada. Registrada,
  com cautela por fonte não plenamente confirmada, a leitura de bastidor sobre o alinhamento de Dino no
  bloco pró-Moraes do STF. Registrado que a AGU já havia pedido a suspensão da decisão de Mendonça por
  via distinta um dia antes. Documentado resultado negativo: nenhum jurista nomeado questionou publicamente
  a via processual escolhida por Dino, e não há recurso formal de Mendonça contra ela até a data desta
  apuração. Descartada explicitamente uma alegação de contato Dino-Galípolo sobre a venda do Master ao
  BRB, que na verdade se refere a Alexandre de Moraes.'
