title: 'Lote 127 — correção por leitura direta: a decisão de Toffoli não cita Vorcaro; a Kroll desmente
  relatório'
summary: 'Leitura direta da decisão de Toffoli de 30/09/2025 (PET 14.601/MA) corrige o registro do lote
  126: não é reclamação genérica contra o MP estadual, mas descumprimento de tese de repercussão geral
  (Tema 309, da própria relatoria de Toffoli); a decisão não menciona Vorcaro, Kroll, BRB, Quadrado ou
  Mansur — a ligação com o caso Master foi feita pela imprensa. Corrigida a data do aditivo contratual
  (06/04/2024, não abril de 2025). Registrado que a Kroll nega ter divulgado relatório atribuindo responsabilidade
  a pessoas — qualificando a caracterização de Daniel Leite como ''figura instrumental''. Adicionados:
  acordo BRB-Leite homologado em 31/07/2026; Leite também alvo da Operação Sem Desconto; pedido de afastamento
  dele da OAB-MA. Sobre o pedido do editor: não localizado filho de Wagner especificamente no caso BRB;
  localizado, em frente distinta (apartamento em Salvador), um filho biológico não identificado de Wagner;
  confirmado que Eduardo Mendonça Sodré Martins é enteado, e criado o registro de seu pai biológico, Guilherme
  Henrique Sodré Martins, alvo da 9ª fase da Compliance Zero.'
