title: 'Lote 247 — as últimas semanas de Toffoli no INQ 5.026, e a ordem de trazer os aparelhos ao STF no dia da saída'
summary: 'Leitura dos despachos do INQ 5.026 de janeiro e fevereiro de 2026 ainda não minerados — os últimos
  da relatoria de Dias Toffoli. Em 20/01, ele mandou reservar salas e servidores do STF para as oitivas da
  Polícia Federal; em 21/01, estendeu a quebra de sigilo bancário dos investigados aos dados consolidados pelo
  FGC; em 24/01, ratificou as medidas de primeiro grau e liberou a análise do material apreendido às vésperas
  das oitivas, nos termos da PGR. E em 12/02/2026, mesmo dia em que deixou a relatoria, determinou que a PF
  enviasse ao STF, na íntegra, o conteúdo dos aparelhos e mídias apreendidos e os laudos — fundamentando na
  Súmula Vinculante 14. Doze dias depois, Mendonça autorizou a PF a seguir o fluxo pericial ordinário,
  dispensado o encaminhamento global das extrações à relatoria.'
