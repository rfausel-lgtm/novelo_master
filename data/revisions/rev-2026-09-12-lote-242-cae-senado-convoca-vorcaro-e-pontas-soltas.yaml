title: 'Lote 242 — a CAE do Senado também convocou Vorcaro, e outras pontas soltas do INQ 5.026'
summary: 'Fecha a leitura das decisões públicas do INQ 5.026. Achado principal: a Comissão de Assuntos
  Econômicos do Senado, sob a presidência de Renan Calheiros, obteve do STF autorização para colher
  depoimento de Daniel Vorcaro — uma frente parlamentar distinta e paralela à já conhecida CPI do Crime
  Organizado, até aqui não mapeada. Renan Calheiros e a própria comissão ganham registro próprio. Duas
  pontas soltas menores: o MPF se opôs, em abril de 2026, à devolução imediata dos aparelhos apreendidos
  de André Seixas Maia por falta de confirmação de perícia concluída; e um despacho de agosto de 2026 cita
  Diogo Ilário de Araújo Oliveira prestando informações sobre a saúde de um investigado não identificado
  — registrado com a incerteza de identidade explícita, sem tentar adivinhar quem é.'
