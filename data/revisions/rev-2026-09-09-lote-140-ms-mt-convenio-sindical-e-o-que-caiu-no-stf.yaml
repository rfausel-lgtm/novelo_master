title: Lote 140 — o convênio de objeto sindical em Mato Grosso do Sul e o que de fato caiu no Supremo
summary: 'Segunda etapa da expansão para além da Bahia, com dois achados que mudam a leitura do caso.
  O primeiro está no diário oficial sul-mato-grossense: o convênio que abriu a folha estadual à PKL One
  em março de 2023 não menciona cartão de benefício — declara como objeto o desconto de ''contribuições
  e mensalidades devidas por seus servidores filiados'', redação própria de entidade sindical, e qualifica
  a empresa como ''Banco PKL One Participações S.A'', designação sem correspondência em qualquer autorização
  do Banco Central. O produto só aparece por escrito na renovação de 2025, que se apoia num parecer referencial
  genérico de 2020 — o mesmo invocado, na mesma página, para dois sindicatos. Esse convênio segue vigente
  até março de 2027, sem ato de rescisão publicado; a interrupção dos descontos em agosto de 2026 foi
  atribuída pelo próprio Estado a um impasse da empresa com a terceirizada, não a uma decisão do poder
  público. E a resolução apresentada como resposta suspende apenas credenciamentos novos, ressalvando
  expressamente as renovações. O segundo achado corrige uma leitura corrente sobre Mato Grosso: o Supremo
  derrubou, por unanimidade e no mesmo dia, tanto o decreto legislativo da Assembleia quanto os atos administrativos
  da secretaria estadual — mas a norma que efetivamente encerrou a margem do cartão de benefício, a lei
  estadual de junho de 2025, não foi tocada. Registra-se ainda a curva do litígio extraída da base de
  julgados do tribunal sul-mato-grossense, de 5 em 2023 a 216 em 2025; a rejeição judicial da tese de
  que a operadora seria ''mera licenciadora'' do programa; a derrota da única ação coletiva, extinta por
  ilegitimidade da federação e não por mérito; e a ressalva metodológica de que, em Mato Grosso, o aparato
  repressivo estadual mira outro grupo empresarial, não o CredCesta.'
