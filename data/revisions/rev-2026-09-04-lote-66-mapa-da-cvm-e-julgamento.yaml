title: 'Lote 66: o mapa da CVM e o julgamento de 8 de setembro'
summary: 'Completa a frente sobre o histórico do regulador. Registra o julgamento pautado para 08/09/2026,
  com dezenove acusados no processo do Brazil Realty FII — entre eles Daniel Vorcaro, o pai, o irmão,
  o Banco Master, a Milo, a Sefer, Benjamim Botelho e Antônio Carlos Freixo Júnior, o ''Mineiro'' da segunda
  delação. É o mesmo processo que o voto de dezembro de 2020 considerou sem materialidade suficiente para
  obstar o acordo então firmado com Vorcaro. Publica o mecanismo descrito no parecer técnico — laudo sem
  assinatura, sobreavaliação de R$ 56 milhões, avaliadora que não reconheceu a autoria, matrícula apontando
  outro proprietário, pagamento em espécie e recibo com assinatura aparentemente colada —, o retorno irregular
  de R$ 84,9 milhões à Milo, e o dado que costura esta frente à rondoniense: entre os investidores lesados
  havia regimes próprios de previdência. Registra a curva das três propostas de acordo rejeitadas, culminando
  na recusa unânime de R$ 21,285 milhões contra a recomendação do próprio Comitê, e a prestação de contas
  da autarquia no Senado, incluindo a admissão de que ''pode ter havido erro'' e a justificativa de que
  fundos para investidores profissionais recebem menor ênfase da supervisão preventiva. Corrige um dado
  de imprensa que não consta do registro primário.'
