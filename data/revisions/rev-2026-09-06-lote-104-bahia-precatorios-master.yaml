title: 'Lote 104 — os 207 pagamentos de precatórios da Bahia ao Master: cessão de crédito, não contrato
  direto'
summary: 'Apurado, a partir de lead trazido pelo editor via post no X (tratado como ponto de partida,
  não como fonte factual), o conteúdo de matéria de Lauro Jardim (O Globo, 15/03/2026): 207 pagamentos
  do governo da Bahia ao Master entre 2023 e fevereiro de 2026, R$ 49,2 milhões. Confirmado o mecanismo
  exato — cessão de crédito de precatórios do Fundef por iniciativa de servidores da Educação, amparada
  na EC 114/2021, não contrato direto Estado-Master. Todo o período é posterior à saída de Rui Costa do
  governo baiano (dez/2022); ocorre sob Jerônimo Rodrigues. Sem ato pessoal de Rui Costa localizado quanto
  a esse mecanismo específico. Registrada, e explicitamente descartada por falta de lastro, a associação
  que um post político fazia entre o tema e o afastamento do diretor-geral da PF. Há pedido de CPI na
  Alba sem instalação confirmada; nenhuma investigação do TCE-BA ou MP-BA localizada.'
