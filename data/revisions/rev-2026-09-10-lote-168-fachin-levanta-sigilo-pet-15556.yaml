title: 'Lote 168 — breaking news confirmado: Fachin determina levantamento do sigilo da PET 15.556'
summary: 'A pedido do editor, que ouviu a notícia de última hora, confirmada e apurada com a decisão em
  mãos. Na noite de 10/09/2026, o presidente do STF, Edson Fachin, proferiu despacho na PET 16.704 (o
  procedimento que ele mesmo abrira de ofício em 03/09/2026) determinando ao ministro André Mendonça,
  relator, a remessa em HD de todos os procedimentos da PET 15.556 — a petição-mãe do caso Master, da qual
  a PET 16.662 foi extraída — a todos os gabinetes do STF, e o levantamento do sigilo dela, ressalvadas
  apenas diligências pendentes cujo sigilo seja imprescindível à sua realização. A equipe obteve e leu a
  íntegra do despacho, um PDF de uma página assinado digitalmente (código verificável 965E-0FFB-9B66-04F0),
  publicado pelo Poder360 e confirmado de forma independente pelo Metrópoles. É o quarto ato de Fachin na
  mesma linha em oito dias (03/09 abertura de ofício, 04/09 avocação do pedido de Moraes contra Mendonça,
  09/09 suspensão das decisões sobre a PF e retirada da relatoria do INQ 4.781 de Moraes, agora 10/09 o
  levantamento do sigilo) — todos preparando a sessão extraordinária de 15/09/2026. NÃO CONFIRMADO E
  DESCARTADO: um resumo automático de busca havia sugerido que este despacho também tratava de credenciais
  de acesso institucional e vazamento de sigilo a investigado — a leitura do PDF mostrou que esse trecho
  pertence a um despacho ANTERIOR (03/09/2026, já no acervo), não ao de hoje; o despacho de 10/09 trata
  apenas da remessa e do levantamento de sigilo da PET 15.556.'
