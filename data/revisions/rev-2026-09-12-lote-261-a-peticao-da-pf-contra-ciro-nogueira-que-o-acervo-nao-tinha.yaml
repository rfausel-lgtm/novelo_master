title: 'Lote 261 — a petição da PF contra Ciro Nogueira que o acervo não tinha'
summary: 'Além da Pet 15.873, que levou à fase de 07/05/2026, o senador Ciro Nogueira é requerido numa segunda petição da
  Polícia Federal no STF: a PET 15.674, aberta em 12/03/2026 por prevenção ao INQ 5.026. O processo tem dezenas de
  petições sigilosas e, em 20/08/2026, André Mendonça concedeu à PF mais 60 dias de diligências "imprescindíveis para
  a ultimação das investigações". O conteúdo segue sob sigilo.'
