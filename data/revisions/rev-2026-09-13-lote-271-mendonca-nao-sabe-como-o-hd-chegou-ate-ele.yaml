title: 'Lote 271 — Mendonça reconhece que não sabe explicar como o HD lacrado chegou até ele'
summary: 'Dois dias antes da sessão de 15/09, Mendonça admite, em despacho na Pet 16.704, "divergência de
  informações" sobre como o HD com a extração do celular de Vorcaro — lacrado em seu gabinete desde março,
  centro da disputa com Moraes, Zanin e Gilmar Mendes registrada no lote 265 — de fato chegou até ele: "não
  tendo sido indicada nenhuma decisão que contivesse a referida determinação". Pede que a Presidência intime,
  em 24h, os quatro delegados que subscreveram a representação original da Pet 15.556 — Daniel Mostardeiro
  Cola, Wedson Cajé Lopes, Victor Arruda de Oliveira e Guilherme Alves de Siqueira — a explicar as
  circunstâncias e relatar eventuais "constrangimentos sofridos" durante as investigações. No mesmo ato,
  recusa incluir agora o conteúdo integral do celular de Vorcaro nos autos. Em paralelo, uma equipe delegada
  trouxe o desdobramento do caso do perito João Cláudio Nabas (lote 268): sua defesa contesta a autenticidade
  do "Moraes.pdf" por perícia, e o caso passou a tramitar também na Corregedoria-Geral da PF para eventual
  sanção disciplinar, com a PGR confirmando formalmente a caracterização do vazamento já registrada no
  acervo.'
