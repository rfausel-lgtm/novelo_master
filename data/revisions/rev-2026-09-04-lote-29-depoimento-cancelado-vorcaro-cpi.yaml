title: 'Lote 29: o depoimento cancelado de Vorcaro à CPI do Crime Organizado'
summary: 'O desfecho da rejeição do relatório final da CPI (14/04/2026) já estava registrado no corpus;
  este lote acrescenta o episódio anterior: Vorcaro foi convocado como testemunha para 04/03/2026, teve
  o depoimento cancelado no mesmo dia por sua prisão preventiva, e Mendonça tornou facultativo seu comparecimento
  por tratá-lo como investigado — decisão que a CPI contestou em recurso ao STF sem desfecho localizado.
  Não há registro de que Vorcaro tenha, em algum momento, efetivamente depoido à comissão.'
