title: "Lote 369 — CMN e FGC: Resolução 5.279 (22/01/2026) e Resolução 5.295 (23/04/2026, Ativo de Referência)"
summary: "Registra duas resoluções do Conselho Monetário Nacional sobre o Fundo Garantidor de Créditos, com
  base no texto consolidado da Resolução CMN 4.222/2013 publicado pelo Banco Central (arquivo
  Res_4222_v19_L.pdf, lido integralmente em 23/10/2026, classe D). A Resolução 5.279, de 22/01/2026, alterou o
  estatuto e o regulamento do FGC: o consolidado marca como dela, entre outros, as operações subsidiadas sob
  critérios de elegibilidade e processo competitivo, o dever de manter o BC informado das tratativas de
  assistência, a divulgação pública de relatórios por associada, o compromisso de indenidade de
  administradores e as regras de valor limite e provisão no pagamento da garantia. A Resolução 5.295, de
  23/04/2026, incluiu o Ativo de Referência entre os gatilhos da obrigação de alocar recursos em títulos
  públicos federais, com fatores de 0,05 (1º/07/2026) a 1 (1º/07/2028), e o consolidado marca a vigência dos
  dispositivos a partir de 1º/06/2026. Poder360 e CNN Brasil (22/01) e Reuters/Money Times, Capital Aberto e
  Folhapress (24/04) cobrem as decisões; o que dizem sobre conteúdo, prazo de três dias para início dos
  pagamentos, apoio à transferência de controle e justificativa do BC (risco moral) é registrado em classe A,
  atribuído. O lote NÃO afirma que as resoluções tenham sido motivadas pelo caso Master (CNN Brasil e
  Folhapress fazem esse enquadramento, atribuído); NÃO afirma a data de início de vigência da 5.279 (o
  consolidado não a traz); NÃO usa os textos originais das resoluções nem os votos ao CMN, a nota do BC ou o
  Diário Oficial, que não foram abertos; e NÃO registra a liquidação do Banco Master Múltiplo (17/03/2026),
  cujo ato do BC não foi localizado. As medidas de liquidez da mesma reunião do CMN (que a imprensa atribui a
  outra resolução) ficaram de fora. Cria o verbete do CMN, ainda inexistente, e liga-o ao FGC; registra
  também os 2 atos públicos correspondentes às resoluções (coleção public-acts, que não tem contagem em
  added)."
