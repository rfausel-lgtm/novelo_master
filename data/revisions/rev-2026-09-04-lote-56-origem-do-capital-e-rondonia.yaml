title: 'Lote 56: a origem do capital e a frente de Rondônia'
summary: 'Segunda parte da frente aberta a pedido do editor sobre a entrada de Vorcaro no Banco Máxima.
  Parte A: a origem do capital. Vorcaro declarava R$ 2,8 milhões à Receita Federal em 2015, dois anos
  antes de contratar a compra de 56,87% de um banco por R$ 40 milhões — e a diferença foi preenchida por
  uma engrenagem imobiliária que inclui um terreno em Jequitibá (MG), regularizado por R$ 2,5 milhões
  e vendido por R$ 57 milhões a um fundo abastecido por previdências de servidores públicos, cuja administradora
  a CVM viria a multar em 2022. Parte B: a alegação de prisão decretada em Ji-Paraná em outubro de 2019
  foi submetida a nova verificação e NÃO se confirmou — registra-se o resultado negativo, com as ressalvas
  que o reforçam, entre elas a incoerência jurídica de uma ''preventiva de cinco dias'' e a versão contrária
  da Folhapress. Em compensação, documentou-se o que estava por trás: há linha investigativa federal em
  Ji-Paraná alcançando Vorcaro desde janeiro de 2019, nove meses antes do aval do Banco Central.'
