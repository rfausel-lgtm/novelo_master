title: 'Lote 278 — a Pet 15.645, que ninguém levantou o sigilo, tem "elementos essenciais" para o julgamento
  de terça'
summary: 'Ofício GMAM nº 11/2026 (13/09/2026, Pet 16.704), lido diretamente do PDF (texto nativo). Alexandre
  de Moraes informa a Fachin que a Pet 15.645 — distribuída por prevenção a André Mendonça — não teve o
  sigilo levantado, apesar da ordem de 11/09/2026 que mandava levantar o sigilo de todos os procedimentos
  ligados à Pet 15.556/Operação Compliance Zero. Segundo Moraes, essa petição específica "possui elementos
  essenciais para o julgamento da PET 16662", marcado para 15/09/2026 — o julgamento que decidirá se ele
  próprio será investigado. Pede que Fachin determine o levantamento do sigilo e a disponibilização dos
  autos a todo o colegiado antes da sessão. Não há, até esta coleta, notícia pública sobre o que a Pet 15.645
  contém nem resposta publicada de Fachin ao pedido.'
