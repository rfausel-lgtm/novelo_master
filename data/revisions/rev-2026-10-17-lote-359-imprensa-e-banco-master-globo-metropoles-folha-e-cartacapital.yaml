title: "Lote 359 — Imprensa e Banco Master: Globo, Metrópoles, Folha e CartaCapital"
summary: 'Registra, com a versão de cada citado em igual destaque, quatro episódios publicados em 15 e
  16/10/2026 sobre mensagens que veículos dizem ter sido extraídas pela PF do celular de Daniel Vorcaro. (1)
  Grupo Globo: a nota da empresa de 15/10/2026, lida no g1, é a fonte do desligamento de Frederic Kachar (29
  anos no grupo) e da frase sobre "relação inadequada do executivo com um anunciante" (classe C: nota pública
  da própria empresa, não documento oficial, corroborada por UOL e Gazeta do Povo); o conteúdo das conversas é alegação atribuída ao UOL e à Gazeta do Povo (patrocínios
  do Master ao Baile da Vogue de 2024, R$ 825 mil, e ao camarote do Carnaval de 2023, R$ 1,6 milhão, segundo
  tabela citada pelo UOL; reclamações de Vorcaro sobre a cobertura, às quais Kachar respondeu defendendo os
  repórteres); Kachar não respondeu à Gazeta do Povo. (2) Metrópoles: o UOL afirma que ao menos 14 textos
  foram enviados previamente a Vorcaro e 11 alterados, no período de contrato de publicidade de R$ 20 milhões;
  Lilian Tahan responde que checar com a fonte é prática habitual e que o contrato não tinha relação com a
  cobertura. (3) Folha: disputa entre veículos, com as duas versões: o Metrópoles afirma que um perfil de
  Vorcaro de 30/08/2024 foi segurado e amenizado depois de promessa de R$ 1 milhão a Guilherme Barros; a Folha
  e Sérgio Dávila negam, a Folha chama a reportagem de retaliação à do UOL e informa ter recebido R$ 516.441,60
  em anúncios veiculados de 2021 a 2025; Barros diz que a matéria saiu com independência editorial. (4) CartaCapital: o UOL relata patrocínio e adiantamentos do Master desde 2020;
  Manuela Carta diz que houve contrato regular de publicidade (2021 a 2023). O lote NÃO afirma: que alguma
  cobertura tenha sido alterada em troca de dinheiro; que patrocínio ou publicidade contratados
  sejam irregulares; qual versão da disputa entre Metrópoles e Folha está correta; que as mensagens provem o
  que dizem (não há documento oficial publicado); nada sobre a colunista Malu Gaspar além de ter sido alvo de
  reclamação de Vorcaro. Ficam de fora: temas pessoais, terceiros sem papel no caso e familiares, nomes de políticos citados nas
  mensagens (quarentena eleitoral até 25/10/2026) e os trechos da reportagem do UOL sobre os demais sites e
  revistas citados, que não são registrados neste lote.'
