title: Lote 106 — o parecer do Cade, a mansão do cunhado de Vorcaro, e novos RPPS expostos ao Master
summary: 'Localizado e lido o parecer primário do Cade (SEI/CADE nº 1748173) sobre a revenda da Kovr ao
  PicPay: trecho literal confirma a ''triangulação financeira'' identificada pelo órgão — crédito concedido
  pelo próprio comprador final aos vendedores intermediários no valor exato do preço, no mesmo dia da
  dupla operação de compra e revenda. Registrada divergência não resolvida sobre a data/motivo do arquivamento
  do procedimento apartado. Documentada a rota de R$ 650 milhões que, via cadeia de fundos da Reag (Astralo
  95), chegou à Super Empreendimentos, do cunhado de Vorcaro, Fabiano Zettel, usados para comprar uma
  mansão de R$ 36,1 milhões em Brasília. Identificados seis novos RPPS expostos ao Master (Iprev Maceió,
  São Roque Prev, e quatro formalizados pelo MPC-SP), com recorrência da consultoria Crédito e Mercado
  e do executivo Renan Foglia Calamia em pelo menos dois casos distintos.'
