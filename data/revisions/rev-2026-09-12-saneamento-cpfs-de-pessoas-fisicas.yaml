corrections:
- 'Proteção de dado pessoal: o CPF de Maurício Quadrado deixa de constar na evidência e na fonte que
  citam o documento do BRB de abril/2025 e no perfil dele. A citação literal mantém a redação do
  documento, com o número substituído por [CPF]; o perfil diz que o documento o identifica nominalmente,
  com CPF.'
- 'Proteção de dado pessoal: o CPF de Artur Martins de Figueiredo deixa de constar no documento da
  B3/Fundos.NET, na evidência e na fonte correspondentes, no perfil e na relação com a Trustee Holding
  Financeira. A âncora de identidade continua descrita — o CPF parcial é idêntico em três fontes
  distintas e descarta o homônimo —, sem os dígitos.'
- 'Proteção de dado pessoal: os CPFs de Antônio Augusto Conte e de Leonardo Antônio Lima Dias deixam de
  constar nos respectivos perfis; o texto registra apenas que ambos são identificados nos autos por CPF.'
