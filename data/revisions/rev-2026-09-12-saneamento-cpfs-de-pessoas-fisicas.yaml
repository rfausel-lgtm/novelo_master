title: 'Saneamento: o acervo deixa de reproduzir o CPF de quatro pessoas físicas'
summary: 'A política editorial veda a reprodução de CPF de pessoa física, mas dez registros do acervo
  traziam os números completos de quatro pessoas — Maurício Quadrado, Artur Martins de Figueiredo,
  Antônio Augusto Conte e Leonardo Antônio Lima Dias —, copiados de documentos oficiais e de uma
  reportagem. Os dígitos saem; o que eles provavam fica. Onde o CPF servia para ancorar identidade e
  descartar homônimos, o texto passa a dizer que o CPF consta no documento e que é o mesmo nas fontes
  cruzadas, sem imprimi-lo. Nos trechos citados literalmente, o número é substituído por [CPF]. Nenhuma
  classificação, fonte ou conclusão mudou.'
