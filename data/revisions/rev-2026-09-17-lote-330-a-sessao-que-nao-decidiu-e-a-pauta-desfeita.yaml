title: Lote 330 — a sessão que não decidiu e a pauta de 23/09 desfeita
summary: 'A leitura direta da certidão de julgamento corrige o que a cobertura consolidou. Em 15/09 o Plenário não
  decidiu nada e não votou o mérito: discutiu uma questão de ordem suscitada por Gilmar Mendes para reunir a PET
  16.662 e a PET 16.704 por continência, redistribuir os feitos, certificar todos os magistrados citados no caso
  Master sobre os quais recaiam indícios de recebimento de valores indevidos e abrir prazo à PGR e a esses juízes.
  O placar parcial era 3 a 4 — Gilmar, Zanin e Moraes de um lado; Fachin, Mendonça, Fux e Cármen Lúcia de outro
  —, com Nunes Marques impedido, Toffoli suspeito e vista de Flávio Dino. A certidão também confirma que a relatoria
  está com a Presidência desde 12/09. E em 17/09 a Presidência desfez a sessão de 23/09 que estava prevista para
  a PET 16.704, justamente porque a questão de ordem alcança a regularidade da relatoria: a pauta daquele dia traz
  três processos e nenhum do caso Master.'
