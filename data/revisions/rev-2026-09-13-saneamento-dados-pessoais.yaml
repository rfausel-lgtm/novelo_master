title: 'Saneamento: dados pessoais fora da política editorial'
summary: 'Auditoria rotineira de dados pessoais sobre todo o acervo publicado — não é apuração nova. A varredura
  procurou, registro por registro, os dados que a seção 6 da política editorial veda, e encontrou cinco tipos em 31 registros. Todos foram retirados sem alterar nenhum fato: o que importa para o caso continua publicado, e só
  o dado pessoal desnecessário saiu. Nenhum CPF, RG, telefone, placa ou dado bancário foi encontrado.'
