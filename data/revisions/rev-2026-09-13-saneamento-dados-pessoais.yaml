corrections:
- 'Número de unidade de imóvel: o apartamento investigado na 9ª fase da Operação Compliance Zero aparecia com o
  número da unidade em 16 registros. A política admite o imóvel que é objeto do caso, nunca o número do
  apartamento; o empreendimento, a cidade, o valor e a narrativa policial continuam publicados.'
- 'Dado de saúde e dado de menores: um pedido de prisão domiciliar era descrito com o diagnóstico de uma
  investigada e com o nome e a data de nascimento de recém-nascidos. Fica o fundamento do pedido (o nascimento
  dos filhos e complicações de saúde no pós-parto), sem diagnóstico, nomes ou data exata. O título do lote
  correspondente e sua arte de divulgação foram refeitos pelo mesmo motivo. Na mesma linha, a menção à idade
  exata de uma filha e ao estado de saúde de uma mãe, em outro pedido, virou referência genérica.'
- 'E-mails individuais transcritos de despachos judiciais e de contrato: fica o domínio, que é o dado pertinente
  (a mudança de empresa ou o vínculo com o portal), e sai o endereço da pessoa.'
- 'Endereço residencial: o logradouro do apartamento que serviu de sede a uma empresa na constituição foi
  substituído pela cidade; o fato de a sede ser residencial continua registrado.'
- 'Data de nascimento sem pertinência ao caso, em ficha oficial de parlamentar, foi retirada.'
