title: 'Lote 78 — Congonhas: o critério que o próprio comitê fixou e que a compra violou'
summary: Quarto caso documentado. A ata de 07/05/2024 autoriza compra genérica de letras financeiras sem
  nomear emissor, exigindo apenas que a instituição seja no mínimo S3 e esteja presente na lista exaustiva
  da Secretaria de Previdência. Vinte dias depois compra-se R$ 14 milhões do Banco Master, que não constava
  da lista e só passaria a constar em abril de 2025. A autorização de aplicação descreve a compra de letra
  financeira de banco privado como 'aplicação em títulos públicos'. A única relação de credenciadas publicada
  pela autarquia, de 2023, não inclui o banco, e nenhuma ata registra a aprovação de seu credenciamento.
  O saldo chegou a R$ 16,5 milhões em outubro de 2025 e foi baixado a um centavo no mês da liquidação.
  Atas e autorizações obtidas do repositório oficial e submetidas a reconhecimento óptico pela equipe.
