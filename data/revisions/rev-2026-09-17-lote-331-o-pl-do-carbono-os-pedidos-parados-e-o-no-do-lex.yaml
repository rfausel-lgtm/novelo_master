title: Lote 331 — o PL do carbono, os pedidos parados e o nó do Instituto Lex
summary: 'A peça 005 da PET 16.230 é a análise que a PF fez a pedido da própria PGR sobre as proposições de Jaques
  Wagner, e o resultado dela é sobretudo negativo: na maior parte do que foi examinado, nada aparece nos celulares.
  O capítulo que avança é o do PL 412/2022, do mercado de carbono, e mesmo ali a cronologia que a própria PF transcreve
  mostra Wagner como relator por 23 dias, em 2022, enquanto as mensagens são de 2023, sob outra relatoria; as emendas
  que circularam no celular de Vorcaro já estavam protocoladas havia um mês, por senador diverso, e nenhuma mensagem
  tem Wagner como interlocutor. O tema não entrou na representação policial. No estado do processo, dezesseis pedidos
  seguem sem decisão contra três decisões monocráticas, e a PGR opinou pelo levantamento em todos os pedidos de
  mérito em que foi ouvida — só o de Wagner virou decisão. O lote fecha abrindo o nó do Instituto Lex: o ministro
  Alexandre de Moraes não é sócio, o quadro é da mulher e dos três filhos, e o que o liga diretamente ao instituto
  é a designação do Tesouro americano de 2025, retirada em dezembro do mesmo ano.'
