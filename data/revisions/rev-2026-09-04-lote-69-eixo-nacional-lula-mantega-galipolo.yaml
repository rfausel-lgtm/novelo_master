title: 'Lote 69: o eixo nacional — e o que os documentos primários não dizem sobre Lula'
summary: 'Terceira parte da frente aberta pelo editor. A equipe leu integralmente dois documentos primários
  — o relatório da PF sobre o celular de Vorcaro, de 218 páginas, e o relatório final da CPI do Crime
  Organizado, de 221 — e o resultado sobre o presidente da República é negativo e firme: ele não aparece
  no relatório policial, não está entre os quatro indiciamentos propostos pela CPI, não consta das minutas
  de delação e não é interlocutor de nenhuma mensagem apreendida. O que existe é a audiência de 04/12/2024,
  que ele próprio confirmou — e receber alguém em audiência não é ilícito. Registram-se, porém, duas versões
  não conciliadas sobre o teor daquela reunião. Documenta-se a Pollaris, de Guido Mantega, que recebeu
  R$ 14 milhões do banco, sempre acompanhada da ressalva do próprio relatório da CPI de que os pagamentos
  isolados não configuram ilícito a priori. E corrigem-se três pontos do corpus: a resposta por LAI negava
  atas, mas os registros de portaria do GSI existem e foram liberados; Mantega tem manifestações públicas,
  antes dadas por inexistentes; e — o mais sensível — Galípolo não negou ter tratado do Master com ministros
  do STF, mas recusou-se a responder invocando sigilo, com o relator consignando em ata que ele ''não
  afirmou que não tratou''. Fecha com a cronologia que enquadra tudo: o Banco Central já tinha o banco
  sob termo de compromisso um mês antes da reunião no Planalto.'
