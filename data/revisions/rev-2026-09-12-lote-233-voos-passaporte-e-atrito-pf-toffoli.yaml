title: 'Lote 233 — a prisão de Zettel e a abordagem de Tanure: voos, passaporte, e o atrito entre a PF e
  Toffoli'
summary: 'A leitura integral das peças 35 e 40 da PET 15.198 acrescenta lastro documental primário ao que
  o acervo já sabia sobre a operação de 13-14/01/2026: os voos exatos que motivaram a urgência (Zettel —
  Emirates EK0262, Guarulhos–Dubai; Tanure — Latam LA3540, Galeão–Curitiba), a apreensão de passaporte e
  proibição de sair do país como medida específica de Zettel, e o horário exato de sua soltura (07h00 de
  14/01 — uma prisão de poucas horas). A mesma data revela um episódio de atrito institucional até aqui
  não registrado: a Direção-Geral da PF respondeu por escrito a Toffoli sobre o descumprimento de um prazo
  de 24 horas, atribuindo o atraso a sobrecarga operacional e pedindo para não entregar os celulares
  apreendidos ao gabinete do relator — um precedente distinto do atrito, já registrado, entre a PF e o
  ministro André Mendonça a partir de fevereiro de 2026.'
