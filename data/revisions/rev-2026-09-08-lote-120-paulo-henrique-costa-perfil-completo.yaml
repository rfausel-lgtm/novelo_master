title: 'Lote 120 — o outro indiciado: quem é Paulo Henrique Costa e o que a decisão de sua prisão revela'
summary: 'Preenchida a lacuna mais visível entre os três indiciados de agosto/2026: perfil completo de
  Paulo Henrique Costa (ex-presidente do BRB), com leitura direta da decisão de prisão preventiva (Pet
  15.771) trazendo mensagens literais com Vorcaro sobre R$ 146,58 milhões em imóveis como contrapartida
  pela compra, pelo BRB, de R$ 12,2 bilhões em carteiras falsas do Master. Mapeada a linha do tempo de
  custódia (com lacuna documentada entre julho-setembro/2026) e corrigida a alegação de ''nenhuma manifestação
  de defesa'' — há três advogados sucessivos com citações literais. Registrado o custo institucional para
  o BRB e a desistência de Ibaneis Rocha da candidatura ao Senado. Registrado, com cautela, o sinal de
  Vorcaro de poupar Moraes em nova delação, e esclarecido que o pedido de arquivamento da PGR de 02/09
  trata de queixa do próprio Vorcaro sobre ameaças na prisão — não de denúncia contra ele.'
