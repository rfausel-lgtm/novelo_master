title: Lote 100 — os nomes que David Ágape aponta como possível origem do dossiê anônimo contra Mendonça
summary: 'Por decisão editorial explícita do editor, incluídos no grafo três nomes de baixa notoriedade
  que a newsletter ''A Investigação'' (David Ágape) associa à possível origem do dossiê anônimo usado
  na decisão de Moraes contra Mendonça (03/09/2026): Jefferson Pessoa da Silva (indício de metadados de
  PDF, com o próprio artigo-fonte tratando isso como indício, não prova — verificado pela equipe por leitura
  direta do HTML bruto) e Dennis Cali / Wedson Cajé Lopes (sigla institucional em rodapé de documentos
  anônimos, alegação de uma segunda matéria NÃO verificada pela equipe contra documento primário). Todos
  os três entram como alegação de fonte única, classe A, com o peso da fonte sinalizado pela classificação
  — não como fato estabelecido. A lógica editorial: o grafo acumula rastro de alegações fracas para que
  ganhem ou percam relevância com novos lotes de informação, em vez de pré-filtrar o que entra.'
