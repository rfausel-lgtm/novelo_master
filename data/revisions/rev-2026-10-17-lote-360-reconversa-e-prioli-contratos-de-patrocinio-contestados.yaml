reason: 'Itens 9 e 10 da liberação "Vorcaro e a imprensa" (investigador e chefe, 17/10/2026), aplicada a regra
  de imprensa de 17/10/2026 (docs/PIPELINE_DE_LOTES.md, seção 6). A nota de Azevedo na TMC e o original do
  Estadão foram abertos pelo redator; a resposta de Prioli foi relida no navegador; as demais fontes vêm do
  cache do investigador e foram relidas integralmente. Ficam de fora, por decisão editorial: o texto dos
  prints, os ataques pessoais da nota, as referências a candidatos (quarentena eleitoral até 25/10/2026),
  dados empresariais e trechos pessoais relativos à citada, um grupo de influenciadores sem nomes e Paulo Figueiredo como verbete. Na edição, saiu a fonte Roma News, cujo título traz alegação sobre terceiro que este lote não registra.'
