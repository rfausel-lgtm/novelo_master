title: 'Lote 105 — a íntegra da decisão de Mendonça: o verdadeiro fundamento do afastamento de Andrei'
summary: 'Lidos integralmente, pela equipe, os seis documentos primários da Pet 16.662 obtidos pelo editor
  via certificado digital: a petição do Partido Novo de 03/09 pedindo prisão preventiva de Andrei Rodrigues,
  e a decisão de Mendonça de 08/09 (33 páginas). Achado central, que corrige a leitura anterior do corpus:
  o afastamento NÃO se baseia nas alegações de corrupção do Partido Novo — Mendonça as reserva expressamente
  para depois —, mas na produção, pela PF, de um relatório de inteligência apócrifo (autodescrito como
  ''sem valor probatório'', ''confiança agregada baixa'') monitorando o próprio Mendonça e o AGU Jorge
  Messias por mais de 30 dias, relatório que chegou a Moraes e embasou a acusação dele contra Mendonça.
  Confirmada, por documento oficial, a sigla UADIP/CINQ/CGRC/DICOR/PF que David Ágape já havia reportado
  (lote 100) — reforçando a credibilidade daquela apuração. Registrada, com três camadas de atribuição,
  a fala da jornalista Monica Waldvogel (citada pelo próprio Mendonça) de que os relatórios teriam sido
  ''solicitados'' por Moraes — alegação não confirmada de outra forma. Localizada e cuidadosamente contextualizada
  uma menção nominal a Roberta Moreira Luchsinger dentro do relatório apócrifo — mas no caso Sem Desconto/INSS,
  sem qualquer relação com o Master, preservando a conclusão já publicada de que a família presidencial
  está ausente das peças do caso Master.'
