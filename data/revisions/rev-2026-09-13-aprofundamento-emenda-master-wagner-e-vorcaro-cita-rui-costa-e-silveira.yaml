title: 'Aprofundamento — a cronologia da "Emenda Master" no gabinete de Wagner, e Vorcaro nomeia Rui Costa e Alexandre Silveira'
summary: 'Mendonça levantou, em 11/09/2026, um novo sigilo sobre o relatório da PF a respeito de Jaques
  Wagner, detalhando a cronologia da Emenda 11 (a "Emenda Master"): o contato confidencial de Guilherme
  Sodré com Vorcaro seis dias antes da apresentação, a ligação de 9min19s entre Augusto Lima e Wagner no
  dia da apresentação e a visita ao gabinete duas semanas depois, e a mensagem de Lima de 29/03/2025 ("você
  faz parte disso"). A PF eleva a caracterização, antes descrita como "correlação", para um "padrão de
  acompanhamento direto" de pauta legislativa e uma relação "unidirecional". Também surge que a defesa de
  Wagner peticionou a Mendonça em 30/06/2026 contestando "onze hipóteses de ilegalidade". Separadamente,
  reportagem de agosto de 2025 revela que Vorcaro, questionado por jornalista sobre autoridades do governo
  Lula favoráveis à venda do Master ao BRB, nomeou "Rui, Jaques, Alexandre Silveira" — o que insere Rui
  Costa e o ministro Alexandre Silveira (novo no acervo) no quadro, sem que nenhum dos dois seja investigado
  por esse fato.'
