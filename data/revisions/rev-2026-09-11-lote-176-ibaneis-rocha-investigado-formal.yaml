title: 'Lote 176 — Ibaneis Rocha é confirmado formalmente investigado, e o eixo do escritório de advocacia ganha lastro documental'
summary: 'Sétimo documento explorado do acervo de 416 peças da PET 15.556: o e-Doc 223, decisão monocrática
  de 02/04/2026 que dispensa o governador do Distrito Federal, Ibaneis Rocha, de depor na CPI do Crime
  Organizado, por já figurar como investigado. A decisão reproduz a justificativa da própria CPI: ele está
  ''no centro de dois eixos de investigação'' — as relações comerciais do escritório de advocacia que leva
  seu nome com entidades investigadas nas operações Compliance Zero e Carbono Oculto, e seu papel
  institucional nas decisões do BRB sobre a compra do Banco Master. Isso corrobora, em documento primário,
  uma alegação que o verbete dele já registrava como classe I e não verificada (venda de R$ 38 milhões em
  honorários de precatório ao fundo Reag Legal Claims) — corroboração parcial: a decisão confirma o eixo
  geral (relações comerciais do escritório com entidades do caso), mas não cita nominalmente a Reag Legal
  Claims nem o valor específico. Aplica a mesma jurisprudência de dispensa por autoincriminação já usada
  para Paulo Sérgio, Belline Santana e os irmãos de Dias Toffoli (lote 174).'
