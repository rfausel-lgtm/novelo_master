title: 'Lote 64: o acordo de 2020 — quando a CVM já tinha Vorcaro como acusado'
summary: 'Frente aberta a partir de um fio que o próprio corpus havia deixado passar. Cinco anos antes
  do colapso, Daniel Vorcaro figurou pessoalmente como acusado num processo da CVM e fechou termo de compromisso
  por R$ 250 mil, dentro de um acordo total de R$ 2,325 milhões — 4,7% dos R$ 49 milhões captados nas
  emissões de debêntures da Centara e da Simsan. O acordo foi aceito em 01/12/2020 depois de o Comitê
  competente tê-lo rejeitado em agosto e ratificado a rejeição em setembro, sob relatoria do diretor Henrique
  Machado, que pedira vista em novembro. O voto dele, lido na íntegra pela equipe, mostra que a área técnica
  da CVM já descrevia, em 2020, estruturação das emissões para transferir recursos de uma massa falida
  a familiares dos controladores — e que os proponentes já eram investigados por condutas semelhantes
  em processo aberto três semanas antes, justamente o que hoje está pautado para julgamento por fraude.
  Cerca de seis meses depois, ao fim do mandato, Machado passou a integrar escritório que atende o Master;
  a PF registrou a sequência como suspeita, sem pedir diligências, e ele nega. Registra-se com o mesmo
  destaque o que pesa a favor dele: o acordo aceito foi 48% maior que o rejeitado, houve restituição documentada
  de mais de R$ 51 milhões antes da apreciação, e a decisão foi unânime. E registram-se as duas afirmações
  de sua nota de defesa que o registro primário contradiz. Cria-se também o registro da própria CVM como
  organização, até então ausente do corpus.'
