title: Lote 82 — o Metrópoles, e uma declaração de conflito da própria plataforma
summary: 'O Banco Master pagou R$ 27,28 milhões ao Metrópoles entre o segundo semestre de 2024 e outubro
  de 2025, movimentação que o Coaf classificou como atípica. A contrapartida existe e é lícita — naming
  rights da Série D de 2025, com contrato confirmado pela CBF —, embora haja descasamento de cerca de
  seis meses entre o início dos pagamentos e a veiculação da marca. O veículo não é caso isolado: o banco
  pagou também outros comunicadores e sites. Teste objetivo da cobertura: depois da liquidação ela foi
  ampla e pioneira, e foi o Metrópoles que revelou o contrato de R$ 129 milhões do escritório Barci de
  Moraes — evidência contrária à hipótese de captura, registrada com o mesmo peso. Mas há dois artefatos
  datados de omissão do próprio nome. Como o veículo é uma das fontes mais usadas deste corpus, aplicou-se
  nota de contexto padronizada a todos os seus registros de fonte, por dever de transparência.'
