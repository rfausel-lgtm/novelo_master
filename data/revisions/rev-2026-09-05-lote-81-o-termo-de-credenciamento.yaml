title: 'Lote 81 — o documento: o parecer que aprovou o banco foi escrito pelo banco'
summary: 'Localizado e lido o espécime que faltava: o Termo de Credenciamento nº 033/2024 do Banco Master
  na Alagoas Previdência, publicado aberto e datado de 05/04/2024, com as frases exatas que a auditoria
  do Ministério da Previdência descreveu como idênticas em outros quatro entes. O campo destinado a registrar
  a análise do regime próprio contém texto promocional; o de qualificação do corpo técnico, uma única
  frase sem nomes nem indicadores. E o Tribunal de Contas do Estado do Rio de Janeiro, em voto de 56 páginas
  sobre Itaguaí, afirma que o termo foi ''integralmente preenchido pelo próprio Banco Master'', que a
  documentação comprobatória era formada ''unicamente por certidões e relatórios gerados e enviados pelo
  próprio Banco Master'' e que a análise durou ''menos de 2 dias úteis''. Registrado ainda o vetor humano
  entre o Rioprevidência e o Itaprevi.'
