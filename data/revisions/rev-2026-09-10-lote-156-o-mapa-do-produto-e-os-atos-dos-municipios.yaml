title: Lote 156 — o mapa que o produto publicava, e os atos que os municípios publicaram
summary: 'Fecha a tensão que a varredura anterior deixara declarada em aberto entre o mapa de cobertura do site
  do produto e os convênios efetivamente localizados — e a fecha por excesso, não por falta. A busca nominal no
  acervo nacional de diários municipais, em janelas semestrais de 2018 a 2026, recuperou 182 edições, das quais
  noventa foram descartadas por trazerem apenas placas de veículo em editais de trânsito, e apontou atos em municípios
  que a investigação não documentara, incluindo quatro capitais. Belém credenciou a operadora em 25/04/2022 e renovou
  em 18/04/2024, o que fecha a lacuna do Pará. Goiânia produziu o ciclo completo, com uma inversão no meio: declarada
  INAPTA em 05/07/2021, a empresa foi declarada APTA em 20/07/2022 e contratada por inexigibilidade em 20/09/2022,
  sem que os atos digam o que mudou. E é em Goiânia que o dinheiro aparece com nome e série: os balanços financeiros
  anuais trazem a consignatária em linha própria, de R$ 237.485,24 retidos no exercício de 2022 para R$ 7,43 milhões
  em 2023, R$ 10,58 milhões em 2024 e R$ 13,36 milhões em 2025 — este último publicado em 13/04/2026, quase cinco
  meses depois da liquidação do banco e sem uma linha sobre ela, ao lado de outros R$ 6,44 milhões em linha do próprio
  Banco Master. Em Campinas o achado é de redação: o chamamento da empresa municipal de tecnologia dividiu os interessados
  entre instituições ''autorizadas pelo Banco Central do Brasil'' e gestoras de cartão ''isentas de autorização
  do Banco Central do Brasil'', e credenciou no mesmo dia a operadora e o banco — é a formulação administrativa
  que converte a ausência de autorização em categoria de habilitação. Uberaba repete em Minas o padrão paulista
  de alcançar a administração indireta, com convênios próprios da companhia de saneamento e do instituto de previdência.
  Somam-se instrumentos em Cuiabá, Florianópolis, Serra, Duque de Caxias, Petrolina e Jaboatão dos Guararapes, nenhum
  deles com rescisão localizada. E o instrumento municipal mais antigo de toda a investigação recua para 02/05/2019,
  em Feira de Santana, nove meses depois do credenciamento estadual baiano. Restam três estados do mapa sem ato
  localizado — Amazonas, Rondônia e Tocantins —, com a ressalva de que o acervo consultado é incompleto e de que,
  no Amazonas, a ausência de convênio convive com litígio judicial volumoso.'
