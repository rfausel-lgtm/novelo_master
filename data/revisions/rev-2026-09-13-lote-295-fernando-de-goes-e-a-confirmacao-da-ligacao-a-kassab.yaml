title: 'Lote 295 — Fernando de Goes, o segundo canal para Kassab, e a confirmação interna da ligação a
  Pedro Paulo'
summary: 'Releitura mais detalhada (páginas 80-84 do mesmo documento comprobatório da PF, Pet 15.497)
  revela que, no episódio já publicado da tentativa de Vorcaro de pressionar Gilberto Kassab (01/10/2024),
  havia um SEGUNDO canal paralelo além de Augusto Lima: Fernando de Goes ("Pedi o nando pra ajudar e tentar
  falar com o kassab"). Goes confirmou internamente à equipe de Vorcaro que Kassab de fato telefonara ao
  deputado Pedro Paulo Carvalho (presidente do PSD-RJ) — confirmação contemporânea por fonte interna, mais
  forte que a versão dada por Kassab à imprensa depois. Também corrige um detalhe do lote 287: o próprio
  relatório da PF registra que a notícia do site "expresso222.com.br", que Vorcaro alegou ter "tirado do ar",
  NÃO foi encontrada pela perícia — é alegação do próprio Vorcaro, não fato confirmado de forma independente.
  Pedro Paulo Carvalho, com posição pública já registrada pela imprensa (mas ausente do acervo), ganha
  verbete próprio.'
