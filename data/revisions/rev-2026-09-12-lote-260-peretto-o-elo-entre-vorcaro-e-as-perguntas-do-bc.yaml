title: 'Lote 260 — Peretto, o elo entre Vorcaro e as perguntas do Banco Central à Cartos'
summary: 'Fechando a leitura dos celulares analisados pela PF no INQ 5.026: Henrique Peretto, dono da Cartos e acionista
  da Tirreno, levava a Vorcaro as requisições que o Banco Central mandava à Cartos no mesmo dia em que eram assinadas, e
  lhe submetia cada versão das respostas. Numa delas, uma análise "exaustiva e complexa" não achara operação nenhuma; no
  dia seguinte, a resposta passou a falar em operações interrompidas e num distrato de 30/07/2025. Ele também mandou a
  Vorcaro o acordo entre as duas empresas em arquivo editável, sem assinaturas, datado de janeiro. E no celular dele a PF
  achou um fundo de R$ 31,44 milhões que ele dizia reservado ao capital da Tirreno. Alegação da PF, sem denúncia.'
