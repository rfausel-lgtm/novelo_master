title: 'Lote 68: a rede baiana — e a correção sobre a Emenda 30'
summary: 'Segunda parte da frente aberta pelo editor sobre o PT baiano. A correção principal favorece
  o investigado e desmonta uma leitura que circulava em veículos de posições opostas: a Emenda nº 30 à
  MP 1.106/2022 é de Jaques Wagner, mas propunha um TETO de juros de 300% do CDI — dispositivo restritivo,
  não expansivo — e não foi incorporada ao texto final. O que a PF lhe imputa, em suas próprias palavras,
  é correlação temporal e de comportamento, em linguagem expressamente preliminar: ''interlocutor relevante'',
  ''elemento de correlação'', relação que ''em juízo preliminar'' seria ''funcionalmente direcionada e
  não meramente social''. Registra que não houve depoimento, indiciamento, denúncia nem arquivamento até
  setembro de 2026, e que a PGR se opôs à própria PF quanto às medidas da operação. Acrescenta o registro
  de Jerônimo Rodrigues e da ASSEBA, por onde teriam transitado R$ 140,1 milhões entre o Estado e o Banco
  Master segundo relatório do Coaf — com a negativa do governo baiano de que se trate de dinheiro do erário.
  Deixa aberta, explicitamente, a divergência entre BN Financeira, BK Financeira e BN Representações,
  que pode ser erro de transcrição em cadeia na imprensa.'
