corrections:
- 'tribunal-de-contas-do-distrito-federal, doc-2025-11-19-tcdf-denuncia-mpc-df-brb-master, src-tcdf-2025-11-19-denuncia-mpc-df-brb-master e rel-tribunal-de-contas-do-distrito-federal-banco-de-brasilia-brb-institutional-denuncia: o processo 00600-00003617/2025-75 não foi "aberto em 19/11/2025"; o e-TCDF registra autuação em 01/04/2025 (interessado "TCDF", decisões reservadas desde 10/04/2025) e o comunicado de 19/11/2025 trata de nova denúncia do MPC-DF dentro do processo preexistente. O lote 342 repete o erro no seu summary; a revisão antiga não é reescrita e a correção fica registrada aqui.'
- 'tribunal-de-contas-do-distrito-federal: relatora identificada como a Conselheira Anilcéia Luzia Machado, segundo o e-TCDF; a pendência "relator não identificado" foi retirada.'
- 'ibaneis-rocha: a manifestação da defesa de 16/04/2026 (CNN Brasil) não constava do verbete e foi acrescentada.'
- 'banco-de-brasilia-brb: a pendência de 19/09/2026 sobre as frentes do TCDF datava o processo 00600-00003617/2025-75 pelo comunicado de 19/11/2025; passa a registrar a autuação em 01/04/2025 (e-TCDF), a nova denúncia de 19/11/2025 e a cautelar de 23/09/2026.'
- 'thiago-miranda: o resumo trazia dígitos do CPF dele, dado que a seção 6 da política editorial veda; o dado saiu (fica registrado apenas que a identidade foi confirmada em registro da Receita Federal) e não é reproduzido aqui. O campo why_in_novelo, que usava "esquema" em texto próprio e adjetivo de juízo, foi reescrito com atribuição à decisão da PET 16.346, sem acrescentar fato.'
- 'roberio-bonfim-mangueira: o campo why_in_novelo dizia que a documentação era "hoje tida por fraudulenta", sem atribuição; passa a dizer "hoje questionada", como no verbete de Dario Oswaldo Garcia Júnior.'
