kind: revision
date: '2026-10-16'
title: 'Lote 348 — O TCDF decreta a indisponibilidade cautelar de bens de cinco ex-dirigentes do BRB (e o acervo corrige a data do processo); a PF descreve ao STF a atuação de Ibaneis Rocha no banco; e as mensagens de Vorcaro sobre Celina Leão'
summary: >-
  Primeiro lote da varredura de 19/09 a 15/10/2026. O ponto de maior lastro é a Decisão RES nº 361/2026 do
  Tribunal de Contas do Distrito Federal (23/09/2026): em sessão reservada, em caráter cautelar, o tribunal
  determinou a indisponibilidade de bens, por um ano, de ex-integrantes da alta administração do BRB, com 30
  dias para manifestação, instrução prioritária do processo 00600-00003617/2025-75-e para avaliar a extensão a
  outros agentes, conversão em Tomada de Contas Especial, 24 horas para o banco enviar o relatório da
  auditoria independente, 30 dias para o atual diretor-presidente justificar o descumprimento de determinação
  anterior e 15 dias para o banco esclarecer a representação do MPC/DF. Isso é classe D, mas só quanto ao
  conteúdo da nota institucional do TCDF e da ficha pública do e-TCDF (consultada em 15/10/2026); o inteiro
  teor é sigiloso e não foi lido, e a publicação no DODF de 05/10/2026 (págs. 53-54) não foi aberta. Os nomes
  dos cinco atingidos (Paulo Henrique Costa, Dario Oswaldo Garcia Júnior, Robério Cesar Bonfim Mangueira, Wily
  da Silva Leão e Marcelo Talarico) são alegação atribuída ao Metrópoles, ao SBT News e ao Congresso em Foco,
  que não citam fonte e repetem a mesma lista; o valor exato de R$ 2.761.749.206,55 e a unanimidade são da
  Agência Brasil, único veículo a informá-los (os demais falam em "até R$ 2,7 bilhões"); a nota do tribunal não
  nomeia ninguém nem informa valor. A medida é cautelar, não é julgamento de mérito, e nenhuma defesa dos
  atingidos foi localizada; o BRB, em nota, classificou a decisão como positiva. Entram dois verbetes novos
  (Wily da Silva Leão, com o cargo descrito de formas diferentes pela imprensa, e Marcelo Talarico, eleito
  presidente do Conselho de Administração do BRB em 30/01/2023 conforme extrato de ata do banco; a renúncia de
  janeiro de 2026 é conhecida só pelo fato relevante noticiado pelo Money Times). Correção ao acervo: o
  processo do TCDF foi autuado em 01/04/2025 segundo o e-TCDF, e não "aberto em 19/11/2025", data do comunicado
  sobre uma nova denúncia do MPC-DF dentro dele; a relatora é a Conselheira Anilcéia Luzia Machado. Segunda
  frente, tudo em classe A: segundo o Metrópoles (09/10), a CNN Brasil (10/10), o g1 (via Brasil 247) e a
  Jovem Pan (10/10), relatório da Polícia Federal enviado ao STF em 28/09/2026, com sigilo levantado em 09/10, afirma que
  Ibaneis Rocha, como acionista controlador do BRB, "não se limitou ao exercício regular de suas prerrogativas
  institucionais" e que decisões estratégicas eram submetidas previamente à sua apreciação, e descreve reunião
  em Zurique em 23/01/2025 e a autorização do aumento de capital de R$ 750 milhões; o número da PET, o
  ministro e a data do documento não foram localizados, e o Novelo não viu o relatório. A defesa de Ibaneis
  (Antônio Carlos de Almeida Castro) nega ingerência e diz que Costa detinha total autonomia; a defesa de Costa,
  só em O Tempo, diz que ele foi presidente do BRB, "não seu dono". Terceira frente: mensagens de 05/04/2025
  entre Vorcaro e o publicitário Thiago Miranda sobre Celina Leão, publicadas pela Folha de S.Paulo em
  15/09/2026 (reportagem original não aberta; registradas pelo Poder360, que diz tê-las confirmado, e pelo
  Congresso em Foco), sem conversa
  direta com ela; Celina Leão, em três manifestações de 15, 16 e 18/09, e a defesa de Miranda negam que ela
  tenha participado das negociações, e a defesa de Vorcaro não respondeu. Também ficam registradas a petição
  da defesa de Vorcaro de 08/10 e a distinção entre a prisão de 17/11/2025 e a preventiva de 04/03/2026. O que
  NÃO foi confirmado: a ocorrência da oitiva de Vorcaro (prevista para 15/10) e da de Augusto Lima (16/10),
  ambas só noticiadas antes do ato; a identidade de "Léo"; o número da PET do relatório da PF; e o conteúdo do
  voto da relatora e do parecer do MPC, que o Novelo não reproduz por serem sigilosos, descritos por um só
  veículo e sem defesa localizada.
