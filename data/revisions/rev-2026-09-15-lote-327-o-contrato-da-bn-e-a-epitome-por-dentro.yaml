title: Lote 327 — o contrato do Master com a BN Financeira e a Epítome por dentro da PET 16.230
summary: 'A leitura das 343 peças da PET 16.230 traz os documentos que sustentam os dois eixos. No eixo BN Financeira,
  o contrato de 10/03/2022 com o Master — 15% da receita do consignado Credcesta, convênio de Lauro de Freitas,
  assinado pelo diretor comercial Fernando Mascarenhas, ex-diretor da PKL One, e com a Terra Firme de Augusto Lima
  como interveniente — e o termo de quitação de outubro de 2025, emitido pelo escritório de Daniel Monteiro, em
  que a PKL One paga os R$ 3,5 milhões "por mera liberalidade" uma dívida que o próprio termo atribui ao Master.
  No eixo do apartamento, a Epítome, ex-NK 322, capitalizada em julho de 2024, comprou a unidade 1.702 à vista uma
  semana depois de ela ser liberada, cerca de 13% abaixo da tabela; os e-mails da personalização iam para David
  Monteiro, e um depoente disse à PF que o fundo que controlava a Epítome era de Daniel Monteiro. A Sodré Martins
  Serviços Administrativos passa de alegação a vínculo societário: 60% de Guilherme e 10% de Eduardo.'
