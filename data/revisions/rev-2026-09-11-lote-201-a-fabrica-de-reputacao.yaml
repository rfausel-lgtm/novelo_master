title: 'Lote 201 — A fábrica de reputação: derrubar matéria, comprar linha editorial, fabricar comentário'
summary: 'Segundo lote do e-Doc 4 da PET 15.978 (extração forense do celular de Daniel Vorcaro). Duas
  frentes que o acervo ainda não cobria. A primeira é a supressão de conteúdo jornalístico: ordens
  reiteradas para tirar matérias do ar, com Mourão relatando "estão tirando todas do ar", "derrubado",
  "clean permanente" e enviando listas de links removidos; a derrubada, em 2023, de conteúdo sobre conta
  de ministros do STF em restaurante em Nova York; e, sobre o Diário do Centro do Mundo, a frase que dá
  a medida do que Vorcaro julgava ter comprado — "Achei que tinha parceria. E tinhamos comprado os
  caras." —, seguida, semanas depois, da cifra que ele próprio cogitou: "50K mês?". A segunda frente é a
  fabricação de reputação digital: notas de aplicativo infladas, avaliações favoráveis inseridas e
  comentários de leitor produzidos sob encomenda, inclusive para dar a impressão de que a compra do
  Master pelo BRB — o negócio que está no centro do caso — havia sido bem-sucedida. O lote registra o
  lado comprador, que é o que a prova documenta, e deixa expresso que não há no documento demonstração
  de que o veículo citado tenha recebido pagamento ou alterado cobertura por dinheiro.'
