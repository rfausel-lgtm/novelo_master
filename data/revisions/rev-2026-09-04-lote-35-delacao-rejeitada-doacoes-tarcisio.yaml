title: 'Lote 35: a alegação de propina em doações a Tarcísio e Bolsonaro'
summary: 'Pesquisa conduzida por agente convocado em paralelo. Registra a terceira proposta de delação
  de Vorcaro, rejeitada por ''ausência de fatos novos'', em que alegou que doações de 2022 a Tarcísio
  de Freitas e Jair Bolsonaro seriam propina via Gilberto Kassab. Classificado como alegação de baixa
  confiança (0,2): rejeitada pelos próprios investigadores, com negativas expressas de Kassab e da campanha
  de Tarcísio, e sem qualquer corroboração independente localizada.'
