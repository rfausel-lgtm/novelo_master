title: 'Lote 80 — Nelson Tanure: a cadeia de atribuição, e a ponte que não existe'
summary: 'Leitura integral da decisão de 06/01/2026 na PET 15.198. A expressão ''sócio oculto'' está dentro
  da transcrição da manifestação do procurador-geral, que reporta o que a autoridade policial afirmou;
  o relator registra que sua cognição, nessa fase, é necessariamente limitada. Distinguidos os estágios:
  investigado e alvo de busca no caso Master, réu em ação penal distinta sobre a Gafisa, cuja conexão
  com o caso o próprio relator rejeitou. Testada na base primária da CVM a hipótese de que recursos de
  regimes próprios teriam chegado a veículos dele: zero cotistas de regimes próprios no FIDC Maranta,
  no Bordeaux FIP e no Fonte de Saúde FIP. O fluxo documentado é o inverso, do caixa da Ligga para cédulas
  de crédito do Master. Corrigido o financiamento e o preço da aquisição da Copel Telecom, e a data da
  decisão de busca pessoal.'
