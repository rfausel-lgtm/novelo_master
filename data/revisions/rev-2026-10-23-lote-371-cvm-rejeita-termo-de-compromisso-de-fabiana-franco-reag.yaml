reason: Atualização de rotina de ato da CVM apontada no gauntlet de reguladores de 22/10/2026 (item 5), com
  documento primário aberto de novo em 23/10/2026; as fontes foram reabertas e cada fato conferido contra o
  texto da ata e da nota. O valor de R$ 193.623,90 do gauntlet pertence a outro proponente (diretor da Americanas S.A., PAS 19957.000946/2023-08) e foi
  descartado; o valor da proposta de Fabiana Franco é R$ 150.000,00.
