reason: >-
  Saneamento pedido pelo orquestrador e autorizado por Rafael Fausel sobre o estado atual do acervo (EDITORIAL_POLICY
  §3 e §6): registros antigos, anteriores à disciplina dos lotes 348 a 350, ainda traziam fragmentos de CPF, datas de
  nascimento, unidade residencial, nomes e idades de filhos menores, dados de saúde de familiares e vocabulário de
  imputação ou juízo do editor em texto próprio. O lote só reescreve texto; nenhum fato muda, e o histórico do git não
  foi reescrito. Varredura feita em todo data/ (exceto revisions) por padrões de CPF, telefone, e-mail, endereço,
  nascimento, filhos e menores, e por termos vedados em campos de texto próprio, com leitura integral de cada registro
  antes da edição.
