  mgi-desenvolvimento, monteiro-sociedade-de-advogados (saiu "o caso mais grave"), talent-construcoes, terra-firme-da-bahia,
  the-pay-solucoes-de-pagamentos e varajo-consultoria-empresarial; pessoas anderson-wander-da-silva-lima ("propina"
  no resumo, agora "pagamentos", dentro da atribuição à PF), ana-claudia-queiroz-de-paiva, antonio-carlos-freixo-junior,
  arthur-caixeta-nogueira, arthur-lira, benjamim-botelho-de-almeida (o why_in_novelo falava em fraude contábil sem
  registrar a absolvição em primeira instância), cesar-reginato-ligeiro, cezinha-de-madureira (pendência), daniel-lopes-monteiro,
  erlene-nonato-lacerda, felipe-cancado-vorcaro (saiu "o padrão familiar"), garigham-amarante-pinto, gilson-bahia-vasconcelos,
  hamilton-suaki, leonardo-augusto-furtado-palhares ("operador jurídico-documental do esquema"), luiz-renno-netto,
  marcio-coutinho-schumann, mariangela-fialek (saiu a Mesa Diretora "agindo para protegê-la"), nara-brum,
  nayara-maria-dias-albuquerque-de-sa, paulo-henrique-costa, priscila-franca-parigine, tarcisio-de-freitas,
  thaisa-menzato, tiago-oliva-schietti e valdemar-costa-neto; relações rel-daniel-vorcaro-tarcisio-de-freitas-allegation,
  rel-gilson-bahia-vasconcelos-midias-promotora-corporate, rel-grupo-aquilla-banco-master-financial e
  rel-operacao-sem-desconto-mauricio-camisotti-institutional (labels); evidências ev-duas-modalidades-distintas-de-fraude-atribuidas-ao-grupo-master,
  ev-efb-acao-civil-eua-familia-vorcaro, ev-mecanismo-cdb-fundos-cativos-emprestimos-ficticios-inflacao-ativos e
  ev-palhares-assinou-varajo-e-sucedeu-zettel-diretoria-super e a nota de ev-valadao-e-a-familia-vorcaro-decadas-de-proximidade.
  Ids que contêm essas palavras foram mantidos para não
  romper referências.'
- 'Achado e não tocado: o sobrenome "Giunchetti" de Leo Serrano em ev-pf-aponta-jantares-e-degustacao-de-whiskey-de-vorcaro-a-claudio-castro
  (e no lote 297) segue sem conferência em fonte; e-mail corporativo de pessoa jurídica (ev-augusto-lima-controla-asteba-asseba-por-procuracao,
  src-bahiaba-2026-pf-liga-email-associacoes-augusto-lima) e CNPJs não são dado pessoal; bairros de residência de autoridades
  (Lago Sul, Lago Norte) e cidades de buscas foram mantidos por não constituírem endereço; a unidade do Poème Horto,
  de titularidade formal de pessoa jurídica e objeto da constrição, foi mantida; faixas etárias e idades de adultos
  investigados foram mantidas.'
