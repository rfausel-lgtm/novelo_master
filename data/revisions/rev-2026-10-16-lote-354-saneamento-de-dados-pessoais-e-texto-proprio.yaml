corrections:
- 'Fragmentos de CPF (EDITORIAL §6), seis registros: src-brasilapi-2026-varajo-consultoria-cnpj, src-brasilapi-2026-miranda-comunicacao-eireli,
  src-brasilapi-2026-leo-dias-scp-thiago-miranda, leonardo-augusto-furtado-palhares, ev-miranda-empresas-mithi-cnpj-nao-localizado
  e ev-tse-doacoes-zettel-2022-registro-primario reproduziam os dígitos finais do CPF de três pessoas físicas; os dígitos
  saíram e o texto registra apenas que o cadastro traz o CPF (ou que o mesmo CPF consta nos registros cruzados), sem
  reproduzi-lo. A varredura de data/ por "CPF", por máscaras, por "terminado em" e por sequências de 11 dígitos não achou
  outro número de CPF; os demais usos da palavra são descritivos.'
- 'Datas de nascimento: augusto-de-arruda-botelho e cezinha-de-madureira (e a fonte src-opovobbc-2026-09-14-quem-e-cezinha-de-madureira)
  traziam a data completa de nascimento, e ev-vorcaro-trajetoria-antes-do-banco o ano; saíram, e fica a naturalidade.'
- 'Endereço residencial: o número da unidade e a rua do apartamento vendido por Jaques Wagner e sua mulher à MSMG Patrimonial
  saíram de doc-2026-07-13-msmg-peticao-terceira-adquirente-boa-fe, ev-msmg-comprou-apartamento-de-wagner-por-10-milhoes,
  ev-registro-do-apartamento-de-wagner-barrado-pela-pet16230, msmg-patrimonial, marcelo-passos-de-araujo e
  rel-msmg-patrimonial-jaques-wagner-commercial; ficam o nome do edifício, a cidade, o valor, as datas e a indisponibilidade.'
- 'Familiar sem papel próprio: o nome da esposa de Hamilton Suaki saiu de hamilton-suaki e de rel-hamilton-suaki-daniel-lopes-monteiro-familial;
  fica o parentesco (irmã de Daniel Lopes Monteiro), que é o fato que liga os dois.'
- 'Dados de saúde e de dependentes citados por defesas: em leonardo-augusto-furtado-palhares, src-stf-pet15556-edoc390-peticao-palhares-revisao-cautelares-12-08-2026,
  marilson-roseno-da-silva, src-stf-pet15556-edoc221-peticao-marilson-revogacao-prisao-02-04-2026, fabiano-zettel,
  natalia-vorcaro-zettel e src-stf-pet15556-edoc247-peticao-zettel-domiciliar-pos-parto-24-04-2026, a composição da
  família, a idade de filhos e o estado de saúde de familiares, invocados nas petições, passaram a "razões familiares"
  ou "dependentes familiares"; o pedido, a data e o fundamento legal (art. 318, III, do CPP) ficam. O título descritivo
  da fonte do e-Doc 247 foi neutralizado; o id foi mantido para não romper referências.'
- 'Menores (filhos de investigados): gilmar-mendes, fabiano-zettel, ev-gilmar-condicionou-reavaliacao-domiciliar-zettel
  e doc-2026-03-voto-gilmar-mendes-referendo-pet15556 deixam de citar idade e nascimento de filhos de Fabiano Zettel
  (na evidência, o trecho entre aspas da defesa sobre os filhos foi substituído por paráfrase, e o restante da citação
  do voto foi mantido); leonardo-augusto-furtado-palhares, ev-palhares-solar-associacao-ong-familia-vorcaro,
  solar-sociedade-organizada e src-gazetadopovo-2026-operador-vorcaro-ong-africa passam a dizer que a ONG é ligada à
  família de Daniel Vorcaro, sem identificar quem a representa; ev-vorcaro-preciso-matar-esse-cara-julho-2025, que
  registrava em nota o primeiro nome de uma filha de Vorcaro, sean-monteine, rel-daniel-vorcaro-sean-monteine-allegation,
  ev-os-meninos-modus-operandi-oficios-forjados-derrubada-perfis, ev-turma-forja-documento-da-interpol-e-vorcaro-oferece-10-milhoes
  e ev-oficio-forjado-interpol-plano-intimidacao-dj-miami passam a falar em "familiar"; ev-valadao-e-a-familia-vorcaro-decadas-de-proximidade,
  rel-daniel-vorcaro-andre-valadao-personal-social e src-jornaldebrasilia-2026-03-13-folhapress-lagoinha-familia-vorcaro
  passam a falar em "festa familiar" de 2023, sem idade nem filhos; ac3-cobrancas-e-participacoes deixa de nomear os
  quatro filhos de Augusto Lima sócios da holding (dois deles menores), e rel-augusto-lima-ac3-cobrancas-e-participacoes-corporate
  e ev-augusto-lima-blindagem-patrimonial-e-bloqueios passam a falar em "familiares"; anderson-wander-da-silva-lima e
  ev-anderson-wander-padrao-dois-anos-consultas-ilegais deixam de citar a ocasião familiar de um presente.'
- 'Textos de lotes antigos: os resumos das revisões rev-2026-09-11-lote-184-palhares-primeira-manifestacao,
  rev-2026-09-11-lote-185-marilson-primeira-manifestacao e rev-2026-09-11-lote-188-zettel-gemeos-domiciliar (inclusive
  o título desta última) reproduziam os mesmos dados de filhos, dependentes e saúde retirados dos verbetes; passaram
  a "circunstâncias familiares" ou "fato novo de ordem familiar", com nota de saneamento. Os ids foram mantidos. Outras
  revisões antigas que mencionam de forma genérica, sem nome nem idade, um filho ou uma filha de Vorcaro (lotes 197,
  198 e 203) ou os quatro filhos de Augusto Lima (lote 109) não foram alteradas.'
- 'ev-anderson-wander-padrao-dois-anos-consultas-ilegais (decisão do editor-master): a proposição e a nota reproduziam
  o nome de uma pessoa não investigada e a justificativa que Marilson Roseno deu, em mensagem transcrita pela decisão de
  13/05/2026, para pedir a consulta sobre ela; a decisão apenas transcreve a mensagem, sem verificar a alegação, e nenhum
  documento a sustenta. Pela política editorial (nenhuma imputação sem documento que a sustente; nome de terceiro só com
  papel próprio), saíram o nome e o teor da alegação, que não são reproduzidos aqui. Ficam a data (30/10/2024), a
  consulta, o pedido de Marilson e a ressalva de que a decisão não verifica a justificativa. "Consultas indevidas"
  passou a ser qualificação atribuída à decisão.'
- 'Dependente sem papel próprio: src-stf-pet15556-edoc247-peticao-zettel-domiciliar-pos-parto-24-04-2026 e uma pendência
  de fabiano-zettel descreviam um familiar de Zettel invocado no pedido de domiciliar (parentesco, profissão e idade); a
  fonte passa a mencionar apenas as circunstâncias familiares invocadas, e a pendência, que só registrava a falta de
  mais dados sobre esse familiar, saiu.'
- 'Texto próprio, casos apontados: banco-de-brasilia-brb e src-infomoney-2026-05-bc-brb-provisionamento-2-6-bilhoes
  diziam que o provisionamento era para cobrir "a fraude" nas carteiras do Master; passa a "perdas com as carteiras
  adquiridas do Master", atribuído à InfoMoney no verbete. augusto-lima chamava, em pendência, Vorcaro de controlador
  "do esquema"; passa a "do Banco Master"; a "remuneração indevida" do resumo passa a ser atribuída à declaração de
  28/10/2025 que a qualifica assim. davi-alcolumbre: a pendência levantada pelo editor em 10/09/2026 (a "blindagem"
  que o senador daria a Moraes e o "esquema de comissões" de Rueda e ACM Neto) foi reescrita como registro neutro do
  que a proposta de delação diz e do que o corpus não liga; nas pendências seguintes saíram a referência à hipótese do
  editor e a especulação sobre plausibilidade. jorge-messias: "monitoramento ilícito" foi mantido, agora atribuído
  expressamente à decisão de André Mendonça de 08/09/2026 na Pet 16.662 ("o que a decisão descreve como").'
- 'Texto próprio, varredura (why_in_novelo, label e frases sem atribuição): reescritos com atribuição explícita ou termo
  neutro, sem acrescentar fato — organizações asteba, banco-pleno (inclusive duas pendências sobre os "indícios de
  fraude", agora atribuídos ao Poder360), clinica-mais-medico, espaco-engenharia (saiu "suspeitosamente"), fg-participacoes,
