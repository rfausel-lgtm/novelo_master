id: rev-2026-10-16-lote-354-saneamento-de-dados-pessoais-e-texto-proprio
kind: revision
date: '2026-10-16'
title: 'Lote 354 — Saneamento de registros antigos: fragmentos de CPF, datas de nascimento, unidade residencial,
  referências a filhos menores e dados de saúde de terceiros, e texto próprio com vocabulário de imputação sem
  atribuição'
summary: >-
  Lote de saneamento, sem pesquisa nova e sem nenhum registro novo, autorizado por Rafael Fausel sobre o estado
  atual do acervo (o histórico do git não foi reescrito). O que este lote NÃO faz, em destaque: não altera fato,
  data, valor, classe de evidência, status, fonte ou relação de nenhum registro; não acrescenta nem retira
  atribuição de conduta a ninguém; não afirma que qualquer pessoa citada seja menor de idade além do que os
  próprios registros já diziam; e não reproduz, nem neste texto, nenhum dos dados retirados. Quatro frentes,
  aplicando as seções 3 e 6 da política editorial a 95 registros já publicados e ao texto de três revisões antigas. (1) Fragmentos de CPF: seis
  registros (duas fontes cadastrais de Thiago Miranda, a fonte cadastral da Varajo, o verbete de Leonardo
  Palhares, a evidência sobre as empresas de Thiago Miranda e a evidência das doações de Fabiano Zettel ao
  TSE) traziam dígitos finais de CPF; os dígitos saíram e o texto passa a dizer que o registro traz o CPF, não
  reproduzido, preservando a âncora de identidade. (2) Outros dados pessoais: duas datas de nascimento completas
  e um ano de nascimento saíram (fica a naturalidade); o número da unidade e a rua de um apartamento vendido por
  Jaques Wagner saíram de seis registros (ficam o edifício, a cidade, o valor e as datas); o nome da esposa de
  um investigado, sem papel próprio, saiu de dois registros; dados de saúde de familiares citados em petições de
  defesa saíram de quatro registros. (3) Menores: referências a filhos e filhas de investigados — nomes, idades,
  gestação e nascimento, festa de aniversário, o motivo de um presente, o nome de uma filha registrado em nota e
  os nomes de dois sócios menores de uma holding familiar — foram substituídas por "familiar", "razões
  familiares" ou equivalente em 27 registros, mantidos o episódio, a data e a atribuição; em uma evidência sobre
  consultas a sistemas da PF, a justificativa que um investigado deu para pedir a consulta sobre um terceiro, não
  investigado e sem documento que a sustente, saiu, junto com o nome desse terceiro; ficam a data, a consulta e o
  pedido. (4) Texto
  próprio: 56 registros usavam, em why_in_novelo, label, summary, description, proposition, role ou
  open_questions, sem atribuição, palavras como "esquema", "propina", "fraude"/"fraudulenta", "lavagem",
  "testa de ferro" ou juízos do próprio editor ("o caso mais grave", "suspeitosamente", "o padrão familiar",
  "blindagem que Alcolumbre dá a Moraes"); foram reescritos com atribuição explícita (PF, PGR, MPF, CVM,
  decisão e data) ou termo neutro ("fatos investigados", "interposta pessoa", "contrapartida"). Ficaram como
  estavam, por serem tipos legais ou citação atribuída: "gestão fraudulenta" e "operação fraudulenta" (tipos
  penal e da CVM), "organização criminosa" em negativas e tipificações atribuídas, "indícios de fraude" atribuídos
  ao INSS/CGU, a CVM ou a avaliadoras, e termos entre aspas de documentos. Não confirmado nem tocado: o sobrenome
  "Giunchetti" atribuído a Leo Serrano em um registro de evidência e em um lote antigo, nunca conferido em fonte.
