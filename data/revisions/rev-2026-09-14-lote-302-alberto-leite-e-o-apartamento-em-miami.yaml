title: 'Lote 302 — Alberto Leite: do fundo Arleen ao apartamento de luxo em Miami'
summary: 'Investigação aberta a partir de matéria compartilhada por Rafael (post da Transparência Internacional
  - Brasil citando reportagem exclusiva do Estadão de 14/09/2026): identificado o empresário Alberto Leite,
  amigo de Dias Toffoli e dono da FS Security, como o "amigo" a quem Daniel Vorcaro determinou repassar sua
  posição no Fundo Arleen (o mesmo fundo já apontado pela PF como possível instrumento de benefício a Toffoli).
  Leite registrou, segundo investigadores, a offshore Egide I Holding (Ilhas Virgens Britânicas) — que recebeu
  cerca de R$ 34 milhões do Arleen antes de sua liquidação — e, através da subsidiária Lino Properties
  (Delaware), comprou em março de 2025 um apartamento de US$ 3,648 milhões no empreendimento 888 Brickell
  Miami. Leite nega qualquer participação ou benefício de Toffoli na compra. Enriquecida também a evidência
  já publicada sobre a hipótese da PF, com um episódio específico (mar/2024) de possível encontro entre
  Toffoli e Vorcaro na residência do ministro no Lago Norte, classificado pela PF como "plausível", não
  confirmado.'
