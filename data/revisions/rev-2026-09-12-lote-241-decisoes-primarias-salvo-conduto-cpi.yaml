title: 'Lote 241 — os irmãos Toffoli e Paulo Humberto Barbosa: as decisões primárias que faltavam'
summary: 'Duas decisões de André Mendonça no INQ 5.026, ambas de 26/02/2026, que o acervo só conhecia por
  citação em petições de terceiros (Belline Santana e Ibaneis Rocha) — lidas agora por inteiro. Confirmam,
  com fonte judicial direta, que José Eugênio e José Carlos Dias Toffoli (irmãos do ex-relator do próprio
  inquérito) e Paulo Humberto Barbosa figuram como investigados no INQ 5.026 e foram dispensados de
  comparecimento à CPI do Crime Organizado por essa condição — upgrade de classificação de C para D. As
  duas decisões usam fundamentação textualmente idêntica, revelando um padrão: convocações da CPI
  neutralizadas em bloco por salvo-conduto/habeas corpus preventivo, com os números dos Requerimentos que
  motivaram cada convocação agora identificados.'
