title: 'Lote 198 — Os Meninos: o modus operandi dos ofícios forjados e a tipificação penal por núcleo'
summary: 'Terceiro lote extraído do e-Doc 2 da PET 15.978 (representação da PF, maio de 2026), fechando a
  leitura da seção sobre o núcleo "Os Meninos". Detalha o padrão de derrubada de perfis por ofícios
  forjados com aparência oficial enviados aos canais de Law Enforcement Information Request das
  plataformas, com dois exemplos adicionais (perfil falso usando dados de Martha Graeff contra a filha
  de Daniel Vorcaro; derrubada do Instagram de um crítico identificado apenas como @alexandreknuz — sem
  registro próprio no acervo por tratar-se de menção lateral única). Revela um segundo episódio de ataque
  ao jornalista Lauro Jardim, desta vez digital (tentativa de invasão de e-mail/celular por link-isca, em
  29/07/2025), distinto do plano de simulação de assalto físico já registrado. Acrescenta o detalhe de que
  a BIPE Software Brasil — empresa de David Henrique Alves — usa endereço compartilhado por diversas outras
  pessoas jurídicas, indício de mera caixa postal. Por fim, registra pela primeira vez no acervo a
  tipificação penal formal atribuída pela PF a cada núcleo: art. 2º §2º da Lei 12.850/2013 e art. 325 CP
  para os líderes de "A Turma"; apenas art. 325 CP para o casal de policiais Valéria e Francisco; e
  inserção de "Os Meninos" na mesma organização criminosa, como braço cibernético.'
