title: 'Lote 264 — a íntegra da decisão sobre Ciro Nogueira, e o fim da emenda do FGC'
summary: 'O acervo tinha a fase de 07/05/2026 contra Ciro Nogueira só pelo resumo oficial. Na íntegra da decisão, a PF
  descreve a emenda que elevava o FGC a R$ 1 milhão chegando à casa do senador em envelope e a frase de Vorcaro "saiu
  exatamente como mandei"; minutas de dois projetos de lei retiradas da mesma casa em novembro de 2023, com cuidado para o
  motorista não ligar o transporte ao parlamentar; a empresa do irmão dele comprando por R$ 1 milhão ações avaliadas em
  R$ 13 milhões; e repasses mensais de R$ 300 mil a R$ 500 mil. Contra o senador, a única cautelar foi a proibição de
  contato; a tornozeleira ficou com o irmão e um operador. E o Senado fechou a outra ponta: a emenda, apresentada em
  13/08/2024, foi rejeitada pela CCJ em 10/06/2026.'
