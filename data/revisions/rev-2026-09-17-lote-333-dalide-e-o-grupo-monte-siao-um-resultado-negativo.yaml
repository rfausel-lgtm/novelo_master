title: Lote 333 — Dalide Corrêa e o Grupo Monte Sião, um resultado negativo confirmado
summary: 'Fecha a pergunta que o lote 328 deixara aberta sobre o vínculo de Dalide Corrêa com o Grupo Monte Sião.
  A candidatura de 2022 está confirmada em duas fontes independentes: 1ª suplente de João Campos de Araújo ao Senado
  por Goiás, pelo Republicanos — não Tocantins, como uma reportagem chegou a dizer —, não eleita, com patrimônio
  declarado de R$ 88,5 milhões, entrando na chapa por substituição de dois suplentes cuja candidatura fora indeferida.
  Ela de fato integrou o quadro da Agropecuária Monte Sião a partir de 16/08/2022, mas o cadastro vigente da Receita
  Federal, consultado hoje, já não a inclui — resta apenas Vilma Magalhães e Silva. O resultado mais relevante é
  negativo: nenhuma operação entre o Grupo Monte Sião e o Banco Master, o BRB ou fundos ligados a Vorcaro foi localizada
  em fonte aberta. O vínculo dela com o dinheiro do Master é pessoal e passa pelo escritório de Brasília, não pela
  operação agropecuária do Tocantins. Registrado também, sem conclusão: o Monte Sião Haras, aberto em 2024, tem
  sócia de mesmo sobrenome (Raquel Alvarenga Alves Corrêa), sem parentesco confirmado com Dalide.'
