corrections:
- 'people/dalide-barbosa-alves-correa: a candidatura de 2022 estava descrita apenas como ''suplente de senadora'';
  passa a registrar UF (Goiás), partido, titular, resultado e patrimônio declarado, e a filiação ao Agir passa a
  constar como não confirmada em fonte oficial. A pergunta aberta sobre o vínculo com o Monte Sião é substituída
  pela confirmação da entrada em 2022 e da ausência atual no quadro societário.'
