title: 'Lote 285 — Ricardo Siqueira é um reincidente em fraudes de fundo de pensão, e outros detalhes da
  peça nunca lida do caso RioPrevidência'
summary: 'Leitura de um documento comprobatório de 128 páginas, anexo à representação original da PF na Pet
  15.497/DF (caso RioPrevidência/Cláudio Castro), até aqui nunca lido no acervo — só a petição-síntese estava
  registrada. Maior achado: Ricardo Siqueira Rodrigues, intermediário dos aportes bilionários da
  RioPrevidência no Banco Master, não é um operador estreante nesse tipo de esquema — tem mandado de prisão
  preventiva na Operação Rizoma (fraude nos fundos de pensão Postalis e Serpro), é citado na Operação Circus
  Maximus (propina a diretores do BRB) e confessou, na Operação Encilhamento, pagamento de R$ 1 milhão em
  comissões como "financiador estratégico". Também: (1) em áudio, ele nega ser o "dono" do esquema sem
  nomear quem é, mesmo à própria PF; (2) foi apresentado a Vorcaro por Fabiano Zettel em 18/10/2023; (3) o
  TCE-RJ (citado em cadeia via O Globo) chama de "notável coincidência" o Banco Master ter aberto pedido de
  credenciamento no Rioprevidência no mesmo dia em que Euchério Lerner Rodrigues assumiu como diretor de
  investimentos (04/10/2023) — 15 dias antes da assinatura formal do atestado (19/10/2023, já conhecida);
  (4) tabela discriminada, por fundo e data, dos R$ 2,01 bilhões em cotas de fundos já reconciliados no
  acervo (lote 163) — mais granular, mas sem conflito com o total já publicado.'
