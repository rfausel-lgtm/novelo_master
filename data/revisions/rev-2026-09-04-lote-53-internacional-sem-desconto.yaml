title: 'Lote 53: repercussão internacional e a Operação Sem Desconto'
summary: 'Pesquisa conduzida por agente convocado em paralelo, encerrando o ciclo de investigação desta
  sessão. Parte A: mapeia a repercussão internacional do caso — cobertura investigativa sustentada da
  Bloomberg e análise institucional do Economist, sem evidência de rebaixamento do rating soberano do
  Brasil; a falha de avaliação de risco documentada é doméstica, da Fitch sobre o próprio Banco Master.
  Parte B: esclarece que a Operação Sem Desconto (fraude de descontos do INSS) tem conexão investigativa
  real com o Master, via o consignado ''M Fácil Consignado'' (ex-CredCesta) e o cruzamento de dados autorizado
  por Mendonça em 25/02/2026 — e foi a origem concreta do atrito entre Mendonça e a cúpula da PF já registrado
  no corpus.'
