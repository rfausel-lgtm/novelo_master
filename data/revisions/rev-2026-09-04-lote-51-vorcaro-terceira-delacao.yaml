title: 'Lote 51: a terceira tentativa de delação de Vorcaro poupa Moraes'
summary: Pesquisa conduzida por agente convocado em paralelo, em varredura final das últimas horas. Registra
  que Vorcaro, após duas propostas de delação rejeitadas, prepara uma terceira mantendo a versão de amizade
  com Moraes — sem acusá-lo de conduta criminosa —, e que o MPF vê a tentativa como calculada. Achado
  de fonte única (colunista da CNN Brasil), mas replicado sem contradição por múltiplos veículos; tratado
  como sinalização de bastidor, não fato consumado.
