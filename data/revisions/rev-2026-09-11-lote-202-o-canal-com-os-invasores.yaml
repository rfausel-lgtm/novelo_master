title: 'Lote 202 — O canal com os invasores: quando a estrutura de Vorcaro negociou com hackers'
summary: 'Terceiro lote do e-Doc 4 da PET 15.978 (extração forense do celular de Daniel Vorcaro). Em maio
  de 2024, Vorcaro acionou Luiz Phillipi Mourão para recuperar a conta de Instagram da atriz Monique
  Alfradique, invadida por golpistas que induziam seguidores a pagar por PIX — fato que já era público.
  O interesse do episódio não está na atriz, que é vítima e nada tem com a investigação, e sim no que ele
  revela sobre a estrutura montada por Vorcaro: Mourão disse estar "com os meninos na linha", mandou
  avisar os invasores de que "a turma vai atrás deles... um por um", e chegou a encaminhar áudio
  atribuído aos próprios criminosos negociando a devolução da conta. Ao fim, comentando que várias
  pessoas haviam pago PIX aos golpistas, Vorcaro escreveu a Mourão: "alinha com o pcc rsrs". O lote
  separa deliberadamente as duas camadas — o que está documentado (as mensagens, que existem) e o que é
  ilação da PF (que Mourão teria contato com pessoas ligadas a facções), esta registrada como inferência,
  com os limites escritos: nenhum interlocutor criminoso é identificado, nenhuma facção é nomeada, e a
  menção ao PCC vem acompanhada de "rsrs". Mourão morreu e não teve contraditório.'
