title: 'Lote 275 — a decisão original já chamava o núcleo de Vorcaro de "milícia violenta", e Palhares briga
  por R$ 3,81 milhões'
summary: 'Equipe delegada leu a contraminuta da PGR (10/07/2026) ao agravo regimental de Leonardo Palhares e
  da Varajo Consultoria contra o bloqueio de bens de 03/03/2026 (Pet 15.563). Dois achados: (1) o agravo
  revela a primeira cifra específica do bloqueio de Palhares/Varajo — pedem redimensionamento ao valor
  "efetivamente demonstrado nos autos" de R$ 3.810.000,00, alegando que o contrato com Belline Santana
  (projeto "Jovens Potentes") tinha objeto real; a PGR pediu o não provimento, sem notícia do julgamento até
  esta coleta. (2) A PGR, ao transcrever o item 10.5 da decisão original para rebater o agravo, traz uma
  caracterização jurídica do núcleo liderado por Vorcaro que não estava registrada no acervo: "de formação de
  uma milícia violenta, sob os comandos de DANIEL VORCARO, para satisfação de seus interesses exclusivamente
  privados" — a mesma dinâmica já documentada como "A Turma" (lotes 170-171), agora com essa formulação da
  própria decisão original.'
