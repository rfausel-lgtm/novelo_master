title: 'Lote 229 — a segunda linha investigativa sobre o Master: o IPL paulista de maio de 2025, e a
  prisão preventiva de Vorcaro que nunca foi decidida'
summary: 'Leitura das peças 12 e 13 da PET 15.198 — o traslado quase completo de um Inquérito Policial
  paulista (5004641-31.2025.4.03.6181) e do Pedido de Prisão Preventiva de Daniel Vorcaro dele derivado
  (5009071-26.2025.4.03.6181). O IPL nasceu de denúncia anônima em 27/05/2025, quase dois meses antes da
  notícia de fato que originou a Operação Compliance Zero — e o próprio MPF reconhece, em manifestação
  final, "ausência de conexão entre as investigações", pedindo vinculação à PET 15.198 apenas por cautela
  de sigilo. O pedido de prisão preventiva de Vorcaro nunca foi decidido no mérito: foi suspenso por ordem
  do STF em 05/12/2025. Três registros existentes ganham lastro documental novo: o reaproveitamento de
  perícias da Operação Fundo Fake (upgrade de alegação de imprensa para documental), uma transferência de
  R$ 9 milhões a Henrique Vorcaro anterior a todo o resto do seu perfil, e a hipótese de Nelson Tanure como
  "sócio oculto" antedatada em oito meses. Artur Martins de Figueiredo ganha uma nova alegação policial
  (papel de "operador técnico" do grupo Vorcaro) e um antecedente regulatório (absolvição no PAS CVM das
  debêntures EBPH).'
