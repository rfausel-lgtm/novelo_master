title: 'Lote 272 — Fachin já checava a custódia do HD com a PF um dia antes de Mendonça admitir dúvida'
summary: 'Revisitando a Pet 16.704 pelo portal público do STF, um despacho de 12/09/2026 da Presidência
  (Fachin), até agora não registrado no acervo, mostra que a verificação da cadeia de custódia do HD com a
  extração do celular de Daniel Vorcaro não começou com a "divergência de informações" que Mendonça
  reconheceria só no dia seguinte (lote 271): a Presidência já havia intimado a Polícia Federal a prestar
  informações, em 24h, sobre a custódia do material e o estado em que se encontra. O despacho aparece entre
  a juntada dos ofícios de Moraes e Gilmar Mendes cobrando o compartilhamento do HD e a formalização, no
  mesmo dia, da substituição da relatoria da Pet 16.662 para a própria Presidência — já documentada no
  acervo. Consultado apenas pelo andamento público, sem o teor completo da petição/certidão associada.'
