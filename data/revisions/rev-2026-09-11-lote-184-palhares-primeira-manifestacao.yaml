title: 'Lote 184 — Leonardo Palhares fala pela primeira vez: nega ser ''operador'' de Vorcaro'
summary: 'Décimo quinto documento explorado do acervo de 416 peças da PET 15.556: o e-Doc 390, petição de
  12/08/2026 que é a primeira manifestação de Leonardo Augusto Furtado Palhares (ou de advogado seu)
  localizada em todo o corpus — resolvendo um cited_position "no_response" que o verbete dele registrava.
  Ele nega ter atuado como "operador" de lavagem de Daniel Vorcaro: descreve sua única conduta no caso como
  a celebração do contrato do projeto social "Jovens Potentes" com Belline Santana, por indicação de
  Fabiano Zettel (de cujas empresas era advogado) — episódio isolado, sem ligação com outras fases da
  Compliance Zero. Diz ter respondido a todas as perguntas da PF sem exercer o direito ao silêncio, ao
  contrário da maioria dos investigados, e cita a PET 15.504 como o processo com a documentação integral
  do projeto — número até então não registrado no acervo. Pede abrandamento das cautelares de proibição de
  deixar São Paulo e monitoração eletrônica, citando prejuízo à carreira advocatícia e circunstâncias
  pessoais (é pai de cinco filhos e tem mãe octogenária com doença grave em Minas Gerais).'
