title: 'Lote 303 — A reunião secreta de 12/02/2026 que blindou Toffoli no caso Master'
summary: 'Segunda parte da investigação aberta a partir do post da Transparência Internacional - Brasil sobre
  a cobertura do relatório da PF citado pela revista piauí ("há 7 meses... mantiveram sob sigilo indícios
  fortíssimos... fizeram: uma carta de apoio a Toffoli"). Reconstituída, com apuração do Poder360 e nota
  oficial reproduzida pelo InfoMoney, a reunião fechada de 12/02/2026 dos dez ministros do STF sobre o
  relatório de 200 páginas da PF: placar inicial de 8 a 2 pela permanência de Toffoli, maioria descartando o
  relatório (Dino: "lixo jurídico"; Moraes: apuração "ilegal"), e solução negociada por Dino — amigo pessoal
  de Toffoli há mais de 20 anos — de uma nota de apoio dos dez ministros em troca da saída voluntária de
  Toffoli da relatoria, efetivada no mesmo dia com redistribuição a André Mendonça. A CNN Brasil, ao
  reproduzir os diálogos atribuídos aos ministros, registrou não ter podido verificar sua autenticidade; a
  nota oficial de apoio, em si, está corroborada por mais de uma apuração independente.'
