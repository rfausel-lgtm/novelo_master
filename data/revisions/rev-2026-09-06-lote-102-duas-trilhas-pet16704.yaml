title: Lote 102 — as duas trilhas da Pet 16.704, o pedido de impedimento contra Gonet, e o silêncio da
  PF
summary: 'Aprofundada a arquitetura processual da crise Moraes-Mendonça, por leitura direta de dois despachos
  primários de Fachin: a Pet 16.704 comporta duas trilhas distintas — comum/simultânea (03/09, os quatro
  chamados) e sequencial/restrita (04/09, primeiro Gonet, depois Mendonça, sobre a admissibilidade da
  acusação de Moraes). Confirmado, com trecho literal, que o pedido de nulidade de Gonet sobre a Pet 16.662
  segue explicitamente pendente. Registrado que a Associação Nacional dos Delegados de PF pediu, em 06/09,
  o impedimento de Gonet nesses procedimentos. Corrigido o prazo comum para 11/09 (não 10/09). Sobre o
  afastamento de Andrei Rodrigues: confirmado, com citação literal da Reuters, que nem ele nem a PF/AGU
  responderam a pedidos de comentário — nenhuma reação institucional nova localizada. Refinados os detalhes
  do referendo na 2ª Turma (maioria 3x0, Gilmar pede vista aos 8 minutos, Toffoli não votou) e registrada
  cobertura internacional via EFE e Reuters.'
