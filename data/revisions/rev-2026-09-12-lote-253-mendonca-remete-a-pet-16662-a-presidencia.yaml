reason: Mineração da PET 16.662 via peticionamento.stf.jus.br (sessão autenticada pelo próprio Rafael) — 56 peças.
  Lidas também, sem entrada própria, as duas petições do Partido Novo, a manifestação da PGR, a decisão de afastamento,
  o pedido de vista de Gilmar Mendes, a medida cautelar na SL 1.946 e a decisão da Pet 16.704, todas já no acervo; e
  duas petições de terceiros sem relação com o mérito (uma notícia-crime contra um deputado por publicações sobre o
  relator e um pedido de ingresso de particular processado por ofensa ao diretor-geral da PF), não registradas.
  Lidas ainda, sem conteúdo novo, as PETs 15.976 (buscas da 6ª fase) e 15.977 (interceptação; as operadoras
  confirmam implementação entre 11 e 26/05/2026).
