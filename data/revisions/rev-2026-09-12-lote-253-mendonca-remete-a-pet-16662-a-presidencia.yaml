title: 'Lote 253 — Mendonça manda a PET 16.662 para a Presidência, três dias antes do Plenário'
summary: 'Despacho de 12/09/2026, lido no dia em que foi assinado: André Mendonça encaminhou à Presidência do STF os
  autos da PET 16.662, o processo do relatório da PF sobre o celular de Vorcaro que é o único item da sessão plenária
  extraordinária de 15/09. Ele cita a ordem de Edson Fachin, na Pet 16.704, que suspendeu todo procedimento sobre
  potencial investigação de integrantes da Corte, e registra que já havia liberado o caso para o Plenário em 06/09. O
  despacho não diz se a sessão fica mantida. O lote também lê a certidão de julgamento da Segunda Turma sobre o
  afastamento da cúpula da PF — três votos pelo referendo e vista de Gilmar Mendes —, o que promove o registro desse
  placar de alegação de imprensa a documento.'
