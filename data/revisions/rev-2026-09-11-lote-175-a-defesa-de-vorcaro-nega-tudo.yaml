title: 'Lote 175 — a defesa de Vorcaro nega a Turma, nega o bloqueio do pai, e acusa a PF de fabricar diálogos com ministros'
summary: 'Sexto documento explorado do acervo de 416 peças da PET 15.556: o e-Doc 86, agravo regimental de
  09/03/2026 pelo qual a defesa de Daniel Vorcaro contesta a prisão preventiva decretada em 03/03/2026 — a
  mesma que fundamentou os lotes 170-172. É a primeira vez que o acervo registra a versão completa e formal
  da defesa sobre os achados da representação da PF. Três negativas centrais: (1) nega peremptoriamente a
  existência do grupo ''A Turma'' e qualquer participação de Vorcaro nele — contrapondo diretamente o núcleo
  do lote 170; (2) nega que exista o bloqueio de R$ 2,24 bilhões em conta de Henrique Vorcaro, afirmando que
  o pai ''não possui tal valor a sua disposição'' — tensão registrada, não resolvida, com os comprovantes
  SISBAJUD lidos pela equipe no lote 171, que mostram bloqueio processado (em ativo de baixa liquidez, o que
  pode ou não explicar a indisponibilidade alegada); (3) acusa as autoridades de terem vazado fotos e
  diálogos íntimos de terceiros sem relação com o caso, e de terem apresentado ''inexistentes diálogos''
  entre Vorcaro e ministros do STF para lançar suspeita sobre a própria Corte — acusação grave e genérica,
  sem desdobramento público localizado. De brinde, esclarece parcialmente um open_question antigo: a prisão
  de 04/03/2026 é a mesma da PET 15.556 (conversão do monitoramento eletrônico em prisão), não uma segunda
  prisão por motivo distinto como uma reportagem de fonte única sugeria.'
