title: 'Lote 213 — o preço de "A Turma" e "Os Meninos": os valores exatos do bloqueio patrimonial'
summary: 'A partir da leitura direta das decisões públicas da PET 16.019/DF — o processo formal de bloqueio
  patrimonial da 6ª fase da Operação Compliance Zero, distinto da PET 15.978 (prisão preventiva) e da PET
  15.976 (busca e apreensão), todas de 13/05/2026 e do mesmo relator —, o acervo registra pela primeira vez
  os valores exatos de constrição patrimonial por pessoa: R$ 1,8 milhão cada para os três integrantes do
  núcleo "Os Meninos" (David Henrique Alves, Victor Lima Sedlmaier e Rodrigo Pimenta Franco Avelar Campos)
  e R$ 9,6 milhões cada para quatro integrantes de "A Turma" (Manoel Mendes Rodrigues, Anderson Wander da
  Silva Lima, Sebastião Monteiro Júnior e Erlene Nonato Lacerda), com os respectivos CPFs. A decisão detalha
  o mecanismo de bloqueio — SISBAJUD, CNIB, RENAJUD, ofícios ao Banco Central, à CVM, às Capitanias dos
  Portos, à ANAC e a 14 corretoras de criptoativos nomeadas, mais a Associação Brasileira de Criptoeconomia
  (ABcripto). Registra-se também, em decisão de 12/06/2026, a habilitação dos advogados de Manoel Mendes
  Rodrigues para acesso aos autos sigilosos.'
