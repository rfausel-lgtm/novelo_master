title: 'Lote 131 — "Planalto engana Fachin": articulação paralela e o grupo pró-Moraes no STF'
summary: 'A partir de apuração da Poder360 (09/09/2026): articulação paralela na noite de 08/09 entre
  o governo Lula e Flávio Dino para reverter o afastamento de Andrei Rodrigues antes que Fachin se posicionasse;
  ministros do STF cobraram de Fachin uma reação à suposta ilegalidade processual da decisão de Dino.
  Peça anterior da mesma apuração (06/09) descreve acordo Planalto-STF para adiar decisões sobre Alexandre
  de Moraes até depois do período eleitoral, e um plano do entorno de Lula para divulgar suspeitas contra
  Flávio Bolsonaro via extensão da delação de Freixo Júnior. As alegações mais sensíveis (articulação
  paralela, grupo Gilmar-Dino-Moraes querendo retirar a relatoria de Mendonça) foram objeto de busca dirigida
  por corroboração independente, sem resultado — registradas como apuração exclusiva de um único veículo,
  não como fato estabelecido. Nova pessoa: Cármen Lúcia, citada como voto de equilíbrio entre os dois
  grupos.'
