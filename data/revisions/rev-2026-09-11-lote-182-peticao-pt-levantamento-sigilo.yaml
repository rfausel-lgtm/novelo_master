title: 'Lote 182 — a véspera do levantamento do sigilo: o PT já pedia, um dia antes, o mesmo que Fachin determinou'
summary: 'Décimo terceiro documento explorado do acervo de 416 peças da PET 15.556: o e-Doc 414, petição
  de 09/09/2026 em que o Diretório Nacional do PT pede ao ministro André Mendonça o levantamento do sigilo
  da PET 15.556 e de oito feitos conexos do caso Master — exatamente o que o despacho de Fachin viria a
  determinar no dia seguinte, 10/09/2026 (já publicado no lote 168, à época como breaking news pedido pelo
  editor). A petição do PT usa argumentação robusta: paridade de armas eleitoral (13 candidaturas à
  Presidência, 1º turno em 04/10/2026) e o precedente da Operação Spoofing (Rcl 43.007/DF), em que o STF
  levantou o sigilo de mensagens de Sergio Moro com procuradores da Lava Jato. Cataloga os feitos ainda
  sigilosos e identifica dois deles até então sem número de processo no acervo: a Pet 15.612/DF (inquérito
  sobre o vazamento de dados dos celulares de Vorcaro) e as Pet 16.063/DF e 16.078/DF (financiamento do
  filme Dark Horse, já conhecido do acervo por outra via). Não é possível estabelecer, com os elementos
  do corpus, se esta petição causou a decisão de Fachin — que correu por procedimento distinto, aberto por
  ele seis dias antes —, mas fica registrada como o contexto jurídico e político imediato da decisão.'
