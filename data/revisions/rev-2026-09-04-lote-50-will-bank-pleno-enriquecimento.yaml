title: 'Lote 50: Will Bank e Banco Pleno — dois pontos de enriquecimento'
summary: Pesquisa conduzida por agente convocado em paralelo. Acrescenta a alegação da defesa de Vorcaro
  sobre uma venda do Will Bank ao fundo Mubadala Capital interrompida pela Compliance Zero, e o indício,
  levantado pelo Poder360, de que o Banco Central já sabia de fraude do Master antes de aprovar a venda
  do Voiter (depois Banco Pleno) a Augusto Lima — cujas condições financeiras e situação pessoal são detalhadas
  com mais precisão.
