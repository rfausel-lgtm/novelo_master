title: 'Lote 103 — as duas primeiras delações do caso Master: o que Mansur e Freixo alegam (não provam)'
summary: 'Aprofundado o conteúdo das duas primeiras colaborações premiadas da Compliance Zero. Mansur
  (Reag): confirmados 17 anexos e multa de R$ 40 milhões (equivalente ao que recebeu da Reag), audiência
  de voluntariedade já realizada em 03/09/2026, homologação por Mendonça ainda pendente. Trechos vazados
  (não confirmados pela equipe em documento primário) alegam fundo em Cayman (Jaguar Multimarket Fund,
  R$ 494 milhões) e mecanismo detalhado da operação Tirreno-BRB (aquisição forjada de R$ 6 bi revendida
  por R$ 12 bi após manipulação de taxas de juros). Freixo (''Mineiro''): alega movimentação de ~US$ 1
  bilhão para Vorcaro, incluindo repasses relacionados a Flávio Bolsonaro — extensão do que já era conhecido
  sobre o financiamento do filme ''Dark Horse''. Todas essas alegações são tratadas explicitamente como
  conteúdo de colaboração premiada não corroborado, nunca como fato estabelecido — inclusive porque parte
  da cobertura não pôde ser acessada pela equipe em texto integral, apenas por síntese de busca.'
