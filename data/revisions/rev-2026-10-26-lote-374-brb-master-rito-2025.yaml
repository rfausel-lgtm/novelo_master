title: "Lote 374 — Rito da compra do Master pelo BRB em 2025: liminar de 1ª instância, revogação no TJDFT e
  aprovação do Cade comunicada pelo BRB"
summary: Registra três atos de 2025 do rito da compra de participação no Banco Master pelo BRB, todos por
  documento do emissor. Em 07/05/2025, liminar da 1ª Vara da Fazenda Pública do DF, em ação do MPDFT,
  suspendendo a assinatura do contrato; em 12/05/2025, nota do TJDFT sobre a revogação da liminar pelo
  desembargador relator em pedidos de suspensão de liminar, sem exame do mérito; em 17/06/2025, Fato Relevante
  do BRB segundo o qual o Cade aprovou a operação sem restrições. Cria os verbetes do TJDFT, do MPDFT e do
  Cade. O desfecho posterior do processo não foi verificado.
