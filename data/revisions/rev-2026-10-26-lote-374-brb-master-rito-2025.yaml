reason: Lacuna do acervo - o rito de maio e junho de 2025 entre o Fato Relevante de 28/03/2025 e o restante da
  história não estava registrado. Classe D para as notas do TJDFT e para o comunicado do BRB, que são
  comunicações institucionais do emissor, não os textos das decisões nem o ato do Cade. A aprovação do Cade
  consta só como declaração do BRB. O desfecho posterior do processo (recurso, julgamento colegiado, sentença)
  não foi verificado; o PJe e o site do MPDFT não foram acessados.
