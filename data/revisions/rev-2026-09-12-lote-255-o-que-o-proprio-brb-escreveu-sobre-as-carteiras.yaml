title: 'Lote 255 — o que o próprio BRB escreveu sobre as carteiras do Master, antes da Tirreno aparecer'
summary: 'Dois relatórios internos do BRB, juntados ao INQ 5.026, dão lastro documental ao que a PF descreveu a partir
  do celular de Vorcaro. Em 04/04/2025, o grupo de trabalho do banco registrou ter comprado do Master 1,79 milhão de
  contratos de consignado, com saldo de R$ 7,62 bilhões, sem ter visto as CCBs, e achou 114.626 contratos com numeração
  padronizada — sem nenhuma menção à Tirreno. Em 19/05/2025, o mesmo grupo anotou que o Master ainda não tinha
  entregado a cláusula de mandato entre a Tirreno e o Master, documento que a PF diz ter sido finalizado em 24/05 com
  data de dezembro de 2024. No meio disso, segundo a PF, Vorcaro cobrava de Augusto Lima os contratos da Tirreno: "ate
  agora nao mandamos NADA".'
