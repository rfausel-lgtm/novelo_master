title: Lote 148 — Fachin retira de Moraes a relatoria do inquérito das fake news
summary: 'Registro do desfecho institucional da crise que o acervo vinha acompanhando desde 1º de setembro,
  e que nasceu dentro do caso Master. Em 09/09/2026 o presidente do Supremo revogou a designação de Alexandre
  de Moraes como relator do Inquérito 4.781, aberto por portaria em março de 2019, e assumiu pessoalmente
  sua condução. Invocou o art. 43 do regimento interno e o entendimento do Plenário na ADPF 572 — o julgamento
  em que a corte validara o inquérito e lhe fixara limites — e declarou que a medida decorre da ''necessidade
  de estabelecer segurança jurídica e adequada delimitação institucional''. Os efeitos foram delimitados:
  valem a partir da data da decisão, preservam os atos praticados, e as ações penais conexas com denúncia
  recebida seguem o rito em curso. O alcance maior está no encaminhamento anunciado — os autos irão à
  autoridade policial e à Procuradoria-Geral da República para oferecimento de denúncia ou pedido de arquivamento,
  o que conduz a um desfecho procedimento aberto havia sete anos e meio. A cadeia causal é a que o acervo
  já documentara: em 1º/09 Mendonça levantou o sigilo de peças do caso Master que traziam mensagens entre
  Moraes e Daniel Vorcaro; Moraes respondeu pedindo apuração contra Mendonça e recorreu, para tanto, ao
  próprio Inquérito 4.781, valendo-se de relatório de inteligência sem assinatura que a Polícia Federal
  classificara como sem valor probatório; em 04/09 Fachin separou esse pedido do inquérito e o avocou;
  em 09/09 retirou a relatoria. Registrou-se a sequência como fato, com a ressalva expressa de que a decisão
  declara fundamento institucional e não disciplinar, de modo que lê-la como sanção iria além do que o
  texto autoriza.'
