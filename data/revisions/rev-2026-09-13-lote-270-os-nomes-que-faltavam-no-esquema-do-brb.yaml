title: 'Lote 270 — os nomes que faltavam no esquema imobiliário do BRB'
summary: 'Rafael reautenticou no peticionamento e uma equipe delegada baixou a decisão de 15/04/2026 que
  autorizou a busca e apreensão contra Paulo Henrique Costa, Daniel Lopes Monteiro e outros (Pet 15.771/15.772),
  já parcialmente conhecida no acervo por outra via. A releitura revela três nomes que antes ficavam de fora
  por falta de acusação formal: a advogada Thaísa Menzato, apontada como participante qualificada do esquema
  (assinatura de contratos, gestão de pagamentos via WhatsApp, estruturação jurídica da Tirreno); Hamilton
  Suaki, médico e cunhado de Daniel Lopes Monteiro, colocado como diretor de uma das seis empresas de fachada
  que compraram os imóveis de R$ 146,6 milhões atribuídos a Paulo Henrique Costa; e Arthur Caixeta Nogueira,
  representante da REAG Portfolio Solutions, gestora do fundo por trás das seis empresas.'
