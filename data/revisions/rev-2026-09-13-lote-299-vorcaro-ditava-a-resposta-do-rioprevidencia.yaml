title: 'Lote 299 — Vorcaro ditava, palavra por palavra, a resposta do Rioprevidência ao Estadão'
summary: 'Em agosto de 2024, o jornal Estadão enviou perguntas ao Rioprevidência sobre os aportes em LFs do
  Master. Segundo o documento comprobatório da PF (Pet 15.497), Fernando de Goes pediu orientação a Daniel
  Vorcaro antes de a autarquia responder ao jornal, e Vorcaro ditou a redação exata da resposta e a
  estratégia de mantê-la curta, calculando que uma resposta detalhada geraria mais matérias. A própria PF
  conclui que isso demonstra influência de Vorcaro sobre a comunicação institucional do órgão sobre seus
  próprios investimentos — captura mais direta da comunicação de um órgão público do que o episódio Kassab
  (lotes 287/295), que envolvia pressão sobre conteúdo de terceiro. Identificado um contato interno provável,
  Márcio Garcia Liñares, membro do Conselho Fiscal do Rioprevidência.'
