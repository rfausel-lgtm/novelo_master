title: 'Lote 269 — a operação contra Cláudio Castro foi maior do que se sabia'
summary: 'Sem acesso ao peticionamento sigiloso (sessão do Rafael expirou), a varredura seguiu pelo portal
  público do STF nos processos restantes da lista da PGR. A decisão de 25/05/2026 contra Cláudio Castro gerou
  pelo menos 10 mandados de busca e apreensão (Pet 15.676) e mais 3 ofícios em processo companheiro de origem
  fluminense (Pet 15.686) que nomeia um segundo alvo, Tharcio Nascimento Salgado — mais ampla do que a busca
  "na casa do ex-governador" noticiada pela imprensa. Em 11/08/2026, Mendonça indeferiu pedido do operador
  Ricardo Siqueira Rodrigues (identificado no lote 266) no mesmo processo, mantendo as investigações contra ele.
  Os processos ligados a Jaques Wagner (16.201, 16.210) e Augusto Ferreira Lima (16.229, 16.230) mostraram-se
  a mesma 9ª fase já documentada no acervo (fonte primária já lida em sessão anterior); as Pets 15.771/15.772/
  15.773 (Daniel Lopes Monteiro, Thaísa Menzato, Paulo Henrique Costa) confirmaram-se como desdobramentos de
  custódia de uma operação conjunta de 15/04/2026, de baixo valor investigativo adicional sem leitura do
  conteúdo sigiloso.'
