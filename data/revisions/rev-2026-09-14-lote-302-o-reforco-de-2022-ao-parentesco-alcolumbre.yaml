title: 'Lote 302 — um episódio de 2022 reforça, sem provar documentalmente, o parentesco Alcolumbre'
summary: 'A pedido de Rafael, apuração dedicada (OSINT) buscou confirmar documentalmente o parentesco entre
  Alberto Samuel Alcolumbre Tobelem e o senador Davi Alcolumbre, hoje sustentado apenas por reportagens de
  2026. A ficha de candidato de Davi Alcolumbre no TSE não trouxe Alberto Samuel como candidato ou doador,
  e nenhuma certidão ou registro público foi localizado. A apuração encontrou, porém, um reforço institucional
  anterior e independente: em março de 2022, quando a PM de São Paulo apreendeu cerca de R$ 500 mil pertencentes
  a Alberto Samuel, o próprio gabinete do senador, em nota à imprensa, referiu-se a ele como "o irmão" — episódio
  coberto de forma editorialmente independente por CNN Brasil e Metrópoles, sem nenhuma relação com o Banco
  Master. Não é documento cartorial, mas eleva a classificação da relação de A (só imprensa) para C (duas
  fontes independentes) e reforça, sem fechar, o open_question já registrado no acervo.'
