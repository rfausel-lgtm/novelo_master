title: 'Lote 191 — as mensagens de Henrique Vorcaro: financiando a Turma mesmo depois de preso o filho'
summary: 'Segundo lote do novo acervo da PET 15.978 (6ª fase): aprofunda o papel de Henrique Vorcaro na
  mesma decisão de 13/05/2026 (e-Doc 28, lote 190). A leitura integral, muito mais específica que a
  cobertura de imprensa já no acervo, reproduz mensagens de WhatsApp em que ele cobra e paga o núcleo
  "A Turma" mesmo após a 1ª e a 2ª fases da operação, usa número de telefone estrangeiro (Colômbia) e troca
  de terminal com frequência para dificultar rastreamento, e se reuniu pessoalmente com Marilson Roseno em
  03/03/2026 — véspera da 3ª fase, quando Daniel Vorcaro e Mourão foram presos — na empresa One
  Investimentos, identificado apenas como "H" numa mensagem de Marilson à esposa, decifrado por cruzamento
  de dados da PF. Duas organizações novas: One Investimentos (local do encontro) e Roseno & Ribeiro Gestão
  Empresarial (veículo formal, de Marilson, pelo qual a King Participações de Mourão fazia os repasses
  mensais — com documentação contábil mostrando que continuaram em novembro/dezembro de 2025 e
  janeiro/fevereiro de 2026, mesmo após as fases ostensivas).'
