title: 'Lote 194 — Erlene e Helder: a camada contábil que lavava os repasses de Marilson'
summary: 'Quinto lote do novo acervo da PET 15.978 (6ª fase, e-Doc 28, lote 190). Duas pessoas novas: Erlene
  Nonato Lacerda, gestora financeira informal e interposta pessoa de Marilson Roseno da Silva, que recebeu
  em nome próprio dois pagamentos de R$ 50 mil da King Participações Imobiliárias (de Luiz Phillipi Mourão)
  que, segundo a PF, eram na verdade destinados a Marilson; e Helder Alves de Lima, contador da empresa
  Roseno & Ribeiro Gestão Empresarial (de Marilson), responsável por emitir as notas fiscais que davam
  aparência formal a esses repasses — inclusive após a 2ª fase da operação. Ambas alvo de cautelar de
  proibição de deixar o país na decisão de 13/05/2026.'
