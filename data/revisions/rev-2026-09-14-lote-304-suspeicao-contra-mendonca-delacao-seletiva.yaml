title: 'Lote 304 — arguição de suspeição contra Mendonça cita "delação seletiva" e encontro sobre a STP 976'
summary: 'A partir dos autos completos da Pet 16.662/DF e da Pet 16.704/DF, baixados por Rafael via
  certificado digital em 14/09/2026 — véspera da sessão extraordinária do Plenário de 15/09 —, identificada
  arguição de suspeição de 14/09/2026, de Benjamim Botelho de Almeida (já no acervo, investigado na
  Compliance Zero) contra o ministro André Mendonça, relator do caso Master. A peça soma dois fundamentos: o
  encontro do ministro com Daniel Vorcaro em março de 2025 (já conhecido), agora com o assunto declarado —
  a STP 976, litígio de precatórios do FIDC MEG, do ecossistema de Vorcaro — e episódio até então não
  registrado no acervo, mas independentemente coberto por imprensa (CNN Brasil, Gazeta do Povo): em sessão
  pública de 16/06/2026, o próprio Mendonça relatou ter recebido, por advogado de Vorcaro, proposta de
  "delação premiada seletiva", recusada por ele, com reação de Gilmar Mendes de que a situação estava "muito
  invertida". A arguição de suspeição em si — ainda sem cobertura de imprensa localizada até a publicação —
  também alega amizade próxima com o advogado Ciro Rocha Soares e uso, no voto que manteve presa a família de
  Vorcaro, de relatórios policiais com conteúdo de comunicações entre advogados de defesa e clientes;
  tratadas como alegação de parte interessada, não fato estabelecido.'
