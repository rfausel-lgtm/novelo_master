title: 'Lote 209 — Os passaportes que contradizem a PF: o contraditório de Katherine Venâncio Telles'
summary: 'Primeiro lote extraído do e-Doc 160 da PET 15.978 — a manifestação de 28/05/2026 da defesa de
  Katherine Venâncio Telles, primeira peça de defesa lida diretamente desta 6ª fase, e primeiro lote deste
  acervo produzido com apoio de dois agentes de pesquisa em paralelo, cada um lendo metade do documento e
  cruzando os achados contra o corpus antes da síntese final. Achado central: a defesa apresenta os
  passaportes da mãe (Erica Venancio) e do padrasto (José Marcos e Souza) de Katherine, emitidos em 2018,
  e uma viagem internacional efetivamente realizada em abril de 2026 — contradizendo diretamente a
  afirmação da PF, já registrada no acervo, de que nenhum registro de viagem da mãe fora localizado em
  2026. Registrado com a ressalva exata: os documentos não tratam do pai biológico de Katherine, que a PF
  nomeia separadamente e afirma não ter passaporte. O lote traz também o depoimento completo do policial
  rodoviário federal que abordou o veículo em 04/03/2026 — nome, matrícula, local exato e motivo formal
  (irregularidade administrativa, não suspeita criminal) —, o detalhe já existente sobre a prisão de
  Victor Lima Sedlmaier (dinheiro em espécie e SSD apreendidos, condução ao aeroporto de Confins) agora
  incorporado ao perfil dele, as duas buscas distintas na casa de Katherine (06/03 e 14/05/2026, com
  itens diferentes em cada uma), e a versão dela sobre a empresa BIPE como suposto "portal jornalístico" —
  registrada como alegação de defesa, em contraste com a descrição da PF já no acervo.'
