title: 'Lote 300 — o diretor-geral da PF contradiz Mendonça sobre quem pediu a cópia do celular de Vorcaro'
summary: 'Achado do agente de monitoramento de imprensa, verificado por WebFetch direto: o diretor-geral da
  PF, Andrei Rodrigues, afirmou publicamente que foi o gabinete de André Mendonça que pediu a cópia dos dados
  do celular de Vorcaro, atendida em 08/03/2026 — contradizendo a versão do próprio Mendonça, já registrada
  no acervo (lote 280), de que a PF entregou o material por iniciativa espontânea, sem solicitação. A
  divergência sobre quem tomou a iniciativa — buscar o material ou apenas recebê-lo passivamente — permanecia
  em aberto na véspera da sessão de 15/09.'
