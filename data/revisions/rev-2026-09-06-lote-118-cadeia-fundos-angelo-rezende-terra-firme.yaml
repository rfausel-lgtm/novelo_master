title: Lote 118 — a cadeia de fundos até Ângelo Rezende cruza com Valério Marega; Terra Firme Realty confirmada
  como entidade distinta
summary: Detalhada, com quatro fontes regionais convergentes e dados públicos de CVM, a cadeia de fundos
  (Diamond FIP, Gardênia, MMPG, Fortress/WNT) que ligaria Ângelo Rezende à PKL One Participações — cruzando
  com Valério Marega Júnior, já conhecido no corpus. A identificação nominal de Rezende permanece classe
  A. Confirmado, por CNPJs de raízes diferentes, que Terra Firme Realty e Terra Firme da Bahia Ltda são
  entidades distintas. Reforçada, sem resolver, a contradição sobre se o Instituto Terra Firme 'gere'
  a Asseba — registro público confirma Maria Helena Santos Ferreira como presidente estatutária desde
  2008. Registrada dúvida sobre o nome 'Mark 71' de uma SPE citada no lote 115.
