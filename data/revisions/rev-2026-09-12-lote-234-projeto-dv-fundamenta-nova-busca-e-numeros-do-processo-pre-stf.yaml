title: 'Lote 234 — Vorcaro sob nova busca: o Projeto DV como fundamento, os números do processo pré-STF, e
  a confirmação da própria defesa'
summary: 'Três achados sobre a fase cautelar de janeiro de 2026 contra Daniel Vorcaro. Primeiro: a PF
  fundamentou o pedido de nova busca em seu endereço atual citando o "Projeto DV" — a campanha de
  influenciadores já mapeada no acervo via INQ 5.035 — como indício de novos crimes; a PGR concordou. É o
  primeiro elo explícito entre as duas frentes. Segundo: a procuração e os substabelecimentos anexados
  revelam os números completos do processo pré-STF (10ª Vara Federal Criminal da SJDF), até aqui só
  existentes truncados num slug de fonte — e confirmam, por documento primário, que Walfrido Warde já não
  assinava as petições da defesa em 14/01/2026. Terceiro: a própria defesa de Vorcaro confirmou, em
  petição do mesmo dia, que ele foi alvo da busca de 14/01/2026 — corroboração por fonte independente do
  que já era conhecido pela cobertura oficial do STF.'
