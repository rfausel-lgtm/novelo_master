title: Lote 107 — a namorada de Andrei fez lobby registrado para a Ambipar, alvo da Compliance Zero
summary: 'A partir de lead trazido pelo editor (post do Poder360), apurado o lobby formal e registrado
  (e-Agendas/CGU) que Renata Varandas — jornalista, sócia de relações governamentais e namorada pública,
  desde 2025, do diretor-geral afastado da PF, Andrei Rodrigues — fez para a Ambipar em quatro reuniões
  federais ao longo de 2026. Confirmado que a Ambipar é investigada na Compliance Zero por um mecanismo
  distinto do já registrado no corpus (Texas I FIA): venda de títulos podres do Master ao BRB, com busca
  na casa de uma vice-diretora da empresa em janeiro de 2026. Não foi localizada qualquer ação ou omissão
  de Andrei vinculada a esse conflito de interesse potencial — seu afastamento teve motivo diverso, já
  apurado no lote 105. Nenhuma das partes respondeu até a publicação. Tratada com reserva explícita uma
  alegação de ''contrato milionário'' pessoal, de veículo de menor rigor editorial, não sustentada pelo
  próprio texto que a veicula.'
