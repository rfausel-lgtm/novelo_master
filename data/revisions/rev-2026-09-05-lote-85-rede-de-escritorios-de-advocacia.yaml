title: 'Lote 85 — a rede de escritórios: quatro identidades verificadas, uma genealogia com cautela'
summary: 'O Banco Master pagou R$ 543 milhões a 91 escritórios de advocacia entre 2022 e 2025, saltando
  de R$ 40,1 milhões para R$ 262,4 milhões no período. A equipe verificou pessoalmente, no dump oficial
  da Receita Federal — não em agregador privado —, a identidade de cinco escritórios: Temer Advogados
  Associados, administrado pelo próprio Michel Temer; Lewandowski Advocacia, que na data desta consulta
  ainda lista Ricardo Lewandowski como sócio-administrador, divergência registrada como pergunta em aberto;
  Gabino Kruschewsky, cujo sócio é apontado por reportagem, sem confirmação documental, como primo do
  diretor jurídico do Master; Warde Advogados, do ex-procurador do Banco Central e advogado pessoal de
  Vorcaro por quase uma década, alvo de alegação grave sobre proximidade com juiz do caso; e Monteiro
  Sociedade de Advogados, cujo sócio foi preso e acusado de operar esquema paralelo de propina ligado
  à tentativa de compra do banco pelo BRB. Achado cruzado: André Kruschewsky Lima, o executivo que assinou
  o credenciamento do Master em Alagoas, é situado por reportagem como diretor jurídico do banco no mesmo
  relatório da PF sobre a emenda ao FGC que o corpus já registrava como hipótese não atribuída pessoalmente.
  A genealogia Kruschewsky e a autoria da contratação são registradas como classe C, por decisão editorial
  explícita — não como fato documentado.'
