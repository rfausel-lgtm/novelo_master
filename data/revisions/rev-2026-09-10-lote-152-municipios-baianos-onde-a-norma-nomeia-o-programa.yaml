title: Lote 152 — os municípios baianos, onde a norma nomeia o programa
summary: 'Varredura sistemática de 409 das 421 sedes municipais baianas, com sete grafias de busca e controle
  metodológico por termos inexistentes, que localizou instrumentos com a operadora em sete municípios
  entre 2020 e 2024. O achado central não são os convênios, e sim os decretos que os precedem. Nos estados,
  as normas criaram uma categoria genérica de cartão de benefício, e a operadora entrou depois por credenciamento;
  em municípios baianos, a norma nomeia o programa privado e lhe reserva margem. O decreto de Itapetinga,
  de março de 2021 e lido pela equipe no PDF oficial, determina que dos 20% da remuneração destinados
  a cartão de crédito, 15 pontos vão ''exclusivamente para o cartão de crédito previsto no Programa CREDICESTA''
  e 5 para todos os outros cartões somados. Senhor do Bonfim e Juazeiro reservaram 20%; Irará chega a
  30%, a maior margem exclusiva de toda a investigação, embora ali não se tenha localizado convênio nem
  menção à operadora. Registram-se ainda três achados de textura: em Juazeiro, a companhia estatal municipal
  de trânsito firmou termo próprio, replicando o que em São Paulo ocorreu com o serviço funerário e o
  hospital do servidor; em Alcobaça, o convênio foi publicado com número e data de assinatura em branco,
  embora fixe vigência de sessenta meses ''a contar da assinatura''; e os mesmos dois representantes assinam
  pela empresa em municípios de estados diferentes, o que reforça o achado de que a minuta era da empresa
  e viajava com ela. Nenhum município baiano publicou ato de rescisão após a liquidação do banco — o ato
  mais recente da série é de julho de 2024. Fica registrada, por fim, a cautela metodológica que evita
  erro futuro: buscar ''PKL'' isolado retorna dezenas de municípios por placas de veículo em editais de
  trânsito, e ''Credicesta'' aparece em decretos referindo-se ao programa estadual de 2018 sem vínculo
  com a operadora.'
