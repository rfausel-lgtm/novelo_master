reason: >-
  Linha WA1 (Ciro Nogueira, Hugo Motta e Fábio Faria), liberada pelo investigador-chefe em 16/10/2026; primeiro
  dos lotes 350 e 351 sobre conversas vazadas. Orientação editorial de Rafael aplicada: conexões e proximidade
  entre agentes e o investigado entram, e o teor só em trechos curtos, atribuídos e já publicados (EDITORIAL
  §6), aqui reduzidos a designações da própria fonte; vocabulário de imputação não entra em texto próprio;
  mensagem juntada aos autos prova que existe no aparelho periciado, não que o
  conteúdo é verdadeiro; o rastro (fonte, data, interlocutores, documento de origem) fica completo para
  corroboração futura. Inclui a correção obrigatória de dados pessoais (telefones) no acervo.
