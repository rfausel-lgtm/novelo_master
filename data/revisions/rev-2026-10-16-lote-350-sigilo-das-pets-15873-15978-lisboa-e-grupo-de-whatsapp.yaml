corrections:
- 'doc-2026-03-18-ipj-1752768-celular-marilson: o campo excerpt reproduzia o número de um terminal telefônico internacional com código de país (EDITORIAL §6); o número foi substituído por "[número omitido pelo Novelo]", mantidos o codinome, o país e a atribuição.'
- 'ev-terminais-telefonicos-internacionais-da-organizacao: a proposição reproduzia os números de cinco terminais telefônicos internacionais; foram retirados, mantidos os codinomes, os países, as atribuições da PF e o número de terminais; a nota que dizia trazer "o número específico" foi reescrita; na proposição, "revelou" passou a "registrou" (EDITORIAL §3).'
- 'sebastiao-monteiro-junior: o resumo reproduzia o número do terminal internacional atribuído a ele e qualificava, em texto próprio, o padrão de comunicação como "clandestino"; reescrito como descrição atribuída à PF, sem o número (achado na varredura de data/ pelos mesmos terminais).'
- 'ev-metropoles-omitiu-o-proprio-nome-em-duas-materias: a proposição falava em "artefatos datados de omissão" e sugeria intenção do veículo; reescrita como descrição neutra do que as duas publicações incluem e não incluem, com limite explícito em inference_basis (não se conclui motivo nem intenção). O id foi mantido para não romper referências.'
- 'ciro-nogueira: a pendência de que a Pet 15.873 ficara fora do levantamento de sigilo de 10/09/2026 foi superada pelo despacho de 11/09/2026 na Pet 16.704 e marcada como resolvida; retirada de outra pendência a justaposição temporal com a Emenda 11, sem fonte que ligue os fatos.'
- 'hugo-motta: o campo why_in_novelo não mencionava Vorcaro e trazia juízo próprio ("ação institucional da própria cúpula da Câmara"); reescrito em frase única; o resumo deixou de usar, em texto próprio, a palavra "esquema" e passou a atribuir ao Poder360 o pedido da Mesa Diretora.'
- 'fabio-faria: no resumo, "articulação de encontros" passou a "organização de encontros".'
- 'rel-daniel-vorcaro-ciro-nogueira-allegation: a descrição dizia que a posição do senador não fora localizada, embora a negativa de 12/05/2026 já constasse do próprio registro; corrigido.'
- 'Correções ao plano de redação (não são de registro publicado): (1) no portal, o ato de 24/06/2026 é rotulado "Despacho", mas o documento se intitula "Decisão"; (2) o despacho de 11/09 registra o pedido do Vice-PGR e afirma "não haver impedimento ao levantamento dos correspondentes sigilos", sem a fórmula "a pedido"; (3) a frase atribuída à Gazeta do Povo de 16/06 ("os dados vêm da reportagem, não dos relatórios originais") não foi encontrada no texto; (4) "cerca de R$ 90 mil para cada um" não é literal no Estadão Conteúdo e entra em paráfrase; (5) "evento corporativo, encontro jurídico" está no Correio Braziliense e na Gazeta do Povo, não no Correio da Manhã, que traz o jato, o convite e as duas diárias; (6) "descontextualizadas" e a confiança nas investigações não constam da nota publicada às 22h26 pela CNN, e entram só em paráfrase da versão do blog; (7) o Congresso em Foco não afirma de forma explícita que a Pet 15.873 teve o sigilo levantado; (8) o cabeçalho do despacho de 16/06 traz as partes "sob sigilo", por isso a PF não figura como participante do evento de 16/06; (9) eventos não têm campo notes, e a divergência sobre a posição dos citados em 30/09 ficou nas notes de ev-uol-grupo-de-whatsapp-ciro-daniel-fabio-hugo; (10) o UOL fala em encontros e viagens; o jantar que menciona é familiar e não entra, e o id da evidência foi ajustado; (11) as duas fontes da InfoMoney são registradas pelo permalink, e a de 25/06 é da Agência O Globo.'
