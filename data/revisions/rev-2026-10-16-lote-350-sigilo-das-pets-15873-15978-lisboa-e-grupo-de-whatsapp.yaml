title: 'Lote 350 — O vaivém do sigilo das Pets 15.873 e 15.978 no STF (levantado em 16/06, restabelecido em 24/06, levantado de novo em 11/09); o que a imprensa descreve dos relatórios da PF sobre a hospedagem em Lisboa paga por Vorcaro a Ciro Nogueira e Hugo Motta; o grupo de WhatsApp “Ciro Daniel Fábio Hugo”; e os contatos entre Vorcaro e Motta'
summary: >-
  Primeiro dos dois lotes sobre conversas do celular de Daniel Vorcaro publicadas pela imprensa. O que NÃO se
  afirma, em destaque: o Novelo não localizou documento oficial do relatório da PF sobre Lisboa (a Pet, a data
  e um PDF não constam das fontes; tudo o que se registra dele é descrição de imprensa, classe A); Hugo Motta
  não é investigado segundo as reportagens, e o Novelo não localizou documento oficial sobre isso; e mensagem
  que exista no aparelho periciado prova que ela está lá, não que o conteúdo seja verdadeiro. Camada D, só
  quanto ao conteúdo de cada ato, lidos no portal do STF em 16/10/2026: em 16/06/2026, despacho de André
  Mendonça na Pet 15.873 levanta o sigilo das Pets 15.978 e 15.873 pela inclusão em pauta, "de última hora", da
  devolução de vista na Segunda Turma, no dia em que a Turma referendou as prisões de Henrique e Felipe
  Vorcaro; em 24/06, decisão na mesma Pet determina "o restabelecimento do sigilo anteriormente vigente" nas
  duas, "para a retomada do trâmite processual"; em 11/09, despacho na Pet 16.704 registra o pedido do
  Vice-PGR de levantamento do sigilo de 18 Pets, entre elas a 15.873, afirma não haver impedimento e, de
  ofício, levanta o de outra lista que inclui a Pet 15.674; a Pet 15.978 não consta de nenhuma das listas. A
  sequência dos três atos tem causalidade não comprovada. Camada A: segundo CNN Brasil, Poder360, IstoÉ,
  Metrópoles e Agência O Globo (16/06), relatório da PF registra que em 18/06/2024 Vorcaro pediu a "Leo
  Serrano" reservas no Four Seasons de Lisboa para si e para "Ciro" e "Hugo", que uma fatura registra cinco
  diárias e 3.155,71 euros em duas suítes júnior e que a PF identifica os dois como Ciro Nogueira e Hugo Motta
  pelas mensagens, pela lista de nomes e pela fatura. Os valores ficam em disputa, cada um atribuído ao
  veículo: R$ 91.280,59 por cinco diárias atribuídas a Ciro (R$ 18.256,12 por dia, segundo a Agência O Globo);
  cerca de R$ 90 mil por pessoa (Estadão Conteúdo); cerca de R$ 18 mil ou R$ 20.038,76 pela fatura; R$
  16.784,89 de diárias pagas pelo Senado ao senador (Correio Braziliense). A Agência O Globo registra estimativa
  da PF de R$ 468.721,78 em viagens e jantares e um pedido de cautela da PF com referências a "Ciro" em listas
  de pagamentos, por possível homônimo. Motta afirmou em 16 e 17/06 que viajou no jato de Vorcaro a convite de
  Ciro, que teve duas diárias pagas (a PF conta cinco) e que se tratava de evento corporativo; Fábio Faria disse
  à Folha (via Brasil 247) que não esteve em Lisboa em 2024; a defesa de Ciro diz que prestará esclarecimentos
  nos autos. Segundo o UOL (30/09, uma origem, sem relatório, Pet ou decisão), Vorcaro, Ciro, Motta e Faria
  participavam do grupo de WhatsApp "Ciro Daniel Fábio Hugo", criado por Ciro em abril de 2024, com
  apagamento em 90 dias e conteúdo preservado de 20/08 a 17/11/2025, para combinar encontros e viagens; os três
  preferiram não comentar. Segundo a CNN Brasil (29/09, uma origem), registros extraídos pela PF mostram ao
  menos 100 chamadas concluídas e 102 não concluídas entre Vorcaro e Motta e ao menos 19 encontros combinados
  de 03/2024 a 10/2025; a assessoria de Motta diz que não há ilícito nos diálogos publicados. O "Leo Serrano" de Lisboa é
  tratado como o Léo Serrano do acervo por inferência (classe I), com limite escrito. Nenhuma mensagem é
  transcrita; nenhuma pessoa ou organização nova. Corrigido no acervo: números de terminais telefônicos
  internacionais retirados de três registros, linguagem de insinuação em evidência sobre o Metrópoles,
  pendência superada sobre a Pet 15.873 e textos antigos de Ciro Nogueira, Hugo Motta, Fábio Faria e de uma
  relação. Não confirmado: a Pet do relatório; o estado do sigilo da Pet 15.978; os valores; o número de
  diárias; a identidade plena de Serrano; o conteúdo do grupo antes de 20/08/2025.
