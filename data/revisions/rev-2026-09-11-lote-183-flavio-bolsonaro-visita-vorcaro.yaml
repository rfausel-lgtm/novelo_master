title: 'Lote 183 — Flávio Bolsonaro visitou Vorcaro sob cautelares, segundo notícia-crime desentranhada da PET 15.556'
summary: 'Décimo quarto documento explorado do acervo de 416 peças da PET 15.556: o e-Doc 345, despacho de
  12/07/2026 que desentranha duas notícias-crime contra o senador Flávio Bolsonaro para autuação autônoma.
  Uma delas, da deputada Luciene Cavalcante, trata do já conhecido financiamento do filme Dark Horse. A
  outra, do deputado Henrique dos Santos Vieira Lima, traz um fato novo: Flávio Bolsonaro visitou Daniel
  Vorcaro em sua residência particular em São Paulo no final de 2025 — período em que o banqueiro já
  cumpria restrições cautelares —, fato que o próprio senador confirmou ao jornal O Globo (19/05/2026)
  segundo o relato da notícia-crime. O despacho também confirma os números de processo de quatro petições
  conexas sobre o caso Dark Horse (Pet 16.292, 16.078, 16.063, 16.059), duas delas já identificadas no lote
  182.'
