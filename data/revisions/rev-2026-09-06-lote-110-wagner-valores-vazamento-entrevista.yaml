title: 'Lote 110 — Jaques Wagner: os valores apreendidos, a suspeita de vazamento, e a entrevista de hoje'
summary: 'Complementado o dossiê já detalhado de Jaques Wagner com achados específicos: valores exatos
  apreendidos na busca de 18/06 (US$ 55 mil, € 33 mil), pedido pendente de anulação ao STF, a suspeita
  do próprio Mendonça sobre possível vazamento ao publicizar a Pet 16.210, a representação por quebra
  de decoro parada pela paralisia estrutural do Conselho de Ética do Senado (não por decisão específica
  sobre o caso), o quadro eleitoral misto entre institutos de pesquisa, e uma entrevista de hoje (08/09/2026)
  em que Wagner atribui o escândalo a Bolsonaro/Campos Neto, chama Vorcaro de ''marginal'' e cita um valor
  de ''setenta e tantos milhões'' dado a Flávio Bolsonaro — aproximando-se, em ordem de grandeza, do que
  já se sabia por outra via (delação de Freixo/''Mineiro'') sobre o financiamento do filme ''Dark Horse''.'
