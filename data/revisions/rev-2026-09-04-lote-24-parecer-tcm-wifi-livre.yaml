title: 'Lote 24: o parecer do TCM-SP e o escândalo de dados no caso WiFi Livre SP'
summary: 'Fecha item de backlog (TCM e Termo de Colaboração 01/SMIT/2024): o TCM-SP identificou 20 irregularidades
  no edital em abril de 2024 e recomendou suspensão — ignorada pela SMIT, que seguiu com um único concorrente
  (Instituto Conhecer Brasil) sem experiência técnica prévia em comunicações. O contrato de R$ 108 milhões
  chegou a R$ 157,1 milhões por três aditivos, com cerca de R$ 26 milhões pagos sem comprovação de execução.
  Acrescenta o escândalo de dados: contatos de usuários do wi-fi gratuito repassados à Talk Communications
  (disparo em massa) e ao Instituto Orbis (pesquisas), sem consentimento — via Jornal GGN, com a fonte
  primária (Intercept Brasil) bloqueada para leitura direta.'
