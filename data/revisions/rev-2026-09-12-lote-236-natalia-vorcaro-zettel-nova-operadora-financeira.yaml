title: 'Lote 236 — Natália Vorcaro Zettel: apontada como nova operadora financeira de "A Turma" após a
  prisão do marido'
summary: 'Primeiro lote de uma nova frente: a leitura de decisões públicas do STF (portal, sem
  necessidade de certificado) ainda não mineradas para os processos do despacho de 10/09/2026. A decisão
  de 19/06/2026 na PET 15.693/DF (Min. André Mendonça) — pedido complementar de afastamento de sigilo de
  dados armazenados junto a Apple, Google e Microsoft para 17 pessoas do núcleo "A Turma" — traz, segundo a
  própria PGR citada no texto, apenas um elemento genuinamente novo: elementos da IPJ nº 2293065/2026
  apontam Natália Bueno Vorcaro Zettel como possível nova operadora financeira do núcleo, assumindo esse
  papel após a prisão do marido, Fabiano Zettel, em março de 2026. Os outros 16 nomes já tiveram sua
  situação "exercida de modo satisfativo" em petições anteriores, segundo a própria PGR.'
