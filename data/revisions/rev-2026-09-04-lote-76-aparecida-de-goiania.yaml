title: 'Lote 76 — Aparecida de Goiânia: a mesma vendedora, e um controle contornado'
summary: Segundo caso documentado do canal de colocação, e o mais grave até aqui. Em 20/12/2023, três
  meses antes do Amapá, a mesma representante do Banco Master participou por videoconferência da sessão
  que credenciou o banco no regime próprio de Aparecida de Goiânia. Em 28/02/2024 o conselho rejeitou
  por sete votos a três a proposta de reduzir a exigência de rating da política de investimentos — proposta
  que um conselheiro perguntou em ata se seria 'para atender somente ao Banco Master', e que o diretor
  financeiro confirmou ser a única instituição credenciada fora do enquadramento, por não constar da lista
  exaustiva. Em 06/06/2024 os R$ 40 milhões foram aplicados assim mesmo; o conselho só registrou conhecimento
  em setembro. Em audiência pública de dezembro de 2025 a direção da autarquia confirmou não existir documento
  formal de aprovação. Atas obtidas do site oficial e submetidas a reconhecimento óptico pela equipe,
  por não terem camada de texto.
