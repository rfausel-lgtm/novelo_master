title: 'Lote 27: a reação interna da PF à convocação de 24/08/2026'
summary: 'Acrescenta ao evento já registrado sobre o ofício de 27/08/2026 (envio do IPJ-A à Mendonça)
  a reação interna da PF ao despacho que o originou: delegados convocados sob pretexto de outro tema foram
  confrontados, em 24/08/2026, com despacho pronto exigindo análise do celular de Vorcaro em 72 horas
  — episódio que a cúpula da corporação temeu pudesse comprometer outros inquéritos da Compliance Zero
  por risco de nulidade colegiada. Converge com o argumento da PGR (lote 21).'
