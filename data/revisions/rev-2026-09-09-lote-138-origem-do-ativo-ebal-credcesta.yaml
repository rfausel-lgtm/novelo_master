title: 'Lote 138 — a origem do ativo: a privatização da Ebal, o desenho do CredCesta e o roteiro repetido
  em quatro estados'
summary: 'Retomada da investigação sobre Augusto Lima pelo ângulo que o próprio acervo declarava em aberto:
  faltavam os documentos da venda da estatal e do contrato do CredCesta. A leitura do texto legal oficial
  fechou parte da lacuna e corrigiu um erro do corpus — o registro de que a Ebal fora vendida ''no governo
  de Jaques Wagner, segundo a assessoria do senador'' estava incorreto e atribuía à assessoria afirmação
  que ela não fez. O que está documentado é mais específico: Wagner sancionou, como governador, a lei
  de 2014 que autorizou a alienação, e em 2018 chefiava a secretaria cuja comissão conduziu o leilão,
  já no governo Rui Costa. Registrados ainda: os três leilões, de R$ 81 milhões de lance mínimo até a
  arrematação por R$ 15 milhões, numa companhia de R$ 929 milhões de capital social, com R$ 93 milhões
  de passivo assumidos pelo Estado; o desenho jurídico central, em que o direito de descontar na folha
  foi transferido dentro da própria empresa vendida, por decretos editados após o leilão; e a constatação,
  feita artigo por artigo, de que a alegada exclusividade de quinze anos NÃO consta dos decretos. O achado
  que ultrapassa a Bahia é o roteiro replicado em pelo menos quatro estados — primeiro um decreto cria
  margem consignável exclusiva para cartão de benefício, dias depois vem o credenciamento —, sem padrão
  partidário algum. E o efeito na ponta: servidores seguiram com desconto em folha após as liquidações,
  enquanto liquidante e operadora disputavam os mesmos créditos. Nova organização: a NGVSPE, arrematante
  constituída 103 dias antes do leilão.'
