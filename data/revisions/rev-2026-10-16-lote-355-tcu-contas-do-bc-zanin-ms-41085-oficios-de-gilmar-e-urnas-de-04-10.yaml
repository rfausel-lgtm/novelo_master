title: 'Lote 355 — O TCU sobresta o julgamento das contas de 2025 do Banco Central até o desfecho da representação sobre a supervisão do Master; Zanin indefere a liminar para instalar a CPI do Master no Senado (MS 41.085); os ofícios de Gilmar Mendes sobre precatórios; Galípolo ouvido pela PF; e o resultado oficial das urnas de 04/10 nos verbetes do acervo'
summary: >-
  Lote de outros controles institucionais e do resultado das urnas. O que NÃO se afirma, em destaque: o
  Acórdão 5163/2026 do TCU não aponta irregularidade de ninguém, e os "responsáveis" que lista (o presidente do
  Banco Central e outros oito gestores, cujos CPFs mascarados não são registrados) são os gestores que prestam as
  contas; a decisão de Zanin é sobre liminar, não sobre o mérito; os ofícios de Gilmar não foram publicados; o
  conteúdo do depoimento de Galípolo não foi divulgado; e a eleição não liga ninguém ao caso: os verbetes
  ganham só cargo, votos e percentual do TSE, sem evento, relação ou leitura de conjunto. Camada D, quanto ao
  conteúdo de cada ato: em 13/10/2026 a 2ª Câmara do TCU (Ata 35/2026, relator Jorge Oliveira), no TC
  007.138/2026-1, acordou "em sobrestar o julgamento destas contas até o trânsito em julgado da deliberação a
  ser proferida no TC Processo 022.950/2025-7", quando a unidade técnica avaliará se o TC 008.216/2025-8 e a
  Reclamação 88.121 do STF podem influir no mérito; a AudBancos propunha julgar as contas regulares, com
  quitação plena, e o sobrestamento segue o parecer do MPTCU. O termo é "sobrestar"; a imprensa disse
  "suspender" ou "adiar". O TC 022.950/2025-7 é a representação do MPTCU sobre a atuação do BC na supervisão e
  na resolução do Master (relator Jhonatan de Jesus), sobrestada em 24/03/2026 até elementos oficiais da
  sindicância do BC, do PAD da CGU e das apurações no STF, segundo cópia do despacho hospedada pelo Poder360
  (classe A até a conferência do código de autenticidade); no TC 008.216/2025-8, de relatoria de Jorge
  Oliveira, está sobrestado pedido de reexame ligado à operação BRB–Master. No portal do STF, o MS 41.085,
  impetrado em 15/09 por Alessandro Vieira contra o Presidente do Senado para instalar a CPI do Master, teve a
  liminar indeferida por Cristiano Zanin em 22/09/2026 (não 23/09, data da publicação e das notícias), com
  reconsideração em 25/09, ofícios ao Senado e à AGU em 28/09, agravo regimental em 29/09, petição do tipo
  "Informações" em 13/10 e vista à PGR em 14/10; é processo distinto do MS 40.791 (Câmara). Camada A: os
  fundamentos da liminar (omissão não comprovada naquele momento, outro requerimento sobre o tema, possível
  reexame, direito das minorias), segundo a Agência Brasil e o Congresso em Foco; Vieira chamou a decisão de
  "uma decepção". Camada C: segundo o SBT News e a Agência Estado, em 29/09 Gilmar Mendes oficiou Fachin e
  Salomão pedindo sustar decisões que expediram precatórios antes do trânsito em julgado e correição
  extraordinária nos TRFs, sobretudo no TRF-1, e atribuiu às investigações do Master a revelação de "um modelo
  de negócios parasitário"; o pedido ao BC e à CVM está só na Agência Estado. Camada A: segundo a Agência
  Estado, Galípolo disse em 24/09 ter sido intimado pela PF a depor sobre a fiscalização do Master, e
  a agência informa que os intimados seriam ouvidos como testemunhas; segundo o SBT News, fonte única, depôs em 06/10, com conteúdo não divulgado. Urnas (D,
  arquivos oficiais do TSE lidos em 16/10/2026): Flávio Bolsonaro 47,03% e Lula 45,16% vão ao 2º turno de 25/10;
  Celina Leão 49,93% e Leandro Grass 34,47% vão ao 2º turno no DF; Jerônimo Rodrigues reeleito (55,80%);
  ACM Neto não eleito (43,72%); Rui Costa (30,07%) e Jaques Wagner (27,65%) eleitos senadores pela Bahia; JHC
  eleito governador (52,20%) e Arthur Lira senador (28,87%) por Alagoas; Ciro Nogueira não reeleito (24,68%,
  terceiro em duas vagas); Hugo Motta, Nikolas Ferreira e Mario Frias reeleitos e Antonio Rueda eleito
  deputados federais por quociente partidário. Ibaneis Rocha não consta entre os candidatos a governador,
  senador, deputado federal ou distrital do DF, e seu cargo não foi alterado. Uma pessoa nova, Jorge Oliveira,
  identificado pelo cargo de ministro do TCU. Checagens negativas, só em pendências: o PAS CVM de Benjamim
  Botelho não está na pauta da CVM atualizada em 09/10; nada novo na PET 16.230 nem no Rioprevidência; nenhuma
  nota do BC sobre o sobrestamento. Não confirmado: inteiro teor da liminar de 22/09; julgamento do agravo;
  teor dos ofícios de Gilmar e respostas; autenticidade do despacho de 24/03; Ata 35/2026; cargo disputado por
  Ibaneis em 2026, se algum.
