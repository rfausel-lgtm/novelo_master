corrections:
- 'tribunal-de-contas-da-uniao: o resumo tratava só da inspeção concluída em fevereiro de 2026; passa a registrar a segunda frente (despacho de 24/03/2026 no TC 022.950/2025-7 e Acórdão 5163/2026, de 13/10/2026).'
- 'rel-tribunal-de-contas-da-uniao-banco-central-do-brasil-institutional: rótulo e descrição atualizados com o sobrestamento das contas de 2025; evento e evidência novos ligados; classe mantida.'
- 'joao-henrique-caldas: o papel dizia "candidato ao governo de Alagoas"; passa a "governador eleito de Alagoas (PSDB) em 2026". O plano pedia corrigir a position "Prefeito de Maceió" sem organization_id; ela já trazia o texto "Prefeitura Municipal de Maceió" e foi mantida, sem datas inventadas.'
- 'jeronimo-rodrigues, rui-costa, jaques-wagner, antonio-rueda: os percentuais e votos divulgados pela imprensa durante a apuração (Jerônimo 55,41%; Rui e Wagner 29,06%/27,53% ou 29,79%/27,35%; Rueda 146.992 votos) eram parciais e não foram usados; os registros trazem os números da totalização do TSE (55,80%; 30,07%; 27,65%; 155.836 votos). Nenhum dos números parciais constava do acervo.'
- 'Correções ao plano de redação (não são de registro publicado): (1) a decisão de Zanin no MS 41.085 é de 22/09/2026, não de 23/09; (2) o relator do TC 008.216/2025-8 é Jorge Oliveira; (3) o PAS CVM 19957.008699/2019-01 não consta da pauta da CVM de outubro; (4) a evidência do despacho de 24/03/2026 ficou em A, e não em D, porque o modelo de dados exige documento primário para D e o despacho, lido só em cópia, não ganhou documento próprio; (5) para a camada D do MS 41.085 foi criado documento com o registro oficial de andamentos, pela mesma exigência; (6) o pedido de Gilmar ao BC e à CVM está só na Agência Estado, não no SBT News; (7) a página do Diário do Grande ABC não traz assinatura, e a origem Agência Estado se apoia no rótulo de autoria "da-ae" da página.'
