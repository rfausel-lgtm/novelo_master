reason: >-
  Linhas C e D, liberadas pelo investigador-chefe em 16/10/2026 no bloco "outros controles e a urna"
  (renumerado de 353 para 355). Cada fonte nova foi reaberta e lida em 16/10/2026; as citações entre aspas
  foram conferidas no texto das fontes. Regras aplicadas: atos de controle registrados pelo que decidem, não
  como juízo sobre pessoas; termo do acórdão ("sobrestar") preservado; nenhum CPF, data de nascimento ou outro
  dado pessoal dos documentos; resultado eleitoral só com números do TSE, sem evento nem relação, sem leitura
  de conjunto dos eleitos e sem ligação com o caso; checagens negativas só em pendências e posições. Para
  evitar colisão com lote em redação paralela, davi-alcolumbre não foi alterado (a posição dele fica no evento)
  e, em antonio-rueda e acm-neto, só mudaram cargo e resumo eleitoral.
