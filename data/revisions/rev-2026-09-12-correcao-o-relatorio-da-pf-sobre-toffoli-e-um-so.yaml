title: 'Correção — o relatório da PF sobre Toffoli é um só, e registra 12 encontros com Vorcaro'
summary: 'O lote 262 deixou em aberto se "mais de 80 páginas" e "196 páginas" descreviam dois relatórios da PF sobre Dias
  Toffoli. Não descrevem: o Correio Braziliense trata no mesmo texto a IPJ-A nº 893171/2026 e o relatório de quase
  duzentas páginas como um único documento. A mesma reportagem acrescenta que a PF documentou ao menos 12 encontros
  presenciais entre o ministro e Daniel Vorcaro entre o fim de 2023 e o início de 2025 e 167 ligações por aplicativo, e
  que os ministros que analisaram o relatório decidiram arquivá-lo.'
