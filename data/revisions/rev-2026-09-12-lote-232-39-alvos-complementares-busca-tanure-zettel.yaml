title: 'Lote 232 — os 39 alvos complementares de busca de 08/01/2026, com residências de Tanure e de
  Zettel incluídas'
summary: 'Uma decisão de Dias Toffoli até aqui ausente do acervo, de 08/01/2026, deferiu parcialmente
  busca e apreensão contra uma lista complementar de 39 alvos (34 pessoas físicas e 5 empresas) na
  investigação sobre o Banco Master — excluindo apenas três já alcançados por diligências anteriores.
  Entre os alvos com busca domiciliar deferida estão Nelson Tanure e Fabiano Zettel (com a esposa Natália
  Vorcaro Zettel) — medida de busca e apreensão, distinta e anterior à busca pessoal em aeroportos de
  13-14/01/2026 já registrada, sem qualquer nova alegação de "sócio oculto". Julia Grasiela de Oliveira
  Freixo, no mesmo endereço de Antonio Carlos Freixo Júnior (delator premiado já registrado no acervo),
  ganha registro próprio, com o possível vínculo entre os dois tratado como hipótese, não fato.'
