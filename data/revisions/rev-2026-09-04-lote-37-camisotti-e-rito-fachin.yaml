summary: 'Pesquisa conduzida por agente convocado em paralelo. Detalha o conteúdo do relatório da PF que
  Moraes usou contra Mendonça (lote 28): a alegação de que Mendonça sugeriu benefício ilegal ao delator
  Maurício Camisotti, com a própria PF classificando como apenas ''moderada'' a confiança sobre se a fala
  de fato ocorreu. Registra também o rito processual definido por Fachin em 04/09/2026 — PGR analisa admissibilidade
  antes de Mendonça se manifestar.'
