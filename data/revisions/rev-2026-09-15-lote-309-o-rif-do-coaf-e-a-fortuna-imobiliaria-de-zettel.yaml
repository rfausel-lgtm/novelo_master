title: 'Lote 309 — o RIF do COAF revela a igreja de Zettel, seus carros de luxo e a fortuna imobiliária da
  Super Empreendimentos'
summary: 'A pedido de Rafael, análise do RIF nº 140515 do COAF (fev/2026), anexo à Pet 15.645/DF, cujo
  sigilo Mendonça levantou em 14/09/2026 a pedido de Fachin — que atendia, por sua vez, pedido do próprio
  Alexandre de Moraes de que o conteúdo fosse disponibilizado ao colegiado antes da sessão de 15/09/2026.
  O documento detalha quatro núcleos de comunicações suspeitas: (1) a Igreja Batista da Lagoinha (Belvedere),
  da qual Fabiano Zettel foi pastor até novembro de 2025, recebeu dele R$ 19,2 milhões e de Henrique Vorcaro
  (pai de Daniel Vorcaro) R$ 120 mil — o COAF classifica a comunicação citando a "relação financeira íntima
  do outorgado [Zettel] em possíveis ilicitudes"; (2) a Moriah Asset (empresa de Zettel) comprou R$ 4,95
  milhões em veículos de luxo em 2025; (3) a Super Empreendimentos e Participações (ligada a Daniel Vorcaro)
  movimentou mais de R$ 250 milhões em imóveis entre 2022 e 2024, incluindo a compra de um imóvel de R$ 50
  milhões de Alexandre Café Birman e a doação de um imóvel de R$ 4,347 milhões a Karolina Santos Trainotti
  — doação já sinalizada pela imprensa sem identificar beneficiária nem signatária, agora esclarecida: quem
  assinou foi Ana Cláudia Queiroz de Paiva, diretora da empresa; (4) a Pipe Participações (empresa de Zettel)
  e a Noah Empreendimentos registram pequenas transações em Guaxupé/MG em 2024, cidade onde o delator Paulo
  Sérgio já relatara ter vendido um sítio a Zettel em 2020 — conexão sugerida, não confirmada. O universo
  total do RIF soma 823 pessoas físicas e jurídicas relacionadas; apenas o subconjunto em que a pessoa
  figura como titular foi detalhado nesta peça — os demais nomes ficam registrados nas evidências como
  referência para eventual conexão futura, sem entidade própria nesta rodada. Nenhum CPF/CNPJ de terceiros
  foi reproduzido no acervo.'
