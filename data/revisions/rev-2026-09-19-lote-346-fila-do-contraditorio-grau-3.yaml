title: 'Lote 346 — fila do contraditório grau 3: o conselheiro do Amapá que hoje é procurador-geral, e
  mais quatro achados'
summary: 'Terceira rodada da fila de contraditório (20 nomes de grau 3). Seis achados, dois falsos
  positivos descartados na verificação. O mais substancial: Alexandre Flávio Medeiros Monteiro, um dos
  dois conselheiros do CIAP que votaram contra um aporte no Master em 19/07/2024, é hoje — desde
  10/03/2025 — o Procurador-Geral de Justiça do Amapá; e, onze dias depois do voto contrário, votou por
  unanimidade a favor de um terceiro aporte, dizendo-se "mais tranquilo" com a "diversificação". Também:
  Alexandre de Almeida Mendonça (irmão do Min. André Mendonça) — a Prefeitura de SP, em nota, chamou de
  "irresponsável e sem fundamento" ligar o voto do ministro à carreira dele na SP Regula; divergência de
  data sobre a promoção (26/05 segundo a decisão de Dino, julho segundo a imprensa) registrada sem
  reconciliar. André Seixas Maia (diretor da Tirreno) é alvo de uma segunda investigação, distinta e sob
  sigilo, por suposta lavagem via apostas ilegais ("tigrinho") — sua defesa nega ilícitos. Patrich e
  Bonnie Toaldo Bonilha tiveram pedido de busca e apreensão contra eles, especificamente, indeferido por
  Mendonça na mesma decisão que atingiu outros dezoito. Armando Miguel Gallo Neto e Felipe Wallace
  Simonsen, do grupo de controle de 2019, dividiram o comando do banco com Vorcaro e Augusto Lima — achado
  menor. Dois falsos positivos descartados por verificação direta: uma nota de Arthur Lira que um resumo
  de busca atribuiu à acusação de Glauber Braga sobre desvio de emendas era, na fonte real, sobre um
  assunto totalmente distinto (a cassação de mandato de Braga, de 2025); e uma "negativa de Luiz Rennó
  Netto" era, na fonte real, uma nota de Augusto Lima, que só cita Rennó Netto de passagem. Nos outros
  onze nomes (Alfredo Gaspar, Antônio Augusto Conte, Artur Martins de Figueiredo — já checado no lote 341,
  Beto Simonetti, Eduardo Girão, Fernando de Goes, Gláucio Maciel Bezerra, João Manoel Pinho de Mello,
  Lauro Jardim, Raul Aguirre Zegarra, Roberto Coutinho Schumann, Sidnei Corrêa Marques) busca dedicada não
  encontrou manifestação nova — "não localizada" permanece correto.'
