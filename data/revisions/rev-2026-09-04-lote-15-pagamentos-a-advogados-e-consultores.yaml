kind: revision
date: '2026-09-03'
summary: 'Lote 15: quanto o banco pagou e a quem. Entram os R$ 304,5 milhões pagos a advogados e escritórios
  em 2025, distribuídos entre ao menos 98 bancas, com o escritório Barci de Moraes no topo (R$ 40,1 milhões
  só naquele ano); os R$ 25,8 milhões em consultorias ligadas a três ex-presidentes do Banco Central;
  o contrato de R$ 250 mil mensais com o escritório de Ricardo Lewandowski, que seguiu sendo pago por
  21 meses depois de ele assumir o Ministério da Justiça, com a nota em que afirma ter deixado a sociedade
  e suspendido o registro na OAB; e os R$ 3,8 milhões à empresa de Fabio Wajngarten para a defesa de Vorcaro,
  confirmados por ele. Registra-se também a confirmação, pelo senador Jaques Wagner, de que indicou o
  escritório de Lewandowski ao banco.'
