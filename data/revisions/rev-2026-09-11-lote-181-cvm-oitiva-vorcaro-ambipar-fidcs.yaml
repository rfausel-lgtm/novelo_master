title: 'Lote 181 — a CVM autorizada a ouvir Vorcaro sobre Ambipar e cinco fundos até então desconhecidos'
summary: 'Décimo segundo documento explorado do acervo de 416 peças da PET 15.556: o e-Doc 353, decisão de
  24/07/2026 que autoriza a CVM a colher depoimento de Daniel Vorcaro, preso, para instruir três
  Investigações Administrativas sancionadoras — sobre a Ambipar (mercados à vista e de derivativos,
  2024-2025, já no acervo por outra via — o mecanismo Texas I FIA) e sobre notas comerciais e CRIs
  adquiridos por cinco fundos até então não registrados no corpus: CITY-02 FIDC, CITY FIDC, Máxima FIM –
  Crédito Privado 2, MN I FIDC e ST 1001 FIDC. Confirma que a linha de apuração sobre a Ambipar corre como
  processo sancionador formal com Vorcaro pessoalmente na mira; os cinco fundos ficam registrados apenas
  de passagem, sem detalhamento de valores ou mecanismo — pendência para eventual aprofundamento futuro.'
