title: 'Lote 225 — o Banco Central avisou o Pleno dois meses antes da liquidação'
summary: 'O acervo já sabia, pela imprensa, que o Banco Pleno (ex-Voiter, comprado por Augusto Lima em
  2025) foi liquidado em 18/02/2026 por "deterioração da percepção de risco". A leitura direta do IPL
  2025.0087917 traz o documento que faltava: o Termo de Comparecimento 27/2025-BCB/DESUP, de 18/12/2025,
  em que o Banco Central formaliza a advertência com números precisos — Índice de Basileia de 6,64%, abaixo
  do mínimo regulatório, ~R$ 475 milhões em CDIs do Master em liquidação e R$ 2,5 bilhões em créditos FCVS
  como ativos de difícil monetização, com determinação de elevar de 20% para 150% o peso de risco sobre os
  CDIs do Master. É base documental primária que faltava, dois meses antes da liquidação. O termo também
  confirma, oficialmente, que Augusto Lima não foi convocado ao ato "por se encontrar em vacância temporária,
  em virtude da operação Compliance Zero" — e traz a diretora do Pleno que assinou, Renata Leme Borges dos
  Santos, nova no acervo.'
