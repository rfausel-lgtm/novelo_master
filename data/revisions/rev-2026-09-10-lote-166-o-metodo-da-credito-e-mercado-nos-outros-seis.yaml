title: 'Lote 166 — o método da Crédito & Mercado aplicado aos outros seis regimes da carteira'
summary: 'A decisão que autorizou a busca de 12/08/2026 na sede da Crédito & Mercado (STF, ministro André
  Mendonça) identifica sete institutos clientes que somaram cerca de R$ 232 milhões no Banco Master: Maceió
  (R$ 97 mi), São Roque (R$ 93,15 mi), Araras (R$ 29 mi), Santo Antônio de Posse (R$ 7 mi), São Gabriel do
  Oeste — já vinculado no lote 164 — (R$ 3 mi), Angélica (R$ 2 mi) e Campo Grande (R$ 1,2 mi); mais Congonhas,
  mapeado à parte por ata própria, totalizam ao menos oito. Este lote cria a relação formal entre a
  consultoria e os seis que faltavam. Dois achados repetem o padrão do SGOPrev — parecer datado que contradiz
  a negativa pública geral da empresa: em Araras, a consultoria produziu em fevereiro de 2024 um parecer
  sobre letras financeiras do Master; em São Roque, o relatório final da CPI municipal aponta que a Crédito
  & Mercado acumulava o papel de emitir pareceres de investimento e de implementar o programa Pró-Gestão
  RPPS no mesmo instituto — conflito de interesse que a CPI usa para questionar a suficiência dos pareceres
  e recomendar medidas contra a consultoria. Em Maceió, a PF vai além do parecer: aponta que a consultoria
  conduziu o credenciamento do Master e formou a documentação das operações, terceirização imprópria da
  competência administrativa do instituto — a consultoria nega, alegando confusão da PF sobre a natureza das
  Autorizações de Aplicação e Resgate (APRs) que produziu. ACHADO À PARTE: o CEO da consultoria, Renan Foglia
  Calamia, já havia sido condenado em 19/01/2026 por gestão temerária em caso anterior e não relacionado ao
  Master — a recomendação, em 2017, quando a empresa ainda se chamava PAR Engenharia Financeira, de aplicação
  de R$ 1,5 milhão do mesmo Iprem de Santo Antônio de Posse no fundo Horus Vetor. É o mesmo instituto que,
  quase uma década depois, voltou a investir por indicação da mesma consultoria — agora no Master. Corrigida
  também uma duplicação de frase pré-existente no verbete de Renan Foglia Calamia.'
