title: "Lote 377 — BRB e os 23 imóveis das CCBs do Master: Mendonça cancela indisponibilidades em 28/08 e BRB
  volta ao STF em outubro"
summary: Registra dois atos sobre seis Cédulas de Crédito Bancário cedidas pelo Banco Master ao BRB e os 23
  imóveis dados em garantia. Em 28/08/2026, segundo o Times Brasil e o Jurinews, o ministro André Mendonça
  (STF) cancelou, a pedido do BRB, as indisponibilidades que ainda os atingiam, por entender que o banco já
  fora excluído das medidas patrimoniais; segundo o Jurinews, contra parecer do MPF/PGR. Por volta de
  23/10/2026, segundo o Metrópoles, o BRB pediu ao ministro a liberação efetiva, afirmando que os imóveis
  seguem alcançados por outra ordem de indisponibilidade e que a 8ª Vara Federal indeferiu sua habilitação em
  19/10 sem exame do mérito. Decisão cautelar, sem juízo de mérito sobre o BRB ou o Master; decisão, ofício e
  despacho não localizados; desfecho do novo pedido não verificado.
