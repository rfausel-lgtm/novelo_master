reason: "Conexão institucional entre STF, BRB e Master sem registro no acervo, complementar ao lote 374. Tudo
  em classe A atribuída: nenhum documento primário foi localizado (decisão de 28/08, parecer do MPF, ofício do
  BRB e despacho de 19/10), e as matérias de agosto não declaram apuração própria. Ficaram de fora o
  levantamento parcial de julho, a vara e a data da decisão de 1ª instância que excluiu o BRB, a venda da
  carteira e as declarações nominais do presidente do BRB, por fonte única ou derivada. O desfecho do novo
  pedido não foi verificado."
