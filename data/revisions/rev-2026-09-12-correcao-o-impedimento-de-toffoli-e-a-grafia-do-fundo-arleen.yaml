title: 'Correção — onde e quando Toffoli se declarou impedido, e o nome certo do fundo Arleen'
summary: 'O acervo misturava dois episódios. A saída de Dias Toffoli da relatoria do caso Master, em 12/02/2026, foi a
  pedido dele, com os demais ministros afirmando não caber suspeição — e isso estava certo. Mas a declaração de
  suspeição por foro íntimo não foi na PET 15.556 nem em 20/03: foi no MS 40.791, o mandado de segurança sobre a CPI do
  Master na Câmara, que ele recebeu e deixou no mesmo dia, 11/03/2026, com redistribuição a Cristiano Zanin registrada
  como impedimento. 20/03 é a data da notícia do STF. Corrigida também a grafia "Arllen" para Arleen, nome do fundo que
  comprou a participação da Maridt no resort Tayayá.'
