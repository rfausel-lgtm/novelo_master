title: 'Lote 200 — As notas do iPhone: o caderno em que Vorcaro anotava quem o investigava'
summary: 'Primeiro lote extraído do e-Doc 4 da PET 15.978 — a IPJ-A nº 1020625/2026, análise forense do
  celular apreendido com Daniel Vorcaro na 1ª fase da Compliance Zero. É o documento-fonte que as
  representações vinham citando, e traz um vetor probatório novo no acervo: além dos diálogos de
  WhatsApp, as anotações que o próprio investigado mantinha no aplicativo "Notas". Quatro dias depois de
  uma reunião sigilosa entre a PF e o Banco Central, em 17/10/2025, ele registrou a lista nominal dos
  policiais federais que estiveram lá, com cargos, mais três procuradores que sequer participaram. Em
  30/10/2025 escreveu — e apagou minutos depois, com recuperação na extração — duas notas em que diz ter
  fontes dentro do Bacen ("pessoas de dentro do Bacen que são meus amigos"), classifica as informações
  como "100% confiáveis", afirma não poder "queimá-los", e pede que um interlocutor pressione as cúpulas
  da PF e da PGR para que subordinados não façam "alguma sacanagem". O lote acrescenta ainda o carimbo de
  tempo que transforma em contradição documentada o álibi da defesa sobre como soube da vara e do juiz:
  a nota sobre o juiz Ricardo Soares Leite é 19 horas anterior à reportagem que a defesa apontou como
  origem do seu conhecimento.'
