title: 'Lote 259 — o BRB queria comprar mais R$ 450 milhões do Master sem ter visto a amostra'
summary: 'Em 03/04/2025, seis dias depois de anunciar a compra do Master, o BRB preparou internamente uma proposta para
  comprar mais R$ 450 milhões em carteira de consignado do banco — somando-se a R$ 750 milhões aprovados em março e aos
  R$ 7,7 bilhões já adquiridos. A mesma nota registra que a área de risco não recebera a base de clientes "ou pelo menos
  uma amostra fidedigna". No dia seguinte, o grupo de trabalho do próprio BRB concluiria que 114.626 contratos dessas
  carteiras tinham numeração padronizada. O documento, juntado ao INQ 5.026, não diz se o limite foi aprovado.'
