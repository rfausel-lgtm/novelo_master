title: 'Lote 49: os desdobramentos de 04/09/2026'
summary: Pesquisa conduzida por agente convocado em paralelo, com varredura das últimas horas. Registra
  o contra-ataque de Moraes — pedido formal a Fachin para investigar Mendonça, avocado por Fachin em 04/09
  com prazo de cinco dias úteis à PGR —; a divulgação do vídeo do depoimento de Vorcaro à PF ('tenho passado
  um terror'); a primeira manifestação pública de Lula sobre a crise ('o maior roubo da história do Brasil');
  e a proposta de Gilmar Mendes para retirar delegados da PF dos gabinetes de ministros do STF.
