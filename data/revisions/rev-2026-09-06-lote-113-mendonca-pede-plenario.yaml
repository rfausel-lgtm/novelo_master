title: Lote 113 — Mendonça pede julgamento no plenário; a crise no STF escala às vésperas do prazo de
  11/09
summary: 'Atualizada a crise STF-PF. Até 07/09/2026, nenhuma das quatro pessoas chamadas por Fachin havia
  se manifestado formalmente — prazo vence 11/09. André Mendonça formalizou, em 06/09 (domingo), pedido
  para que o plenário do STF, não apenas Fachin, julgue o caso — escalada processual real. Gonet já havia
  se manifestado publicamente em 02/09, antes do despacho formal, pedindo nulidade do procedimento de
  Moraes. Registrada intensificação da pressão institucional: editoriais de Folha/Estadão pedindo renúncia
  de Moraes, 54 pedidos de impeachment protocolados, e declaração de Flávio Dino sobre ''interesses eleitorais
  e econômicos'' misturados à crise. Confirmado que a CPMI do Master segue sem nenhum desenvolvimento
  novo desde 13/07/2026.'
