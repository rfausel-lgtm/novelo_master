title: 'Lote 231 — a prisão preventiva de Vorcaro excluída por um HC, e os valores individualizados de
  bloqueio que reclassificam Antônio Augusto Conte'
summary: 'A manifestação da PGR de 05/01/2026 — a petição de origem direta da decisão de 06/01/2026 —
  reconstrói a cronologia processual completa da PET 15.198 e individualiza, em nota de rodapé, os
  valores de bloqueio de bens: R$ 3,28 bilhões cada para Daniel Vorcaro e o Banco Master, e R$ 1,01 bilhão
  cada para Antônio Augusto Conte, César Reginato Ligeiro, Vicente Conte Neto e Ricardo Batista De
  Siqueira Xavier. Antônio Augusto Conte — até aqui só o alvo nomeado de uma proposta de internação
  psiquiátrica forjada por Luiz Phillipi Mourão — ganha assim uma segunda e distinta razão para estar no
  acervo: é um dos poucos nomes com bloqueio bilionário individualizado na decisão fundadora do caso, sem
  que as peças disponíveis expliquem por quê. A mesma manifestação confirma, por documento oficial (não
  apenas imprensa), que o HC 1045014-48.2025.4.01.0000 seguia em vigor e foi a razão para excluir o pedido
  de prisão preventiva de Vorcaro nesta decisão.'
