title: 'Lote 274 — o ofício e o precedente por trás do encaminhamento do caso Nabas à Corregedoria da PF'
summary: 'Enriquecimento de precisão do achado já publicado no lote 271: o despacho de 21/08/2026 em que
  Mendonça autoriza o compartilhamento das provas da Pet 15.625 com a Corregedoria-Geral da PF, para instruir
  processo administrativo disciplinar contra o perito João Cláudio Nabas. A leitura integral da peça (feita
  por equipe delegada, via peticionamento) trouxe três precisões que a versão anterior não tinha: o pedido de
  compartilhamento partiu formalmente da própria PF, pelo Ofício nº 2652643/2026-CINQ/CGRC/DICOR/PF; Mendonça
  fundamentou o deferimento no precedente do Plenário do STF no MS 28.003/DF (2012, red. min. Luiz Fux); e a
  citação direta desse precedente — "as provas obtidas em razão de diligências deflagradas na esfera criminal
  podem ser utilizadas em Processo Administrativo Disciplinar (PAD)". Não muda a narrativa já publicada, só
  a documenta com precisão de fonte primária.'
