title: 'Lote 197 — A invasão aos sistemas do MPF e da PF: a organização acessou o nascimento da própria investigação'
summary: 'Segundo lote extraído do e-Doc 2 da PET 15.978 (representação da PF, maio de 2026). Revela que
  a organização de Daniel Vorcaro, além de acessar sistemas da Polícia Federal, também invadiu
  reiteradamente o sistema Único do Ministério Público Federal usando os logins de duas servidoras/servidores
  — Alina Boueres e Daniel Souza Iost —, monitorando inquéritos sobre o próprio Vorcaro, sobre a Gafisa/Nelson
  Tanure/Maurício Quadrado e, mais grave, acessando em tempo real a Notícia de Fato de 16/07/2024 que deu
  origem à própria Operação Compliance Zero — dois dias após sua instauração, Felipe Mourão já a repassava
  a Vorcaro. Documenta também um plano de outubro de 2024 para intimidar um DJ radicado em Miami com quem
  o filho de Vorcaro teria tido desavença, incluindo um ofício forjado à Interpol com timbre do MPF — o
  segundo caso, no acervo, de documento forjado de órgão de persecução penal usado pela organização.
  Por fim, registra que a mesma organização também acessou ilicitamente o sistema ePol da própria PF, com
  auditoria em curso apontando origem na Delegacia de Juiz de Fora/MG e menção, ainda não detalhada, a
  acesso a sistemas do FBI e da Interpol.'
