title: 'Lote 124 — Flávio Dino reintegra Andrei Rodrigues: leitura direta da decisão e suas tensões processuais'
summary: Leitura integral da decisão de Flávio Dino de 09/09/2026 (Pet 16.669) que reintegra Andrei Rodrigues
  e Leandro Almada à PF, neutralizando a decisão de Mendonça do dia anterior. Registrados os fundamentos
  (ilegitimidade do Partido Novo, usurpação da competência do Plenário, 'decisão em causa própria' de
  Mendonça) e três tensões processuais objetivamente visíveis no texto — uso de petição incidental em
  processo próprio para reverter decisão de outro ministro; invocação da competência do Plenário como
  fundamento para decisão monocrática própria com efeitos imediatos; citação de fato 'vindo a lume' sem
  documento constante dos autos. Confirmada, por fonte independente, a carta pública de 13 ex-ministros
  do STF pedindo apuração da 'mais aguda crise' da história da Corte.
