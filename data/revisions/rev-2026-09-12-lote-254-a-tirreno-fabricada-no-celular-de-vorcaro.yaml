title: 'Lote 254 — a Tirreno fabricada, contada pelo celular de Vorcaro'
summary: 'Primeira leitura do relatório de 228 páginas em que a Polícia Federal analisou as conversas do celular de Daniel
  Vorcaro sobre as cessões de crédito ao BRB, juntado ao INQ 5.026 em maio. Pela PF, os contratos com a Tirreno datados
  de 2024 foram assinados e autenticados em maio de 2025, logo depois de o presidente do BRB cobrar a pendência; a
  resposta da Cartos ao Banco Central começou dizendo que a Tirreno originara só R$ 546 mil e foi reescrita até afirmar
  que a Cartos não tinha acesso a nada; o escritório de Daniel Lopes Monteiro redigia documentos em nome da Tirreno sob
  revisão de Vorcaro ("Estamos notificando pra passar para os outros nao para assumir"); e Paulo Henrique Costa,
  alertado desde outubro de 2024 sobre carteiras inconsistentes, respondeu a Vorcaro "Estamos juntos mesmo para a
  vida". Tudo registrado como alegação da PF, sem denúncia.'
