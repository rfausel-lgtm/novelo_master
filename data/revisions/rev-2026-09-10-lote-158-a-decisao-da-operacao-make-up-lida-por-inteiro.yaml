title: Lote 158 — a decisão da Operação Make Up, lida por inteiro
summary: 'Caiu em 10/09/2026 o sigilo da decisão de 150 páginas com que o ministro Flávio Dino autorizou, em 03/09,
  a Operação Make Up, e o acervo passa a ter o documento primário da frente das emendas parlamentares. A leitura
  integral confirma o essencial do noticiário e corrige seu enquadramento. Confirma: R$ 2 milhões em duas emendas
  do deputado federal Mário Frias custearam termos de fomento com o Instituto Conhecer Brasil, presidido por Karina
  Ferreira da Gama; a investigação nasceu de nota técnica da Controladoria-Geral da União; a produtora Go Up Entertainment
  Ltda. movimentou R$ 19.033.071,00 entre 10/11 e 30/12/2025, período das filmagens, tendo entre os remetentes o
  próprio deputado, com R$ 645.400,00, contra rendimentos mensais de R$ 44.008,52; e o dispositivo é duro — suspensão
  de toda atividade econômica das duas organizações sociais, 22 empresas proibidas de contratar com o poder público,
  pagamentos de contratos públicos suspensos, 29 investigados proibidos de deixar o país e de se comunicarem entre
  si, e avocação ao Supremo do inquérito paulista do contrato de wi-fi. Corrige: a decisão não menciona uma única
  vez Daniel Vorcaro, o Banco Master, o Havengate Development Fund, Flávio Bolsonaro ou Eduardo Bolsonaro. A frente
  de Dino é a das emendas e dos contratos administrativos; a do dinheiro do banqueiro para o filme corre com outro
  relator. E, no ponto em que mais se aproxima da tese de que emenda teria custeado o filme — R$ 700 mil pagos pelo
  instituto a empresas de um grupo, seguidos de R$ 750 mil desse mesmo grupo para a produtora —, é o próprio texto
  que marca o limite: os elementos não permitem afirmar que os recursos tenham origem direta nos valores recebidos
  do instituto. Registra-se ainda que os deputados Marcos Pollon e Bia Kicis são citados como autores de emendas
  à Academia Nacional de Cultura que nunca foram repassadas, e que nenhum dos dois figura entre alvos ou investigados.'
