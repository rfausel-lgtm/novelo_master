title: 'Lote 343 — os irmãos Schumann ganham verbete, e o cemitério de Sabará tem nome'
summary: 'Frente de fronteira do lote 338 (cemitérios): releitura integral, peça por peça, do voto da CVM
  no PAS 19957.013886/2022-02 (25/11/2025) — o acervo já o citava desde o lote 320, mas por síntese, não
  por leitura completa. O voto nomeia por extenso os quatro acusados no próprio cabeçalho, incluindo
  Priscila Oliveira Gomes, a companheira de Roberto Schumann até então não nomeada no acervo por engano
  (a cautela da CVM com iniciais vale para testemunhas, não para partes formais do processo) — ela foi
  absolvida de toda imputação. Ganham verbete Roberto e Marcio Coutinho Schumann, os dois condenados,
  com os valores exatos dos ganhos apurados (R$ 471.904,93, R$ 265.717,32 e R$ 18.734,57) e a
  fundamentação das três absolvições que os cercam: a de Priscila (sem prova de que soubesse das ordens
  em seu nome), a da Cortel e de Roberto na acusação de manipulação de preços (não por falta de indícios,
  mas por dúvida razoável resolvida a favor dos acusados) e a de Roberto na acusação de operação
  fraudulenta (o uso da conta da companheira seria acessório à prática não equitativa já punida, não
  fraude autônoma). Fecha também a outra ponta desta frente: fonte acessível e lida diretamente (Revista
  Oeste, 18/02/2026, republicando a mesma apuração da PF que o UOL publicara no mesmo dia e que bloqueia
  leitura automatizada) nomeia o cemitério da origem do Master em 2016 — Terra Santa, em Sabará/MG,
  titularidade da VHR Empreendimentos — e confirma a reavaliação para R$ 111,7 milhões em 2020, número
  que o acervo tinha publicado sem fonte própria no lote 315 e retirado por isso. O nome da empresa da
  família Vorcaro sócia do cemitério continua sem fonte.'
