date: '2026-09-03'
summary: 'Lote 11: os dois contratos do escritório Barci de Moraes. Entra o segundo instrumento, de 12/05/2025,
  firmado com a Viking Participações e com limite de R$ 50 milhões líquidos, seguido do termo de dação
  em pagamento que previa quitar R$ 40 milhões com ações de duas empresas ligadas a aeronaves. Entram
  também os R$ 80,2 milhões apontados pela Receita à CPI, a confirmação do escritório de que o ministro
  editou a última versão do primeiro contrato a pedido do compliance do banco, e a ressalva da própria
  PF de que o relatório de 218 páginas não é exaustivo.'
