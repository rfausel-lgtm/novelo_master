title: "Lote 376 — São Roque Prev: TCE-SP julga irregulares as contas de 2024 e PF cumpre mandados na Operação
  Entressafras"
summary: Registra dois atos distintos sobre o São Roque Prev, sem nexo entre eles. Segundo o Estadão e o g1, o
  TCE-SP julgou irregulares as contas de 2024 do instituto, em decisão publicada em 19/10/2026, e imputou ao
  ex-diretor-presidente Vanderlei Massarioli o ressarcimento de R$ 93,15 milhões aplicados em letras do Banco
  Master; cabe recurso, e a defesa diz que vai recorrer. Em 27/10/2026, segundo nota da PF, a Operação
  Entressafras cumpriu nove mandados de busca sobre a gestão de recursos do instituto entre 2022 e 2024; a
  nota não cita banco nem investigados, nenhuma das fontes lidas nomeia os investigados, e o nexo com o Master é atribuído a CNN e Metrópoles. Cria os verbetes
  do TCE-SP e do ex-presidente.
