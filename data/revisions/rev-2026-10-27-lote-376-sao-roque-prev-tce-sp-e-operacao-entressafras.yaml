reason: "Fato novo sobre regime próprio já mapeado no acervo. Classe D para a nota da PF; classe C para a
  decisão do TCE-SP (duas apurações, Estadão e g1; texto da decisão e número do processo não localizados);
  classe C restrita para o nexo da operação com o Master, só como o que CNN e Metrópoles noticiam. Os valores
  de PF, imprensa e TCE-SP divergem e ficam registrados sem conciliação. Ficaram de fora: operação anterior
  citada só pela CNN, troca de títulos do BTG, multa e determinações ao instituto, e qualquer ligação do
  ex-presidente ou da consultoria com a operação da PF."
