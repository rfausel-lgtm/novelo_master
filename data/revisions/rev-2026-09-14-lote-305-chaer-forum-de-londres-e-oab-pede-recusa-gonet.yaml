title: 'Lote 305 — o ConJur no fórum de Londres patrocinado pelo Master, e a OAB pede a recusa de Gonet'
summary: 'Continuação da varredura das Pet 16.662/DF e Pet 16.704/DF baixadas por Rafael em 14/09/2026, com
  duas frentes. (1) Uma petição de terceiro interessado (Luiz Eduardo Bottura, contra o jornalista Márcio
  Chaer, por disputa reputacional própria) trouxe ao acervo, por citação de reportagens independentes já
  publicadas (Folha/Bergamo, revista piauí, Estadão Conteúdo/UOL), o papel do editor do ConJur, Márcio Chaer,
  na organização do fórum jurídico em Londres de abril de 2024 — já registrado no acervo — negociando com
  Daniel Vorcaro a lista de convidados e a exposição do Banco Master como patrocinador; Chaer confirmou
  publicamente ter organizado a edição de 2024 e recebido patrocínio do Master. A disputa pessoal do
  peticionante e um caso de corrupção não relacionado ao Master na Corte Especial do STJ, também citados na
  mesma peça, foram deixados de fora por não dizerem respeito ao caso Master. (2) Uma manifestação do
  Conselho Federal da OAB de 09/09/2026, assinada pelo presidente José Alberto Simonetti e por dirigentes de
  24 seccionais estaduais, pede formalmente que o procurador-geral da República, Paulo Gonet Branco, se
  abstenha de atuar na Pet 16.662/DF — sem cobertura de imprensa localizada até a publicação deste lote.'
