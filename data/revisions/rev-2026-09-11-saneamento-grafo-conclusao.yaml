corrections:
- 'Correção estrutural, terceira e última etapa: as 102 entidades que ainda estavam publicadas sem nenhuma
  conexão no grafo passam a ter as relações que suas próprias fontes já sustentavam. O acervo sai de 131
  entidades soltas para nenhuma, e o componente principal do grafo vai de 250 para 383 nós — todas as
  entidades publicadas.'
- 'Lacuna de registro: o episódio de intimidação de 04/06/2024 em Angra dos Reis, contra o capitão e o
  ex-chefe de cozinha da embarcação usada por Daniel Vorcaro, estava descrito em evidências e em páginas de
  pessoa, mas não existia como evento. Passa a existir, com as vítimas e a testemunha registradas como
  participantes — e a nota expressa de que figuram no acervo como vítimas, não como investigados.'
- 'Cautela preservada: as pessoas que aparecem no acervo apenas como alvo das conversas do grupo — entre
  elas André Flores Tavares, Gabriel Garrido Lacerda, Sean Monteine, Daniel Marinelli Meira e Antônio
  Augusto Conte — foram ligadas como alegação atribuída, com a ressalva explícita, em cada relação, de que
  constam como alvos e não como investigados.'
- 'Cautela preservada: nas ligações envolvendo servidores cujos logins institucionais foram usados em
  consultas indevidas, as descrições registram que a representação policial não estabelece que eles
  próprios tenham feito as consultas.'
