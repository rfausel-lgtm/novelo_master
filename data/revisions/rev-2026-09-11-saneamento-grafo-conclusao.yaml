title: 'Saneamento: o grafo fecha sem nenhuma entidade solta'
summary: 'Etapa final da manutenção de integridade aberta pela auditoria do grafo — não é apuração nova.
  Restavam 102 entidades publicadas sem nenhuma conexão, quase todas sem documento primário no acervo: os
  responsáveis solidários apontados pelo TCE-PR no fundo de previdência de Imbituva, os três diretores da
  Sefer absolvidos no processo da CVM sobre o Brazil Realty FII, os institutos de previdência paulistas
  expostos ao Master, as holdings do eixo baiano, os escritórios de advocacia contratados pelo banco, as
  empresas que integralizaram cotas do FII com ativos sobreavaliados, os fundos da cadeia societária
  indireta da PKL One, os alvos e testemunhas citados nas conversas de Vorcaro e Mourão, os policiais e
  servidores que atenderam a consultas de Marilson Roseno, e os governantes que assinaram os decretos de
  margem consignável em que o CredCesta passou a operar. Com 106 relações e um evento novo — o episódio de
  intimidação em Angra dos Reis, de 04/06/2024, que estava documentado em evidências mas não existia como
  nó —, o acervo passa a ter zero entidade solta: as 383 pessoas e organizações formam um único componente
  conexo. Nenhum fato novo entra: o que muda é que todo fato já publicado passa a ser percorrível.'
