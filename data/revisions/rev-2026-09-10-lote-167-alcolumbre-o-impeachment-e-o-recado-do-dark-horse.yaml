title: 'Lote 167 — Alcolumbre, o bloqueio ao impeachment de Moraes, e o recado do Dark Horse'
summary: 'A pedido do editor, que se intrigou com a hipótese de uma ligação entre o União Brasil (Rueda e
  ACM Neto, acusados por Vorcaro de cobrar comissão de 10% sobre aportes de RPPS ao Master) e a blindagem
  que Alcolumbre — do mesmo partido — dá a Moraes contra o impeachment, a apuração foi feita com rigor:
  o que está confirmado e o que permanece hipótese foram separados. CONFIRMADO: em 01/09/2026, Alcolumbre
  declarou haver 109 pedidos de impeachment contra os dez ministros do STF, sem indicar se daria andamento
  ao de Moraes; no dia seguinte, cobrado em plenário, respondeu citando o financiamento de R$ 130 milhões
  do filme Dark Horse por Daniel Vorcaro — sem nomear Flávio Bolsonaro, Vorcaro ou o filme, mas em fala que
  a imprensa leu como recado velado. Em 04/09/2026, Flávio Bolsonaro revidou publicamente, acusando Alcolumbre
  de proteger um ''amigo'' (Moraes) em vez da instituição, e afirmando (sem confirmação independente) que 54
  pedidos contra Moraes especificamente estariam parados. NÃO CONFIRMADO: nenhuma fonte localizada liga esse
  episódio — bilateral, entre Alcolumbre e os Bolsonaro — ao esquema de comissões de Rueda/ACM Neto; a proposta
  de delação de Vorcaro que os cita (revelada no mesmo dia, 10/09/2026) menciona institutos do Rio, Amapá e
  Amazonas de forma genérica, sem nomear Alcolumbre nem seu ex-tesoureiro Jocildo Lemos, já mapeado no corpus
  por outra via (a atribuição, negada por Alcolumbre, de tê-lo indicado à Amapá Previdência). A hipótese do
  editor fica registrada como fio em aberto no verbete de Alcolumbre, não como fato. Um editorial de opinião
  da Gazeta do Povo (30/08/2026), tratado como tal e não como reportagem, já preexistia à conversa e nomeia a
  tese mais ampla de um ''grande acordo nacional'' de autoproteção entre Lula, Moraes, Alcolumbre e Motta.'
