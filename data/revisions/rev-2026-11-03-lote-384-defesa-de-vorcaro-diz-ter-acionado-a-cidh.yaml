title: Defesa de Vorcaro diz ter acionado a CIDH contra a prisão preventiva
summary: Registra a nota à imprensa divulgada em 02/11/2026 pela defesa de Daniel Vorcaro, que diz ter
  protocolado em 27/10/2026 na Comissão Interamericana de Direitos Humanos (CIDH) pedido de medida cautelar e
  petição individual contra o Estado brasileiro. Tudo é alegação da defesa, inclusive a demora na decisão
  sobre o pedido de liberdade de 18/09, falta da revisão de 90 dias, instância única, uso de conversas com
  advogados e vazamentos. A decisão do Presidente do STF de 29/10 (lote 380) entra ao lado como posição
  documentada. Manifestação do STF, da PF, da PGR ou da CIDH não foi localizada até 03/11.
