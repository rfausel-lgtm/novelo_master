reason: Documento primário íntegro da defesa (nota assinada), com duas coberturas de imprensa que só a
  republicam; por isso evidência D e unverified, com atribuição em toda frase, e Poder360 e Metrópoles sem
  somar peso. A CIDH entra como organização nova, isolada (destinatária declarada dos pedidos, não
  participante do evento), sem afirmar registro, admissão ou andamento dos pedidos.
  Ficaram de fora a qualificação atribuída a terceiro não nomeado, as condições de custódia, saúde,
  familiares, conteúdo de conversas, números de alterações do celular como fato, o pedido de audiência ao
  Presidente do STF e o texto explicativo do Metrópoles sobre os poderes da Comissão.
