title: 'Lote 108 — dois fios puxados da leitura da decisão de Mendonça: um fechado, outro deliberadamente
  não nomeado'
summary: 'Fechadas duas pistas específicas da leitura da decisão de Mendonça (lote 105). A Pet 15.900/DF
  é o ''Caso Tech Office'' (Flávio Dino, 17/08/2026, afastamento do presidente do TCE-MA) — sem relação
  comprovada com o Master; registrada e descartada, por fonte única não verificada e negada pela assessoria,
  uma menção especulativa a um ''Dino'' em anotações de Vorcaro sobre precatórios de R$ 15 bilhões. Sobre
  a servidora do DOC.3: uma única coluna de opinião atribui um nome, mas a equipe decide, por padrão de
  fonte insuficiente e por respeito à proteção reforçada que o próprio STF determinou sobre esta identidade
  específica, NÃO publicar o nome — critério distinto do aplicado ao caso David Ágape (lote 100), com
  a diferença explicitada na evidência para orientar decisões futuras semelhantes.'
