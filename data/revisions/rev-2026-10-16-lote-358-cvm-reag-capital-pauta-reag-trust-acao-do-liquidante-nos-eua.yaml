reason: "Linha financeiro-regulatória (radar R3), liberada pelo investigador-chefe em 16/10/2026 e recortada
  pelo orquestrador: o lote traz só os atos da CVM e a ação do liquidante dos imóveis, e deixa de fora os
  demais itens da liberação, por fonte única, por data não confirmada ou por decisão editorial de retenção.
  Cada fonte nova foi aberta em 16/10/2026; o trecho da condenação foi conferido no navegador embutido. O
  docket do CourtListener, encontrado na tentativa de localizar o processo, elevou a ação a D quanto à
  autuação."
