title: Lote 358 — A CVM condena dois diretores da REAG Capital Holding por infração formal (não elaborar
  demonstrações financeiras e ITR); pauta para 03/11 o processo contra a Reag Trust (hoje CBSF) e
  seu ex-diretor Ramon Pessoa Dantas; e o liquidante do Master propõe ação nos EUA por três imóveis
  (alegações)
summary: "Lote de atos da CVM e de uma ação do liquidante nos EUA. O que NÃO se afirma, em destaque: a
  condenação de 29/09/2026 é infração formal de dever de informação (não elaborar demonstrações financeiras e
  ITR), em primeira instância administrativa, e dela cabe recurso, com efeito suspensivo, ao CRSFN; o voto e a nota não imputam
  ato intencional nem relacionam a condenação ao Banco Master, e o Novelo não faz essa ligação; a pauta de
  03/11 não é julgamento, o acusado Ramon Pessoa Dantas não está condenado e o processo pode ser retirado; e a
  ação do liquidante contém alegações que nenhum tribunal julgou, sem Daniel Vorcaro como réu. Camada D,
  quanto ao conteúdo de cada ato: em sessão de 29/09/2026, divulgada em 02/10, o Colegiado da CVM, por
  unanimidade e acompanhando o voto da diretora Marina Copola, condenou João Carlos Mansur (diretor
  presidente) e Rodolfo Turelli (diretor financeiro) da REAG Capital Holding S.A. à multa individual de R$ 170
  mil (PAS 19957.011231/2025-34) pela não elaboração das demonstrações financeiras de 2024 (Lei 6.404, art.
  176) e dos ITR do 1º e 2º trimestres de 2025 (Resolução CVM 80, art. 31, II); pena-base de R$ 100 mil por
  infração, atenuante de 15%; proposta de termo de compromisso rejeitada em 26/05/2026. A pauta atualizada em
  09/10/2026 inclui na sessão de 03/11 (15h) o PAS 19957.017563/2025-22 (relator Igor Muniz) contra a Reag
  Trust DTVM, hoje CBSF DTVM em liquidação extrajudicial, e Ramon Pessoa Dantas, por infração ao art. 22 da
  Resolução CVM 21; a pauta não descreve os fatos. Camada A: segundo Metrópoles, Times Brasil/CNBC e Rio
  Times, o liquidante do Master, a EFB Regimes Especiais de Empresas, propôs em 07/10/2026 no Tribunal de
  Falências do Distrito Sul da Flórida ação contra Clear River Properties LLC e Goldbeach Properties LLC,
  titulares de três imóveis em Aspen e Miami, alegando que as compras à vista foram pagas com recursos do
  Master que teriam passado por um fundo nas Bahamas, e pedindo o reconhecimento dos imóveis como patrimônio
  do Master ou a restituição de ao menos US$ 169,5 milhões (valores em dólares; os valores em reais variam
  entre os veículos e não são usados). O docket do tribunal, espelhado pelo CourtListener e lido em
  16/10/2026, confirma a autuação em 07/10 do processo nº 26-01362 (juiz Scott M. Grossman), com citações
  cumpridas em 15 e 16/10 e nenhuma decisão de mérito; esse registro é D quanto à existência da ação, não
  quanto ao teor das alegações, e vem de espelho de terceiros, sem conferência no PACER. Com ele, o número
  não depende mais do Rio Times, que declara usar redação automatizada. A defesa de Vorcaro não respondeu ao Metrópoles; os réus e o liquidante não foram localizados.
  Duas pessoas novas (Rodolfo Turelli e Ramon Pessoa Dantas), sem verbete de REAG Capital Holding, CBSF, Clear
  River, Goldbeach ou outras partes dos EUA. Não confirmado: recurso ao CRSFN; relação societária entre a REAG
  Capital Holding S.A., a Reag Investimentos e a CBSF; conteúdo da petição; defesa das empresas; resultado da
  sessão de 03/11 (rever em 04/11)."
