corrections:
  - 'comissao-de-valores-mobiliarios: o resumo dizia "O julgamento estava marcado para 08/09/2026"; o
    julgamento ocorreu em 08/09/2026 (há evento de condenação nessa data) e o texto
    passou a dizer isso, com a condenação de 29/09 e a pauta de 03/11 acrescentadas.'
  - "Plano de redação (não é correção de registro publicado): o número 26-01362, que a liberação dava apenas
    segundo o Rio Times, foi conferido no docket do CourtListener; a ação ganhou evidência D quanto à autuação
    (documento e fonte novos), sem elevar a classe das alegações, que seguem A."
  - "Plano de redação: a fonte da pauta da CVM de 09/10/2026 já existia no acervo (lote 355) e foi
    reutilizada, em vez de criada de novo; a liberação previa dez fontes novas, o lote traz seis."
