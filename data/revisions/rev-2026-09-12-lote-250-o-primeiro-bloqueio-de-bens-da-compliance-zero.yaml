title: 'Lote 250 — o primeiro bloqueio de bens da Compliance Zero, e o que os bancos encontraram'
summary: 'Primeira leitura da PET 15.563, processo que o acervo só citava de passagem. Em 03/03/2026 — mesma data das
  prisões e buscas da PET 15.556 —, André Mendonça decretou, a pedido da Polícia Federal, bloqueio de contas e
  indisponibilidade de imóveis, veículos, aeronaves, valores mobiliários e criptoativos dos alvos listados na
  representação, descrevendo o papel de Luiz Phillipi Mourão, Marilson Roseno da Silva, Paulo Sérgio Neves de
  Souza, Belline Santana, Leonardo Palhares, Ana Cláudia Queiroz de Paiva e da Varajo. É o antecessor, dois meses
  antes, do bloqueio da PET 16.019 já registrado. Os valores individuais não estão na decisão, mas a resposta do
  Itaú mostra que a tabela tinha onze requeridos e que o teto para Ana Cláudia era de R$ 42 milhões — o banco
  achou pouco mais de R$ 90 mil em nome dela e R$ 22,01 em nome de Palhares. Palhares e a Varajo recorreram, e o
  agravo aguardava manifestação da PGR desde julho.'
