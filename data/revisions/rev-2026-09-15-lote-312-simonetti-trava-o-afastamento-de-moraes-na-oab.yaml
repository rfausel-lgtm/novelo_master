title: 'Lote 312 — Simonetti trava o afastamento de Moraes na OAB, meses depois de criticá-lo na campanha'
summary: 'Apuração de um fork delegado sobre a postura do presidente da OAB, Beto Simonetti (novo verbete),
  diante da crise Moraes/Toffoli. Em 09/09/2026, o Conselho Federal — já no acervo por pedir acesso a provas
  e o afastamento do procurador-geral Gonet (lote 306) — optou, na mesma reunião, por criar uma comissão
  formada pela própria diretoria em vez de deliberar sobre o afastamento cautelar de Moraes e Toffoli. Em
  14/09/2026, véspera da sessão extraordinária de hoje, o conselheiro Marcelo Tostes (MG) pediu que essa
  votação fosse pautada, citando o contrato do escritório da esposa de Moraes com o Banco Master; Simonetti
  recusou, alegando que a comissão ainda examinava o caso — recusa criticada pelo conselheiro Telles.
  Achado editorial: na campanha de reeleição (janeiro/2025), Simonetti havia criticado publicamente Moraes
  ("a lei brasileira não permite que a vítima julgue seu próprio caso"); a tensão entre esse discurso e a
  recusa de pautar, oito meses depois, é registrada como inferência, não como contradição provada — nenhuma
  fonte liga os dois fatos expressamente. Busca negativa testada e registrada: não há indício de vínculo
  financeiro entre o escritório de Simonetti (Manaus) e o Banco Master, Vorcaro, CredCesta ou a Amazonprev.'
