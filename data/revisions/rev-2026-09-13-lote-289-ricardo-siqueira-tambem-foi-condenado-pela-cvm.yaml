title: 'Lote 289 — Ricardo Siqueira também foi condenado pela CVM, no caso do ex-Trump Hotel da Barra'
summary: 'Achado do agente de monitoramento de imprensa, verificado por leitura direta da reportagem: Ricardo
  Siqueira Rodrigues foi condenado pela CVM em dezembro de 2024 — antes do episódio RioPrevidência/Banco
  Master — por fraude no empreendimento imobiliário LSH Hotel (que teve licença para usar a marca Trump, na
  Barra da Tijuca): R$ 17,7 milhões de condenação individual dentro de um esquema total de R$ 45 milhões,
  ao lado do coréu Paulo Figueiredo Filho. É uma quarta apuração/condenação envolvendo Ricardo Siqueira,
  distinta das três já registradas no acervo (Rizoma, Circus Maximus, Encilhamento — lote 285) — e a única
  com condenação administrativa formal, não apenas investigação ou confissão em outro contexto.'
