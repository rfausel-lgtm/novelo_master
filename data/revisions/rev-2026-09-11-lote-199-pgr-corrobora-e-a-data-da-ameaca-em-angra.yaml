title: 'Lote 199 — A manifestação da PGR: corroboração cruzada e a data real da ameaça em Angra dos Reis'
summary: 'Primeiro lote extraído do e-Doc 26 da PET 15.978, a manifestação de 05/05/2026 em que o
  Procurador-Geral da República opina favoravelmente às cautelares da 6ª fase — uma síntese organizada da
  representação da PF (e-Doc 2, já minerada), mas que traz corroboração cruzada valiosa por ser peça
  redigida de forma independente. Principal achado: duas peças distintas da PET 15.978 (a decisão do lote
  192 e esta manifestação) convergem na data de 04/06/2024 para a ameaça de morte contra Luís Felipe
  Woyceichoski em Angra dos Reis, com detalhe coincidente (Fabiano Zettel enviado ao local, confirmação de
  "100% resolvido"), o que esclarece — sem eliminar de todo — a divergência de data já registrada no
  acervo desde a leitura da representação da PET 15.556, que citava 11/07/2025. Acrescenta ainda: a técnica
  de lavagem por CPF de terceiro sugerida por Helder Alves de Lima para uma nota fiscal de R$ 50 mil; e
  dois nomes adicionais (Antônio Augusto Conte e Vicente Conte Neto) entre os alvos das consultas ilegais
  de Marilson desde 2021 — citados apenas de passagem, sem registro próprio criado.'
