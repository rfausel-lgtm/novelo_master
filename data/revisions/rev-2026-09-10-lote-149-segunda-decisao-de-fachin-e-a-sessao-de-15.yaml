title: Lote 149 — a segunda decisão de Fachin, e a sessão que decide se o Supremo investiga um dos seus
summary: 'Complemento ao lote anterior, que registrara apenas um dos atos do presidente do Supremo em
  09/09/2026. Houve outro, e ele é mais direto sobre o choque entre gabinetes: Fachin suspendeu simultaneamente
  a decisão de André Mendonça, que afastara o diretor-geral da Polícia Federal e o diretor de Inteligência
  Policial, e a de Flávio Dino, que os reintegrara no dia seguinte — nenhum dos dois atos produz efeito.
  O fundamento declarado descreve o próprio tribunal: ''quadro de conflitos e sobreposições processuais
  que configuram grave lesão à ordem pública''. Foram articulados a petição instaurada pela Presidência,
  a petição de relatoria de Mendonça, sobrestada, e a suspensão de liminar pedida pela União. Na mesma
  decisão foi convocada sessão extraordinária do Plenário para 15 de setembro, às 10h, presencial — e
  é aí que está o alcance maior: segundo a cobertura, o colegiado decidirá se autoriza a abertura de investigação
  contra Alexandre de Moraes, a pedido de Mendonça, o que seria a primeira vez que o Plenário delibera
  sobre abrir inquérito contra um de seus próprios integrantes. A suspeita se apoia no relatório preliminar
  de 218 páginas da Polícia Federal, produzido sobre o material do celular de Daniel Vorcaro, que o acervo
  já distinguia do relatório de inteligência sem assinatura usado em sentido inverso. A Procuradoria-Geral
  da República sustenta a nulidade desse relatório por vício de método — objeção que não afirma sua falsidade,
  e sim que foi obtido por via inadmissível. Ficam registradas duas indefinições: se a sessão de 15/09
  tem um item ou dois, e se o diretor-geral da Polícia Federal permanece no cargo até lá, ponto em que
  as coberturas se contradizem.'
