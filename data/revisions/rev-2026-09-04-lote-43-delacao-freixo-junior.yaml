title: 'Lote 43: a segunda delação do caso — o operador dos repasses ao Dark Horse'
summary: Pesquisa conduzida por agente convocado em paralelo. O corpus já documentava a transferência
  de US$ 1,6 milhão ao Havengate registrada pelo Coaf; este lote acrescenta a peça mais recente da mesma
  frente — o acordo de colaboração premiada fechado pela PGR, em 03/09/2026, com Antonio Carlos Freixo
  Júnior ('Mineiro'), o operador financeiro que movimentava os recursos. É a segunda delação do caso,
  após a de João Carlos Mansur. Fonte de menor porte para os termos exatos do acordo; classificado como
  A e sinalizado para verificação futura.
