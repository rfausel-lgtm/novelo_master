title: 'A linha Alcolumbre — o irmão no conselho fiscal da Amprev, e a hipótese da própria PF sobre Rueda como "rota de acesso"'
summary: 'Aprofundamento pedido por Rafael a partir dos elementos do lote 265 (o ofício de Moraes citando
  Alcolumbre como alvo de suposto direcionamento de Mendonça). Dois achados: (1) um relatório de inteligência
  da PF, base da decisão de Moraes de 03/09/2026, descreve Alcolumbre como "provável alvo estratégico" pelo
  controle que exerce sobre a pauta de impeachment de ministros do STF, levanta a hipótese de que Mendonça
  veria em Antônio Rueda uma "rota de acesso" a ele, e relaciona isso à resistência histórica de Alcolumbre
  à indicação de Mendonça ao STF — hipótese da própria PF sobre a conduta de Mendonça, em direção causal
  oposta à do editor já registrada (que especulava Alcolumbre blindando Rueda/ACM Neto, não Mendonça mirando
  Alcolumbre via Rueda). (2) Enriquecimento de verbete já existente: Alberto Samuel Alcolumbre Tobelem —
  já registrado como presidente da Junta Comercial do Amapá — integrou o Conselho Estadual de Previdência
  do Amapá em 2023-2024 e passou ao Conselho Fiscal da Amprev a partir de 2025, depois das três deliberações
  de julho de 2024 que aprovaram R$ 400 milhões em letras do Master. PF e MP-AP apuram se o fundo ignorou
  alerta do conselheiro Gláucio Bezerra, em reunião de 30/07/2024, antes de aportar parte dos recursos.
  Nenhum ato concreto de investigação contra ele foi localizado.'
