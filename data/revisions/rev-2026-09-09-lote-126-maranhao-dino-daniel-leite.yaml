title: 'Lote 126 — o Maranhão no caso Master: sem RPPS exposto, mas um advogado apontado pela Kroll'
summary: 'Investigados os laços políticos de Flávio Dino no Maranhão (PCdoB→PSB, sucessão e ruptura com
  Carlos Brandão, aliados, rivalidade histórica com os Sarney) e a exposição financeira do estado ao Banco
  Master — resultado negativo: o Maranhão não consta da lista oficial de 18 RPPS expostos, nem há manifestação
  institucional local ou caso de pessoa física lesada localizado. Achado positivo: o advogado de São Luís
  Daniel de Faria Jerônimo Leite, apontado por relatório da consultoria Kroll como ''figura instrumental''
  de Vorcaro, Maurício Quadrado e João Carlos Mansur na tentativa de compra de ações do BRB, com empréstimo
  de R$ 93,7 milhões (abril/2025) e contrato com a Câmara de Imperatriz renovado sem licitação — investigação
  do MPMA suspensa por Dias Toffoli em 30/09/2025.'
