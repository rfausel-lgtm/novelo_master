title: 'Lote 318 — os irmãos Conte, do bloqueio bilionário aos cemitérios, e as ligações que faltavam'
summary: 'Lote de consolidação a partir de revisão estrutural do grafo pelo investigador-chefe. Principal
  achado: Vicente Conte Neto, cujo verbete dizia "o acervo não sabe quem é" apesar de ter bens bloqueados em
  R$ 1,012 bilhão na Pet 15.198, é descrito na decisão do Min. Flávio Dino na ADPF 1.196 (lote 313, via
  reportagem do O Bastidor) como conselheiro da Cortel, diretor da Zion Capital e cofundador do fundo de
  cemitérios Brazilian Graveyard — e pela Gazeta Mercantil como irmão de Antônio Augusto Conte (também
  bloqueado no mesmo valor), herdeiro de administradora de cemitérios e parceiro de Vorcaro desde 2011, numa
  relação que teria chegado à compra do Banco Máxima. Que os alvos do bloqueio sejam esses irmãos fica
  registrado como inferência, não como fato; e fica anotada a tensão com as conversas de 2024 em que Antônio
  Augusto aparece como desafeto de Vorcaro. O lote também transforma em ligações do grafo fatos já
  documentados no acervo que só existiam em texto: Zettel repassou a Vorcaro o contato de Ricardo Siqueira
  um dia antes do credenciamento do Master no Rioprevidência; a comissão de 0,6% de Ricardo Siqueira; seu
  papel de intermediário no Rioprevidência; o Instituto ITER como instituição fundada por Mendonça; o perito
  João Cláudio Nabas na PF; e as duas holdings controladoras do Master nomeadas pelo Banco Central. Por
  decisão editorial já registrada no acervo, Tharcio Nascimento Salgado segue sem ligação até que a decisão
  sigilosa da Pet 15.686 seja lida; e não foi criada ligação entre o perito suspeito de vazamento e a
  jornalista citada, para não expor relação de fonte jornalística além do que o texto já registra.'
