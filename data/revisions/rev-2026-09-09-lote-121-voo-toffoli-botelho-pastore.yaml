title: 'Lote 121 — o voo a Lima: Toffoli, o advogado de Luiz Bull e o dono do jato'
summary: Criado o advogado Augusto de Arruda Botelho (defensor de Luiz Bull) e o empresário Luiz Osvaldo
  Pastore (dono do jato), documentando a viagem de Toffoli — então relator do caso Master — a Lima em
  28-30/11/2025, dois dias antes de decretar sigilo no processo. Registrado que esse voo foi uma das três
  frentes citadas pela PF num pedido de suspeição contra Toffoli em fevereiro de 2026 (junto das mensagens
  no celular de Vorcaro e da venda da Maridt ao fundo Arleen, ligado a Fabiano Zettel) — pedido arquivado
  por Fachin em 21/02/2026. Registrada a conexão financeira documentada e anterior entre Pastore e a campanha
  de 2022 de Flávia Arruda, hoje esposa de Augusto Lima — correlação factual, não evidência de conluio.
