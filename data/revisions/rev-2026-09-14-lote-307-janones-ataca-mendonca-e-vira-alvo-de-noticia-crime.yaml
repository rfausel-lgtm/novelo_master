reason: Continuação da leitura das 62 peças da Pet 16.662/DF baixadas por Rafael via certificado digital em
  14/09/2026, a pedido dele de verificar novidade na sequência processual antes da sessão extraordinária de
  15/09/2026. Fecha a varredura desse lote de peças — as demais (decisão de Mendonça de 08/09, vista de
  Gilmar, suspensão simultânea por Fachin, remessa à Presidência, fórum de Londres/ConJur, manifestação da
  OAB) já estavam publicadas no acervo ou foram publicadas em paralelo por outra sessão (lote 306).
