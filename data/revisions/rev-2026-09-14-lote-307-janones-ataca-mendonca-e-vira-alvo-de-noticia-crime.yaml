title: 'Lote 307 — Janones ataca Mendonça e vira alvo de notícia-crime protocolada na Pet 16.662'
summary: 'Última peça nova, das 62 baixadas por Rafael em 14/09/2026 na Pet 16.662/DF, sem sobreposição com
  os lotes já publicados sobre o mesmo lote de documentos (fórum de Londres/ConJur, manifestação da OAB). Em
  09/09/2026, horas depois da decisão de Mendonça que afastou o diretor-geral da PF Andrei Rodrigues, o
  deputado federal André Janones publicou vídeo chamando Mendonça de "vagabundo" e acusando-o de agir para
  se proteger — episódio que motivou dois advogados sem vínculo processual identificado com o caso a
  protocolar notícia-crime contra Janones nos mesmos autos, pedindo prisão em flagrante, quebra de imunidade
  parlamentar e remessa ao TSE, citando o precedente de Daniel Silveira. Nenhuma cobertura de imprensa
  independente localizada até esta coleta; documento primário, mas alegações de terceiros sem vínculo
  processual claro.'
