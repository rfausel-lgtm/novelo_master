title: 'Lote 281 — Maurício Quadrado pede habilitação no inquérito do "Projeto DV"'
summary: 'Leitura das peças de agosto/setembro do Inq 5.035/DF (o inquérito do "Projeto DV" — campanha de
  influenciadores e dossiês a favor de Daniel Vorcaro perante STF e TCU, relatado por André Mendonça).
  Achado: em 17/08/2026, advogados de Maurício Quadrado (ex-sócio de Vorcaro no Master, controlador da
  Trustee/Banvox) requereram habilitação de procuradores nesse inquérito "e em todos os procedimentos
  correlatos" — vínculo inédito no acervo, que até aqui só documentava Quadrado em apurações de natureza
  financeira (Compliance Zero, bloqueio de Toffoli). Não se sabe a que título ele busca acesso, nem quais
  seriam os procedimentos correlatos. Achado negativo, sem publicação própria: a certidão de 11/09/2026 do
  mesmo inquérito e a petição de 25/08/2026 tratam de assunto distinto (renovação de habilitação de Daniel
  Vorcaro, já documentado) — mero ato cartorário, sem conteúdo de mérito novo.'
