title: 'Lote 301 — Caiado cobra publicamente a abertura de todos os sigilos do Banco Master'
summary: 'Achado do agente de monitoramento de imprensa, verificado por WebFetch direto: em 10/09/2026, o
  governador de Goiás, Ronaldo Caiado, criticou Alexandre de Moraes por cancelar um pronunciamento e cobrou
  publicamente a abertura de todos os sigilos ligados ao Banco Master, sem exceção de cargo: "ministro,
  presidente, candidato, senador… todos!" É a primeira manifestação de um governador em exercício, no acervo,
  pedindo o levantamento total dos sigilos do caso.'
