title: 'Lote 283 — o que fundamenta o bloqueio de bens de Quadrado, Almeida e Aguetoni: Bello Pactum e o
  FIDC Alvarinho'
summary: 'Leitura do agravo regimental (petição 73734/2026, obtido via peticionamento autenticado) contra a
  decisão de 19/05/2026 do Ministro André Mendonça na Pet 15.198/DF, que manteve bloqueado o patrimônio de
  Maurício Quadrado, Luís Fernando de Almeida e Flávio Daniel Aguetoni. Revela pela primeira vez no acervo o
  fundamento específico do bloqueio desses três: operações envolvendo a Bello Pactum Participações S.A. e o
  FIDC Alvarinho, com prejuízo patrimonial estimado pela investigação em ~R$ 24 milhões. A defesa contesta:
  alega que os R$ 18.268.809,43 captados via notas comerciais do FIDC Alvarinho pagaram integralmente 32
  acordos trabalhistas do passivo do BANIF — Banco Internacional do Funchal (Brasil) S.A., sem desvio.
  Duas organizações novas no acervo (Bello Pactum, FIDC Alvarinho). Nota metodológica: a caracterização da
  hipótese investigativa vem da própria defesa (que a resume para contestá-la) — não foi possível acessar a
  decisão original ou a representação que a fundamentou; e não se confirma se este bloqueio é o mesmo já
  registrado (com número de processo não confirmado) em ev-toffoli-bloqueio-24-2-milhoes-banvox-master-
  vorcaro-quadrado, atribuído à imprensa a Dias Toffoli — valor muito próximo (R$ 24 milhões vs. R$ 24,2
  milhões), mas relator e caracterização diferem; tratado como não confirmado, não como coincidência
  resolvida.'
