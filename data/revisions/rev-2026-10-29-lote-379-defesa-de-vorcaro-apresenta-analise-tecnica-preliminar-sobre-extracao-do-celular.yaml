reason: "Documento de parte em PDF primário (hospedado pelo Poder360) e reportagem do Poder360. Evidências e
  evento em classe D, porque provam só que a defesa produziu a análise e o que ela afirma; status unverified,
  porque o mérito é alegação. Segunda apuração jornalística independente não localizada (só republicações, não
  citadas). Contraditório: versão da defesa; PF e STF não localizados. Ficaram de fora o conteúdo de
  mensagens, terceiros, identificadores de aparelho, lacres e hashes, nomes de agentes da PF, horários finos,
  a tese jurídica, a contagem de imagens e bancos de dados e o número do laudo da PF."
