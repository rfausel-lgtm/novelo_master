title: Lote 379 — Defesa de Vorcaro apresenta análise técnica preliminar sobre a extração do celular
summary: Registra a análise preliminar de 76 páginas que o assistente técnico contratado pela defesa de Daniel
  Vorcaro entregou em 26/10/2026 sobre o material da extração do celular apreendido, divulgada pelo Poder360
  em 29/10. Segundo o assistente técnico da defesa, o material recebido, sem os arquivos brutos, não
  permite verificar a integridade da extração, há lacunas na documentação da cadeia de custódia e há registros
  de arquivos modificados e criados depois da apreensão. O próprio perito escreve que não é possível atribuir
  essas alterações a ação humana deliberada (nem, por isso, classificá-las como inofensivas) e que suas
  conclusões não implicam juízo sobre autoria; segundo o Poder360, o laudo não comprova que o material tenha
  sido adulterado. Manifestação da PF e do STF não foi localizada até 29/10.
