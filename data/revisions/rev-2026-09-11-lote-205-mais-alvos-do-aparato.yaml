title: 'Lote 205 — Mais alvos do aparato: acusação de roubo na Venezuela, e o crítico anônimo do banco'
summary: 'Segundo lote do e-Doc 3 da PET 15.978 (IPJ-A nº 1070759/2026, análise do chat Vorcaro-Mourão).
  Dois episódios novos de coleta de dados e ameaça contra pessoas que nunca tiveram voz no acervo. Em
  setembro de 2024, Vorcaro acusou André Flores Tavares e Gabriel Garrido Lacerda de tê-lo roubado na
  Venezuela — "Esse é pra ir pra c forca" — e "A Turma" passou a compilar dados pessoais dos dois, com
  menção a uma "entrada na Interpol" e pedido para que a Polícia Federal afirmasse, no mesmo dia, haver
  denúncia de crime financeiro contra eles. A acusação de roubo é só de Vorcaro, sem qualquer elemento
  independente que a confirme, e os dois entram no acervo como alvos, não como investigados. Em agosto do
  mesmo ano, um telefone que publicava críticas ao banco foi rastreado até Daniel Marinelli Meira; "Os
  Meninos" baniram o WhatsApp dele e Vorcaro autorizou "apenas um susto ou outra ação" por meio da PF —
  depois de perguntar se havia certeza da autoria. Os três ganham registro leve no acervo, com a ressalva
  expressa de que o que está provado é a ação do aparato contra eles, não as acusações que a motivaram.'
