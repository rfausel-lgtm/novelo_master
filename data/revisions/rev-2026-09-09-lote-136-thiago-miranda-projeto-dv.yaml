title: 'Lote 136 — Thiago Miranda e o ''Projeto DV'': a campanha paga contra o Banco Central'
summary: 'Quarta peça da estrutura descrita nos autos, agora na frente de comunicação. O caso dele se
  decide numa coincidência de valores que o corpus registra sem resolver: recebeu R$ 3,5 milhões pela
  venda de 10% do portal Leo Dias a Vorcaro, pagos pela Super Empreendimentos, e repassou exatamente R$
  3,5 milhões a influenciadores — a defesa diz que era dinheiro próprio, produto daquela venda; a investigação
  diz que veio do esquema, pela mesma holding. O recrutamento de influenciadores foi registrado em três
  camadas separadas, por exigirem tratamento distinto: quem foi abordado e recusou, tornando o caso público
  por iniciativa própria; quem foi nomeado pelo próprio investigado em depoimento; e quem efetivamente
  publicou, com a negativa de cada um. A lista dos cerca de 40 perfis mapeados pela PF nunca foi divulgada,
  e nenhum influenciador foi indiciado ou denunciado. Nova pessoa: o vereador Rony Gabriel, que denunciou
  a abordagem em vídeo um mês antes de depor à PF, rompendo acordo de confidencialidade com multa de R$
  800 mil. Nova organização: a agência UNLTD, que segue com situação cadastral ativa, sem suspensão judicial.
  Registradas também as reações das vítimas do monitoramento — o Itaú não comentou, a piauí confirmou
  a intimidação, e a Nord removeu conteúdo, com Miranda comemorando ''Mais um arquivado!'' — e o pedido
  do procurador-geral, de 01/09/2026, para anular o procedimento em que ele é mapeado. Corrigido um registro
  desatualizado do próprio acervo, que afirmava não ter lido a decisão da 10ª fase.'
