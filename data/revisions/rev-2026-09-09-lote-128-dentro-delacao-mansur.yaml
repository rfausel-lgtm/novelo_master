title: 'Lote 128 — dentro da delação de Mansur: Jaques Wagner e a Taylor Swift, ACM Neto e o Seattle 95'
summary: 'Detalhada a linha do tempo da delação de João Carlos Mansur (17 anexos entregues em 26/08/2026,
  acordo com a PGR em 02/09, audiência de voluntariedade em 03/09, homologação ainda pendente em 09/09).
  Registradas, com a força devida, três alegações específicas dos 17 anexos: Jaques Wagner e os ingressos
  da Taylor Swift (R$ 63,3 mil, ele nega conhecer Mansur), ACM Neto e o fundo Seattle 95 (R$ 7,92 milhões,
  ele confirma mas diz serem recursos lícitos), e a alegação de que Vorcaro seria o ''verdadeiro dono''
  do Jaguar Multimarket Fund (Cayman, R$ 494 milhões do Master, beneficiário formal Benjamim Botelho)
  — com possível, mas não confirmada, sobreposição com o fundo Jaguar já mapeado na condenação da CVM.
  Detalhado o paradeiro alegado dos R$ 20 bilhões (imóveis, fundos, direitos creditórios, terceiros).
  Registrada a mudança de estratégia da defesa de Vorcaro e a rejeição detalhada da delação de Paulo Henrique
  Costa pela PGR.'
