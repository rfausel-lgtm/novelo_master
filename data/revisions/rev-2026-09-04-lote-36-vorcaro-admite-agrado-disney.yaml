title: 'Lote 36: Vorcaro admite o ''agrado'' a Paulo Sérgio Neves de Souza'
summary: 'Pesquisa conduzida por agente convocado em paralelo, verificada diretamente na fonte primária
  de imprensa. Em depoimento de 28/08/2026, Vorcaro confirmou pessoalmente a viagem à Disney/Universal
  oferecida a Paulo Sérgio Neves de Souza (já referida em apuração anterior, lote 20), identificando a
  empresa organizadora (SL Consulting, de Léo Serrano) e classificando o gesto como cortesia pessoal,
  não contrapartida — com negativa expressa de que qualquer servidor do BC tenha ''trabalhado'' para ele.
  Eleva a evidência correspondente de A para D: agora é confissão do próprio investigado, não apenas apuração
  relatada pela imprensa.'
