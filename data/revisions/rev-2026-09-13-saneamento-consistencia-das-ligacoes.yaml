id: rev-2026-09-13-saneamento-consistencia-das-ligacoes
kind: revision
date: '2026-09-13'
title: 'Saneamento: ligações repetidas, lastro fora do alvo e entidades soltas'
summary: 'Terceira etapa da manutenção de integridade do grafo — não é apuração nova. Uma análise de consistência
  conferiu, para cada ligação, se o próprio registro e as fontes citadas nomeiam as duas pontas, e achou quatro
  tipos de problema. Fatos registrados duas vezes: o contrato Viking–Barci de Moraes de 12/05/2025, os R$ 14
  milhões do Master à Pollaris desenhados também como pagamento pessoal a Guido Mantega, e as emendas de Mário
  Frias ao Instituto Conhecer Brasil como relação e como transação. Pagamento à empresa desenhado para a pessoa:
  os R$ 3,8 milhões da WF Comunicação, que passa a ter registro próprio. Lastro que falava de outra coisa: a
  relação de Paulo Gonet com o MPF citava a prisão de Paulo Henrique Costa. E 36 pessoas e organizações sem
  nenhuma ligação, 30 das quais os documentos do acervo já ligavam. O lint ganha três regras para que os quatro
  tipos não voltem.'
