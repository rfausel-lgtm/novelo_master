corrections:
- 'Fato registrado duas vezes: o 2º contrato da Viking Participações com o escritório Barci de Moraes (12/05/2025)
  existia como relação contratual (lote 11) e como relação comercial (lote 84). A comercial foi fundida na
  contratual, que herda suas evidências, fonte e evento.'
- 'Fato registrado duas vezes: a relação direta Banco Master → Guido Mantega repetia os R$ 14 milhões que o acervo
  já registra como pagamento à Pollaris Consultoria, empresa de Mantega. Fica a relação Pollaris → Master, que
  herda a evidência, a fonte e a posição do citado; a relação de consultoria entre Mantega e o banco permanece.'
- 'Fato registrado duas vezes: as emendas de R$ 2 milhões de Mário Frias ao Instituto Conhecer Brasil existiam
  como relação e como transação. A transação saiu: emenda é verba pública indicada pelo parlamentar, e o registro
  desenhava o dinheiro saindo dele.'
- 'A transação de R$ 3,8 milhões do Banco Master passa a apontar a WF Comunicação, que a fonte identifica como
  empresa de Fabio Wajngarten, e não mais a pessoa. A empresa ganha registro, ligado a ele.'
- 'Lastro fora do alvo: a relação de Paulo Gonet com o Ministério Público Federal (e o cargo na ficha dele) citava
  evidência, fonte e documento sobre a prisão de Paulo Henrique Costa, que não o mencionam. Passa a citar a
  manifestação que ele assinou como procurador-geral na PET 16.662.'
- 'Lastro fora do alvo: a relação de Ascendino Madureira Garcia com a Foco DTVM citava uma evidência sobre Daniel
  Vorcaro; fica apoiada só na fonte que trata dele. O ato de liquidação da CBSF DTVM deixa de apontar Gabriel
  Galípolo como autor, porque nenhuma das fontes o cita e o texto do ato não foi lido.'
- 'Conferido e mantido: os cinco conselheiros do comitê da Amprev constam da verificação de quórum da ata de
  14/03/2024. O registro do documento passa a nomeá-los.'
- 'Retratação do ciclo 71-86 reaplicada: duas evidências ainda traziam R$ 1,876 bilhão como total aplicado pelos
  18 regimes próprios; o valor correto é R$ 1,867 bilhão. A fonte da posse de Flávio Dino datava a posse de
  22/02/2026; a data é 22/02/2024.'
- 'Entidades soltas: 30 das 36 pessoas e organizações sem ligação passam a tê-la pelo que os documentos já
  sustentavam — cargos (senadores de Mato Grosso, procuradores, a delegada Janaina Palazzo, dirigentes do BRB, da
  Cartos, da Tirreno, da The-Pay e do Banco Pleno), a participação nomeada nos próprios eventos (alvos da decisão
  de 06/01/2026 na PET 15.198, a CAE nas suas audiências, o Galo Forte FIP no bloqueio patrimonial) e vínculos
  societários (Tayayá, Terra Firme da Bahia, Lormont e FIDC Maranta). As relações atribuídas à polícia entram como
  alegação (classe A).'
- 'Entidades que ficam sem ligação, com o motivo declarado no registro: Cláudia Resende Soares da Silva, Karina
  Resende Oliveira Vorcaro, Diogo Ilário de Araújo Oliveira, João Pedro Leite Nunes, Décio Gabriel Gimenez e Terra
  Firme Construções e Incorporações. Os documentos as nomeiam sem descrever vínculo com mais ninguém, e ligá-las
  seria presumir.'
- 'Participantes que o próprio evento nomeava e não constavam: Marilson Roseno da Silva e Luiz Phillipi Mourão na
  prisão preventiva de 04/03/2026, Marilson Roseno na decisão da Segunda Turma de 20/03/2026 e Daniel Lopes
  Monteiro na prisão de 16/04/2026.'
