title: 'Lote 220 — o BRB fala pela primeira vez por documento próprio'
summary: 'O acervo só tinha, sobre a atuação do BRB no caso, reportagens e decisões judiciais — nunca uma
  manifestação institucional do próprio banco. A leitura direta do IPL 2025.0087917 traz o Ofício
  PRESI-2025/051, de 18/06/2025, assinado por Paulo Henrique Costa (então presidente), Dário Oswaldo Garcia
  Júnior e Robério Bonfim Mangueira: reconhece tranches de crédito com origem em promotores de vendas
  contratados pelo Master, documentação incompleta entregue pelo Master e auditoria independente contratada
  e não concluída — cinco meses antes do afastamento de Costa e onze antes de sua prisão preventiva. É
  também a primeira vez que o registro do BRB deixa de marcar "nenhuma manifestação pública localizada".'
