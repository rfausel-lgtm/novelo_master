title: Lote 77b — o Banco Central confirma o balanço, e o papel não circulava
summary: 'A base IF.data do Banco Central confirma ao centavo os números das demonstrações auditadas e
  acrescenta dois pontos trimestrais inéditos, além de mostrar que o estoque continuou crescendo em 2025,
  até R$ 4,11 bilhões em base de conglomerado em junho — cinco meses antes da liquidação. Varredura por
  amostragem no mercado secundário da B3, em 91 dias com dados e quase 18 mil registros de letras financeiras
  de 46 emissores, não encontrou uma única negociação de papel do Banco Master: os títulos não circulavam.
  Registrada também a ressalva de proporção — a letra financeira era cerca de 3,9% das captações do banco;
  o que a distingue não é o volume, mas a concentração em um único tipo de comprador.'
