title: 'Lote 314 — PF mira Cezinha de Madureira por tráfico de influência, autorizado por Dino'
summary: 'Achado de um fork delegado, verificado por esta sessão via WebFetch em duas fontes de imprensa
  independentes (CNN Brasil, Gazeta do Povo): em 14/09/2026, a PF cumpriu a terceira fase da Operação
  Transparência (iniciada em dezembro/2025 sobre emendas parlamentares) contra o deputado Cezinha de
  Madureira (PL-SP) e sua esposa, a advogada Valéria Rodrigues Linhares (nova no acervo) — quatro mandados
  de busca e apreensão no DF e em SP, autorizados pelo Min. Flávio Dino, por suspeita de exploração de
  prestígio, tráfico de influência, corrupção passiva e lavagem de dinheiro, envolvendo negociação de
  valores condicionados ao resultado de processos em tribunais superiores. Já se sabia que Linhares tivera
  R$ 510 mil em espécie apreendidos em mala no Aeroporto de Congonhas em 25/08/2026. Cezinha de Madureira
  já constava do acervo como o intermediário, segundo a imprensa, do encontro de 14/03/2025 entre o Min.
  André Mendonça e Daniel Vorcaro — encontro que a decisão de hoje do Min. Dino na ADPF 1.196 (lote 313)
  volta a citar. Registrado com cautela: nenhuma fonte liga formalmente as duas apurações entre si; a
  coincidência de intermediário e relator é anotada como o que é — coincidência a observar, não conexão
  processual estabelecida.'
