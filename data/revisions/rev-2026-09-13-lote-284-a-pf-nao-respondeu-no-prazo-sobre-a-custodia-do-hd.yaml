title: 'Lote 284 — a Polícia Federal não respondeu no prazo sobre a custódia do HD do celular de Vorcaro'
summary: 'Verificação dos andamentos da Pet 16.704 (13/09/2026 em diante): o prazo de 24 horas dado pela
  Presidência do STF à Polícia Federal em 12/09/2026, para informar sobre a custódia e o estado da cópia
  lacrada dos dados do celular de Vorcaro, venceu sem qualquer ofício ou informação da PF nos autos. A dois
  dias da sessão extraordinária de 15/09/2026, a disputa entre os ministros pelo acesso à mídia segue sem
  resposta oficial sobre seu estado. Achado negativo, mas relevante — enriquece fato já publicado (a disputa
  pelo HD lacrado), sem evidência nova própria. Enriquecimento adicional (peer fork, Pet 15.198/DF): as
  petições 33324/2026 e 36726/2026, citadas no agravo do lote 283 como origem da documentação de defesa de
  Quadrado/Almeida/Aguetoni, são confirmadamente sigilosas — inacessíveis mesmo à conta autenticada do
  Rafael, não apenas "não lidas por falta de tempo" como registrado antes.'
