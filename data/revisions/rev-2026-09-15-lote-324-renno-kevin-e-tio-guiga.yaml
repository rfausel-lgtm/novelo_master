title: Lote 324 — as mensagens do "500 mil mês", o administrador de fato e o que a PF diz de Tio Guiga
summary: 'Registra as mensagens publicadas em 15/09/2026 por Metrópoles e Folha, extraídas do celular de Vorcaro,
  em que Luiz Rennó encaminha o contato de "Kevin Marques" com "500 mil mês - mantém?" e cita a Consult entre "pagamentos
  essenciais" — em classe A: a imprensa associa o contato ao filho do ministro Nunes Marques sem documento, as reportagens
  ressalvam que as mensagens não comprovam pagamento, e o material integral do celular segue sob sigilo no STF.
  Rennó passa a ter a indisponibilidade de bens decretada pelo Banco Central em 05/05/2026 como administrador de
  fato do Master; o cargo de diretor jurídico fica como atribuição da imprensa, porque a PF o dá a André Kruschewsky
  Lima em período anterior. A releitura da representação da PF sobre Wagner acrescenta a Guilherme Sodré os presentes
  de Augusto Lima endereçados a "Tio Guiga", a menção do diretor comercial do Master e as tratativas com Daniel
  Lopes Monteiro sobre o apartamento do Poème Horto, abertas por telefone repassado por Kruschewsky. Entram ainda
  a MMSM Patrimonial, sociedade de Guilherme e do filho Eduardo, o IPGT, sociedade de Kevin Marques com o filho
  do dono da Consult, e o sítio de Andaraí comprado em 2015 por Wagner e Guilherme.'
