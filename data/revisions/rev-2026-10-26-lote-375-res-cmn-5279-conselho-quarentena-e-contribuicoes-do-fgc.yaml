title: "Lote 375 — Res. CMN 5.279: o que o texto consolidado do FGC passou a prever sobre Conselho, quarentena
  e contribuições"
summary: "Completa o registro documental da Res. CMN 5.279, de 22/1/2026, com mais oito conjuntos de
  dispositivos do estatuto do FGC (Anexo I da Res. 4.222) que o texto consolidado publicado pelo BC (v19,
  classe D) marca como redação dada, incluído ou revogado pela 5.279: composição e impedimentos do Conselho de
  Administração (art. 25), mandato de até três anos com limite de seis consecutivos (art. 26), voto de
  qualidade e quórum qualificado (art. 28, §§ 4º a 4º-C), nomes submetidos ao BC e condições de posse (art.
  31, caput e § 1º, I), quarentena de seis meses, sigilo e impedimentos (art. 31, § 1º, II a IV), gestão de
  fundos de investimentos de que o FGC seja cotista exclusivo (art. 5º, § 5º) e três regras de contribuições
  (art. 10, §§ 3º a 5º). Atualiza as descrições do evento, do ato e do documento, que diziam registrar só
  alguns dispositivos. O lote não traz a redação anterior, não compara antes e depois, não usa o texto
  original da 5.279 nem afirma a data de início de vigência, e não estabelece nexo com nenhum caso concreto."
