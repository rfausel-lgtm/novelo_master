title: 'Lote 263 — o primo de Toffoli, a DGEP e o que a CPI escreveu para convocar os irmãos do ministro'
summary: 'Os quatro requerimentos da CPI do Crime Organizado que convocaram os irmãos de Dias Toffoli, lidos na íntegra,
  têm duas motivações. Os de Magno Malta citam reportagem sobre jogos de azar no Resort Tayayá. Os de Alessandro Vieira
  apontam a Maridt e uma segunda empresa, a DGEP, como cedentes de cotas do resort ao fundo Arleen, administrado pela
  antiga Reag Trust, e falam em suspeita de "utilização de influência institucional". O terceiro nome citado, Mario
  Umberto Degani, é primo do ministro e fundador do resort, e vendeu sua parte em 2025 a Paulo Humberto Barbosa —
  investigado do INQ 5.026 cujo papel o acervo ainda não conhecia.'
