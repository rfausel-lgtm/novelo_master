title: Lote 75 — a mesa institucional do Master, nomeada
summary: 'A ata de 14/03/2024 traz o achado que fecha a hipótese do canal: o próprio banco nomeia os cinco
  regimes próprios já captados — Rioprevidência, Maceió, Paulista, Cajamar e Araras —, todos presentes
  na lista final dos dezoito compradores. A carteira pública já conquistada era o argumento de venda para
  o comprador público seguinte. Verificação primária da Lista Exaustiva do Ministério da Previdência:
  o Banco Master não constava em 06/05/2024 e constava em 11/04/2025; a data da inclusão, que o banco
  previra para julho de 2024, não foi localizada. Registrados os intermediários remunerados — a comissão
  atribuída pela PF ao lobista do Rioprevidência e a intermediação da Planner Corretora — e o parecer
  que o escritório Barci de Moraes produziu para o banco, em julho de 2024, sobre a captação junto a RPPS.
  Corrigido o total nacional para R$ 1,876 bilhão.'
