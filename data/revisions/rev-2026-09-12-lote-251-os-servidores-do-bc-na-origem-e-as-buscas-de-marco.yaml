title: 'Lote 251 — como a PF descreveu os servidores do BC, e a ordem das buscas de março'
summary: 'Duas peças que estavam na origem de frentes já conhecidas. A representação da Polícia Federal de 23/02/2026,
  que abriu a PET 15.504, descreve Paulo Sérgio Neves de Souza e Belline Santana, então no comando da supervisão
  bancária do Banco Central, como "consultores informais" de Daniel Vorcaro que revisavam minutas destinadas ao
  próprio BC e ao FGC num grupo de mensagens chamado "Master" — hipótese da PF, registrada como alegação. E a decisão
  de 03/03/2026 na PET 15.562, até aqui só citada de passagem, é a ordem judicial das buscas cumpridas em 04/03:
  alcançou oito pessoas e cinco empresas que Mendonça chamou de "típicas empresas de fachada", e também Luís Felipe
  Woyceichoski, ex-capitão da embarcação de Vorcaro e vítima da ameaça atribuída à Turma, que não era investigado —
  a PF queria dele os vídeos e contatos que ele dizia guardar sobre o grupo.'
