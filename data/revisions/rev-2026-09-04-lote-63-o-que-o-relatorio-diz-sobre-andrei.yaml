title: 'Lote 63: o que o relatório da PF diz — e não diz — sobre o diretor-geral'
summary: 'Terceira parte da frente aberta pelo editor sobre agentes da PF. A equipe obteve e leu a íntegra
  das 218 páginas do relatório IPJ-A nº 3298613/2026 e encontrou o elemento mais exculpatório do documento,
  que não constava do corpus: não há contato salvo com o nome de Andrei Passos no celular de Vorcaro,
  nem uma única mensagem trocada entre os dois — todas as menções são de terceiros, e o relatório usa
  o condicional. O documento ainda declara que não realizou atos de aprofundamento investigativo e que,
  pelo prazo de 72 horas, não tem caráter exaustivo. Em contrapartida, o mesmo relatório transcreve a
  trilha do convite ao fórum de Londres de abril de 2024: a pergunta atribuída à assistente do diretor-geral
  sobre quem cobriria hospedagem e passagem, e a resposta ''todas as despesas bancadas por nós''. A PF
  confirmou por LAI que o organizador custeou as despesas. Registra-se a degustação de US$ 640 mil custeada
  por Vorcaro, com a ressalva de proporcionalidade de que ele não foi o único nem o de maior hierarquia
  entre os cerca de 40 presentes. Fecha com o inventário dos sete procedimentos que o alcançam — nenhum
  decidido, nenhum inquérito instaurado — e com o registro da lacuna mais séria da cobertura: ele nunca
  se manifestou sobre o mérito, e o corpus mantém o espaço aberto a direito de resposta.'
