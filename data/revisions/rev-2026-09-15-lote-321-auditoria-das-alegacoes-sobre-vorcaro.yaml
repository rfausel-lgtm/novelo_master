title: 'Lote 321 — auditoria das ligações classe A de Vorcaro, e a promessa de Ricardo Siqueira tem três meses e meio'
summary: 'Auditoria das 57 relações classe A que envolvem Daniel Vorcaro, feita a partir da revisão estrutural do
  grafo. Resultado: a predominância de classe A no centro do grafo é, em regra, classificação correta, não
  fragilidade. Das 19 relações A que já tinham evidência documental ligada, 17 são alegações investigativas — o
  documento prova que a PF ou a PGR afirmou, não que o fato ocorreu — e permanecem em A. As seis sem nenhuma
  evidência ligada foram conferidas contra suas fontes: dizem o que o rótulo afirma e seguem em A, por serem fonte
  única ou alegação. Uma única promoção se justificou: a convocação de Vorcaro como testemunha pela CPI do Crime
  Organizado e o cancelamento do depoimento por sua prisão são fatos institucionais registrados por duas
  publicações oficiais do Senado e por decisão do STF já no acervo, e a relação passa de A para C. O lote corrige
  ainda uma data: a promessa de Ricardo Siqueira Rodrigues de revelar à PF o político "dono" do Rioprevidência foi
  feita em entrevista ao Metrópoles em 31/05/2026, dias depois da 8ª fase da Compliance Zero — e não em 13/09/2026,
  como o acervo registrara a partir de republicação. Três meses e meio depois, não há notícia pública de que a
  revelação tenha ocorrido.'
