title: 'Lote 252 — o bloqueio de R$ 43,8 milhões da Turma e dos Meninos, e as contas que estavam vazias'
summary: 'Leitura das respostas ao bloqueio patrimonial da PET 16.019, decretado em 13/05/2026 contra sete integrantes
  da "Turma" e dos "Meninos". O teto somava R$ 43,8 milhões. Nas respostas escritas juntadas até agosto, a Marinha não
  achou embarcação, a ANAC não achou aeronave, e os bancos acharam contas zeradas, canceladas ou com centavos — R$
  0,08 de Manoel Mendes Rodrigues no Nubank, R$ 0,66 de Victor Lima Sedlmaier na Coinbase. Os maiores valores foram
  frações de ações de um policial aposentado e quotas de cooperativa que o Sicredi diz serem impenhoráveis. Das
  catorze corretoras de criptoativos oficiadas, dez não tinham respondido até 22/06. Bloqueios feitos pelo fluxo
  automático do SISBAJUD podem não aparecer nas respostas, e o registro diz isso.'
