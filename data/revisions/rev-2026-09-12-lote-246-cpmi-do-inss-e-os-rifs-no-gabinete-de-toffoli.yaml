title: 'Lote 246 — a CPMI do INSS também quis Vorcaro, e dois RIFs do COAF foram parar no gabinete de Toffoli'
summary: 'Leitura das peças não-decisórias de maior valor do INQ 5.026 (ofícios juntados ao processo).
  A CPMI do INSS convocou Vorcaro como testemunha para 26/02/2026, recusou videoconferência e pediu ao
  então relator, Dias Toffoli, comparecimento compulsório e transporte em aeronave particular dos próprios
  advogados de defesa, com escolta da Polícia Legislativa — terceira frente parlamentar a buscar o
  depoimento dele no mesmo mês, e um pedido que contrasta com a vedação a aeronave particular imposta
  depois por André Mendonça. E um ofício do presidente do COAF, de 25/02/2026, revela que, em cumprimento a
  decisão na Reclamação 88.121, dois Relatórios de Inteligência Financeira — um pedido pela CPMI e outro
  espontâneo — tinham sido compartilhados com o gabinete de Toffoli, e pede ao novo relator orientação sobre
  difundi-los à CPMI, à PF e ao MPF.'
