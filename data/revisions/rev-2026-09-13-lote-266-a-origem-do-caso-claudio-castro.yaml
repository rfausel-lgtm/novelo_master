title: 'Lote 266 — a origem do caso Cláudio Castro: jantares, whiskey e um "operador político" no Rioprevidência'
summary: 'A PGR, na Pet 16.704 (lote 265), listou 17 processos excluídos do levantamento de sigilo de 10/09;
  a PET 15.497 já era conhecida em parte — é a petição que, em 26/05/2026, levou à busca contra Cláudio Castro
  —, mas o acervo só tinha a comunicação oficial de imprensa sobre a busca, nunca a peça de origem. Lida
  agora por inteiro: a representação da PF de 20/02/2026 aponta que Daniel Vorcaro teria custeado jantares de
  luxo em Nova York e um evento de "degustação de whiskey" de mais de US$ 1 milhão em favor do então
  governador, e cita mensagens do operador financeiro Ricardo Siqueira Rodrigues sobre "alinhamento político"
  necessário para liberar os aportes bilionários da RioPrevidência no Master — referindo-se a um "dono" do
  órgão e a um "operador político" que "manda lá de verdade", sem nomeá-los. André Mendonça autorizou a
  instauração do procedimento em 28/04/2026, quase um mês antes da busca já conhecida. A própria petição da
  PF pediu que o caso não fosse avocado de imediato ao STF, para preservar a Operação Barco de Papel em curso
  no Rio, e observou que a competência originária seria do STJ caso o núcleo da apuração recaia só sobre o
  governador.'
