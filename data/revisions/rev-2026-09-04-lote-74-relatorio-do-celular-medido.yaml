title: Lote 74 — o relatório do celular, medido
summary: 'Classificação das 109 menções a ''Moraes'' no relatório da PF, uma a uma, por contexto: 51 ao
  ministro ou ao contato salvo, 58 ao escritório da esposa, nenhuma a terceiro homônimo. A contagem bruta
  quase empata, mas a arquitetura do documento não: a seção ''Da análise do destinatário das notas'' ocupa
  190 das 218 páginas, das quais só cerca de 31 tratam dos contratos do escritório. Registrado que o relatório
  não imputa conduta a magistrado e não cita nenhuma decisão, voto ou ato de ofício; que a titularidade
  da linha não está demonstrada; que os metadados da minuta trazem nome de conta de usuário, não autoria;
  e que a manifestação da PGR ataca a via processual, não o mérito. Acrescentada a PET 16.704, aberta
  de ofício por Fachin, cujo objeto alcança a conduta da própria Polícia Federal. Distinguidos os dois
  relatórios da PF que a cobertura vinha embaralhando.'
