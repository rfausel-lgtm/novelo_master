title: 'Lote 159 — os dois remetentes que a decisão não explicou: a via cambial e o amigo de Flávio'
summary: 'A decisão da Operação Make Up lista cinco remetentes de dinheiro à produtora de ''Dark Horse'' no período
  das filmagens e se detém em apenas um deles, o deputado Mário Frias. Este lote puxa os dois que ficaram sem uma
  linha sequer. O primeiro é o maior de todos: a Moneycorp Banco de Câmbio S.A., com R$ 3.920.976,40 — mais do que
  Frias e a NTT Brasil somados. A equipe verificou o que a decisão não verificou: a instituição consta da base do
  Banco Central como banco de câmbio autorizado, com capital de R$ 19,5 milhões e atividade desde 2006. Banco de
  câmbio não é fonte de dinheiro próprio; é quem liquida, em reais, a operação de um cliente — de modo que a maior
  entrada de dinheiro na produtora, no mês em que se filmava em São Paulo, tem, com alta probabilidade, origem no
  exterior, e a decisão não pergunta de quem. Fica registrado como inferência, com o raciocínio e os limites escritos,
  e com a ressalva expressa de que nenhum documento liga esse crédito a Vorcaro, ao Master ou ao Havengate — embora
  o corpus já registre que o fundo americano recebeu US$ 12,3 milhões do banqueiro entre fevereiro e setembro de
  2025, e que as filmagens vieram logo depois. O segundo remetente tem nome e agora tem rosto: ''Marcello de Oliveira
  Lopes'', que aparece na decisão sem qualificação alguma, é o publicitário Marcello Lopes, o ''Marcellão'', amigo
  pessoal de Flávio Bolsonaro e marqueteiro de sua pré-campanha presidencial até 20/05/2026, quando saiu em meio
  à repercussão das mensagens do senador com Vorcaro. Procurado no dia da queda do sigilo, confirmou o R$ 1 milhão,
  disse tê-lo aportado como investidor a pedido de Mário Frias e entregou contrato de US$ 185.185,19 — assinado,
  porém, só em 04/06/2026, seis meses depois do dinheiro e já com o caso Master deflagrado. Sua explicação para
  ter investido é, ela própria, o achado mais pesado do lote: ''quando parou de ter o dinheiro lá em outubro que
  Vorcaro investia, a turma toda estava gravando em São Paulo, tinham que fazer monte de pagamento e abriram cotas
  para investimento''. É a primeira vez que um participante afirma, em nome próprio, que dinheiro do banqueiro sustentava
  a produção — quatro meses depois de Frias declarar publicamente que não havia ali ''um único centavo'' de Vorcaro.
  As duas são declarações atribuídas, e assim ficam registradas. Lopes não é investigado, não foi alvo de busca
  e não recebeu medida cautelar.'
