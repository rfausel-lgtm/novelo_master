corrections:
- 'tirreno.yaml afirmava que a empresa foi "criada por Daniel Vorcaro" — sem lastro documental. Corrigido:
  a leitura direta do IPL mostra origem em Daniel Moreira Bezerra (SX 016), com André Seixas Maia assumindo
  a direção depois da renomeação. Nenhum documento primário lido até agora atribui a criação a Vorcaro.'
- 'ev-alberto-felix-intimado-ipl-2025-0087917 registrava o IPL 2025.0087917 como "distinto e ainda não
  identificado no acervo" — resolvido: é o próprio IPL que originou toda a apuração do caso Master, hoje
  lido por inteiro.'
