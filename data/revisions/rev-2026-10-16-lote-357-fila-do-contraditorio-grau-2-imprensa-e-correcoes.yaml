title: 'Lote 357 — Fila do contraditório, grau 2 (2/2): tentativas de contato sem resposta e notas
  institucionais (UNLTD, Kruschewsky, Renata Varandas, Manoel Mendes Rodrigues e outros); a correção de "ação
  penal" no verbete de David Ágape; e erros objetivos de atribuição (data da condenação de Oliver Ortiz, teto
  de bloqueio de Manoel Mendes Rodrigues, o instrumento processual de David Ágape)'
summary: 'Segunda parte da rodada da fila de grau 2 (15 pessoas e uma organização neste lote), no mesmo método
  do lote 356: por pessoa, busca em 16/10/2026 de nota, entrevista, manifestação nos autos ou tentativa de
  contato; quando há, cited_position ganha tipo, data e fonte; quando não, not_located ganha a descrição da
  busca. O que o lote NÃO afirma, em destaque: não afirma que a UNLTD tenha ou não contrato com o Banco Master
  (registra apenas a negativa da agência à CNN Brasil, em 08/01/2026); não resolve se "Anderson Antunes"
  (decisão de Mendonça na PET 16.346, lida por OCR) é o "Anderson Nunes" do Poder360 e da base da Receita
  Federal, e por isso não renomeia o verbete; não afirma que as tentativas de contato sem resposta signifiquem
  recusa; não registra a condenação de Oliver Ortiz como fato documentado (não há sentença no acervo); não
  adota as imputações das reportagens sobre Garigham Amarante Pinto e Nara Brum, que seguem atribuídas à PF e
  à decisão do ministro Flávio Dino; não registra a lotação de Garigham na Câmara (não conferida em fonte
  oficial); e não trata nenhuma nota institucional como fala da pessoa. Camada A, sempre atribuída: tentativas
  de contato sem resposta, com veículo, data e meio — André Salvador e a UNLTD (Estadão Conteúdo, 08/01/2026;
  Poder360, 09/01 e 09/07/2026); Eugênio Kruschewsky (coluna Esplanada, 13/11/2025); Renata Varandas
  (Poder360, 08/09/2026, por WhatsApp, às 11h34; Gazeta do Paraná, 25/06/2026); Garigham Amarante Pinto
  (Metrópoles, 10/07/2026: procurado, disse que não vai se manifestar); Oliver Ortiz (ICL Notícias, 09/03 e
  05/05/2026). Posições: a negativa institucional da UNLTD à CNN Brasil (08/01/2026) passa a constar na
  organização e não na pessoa de André Salvador; as notas do escritório Barci de Moraes (09/03 e 02/09/2026)
  constam no verbete de Guilherme de Toledo Benazzi com a ressalva de que não o nomeiam; a nota do escritório
  Gabino Kruschewsky (45 mil processos, mais de 30 mil em andamento), que não é fala de Eugênio pessoalmente;
  as autopublicações de David Ágape (11/11/2025 e 29/01/2026) e o pedido de correção de 08/09/2026; a
  justificativa de Humberto Costa em um dos requerimentos de convocação de Belline Santana (Agência Senado,
  20/03/2026); a petição dos advogados de Leonardo Antônio Lima Dias nos autos e a nota que, segundo o Intercept
  Brasil (21/05/2026, texto lido no navegador embutido), Leo Dias divulgou em janeiro de 2026 sobre a
  transferência da participação de Thiago Miranda. Correções de atribuição, conferidas contra os registros do próprio acervo: o
  instrumento que atingiu David Ágape e Eli Vieira era uma representação criminal (Pet 14.760, conforme o nome do arquivo dos autos
  hospedado pelo Poder360) arquivada
  por Moraes em janeiro de 2026 (27/01 segundo o Poder360; 28/01 segundo Ágape), e não "ação penal";
  "condenado em dezembro de 2013" deixa de constar sem atribuição em Oliver Ortiz (a condenação a 16 anos
  e a data passam a constar atribuídas ao ICL Notícias, fonte única reproduzida pelo Cubo Jornalismo;
  sentença não localizada); "R$ 9,6 milhões bloqueados" em
  Manoel Mendes Rodrigues era o teto do bloqueio na PET 16.019, não o valor encontrado (R$ 0,08 em conta dele,
  conforme evidência do lote 252), e a decretação da preventiva (13/05) distingue-se da notícia do cumprimento
  (14/05). Registros de fonte corrigidos: título, data de consulta e data de publicação de duas fontes sobre
  Renata Varandas. Não confirmado: o instrumento processual exato e a data de assinatura da decisão sobre a
  representação contra Ágape e Vieira (o PDF da decisão não foi aberto em texto); o nome do juiz Jucelio
  Fleury Neto, que vem da decisão e não do Poder360; o cargo de carreira exato de Nara Brum e a atuação
  pessoal de Eugênio Kruschewsky nos casos do Master; a defesa de Talarico e de Wily da Silva Leão, cujo prazo
  no TCDF não tem termo inicial documentado. O título da fonte autopublicada de A Investigação (29/01/2026)
  foi abreviado entre colchetes para não nomear a autora da representação, pessoa sem papel no caso
  Master; a URL original é mantida. Nenhum registro novo de pessoa, organização, evento, documento,
  relação ou evidência; nenhuma relação alterada. Verbetes e trechos que a liberação previa e que dependem de
  decisão do responsável editorial ficaram de fora.'
