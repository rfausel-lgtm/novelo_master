corrections:
  - 'oliver-ortiz-de-zarate-martin, ev-oliver-ortiz-preso-e-condenado-2013: "condenado em dezembro de 2013"
    constava sem atribuição, e o role afirmava a condenação como fato; passaram a "segundo o ICL Notícias
    (reproduzido pelo Cubo Jornalismo), condenado a 16 anos; só o ICL situa a condenação em dezembro de
    2013", com sentença e processo não localizados. A tentativa de contato foi do ICL Notícias (09/03 e
    05/05/2026), não do Cubo; o by_id autorreferente do no_response foi retirado.'
  - 'manoel-mendes-rodrigues: "teve R$ 9,6 milhões em bens e valores bloqueados" era o teto do bloqueio na PET
    16.019, não o valor encontrado; a decretação da preventiva (13/05/2026) foi distinguida da notícia do
    cumprimento (14/05/2026); alias "Dom" acrescentado.'
  - 'david-agape: "ação penal" era representação criminal (Pet 14.760); a caracterização da autora como
    "ex-colaboradora do TSE" é dos próprios autores e passou a vir atribuída; "por falta de indícios mínimos
    de crime" e "atrito pessoal direto" foram reescritos com atribuição ao Poder360 e aos fatos conferidos; o
    not_located foi substituído pelas autopublicações e pelo pedido de correção de 08/09/2026.'
  - 'eugenio-de-souza-kruschewsky: o requerimento da CPMI do INSS foi lido pela equipe em 09/09/2026 (o
    verbete dizia "não lido") e pede acareação; o not_located foi substituído pela tentativa de contato da
    coluna Esplanada e pela nota do escritório.'
  - "unltd-network-brazil, andre-salvador-unltd: a organização tinha not_located embora o resumo já
    registrasse a negativa de contrato com o Banco Master (agora atribuída à CNN Brasil, com data); o sócio e
    a contratação passam a vir com atribuição ao Estadão Conteúdo e à PF; a referência ao depoimento de Thiago
    Miranda à PF foi retirada do resumo de André Salvador, porque o trecho lido do Poder360 não cita a UNLTD."
  - 'renata-varandas, src-poder360-2026-09-08-namorada-andrei-lobby-ambipar,
    src-gazetadoparana-2026-exclusivo-escritorio-namorada-andrei-defende-socio-vorcaro: o not_located
    contradizia o resumo, que já registrava a tentativa de contato do Poder360; título da fonte do Poder360
    ("Mulher de Andrei ..."), retrieved_at anterior à publicação e data incompleta ("2026") da fonte da Gazeta
    do Paraná corrigidos. O resumo da fonte da Gazeta do Paraná de 28/06/2026 dizia que ela registrava
    tentativa de contato com a banca, o SBT News e a jornalista; o trecho está na reportagem de 25/06/2026,
    que passa a ser a fonte do no_response.'
  - "marcelo-talarico, wily-da-silva-leao: by_id autorreferente retirado do not_located; o prazo de 30 dias do
    TCDF passa a constar sem termo inicial documentado; segunda fonte (Reuters, IstoÉ Dinheiro) para a
    renúncia de Talarico."
  - "leonardo-antonio-lima-dias: referência ao CPF retirada do resumo; why_in_novelo não afirma mais vínculo
    societário atual (a transferência da participação começou no fim de 2025, segundo nota divulgada por
    Leo Dias e reproduzida pelo Intercept Brasil); not_located substituído pela petição dos advogados e
    por essa nota."
  - 'humberto-costa: a justificativa que o acervo atribuía aos dois requerimentos de convocação consta, na
    Agência Senado, em "outro requerimento", sem identificar qual; o cargo de senador ganhou position.'
  - "garigham-amarante-pinto: not_located substituído pela tentativa de contato do Metrópoles; o resumo deixou
    de dizer que o cargo não era conhecido, sem registrar a lotação, que não foi conferida em fonte oficial."
  - 'guilherme-de-toledo-benazzi, nara-brum, jucelio-fleury-neto, anderson-antunes-unltd: not_located genérico
    ("no corpus") substituído por descrição da busca ou por notas institucionais que não os nomeiam; o artigo
    do Poder360 de 10/02/2026 não nomeia o juiz (nome vem da decisão).'
