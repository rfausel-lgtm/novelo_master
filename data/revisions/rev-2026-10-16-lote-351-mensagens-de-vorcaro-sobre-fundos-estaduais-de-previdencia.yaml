title: 'Lote 351 — Mensagens de Vorcaro sobre a captação de fundos estaduais de previdência (UOL, 16/10): o que mostram sobre Antônio Rueda, ACM Neto e Fernando Mascarenhas, o dia 12/07/2024 no Amapá e o que as mensagens não mostram; e as mensagens de Alcolumbre noticiadas pela Veja'
summary: >-
  Segundo dos dois lotes sobre conversas do celular de Daniel Vorcaro publicadas pela imprensa. O que NÃO se
  afirma, em destaque: o próprio UOL ressalva que as mensagens "não mostram pagamento de comissão diretamente
  aos dois dirigentes do União Brasil", Antônio Rueda e ACM Neto; a comissão de 10% atribuída a eles continua
  sendo alegação da terceira proposta de colaboração de Vorcaro (classe A, disputada), e este lote não a
  promove; o Novelo não localizou Pet, relatório ou decisão de origem das mensagens, nem a decisão sobre o
  pedido de buscas da PF contra os dois que, segundo o UOL, o STF não chegou a autorizar; mensagem que exista no
  aparelho periciado prova que está lá, não que o conteúdo seja verdadeiro. Camada A, de uma só apuração (UOL,
  coluna de Fabio Serapião, com Natália Portinari e Cézar Feitoza, 16/10/2026; Bahia Notícias, Revista Fórum,
  Goiás 246, Brasil 247 e NC News republicam): mensagens extraídas pela PF, citadas de 11/2023 a 07/2025,
  registram contatos de Rueda com Vorcaro e com o diretor comercial do Master, Fernando Mascarenhas (no acervo,
  fernando-de-goes); a oferta de jatos (12/2023) e de hospedagem em hotel em São Paulo (03/2024) a Rueda; a
  contratação do escritório Rueda & Rueda em quatro ações, R$ 15,4 milhões apresentados a Vorcaro em 08/2024
  (valor contratado, não pago); uma lista de captações em andamento em 12/07/2024 (Amapá 400, Rio de Janeiro
  350, Amazonas 250, Campos dos Goytacazes 160, Maricá 500, Belo Horizonte 100 e Alagoas 200, em R$ milhões),
  que são operações em negociação, não transferências, sem total publicado; a comissão da "consultoria do
  Ricardo/Raphael", atribuída pelo UOL a Ricardo Siqueira Rodrigues, pela operação do Amapá (R$ 8,9 milhões
  pedidos, nota de R$ 8 milhões autorizada e R$ 11 milhões registrados como "comissão Amapá" em 01/08/2024),
  que nas mensagens é de terceiros, não de Rueda; e encontros de ACM Neto e Rueda com Vorcaro em 09 e 10/2024.
  Em 12/07/2024, segundo o UOL, Rueda pediu a Vorcaro às 11h45 que apagasse mensagens e, cerca de uma hora
  depois, Mascarenhas relatou a aprovação de R$ 200 milhões no Amapá. Camada D, já no acervo e relida em
  16/10/2026: a ata da 11ª Reunião Extraordinária do comitê de investimentos da Amprev registra a aprovação
  unânime de R$ 200 milhões em letras do Master nesse dia, em reunião aberta às 10h49 e encerrada às 11h13,
  antes das duas mensagens; a ata não menciona Rueda, e a sequência tem causalidade não comprovada. As cifras do
  Amapá no UOL (400 "confirmado" em 04/2024, 200 aprovados em 12/07, 300 já transferidos até 01/08) não são
  reconciliadas. Rueda diz que a relação com o Master era "eminentemente profissional", nega a viagem de
  11/2023 e as negociações do Amapá; ACM Neto chama os vazamentos de "seletivos, manipulados e fora de contexto"
  e nega ter atuado junto a institutos. Segundo a Bahia Notícias e o SBT News (25/09), a Veja publicou mensagens
  de 2025 com expressões de amizade entre Vorcaro e Davi Alcolumbre, que as chama de pessoais e anuncia medidas
  judiciais; a Veja não foi aberta. Nenhuma pessoa ou organização nova. Fora do lote: a lista do Ministério da
  Previdência (UOL, 12/10), associações feitas só por veículos republicadores, frases de terceiros sobre
  terceiros, familiares e cargos eleitorais. Não confirmado: origem processual; fuso dos
  horários; conteúdo das mensagens apagadas; documentos da tesouraria; identidade de "Raphael".
