reason: >-
  Linha WA4 (Rueda, ACM Neto, fundos estaduais de previdência e Alcolumbre), liberada pelo investigador-chefe em
  16/10/2026; segundo dos lotes 350 e 351 sobre conversas vazadas. Orientação editorial de Rafael aplicada:
  conexões e proximidade entre agentes e o investigado entram, e o teor só em trechos curtos, atribuídos e já
  publicados (EDITORIAL §6), aqui limitados a expressões da própria fonte; vocabulário de imputação não entra
  em texto próprio; mensagem juntada aos autos prova que existe no aparelho periciado, não que o conteúdo é
  verdadeiro; o rastro (fonte, data, interlocutores, documento de origem) fica completo para corroboração
  futura. Fica registrado que o relatório da linha WA4 errava ao propor classe D para a presença do Master na
  Lista Exaustiva do Ministério da Previdência em maio de 2024: o acervo documenta o contrário
  (ev-master-nao-estava-na-lista-exaustiva-em-maio-de-2024), e a reportagem do UOL de 12/10 fica fora até se
  verificar de que lista trata.
