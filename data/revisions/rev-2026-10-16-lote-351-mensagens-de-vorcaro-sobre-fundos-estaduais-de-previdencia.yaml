corrections:
- 'acm-neto: a posição not_located genérica ficou obsoleta e foi substituída pela negativa de 16/10/2026 ao UOL e pela negativa de 10/09/2026 (já registrada na relação financeira e agora também no verbete); cargo e resultado eleitoral não alterados.'
- 'fernando-de-goes: acrescentado o alias "Fernando Mascarenhas", nome usado pelo UOL para o diretor comercial do Master (mesmo nome completo e cargo já registrados no verbete), o que evita a criação de uma duplicata; a posição not_located genérica foi substituída por not_located datado de 16/10/2026, com a descrição da busca e o registro de que o UOL não informa ter procurado o executivo.'
- 'alberto-felix-oliveira e ricardo-siqueira-rodrigues: acrescentada posição not_located de 16/10/2026 sobre as mensagens publicadas pelo UOL, com a descrição da busca.'
- 'alberto-felix-oliveira, ev-alberto-felix-prisao-domiciliar-e-viagem-humanitaria e src-stf-inq5026-decisao-30-04-2026-alberto-felix-viagem-humanitaria: retirado o nome do pai falecido, familiar sem papel no caso (EDITORIAL §6; METHODOLOGY §2); no verbete, "revelou" → "registra".'
- 'ricardo-siqueira-rodrigues: summary e why_in_novelo reescritos com atribuição expressa ao documento comprobatório da PF, à representação da PF e ao Diário do Rio, sem os termos "esquema", "fraude" e "vantagens indevidas" em texto próprio e sem "interferência política"; "operação fraudulenta" fica entre aspas como caracterização da CVM; registrado que o corpus não traz desfecho judicial das operações Rizoma, Circus Maximus e Encilhamento. Nenhum fato, valor ou fonte mudou.'
- 'antonio-rueda: no summary, "fundos ... ligados ao esquema de combustíveis do PCC" → "fundos ... que a operação associa à atuação do PCC no setor de combustíveis"; "o UOL revelou" → "o UOL publicou".'
- 'acm-neto: no summary, retirada a menção à esposa como sócia da A&M (desnecessária à proposição; o registro societário segue no verbete da empresa) e "o UOL revelou" → "o UOL publicou"; why_in_novelo reescrito em frase factual (sócio-administrador da A&M, pagamentos declarados por ele, citação na proposta de colaboração que ele nega), sem "maior projeção nacional" nem "rede".'
- 'evt-2024-07-12-ciap-aprova-200-mi-em-letras-do-master: acrescentados os horários de abertura (10h49) e encerramento (11h13) da reunião, lidos na ata em 16/10/2026, e a remissão ao evento das mensagens do mesmo dia.'
- 'Correções ao plano de redação (não são de registro publicado): (1) o evento previsto para a aprovação de 12/07/2024 pelo comitê da Amprev já existia (evt-2024-07-12-ciap-aprova-200-mi-em-letras-do-master) e foi reutilizado, sem duplicata, por isso events = 3; (2) a ata registra encerramento às 11h13, antes da mensagem de Rueda das 11h45 e do relato de Mascarenhas cerca de uma hora depois, e a sequência foi reescrita nessa ordem, com a ressalva de que o UOL não informa o fuso; (3) o UOL fala em contratação do escritório Rueda & Rueda "em quatro ações", não em quatro contratações; (4) "entre os quais o Amapá Previdência", na posição de ACM Neto, é paráfrase do UOL, não citação, e entra sem aspas; (5) a nota publicada de ACM Neto não trata dos encontros de 2024; (6) o UOL relata a aprovação no Amapá e o registro de R$ 11 milhões em sequência, mas não afirma literalmente que esse pagamento foi feito à consultoria; o texto diz "no contexto" da comissão da consultoria; (7) a data da Veja: matéria de capa da edição que chegou às bancas em 25/09, com nota de Alcolumbre enviada na noite de 24/09.'
