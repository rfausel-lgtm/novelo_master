title: 'Lote 240 — os R$17 bilhões viram fato documental, e o grupo "INFO-BRB" fabricava lastro sob ordem
  de Vorcaro'
summary: 'Fecha a leitura da decisão de 22/06/2026 na PET 15.478/DF. O valor de R$17 bilhões transferidos
  pelo BRB ao Master — até aqui só uma alegação não verificada de requerimento da CPI do Crime Organizado
  — ganha fonte judicial direta, que também explicita pela primeira vez sua relação com o já conhecido
  R$12,2 bilhões (subconjunto de carteiras que o BRB não conseguia auditar). A decisão também nomeia o
  grupo de WhatsApp "INFO-BRB", usado por Alberto Félix de Oliveira e Ângelo Ribeiro da Silva, por
  determinação de Daniel Vorcaro, para fabricar um extrato artificial da conta da Tirreno — e atribui a
  Dário Oswaldo Garcia Júnior (BRB) conhecimento pessoal das inconsistências da carteira CREDCESTA desde
  novembro/dezembro de 2024, resolvendo em parte uma lacuna que o perfil dele já sinalizava.'
