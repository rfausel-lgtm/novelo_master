corrections:
- 'CPF de pessoa física: o verbete de um titular formal de empresas apontado pela PF como testa de ferro
  trazia o número do documento dele. O número saiu; continua publicado o fato que importa — ele é a pessoa
  física titular das duas empresas usadas para receber comissão, com os CNPJ das empresas, que são dado
  público de pessoa jurídica, e com a observação da PF sobre o telefone cadastrado em nome de outro.'
- 'Telefone pessoal de terceiro: um verbete transcrevia, do depoimento juntado aos autos, o número de
  celular de outra pessoa investigada. O número saiu; fica registrado que o depoimento confirmou o novo
  número dele, que é o que tem valor na apuração.'
- 'Endereço residencial identificado: o mesmo trecho nomeava o condomínio e a unidade onde ficava o
  apartamento dessa pessoa. A seção 6 admite o imóvel que é objeto do caso, nunca a unidade nem os
  detalhes de acesso; o endereço foi generalizado para o município, e continua publicado que o
  depoimento confirmou onde ficava o apartamento.'
- 'Falso positivo registrado, sem alteração: a varredura apontou como e-mail pessoal o endereço de
  contabilidade que duas associações baianas registraram na Receita Federal. É caixa funcional em
  domínio de pessoa jurídica, não de pessoa natural, e é justamente o vínculo documental que a PF
  aponta. Fica como está.'
