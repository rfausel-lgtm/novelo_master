date: '2026-09-17'
title: 'Saneamento: dados pessoais reintroduzidos por lotes novos'
summary: 'Segunda passada de auditoria de dados pessoais sobre o acervo publicado — não é apuração nova.
  O saneamento de 13/09 não é estado permanente: lotes publicados depois dele reintroduziram dados que a
  seção 6 da política editorial veda, e a varredura encontrou três em dois verbetes de pessoa. Todos foram
  retirados sem alterar nenhum fato: o que sustenta o caso continua publicado, e só o dado pessoal
  desnecessário saiu. O dado removido não é reproduzido aqui nem em lugar nenhum do acervo.'
