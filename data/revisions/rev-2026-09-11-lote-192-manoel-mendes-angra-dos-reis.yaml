title: 'Lote 192 — o braço carioca de "A Turma": jogo do bicho, milícia e a ameaça reconhecida em Angra dos Reis'
summary: 'Terceiro lote do novo acervo da PET 15.978 (6ª fase, e-Doc 28, lote 190). Revela Manoel Mendes
  Rodrigues, "operador do jogo do bicho" apontado como líder de um braço fluminense de "A Turma", com
  possível composição de milicianos e policiais — e executor identificado da campanha de intimidação
  determinada por Daniel Vorcaro contra Luís Felipe Woyceichoski (já no acervo) em 04/06/2024, na Marina
  Bracuhy e no Hotel Nacional Inn, em Angra dos Reis/RJ. O episódio também atingiu Leandro Garcia (novo),
  que reconheceu Manoel formalmente por fotografia, e teve como testemunha Tatiana Dantas Carta (nova).
  Atualiza o verbete de Woyceichoski com uma divergência de data não resolvida: a representação da PET
  15.556 associa a ameaça contra ele a 11/07/2025, enquanto esta decisão da PET 15.978 data o episódio de
  Angra dos Reis em 04/06/2024 — registrado como pendência, não resolvido se são o mesmo episódio ou dois
  distintos.'
