title: 'Saneamento: os dois núcleos criminais religados ao grafo'
summary: 'Manutenção de integridade do acervo, não apuração nova. Uma auditoria do grafo apontou que 131
  das 381 entidades publicadas não tinham nenhuma conexão registrada — e que o conjunto mais desconectado
  era justamente o mais bem documentado: os núcleos "A Turma" e "Os Meninos". David Henrique Alves, Victor
  Lima Sedlmaier, Rodrigo Pimenta Franco Avelar Campos, Manoel Mendes Rodrigues, Sebastião Monteiro Júnior,
  Erlene Nonato Lacerda, Helder Alves de Lima, Katherine Venâncio Telles e a BIPE Software Brasil tinham
  página publicada e zero ligação: a hierarquia que as decisões do STF descrevem existia na prosa das
  páginas, mas não como estrutura navegável. Esta revisão cria "A Turma" como entidade — citada em todo o
  acervo desde o início, mas até agora sem registro próprio —, formaliza como evidência a cadeia de comando
  de "Os Meninos" e o vínculo de remuneração de David Henrique Alves via BIPE, e publica 20 relações que
  religam os dois núcleos. Nenhum fato novo entra no acervo: o que muda é que fatos já publicados passam a
  ser percorríveis. As imputações de comando contra Daniel Vorcaro entram como alegação atribuída, com a
  negativa expressa da defesa registrada na entidade e nas relações.'
