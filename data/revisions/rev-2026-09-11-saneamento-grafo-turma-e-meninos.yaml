corrections:
- 'Correção estrutural: dez entidades que estavam publicadas sem nenhuma conexão no grafo passam a ter as
  relações que os documentos já sustentavam — David Henrique Alves, Victor Lima Sedlmaier, Rodrigo Pimenta
  Franco Avelar Campos, Manoel Mendes Rodrigues, Sebastião Monteiro Júnior, Erlene Nonato Lacerda, Helder
  Alves de Lima, Katherine Venâncio Telles, BIPE Software Brasil e a organização Os Meninos.'
- 'Lacuna de registro: o núcleo "A Turma" era citado em dezenas de registros do acervo sem existir como
  entidade própria, enquanto seu núcleo irmão "Os Meninos" já existia. A assimetria foi corrigida.'
- 'Ligação ausente: Daniel Vorcaro e Marilson Roseno da Silva coocorriam em oito documentos oficiais sem
  que houvesse relação registrada entre eles. A relação foi criada como alegação atribuída à PF.'
