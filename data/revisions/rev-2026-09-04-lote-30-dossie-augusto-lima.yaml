title: 'Lote 30: enriquecimento do dossiê de Augusto Lima'
summary: 'Pesquisa conduzida por agente convocado em paralelo. Acrescenta ao registro já existente de
  Augusto Lima: sua presença continuada em reuniões do Banco Central como ''CEO do Master'' mesmo após
  a saída formal anunciada em maio de 2024; o dossiê apócrifo (autoria não confirmada) que o chama de
  dono de fato do banco e Vorcaro de laranja — registrado como hipótese sob apuração, classe I; as duas
  notas públicas de sua defesa (junho e agosto de 2026); e a disputa da PKL One, empresa de uma prima,
  pelos repasses do Credcesta em Macapá. Fecha também a lacuna de manifestação pública do Banco Pleno
  sobre sua própria liquidação.'
