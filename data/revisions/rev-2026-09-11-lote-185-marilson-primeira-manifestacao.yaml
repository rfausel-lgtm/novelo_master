title: 'Lote 185 — Marilson Roseno da Silva fala pela primeira vez: nega contato com Vorcaro'
summary: 'Décimo sexto documento explorado do acervo de 416 peças da PET 15.556: o e-Doc 221, petição de
  02/04/2026 que é a primeira manifestação de Marilson Roseno da Silva (ou de defesa em seu nome) localizada
  em todo o corpus — resolvendo um open_question que o verbete dele registrava com destaque, por dever de
  contraditório ("não há manifestação... embora ele esteja preso e seja pessoa identificada sob imputação
  grave"). Ele não nega os fatos centrais (coleta e repasse de informações sobre Vorcaro e pessoas de
  interesse, o rastreamento do drone sobre a casa do banqueiro), mas argumenta que nunca manteve contato
  direto com Vorcaro — apenas com Luiz Phillipi Mourão, já falecido —, que colaborou integralmente com a
  PF em interrogatório de 26/03/2026, e que a PGR não recomendou sua prisão preventiva. Cita como
  dependentes uma filha de 12 anos e a mãe, de 87 anos, enferma.'
