title: 'Lote 33: as sanções Magnitsky contra Viviane Barci de Moraes'
summary: Pesquisa conduzida por agente convocado em paralelo. Acrescenta as sanções da Lei Magnitsky dos
  EUA contra Viviane Barci de Moraes e o Instituto Lex (22/09/2025 a 12/12/2025), a articulação de Eduardo
