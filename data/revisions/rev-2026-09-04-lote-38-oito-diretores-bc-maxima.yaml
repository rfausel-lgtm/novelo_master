title: 'Lote 38: os oito diretores do BC que aprovaram o Máxima em 2019'
summary: Pesquisa conduzida por agente convocado em paralelo. O extrato oficial do voto 218/2019-BCB só
  nomeia o relator; a lista completa dos oito diretores votantes foi reconstruída por reportagem investigativa
  (Poder360), cruzando nomeações públicas — não consta de nenhum documento oficial disponível. Registra
  que quatro dos oito (Maurício Moura, Carolina de Assis Barros, Paulo Sérgio Neves de Souza e Otávio
  Damaso) também estavam na diretoria em fevereiro de 2019, quando rejeitaram o mesmo pedido — 'mudaram
  de voto', sem explicação pública individual localizada. Acrescenta que Roberto Campos Neto evitou ativamente
  depor sobre o tema à CPI do Crime Organizado (três faltas, blindado por habeas corpus do STF), e o questionamento
  institucional de senadores, entre eles Jaques Wagner, na CAE.
