title: 'Lote 237 — escutar primeiro, prender depois: a interceptação secreta de 11/05/2026 que antecedeu a
  6ª fase'
summary: 'A decisão de André Mendonça na PET 15.977/DF, de 11/05/2026, autorizou interceptação telefônica
  e de WhatsApp contra dez integrantes apontados de "A Turma" e "Os Meninos" — dois a três dias antes de
  praticamente todos eles serem alvo de prisão, afastamento de cargo ou cautelar patrimonial na 6ª fase da
  Operação Compliance Zero (13-14/05/2026), já registrada no acervo. É o padrão investigativo típico
  (escuta secreta seguida de ação ostensiva), com data e fundamento até aqui ausentes dos perfis de
  Henrique Vorcaro, Helder Alves de Lima, Erlene Nonato Lacerda e Manoel Mendes Rodrigues — os demais seis
  nomes (David Henrique Alves, Victor Lima Sedlmaier, Rodrigo Pimenta Franco Avelar Campos, Katherine
  Venâncio Telles, Sebastião Monteiro Júnior e Anderson Wander da Silva Lima) ganham a mesma fonte como
  referência adicional.'
