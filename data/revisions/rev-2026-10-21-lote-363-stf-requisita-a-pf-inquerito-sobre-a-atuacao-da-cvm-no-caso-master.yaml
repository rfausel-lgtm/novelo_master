title: Lote 363 — Na ADI 7.791, relator do STF requisita à PF inquérito sobre a atuação da CVM e o
  arquivamento, em 2022, da denúncia do FGC sobre o Grupo Master (decisão de 24/09/2026)
summary: "Lote curto, de camada D (decisão judicial lida na íntegra). O que NÃO se afirma, em destaque:
  decisão que manda investigar não é condenação nem prova; a decisão não nomeia investigados nem atribui
  conduta a pessoa; o Novelo não afirma que houve ilícito na CVM. O evento: em 24/09/2026, na ADI 7.791, o
  relator Flávio Dino requisitou à PF inquérito sobre os fatos descritos na decisão, entre eles o arquivamento
  do Processo SEI nº 19957.001206/2022-08 (aberto em 18/02/2022 a partir de comunicação do FGC sobre o Grupo
  Master), e deu à CVM 72 horas para enviar o processo e informar quem teve acesso, quem o analisou e
  arquivou, o regime de sigilo e as providências posteriores. A íntegra hospedada pelo Poder360 tem camada de
  texto ilegível; o Novelo leu as nove páginas renderizadas como imagem e registrou a transcrição dos trechos
  usados; o código de autenticidade do STF não foi conferido no portal. A decisão de 20/09 (90 dias à União
  para revisar normas) entra só como contexto atribuído ao Poder360. Contraditório: CVM (disse estar
  mobilizada para cumprir, segundo O Povo), PF e FGC `not_located`. Atualiza o verbete da CVM."
