corrections:
  - 'Lote 367 (23/10/2026): o código de autenticidade 7945-FE6E-EABB-E40B foi cotejado com a peça servida pelo portal do STF (downloadPeca id 15390694465, legível por pdftotext); o dispositivo coincide com a transcrição, e a ressalva de código não conferido deixa de valer. Em 19/10/2026 o relator registrou a comunicação da PF sobre a instauração do inquérito (em autos apartados), a ausência de resposta da CVM e a entrega do processo SEI pela União (evento de 19/10).'
