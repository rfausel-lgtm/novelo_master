title: 'Lote 130 — Maurício Quadrado e Artur Martins de Figueiredo: patrimônio, conflito de interesse
  e identidade por CPF'
summary: 'Aprofundamento sobre os dois diretores da Banvox Holding Financeira. Quadrado: conflito de interesse
  documentado por ser, ao mesmo tempo, fiador solidário das debêntures Banvox e controlador da Trustee,
  agente fiduciária da mesma emissão; processo penal anterior e distinto da fraude Master (Operação Greenfield/Caixa,
  denúncia de 2019); acordo com o liquidante do Master para tentar recuperar R$ 230 milhões enviados ao
  Fundo Albali; documento do BRB ancora, por CPF, sua propriedade integral do Albali e da Banvox. Figueiredo:
  identidade confirmada por CPF parcial em três fontes independentes, descartando homônimo; diretor da
  Trustee Holding Financeira desde 2019 — antes de Quadrado —, revisando a hipótese de vínculo recente
  e específico à Banvox; incluído na lista de bens indisponíveis da liquidação da Trustee, mas não na
  da Banvox; papel executivo vs. nominal mantido como inconclusivo. Criada a organização Trustee Holding
  Financeira, distinta da Trustee DTVM já liquidada.'
