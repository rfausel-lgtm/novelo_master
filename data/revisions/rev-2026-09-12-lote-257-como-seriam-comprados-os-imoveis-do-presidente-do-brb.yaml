title: 'Lote 257 — como seriam comprados os imóveis do presidente do BRB: seis empresas de prateleira e um fundo da REAG'
summary: 'O acervo já sabia, pela decisão que prendeu Paulo Henrique Costa, que a PF lhe atribui R$ 146,6 milhões em
  seis imóveis como contrapartida ao Master. Um relatório de análise juntado ao INQ 5.026 mostra a engrenagem: seis
  sociedades anônimas de prateleira, com capital aumentado no valor de cada imóvel entre janeiro e março de 2025, todas
  controladas por um fundo de participações gerido pela REAG e dirigidas, segundo a PF, pelo cunhado do advogado Daniel
  Lopes Monteiro. Dois dos imóveis são os apartamentos de Brasília que o próprio Paulo Henrique negociava por uma
  holding "para que não seja direto em meu nome" — o que corrige a ressalva do lote anterior.'
