title: 'Lote 117 — confirmado por leitura direta: Eduardo Mendonça Sodré Martins é o enteado citado pela
  PF'
summary: 'A equipe leu diretamente o texto integral da decisão de Mendonça na Pet 16.229 (17/06/2026,
  autenticação STF verificada) e confirmou, no próprio documento, a identificação de Eduardo Mendonça
  Sodré Martins como enteado de Jaques Wagner e a citação literal da mensagem ''amanhã vence os boletos
  e são altos'' (04/09/2025, com resposta de Augusto Lima) — upgrade de classe A para D. Confirmado que
  a Pet 16.662 (afastamento de Andrei) não contém essa citação. Criado o registro do parecer da PGR de
  16/06/2026, lido na íntegra: assinado por Paulo Gonet, opondo-se especificamente à busca no gabinete
  parlamentar e à apreensão de bens de luxo — não à operação como um todo.'
