title: Lote 71 — leitura integral da decisão da operação Zona Cinzenta
summary: 'O corpus registrava a decisão da 4ª Vara Federal Criminal do Amapá apenas pela descrição do
  Poder360, com ressalva expressa de que não fora lida pela equipe. O PDF de 14 páginas foi baixado e
  extraído integralmente. A leitura acrescentou as condições contratuais do primeiro aporte (IPCA + 8,35%
  a.a., 10 anos), a rejeição de ofertas de Santander, BTG Pactual e Safra, o alerta de concentração de
  40% da carteira líquida, a recusa prévia da Caixa Econômica Federal em adquirir os mesmos ativos, a
  visita técnica tratada como formalidade, os dois votos contrários de 19/07/2024, os TEDs de 15/07/2024
  e uma trilha investigativa anterior — aportes de R$ 15 milhões em cotas de FIDC Multisetorial deliberados
  em setembro de 2021. Deslocou também o centro da imputação policial: a PF aponta o conselheiro José
  Milton Afonso Gonçalves, e não o diretor-presidente, como mentor intelectual. Criados os registros dos
  dois conselheiros investigados, até então ausentes do corpus.'
