title: 'Lote 188 — o pedido de domiciliar que faltava: os gêmeos nasceram, e o pós-parto foi grave'
summary: 'Documento seguinte na faixa de pontuação mais baixa do acervo de 416 peças da PET 15.556: o
  e-Doc 247, petição de 24/04/2026 que resolve em parte um open_question do verbete de Fabiano Zettel — o
  voto de referendo de Gilmar Mendes já havia determinado que a substituição da prisão preventiva por
  domiciliar ''deve ser reavaliada'' assim que houvesse fato novo, e esta é exatamente essa petição. Os
  gêmeos Samuel e Sarah nasceram em 08/04/2026; Natália Vorcaro Zettel teve complicações graves no
  pós-parto (síndrome HELLP, reinternação, agravamento de quadro psiquiátrico preexistente). Zettel nega
  ter integrado o grupo ''A Turma''. O corpus não localizou a decisão que apreciou este pedido específico —
  fica registrado como pendência.'
