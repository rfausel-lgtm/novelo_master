title: 'Lote 288 — o depoimento de Vorcaro sobre fraudes no BRB foi marcado para o mesmo dia da sessão do
  STF sobre Moraes'
summary: 'Reportagem do InfoMoney (13/09/2026), verificada diretamente: a Polícia Federal marcou depoimento
  de Daniel Vorcaro para 15/09/2026 — o mesmo dia da sessão extraordinária do STF (Pet 16.662) que decide
  se Alexandre de Moraes deve ser investigado por suas comunicações com ele — sobre irregularidades no Banco
  Master e fraudes em operações com o BRB. A oitiva já havia sido adiada uma vez, do fim de agosto, a pedido
  da defesa; a reportagem antecipa novo pedido de adiamento, alegando acesso incompleto aos documentos
  desigilados em 11/09/2026.'
