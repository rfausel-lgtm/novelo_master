title: 'Lote 223 — Augusto Lima: a devolução de R$1,09 milhão, e a presidência que o acervo não tinha'
summary: 'A leitura das peças do INQ 5.026 traz três achados sobre Augusto Ferreira Lima. Primeiro: recebeu
  do Master, por declaração de Vorcaro de 28/10/2025, quitação ampla após devolver R$ 1.089.222,35 em
  remuneração indevida paga entre junho de 2024 e agosto de 2025 — já depois de sua saída formal da
  sociedade (Termo de Transferência nº 252, maio de 2024). Segundo: foi, na verdade, o presidente
  estatutário fundador da Asteba entre 2005 e 2008 — um fato que o acervo não tinha e que precede, sem
  contradizer, o achado já publicado de que hoje ele não ocupa cargo estatutário em nenhuma das duas
  associações, apenas procuração. Terceiro: um ofício da Secretaria de Administração da Bahia quantifica
  o teto real das autorizações de desconto da Asteba e da Asseba em cerca de R$ 1 bilhão — uma fração dos
  R$ 6,7 bilhões movimentados na operação atribuída às duas. Por fim, sua própria negativa de poder para
  movimentar as contas por procuração (revogada em 2020) ganha registro como posição citada.'
