title: Advogado de Vorcaro detalha à CNN o pedido de dados brutos do celular (atualização do 379)
summary: Atualiza o evento do lote 379 com a entrevista do advogado Sergio Leonardo, que lidera a defesa de
  Daniel Vorcaro, à CNN (texto de 29/10/2026, atualizado em 30/10). Segundo a CNN, ele disse que, se ficar
  comprovado que o celular foi alterado depois da apreensão, a defesa pedirá a anulação das provas dele
  decorrentes, e que o pedido de 29/10 foi para acessar o material bruto em poder da PF e compará-lo com a
  análise do perito contratado. São declarações da parte; o perito escreve que não atribui as alterações a
  ação humana deliberada nem faz juízo sobre autoria, e, segundo o Poder360, o laudo não comprova adulteração.
  Manifestação da PF e do STF não foi localizada até 31/10.
