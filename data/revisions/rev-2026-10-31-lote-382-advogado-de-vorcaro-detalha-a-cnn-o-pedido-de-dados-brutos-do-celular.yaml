reason: Reportagem assinada com entrevista própria, que acrescenta ao 379 a fala atribuída do advogado e a
  data e a finalidade do pedido de acesso aos dados brutos; não é segunda fonte do mérito pericial. Evidência
  nova em classe A e unverified, evento mantido em classe D e unverified. Contraditório - versão da defesa
  registrada; PF e STF não localizados em 31/10, com as buscas descritas no evento. Ficaram de fora a tese
  jurídica além de uma frase atribuída, as formulações mais fortes da nota da defesa, o destinatário do pedido
  (a CNN não informa) e o verbete do advogado.
