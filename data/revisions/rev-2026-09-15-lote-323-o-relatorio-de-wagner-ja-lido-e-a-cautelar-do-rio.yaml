title: 'Lote 323 — o relatório da PF sobre Wagner já estava lido, e dizia outra coisa sobre quem apresentou Vorcaro'
summary: 'Saneamento a partir dos fios herdados do estado da pesquisa. O verbete de Jaques Wagner registrava que o
  relatório da PF de 30/07/2026 (33 MB) nunca fora lido; a conferência mostrou que o mesmo PDF de 98 páginas está no
  acervo sob três registros de documento e foi lido na íntegra desde o lote 8 — a nota antiga vinha de um registro
  duplicado criado a partir de síntese de imprensa. A releitura do texto corrigiu dois pontos que esse registro
  sustentava: a contagem de "ao menos 70 contatos" entre Augusto Lima e o senador não aparece no documento, e a
  proximidade de Wagner com Vorcaro não é atribuída a Lima — segundo a PF, os primeiros contatos foram intermediados
  por Guilherme Henrique Sodré Martins, o "Tio Guiga", melhor amigo do senador e pai de seu enteado, que em 19/06/2024
  escreveu a Vorcaro colocando-se à disposição. Os três registros do documento foram mantidos, com referência cruzada.
  O lote fecha também o fio da cautelar do Rio: a API do DJEN mostra que a Justiça estadual declinou da competência
  para a Justiça Federal em 10/03/2026, com base constitucional genérica e sem mencionar o Banco Central, e manteve a
  retenção de repasses ao Master por risco aos cofres públicos; segundo a imprensa, o TRF2 negou recurso do banco e o
  caso seguiu ao STF em maio, sob número ainda não localizado.'
