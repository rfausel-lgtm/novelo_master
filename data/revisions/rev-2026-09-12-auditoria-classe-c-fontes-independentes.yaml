title: 'O que conta como "duas fontes independentes": seis evidências reclassificadas'
summary: 'Auditoria movida por uma decisão pendente há vários lotes: o que conta como fonte independente para
  a classe C. O lint soma `source_ids.length + document_ids.length`, e um registro `document` que é só o
  envelope da MESMA reportagem já citada como fonte passa a conta sem ser uma segunda origem — foi o que
  aconteceu em três evidências publicadas. Fixada a regra em BRIEFING.md e aplicada a seis registros: duas
  ganharam segunda fonte real, verificada por leitura direta (WebFetch) antes de citar, e mantiveram classe C;
  uma foi rebaixada para A depois que a segunda fonte buscada (Metrópoles, acesso próprio ao relatório do
  grupo de trabalho do BRB) não corroborou os números, e sim divergiu deles; uma foi rebaixada para A por
  depender de um documento que é a própria análise interna da equipe, não uma origem externa; uma foi elevada
  para D, por citar como documento a decisão oficial em si, não uma reportagem sobre ela; e uma — uma soma
  aritmética feita pela própria equipe sobre quatro cifras — passou para I, com inference_basis. Um achado
  lateral (Cedae R$237mi, não R$200mi, já documentado no acervo desde o mesmo lote de reconciliação) ficou
  registrado como nota, sem alterar o número já publicado na evidência da soma — decisão de correção
  aritmética e eventual renomeação do registro fica para o Rafael.'
