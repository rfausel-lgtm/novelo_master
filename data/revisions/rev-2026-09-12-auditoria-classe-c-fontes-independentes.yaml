corrections:
- 'ev-tirreno-vendia-creditos-fabricados-ao-brb: mantida classe C, agora com segunda fonte real (Poder360,
  verificada por leitura direta) no lugar do document_id que duplicava a própria fonte da Agência Pública. A
  nova fonte corrobora o mecanismo central, mas atribui a criação da Tirreno a André Felipe de Oliveira
  Seixas Maia, não a Daniel Vorcaro — a proposição foi ajustada para não afirmar autoria de Vorcaro sobre a
  empresa, ponto que não está corroborado. Seixas Maia ainda não tem registro próprio: pista para apuração
  futura.'
- 'ev-mendonca-pede-julgamento-plenario-06set: mantida classe C, agora com segunda fonte real (Gazeta do
  Povo, apuração e byline próprios, verificada por leitura direta) no lugar do document_id que duplicava a
  fonte do Poder360. As duas coberturas confirmam o mesmo fato central com formulação jurídica distinta
  (uma cita o art. 5º do RISTF como pedido formal; a outra descreve como liberação, sem o dispositivo) —
  registrado no corpo da evidência.'
- 'ev-bc-encontrou-130-contratos-sem-lastro-e-cpfs-dispersos: rebaixada de C para A, atribuída à Agência
  Pública. A segunda fonte buscada (Metrópoles, com acesso próprio ao relatório sigiloso do grupo de trabalho
  do BRB) não corrobora os números: fala em 47 contratos consultados, dos quais 8 existiam, sem mencionar
  associações da Bahia nem março de 2025 — divergência registrada em notes, não resolvida.'
- 'ev-mps-atualizou-de-18-para-19-entes-ate-fevereiro-de-2026: rebaixada de C para A, atribuída ao
  Ministério da Previdência via CNN Brasil. O document_id ligado era a reconciliação interna da própria
  equipe (is_official: false), não uma segunda origem.'
- 'ev-fachin-sinaliza-desfecho-do-inquerito-4781-apos-sete-anos: elevada de C para D. O document_id é a
  própria decisão de Fachin (is_official: true, com excerto que reproduz linguagem direta do texto) — não
  apenas reportagem sobre ela.'
- 'ev-quatro-instituicoes-somam-3-62-bilhoes-mais-que-o-dobro-da-versao-de-vorcaro: reclassificada de C para
  I, com inference_basis. É soma aritmética da própria equipe sobre quatro cifras, não uma cifra corroborada
  por duas fontes. Nota registra que o acervo já corrigiu o valor da Cedae para R$237 milhões (não R$200mi)
  em outro registro — a soma não foi recalculada nesta auditoria, por não ter sido pedida correção
  aritmética; refeita, o total seria ~R$3,66 bi, não R$3,62 bi.'
- 'rel-cedae-banco-master-financial: ganhou o evidence_id de ev-cedae-investiu-237-milhoes-nao-200 (classe
  D), consequência direta da reclassificação acima — sem isso, a relação (classe A) ficava com evidência
  superior à melhor evidência ligada (I), erro bloqueante de lint.'
- 'Duas sequências revisadas e mantidas sem alteração: seq-consult-pagamentos-e-negociacao-brb e
  seq-lei-14431-2022-e-modelo-consignado-do-master, ambas com fonte única na própria sequência, mas ancoradas
  em evidências (ev-coaf-master-consult-6-6-mi, classe C com 4 fontes reais; ev-lei-14431-2022-consignado e
  ev-decisao-9a-fase-emendas, classe D) que já seguem a regra corretamente.'
