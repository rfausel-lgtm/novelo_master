title: Lote 335 — o inventário da busca de 04/03 na 3ª fase, e o cheque sem identidade na casa de Mourão
summary: 'A leitura integral da PET 15.562/DF — a petição das medidas reais da 3ª fase da Compliance Zero — detalha
  o que a PF arrecadou em 04/03/2026: dinheiro em espécie com Vorcaro em São Paulo, joias e relógios de luxo com
  Fabiano Zettel, uma nota promissória de R$ 200 mil avalizada por Henrique Vorcaro, pela mulher e pelo filho Daniel,
  uma cédula rural vinculada a Marilson Roseno da Silva, e um veículo em nome de Ana Cláudia Queiroz de Paiva. Registra
  também quatro mandados não cumpridos por endereço sem funcionamento real — Varajo, Super Empreendimentos, King
  Participações e King Motors. Um item fica em classe I, deliberadamente sem identificação: um cheque cancelado
  de R$ 1,8 milhão achado na casa de Luiz Phillipi Mourão, nominal a um ''Antônio Mansur'' que o material não qualifica
  e que o acervo trata como pessoa distinta de João Carlos Falbo Mansur, já conhecido por outra frente — coincidência
  de sobrenome não é identidade. Por fim, a manifestação da PGR de 06/03/2026 contra o prazo de 24 horas cita, sem
  nomear, um ''evento fúnebre ocorrido durante a operação'' que a coincidência exata de data liga, por inferência,
  à morte de Mourão já registrada no acervo — sem promover a inferência a identificação documental.'
