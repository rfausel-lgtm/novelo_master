title: 'Lote 179 — um antecedente de março: a tese do conflito de interesse de Alcolumbre já tinha sido formalizada ao STF'
summary: 'Décimo documento explorado do acervo de 416 peças da PET 15.556: o e-Doc 82, representação de
  09/03/2026 em que um advogado, em nome próprio (sem mandato institucional), pede ao STF o afastamento
  cautelar do presidente do Senado, Davi Alcolumbre, por suposta prevaricação e abuso de autoridade ao
  obstruir pedidos de impeachment contra ministros do STF (citando cerca de 46 contra Moraes e 10-14 contra
  Toffoli, números do próprio peticionário, não verificados de forma independente) e a instalação de CPI
  sobre o Banco Master — apontando como motivo a perda de R$ 400 milhões do fundo de previdência do Amapá
  (Amprev) aplicados no Master, fato já longamente documentado no acervo desde os lotes 71-86. O achado é
  que essa mesma tese de conflito de interesse, que o editor levantou como hipótese em setembro (lote 167)
  e que a equipe não conseguiu confirmar por fonte independente, já havia sido articulada formalmente ao
  STF seis meses antes — embora por uma única pessoa física, sem mandato, e sem que o corpus tenha localizado
  notícia de que o STF deu seguimento ao pedido de afastamento. Não resolve a hipótese; documenta um
  antecedente dela.'
