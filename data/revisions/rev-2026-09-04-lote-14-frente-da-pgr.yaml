id: rev-2026-09-04-lote-14-frente-da-pgr
kind: revision
date: '2026-09-03'
summary: 'Lote 14: a frente da Procuradoria-Geral da República. Entram o registro, no relatório da PF,
  de pedido para que Vorcaro custeasse a ida do filho do procurador-geral a evento em Londres, feito por
  intermediário; o custo da degustação de uísque na primeira edição do fórum; a intimação do relator para
  que a PGR se manifestasse em cinco dias; a reação interna do Conselho Superior do MPF; a rejeição de
  nova tentativa de delação e o pedido de arquivamento das denúncias de ameaça. Registra-se também que
  o relatório não aponta resposta do ministro Alexandre de Moraes às mensagens em que o banqueiro pede
  atuação em seu favor.'
