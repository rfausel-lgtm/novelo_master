reason: O lote 372 registrou a liquidação sem o número do ato. O boletim estadual transcreve a ementa do Ato
  1.380, mas não é o DOU nem o BC e não traz o texto do ato; classe C e status unverified mantidos, e o
  boletim entra como fonte adicional do número, não como corroboração independente do conteúdo.
