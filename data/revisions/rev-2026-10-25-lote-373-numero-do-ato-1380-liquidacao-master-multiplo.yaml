title: Lote 373 — Número do Ato do Presidente 1.380 (BC, 17/03/2026) no registro da liquidação do Master Múltiplo
summary: Acrescenta o número do Ato do Presidente nº 1.380, de 17/03/2026, que decreta a liquidação
  extrajudicial do Banco Master Múltiplo S.A., com base no boletim Alerta Legislação nº 12 (16 a 21/03/2026)
  da Biblioteca Jurídica do Governo de SP. Corrige a lacuna deixada no lote 372, cuja nota do BC não trazia o
  número. A publicação no DOU segue não verificada.
