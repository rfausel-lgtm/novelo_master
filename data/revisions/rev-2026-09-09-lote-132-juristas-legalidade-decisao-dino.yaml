date: '2026-09-09'
title: Lote 132 — o que dizem os juristas sobre a legalidade da decisão de Dino
summary: 'Quatro advogados/juristas ouvidos pela Gazeta do Povo (09/09/2026) criticam a técnica processual
  da decisão de Flávio Dino na Pet 16.669/DF — todos em sentido crítico, nenhum a defendendo. Atualiza
  a pendência aberta no lote 124 (ausência de manifestação nominal de processualista/constitucionalista),
  com ressalva editorial: a amostra é estreita (uma única reportagem, apenas um dos quatro com credencial
  acadêmica declarada em direito constitucional) e busca dirigida por juristas de maior projeção nacional
  (Streck, Bottini, Binenbojm, Ives Gandra, ex-ministros do STF/STJ) e por notas da OAB Federal, IAB e
  ABJD não encontrou nenhuma manifestação — não caracteriza consenso doutrinário estabelecido.'
affected_ids:
- flavio-dino
reason: Pedido do editor para apurar o posicionamento de juristas renomados sobre a legalidade da decisão
  de Dino (Pet 16.669), tratando a hipótese de 'quase unanimidade' como ponto de partida a testar, não
  como fato dado.
