title: 'Lote 280 — o ofício que Mendonça invocou para justificar o lacre, e a réplica de Moraes'
summary: 'Leitura integral do Ofício GMAM nº 10/2026 (11/09/2026, Pet 16.704), já baixado em sessão anterior
  mas ainda não lido. Enriquecimento de precisão sobre um fato já publicado (a disputa pelo HD lacrado do
  celular de Vorcaro): Moraes cita o próprio ofício com que Mendonça justificou o lacre — Ofício nº
  33/2026-CNQ/CGRC/DICOR/PF, de 08/03/2026, no qual a Polícia Federal alega ter entregue a cópia de segurança
  "de forma voluntária e espontânea" — e reitera, apoiando-se no mesmo argumento de Zanin (o lacre protege o
  original, não a cópia), a frase: "não cabe ao Ministro relator escolher quais os documentos acessíveis ao
  Colegiado para realizar seu julgamento." Não altera a conclusão já publicada, mas identifica com precisão o
  documento primário que fundamentou a posição de Mendonça e cristaliza a réplica de Moraes em citação
  literal.'
