title: 'Lote 65: o estado das alegações de intimidação'
summary: 'Fecha a frente aberta pelo editor sobre agentes da PF com o balanço das alegações de intimidação
  — aplicando o mesmo ceticismo aos dois lados. Contra a alegação: Vorcaro não nomeou nenhum agente, os
  supostos autores estavam mascarados, não houve perícia nem exame de corpo de delito, nenhum agente foi
  formalmente investigado, e o contexto é o de uma terceira tentativa de delação feita no mesmo dia em
  que ele deveria depor à PF, com pedido de reabertura da colaboração no mesmo ato. Contra a versão oficial:
  a resposta da corporação veio inteiramente por interlocutores anônimos, sem nota institucional nem pronunciamento
  do diretor-geral, e a versão do encontro casual em Londres é enfraquecida pelo próprio relatório da
  PF. Registra que nenhuma das frentes teve desfecho — os pedidos do Novo seguem sem decisão e o arquivamento
  é apenas parecer —, e o ponto que a cobertura não fechou: o procurador-geral que pediu o arquivamento
  é ele próprio citado nas mensagens, com divisão interna no MPF sobre se deveria se afastar.'
