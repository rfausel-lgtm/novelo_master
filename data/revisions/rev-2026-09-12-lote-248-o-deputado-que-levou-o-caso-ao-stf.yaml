title: 'Lote 248 — o deputado que levou a Compliance Zero ao STF, e os dados da CPMI guardados no Senado'
summary: 'Primeira leitura, pela via do peticionamento, das decisões da Reclamação 88.121 — a ação de Daniel
  Vorcaro que tirou a investigação da primeira instância. A liminar de 09/12/2025 revela o fundamento: a defesa
  alegou que a PF apreendeu no endereço dele um documento de um deputado federal e omitiu o nome no termo de
  apreensão; Toffoli suspendeu as investigações na 10ª Vara, trouxe tudo ao STF, manteve atos e constrições e deu
  acesso aos autos ao deputado João Carlos Paolilo Bacelar Filho, "referido nos documentos apreendidos". Na
  decisão final de 22/12/2025, a PGR descreve o documento como termo de opção de compra e venda de imóvel
  envolvendo o deputado, e Toffoli fixa no STF a supervisão da Compliance Zero por "indícios" de que ele pode
  estar envolvido — fundamento de competência, não imputação. Em 12/12/2025, Toffoli negou anular as quebras de
  sigilo de Vorcaro e da Moriah Asset aprovadas pela CPMI do INSS, mas mandou os dados ficarem acautelados na
  Presidência do Senado — a guarda que o STF desfaria em fevereiro. O deputado ganha registro próprio, e
  resolve-se a lacuna do "parlamentar não identificado" que o acervo trazia desde a leitura do IPL.'
