title: 'Lote 114 — o dia do afastamento de Andrei em detalhe: 3 a 0 antes da vista de Gilmar, AGU anuncia
  recurso'
summary: 'Aprofundado o mesmo dia do afastamento de Andrei Rodrigues (08/09/2026): a 2ª Turma do STF havia
  formado maioria de 3 a 0 (Mendonça, Fux, Nunes Marques) antes de Gilmar Mendes pedir vista às 10h05
  (prazo regimental de até 90 dias para devolvê-la, sem suspender os efeitos da decisão monocrática).
  A AGU anunciou recurso por violação de competência presidencial, sem confirmação de protocolo. Registradas
  novas manifestações institucionais do mesmo dia: nota de 11 diretores da PF em solidariedade a Andrei
  e Leandro Almada; pedido da APCF (peritos) para julgamento pelo plenário; debate (sem decisão) entre
  superintendentes regionais sobre entrega coletiva de cargos; discurso do interino William Murad na Academia
  Nacional de Polícia. Confirmado, por checagem direta do site oficial, que a Fenapef não havia se manifestado
  até a data desta apuração.'
