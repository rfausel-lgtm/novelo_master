title: 'Lote 133 — Fabiano Zettel a fundo: a decisão lida na íntegra, o registro do TSE e a correção de
  uma inversão de valores'
summary: 'Investigação dirigida sobre o nó mais implicado e menos documentado do acervo. A íntegra de
  48 páginas da decisão de prisão preventiva (PET 15.556) foi baixada do domínio oficial do STF e lida
  pela equipe, permitindo extrair a fundamentação individualizada: Zettel é descrito como quem atuava
  na ''intermediação e operacionalização de pagamentos'' e na estruturação de ''instrumentos contratuais
  utilizados para justificar tais repasses'', e a PF o qualifica como ''operador financeiro e cunhado''
  de Vorcaro. Três frentes ficam documentadas: o contrato fictício via Varajo para remunerar o servidor
  do Banco Central Belline Santana, com a triangulação por Leonardo Palhares para ocultar a propina; o
  pagamento mensal de R$ 1 milhão ao grupo ''A Turma'', descrito pela decisão como estrutura de coação
  e intimidação de concorrentes, ex-empregados e jornalistas; e o acompanhamento dos fluxos financeiros
  do grupo. O voto de Gilmar Mendes no referendo revela que a substituição da prisão por domiciliar ''deve
  ser reavaliada'' quando concluídas as diligências — reavaliação nunca localizada, com ele preso há seis
  meses sem denúncia. Consulta primária ao TSE resolve uma contradição do próprio acervo: as doações de
  2022 foram R$ 3 milhões a Bolsonaro e R$ 2 milhões a Tarcísio (não o inverso, como noticiado pelo Correio
  Braziliense), mais R$ 10 mil a um candidato do Novo em Minas que nenhuma reportagem citou. Registrados
  ainda: o salto patrimonial de R$ 67,5 mi (2021) para R$ 204,3 mi (2024), os R$ 99,4 milhões movimentados
  em sete meses contra renda declarada de R$ 66 mil apontados pelo Coaf, a trajetória anterior de advogado
  da MRV, e quatro manifestações da defesa que derrubam o registro anterior de ''nenhuma manifestação
  localizada''. Novos: Leonardo Augusto Furtado Palhares e a gestora Moriah Asset.'
