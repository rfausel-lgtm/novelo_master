title: Lote 378 — PF apresenta relatório parcial no Inq 5026/STF, indicia 15 pessoas e pede mais 60 dias
summary: Registra o relatório parcial da Polícia Federal no Inq 5026/STF, datado de 28/10/2026 e assinado por
  quatro delegados da PF. O relatório é parcial e a PF pediu mais 60 dias. Indiciamento não é denúncia nem
  condenação, e o acervo não registra, até 29/10, decisão do STF sobre o pedido nem manifestação da PGR.
  Segundo a PF, foram indiciadas 15 pessoas (seis ligadas ao Banco Master, seis dirigentes do BRB, duas
  ligadas à Tirreno e um advogado), e ao menos R$ 12,2 bilhões em créditos cedidos ao BRB não tiveram a
  existência comprovada. A defesa de Daniel Vorcaro chama o indiciamento de frágil e absurdo e pede o
  arquivamento. O lote liga a PF a 11 pessoas já registradas e atualiza a ficha de Diogo Ilário de Araújo
  Oliveira.
