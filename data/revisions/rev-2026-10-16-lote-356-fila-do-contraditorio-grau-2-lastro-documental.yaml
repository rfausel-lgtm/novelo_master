kind: revision
date: 2026-10-16
title: "Lote 356 — Fila do contraditório, grau 2 (1/2): a prisão preventiva de Rodrigo Pimenta Franco Avelar
  Campos que o verbete omitia; o que a defesa de Schumann disse nos autos da CVM; a notificação de Neilton
  Paixão de Jesus pelo TCE-RJ e a nota de Fernanda Machado; e correções de atribuição em Dário Garcia Júnior,
  Malu Gaspar, Woyceichoski e outros"
summary: "Segunda rodada da fila do contraditório de grau 2 (16 pessoas neste lote; as demais ficam para o
  lote 357; uma foi adiada). Método: por pessoa, busca em 16/10/2026 de nota, entrevista, manifestação nos
  autos ou tentativa de contato; quando há, cited_position ganha tipo, data e fonte; quando não, not_located
  ganha a descrição da busca. O que este lote NÃO afirma, em destaque: não afirma a veracidade de nenhuma das
  versões registradas, que convivem com os documentos e com as alegações de origem; não registra o conteúdo da
  ata do Comitê de Investimentos do Rioprevidência de outubro (só a notícia dela pela NeoFeed); não registra o
  depoimento de Luis Felipe Woyceichoski além do que a CNN Brasil publicou, porque a matéria do BNews que o
  descreve com mais detalhe ficou inacessível (bloqueio 403) e foi deixada de fora; não registra decisão de
  Fachin sobre o pedido de Rodrigo Pimenta Franco Avelar Campos nem o resultado do depoimento à PF de
  06/10/2026; não consultou os autos 206.599-7/26 do TCE-RJ; e uma prisão preventiva é medida cautelar, não
  condenação. Camada D, só quanto ao conteúdo de cada documento: (i) a decisão de 13/05/2026 na PET 15.978
  decreta a prisão preventiva de Rodrigo Pimenta Franco Avelar Campos (dispositivo, item iv) e a nota do STF
  de 14/05/2026 o lista entre os presos do núcleo Os Meninos; o verbete só registrava o bloqueio patrimonial,
  e o valor de R$ 1,8 milhão passa a constar como teto, não como valor encontrado; (ii) o relatório e o voto
  da CVM no PAS 19957.013886/2022-02 descrevem a defesa de Marcio Coutinho Schumann (investidor pessoa física,
  sem prova de ciência prévia), e o voto reconhece a ausência de prova direta do acesso à informação e
  considera frágeis as justificativas econômicas; (iii) o voto do TCE-RJ (Acórdão 26.458/2026, assinado em
  03/08/2026) notifica Neilton Paixão de Jesus, Presidente do Itaprevi, para explicar dois atos em 15 dias, e
  registra que as aplicações ocorreram na gestão seguinte; (iv) o termo de credenciamento do Itaprevi é de
  16/01/2024, antes da nomeação de Fernanda Pereira da Silva Machado (12/06/2024), o que não diz nada sobre a
  atuação dela no Rioprevidência. Camada A, sempre com atribuição: nota de Fernanda Machado (InfoMoney/Agência
  O Globo, 27/01/2026); nota do advogado de Dário Garcia Júnior (Folhapress, 08/02/2026); depoimento de
  Woyceichoski à PF, segundo a CNN Brasil; tentativas de contato sem resposta (Estadão: Nabas, 19/05 e 03/07;
  Almada, 08/09; NeoFeed: Euchério, 09/01); manifestação processual da defesa de Robério Mangueira
  (27/01/2026); nota da Nord e de Renato Breia (Brasil de Fato, 10/07/2026); nota de O Globo sobre Malu Gaspar
  (01/07/2026), que é do jornal e não da jornalista; despachos de Jhonatan de Jesus no TCU segundo a imprensa;
  pedido da defesa de Rodrigo Pimenta a Fachin (22/09/2026, O Antagonista e Metrópoles, uma única origem).
  Vinte fontes novas e sete evidências novas; nenhuma pessoa, organização, evento, documento ou relação nova.
  Correções de registros anteriores estão em corrections (inclui a data de 'mesma semana' da ata do
  Rioprevidência, a retirada de 'confirmou' da piauí, as notas de entidades atribuídas a 04/03 quando as
  específicas sobre Malu Gaspar são de julho e o by_id autorreferente)."
