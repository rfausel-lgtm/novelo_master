corrections:
  - "rodrigo-pimenta-franco-avelar-campos: o verbete não registrava a prisão preventiva decretada em
    13/05/2026 na PET 15.978 nem a manifestação da defesa; o bloqueio de R$ 1,8 milhão passou a constar como
    teto, não como valor bloqueado."
  - 'eucherio-lerner-rodrigues, rel-euquerio-lerner-rodrigues-rioprevidencia-institutional,
    evt-2023-11-30-comite-libera-teto-sem-nomear-o-master, ev-decisao-do-master-nao-individualizada-em-ata,
    doc-2023-11-30-ata-11-rioprevidencia-liberacao-generica, src-rioprevidencia-ata-11-2023-11-30: a ata do
    Comitê é de 30/11/2023, de três a quatro semanas depois das aplicações de 01 e 10/11/2023; "na mesma
    semana da primeira compra" estava incorreto. Cargo: deixou a diretoria em março de 2025. A fonte da
    posição (ata de 30/11/2023) não sustentava a fala de outubro; trocada pela NeoFeed.'
  - 'ev-reacoes-vitimas-monitoramento-itau-piaui-nord: "tendo a publicação confirmado as tentativas de
    intimidação" retirado (nenhuma fonte lida registra confirmação da piauí); a mensagem de comemoração de
    Miranda e a nota da Nord e de Breia eram atribuídas à CNN Brasil, cuja página não as traz: a citação da
    mensagem saiu e a nota passou a ser atribuída ao Brasil de Fato; a menção a familiar sem papel próprio no
    trecho sobre Milton Maluhy Filho foi retirada.
    src-cnnbrasil-2026-pf-thiago-miranda-coagiu-tres-jornalistas: data completa; título e resumo corrigidos pela
    página atual, que não traz a mensagem de Miranda nem a nota da Nord e de Breia (o "à disposição das
    autoridades" dela é da defesa de Miranda).'
  - 'malu-gaspar e ev-devassa-contra-malu-gaspar-e-tentativa-de-cooptacao: as notas de Abraji, ANJ e Fenaj de
    04/03/2026 eram gerais (a da Abraji nomeia Lauro Jardim); em 02/07/2026 a ANJ repudiou o levantamento
    sobre Malu Gaspar e a Abraji, ataques on-line contra ela após reportagem sobre Moraes e Galípolo; a citação da nota de O Globo foi corrigida pelo texto bruto; a proposta de contratação e a
    mensagem de Vorcaro passaram a constar com atribuição; a mensagem é grafada "abordagem" em O Globo e na
    Gazeta do Povo (o registro anterior dizia "aproximação"); as citações "frear a Malu Gaspar" e "iria dar
    trabalho nos próximos dias" foram postas na forma literal.
    src-gazetadopovo-2026-vorcaro-ordenou-devassa-jornalista-o-globo: data completa.'
  - 'dario-oswaldo-garcia-junior, roberio-bonfim-mangueira: by_id autorreferente retirado das entradas
    not_located; cargos "ex-"; manifestações de 08/02/2026 (advogado) e 27/01/2026 (defesas, processual)
    registradas; prazo de 30 dias do TCDF com termo inicial não informado.'
  - "neilton-paixao-de-jesus: cargo (Presidente do Itaprevi) e os dois pontos da notificação do TCE-RJ
    conforme o voto. doc-2026-08-06-voto-acordao-26458-tcerj-itaprevi: a data do documento é 03/08/2026
    (assinatura digital), não 06/08 (upload no site de hospedagem); o id foi mantido. Pelo mesmo motivo,
    evt-2026-08-06-tcerj-conclui-que-o-banco-escreveu-o-proprio-parecer e
    ev-tcerj-conclui-que-o-banco-preencheu-o-proprio-parecer passam a 03/08/2026 (ids mantidos), e
    src-tcerj-voto-acordao-26458-2026 ganha nota sobre as duas datas."
  - "fernanda-pereira-da-silva-machado: tinha not_located e dizia que o corpus não registrava defesa, havendo
    nota dela de 27/01/2026; saída do Itaprevi em 01/01/2025."
  - 'andre-pissolito-campos: tinha not_located ("sem declaração pessoal") havendo o termo de oitiva de
    16/07/2026 no acervo.'
  - "joao-claudio-nabas: why_in_novelo atribuía ao STF a identificação como suspeito e supunha ligação a
    conversas Vorcaro-Moraes; reescrito com atribuição à PF; not_located substituído por no_response, posição
    nos autos e nota de terceiro."
  - 'luis-felipe-woyceichoski: o depoimento à PF divulgado em junho de 2026 não estava registrado; a afirmação
    "não há notícia de imprensa" foi corrigida.'
  - "leandro-almada-da-costa: not_located substituído por no_response; prazo de 90 dias atribuído ao
    Metrópoles; positions preenchido; open_questions com acentuação; by_id autorreferente retirado do
    not_located do lote 352."
  - "jhonatan-de-jesus: sigilo atribuído ao Correio Braziliense, com a versão do Diário do Nordeste; despachos
    de 18/12/2025 e 24/03/2026 registrados."
  - "gilberto-benevides: a recusa do ANPP saiu de open_questions para cited_position; data da denúncia e
    dúvida sobre a vara registradas."
  - "marcio-coutinho-schumann: defesa nos autos registrada; fonte do resultado do Colegiado."
  - "consuelo-dieguez, renato-breia: not_located e public_note com fonte."
