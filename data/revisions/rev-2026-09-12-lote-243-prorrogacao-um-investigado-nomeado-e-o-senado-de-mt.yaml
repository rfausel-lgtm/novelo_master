title: 'Lote 243 — prorrogação de 60 dias, um investigado nomeado pede acesso aos autos, e senadores de
  MT levam o consignado ao INQ 5.026'
summary: 'Primeira mineração de peças do INQ 5.026 obtidas via peticionamento.stf.jus.br (acervo completo,
  além da camada pública de decisões já esgotada), cobrindo o trecho mais recente do processo (14/08 a
  10/09/2026). Achados: em 25/08/2026, a investigação foi prorrogada por 60 dias a pedido da própria PF;
  em 28/08/2026, uma decisão nomeia pela primeira vez um investigado do INQ 5.026 fora do bloco "sob
  sigilo" — João Pedro Leite Nunes, cuja defesa teve dois pedidos (acesso aos autos e adiamento de oitiva)
  julgados prejudicados; o ofício que comunica outro despacho do mesmo dia identifica a delegada da PF
  responsável pela linha de Diogo Ilário de Araújo Oliveira; e um ofício de três senadores de Mato Grosso
  (14/08/2026) pede ao relator atenção à apuração de crédito consignado ligado ao Banco Master no Estado —
  uma frente institucional distinta da CPI e da CAE, incorporada aos próprios autos do inquérito.'
