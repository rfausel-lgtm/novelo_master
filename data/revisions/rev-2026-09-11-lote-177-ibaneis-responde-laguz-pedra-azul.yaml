title: 'Lote 177 — Ibaneis Rocha responde: sua própria defesa confirma cessão a fundo da Reag, e a CPI amplia com a Pedra Azul FIDC'
summary: 'Oitavo documento explorado do acervo de 416 peças da PET 15.556: o e-Doc 216, petição de 01/04/2026
  em que o governador do Distrito Federal, Ibaneis Rocha, pede dispensa de depor na CPI do Crime Organizado —
  a peça que fundamentou a decisão de 02/04/2026 já publicada no lote 176. Preenche uma lacuna: até aqui o
  corpus não tinha nenhuma manifestação dele sobre o mérito das alegações. A defesa CONFIRMA que o escritório
  Ibaneis Advocacia cedeu créditos de honorários de uma ação de 2008 contra a União em duas operações
  (29/05/2024 e 23/12/2021), a segunda ao Fundo Laguz I FIDC — administrado pela mesma Reag/CBSF já implicada
  em irregularidades com o Master, com único cotista o Banco Original —, caracterizando-as como prática
  lícita de mercado. A própria CPI, no mesmo requerimento, cita uma SEGUNDA operação, com o fundo Reag Legal
  Claims (hoje Pedra Azul FIDC) — o mesmo fundo que um open_question antigo do verbete já citava sem fonte
  primária, agora com confirmação de que existe e é citado pela CPI, mas ainda sem valor ou data documentados.
  Defesa nega qualquer papel operacional de Ibaneis nas decisões do BRB sobre o Master e rebate como
  "fantasiosa" a menção a uma parceria do PicPay com o GDF e à compra de um imóvel pelo filho dele. Documento
  também revela nome novo, ainda não identificado no corpus: Paulo Humberto Barbosa, dispensado de depor à
  CPI por decisão de 26/02/2026 no Inq 5026, mesma data dos irmãos Toffoli — registrado como pessoa a
  investigar, sem relação estabelecida com o caso Master além dessa dispensa.'
