id: rev-2026-10-23-lote-367-adi-7791-pf-comunicou-inquerito-e-uniao-entregou-processo-sei-com-verificacao-nos-portais
kind: revision
date: 2026-10-23
title: "Lote 367 — ADI 7.791: Dino registra que a PF comunicou a instauração de inquérito sobre a atuação da
  CVM e que a União entregou o processo SEI (decisão de 19/10/2026); verificação nos portais do STF e do TCU
  dos lotes 362 a 364"
summary: 'Lote de atualização de registros existentes, de camada D (decisões judiciais lidas na íntegra em
  peças servidas pelo portal do STF e andamentos dos portais do STF e do TCU). O que NÃO se afirma, em
  destaque: o Novelo não afirma que houve irregularidade na CVM nem nos fatos que o inquérito apura; decisão
  que dá por cumpridas diligências não é condenação nem prova; o número do inquérito da PF não é público e não
  é inventado; o Novelo não leu a comunicação da PF, a petição da União, o processo SEI nem a Pet 16.814
  (sigilosa); o teor do parecer da PGR na Pet 16.704 segue classe A. O evento novo: em 19/10/2026, na ADI
  7.791, o relator Flávio Dino registrou que a certidão do STF aponta ausência de manifestação da CVM (eDOC
  215), mas que a União prestou as informações e entregou o processo SEI nº 19957.001206/2022-08 (eDOC 211) e
  o espelho de tramitação (eDOC 209); deu por integralmente cumpridas as determinações do eDOC 199 e, tendo em
  vista a instauração de inquérito policial já comunicada pela PF em autos apartados, mandou trasladar a
  decisão e os eDOCs 208-211 à PET 16.814, com ciência à autoridade policial. Posições: STF (a decisão), PF e
  União (conforme a decisão) e CVM (certidão de ausência de manifestação), cada uma atribuída. Verificação dos
  lotes anteriores nos portais, em 23/10/2026: (a) lote 363, a decisão de 24/09 (código 7945-FE6E-EABB-E40B)
  foi cotejada com a peça servida pelo portal do STF, de texto legível, e a fonte, o documento e a evidência
  passam a apontar para ela, mantendo a classe D; (b) lote 362, o portal registra em 17/10, às 16:06, a
  juntada de "Parecer da PGR" como petição sigilosa, com conclusão ao relator, e isso entra como evidência D
  apenas sobre a juntada; o teor segue A pela cópia do Poder360, cuja chave do MPF não pôde ser validada sem
  login gov.br; (c) lote 364, o número da Ata 36/2026 da 2ª Câmara e a sessão de 20/10 foram confirmados no
  portal de pesquisa do TCU; o texto da ata e os autos continuam não lidos. Lotes 359, 360 e 361 sem mudança.
  Atualiza o verbete da CVM.'
