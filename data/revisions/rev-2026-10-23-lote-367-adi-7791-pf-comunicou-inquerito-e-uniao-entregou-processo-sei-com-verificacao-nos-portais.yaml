corrections:
  - 'Lote 363: a decisão de 24/09/2026 na ADI 7.791 foi cotejada em 23/10/2026 com a peça servida pelo portal
    do STF (downloadPeca id 15390694465, texto legível por pdftotext, sha256 do texto 2190b11734d6c2e9...): o
    código 7945-FE6E-EABB-E40B do rodapé coincide, a data do fecho (24 de setembro de 2026) coincide com os
    andamentos do portal, e o dispositivo (i) a (iv), o prazo de 60 dias, o de 72 horas e "Ciência à PGR"
    coincidem com a transcrição do Poder360. Fonte, documento e evidência passam a apontar para a peça do
    portal (nova fonte do STF); a cópia do Poder360 fica como fonte secundária; sai a ressalva de código não
    conferido; classe D mantida (a evidência já era D, com documento).'
  - "Lote 363: o contraditório da PF deixa de ser not_located. A decisão de 19/10/2026 registra que a PF
    comunicou, em autos apartados, a instauração de inquérito; o número do inquérito não é público
    e não foi registrado. O texto do evento de 24/09 e o verbete da CVM, que diziam não haver notícia da
    instauração, passam a remeter ao evento novo de 19/10."
  - "Lote 363: o contraditório da CVM no evento de 24/09 ganha a posição de ausência de manifestação (certidão
    do STF de 07/10 e certidão eDOC 215, citada na decisão de 19/10), ao lado da versão atribuída pelo O Povo
    em 24/09 (mobilizada para cumprir); são datas diferentes, não há conflito de fatos. As informações
    requisitadas foram prestadas pela União, segundo a decisão de 19/10."
  - 'Lote 362: o portal do STF (Pet 16704) registra em 17/10/2026, às 16:06:09, "Parecer da PGR - Petição
    Sigilosa: 131105", com conclusão ao relator no mesmo dia, sem teor. Nova evidência D apenas sobre a
    juntada (documento do andamento, com captura em raw/capturas/2026-10-23). A evidência do conteúdo continua
    classe A e o evento continua A/unverified quanto ao conteúdo: a chave de validação
    70c0a266.a4568e27.eb8109c4.f25adce4 não foi conferida, porque o validador do MPF exige login gov.br (não
    se autenticou); a nota "não localizou a peça em autos públicos" passa a dizer que o portal a registra como
    petição sigilosa.'
  - 'Lote 362: o id da Revision
    (rev-2026-10-20-lote-362-pgr-rejeita-investigar-mendonca-por-abuso-de-autoridade) diz "rejeita", mas o
    título e o texto do lote dizem que a PGR "opina" que a representação não tem condições de seguimento,
    ressalvado o entendimento do Plenário: o parecer é opinião do Ministério Público, não decisão nem
    rejeição. O id NÃO foi renomeado: a busca por referências ao id antigo não ficou limpa (o manifesto
    public/social/cards.json lista o id e há o card public/social/rev-2026-10-20-lote-362-...webp com o id no
    nome; renomear quebraria o card e o endereço já publicado da atualização). O texto do lote, o título e o
    evento seguem com "opina". O "rejeita" do id da fonte
    src-poder360-2026-10-19-pgr-rejeita-abuso-de-autoridade-... é manchete do veículo e fica.'
  - 'Lote 364: a Ata 36/2026 da 2ª Câmara (sessão de 20/10/2026), que o resumo da Revision 364 dá como "não
    confirmado", passa a ter número e sessão confirmados: o portal de pesquisa do TCU, reaberto em 23/10/2026, exibe o Acórdão de Relação 5184/2026, relator Jorge
    Oliveira, TC 007.138/2026-1, sessão de 20/10/2026, "Número da Ata 36/2026 - Segunda Câmara", representante
    do MP Júlio Marcelo de Oliveira e unidade técnica AudBancos. Seguem não lidos o texto da ata, os autos e o
    estado atual do TC 022.950/2025-7. O portal confirma o número e a sessão; a presidência da sessão
    (Jhonatan de Jesus) continua sustentada só pelo excerto do Poder360. Os CPFs (mascarados no portal) não
    são registrados.'
  - 'Editor-master: as Revisions publicadas dos lotes 362, 363 e 364 são registro histórico; recebem só uma
    linha nova em corrections. A frase do summary da Revision 364 alterada pelo redator foi restaurada ao texto
    original. A Pet 16.814 não está "sem andamentos": o portal mostra autuação (29/09) e distribuição por
    prevenção (06/10), e o evento de 19/10 passou a dizer isso. "A PF comunicou ao relator" virou "a PF
    comunicou, em autos apartados", como na decisão.'
