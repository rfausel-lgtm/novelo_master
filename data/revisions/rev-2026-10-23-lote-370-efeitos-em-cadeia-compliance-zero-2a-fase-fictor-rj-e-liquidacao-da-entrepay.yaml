title: "Lote 370 — Efeitos em cadeia da liquidação do Master: 2ª fase da Compliance Zero (14/01), recuperação
  judicial da Fictor (01/02) e liquidação da Entrepay (27/03)"
summary: "O lote preenche o hiato de janeiro a março de 2026 com três marcos. (1) 2ª fase da Operação
  Compliance Zero em 14/01/2026: 42 mandados de busca e apreensão em cinco estados, expedidos pelo STF em
  decisão de Dias Toffoli (já registrada no acervo), prisão temporária de Fabiano Zettel e medidas de
  sequestro e bloqueio de bens e valores superiores a R$ 5,7 bilhões, segundo Poder360 e Jovem Pan; a página
  da PF exigia login e não foi aberta, de modo que mandados e valores têm classe C e o valor refere-se a bens
  sujeitos a bloqueio, não a dinheiro apreendido (a PF informou à Jovem Pan bloqueio de R$ 24 milhões em
  contas). Notas das defesas de Vorcaro e de Tanure e o esclarecimento do gabinete de Toffoli entram em igual
  destaque. (2) Fictor: pedido de recuperação judicial da Fictor Holding e da Fictor Invest protocolado no
  TJSP em 01/02/2026 (Capital Aberto, Congresso em Foco), dívidas de cerca de R$ 4 bilhões, e decisão
  reportada em 03/02 (Migalhas, InfoMoney) que antecipou por 30 dias efeitos do stay period e determinou
  constatação prévia, sem deferir o processamento; a ligação com a liquidação do Master é versão da própria
  empresa, registrada como alegação. (3) Entrepay: liquidação extrajudicial da Entrepay, da Acqio e da Octa em
  27/03/2026, com os Atos do Presidente 1.381, 1.382 e 1.383 (as duas últimas ementas vistas em boletim
  oficial de legislação) e a nota do Grupo Entre, que diz já conduzir a descontinuação das operações; o Banco
  Central não citou o Master. Acqio e Octa entram como organizações pelo papel documentado (liquidação). O
  lote não afirma que a 2ª fase, a crise da Fictor ou a liquidação da Entrepay foram causadas pela liquidação
  do Master nem se ligam entre si por nexo documentado; não afirma culpa de ninguém (mandado não é
  condenação); não registra o conteúdo de decisões não lidas. O registro de que Antonio Carlos Freixo Júnior
  foi alvo de busca na 2ª fase vem só do Seu Dinheiro e do Investidor10 e fica como alegação atribuída (classe A)
  ligada ao evento da liquidação; ele não é nomeado no evento da 2ª fase. Pendências: a notícia da
  PF e a petição da Fictor não foram lidas; a data exata da decisão sobre o stay period não consta das fontes;
  reportagens que apresentam a recuperação como decretada foram descartadas por exceder a decisão."
