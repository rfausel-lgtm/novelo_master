title: Lote 334 — o BRB processa o Master por fundos nas Bahamas e acusa desvio do Credcesta
summary: 'A leitura integral da Reclamação 88.121/DF — o processo que fundou a competência do STF sobre a Compliance
  Zero — revela uma frente até agora não documentada no acervo: o próprio BRB litigando diretamente contra o Banco
  Master, em liquidação, por fundos internacionais em Jersey, Cayman e Bahamas recebidos em quitação de CCBs de
  US$ 114 milhões e US$ 205 milhões. A Suprema Corte das Bahamas já reconheceu a liquidante EFB como representante
  estrangeira do conglomerado. Em outra petição, o BRB soma as carteiras compradas do Master em R$ 22,99 bilhões,
  estima em R$ 12 bilhões a parcela fraudulenta (a carteira Tirreno) e provisiona R$ 7,35 bilhões — e aponta, em
  ação cível própria, Augusto Ferreira Lima, controlador do Banco Pleno, como possível centro de comando de um desvio
  de fluxos do Credcesta para o Pleno e a PKL One. É alegação de parte interessada, em disputa civil com o próprio
  Augusto Lima — entrou como tal, sem promover a um fato apurado.'
