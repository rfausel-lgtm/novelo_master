date: '2026-09-03'
summary: 'Lote 10: o controle externo e a crise em torno do diretor-geral da PF. Entra a inspeção do TCU
  no Banco Central, concluída em 11/02/2026, cujo relatório, segundo interlocutores da Corte, não aponta
  irregularidades na atuação da autoridade monetária, seguida da ampliação do sigilo. Entram também o
  depoimento de Vorcaro ao gabinete de André Mendonça (02/09/2026), com alegação de tortura psicológica
  e de que a delação teria sido recusada para poupar o diretor-geral, a resposta de integrantes da PF
  e da PGR, a versão dos interlocutores do diretor-geral sobre um único encontro casual em Londres, e
  as duas petições do Partido Novo ao STF (03/09/2026).'
