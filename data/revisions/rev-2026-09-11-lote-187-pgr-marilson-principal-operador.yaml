title: 'Lote 187 — a PGR endurece: Marilson é "um dos principais operadores do núcleo de coerção"'
summary: 'Décimo oitavo documento explorado do acervo de 416 peças da PET 15.556: o e-Doc 347, manifestação
  da PGR de 21/07/2026 respondendo a quatro pedidos pendentes. Sobre o pedido de revogação de Marilson
  Roseno da Silva (petição de 02/04/2026, lote 185), a PGR opina pelo indeferimento e o caracteriza, em
  linguagem mais forte que documentos anteriores do acervo, como "um dos principais operadores do núcleo
  de coerção da organização criminosa" — esclarecendo que a "ausência de recomendação da PGR" que ele
  citara em sua própria petição referia-se à manifestação original sobre o decreto de prisão, não a esta.
  A PGR também opina pelo indeferimento do pedido de Belline Santana para trocar a monitoração eletrônica
  por comparecimento mensal, e traz dois nomes novos: Joana Machado de Moraes Mourão e Nathana Lopes
  Figueiredo, que em 29/05/2026 pediram a restituição de um Range Rover e de um iPhone apreendidos na
  busca contra Luiz Phillipi Mourão — a PGR nega a devolução do veículo, por suspeita de origem ilícita dos
  recursos, e pede manifestação policial sobre o celular. Por fim, confirma que a CVM pediu (10/06/2026) a
  oitiva de Vorcaro para os mesmos três inquéritos administrativos já identificados no lote 181.'
