title: 'Lote 193 — Anderson Wander: dois anos de consultas ilegais na PF, com mensagens primárias'
summary: 'Quarto lote do novo acervo da PET 15.978 (6ª fase, e-Doc 28, lote 190). Aprofunda o verbete de
  Anderson Wander da Silva Lima, já no acervo apenas com a versão da imprensa. A leitura integral da decisão
  de 13/05/2026 mostra, com mensagens de WhatsApp transcritas, um padrão de consultas indevidas a sistemas
  internos da PF que remonta a agosto de 2023 — mais de dois anos antes da fase que o prendeu —, incluindo
  verificação de viagem internacional de terceiro, sondagem de inquéritos envolvendo Daniel e Henrique
  Vorcaro, e uma consulta sobre um DJ a pedido de Marilson Roseno (com alegação não verificada dele sobre
  o alvo, registrada com cautela por não envolver pessoa investigada nestes autos). Documenta contrapartidas
  financeiras via Pix, incluindo uma que ocorreu em 31/12/2025 — meses após a 1ª fase ostensiva da operação,
  reforçando a contemporaneidade do esquema.'
