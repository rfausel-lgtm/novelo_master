title: 'Lote 172 — o voto de Gilmar Mendes: a reportagem que sabia mais do que o próprio STF'
summary: 'Terceiro documento lido do acervo de 416 peças da PET 15.556, seguindo a pontuação automática:
  o e-Doc 286, acórdão de 108 páginas em que a Segunda Turma do STF referendou, por unanimidade, a prisão
  preventiva decretada com base na representação da PF já coberta nos lotes 170-171. O voto do relator André
  Mendonça essencialmente adota a narrativa policial, sem fato novo relevante além do detalhamento das
  medidas cautelares por pessoa (já conhecidas) e de uma réplica pontual à Procuradoria-Geral da República,
  que pedira mais prazo para se manifestar. O achado do lote está no voto vogal de Gilmar Mendes, até aqui
  reduzido no acervo a um genérico ''acompanhou com ressalvas'': ele dedica um capítulo próprio, comparando
  os vazamentos à imprensa no caso Master a abusos da Operação Lava Jato, e registra um achado concreto e
  não reconciliado — uma reportagem do Estadão sobre as mensagens do advogado Walfrido Warde (já no acervo,
  lote 171) trazia uma captura de tela MAIS COMPLETA do que a versão constante dos próprios autos entregues
  à Turma, indício de que a fonte do vazamento tinha acesso mais amplo do que o próprio colegiado julgador.
  Ele também registra que dados de quebra de sigilo enviados à CPMI do INSS vazaram horas depois, expondo
  dados de mulheres ligadas afetivamente a um investigado, sem relação com a apuração.'
