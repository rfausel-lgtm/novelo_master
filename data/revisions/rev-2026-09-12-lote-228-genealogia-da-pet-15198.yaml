title: 'Lote 228 — a genealogia da PET 15.198: petição fundadora própria, e o ofício que a conecta ao
  processo paulista'
summary: Primeiro lote da leitura das 50 peças da PET 15.198/DF obtidas por Rafael via peticionamento
  eletrônico do STF. A PET 15.198 tem petição fundadora própria (PGR, 22/12/2025), distinta do marco
  fundador da Rcl 88.121 já registrado no acervo — processo autônomo e sigiloso, distribuído por
  prevenção. Um ofício do dia seguinte, do Procurador da República em São Paulo Vicente Solari de Moraes
  Rêgo Mandetta, identifica pela primeira vez de forma citável os números dos autos paulistas (pedido de
  prisão preventiva e inquérito policial) que embasariam a decisão de Toffoli de 06/01/2026 — matéria que
  os próximos lotes desta sequência aprofundam.
