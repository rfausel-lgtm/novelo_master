title: 'Lote 262 — a hipótese da PF de que Toffoli seria o dono de fato do fundo Arleen'
summary: 'A revista piauí revelou em 10/09/2026 um relatório da Polícia Federal, entregue ao presidente do STF e mantido
  sob sigilo, que levanta a hipótese de o ministro Dias Toffoli ser "beneficiário final" ou "proprietário de fato" do
  FIP Arleen — o fundo que comprou cotas do resort Tayayá da família dele, recebeu R$ 35 milhões de Daniel Vorcaro e
  mandou cerca de R$ 34 milhões a uma holding nas Ilhas Virgens Britânicas. Outra reportagem cita mensagens em que Vorcaro
  e Fabiano Zettel tratam de ao menos R$ 20 milhões do Arleen à Maridt, empresa da família, depois de um contrato de
  2024. O gabinete nega recursos e operações no exterior. Registrado como hipótese da PF, conhecida só por imprensa,
  com divergência sobre o tamanho e o número do relatório.'
