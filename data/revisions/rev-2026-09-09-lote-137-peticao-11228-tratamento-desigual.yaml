title: Lote 137 — a Petição 11.228 e o tratamento desigual de três notícias-crime sobre o 8 de Janeiro
summary: 'Apuração a partir de reportagem indicada pelo editor, submetida à diretriz que o próprio acervo
  já fixara para essa fonte: verificação direta contra documento primário. A consulta ao andamento processual
  público do STF confirmou integralmente a espinha factual — a Petição 11.228 existe, corre sob segredo
  de justiça, teve Flávio Dino e o general Gonçalves Dias como requeridos, ficou exatamente 1.219 dias
  sem movimentação e foi decidida em 21/08/2026, três dias após a reportagem revelar que estava parada.
  O achado mais forte, porém, é maior do que o da reportagem: três notícias-crime sobre os mesmos fatos,
  distribuídas ao mesmo relator por prevenção, tiveram desfechos incomparáveis — uma arquivada em um dia,
  publicamente; outra em 117 dias, com vista à PGR; e a terceira em 1.219 dias, sob sigilo, com o denunciante
  convertido em investigado. Registradas com igual cuidado as três ressalvas que impedem conclusão apressada:
  o teor do despacho não é verificável por terceiros; a petição de Nikolas Ferreira também tinha Dino
  como requerido e foi arquivada em um dia sem consequências, o que afasta a leitura simples de proteção
  ao requerido; e a proximidade de três dias entre reportagem e decisão comporta explicação concorrente
  — a de que a exposição pública destravou um processo paralisado —, sem que nenhuma fonte demonstre nexo.
  Corrigida ainda uma imprecisão da reportagem: o denunciante é deputado estadual, não federal.'
