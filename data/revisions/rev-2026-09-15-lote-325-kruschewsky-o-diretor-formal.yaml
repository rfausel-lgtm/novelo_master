title: Lote 325 — André Kruschewsky Lima era o diretor formal, e a família Kruschewsky no Master
summary: O verbete de André Kruschewsky Lima dizia que o corpus não apurara seu cargo formal, mas o próprio acervo
  já continha o que resolve a questão. No inquérito trasladado ao Inq 5.026, relatório do MPF de 28/04/2025 traz
  o quadro da Receita, que o lista como diretor do Banco Master desde 13/02/2023, e tela da Junta Comercial do Rio,
  que o registra antes como procurador (2022–2023). Nos autos do TJAP, o relatório de visita da Amprev, a apresentação
  institucional de 2024 e o questionário de due diligence do banco o identificam como diretor jurídico, a quem se
  reportava o compliance. Luiz Rennó Netto não aparece no quadro da Receita, o que é coerente com a qualificação
  de administrador de fato dada pelo BC. Entram ainda, em classe A, as mensagens de Kruschewsky a Vorcaro sobre
  o caso Alcídia no STF, segundo relatório da PF noticiado; o parentesco com Eugênio Kruschewsky passa a classe
  C, por ser afirmado por três veículos, sem documento de filiação; e Matheus Kruschewsky Silva, gerente comercial
  do Master segundo reportagem, entra com possível parentesco registrado como inferência.
