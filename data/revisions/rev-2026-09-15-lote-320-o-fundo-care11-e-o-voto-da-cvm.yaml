title: 'Lote 320 — o fundo CARE11 ganha verbete, e documentos oficiais corrigem dois erros do acervo'
summary: 'Continuação da frente de cemitérios. O fundo Brazilian Graveyard and Death Care Services (CARE11), que
  aparecia só em texto espalhado por quatro lotes, ganha verbete próprio e passa a ligar, no grafo, o conglomerado
  Master (termo de compromisso com a CVM sobre ordens nas cotas, administração do fundo pela Master CCTVM até
  fevereiro de 2026 e, segundo a imprensa, posição de cotista), a Cortel (20% do capital) e Vicente Conte Neto
  (cofundador, segundo a imprensa). A leitura de documentos oficiais corrige o acervo em dois pontos. Primeiro, o
  relatório e o voto da CVM julgados em 25/11/2025: os irmãos Roberto e Marcio Schumann foram condenados por
  prática não equitativa (R$ 2.127.992,80 e R$ 54.048,02) e absolvidos da acusação de manipulação, e a Cortel foi
  absolvida — não houve "multa em 2022", ano apenas das operações; o voto também confirma um conselheiro da Cortel
  identificado como V.C.N., o que reforça a ligação de Vicente Conte Neto à empresa. Segundo, o administrador do
  fundo: comunicado do próprio fundo resumido pela BTG Pactual mostra que era a Master CCTVM até 04/02/2026,
  substituída pela Mérito DTVM — o que desmente a administração pela Planner Trustee (hoje Trustee DTVM, de Maurício
  Quadrado) publicada no lote 315 com base numa única reportagem; a afirmação é retirada dos verbetes e registrada
  como correção. Também sai do acervo a reavaliação do cemitério de Sabará para R$ 111,7 milhões, publicada no lote
  315 sem conferência. Fica registrado, como fonte única, que o Ministério Público de Contas de Minas Gerais apura
  aplicações de regimes próprios de cinco municípios no fundo.'
