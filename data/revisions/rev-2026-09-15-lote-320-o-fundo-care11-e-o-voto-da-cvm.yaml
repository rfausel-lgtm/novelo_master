corrections:
- 'trustee-dtvm e rel-mauricio-quadrado-trustee-dtvm-corporate: retirada a afirmação do lote 315 de que a Trustee
  DTVM (Planner Trustee) administrava o CARE11; documento do fundo aponta a Master CCTVM até 04/02/2026 e a Mérito
  DTVM depois. Retirada também a reavaliação de R$ 111,7 milhões em 2020, não conferida.'
- 'cortel-sp: a condenação dos Schumann é de 25/11/2025, por prática não equitativa, com absolvição da Cortel e da
  acusação de manipulação — o texto do lote 313 dizia "em 2022 a CVM multou".'
- 'Termo de compromisso sobre o CARE11: aceito pelo Colegiado da CVM em 16/11/2022 (13/09/2022 é a data do parecer
  do Comitê); o processo 19957.010180/2022-81, citado junto no acervo, trata do Brazil Realty (BZLI11), não do CARE11.'
- 'rel-vicente-conte-neto-cortel-sp-corporate: de A para C, com o voto da CVM somado à reportagem.'
