title: Lote 332 — os alvos sem verbete da PET 16.230, e o apartamento de Wagner que ninguém consegue registrar
summary: 'Oito alvos da constrição de 19/06/2026 ainda não tinham verbete: a MSMG Patrimonial, que comprou de Jaques
  Wagner um apartamento de R$ 10 milhões em Salvador e vê o registro barrado pela indisponibilidade desde julho;
  a Gavazza Empreendimentos, ligada a Andréa Lima Novaes; o Hockenheim FIP, que tem item próprio na decisão, distinto
  da REAG que o administra; as duas WNT, do núcleo de Valério Marega Júnior; Patrich Toaldo Bonilha, irmão de Bonnie;
  André Pissolito Campos; e Márcio Domingues dos Santos. Este último rende o achado mais substancial do lote: em
  depoimento de 28/07/2026, ele descreve por dentro o escritório pessoal de investimentos de Daniel Monteiro — as
  gestoras cativas Noctua e Excelsior, que nunca saíram do papel, o irmão David controlando as finanças — e inverte,
  com sua própria memória dos fatos, o sentido que a decisão atribuiu ao envio dos documentos do apartamento. No
  mesmo depoimento nega qualquer contato com Valério Marega Júnior ou João Carlos Falbo Mansur. Uma pergunta fica
  registrada sem resposta: a petição em que ele pede a revisão do bloqueio cita a decisão que o atinge como da ''PET
  16.229'', não da 16.230 sob a qual protocola o próprio pedido — e o acervo não resolve se é erro de citação ou
  se há, de fato, uma decisão irmã em processo correlato.'
