title: 'Lote 277 — "Não é o que consta dos autos": Moraes contesta por escrito a versão de Mendonça de que o
  sigilo foi levantado por completo'
summary: 'Um fork de download recuperou, via OCR, o conteúdo do Ofício GMAM nº 09/2026 (11/09/2026, Pet
  16.704), que uma tentativa anterior havia marcado como ilegível. No ofício, Alexandre de Moraes contesta
  diretamente a afirmação repetida por Mendonça em despachos de 11 e 13/09 de que "todo o material" estava
  disponível a todos os ministros: "Não é o que consta dos autos" — anexando prints que mostram a Pet 15.556,
  a Pet 15.976 e a Rcl 88.121, entre outras, ainda com peças sigilosas inacessíveis. Acusa Mendonça de
  "levantamento seletivo e direcionado do sigilo... na proteção ostensiva de determinado grupo político",
  equiparando a conduta ao "direcionamento de acordos de colaboração premiada" já alegado antes, e fala em
  supressão ao colegiado do conhecimento de "18 PETs e de 180 documentos" — dois dias antes da sessão
  extraordinária de 15/09/2026. Enriquecimento adicional de precisão: o ofício de Zanin sobre o mesmo tema
  identifica o aparelho de Vorcaro (iPhone 17 Pro, IMEI e laudo pericial específicos).'
