title: BRB informa ter ajuizado ação contra sete ex-gestores e ter pedido indisponibilidade de bens
summary: Registra o fato relevante de 10/11/2026 em que o BRB informa ter ajuizado ação social de
  responsabilidade civil, autorizada pela assembleia de 24/08/2026, contra sete ex-administradores (quatro
  deles no acervo) e com pedidos patrimoniais em relação a seis empresas, e ter pedido em liminar a
  indisponibilidade de bens dos demandados e de seis imóveis. Tudo é declaração do autor; não foi localizada
  decisão sobre a liminar, número do processo, vara nem manifestação dos demandados até 12/11.
