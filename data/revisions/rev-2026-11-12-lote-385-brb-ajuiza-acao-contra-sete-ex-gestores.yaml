reason: Documento primário do autor da ação (classe D), com o aviso aos acionistas como confirmação de data e
  canal; evidências unverified e atribuídas ao BRB em toda frase. Ficaram de fora os nomes dos três
  ex-gestores fora do acervo, os nomes dos empreendimentos onde ficam os imóveis, a referência do
  comunicado à destinação dos imóveis (com sua qualificação e os destinatários citados); as republicações na imprensa não somam peso
  e não foram registradas. O evento de 24/08/2026 não foi editado.
