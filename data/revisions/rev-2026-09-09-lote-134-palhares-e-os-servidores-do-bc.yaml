title: Lote 134 — Leonardo Palhares, o operador jurídico, e o preço da supervisão bancária
summary: 'Continuação da investigação a partir do nó aberto no lote anterior. A leitura da íntegra da
  decisão da PET 15.556 mostra que Palhares tem seção própria e cautelares no dispositivo — tornozeleira
  e passaporte retido, sem prisão —, e que a PF descreve as contas da Varajo como ''conta de passagem''
  dos recebimentos ilícitos. Registro da Receita confirma: sociedade unipessoal de R$ 10 mil de capital,
  em coworking na Paulista, aberta em 2020 — antes dos pagamentos, o que afasta a hipótese de empresa
  criada para o esquema — e suspensa por determinação judicial em 03/03/2026. A sindicância do Banco Central
  apurou dois contratos de cerca de R$ 4 milhões entre a Varajo e Belline Santana, classificados como
  ''negócio simulado'': R$ 2 milhões por um estudo de 50 páginas que a comissão diz que poderia ser feito
  por inteligência artificial a baixíssimo custo. Quatro números divergentes sobre o mesmo pagamento ficam
  registrados sem conciliação. O achado que liga frentes: foi Palhares quem estruturou, em maio de 2025,
  as minutas do contrato de até R$ 50 milhões entre a holding de Vorcaro e o escritório da esposa do ministro
  Alexandre de Moraes, alertando sobre o ''risco reputacional''. Registrado também o fato ambivalente
  que nenhuma fonte resolve: Belline denunciou as carteiras do Master ao MPF sete dias antes das mensagens
  em que Vorcaro manda pagá-lo. Correção relevante: Paulo Sérgio Neves de Souza nunca saiu do Banco Central
  — voltou em outubro de 2023 como chefe-adjunto do Desup, subordinado a Belline. Nova organização: a
  associação SOLAR.'
