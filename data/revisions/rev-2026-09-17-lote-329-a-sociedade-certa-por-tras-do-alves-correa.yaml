title: Lote 329 — a sociedade certa por trás do 'Alves Corrêa'
summary: 'A pergunta que o lote 328 deixou aberta tem resposta. A sociedade Alves Corrêa & Advogados Associados,
  de 2007, não podia ter recebido nada em 2024: foi extinta em 27/02/2013, por liquidação voluntária. A sociedade
  ativa da mesma titular é a Alves Corrêa & Veríssimo Advocacia, aberta em 14/06/2016, com capital de R$ 500 mil,
  Dalide Barbosa Alves Corrêa como sócia-administradora desde a abertura e David Veríssimo de Souza como sócio desde
  2019. E há uma fonte que a nomeia por extenso três dias antes do Estadão: o levantamento do ND Mais de 14/09/2026
  lista os maiores recebedores de honorários do Master e atribui à Alves Corrêa Verissimo Advocacia cerca de R$
  32,9 milhões, ao lado de Barci de Moraes, Monteiro/Rusu/Cameirão/Bercht, Warde, Gabino Kruschewsky, Marcus Vinícius
  Furtado Coelho e Mytra. A identificação da pessoa jurídica continua sendo por convergência de nome, titularidade
  e período: nenhum contrato, nota fiscal ou extrato público liga o CNPJ a um pagamento. A busca no DJEN foi estendida
  ao outro sócio e também não encontra processo com o Banco Master como parte.'
