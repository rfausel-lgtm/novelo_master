corrections:
- 'Editor-master (21/10/2026): a fonte e o documento do Acórdão 5184/2026 passam a apontar para o portal de jurisprudência do TCU, lido pelo editor e coincidente com o PDF hospedado pelo Poder360; com isso a classe D fica mantida pelo mesmo critério do Acórdão 5163/2026 (lote 355), e não pelo PDF de veículo com código de autenticidade não conferido, que pelo critério do despacho de 24/03/2026 seria A. Saem as menções à autenticidade não conferida; o sha256 da captura foi recalculado.'
- 'Editor-master: a evidência do Poder360 sobre o TC 008.216/2025-8 e o TC 022.950/2025-7 dizia que este "segue sem a conclusão" que o sobrestamento aguardava, inferência que a reportagem não faz; passa a dizer o que a fonte diz (investigação que apura possível omissão, sem decisão de mérito informada) e muda de id para ev-poder360-relata-tc-008-216-2025-8-paralisado-e-descreve-o-tc-022-950-2025-7.'
- 'Editor-master: a posição registrada de Jorge Oliveira deixa de trazer a leitura do Poder360 de que ele "voltou atrás"; caracterização do veículo não é posição do citado.'
- 'Editor-master: o contraditório not_located do BC e de Galípolo passa a descrever a busca feita nas notas à imprensa de bcb.gov.br (16 a 21/10/2026).'
