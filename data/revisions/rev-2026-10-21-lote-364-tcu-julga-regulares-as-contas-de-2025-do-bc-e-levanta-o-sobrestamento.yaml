title: Lote 364 — O TCU julga regulares as contas de 2025 do Banco Central e levanta o sobrestamento de 13/10
  (Acórdão 5.184/2026, 2ª Câmara, 20/10/2026)
summary: 'Lote curto sobre um ato de tribunal de contas. O que NÃO se afirma, em destaque: o Novelo não afirma
  que o BC foi "inocentado" nem "absolvido" no caso Master; o acórdão trata das contas de 2025 (TC
  007.138/2026-1) e não cita o TC 022.950/2025-7 (representação do MPTCU sobre a supervisão e a resolução do
  Master, sob sigilo, que o Poder360 descreve como investigação em curso, sem informar decisão de mérito) nem
  o TC 008.216/2025-8 (BRB–Master, que segundo o Poder360 "está paralisado" à espera do STF); julgar
  regulares contas com quitação plena não é conclusão sobre a atuação do BC no caso. Camada D quanto ao
  conteúdo do ato, lido no portal de jurisprudência do TCU em 21/10/2026 e coincidente com o PDF do excerto da
  Relação 34/2026 hospedado pelo Poder360. O evento: em 20/10/2026 (Ata 36/2026, relator Jorge Oliveira,
  Jhonatan de Jesus na presidência), a 2ª Câmara acordou em levantar o sobrestamento do Acórdão 5163/2026,
  julgar regulares as contas dos nove responsáveis (entre eles Gabriel Galípolo), com quitação plena, e
  arquivar os autos, sem determinações. Considerandos: a AudBancos propõe a regularidade; o MPTCU, "embora
  tenha suscitado questão examinada em outro processo", reconheceu que os elementos dos autos não evidenciam
  irregularidades capazes de comprometer a regularidade das contas. O evento de 13/10 (lote 355) ganha o
  desfecho. Os CPFs exibidos no portal e no PDF não são registrados; os outros oito responsáveis não ganham
  verbete (só Galípolo já constava). Camada A: o Poder360 (20/10) diz que o TC 008.216/2025-8 segue
  paralisado e descreve o TC 022.950/2025-7 como apuração de possível omissão do BC; a matéria usa
  "suspensão" e "suspendido" para o que o acórdão chama de "sobrestar" e diz que o relator "voltou atrás", leitura do veículo
  que o Novelo não adota. Contraditório: nenhuma nota do BC nem manifestação de Galípolo nas notas à imprensa
  de bcb.gov.br de 16 a 21/10/2026. Não confirmado: Ata 36/2026, autos, estado atual do TC 022.950/2025-7.'
