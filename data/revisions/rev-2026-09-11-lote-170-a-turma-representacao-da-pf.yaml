title: 'Lote 170 — A Turma: o aparelho de intimidação de Vorcaro, na própria petição que levou Mourão à prisão'
summary: 'Primeiro lote extraído da leitura integral do e-Doc 1 da PET 15.556 (416 peças obtidas pelo
  editor via certificado digital, após o levantamento do sigilo determinado por Fachin em 10/09/2026 —
  lote 168/169), triagem automatizada por cruzamento com as ~390 entidades já mapeadas. É a representação
  da PF de 27/02/2026 — a própria peça que fundamentou a prisão preventiva de Luiz Phillipi Mourão em
  04/03/2026; ele morreu sob custódia policial dias depois, e o acervo só tinha o desfecho, não a base.
  Documenta, com transcrição de WhatsApp, quatro episódios do núcleo de intimidação apelidado ''A Turma'':
  ameaça de morte contra o ex-funcionário Luís Felipe Woyceichoski e sua família (mai-jul/2024); invasão
  de WhatsApp e iCloud do empresário crítico Luiz Guilherme Camasmie (out/2024); um documento forjado com
  aparência de ser da Interpol, com oferta de R$ 10 milhões para intimidar terceiro (out/2024); e ofícios
  falsos ao Facebook/Meta usando o e-mail funcional de uma servidora do MP-CE — cuja participação consciente
  a própria PF não estabelece. Esclarece também uma divergência já registrada no acervo sobre a estrutura
  de comando: Mourão comandava, Marilson Roseno da Silva liderava em campo. Eleva de classe A para D a
  relação Vorcaro-Lauro Jardim (plano de agressão ao jornalista), com as mensagens na íntegra, incluindo
  uma de vigilância (08/06/2025) que a imprensa não havia reproduzido. O documento cobre 164 páginas; este
  lote fecha as seções 2.2.1 a 2.2.3 (informações sigilosas, violência, monitoramento). Seções restantes
  — pagamentos e operadores financeiros, influenciadores digitais, o vazamento que permitiu a fuga de
  Vorcaro em 17/11/2025, conclusões e pedidos cautelares — ficam para lotes seguintes.'
