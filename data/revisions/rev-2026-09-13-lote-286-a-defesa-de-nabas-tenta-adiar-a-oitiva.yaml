title: 'Lote 286 — a defesa de Nabas disputa acesso ao inquérito e tenta adiar sua oitiva'
summary: 'Leitura de peças já baixadas em coleta anterior, mas ainda não lidas — e-mails juntados à Pet
  15.625/DF entre o escritório Bunazar Advogados (defesa de João Cláudio Nabas) e a Polícia Federal, de
  30/06 a 27/08/2026. A defesa pediu repetidamente acesso a novas juntadas do inquérito e usou a alegação de
  acesso insuficiente para pedir o adiamento da oitiva de Nabas (inicialmente 06/08/2026); a PF respondeu que
  o acesso deve se dar diretamente pelo processo eletrônico do STF, e manteve a oitiva, remarcada para
  27/08/2026 por videoconferência. Não há informação sobre o que de fato ocorreu na oitiva nem sobre o
  resultado da perícia ou do PAD já registrados no acervo. Uma declaração da UFPR, junta ao mesmo lote de
  peças, não foi lida por ser documento escaneado sem texto extraível.'
