title: 'Lote 292 — o "caso Cabral": mensagens de 2022 entre Cláudio Castro e o hoje relator André Mendonça'
summary: 'Achado do agente de monitoramento de imprensa, verificado por WebFetch direto: com a queda de
  sigilo que trouxe à tona documentos antes restritos, vieram a público mensagens de 2022 em que Cláudio
  Castro (então governador do Rio) escreveu a André Mendonça — "Amigo, preciso falar" — sobre o "caso Cabral"
  (o ex-governador Sérgio Cabral), enviando arquivos de pedidos de habeas corpus; Mendonça respondeu que
  ligaria em minutos, e dias depois votou pela soltura de Cabral. Mendonça é hoje o relator do caso
  RioPrevidência/Banco Master, no qual Castro é investigado, e indeferiu em julho de 2026 um pedido de nova
  busca e apreensão contra Castro, mesmo com parecer favorável do PGR Paulo Gonet. Levanta uma questão de
  proximidade pessoal entre relator e investigado, no mesmo contexto mais amplo da crise de imparcialidade já
  documentada no acervo.'
