title: 'Lote 60: a absolvição de Botelho, confirmada em sentença'
summary: 'Correção em favor de pessoa identificada. O corpus registrava a absolvição de Benjamim Botelho
  de Almeida na ação penal sobre o Banco Máxima apenas como versão de sua defesa, marcada como não confirmada
  — o que lhe era desfavorável sem lastro. A equipe obteve a íntegra da sentença pela API pública do DJEN/CNJ,
  rota que resolveu o acesso depois de o TRF3 e o PJe de primeiro grau recusarem conexão: a ação penal
  nº 5003557-34.2021.4.03.6181, da 6ª Vara Criminal Federal de São Paulo, absolveu em 25/04/2025 quatro
  dos cinco réus com fundamento no art. 386, V, do CPP, condenando apenas Saul Dutra Sabbá. Quanto a Botelho,
  a sentença assenta que ele não detinha relação de controle, administração ou gerência sobre o Banco
  Máxima, elemento exigido pelo art. 25 da Lei 7.492/86. Registra-se, com o mesmo destaque, o que a nota
  da defesa omitia: o MPF apelou, e o recurso seguia pendente na 11ª Turma do TRF3, com pedido de vista
  em 11/06/2026. Corrige também o registro da condenação de Sabbá, que mencionava um único corréu quando
  eram quatro, todos absolvidos, e esclarece que o réu não nomeado do RHC 188.922 do STJ é Alberto Maurício
  Caló, não Botelho.'
