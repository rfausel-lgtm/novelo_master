title: 'Lote 294 — João Henrique Caldas (JHC) identificado como responsável legal do Iprev de Maceió no
  caso dos R$ 97 milhões'
summary: 'Achado do agente de monitoramento de imprensa, verificado por WebFetch direto: com repercussão
  nacional do caso Iprev-Master (já documentado, R$ 97 milhões aportados no Banco Master em 2023-2024), foi
  identificado que João Henrique Caldas (JHC), ex-prefeito de Maceió e candidato ao governo de Alagoas, era o
  "responsável legal da unidade gestora" do Iprev perante o Ministério da Previdência Social no período dos
  aportes, com autoridade para nomear/exonerar a cúpula do instituto. Ele não é, até esta coleta, formalmente
  investigado criminalmente — o caso foi remetido ao STF para análise de competência.'
