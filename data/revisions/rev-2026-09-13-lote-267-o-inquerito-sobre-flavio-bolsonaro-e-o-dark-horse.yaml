title: 'Lote 267 — o inquérito sobre Flávio Bolsonaro: "irmão, estou e estarei contigo sempre"'
summary: 'Continuando o mapeamento dos 17 processos que a PGR listou como excluídos do levantamento de sigilo
  de 10/09 (lote 265), a Pet 16.369 apareceu reautuada como INQ 5.070. Lida por inteiro: é o inquérito formal
  que investiga o senador Flávio Bolsonaro por lavagem de dinheiro, evasão de divisas, corrupção e organização
  criminosa no financiamento do filme "Dark Horse" — resolvendo o open_question que o acervo já registrava
  ("os inquéritos no STF não foram lidos pela equipe"). A representação da PF, com base em mensagens extraídas
  do celular de Vorcaro, mostra Flávio como interlocutor direto do banqueiro — não terceiro mencionado — em
  cobranças de pagamento ao longo de 2025, culminando na mensagem de véspera da prisão dele: "Irmão, estou e
  estarei contigo sempre, não tem meia conversa entre a gente. Só preciso que me dê uma luz! Abs!". Descreve
  também um print atribuído a Eduardo Bolsonaro com instruções sobre gestão de recursos nos EUA, e nomeia
  Altieres Santana, corretor de imóveis ligado à gestora do fundo Havengate. Mendonça autorizou a instauração
  em 22/07/2026.'
