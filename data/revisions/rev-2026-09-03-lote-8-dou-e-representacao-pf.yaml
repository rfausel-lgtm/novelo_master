summary: 'Lote 8: atos oficiais e a representação de 98 páginas. Atos do Presidente do BC nº 1.377 e nº
  1.378 (DOU de 19/02/2026) elevam a liquidação do Banco Pleno a documental e trazem o termo legal de
  22/12/2025; a liquidação da CBSF (ex-Reag) ganhou data certa (15/01/2026). A representação da PF (INQ
  5026, PET 16.032) acrescenta o uso gratuito de aeronaves e ingressos, o contrato do apartamento quitado
  na assinatura, e a origem da sociedade de Augusto Lima no Master pelas carteiras do CredCesta, criado
  no contexto da Empresa Baiana de Alimentos; entra também a Lei nº 14.431/2022, que ampliou o consignado.'
