title: Lote 122 — a segunda doação de Pastore a Botelho, e o primeiro pedido de afastamento de Toffoli
summary: 'Aprofundado Luiz Osvaldo Pastore: doou R$ 300 mil, em 2022, à campanha do próprio Augusto de
  Arruda Botelho a deputado federal — segunda conexão financeira entre os dois, anterior ao voo a Lima.
  Registrado que deputados de oposição (Carlos Jordy e outros) já haviam pedido, em janeiro de 2026, o
  afastamento de Toffoli citando o mesmo voo — pedido arquivado por Gonet em 23/01/2026, anterior ao pedido
  de suspeição da PF de fevereiro já documentado no corpus. Registrada a candidatura de Pastore a suplente
  de Eduardo Gomes em 2026, sem conexão factual estabelecida com o caso Master. Confirmado, por múltiplas
  fontes, o silêncio de Pastore sobre o episódio e a ausência de qualquer vínculo societário ou financeiro
  dele com o ecossistema Master — resultados negativos documentados.'
