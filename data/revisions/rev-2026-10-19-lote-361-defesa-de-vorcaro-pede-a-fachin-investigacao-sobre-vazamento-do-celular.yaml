title: Lote 361 — Defesa de Vorcaro pede ao presidente do STF, Fachin, investigação criminal sobre a
  divulgação de dados do celular (alegação atribuída)
summary: 'Lote curto, só com alegação atribuída. O que NÃO se afirma, em destaque: o Novelo não leu a petição
  e não afirma a autenticidade, a procedência ou a licitude do material extraído do celular de Daniel Vorcaro,
  nem a tese da defesa de que ele não pode embasar novas investigações; não registra o conteúdo de nenhuma
  mensagem ou áudio, inclusive das conversas com advogados, nem o assunto das divulgações; não nomeia os
  "agentes públicos" ou "terceiros" a que a defesa se refere; não liga a petição a nenhum outro registro do
  acervo; e distingue o pedido do que levou à decisão de 06/03/2026 do relator André Mendonça na Pet 15612
  (classe D, já no acervo). O evento: segundo CNN Brasil (16/10), O Tempo (17/10) e Agência
  Brasil (16/10), a defesa enviou ao presidente do STF, Edson Fachin, na sexta-feira 16/10/2026, petição
  pedindo investigação criminal ampla sobre a divulgação de dados do celular apreendido na Operação Compliance
  Zero, para identificar os responsáveis ("agentes públicos" ou "terceiros"), alegando violação do sigilo
  advogado-cliente e sustentando que o material não pode embasar novas investigações contra Vorcaro. Três
  evidências de classe A, uma por veículo com apuração própria (a republicação do Poder360 não é registrada
  e não corrobora); evento `unverified`. Posições: Fachin/STF, PF, PGR e Mendonça `not_located`; não foram
  localizados número de processo, relator, despacho nem parecer. Nenhuma pessoa, organização, relação ou
  sequência nova; nenhum registro existente alterado.'
