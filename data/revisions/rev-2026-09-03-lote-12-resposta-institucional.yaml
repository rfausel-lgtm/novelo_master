summary: 'Lote 12: a resposta institucional e legislativa, por fontes oficiais. Fato Relevante do BRB
  de 28/03/2025 com os percentuais exatos da compra; requerimento da CAE registrando que o preço equivalia
  a 75% do patrimônio do banco público; convocações da CPI do Crime Organizado e da CPMI do INSS; PLP
  135/2026, de Ciro Nogueira, elevando o limite do FGC; substitutivo à PEC 65/2023 aprovado na CCJ; projeto
  da Câmara sobre exoneração de diretor do BC; e o comunicado oficial da PF sobre a 10ª fase, que eleva
  o evento a documental.'
