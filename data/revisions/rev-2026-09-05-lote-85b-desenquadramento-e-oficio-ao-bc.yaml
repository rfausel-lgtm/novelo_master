title: Lote 85b — o desenquadramento, e o ofício da Amprev ao Banco Central
summary: 'A ''notificação do desenquadramento'' invocada na petição inicial não vem de órgão externo:
  é a reação administrativa da própria autarquia ao rebaixamento do rating, que fez o banco deixar de
  atender ao critério de baixo risco de crédito. Os autores dizem ter instaurado processo, notificado
  formalmente o banco e exigido reenquadramento; o liquidante responde que o art. 27 dá cento e oitenta
  dias ao gestor e que nunca houve ordem de resgate. Localizado nos autos o ofício de 11/09/2025 em que
  o diretor-presidente pergunta ao presidente do Banco Central, pela segunda vez, sobre processos contra
  o Master e sobre os motivos da negativa à compra pelo BRB — dois meses antes da liquidação, sem resposta
  localizada. A Lista Exaustiva de 06/05/2024, sem o Master como emissor, também está juntada. E os autos
  registram caso análogo no Tribunal de Justiça do Rio de Janeiro.'
