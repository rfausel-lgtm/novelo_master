title: 'Lote 256 — a holding do presidente do BRB, e o "frio na espinha" de quem assinava pela Tirreno'
summary: 'Mais dois celulares analisados pela PF e juntados ao INQ 5.026. No de Paulo Henrique Costa, então presidente do
  BRB, a PF encontrou a negociação de apartamentos de R$ 4,67 milhões e R$ 6,01 milhões entre novembro de 2024 e
  janeiro de 2025, com pedido de sigilo, contratos com o comprador em branco e uma holding "para que não seja direto
  em meu nome"; e uma mensagem de setembro de 2025, mês em que o Banco Central barrou a compra do Master, sobre "uma
  solução que não depende do Bacen". No de André Seixas Maia, apresentado como responsável pela Tirreno, a empresa só
  aparece em 04/04/2025 — quatro meses depois da data dos documentos que a criaram. Tudo registrado como alegação da
  PF, sem denúncia.'
