title: 'Lote 249 — a delegada escolhida em dezembro, o COAF submetido à reclamação e a CPMI que queria Vorcaro obrigado a depor'
summary: 'Fecha a leitura das peças de conteúdo da Reclamação 88.121. Em 18/12/2025, o diretor-geral da PF, Andrei
  Rodrigues, designou a delegada Janaina Pereira Lima Palazzo, chefe da Delegacia de Inquéritos Especiais no DF,
  para conduzir a investigação sob supervisão do STF — a mesma delegada que o acervo só conhecia como destinatária
  de ofício em agosto de 2026. Três despachos de Dias Toffoli mostram o COAF sendo submetido à reclamação: mandado
  a observar a liminar de 09/12 (23/12/2025), avisado da decisão de 12/12 (02/02/2026) e obrigado a enviar as
  informações requisitadas ao INQ 5.026 (09/02/2026) — a base do roteamento de RIFs descrito pelo próprio COAF e
  já registrado. E um ofício de 29/01/2026 do senador Carlos Viana, presidente da CPMI do INSS, pediu a Toffoli o
  depoimento compulsório de Vorcaro, marcado inicialmente para 05/02/2026, argumentando que as ADPFs 395 e 444 não
  alcançam as CPIs.'
