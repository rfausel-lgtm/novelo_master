title: 'Lote 308 — na véspera da sessão, Gilmar formaliza a Fachin o pedido de adiamento'
summary: 'CORRIGIDO EM 15/09/2026 (ver corrections abaixo): achado do agente de monitoramento de imprensa,
  verificado por duas fontes independentes (Migalhas e Exame), ambas de 11/09/2026 (não 14/09, como constava
  na publicação original deste lote) — Gilmar Mendes enviou ofício formal ao presidente do STF, Edson Fachin,
  pedindo o adiamento do julgamento da Pet 16.662 e propondo reunir os processos de Moraes e Mendonça sob a
  relatoria do próprio Fachin — ou, mantida a sessão, que ele mesmo apresentasse o caso ao plenário, com as
  preliminares (inclusive o pedido de nulidade da PGR) examinadas antes do mérito. Fachin respondeu no dia
  seguinte, 12/09/2026: indeferiu a reunião, manteve a sessão de 15/09 exclusiva à Pet 16.662 e remeteu a
  Pet 16.704 (caso Mendonça) para 23/09 — despacho já publicado no acervo (lote 253/254) antes mesmo deste
  item ter sido registrado.'
