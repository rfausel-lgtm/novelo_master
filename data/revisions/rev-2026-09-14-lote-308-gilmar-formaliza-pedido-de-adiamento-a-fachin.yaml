title: 'Lote 308 — na véspera da sessão, Gilmar formaliza a Fachin o pedido de adiamento'
summary: 'Achado do agente de monitoramento de imprensa, verificado por duas fontes independentes (Migalhas
  e Exame): na véspera da sessão extraordinária de 15/09/2026, Gilmar Mendes enviou ofício formal ao
  presidente do STF, Edson Fachin, pedindo o adiamento do julgamento da Pet 16.662 e propondo reunir os
  processos de Moraes e Mendonça sob a relatoria do próprio Fachin — ou, mantida a sessão, que ele mesmo
  apresentasse o caso ao plenário, com as preliminares (inclusive o pedido de nulidade da PGR) examinadas
  antes do mérito. É a formalização, em documento escrito, do que Gilmar já sugerira publicamente em
  entrevista de 11/09/2026 (já no acervo). Nenhuma fonte localizada até esta coleta relata se Fachin
  respondeu ao ofício antes da sessão.'
