title: 'Lote 207 — O celular de Marilson: o codinome "MISTER" e a versão que não se sustenta'
summary: 'Primeiro lote do e-Doc 14 da PET 15.978 — IPJ nº 1752768/2026, a primeira análise do acervo
  baseada no celular apreendido diretamente com Marilson Roseno da Silva (fonte distinta das duas já
  mineradas do celular de Daniel Vorcaro). Revela que o próprio Marilson mantinha uma conta secundária de
  WhatsApp Business associada a um número da Turquia, sob o codinome "MISTER", com mensagens que se
  autoapagavam — e mapeia outros terminais internacionais da organização: possivelmente do Reino Unido
  para Luiz Phillipi Mourão, dos EUA para Sebastião Monteiro Júnior (já conhecido) e da Colômbia,
  precisando agora o número, para Henrique Vorcaro. Traz também a própria oitiva de Marilson, em que ele
  tenta desqualificar as acusações como "fake news" — dizendo gravar áudios falsos a pedido de Mourão sem
  receber nada — mas se contradiz ao descrever, na mesma oitiva, um padrão recorrente de dois anos em que
  Vorcaro o questionava todo fim de ano sobre mandados de prisão pendentes, e ao negar e depois confirmar
  que usava o codinome "SP" para se referir a Vorcaro.'
