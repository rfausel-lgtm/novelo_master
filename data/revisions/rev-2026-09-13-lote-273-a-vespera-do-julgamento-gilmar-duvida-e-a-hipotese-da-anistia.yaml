title: 'Lote 273 — a véspera do julgamento: Gilmar duvida que a Pet 16.662 esteja pronta, e a PF liga
  Mendonça a uma possível anistia do 8 de janeiro'
summary: 'Varredura de imprensa (não do STF) a dois dias da sessão extraordinária de 15/09/2026. Dois
  achados: (1) em 11/09/2026, Gilmar Mendes questionou publicamente se a Pet 16.662 está em condições de
  julgamento — "A rigor, na Pet 16.662, não há nem sequer pedido a ser decidido" —, apontando indefinição
  sobre quem é investigado, o objeto da apuração e o rito, e propondo que Fachin primeiro reunisse os
  procedimentos correlatos antes de levar o caso ao Plenário; a sessão foi mantida assim mesmo. (2)
  Enriquecimento de achado já publicado (a hipótese da própria PF de que Mendonça mira Alcolumbre via Rueda):
  o mesmo relatório de inteligência liga esse suposto interesse a um motivo mais amplo — a chance de que uma
  composição mais favorável do STF viabilizasse "anistia ampla dos crimes cometidos no contexto da recente
  tentativa de golpe de Estado", isto é, dos atos de 8 de janeiro de 2023. Nenhum dos dois achados é fato
  estabelecido: o primeiro é posição pública de um ministro sobre o rito; o segundo é hipótese da própria PF
  sobre a motivação de outro ministro, não confirmada por nenhuma autoridade.'
