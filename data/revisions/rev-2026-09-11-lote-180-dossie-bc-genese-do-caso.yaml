title: 'Lote 180 — o dossiê interno do BC: a gênese do caso e os primeiros relatos de Belline e Paulo Sérgio'
summary: 'Décimo primeiro documento explorado do acervo de 416 peças da PET 15.556, e um dos mais
  substantivos até agora: o e-Doc 7 é o próprio dossiê interno de admissibilidade correcional do Banco
  Central (PE 301538/PE 301598) que originou, do lado do BC, todo o caso Compliance Zero — dois meses antes
  das buscas de março de 2026. Contém os relatos verbais que Belline Santana e Paulo Sérgio Neves de Souza
  deram pessoalmente aos investigadores internos em 07/01/2026, antes de qualquer repercussão pública, e o
  Ofício 935/2026-BCB/SECRE de 09/01/2026, assinado pelo presidente Gabriel Galípolo, comunicando à PF
  indícios de corrupção passiva — o ato que efetivamente deflagrou o lado criminal do caso. Belline descreve,
  com mais detalhe que a versão já conhecida pela imprensa, uma oferta de R$ 2 milhões de "Leonardo Palhares"
  (que se apresentou ligado à Câmara e.Net) por um projeto de inclusão financeira de jovens, com pagamentos
  que migraram por três veículos ao longo do tempo — incluindo uma empresa até então desconhecida do
  acervo, a "Inspiração", criada por ele mesmo em 2025. Paulo Sérgio revela uma venda até então desconhecida:
  um sítio em Guaxupé/MG por R$ 4,5 milhões (janeiro/2020) a Fabiano Zettel — descoberto como comprador só
  um ano depois, na escritura —, cuja relação com a "fazenda de café" já registrada no verbete dele (R$ 3
  milhões, 2021) não está esclarecida. O material também reforça, sem fechar, a hipótese já registrada de
  que o "Leonardo Palhares" da Varajo e o homônimo presidente da Câmara e.Net possam ser a mesma pessoa —
  os próprios investigadores do BC associaram os dois nomes ao apurar o caso.'
