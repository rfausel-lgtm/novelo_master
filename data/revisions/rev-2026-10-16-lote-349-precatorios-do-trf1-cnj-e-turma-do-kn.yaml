title: 'Lote 349 — O Corregedor Nacional de Justiça manda cancelar R$ 6,6 bi em precatórios do TRF-1 (a decisão não cita o Master); o contrato de honorários da “Turma do KN”; e as duas ações do STF sobre as usinas'
summary: >-
  Segundo lote da varredura de 19/09 a 15/10/2026. O ponto de maior lastro são duas decisões do corregedor
  nacional de Justiça, ministro Benedito Gonçalves, no Pedido de Providências 0007917-89.2026.2.00.0000
  (requerente AGU, requerido TRF-1), lidas na íntegra (classe D): em 22/09/2026 (assinatura às 23h37; notícia
  oficial do CNJ em 23/09), cautelar que suspende decisões da Presidência do TRF-1 em três suspensões de liminar e
  manda cancelar, em cinco dias, 16 precatórios que somam R$ 4.738.065.026,73, da Usina Capricho, da Una Agroindustrial e
  da Vale do Ceará Mirim, com devolução ao Tesouro; em 28/09/2026, aditamento que estende a medida a 14 requisições
  que somam R$ 1.877.143.674,66 nas datas-base (Santa Helena, Agrovale e Borborema). Os cerca de R$ 6,6 bilhões são soma do
  Novelo. Nem as decisões nem as notícias oficiais do CNJ mencionam o Banco Master ou Daniel Vorcaro: a ligação das
  três primeiras usinas ao Master é a lista "precatórios a receber" do celular de Vorcaro, descrita pelo SBT News e
  pelo Times Brasil (classe A) e não localizada pelo Novelo; as três do aditamento não são ligadas ao Master por
  nenhuma fonte aberta. O referendo do Plenário do CNJ não está na pauta da sessão virtual de 08 a 16/10. Segunda
  frente: segundo o Metrópoles e a CNN Brasil (21/09), que dizem ter obtido o documento, o Master contratou o
  escritório Queiroga, Vieira, Queiroz & Ramos, do qual é sócia, segundo a Agência Brasil e o Times Brasil, a
  advogada Camilla Ramos, casada com o desembargador federal Newton Ramos (TRF-1), com honorários de êxito de 5%
  em 12 ações do setor sucroalcooleiro; a existência do contrato é classe C (as duas apurações e a nota do
  escritório de 23/09, que declara ter o contrato e diz não ter recebido nada); o teto de R$ 427 milhões, calculado
  pelo Metrópoles sobre o valor de face e devido só em caso de êxito, é classe A. Segundo as mesmas reportagens,
  mensagens de assessores de Vorcaro chamam o casal de "Turma do KN", e a leitura da sigla como referência ao
  ministro Kassio Nunes Marques é da imprensa (o Times Brasil a atribui à PF), sem documento acessível que a
  confirme; as mensagens não são transcritas. Nunes Marques nega ter votado a favor de Vorcaro ou do Master,
  trocado mensagens com ele ou autorizado alguém a falar em seu nome; Newton Ramos diz nunca ter julgado causa de
  interesse do banco e descreve relação pessoal anterior com Vorcaro. Em 24/09, segundo a Agência Brasil, o Times
  Brasil e A Crítica, o CNJ fez correição extraordinária no gabinete de Newton Ramos, com apoio da PF (classe C;
  não há notícia oficial), e, segundo o Metrópoles, abriu sindicância contra ele, por decisão distinta das do pedido de
  providências, para apurar sua atuação em processos do setor e possíveis interesses do Master (classe A). No STF, os andamentos
  oficiais (classe D) do ARE 1.327.995 (Destilaria Alcidia) registram o impedimento de Nunes Marques lançado no
  sistema em 21/02/2024 e afastado por ele em 07/03/2024, compatível com a nota do ministro, e os do ARE 1.312.127
  (Raízen) registram decisão de Gilmar Mendes em 24/09, a indicação de afetação ao Plenário acompanhada por Dias
  Toffoli e a vista de Luiz Fux em 02/10; nenhum dos dois menciona o Master. A notícia de fato de deputados do PT
  contra Nunes Marques (12/10) fica em classe A, porque o Times Brasil a atribui à Folha e a independência das duas
  fontes não está demonstrada. Entram Newton Ramos e Camilla Ramos (pessoas) e CNJ, AGU e o escritório
  (organizações); as usinas não ganham verbete. Corrigido no acervo: o cargo de corregedor nacional de Benedito
  Gonçalves, a presidência do TSE de Nunes Marques e a data do impedimento de Benedito no STJ (certidão de
  31/03/2026, segundo o Estadão Conteúdo), além de textos antigos com transcrição de mensagens e juízo próprio.
  Não confirmado: o nome completo do desembargador em página do TRF-1, o número da sindicância, o conteúdo da
  decisão de Gilmar de 24/09, a lista do celular, a data do contrato e o número da notícia de fato.
