corrections:
- 'benedito-goncalves: o cargo de Corregedor Nacional de Justiça não constava do verbete (role e positions); a pendência que datava o impedimento no STJ "no primeiro semestre de 2026" passa a registrar a certidão de impedimento juntada em 31/03/2026, segundo o Estadão Conteúdo (Money Times, 07/04/2026). O resumo transcrevia mensagens privadas do celular de Vorcaro e o campo why_in_novelo ligava a proximidade pessoal ao impedimento ("ao ponto de"); os dois foram reescritos sem transcrição e sem nexo próprio, mantendo as atribuições ao Poder360 e ao Jornal de Brasília.'
- 'nunes-marques: o cargo passa a incluir a presidência do TSE (Poder360, 12/10/2026); a pendência sobre a Consult passa a registrar a frase da nota de 21/09/2026 sobre os serviços do filho.'
- 'gilmar-mendes: o resumo qualificava, em texto próprio, a captura de tela da reportagem do Estadão como "indício de vazamento", e o campo why_in_novelo falava em "achado ainda não explicado"; os dois foram reescritos sem juízo próprio.'
- 'jorge-messias: o campo why_in_novelo tinha duas frases, com juízo próprio ("figura central para entender o verdadeiro motivo"); foi reescrito em uma frase factual.'
- 'tribunal-regional-federal-da-1a-regiao: a posição "nenhuma manifestação localizada" foi substituída pela nota do tribunal de 24/09/2026 sobre a correição; o campo why_in_novelo foi atualizado.'
- 'Correções ao plano de redação (não são de registro publicado): (1) a questão de ordem de Gilmar Mendes é no ARE 1.312.127 (União x Raízen), não no da Destilaria Alcídia; (2) a cautelar do corregedor é de 22/09 (assinatura), e é a notícia oficial do CNJ de 28/09, não a decisão de 28/09, que a chama "de 23 de setembro"; a decisão de 28/09 cita outra decisão de 23/09, da Presidência do TRF-1 na SLS 1010050-92.2026.4.01.0000; (3) no portal do STF, a decisão de Gilmar de 24/09 aparece como "Deferido", sem descrição, e a afetação ao Plenário foi indicada na sessão virtual de 25/09 a 02/10; (4) a condição de sócia de Camilla Ramos vem da Agência Brasil e do Times Brasil, não do Metrópoles; (5) a expressão "até R$ 427 milhões" não está no Metrópoles de 21/09 (que fala em R$ 427 milhões em caso de êxito), e sim no de 24/09 e no Times Brasil; (6) as frases da nota do TRF-1 sobre colaboração e antecipação de responsabilidade são paráfrases dos veículos, e a do CNJ ("ainda não foi comprovada…") é paráfrase do Metrópoles, por isso não vão entre aspas; (7) a Agência Brasil, e não só republicações, data a diligência de "quarta-feira (24)", e 24/09/2026 foi quinta-feira; (8) a nota do escritório não é conhecida por canal próprio, e nada nas fontes lidas indica que ela tenha criticado o vazamento; (9) o desembargador entra com o id newton-ramos, porque o nome completo não foi confirmado em página do TRF-1.'
