title: 'Lote 186 — Imbituva pede inclusão em eventual restituição da delação de Vorcaro'
summary: 'Décimo sétimo documento explorado do acervo de 416 peças da PET 15.556: o e-Doc 260, primeira
  manifestação de Claudinei Galvão da Silva (presidente do FUNPREV Imbituva/PR, já no acervo desde o
  lote 173) localizada no corpus. Não contesta as acusações do TCE-PR — pede diretamente ao STF, em
  29/04/2026, que o título de R$ 4 milhões do fundo seja incluído em eventual restituição a RPPS pactuada
  na delação premiada de Daniel Vorcaro, citando reportagem não verificada sobre uma possível devolução de
  R$ 3 bilhões a fundos de previdência — rumor registrado como tal, não como fato confirmado.'
