reason: >-
  Varredura de 19/09 a 15/10/2026 (linhas C e D, controles institucionais), liberada pelo investigador-chefe em
  16/10/2026 como lote 352 ("quem decide sobre a condução do caso"); o bloco do TCU, de Zanin e das urnas sai em
  lote próprio. Pré-publicação feita no dia: permalink do Informe do STF conferido (é a URL canônica do post, sem
  Wayback; captura e sha256 em raw/) e andamentos das PET 16.704 e 16.662 reconsultados, sem petição identificável
  da PGR depois de 13/10.
