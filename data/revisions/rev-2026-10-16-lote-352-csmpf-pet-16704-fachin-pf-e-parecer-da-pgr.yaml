title: 'Lote 352 — O Conselho Superior do MPF não conhece da suspeição do PGR e rejeita, por 5 a 4, investigar sua atuação no caso Master; a Presidência do STF pede o parecer da PGR na PET 16.704; o Partido Novo pede a anulação da vista de Dino; Fachin e a PF tratam das menções a ministros; e a PGR, segundo a Agência Brasil, se opõe ao afastamento do diretor-geral da PF'
summary: >-
  Lote sobre quem decide a condução do caso, de 25/09 a 13/10/2026. O que NÃO se afirma, em destaque: as decisões
  aqui registradas são atos processuais e de colegiado, não juízo sobre a conduta de ninguém; o Novelo não
  localizou a ata nem os votos nominais da sessão do Conselho Superior do MPF, o parecer da PGR sobre o
  afastamento do diretor-geral da PF (nem a PET em que estaria), a peça do Partido Novo de 28/09 nem decisão sobre
  ela, e não atribui a ninguém as petições sem identificação listadas nos andamentos das PET 16.704 e 16.662.
  Camada D, só quanto ao conteúdo de cada ato: segundo a notícia oficial do MPF (25/09/2026, 18:14) e a convocação
  de 23/09, na 1ª Sessão Extraordinária de 2026 o Conselho Superior do MPF, com relatoria do subprocurador-geral
  Francisco Sanseverino e presidência prevista, na convocação, do vice-presidente Nicolao Dino, apreciou a Notícia de Fato
  PGR-00385698/2026 (número só na convocação), sobre a atuação do PGR Paulo Gonet nas apurações do Master,
  especialmente nas PET 15.556 e 16.662; por unanimidade decidiu pelo não conhecimento dos pedidos de impedimento
  ou suspeição, por não ter competência legal para analisá-los, e julgou prejudicados os de afastamento; por cinco
  votos a quatro negou a investigação criminal "por ausência de elementos mínimos para a tipificação do crime de
  prevaricação". O MPF não nomeia o requerente; segundo o Poder360 e a Agência Brasil, é o Partido Novo (classe C);
  a Agência Brasil fala em "9 votos a 0" para não afastar, versão não adotada. Na PET 16.704, despacho da
  Presidência do STF de 25/09/2026 (portal, consulta de 16/10) determina a oitiva da PGR, em cinco dias, "acerca de
  todas as providências postuladas"; até 13/10, última entrada, não há petição identificável da PGR, devolução da
  vista de Flávio Dino nem nova pauta. Em 13/10/2026, segundo o Informe à Imprensa conjunto do STF e da PF (lido na
  íntegra, com captura e sha256 em raw/), Fachin recebeu Andrei Rodrigues em audiência solicitada pela PF; o
  diretor-geral tratou do Ofício 3467748, de 02/10, cujo remetente o Informe não identifica e o Novelo não fixa; o
  presidente esclareceu que a investigação de ministro depende de autorização do Plenário e que a PF deve
  encaminhar "todas as menções encontradas sem exceção", em caráter descritivo; a Presidência aguardava a PGR na
  PET 16.704; o Informe não fixa prazo nem nomeia ministros. Camada C/A: segundo o Congresso em Foco e o Times
  Brasil, o Novo pediu a Fachin em 28/09 a anulação da vista de Dino de 15/09, com empate de 4 a 4 e voto de
  desempate do presidente; os argumentos ("desvio de finalidade") são do requerente; Dino não respondeu nas fontes.
  Segundo a Agência Brasil (classe A), Fachin oficiou à PF em 02/10 e a PGR enviou ao STF, na noite de 13/10,
  parecer contrário ao afastamento de Andrei Rodrigues e de Leandro Almada, por falta de evidências da
  "participação imprópria em atos ilícitos". Entra uma organização nova, o Conselho Superior do MPF; Sanseverino,
  Nicolao Dino e os demais conselheiros não ganham verbete, nem os signatários do parecer. Corrigido no acervo: a
  pendência de Paulo Gonet sobre a manifestação formal da PGR, superada, e o contraditório genérico do Partido
  Novo. Não confirmado: ata, votos e requerente na fonte oficial do MPF; peticionantes da PET 16.704; teor, data e
  PET do parecer da PGR; destino do pedido do Novo e do agravo de 14/09; devolução da vista de Dino; formato e data
  da entrega do material da PF; manifestação de Gonet sobre a decisão do Conselho.
