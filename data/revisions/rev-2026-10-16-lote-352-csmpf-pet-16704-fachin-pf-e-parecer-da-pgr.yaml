corrections:
- 'paulo-gonet: a pendência "O corpus não tem a manifestação formal da PGR ao relator; o prazo de cinco dias estava em curso" estava desatualizada diante do despacho da Presidência de 25/09/2026 na PET 16.704 e do Informe do STF de 13/10/2026; foi reescrita com o estado atual (parecer pedido em 25/09, aguardado em 13/10, parecer sobre o afastamento noticiado só pela Agência Brasil).'
- 'partido-novo: o cited_position not_located genérico ("Nenhuma manifestação pública específica localizada") foi substituído pelas manifestações localizadas: o pedido de 28/09/2026 (version) e a ausência de nota sobre a decisão do Conselho Superior do MPF (not_located com a busca descrita).'
- 'Nota de método (não é correção de registro publicado): o Informe oficial de 13/10/2026 diz que o diretor-geral "tratou do Ofício 3467748", de 02/10, sem dizer quem o expediu; a Agência Brasil noticia ofício de Fachin à PF naquela data, sem número; o Novelo não fixa o remetente do nº 3467748 nem afirma se há um ou dois ofícios de 02/10 (a versão do plano de redação, de que o nº seria da PF, foi retirada por não constar do Informe). A frase de que suspeição é matéria do STF "onde tramita a ação", do plano de redação, não é literal na notícia do MPF, que diz que o questionamento deve ser feito no processo em trâmite no STF; entrou em paráfrase. A expressão "desvio de finalidade" está só no Congresso em Foco, e "deixou de servir ao exame do processo para servir à condução da sessão" só no Times Brasil; cada uma é atribuída ao veículo em que aparece. A notícia do resultado do MPF não cita as PETs nem Nicolao Dino, que vêm da convocação.'
