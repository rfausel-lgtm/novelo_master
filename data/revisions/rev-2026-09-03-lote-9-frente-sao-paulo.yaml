date: '2026-09-03'
summary: 'Lote 9: a frente de São Paulo. Entra o Termo de Colaboração 01/SMIT/2024, de R$ 108 milhões,
  entre a Secretaria Municipal de Inovação e Tecnologia e o Instituto Conhecer Brasil, para 5 mil pontos
  de wi-fi gratuito; a Operação Wi-Fi Livre da Polícia Civil (01/06/2026), com oito mandados que alcançaram
  o instituto, a Go Up Entertainment, endereços de Karina Ferreira da Gama e a sede da secretaria; a autorização
  do ministro Flávio Dino (24/08/2026) para a Polícia Federal acessar os dados; e as emendas de R$ 2 milhões
  atribuídas a Mário Frias, negadas pela defesa. O contraditório da empresária e o da prefeitura estão
  registrados.'
