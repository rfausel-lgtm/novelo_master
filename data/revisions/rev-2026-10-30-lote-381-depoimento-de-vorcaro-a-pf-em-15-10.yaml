title: "Lote 381 — Depoimento de Vorcaro à PF em 15/10/2026: falas atribuídas, nota da defesa e posição da PF"
summary: "Registra o depoimento de Daniel Vorcaro à PF em 15/10/2026 sobre as operações entre o Banco Master e
  o BRB, cujo vídeo de 2h28 foi divulgado pelo Poder360 em 29/10. As falas são alegações do investigado,
  atribuídas à CNN Brasil e ao Poder360, com a nota da defesa e, com o mesmo peso, a posição da PF
  (contestação da delegada e relatório parcial de 28/10, que indicia Vorcaro e Paulo Henrique Costa). Inclui a
  versão de Costa. Evento de classe A e vídeo sem termo oficial: status unverified."
