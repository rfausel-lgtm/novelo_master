title: 'Lote 189 — extinta a punibilidade de Mourão, mas o espólio segue no processo'
summary: 'Documento na faixa de pontuação mais baixa do acervo de 416 peças da PET 15.556: o e-Doc 322,
  decisão de 29/05/2026 que declara extinta a punibilidade de Luiz Phillipi Mourão por morte (art. 107, I,
  CP), com parecer favorável da PGR, e determina o arquivamento parcial das investigações quanto a ele.
  Detalhe até então ausente do corpus: as medidas de sequestro de bens contra ele permanecem vigentes, por
  se tratar de obrigação de reparação que se transmite aos herdeiros — a decisão determina que eles,
  diretamente ou pelo inventariante do espólio, ingressem nos autos para acompanhar as restrições
  patrimoniais.'
