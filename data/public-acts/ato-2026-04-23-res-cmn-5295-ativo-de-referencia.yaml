description: Resolução que altera os arts. 2º-A e 2º-B da Resolução CMN 4.222/2013 e inclui o Ativo de
  Referência entre os gatilhos da obrigação de a instituição associada ao FGC manter montante alocado em
  títulos públicos federais, com fatores escalonados de 1º de julho de 2026 a 1º de julho de 2028 e vigência,
  nos dispositivos alterados, a partir de 1º/6/2026, segundo o texto consolidado do BC. O texto original da
  resolução não foi aberto.
