title: "Resolução CMN 5.279: altera o estatuto e o regulamento do FGC"
act_type: regulatory
date: 2026-01-22
date_precision: day
issuer_id: conselho-monetario-nacional
issuer: Conselho Monetário Nacional
affected_ids:
  - fundo-garantidor-de-creditos
description: Resolução que altera o estatuto (Anexo I) e o regulamento (Anexo II) do Fundo Garantidor de
  Créditos, constantes da Resolução CMN 4.222/2013. O texto consolidado do BC marca como dela, entre outros,
  os dispositivos sobre operações subsidiadas do FGC, dever de informar o BC das tratativas de assistência,
  divulgação pública de relatórios por associada, compromisso de indenidade de administradores e regras de
  valor limite e provisão no pagamento da garantia. Marca também dispositivos do estatuto sobre composição,
  mandato, quórum e quarentena do Conselho de Administração e da Diretoria Executiva, gestão de fundos de
  investimentos de que o FGC seja cotista exclusivo e regras de contribuições. Número e data comprovados no texto consolidado; o texto
  original da resolução não foi aberto.
