description: Conversão da Medida Provisória nº 1.106/2022. Elevou o teto de comprometimento no consignado
  de 35% para 40% (CLT) e de 35% para 45% (RGPS) e autorizou empréstimos a beneficiários do BPC e de programas
  federais de transferência de renda. A representação da PF sustenta que a mudança ampliava o mercado
  potencial do crédito consignado, plataforma central do Banco Master e do produto CredCesta, e examina
  a Emenda nº 30 apresentada durante a tramitação.
