description: Termo de Colaboração de R$ 108 milhões (R$ 72 milhões em 2024 e R$ 36 milhões em 2025) para
  implantação, operação e manutenção de 5 mil pontos de wi-fi gratuito em comunidades periféricas, no
  programa WiFi Livre SP, ao custo mensal de R$ 1,8 mil por ponto. Precedido pelo Edital de Chamamento
  Público 01/SMIT/2024, publicado em 05/04/2024 (lido integralmente pela equipe editorial via republicação
  no SINESP), que exigia mínimo de 1.000 usuários simultâneos por comunidade, 100 Mbps de banda total
  e disponibilidade de 96%, com instalação prevista até 31/12/2024. O Instituto Conhecer Brasil foi o
  único participante do chamamento e não tinha experiência técnica prévia em comunicações. O TCM-SP identificou
  20 irregularidades no edital em abril de 2024 e recomendou a suspensão do processo; a SMIT ajustou cláusulas
  de LGPD, mas manteve o processo. O contrato original de R$ 108 milhões chegou a R$ 157,1 milhões por
  três aditivos. O termo de colaboração propriamente dito (a peça contratual final) não foi localizado
  publicamente pela equipe editorial; os termos registrados vêm do edital que o precedeu e da cobertura
  da operação policial de 01/06/2026.
