url: https://www.poder360.com.br/poder-justica/gilmar-quer-levar-ao-plenario-do-stf-caso-de-precatorios-de-vorcaro/
source_type: press
language: pt-BR
summary: >-
  Gilmar Mendes apresentou em 22/09/2026 questão de ordem para uniformizar as regras de indenização de usinas
  do setor sucroalcooleiro pela União, em análise do plenário "com todos os 10 ministros"; diz que o caso foi
  analisado pela 2ª Turma em 2025 e que venceu o voto de Nunes Marques, por 3 a 2; diz ter confirmado o teor da
  reportagem do Metrópoles sobre a "Turma do KN"; reproduz a íntegra da nota do gabinete de Nunes Marques; informa
  que buscou contato com a assessoria de Camila Ramos e de Newton Ramos, sem resposta até a publicação. Não
  numera o processo.
notes: >-
  O placar e a autoria do voto vencedor são do veículo; os andamentos oficiais do ARE 1.327.995 registram
  decisões "por maioria", "nos termos do voto do Relator" (Fachin), em 01/10/2024 e 03/06/2025. A nota de Nunes
  Marques reproduzida aqui descreve o julgamento como "um caso específico e delimitado", formulação diferente da
  nota publicada pelo Metrópoles em 21/09 ("por se tratar de tese ampla").
