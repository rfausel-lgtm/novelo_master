summary: Edição 2.166, ano 8. Traz, na página 103, o Decreto nº 253, de 04/10/2020, que acrescenta dispositivo
  reservando até 20% da base de descontos exclusivamente para o cartão do Programa Credicesta; e, nas
  páginas 105 a 112, o extrato e o texto do Convênio nº 005 entre o município e a PKL One Participações
  S.A., assinado em 21/08/2020 com vigência até 21/08/2025, para linha de crédito rotativo pelo programa,
  com teto de 20% da margem específica. Assina o prefeito Carlos Brasileiro. É o convênio municipal baiano
  mais antigo localizado nesta varredura.
