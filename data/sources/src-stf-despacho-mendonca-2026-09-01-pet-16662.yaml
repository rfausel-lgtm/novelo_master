summary: Despacho baixado e lido integralmente pela equipe, com código de autenticação do STF. Registra
  que a PET 16.662 nasceu do desentranhamento da PET 15.556, em observância ao art. 5º, I, do Regimento
  Interno; descreve o objeto como a identificação dos integrantes de suposta rede de influência e monitoramento;
  anuncia que o caminho dos autos leva ao Plenário, em sessão presencial e pública; e determina o levantamento
  do sigilo.
