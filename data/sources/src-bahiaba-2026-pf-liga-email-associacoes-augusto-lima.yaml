summary: 'Reportagem sobre o vínculo documental identificado pela PF: Asteba e Asseba registraram na Receita
  Federal o mesmo e-mail de contabilidade (''contabilidade@grupoterrafirme.com.br''), pertencente à Terra
  Firme da Bahia Ltda, de propriedade exclusiva de Augusto Lima; Asseba e a Terra Firme compartilham também
  o mesmo telefone de cadastro. A PF aponta Augusto Lima como procurador de ambas as associações perante
  instituições financeiras, com poderes para movimentar recursos — não como dirigente estatutário, cargo
  ocupado por Nanci Maria Prates Pereira (Asteba) e Maria Helena Santos Ferreira (Asseba).'
