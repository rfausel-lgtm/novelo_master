summary: 'Detalha o caso do Rio de Janeiro: Decreto nº 47.625, de 27/05/2021, cria margem adicional de
  20% exclusiva para cartão de benefício e viabiliza credenciar entidades não autorizadas pelo Banco Central;
  a autorização da Casa Civil à PKL One vem cinco dias depois, em 01/06/2021. Registra casos de servidores
  com até 99% da renda comprometida pelo empilhamento de margens, com exemplos nominais.'
