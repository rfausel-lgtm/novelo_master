summary: Por 19 votos a 12, a CPMI rejeitou o relatório na madrugada de 28/03, último dia de funcionamento.
  Com mais de 4 mil páginas, o texto concluía haver núcleos técnico, administrativo, financeiro, empresarial
  e político na movimentação de bilhões de reais por meio de descontos não autorizados de aposentadorias
  e pensões.
