source_type: press
summary: O contrato de consultoria jurídica entre o Lewandowski Advogados e o Master, de R$ 250 mil mensais,
  foi assinado em 28/08/2023 e os pagamentos seguiram até setembro de 2025, quando o ex-ministro já estava
  no Ministério da Justiça havia 21 meses. O contrato rendeu cerca de R$ 6,5 milhões brutos ao escritório,
  dos quais R$ 5,25 milhões após a ida dele para o ministério. Ele deixou a sociedade em 17/01/2024, que
  passou a ser representada por um filho. Segundo a coluna, a contratação atendeu a pedido do então líder
  do governo no Senado, que confirmou ter indicado Lewandowski, mas nega ter indicado Guido Mantega.
