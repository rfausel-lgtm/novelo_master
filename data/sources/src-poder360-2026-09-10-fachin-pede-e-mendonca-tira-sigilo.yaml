summary: Registra que André Mendonça, em cumprimento ao despacho de Fachin, retirou em 10/09/2026 o sigilo da PET
  15.556 e de mais 14 procedimentos relacionados — Inquéritos 5.026 e 5.035, Reclamação 88.121, e Petições 15.198,
  15.478, 15.504, 15.562, 15.563, 15.693, 15.976, 15.977, 15.978, 16.019 e 16.662 —, e que informou adotar as providências
  para enviar cópias integrais dos processos, em HD próprio, à presidência do STF e aos gabinetes dos demais ministros.
  O texto não esclarece se 'retirar o sigilo' significa acesso público irrestrito ou apenas disponibilização interna
  aos gabinetes.
