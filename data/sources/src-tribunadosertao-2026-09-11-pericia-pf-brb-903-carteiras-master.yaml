source_type: press
summary: Reportagem sobre o laudo pericial da PF de 13/08/2026, com sigilo levantado em 11/09/2026 por ordem do
  presidente do STF, Edson Fachin, dentro do material da Operação Compliance Zero. A perícia analisou aquisições
  de R$ 17,5 bilhões e concluiu que o BRB chegou a concentrar 90,3% de suas carteiras de crédito adquiridas de outras
  instituições no Banco Master, com pico de R$ 19,8 bilhões em junho de 2025; que o banco pagou R$ 7,6 bilhões em
  22 operações antes de concluir os ritos internos e laudos técnicos obrigatórios (43,41% do total desembolsado
  em aquisições de varejo); e caracteriza a gestão da diretoria do BRB à época, presidida por Paulo Henrique Costa,
  hoje preso, como 'gestão fraudulenta', com manipulação de procedimentos de governança e formalização retroativa
  de controles.
