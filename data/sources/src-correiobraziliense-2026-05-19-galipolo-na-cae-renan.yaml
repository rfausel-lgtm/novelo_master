summary: 'Registra a audiência de Gabriel Galípolo na Comissão de Assuntos Econômicos do Senado em 19/05/2026,
  em que o presidente da comissão, Renan Calheiros, sustentou que ele teria defendido a venda do Master
  ao BRB e intercedido para que o FGC socorresse o banco com R$ 11 bilhões, citando correspondência do
  BC de 18/04/2025. Resposta literal de Galípolo: ''A informação está errada. Não há nenhuma carta com
  valor de R$ 11 bilhões, o Banco Central jamais tentou viabilizar a venda.'' E: ''O Banco Central não
  tem que reagir a pressão. A minha posição é não reagir a pressão.'''
