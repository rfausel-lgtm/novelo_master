summary: Segundo documentos da organização do evento encaminhados pela PF à CPMI do INSS, em 25/04/2024
  houve degustação de uísque Macallan no George Club, em Londres, com custo de US$ 640.831,88 pago por
  Vorcaro, durante o 1º Fórum Jurídico Brasil de Ideias (24 a 26/04/2024), patrocinado pelo Banco Master;
  entre cerca de 40 participantes estavam Alexandre de Moraes, Andrei Rodrigues, Benedito Gonçalves (STJ),
  Ciro Soares, Daniel Vorcaro e Dias Toffoli.
