summary: Com base em material da própria PF encaminhado à CPMI do INSS, registra a degustação de uísque
  Macallan com charutos no George Club, em Mayfair, em 25/04/2024, custeada por Vorcaro ao custo documentado
  de US$ 640.831,88, com cerca de 40 presentes — entre eles Alexandre de Moraes, Dias Toffoli, Paulo Gonet,
  Ricardo Lewandowski, Hugo Motta, Benedito Gonçalves e Andrei Rodrigues. O circuito completo de Londres
  teria custado US$ 6.035.922,37. Moraes e Rodrigues foram procurados e não responderam.
