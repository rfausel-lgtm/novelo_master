source_type: official_court
summary: O ministro Dias Toffoli, então relator, determinou nova busca e apreensão em endereços ligados
  a Daniel Vorcaro, decretou a prisão temporária de Fabiano Campos Zettel (cunhado de Vorcaro) e deferiu
  busca pessoal no empresário Nelson Tanure; expediu carta de ordem à 8ª Vara Criminal Federal de São
  Paulo para sequestro e bloqueio de bens requeridos pela PGR.
