source_type: press
summary: 'Decisão monocrática de Flávio Dino (STF), 17/08/2026, no chamado ''Caso Tech Office'': afasta
  cautelarmente por 180 dias Daniel Itapary Brandão, presidente do TCE-MA e sobrinho do governador Carlos
  Brandão (MDB), a pedido da PF, por suspeita de desvio de recursos públicos (emendas parlamentares, verbas
  de educação), corrupção e obstrução da apuração do homicídio de um empresário morto a tiros em 2022
  no prédio Tech Office, em São Luís (MA), suspeito de ter discutido divisão de propina de contratos públicos.
  Decisão conjunta com as Pets 15.437 e 16.356/DF, sobre fatos teoricamente conexos, com indícios de obstrução
  em junho/2026 envolvendo parlamentar com foro no STF — o senador Weverton Rocha (PDT-MA), que nega qualquer
  interferência.'
