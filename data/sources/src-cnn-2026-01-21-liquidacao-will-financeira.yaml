summary: Em 21/01/2026 o BC decretou a liquidação extrajudicial da Will Financeira S.A. CFI, controlada
  pelo Banco Master, por comprometimento econômico-financeiro, insolvência e vínculo de interesse com
  o Master (já liquidado); nomeou Eduardo Bianchini liquidante e decretou indisponibilidade de bens de
  controladores e ex-administradores. A defesa de Vorcaro disse que a instituição tinha administração
  apartada.
