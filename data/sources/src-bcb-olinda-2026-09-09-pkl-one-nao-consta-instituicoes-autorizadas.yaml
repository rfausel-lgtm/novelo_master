summary: 'Consulta direta da equipe à base pública do Banco Central, em 09/09/2026, por CNPJ e por razão
  social. As buscas pelo CNPJ 27.490.629 e pelos termos ''PKL'' e ''CREDCESTA'' retornaram conjunto vazio
  em todas as tabelas — sociedades, bancos comerciais e múltiplos, cooperativas e consórcios. Controle
  metodológico aplicado: a mesma consulta com o termo ''BRADESCO'' retorna registros, confirmando a validade
  do método. A operadora do CredCesta não consta, portanto, da relação oficial de instituições autorizadas
  a funcionar pelo Banco Central.'
