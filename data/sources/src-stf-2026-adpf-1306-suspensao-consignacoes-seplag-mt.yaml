summary: 'Arguição de descumprimento de preceito fundamental (número único 0164434-09.2026.1.00.0000)
  proposta pela Associação Brasileira de Bancos contra decisões administrativas da Secretaria de Planejamento
  e Gestão de Mato Grosso que suspenderam por 120 dias as consignações de cartão de crédito e cartão de
  benefício e os respectivos repasses. Relator: ministro André Mendonça. Julgada procedente por unanimidade
  na mesma sessão virtual da ADI 7900, encerrada em 28/04/2026, com acórdão publicado em 08/05/2026 e
  trânsito em julgado em 18/05/2026. O Supremo oficiou o presidente do Banco Central com cópia da certidão
  de julgamento.'
