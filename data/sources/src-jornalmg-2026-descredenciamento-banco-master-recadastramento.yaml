summary: Dois atos da Superintendência Central de Administração de Pessoal da Secretaria de Planejamento
  e Gestão, lidos pela equipe. Em 23/01/2026, p. 36, instaura-se o processo administrativo SEI nº 1500.01.0002247/2026-84
  'para o descredenciamento da entidade Banco Master S.A., Código 302, CNPJ 33.923.798/0001-00, por falta
  de recadastramento', com intimação e prazo de dez dias; assina Mariana Márcia Custódio. Em 10/02/2026,
  p. 1090, o processo é concluído com o descredenciamento, 'por não apresentar documentação para o recadastramento'.
  O fundamento é estritamente administrativo — omissão em recadastrar —, não uma apuração sobre o produto
  ou o credenciamento.
