summary: 'Consulta direta ao cadastro da sociedade de advogados Alves Corrêa & Veríssimo Advocacia, de Brasília:
  início de atividade em 14/06/2016, matriz sem filial, capital social de R$ 500 mil, atividade de serviços advocatícios,
  situação ATIVA desde a abertura. Dalide Barbosa Alves Corrêa é sócia-administradora desde 14/06/2016 e David Veríssimo
  de Souza entrou no quadro como sócio com capital em 18/06/2019 — três anos depois de seu sobrenome já constar
  da razão social.'
