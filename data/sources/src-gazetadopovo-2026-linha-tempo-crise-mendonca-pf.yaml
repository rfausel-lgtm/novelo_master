summary: 'Reconstrói a origem do atrito: em fevereiro de 2026, ao assumir a relatoria da Compliance Zero,
  Mendonça restringiu o acesso aos dados do inquérito a policiais diretamente envolvidos — lido pela cúpula
  da PF como tentativa de reduzir a autoridade de Andrei Rodrigues. A escalada veio com determinações
  de Mendonça na Sem Desconto: remessa imediata de toda documentação ao seu gabinete, notificação prévia
  para qualquer troca de policial na equipe, e envio de extrações de dados brutos ao STF durante o inquérito
  em curso. A PF recorreu à AGU, que optou por buscar diálogo em vez de embate jurídico direto. O atrito
  seguia sem resolução até setembro de 2026, quando se fundiu à crise mais ampla do caso Master (vazamento
  das mensagens Vorcaro-Moraes e pedido de prisão do Novo contra Andrei Rodrigues, já registrados no corpus).'
