summary: 'Revela o conteúdo de uma terceira proposta de colaboração premiada apresentada por Daniel Vorcaro, ainda
  não aceita pela Polícia Federal nem pela PGR. Segundo o banqueiro, ACM Neto e Antônio Rueda, dirigentes do União
  Brasil, intermediaram a entrada de recursos de institutos de previdência do Rio de Janeiro, do Amapá e do Amazonas
  no Banco Master, em troca de comissão equivalente a 10% dos valores aplicados — ou, alternativamente, 1% ao ano
  enquanto o dinheiro permanecesse investido. A articulação teria captado cerca de R$ 2 bilhões, o que, pela alíquota
  de 10%, geraria obrigação de aproximadamente R$ 200 milhões; o documento não informa quanto teria sido efetivamente
  pago. Vorcaro atribui a ACM Neto quatro modalidades de repasse — pagamentos em espécie e contratos de consultoria
  via A&M Consultoria e B6 Capital — e a Rueda dinheiro em espécie e contratos com o escritório Rueda & Rueda Advogados,
  que somados poderiam chegar a R$ 3 milhões mensais. A reportagem confronta o relato com números já conhecidos:
  as quatro instituições citadas somam cerca de R$ 3,62 bilhões investidos no Master — Rioprevidência R$ 2,97 bilhões
  (2023-2025), Amprev R$ 400 milhões, Cedae R$ 200 milhões e Amazonprev R$ 50 milhões —, mais que o dobro dos R$
  2 bilhões que Vorcaro atribui à atuação dos dois políticos, sem que a proposta explique a diferença. A quebra
  de sigilo do Master já havia identificado R$ 6,4 milhões a escritórios ligados a Rueda (2022-2025) e R$ 5,4 milhões
  à consultoria de ACM Neto (2023-2025).'
