summary: O Havengate Development Fund LP, que recebeu ao menos US$ 10,6 milhões de empresas ligadas a
  Vorcaro (via Entre Investimentos e Participações) para financiar 'Dark Horse', foi criado para um projeto
  imobiliário no Texas que nunca saiu do papel, segundo registros oficiais checados pelo Intercept.
