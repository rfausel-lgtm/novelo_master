summary: 'Registra racha interno no Ministério Público Federal: uma ala entende que ''há menções suficientes
  no relatório da PF para gerar dúvidas e, portanto, o melhor seria Gonet se afastar do processo'', por
  prudência e para prevenir alegações de conflito; outra sustenta que ele foi envolvido em crise que não
  é dele, sem indícios de má conduta. A cúpula avalia que não existe, até o momento, nada capaz de torná-lo
  alvo de investigação.'
