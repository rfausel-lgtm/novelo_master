summary: >-
  Atribui a informação ao UOL, que a publicou primeiro, e diz tê-la confirmado "com fontes a par da
  investigação". Registra que as assessorias de Motta e de Ciro disseram que "os parlamentares não vão se
  pronunciar", que a defesa de Fábio Faria não foi encontrada e que a defesa de Vorcaro foi procurada.
