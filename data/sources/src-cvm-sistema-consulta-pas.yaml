summary: 'Sistema oficial de consulta a PAS. Para o processo 19957.008699/2019-01, informa como objeto
  a ''apuração de eventuais irregularidades na atuação da INVISTA INVESTIMENTOS INTELIGENTES, bem como
  na administração e gestão de fundos de investimentos que tinham entre seus cotistas Regimes Próprios
  de Previdência Social (RPPS)'', e lista os 29 acusados — 20 pessoas naturais e 9 jurídicas. O sistema
  exibe a razão social atual das pessoas jurídicas: a antiga Foco DTVM, depois Índigo Investimentos, aparece
  como Sefer Investimentos Distribuidora de Títulos e Valores Mobiliários Ltda.'
