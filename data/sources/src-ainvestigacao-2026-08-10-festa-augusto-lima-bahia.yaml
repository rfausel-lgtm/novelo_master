summary: Descreve André Kruschewsky Lima como ex-diretor jurídico do Master, primo de Eugênio e Luiá Kruschewsky
  e retirado em abril de 2024 dos registros da estrutura americana do banco. Apresenta Matheus Kruschewsky Silva
  como gerente comercial do Banco Master e "familiar" de André, registrando que Matheus e a mãe foram representados
  por André em ação judicial de 2010, sem precisar o grau de parentesco.
