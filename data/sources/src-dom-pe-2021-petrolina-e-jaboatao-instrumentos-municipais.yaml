summary: Duas edições lidas pela equipe. Em 27/05/2021, Jaboatão dos Guararapes publica instrumento em que a operadora
  figura como organização parceira, para desconto em folha de servidores ativos, aposentados e pensionistas da administração
  direta e indireta, sem ônus para o município, com vigência declarada de 24/05/2021 a 24/05/2023. Em 30/12/2021,
  Petrolina publica o aviso do Termo de Convênio nº 002/2021, para operacionalização sem exclusividade da concessão
  aos servidores estatutários ativos do município — e identifica a operadora por um cadastro nacional que pertence
  a outra pessoa jurídica.
notes: O número impresso em Petrolina, 05.196.530/0001-70, corresponde na base pública da Receita Federal ao município
  de Tomé-Açu, no Pará. A edição de Jaboatão está em https://data.queridodiario.ok.org.br/2607901/2021-05-27/81facaac8416815272c01e202a5b9e7d41d96d2f.pdf.
