summary: Decisão que defere pedido de tutela incidental/habeas corpus preventivo em favor de José Eugênio
  e José Carlos Dias Toffoli, dispensando-os de comparecimento obrigatório à CPI do Crime Organizado por
  figurarem como investigados no INQ 5.026 — os Requerimentos 140/2026 e 161/2026 (José Eugênio) e
  143/2026 e 160/2026 (José Carlos) motivaram a convocação. Serve como salvo-conduto, com base no art. 5º,
  LXVIII, CF c/c art. 77-D do RISTF.
notes: 'Peça pública do portal do STF (Resolução 427/2010), obtida em sessão anterior via
