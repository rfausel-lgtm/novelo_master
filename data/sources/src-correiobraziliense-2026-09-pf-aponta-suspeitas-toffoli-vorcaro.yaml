url: https://www.correiobraziliense.com.br/politica/2026/09/7498370-pf-aponta-suspeitas-de-relacao-e-repasses-entre-toffoli-e-vorcaro.html
source_type: press
summary: 'Descreve, no mesmo texto, a Informação de Polícia Judiciária de Análise nº 893171/2026 e um relatório sigiloso da
  PF "de quase duzentas páginas", elaborado a partir do celular de Daniel Vorcaro, assinado por quatro delegados e
  enviado ao STF sete meses antes. Segundo a reportagem, o documento levanta a hipótese de Dias Toffoli ser "beneficiário
  final" ou "proprietário de fato" do FIP Arleen, que recebeu ao menos R$ 35 milhões de Vorcaro e teve ativos
  transferidos a holding nas Ilhas Virgens Britânicas; registra ao menos 12 encontros presenciais entre o ministro e o
  banqueiro entre o fim de 2023 e o início de 2025 e 167 ligações por aplicativo entre os aparelhos; e diz que os
  ministros do STF que o analisaram decidiram arquivá-lo.'
notes: A mesma matéria foi republicada pelo Diario de Pernambuco. A data de publicação foi inferida pela cobertura do dia.
