summary: 'Nota oficial de 29/01/2026: Toffoli foi sorteado relator da Compliance Zero em 28/11/2025; em
  03/12/2025 determinou a remessa do processo ao STF mantendo cautelares e sigilo; em 15/12/2025 determinou
  oitivas dos principais investigados e de dirigentes do BC; em 30/12/2025 houve oitivas e acareação entre
  Daniel Vorcaro e Paulo Henrique Costa; a reclamação foi julgada parcialmente procedente para reconhecer
  a competência do STF.'
