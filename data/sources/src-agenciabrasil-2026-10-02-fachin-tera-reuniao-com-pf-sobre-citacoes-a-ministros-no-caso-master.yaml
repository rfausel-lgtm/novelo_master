summary: >-
  Publicada em 02/10/2026, às 16:13. Segundo a agência, Edson Fachin enviou ofício à Polícia Federal na sexta-feira
  (02/10) afirmando que, recebidas as informações, "sem exceção de pessoa, os fatos correlatos, serão dados os
  encaminhamentos devidos", e a reunião com o diretor-geral deve ocorrer em 13/10. A matéria não informa o número
  do ofício.
