source_type: press
language: pt-BR
summary: "Reportagem sobre a ação que a EFB Regimes Especiais de Empresas, liquidante do Banco Master,
  apresentou na quarta-feira, 07/10/2026, ao Tribunal de Falências do Distrito Sul da Flórida contra a Clear
  River Properties e a Goldbeach Properties, empresas de Delaware que aparecem como titulares de três imóveis
  em Aspen e Miami. Descreve os valores e as datas das compras, o caminho que o liquidante atribui aos
  recursos (incluindo o Mosaic Short Duration Fund, nas Bahamas) e os pedidos: reconhecimento dos imóveis como
  patrimônio do Master em liquidação ou, alternativamente, restituição de ao menos US$ 77 milhões (Clear
  River) e US$ 92,5 milhões (Goldbeach), bloqueio da venda e nomeação de administrador judicial. Informa que
  Vorcaro não é réu direto e atribui parte das informações à Folha de S.Paulo. O título usa a conversão em
  reais, que o Novelo não adota."
notes: Aberta em 16/10/2026 com lote:fonte. O corpo atribui ao liquidante a tese de recursos desviados do
  Master; o Novelo registra apenas que é a tese do liquidante. A reportagem não traz número do processo nem
  manifestação dos réus ou do liquidante. A marca de atualização da página ("há uma semana") não altera a data
  de publicação.
