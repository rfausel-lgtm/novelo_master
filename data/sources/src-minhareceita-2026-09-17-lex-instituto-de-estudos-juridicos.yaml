summary: 'Consulta direta ao cadastro do LEX – Instituto de Estudos Jurídicos Ltda., de São Paulo: aberto em 01/06/2000,
  capital social de R$ 5 milhões, atividade de treinamento em desenvolvimento profissional e gerencial, situação
  ativa. O quadro societário tem Viviane Barci de Moraes como sócia-administradora desde a constituição e três sócios
  desde 20/12/2013 — Alexandre Barci de Moraes, Gabriela Barci de Moraes e Giuliana Barci de Moraes, filhos do casal.
  O ministro Alexandre de Moraes não integra o quadro.'
