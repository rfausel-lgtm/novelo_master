summary: Luiz Phillipi Machado de Moraes Mourão teve morte cerebral em 04/03/2026, horas depois de ser
  preso na 3ª fase da Compliance Zero, sob custódia na Superintendência da PF em Belo Horizonte. Em nota,
  a PF informou que ele havia tentado se matar, que policiais tentaram reanimá-lo e acionaram o Samu,
  e que comunicaria o fato ao gabinete do relator no STF, entregaria os registros em vídeo e abriria procedimento
  apuratório. A corporação não detalhou em que circunstâncias foi encontrado. Segundo as investigações,
  ele integraria o 'núcleo de intimidação' de adversários do fundador do Banco Master.
