source_type: press
summary: 'Gilmar Mendes, decano do STF, manifesta publicamente "sérias dúvidas" de que a Pet 16.662 esteja em
  condições de julgamento na sessão extraordinária de 15/09/2026: "A rigor, na Pet 16.662, não há nem
  sequer pedido a ser decidido." Aponta como indefinidos quem é investigado, o objeto da investigação e o
  rito processual a seguir, com risco de a sessão virar discussão desordenada sobre fatos diversos. Propõe
  que Fachin reúna os procedimentos relacionados, assuma a coordenação, e só depois leve o caso ao Plenário.
  Pede também igualdade de condições para a PGR na sessão, caso ela ocorra.'
