summary: 'Publicado na edição nº 28.493, páginas 4 e 5, e lido integralmente pela equipe. Altera o Decreto
  691/2016 em quatro pontos decisivos: cria margem de até 10% para cartão consignado de benefício e estabelece
  que as margens ''são independentes, de forma que não concorrem entre si'', invertendo a regra anterior;
  substitui o teto de vigência de convênios, que era de 24 meses, por remissão à Lei 14.133/2021, viabilizando
  prazos maiores; reposiciona o cartão de benefício no inciso XI do art. 6º, que o art. 15, §1º dispensa
  de autorização expressa do governador; e cria a figura da instituição financeira que intermedeia cartão
  de benefício para ''empresas de meios de pagamentos''. Assinam Mauro Mendes, o secretário-chefe da Casa
  Civil e o secretário de Planejamento e Gestão — este último o mesmo que assinaria o convênio com o Banco
  Master 25 dias depois.'
