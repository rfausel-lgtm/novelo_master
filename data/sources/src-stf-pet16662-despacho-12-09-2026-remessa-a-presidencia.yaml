summary: 'Mendonça relembra que a PET 16.662 foi criada para dar tratamento autônomo à IPJ-A nº 3298613/2026, por
  identificar pessoa que atrai o art. 5º, I, do Regimento Interno (competência do Plenário), e que em 06/09/2026
  liberou o feito para julgamento pelo Plenário. Transcreve o item IV da decisão do presidente na Pet 16.704, de
  09/09/2026, que suspendeu "todo e qualquer procedimento que verse sobre potencial investigação em face de
  integrantes deste Supremo Tribunal Federal", com remessa preliminar à Presidência, e, em cumprimento a ela,
  encaminha os autos à Presidência.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). Despacho de duas páginas, datado do mesmo dia da coleta.'
