summary: Ao levantar o sigilo, o relator requisitou ao presidente do STF, Edson Fachin, uma sessão pública
  do plenário para que as menções a Alexandre de Moraes, a Paulo Gonet e ao diretor-geral da PF sejam
  analisadas por todos os ministros, 'instância soberana para analisar, de modo técnico e estritamente
  jurídico, os novos elementos trazidos pela autoridade policial'. A sessão ainda não foi pautada.
