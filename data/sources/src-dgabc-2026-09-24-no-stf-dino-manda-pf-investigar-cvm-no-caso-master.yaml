summary: Noticia a decisão de 24/09/2026 na ADI 7.791; reproduz que, segundo a decisão, a denúncia encaminhada
  pelo FGC em 2022 foi classificada como "denúncia anônima desprovida de elementos suficientes para justificar
  o prosseguimento da apuração"; e registra a decisão de 20/09 sobre avaliação técnica do arcabouço da CVM em
  90 dias.
