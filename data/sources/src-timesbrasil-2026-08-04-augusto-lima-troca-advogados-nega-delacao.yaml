source_type: press
summary: 'Após rumor do Metrópoles de que Lima teria manifestado desejo de mudar de estratégia e falar
  sobre a investigação, os advogados Ticiano Figueiredo, Pedro Ivo Velloso e equipe renunciaram à defesa.
  A nova defesa declarou: ''A defesa constituída repudia de forma veemente qualquer ilação acerca de eventual
  delação e segue confiante que a inocência de Augusto Lima ficará provada no curso da investigação.'''
