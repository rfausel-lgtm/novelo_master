source_type: press
language: pt-BR
summary: 'Relata a petição enviada pela defesa de Vorcaro ao presidente do STF, Edson Fachin, na sexta-feira
  (16/10/2026), com trechos literais atribuídos à peça: pedido de investigação criminal ampla dos responsáveis
  pela divulgação de mensagens, "agentes públicos" ou "terceiros"; queixa de divulgação de conversas com
  advogados, que violaria o sigilo advogado-cliente; queixa de "espetacularização midiática"; e alegação de
  que as mensagens seriam "imprestáveis" para responsabilizá-lo.'
notes: Aberta com lote:fonte em 19/10/2026 (17/10, 12:20). Repórter de Judiciário em Brasília; os trechos
  literais citados são diferentes dos da Agência Brasil, o que indica leitura da peça. O título da aba do
  navegador é mais curto (sem a expressão sobre nulidade); usado o título exibido na matéria. A página
  trata também de outros assuntos, que o Novelo não registra.
