summary: Voto da diretora relatora (Reg. Col. 3543/26, 6 páginas, datado de 29/09/2026) no PAS contra João
  Carlos Falbo Mansur e Rodolfo Turelli, diretor presidente e diretor financeiro da REAG Capital Holding S.A.
  Rito simplificado; termo de acusação da SEP de 08/09/2025; defesa conjunta; proposta de termo de compromisso
  de 02/02/2026, rejeitada pelo Colegiado em 26/05/2026. Conclui pela responsabilização por não fazerem
  elaborar as demonstrações financeiras de 2024 e os ITR do 1º e 2º trimestres de 2025; registra que parte dos
  documentos foi elaborada depois, fora do prazo e sem disponibilização no sistema da CVM; fixa pena-base de
  R$ 100.000,00 por infração, atenuante de 15% por bons antecedentes e multa individual de R$ 170.000,00.
notes: Anexo à nota de 02/10/2026. Aberta em 16/10/2026 com lote:fonte; o texto foi reextraído com pdftotext
