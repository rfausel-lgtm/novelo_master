summary: Segundo integrantes do banco ouvidos pela coluna, o Master contratou Guido Mantega (R$ 1 milhão/mês,
  ao menos R$ 16 milhões, jul–nov/2025) a pedido de Jaques Wagner; a relação mais próxima de Wagner no
  Master era com Augusto Lima, amigo de Rui Costa. A assessoria de Wagner negou participação na contratação
  de Mantega.
