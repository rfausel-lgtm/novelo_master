summary: 'Cobertura independente da mesma decisão. Reproduz a justificativa: ''A presente medida decorre
  da necessidade de estabelecer segurança jurídica e adequada delimitação institucional''. Acrescenta
  que Fachin comunicou que, após análise, enviará os autos ''à autoridade policial e à Procuradoria-Geral
  da República (PGR) para oferecimento da denúncia ou requerimento do arquivamento'', sem prazo definido.
  Reconstitui a origem do conflito: Mendonça retirou o sigilo de documentos da investigação do Banco Master
  em 1º de setembro, material da Polícia Federal que trazia ''mensagens trocadas entre Moraes e o banqueiro
  Daniel Vorcaro, encontros e negociações envolvendo a instituição financeira''; em resposta, Moraes encaminhou
  a Fachin relatórios apontando ''possíveis irregularidades na atuação de Mendonça'' nos processos do
  Banco Master e do INSS.'
