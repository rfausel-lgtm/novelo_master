summary: 'Ano VII, edição nº 01287, caderno 1, páginas 18 a 21. Dispõe sobre as consignações em folha
  do município e fixa teto de 70% da remuneração bruta, repartido em três faixas, das quais a segunda
  destina ''trinta por cento da remuneração bruta do servidor exclusivamente para operações de crédito
  realizadas através do Cartão do Programa Credicesta''. Assinam o prefeito e o secretário municipal de
  Governo. Nota técnica registrada pela apuração: as páginas usam fonte com codificação deslocada, de
  modo que a extração comum devolve texto ilegível e perde os algarismos; o conteúdo foi recuperado por
  decodificação inversa, e o número e a data do decreto foram tomados do sumário da mesma edição, que
  os grafa por extenso. Por isso descreve-se a posição do dispositivo sem cravar o número do artigo.'
