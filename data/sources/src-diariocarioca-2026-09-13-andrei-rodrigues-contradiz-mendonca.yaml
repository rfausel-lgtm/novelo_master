source_type: press
summary: 'O diretor-geral da PF, Andrei Rodrigues, afirmou que "o gabinete do ministro André Mendonça pediu
  uma cópia dos dados extraídos do celular" de Daniel Vorcaro, e que "o pedido foi atendido em 8 de março de
  2026". Essa versão contradiz diretamente a de Mendonça, que relatou que "a própria Polícia Federal entregou
  voluntariamente um envelope lacrado contendo uma cópia de segurança dos dados" — ou seja, por iniciativa da
  PF, não a pedido de seu gabinete. A contradição sobre quem tomou a iniciativa permanecia em aberto na
  véspera da sessão do STF de 15/09/2026.'
notes: Verificado por WebFetch direto. Contradição relevante para a disputa mais ampla sobre a custódia da
  cópia (já documentada no acervo desde o lote 280) — vai à essência de se Mendonça buscou proativamente o
  material ou apenas o recebeu passivamente.
