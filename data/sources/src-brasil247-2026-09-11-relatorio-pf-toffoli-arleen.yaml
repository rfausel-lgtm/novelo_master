source_type: press
summary: 'Repercute reportagem da revista piauí sobre relatório da Polícia Federal entregue ao STF, identificado como
  Informação de Polícia Judiciária de Análise nº 893171/2026, com mais de 80 páginas e baseado no celular apreendido de
  Daniel Vorcaro. Segundo o texto, a PF levanta a hipótese de que Dias Toffoli seria "beneficiário final" ou
  "proprietário de fato" do FIP Arleen, que recebeu R$ 35 milhões de Vorcaro e transferiu cerca de R$ 34 milhões à
  holding Egide I, nas Ilhas Virgens Britânicas, e registra que a PF pede "aprofundamento analítico". Traz nota do
  gabinete de Toffoli: ele "jamais manteve ou teve direta ou indiretamente recursos no exterior" e "jamais realizou
  qualquer operação direta ou indiretamente nas Ilhas Virgens Britânicas".'
notes: 'A reportagem original da piauí (10/09/2026) não foi lida diretamente. O número de páginas diverge entre os
  veículos (mais de 80 aqui; 196 no NC News), o que pode indicar mais de um relatório.'
