summary: 'Nota da publisher Manuela Carta sobre a reportagem do UOL de 15/10/2026: o Banco Master fechou
  contrato de publicidade com a editora em 2021 e anunciou na revista até 2023, num "contrato regular de
  veiculação de anúncio"; o grupo voltou a anunciar por meio da Kovr e do Will; e Daniel Vorcaro nunca a
  procurou para pedir notícias positivas ou interferir em conteúdo jornalístico, dada a separação entre a
  área comercial e a redação.'
