summary: 'Cobertura do julgamento da CVM de 25/11/2025 sobre o CARE11, com os valores das multas aos irmãos
  Schumann e a absolvição da Cortel. Registra que o Ministério Público de Contas de Minas Gerais apura se os
  regimes próprios de previdência de Extrema, Guanhães, Paraguaçu, São João del-Rei e Três Pontas aplicaram
  recursos de forma temerária no fundo, que teria perdido 78% do valor de mercado desde o lançamento sem
  distribuir rendimentos. Não menciona Banco Master, Vorcaro ou Vicente Conte Neto.'
