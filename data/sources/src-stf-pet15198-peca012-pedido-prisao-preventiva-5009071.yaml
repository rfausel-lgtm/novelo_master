summary: Traslado quase completo do Pedido de Prisão Preventiva n. 5009071-26.2025.4.03.6181, distribuído
  em 21/10/2025 e incidental ao IPL 5004641-31.2025.4.03.6181, representando pela prisão preventiva (ou,
  alternativamente, temporária) de Daniel Bueno Vorcaro, com pedidos cumulativos de busca e apreensão (38
  endereços) e quebra de sigilo bancário/fiscal (101 pessoas e entidades). Contém a manifestação do MPF de
  27/10/2025 encampando o pedido, a decisão do juiz Décio Gabriel Gimenez de 24/11/2025 (que não julga o
  mérito e determina diligências de esclarecimento) e a decisão de 05/12/2025 que suspende a apreciação do
  pedido por determinação do STF na Rcl 88.121, até a manifestação final do MPF de 23/12/2025 pedindo
  remessa vinculada à PET 15.198.
notes: 'Peça 12 de 50 obtidas por Rafael via certificado digital no peticionamento eletrônico do STF (pasta
  local "Pet 15198-1_50") — mesma política de divulgação já aplicada às demais peças obtidas por
  certificado. Arquivo de 4.676 páginas; cobertura por equipe de investigação dedicada, com varredura
  dirigida (não leitura linear integral) por marcos estruturais. Rodapé de impressão com CPF de quem baixou
  o documento nunca reproduzido no acervo.'
