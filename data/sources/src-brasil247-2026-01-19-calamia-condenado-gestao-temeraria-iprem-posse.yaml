summary: Registra que a Justiça Federal em São Paulo (juiz Rubens Petrucci Junior) condenou, em 19/01/2026, Renan
  Foglia Calamia — CEO da Crédito e Mercado, então chamada PAR Engenharia Financeira — a dois anos de prisão em
  regime aberto (convertidos em prestação de serviços comunitários e multa de oito salários mínimos) por gestão
  temerária, referente à recomendação, em 2017, de aplicação de R$ 1,5 milhão do Iprem de Santo Antônio de Posse
  no fundo multimercado Horus Vetor, incompatível com as regras de RPPS. No mesmo julgamento, foi absolvido de acusação
  de causar prejuízo de R$ 5,1 milhões ao instituto em outros investimentos, conforme laudo da PF. A reportagem
  liga explicitamente o caso à atuação posterior da mesma consultoria, que veio a assessorar sete dos dezoito institutos
  que investiram R$ 1,8 bilhão no Banco Master.
