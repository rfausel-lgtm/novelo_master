summary: Reproduz apuração da Folha de S.Paulo segundo a qual o banco, ainda chamado Máxima, remeteu US$
  531 milhões entre dezembro de 2018 e abril de 2021 à One World Services, empresa investigada na Operação
  Colossus. Registra que a PF aponta oito instituições financeiras que teriam, de forma deliberada, fechado
  os olhos para a realidade de seus clientes, e traz a nota do banco Genial sobre seus controles.
