source_type: press
summary: Com base em documento apreendido pela PF, relata que na reunião de 04/12/2024 Vorcaro teria perguntado
  se devia aceitar oferta do BTG para comprar o banco por R$ 1, dizendo querer 'reduzir a concentração
  bancária do Brasil', e que Lula teria criticado Roberto Campos Neto e André Esteves e aconselhado o
  banqueiro a não vender. Nem o Planalto, nem o Banco Central, nem a defesa de Vorcaro se manifestaram
  sobre o conteúdo.
