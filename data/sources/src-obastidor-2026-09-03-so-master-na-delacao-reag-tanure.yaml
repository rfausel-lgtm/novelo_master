summary: Menciona, como contexto biográfico e não como conteúdo dos 17 anexos da delação de João Carlos
  Mansur, que a Reag (empresa de Mansur) 'prestou serviços' a Nelson Tanure e que 'empresas dele foram
  beneficiadas por fundos controlados pela gestora de Mansur' — relação comercial anterior mencionada
  de passagem pelo veículo, não atribuída aos anexos da colaboração premiada.
