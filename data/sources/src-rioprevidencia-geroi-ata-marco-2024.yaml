summary: Ata de 32 páginas, baixada e lida pela equipe. É a única, entre toda a série de atas do Comitê
  de Investimentos do Rioprevidência de 2023 e 2024 examinadas pela equipe, em que o nome do Banco Master
  aparece explicitamente — na tabela de demonstrativo de carteiras, com posição referente a 29/02/2024,
  no valor de R$ 123.265.936 em letra financeira. Nos meses anteriores e posteriores, a mesma linha aparece
  apenas como 'LETRA FINANCEIRA IPCA + X%', sem identificar o emissor.
