summary: 'Mendonça determinou o arquivamento e a publicização das peças da Pet 16.210, destacando coincidência
  que trata como possível indício de vazamento: ''Trata-se de solicitação de audiência, por parte de um
  dos investigados, recebida pelo meu gabinete [...] no mesmo dia em que aportaram as representações da
  Polícia Federal''.'
