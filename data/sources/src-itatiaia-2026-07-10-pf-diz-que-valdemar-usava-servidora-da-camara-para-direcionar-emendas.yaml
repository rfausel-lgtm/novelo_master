summary: Identifica Nara Benedetti Nicolau Brum como servidora efetiva lotada na liderança do PL na Câmara,
  apontada pela PF na decisão do ministro Flávio Dino; registra que a assessoria do PL foi procurada e não
  respondeu. Não traz manifestação dela. Usada para o cargo (atribuído) e o contraditório.
notes: O verbo "usava" é da manchete, em relato da PF; o Novelo não o adota em texto próprio.
