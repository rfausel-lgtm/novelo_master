title: Galípolo confirma intimação da PF para depor em outubro sobre Master
publisher: Agência Estado (republicado pelo O Povo)
publication_date: '2026-09-24'
url: https://www.opovo.com.br/noticias/economia/2026/09/24/galipolo-confirma-intimacao-da-pf-para-depor-em-outubro-sobre-master.html
source_type: wire
language: pt-BR
summary: >-
  Segundo a matéria, na coletiva de imprensa sobre o Relatório de Política Monetária do terceiro trimestre,
  em 24/09/2026, o presidente do Banco Central, Gabriel Galípolo, disse ter recebido intimação da Polícia
  Federal para depor sobre a fiscalização do Banco Master; disse não se recordar da data exata, mas que o
  depoimento ocorreria no início de outubro. A matéria informa que as pessoas intimadas seriam ouvidas na
  condição de testemunhas. Não há aspas diretas de Galípolo: o relato é paráfrase da agência.
