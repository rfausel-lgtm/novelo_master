summary: 'Resposta da Presidência da República a pedido de acesso à informação do Metrópoles: ''não foram
  produzidas atas, registros, filmagens, gravações ou outros documentos'' das reuniões de 04/12/2024 e
  das demais reuniões de Mantega no Planalto; os encontros constariam na agenda do chefe de gabinete Marco
  Aurélio Santana Ribeiro, não na de Lula.'
