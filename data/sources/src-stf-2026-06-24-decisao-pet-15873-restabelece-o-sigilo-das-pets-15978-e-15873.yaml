summary: >-
  Decisão de duas páginas, assinada digitalmente pelo relator em 24/06/2026. Com base no art. 20 do "CCP"
  (assim grafado no texto) e na Súmula Vinculante nº 14, e considerando a necessidade de resguardar o aporte
  de novas informações aos autos para viabilizar futuras diligências, determina "o restabelecimento do sigilo
  anteriormente vigente no âmbito das PETs nº 15.978 e nº 15.873, para a retomada do trâmite processual". No
  cabeçalho, a Polícia Federal figura como interessada e, entre os requeridos, o senador Ciro Nogueira e
  Felipe Cançado Vorcaro, já registrados no acervo como investigados na Pet 15.873; os demais nomes do
  cabeçalho não são reproduzidos pelo Novelo.
