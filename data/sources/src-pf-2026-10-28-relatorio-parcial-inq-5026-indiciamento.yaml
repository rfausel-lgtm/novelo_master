summary: Íntegra do relatório parcial da Polícia Federal no Inq 5026/STF, datado de 28/10/2026 em Brasília e
  assinado por quatro delegados da PF. Indicia 15 pessoas, limita-se às hipóteses que a PF considera
  consolidadas e pede mais 60 dias para concluir perícias e outras diligências. Arquivo hospedado pelo
  Poder360, não obtido de portal oficial; sem hash oficial.
notes: Autenticidade declarada pelo veículo e coerente com a estrutura interna do documento. A CNN Brasil cita
  trechos que batem com o PDF (p. 531 conferida), mas isso não é corroboração independente do conteúdo. Os
  CPFs aparecem em branco na versão publicada. Hash do texto extraído (sha256) 694bf790c273e29d...; hash do
  arquivo em documents.
