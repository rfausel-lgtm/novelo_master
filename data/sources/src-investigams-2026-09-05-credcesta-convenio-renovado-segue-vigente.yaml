source_type: press
summary: Registra que os descontos do CredCesta deixaram de ser feitos na folha de agosto de 2026 e que
  a Secretaria de Administração atribui a causa à própria empresa, que teria deixado de manter contrato
  com a terceirizada operadora do sistema de consignações — não a uma decisão do Estado. O governo ressalva
  que a dívida não foi cancelada. Registra ainda decisão da 2ª Vara Bancária de Campo Grande, de setembro
  de 2025, constatando que a PKL One não compõe a lista de instituições autorizadas pelo Banco Central.
