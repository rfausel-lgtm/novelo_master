source_type: press
summary: Revela que a Trustee atuou como agente fiduciário na emissão de R$ 470,5 milhões em debêntures
  da Banvox Holding Financeira (depois transferidas à DV Holding Financeira), emitidas pela família Rezende
  Barbosa (ex-donos do Banco Voiter) para capitalizar o Master, com fiança solidária de Daniel Vorcaro,
  Augusto Lima e Maurício Quadrado. Debenturistas destituíram a Trustee da administração por conflito
  de interesse. Registra também participação indireta de Nelson Tanure via debêntures conversíveis na
  holding da Banvox, através do fundo Estocolmo (administrado pela Trustee, gerido pela MAM Asset), com
  termos contratuais sigilosos — dado usado pela PF para sustentar a hipótese, sob apuração, de que Tanure
  seria 'sócio oculto' do Master.
