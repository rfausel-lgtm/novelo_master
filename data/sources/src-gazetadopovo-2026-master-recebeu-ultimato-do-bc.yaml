summary: Registra que em novembro de 2024 — um mês antes da reunião no Palácio do Planalto — o Banco Central,
  ainda sob Roberto Campos Neto, enviou termo de compromisso ao Banco Master, assinado por Vorcaro, com
  prazo de 180 dias para reforço de liquidez, gestão de riscos e reestruturação de governança, além de
  restrições a operações de crédito. O prazo venceria em maio de 2025.
