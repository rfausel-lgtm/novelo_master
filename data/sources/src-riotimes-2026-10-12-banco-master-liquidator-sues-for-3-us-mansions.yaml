summary: Reportagem em inglês sobre a ação do liquidante do Master, protocolada em 07/10/2026 no Tribunal de
  Falências dos EUA para o Distrito Sul da Flórida, em Fort Lauderdale, contra Clear River Properties LLC e
  Goldbeach Properties LLC. Indica o número Adv. No. 26-01362, os preços de compra dos três imóveis, o pedido
  de ao menos US$ 169,5 milhões caso os imóveis não sejam devolvidos, e afirma que Vorcaro não é réu e que as
  alegações não foram julgadas. Atribui à Jovem Pan o prazo de resposta das empresas (09/11/2026).
