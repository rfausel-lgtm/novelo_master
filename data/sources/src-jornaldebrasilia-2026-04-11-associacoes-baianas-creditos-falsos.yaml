source_type: press
summary: 'Reportagem citando representação da Polícia Federal: a Asteba e a Asseba, associações de servidores
  públicos da Bahia controladas por Augusto Lima, foram apontadas pelo Banco Master, em ofício ao Banco
  Central de 25/03/2025, como originadoras dos créditos de R$ 12,2 bilhões vendidos ao BRB via Tirreno.
  As duas associações receberam R$ 8,2 milhões do Master entre 2022 e 2025.'
