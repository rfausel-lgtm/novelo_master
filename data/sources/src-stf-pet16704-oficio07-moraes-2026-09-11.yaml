summary: 'Ofício de Alexandre de Moraes a Edson Fachin, juntado à Pet 16.704. Lista três condutas atribuídas a André
  Mendonça na relatoria das PETs 15.041 (Operação Sem Desconto) e 15.556 (Compliance Zero): (1) usurpação da
  direção das investigações policiais, com medidas que teriam afastado a cadeia de custódia; (2) condução
  irregular de tratativas de colaboração premiada; (3) direcionamento de alvos de investigação — nominalmente
  o próprio Alexandre de Moraes e o senador Davi Alcolumbre — "por motivos pessoais e políticos", com indicação
  prévia de cautelares à Polícia Federal. Pede julgamento conjunto das PETs 16.704 e 16.662 e denuncia que,
  dos 15 processos com sigilo levantado por Mendonça em 10/09, o levantamento foi parcial: 180 documentos
  ficaram de fora, com tabela por processo (ex.: PET 15.478 com 36 peças disponibilizadas, PET 15.504 com 115,
  PET 15.562 com 148).'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, autenticada por ele). PDF de 5 páginas; a
  tabela completa de peças por processo não foi transcrita.'
