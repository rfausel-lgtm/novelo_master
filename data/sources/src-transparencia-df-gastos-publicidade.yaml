summary: 'Planilhas trimestrais oficiais com a coluna de veículo subcontratado, baixadas e somadas pela
  equipe para os exercícios de 2022 a 2026. O método é reprodutível: filtrar a coluna de subcontratado
  e somar os valores brutos. O total de controle impresso nas próprias planilhas confere com a soma.'
