summary: Processo 6060141-11.2026.8.03.0001, ajuizado em 10/08/2026, com decisão de 13/08/2026 publicada
  no diário eletrônico nacional em 14/08/2026. O juízo autoriza o município a reter e provisionar os valores,
  mas mantém os descontos na folha dos servidores, proíbe as rés de cobrar ou negativar servidores sob
  multa de vinte mil reais por servidor, e nega expressamente a suspensão dos descontos, invocando a pendência
  do Tema 1.414 do Superior Tribunal de Justiça. Antes disso houve consignação em pagamento, extinta em
  09/04/2026 por falta de depósito.
