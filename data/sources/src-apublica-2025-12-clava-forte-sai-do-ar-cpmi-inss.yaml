source_type: press
summary: 'A Clava Forte Bank, fintech criada em março de 2024 e presidida por André Valadão e pela esposa, Cassiane
  (substituída em outubro de 2025 por Eduardo Pentagna Pedras), está com site, aplicativo e redes indisponíveis
  desde 21/11/2025, sob alegação de manutenção. O deputado Rogério Correia (PT-MG) pediu na CPMI do INSS a quebra
  de sigilo fiscal e bancário de Valadão para verificar se a fintech manteve "eventual atuação conjunta com o
  Banco Master" como canal de valores desviados. A reportagem registra que não há vínculo documentado com o Master
  — apenas o pedido de investigação.'
