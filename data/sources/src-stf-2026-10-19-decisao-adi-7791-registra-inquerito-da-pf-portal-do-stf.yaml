summary: Decisão do relator da ADI 7.791, Flávio Dino, de "Brasília, 19 de outubro de 2026", em três páginas,
  com "Publique-se. Intimem-se." e assinatura digital (código EFBE-DAF2-CD37-20DE). Registra a certidão de
  ausência de manifestação da CVM (eDOC 215), a entrega, pela União, do processo SEI nº 19957.001206/2022-08
  (eDOC 211), do espelho de tramitação (eDOC 209) e das informações pedidas; dá por integralmente cumpridas as
  determinações do eDOC 199; e, tendo em vista a instauração de inquérito policial já comunicada pela PF em
  autos apartados, determina o traslado da decisão e dos eDOCs 208-211 para a PET 16.814, com ciência à
  autoridade policial.
notes: 'Aberta com lote:fonte em 23/10/2026 (PDF do portal; texto legível, 8.034 caracteres; sha256 do texto
  5f443ec6f018e337...; sha256 do arquivo cac3d824...). Sem marca de sigilo; os andamentos da ADI 7791
  registram publicação no DJe divulgada em 19/10/2026. A decisão não traz o número do inquérito, não nomeia
  investigados e não nomeia os agentes que a União diz ter identificado. O rodapé também traz uma senha de
  acesso, que não é registrada.'
