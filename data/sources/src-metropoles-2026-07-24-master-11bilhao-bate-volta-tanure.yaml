summary: 'Trecho literal: ''o banco Master realizava ao menos R$ 1,112 bilhão em operações em que emprestava
  dinheiro a empresas ligadas ao investidor Nelson Tanure e, em até uma semana [...] repassava o crédito
  para fundos caixa preta.'' É o fluxo inverso ao das debêntures — o Master emprestando a empresas de
  Tanure, não Tanure capitalizando o Master — e mede fenômeno distinto dos valores citados em outras reportagens.'
