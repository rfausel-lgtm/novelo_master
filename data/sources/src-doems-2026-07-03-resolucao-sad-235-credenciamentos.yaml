summary: Publicada na edição nº 12.210, páginas 21 a 23, e lida pela equipe. Institui grupo de trabalho
  sobre superendividamento por consignações, em continuidade a colegiado criado em setembro de 2025, reconhecendo
  no preâmbulo que as dívidas de consignado 'passaram a comprometer de forma significativa o orçamento
  familiar e a saúde mental dos servidores'. O art. 10 suspende novos credenciamentos enquanto durar o
  grupo — mas o parágrafo único ressalva expressamente que o secretário 'poderá deferir pedido de renovação
  de credenciamento', o que preserva os convênios existentes. Assina Roberto Gurgel de Oliveira Filho,
  secretário de Administração.
