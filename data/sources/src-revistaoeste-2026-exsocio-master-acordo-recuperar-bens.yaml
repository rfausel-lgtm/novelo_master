summary: Liquidante alega que Quadrado e a esposa doaram quatro imóveis a familiares (set-out/2025) com
  cláusulas de incomunicabilidade/impenhorabilidade e venderam um quinto imóvel (Edifício Metropolitan,
  Vila Mariana) por R$ 5,9 milhões à 'Fraction 032', empresa do próprio casal — valor considerado subavaliado
  (comparáveis a R$ 22 milhões). Bloqueio adicional do TJSP em março/2026. Fundo Albali FIM recebeu R$
  230 milhões do Master em 2024 sem contraprestação e comprou o Hotel Fasano Itaim por R$ 330 milhões.
