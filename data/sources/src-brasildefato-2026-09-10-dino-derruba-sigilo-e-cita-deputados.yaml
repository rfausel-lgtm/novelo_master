source_type: press
summary: Registra o levantamento do sigilo da decisão que fundamentou os mandados da Operação Make Up e observa
  que o documento cita expressamente, além de Mário Frias, os deputados federais Bia Kicis e Marcos Pollon. Cita
  a determinação de vista à Procuradoria-Geral da República.
notes: 'A reportagem descreve a investigação como apuração de emendas ''para financiar o longa-metragem''. A decisão
  lida pela equipe é mais restrita: as emendas custearam termos de fomento com as duas organizações sociais, e a
  ligação com a produtora aparece como conexão financeira indireta, que o próprio texto diz não ser possível afirmar
  como origem direta dos recursos.'
