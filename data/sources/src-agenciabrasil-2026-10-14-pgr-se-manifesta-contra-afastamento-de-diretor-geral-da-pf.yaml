source_type: wire
language: pt-BR
summary: >-
  Publicada em 14/10/2026, às 09:46, sem autor individual. Segundo a agência, a PGR enviou ao STF, na noite de
  13/10/2026, parecer assinado pelo procurador-geral da República, pelo vice-procurador-geral e por dois
  subprocuradores-gerais, contrário ao afastamento do diretor-geral da PF, Andrei Rodrigues, e do diretor de
  Inteligência, Leandro Almada, que havia sido determinado por André Mendonça em decisão monocrática; segundo a matéria, o parecer
  afirma que a qualificação negativa do comportamento das autoridades policiais, para justificar a medida,
  "precisaria estar acompanhada de evidências da participação imprópria em atos ilícitos", que
  a posição hierárquica do servidor não basta para responsabilizá-lo e que o afastamento configuraria "risco à
  ordem pública". Não informa a PET nem traz manifestação de Andrei Rodrigues ou de Leandro Almada.
notes: >-
  Fonte única; o parecer não foi localizado. Os nomes dos signatários além do PGR não são registrados pelo Novelo
  (grafia divergente entre fontes).
