summary: 'A PF pediu, em 22/01/2026, ratificação das medidas deferidas pelo juízo de primeiro grau e
  autorização expressa para seguir extraindo e analisando o material apreendido, com oitivas marcadas para
  26 e 27/01/2026 e ainda pendente a possibilidade de usar os dados telemáticos no questionamento dos
  investigados. A PGR concordou, lembrando que na Rcl 88.121, em 09/12/2025, o próprio relator mantivera
  "por ora, todas as decisões administrativas, cíveis e criminais até então proferidas". Toffoli defere nos
  exatos termos da PGR.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). A decisão de 09/12/2025 na Rcl 88.121, citada aqui pela PGR, tem
  fonte própria em src-stf-rcl88121-decisao-liminar-09-12-2025.'
