summary: Segundo a reportagem, um dos anexos da delação de Mansur descreve remessa de R$ 494 milhões do
  Master ao fundo Jaguar Multimarket Fund Ltd (Cayman Islands), formalmente em nome de Benjamin Botelho,
  mas cujo controlador real seria Daniel Vorcaro, segundo Mansur.
