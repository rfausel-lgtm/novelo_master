source_type: press
summary: 'Os deputados Carlos Jordy (PL-RJ), Adriana Ventura (Novo-SP) e Caroline de Toni (PL-SC) — e,
  separadamente, o deputado Luiz Philippe de Orleans e Bragança (PL-SP) — apresentaram representação à
  PGR pedindo a suspeição/afastamento do ministro Dias Toffoli da relatoria do caso Master, citando a
  viagem a Lima ''em um jatinho do empresário e ex-senador Luiz Oswaldo Pastore''. O procurador-geral
  Paulo Gonet determinou o arquivamento em 23/01/2026: ''O caso a que se refere a representação já é objeto
  de apuração perante o Supremo Tribunal Federal, com atuação regular da Procuradoria-Geral da República.''
  Este pedido é anterior e distinto do relatório da PF que embasaria o segundo pedido de suspeição, em
  fevereiro de 2026.'
