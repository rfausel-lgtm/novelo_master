summary: Páginas 41 a 46. Prospecto da primeira tentativa de alienação da estatal, que não se consumou.
  Registra que 'em 1999, foi criado Cartão Credicesta' pela própria empresa pública, e já contém, nos
  itens 4.1.7 e 4.1.8, a cláusula que transferiria ao comprador, por cinco anos, 'a titularidade e a gestão
  plenas do Cartão Credicesta', assegurando-lhe 'o direito de modificar, ampliar, aperfeiçoar e/ou diversificar
  as finalidades do programa'. A fórmula que reapareceria no decreto de 2018 já estava, portanto, escrita
  em 2015.
