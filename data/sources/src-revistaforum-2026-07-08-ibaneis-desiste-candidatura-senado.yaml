summary: 'O ex-governador do Distrito Federal Ibaneis Rocha (MDB), que havia renunciado ao governo em
  março/2026 para concorrer ao Senado, desistiu da candidatura em 08/07/2026, declarando: ''Já cuidei
  de Brasília, agora eu quero cuidar de mim'' — reportagens atribuem a desistência ao desgaste do escândalo
  BRB-Master (banco que ele geria por meio de indicação da presidência) e ao rompimento com a sucessora,
  Celina Leão.'
