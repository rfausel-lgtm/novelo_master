summary: 'Dossiê biográfico (autor: Gabriel Monteiro) segundo o qual, a partir de 2011, Daniel Vorcaro
  aproximou-se dos irmãos Antonio Augusto e Vicente Conte Neto, "herdeiros de uma tradicional administradora
  de cemitérios e sócios da gestora Blackwood"; a parceria teria começado com um projeto hoteleiro frustrado
  (Golden Tulip, em Belo Horizonte) e evoluído até a aquisição do Banco Máxima, que viraria o Master. O
  texto não liga os irmãos a bloqueio de bens, busca e apreensão ou à Operação Compliance Zero.'
