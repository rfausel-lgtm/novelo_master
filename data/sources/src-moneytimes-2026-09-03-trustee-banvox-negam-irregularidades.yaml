source_type: press
summary: 'Nota conjunta das duas empresas, divulgada às 14h27 de 03/09/2026: ''não há nenhuma irregularidade
  na estrutura de suas operações ou violações a normas do mercado de capitais''; afirmam nunca terem sido
  notificadas pelo BC para qualquer enquadramento nesse sentido; dizem ter recebido a decisão ''com surpresa'';
  e alegam que nenhum de seus executivos constou na denúncia do MP na Operação Carbono Oculto, ''apresentada
  na mesma data'' da liquidação.'
