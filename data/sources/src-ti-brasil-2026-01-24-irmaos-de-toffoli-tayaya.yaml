source_type: press
summary: 'Identifica José Eugênio Dias Toffoli (engenheiro) e José Carlos Dias Toffoli (padre, conhecido
  como ''Padre Carlão'') como irmãos do ministro do STF Dias Toffoli, detentores de 18% de empreendimento
  do grupo Tayayá entre 2021 e 2025, vendido em fevereiro daquele ano. Cita como sócios do empreendimento
  o empresário Patrick Ferro e o apresentador Carlos Roberto Massa (Ratinho), e registra terem sido também
  acionistas de outro resort Tayayá em Ribeirão Claro (PR). A organização cobra transparência sobre a origem
  do capital e sobre negócios que menciona ligados a ''Master e JBS''.'
notes: Não menciona nominalmente a empresa Maridt, já registrada no acervo como veículo societário da
  família Toffoli no grupo Tayayá — presume-se ser a mesma estrutura, sob outro nome de holding, não
  reconciliado neste lote.
