summary: Relata a tentativa, em fevereiro de 2026, de venda privada da mansão de Windermere (Orlando)
  à Chosen Vessel LLC (Delaware), por meio da holding Sozo Real Estate, controlada por Henrique Vorcaro
  (presidente) e Natália Vorcaro Zettel (vice-presidente) — sem listagem no MLS nem advogado independente,
  segundo a EFB. Cobertura regional, mas reproduzida com dados idênticos por múltiplos veículos, sugerindo
  origem em nota de agência ou coluna de maior porte (Metrópoles/Andreza Matais).
