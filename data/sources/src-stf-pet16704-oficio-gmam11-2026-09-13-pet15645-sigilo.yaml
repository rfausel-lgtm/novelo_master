summary: 'Ofício de Moraes a Fachin (texto nativo, lido na íntegra, 2 páginas). Reporta-se à decisão de
  11/09/2026 de Fachin que determinara a Mendonça a remessa em HD, em 24h, de todos os procedimentos ligados
  à Pet 15.556/Operação Compliance Zero e o levantamento do sigilo da Pet 15.556. Moraes aponta que "não foi
  levantado o sigilo da PET 15645, distribuída por prevenção ao Ministro André Mendonça e que possui
  elementos essenciais para o julgamento da PET 16662, previsto para a próxima terça-feira, 15 de setembro".
  Pede que Fachin determine o levantamento do sigilo da Pet 15.645 e a disponibilização dos autos a todo o
  colegiado antes do julgamento.'
