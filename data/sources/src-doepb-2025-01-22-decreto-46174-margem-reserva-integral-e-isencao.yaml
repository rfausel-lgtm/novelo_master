title: Decreto nº 46.174, de 21 de janeiro de 2025 — margem, reserva integral e isenção de custas (PB)
publisher: Diário Oficial do Estado da Paraíba
publication_date: '2025-01-22'
retrieved_at: '2026-09-09'
url: https://auniao.pb.gov.br/servicos/doe/2025-1/janeiro/diario-oficial-22-01-2025-portal.pdf
source_type: official_gazette
summary: Páginas 1 e 2. Assinado pelo governador João Azevêdo Lins Filho. É o desenho mais favorável à
  consignatária localizado em toda a apuração. Reserva 10% da margem para cartão benefício e outros 10%
  para bens duráveis; admite como consignatárias 'empresas administradoras de cartão de crédito e/ou cartão
  benefício'; permite parcelamento em até 84 vezes; determina que, ao solicitar o cartão, 'o consignado
  autoriza que toda a sua margem disponível para o produto seja reservada pela Consignatária'; e, no dispositivo
  acrescentado como art. 17-A, isenta de custas operacionais as instituições de pagamento credenciadas
  para a rubrica. Em contrapartida, limita a taxa de emissão a R$ 25,00 por via, veda cartão benefício
  em mais de uma consignatária e exige reconhecimento biométrico na contratação. Quem foi credenciado
  no estado para o produto não foi a PKL One, e sim a KDB Instituição de Pagamento S.A.
