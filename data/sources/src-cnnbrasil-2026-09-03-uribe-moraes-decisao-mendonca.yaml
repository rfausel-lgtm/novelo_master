summary: 'Fonte independente (não cita nem deriva de David Ágape) que confirma a existência e o teor geral
  da decisão de Moraes de 03/09/2026: acusa Mendonça de ''usurpação da direção das investigações, condução
  irregular das tratativas de delação premiada e direcionamento de investigação contra o magistrado''.
  Corrobora que a decisão existe e seu teor geral, mas NÃO corrobora as métricas específicas de Ágape
  (percentual de cópia, metadados do PDF) — essas seguem exclusivas da análise dele, não verificadas por
  terceiros.'
