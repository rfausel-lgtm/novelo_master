summary: Noticia a indisponibilidade de bens decretada pelo Banco Central sobre Augusto Ferreira Lima e Luiz Rennó
  Netto, a quem identifica como ex-diretor jurídico do Banco Master, pela atuação como administradores de fato nos
  doze meses que antecederam o regime de resolução. Registra que a defesa de Rennó Netto ainda não se manifestara.
