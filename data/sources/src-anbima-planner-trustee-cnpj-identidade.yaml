summary: 'Confirma que "Planner Trustee Distribuidora de Títulos e Valores Mobiliários Ltda." (CNPJ
  67.030.395/0001-46) é a razão social/identidade legal completa da entidade já registrada no acervo como
  "Trustee DTVM" — controlada por Maurício Quadrado, que levou a área de custódia da corretora Planner ao
  sair dela em 2020, com segregação do Conglomerado Planner autorizada pelo Banco Central em agosto/2022.
  O próprio domínio trusteedtvm.com.br usa a marca "Planner Trustee DTVM" em seus documentos regulatórios.'
notes: Fonte usada para confirmar que "Planner Trustee", citada pela Revista Oeste como administradora do
  fundo CARE11, é a mesma entidade "Trustee DTVM" já mapeada no acervo — não uma empresa distinta.
