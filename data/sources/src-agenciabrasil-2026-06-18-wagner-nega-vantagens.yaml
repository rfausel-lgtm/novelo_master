summary: 'Traz a nota da assessoria do senador, de 18/06/2026: ''O senador Jaques Wagner (PT-BA) esclarece
  que não é réu, não foi denunciado e não foi acusado em nenhum processo relacionado aos fatos investigados.''
  Na mesma nota, afirma que o apartamento ''jamais integrou o patrimônio do parlamentar'', nega atuação
  em favor do Master e sustenta que os valores em espécie apreendidos provinham de ''diárias legais, declaradas
  e não utilizadas em missões internacionais oficiais''.'
