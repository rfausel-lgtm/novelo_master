summary: 'A busca contra Thiago Miranda (10ª fase) deve alimentar a investigação sobre ''Dark Horse''.
  Mensagens do Intercept: em 08/12/2024 Miranda marcou encontro de Flávio Bolsonaro com Vorcaro na casa
  do banqueiro em Brasília para 11/12 às 17h30; Vorcaro se comprometera a investir R$ 134 milhões, dos
  quais R$ 62 milhões teriam sido repassados; em março de 2025 Miranda encaminhou print atribuído a Eduardo
  Bolsonaro sugerindo meios de enviar recursos aos EUA.'
