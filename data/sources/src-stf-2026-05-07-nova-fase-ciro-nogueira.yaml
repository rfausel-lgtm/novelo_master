summary: O ministro André Mendonça autorizou, na Pet 15873, nova fase da Compliance Zero envolvendo suposta
  atuação do senador Ciro Nogueira (PP-PI) em favor de Daniel Vorcaro; decretou prisão temporária de Felipe
  Cançado Vorcaro por cinco dias e medidas cautelares ao senador e a outros investigados. A PF aponta
  que Ciro Nogueira apresentou emenda à PEC 65/2023 ampliando a cobertura do FGC de R$ 250 mil para R$
  1 milhão por depositante, texto que teria sido elaborado pela assessoria do Banco Master; aponta ainda
  pagamentos mensais e outras vantagens ao parlamentar, segundo relatos colhidos pela PF.
