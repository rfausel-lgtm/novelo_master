source_type: press
summary: A PF aponta Renan Foglia Calamia, executivo da consultoria Crédito e Mercado — já identificado
  no corpus como o consultor que propôs a compra de Master na ata da Prevcon/Congonhas —, como suspeito
  de 'omitir alertas de segurança para favorecer' a aplicação de R$ 97 milhões do Iprev de Maceió no Master.
  A Crédito e Mercado nega, por nota, qualquer participação nos dois casos.
