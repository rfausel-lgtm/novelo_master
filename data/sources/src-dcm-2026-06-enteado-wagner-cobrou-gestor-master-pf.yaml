summary: Segundo a reportagem, a PF suspeita que Andréa Lima Novaes — prima de Augusto Lima e então administradora
  da PKL One Participações — tenha transferido R$ 3,5 milhões a entidade ligada à família do senador Jaques
  Wagner (PT-BA), com suspeita de fluxo entre a PKL One (núcleo Augusto Lima) e a BN Financeira (ligada
  a Eduardo Sodré). Fonte única localizada; o texto integral não foi lido por completo pela equipe (obtido
  via resumo de busca) — tratada como alegação fraca até verificação direta e eventual corroboração.
