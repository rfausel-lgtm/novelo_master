summary: 'Thiago Miranda admite publicamente a intermediação do investimento de Daniel Vorcaro no filme
  ''Dark Horse'': ''Sim! Eu fiz exatamente isso. Intermediei o investimento.'' Afirma, porém, que a reunião
  com Flávio Bolsonaro não chegou a acontecer — ''Eu seria responsável pelo encontro'' —, versão que contrasta
  com as mensagens apreendidas.'
