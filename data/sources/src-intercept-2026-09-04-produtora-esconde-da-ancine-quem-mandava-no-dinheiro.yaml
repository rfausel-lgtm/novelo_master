source_type: press
summary: Reportagem sobre o processo administrativo da Ancine que descreve, com documentos, a estrutura da produção
  dos dois lados da fronteira. A Ancine lavrou auto de infração em 28/07/2026 por a produtora ter rodado no Brasil
  obra cinematográfica estrangeira sem comunicação prévia. Na defesa protocolada em 31/08/2026, a Go Up Entertainment
  Ltda diz ter atuado apenas como prestadora de serviços locais e afirma que quem contratou e pagou o elenco principal
  foi uma 'empresa estrangeira' que os advogados nunca nomeiam — e que é a Goup Entertainment LLC, sediada em Miami,
  Flórida, cuja sócia-administradora é a mesma da empresa brasileira. Em 17/07/2026, Karina Ferreira da Gama e Michael
  Brian Davis, como acionistas e diretores da empresa americana, assinaram em Miami memorando dirigido à própria
  Ancine, no mesmo processo, nomeando a LLC como 'Licenciante e titular declarada dos direitos sobre a Obra' e declarando,
  na cláusula 5.1, que a produção 'foi realizada parcialmente no território' brasileiro. A defesa pede que a multa
  fique no mínimo legal de R$ 2 mil, quando a autuação pode chegar a R$ 200 mil. Sobre o dinheiro, a reportagem
  registra que a perícia contratada pela produtora atesta que a empresa brasileira recebeu US$ 3,7 milhões do Havengate
  Development Fund — R$ 20,93 milhões no câmbio da época —, enquanto outros US$ 9,7 milhões teriam permanecido nos
  Estados Unidos; que a perícia, segundo O Globo, não teve acesso aos documentos do fundo; e que o laudo, de 32
  páginas, não desdobra valores nem identifica gastos específicos, segundo a piauí. O memorando de julho também
  licencia à Cannes Produções Ltda, de Barueri, os direitos de distribuição no Brasil.
