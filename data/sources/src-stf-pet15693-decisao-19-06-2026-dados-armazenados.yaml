summary: Decisão que defere afastamento de sigilo de dados telemáticos armazenados (cadastrais, logs,
  conteúdo em nuvem, e-mails, backups, fotos, localização) de 17 pessoas junto a Apple, Google e Microsoft,
  complementar às apurações da PET 15.499 e do INQ 5.026. A manifestação da PGR, citada na decisão, afirma
  que a valoração de suspeitas já foi exercida de modo satisfativo nas Petições 15.556 e 15.978 para a
  maioria dos nomeados, concentrando a novidade substantiva do pedido em Natália Bueno Vorcaro Zettel, com
  base em elementos da IPJ nº 2293065/2026.
notes: 'Peça pública do portal do STF (Resolução 427/2010), obtida em sessão anterior via
