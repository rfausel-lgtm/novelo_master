source_type: official_government
summary: A PF cumpriu quatro mandados de busca e apreensão em Macapá (operação Zona Cinzenta, 4ª Vara
  da Justiça Federal) para investigar a aplicação de R$ 400 milhões do RPPS do Amapá no Master, por suspeita
  de gestão temerária e fraudulenta. A Amprev afirmou que os recursos dos segurados estão protegidos e
  que obteve na 2ª Vara de Fazenda Pública de Macapá a retenção dos consignados que seriam repassados
  ao Master.
