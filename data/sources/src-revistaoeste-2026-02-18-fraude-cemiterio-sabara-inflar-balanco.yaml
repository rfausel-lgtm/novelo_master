source_type: press
summary: 'Reportagem baseada em relatório da PF (mesma reportagem citada e transcrita, em trecho menor,
  pela decisão do Min. Flávio Dino na ADPF 1.196 em 15/09/2026): o cemitério Terra Santa, em Sabará/MG,
  de titularidade da VHR Empreendimentos — companhia do portfólio do fundo CARE11/Graveyard Death and
  Care —, foi avaliado pela própria empresa em R$ 181 milhões em 2016, na formação do Banco Master, e
  reavaliado para R$ 111,7 milhões em 2020. Uma empresa da família de Daniel Vorcaro era sócia direta do
  cemitério, mas o nome dela não é dado na reportagem. Segundo a PF, o banco, na qualidade de cotista do
  fundo, aceitou cotas de uma empresa do próprio grupo econômico ao preço que ele mesmo havia
  estabelecido, criando lastro contábil sem substância real — usado para mascarar a fragilidade
  estrutural da carteira do banco desde 2016.'
