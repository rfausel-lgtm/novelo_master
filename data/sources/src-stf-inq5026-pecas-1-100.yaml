summary: 'As cem primeiras peças do INQ 5.026 (STF) — petições de partes investigadas (Augusto Ferreira Lima,
  Paulo Henrique Bezerra Rodrigues Costa, Daniel Bueno Vorcaro), documentos comprobatórios anexados por
  elas, recibos de peticionamento e despachos — baixadas por Rafael via certificado digital. Lidas por
  inteiro em 12/09/2026 por equipe de investigação. As petições reproduzem, por vezes, o texto de documentos
  primários anexados (comunicados oficiais do Banco Central, declarações do Banco Master) — nesses casos a
  classificação segue o documento reproduzido, não a petição que o transcreve.'
notes: 'Obtido pelo próprio Rafael via certificado digital, mesma política de divulgação já aplicada às
  demais peças obtidas por certificado. Toda página traz rodapé "Impresso por: [CPF] - RAFAEL FAUSEL" — nunca
  reproduzido no acervo.'
