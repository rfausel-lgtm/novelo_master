summary: >-
  Arquivos oficiais de dados do portal de resultados do TSE, eleição 6259 (1º turno de 04/10/2026), cargo
  Deputado Federal, todos com totalização final. Paraíba: Hugo Motta (Republicanos), "Eleito por QP", 124.339
  votos (5,17%). Minas Gerais: Nikolas Ferreira (PL), "Eleito por QP", 3.119.318 (27,19%). São Paulo: Mario
  Frias (PL), "Eleito por QP", 91.403 (0,39%). Rio de Janeiro: Antonio Rueda (União), "Eleito por QP", 155.836
  (1,76%).
notes: >-
