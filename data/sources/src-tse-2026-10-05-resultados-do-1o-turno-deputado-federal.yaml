  Totalizações: PB 04/10/2026 23:22:24; SP 04/10/2026 22:58:07; RJ 10/10/2026 15:08:04; MG 15/10/2026 19:09:59
  (arquivos de RJ e MG regenerados depois de 04/10). Lidos em 16/10/2026 no navegador, a partir da página
  oficial, sem gravação local. "QP" = quociente partidário; percentuais sobre votos válidos. Datas de
  nascimento dos arquivos não são registradas. Arquivos em raw/ e sha256 pendentes.
