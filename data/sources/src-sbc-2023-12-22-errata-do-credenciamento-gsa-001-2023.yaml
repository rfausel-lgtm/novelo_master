summary: Edição com extração integral lida pela equipe. Publica errata, na fórmula 'onde se lê / leia-se', dos extratos
  de credenciamento do Edital GSA nº 001/2023 divulgados uma semana antes. A correção alcança a descrição do objeto
  — que passa de 'concessão de empréstimo pessoal e cartão de crédito com desconto em folha' para 'conceder financiamento
  de bens e serviços e saques, por meio de cartão consignado de benefícios aos servidores públicos ativos, aposentados
  e pensionistas' — e mantém a PKL One Participações S.A. e a Neo Crédito Ltda como credenciadas distintas, com
  o mesmo processo SB 114563/2023-38, a mesma assinatura de 14/12/2023 e a mesma vigência de sessenta meses. A errata
  não toca no número de cadastro nacional publicado no julgamento de habilitação.
