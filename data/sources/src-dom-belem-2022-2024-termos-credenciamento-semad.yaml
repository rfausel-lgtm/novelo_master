summary: Duas edições lidas na íntegra pela equipe. A de 26/04/2022 publica o extrato do Termo de Credenciamento
  nº 05/2022-SEMAD, assinado em 25/04/2022, com vigência de 24 meses prorrogáveis, fundado no Edital de Credenciamento
  nº 001/2022-SEMAD e no Decreto Municipal nº 103.487/2022-PMB, e no processo administrativo nº 1456/2022-SEMAD.
  A de 03/06/2024 publica o Termo nº 02/2024-SEMAD, assinado em 18/04/2024, também de 24 meses, processo administrativo
  nº 1027/2024-SEMAD. Nos dois o objeto é a consignação facultativa em folha dos servidores ativos, aposentados
  e pensionistas da administração direta e indireta do Executivo municipal. A edição de 2022 identifica a empresa
  pelo cadastro nacional correto; a de 2024 imprime outro número.
notes: A edição de 26/04/2022 está em https://data.queridodiario.ok.org.br/1501402/2022-04-26/82fb897309d1f7832a981e1ff48661703bd8611a.pdf.
  O número impresso em 2024, 24.490.629/0001-13, é recusado como inválido pela base pública da Receita Federal;
  o correto, publicado em 2022, é 27.490.629/0001-13.
