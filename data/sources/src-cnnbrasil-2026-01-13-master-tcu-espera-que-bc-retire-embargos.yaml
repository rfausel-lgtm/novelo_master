summary: Relata que em 12/01/2026 o presidente do BC, Gabriel Galípolo, recebeu o presidente do TCU, Vital do
  Rêgo, e o relator Jhonatan de Jesus, e que o encontro abriu caminho para acordo de inspeção pela
  AudBancos, com compromisso do TCU de respeitar sigilos; segundo apuração da CNN, o BC estaria disposto a
  retirar os embargos, previstos para o Plenário de 21/01; transcreve declarações de Vital do Rêgo em coletiva
  após o encontro.
