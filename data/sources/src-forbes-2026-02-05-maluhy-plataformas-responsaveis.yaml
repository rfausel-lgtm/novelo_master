title: 'Banco Master: plataformas também são responsáveis, diz Milton Maluhy'
publisher: Forbes Brasil
publication_date: '2026-02-05'
url: https://forbes.com.br/forbes-money/2026/02/banco-master-plataformas-tambem-sao-responsaveis-diz-milton-maluhy/
source_type: press
summary: Em coletiva sobre o resultado do quarto trimestre de 2025, o CEO do Itaú Unibanco, Milton Maluhy
  Filho, comentou a liquidação do Banco Master e do Will Bank como evento de magnitude relevante, apontando
  rombo de R$ 55 bilhões no Fundo Garantidor de Créditos (FGC) — quase metade do patrimônio do fundo, de
  R$ 120 bilhões — e afirmando que "o FGC terá de ser recapitalizado, o que deve gerar custos para toda a
  sociedade". Atribuiu parte da responsabilidade às plataformas de investimento que lucraram distribuindo
  CDBs do Master, usados como alavanca para um modelo de negócio insustentável.
