source_type: press
summary: 'Reportagem com escopo mais amplo que o dos ''91 escritórios de advocacia'': soma pagamentos
  a empresas de qualquer natureza fundadas a partir de 2021 (escritórios de advocacia recém-criados, consultorias,
  agências), totalizando R$ 870 milhões entre 2022-2025 — não é o total geral de todos os fornecedores
  do Master, apenas o subconjunto de empresas jovens. Cita o escritório Sacramone, Orleans e Bragança
  Advogados (fundado em 23/08/2021) entre os beneficiários, com R$ 6,4 milhões recebidos.'
