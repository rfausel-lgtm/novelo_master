summary: 'A Diretoria de Portos e Costas informa não haver registro de embarcações em nome dos sete requeridos. A
  ANAC informa, com certidões negativas, não haver aeronaves registradas em nome deles no RAB. O Banco Central
  informa ter transmitido a ordem a todas as instituições financeiras em 15/05/2026, e a CVM, aos participantes do
  mercado de valores mobiliários em 18/05/2026.'
