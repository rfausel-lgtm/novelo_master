source_type: press
summary: 'Com base em mensagens e áudios do celular de Vorcaro publicados pela newsletter Noites Húngaras:
  em 14/03/2025 Vorcaro esteve por cerca de duas horas na sede do Instituto ITER, em São Paulo, fundado
  pelo ministro André Mendonça; o encontro foi articulado pelo advogado Ciro Rocha Soares e pelo deputado
  Cezinha de Madureira (PL-SP); mensagens registram tratativas prévias com menção a Bruno Bianco. Em nota,
  o gabinete do ministro declarou ter recebido o empresário uma única vez, para tratar de memoriais sobre
  precatórios, e que sua decisão foi contrária aos interesses do banco.'
