summary: Nota de coluna de 23/10/2026 que descreve, com trechos, ofício do BRB ao ministro André Mendonça
  pedindo a liberação efetiva dos 23 imóveis. Segundo o ofício, os imóveis seguem alcançados por outra ordem
  de indisponibilidade e, em despacho de 19/10/2026, a 8ª Vara Federal indeferiu a habilitação do banco sem
  exame do mérito. Informa que o novo pedido ainda não havia sido analisado. Não publica o ofício nem o
  despacho.
