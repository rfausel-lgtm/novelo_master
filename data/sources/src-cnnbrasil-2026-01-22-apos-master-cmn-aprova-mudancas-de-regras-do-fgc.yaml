source_type: press
language: pt-BR
summary: Relata que o CMN aprovou em 22/01/2026 as mudanças no estatuto social e no regulamento do FGC
  deliberadas em assembleias gerais de setembro de 2025 e janeiro de 2026; reproduz a descrição do FGC
  (ampliação de suporte à transferência de controle mediante reconhecimento de situação conjuntural adversa
  pelo BC; cobertura de despesas decorrentes de atos regulares de gestão; divulgação de saldos por
  instituição; prazo máximo de três dias para início dos pagamentos) e afirma que as alterações fazem parte de
  um processo de revisão iniciado após as liquidações do caso Banco Master.
notes: Texto lido por lote:fonte em 23/10/2026. A página tem chamadas de outras matérias e de campanha
