summary: 'Página oficial da CVM que lista processos envolvendo entidades do Grupo Master. Registra o Processo
  Administrativo Sancionador 19957.006441/2021-87, sobre "possível manipulação de mercado pelo Banco Maxima S.A.
  (antiga denominação do atual Banco Master S.A.) com o ativo CARE11", encerrado após aceitação de termo de
  compromisso pelo Colegiado em 16/11/2022; e, separadamente, o Processo 19957.010180/2022-81, sobre possível
  manipulação com cotas do Brazil Realty FII (BZLI11) pelo Banco Master.'
notes: Lida por esta sessão via WebFetch direto. Precisa dois pontos do acervo — o termo foi aceito pelo
  Colegiado em 16/11/2022 (13/09/2022 é a data do parecer do Comitê de Termo de Compromisso) e o segundo
  processo trata do Brazil Realty, não do CARE11.
