summary: 'Reportagem com dimensionamento: as duas distribuidoras representavam juntas menos de 0,001%
  do ativo total ajustado do SFN (jul/2026) e 0,76% do volume de administração de recursos de terceiros;
  ambas no segmento prudencial S4. Com a decretação, chegou a 17 o número de instituições liquidadas pelo
  BC em 2026 — o maior volume desde 2002, quando 24 instituições foram liquidadas.'
