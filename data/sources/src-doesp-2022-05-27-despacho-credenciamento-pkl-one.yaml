summary: Caderno Executivo, Seção I, página 24, seção 'Fazenda e Planejamento — Gabinete do Secretário'.
  Referência GDOC 1000581-2302/2022 - SFP-PRC-2022/12729. Defere o credenciamento da PKL One Participações
  S/A no sistema de consignação em folha do Estado, concedendo-lhe a espécie de consignação 270 (Cartão
  de Benefício). O ato é um despacho de deferimento, não contrato nem convênio, e é publicado impessoalmente,
  sem nome de signatário.
