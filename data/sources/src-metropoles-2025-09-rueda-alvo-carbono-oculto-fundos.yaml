source_type: press
summary: 'A PF investiga se Rueda seria "dono oculto de jatos executivos, que estão formalmente em nome de
  terceiros e de fundos de investimento", citando o Fundo Bariloche e o Fundo Viena (gestora Genial),
  caracterizados como "fundos caixa-preta" usados para ocultar patrimônio. Procurado, Rueda negou envolvimento,
  dizendo que seu nome "foi suscitado em um contexto absolutamente infundado" e que "tomará todas as medidas
  cabíveis para proteger sua reputação".'
