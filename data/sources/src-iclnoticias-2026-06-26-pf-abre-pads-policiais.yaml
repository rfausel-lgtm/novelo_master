summary: Informa que a PF comunicou, por boletim eletrônico oficial, a abertura de processos administrativos
  disciplinares conduzidos pela Corregedoria contra policiais investigados na Compliance Zero, citando
  nominalmente Anderson Wander da Silva Lima e Valéria Vieira Pereira da Silva. A corporação não informou
  o número total de servidores envolvidos, e não houve demissão até então.
