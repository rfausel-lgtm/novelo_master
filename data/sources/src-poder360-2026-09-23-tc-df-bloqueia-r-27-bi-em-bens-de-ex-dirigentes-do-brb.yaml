summary: >-
  Reproduz as determinações do TCDF e atribui ao Metrópoles os cargos dos quatro ex-dirigentes além de Paulo
  Henrique Costa. Registra a nota do BRB (decisão positiva; a gestão atual atua de forma diligente), que a
  defesa de Paulo Henrique Costa foi procurada e não respondeu até a publicação e que não localizou contato
  válido para os outros quatro.
