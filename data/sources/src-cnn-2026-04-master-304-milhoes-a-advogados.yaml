source_type: press
summary: 'Levantamento da CNN sobre a Declaração de Imposto de Renda do banco enviada à Receita Federal
  e remetida à CPI do Crime Organizado: cerca de R$ 304,5 milhões pagos a advogados e escritórios em 2025,
  com ao menos 98 escritórios beneficiados. O maior montante foi ao escritório Barci de Moraes, com cerca
  de R$ 40,1 milhões só em 2025 e R$ 80,2 milhões em dois anos. Entre os maiores recebedores estão também
  o escritório do ex-presidente do Conselho Federal da OAB Marcus Vinicius Furtado Coelho e o Warde Advogados.
  O escritório Barci de Moraes não confirma dados que considera vazados ilicitamente.'
