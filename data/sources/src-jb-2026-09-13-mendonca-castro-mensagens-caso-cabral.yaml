source_type: press
summary: 'Com a queda de sigilo que trouxe à tona documentos antes restritos, vieram a público mensagens de
  2022 em que o então governador do Rio, Cláudio Castro, escreveu a André Mendonça — "Amigo, preciso falar"
  — mencionando o "caso Cabral" (o ex-governador Sérgio Cabral) e encaminhando arquivos sobre pedidos de
  habeas corpus. Mendonça respondeu que ligaria em alguns minutos; dias depois, votou pela soltura de Sérgio
  Cabral. A matéria também recorda que, em julho de 2026, Mendonça já havia indeferido pedido da PF (com
  parecer favorável do PGR Paulo Gonet) para nova busca e apreensão contra Castro no âmbito do caso
  RioPrevidência/Banco Master, por entender que a representação não trazia elementos suficientes.'
notes: Verificado por WebFetch direto. Não localizado, nesta coleta, o teor completo da troca de mensagens
  além do trecho citado, nem a data exata do voto de Mendonça pela soltura de Cabral.
