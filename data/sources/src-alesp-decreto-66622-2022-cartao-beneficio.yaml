summary: Texto integral lido pela equipe no repositório oficial. Assinado por João Doria no último dia
  de seu mandato, véspera da posse do sucessor. Acrescenta ao decreto de consignações de 2014 o inciso
  XI do art. 5º — 'aquisição de bens e serviços, à vista ou financiada, assim como saques emergenciais,
  por meio de cartão de benefício, limitada a 15% da margem consignável' — e o inciso IX do art. 6º, que
  admite como consignatárias 'empresas administradoras de cartões de benefícios, conveniadas com instituições
  financeiras devidamente autorizadas pelo Banco Central do Brasil'. O art. 8º-A fixa os requisitos de
  credenciamento e o art. 3º delega ao secretário da Fazenda fixar ou alterar os limites individuais e
  globais da margem consignável.
