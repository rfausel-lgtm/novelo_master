summary: O IPSSC atribuiu a responsabilidade a falhas de fiscalização federal (Banco Central, CVM, Secretaria
  de Previdência), dizendo ter seguido 'critérios legais e técnicos rigorosos'. Marcelo Ribas de Oliveira,
  do comitê de investimentos, declarou que 'a responsabilidade primária pelo ressarcimento é daqueles
  que, por ação ou omissão, permitiram que esta crise ocorresse'.
