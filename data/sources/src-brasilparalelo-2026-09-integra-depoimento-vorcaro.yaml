summary: 'Publica a íntegra do depoimento. Dele consta que os supostos autores das ameaças estavam de
  máscara ou balaclava e são descritos genericamente como integrantes da ''Polícia Penal Estadual'' e
  da ''Polícia Federal'' — nenhum agente é nomeado. O único nome citado é o de Andrei Rodrigues, e como
  pessoa de relação cordial em eventos, não como autor das ameaças. Entre as falas que atribui aos agentes:
  ''Vai querer falar disso do chefe? Vai acontecer isso''; ''É mais fácil, de repente, jogar ele daqui'';
  ''quer mexer com os patrões, agora sua vida vai virar um inferno''.'
