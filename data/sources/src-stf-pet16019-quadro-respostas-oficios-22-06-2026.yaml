summary: 'Tabela juntada aos autos em 22/06/2026 com a situação de cada ofício expedido pela decisão de bloqueio de
  13/05/2026. Registra resposta da Marinha, da ABcripto, do Banco Central, da ANAC, da CVM, da NovaDAX e da Coinbase,
  e de oito bancos e instituições de pagamento. Das catorze corretoras de criptoativos oficiadas, dez receberam o
  ofício e não responderam (Coinext, BitcoinTrade/Ripio, BitCâmbio, BitcoinToYou, NoxBitcoin, BitBlue, Mercado
  Bitcoin, Flow, BitNuvem e Foxbit), e os avisos de recebimento da Binance e da BitPreço voltaram sem cumprimento.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente).'
