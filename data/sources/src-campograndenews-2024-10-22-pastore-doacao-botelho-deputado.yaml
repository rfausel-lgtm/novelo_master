summary: 'Trecho literal sobre Luiz Osvaldo Pastore: ''Em 2022, o ex-parlamentar também virou matéria
  de jornal por causa das doações que fez como pessoa física a campanhas. Ele havia investido R$ 300 mil
  para ajudar a eleger o advogado Augusto de Arruda Botelho (PSB) a deputado federal por São Paulo.''
  Revela que Botelho concorreu a deputado federal em 2022 (PSB-SP), candidatura não previamente registrada
  no corpus.'
