summary: 'Série completa lida pela equipe. O Decreto nº 21.048, de 14/05/2021, publicado na edição 2.909,
  acrescenta dispositivo destinando ''a margem de 20% (vinte por cento) destinada, exclusivamente para
  despesas com as operações de crédito realizadas através do Cartão do Programa Credcesta''. O extrato
  do convênio com a PKL One, assinado em 04/06/2021 com sessenta meses, saiu na edição 2.926 de 09/06/2021.
  O Decreto nº 21.935, de 24/05/2022, novo regulamento geral, repete a reserva nominal de 20% em seu §2º.
  E o Decreto nº 24.098, de 10/02/2026 — três meses após a liquidação do banco e uma semana antes da liquidação
  de seu sucessor — altera o caput para elevar a margem total a 55%, com 20% ''destinados, exclusivamente,
  à utilização de cartão de crédito consignado e de cartão consignado de benefício'': a menção nominal
  ao programa desaparece. Ressalva registrada pela apuração: o decreto de 2026 altera expressamente apenas
  o caput, e não se localizou revogação expressa do parágrafo que trazia o nome, embora haja cláusula
  genérica de revogação. Busca de texto integral pelo cadastro nacional da empresa no acervo do diário
  retorna conjunto vazio.'
