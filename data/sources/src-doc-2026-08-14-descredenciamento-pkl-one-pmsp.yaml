source_type: official_gazette
summary: Processo 6013.2025/0004957-9. A coordenação de gestão de pessoas não acolhe a defesa apresentada
  pela empresa e determina seu descredenciamento como entidade consignatária da prefeitura, por não manutenção
  dos requisitos do art. 6º e descumprimento reiterado do art. 19 do decreto municipal 58.890/2019, com
  denúncia do convênio celebrado. Assina Alisson Rodrigues Pinheiro, coordenador substituto, em 13/08/2026.
  O despacho torna sem efeito publicação de 12/08/2026, idêntica no mérito, que trazia a razão social
  errada — 'PKL One Administrações S.A' — com o CNPJ correto.
