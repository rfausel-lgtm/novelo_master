summary: Representação administrativa protocolada no Banco Central pedindo medidas cautelares e abertura
  de procedimentos de fiscalização contra CredCesta, PKL One e Banco Master. Sustenta que a PKL One 'nunca
  foi credenciada no banco central' e questiona a criação de margens adicionais por decreto, a contratação
  por meios digitais, os juros praticados e a exclusividade operacional conferida à empresa. Registra
  caso de servidor com saldo líquido de R$ 2,83 ao fim do mês.
