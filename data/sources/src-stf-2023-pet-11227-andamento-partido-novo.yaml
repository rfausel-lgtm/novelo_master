summary: 'Consulta direta da equipe. Notícia-crime do Partido Novo contra o general Marco Edson Gonçalves
  Dias pelos fatos de 8 de janeiro, protocolada em 20/04/2023 — um dia depois da petição do deputado Leandro
  de Jesus — e igualmente distribuída a Alexandre de Moraes por prevenção da Pet 10.829. Processo PÚBLICO.
  Teve tramitação regular: despacho de vista à PGR em 12/05/2023, manifestação da PGR em 13/06/2023 e
  arquivamento em 15/08/2023, com dispositivo publicado e trânsito em julgado em 23/08/2023 — 117 dias
  entre protocolo e decisão.'
