summary: Edição de 46 páginas baixada e lida pela equipe. Publica o Decreto nº 0757, de 11/02/2026, que
  exonera Jocildo Silva Lemos, a pedido, do cargo de diretor-presidente da Amapá Previdência. O expediente
  da edição lista a Amprev sob a rubrica 'Serviço Social Autônomo' e registra Alberto Samuel Alcolumbre
  Tobelem ainda como titular da Junta Comercial do Estado.
