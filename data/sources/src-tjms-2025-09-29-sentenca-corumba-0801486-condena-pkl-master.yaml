summary: Inteiro teor lido pela equipe na base pública de julgados. Magistrado Alan Robson de Souza Gonçalves.
  Condena solidariamente a PKL One Participações S.A. e o Banco Master S.A. a limitar os descontos mensais
  em folha, a título de 'Cartão Benefícios PKL Saque' ou rubrica equivalente, a 5% da remuneração bruta
  consignável. Réus também incluíam Caixa Econômica Federal, Bradesco e Vólus.
