summary: 'Petição de 4 páginas, protocolada em 14/09/2026, suscitando questão de ordem para que o Plenário
  julgue primeiro a Arguição de Suspeição nº 253 (já apresentada por ele em 08/09/2026 contra André Mendonça,
  já no acervo desde o lote 304) antes de prosseguir com a sessão extraordinária de 15/09/2026. Pede,
  alternativamente, o sobrestamento de todo o feito principal até a deliberação sobre a suspeição.'
notes: Peça obtida via peticionamento.stf.jus.br (sessão autenticada de Rafael). Botelho já é investigado na
  Compliance Zero e já havia apresentado a arguição de suspeição em si (lote 304) — esta petição é a
  escalada processual pedindo que ela seja julgada antes da sessão de hoje.
