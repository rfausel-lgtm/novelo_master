summary: Texto oficial lido pela equipe. Altera o Decreto nº 17.251/2016 para admitir como consignatárias
  'pessoas jurídicas privadas que administrem ou ofertem serviços comerciais, creditícios, financeiros',
  condicionadas a contrato específico com o Estado, com margem de 30% e teto de 50% dessa margem para
  serviços financeiros.
