summary: Edição 3.045, ano 13, páginas 2 a 13 — caso incomum em que o município publicou as onze páginas
  do instrumento, e não apenas o extrato. Assinado digitalmente em 24/11/2021, com registro de horário
  para cada signatário, entre a PKL One, representada por Marcos Oliveira Calmon de Bittencourt e Andrea
  Lima Novaes, e o município, representado pelo prefeito Oberdan Rocha Dias. Vigência de sessenta meses
  improrrogáveis, denúncia mediante aviso prévio de noventa dias, foro da comarca do aderente. O município
  já editara, em 08/06/2021, decreto prevendo linha de crédito rotativo pelo Cartão de Crédito Consignado
  Credcesta.
