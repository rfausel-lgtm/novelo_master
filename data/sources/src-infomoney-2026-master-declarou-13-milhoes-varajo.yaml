summary: Segundo a Dirf enviada pelo Banco Master à Receita Federal e obtida pela comissão de investigação,
  os pagamentos declarados à Varajo somam R$ 1,3 milhão — R$ 309,8 mil em 2024 e R$ 1 milhão em 2025 —,
  lançados como prestação de serviços entre empresas. O valor diverge dos cerca de R$ 4 milhões apurados
  em contratos pela sindicância do Banco Central.
