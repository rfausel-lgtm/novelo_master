source_type: press
language: pt-BR
summary: 'Jornal de Brasília (29/12/2025): o STF informou nesta segunda-feira (29) que o procedimento
  começaria com o depoimento dos intimados e que, se a PF considerasse não haver contradições a esclarecer,
  não haveria acareação; a audiência seria a portas fechadas e conduzida pela delegada responsável pelo caso;
  registra que a PGR havia se manifestado contra a acareação antes dos depoimentos individuais e que, ao
  manter o ato, Toffoli definiu o BC e o diretor como "terceiros interessados".'
notes: Assinado "Redação Jornal de Brasília", com o crédito "Estadão Conteúdo" ao final; conta como uma fonte
  (Estadão). A afirmação de que Toffoli "definiu" BC e diretor como terceiros interessados difere do despacho
  de 27/12, segundo o qual os próprios embargantes assim se qualificaram, alternativamente. A parte sobre o
  TCU, a nota de entidades financeiras e os nomes de servidores não entram neste lote.
