summary: Em 18/06/2026 a PF deflagrou a 9ª fase da Compliance Zero, com 18 mandados de busca (BA, SP e
  DF) autorizados por André Mendonça, tendo entre os alvos o senador Jaques Wagner e Augusto Ferreira
  Lima; apura corrupção passiva e ativa e lavagem. Wagner não respondeu ao veículo; o presidente do PT
  declarou confiança no senador.
