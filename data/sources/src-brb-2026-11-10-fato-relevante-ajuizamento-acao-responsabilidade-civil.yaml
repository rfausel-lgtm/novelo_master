summary: Comunicado do BRB ao mercado, datado de 10/11/2026, em que o banco informa ter ajuizado nessa data
  ação social de responsabilidade civil contra sete ex-administradores, com pedidos de natureza patrimonial em
  relação a seis empresas e pedido liminar de indisponibilidade de bens. É documento do autor da ação; prova o
  que o BRB declarou ter feito e pedido, não os fatos que alega. Número do processo, vara e juízo não constam
  do comunicado.
notes: Documento do próprio BRB (classe D). Não traz manifestação dos demandados nem decisão judicial.
  Republicações na imprensa (11/11/2026) não foram registradas por não acrescentarem apuração própria.
