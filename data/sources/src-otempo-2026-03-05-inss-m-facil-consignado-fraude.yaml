source_type: press
summary: Registra que o Banco Master operava, entre 2020 e 2025, o produto de consignado 'M Fácil Consignado'
  (rebatização do CredCesta, criado por Augusto Lima) dentro de convênio do INSS. Análise conjunta INSS/CGU
  identificou indícios de fraude nesses contratos — nomes duplicados, ausência de assinatura do segurado,
  taxas não informadas.
