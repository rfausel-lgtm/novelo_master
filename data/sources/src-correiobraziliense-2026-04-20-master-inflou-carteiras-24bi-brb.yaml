source_type: press
summary: 'Reportagem de 20/04/2026 sobre documento da PF: entre julho de 2024 e janeiro de 2025, o Banco Master
  vendeu ao BRB carteiras de crédito com valor contábil de R$ 7,5 bilhões por R$ 9,9 bilhões — ágio de R$ 2,4 bilhões,
  ou 32% —, com carteiras individuais infladas em até 93% acima do valor contábil. Aponta Daniel Vorcaro como principal
  responsável pela estratégia, com base em mensagens extraídas de seu celular que mostrariam pressão sistemática
  para obter recursos do banco estatal antes da formalização pública da compra.'
