summary: Relatório de sobrevoo de drone identificando um imóvel de veraneio no distrito de Trancoso, Porto
  Seguro (BA), por comparação entre fotos aéreas do local e fotos públicas na conta de Instagram de Cláudia
  Resende Soares da Silva, nas quais aparecem Felipe Cançado Vorcaro e Karina Resende Oliveira Vorcaro.
notes: 'Peça 27 (anexo à peça 26) de 50 obtidas por Rafael via certificado digital no peticionamento
  eletrônico do STF (pasta local "Pet 15198-1_50") — mesma política de divulgação já aplicada às demais
  peças obtidas por certificado. O acervo registra apenas a localidade (distrito/município) do imóvel,
  nunca endereço, coordenadas ou características que permitam sua identificação exata — convenção editorial
  já aplicada a todos os demais alvos de busca do caso. Rodapé de impressão com CPF de quem baixou o
  documento nunca reproduzido no acervo.'
