summary: Informa que o relator Jhonatan de Jesus alterou a classificação de sigilo de documentos do processo
  de "sigiloso" para "sigiloso com exigência de autorização específica para acesso", que o BC poderia ter
  acesso mediante pedido formal ao gabinete e que, após recurso do BC ao plenário, o relator recuou em parte e
  suspendeu a inspeção até manifestação do plenário. A matéria não atribui justificativa ao relator para a
  mudança.
