summary: Relatório de Estabilidade Financeira do BC (Comef) conclui que a liquidação do conglomerado Master
  não gerou risco sistêmico; as instituições representavam 0,57% do ativo total e 0,55% dos depósitos
  do SFN. Registra também que o FGC desembolsou R$ 37,7 bilhões entre 19/01 e 27/02/2026.
