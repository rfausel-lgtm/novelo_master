summary: 'Texto de autoria do parlamentar que sintetiza o levantamento feito por seu gabinete, à frente
  da Comissão de Servidores Públicos: 156.936 contratos ligados a Master e PKL One, cerca de R$ 5,5 bilhões,
  14,24% de todas as consignações do Estado; análise de 195 contracheques, com 60% apresentando descontos
  acima de metade da remuneração bruta; e referência ao ''comprometimento de até 100% da renda líquida
  dos servidores''. Elenca sete recomendações, entre elas piso de R$ 600 líquidos e envio de documentos
  a Banco Central, TCE-RJ, Ministério Público e Polícia Federal.'
