summary: Informa que depoimentos prestados à PF por ex-funcionários de Vorcaro em Angra dos Reis foram
  tornados públicos em 17/06/2026 pelo relator, ministro André Mendonça. Relata o depoimento do ex-chef
  Leandro Garcia e, em trecho final, o do capitão do iate, Luis Felipe Woyceichoski, que teria dito ter sido
  ameaçado de morte depois de registrar danos causados à embarcação, e atribui a "Manoel" uma abordagem
  intimidatória. Cita mensagens obtidas pela PF em que Vorcaro pede para "irem pra cima" do chef e do capitão.
notes: A fonte é usada apenas para o depoimento do capitão; o relato do chef não é registrado neste lote.
