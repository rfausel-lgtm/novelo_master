summary: Na Pet 15978, o ministro André Mendonça decretou a prisão preventiva de Henrique Vorcaro, pai
  de Daniel Vorcaro, e de outros seis investigados ligados aos núcleos chamados pela PF de 'A Turma' e
  'Os Meninos'; segundo a PF, Henrique seria o principal operador financeiro do grupo. Afastou uma delegada
  e um agente da PF suspeitos de repassar dados do e-Pol. Todas as medidas tiveram parecer favorável do
  MPF.
