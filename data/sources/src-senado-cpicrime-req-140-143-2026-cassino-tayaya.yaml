summary: 'Dois requerimentos de teor idêntico, assinados eletronicamente pelo senador Magno Malta e outros, que convocam
  José Eugênio Dias Toffoli (140/2026) e José Carlos Dias Toffoli (143/2026) a depor na CPI do Crime Organizado do
  Senado. A justificação cita reportagem do Metrópoles de 21/01/2026 sobre possível exploração de jogos de azar no Resort
  Tayayá, no Paraná — jogos de cartas com apostas em dinheiro, "dealers", ausência de controle de acesso e presença de
  crianças —, registra ofícios enviados ao Ministério Público e à Polícia Civil do Paraná e pede a oitiva dos "atuais e
  anteriores proprietários e administradores" do resort.'
notes: 'PDFs oficiais com código de autenticação do Senado, obtidos por uma sessão paralela do projeto e lidos aqui na
