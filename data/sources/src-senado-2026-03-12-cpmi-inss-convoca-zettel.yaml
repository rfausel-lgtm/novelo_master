source_type: official_legislative
summary: 'Aprovação do REQ 3.044/2026, do deputado Duarte Jr. (PSB-MA), convocando Fabiano Zettel para
  esclarecer possível envolvimento dos negócios familiares, do Banco Master, de igrejas e outros empreendimentos
  com as fraudes do INSS. A convocação nunca se converteu em depoimento: a CPMI encerrou-se em 28/03/2026
  sem relatório final aprovado.'
