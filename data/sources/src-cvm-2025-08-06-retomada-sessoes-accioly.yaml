summary: Na sessão de 05/08/2025, a CVM retomou o julgamento de dois processos com retorno de vista do
  diretor João Accioly — PAS 19957.008804/2023-81 (PwC Auditores Independentes e Marcos Paulo Putini) e
  PAS 19957.004388/2023-41 (Bluebenx Tecnologia Financeira). O PAS 19957.008699/2019-01 (Benjamim Botelho
  de Almeida e outros, PAS 03/2016) não está entre eles.
