summary: Registra o rebaixamento sucessivo do rating do próprio Banco Master pela Fitch entre setembro
  e novembro de 2025, culminando em 'D' após a liquidação — em contraste com a elevação da nota nacional
  do banco para 'A-(bra)' pela mesma agência em outubro de 2024, avaliação que teria contribuído para
  autorizar cerca de R$ 1,876 bilhão de fundos de pensão públicos a investir em letras financeiras do
  Master sem garantia do FGC.
