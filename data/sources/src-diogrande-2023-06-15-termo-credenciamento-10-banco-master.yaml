summary: 'Edição nº 7.084, página 15. Achado que corrige uma suposição corrente: na capital sul-mato-grossense
  o credenciamento não foi da operadora, e sim do próprio banco. O termo, de 26/05/2023, foi aditado em
  26/05/2025 para vigorar até 25/05/2027, e o aditivo é assinado pelo banco por Marcos Oliveira Calmon
  de Bittencourt — o mesmo que assina pela operadora em Corumbá, em Macapá e nos convênios baianos e pernambucanos.
  Busca de texto integral no diário municipal, de 2015 a 2026, não retornou nenhuma ocorrência da operadora,
  do produto ou de seu cadastro nacional. O instituto de previdência municipal credenciou o banco por
  termo próprio, cujo prazo expirou por decurso em 31/01/2026, sem renovação e sem rescisão.'
