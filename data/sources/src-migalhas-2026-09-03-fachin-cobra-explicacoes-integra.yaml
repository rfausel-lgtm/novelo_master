summary: Despacho de Fachin, com aditamento em 04/09, dando 5 dias úteis (prazo comum, não sequencial)
  a Moraes, Mendonça, Gonet e Andrei Rodrigues para esclarecer pontos sobre a conduta da PF. O despacho
  enfatiza expressamente que as medidas têm 'caráter estritamente instrutório, sem representar qualquer
  antecipação de posicionamento do Tribunal'.
