source_type: press
summary: 'Em entrevista à Folha de S.Paulo, Wagner admitiu proximidade com Augusto Lima mas negou favorecimento
  ilícito (''aceitar caronas em voos particulares não configura crime''); classificou a ação da PF de
  18/06/2026 como ''espetacularização'' e ''patacoada''; disse ter reclamado a Lula; e acusou o STF de
  encenar a divulgação da apreensão de dinheiro: ''A ordem do André Mendonça fala explicitamente para
  não ter fotografias. Eles foram ao quarto de hotel onde eu moro, botaram lá em cima da cama [as notas
  de dólares e euros] com o escudinho [da PF] e fotografaram. Estão reinventando a Lava Jato.'''
