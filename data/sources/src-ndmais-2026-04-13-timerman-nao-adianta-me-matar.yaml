title: '''Não adianta me matar'': gestor que apontou ''dono do banco Master'' diz ter provas com advogados'
publisher: ND Mais
publication_date: '2026-04-13'
url: https://ndmais.com.br/politica/caso-master-gestor-que-apontou-dono-do-banco-diz-ter-provas-com-advogado/
source_type: press
summary: Em entrevista à Folha de S.Paulo, logo após seu depoimento à CPI do Crime Organizado (março de
  2026), Vladimir Timerman, relatando preocupações com sua segurança pessoal, disse "Do que adianta me
  matar? Todas as informações que eu tenho meus advogados e meus sócios têm, não adianta me matar" —
  afirmando ter compartilhado com advogados e sócios todas as informações sensíveis que possui sobre os
  bastidores do Banco Master.
