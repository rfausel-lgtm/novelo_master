summary: 'A PF caracteriza a sequência de contatos entre Wagner e Augusto Lima em torno da Emenda 11 como
  "um padrão de acompanhamento direto, por Senador Jaques Wagner, de pauta legislativa de interesse" do
  Master, e descreve a relação como aparentemente unidirecional: "o Senador recebe ou solicita vantagens
  ou favores, e o empresário os concede". Reproduz mensagem do próprio Wagner a Lima, de agosto de 2024:
  "Vamos marcar, que eu precisava conversar com você pra saber como estão as coisas do banco".'
