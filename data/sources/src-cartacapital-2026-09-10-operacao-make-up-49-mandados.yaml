source_type: press
summary: Registra que a Polícia Federal deflagrou na manhã de 10/09/2026 a Operação Make Up, com 49 mandados de
  busca e apreensão expedidos pelo ministro Flávio Dino, tendo entre os alvos o deputado federal Mário Frias, roteirista
  e produtor executivo de 'Dark Horse', e Karina Gama. Descreve o objeto como apuração de possível desvio de recursos
  públicos por meio de emendas parlamentares e lista os crimes apurados.
notes: O arquivo em PDF que a reportagem publica sob o rótulo da decisão da operação é, na verdade, a decisão de
  09/09/2026 sobre a reintegração do diretor-geral da Polícia Federal, nos mesmos autos — outro documento, já registrado
  no acervo. A íntegra da decisão da operação foi obtida pela equipe por outra via.
