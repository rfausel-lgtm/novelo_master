summary: Reportagem que, segundo a própria publicação, mostra que o gabinete de Alexandre de Moraes e
  a Corregedoria Nacional de Justiça mobilizaram tribunais de todo o país para cruzar seus quadros de
  pessoal com uma lista de 2.119 CPFs extraídos de processos ligados ao 8 de Janeiro, entre os quais o
  de Flávio Dino, retirado da Pet 11.228. Publicada simultaneamente, em inglês, pelo Public, de Michael
  Shellenberger. A alegação factual central não foi confirmada nem desmentida por nenhuma instituição.
