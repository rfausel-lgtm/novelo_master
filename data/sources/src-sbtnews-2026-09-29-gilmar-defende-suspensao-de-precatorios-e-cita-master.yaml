author: Basília Rodrigues e José Matheus Santos
publication_date: '2026-09-29'
url: https://sbtnews.sbt.com.br/colunas/coluna-da-basilia/gilmar-defende-suspensao-de-precatorios-e-cita-master-2
source_type: press
language: pt-BR
summary: >-
  Segundo a coluna, o ministro Gilmar Mendes encaminhou ofícios aos presidentes do STF, Edson Fachin, e do STJ,
  Luís Salomão, defendendo a suspensão de precatórios ainda sem trânsito em julgado. A coluna transcreve
  trechos atribuídos ao decano, entre eles que as investigações sobre o Banco Master "revelaram um modelo de
  negócios parasitário, que drenava recursos públicos e a poupança de milhares de investidores", a sugestão de
  correição extraordinária da Corregedoria Nacional de Justiça em todos os tribunais regionais federais,
  "sobretudo no TRF-1", com foco nos precatórios do setor sucroalcooleiro e da revisão da tabela do SUS
  (Tunep), e que "o primeiro passo deva ser sustar todas as decisões que determinaram indevidamente a
  expedição de precatório antes do trânsito em julgado". Os ofícios não são reproduzidos.
notes: >-
