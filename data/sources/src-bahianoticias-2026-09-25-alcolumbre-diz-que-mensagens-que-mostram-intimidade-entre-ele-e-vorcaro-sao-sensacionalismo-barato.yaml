title: Alcolumbre diz que mensagens que mostram intimidade entre ele e Vorcaro são "sensacionalismo barato"
publisher: Bahia Notícias
author: Edu Mota
publication_date: '2026-09-25'
url: https://www.bahianoticias.com.br/noticia/321540-alcolumbre-diz-que-mensagens-que-mostram-intimidade-entre-ele-e-vorcaro-sao-sensacionalismo-barato
source_type: press
language: pt-BR
summary: >-
  Registra a nota enviada pela assessoria de Davi Alcolumbre na noite de 24/09/2026 sobre matéria de capa da
  revista Veja, cuja edição chegou às bancas em 25/09. Segundo o texto, a Veja publicou mensagens que teriam
  sido extraídas pela PF do celular de Daniel Vorcaro, uma de 01/02/2025 e outra do fim de março de 2025. Na
  nota, Alcolumbre fala em "injusto ataque ao Presidente do Congresso Nacional", em supostas mensagens "de teor
  pessoal, inclusive de terceiros, que não indicam ilegalidade alguma", e anuncia medidas judiciais. O texto não
  trata de fundos de previdência, da Amprev nem de nomeações.
notes: >-
  Publicada às 07h35 de 25/09/2026. "Sensacionalismo barato", no título, são palavras da nota de Alcolumbre. A
  Veja não foi aberta pela equipe; o que se registra da matéria é a descrição deste veículo. O Novelo não
  reproduz o teor das mensagens.
