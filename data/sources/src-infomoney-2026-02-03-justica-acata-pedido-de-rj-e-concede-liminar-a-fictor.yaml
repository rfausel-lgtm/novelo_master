summary: Informa que a Justiça de São Paulo concedeu liminar parcial ao Grupo Fictor, antecipando por 30 dias
  o stay period no pedido de recuperação judicial da holding e da Fictor Invest, em decisão do juiz Adler
  Batista Oliveira Nobre, da 3ª Vara de Falências e Recuperações Judiciais, que suspende novas execuções e
  atos de constrição e mantém os bloqueios já feitos. Registra nota do grupo segundo a qual a decisão assegura
  ambiente jurídico estável para negociar com credores.
