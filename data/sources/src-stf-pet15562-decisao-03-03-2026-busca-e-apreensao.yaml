source_type: official_court
summary: 'Acolhe representação da Polícia Federal e defere busca e apreensão domiciliar e busca pessoal contra os
  alvos listados nas fls. 158-159 da representação e nas fls. 1-2 do e-Doc. 16. Descreve o papel atribuído pela PF a
  Daniel Vorcaro, Fabiano Zettel, Luiz Phillipi Mourão, Marilson Roseno da Silva, Paulo Sérgio Neves de Souza,
  Belline Santana, Leonardo Augusto Furtado Palhares e Ana Cláudia Queiroz de Paiva, e a cinco empresas (Varajo
  Consultoria, Moriah Asset, Super Empreendimentos, King Participações Imobiliárias e King Motors). Defere também
  busca contra Luís Felipe Woyceichoski, que a decisão diz não ser investigado, com a finalidade exclusiva de
  apreender vídeos e contatos sobre a atuação da "Turma". Indefere pedido de dilação de prazo da PGR, protocolado
  depois de esgotadas as 24 horas de vista.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). Decisão de 20 páginas. Os endereços dos alvos estão na representação
  policial, que não integra a peça lida, e não são reproduzidos no acervo.'
