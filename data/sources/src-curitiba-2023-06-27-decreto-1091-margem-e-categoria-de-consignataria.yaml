source_type: official_gazette
summary: 'Texto oficial lido pela equipe; protocolo 04-027913/2023, assinado pelo prefeito Rafael Greca.
  Executa num único ato quatro movimentos: reserva margem de 10% exclusiva para cartão consignado de benefício;
  determina que esses descontos ''não estará limitado aos percentuais definidos no caput'', replicando
  a lógica da não concorrência adotada em Mato Grosso; cria a categoria de consignatária ''empresas administradoras
  de cartão de crédito/benefício''; e dispensa expressamente essa nova categoria de uma das etapas do
  credenciamento. Em sentido contrário, acrescenta requisitos de sede ou filial no município e de certificado
  de autorização do Banco Central — a empresa mantinha filial em Curitiba desde 19/08/2021. Não foi possível
  estabelecer se a dispensa do art. 5º neutraliza a exigência do art. 6º, porque o texto-base do decreto
  de 2011 não está acessível. Fixa ainda custo efetivo total máximo de 4,5% ao mês e prazo de 72 meses.'
