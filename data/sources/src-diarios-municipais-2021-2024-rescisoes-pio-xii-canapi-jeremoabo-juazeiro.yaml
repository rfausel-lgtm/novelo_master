summary: Conjunto de atos localizados pela equipe. Pio XII, no Maranhão, rescindiu unilateralmente em
  30/08/2021 o Contrato de Credenciamento nº 0065/2021, firmado em 17/05/2021. Canapi, em Alagoas, rescindiu
  unilateralmente em 01/02/2022 o contrato de 26/10/2021 — e o extrato traz, como linha de assinatura,
  'BANCO MASTER S/A'. Jeremoabo, na Bahia, rescindiu unilateralmente o Convênio nº 004/2021 em 15/06/2022.
  Em Juazeiro, também na Bahia, foi a própria operadora quem rescindiu, em 25/04/2024. Lauro de Freitas
  suspendeu e restabeleceu o convênio três vezes entre 2022 e 2023, por descumprimento de margem. Todas
  essas rupturas são anteriores às liquidações e têm motivos próprios, alheios a elas.
