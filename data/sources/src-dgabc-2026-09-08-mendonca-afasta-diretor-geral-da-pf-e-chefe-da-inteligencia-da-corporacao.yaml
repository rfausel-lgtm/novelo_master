summary: Informa que Mendonça determinou, em 08/09/2026, o afastamento preventivo do diretor-geral da PF,
  Andrei Passos Rodrigues, e do diretor de inteligência, Leandro Almada da Costa, e que a Corregedoria da PF
  abra procedimentos penal e disciplinar sobre relatórios de inteligência. Registra que o Estadão pediu
  manifestação do delegado e que o espaço está aberto.
notes: Republicação de matéria do Estadão; a página não indica o prazo do afastamento.
