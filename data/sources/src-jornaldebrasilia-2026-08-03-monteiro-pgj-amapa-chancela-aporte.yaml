title: Chefe do Ministério Público do Amapá chancelou novo aporte no Master após dar voto contrário por risco
publisher: Jornal de Brasília
publication_date: '2026-08-03'
url: https://jornaldebrasilia.com.br/noticias/politica-e-poder/chefe-do-ministerio-publico-do-amapa-chancelou-novo-aporte-no-master-apos-dar-voto-contrario-por-risco/
source_type: press
summary: 'Alexandre Flávio Medeiros Monteiro, conselheiro do CIAP que votou contra um aporte de R$ 100
  milhões no Master em 19/07/2024, é hoje o Procurador-Geral de Justiça do Amapá, empossado em
  10/03/2025. Em 30/07/2024 — dias depois do voto contrário, e depois de a Caixa Econômica Federal ter
  rejeitado R$ 500 milhões em letras do Master por risco —, votou, por unanimidade, a favor de um
  terceiro aporte de R$ 100 milhões, dizendo-se "mais tranquilo" com a "diversificação" do investimento,
  citando pareceres técnicos que atestavam a "solidez" do banco.'
