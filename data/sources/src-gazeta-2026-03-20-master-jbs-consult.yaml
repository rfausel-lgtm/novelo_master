summary: 'Com base em dados do Coaf (via Estadão): R$ 6,6 milhões do Master e R$ 11,3 milhões da JBS à
  Consult Inteligência Tributária entre agosto de 2024 e julho de 2025, classificados como atípicos por
  incompatibilidade com o faturamento declarado (R$ 25,5 mil); 11 transferências somando R$ 281,6 mil
  a Kevin de Carvalho Marques, que afirmou tratar-se de atuação profissional lícita ''voltada ao fisco
  administrativo''.'
