summary: 'O governador de Goiás, Ronaldo Caiado, criticou publicamente Alexandre de Moraes em 10/09/2026,
  11h47, depois que o ministro anunciou e cancelou minutos depois um pronunciamento público: "Alexandre de
  Moraes anuncia pronunciamento e cancela minutos depois, é a dificuldade de tentar explicar o inexplicável.
  O que queremos mesmo é a abertura de TODOS os sigilos do Banco Master: ministro, presidente, candidato,
  senador… todos!" O pronunciamento cancelado seria o primeiro de Moraes desde que Fachin o afastou da
  relatoria do Inquérito das Fake News.'
notes: Verificado por WebFetch direto. Não identificado a quem exatamente Caiado se refere com "presidente,
  candidato, senador" — pode ser cobrança genérica, não menção a pessoas específicas.
