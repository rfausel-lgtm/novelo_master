summary: Edição nº 9.158, página 56, publicada no dia seguinte à liquidação extrajudicial do banco. Edital
  de auxílio-bolsa da prefeitura descreve a margem disponível do servidor como '30% de margem referente
  a disponibilidade de 10% credcesta, 10% associação e 10% do benefício de bolsa'. O documento não trata
  do produto, mas o nomeia como rubrica corrente da folha — prova de que a reserva seguia operante na
  capital baiana no dia seguinte à liquidação.
