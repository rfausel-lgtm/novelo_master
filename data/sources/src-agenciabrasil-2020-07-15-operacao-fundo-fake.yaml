source_type: press
summary: 'Reproduz a nota da Polícia Federal sobre a Operação Fundo Fake, deflagrada em 15/07/2020 com
  cerca de 200 policiais e 71 mandados de busca e apreensão expedidos pela 3ª Vara Federal de Porto Velho
  (RO), em RO, SP, RJ, GO e MG. Registra prejuízo apurado em laudos periciais de R$ 17,4 milhões somente
  ao RolimPrevi; que 65 outros institutos de previdência do país aplicaram em fundos administrados por
  uma das instituições investigadas; cerca de R$ 500 milhões de RPPS aportados nos fundos, objeto de bloqueio
  judicial; e a suspensão de cadastro de 18 CPFs e CNPJs. O modelo descrito é o do ''rebate'': a consultoria
  contratada indicava os fundos e, dias após o aporte, recebia de volta parte do dinheiro — em alguns
  casos mais de 20% do valor aplicado —, repassando parcela a gestores do RPPS.'
