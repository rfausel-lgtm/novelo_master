summary: 'Informação de Polícia Judiciária de Análise, de 126 páginas, sobre o conteúdo extraído do iPhone
  17 Pro apreendido com Daniel Bueno Vorcaro no cumprimento do mandado de prisão da 1ª fase da Operação
  Compliance Zero. É o documento-fonte que as representações da PF vinham citando como "IPJ nº 1020625/2026":
  aqui estão, em primeira mão, os diálogos de WhatsApp entre Vorcaro e Luiz Phillipi Mourão que sustentam
  os capítulos de acesso indevido a procedimentos sigilosos, uso de violência e coação, articulação com
  estruturas criminosas, manipulação de perfis em redes sociais, supressão de conteúdo digital e
  fabricação de avaliações em aplicativos. O capítulo final (4.2) trata do monitoramento de autoridades,
  da tentativa de influência sobre agentes públicos, da obstrução à Justiça e da hipótese de plano de
  fuga — e traz material que não aparece em nenhuma outra peça já lida do acervo: as anotações que o
  próprio Vorcaro mantinha no aplicativo "Notas" do aparelho, algumas apagadas minutos após escritas e
  recuperadas na extração.'
notes: 'Documento obtido pelo próprio Rafael via certificado digital, parte do download completo da PET
  15.978 (378 peças) — mesma política de divulgação aplicada às demais peças. O cabeçalho da IPJ-A traz
  "Data 19/02/2025", mas o texto cita reportagem de fevereiro de 2026 e fatos de 2025 e 2026: trata-se,
  ao que tudo indica, de erro de digitação do ano, e por isso a data foi registrada com precisão de mês
  (fevereiro de 2026), não de dia.'
