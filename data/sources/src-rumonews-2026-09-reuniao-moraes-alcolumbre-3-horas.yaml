source_type: press
summary: 'Relata que, em 02/09/2026, Alexandre de Moraes e Davi Alcolumbre se reuniram por cerca de três
  horas na residência do senador, no Lago Sul (Brasília) — "o encontro reservado ocorreu na residência
  do parlamentar" —, horas antes de Moraes protocolar sua ofensiva formal contra André Mendonça. O artigo
  não detalha o conteúdo da conversa, mas nota que Alcolumbre saiu em defesa pública do magistrado horas
  depois.'
