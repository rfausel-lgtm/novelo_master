summary: 'Resume trecho do relatório da PF da 9ª fase: em 17/07/2024, Fernando Mascarenhas Filho, diretor comercial
  do Banco Master, respondeu a Vorcaro, em conversa sobre o banco ser visto como próximo do governo, "Vou mandar
  então pra tio guiga e Jaques". Identifica Guilherme Sodré como publicitário baiano e aliado próximo de Jaques
  Wagner.'
