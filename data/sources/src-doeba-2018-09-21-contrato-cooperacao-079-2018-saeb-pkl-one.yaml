summary: 'Página 48. Mesmo processo do credenciamento. Objeto: oferta de produtos e serviços a servidores
  civis e militares, ativos, inativos e pensionistas, por meio do Cartão do Programa Credicesta, ''inclusive
  comerciais, creditícios, financeiros, securitários e congêneres'' — reproduzindo a fórmula do art. 3º
  do decreto. Fundamenta-se expressamente nos Decretos nº 18.353/2018 e nº 17.251/2016. Vigência de 48
  meses, assinatura em 20/09/2018. Foi renovado pelo Contrato nº 080/2022, assinado em 21/09/2022 — último
  ato estadual sobre o programa localizado no diário baiano, sem registro entre 2023 e 2026.'
