source_type: press
summary: 'Perfil de Eduardo Sodré. Registra que ele e o pai, Guilherme Sodré, "são atualmente sócios de duas empresas:
  uma firma de serviços administrativos e uma patrimonial", que a patrimonial MMSM é sócia de empresa do setor de
  energia, e que um livro sobre o pai de Guilherme, o coronel Geraldo Sodré Martins, "foi lançado em 2022 em Salvador
  com patrocínio do banco de Daniel Vorcaro". Menciona ainda que Guilherme foi investigado em 2008 por suposta atuação
  como lobista de Daniel Dantas, com provas depois anuladas.'
