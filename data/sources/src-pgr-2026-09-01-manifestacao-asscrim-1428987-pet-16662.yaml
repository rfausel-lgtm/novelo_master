summary: 'Íntegra assinada pelo procurador-geral da República, lida pela equipe. Sustenta a nulidade da
  ordem de investigação e de seus resultados. Trechos centrais: ''Não importa o grau de investigação que
  a providência constitui, é inegável que houve imersão em elementos dos autos para buscar indicativos
  de envolvimento do Ministro Alexandre de Moraes em ilícitos''; ''Ao juiz não cabe acusar, menos ainda
  ao juiz cabe realizar investigações pré-processuais. Não lhe é dado valer-se da polícia judiciária como
  sua longa manus para atividades que não lhe foram assinaladas''; e ''compete ao Plenário do Supremo
  Tribunal Federal investigar os seus integrantes''. Quantifica o foco do relatório policial: ''quase
  190 páginas das 218 que compõem o estudo policial'' dedicadas ao ministro. O pedido final é dirigido
  ao relator, não ao Plenário: ''Sendo nula a ordem e o seu resultado, cabe ao relator reconhecê-lo e
  extinguir a Petição''.'
