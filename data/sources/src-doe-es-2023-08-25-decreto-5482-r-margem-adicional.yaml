summary: Página 11, processo 2019-1K62N. Acrescenta ao decreto capixaba de consignações o inciso VIII
  do art. 5º — 'amortização de débitos oriundos de operações de compras e saque emergencial, realizados
  através de cartão consignado de benefício' — e o parágrafo único do art. 8º, que admite 'margem adicional
  equivalente a 10% (dez por cento), além da prevista no caput'. Assinado pelo governador José Renato
  Casagrande. É posterior em quase um ano ao credenciamento da PKL One pela Assembleia Legislativa capixaba,
  de 15/09/2022, e a operação nunca passou pelo Executivo estadual.
