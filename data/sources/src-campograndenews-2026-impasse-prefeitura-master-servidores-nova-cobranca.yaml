source_type: press
summary: 'Reporta que a prefeitura e o instituto de previdência municipal obtiveram liminar na 3ª Vara
  de Fazenda Pública determinando a retenção de repasses em conta judicial como garantia de valores aplicados
  em letras financeiras do banco, e que a decisão determinou que a instituição se abstivesse de cobrar
  ou negativar os servidores — único registro localizado de tutela explícita contra negativação. Documenta
  ainda efeito colateral da liquidação: a nova gestão reprocessou as bases e reenviou listas automatizadas
  ao setor de pessoal, restabelecendo descontos sobre contratos já quitados. Uma servidora que quitara
  o contrato em janeiro de 2026 teve R$ 293,46 descontados em agosto; ao reclamar, ouviu que ''enquanto
  o banco mandar vai ser descontado'', e o telefone do banco ''não existe''. O repasse municipal mensal
  é de cerca de R$ 1 milhão.'
