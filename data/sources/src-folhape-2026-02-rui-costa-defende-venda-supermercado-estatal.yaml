summary: 'Declarações do ex-governador da Bahia sobre a privatização: ''Eu vendi um supermercado falido,
  vocês acompanharam. Teve (leilão) três vezes, só consegui vender na terceira vez, um supermercado que
  dava quase R$ 200 milhões de prejuízo todo ano''. E sobre o cartão: ''Se não (estivesse inclusa a operação
  do cartão), nem tinha vendido. Se alguém pagou uma merreca de R$ 15 milhões, é porque tinha o cartão''.'
