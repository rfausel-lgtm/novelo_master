summary: Integrantes do Conselho Superior do Ministério Público Federal, ouvidos sob reserva, falam em
  'desânimo' após o chefe da instituição ser citado no relatório da PF, avaliam que o pedido de nulidade
  das investigações feito por Gonet é impróprio e defendem que o inquérito fique com o vice-procurador-geral,
  Hindemburgo Chateaubriand. A decisão final é do próprio procurador-geral.
