summary: 'Comunicado de 27/11/2025 informando o bloqueio, a partir de 24/11/2025, de novos lançamentos
  de descontos vinculados aos códigos 5420, identificado como ''CREDCESTA – PKL ONE'', e 5410, da Mettacard.
  O documento só permanece acessível por captura arquivada: a página oficial passou a responder que o
  conteúdo ficaria indisponível em razão da legislação eleitoral. Nenhum ato de suspensão ou cancelamento
  do código foi publicado no diário oficial paranaense — o bloqueio foi administrativo.'
