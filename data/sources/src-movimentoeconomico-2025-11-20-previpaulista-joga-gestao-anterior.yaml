summary: Registra a nota oficial da Prefeitura de Paulista, de 20/11/2025, responsabilizando o ex-prefeito Yves
  Ribeiro e o então diretor do instituto, Luiz Augusto da Silva Junior, pelo investimento de cerca de R$ 3 milhões
  em Letras Financeiras do Banco Master, feito em fevereiro de 2024. Cita auditoria interna que concluiu que o aporte
  ocorreu 'à revelia da governança interna, contrariando parecer da consultoria de investimentos contratada à época
  e sem a devida aprovação do Comitê de Investimentos'. A gestão atual, do prefeito Ramos e da diretora-presidente
  do instituto, Giovanna Cordeiro, contratou escritório de advocacia para responsabilização dos envolvidos e recuperação
  de valores, e afirma que a carteira do PreviPaulista supera R$ 135 milhões excluindo o ativo do Master, sem risco
  a aposentados.
