summary: 'Registra que Fachin retirou a acusação de Moraes contra Mendonça do Inquérito das Fake News,
  avocou a análise à Presidência do STF e dividiu o prazo de cinco dias úteis em duas etapas: primeiro
  a PGR analisa admissibilidade e regularidade do procedimento de Moraes, depois Mendonça se manifesta.'
