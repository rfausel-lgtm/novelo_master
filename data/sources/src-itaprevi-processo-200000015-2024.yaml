summary: Autos completos em 203 páginas, obtidos e lidos integralmente pela equipe. É o anexo AN008 do
  processo TCE-RJ nº 206.599-7/26, e a peça que o tribunal examinou documento a documento para concluir
  que o termo de credenciamento foi preenchido pelo próprio Banco Master. Contém o termo de abertura de
  11/01/2024, o e-mail do banco remetendo a documentação, as certidões, e o Termo de Análise e Atestado
  de Credenciamento nº 001/2024 em duas versões — uma sem assinatura e outra assinada em 16/01/2024. Autos
  digitalizados sem camada de texto, submetidos a reconhecimento óptico pela equipe a 200 dpi; os trechos
  citados foram conferidos visualmente nas imagens originais.
