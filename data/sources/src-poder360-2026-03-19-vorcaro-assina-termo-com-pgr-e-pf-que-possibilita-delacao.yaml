summary: Relata que Daniel Vorcaro assinou em 19/03/2026 termo de confidencialidade (o subtítulo fala em acordo
  de confidencialidade) com a PF e a PGR, que
  marcaria o início do processo para uma delação, e que Mendonça autorizou no mesmo dia a transferência dele
  da Penitenciária Federal de Brasília para a Superintendência da PF na capital; diz que as partes se
  comprometeram ao sigilo das tratativas e que a defesa passou a contar com o advogado José Luis Oliveira
  Lima. Não traz conteúdo de colaboração.
notes: Publicada em 19/03/2026 às 22h57 (a data de 20/03 vista em metadados é UTC). Lida por lote:fonte em
