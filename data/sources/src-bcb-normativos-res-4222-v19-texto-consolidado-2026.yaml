summary: Texto consolidado (39 páginas) da Resolução CMN 4.222/2013, com o estatuto (Anexo I) e o regulamento
  (Anexo II) do FGC. Marca, dispositivo a dispositivo, as redações dadas pela Resolução CMN 5.279, de
  22/1/2026, e as redações dadas, a partir de 1º/6/2026, pela Resolução CMN 5.295, de 23/4/2026 (arts. 2º-A e
  2º-B, com o Ativo de Referência).
notes: Lido integralmente por lote:fonte (pdftotext) em 23/10/2026; sha256 do texto b4787f4bb3327a4e. A data
  de publicação indicada é a da Resolução 4.222; o arquivo consolidado não traz data de consolidação. Versão
  posterior à v15_P já registrada em src-bcb-normativos-res-4222-estatuto-fgc. As marcas das alterações da
  5.279 não trazem data de início de vigência própria; as da 5.295 trazem 1º/6/2026.
