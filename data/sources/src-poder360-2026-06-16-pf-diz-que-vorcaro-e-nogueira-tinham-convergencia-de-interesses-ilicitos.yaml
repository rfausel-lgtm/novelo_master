source_type: press
language: pt-BR
summary: >-
  Segundo a matéria, André Mendonça retirou em 16/06/2026 o sigilo de relatório da PF; quanto a Lisboa, o
  relatório atribui ao senador reserva de cinco noites em suíte júnior do Four Seasons em junho de 2024, no
  total de R$ 91.280, média de R$ 18.256 por diária. Registra que a defesa de Ciro Nogueira não comentaria o
  caso naquele momento e que apresentará nos autos "todos os esclarecimentos técnicos" para rebater o que
  chamou de "descabidas insinuações policiais". Não traz link para o relatório nem número de Pet.
notes: Publicada às 15h00 de 16/06/2026. O Novelo não usa a expressão do título como proposição.
