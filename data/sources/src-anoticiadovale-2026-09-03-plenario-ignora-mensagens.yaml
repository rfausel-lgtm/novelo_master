summary: 'Cobertura da sessão plenária de 02/09/2026, a primeira após a divulgação das mensagens: o tema
  não constou da pauta formal, nenhum ministro comentou o caso, e Moraes e Mendonça, sentados lado a lado
  por critério de antiguidade, não conversaram. Cármen Lúcia participou por videoconferência.'
