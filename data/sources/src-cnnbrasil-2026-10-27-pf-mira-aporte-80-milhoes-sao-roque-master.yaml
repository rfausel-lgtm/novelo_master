summary: Reportagem de 27/10/2026 (08h28, atualizada às 09h03) sobre a Operação Entressafras. Diz que a
  investigação apura R$ 80 milhões em letras financeiras e R$ 20 milhões em um fundo imobiliário, que a CNN
  apurou que o investimento foi feito no Banco Master e atribui à PF um prejuízo estimado de cerca de R$ 121
  milhões, valor que diz bloqueado. Esses dois pontos não constam da nota da PF em gov.br.
