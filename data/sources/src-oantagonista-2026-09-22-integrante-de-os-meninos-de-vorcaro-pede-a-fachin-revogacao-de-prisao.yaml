summary: Relata petição da defesa de Rodrigo Pimenta Franco Avelar Campos ao presidente do STF, Edson Fachin,
  pedindo a revogação da prisão preventiva decretada em 13/05/2026 (ou, subsidiariamente, medidas cautelares
  diversas), o requerimento anterior de 20/08/2026 e o parecer do PGR de 18/09/2026 pela manutenção da prisão.
  Registra que Fachin ainda vai decidir.
notes: O texto situa a prisão "desde 14 de maio" e a decisão em 13/05. A petição não foi localizada nos autos
  públicos.
