summary: Texto integral recuperado na base oficial da Fazenda estadual e lido pela equipe. Publicado no
  Diário Oficial de 05/05/2023, Edição Extra 2, p. 4, com considerando único invocando 'a necessidade
  de se promover a desburocratização e a celeridade nos procedimentos das consignações'. Assinam Mauro
  Mendes, o secretário-chefe da Casa Civil e o secretário de Planejamento e Gestão. Além da margem de
  10% e da regra de que as margens 'não concorrem entre si', o art. 2º admite como consignatárias 'entidades
  administradoras de cartão consignado de benefício, devidamente conveniadas junto a instituições financeiras
  autorizadas pelo Banco Central do Brasil', e o art. 3º impõe às consignatárias o dever de financiar
  políticas de educação financeira.
