summary: Em 08/09/2026, um dia antes da decisão de Dino, a AGU (sob o advogado-geral da União Jorge Messias)
  já havia pedido ao presidente do STF, Edson Fachin — não a Dino —, a suspensão da decisão de Mendonça,
  argumentando violação da prerrogativa constitucional exclusiva do Presidente da República para prover
  e demitir o cargo de Diretor-Geral da PF. É via processual distinta da usada por Dino no dia seguinte.
