source_type: press
summary: 'Consolida o que Folha de S.Paulo (José Marques) e Estadão (Aguirre Talento e Alvaro Gribel) apuraram sobre
  o conteúdo da colaboração de Antônio Carlos Freixo Júnior. Quatro pontos importam ao caminho do dinheiro: o colaborador
  apresentou documentos das transferências da Entre Investimentos ao Havengate Development Fund, no Texas; a delação
  descreve ''uma espécie de conta conjunta'' usada para pagamentos e apresenta COMPROVANTES DE OPERAÇÕES DE CÂMBIO
  para enviar os valores ao exterior, com os investigadores apurando evasão de divisas; Vorcaro transferia bens
  ou recursos às empresas de Freixo e pedia que ele encontrasse operadores capazes de disponibilizar dinheiro em
  espécie, cobrando esses intermediários 4% pela operação; e o colaborador relatou que técnicos do Banco Central
  haviam identificado fluxo atípico de recursos da Entrepay, empresa do Grupo Entre, em que o dinheiro deixava o
  Brasil, passava pelas Bahamas e seguia para o Texas. Registra ainda que Freixo se comprometeu a pagar cerca de
  R$ 2 bilhões em multa e que os pagamentos ao fundo foram solicitados pelo senador Flávio Bolsonaro sob o argumento
  de financiar o filme.'
notes: 'É cobertura de segunda mão sobre peça sob sigilo: o veículo resume o que dois jornais apuraram com pessoas
  com conhecimento da colaboração. A equipe não leu a delação nem seus anexos.'
