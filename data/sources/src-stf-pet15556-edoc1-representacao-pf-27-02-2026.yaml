summary: 'Petição inicial da PET 15.556 (protocolo 21.692, autuada em 27/02/2026), representação da PF ao ministro
  André Mendonça por prisão preventiva, afastamento de função pública, cautelares diversas e suspensão de atividades
  econômicas. 164 páginas, originalmente distribuída como peça sigilosa. Detalha, com transcrição de mensagens extraídas
  do celular de Daniel Vorcaro, dois eixos: (1) corrupção de servidores do Banco Central (Paulo Sérgio Neves de
  Souza e Belline Santana) em troca de vantagens; e (2) um núcleo de intimidação e violência apelidado ''A Turma'',
  comandado por Luiz Phillipi Mourão (''Sicário'') com participação do policial federal aposentado Marilson Roseno
  da Silva, remunerado em R$ 1 milhão por mês, responsável por ameaças a um ex-funcionário e sua família, invasão
  de dispositivos de um empresário crítico, um documento forjado da Interpol, e ofícios falsos ao Facebook/Meta
  em nome de servidora do Ministério Público do Ceará. É o documento que fundamentou a prisão de Mourão em 04/03/2026
  — ele morreu sob custódia policial dias depois.'
notes: Obtida pela equipe em 11/09/2026, mediante certificado digital do editor, após o levantamento do sigilo da
  PET 15.556 determinado por Fachin em 10/09/2026 (lote 168). A peça trazia, em seu próprio cabeçalho, o rótulo
  'PEÇA SIGILOSA' — anterior ao levantamento do sigilo do processo como um todo. O PDF original não é redistribuído
  pelo acervo; apenas as informações nele contidas, com citação da fonte oficial.
