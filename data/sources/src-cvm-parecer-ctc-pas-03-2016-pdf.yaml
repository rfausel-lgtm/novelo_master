summary: Íntegra do parecer, lida pela equipe. Registra que a estrutura Foco DTVM / A.A.M. Ltda. (Aquilla
  Asset Management, atual AQ3 A.M.) já era investigada pela Polícia Federal desde 31/01/2013, na 'Operação
  Miquéias', a partir dos inquéritos IPL 194/2012-SR/DPF/DF e IPL 148/2013-SR/DPF/DF, sobre aplicações
  de diversos regimes próprios de previdência em fundos administrados pela Foco e geridos pela A.A.M.
  Descreve o uso de 'pastinhas', que percorriam o país oferecendo percentual sobre o aporte a prefeitos
  e gestores, e de 'lobistas'. Registra que o inquérito administrativo da CVM foi instaurado em 02/03/2016
  e concluiu pela responsabilização de 20 pessoas naturais e 9 jurídicas, com prejuízos 'da ordem de centenas
  de milhões de reais'.
