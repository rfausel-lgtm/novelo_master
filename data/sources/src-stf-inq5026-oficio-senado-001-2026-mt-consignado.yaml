summary: Três senadores representantes do Mato Grosso pedem ao relator do INQ 5.026 "especial atenção" à
  apuração de fatos relacionados a operações de crédito consignado envolvendo servidores públicos do
  Estado de Mato Grosso, no contexto do caso Banco Master — descrevendo denúncias de valores desembolsados
  muito inferiores aos posteriormente cobrados, atingindo servidores, pequenos comerciantes e produtores
  rurais.
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
