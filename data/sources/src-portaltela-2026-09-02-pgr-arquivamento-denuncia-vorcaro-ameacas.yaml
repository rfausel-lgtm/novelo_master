source_type: press
summary: O procurador-geral Paulo Gonet pediu ao STF (ministro André Mendonça) o arquivamento de uma notícia/reclamação
  apresentada pelo PRÓPRIO Vorcaro sobre supostas ameaças e maus-tratos que alegou sofrer na prisão —
  não se trata de denúncia contra ele, e não deve ser confundida com a denúncia que o MPF/PGR poderá eventualmente
  oferecer contra Vorcaro no inquérito-mãe da Compliance Zero, ainda não apresentada até a data desta
  apuração.
