summary: 'Com base em relatório da PF (que fundamentou as buscas contra Cláudio Castro): em outubro de
  2024 Vorcaro pediu a Augusto Lima que acionasse Gilberto Kassab para convencer o deputado estadual Luiz
  Paulo (PSD-RJ) a apagar vídeo crítico aos aportes de R$ 500 milhões da RioPrevidência no Master; o vídeo
  não foi removido. Reproduz as respostas de Kassab (foi procurado, conversou com Pedro Paulo, orientou
  que as denúncias prosseguissem), de Pedro Paulo e de Luiz Paulo.'
