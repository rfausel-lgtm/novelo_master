summary: Registra que Ascendino Madureira Garcia, o 'Dino', foi funcionário da Foco DTVM até 2018 e depois
  foi para a Master Corretora, atuando como operador de Vorcaro; é apontado como braço direito de Benjamim
  Botelho nos desvios apurados na Operação Fundo Fake, tendo sido denunciado em 2023 por gestão fraudulenta
  e organização criminosa, sem julgamento até a data. Registra a negativa dele — a associação de seu nome
  à investigação seria 'indevida e baseada em um grande equívoco' — e a afirmação de advogados de Vorcaro
  de que ele não exercia funções de gestão.
