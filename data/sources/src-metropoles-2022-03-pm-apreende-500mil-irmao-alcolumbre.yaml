summary: 'Cobertura independente do mesmo episódio de 25/03/2022 (apreensão de R$ 500 mil pertencentes a
  Alberto Samuel Alcolumbre Tobelem pela PM de São Paulo). O Metrópoles registra ter tido acesso ao boletim
  de ocorrência do 13º DP, mas o texto não deixa claro se o vínculo de parentesco consta do próprio documento
  policial ou se veio de apuração paralela da reportagem — ponto que a equipe não conseguiu resolver com
  as fontes disponíveis.'
notes: Corrobora, de forma editorialmente independente, a identificação de Alberto Samuel como irmão do
  senador Davi Alcolumbre no mesmo episódio de 2022.
