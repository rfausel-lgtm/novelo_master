title: CNJ manda cancelar R$ 4,7 bilhões em precatórios ligados ao Master e devolver valores ao Tesouro
publisher: Times Brasil (CNBC)
author: Amanda Souza
publication_date: '2026-09-23'
url: https://timesbrasil.com.br/brasil/cnj-manda-cancelar-r-47-bilhoes-em-precatorios-ligados-ao-master-e-devolver-valores-ao-tesouro/
source_type: press
language: pt-BR
summary: >-
  Decisão assinada na noite de terça-feira (22/09) e divulgada em 23/09; as três empresas aparecem em lista do
  celular de Vorcaro "sob a identificação 'precatórios a receber'"; a Usina Capricho consta de minuta de
  contrato de serviços advocatícios de março de 2024 envolvendo o Master e o escritório Queiroga, Vieira,
  Queiroz & Ramos (12 ações, cerca de R$ 8,5 bilhões, êxito de 5%, até R$ 427 milhões); atribui à Polícia
  Federal a leitura de que "KN" se refere ao ministro Kassio Nunes Marques; registra a negativa do ministro e a
  do escritório (desconhece e não participou de negociações de transferência dos precatórios a terceiros e não
  recebeu honorários do Master).
notes: >-
  Manchete afirma mais do que a decisão. Os "key points" tratam de cessão de precatórios do Master à Entre
  Investimentos, assunto que fica fora deste lote.
