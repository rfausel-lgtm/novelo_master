summary: Busca por texto integral no acervo nacional agregado, em janelas semestrais de 2018 a 2026, que recuperou
  182 edições com a expressão pesquisada. Separadas as ocorrências reais da empresa das placas de veículo em editais
  de trânsito — noventa edições descartadas por esse motivo, em dez estados —, restaram ocorrências reais em trinta
  municípios de treze unidades da federação. A comparação com o corpus apontou instrumentos e atos em municípios
  que a investigação ainda não documentara, entre eles quatro capitais. Nenhuma ocorrência da empresa foi encontrada
  no Amazonas, em Rondônia ou no Tocantins, três estados que o mapa de cobertura do produto listava em fevereiro
  de 2024.
notes: 'Limites declarados: o acervo do Querido Diário não cobre todos os municípios brasileiros nem todas as datas
  de cada um, de modo que a ausência de ocorrência não prova ausência de instrumento. A soma das janelas semestrais
  recuperou 182 das 239 edições que a mesma busca sem recorte de data reporta — diferença não reconciliada, que
  só pode subestimar o resultado.'
