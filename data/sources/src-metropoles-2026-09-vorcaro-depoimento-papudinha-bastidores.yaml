summary: Registra que a oitiva de Daniel Vorcaro pelo gabinete de André Mendonça ocorreu na manhã de quinta-feira,
  27/08/2026, dentro da Papudinha, em Brasília, conduzida pelo juiz auxiliar João Azambuja, com a presença
  de dois advogados do banqueiro e de um integrante do Ministério Público Federal, e sem a presença da
  Polícia Federal — ausência que gerou críticas na corporação. No dia seguinte, 28/08, Vorcaro prestou
  outro depoimento, este à própria PF, por videoconferência.
