summary: 'Trecho literal: ''Tanure investiu ao menos R$ 1,6 bilhão no Banco Master desde 2020, por meio
  de veículos como a Estocolmo e um fundo offshore chamado Aventti Strategic Partners LLP'', com base
  em ''documentos analisados pela Bloomberg News'' (não especificados). Sobre a natureza das debêntures:
  ''Embora os títulos não fossem conversíveis em ações, desde dezembro de 2022 alguns passaram a poder
  pagar cupons com ações da Banvox.'' Confirma o desfazimento de posições de Tanure na Prio e na Ligga
  Telecomunicações.'
