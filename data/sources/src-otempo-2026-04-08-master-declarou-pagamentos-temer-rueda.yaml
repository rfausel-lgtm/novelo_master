summary: Registra a declaração do próprio Michel Temer de que seu escritório prestou 'serviços de mediação'
  ao ser contratado pelo banco, e que recebeu dois pagamentos — de R$ 5 milhões e de R$ 2,5 milhões, total
  de R$ 7,5 milhões —, valor distinto dos R$ 10 milhões declarados pelo Master à Receita.
