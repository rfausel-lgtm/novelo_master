summary: O art. 39 lista exaustivamente as informações periódicas que o administrador de FII deve prestar
  — informe mensal, trimestral, demonstrações financeiras, relatório do auditor, formulário do Anexo 39-V,
  atas e sumário de decisões. Relação nominal de cotistas não está entre elas; o registro de cotistas
  é mencionado apenas no art. 19, §6º, como base de cálculo de percentual para convocação.
