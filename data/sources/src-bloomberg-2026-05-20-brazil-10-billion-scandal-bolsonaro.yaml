summary: Uma de várias reportagens investigativas próprias (com apuração e bylines, não wire) que a Bloomberg
  dedicou ao caso ao longo de 2026 — cobrindo a prisão de Vorcaro, o acordo de colaboração, a reação de
  executivos e o vazamento envolvendo um ministro do STF. Descreve as conexões de Vorcaro como cruzando
  'o espectro político e incluindo todos os poderes, além do setor privado', tratando o caso como estudo
  de falha regulatória e captura institucional.
