summary: Voto-vista lido pela equipe. Registra a curva das propostas de termo de compromisso no processo
  — R$ 1,5 milhão em 2021/22, rejeitada; R$ 3,8 milhões em 2023, rejeitada; e R$ 21,285 milhões, que o
  Comitê recomendou aceitar e o Colegiado rejeitou por unanimidade em 02/12/2025. Cita como fatos supervenientes
  a liquidação do Banco Master, a prisão de Vorcaro e a Operação Compliance Zero. Registra que a área
  técnica estimou prejuízos individualizados em R$ 94.149.397,67.
