summary: Publicação na edição nº 11.101, página 11, lida pela equipe. Qualifica a convenente como 'Banco
  PKL One Participações S.A' e declara como objeto o desconto e recebimento de 'contribuições e mensalidades
  devidas por seus servidores filiados' — redação típica de convênio com entidade sindical ou associativa,
  não de cartão consignado de benefício. Fundamenta-se em parecer referencial da Procuradoria-Geral do
  Estado de 2020, sem manifestação jurídica individualizada. Processo NUP 77/002.284/2023; vigência de
  01/03/2023 a 01/03/2025; assinaturas de Ana Carolina Araujo Nardes e Ana Paula de Almeida Pithon.
