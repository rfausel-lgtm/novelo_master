summary: 'Reproduz, atribuindo ao Poder360, trechos da reunião fechada de 12/02/2026 dos dez ministros do STF
  sobre a permanência de Toffoli no caso Master (placar de 8 a favor e 2 contra antes da solução negociada) —
  incluindo falas de Gilmar Mendes, Cármen Lúcia, Fux e Dino ("lixo jurídico"). A própria CNN Brasil registra
  explicitamente: "não teve acesso ao conteúdo original e, portanto, não pôde verificar a autenticidade" dos
  trechos divulgados pelo Poder360.'
