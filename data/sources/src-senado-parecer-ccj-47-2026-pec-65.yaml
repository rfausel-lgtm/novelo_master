summary: 'Parecer aprovado na 9ª reunião extraordinária da CCJ, em 10/06/2026, favorável à PEC 65/2023 na forma de
  substitutivo (Emenda nº 27-CCJ). Segundo o registro da decisão da comissão, o parecer acolhe total ou parcialmente as
  emendas 3, 4, 5, 6, 10, 13, 14, 15 e 17 e é contrário às emendas 1, 2, 7, 8, 9, 11, 12, 16 e 18 a 26 — portanto, rejeita
  a Emenda nº 11, de Ciro Nogueira.'
