summary: Confirma que a Reag, gestora fundada por João Carlos Mansur e liquidada pelo BC em 15/01/2026
  por fraude com o Banco Master, também foi alvo direto da Operação Carbono Oculto (deflagrada 28/08/2025),
  com o próprio Mansur acusado de 'dinâmica fraudulenta envolvendo fundos' e ocultação de recursos de
  origem desconhecida.
