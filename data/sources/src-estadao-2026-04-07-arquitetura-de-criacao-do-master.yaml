summary: 'Perfil de Benjamim Botelho de Almeida: passagem pelo Banco Garantia nos anos 1990, fundação
  em 2003 da distribuidora que passaria por Foco DTVM, Índigo DTVM e Sefer Investimentos, residência em
  Portugal há cerca de cinco anos, e estruturas no exterior (Zeal Capital em Cascais, Drako em Zug, na
  Suíça, e Hoag Investments, que adquiriu duas empresas em Delaware). Atribui à Sefer 102 fundos e mais
  de R$ 20 bilhões, dos quais cerca de R$ 9,6 bilhões ligados ao ecossistema Master.'
