summary: 'Texto oficial lido integralmente pela equipe. Os arts. 1º e 4º mantêm o programa ''gerido e
  operado pela Empresa Baiana de Alimentos S/A – EBAL''; o art. 2º assegura margem de consignação de 30%
  da remuneração líquida dos beneficiários; o art. 3º limita os serviços financeiros a 50% dessa margem.
  Os arts. 11 e 13 remetem a ''contrato específico'' firmado com o Estado, que detalharia funcionamento,
  obrigações e prazos. Verificação artigo por artigo: o decreto NÃO estabelece prazo de quinze anos nem
  exclusividade — essas condições são atribuídas ao contrato, não obtido.'
