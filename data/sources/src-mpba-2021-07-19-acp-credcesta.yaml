summary: 'Nota oficial do MP-BA sobre ação civil pública ajuizada pela promotora Joseane Suzart, pedindo
  que o Banco Máxima atue com transparência nos contratos vinculados ao Cartão de Crédito CredCesta, com
  regras claras de funcionamento e cancelamento imediato de cartões não solicitados. Fecha, parcialmente,
  a lacuna sobre atuação de órgãos de controle baianos: existe ação civil pública do Ministério Público
  estadual sobre o produto, ainda que não sobre a privatização da EBAL.'
