summary: 'Traslado quase completo do Inquérito Policial n. 5004641-31.2025.4.03.6181, autuado em 27/05/2025
  a partir de denúncia-crime anônima recebida por e-mail institucional da PF ("INFORMAÇÕES BANCO MASTER"),
  contendo a portaria de instauração, a IPJ nº 90/2025 (confirmação preliminar, com quadro de ~90
  pessoas/empresas), decisões do juiz federal Décio Gabriel Gimenez (11/09/2025 e 05/12/2025) e a
  manifestação final do MPF de 23/12/2025 pedindo remessa ao STF vinculada à PET 15.198. Traz também, como
  anexos comprobatórios, processos administrativos sancionadores da CVM na íntegra (entre eles o PAS
  19957.008143/2018-26, sobre as debêntures EBPH) e material reaproveitado da Operação Fundo Fake (IPL
  2020.0044085, Rondônia).'
notes: 'Peça 13 de 50 obtidas por Rafael via certificado digital no peticionamento eletrônico do STF (pasta
  local "Pet 15198-1_50") — mesma política de divulgação já aplicada às demais peças obtidas por
  certificado: informação pode ser usada e citada oficialmente, PDF original não é redistribuído. Arquivo
  de 2.480 páginas; cobertura por equipe de investigação dedicada, com varredura dirigida (não leitura
  linear integral) por marcos estruturais (datas, IDs de documento, números de processo, nomes). Rodapé de
  impressão com CPF de quem baixou o documento nunca reproduzido no acervo.'
