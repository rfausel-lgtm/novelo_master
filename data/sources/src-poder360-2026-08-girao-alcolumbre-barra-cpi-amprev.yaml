summary: Em 24/08/2026, o senador Eduardo Girão declarou que Alcolumbre barra a instalação da CPI do Banco
  Master no Senado por "conflito de interesses", citando nominalmente que o irmão do presidente do Senado,
  Alberto Alcolumbre, é conselheiro fiscal da Amprev, e que Jocildo Silva Lemos, ex-presidente da autarquia,
  foi tesoureiro de sua campanha. Girão disse ter reunido 53 assinaturas para o requerimento. Procurada, a
  assessoria de Alcolumbre disse que não comentaria o assunto.
