summary: 'Traz a defesa da Crédito & Mercado após as buscas no Iprev de Maceió: nega ter ''orientado'' ou direcionado
  a aplicação, e alega que a PF interpretou de forma ''equivocada'' a natureza técnica das Autorizações de Aplicação
  e Resgate (APRs) que produziu. Registra que a consultoria diz ter sabido da operação apenas pela imprensa, e situa
  a apuração no contexto de suspeita de ''pressão externa'' ou ''vantagem indevida'' para acelerar a liberação dos
  R$ 97 milhões sem debate adequado no conselho do instituto, sob autorização do ministro André Mendonça (STF).'
