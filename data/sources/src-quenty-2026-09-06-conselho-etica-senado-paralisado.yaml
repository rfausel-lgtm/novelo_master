source_type: press
summary: O Conselho de Ética do Senado está paralisado desde julho de 2024 por falta de instalação/composição
  definida por Alcolumbre — mantendo ao menos 19 representações represadas, entre elas a de Wagner. O
  Partido Novo acionou o STF; a ministra Cármen Lúcia deu prazo de 10 dias ao Senado (a partir de 06/07/2026)
  para explicações, prazo que não foi cumprido. A paralisia é estrutural, não específica ao caso de Wagner.
