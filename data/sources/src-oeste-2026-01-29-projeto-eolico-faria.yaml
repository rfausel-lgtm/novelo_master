source_type: press
summary: 'Segundo o UOL, a Super Empreendimentos e Participações, ligada a Vorcaro e então dirigida por
  Fabiano Zettel, adquiriu em fevereiro de 2024 90% de projeto eólico de Fábio Faria no RN; parte do pagamento
  foi um apartamento de R$ 50 milhões em São Paulo, revendido por R$ 54 milhões; a operação não foi formalizada
  na Junta Comercial nem na Receita. Faria: não teve contato com a compradora enquanto exerceu funções
  públicas.'
