source_type: press
summary: 'Detalha a reunião do Comitê de Investimentos da Amprev de 30/07/2024, na qual o conselheiro Gláucio
  Bezerra alertou sobre "problema envolvendo questão política e de governança junto à Caixa Econômica Federal"
  ligado ao emissor, antes da aprovação de R$ 100 milhões (parte dos ~R$ 400 milhões totais) em letras do
  Master. Situa Alberto Alcolumbre, irmão do senador, no Conselho Estadual de Previdência em 2024 e no
  Conselho Fiscal da Amprev a partir de 2025 — portanto, incorporado a esse colegiado DEPOIS da aprovação
  do investimento. A assessoria de Davi Alcolumbre classificou como "falsa e irresponsável qualquer tentativa
  de vincular o presidente do Senado a essas nomeações ou decisões".'
