summary: Parecer do Departamento dos Regimes de Previdência no Serviço Público, processo SEI 10133.000176/2024-95,
  assinado em 15/07/2024. Nasce expressamente de consultas feitas pelo sistema Gescon-RPPS, entre elas
  a de saber se instituição do segmento S3 que não conste da lista exaustiva estaria elegível a receber
  aplicações de regimes próprios. Responde que a lista é orientativa, mas que cabe ao regime próprio garantir
  que a instituição cumpra integralmente os requisitos, mesmo que ainda não listada. Registra também que
  o departamento vinha recebendo alertas do próprio mercado sobre eventual influência de entes federativos
  nas escolhas de ativos.
