summary: Decreto que altera o Decreto nº 17.251/2016, inserindo o detentor dos direitos do Credicesta
  no art. 5º do regime de consignações e reescrevendo o art. 19, II. Texto integral extraído e conferido
  pela equipe. A redação original do inciso II reservava 30% de margem ao 'custeio parcial de benefícios,
  produtos e auxílios concedidos pelos órgãos e entidades da Administração Pública Estadual'; a nova redação
  passou a dizer 'concedidos pelas pessoas referidas no art. 5º' — onde o operador privado acabara de
  ser inserido.
