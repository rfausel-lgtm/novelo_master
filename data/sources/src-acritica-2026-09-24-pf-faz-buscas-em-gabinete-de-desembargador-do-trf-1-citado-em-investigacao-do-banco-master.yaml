title: PF faz buscas em gabinete de desembargador do TRF-1 citado em investigação do Banco Master
publisher: A Crítica (Campo Grande)
author: Douglas Vieira
publication_date: '2026-09-24'
url: https://acritica.net/justica/pf-buscas-desembargador-trf1-caso-master/
source_type: press
language: pt-BR
summary: >-
  A Polícia Federal realizou em 24/09/2026 diligência no gabinete do desembargador federal Newton Ramos, por
  determinação da Corregedoria Nacional de Justiça, no âmbito de correição extraordinária; peritos da PF
  extraíram informações de equipamentos eletrônicos e arquivos do gabinete; o CNJ apura reclamação disciplinar
  contra o magistrado; a presidente do TRF-1, desembargadora federal Maria do Carmo Cardoso, afirmou em nota que
  o tribunal colaborará com o CNJ e demais autoridades e que a correição não representa antecipação de
  responsabilidade.
notes: >-
  "Buscas" é termo do veículo. A nota da presidente do TRF-1 é parafraseada pelo veículo, sem aspas. A matéria
  cita o Estadão sobre votos do desembargador e menciona familiar sem papel documentado; esses pontos ficam
  fora do lote. O título da aba do navegador difere do título da matéria ("PF faz buscas em gabinete de
  desembargador citado no caso Master"); registrado o título da matéria.
