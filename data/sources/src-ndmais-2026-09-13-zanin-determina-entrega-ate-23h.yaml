url: https://ndmais.com.br/justica/zanin-manda-pf-entregar-dados-do-celular-de-vorcaro-ao-stf-48-horas-antes-de-julgamento-sobre-relacionamento-com-moraes/
source_type: press
summary: 'O ministro Cristiano Zanin determinou que a Polícia Federal entregasse ao seu gabinete cópia dos
  dados extraídos do celular de Daniel Vorcaro até as 23h de domingo, 13/09/2026 — exatas 48 horas antes da
  sessão extraordinária de terça-feira. Diferente dos pedidos anteriores (ofícios de 11/09, já registrados no
  acervo), esta é uma determinação formal, com prazo fixado em horas. Zanin argumentou que "não existe
  hierarquia entre os ministros do STF" e que restringir o acesso à informação viola o dever de julgar com
  imparcialidade e independência, já que todos os ministros estão sujeitos ao mesmo dever de sigilo. A
  reportagem não especifica se Zanin atua como relator de algum processo específico ao emitir a ordem.'
notes: Verificado por WebFetch direto da reportagem. Não localizado, nesta coleta, se a PF cumpriu o prazo —
  fica como pendência para checagem no dia 14/09.
