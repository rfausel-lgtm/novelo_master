summary: Petição protocolada em 20/03/2026 por Belline Santana, na PET 15.556, pedindo extensão dos efeitos de decisão
  que dispensou Paulo Sérgio Neves de Souza de comparecer à CPI do Crime Organizado, invocando o direito ao silêncio
  por já figurar como investigada. Cita, como precedente, que em 26/02/2026, no INQ 5.026/DF, a partir de requerimento
  na Petição nº 20501/2026 daqueles autos, foi deferida dispensa equivalente a José Eugênio Dias Toffoli e José
  Carlos Dias Toffoli, ali qualificados como investigados. Reanexa a ata da 12ª reunião da CPICRIME de 11/03/2026,
  já mapeada no acervo (lote 173, indiretamente).
notes: José Eugênio e José Carlos Dias Toffoli são irmãos do ministro Dias Toffoli, não filhos — verificação externa
  da equipe (busca web), já que o documento não esclarece o grau de parentesco. Ambos já apareciam de forma genérica
  no verbete do ministro, como sócios da empresa familiar Maridt, sem terem sido nomeados individualmente até este
  lote.
