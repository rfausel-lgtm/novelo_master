source_type: official_court
summary: O ministro André Mendonça determinou, na PET 15771 (vinculada ao INQ 5026), a prisão preventiva
  do ex-presidente do BRB Paulo Henrique Bezerra Rodrigues Costa e do advogado Daniel Lopes Monteiro,
  em nova fase da Compliance Zero, a pedido da PF com manifestação favorável da PGR. Segundo os autos,
  as operações teriam alcançado R$ 12,2 bilhões em carteiras de crédito supostamente irregulares adquiridas
  pelo BRB; a investigação aponta negociação estimada em R$ 146 milhões em imóveis entre Vorcaro e o então
  presidente do BRB.
