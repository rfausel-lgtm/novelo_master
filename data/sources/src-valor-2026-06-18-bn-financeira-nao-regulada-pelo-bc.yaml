notes: A reportagem invoca a Resolução Conjunta nº 17/2025 como norma aplicável, mas o art. 1º dessa resolução
  restringe seu âmbito às instituições autorizadas a funcionar pelo Banco Central — não alcança a BN Financeira.
  A norma pertinente ao período do contrato é a Resolução CMN 4.935/2021, art. 8º, hoje revogada.
