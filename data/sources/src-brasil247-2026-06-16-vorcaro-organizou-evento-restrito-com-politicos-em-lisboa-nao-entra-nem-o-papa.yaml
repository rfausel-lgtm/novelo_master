summary: >-
  Republica, "segundo a Folha de São Paulo", que mensagens de Vorcaro listam convidados de encontro restrito
  em Lisboa, entre eles Ciro Nogueira, Hugo Motta e Fábio Faria, e que Faria "declarou que não esteve em
  Lisboa durante o ano de 2024".
notes: >-
  Publicada às 16h21 de 16/06/2026. Republicação declarada da Folha de S.Paulo, cuja matéria original não foi
