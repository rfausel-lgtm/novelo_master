summary: 'Depois de sete meses, a CPMI do INSS terminou sem relatório final: o parecer do deputado Alfredo
  Gaspar foi rejeitado por 19 votos a 12. O presidente da comissão, senador Carlos Viana, encerrou os
  trabalhos e não acatou a questão de ordem para apreciação do relatório alternativo, nem indicou relator
  para o texto da base governista. Viana anunciou que cópias do relatório rejeitado seriam encaminhadas
  a instituições como o Ministério Público Federal e o Supremo Tribunal Federal.'
