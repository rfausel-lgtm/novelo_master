source_type: official_gazette
summary: 'Quatro edições anuais que publicam o Balanço Financeiro consolidado, anexo 13 da Lei 4.320/64, no qual
  as consignações aparecem nominalmente como receita retida e como despesa repassada. A linha ''PKL ONE PARTICIPACOES
  S.A. - CARTAO BENEFI'' evolui assim: exercício de 2022, R$ 237.485,24 retidos e R$ 1.851,00 repassados; 2023,
  R$ 7.432.451,34 e R$ 6.696.184,74; 2024, R$ 10.583.599,51 e R$ 10.295.517,59; 2025, R$ 13.359.574,03 e R$ 13.409.591,02.
  O balanço do exercício de 2025 foi publicado em 13/04/2026, quase cinco meses depois da liquidação do banco, e
  traz linha própria do Banco Master, com R$ 6.442.082,89 retidos e R$ 6.228.670,10 repassados.'
notes: 'São valores de consignação — dinheiro descontado do servidor e repassado —, não receita própria nem lucro
  da empresa. O balanço de cada exercício sai no ano seguinte: 28/04/2023 (2022), 30/04/2024 (2023), 30/04/2025
  (2024) e 13/04/2026 (2025), todos no acervo data.queridodiario.ok.org.br sob o território 5208707.'
