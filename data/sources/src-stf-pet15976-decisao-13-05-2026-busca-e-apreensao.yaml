summary: 'Decisão pública (Resolução STF 427/2010), baixada diretamente do portal do STF, que defere pedido
  da Polícia Federal de busca e apreensão contra 13 alvos da 6ª fase da Operação Compliance Zero: Henrique
  Moura Vorcaro, Daniel Bueno Vorcaro (quanto à embarcação Solar I), Erlene Nonato Lacerda, Helder Alves de
  Lima, David Henrique Alves, Victor Lima Sedlmaier, Rodrigo Pimenta Franco Avelar Campos, Katherine
  Venâncio Telles, Manoel Mendes Rodrigues, Anderson Wander da Silva Lima, Sebastião Monteiro Júnior,
  Valéria Vieira Pereira da Silva e Francisco José Pereira da Silva. A narrativa fática individualizada é
  praticamente idêntica à da decisão de prisão preventiva da PET 15.978 (mesmo dia, mesmo relator, mesma
  investigação) — a PET 15.976 é o processo formal e distinto de busca e apreensão, cindido em processo
  próprio, com traslado cruzado de peças entre os dois autos em 16/06/2026 por "pertinência temática". O
  dispositivo autoriza especificamente a apreensão de dinheiro em espécie acima de R$ 20.000,00 (ou
  equivalente em moeda estrangeira), joias, obras de arte, veículos e itens de luxo; exige acompanhamento
  de representante da OAB em buscas em escritórios de advocacia (art. 7º, §6º, Lei 8.906/1994); determina
  que os mandados sejam cumpridos "de forma serena, respeitosa e discreta, sem qualquer espetacularização";
  e autoriza expressamente o compartilhamento de todo o material probatório com a Corregedoria da Polícia
  Federal para fins de sindicância/PAD contra os policiais envolvidos.'
notes: Documento público, baixado diretamente do portal do STF. Não depende do certificado digital do
  Rafael. É a base jurídica documental (D) para a abertura de PADs contra os policiais investigados, hoje
  registrada no acervo apenas via imprensa (classificação A, `ev-corregedoria-pf-abre-pads`).
