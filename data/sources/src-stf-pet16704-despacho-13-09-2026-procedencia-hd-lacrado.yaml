summary: 'Mendonça, na Pet 16.704, reconhece "divergência de informações" sobre as circunstâncias em que o
  material do Ofício nº 33V/2026-CINQ/CGRC/DICOR/PF (de 08/03/2026, um domingo) chegou ao seu gabinete, "não
  tendo sido indicada nenhuma decisão que contivesse a referida determinação". Solicita a Fachin (Presidência)
  que determine, em 24h, que os quatro delegados que subscreveram a representação inicial da Pet 15.556 —
  Daniel Mostardeiro Cola, Wedson Cajé Lopes, Victor Arruda de Oliveira e Guilherme Alves de Siqueira —
  prestem informações sobre essas circunstâncias e sobre eventuais "constrangimentos sofridos ao longo das
  investigações". Reitera que todo o material do julgamento de 15/09 está disponível a todos os ministros, e
  recusa incluir agora o conteúdo integral do celular de Vorcaro nos autos, por risco de "tumultuar o
  julgamento" e comprometer as investigações, citando Fachin: "a gravidade dos fatos não autoriza atalhos",
  mas "também não tolera subterfúgios ou desvios de rotas".'
notes: Peça obtida via peticionamento.stf.jus.br (sessão do Rafael).
