summary: 'Resumo de comunicados de FIIs. Registra que, em Fato Relevante de 06/02/2026, o CARE11 anunciou que "a
  Mérito DTVM assumiu os serviços de administração fiduciária do fundo em substituição à Master CCTVM"; e que, em
  assembleia geral extraordinária de 04/02/2026, os cotistas aprovaram a substituição da administradora pela
  Mérito, o agrupamento de cotas na proporção de 5 para 1 e a alteração do regulamento para permitir recompra de
  cotas ou oferta pública de aquisição.'
notes: 'Lido por esta sessão (texto extraído do PDF). Fonte independente que confirma a sucessão do administrador
  levantada por pesquisa delegada a partir do Fato Relevante, cujo texto original não pôde ser aberto (o agregador
  bloqueia leitura automatizada). Contraria a informação da Revista Oeste de que o fundo seria administrado pela
  Planner Trustee.'
