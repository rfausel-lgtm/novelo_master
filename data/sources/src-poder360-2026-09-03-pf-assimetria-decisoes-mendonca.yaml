source_type: press
summary: Relata a decisão de Alexandre de Moraes de 03/09/2026 apontando 'fortes indícios da prática de
  improbidade administrativa, abuso de autoridade e crime de responsabilidade' por parte de Mendonça,
  com base em relatório da PF sobre tratamento díspar de casos por alinhamento político e ritmo de decisões,
  e alegando 'usurpação da direção' das Petições 15.041 (Sem Desconto/INSS) e 15.556 (Compliance Zero/Master).
  Procurado, o gabinete de Mendonça não respondeu até a publicação.
