summary: 'Cobertura independente do mesmo desfecho: ação da Feserp-MS ajuizada em 03/03/2026, com pedido
  de suspensão dos descontos e dos repasses ao Banco Master e de auditoria dos contratos, extinta por
  ilegitimidade ativa após parecer da Procuradoria-Geral do Estado e do Ministério Público. Registra a
  interposição de apelação, ainda não julgada pelo tribunal.'
