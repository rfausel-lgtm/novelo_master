title: PF cita Hugo Motta em investigação sobre benefícios pagos por Daniel Vorcaro
publisher: Gazeta do Povo
author: Ana Carolina Curvello
publication_date: '2026-06-16'
url: https://www.gazetadopovo.com.br/republica/pf-cita-hugo-motta-em-investigacao-sobre-beneficios-pagos-por-daniel-vorcaro/
source_type: press
language: pt-BR
summary: >-
  Segundo a matéria, relatórios da PF encaminhados a André Mendonça, com sigilo retirado em 16/06/2026,
  registram hospedagem de Hugo Motta em Lisboa paga por Vorcaro em junho de 2024 e fatura de cinco diárias no
  Four Seasons Lisboa de 3.155,71 euros, "o que equivale a R$ 20.038,76"; segundo a PF, só Motta e Ciro
  ficaram hospedados no hotel. Registra que Motta "não figura como investigado formalmente no inquérito" e a
  declaração dele de 16/06: "é um evento corporativo, um encontro jurídico".
notes: >-
  Publicada às 18h34 de 16/06/2026; a etiqueta de título da página é "PF aponta hospedagem de Hugo Motta paga
  por Vorcaro em Lisboa". A matéria transcreve mensagens, que o Novelo não reproduz. A frase "os dados vêm
  da reportagem, não dos relatórios originais", indicada no plano de redação, não foi encontrada no texto lido
  em 16/10/2026.
