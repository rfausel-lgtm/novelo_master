summary: O relatório da PF revela dois contratos com o escritório Barci de Moraes, somando R$ 158 milhões
  líquidos. O primeiro, de 16/01/2024, previa R$ 108 milhões líquidos em 36 parcelas de R$ 3 milhões (R$
  131,3 milhões brutos) e teve a última versão editada por Moraes, o que o escritório confirmou explicando
  que o compliance do banco consultou o ministro sobre impedimentos. O segundo, de 12/05/2025, foi firmado
  com a Viking Participações, representada por Vorcaro, com limite de R$ 50 milhões líquidos em três anos;
  uma semana depois as partes assinaram termo de dação em pagamento prevendo quitar R$ 40 milhões com
  ações de duas empresas ligadas a aeronaves. O documento não deixa claro quanto foi efetivamente pago.
