summary: 'O deputado Flávio Serafini (PSOL) protocolou, em 18/05/2026, ação no TJ-RJ pedindo liminar para
  obrigar a presidência da Alerj a instalar a CPI do Banco Master/Rioprevidência, pedindo também a
  publicação imediata do requerimento no Diário Oficial e a proibição de retirada de assinaturas após o
  protocolo formal. A Alerj havia enviado o processo à Procuradoria da Casa alegando que um pedido de
  retirada de assinatura alterava um dos requisitos de admissibilidade — apesar de o requerimento já ter
  as 24 assinaturas necessárias desde 06/05/2026.'
