summary: 'Relatório de 90 páginas sobre o aparelho de André Felipe de Oliveira Seixas Maia, apresentado como
  responsável pela Tirreno, com o objetivo declarado de identificar dados sobre a criação e a legitimidade da empresa.
  Monta uma linha do tempo das conversas e conclui que a primeira menção à Tirreno no aparelho é de 04/04/2025, o que
  contraria os documentos de formalização datados de 02/12/2024; somado ao registro na Junta Comercial só em
  15/04/2025, isso levanta a possibilidade de que a empresa tenha sido constituída em abril de 2025, com data
  retroativa, para dar lastro a transações já realizadas entre o BRB e o Master.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele), juntada ao INQ 5.026
  em 12/05/2026. Nomes de contatos pessoais, telefones e CPF do relatório não são reproduzidos.'
