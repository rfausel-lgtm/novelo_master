source_type: official_government
summary: Nota técnica do processo SEI 10133.000823/2024-69, assinada em 12 e 13/12/2024. Responde a solicitações
  de instituições financeiras que pediam inclusão na lista invocando pertencer a conglomerado cuja líder
  cumpre os requisitos. Conclui que a instituição não atende aos requisitos apenas por pertencer a conglomerado
  prudencial, e que o art. 21, § 8º, da Resolução CMN 4.963/2021 não se aplica aos emissores do art. 7º,
  IV, por falta de previsão normativa.
