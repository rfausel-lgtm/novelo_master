summary: O policial federal aposentado Marilson Roseno da Silva é apontado pela PF como responsável por
  cooptar outros agentes para acessar ilegalmente o sistema da corporação em favor da família Vorcaro.
  Segundo a apuração, ele pediu a Henrique Vorcaro para não deixá-lo 'à deriva'; Henrique teria dito que
  enviaria R$ 400 mil e o policial pediu '800k'. A PF afirma que ele procurou ao menos três policiais
  para consultas indevidas, com o objetivo de descobrir o teor de inquérito em que Henrique fora intimado.
