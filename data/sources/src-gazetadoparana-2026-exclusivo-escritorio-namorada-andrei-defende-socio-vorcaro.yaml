summary: 'Texto assinado por Oswaldo Eustáquio, publicado na seção de opinião, que conecta os dois fatos:
  ''Em janeiro de 2025 entrou como sócia do Figueiredo & Velloso — o mesmo escritório que hoje assina a
  defesa do principal preso da Compliance Zero.'' A equipe verificou de forma independente, via CNPJ oficial,
  que a identificação da banca está correta (diferentemente de outras alegações desse mesmo veículo em
  matérias anteriores, tratadas com reserva no corpus). O texto não registra tentativa de contato com
  a banca, o SBT News ou Renata Varandas; a tentativa da Gazeta do Paraná está na reportagem de 25/06/2026
  (src-gazetadoparana-2026-06-25-namorada-andrei-contrato-ambipar).'
notes: 'Correção de 16/10/2026 (editor): o resumo anterior dizia que este texto registrava tentativa de
  contato com a banca, o SBT News e a jornalista; a página, lida no navegador em 16/10/2026, não traz esse
  trecho, que está na reportagem de 25/06. A página redireciona para a seção de opinião. O texto contém
  juízos e imputações do autor que o Novelo não adota.'
