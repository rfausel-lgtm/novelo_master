language: pt-BR
summary: >-
  Publicada em 13/10/2026, às 19:05. Segundo a agência, Fachin recebeu o diretor-geral da PF, Andrei Rodrigues, por
  cerca de uma hora e meia e disse que a PF deve enviar ao STF todas as menções a ministros encontradas na
  investigação; o Plenário decidirá sobre eventual investigação, ouvida antes a PGR; Fachin aguarda a manifestação
  da PGR sobre pedidos da PF nos casos Master e INSS e pediu celeridade no inquérito das fake news. Não traz
  declaração de Andrei Rodrigues nem prazo para o envio das menções ou para o parecer da PGR.
