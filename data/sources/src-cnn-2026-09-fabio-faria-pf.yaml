source_type: press
summary: 'Com base no relatório da PF sobre o celular de Vorcaro: em 26/12/2023 Fábio Faria compartilhou
  com o banqueiro contatos salvos como ''Alexandre de Moraes BRASILIA''; em 15/01/2024 e 17/01/2024 tratou
  do prazo do contrato com o escritório Barci de Moraes; em 15/03/2024 escreveu ''O careca não pode atrasar'',
  seguido de ordem de Vorcaro para pagar o escritório; em novembro de 2024 intermediou remarcação de encontro.
  Reproduz nota de Faria: sugeriu o escritório para um caso na Justiça de São Paulo, não se reuniu com
  a banca e não conheceu os valores. Faria não é alvo da investigação.'
