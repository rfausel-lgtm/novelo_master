summary: Voto integral, lido pela equipe. Fundamenta a aceitação na cessação da conduta e restituição
  integral (art. 11, §5º, da Lei 6.385/76), boa-fé, ausência de dano a investidores e celeridade, registrando
  que 'eventual julgamento sobre o assunto não seria essencial para produção de efeito paradigmático'.
  No §7º afirma que 'os elementos fáticos que permeiam o caso em exame poderiam ter efetivamente ensejado
  a não instauração do processo considerando a baixa expressividade da lesão ao bem jurídico tutelado'.
  Em nota de rodapé, registra a alegação da área técnica de que as emissões teriam sido 'estruturadas
  com o propósito de viabilizar a transferência de recursos financeiros do Banco M e da massa falida do
  Banco R para beneficiar os responsáveis ou familiares da ÍNDIGO e da Máxima CCTVM'. No §12 registra
  que os proponentes eram investigados por condutas semelhantes em processo aberto em 12 de novembro de
  2020, concluindo que este 'não apresenta, neste momento, materialidade suficiente para obstar a aceitação
  das propostas'.
