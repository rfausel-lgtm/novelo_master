source_type: press
summary: 'Registra que a Polícia Federal pretende pedir aos Estados Unidos a quebra de sigilo do fundo que recebeu
  dinheiro de Daniel Vorcaro sob a justificativa de financiar o filme, e que uma das desconfianças é a de que os
  recursos tenham bancado despesas de Eduardo Bolsonaro nos Estados Unidos, onde vive desde fevereiro de 2025. Explicita
  a dependência institucional: a quebra exige cooperação das autoridades locais e autorização da Justiça americana.
  Informa ainda que a PF pretende usar a Difusão Prata da Interpol — instrumento voltado a identificar, localizar
  e reter patrimônio de investigados, distinto da Difusão Vermelha — nesta e em outras investigações do caso Master,
  e que o diretor-geral da PF declarou à GloboNews, em 02/06/2026, ver necessidade de instaurar inquérito sobre
  o envio de recursos aos Estados Unidos.'
