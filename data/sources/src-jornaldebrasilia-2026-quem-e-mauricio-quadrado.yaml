summary: 'Perfil de Maurício Quadrado: ex-diretor de investimentos do Banco Master sob Vorcaro, carreira
  anterior no Bradesco (incluindo o IPO/ADR da Aracruz Celulose na NYSE, anos 1990) e à frente da corretora
  Planner (2007-2020); vendeu sua fatia de 20-30% no Master em 2024 para montar plataforma própria (corretora,
  gestora e o Letsbank).'
