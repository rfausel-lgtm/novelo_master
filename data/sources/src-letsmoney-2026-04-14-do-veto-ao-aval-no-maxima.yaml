summary: Reconstitui, a partir de extratos dos votos BCB 20/2019 e 218/2019 obtidos pelo Valor Econômico
  via Lei de Acesso à Informação, a rejeição do pedido de transferência de controle do Banco Máxima em
  fevereiro de 2019 e sua aprovação oito meses depois. Relata que a reputação do pretendente dominou a
  reunião de diretoria, que o item foi dispensado por economia processual e que o então diretor de fiscalização
  Paulo Sérgio Neves de Souza afirmou no colegiado que eventuais problemas de conduta poderiam ser coibidos
  pela supervisão. Registra a negativa desse ex-diretor sobre a compra de uma propriedade em Guaxupé (MG).
