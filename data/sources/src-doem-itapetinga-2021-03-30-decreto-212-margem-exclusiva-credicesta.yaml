summary: 'Edição 2.667, ano 11, páginas 11 a 13. PDF baixado e lido pela equipe. Altera o Decreto 198/2021
  para estabelecer que, do teto de consignações, ''20% (vinte por cento) da remuneração do servidor para
  amortização de despesas através de cartão de crédito, sendo 15% (quinze por cento) exclusivamente para
  o cartão de crédito previsto no Programa CREDICESTA e 05% (cinco por cento) para os outros cartões''.
  É o achado mais direto da varredura municipal: a norma nomeia o programa privado e lhe reserva três
  quartos da margem de cartão de crédito, deixando um quarto para todos os concorrentes somados. O convênio
  com a operadora seria publicado em 08/07/2021.'
