summary: >-
  Informe à Imprensa de 13/10/2026, às 18:43, assinado pela Secretaria de Comunicação do STF e pela Coordenação
  Geral de Comunicação Social da PF. O presidente do STF, Edson Fachin, recebeu, "em audiência solicitada pela
  Polícia Federal", o diretor-geral Andrei Rodrigues. Quanto às investigações do Master, o diretor-geral tratou do
  Ofício 3467748, de 02/10/2026, "solicitando informações sobre formato para apresentação do material
  respectivo"; o presidente esclareceu que "a eventual realização de atos de investigação de ministro depende de
  autorização do Plenário da Corte" e ressaltou que "a autoridade policial tem o dever de encaminhar todas as
  menções encontradas sem exceção, acompanhadas de seu contexto, em caráter estritamente descritivo"; apresentados
  os elementos, o Plenário, ouvida a PGR, "pode deliberar" nos termos do art. 33, parágrafo único, da Lei
  Complementar 35/1979. Sobre ameaças a ministros, a PF "reiterou seu compromisso de colaborar com a segurança".
  Sobre os inquéritos do INSS e do Master, a Presidência "aguarda pronunciamento da Procuradoria-Geral da
  República na Petição (PET) 16704". Sobre o INQ 4781, o presidente pediu celeridade à PF. Não fixa prazo para
  relatório nem nomeia ministros.
