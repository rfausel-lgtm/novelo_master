url: https://portal.stf.jus.br/processos/abaAndamentos.asp?incidente=7687920
source_type: official_court
summary: 'Despacho da Presidência que indefere pedido de inclusão da própria Pet 16.704 na pauta da sessão
  plenária extraordinária de 15/09/2026, mantendo-a "designada exclusivamente para apreciação da Pet 16.662".
  Determina que, finda a instrução da Pet 16.704, o processo seja incluído em calendário na sessão de
  23/09/2026.'
notes: Lido na aba de Andamentos pública do portal.stf.jus.br (texto do despacho já aparece ali porque o
  sigilo dos autos foi levantado em 10/09/2026); não foi baixada a peça individual via peticionamento.
