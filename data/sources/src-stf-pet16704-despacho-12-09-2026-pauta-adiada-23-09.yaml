title: Despacho de 12/09/2026 — Fachin mantém a sessão de 15/09 exclusiva à PET 16.662 e adia a Pet 16.704 para 23/09
publisher: Supremo Tribunal Federal
author: Ministro Presidente (Edson Fachin)
publication_date: '2026-09-12'
