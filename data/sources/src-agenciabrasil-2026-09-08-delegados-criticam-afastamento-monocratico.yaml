source_type: press
summary: 'Reproduz nota da associação nacional dos delegados da Polícia Federal sustentando que o afastamento
  do dirigente máximo da corporação não poderia dar-se por decisão monocrática, e que não havia inquérito,
  ação penal ou processo disciplinar instaurado contra os dois dirigentes. Trechos: ''Essa cautela impõe-se
  com maior razão no contexto dos fatos ora analisados, em que documentos integrantes de investigações
  em curso na própria Corte fazem referência a ministros que a compõem''; ''Circunstâncias dessa natureza
  exigem serenidade de todos os atores, respeito aos ritos processuais e confiança de que os fatos serão
  esclarecidos pelas vias constitucionais, sem antecipação de juízos''; e ''A recorrência desses episódios
  revela um problema estrutural: a direção da instituição responsável pela investigação das mais altas
  autoridades da República continua submetida a critérios de escolha e de permanência''.'
