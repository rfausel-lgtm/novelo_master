source_type: press
summary: 'O Instituto de Previdência Social dos Servidores de Cajamar (IPSSC) aplicou R$ 87 milhões em
  Letras Financeiras do Master em três operações: R$ 35 milhões (outubro/2023), R$ 25 milhões (dezembro/2023)
  e R$ 27 milhões (março/2024) — 15,36% da carteira do período, sob a gestão do então prefeito Danilo
  Joan (PP).'
