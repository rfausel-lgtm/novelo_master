summary: Veículo de menor rigor editorial. A manchete alega 'contrato milionário' pago pessoalmente a
  Renata Varandas, mas o corpo do texto documenta apenas contratos da Ambipar com o governo federal (R$
  480,9 milhões) e a presença do nome 'Ambipar' na biografia do Instagram dela — não traz nota fiscal,
  contrato ou qualquer documento que sustente pagamento pessoal milionário. Citada aqui apenas para registrar
  a existência de uma linha de cobertura mais grave e menos lastreada que a do Poder360, não como fonte
  factual sobre o valor alegado.
