summary: 'Varredura sistemática conduzida pela equipe. Foram testados 421 municípios; 409 estão hospedados
  na plataforma e 12 não. Rodaram-se em todas as sedes os termos do CNPJ da operadora, com e sem pontuação,
  e as grafias CREDCESTA, CREDICESTA, CRED CESTA, PKL e a razão social. Controle metodológico com termos
  inexistentes — CREDXESTA, CREDZZZ, PKLZ, CNPJ alterado — retornou conjunto vazio em todos, confirmando
  busca por token exato e não aproximada. Sete sedes retornaram atos com a operadora, e a convergência
  é total entre a busca por CNPJ e a busca por razão social. Ressalvas importantes: o termo ''PKL'' isolado
  retorna 38 municípios, quase todos por placas de veículo em editais de infração de trânsito — falso
  positivo identificado e descartado; e a palavra ''Credicesta'' aparece em decretos municipais de consignação
  referindo-se ao programa estadual criado em 2018, sem qualquer menção à operadora. A plataforma opõe
  desafio anti-bot na raiz e no mapa do site, registrado e não contornado; as rotas municipais são públicas
  e não desafiadas. Nenhum ato posterior a 31/07/2024 foi localizado.'
