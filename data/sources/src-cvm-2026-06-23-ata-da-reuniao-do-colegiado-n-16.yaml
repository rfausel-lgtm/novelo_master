summary: Ata da reunião do Colegiado da CVM de 23/06/2026, com o parecer do Comitê de Termo de Compromisso
  resumido em cada item (o parecer vem como anexo). No item do PAS 19957.011252/2025-50 (Reg. 3533/26), registra que a proponente é Fabiana
  Franco, diretora financeira da Reag Investimentos S.A., única acusada; que propôs pagar à CVM R$ 150.000,00;
  que a Procuradoria Federal Especializada não viu óbice jurídico; que o Comitê opinou pela rejeição; e que o
  Colegiado, por unanimidade, rejeitou a proposta, sendo o diretor Igor Muniz sorteado relator do processo.
notes: Aberta em 23/10/2026 com lote:fonte (sha256 f99c90ca56665c0e, 38.659 caracteres). A página não traz
  data de publicação; a data usada é a da reunião. O valor de R$ 193.623,90, que aparece em outro trecho da
  ata, refere-se à proposta de outro proponente (diretor da Americanas S.A., PAS 19957.000946/2023-08) e não à de Fabiana Franco.
