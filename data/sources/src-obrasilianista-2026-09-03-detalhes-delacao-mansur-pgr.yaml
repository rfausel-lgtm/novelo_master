summary: A audiência de voluntariedade de Mansur ocorreu em 03/09/2026, perante juiz auxiliar do gabinete
  de Mendonça. A proposta era composta por 17 anexos sobre diferentes temas; a multa aceita foi de R$
  40 milhões, valor equivalente ao que Mansur teria recebido da Reag como controlador.
