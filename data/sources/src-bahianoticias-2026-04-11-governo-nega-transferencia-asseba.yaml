summary: 'Traz a nota do governo da Bahia de 11/04/2026: ''Não é verdade que o governo injetou 140 milhões
  em uma associação de servidores controlada por Augusto Lima.'' O Estado sustenta que os valores são
  descontos em folha da taxa de associação, autorizados pelos próprios servidores — dinheiro dos servidores,
  e não do erário, sem operação financeira ou empréstimo.'
