summary: Registra que o prefeito de Fátima do Sul, Wagner da Garagem (PSDB), estuda projeto de lei para restringir
  aplicações previdenciárias a bancos oficiais, e atribui a aplicação de julho de 2024 à gestão anterior — outra
  prefeita, outra presidente do instituto. A atual presidente da previdência, professora Claudete Santos, não respondeu
  à reportagem. O prefeito descreve a previdência municipal como independente do Executivo, sem necessidade de aval
  da Prefeitura para decisões de investimento.
