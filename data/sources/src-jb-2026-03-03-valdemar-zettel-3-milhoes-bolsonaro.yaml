summary: 'O presidente do PL, Valdemar da Costa Neto, confirma a doação: ''Quando eles falam que ele foi
  o maior doador, é porque ele deu 3 milhões na campanha do Bolsonaro, deu diretamente na conta do Bolsonaro''
