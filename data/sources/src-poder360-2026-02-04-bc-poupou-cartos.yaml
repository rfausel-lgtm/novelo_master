summary: 'Apuração própria de Hamilton Ferrari, com base em depoimentos à Polícia Federal (Ailton Aquino,
  diretor de Fiscalização do BC; Paulo Henrique Costa, ex-presidente do BRB; Daniel Vorcaro) e documentos do
  Banco Central. Atribui a criação da Tirreno, em 04/11/2024, a André Felipe de Oliveira Seixas Maia —
  ex-funcionário do Master até março de 2022, diretor da Cartos e sócio da Tirreno —, não a Daniel Vorcaro nem
  à Cartos como empresa, e indica como falsa a versão pública do próprio Vorcaro de que Henrique Peretto teria
  criado a Tirreno. Traz negativa formal da Cartos ("não originou, estruturou, comercializou, intermediou ou
  cedeu quaisquer créditos ou títulos relacionados às investigações"). Menciona cerca de R$ 6 bilhões em créditos
  originados pela Tirreno; não reproduz os valores de R$ 12,2 bilhões nem o número de 130 contratos sem lastro
  atribuídos pela reportagem da Agência Pública a uma amostragem distinta do Banco Central.'
