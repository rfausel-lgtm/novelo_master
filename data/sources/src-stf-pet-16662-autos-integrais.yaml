summary: 'Conjunto completo das peças da PET 16.662, cujo sigilo foi levantado em 01/09/2026, obtido pelo
  editor com certificado digital e lido integralmente pela equipe. Além do relatório da Polícia Federal
  sobre o celular de Daniel Vorcaro, os autos contêm os três anexos que até então não eram públicos: os
  dois contratos de prestação de serviços firmados com o escritório Barci de Moraes e o termo de acordo
  e dação em pagamento. Contêm ainda os despachos do relator, a manifestação do procurador-geral da República
  e duas petições do Partido Novo.'
