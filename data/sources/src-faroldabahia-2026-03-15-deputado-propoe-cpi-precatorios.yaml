source_type: press
summary: O deputado estadual Leandro de Jesus (PL) protocolou, em 15/03/2026, pedido de CPI na Assembleia
  Legislativa da Bahia, com prazo proposto de 180 dias, para 'analisar as circunstâncias administrativas,
  financeiras e jurídicas relacionadas a operações de cessão, antecipação e pagamento de precatórios realizadas
  entre 2023 e 2026.' Não há confirmação de instalação da CPI até a data desta apuração.
