summary: Confirma, de forma independente, a condenação por unanimidade de Daniel Vorcaro (R$ 20 milhões)
  e Banco Master (R$ 12,5 milhões), com total de multas de R$ 201 milhões (16 acusados, 7 pessoas e 9
  empresas, 'todos condenados no processo, segundo a CVM') e prejuízo identificado de R$ 5,8 milhões.
  Registra que 'as multas individuais ficaram entre R$ 5 milhões e R$ 24 milhões' e que 'três ex-diretores
  da Sefer Investimentos foram absolvidos' — números que divergem, em parte, da contagem do Poder360 (ver
  open_question). O processo foi suspenso duas vezes por pedidos de vista; pedidos de adiamento das defesas
  não foram acolhidos. É processo autônomo, independente das investigações criminais da Operação Compliance
  Zero.
