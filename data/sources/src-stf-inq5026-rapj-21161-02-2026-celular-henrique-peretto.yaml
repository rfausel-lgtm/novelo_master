summary: 'Relatório de 20 páginas sobre o aparelho de Henrique Peretto. Registra que em 04/04/2025 um escritório de
  advocacia pediu a qualificação dele para uma vaga de "diretor para SPEs" e que ele enviou extrato de seu fundo
  exclusivo; analisa as posições de dois fundos ligados a ele, um multimercado e o FIDC não padronizado Pintia, e
  conclui que o Pintia, que Peretto dizia reservado a um futuro aumento de capital, valia R$ 31,44 milhões — valor
  muito próximo do que ele ficou responsável por integralizar no capital da Tirreno, segundo a ata de criação.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele), juntada ao INQ 5.026 em
  12/05/2026. IMEIs, documento de identidade e nomes de contatos que constam do relatório não são reproduzidos.'
