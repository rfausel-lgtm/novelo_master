summary: 'Decisão pública (Resolução STF 427/2010), baixada diretamente do portal do STF, que autoriza
  Alberto Felix de Oliveira Neto a se deslocar à Delegacia de Inquéritos Especiais (DELEINQUE/DRPJ/SR/PF/DF)
  em Brasília, em 16/06/2026, para prestar esclarecimentos no inquérito policial nº 2025.0087917-SR/PF/DF,
  em que figura como investigado — com flexibilização temporária do monitoramento eletrônico. A decisão
  estende a mesma autorização a "os demais investigados com medidas pessoais restritivas de liberdade" no
  âmbito do INQ 5.026, para o mesmo fim.'
notes: Documento público, baixado diretamente do portal do STF. Não depende do certificado digital do
  Rafael. Indica um inquérito policial correlato (2025.0087917-SR/PF/DF) ainda não referenciado no acervo.
