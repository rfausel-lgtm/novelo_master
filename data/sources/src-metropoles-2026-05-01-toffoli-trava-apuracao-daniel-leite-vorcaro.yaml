source_type: press
summary: 'Relatório da consultoria Kroll, contratada pelo BRB, aponta o advogado de São Luís (MA) Daniel
  de Faria Jerônimo Leite — conselheiro federal da OAB, ex-procurador do município de São Luís, sócio-fundador
  do escritório Daniel Leite & Advogados (fundado em 2007) — como ''figura instrumental'' de Daniel Vorcaro,
  Maurício Quadrado e João Carlos Mansur na tentativa de compra de ações do BRB. Em abril de 2025, Leite
  tomou empréstimo de R$ 93,7 milhões, usado majoritariamente para comprar ações do BRB via fundos de
  investimento, incluindo o fundo Verbier, administrado por Quadrado. O escritório de Leite mantinha contrato
  de cerca de R$ 180 mil/ano com a Câmara Municipal de Imperatriz (MA), firmado em abril de 2023 e renovado
  em abril de 2025 sem nova licitação, o que levou o Ministério Público do Maranhão a apurar possível
  improbidade administrativa. Patrimônio declarado por Leite: BRB estimou R$ 6 milhões; ele contrapôs
  R$ 75 milhões, incluindo propriedades rurais.'
