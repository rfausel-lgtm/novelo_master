summary: Reproduz vídeo do depoimento de Vorcaro à PF em 28/08/2026, obtido e divulgado pela CNN Brasil
  em 04/09/2026. Vorcaro diz ter passado 'um terror', reconhece 'erros' no processo do Master mas insiste
  que a venda ao BRB e a liquidação 'precisam ser esclarecidas'; afirma ter sido surpreendido pela decisão
  de liquidar o banco, dizendo ter apresentado propostas de solução que não teriam sido avaliadas; sinaliza
  ter 'muitos temas a revelar' e pede colaboração.
