summary: 'Linha do tempo: o Intercept divulgou áudios, prints e documentos sobre tratativas entre Flávio
  Bolsonaro e Vorcaro para o filme; Flávio negou relação horas antes (''mentira'') e em 14/05, à GloboNews,
  admitiu (''Eu menti''), atribuindo a negativa a contrato de confidencialidade não apresentado; disse
  ter conhecido Vorcaro em dezembro de 2024. Envolve Mário Frias, Eduardo Bolsonaro, Go Up Entertainment,
  Entre Investimentos e Participações e Havengate Development Fund LP (Texas).'
