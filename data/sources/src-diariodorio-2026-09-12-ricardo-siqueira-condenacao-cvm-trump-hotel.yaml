source_type: press
summary: 'Ricardo Siqueira Rodrigues — o mesmo operador apontado pela PF como intermediário dos aportes do
  RioPrevidência no Banco Master — foi condenado pela CVM em dezembro de 2024 por fraude no empreendimento
  imobiliário LSH Hotel (que teve licença para usar a marca Trump, na Barra da Tijuca): R$ 17,7 milhões de
  condenação individual, dentro de uma fraude total estimada em R$ 45 milhões no projeto. Segundo a decisão,
  votou pela aprovação de um laudo que sabia estar inflacionado, "com consciência de que havia vantagem
  indevida envolvida no esquema" — caracterizado pela CVM como "operação fraudulenta, atuação irregular no
  mercado de valores mobiliários e quebra do dever de diligência". Co-réu no processo: Paulo Figueiredo
  Filho, sócio no empreendimento.'
notes: Verificado por leitura direta da reportagem (WebFetch), não apenas resumo de busca. Não confirmado,
  nesta coleta, se a condenação já transitou em julgado ou segue em recurso.
