summary: 'Documento do BRB ao BC de 23/04/2025 (revelado pelo Metrópoles e obtido pela CNN): em 04/04/2025
  João Carlos Mansur, fundador da Reag, adquiriu por meio do fundo Celeno, administrado pelo Master, recibos
  de ações preferenciais e ações ordinárias do BRB por R$ 193.264.870,97, no aumento de capital de R$
  2,3 bilhões; detém 4,5% da estatal. O BC relatou ao TCU que parte das fraudes envolve fundos administrados
  pela Reag (jul/2023–jul/2024). A defesa de Mansur não respondeu.'
