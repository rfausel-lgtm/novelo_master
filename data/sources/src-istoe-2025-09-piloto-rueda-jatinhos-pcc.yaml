source_type: press
summary: 'O piloto Mauro Caputti Mattosinho, 38 anos, afirmou à PF que Antônio Rueda é proprietário oculto
  de quatro dos dez jatos executivos operados pela Táxi Aéreo Piracicaba (TAP), empresa que ele deixou
  duas semanas antes da deflagração da Operação Carbono Oculto: "Havia um clima de ''boom'' de crescimento
  na empresa. E isso foi justificado como sendo um grupo muito forte, encabeçado pelo Rueda, que vinha com
  muito dinheiro que precisava gastar". Diz ter transportado cerca de 30 vezes Roberto Augusto Leme da Silva
  ("Beto Louco") e Mohamad Hussein Mourad ("Primo"), foragidos apontados como líderes do esquema de
  combustíveis ligado ao PCC. Rueda chamou as acusações de "ilações irresponsáveis sem fundamento", com
  motivação política.'
