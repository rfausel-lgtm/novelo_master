summary: 'Publicada na edição nº 24.178, suplemento, p. 1, e lida pela equipe. Diferentemente dos demais
  estados examinados, Goiás criou a margem exclusiva por lei, não por decreto: o novo §15 do art. 5º determina
  que ao limite das consignações facultativas ''somam-se 10% (dez por cento)'' da remuneração, ''reservados,
  exclusivamente, para descontos a favor das instituições que operem com o cartão de benefício''; o §16
  limita o adicional a 5% para empregados públicos celetistas. Regulamentada pelo Decreto nº 10.372, de
  22/12/2023, cujo art. 14 remete expressamente a esses parágrafos.'
