summary: Relata que a PF deflagrou em 19/05/2026 a sétima fase da Operação Compliance Zero contra um perito
  criminal que teria repassado informações sigilosas à imprensa, com dois mandados de busca e apreensão e
  medidas cautelares diversas da prisão, incluindo a suspensão da função pública; diz que a fase foi
  autorizada por Mendonça e reproduz trechos da nota do STF. Não nomeia o investigado.
