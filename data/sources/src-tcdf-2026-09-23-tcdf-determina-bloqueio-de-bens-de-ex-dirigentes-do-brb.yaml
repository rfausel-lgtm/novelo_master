url: https://www2.tc.df.gov.br/tcdf-determina-bloqueio-de-bens-de-ex-dirigentes-do-brb/
source_type: official_regulator
language: pt-BR
summary: >-
  Nota institucional: em sessão reservada de 23/09/2026 o TCDF decidiu, em caráter cautelar, determinar a
  indisponibilidade de bens de ex-integrantes da alta administração do BRB, com 30 dias para manifestação,
  com o objetivo de "resguardar eventual ressarcimento aos cofres públicos". Prevê instrução prioritária do processo,
  bloqueio por um ano, conversão em Tomada de Contas Especial, 24 horas para o banco enviar o relatório da
  auditoria independente, audiência do atual diretor-presidente (30 dias) e 15 dias para esclarecimentos
  sobre a representação do MPC/DF. Não nomeia os atingidos nem informa valor ou relator. Trecho literal: "A
  medida tem por objetivo resguardar eventual ressarcimento aos cofres públicos diante de indícios apontados
  em apurações relacionadas a operações conduzidas pela instituição financeira."
