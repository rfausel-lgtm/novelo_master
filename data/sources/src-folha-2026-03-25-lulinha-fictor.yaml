summary: Reportagem que atribui a Fábio Luís Lula da Silva prestação de consultoria ao grupo Fictor em
  2024, com base em dois executivos anônimos que trabalharam no grupo. A Fictor tentou comprar o Banco
  Master em novembro de 2025. A defesa nega vínculo profissional com o grupo e a Secretaria de Relações
  Institucionais nega indicação para cargo público. Todas as demais publicações localizadas reproduzem
  esta reportagem, de modo que não há segunda fonte independente.
