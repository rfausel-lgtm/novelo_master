source_type: press
language: pt-BR
summary: >-
  Diz ter obtido contrato entre o Banco Master e o escritório Queiroga, Vieira, Queiroz & Ramos Advocacia que
  prevê a prestação de serviços por Camilla Ramos, mulher do desembargador Newton Ramos (TRF-1), em 12
  processos do setor sucroalcooleiro, com honorários de 5% líquidos sobre o valor recebido pelo banco; segundo
  o valor de face das causas, os honorários seriam de R$ 427 milhões em caso de êxito, sobre cerca de
  R$ 8,5 bilhões. Afirma que o material consta de HD enviado pela PF ao gabinete do ministro André Mendonça em
  julho e que mensagens de assessores de Vorcaro chamam o casal de "turma do KN", sigla que a reportagem lê
  como menção ao ministro Kassio Nunes Marques. Traz as notas de Newton Ramos e de Nunes Marques; não traz nota
  do escritório.
notes: >-
  Matéria atualizada às 13h27 de 21/09/2026. O título usa a expressão do veículo. A leitura "KN = Nunes Marques"
  é afirmação da reportagem. A matéria transcreve mensagens privadas e descreve episódios (hospedagens,
  imóvel, viagem) que o Novelo não reproduz neste lote. A expressão "até R$ 427 milhões" não aparece nesta
  matéria (aparece no Metrópoles de 24/09).
