summary: Descreve Garigham Amarante Pinto como advogado, ex-diretor do FNDE no governo de Jair Bolsonaro e
  ocupante de cargo de natureza especial na Câmara, citado na decisão do ministro Flávio Dino; registra que,
  procurado, ele disse que não vai se manifestar. Usada para o contraditório e para a descrição do cargo,
  sempre atribuídas.
notes: A manchete usa o verbo do relato da PF ("negociava"); o Novelo não o adota em texto próprio. A matéria
  traz também trecho de reportagem de 2022 sobre bens de um ex-diretor, que o Novelo não registra.
