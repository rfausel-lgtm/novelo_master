summary: Processo administrativo SEI 12.146/2026, lido pela equipe. O despacho registra que 'a presente
  medida decorre da necessidade de estabelecer segurança jurídica e adequada delimitação institucional
  dentro do regime de exercício da atribuição prevista no art. 43 do Regimento Interno do Supremo Tribunal
  Federal por esta Presidência', e invoca a ADPF 572, na qual o Plenário reconheceu a constitucionalidade
  da Portaria GP nº 69/2019 'nas específicas e próprias circunstâncias de fato exclusivamente envolvidas
  com aquele ato'. A Portaria 189 revoga a designação de Alexandre de Moraes, determina que inquéritos
  e procedimentos preliminares retornem à relatoria da Presidência, que 'após análise remeterá os autos
  à autoridade policial e, ato contínuo, à Procuradoria Geral da República para oferecimento da denúncia
  ou requerimento do arquivamento', e mantém com Moraes a delegação quanto às ações penais já instauradas
  com denúncia recebida.
