summary: Nota da CVM (publicada em 30/06/2026, 19h28) sobre a reunião do Colegiado de 23/06/2026, que analisou
  quatro propostas de termo de compromisso. No item 3, o Colegiado acompanhou o parecer do Comitê de Termo de
  Compromisso (CTC) e rejeitou a proposta de Fabiana Franco, na qualidade de diretora financeira da REAG
  Investimentos S.A., no PAS 19957.011252/2025-50, instaurado pela SEP para apurar supostas irregularidades na
  não elaboração das demonstrações financeiras anuais de 2024 e dos formulários de informações trimestrais do
  1º e 2º trimestres de 2025. Os demais itens da nota (Americanas, Nova Futura CTVM, Braskem) não são objeto
  deste lote.
notes: Aberta em 23/10/2026 com lote:fonte (sha256 2804f00b3021efd2, 19.587 caracteres) e lida na íntegra do
  item 3. A nota não informa o valor proposto; o valor consta da ata.
