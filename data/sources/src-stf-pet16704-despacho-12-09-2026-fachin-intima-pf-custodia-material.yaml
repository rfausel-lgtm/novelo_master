summary: 'Aba de andamentos públicos da Pet 16.704 (incidente 7687920), consultada sem certificado digital.
  Registra, em 12/09/2026, despacho da Presidência (Fachin): "Intime-se a Polícia Federal para que preste
  informações, em até 24 (vinte e quatro) horas, sobre a custódia do material e o estado em que se encontra."
  O despacho aparece entre a juntada dos ofícios de Moraes/Gilmar Mendes sobre o compartilhamento do HD do
  celular de Vorcaro e a juntada, no mesmo dia, de um "mandado cumprido" pela PF — não há, no andamento
  público, menção explícita a qual "material" se refere, mas a posição na sequência e o contexto (toda a
  tramitação do dia trata do HD lacrado com a extração do celular de Daniel Vorcaro) tornam essa a leitura
  mais direta.'
notes: Consultado só pelo andamento público (sem teor da petição/certidão), por isso registrado como
  evidência classe D com ressalva de leitura, não A.
