summary: O ministro Flávio Dino determinou, em 09/09/2026, a imediata reintegração de Andrei Rodrigues
  e Leandro Almada da Costa à Polícia Federal, neutralizando a decisão de André Mendonça de 08/09/2026.
  Afirmou que a decisão se submete exclusivamente à autoridade do Plenário do STF. Determinou que, após
  cumprimento integral, seja dada vista ao PGR e o processo volte concluso para nova decisão.
