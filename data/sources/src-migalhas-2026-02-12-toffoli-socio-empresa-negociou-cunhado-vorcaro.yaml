source_type: press
summary: Reproduz nota oficial de Toffoli sobre sua participação (apenas dividendos, sem gestão) na empresa
  Maridt, que vendeu participação no resort Tayayá (Ribeirão Claro/PR) ao fundo Arllen, ligado a Fabiano
  Zettel — cunhado de Daniel Vorcaro —, em duas etapas (27/09/2021 e 21/02/2025). Toffoli nega ter recebido
  'qualquer valor de Daniel Vorcaro ou de seu cunhado Fabiano Zettel' e afirma que 'todas as vendas foram
  realizadas a valor de mercado'.
