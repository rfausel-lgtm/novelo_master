source_type: press
summary: 'Em 25/03/2022, a Polícia Militar de São Paulo abordou um veículo na Av. Olavo Fontoura (zona norte
  de SP) e apreendeu cerca de R$ 500 mil em espécie, pertencentes a Alberto Samuel Alcolumbre Tobelem. O
  caso foi registrado no 13º Distrito Policial (Casa Verde) como localização/apreensão de objeto. A reportagem
  registra que a assessoria do senador Davi Alcolumbre, provocada pela imprensa, declarou que o senador
  estava no Amapá, soube do caso pela imprensa, e que o dinheiro seria relativo à atividade profissional
  "do irmão" — formulação atribuída ao próprio gabinete do senador. O episódio é anterior e independente
  da cobertura de 2026 sobre o Banco Master/Amprev.'
notes: Localizado por WebSearch/WebFetch em investigação sobre o parentesco entre Alberto Samuel Alcolumbre
  Tobelem e o senador Davi Alcolumbre, solicitada por Rafael e delegada a um agente OSINT. O mesmo episódio
  foi coberto de forma independente por Metrópoles, CartaCapital e Gazeta do Povo, todos identificando
  Alberto Samuel como irmão do senador.
