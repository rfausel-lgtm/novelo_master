summary: Flávio Dino tomou posse solene como ministro do STF em 22/02/2026, na vaga de Rosa Weber, após
  indicação de Lula em 27/11/2023 e sabatina/aprovação na CCJ e no plenário do Senado em 13/12/2023. Foi
  governador do Maranhão (2015-2023, dois mandatos) e ministro da Justiça e Segurança Pública do terceiro
  governo Lula a partir de janeiro de 2023.
