summary: 'Reportagem publicada no mesmo dia da 8ª fase da Compliance Zero, que dá o número mais explícito para a
  soma: a PF identificou R$ 2,01 bilhões em aportes adicionais, feitos após julho de 2024 em fundos de investimento
  do Master, que somados aos R$ 970 milhões originais em letras financeiras levam o total investido pelo Rioprevidência,
  enquanto Cláudio Castro governava o Rio, a R$ 3 bilhões. Registra que o TCE-RJ acompanhava as movimentações havia
  mais de um ano por conta do perfil de risco dos ativos, e que emitiu alerta formal em outubro de 2025, proibindo
  novos aportes em papéis administrados pelo Master.'
