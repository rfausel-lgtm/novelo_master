summary: Perfil de Leonardo Palhares e da associação SOLAR, aberta em fevereiro de 2025, que gere recursos
  da Fundação Solar — ONG de educação na África que tem como representante uma filha menor de idade de
  Daniel Vorcaro. Registra a suspeita de que a ONG servisse de veículo de movimentação financeira do grupo
  e que mantinha contas no Master durante a crise de liquidez. A reportagem registra que Palhares não
  respondeu.
