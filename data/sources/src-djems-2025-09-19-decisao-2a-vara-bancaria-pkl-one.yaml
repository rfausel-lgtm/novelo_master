summary: 'Caderno judicial de primeira instância, edição 5.720, página 529, lida pela equipe. Ação de
  procedimento comum ajuizada em 28/08/2025 contra seis instituições, entre elas a PKL One Participações
  S.A. O juízo consigna que a empresa ''aparentemente, não é instituição financeira regulada pelo Banco
  Central'' e intima o autor a manifestar-se sobre a competência do juízo especializado. Precisão necessária:
  a frase que circulou na imprensa — de que a empresa ''não compõe a lista de instituições financeiras''
  — não está nesta decisão de setembro de 2025, e sim em decisões de 2026 da mesma vara. A publicação
  não nomeia o magistrado.'
