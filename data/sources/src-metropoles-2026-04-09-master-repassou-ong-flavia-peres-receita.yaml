source_type: press
summary: 'Segundo dados da Receita Federal citados pela coluna, o Banco Master declarou ter repassado
  R$ 457,2 mil, em dois anos, ao Instituto Terra Firme — associação presidida por Flávia Peres, esposa
  de Augusto Lima. Traz nota de Flávia Peres negando qualquer relação financeira: ''Não há qualquer relação
  financeira que envolva repasses, dependência econômica ou subordinação entre as instituições.'' A mesma
  reportagem menciona, sem se referir ao CNPJ do Instituto, um repasse maior e distinto — R$ 264 milhões
  entre 2022 e 2025 — à ''Terra Firme da Bahia Ltda'', empresa de propriedade de Augusto Lima já documentada
  no corpus.'
