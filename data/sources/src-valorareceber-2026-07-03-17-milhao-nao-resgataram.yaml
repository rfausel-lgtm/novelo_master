summary: 'Reportagem sobre o estágio do processo de pagamento em 03/07/2026: 1,7 milhão de pessoas ainda
  não haviam resgatado cerca de R$ 2,2 bilhões, concentrados majoritariamente entre credores do Will Bank
  (apenas 19% dos credores com valores até R$ 1 mil haviam solicitado a garantia), enquanto 2,5 milhões
  de clientes já haviam recebido cerca de 95,71% do valor devido.'
