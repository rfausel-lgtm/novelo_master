source_type: press
language: pt-BR
summary: "Texto da Folhapress (24/12/2025): Dias Toffoli determinou, no processo sigiloso sob sua relatoria no
  STF, uma audiência conjunta, em acareação, de Daniel Vorcaro, do diretor de Fiscalização do Banco Central e
  de Paulo Henrique Costa, ex-presidente do BRB, marcada para 30/12/2025 às 14h, em pleno recesso; a Folha diz
  ter confirmado a convocação com três pessoas com conhecimento da decisão e que ela foi tomada sem pedido
  anterior dos investigadores da PF; registra que nenhum integrante do BC é investigado."
notes: Republicação da Folhapress no Jornal de Brasília; conta como uma fonte (Folha). O texto diz que a
  convocação foi noticiada antes pelo Poder360, cuja nota original o Novelo não abriu.
