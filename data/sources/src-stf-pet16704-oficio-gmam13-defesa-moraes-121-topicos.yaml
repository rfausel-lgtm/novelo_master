summary: 'Ofício de 44 páginas e 121 tópicos, enviado por Moraes a Fachin em cumprimento ao despacho de
  03/09/2026, na véspera da sessão extraordinária de 15/09/2026 que julgaria o parecer da PGR pela nulidade
  da investigação contra ele. Estruturado em quatro blocos: (A) nulidade da instauração de ofício da
  investigação contra ministro do STF, por magistrado incompetente e sem autorização do Plenário; (B)
  alegação de direcionamento ilegal da investigação por André Mendonça, com acusações de que Mendonça teria
  vazado informações à imprensa antes de 7/9/2026 e gravado vídeo nas redes sociais na véspera de atos
  políticos, por motivação político-eleitoral, e de que teria tentado incluir Moraes e o senador Davi
  Alcolumbre em colaboração premiada por "motivos pessoais e políticos"; (C) alegação de nulidade do
  relatório da PF por quebra de cadeia de custódia, incluindo a insinuação, não comprovada, de que o
  relatório teria sido produzido com auxílio de "órgão externo, provavelmente estrangeiro"; (D) alegação de
  que os 7.742 documentos dos autos da Operação Compliance não trazem nenhum indício de conduta ilícita por
  parte de Moraes.'
notes: 'Documento extremamente hostil a Mendonça, com acusações graves e diretas (vazamento, motivação
  eleitoral, insinuação de interferência estrangeira) apresentadas como fato consumado pelo próprio Moraes,
  sem comprovação documental própria anexada a estas peças. Tratado no acervo como ALEGAÇÃO DE PARTE
  INTERESSADA — o próprio investigado se defendendo — não como fato estabelecido. Mendonça não se manifestou
  publicamente sobre estas acusações específicas até esta coleta.'
