source_type: press
summary: 'Nota da própria associação de institutos de previdência de Mato Grosso do Sul sobre reunião em Jateí,
  em 24/03/2026, para discutir apoio institucional às demandas do JATEIPREV relacionadas ao Banco Master, com foco
  em estratégias de proteção e possível recuperação dos recursos previdenciários. Nomeia os participantes: o presidente
  do JATEIPREV, Luciano Francisco da Silva; o tesoureiro, Márcio Andrade Thomaz; a representante do Comitê de Investimentos,
  Dayana Vieira; o presidente da Câmara Municipal, Robson Carmo Monteiro; e a prefeita de Jateí, Cileide Cabral
  da Silva Brito. É a fonte mais próxima do instituto entre as consultadas para este caso — publicada pela própria
  associação setorial —, mas não traz valor, data ou natureza específica do investimento.'
notes: 'É o caso mais pobre em fontes deste lote: a equipe não localizou reportagem, ata ou parecer com o valor
  e a data precisos do investimento de Jateí, apenas a cifra aproximada de R$ 2,5 milhões, citada por outra reportagem
  não recuperada nesta apuração, e a resposta institucional aqui registrada.'
