source_type: press
language: pt-BR
summary: Reportagem original do Estadão (publicada às 13h32 de 16/10/2026, atualizada às 23h24). A linha fina
  afirma que diálogos mostram que a influenciadora firmou acordo de 12 meses com o banco e recebia orientações
  de Vorcaro e de sua equipe, e registra que, procurada, Prioli disse que o banqueiro “jamais editou” seu
  conteúdo e negou ter sido contratada pelo Master. O resumo publicado pelo próprio Estadão acrescenta que,
  segundo as conversas, ela enviava vídeos para aprovação e absorvia pedidos de edição.
