source_type: press
language: pt-BR
summary: >-
  Segundo a matéria, documentos da PF tornados públicos por André Mendonça em 16/06/2026 registram que, em
  18/06/2024, Vorcaro pediu a Léo Serrano, descrito como intermediário de operações do banqueiro, reservas em
  Lisboa para si e para "Ciro" e "Hugo"; a PF calculou R$ 91.280,59 para cinco diárias atribuídas a Ciro
  Nogueira; os documentos não detalham individualmente os gastos atribuídos a Hugo Motta. Motta disse ver o
  evento como corporativo; a defesa de Ciro não respondeu até a publicação. Não cita número de Pet nem data
  do relatório.
