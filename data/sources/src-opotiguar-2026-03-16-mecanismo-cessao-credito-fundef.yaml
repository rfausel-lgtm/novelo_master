source_type: press
summary: 'Detalha o mecanismo, citando a Secretaria da Administração da Bahia: servidores da Educação
  com direito a precatórios do Fundef ''optaram por antecipar valores junto ao Banco Master através de
  cessão de crédito. Após formalização, o Estado efetua pagamento direto ao banco, que se torna titular
  do crédito por escolha do servidor.'' A Secretaria declarou que ''os pagamentos mencionados na imprensa
  não dizem respeito a contratação nem a qualquer relação direta do Estado com o Banco Master.'' Atribui
  o instrumento à Emenda Constitucional 114/2021 (norma federal, não decisão discricionária estadual).
  O PT nacional, por Éden Valadares, secretário de comunicação: ''O Estado apenas faz o repasse de operações
  estabelecidas entre servidores e o banco em questão.'''
