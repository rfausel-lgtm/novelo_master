summary: Aprovação, em discussão única, do substitutivo da Comissão de Constituição e Justiça ao PL 7.726/2026,
  do deputado Luiz Paulo com 28 coautores. O texto suspende cautelarmente os descontos ligados ao Banco
  Master e ao CredCesta até a conclusão de auditoria, tendo como gatilho objetivo a intervenção, liquidação
  ou regime especial de instituição financeira; veda novos convênios durante a cautelar; e fixa prazo
  de auditoria de 30 dias prorrogáveis. O substitutivo é mais brando que o texto original. Seguiu para
  sanção do governador em exercício, com prazo registrado pela própria Casa até 02/10/2026.
