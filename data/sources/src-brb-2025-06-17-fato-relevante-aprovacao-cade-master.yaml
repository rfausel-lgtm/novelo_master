summary: Comunicado ao mercado do BRB, de 17/06/2025, segundo o qual o Cade aprovou, sem restrições, a
  aquisição pelo BRB de 49,0% das ações ordinárias, 100% das preferenciais e 58,04% da participação total do
  Banco Master. Diz que a conclusão da operação segue sujeita às demais condições precedentes do contrato e às
  aprovações regulatórias pendentes. É declaração do emissor; o ato do Cade não foi localizado.
