summary: Registra que, depois que a investigação da Fundo Fake chegou à Justiça Federal, em 2019, Vorcaro,
  Botelho e outros onze alvos foram objeto de mandados de prisão — cautelares que nunca foram cumpridas
  e cuja ordem judicial acabou anulada meses depois. Registra também a cadeia de nomes da corretora (Foco
  DTVM, Índigo Investimentos DTVM e Sefer Investimentos), o papel do Brazil Realty FII nas investigações,
  e afirma que Botelho renunciou à nacionalidade brasileira em janeiro de 2024, naturalizando-se português.
