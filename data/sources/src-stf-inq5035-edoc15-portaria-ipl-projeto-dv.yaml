summary: 'Portaria de 90 páginas que instaura o IPL 2026.0009625-CINQ/CGRC/DICOR/PF, embrião do que se
  tornaria o Inquérito 5.035 sobre o "Projeto DV" — a campanha paga de Daniel Vorcaro contra o Banco
  Central, já bastante documentada no acervo a partir da decisão de 10ª fase (PET 16.346, julho de 2026).
  É peça mais primitiva e granular: inclui a Informação de Polícia Judiciária nº 82854/2026 (prints de
  reportagens e transcrição de vídeos de denúncia de influenciadores) e a Informação nº 97765/2026
  (mapeamento de contrainteligência de dezenas de perfis de redes sociais). O achado mais relevante é que
  a própria Portaria — não uma testemunha, a peça oficial de abertura do inquérito — descreve o objetivo
  da campanha como influenciar decisões "tanto perante o Supremo Tribunal Federal, quanto perante o
  Tribunal de Contas da União". Identifica ainda Leonardo Antônio Lima Dias ("Léo Dias") como segundo
  intimado no mesmo despacho de Thiago Miranda, um possível sócio majoritário (Flávio Carneiro, 60%) do
  Grupo Leo Dias ou da Agência MiThi, e a empresa Olivetto Comunicação como contraparte contratual.'
notes: 'Documento obtido pelo próprio Rafael via certificado digital, parte do download completo do INQ
  5.035 (83 peças) — nova frente aberta após o despacho de levantamento de sigilo de 10/09/2026 (Petição
  16.704). Lido por dois agentes de pesquisa em paralelo, cada um cobrindo um dos dois documentos mais
  densos do acervo (este e o e-Doc 42), com síntese e verificação final deste orquestrador.'
