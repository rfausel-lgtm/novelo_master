summary: Cobertura da deflagração da Operação Barco de Papel, em 23/01/2026, com quatro mandados de busca e apreensão
  cumpridos no Rio de Janeiro, entre os alvos Deivis Marcon Antunes (diretor-presidente), Euchério Lerner Rodrigues
  (ex-diretor de investimentos) e Pedro Pinheiro Guerra Leal (ex-diretor de investimento interino, exonerado em
  dezembro). A investigação, iniciada em novembro de 2025, apura nove operações financeiras entre novembro de 2023
  e julho de 2024 que resultaram em cerca de R$ 970 milhões aplicados em letras financeiras do Master — o núcleo
  original do caso, distinto dos fundos de investimento identificados depois. Registra que o TCE-RJ alertou o fundo
  em maio de 2025 sobre concentração excessiva de recursos no Master, repetiu a cobrança em outubro e, diante da
  continuidade dos aportes, determinou tutela inibitória proibindo novos investimentos. O Rioprevidência declarou
  à reportagem que os investimentos seguiram a legislação vigente, que o calendário de pagamentos segue normal,
  e que está resguardado por decisão judicial de dezembro de 2025 que determinou a retenção de cerca de R$ 970 milhões,
  acrescidos de juros e correção, via descontos de empréstimos consignados que seriam repassados ao banco — mecanismo
  pelo qual a autarquia projeta liquidar o investimento em cerca de dois anos.
