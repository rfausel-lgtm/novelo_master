summary: 'Em 24/06/2026, após reunião com Lula, Wagner deixou a liderança do governo no Senado: ''minha
  prioridade absoluta é provar minha inocência''. Na 9ª fase da Compliance Zero (18/06) foram 18 mandados
  de busca (BA, SP, DF), tendo também Augusto Lima, proprietário do Banco Pleno, entre os alvos.'
