summary: 'Levantamento do Poder360 no acervo pericial (IPED) enviado pela PF à CPMI do INSS: o celular
  de Vorcaro tinha ao menos 84 contatos, incluindo Alexandre de Moraes, Dias Toffoli, Viviane Barci de
  Moraes, Nunes Marques e Ricardo Lewandowski, além do presidente e diretores do BC. Os dados confirmam
  os contatos na agenda, mas não indicam conversas específicas com eles.'
