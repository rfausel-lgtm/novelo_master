summary: Relata despacho de 08/01/2026 em que Jhonatan de Jesus suspendeu a inspeção no Banco Central e mandou
  o caso ao Plenário do TCU, ao apreciar embargos de declaração do BC que sustentavam que só órgão colegiado
  poderia determinar a inspeção; transcreve trechos em que o relator chama o argumento de "leitura restritiva
  de dispositivo regimental" e afirma que o Regimento contempla poderes instrutórios do relator.
