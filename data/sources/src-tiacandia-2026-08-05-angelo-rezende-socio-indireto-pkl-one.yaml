source_type: press
summary: 'Detalha a cadeia societária citada pelo UOL: a PKL One é detida pelo fundo Diamond (antigo Reag34),
  controlado por dois fundos com cerca de metade cada — Gardênia e Fortress. O Gardênia tem entre seus
  cotistas o fundo MMPG, que ''pertence exclusivamente a Ângelo Rezende''. O Fortress é controlado pela
  WNT Master Fortress, empresa nas Bahamas ligada a Valério Marega. Ângelo Rezende não aparece como sócio
  direto da PKL One. O UOL contatou Jaques Wagner, Augusto Lima, Ângelo Rezende e Guilherme Sodré para
  comentário; nenhum respondeu até a publicação.'
