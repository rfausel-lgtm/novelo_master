summary: 'Requerimento de convocação de Yan Felix Hirano à CPI do Crime Organizado, aprovado pelo colegiado
  em 31/03/2026. Sustenta que documentos registrados na CVM em outubro de 2015 confirmariam que Oliver
  Ortiz figurava como cotista de fundos administrados pela antiga Foco DTVM — atual Sefer Investimentos
  —, inclusive o Aquilla FII, e que este fundo teria investido no Fundo São Domingos, veículo utilizado
  na aquisição do Banco Máxima em 2017. Acrescenta que registros da Receita Federal demonstram que Hirano
  e Benjamim Botelho de Almeida figuram conjuntamente como sócios-administradores da Associação dos Ocupantes
  do Centro Logístico de Queimados (ASOCLQ) desde junho de 2012. O próprio texto usa o condicional: a
  triangulação indicaria que recursos ''possivelmente'' de origem ilícita ''teriam sido'' introduzidos.'
