summary: 'Pauta oficial, atualizada em 28/08/2026 e publicada no Diário Eletrônico de 07/08/2026, marcando
  para 08/09/2026, às 15h, em sessão presencial no Rio de Janeiro, o julgamento de dois processos do caso,
  ambos sob relatoria do diretor João Accioly: o PAS 19957.007976/2020-94, sobre ''operação fraudulenta
  no mercado de capitais, cumulada com violação de deveres fiduciários e informacionais e prática de embaraço
  à fiscalização'' no Brazil Realty FII; e o PAS 19957.005363/2021-01, sobre criação de condições artificiais
  de demanda em transferência de cotas do mesmo fundo.'
