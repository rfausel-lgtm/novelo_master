url: https://agenciabrasil.ebc.com.br/justica/noticia/2026-10/defesa-quer-que-mendonca-analise-soltura-de-daniel-vorcaro
source_type: wire
language: pt-BR
summary: >-
  A defesa pede a Edson Fachin que julgue o pedido de soltura ou autorize André Mendonça a fazê-lo; segundo a
  petição, "O peticionário está preso há mais de oito meses, sem ter sido indiciado, sem ação penal".
notes: >-
  A matéria diz que Vorcaro está preso "em março deste ano", o que corresponde à preventiva decretada pelo STF
  em 04/03/2026 (PET 15556), não à prisão de 17/11/2025 (1ª fase, revogada dias depois pelo TRF-1).
