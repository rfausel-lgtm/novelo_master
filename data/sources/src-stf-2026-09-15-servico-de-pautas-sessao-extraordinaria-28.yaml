summary: 'Consulta feita pela equipe ao serviço de pautas do tribunal. Para 15/09/2026 registra sessão
  do Plenário às 10h, do tipo extraordinária, nº 28/2026, com um único incidente: Petição 16.662, relator
  o ministro André Mendonça, classificada no grupo ''matéria penal''. Registra ainda o cancelamento da
  sessão da Primeira Turma daquele dia, ''em razão da convocação de Sessão Plenária Extraordinária para
  15 de setembro de 2026, às 10h''. A pauta não contém as petições relativas ao afastamento dos dirigentes
  da Polícia Federal.'
