summary: Duas relações municipais de licenciamento, publicadas em 02/10/2023 e 18/10/2023, em que a PKL One Participações
  S.A. figura com endereço próprio na avenida Nossa Senhora da Penha, 714, Edifício RS Trade Tower, lojas 03 e 04,
  no bairro Praia do Canto, em Vitória. A primeira relação descreve a atividade da empresa como 'Holdings de Instituições
  Não-Financeiras'; a segunda registra validade até 05/09/2028. É registro municipal de presença física, e não de
  credenciamento em folha.
notes: As relações identificam a empresa pelo nome e pela atividade, sem imprimir o cadastro nacional; a correspondência
  com a operadora é feita pelo nome empresarial e pela atividade declarada, que coincide com o cadastro da Receita
  Federal.
