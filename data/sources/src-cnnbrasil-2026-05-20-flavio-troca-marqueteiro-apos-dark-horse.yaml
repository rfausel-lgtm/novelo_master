summary: Registra que o publicitário Marcello Lopes, amigo pessoal de Flávio Bolsonaro, deixou a pré-campanha presidencial
  do senador em 20/05/2026, substituído por Eduardo Fischer. Por nota, Lopes disse que se reuniu com o senador na
  tarde daquele dia, que não poderia colaborar com a campanha, que iria focar na própria empresa e que voltaria
  aos Estados Unidos para cumprir agenda familiar. A saída ocorreu em meio à repercussão das mensagens e do encontro
  entre Flávio e Daniel Vorcaro, episódio em que o pré-candidato pede recursos para financiar o filme sobre o pai.
