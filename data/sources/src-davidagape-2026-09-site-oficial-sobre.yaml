summary: 'Autodescrição publicada no site pessoal do jornalista: fundador de A Investigação e diretor
  de comunicação da Free Speech Union Brasil; idealizador do Twitter Files Brazil (coautoria com Michael
  Shellenberger e Eli Vieira) e autor da série Vaza Toga 2 e 4; afirma que seu trabalho já provocou depoimentos
  no Senado Federal, na Câmara dos Deputados e no Congresso dos Estados Unidos, e ''intervenção direta
  do Vaticano'' em 2019 após reportagem sobre os Arautos do Evangelho; coautor do livro ''In Verbo Veritas'';
  vencedor do ''Free Speech Courage Award'' (Civilization Works, Londres, 2026). O site não cita formação
  acadêmica nem passagem por Comunique-se/Metrópoles/Gazeta do Povo. Contém afirmações de repercussão
  internacional (citação por NYT, Reuters, BBC, WSJ e outros) sem links de verificação, e contadores de
  seguidores (X, Instagram, Substack) zerados no momento da consulta — tratado como autodescrição, não
  como fato verificado de forma independente.'
