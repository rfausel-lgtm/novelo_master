source_type: press
summary: Reproduz o parecer de investimentos de 2024 do IPA (Instituto de Previdência dos Servidores Municipais
  de Angélica), no qual a diretoria concluiu que 'não foram encontrados indícios ou números que possam prejudicar
  a aprovação das Aplicações e Aportes dos Recursos do IPA' — o Banco Master aparece nesse mesmo documento como
  instituição credenciada em abril daquele ano. Registra que, após as operações Zehirut e Charitzut, a Prefeitura
  de Angélica declarou que o IPA é autônomo do Executivo municipal, e situa a auditoria do TCE-MS no conjunto das
  cinco cidades — Fátima do Sul, São Gabriel do Oeste, Jateí, Angélica e Campo Grande —, com nota do MPC-MS de que
  'a situação pode gerar perdas relevantes, impacto atuarial e desvalorização contábil nas carteiras dos fundos
  municipais'.
