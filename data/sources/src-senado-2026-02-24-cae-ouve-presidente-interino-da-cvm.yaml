source_type: official_legislative
summary: 'Registra a audiência do presidente interino da CVM, João Accioly, na Comissão de Assuntos Econômicos
  do Senado. Declarações literais: ''Se houve omissão da CVM, foi na divulgação do que a CVM fez''; ''De
  2015 para cá, o orçamento discricionário da CVM foi reduzido em 70%, em valores ajustados com a inflação,
  em um tempo em que o mercado de capitais cresceu''; e ''Pode ter havido erro. Certamente, não é impossível.''
  O senador Eduardo Braga respondeu que ''não dá pra dizer que a CVM não foi omissa''.'
