summary: 'Em agosto de 2024, um dia depois de apresentada, Paulo Sérgio Neves de Souza enviou a Daniel
  Vorcaro a emenda do senador Ciro Nogueira que elevava a cobertura do FGC de R$ 250 mil para R$ 1 milhão,
  alertando sobre a repercussão. Diálogo reproduzido: Paulo Sérgio — ''Mercado colocando a conta dessa
  MP em você''; Vorcaro — ''Não é mp, é uma emenda de levar fgc pra debaixo bacen...''; Paulo Sérgio —
  ''Vc não acha que virá uma reação ainda maior agora?'''
