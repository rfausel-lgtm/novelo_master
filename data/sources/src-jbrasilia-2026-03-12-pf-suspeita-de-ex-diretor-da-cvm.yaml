source_type: press
summary: Registra suspeita levantada pela Polícia Federal na 2ª fase da Operação Compliance Zero. Segundo
  relatório de análise da corporação, 'é notável que, aproximadamente seis meses após este voto, proferido
  próximo ao encerramento de seu mandato, deixou o cargo público e passou a integrar o escritório de advocacia
  Warde Advogados, que presta serviços ao Banco Master e a Daniel Vorcaro'. Registra ainda que, em outubro
  de 2022, já como advogado, Machado compareceu a reunião na presidência da CVM acompanhado de Walfrido
  Warde e de Daniel Vorcaro, com a ata anexada ao inquérito. A investigação não pediu diligências contra
  ele. Traz a nota de defesa em onze pontos.
