summary: 'Íntegra (27 páginas) da decisão assinada digitalmente em 05/09/2026 pelo relator da Pet 13.428/DF, a
  petição da Operação Transparência, e cumprida em 14/09/2026. Defere busca e apreensão contra o deputado
  Cezinha de Madureira e a sociedade de advocacia de Valéria Rodrigues Linhares, avoca ao STF os
  procedimentos sobre os R$ 510 mil apreendidos em Congonhas e indefere a busca no gabinete parlamentar.
  Transcreve a representação da PF, baseada na perícia do celular de Mariângela Fialek apreendido em
  12/12/2025, com os episódios das Reclamações 79.545, 76.831 e 81.608 e a delimitação expressa de que
  ministros de tribunais superiores não são objeto da apuração.'
notes: 'PDF com camada de texto corrompida; lido por OCR (Tesseract, português) por fork delegado e conferido
  por esta sessão nos trechos usados no acervo (qualificação, parágrafos 6-7, 12-23, 29-39, 42-46, indeferimento
  do gabinete e dispositivo). O documento traz CPF, inscrições na OAB, CNPJ de sociedades individuais, endereços
  residenciais e dados de voo — nenhum deles é reproduzido no acervo.'
