title: 'Caso Master: Novo pede que STF desconsidere pedido de vista de Dino em julgamento sobre Moraes'
publisher: Times Brasil (CNBC)
author: Amanda Souza, com Estadão Conteúdo
publication_date: '2026-09-28'
