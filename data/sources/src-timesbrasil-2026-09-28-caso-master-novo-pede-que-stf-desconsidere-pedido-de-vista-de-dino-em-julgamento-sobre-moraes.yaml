url: https://timesbrasil.com.br/brasil/caso-master-novo-pede-que-stf-desconsidere-pedido-de-vista-de-dino-em-julgamento-sobre-moraes/
source_type: press
language: pt-BR
summary: >-
  Publicada em 28/09/2026, às 19:32. Segundo o texto, o Novo pediu ao STF a anulação do pedido de vista de Flávio
  Dino de 15/09/2026, que interrompeu a votação sobre reunir ou manter separados os procedimentos envolvendo
  Alexandre de Moraes e André Mendonça, sustentando que a vista "deixou de servir ao exame do processo para servir
  à condução da sessão"; e, computada a posição de Dino, que se reconheça empate de 4 a 4, com aplicação da regra
  regimental de desempate pelo presidente, Edson Fachin. Não informa resposta de Dino ou do STF nem o número da PET.
notes: >-
  Texto em parte da Estadão Conteúdo; o Congresso em Foco tem apuração própria. A expressão "desvio de finalidade"
  não aparece neste texto, só no do Congresso em Foco.
