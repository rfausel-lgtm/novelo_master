source_type: press
summary: Ação civil pública do Grupo de Atuação Especializada em Segurança Pública do Ministério Público
  fluminense contra o Banco Master em liquidação, a PKL One Participações, ex-dirigentes e dirigentes
  do Rioprevidência, o Estado e a autarquia, para evitar prejuízo de R$ 1,088 bilhão. Pede suspensão imediata
  dos contratos do CredCesta e declaração de nulidade de contratos abusivos, sustentando que o modelo
  gerava 'descontos em folha que não reduzem efetivamente a dívida'.
