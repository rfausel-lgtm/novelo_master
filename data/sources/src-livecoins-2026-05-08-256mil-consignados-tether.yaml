summary: Reportagem que afirma ter tido acesso a mais de duas mil páginas dos autos do processo movido
  pela Tether. Única fonte a quantificar em 256.016 o número de trabalhadores baianos arrolados e em R$
  2 bilhões o valor das garantias — nenhuma outra reportagem localizada pela equipe reproduz esses dois
  números, e o artigo não cita número de processo, vara ou tribunal, nem reproduz trecho literal dos autos.
  Tratado como classe A.
