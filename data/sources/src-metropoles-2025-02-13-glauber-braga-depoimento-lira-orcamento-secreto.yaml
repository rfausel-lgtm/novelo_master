source_type: press
summary: 'O deputado Glauber Braga (PSOL-RJ), com mandato suspenso à época, depôs à PF em 13/02/2025 numa
  investigação requisitada pelo Min. Flávio Dino sobre o "orçamento secreto". Responsabilizou o então
  presidente da Câmara, Arthur Lira, por concentrar o direcionamento de emendas e enfraquecer a
  transparência, citando Mariângela Fialek como operadora ligada diretamente à Presidência. Segundo Braga,
  Rio Largo/AL recebeu cerca de R$ 90 milhões entre 2019-2022, dos quais R$ 19 milhões indicados por Lira.'
notes: 'Origem documentada da investigação que resultou na Operação Transparência (1ª fase, 12/12/2025) —
  fonte é depoimento de testemunha/parlamentar (classe A), não prova documental equivalente à decisão de
  Dino sobre Fialek/Valdemar. Lira não é alvo formal da operação até esta coleta.'
