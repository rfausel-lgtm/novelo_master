summary: Texto oficial consultado pela equipe. Altera a lei paranaense de consignações para incluir, no
  inciso V do art. 2º, 'despesas com a realização de compras, serviços e saques, utilizando cartão de
  benefícios, em rede credenciada do emitente do cartão', e, no §1º do art. 4º, a reserva de dez pontos
  percentuais destinada exclusivamente a despesas 'por meio de cartão de crédito'. O descompasso entre
  os dois dispositivos — o rol já falava em cartão de benefícios, a margem falava em cartão de crédito
  — é a fissura textual que a lei de 2021 viria a fechar. Assinada por Carlos Massa Ratinho Junior não,
  e sim pelo então governador Beto Richa.
