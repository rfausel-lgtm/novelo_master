summary: Base pública de informes periódicos de fundos, consultada pela equipe. Os informes mensais de
  FIDC contêm campos específicos para o número de cotistas que sejam regimes próprios de previdência,
  nas classes sênior e subordinada; os informes trimestrais de FIP trazem campo equivalente. É a fonte
  que permite testar diretamente se dinheiro previdenciário público entrou em um fundo determinado.
