summary: 'O inquérito policial que originou a apuração do caso Banco Master, instaurado em 17/08/2025 por
  requisição do MPF, trasladado por inteiro ao STF como peça do INQ 5.026 — 2.637 páginas, cobrindo a
  portaria de instauração, despachos da autoridade policial, ofícios ao Banco Central e à CVM, extratos
  bancários e consultas cadastrais (CCS) obtidos por requisição, pareceres internos do Banco Central
  (DESUP/PGBC) sobre a venda de carteiras de crédito Master→BRB, e a tramitação processual (petições de
  habilitação, decisões, embargos) até dezembro de 2025. É a peça mais antiga e mais extensa já lida por
  inteiro pela equipe sobre a origem documental do caso — antecede em quatro meses o primeiro ato de
  supervisão do STF já registrado no acervo (Rcl 88.121, 15/12/2025).'
notes: 'Obtido pelo próprio Rafael via certificado digital, como peça avulsa do INQ 5.026 (arquivo local
  "peca_2_Inq_5026.pdf") — mesma política de divulgação já aplicada às demais peças obtidas por certificado:
  informação pode ser usada e citada oficialmente, PDF original não é redistribuído. Lido por equipes de
  leitura só-leitura, cobrindo as 2.637 páginas por completo, em 12/09/2026. Toda página traz rodapé
  "Impresso por: [CPF] - RAFAEL FAUSEL" (o advogado que baixou o documento com certificado próprio) —
  nunca reproduzido no acervo.'
