summary: 'Respostas escritas juntadas entre 15/05 e 12/08/2026. Itaú: contas de David Henrique Alves, Victor Lima
  Sedlmaier, Rodrigo Pimenta Franco Avelar Campos e Erlene Nonato Lacerda bloqueadas sem saldo, R$ 26,26 de valores a
  receber de Anderson Wander da Silva Lima e R$ 120,41 em frações de ações de Sebastião Monteiro Júnior. Bradesco:
  nenhuma conta com saldo, e R$ 735,47 em frações de ações de Sebastião. Santander: R$ 2,77 de David, R$ 0,12 de
  Anderson e saldo negativo de Erlene. Nubank: R$ 0,08 de Manoel Mendes Rodrigues e R$ 0,63 de Rodrigo, e contas de
  David e Victor canceladas em 2024. Coinbase: conta de David sem ativos e R$ 0,66 de Victor. Mercado Pago: cadastro
  de cinco requeridos, bloqueio frustrado por insuficiência de fundos. Sicredi: R$ 1.160,12 em quotas-partes de
  David, que a cooperativa diz serem impenhoráveis. XP: David e Manoel são clientes sem patrimônio livre. 99Pay:
  contas de David, Victor e Erlene bloqueadas, sem valor informado. NovaDAX e Edenred: nenhum vínculo. ABcripto: diz
  não ter meios de localizar nem bloquear ativos de associadas.'
notes: 'Peças obtidas via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele). Números de conta,
  agência e CPF que constam das respostas não são reproduzidos. O Sicredi observa que bloqueios feitos pelo fluxo
  automatizado do SISBAJUD não aparecem nas respostas escritas.'
