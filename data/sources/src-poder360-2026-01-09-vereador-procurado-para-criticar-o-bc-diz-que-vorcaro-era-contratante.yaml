summary: O vereador Rony Gabriel (PL, Erechim-RS) disse ao Poder360 que o nome de Daniel Vorcaro foi citado
  verbalmente como contratante durante a proposta da agência UNLTD Network Brazil para gravar conteúdos
  críticos ao Banco Central. O Poder360 relata ter procurado a agência por e-mail, telefone e aplicativo de
  mensagens (cinco ligações ao sócio que grafa "Anderson Nunes") e a defesa de Vorcaro, sem resposta até a
  publicação. Usada aqui para as tentativas de contato.
notes: O título acima é o da manchete da página; o elemento title do HTML é Vereador diz que Vorcaro
  contratou proposta contra o BC. A matéria traz ainda trecho sobre monitoramento de redes de pré-candidato,
  que o Novelo não registra.
