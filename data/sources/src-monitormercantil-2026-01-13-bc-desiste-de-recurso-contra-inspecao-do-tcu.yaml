summary: Segundo a Agência Brasil, o Banco Central desistiu em 13/01/2026 dos embargos de declaração contra a
  decisão de Jhonatan de Jesus que autorizou a inspeção, desistência formalizada no sistema de consulta
  pública do TCU um dia após reunião entre Vital do Rêgo, o relator e Gabriel Galípolo; com isso a análise
  seguiria sem apreciação pelo Plenário; a inspeção, pela AudBancos na sede do BC, ficaria restrita à
  documentação que embasou a liquidação, com respeito ao sigilo bancário; transcreve declaração de Vital do
  Rêgo.
