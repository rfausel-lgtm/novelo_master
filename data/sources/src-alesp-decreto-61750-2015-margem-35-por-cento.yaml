title: Decreto nº 61.750, de 23 de dezembro de 2015 — fixa a margem consignável em 35% (SP)
publisher: Assembleia Legislativa do Estado de São Paulo
publication_date: '2015-12-23'
retrieved_at: '2026-09-09'
url: https://www.al.sp.gov.br/repositorio/legislacao/decreto/2015/decreto-61750-23.12.2015.html
source_type: official_legislative
summary: 'Texto lido pela equipe para estabelecer o patamar anterior. Assinado por Geraldo Alckmin, altera
  a margem consignável ''de 30% (trinta por cento) para 35% (trinta e cinco por cento)'' e prevê, no §1º,
  que ela ''poderá ser majorada, adicionalmente, em até 5%'' com destinação exclusiva a dívidas de cartão
  de crédito. A redação importa por contraste: quando quis criar margem adicional, a administração paulista
  escreveu ''majorada, adicionalmente'' — fórmula que não foi usada em 2022.'
