summary: 'Agregador de CNPJ: Marcus Vinícius da Mata é sócio ou administrador de cerca de 59 empresas
  ativas, com funções de presidente, diretor, administrador ou sócio — entre elas a Solar Administração
  de Bem Próprio S.A. (CNPJ 44.949.935/0001-94, presidente) e a Fraction 024 Administração de Bem Próprio
  S.A. Entre os coproprietários/administradores recorrentes no mesmo grupo de empresas está Artur Martins
  de Figueiredo, já conhecido do acervo como diretor da Trustee Holding Financeira e da Banvox Holding
  Financeira.'
