summary: 'Petição de 01/04/2026 em que o governador do Distrito Federal, Ibaneis Rocha, pede ao STF a extensão dos
  efeitos das dispensas já concedidas a Vorcaro, Campos Neto, Paulo Humberto Barbosa, os irmãos Toffoli, Belline
  Santana e Paulo Sérgio, para não ser obrigado a depor na CPI do Crime Organizado (convocação para 07/04/2026,
  Requerimento 310/2026). Reproduz a caracterização da CPI de que ele está ''no centro de dois eixos de investigação''
  e, ponto a ponto, rebate as alegações: confirma que seu escritório (do qual está afastado desde 2018) cedeu créditos
  de honorários advocatícios de uma ação contra a União (iniciada em 2008) em duas operações — 29/05/2024 e 23/12/2021,
  esta ao Fundo Laguz I FIDC, administrado pela Reag/CBSF, cujo único cotista seria o Banco Original —, nega irregularidade
  e afirma que a CPI também aponta uma segunda operação, com o fundo Reag Legal Claims (atualmente Pedra Azul FIDC),
  sem detalhar valores. Nega ainda que a parceria do PicPay com o GDF para antecipação salarial tenha relação com
  o escritório, confirma que o escritório presta serviços ao Grupo J&F ''em centenas de ações'', e chama de ''fantasiosa''
  a menção à compra, pelo filho, de um imóvel que antes pertenceu a um sobrinho dos irmãos Batista. Nega qualquer
  papel operacional nas decisões do BRB sobre o Master, afirmando que nunca escolheu diretores do banco.'
notes: É a peça que fundamentou a decisão de 02/04/2026 (e-Doc 223, já publicada no lote 176). Preenche a lacuna
  registrada no verbete de Ibaneis Rocha — não havia, até então, nenhuma manifestação dele localizada no corpus
  sobre o mérito das alegações.
