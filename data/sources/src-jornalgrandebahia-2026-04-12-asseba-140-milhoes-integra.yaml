summary: 'Trecho literal: ''A Asseba é gerida pelo Instituto Terra Firme, fundado por Augusto Lima e atualmente
  administrado por sua esposa, Flávia Peres.'' A matéria não cita documento primário (estatuto, ata, decisão)
  para essa afirmação específica de gestão — é alegação do próprio texto jornalístico, sem lastro documental
  explícito no corpo da matéria, e conflita com o registro de presidência estatutária de Maria Helena
  Santos Ferreira desde 2008. O mesmo texto confirma que a Asseba compartilhava e-mail corporativo e telefone
  com a empresa Terra Firme da Bahia Ltda (não com o instituto/ONG).'
