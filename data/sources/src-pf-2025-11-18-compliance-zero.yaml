source_type: official_police
summary: Nota oficial da PF sobre a deflagração da Operação Compliance Zero em 18/11/2025, com o objetivo
  de combater a emissão de títulos de crédito falsos por instituições do Sistema Financeiro Nacional;
  sete mandados de prisão e 25 de busca e apreensão no DF, RJ, SP, BA e MG. As investigações começaram
  em 2024 a pedido do MPF e apontam que o Banco Master teria criado carteiras de crédito sem lastro, posteriormente
  vendidas ao BRB.
