summary: 'Em 01/09/2026 o ministro André Mendonça retirou o sigilo da PET 16.662, aberta após a PF apresentar
  novas informações sobre suposta rede de influência atribuída a Vorcaro, e afirmou que os elementos serão
  analisados pelo Plenário. Lista e hospeda os documentos da petição: relatório da PF de 218 páginas,
  íntegra das conversas, contrato Banco Master × Barci de Moraes (R$ 108 milhões líquidos em 36 meses),
  contrato e acordo com a Viking Participações.'
