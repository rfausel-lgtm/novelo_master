summary: Segundo o Estadão, o Coaf localizou R$ 6,6 milhões do Master (ago/2024–jul/2025) e R$ 11,3 milhões
  da JBS para a Consult, que declarou faturamento de R$ 25,5 mil; pagamentos ao filho de Nunes Marques
  somaram R$ 281.630. A Consult (aberta em 2022 por Francisco Craveiro de Carvalho Junior, em Barueri
  e Brasília) diz ter prestado auditoria e consultoria tributária e sistemas; Craveiro repassou a empresa
  ao irmão em nov/2025 e voltou em 06/03/2026.
