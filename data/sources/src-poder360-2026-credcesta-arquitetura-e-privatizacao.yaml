source_type: press
summary: 'Série de reportagens que publicou as íntegras dos decretos e reconstituiu a cadeia societária:
  a EBAL foi arrematada em 11/04/2018 por R$ 15 milhões pela NGV Empreendimentos e Participações, com
  49 lojas da Cesta do Povo, em leilão de concorrente único, após duas tentativas fracassadas com lance
  mínimo de R$ 81 milhões; os direitos do CredCesta passaram à PKL One Participações S.A., da qual o Banco
  Máxima comprou 50%. Registra que o Estado pagou R$ 93 milhões em dívidas remanescentes da EBAL entre
  2019 e 2026 — 6,2 vezes o preço de venda — e compara as taxas: cerca de 5% ao mês no CredCesta contra
  média de 1,37% a 1,59% no consignado público.'
