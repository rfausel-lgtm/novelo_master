source_type: press
summary: 'Min. Flávio Dino bloqueou R$ 119.216.703,15 em bens de Valdemar Costa Neto (presidente nacional
  do PL, sem mandato parlamentar) e suspendeu a execução de despesas públicas ligadas a 21 emendas
  parlamentares apontadas pela PF como forjadas e desviadas em seu benefício, por meio de servidores da
  Câmara dos Deputados — entre eles Mariângela Fialek. Acusações: peculato-desvio e associação criminosa.
  Dino: "veementes indícios" de responsabilidade; determinou à Câmara a entrega de documentação completa
  em 10 dias.'
