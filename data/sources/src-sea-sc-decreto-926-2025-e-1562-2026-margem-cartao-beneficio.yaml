source_type: official_gazette
summary: Texto consolidado publicado pela secretaria, lido pela equipe. O Decreto nº 926, de 14/04/2025,
  previa no §4º do art. 13 a 'liberação da margem adicional equivalente a 10% (dez por cento), além da
  margem consignável prevista no caput, destinada exclusivamente para desconto de valores relativos a
  cartão consignado de benefícios', e no inciso VII do art. 6º admitia como consignatária 'administradoras
  de cartão de crédito e/ou benefícios'. O Decreto nº 1.562, de 11/06/2026, revogou os dois dispositivos
  — extinguindo, na mesma data, a margem exclusiva e a própria categoria de consignatária que a tornava
  utilizável.
