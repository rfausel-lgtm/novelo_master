title: Deputados do PT pedem investigação de Nunes Marques por possíveis vínculos com Master
publisher: Times Brasil (CNBC)
author: Cauê Rigamonti
publication_date: '2026-10-12'
url: https://timesbrasil.com.br/brasil/deputados-pedem-investigacao-sobre-nunes-marques-e-master/
source_type: press
language: pt-BR
summary: >-
  Os mesmos pedidos de Rui Falcão e Rogério Correia ao STF (investigação, envio à PGR, plenário ou sorteio a
  ministro sem impedimento); a representação cita o contrato de honorários "de até R$ 427 milhões" do escritório
  de Camilla Ewerton Ramos e a expressão "Turma do KN"; registra que Nunes Marques nega ter recebido recursos de
  Vorcaro, trocado mensagens com ele ou autorizado terceiros a falar em seu nome, e que não se manifestou sobre
  a nova representação quando procurado; o escritório reconhece o contrato e diz não ter recebido honorários.
notes: >-
  O texto informa que as informações são da coluna de Mônica Bergamo, da Folha de S.Paulo (original não aberto).
  Não informa número da petição. Traz episódios citados pelos deputados (pagamentos ao filho do ministro,
  imóvel, viagem, mensagem de ex-diretor do banco) que ficam fora deste lote.
