summary: Reproduz, junto com outros veículos que aparentam derivar da mesma leva de vazamento, a alegação
  de que a colaboração de Mansur indicaria o paradeiro de cerca de R$ 20 bilhões em patrimônio atribuído
  a Vorcaro — 'pulverizado' em imóveis, fundos e direitos creditórios. Trata-se de alegação do colaborador,
  repetida por múltiplos veículos a partir da mesma fonte primária (a proposta de Mansur), não corroboração
  jornalística independente.
