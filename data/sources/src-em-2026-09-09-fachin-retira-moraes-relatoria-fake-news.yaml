summary: Registra a decisão de 09/09/2026 pela qual o presidente do Supremo revoga a designação de Alexandre
  de Moraes como relator do Inquérito 4.781, instaurado pela Portaria nº 69, de 14 de março de 2019, e
  assume pessoalmente a condução do feito. Indica como fundamento o art. 43 do regimento interno do tribunal
  e o entendimento fixado pelo Plenário no julgamento da ADPF 572. Consigna que a revogação produz efeitos
  'exclusivamente, a partir da data de 09.09.2026, preservando, assim, os atos regularmente praticados
  durante o período de vigência da designação', e que 'as ações penais conexas ao Inquérito 4781 com denúncia
  recebida seguirão o rito processual já em curso'. Situa a medida no contexto do embate entre Moraes
  e André Mendonça em torno das investigações do Banco Master, no qual Moraes havia incluído Mendonça
  no inquérito.
