title: Diretor de empresa usada pelo Master para captar R$ 12 bi é suspeito de lavar dinheiro no 'tigrinho'
publisher: Política Livre
publication_date: '2026-02-23'
url: https://www.politicalivre.com.br/2026/02/diretor-de-empresa-usada-pelo-master-para-captar-r-12-bi-e-suspeito-de-lavar-dinheiro-no-tigrinho
source_type: press
summary: 'André Felipe de Oliveira Seixas Maia, ex-funcionário do Master e diretor da Tirreno, foi sócio
  principal da Silium (depois renomeada Nuoro Pay), descrita pela Polícia Civil de São Paulo como peça
  central da engrenagem financeira de uma organização de apostas ilegais ("tigrinho") — a empresa
  administrava contas-bolsão de empresas de fachada que recebiam recursos de apostas ilegais. Investigação
  distinta da apuração sobre a Tirreno, correndo sob sigilo. Seu advogado, Luiz Felipe Mallmann de
  Magalhães, declarou que "o empresário não cometeu nenhum ato ilícito e isso será demonstrado ao longo
  da apuração".'
