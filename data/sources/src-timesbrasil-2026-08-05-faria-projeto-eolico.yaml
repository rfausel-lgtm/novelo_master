source_type: press
summary: Segundo a revista piauí, Faria conheceu Vorcaro em outubro de 2023 (Paris) e, em fevereiro de
  2024, vendeu ao banqueiro participação em projeto eólico de 240 MW em Galinhos (RN) avaliado em R$ 75
  milhões, recebendo R$ 67,5 milhões e mantendo 10%; especialistas estimaram valor bem menor. Mensagens
  citam Alcolumbre, Pacheco e Toffoli. Faria disse em janeiro ter 'zero' relação com o Master e nunca
  ter vendido nada ao banco; a PF analisa se auxiliou Vorcaro.
