source_type: press
summary: 'Reação do senador Alessandro Vieira (MDB-SE) ao pedido do ministro Gilmar Mendes à PGR para
  investigá-lo por suposto abuso de autoridade, em razão do relatório da CPI do Crime Organizado que
  pedia o indiciamento de Gilmar, Moraes, Toffoli e Gonet. Vieira disse que responderia "com absoluta
  tranquilidade", que "ameaças e tentativas de constrangimento não vão mudar o curso da história", e
  sustentou estar protegido por imunidade parlamentar: "um senador, ao manifestar sua avaliação jurídica
  sobre fatos concretos em voto proferido no âmbito de uma CPI, não comete abuso de autoridade".'
