summary: Registra que a Polícia Federal encontrou e apreendeu, durante os mandados de busca e apreensão da Operação
  Make Up cumpridos em 10/09/2026, uma ata notarial que Karina Ferreira da Gama havia registrado em cartório relatando
  pressão de ao menos quatro pessoas ligadas ao governo Lula para que ela prestasse depoimento incriminando o senador
  Flávio Bolsonaro, sob a insinuação de que seria presa caso não o fizesse. Entre os apontados está Fernando Sarney,
  filho do ex-presidente José Sarney, que nega qualquer contato com ela; os demais não foram identificados pela
  reportagem, incluindo uma figura religiosa descrita como próxima do Palácio do Planalto.
