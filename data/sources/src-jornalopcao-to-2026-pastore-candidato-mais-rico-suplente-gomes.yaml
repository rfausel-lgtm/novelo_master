source_type: press
summary: Confirma Pastore como 1º suplente na chapa do senador Eduardo Gomes (PL-TO) ao Senado em 2026,
  com R$ 677,7 milhões declarados — candidato mais rico do pleito. Nenhuma conexão factual entre essa
  candidatura e o caso Banco Master foi localizada; Eduardo Gomes comentou publicamente, em episódio distinto
  e sem relação com Pastore, um áudio envolvendo Flávio Bolsonaro e Daniel Vorcaro sobre financiamento
  de um projeto de filme, negando que Flávio tivesse qualquer estrutura de governo para se envolver no
  caso Master.
