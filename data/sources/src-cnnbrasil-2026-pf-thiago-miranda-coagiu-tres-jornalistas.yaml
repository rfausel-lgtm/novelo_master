summary: 'Segundo a PF, na decisão de André Mendonça, Thiago Miranda tentou coagir as jornalistas Malu
  Gaspar (O Globo) e Consuelo Dieguez (piauí) e pressionou o consultor Renato Breia, da Nord Investimentos,
  a retirar do ar conteúdo negativo ao Banco Master. Dieguez recusou retirar o texto e orientou o envio de
  carta à revista; Breia retirou o conteúdo, e a PF registra a contrariedade dele com a abordagem. A matéria
  traz a nota da defesa de Miranda, que nega irregularidades e diz que ele está à disposição das autoridades.'
