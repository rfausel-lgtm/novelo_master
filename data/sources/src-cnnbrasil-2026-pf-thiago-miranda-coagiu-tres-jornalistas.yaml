  mensagem de Miranda a Vorcaro sobre a remoção do conteúdo de Breia e a nota da Nord e de Breia; a página lida em
  16/10 não traz nem uma nem outra, e a expressão "à disposição das autoridades" que aparece nela é da defesa de
