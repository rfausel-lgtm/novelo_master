summary: 'Detalha os contatos para retirada de conteúdo: a jornalista Consuelo Dieguez, da revista piauí,
  recusou e orientou o envio de carta à revista; o consultor Renato Breia, da Nord Investimentos, que
  havia recomendado em outubro de 2024 que clientes não investissem no CDB do Master, acabou removendo
  o conteúdo após contatos insistentes — Miranda enviou o print da conversa a Vorcaro comemorando: ''Mais
  um arquivado!''. A Nord e Breia confirmaram o contato e disseram estar à disposição das autoridades.'
