source_type: press
summary: 'Mensagens do celular de Vorcaro mostram proximidade pessoal com o ministro do STJ Benedito
  Gonçalves: em 17/05/2024, após um evento, Benedito escreveu "Boa noite feliz em rever o amigo. Festa
  bonita! Parabéns!"; em 02/07/2024, ao ser chamado por Vorcaro de "grande amigo" e convidado para um
  encontro em Brasília, respondeu "E aqui sempre à disposição" com um emoji dizendo "Tamo junto sempre".
  Participou de evento custeado por Vorcaro em Londres e da degustação de uísque Macallan já registrada
  no acervo. No primeiro semestre de 2026, declarou-se impedido de julgar causas relacionadas ao Banco
  Master no STJ — sem que o texto detalhe data exata ou teor. Procurado pela reportagem via assessorias
  do STJ e do CNJ, por WhatsApp, às 13h15 de terça-feira (15/09/2026), não comentou até a publicação.'
