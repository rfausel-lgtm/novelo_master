summary: Documento SEI/GESP 0117227615. Fixa o cronograma de recadastramento das consignatárias credenciadas
  e traz, no Anexo I, entre elas, 'PKL One Participações S/A — 097337.4 — nov/26'. É o mesmo código de
  desconto cuja suspensão fora determinada com efeitos a partir de 19/02/2026. As retificações do comunicado
  anterior, publicadas em 20/05/2026 e em 02/06/2026, também mantêm a empresa no anexo. Comunicado da
  São Paulo Previdência publicado em 07/08/2025 igualmente a lista entre as consignatárias.
