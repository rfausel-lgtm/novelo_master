summary: 'Convoca Daniel Vorcaro para depor como testemunha perante a CPMI do INSS em 26/02/2026, com
  base no Requerimento nº 2749/2025 e outros, aprovados em 04/12/2025. Defere o adiamento pedido pela
  defesa para depois do carnaval, mas indefere o depoimento por videoconferência, sob o argumento de que
  a oralidade das CPIs não permite resguardar a incomunicabilidade da testemunha.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente), juntada ao INQ 5.026 como documento comprobatório. Código de
  autenticação do rodapé nunca reproduzido no acervo.'
