summary: 'Registra que Vorcaro era investigado na Operação Fundo Fake por suspeitas de envolvimento em
  esquema de desvio de recursos de fundos de previdência de municípios e, ainda assim, recebeu autorização
  do Banco Central para se tornar sócio controlador do Banco Máxima. Traz a versão da defesa: ele teria
  sido ''formalmente excluído da investigação'' porque, à época dos fatos apurados, ainda não havia adquirido
  o controle do banco nem mantinha vínculo com a instituição, sendo ''falsa e difamatória qualquer tentativa
  de associar seu nome aos fatos apurados''.'
