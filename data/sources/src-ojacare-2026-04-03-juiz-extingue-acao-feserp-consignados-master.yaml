url: https://www.ojacare.com.br/2026/04/03/juiz-extingue-acao-para-cancelar-cobrancas-na-folha-de-servidores-ligadas-ao-master
source_type: press
summary: 'Reproduz trechos literais da sentença do juiz Eduardo Lacerda Trevisan, da 2ª Vara de Direitos
  Difusos, Coletivos e Individuais Homogêneos de Campo Grande, publicada no diário da Justiça de 01/04/2026,
  que extinguiu sem resolução de mérito a ação civil pública da Feserp-MS contra o Estado e o município.
  Fundamento: jurisprudência do Supremo que não admite federação como substituta processual de filiados
  a sindicatos a ela filiados, e natureza patrimonial e divisível do direito discutido — ''não admitindo
  que uma entidade de classe substitua a vontade individual de milhares de servidores sem uma análise
  específica de adimplemento de cada mútuo''.'
