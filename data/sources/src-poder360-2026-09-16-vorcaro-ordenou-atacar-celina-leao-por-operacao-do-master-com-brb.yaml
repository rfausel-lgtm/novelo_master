url: https://www.poder360.com.br/poder-economia/vorcaro-ordenou-atacar-celina-leao-por-operacao-do-master-com-brb/
source_type: press
language: pt-BR
summary: >-
  A Folha de S.Paulo publicou em 15/09/2026 mensagens de 05/04/2025 entre Daniel Vorcaro e Thiago Miranda sobre
  Celina Leão; Miranda escreve que ela "está querendo aparecer porque ficou de fora da negociação" e Vorcaro
  responde "Não ficou de fora, não". Celina Leão diz que era contrária à operação e nunca teve contato com
  Vorcaro; a defesa de Miranda diz que a governadora não participou das negociações; a defesa de Vorcaro não
  respondeu.
notes: >-
  O título é o da página. A URL lida originalmente
  (https://www.poder360.com.br/poder-justica/vorcaro-cita-celina-leao-em-negociacao-com-o-brb-nao-ficou-de-fora/)
  redireciona para a URL canônica registrada acima (reconferida pelo editor em 16/10/2026). A matéria diz que
  as mensagens foram reveladas pela Folha e "confirmadas pelo Poder360". A manchete não corresponde ao corpo da matéria (a frase de
  Vorcaro refere-se à "descredibilização minha e do Master") e não é usada como proposição.
