summary: 'Levantamento mostrando que o Instituto ITER, fundado pelo Min. André Mendonça, acumulou ao menos
  R$ 10,85 milhões em 55 contratos com órgãos públicos, dos quais 54 (98,2%) sem licitação prévia —
  contexto mais amplo que o contrato específico de R$ 380 mil com a Prefeitura de SP citado na decisão de
  15/09/2026 do Min. Dino na ADPF 1.196.'
