summary: 'Confirma que a decisão foi tomada na Pet 16.662 (processo relatado pelo próprio Mendonça, distinto
  da Pet 16.704 avocada por Fachin em 03/09 para colher explicações). Trecho literal da decisão: ''Ao
  menos há mais de 30 dias este relator tem sido monitorado pela Polícia Federal. Trata-se de monitoramento
  ilícito...'' A decisão também determina abertura de procedimento criminal e administrativo-disciplinar
  pela Corregedoria da PF sobre a produção dos relatórios, e proíbe novos relatórios de inteligência que
  analisem atuação de magistrados, membros da AGU/advocacia pública ou policiais. Cita notas públicas
  da Intelis e da ADPF (Associação de Delegados da PF, via seu presidente Edvandir Felix de Paiva) contra
  o uso desses relatórios internos.'
