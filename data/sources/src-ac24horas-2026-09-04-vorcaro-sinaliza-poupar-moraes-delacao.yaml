summary: Segundo reportagem, Daniel Vorcaro sinalizou que, em nova proposta de delação premiada a ser
  apresentada à PF/PGR, pretende poupar o ministro Alexandre de Moraes, caracterizando a relação como
  'amizade' e o contrato de R$ 129 milhões com a esposa do ministro como vínculo comercial. A reportagem
  observa que documentos da PF já tornados públicos indicam que Vorcaro consultava Moraes sobre questões
  do Banco Master e chegou a pedir que o ministro acionasse o diretor-geral da PF — tratado como sinalização/intenção
  declarada, não como delação já formalizada ou homologada.
