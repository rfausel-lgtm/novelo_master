summary: 'Registra a condenação de Saul Dutra Sabbá pela 6ª Vara Criminal Federal de São Paulo, do juiz
  Nilson Martins Lopes Júnior, a três anos de reclusão em regime inicial aberto por gestão fraudulenta,
  pena substituída por restritiva de direitos e multa. Os fatos são de 2014 a 2016 e incluem geração de
  ganhos fictícios, com valorização artificial de 126% em fundo de investimento, e omissão de posições
  em ações. Corréu: Alberto Maurício Caló, ex-diretor jurídico e contábil. A advogada de Sabbá não se
  manifestou.'
