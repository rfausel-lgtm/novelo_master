source_type: press
summary: 'Reproduz reportagem de O Globo sobre discurso de André Valadão na inauguração de templo da Igreja Batista
  da Lagoinha em Belo Horizonte, em abril de 2025: sobre os pais de Daniel Vorcaro, "Amigos da minha vida.
  Henrique, Aline, fiquem em pé. [...] Somos amigos desde as minhas solteirices, amigos de vida, de anos, de
  décadas!"; sobre Fabiano Zettel, "não está na casa de uma pessoa que ontem decidiu ter uma igreja no Belvedere.
  Eu estou falando de mais de 20 anos de relacionamento"; e sobre Zettel e Natália Vorcaro, "uma promessa de
  Deus". Registra que Valadão hoje se diz decepcionado e afastado da família e nega irregularidades, e cita a
  Folha de S.Paulo para 54 transferências de Zettel ao templo, cerca de R$ 41 milhões entre 2024 e janeiro de 2026.'
notes: 'Lida por esta sessão via WebFetch direto. O original de O Globo está atrás de paywall e não foi aberto; a
  mesma reportagem é reproduzida por outros veículos, o que não os torna fontes independentes. Os R$ 41 milhões
  da Folha são recorte distinto dos R$ 19,2 milhões do RIF do COAF já no acervo (conta e período diferentes) e
  não devem ser somados.'
