summary: Petição que retoma o pedido de prisão domiciliar de Fabiano Zettel (art. 318, III, CPP), informando
  fato novo de ordem familiar, ocorrido em abril de 2026 (o Novelo não reproduz dados de menores nem de saúde). Nega que Zettel tenha integrado o grupo de WhatsApp "A Turma", caracterizando sua posição
  apenas como operador financeiro subordinado a Vorcaro. Descreve as circunstâncias familiares invocadas
  no pedido (não reproduzidas) e detalha dificuldades logísticas de visitação na Penitenciária de Potim II
  (SP).
notes: É exatamente a petição de reavaliação que o voto de referendo de Gilmar Mendes (já no acervo) havia
  antecipado como necessária assim que houvesse fato novo relevante — o corpus não localizou, até esta
  atualização, a decisão que a apreciou.
