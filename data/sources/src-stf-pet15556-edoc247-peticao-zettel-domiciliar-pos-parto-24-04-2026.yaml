summary: Petição que retoma o pedido de prisão domiciliar de Fabiano Zettel (art. 318, III, CPP), informando
  fato novo — o nascimento dos gêmeos Samuel e Sarah em 08/04/2026 — e complicações graves no pós-parto de
  Natália Vorcaro Zettel (síndrome HELLP, com reinternação, e agravamento de quadro psiquiátrico
  preexistente). Nega que Zettel tenha integrado o grupo de WhatsApp "A Turma", caracterizando sua posição
  apenas como operador financeiro subordinado a Vorcaro. Informa que sua única parente próxima, além da
  esposa, é a mãe, desembargadora aposentada com mais de 80 anos, e detalha dificuldades logísticas de
  visitação na Penitenciária de Potim II (SP).
notes: É exatamente a petição de reavaliação que o voto de referendo de Gilmar Mendes (já no acervo) havia
  antecipado como necessária assim que houvesse fato novo relevante — o corpus não localizou, até esta
  atualização, a decisão que a apreciou.
