summary: 'Apuração: acordo entre Palácio do Planalto, aliados de Lula e um grupo do STF (Gilmar Mendes,
  Flávio Dino, Cristiano Zanin e Alexandre de Moraes) para preservar Moraes das suspeitas envolvendo Vorcaro,
  adiando decisões no plenário até depois de 22/09/2026 — passando pelo 1º turno (04/10) e possivelmente
  pelo 2º turno (25/10) das eleições. Descreve também plano do grupo político de Lula de divulgar ''arsenal
  de suspeitas'' contra Flávio Bolsonaro, incluindo extensão da delação de Antonio Carlos Freixo Júnior
  sobre o filme ''Dark Horse''.'
