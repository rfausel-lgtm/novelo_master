summary: >-
  Reproduz nota da assessoria de Hugo Motta segundo a qual ele "sempre manteve diálogo com os diversos
  segmentos do empresariado" e "não existe nenhum ilícito retratado nos diálogos publicados"; sobre
  empréstimo mencionado nas reportagens, a nota diz que o contrato foi firmado "quando não se tinha
  conhecimento dos fatos" investigados depois. Não menciona grupo de WhatsApp.
notes: >-
  Publicada às 22h26 de 29/09/2026. O empréstimo envolve familiar de Motta e não é registrado pelo Novelo. A
  palavra "descontextualizadas", indicada no plano de redação, não consta desta versão da nota; a versão
  reproduzida no blog de Matheus Teixeira (mesmo dia) é parafraseada pelo Novelo.
