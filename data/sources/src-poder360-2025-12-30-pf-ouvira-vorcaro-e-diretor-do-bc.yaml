source_type: press
language: pt-BR
summary: "Poder360 (30/12/2025): segundo comunicado da assessoria do STF de 29/12, a delegada da PF
  responsável colheria separadamente, em 30/12 a partir das 14h, os depoimentos de Vorcaro, de Paulo Henrique
  Costa e do diretor de Fiscalização do BC, e só então decidiria se mantém a acareação; o ato seria
  acompanhado por um juiz auxiliar de Toffoli e por um membro do Ministério Público, sem acesso da imprensa. O
  veículo previa que a acareação ficaria para janeiro de 2026. Relata que Toffoli negou em 27/12 o recurso do
  BC e publica a íntegra do despacho."
notes: A previsão de que a acareação ficaria para janeiro diverge da nota do gabinete de Toffoli de 29/01/2026
  (já no acervo), segundo a qual a acareação entre Vorcaro e Paulo Henrique Costa ocorreu em 30/12/2025. A
  parte final da reportagem, sobre a reunião de 17/11/2025 e a soltura de Vorcaro, não entra neste lote.
