source_type: official_court
summary: 'Leonardo Augusto Furtado Palhares, alvo de medida cautelar na Operação Compliance Zero por
  suposta participação em esquema de corrupção envolvendo pagamento de vantagens indevidas a agente
  público do Banco Central, pediu salvo-conduto (Petição 34376/2026, e-Doc. 543) contra sua convocação
  pela CPI do Crime Organizado — invocando não só o direito à não autoincriminação, mas também sua
  prerrogativa profissional de advogado (art. 7º, XIX, Lei 8.906/1994) para recusar depor sobre fatos
  sob sigilo profissional. O relator defere, convertendo a convocação em facultativa.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). Distinta do Ofício 223/2026 (26/03/2026, já registrado no acervo),
  que é a própria convocação da CPI — esta é a resposta do STF ao pedido de salvo-conduto de Palhares
  contra aquela convocação, no dia seguinte. Código de autenticação/senha do rodapé de cada página nunca
  reproduzido no acervo.'
