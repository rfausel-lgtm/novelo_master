summary: "Artigo de opinião assinado pelos próprios autores, em que respondem à representação criminal
  apresentada ao STF contra eles: classificam-na como SLAPP, dizem que ela se apoia em declarações de
  terceiros e no pedido de prevenção ao Inquérito das Milícias Digitais, invocam a ADPF 130 e o art. 220 da
  Constituição e afirmam que as reportagens se baseiam em documentos. Posição dos autores, não fato
  verificado."
notes: O texto nomeia a autora da representação; o Novelo não a nomeia. A página traz a nota de que a opinião
  é de responsabilidade dos autores.
