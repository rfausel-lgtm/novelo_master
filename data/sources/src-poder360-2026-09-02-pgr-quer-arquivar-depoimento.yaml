summary: 'Registra a manifestação de Paulo Gonet, de 02/09/2026, pelo arquivamento: Vorcaro ''não noticiou
  fato concreto ou juridicamente delimitado capaz de impulsionar providências investigativas próprias'',
  e o depoimento seria ''flagrantemente inócuo e esvaziado de utilidade prática''. A decisão sobre o arquivamento
  cabe ao relator André Mendonça e não havia sido proferida.'
