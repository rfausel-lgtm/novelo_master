summary: 'Ano VII, edição nº 01295, caderno 1, página 111. Convênio para concessão de operações do Cartão
  Credcesta aos servidores, com vigência de sessenta meses e data de assinatura em 14/06/2021 — dois dias
  antes do decreto municipal que criaria a margem exclusiva. O achado está no campo do fundamento legal:
  o instrumento municipal invoca o ''Decreto nº 18.353, de 27 de abril de 2018'', que é o decreto estadual
  baiano assinado no dia do leilão da estatal de alimentos. É prova documental de que o desenho normativo
  estadual serviu de base jurídica para a capilarização municipal do produto.'
