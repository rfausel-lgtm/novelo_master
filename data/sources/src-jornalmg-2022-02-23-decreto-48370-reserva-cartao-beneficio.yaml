summary: 'Publicado no Diário do Executivo de 23/02/2022, ano 130, nº 39, p. 1, e lido pela equipe. Assinado
  por Romeu Zema Neto, altera o decreto mineiro de consignações para criar a ''reserva de margem consignável
  para fins de cartão benefício consignado'', definida como a reserva de dez por cento da margem. A redação
  tem uma diferença decisiva em relação à de outros estados: exige que o emitente do cartão tenha ''funcionamento
  autorizado pelo Banco Central do Brasil'' — Minas Gerais não dispensou nem transferiu a exigência. O
  art. 7º fixa o teto de dez por cento com base em dispositivo da própria lei estadual, e o art. 2º admite
  parcelamento em até setenta e dois meses.'
