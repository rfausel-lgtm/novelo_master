source_type: press
summary: 'Perfil da empresária: preside o Instituto Conhecer Brasil, associação privada sem fins lucrativos,
  e responde pela GoUp Entertainment Ltda, sediada no mesmo endereço na Avenida Paulista, e pela GoUp
  Entertainment LLC, na Flórida. Relata que o TCM apontou ao menos 20 inconsistências no edital, que o
  instituto instalou pouco mais de 3.200 roteadores e que três termos aditivos levaram o repasse de cerca
  de R$ 43 milhões previstos a R$ 69 milhões.'
