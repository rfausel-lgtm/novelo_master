summary: Notícia de 28/08/2026 segundo a qual o ministro André Mendonça (STF), ao analisar pedido do BRB,
  determinou o cancelamento de indisponibilidades que ainda atingiam bens, direitos e garantias vinculados ao
  banco, alcançando seis Cédulas de Crédito Bancário (CCBs) e 23 imóveis, com providências junto à Central
  Nacional de Indisponibilidade de Bens (CNIB). Descreve o fundamento atribuído à decisão e traz declaração do
  presidente do BRB. Não cita parecer da PGR, número do processo nem a vara de origem dos bloqueios, e não
  declara ter tido acesso ao texto da decisão.
