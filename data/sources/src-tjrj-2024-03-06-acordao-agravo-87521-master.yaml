summary: 'Acórdão em que o Banco Master figura como agravante e que transcreve, palavra por palavra, o
  art. 6º, III e §1º, do Decreto 45.563/2016 na redação dada pelo Decreto 47.625/2021 — corroborando a
  literalidade do dispositivo. Relator do voto vencedor: desembargador Heleno Ribeiro Pereira Nunes. O
  julgado cita quatro precedentes no mesmo sentido, evidenciando que o banco invocava o decreto estadual
  como fundamento recursal para afastar o teto de margem, com êxito.'
