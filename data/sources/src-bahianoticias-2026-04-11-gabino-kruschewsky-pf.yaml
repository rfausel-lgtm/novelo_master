summary: Reportagem que identifica Eugênio de Souza Kruschewsky, procurador do Estado da Bahia e sócio
  do escritório Gabino Kruschewsky, como primo de André Kruschewsky Lima, então diretor jurídico do Banco
  Master, e atribui a este a contratação do escritório do primo. A afirmação da relação de contratação
  não vem de documento lido pela equipe — é atribuição jornalística, tratada como classe C, não D.
