source_type: press
summary: 'Cobertura independente confirmando que, segundo a decisão do Min. Flávio Dino que autorizou as
  buscas contra Cezinha de Madureira, comunicações de junho/2025 mostram Mariângela Fialek enviando
  memoriais de processos sob relatoria de Nunes Marques a Cezinha, que confirmou videoconferência marcada
  com o ministro às 16h para tratar dos casos. Dino cita padrão de valores entre R$ 500 mil e R$ 2 milhões,
  "incompatíveis com a simples atuação técnica", mas explicita que "a investigação não se dirige a
  magistrados de qualquer tribunal superior" e que a PF não encontrou elementos de participação de
  integrantes do Judiciário.'
notes: Segunda fonte independente confirmando os mesmos fatos do Metrópoles, usada para elevar a
  classificação a C.
