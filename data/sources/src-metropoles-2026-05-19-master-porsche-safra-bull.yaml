summary: Luiz Bull financiou um Porsche Macan (contrato com o Banco Safra, 48 parcelas, de março de 2025
  a fevereiro de 2029), parou de pagar em dezembro de 2025 alegando ter contas bloqueadas por ordem judicial;
  o veículo foi apreendido pela PF em novembro de 2025, e a juíza da 7ª Vara Cível de São Paulo autorizou
  busca e apreensão em 19/05/2026. Bull foi preso na primeira fase da Operação Compliance Zero, em 18/11/2025.
