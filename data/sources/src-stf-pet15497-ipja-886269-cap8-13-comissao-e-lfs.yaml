summary: 'Capítulos finais (8 a 13, páginas 42-128) do mesmo documento comprobatório de 128 páginas já
  registrado no acervo (src-stf-pet15497-ipja-886269-documento-comprobatorio, capítulos 1-7). Cap. 8 (captação
  por Letras Financeiras, p.42-72): cronologia de aportes por WhatsApp entre Ricardo Siqueira e Vorcaro, de
  01/11/2023 a 19/07/2024, incluindo a mensagem de 18/06/2024 em que Ricardo Siqueira calcula seu próprio
  "bônus de desempenho por coordenação" em 0,6% sobre R$ 1,2 bilhão captado (R$ 7,2 milhões); tentativa
  frustrada de venda de LF do Banco Voiter (do qual Vorcaro é presidente) ao Rioprevidência via Maurício
  Quadrado; contato de um auditor do Banco Central (Márcio Contador Camargo) com Vorcaro sobre a falta de
  garantia dos aportes; reação de Ricardo Siqueira a parecer regulatório do MPS chamando reguladores de
  "criminosos". Cap. 9-10 (dificuldades regulatórias, p.72-94): tentativa de Vorcaro de suprimir vídeo do
  deputado estadual Luiz Paulo (PSD-RJ) crítico a um aporte de R$ 500 milhões, acionando Gilberto Kassab
  (presidente do PSD) — conseguiu a retirada de uma notícia do site "expresso222.com.br", mas não do vídeo do
  deputado. Cap. 11 (fundos, p.95-115): estrutura dos fundos Arena, Revolution, Texas I e Horizonte I
  (R$ 2,01 bilhões, já reconciliado no acervo). Cap. 12 (comissão de Ricardo Siqueira, p.115-124): identifica
  as duas empresas "Mídias Promotora Ltda" (CNPJ 37.565.625/0001-00 e 44.758.763/0001-71), formalmente em
  nome de Gilson Bahia Vasconcelos — que a PF aponta como possível "laranja", com histórico de estelionato,
  organização criminosa, mandado de prisão e recebimento de Auxílio Emergencial, e cujo telefone cadastrado na
  Receita Federal está vinculado a Ricardo Siqueira, não a ele; tabela de seis pagamentos rastreados por
  conversa, de 22/12/2023 a 19/07/2024, somando R$ 41.900.000,00 (com ressalva expressa da PF de possível
  dupla contagem). Cap. 13 (considerações finais, p.124-128): total consolidado de R$ 2,98 bilhões (R$ 970
  milhões em LFs + R$ 2,01 bilhões em fundos) direcionados ao Master pelo Rioprevidência.'
notes: Leitura feita por subagente interno a partir do mesmo arquivo PDF já baixado (sem necessidade de nova
  navegação no STF). Capítulo 11 (fundos) não foi lido em detalhe por ser majoritariamente tabelas já
  reconciliadas noutra evidência do acervo.
