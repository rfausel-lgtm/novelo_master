url: https://www.brasil247.com/brasil/andre-mendonca-prega-em-culto-evangelico-e-admite-bispos-da-assembleia-de-deus-sao-autoridades-sobre-mim
source_type: press
summary: 'Em culto de 12/09/2021 na Assembleia de Deus de Madureira (RJ), pouco depois de ser indicado por
  Jair Bolsonaro ao STF, André Mendonça declarou: "Os senhores são bispos da Assembleia de Deus, mas, para
  além disso, Deus os constituiu bispos sobre a minha vida. Vocês têm autoridade espiritual sobre a minha
  vida." O deputado Cezinha de Madureira, então líder da Frente Parlamentar Evangélica ("bancada da
  Bíblia"), estava presente ao culto.'
notes: 'Fonte verificada por esta sessão via WebFetch direto. NÃO confirma, neste artigo, a alegação (vinda
  de um fork delegado, ainda não verificada de forma independente por esta sessão, e que citava
  incorretamente Rodrigo Pacheco como presidente da Câmara — ele presidia o Senado em 2021, não a Câmara)
  de que Cezinha teria articulado diretamente a aprovação do nome de Mendonça no Congresso — tratado como
  open_question no verbete de Cezinha, não como fato estabelecido.'
