summary: Defere pedidos de Jaques Wagner para desbloquear R$ 53.994,59 constritos em 23/06/2026 na conta em que
  recebe os proventos do Senado e para excluir da ordem de constrição os créditos futuros da mesma fonte pagadora,
  com a concordância da PGR; a decisão não alcança valores de outras origens.
