summary: Os deputados Lindbergh Farias (PT-RJ) e Rogério Correia (PT-MG) pediram à PGR, em 03/09/2026,
  a investigação de Nikolas Ferreira, Daniel Vorcaro e Thiago Rodrigues de Faria por possíveis crimes
  de corrupção passiva, corrupção ativa e advocacia administrativa, com base nas mensagens sobre os voos
  da campanha de 2022 e o pedido de liberação do ativo mineral em 2025.
