source_type: press
summary: "Reportagem de 21/10/2026 (atualizada em 22/10, 19h24) sobre a decisão da conselheira substituta
  Silvia Cristina Monteiro Moraes, do TCE-SP, que julgou irregulares as contas de 2024 do São Roque Prev e
  imputou ao ex-presidente Vanderlei Massarioli o ressarcimento de R$ 93,15 milhões aplicados em letras
  financeiras do Banco Master. Traz a ressalva da decisão sobre a consultoria Crédito & Mercado, o envio dos
  autos à Presidência do tribunal e ao Ministério Público estadual, e as notas do instituto e da defesa.
  Republicado por outros portais como Estadão Conteúdo (dgabc, Diário de Pernambuco, Times Brasil): mesma
  apuração."
