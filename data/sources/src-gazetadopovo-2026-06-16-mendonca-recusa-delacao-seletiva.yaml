source_type: press
summary: 'Cobertura da mesma sessão de 16/06/2026 da Segunda Turma, com um detalhe ausente na cobertura da CNN
  Brasil: Gilmar Mendes reagiu à fala de Mendonça dizendo "Está tudo muito invertido", observando que a
  tratativa de delação premiada não deveria chegar ao relator, e sim à Polícia Federal ou à Procuradoria-Geral
  da República. A reportagem registra ainda que a PF e a PGR rejeitaram, na mesma semana, uma segunda proposta
  de delação de Vorcaro, por não trazer nada além do que já constava da investigação; e que a Turma manteve a
  prisão preventiva do pai e do primo de Vorcaro.'
