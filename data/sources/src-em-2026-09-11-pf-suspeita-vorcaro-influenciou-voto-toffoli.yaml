source_type: press
summary: 'Com base em relatório da PF divulgado pela revista piauí, de procedimento cujo sigilo André Mendonça levantou
  em 10/09/2026, relata mensagens de André Kruschewsky, diretor jurídico do Banco Master, a Daniel Vorcaro sobre
  a ação da destilaria Alcídia contra a União no STF: o caso "serve de paradigma para nossos casos", "Vamos nos
  movimentar?" e "Se precisar de ajuda para tirar de pauta, avisa!". O julgamento terminou 3 a 2 a favor da Alcídia
  em 01/10/2024. O gabinete de Dias Toffoli afirmou que ele apresentou o mesmo voto no plenário virtual e no julgamento
  presencial.'
