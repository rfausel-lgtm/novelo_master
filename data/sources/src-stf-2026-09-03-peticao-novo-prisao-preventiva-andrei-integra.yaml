summary: 'Segunda petição do Partido Novo (a primeira foi em 02/09/2026), assinada pelas advogadas Carolina
  Barreto Siebra (OAB/DF 67.775) e Ana Carolina Sponza Braga (OAB/RJ 158.492), requerendo a decretação
  de prisão preventiva de Andrei Augusto Passos Rodrigues, com base no depoimento reservado de Daniel
  Vorcaro (com participação de membro da PGR) ao juiz instrutor do gabinete de Mendonça: Vorcaro alegou
  ter recebido ameaças de ser ''jogado para fora'' de aeronaves durante transferência de custódia, atribuiu
  a agentes da PF ameaças agindo ''em nome de'' Andrei Rodrigues sempre que sua colaboração premiada avançava,
  e afirmou que Andrei seria uma das autoridades objeto de sua própria delação, por ter se beneficiado
  de ''custeio de viagens e despesas em geral''. A petição enquadra a conduta nos arts. 2º §1º da Lei
  12.850/2013 (embaraço a investigação envolvendo organização criminosa) e 317/321 do CP (corrupção passiva/advocacia
  administrativa).'
