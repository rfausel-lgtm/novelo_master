source_type: press
summary: 'Segundo apuração da CNN Brasil, Daniel Vorcaro sinalizou a interlocutores que não pretende apresentar
  acusações contra Alexandre de Moraes em uma nova proposta de delação premiada — a terceira tentativa,
  após duas propostas anteriores rejeitadas por PF e PGR. A intenção é manter, nos novos anexos, versão
  semelhante à da segunda proposta: relação de amizade com Moraes e relação comercial com a advogada Viviane
  Barci de Moraes, esposa do ministro, com quem Vorcaro assinou contrato de R$ 129 milhões. Segundo fontes
  ouvidas pela reportagem, Vorcaro considera que o levantamento do sigilo do relatório da PF — que tornou
  pública a relação com Moraes — prejudicou sua estratégia de apresentar a delação e tentar autorização
  para aguardar o julgamento em prisão domiciliar. No MPF, a percepção é de que as chances de negociação
  se esgotaram e que esta terceira tentativa é vista como calculada, sem a espontaneidade exigida para
  o benefício.'
