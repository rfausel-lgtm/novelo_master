title: Patrimônio de R$ 20 bilhões ligado a Vorcaro estaria espalhado em imóveis e fundos, diz Mansur
publisher: Times Brasil / CNBC
publication_date: '2026-09-05'
retrieved_at: '2026-09-06'
url: https://timesbrasil.com.br/empresas-e-negocios/patrimonio-de-r-20-bilhoes-ligado-a-vorcaro-estaria-espalhado-em-imoveis-e-fundos-diz-mansur/
source_type: press
summary: Segundo a proposta de Mansur, o patrimônio atribuído a Vorcaro 'não estaria concentrado em contas
  ou investimentos diretamente vinculados ao empresário', mas espalhado em imóveis, fundos de investimento
  (com menção nominal ao fundo Astralo, já citado em investigações da PF), direitos creditórios e ativos
  em nome de terceiros. A reportagem ressalva explicitamente que 'o valor citado não corresponde necessariamente
  a R$ 20 bilhões disponíveis para saque ou mantidos em aplicações de alta liquidez'. Em 05/09/2026, a
  homologação do acordo pelo STF seguia pendente de análise e comprovação pela PGR.
