source_type: press
language: pt-BR
summary: >-
  Segundo a reportagem, Daniel Vorcaro participava de grupo de WhatsApp chamado "Ciro Daniel Fábio Hugo" com
  o senador Ciro Nogueira, o deputado Hugo Motta e o ex-ministro Fábio Faria; o grupo foi criado por Ciro em
  abril de 2024, com apagamento das mensagens após 90 dias; os diálogos registrados no celular do banqueiro
  concentram-se de 20/08 a 17/11/2025, dia da prisão de Vorcaro, e mensagens anteriores ainda podem ser
  resgatadas pela PF, "que analisa o conteúdo também obtido pelo UOL". Segundo o texto, os participantes
  combinavam encontros e viagens, entre elas uma viagem em aeronave de Vorcaro organizada em 28/08/2025, com
  destino não informado. Ciro, Faria e Motta "preferiram não comentar o teor das conversas com Vorcaro"; a
  defesa de Vorcaro não respondeu. Não cita relatório, Pet ou decisão.
notes: >-
  Publicada às 05h30 de 30/09/2026. Página marcada "só para assinantes"; texto lido no navegador embutido em
  16/10/2026 (o WebFetch foi recusado pela ferramenta). Fonte primária da notícia do grupo. A reportagem
  transcreve mensagens e trata de terceiros, de familiares e de outros assuntos que o Novelo não registra.
