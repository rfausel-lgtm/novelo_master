source_type: press
summary: O gabinete de Toffoli confirmou em 12/02/2026 que o ministro foi sócio dos irmãos José Eugênio
  e José Carlos Dias Toffoli na Maridt Participações, que deteve cotas do resort Tayayá em Ribeirão Claro
  (PR); a nota invoca a Loman (art. 36) e nega relação financeira com Vorcaro. O relatório da PF, de quase
  200 páginas, foi entregue a Edson Fachin por Andrei Rodrigues.
