summary: A Crédito e Mercado — consultoria já mapeada no corpus por Congonhas e Maceió — é sucessora direta
  da Plena Consultoria de Investimentos, criada dois meses após a Operação Fundo Perdido (março de 2014);
  ex-sócios da Plena (Eduardo Nakamura, Celso Steremberg, Marco Antonio Rodrigues Martins, Henrique Andrade
  Martins) foram condenados por corrupção ativa em 1ª instância, todos absolvidos por prescrição no TRF3
  (maio de 2025), sem julgamento de mérito. A PF suspeita que o advogado Cecílio Galvão — já investigado
  por receber R$ 4 milhões ligados à 'Farra do INSS' — seja laranja dos donos reais da Crédito e Mercado;
  o CEO Renan Foglia Calamia (já mapeado no corpus por Congonhas e Maceió) e a diretora Samanta Zaniquelli
  vieram da Plena. A consultoria atendeu Araras, Santo Antônio de Posse, São Roque e Maceió, entre outros
  RPPS afetados pelo Master.
