url: https://static.poder360.com.br/uploads/2026/09/ADI-7791-decisao-Dino-pede-investigacao-CVM-caso-Master-24set2026.pdf
source_type: press
language: pt-BR
summary: Íntegra, hospedada pelo Poder360, da decisão monocrática do relator da ADI 7.791 no STF, Flávio Dino,
  datada de "Brasília, 24 de setembro de 2026", com "Publique-se" e assinatura digital (código de
  autenticidade 7945-FE6E-EABB-E40B no portal do STF). Em aditamento à decisão interlocutória de 20/09/2026
  (eDOC 190) e com base no relatório do grupo de trabalho da CVM (eDOC 182), requisita à Polícia Federal a
  instauração de inquérito policial, determina à CVM o envio em 72 horas da cópia integral do Processo SEI nº
  19957.001206/2022-08 e informações sobre seu trâmite, e dá ciência à PGR. Nove páginas.
notes: Aberta com lote:fonte em 21/10/2026; o texto extraído pelo pdftotext saiu ilegível (fonte embutida sem
  mapa Unicode). O Novelo renderizou as nove páginas como imagem (pypdfium2) e leu-as integralmente; a
  transcrição literal dos trechos usados (cabeçalho, seção I, seção III e dispositivo) foi registrada no cache
  com lote:fonte --texto. sha256 do PDF b2d48efa83eea4fd.... É cópia reproduzida por veículo, não URL do
  portal do STF. A decisão traz "Publique-se" e não tem marca de sigilo. Atualização de 23/10/2026, a mesma
  peça está no portal do STF (downloadPeca id 15390694465, texto legível), com o mesmo código de autenticidade
  7945-FE6E-EABB-E40B no rodapé e o mesmo dispositivo; a fonte do portal passa a ser a principal (ver
  src-stf-2026-09-24-decisao-adi-7791-requisita-inquerito-pf-portal-do-stf) e esta cópia fica como secundária.
