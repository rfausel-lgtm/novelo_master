summary: 'Reportagem que revelou o contrato entre o Banco Master e o escritório Barci de Moraes. É o exemplo
  mais forte de que a cobertura do veículo sobre o caso, após a liquidação, foi crítica e pioneira — inclusive
  contra interesses poderosos. NOTA DE CONTEXTO DA PLATAFORMA: o Metrópoles recebeu R$ 27,28 milhões do
  Banco Master e do Will Bank entre o segundo semestre de 2024 e outubro de 2025, em contratos de publicidade
  e patrocínio esportivo — movimentação que o Coaf classificou como atípica. O veículo sustenta tratar-se
  de relação comercial regular e pública. Não há acusação formal, indiciamento ou denúncia contra o veículo
  ou seus dirigentes. A cobertura do Metrópoles sobre o caso após a liquidação é ampla e em vários pontos
  pioneira. Esta nota acompanha toda citação do veículo neste corpus por transparência, e não implica
  juízo sobre a matéria citada.'
