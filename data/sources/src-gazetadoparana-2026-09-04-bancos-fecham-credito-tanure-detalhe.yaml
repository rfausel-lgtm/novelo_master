summary: 'Detalha: UBS antecipou, em outubro de 2025, vencimento de ''collar finance'' de R$ 2 bilhões
  garantido por ações da Prio; a XP antecipou vencimento de R$ 520 milhões em debêntures garantidas por
  ações da Emae e da Ambipar, resultando na perda da Emae; BTG Pactual, Prisma, Farallon e Santander executaram
  dívida de cerca de R$ 1,5 bilhão (financiamento da Copel Telecom/Ligga) e assumiram participações em
  Light e Alliança Saúde. Trecho: ''Quem cobre ele em todos os bancos é o departamento de reestruturação
  de crédito.'''
