summary: Nelson Antônio de Souza, ex-presidente da Caixa Econômica Federal, foi aprovado pelo Banco Central
  em 26/11/2025 para assumir a presidência do BRB, após confirmação pela Câmara Legislativa do DF (16
  votos a 6), imediatamente após o afastamento de Paulo Henrique Costa pelo governador Ibaneis Rocha.
