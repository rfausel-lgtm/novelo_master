title: 'Caso Master: acionistas do BRB aprovam acionar Justiça contra ex-gestores por levar banco à crise'
publisher: O Tempo
publication_date: '2026-08-24'
url: https://www.otempo.com.br/politica/judiciario/2026/8/24/caso-master-acionistas-do-brb-aprovam-acionar-justica-contra-ex-gestores-por-levar-banco-a-crise
source_type: press
summary: 'Em assembleia geral extraordinária, os acionistas do BRB aprovaram, com base no art. 159 da
  Lei 6.404/1976, autorização processual para acionar judicialmente ex-gestores do banco pelas perdas nas
  operações com o Banco Master — R$ 30 bilhões em transações totais, cerca de R$ 8,8 bilhões em ativos
  estimados como problemáticos. Só Paulo Henrique Costa, ex-presidente à época das operações, é
  nominalmente citado; outros "ex-gestores" não são identificados individualmente. O banco frisou que a
  autorização não constitui "definição prévia de responsabilidade" e serve como base processual enquanto
  PF e órgãos de investigação prosseguem.'
