summary: 'Consulta direta ao CNPJ 11.459.904/0001-04, confirmando que a única ''Milo Investimentos'' com
  registro plausível no ecossistema do caso é a da família Vorcaro (diretoria: Henrique Moura Vorcaro
  e Natália Bueno Vorcaro Zettel), sem qualquer vínculo com Augusto Lima, Andréa Lima Novaes ou qualquer
  Kruschewsky. Variações testadas (''Milo Empreendimentos'', ''Millo''s Participações'') também não apresentam
  vínculo plausível.'
