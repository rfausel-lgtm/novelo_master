notes: 'RE-CHECAGEM (05-06/09/2026, agente de verificação dedicado): leitura direta do HTML bruto do artigo
  (não resumo ou transcrição de terceiros) mostra que o texto publicado distingue corretamente ''52 ocasiões''
  (contabilizadas ao longo do período de 28/10 a 17/11) de ''5 mensagens de visualização única'' (especificamente
  em 17/11) — a divergência ''52 mensagens em 17/11'' antes anotada aqui não foi localizada na redação
  atual e visível do artigo. Não foi possível determinar se a nota original refletia uma versão editada
  do texto, um resumo/transcrição de terceiros, ou um equívoco de leitura anterior da equipe. Mantém-se
  a orientação de tratar esta fonte como posição atribuída, nunca como lastro factual autônomo — mas a
  alegação específica de erro numérico nesta matéria fica sem confirmação após nova checagem.'
