summary: 'Newsletter investigativa de David Ágape, de linha editorial declaradamente crítica ao governo
  e ao STF, com conteúdo parcialmente restrito a assinantes. Analisa o IPJ-A 3298613/2026 e sustenta que
  a perícia contradiz a nota do gabinete de Alexandre de Moraes de 06/03/2026. A equipe editorial leu
  os documentos primários da PET 16.662 e apurou divergências entre o resumo da newsletter e o laudo:
  o relatório registra 5 mensagens de visualização única em 17/11/2025, e não as 52 mensagens citadas.
  Usada aqui apenas como posição atribuída, nunca como lastro factual.'
