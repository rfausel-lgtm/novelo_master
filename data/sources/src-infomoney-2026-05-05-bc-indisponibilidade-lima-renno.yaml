summary: Reproduz comunicado do Banco Central, assinado pelo chefe adjunto do Departamento de Resolução e de Ação
  Sancionadora, sobre a indisponibilidade dos bens de Augusto Ferreira Lima e Luiz Rennó Netto, com base no art.
  36 da Lei 6.024/1974, pela atuação como administradores de fato do Banco Master nos doze meses anteriores ao regime
  de resolução, conforme comissão de inquérito do Ato de Diretor 695, de 18/02/2026, e Parecer Jurídico 543/2026-BCB/PGBC,
  de 29/04/2026.
