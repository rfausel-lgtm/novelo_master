url: https://idest.com.br/variedade/instituto-de-previdencia-de-sao-gabriel-do-oeste-aplicou-r-34-milhoes-em-letra-financeira-do-banco-master
source_type: press
summary: 'A mais detalhada entre as fontes consultadas para os seis compradores pequenos. O SGOPrev aplicou R$ 3,4
  milhões (4,20% de sua carteira, conforme Relatório Analítico de agosto de 2025) em Letra Financeira do Banco Master
  indexada ao IPCA, prazo de dez anos, taxa de 7,15% ao ano, enquadrada no artigo 7º, inciso IV, da Resolução CMN
  nº 4.963/2021. A operação passou por Comitê de Investimentos e Conselho Administrativo, e foi embasada por parecer
  técnico da Crédito & Mercado Consultoria de Investimentos, empresa contratada pelo SGOPrev, datado de 12/09/2025,
  que concluiu que o banco ''atendia aos requisitos legais e de risco'' da Resolução CMN 4.963/2021 — isso apesar
  de alertas de instabilidade do Master já existentes desde 2024, citados pela reportagem: recomendações de cautela
  do Ministério Público de Contas de São Paulo, proibições de novos investimentos pelo TCE do Rio de Janeiro (a
  reportagem dá maio e outubro de 2024) e manifestações do conselho fiscal do Rioprevidência.'
notes: A data dos alertas do TCE-RJ citada nesta reportagem (maio e outubro de 2024) diverge da cronologia estabelecida
  no lote 163 deste acervo, com base em cobertura direta e mais detalhada do processo do Rioprevidência (maio e
  outubro de 2025). A equipe não reconciliou a diferença de um ano; ambas as datas ficam registradas, com a de 2025
  como a mais provável, por vir de fonte mais próxima do processo específico do TCE-RJ.
