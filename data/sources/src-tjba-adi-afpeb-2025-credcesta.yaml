summary: Ação direta de inconstitucionalidade nº 8073008-82.2025.8.05.0000, ajuizada em 24/11/2025 pela
  Associação dos Funcionários Públicos do Estado da Bahia perante o Órgão Especial do TJ-BA, relatoria
  da desembargadora Gardênia Pereira Duarte. Pede a suspensão imediata dos descontos, a restauração da
  portabilidade e a declaração de inconstitucionalidade dos decretos, sob o argumento de criarem monopólio
  privado sem licitação. Instruída com contracheques de vinte servidores.
