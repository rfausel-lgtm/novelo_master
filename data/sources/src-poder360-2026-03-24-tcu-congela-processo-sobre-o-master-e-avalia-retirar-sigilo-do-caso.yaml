summary: "Descreve despacho de 24/03/2026 do relator Jhonatan de Jesus: não pautará a análise do processo até
  receber os resultados do processo do BC, do processo disciplinar da CGU e das apurações do STF, e pediu à
  área técnica a reavaliação do grau de sigilo, com possível levantamento total ou parcial. Registra que, no
  mesmo dia, a CAE do Senado levantou o sigilo imposto às auditorias do TCU. Não traz declaração de gabinete."
