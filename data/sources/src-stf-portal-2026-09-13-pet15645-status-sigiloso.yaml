summary: 'Consulta ao portal público (sem certificado digital) confirma que a Pet 15.645/DF (número único
  0166793-29.2026.1.00.0000, incidente 7526458) está classificada como "PROCESSO ELETRÔNICO SIGILOSO", com
  relator André Mendonça. Os únicos dados visíveis são andamentos sem teor: protocolado e autuado em
  10/03/2026, distribuído por prevenção em 11/03/2026 — datas compatíveis com a mesma janela temporal da
  autuação da Pet 15.556 (06/03/2026) e de outras petições satélites da Operação Compliance Zero. Abas de
  Partes, Decisões e Peças não renderizam conteúdo. Notavelmente, a Pet 15.645 NÃO consta na lista de 14
  "procedimentos contidos ou relacionados" à Pet 15.556 cujo sigilo Mendonça levantou em 10/09/2026 (Inq
  5.026, Rcl 88.121, Pet 15.198, Inq 5.035, Pet 15.478, Pet 15.504, Pet 15.562, Pet 15.563, Pet 15.693, Pet
  15.976-78, Pet 16.019, Pet 16.662) — o que é consistente com ela seguir sigilosa por não ter sido
  formalmente incluída nesse rol, apesar de Moraes considerá-la portadora de "elementos essenciais". Também
  verificado: a conta autenticada de Rafael Fausel no peticionamento.stf.jus.br — que tem relação de parte
  visível em todos os demais 16 processos "Vorcaro" que acompanha — NÃO tem acesso à Pet 15.645
  ("Não foi possível encontrar o processo"), confirmando que ela está fora do alcance mesmo de quem
  acompanha de perto o caso.'
notes: Não foi possível identificar assunto ou partes da Pet 15.645 — permanece pergunta em aberto.
