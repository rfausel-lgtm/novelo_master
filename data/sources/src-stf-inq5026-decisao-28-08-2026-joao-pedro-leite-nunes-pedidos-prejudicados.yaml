summary: A defesa de João Pedro Leite Nunes pediu (i) acesso integral aos autos do INQ 5.026 e (ii)
  adiamento de oitiva marcada para 27/08/2026, alegando falta de acesso prévio ao caderno investigativo.
  O relator julgou ambos os pedidos prejudicados — o acesso já havia sido concedido desde 24/08/2026, e a
  data da oitiva já havia transcorrido quando a decisão foi proferida.
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). O nome do requerente aparece por extenso na própria decisão,
  fora do bloco de partes "sob sigilo" do cabeçalho da peça. Código de autenticação/senha do rodapé de
  cada página nunca reproduzido no acervo.'
