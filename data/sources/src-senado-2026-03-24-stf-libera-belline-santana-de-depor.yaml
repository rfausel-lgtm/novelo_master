source_type: official_legislative
summary: Registra decisão do ministro André Mendonça que desobrigou o servidor de comparecer à CPI e transformou
  a convocação em facultativa, com garantia de silêncio e assistência de advogado caso comparecesse. Informa
  que ele cumpre medida cautelar com monitoramento eletrônico em São Paulo e que situação semelhante se
  aplica a Paulo Sérgio Neves de Souza, diretor de fiscalização entre 2019 e 2023; Belline Santana chefiou
  o Departamento de Supervisão Bancária entre 2019 e 2024.
