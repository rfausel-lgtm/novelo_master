summary: A Polícia Federal informa, via Ofício nº 12/2026-CINQ/CGRC/DICOR/PF, que a demanda pericial da
  2ª fase da Operação Compliance Zero envolve cerca de 100 dispositivos eletrônicos, estimando-se
  aproximadamente 20 semanas de dedicação exclusiva de um único perito para as extrações; as extrações
  mais urgentes já haviam sido feitas em caráter excepcional a pedido da PGR, para evitar perda de
  conteúdo probatório perecível. Requer autorização para seguir o fluxo pericial ordinário da instituição.
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente), na aba de Peças do INQ 5.026 — mas o próprio documento tem cabeçalho
  "PETIÇÃO 15.198/DF", tratando-se de decisão cross-referenciada entre os dois processos. Código de
  autenticação/senha do rodapé de cada página nunca reproduzido no acervo.'
