summary: 'Texto da Agência O Globo (26/12/2025): a acareação entre Vorcaro, Paulo Henrique Costa e o diretor
  de Fiscalização do BC foi marcada por Toffoli de ofício, sem pedido da PGR ou da PF; na noite de
  quarta-feira (24/12) o procurador-geral Paulo Gonet havia pedido a suspensão da acareação, sob o argumento
  de que a audiência seria "prematura"; o ministro manteve a audiência para terça-feira (30/12). Traz
  avaliações de ministros do STF não identificados e de juristas, em sentidos opostos.'
notes: Republicação da Agência O Globo no InfoMoney; conta como uma fonte (O Globo). As opiniões de ministros
  não identificados e de juristas não entram no acervo.
