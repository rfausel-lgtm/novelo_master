language: pt-BR
summary: "Coluna que descreve a petição de 54 páginas, com trechos tarjados, protocolada em 07/10/2026 pelo
  liquidante do Master no Tribunal de Falências do Sul da Flórida: valores e datas das compras dos três
  imóveis, o caminho que o liquidante atribui aos recursos até as duas empresas de Delaware (Clear River e
  Goldbeach) e o pedido de indisponibilidade dos imóveis. Registra que a coluna procurou a defesa de Daniel
  Vorcaro, que não respondeu. A coluna trata ainda de assuntos que o Novelo não registra neste lote."
notes: Aberta em 16/10/2026 com lote:fonte. O título e o texto da coluna usam vocabulário da tese do
  liquidante que o Novelo não reproduz em texto próprio; o título consta aqui apenas por ser o título exato da
  fonte. A leitura da petição é do colunista; o Novelo não leu a petição (só o registro do docket). Trechos da
  coluna sobre outros assuntos, sobre depoimento de Vorcaro à PF e sobre terceiros foram deixados de fora.
