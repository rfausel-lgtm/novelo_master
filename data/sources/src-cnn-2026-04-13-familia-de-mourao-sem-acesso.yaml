summary: 'Nota da família: até aquela data não tivera acesso às imagens de segurança, aos autos do inquérito
  que apura as circunstâncias da morte, conduzido pela PF sob supervisão do STF, nem ao laudo do Instituto
  Médico Legal com a causa mortis. A família diz ter sabido do ocorrido pela imprensa e contesta o uso
  do apelido: ''trata-se de acusação gravíssima, sem apresentação pública, até o momento, de qualquer
  prova nesse sentido. Seus familiares jamais tiveram conhecimento de envolvimento em atos de violência
  e muito menos de homicídio''.'
