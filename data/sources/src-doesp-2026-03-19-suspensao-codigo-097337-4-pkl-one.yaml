summary: Processo SEI 018.00013344/2025-92. O diretor da Diretoria da Folha de Pagamento determina a suspensão
  do código de desconto 097337-4, utilizado pela PKL One, com efeitos a partir de 19/02/2026, 'pelo descumprimento
  ao estabelecido no artigo 6º, inciso IX, do Decreto nº 60.435/2014' — isto é, exatamente o inciso criado
  pelo decreto de 2022, que exigia convênio com instituição financeira autorizada pelo Banco Central.
  Trata-se de suspensão de código, não de descredenciamento; ato posterior de descredenciamento estadual
  não foi localizado.
