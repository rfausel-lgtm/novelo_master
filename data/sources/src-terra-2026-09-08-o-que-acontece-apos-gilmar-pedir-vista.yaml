summary: 'Explica que Gilmar Mendes tem até 90 dias, pelo regimento interno do STF, para devolver a vista,
  e que o pedido de vista não suspende os efeitos da decisão monocrática de Mendonça — o afastamento cautelar
  de Andrei Rodrigues permanece válido enquanto o julgamento colegiado não é concluído. Cita a advogada
  constitucionalista Vera Chemim: ''O afastamento de Andrei Rodrigues é garantido, continua valendo. É
  um afastamento cautelar.'''
