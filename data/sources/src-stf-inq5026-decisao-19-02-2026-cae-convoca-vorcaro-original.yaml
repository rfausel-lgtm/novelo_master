summary: 'Decide a Petição 16015/2026 (e-Doc. 310), da Comissão de Assuntos Econômicos do Senado sob a
  presidência de Renan Calheiros, que pedia autorização para colher depoimento de Daniel Vorcaro em
  24/02/2026. O relator autoriza, invocando o direito à não autoincriminação (nemo tenetur se detegere) e
  a jurisprudência das ADPFs 395/444 contra condução coercitiva de investigados — mas condiciona o
  comparecimento à manifestação prévia, expressa e inequívoca do próprio Vorcaro, e determina que a CAE
  agiu por convite (art. 58, §2º, V, CF), não por poder de CPI, reforçando o caráter voluntário do ato.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). É a decisão original que a de 26/02/2026 (já registrada no acervo)
  estendeu para a sessão de 10/03/2026 — permanecia como lacuna explícita em renan-calheiros.yaml até esta
  apuração. Código de autenticação/senha do rodapé de cada página nunca reproduzido no acervo.'
