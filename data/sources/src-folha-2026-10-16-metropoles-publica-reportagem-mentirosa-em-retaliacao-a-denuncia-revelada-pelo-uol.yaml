summary: 'Resposta da Folha à reportagem do Metrópoles, publicada pelo próprio jornal. Diz que a reportagem de
  agosto de 2024 (de Júlia Moura e Joana Cunha) não foi adiada nem amenizada: o assessor Guilherme Barros
  pediu uma visita para que Vorcaro desse sua versão, o pedido foi aceito e o texto saiu "tão logo a apuração
  foi concluída"; o jornal aceitou o pedido de não registrar a visita no Painel; a atualização posterior, no
  ano seguinte, incluiu a prisão de Vorcaro e a liquidação do banco. Afirma que "não havia outra versão,
  apenas a que foi publicada", que Dávila só soube do valor oferecido a Barros pelas mensagens vazadas e chama
  a reportagem do Metrópoles de retaliação à do UOL. Informa, segundo seu departamento comercial, o total de
  R$ 516.441,60 em anúncios veiculados no jornal de 2021 a 2025. Publica as perguntas do portal e as
  respostas.'
