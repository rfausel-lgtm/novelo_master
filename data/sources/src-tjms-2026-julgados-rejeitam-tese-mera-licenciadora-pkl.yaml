title: Julgados do TJMS que rejeitam a tese de que a PKL One seria 'mera licenciadora' do CredCesta
publisher: Tribunal de Justiça de Mato Grosso do Sul
publication_date: '2026-08-31'
retrieved_at: '2026-09-09'
url: https://esaj.tjms.jus.br/cjpg/
source_type: official_court
summary: Conjunto de decisões lidas pela equipe no inteiro teor. Em 0824490-69.2025.8.12.0001 (13ª Vara
  Cível de Campo Grande, 04/02/2026) a defesa sustenta a ilegitimidade passiva da PKL One 'afirmando que
  o contrato de crédito foi firmado exclusivamente com o Banco Master S.A., sendo a PKL ONE mera licenciadora
  de direitos de exploração do programa CREDCESTA'. Em 0813221-67.2024.8.12.0001 (3ª Vara Cível da capital,
  31/08/2026) a tese é rejeitada porque os descontos na remuneração 'são identificados em nome da PKL
  One Participações S.A.'; em 0803689-82.2024.8.12.0029 (2ª Vara Cível de Naviraí, 12/08/2026) a legitimidade
  é mantida por solidariedade no Código de Defesa do Consumidor e teoria da aparência, porque o nome fantasia
  'Credcesta' figura no próprio cartão. Registrada também decisão em sentido oposto — 0805597-93.2026.8.12.0001,
  3ª Vara Bancária da capital, 04/09/2026 —, que critica petição padronizada e sinaliza litigância predatória
  no meio do volume.
