summary: >-
  Despacho de duas páginas, assinado digitalmente pelo relator em 16/06/2026, com as partes do cabeçalho
  marcadas "SOB SIGILO". Levanta o sigilo "de ambos os processos (Pets nº 15.978 e 15.873)", tendo em vista
  a inclusão em pauta, "na data de hoje e de última hora", da devolução da vista regimental das duas Pets na
  sessão presencial da Segunda Turma, a necessidade de permitir aos demais ministros do colegiado o acesso à
  integralidade dos feitos e a ausência de prejuízo à investigação. Não descreve o conteúdo das Pets nem
  determina a publicação de relatórios.
