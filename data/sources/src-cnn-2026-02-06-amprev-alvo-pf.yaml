summary: Em 06/02/2026 a PF cumpriu quatro mandados de busca em Macapá (operação Zona Cinzenta, 4ª Vara
  Federal) contra o diretor-presidente da Amprev, Jocildo Silva Lemos, e dois membros do comitê de investimentos,
  pelos votos favoráveis à aplicação de R$ 400 milhões em letras financeiras do Master; apura gestão temerária
  e fraudulenta. Lemos foi tesoureiro de Alcolumbre em 2022; o senador não está entre os investigados.
  A Amprev só aplicou menos que o Rioprevidência (R$ 970 mi).
