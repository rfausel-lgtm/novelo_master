summary: Corrobora, de forma independente, que o ministro Dias Toffoli suspendeu monocraticamente, em
  30/09/2025, a apuração do Ministério Público do Maranhão sobre o contrato do escritório de Daniel Leite
  com a Câmara de Imperatriz, sob o fundamento de que não haveria 'lastro mínimo' para a acusação e que
  não existe improbidade sem dolo.
