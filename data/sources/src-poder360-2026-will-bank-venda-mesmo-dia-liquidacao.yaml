summary: Registra depoimento de Vorcaro afirmando que a venda do Will Bank ao fundo Mubadala Capital (Abu
  Dhabi) estava praticamente concluída, faltando apenas assinaturas, e seria formalizada em 18/11/2025
  — mesma data em que o Banco Central decretou a liquidação do Master —, mas foi interrompida pela ação
  da PF e do BC. A venda não se concretizou; o Will Bank foi liquidado extrajudicialmente em 21/01/2026.
