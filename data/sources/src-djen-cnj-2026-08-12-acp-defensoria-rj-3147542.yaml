summary: Consulta da equipe à API pública do Diário de Justiça Eletrônico Nacional, que confirma a distribuição
  da ação civil pública da Defensoria Pública do Rio de Janeiro à 3ª Vara Empresarial da Comarca da Capital
  em 10/08/2026, com publicação em 12/08/2026, tendo a PKL One Participações entre as partes. Varredura
  das publicações do período com as três rés não localizou agravo de instrumento contra a liminar — o
  único registro do feito é o da distribuição.
