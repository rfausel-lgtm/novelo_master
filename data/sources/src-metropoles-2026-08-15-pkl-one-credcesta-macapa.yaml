source_type: press
summary: Relata disputa judicial entre o liquidante do Banco Master e a PKL One, identificada como pertencente
  a Andréa Lima Novaes (prima de Augusto Lima), pelos repasses do Credcesta relativos à folha de servidores
  de Macapá, com contrato aditado em 11/08/2025. Decisão liminar determinou que a Prefeitura de Macapá
  retenha e provisione os valores até definição judicial.
