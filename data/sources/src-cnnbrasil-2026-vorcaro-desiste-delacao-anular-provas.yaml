summary: 'A defesa de Daniel Vorcaro mudou de estratégia: desistiu de insistir numa nova proposta de delação
  premiada e passou a concentrar esforços no mérito da ação penal, com ênfase em contestar a cadeia de
  custódia dos celulares apreendidos. Não localizada, nesta ou em outra fonte consultada, reação específica
  da defesa ao conteúdo da delação de João Carlos Mansur (distinta de reagir ao fato de ela existir).'
