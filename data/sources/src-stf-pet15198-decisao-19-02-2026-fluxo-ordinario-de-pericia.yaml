summary: PDF de 11 páginas da decisão assinada digitalmente em 19/02/2026 pelo relator na Pet 15.198/DF
  (partes sob sigilo), anexado à notícia do STF de 19/02/2026. Defere o pedido da PF (Ofício 12/2026, e-doc.
  380; representação e-doc. 306 do INQ 5.026) de fluxo ordinário de trabalho pericial para cerca de 100
  dispositivos, autoriza diligências ordinárias e a custódia do material nos depósitos da PF, fixa regras de
  compartimentação, determina que novas investigações sejam previamente requeridas ao relator e determina a
  manutenção do sigilo padrão, nível III.
notes: O link consta da notícia do STF da mesma data; o texto extraído é idêntico (mesmo sha256 do texto,
