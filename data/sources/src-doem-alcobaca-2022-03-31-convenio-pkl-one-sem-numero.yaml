summary: Edição 1.611, ano 10, páginas 18 a 28, obtidas por reconhecimento óptico de caracteres, já que
  as páginas são imagem. O instrumento é publicado com o número em branco — 'CONVÊNIO PARA CONCESSÃO DE
  OPERAÇÕES DO CARTÃO DE BENEFÍCIO CONSIGNADO CREDCESTA Nº ___' — e com a data de assinatura também em
  branco, na fórmula ', de de de 20'. Vigência de sessenta meses improrrogáveis a contar da assinatura
  que o documento não data. Assinam pela empresa Marcos Oliveira Calmon de Bittencourt e Andrea Lima Novaes,
  e pelo município o prefeito Givaldo Muniz.
