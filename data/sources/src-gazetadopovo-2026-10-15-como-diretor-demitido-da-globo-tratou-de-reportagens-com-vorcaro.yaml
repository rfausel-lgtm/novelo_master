summary: Diz que as conversas entre Frederic Kachar e Daniel Vorcaro, extraídas do celular apreendido pela PF,
  foram confirmadas pela Gazeta do Povo e registram reclamações de Vorcaro contra reportagens, a avaliação de
  matérias do Grupo Globo e a promessa de Kachar de conversar com uma colunista; afirma que não há confirmação
  de que essa conversa tenha ocorrido ou de que a cobertura tenha sido modificada. Informa que a reportagem
  procurou o ex-diretor e não obteve retorno até a publicação.
notes: Cache do script lote:fonte (17/10/2026). A Gazeta não diz como confirmou as conversas. Trechos sobre temas pessoais e terceiros não são registrados.
