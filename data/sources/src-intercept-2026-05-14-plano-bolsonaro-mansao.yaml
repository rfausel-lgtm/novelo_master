summary: Mensagens obtidas pelo Intercept indicam que, em 27/03/2025, Thiago Miranda (sócio-fundador do
  Portal Leo Dias) sugeriu a Vorcaro receber Jair Bolsonaro em sua mansão em Brasília para assistirem
  a um documentário, um dia após o ex-presidente virar réu; Vorcaro autorizou a organização. Frias pediu
  a Miranda a ponte com o banqueiro. Os diálogos não permitem confirmar se o encontro ocorreu.
