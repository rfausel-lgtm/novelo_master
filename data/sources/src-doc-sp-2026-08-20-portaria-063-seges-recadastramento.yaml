summary: 'Documento 163083088. Registra que ''o recadastramento bienal previsto para o exercício de 2025
  não foi realizado'' e mantém, em caráter excepcional, o credenciamento das consignatárias ativas na
  data da publicação. O dado explica a longevidade do vínculo na capital: o aditamento ao termo de adesão
  de 2022, assinado em 26/10/2023, tinha vigência ''até que ocorra o recadastramento bienal do exercício
  de 2025'' — recadastramento que nunca veio. A operadora, descredenciada seis dias antes desta portaria,
  ficou de fora da prorrogação excepcional.'
