summary: Reproduz mensagens de WhatsApp entre Fabiano Zettel e Daniel Vorcaro sobre pagamentos a 'Belline'
  (Bellini Santana), com o pagamento operacionalizado por Zettel e por Ana Cláudia Queiroz de Paiva, através
  de contrato fictício de consultoria com a empresa Varajo Consultoria Empresarial. Descreve os favores
  atribuídos a Paulo Sérgio Neves de Souza (revisão de documentos do Master antes do envio ao BC, alertas
  sobre achados do sistema de monitoramento, orientação sobre postura em reuniões) e a Bellini Santana
  (encontros fora das dependências do BC, pedido de contato por telefone para evitar registro escrito).
  Com base na decisão do ministro André Mendonça e em apuração da Polícia Federal.
