source_type: press
summary: Registra ação civil movida pela EFB Regimes Especiais, por volta de 03/03/2026, nos Estados Unidos,
  contra Henrique Vorcaro e Natália Vorcaro Zettel, por enriquecimento ilícito e dissipação de mais de
  US$ 1 bilhão em ativos do Banco Master, incluindo repasses de cerca de R$ 1,5 bilhão à Super Empreendimentos
  e Participações e R$ 400 milhões à Moriah Asset Management.
