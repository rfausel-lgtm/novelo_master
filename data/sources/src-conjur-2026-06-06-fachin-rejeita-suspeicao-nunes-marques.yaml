summary: Em 06/06/2026 Edson Fachin rejeitou, por intempestividade (prazo de 5 dias do RISTF), a arguição
  de suspeição de Nunes Marques apresentada por Alessandro Vieira, Eduardo Girão, Marcos Pontes e Plínio
  Valério no MS 40.823, que busca obrigar Davi Alcolumbre a instalar a CPI do Master; os senadores alegavam
  proximidade do relator com Ciro Nogueira.
