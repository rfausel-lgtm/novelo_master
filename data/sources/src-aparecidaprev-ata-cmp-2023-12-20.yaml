summary: Ata da sessão que credenciou o Banco Master no regime próprio de Aparecida de Goiânia. Registra
  a presença, por videoconferência, da representante do banco Paula Vouguinha — a mesma que três meses
  depois apresentaria a instituição ao comitê da Amapá Previdência — e do consultor Reiter Ferreira, da
  Sete Capital. O credenciamento foi aprovado por oito votos a três. PDF sem camada de texto, submetido
  a reconhecimento óptico pela equipe a 300 dpi; os trechos citados foram conferidos visualmente. Erros
  residuais de OCR são possíveis em nomes próprios.
