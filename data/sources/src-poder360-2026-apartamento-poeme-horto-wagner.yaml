summary: 'Descreve o eixo patrimonial da apuração: o apartamento nº 1.702 do edifício Poème Horto, em
  Salvador, com cerca de 203 m² e quatro suítes, avaliado em aproximadamente R$ 2,45 milhões. Segundo
  a PF, a negociação prosseguiu mesmo após a prisão de Vorcaro, em novembro de 2025.'
