summary: 'Comunicado ao mercado: início do pagamento das garantias em 17/01/2026; cerca de 800 mil credores;
  valor total a pagar de R$ 40,6 bilhões; liquidez do FGC de R$ 125 bilhões. Nota de rodapé cita os Atos
  do Presidente do Banco Central nº 1.369, 1.371, 1.372 e 1.373, publicados em 18/11/2025, que liquidaram
  o Banco Master, o Banco Master de Investimento, o Banco Letsbank e a Master Corretora de Câmbio.'
