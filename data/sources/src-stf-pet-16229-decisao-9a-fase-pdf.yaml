summary: Decisão de 31 páginas que autorizou a 9ª fase, lida na íntegra pela equipe. Registra transferência
  de R$ 3.500.000,00 à BN FINANCEIRA LTDA. pela PKL ONE PARTICIPAÇÕES S.A. em 17/10/2025. No dispositivo,
  item 99.6, determina a suspensão das atividades econômicas e financeiras da BN Financeira Ltda., da
  BN Representações Tecnológicas Ltda. e da Epítome S.A. No item 99.3, impõe a Bonnie Toaldo Bonilha proibição
  de contato com os demais investigados — ressalvados o senador e o marido, por vínculo familiar —, suspensão
  de passaporte e impedimento de saída do país. Registra ainda que a suspensão de passaporte do senador
  não foi requerida.
