summary: 'Reportagem citada na decisão do Min. Dino (ADPF 1.196, lote 313) sobre o histórico do fundo CARE11
  (Graveyard Death and Care), gerido pela Zion Invest e administrado pela Planner Trustee (= Trustee DTVM,
  controlada por Maurício Quadrado), e sobre o investimento de Daniel Vorcaro no setor funerário desde
  2016, antes mesmo da compra do Banco Máxima.'
notes: 'Fonte primária de imprensa por trás de um dos trechos citados na decisão de Dino; conferida por
  esta sessão via WebSearch como parte da reconciliação de que CARE11 = "Brazilian Graveyard and Death
  Care Services FII" (mesmo fundo, dois nomes usados por fontes diferentes). CORREÇÃO (lote 320): a
  informação de que o fundo era administrado pela Planner Trustee não se sustenta — comunicado do fundo
  resumido pela BTG Pactual aponta a Master S.A. CCTVM como administradora até 04/02/2026 e a Mérito DTVM
  depois. O resumo acima registra o que a revista publicou, não um fato confirmado.'
