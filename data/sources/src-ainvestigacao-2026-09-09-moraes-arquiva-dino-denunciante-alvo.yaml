summary: Reportagem assinada por David Ágape que revela o teor do despacho de 21/08/2026 na Pet 11.228,
  obtido com exclusividade — o processo corre em segredo de justiça e a decisão não é pública. Segundo
  a matéria, Moraes arquivou a notícia-crime por 'patente ausência de justa causa' e, no mesmo despacho,
  determinou que a PF ouvisse o denunciante em até 15 dias por possível comunicação falsa de crime (art.
  340 do Código Penal), com posterior retorno dos autos à PGR. A reportagem apresenta críticas técnicas
  próprias à decisão e a enquadra como resposta à publicação da série Vaza Toga 5, três dias antes.
