title: TJ rejeita pedido de liminar para a instalação da CPI do Banco Master na Alerj
publisher: Notícia do Rio
publication_date: '2026-05-26'
url: https://www.noticiadorio.com/post/tj-rejeita-pedido-de-liminar-para-a-instala%C3%A7%C3%A3o-da-cpi-do-banco-master-na-alerj
source_type: press
summary: 'O desembargador Cherubin Helcias Schwartz Junior negou a liminar pedida pelo deputado Flávio
  Serafini (PSOL) para obrigar a Alerj a instalar a CPI do Banco Master/Rioprevidência — reconheceu que o
  pedido cumpria os requisitos legais, mas optou por ouvir a Alerj antes de decidir o mérito, e pediu
  informação sobre quantas CPIs estavam em funcionamento (o regimento interno da Alerj limita a sete
  simultâneas). No mesmo dia, a Alerj anunciou a criação de quatro novas CPIs, com resoluções assinadas
  pelo presidente Douglas Ruas (PL) e publicadas no Diário Oficial do Legislativo, colegiados de sete
  integrantes e prazo inicial de 90 dias — não fica claro no texto se a CPI do Rioprevidência/Master está
  entre as quatro.'
