source_type: press
summary: 'A partir do material cujo sigilo foi levantado em 01/09/2026: em 13/05/2025 Daniel Vorcaro envia
  ao ''advogado Leonardo Palhares, do Master'' minuta de contrato entre a Viking Participações e o escritório
  Barci de Moraes; em 16/05/2025 Palhares responde com ''duas minutas para vc escolher o deal'' e alerta
  para o ''risco reputacional'' de manter ativos ainda em nome de Vorcaro sendo usados por terceiros,
  sugerindo transferência imediata. Vorcaro responde: ''os ativos são deles… já''. Em 19/05/2025 é assinado
  contrato de até R$ 50 milhões, com R$ 40 milhões pagos em participações societárias em duas empresas
  proprietárias de aeronaves.'
