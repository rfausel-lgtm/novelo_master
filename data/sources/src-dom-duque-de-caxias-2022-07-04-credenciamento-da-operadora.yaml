summary: Edição que publica o credenciamento da operadora pela Secretaria Municipal de Administração para o serviço
  de cartão de benefícios aos servidores do município, no processo nº 003/001291/2021, com a empresa representada
  por procuração por Marcos Oliveira Calmon de Bittencourt — o mesmo representante que assina por ela em municípios
  da Bahia, de Pernambuco e do Mato Grosso do Sul e que subscreve, em Campo Grande, aditivo do próprio banco.
