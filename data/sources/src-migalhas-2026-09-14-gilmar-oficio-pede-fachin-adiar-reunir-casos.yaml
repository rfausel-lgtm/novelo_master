source_type: press
summary: 'Na véspera da sessão extraordinária de 15/09/2026, o ministro Gilmar Mendes enviou ofício formal
  ao presidente do STF, Edson Fachin, pedindo o adiamento do julgamento e propondo quatro alternativas: (1)
  reunir os processos de Moraes (Pet 16.662) e de Mendonça (sob vista do próprio Gilmar desde 08/09); (2)
  Fachin assumir hoje mesmo a relatoria do processo de Mendonça; (3) organizar e delimitar previamente a
  matéria a ser julgada; (4) se a sessão de terça for mantida, o próprio Gilmar apresentaria o caso ao
  plenário, com as preliminares — inclusive o pedido da PGR de nulidade do relatório da PF — analisadas
  antes do mérito. Formaliza, em ofício, o que já havia sugerido publicamente em 11/09/2026 (ver
  src-timesbrasil-2026-09-11-gilmar-sugere-adiar-julgamento-15-09).'
