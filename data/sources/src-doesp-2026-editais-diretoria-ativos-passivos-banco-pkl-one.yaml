summary: Quatro editais de 2026 da Diretoria de Ativos e Passivos da Secretaria da Fazenda e Planejamento
  — nº 11/2026 de 02/04, nº 42/2026 de 14/05, nº 52/2026 de 07/07 e nº 64/2026 de 27/08 — arrolam a empresa
  entre bancos, sob a denominação 'BANCO PKL ONE PARTICIPAÇÕES S/A.'. Repete-se em São Paulo, e em série,
  o mesmo equívoco registrado no diário oficial de Mato Grosso do Sul em 2023.
