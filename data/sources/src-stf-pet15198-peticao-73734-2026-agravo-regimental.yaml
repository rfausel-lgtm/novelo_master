summary: 'Agravo regimental (petição nº 73734/2026, assinada em São Paulo em 02/06/2026, juntada aos autos
  em 03/06/2026) contra decisão monocrática de 19/05/2026 do Ministro André Mendonça, que indeferiu o pedido
  de revogação das cautelares assecuratórias e a restituição de bens e valores constritos de Maurício
  Quadrado, Luís Fernando de Almeida e Flávio Daniel Aguetoni na Pet 15.198/DF. A hipótese investigativa,
  quanto a esses três, restringe-se a operações envolvendo a Bello Pactum Participações S.A. e o FIDC
  Alvarinho, com prejuízo patrimonial estimado pela investigação em ~R$ 24 milhões. Os agravantes alegam que
  os R$ 18.268.809,43 captados via notas comerciais subscritas pelo FIDC Alvarinho foram integralmente
  destinados ao pagamento de 32 acordos trabalhistas homologados do passivo do BANIF — Banco Internacional
  do Funchal (Brasil) S.A. — sem qualquer desvio ou reversão em seu favor, com documentação já juntada em
  petições anteriores (33324/2026 e 36726/2026). Pedem o provimento do agravo para reformar a decisão e
  liberar integralmente os valores bloqueados e os bens/documentos apreendidos; subsidiariamente, a submissão
  do recurso ao órgão colegiado. A decisão gerou três mandados de intimação distintos (MI 3068, 3069 e
  3070/2026), um para cada agravante, expedidos em 21/05/2026.'
notes: Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, equipe delegada). Até a data desta
  coleta, não havia manifestação da PGR (vista aberta em 03/06/2026) nem decisão sobre o agravo nos
  andamentos consultados. As petições 33324/2026 e 36726/2026, citadas como origem da documentação de
  defesa, não foram lidas.
