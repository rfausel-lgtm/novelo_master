summary: 'Descreve disputa interna aberta no União Brasil: Davi Alcolumbre busca estreitar laços com o
  governo Lula, enquanto Antônio Rueda, ao lado de ACM Neto, defende "uma postura mais distante e crítica
  à gestão petista". Pontos de atrito incluem a indicação de Pedro Lucas Fernandes ao Ministério das
  Comunicações (sugerida por Alcolumbre, resistida por Rueda e ACM Neto) e a pauta de anistia aos réus de
  8 de Janeiro (defendida por Rueda, considerada não prioritária por Alcolumbre). Não menciona o caso
  Banco Master.'
