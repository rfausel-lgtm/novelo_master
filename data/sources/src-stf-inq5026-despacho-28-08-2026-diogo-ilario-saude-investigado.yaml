summary: Determina que a Secretaria intime a autoridade policial a tomar ciência de informações prestadas
  por Diogo Ilário de Araújo Oliveira e de documentos sobre "o estado de saúde do investigado" (e-Doc.
  1021-1024) — a peça mais recente do lote lido, sem identificar quem é "o investigado" nem o papel de
  Diogo Ilário (a capa do processo lista todas as partes como "sob sigilo").
