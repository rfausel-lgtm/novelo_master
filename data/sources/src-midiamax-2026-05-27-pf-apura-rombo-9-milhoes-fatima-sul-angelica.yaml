source_type: press
summary: Cobertura da deflagração das operações Zehirut e Charitzut pela Polícia Federal, em 27/05/2026, contra
  o rombo de R$ 9 milhões que o Master deixou nos institutos de previdência de Fátima do Sul (R$ 7 milhões) e Angélica
  (R$ 2 milhões). Foram cumpridos dez mandados de busca e apreensão — sete em Angélica, um em Fátima do Sul e dois
  em São Paulo — além de medidas cautelares de afastamento de funções públicas. A PF apurou indícios de irregularidades
  em investimentos de 2024. Angélica reafirma ter resgatado o dinheiro antes da liquidação; Fátima do Sul ainda
  estuda medidas.
notes: Outras coberturas do mesmo dia (Metrópoles, O Progresso) descrevem quinze mandados no total, com seis em
  Fátima do Sul, número distinto dos dez descritos nesta reportagem, mais detalhada na discriminação por cidade.
  A divergência entre dez e quinze mandados não foi reconciliada.
