summary: Em 24/08/2026 o ministro Flávio Dino autorizou o compartilhamento, com a Polícia Federal, dos
  dados apreendidos na operação da Polícia Civil de São Paulo contra Karina Ferreira da Gama. A PF pediu
  o acesso para ampliar as investigações sobre suspeitas de desvio de recursos públicos, sobretudo emendas
  parlamentares. O roteiro de 'Dark Horse' é assinado pelo deputado Mário Frias, que em 2024 destinou
  R$ 2 milhões em emendas para a ONG ligada ao filme; em maio a defesa negou triangulação, classificando
  a alegação como 'puramente especulativa'.
