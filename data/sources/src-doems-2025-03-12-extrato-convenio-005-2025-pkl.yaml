summary: Publicação na edição nº 11.769, páginas 24 e 25, lida pela equipe. A convenente aparece agora
  como 'PKL ONE PARTICIPAÇÕES S.A.', sem o prefixo 'Banco', e o objeto passa a mencionar expressamente
  'amortização de despesas na forma de compras e de saques parcelados, concedidos por meio de Cartão Consignado
  de Benefícios'. Mantém o mesmo parecer referencial genérico de 2020 como fundamento — o mesmo invocado,
  na mesma página do diário, para credenciar duas entidades sindicais. Processo NUP 77.000.586-2025; vigência
  de 11/03/2025 a 10/03/2027; assinaturas de Frederico Felini, Ana Paula de Almeida Pithon e Andrea Lima
  Novaes.
