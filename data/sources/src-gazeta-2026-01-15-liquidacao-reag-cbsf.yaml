summary: Em 15/01/2026 o BC decretou a liquidação extrajudicial da CBSF DTVM, nova denominação da Reag
  Investimentos, por 'graves violações às normas que regem as atividades das instituições integrantes
  do SFN'. A CBSF detém menos de 0,001% dos ativos em corretoras. A Gazeta procurou a empresa e aguardava
  retorno.
