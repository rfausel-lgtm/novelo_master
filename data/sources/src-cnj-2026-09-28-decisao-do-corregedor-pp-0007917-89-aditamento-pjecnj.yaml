summary: >-
  Decisão integral (5 páginas, mais capa do PJe) que defere pedido de aditamento da União e estende a cautelar
  de Id 6777898 aos Cumprimentos de Sentença 0017910-79.2008.4.01.3400 (Companhia Agroindustrial Santa
  Helena), 0017882-14.2008.4.01.3400 (Agrovale Companhia Agroindustrial Vale do Curu S/A) e
  0017886-51.2008.4.01.3400 (Borborema Agro Industrial Ltda.): cancelamento em cinco dias de 14 requisições
  (R$ 1.877.143.674,66 nas datas-base, valores depositados em 26/12/2023), restituição com rendimentos,
  vedação de levantamentos e de novas requisições sem trânsito em julgado e informações em cinco dias. Registra
  que a Santa Helena se manifestou contra o pedido (Id 6779871), alegando preclusão, e rejeita a alegação;
  afirma que a decisão "não examina a existência ou a extensão do crédito". Não menciona o Banco Master nem
  Daniel Vorcaro.
notes: >-
  O "fato novo" apontado pela União é uma decisão de 23/09/2026 da Presidência do TRF-1 na SLS
  1010050-92.2026.4.01.0000 (reconsideração de liminar quanto à Santa Helena), e não a cautelar do corregedor,
  que esta decisão cita como "decisão de Id 6777898".
