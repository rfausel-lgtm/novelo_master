summary: O BRB moveu ação civil contra Daniel Vorcaro, Daniel Leite, o Banco Master e outras pessoas/empresas
  por suposta tentativa coordenada e oculta de assumir o controle acionário do banco, tramitando na 7ª
  Vara da Fazenda Pública do DF (juiz Paulo Afonso Cavichioli Carmona). Acordo entre BRB e Daniel Leite
  foi assinado em 15/04/2026 e homologado em 31/07/2026, com Daniel Leite saindo do processo, sob cláusula
  de confidencialidade, e determinação de ofício à B3 para transferência da titularidade das ações ao
  BRB.
