source_type: press
summary: 'Sindicância interna do Banco Central, concluída em 04/03/2026 e encaminhada à CGU em 10/03/2026,
  apurou dois contratos entre Belline Santana e a Varajo Consultoria somando cerca de R$ 4 milhões: o
  primeiro, de R$ 2 milhões, por um estudo de 50 páginas sobre educação financeira descrito pela comissão
  como ''um resumo de oito artigos acadêmicos e entrevistas de terceiros''; o segundo, referente ao projeto
  ''Jovens Potentes''. A comissão classificou o arranjo como ''negócio simulado'' e registrou que o material
  poderia ser produzido ''com o uso de inteligência artificial, ou mesmo solicitado a terceiros, a baixíssimo
  custo'', apontando ainda a incompatibilidade entre os valores e o capital social de R$ 10 mil e o endereço
  de coworking da Varajo.'
