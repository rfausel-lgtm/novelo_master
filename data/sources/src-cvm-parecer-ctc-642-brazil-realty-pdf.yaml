summary: 'Parecer lido pela equipe. Descreve o mecanismo apurado: laudo de avaliação sem assinatura e
  sem identificação do avaliador; sobreavaliação de R$ 56 milhões; avaliadora que não reconheceu a autoria
  do laudo; matrícula do imóvel apontando outro proprietário; pagamento de R$ 5 mil pelo serviço em espécie;
  e recibo que ''aparenta ser uma imagem com a assinatura do contratado colada''. Registra que a Entre
  Investimentos e a administradora operaram como ''espécie de câmara de liquidação'', em 177 operações,
  e apura retorno irregular da Milo Investimentos de R$ 84.975.236,17 e lucro do Banco Máxima de R$ 10,8
  milhões. Entre os investidores finais que absorveram o prejuízo havia regimes próprios de previdência
  social.'
