summary: Notícia de 29/08/2026, assinada pela Redação, sobre a decisão de Mendonça que cancelou os bloqueios
  sobre 23 imóveis dados em garantia de seis CCBs cedidas pelo Master ao BRB. É a única fonte do lote que
  informa a cessão em junho de 2025 (segundo informações do banco no processo), o parecer contrário do
  Ministério Público Federal/PGR, a ressalva de novo bloqueio e a comunicação ao cartório das matrículas em
  São Paulo. Não informa número do processo nem declara acesso ao texto da decisão.
