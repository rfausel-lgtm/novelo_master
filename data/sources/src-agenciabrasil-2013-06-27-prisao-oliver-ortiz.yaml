source_type: press
summary: Registra a prisão de Oliver Ortiz de Zarate Martin em cobertura na Barra da Tijuca (RJ), em 27/06/2013,
  com apreensão de R$ 175 mil, US$ 150 mil e € 110 mil, sete imóveis e cerca de R$ 20 milhões em bens.
  Segundo o delegado Paulo Telles, da DRE/PF, seria chefe de quadrilha espanhola ligada a cartéis colombianos,
  atuando em tráfico marítimo.
