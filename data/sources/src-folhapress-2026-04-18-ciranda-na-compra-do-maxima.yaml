summary: Reportagem sobre os votos do Banco Central obtidos via Lei de Acesso à Informação. Registra que,
  em 15 de setembro de 2017, Vorcaro compraria de Sabbá ações representativas de 56,87% do capital do
  banco por R$ 40 milhões, e que a forma de pagamento foi posteriormente alterada para R$ 36 milhões em
  cotas do fundo Brazil Realty e R$ 4 milhões em espécie.
