summary: 'Página pública da PET 15.674, classe criminal, com requerente "Delegado de Polícia Federal" e requerido Ciro
  Nogueira Lima Filho. Protocolada e autuada em 12/03/2026 e distribuída por prevenção a André Mendonça, com o INQ
  5.026 como processo que justifica. Registra dezenas de petições sigilosas entre março e agosto de 2026, vistas à PGR, e
  despacho de Mendonça de 20/08/2026 que, a pedido da autoridade policial, prorroga por 60 dias o prazo para
  diligências complementares "imprescindíveis para a ultimação das investigações". Última movimentação visível em
  03/09/2026.'
notes: Consulta direta ao portal público, sem autenticação. O conteúdo das peças segue sigiloso.
