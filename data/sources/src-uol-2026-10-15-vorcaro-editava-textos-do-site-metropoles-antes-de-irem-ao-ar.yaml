source_type: press
language: pt-BR
summary: Segundo levantamento do UOL em mensagens extraídas pela PF do celular de Daniel Vorcaro, ao menos 14
  textos do Metrópoles foram enviados previamente ao banqueiro, 11 foram alterados após pedidos dele e duas
  reportagens foram publicadas a pedido dele, entre 2024 e 17/11/2025. Diz que a interlocução com a CEO do
  grupo, Lilian Tahan, começou em maio de 2024, num café organizado pelo então consultor Guilherme Barros, e
  que, segundo as mensagens, o Master pagou R$ 1 milhão ao site um mês depois, acertou R$ 900 mil em julho
  para projetos de duas empresas do grupo e fechou contrato de publicidade de R$ 20 milhões, quitado em 2025.
  Traz as respostas de Lilian Tahan.
notes: "Lida pelo script lote:fonte em 17/10/2026 (texto integral). ND Mais, TVT News, DM, Jornal do
  Commercio, MSN, Blog do BG e Midiamax republicaram ou resumiram a reportagem no mesmo dia: não são fontes
  independentes. A reportagem trata ainda de pedidos sobre a cobertura de um pré-candidato e de um diretor do
  Banco Central, que este lote não registra."
