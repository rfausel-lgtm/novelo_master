source_type: press
summary: 'Detalha a lista de presentes no 1º Fórum Jurídico Brasil de Ideias (Londres, abril de 2024),
  patrocinado pelo Banco Master: os ministros do STF Dias Toffoli, Alexandre de Moraes e Gilmar Mendes, o
  ex-ministro Ricardo Lewandowski, o diretor-geral da PF Andrei Rodrigues, o procurador-geral da República
  Paulo Gonet, o então advogado-geral da União Jorge Messias, e os políticos "Hugo Motta (Republicanos-PB)
  e Davi Alcolumbre (União Brasil-AP), hoje presidentes da Câmara dos Deputados e do Senado".'
