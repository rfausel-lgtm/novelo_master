summary: 'Reproduz trechos do relatório de inteligência da PF citado na decisão de Moraes de 03/09/2026,
  numa seção intitulada "Alcolumbre como ''alvo estratégico''": o documento o descreve como "provável alvo
  estratégico, considerada sua força política, o favoritismo para manter-se na presidência do Senado Federal
  e o consequente controle da pauta daquela Casa, notadamente quanto ao processamento de pedidos de impeachment
  de ministros do Supremo Tribunal Federal"; levanta a hipótese de que Mendonça poderia ver no presidente
  do União Brasil, Antônio Rueda, uma "rota de acesso" a Alcolumbre; e relaciona a hipótese à "resistência
  de Alcolumbre à indicação de Mendonça ao STF durante o governo de Jair Bolsonaro", descrevendo-o como
  "grande empecilho" àquela indicação. O texto frisa que o documento trabalha com hipótese de inteligência,
  não com fato comprovado.'
