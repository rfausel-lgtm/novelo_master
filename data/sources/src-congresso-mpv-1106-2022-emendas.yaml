summary: Registro oficial da tramitação da MP 1.106/2022, convertida na Lei 14.431/2022. Recebeu 66 emendas;
  relator no Plenário foi Davi Alcolumbre, com parecer de 07/07/2022; a conversão em lei ocorreu em 03/08/2022,
  com sanção e veto parcial. A Emenda nº 30, de autoria do senador Jaques Wagner (PT-BA), foi apresentada
  em 22/03/2022 e propunha que as taxas de juros de todas as modalidades de consignado não excedessem
  300% da taxa média do CDI — dispositivo restritivo, que não foi incorporado ao texto final.
