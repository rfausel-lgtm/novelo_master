url: https://www.moneytimes.com.br/ministro-do-stj-que-foi-a-evento-pago-pelo-master-se-declara-impedido-em-casos-do-banco-gaep/
source_type: wire
language: pt-BR
summary: >-
  O ministro do STJ Benedito Gonçalves apresentou, pelo sistema eletrônico do tribunal, declaração de
  impedimento para julgar processos relacionados ao Banco Master; depois dessa comunicação, o STJ enviou aos
  processos do Master, "no último dia 31 de março", certidão com o impedimento; uma delas foi protocolada em
  recurso do Master ao STJ sobre a liberação de precatórios do setor sucroalcooleiro; procurado, o ministro não
  retornou aos contatos do Estadão.
notes: >-
  A data é do Estadão Conteúdo; o sistema do STJ não foi consultado diretamente. A matéria traz também
  referência a contato telefônico do ministro salvo no celular de Vorcaro, dado que o Novelo não reproduz.
