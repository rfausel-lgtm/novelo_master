summary: Decisão que defere interceptação telefônica e monitoramento em tempo real de WhatsApp, por 15
  dias a partir da efetiva implementação, contra dez pessoas apontadas como integrantes, colaboradoras ou
  financiadoras dos núcleos "A Turma" e "Os Meninos" — Henrique Moura Vorcaro, Erlene Nonato Lacerda,
  Helder Alves de Lima, David Henrique Alves, Victor Lima Sedlmaier, Rodrigo Pimenta Franco Avelar Campos,
  Katherine Venâncio Telles, Manoel Mendes Rodrigues, Anderson Wander da Silva Lima e Sebastião Monteiro
  Júnior — dois a três dias antes das prisões e cautelares patrimoniais da 6ª fase da Operação Compliance
  Zero (13-14/05/2026), já registrada no acervo.
