summary: 'Reportagem sobre processo administrativo sancionador da CVM, distinto da acusação penal sobre
  a Upcon: trata do aumento de capital da Gafisa em 2019 com bônus de subscrição escalonado por rodada,
  gerando tratamento desigual entre acionistas. Julgamento em 18/12/2024 terminou empatado 2x2 (Otto Lobo
  e João Accioly por absolver; João Pedro Nascimento e Daniel Maeda por condenar), prevalecendo a posição
  mais favorável ao acusado.'
