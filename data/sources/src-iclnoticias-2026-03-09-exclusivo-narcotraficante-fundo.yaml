summary: Reportagem que origina a alegação. O lead atribui a informação a 'fonte que atua no mercado financeiro
  e acompanhou as negociações'; a afirmação mais grave é citação direta dessa fonte anônima, não asserção
  do veículo. O ICL declara ter tido acesso a documentos, autos e registros da CVM, mas não publica nenhum
  deles, e ressalva que, 'por causa do sigilo bancário, a reportagem não pôde confirmar o valor investido
  citado pelo entrevistado'. A matéria publica a nota de contestação dos advogados de Botelho; o Banco
  Master foi procurado e não respondeu.
