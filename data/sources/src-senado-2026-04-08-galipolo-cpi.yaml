source_type: official_legislative
summary: Em depoimento à CPI do Crime Organizado em 08/04/2026, Gabriel Galípolo confirmou ter participado
  da reunião de dezembro de 2024 no Planalto com Lula, Vorcaro e ministros; disse que sua atuação se limitou
  a encaminhar o caso ao diretor responsável do BC para análise técnica, que recebeu de Lula a orientação
  'seja técnico, não proteja ninguém, não persiga ninguém', que não tratou do Master com ministros do
  STF e que não havia amparo técnico para suspender o banco antes do fim de 2025.
