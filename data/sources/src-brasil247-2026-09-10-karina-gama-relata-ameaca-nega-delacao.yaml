summary: 'Traz a versão de Karina Ferreira da Gama sobre a pressão relatada no mesmo dia da Operação Make Up: diz
  ter sido procurada por pessoas que se identificaram como oficiais de justiça, sem exibir documentação, que tocaram
  a campainha de sua casa por volta das 21h e a questionaram, além de fornecedores e familiares ligados a suas empresas.
  Relata também contato de um pastor evangélico de Brasília, apontado como próximo a políticos de esquerda, que
  teria oferecido ajuda e sugerido que ela fizesse um acordo de delação premiada para evitar pena mais dura. Gama
  nega ter o que delatar sobre o financiamento do filme: diz nunca ter arrecadado dinheiro nem tratado com financiadores,
  afirma ter apenas prestado serviços de produção mediante remuneração, e que recebeu recursos do fundo Havengate
  sem nunca saber quem o financiava.'
