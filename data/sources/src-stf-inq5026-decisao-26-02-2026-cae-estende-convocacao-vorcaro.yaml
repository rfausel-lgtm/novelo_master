summary: Decisão que estende para 10/03/2026 a autorização, antes deferida para 24/02/2026 (decisão de
  19/02/2026, e-Doc. 323, ainda não lida pela equipe), para que a Comissão de Assuntos Econômicos do
  Senado Federal, sob a presidência de Renan Calheiros, colha depoimento de Daniel Vorcaro — frente
  institucional distinta da CPI do Crime Organizado.
notes: 'Peça pública do portal do STF (Resolução 427/2010), obtida em sessão anterior via
