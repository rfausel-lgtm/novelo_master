source_type: official_regulator
summary: Julgamento do PAS CVM SEI 19957.002315/2021-53, em 05/07/2022, sobre a administração fiduciária
  do FII São Domingos. Condenou a Índigo Investimentos DTVM (antiga Foco DTVM), Benjamim Botelho de Almeida
  e Sérgio Paulino Ferreira, em multas que somam R$ 2,1 milhões — sendo R$ 450 mil aplicados nominalmente
  a Botelho. Ele foi absolvido da acusação relativa à cobrança de taxa de administração, e reconheceu-se
  sua ilegitimidade passiva quanto à operação de permuta, ocorrida após sua renúncia.
