summary: 'Petição de 09/03/2026, apresentada diretamente pela defesa de Henrique Moura Vorcaro (advogados Eugênio
  Pacelli de Oliveira e Frederico Gomes de Almeida Horta), reiterando pedido de 04/03/2026 ainda pendente de apreciação:
  nega que a conta dele na Reag tenha qualquer saldo ou tenha sido usada para repasse de valores, classificando
  a cobertura de imprensa como ''linchamento'' baseado em informação ''gravemente equivocada, senão falsa em si
  mesma''. Anexa reportagem da Folha de 07/03/2026 como exemplo da imprensa que contesta.'
notes: É a manifestação pessoal e direta da defesa de Henrique Vorcaro que um open_question do verbete dele registrava
  como não localizada — até então só havia a menção feita na petição do filho (e-Doc 86, lote 175).
