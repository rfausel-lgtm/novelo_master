summary: 'Reportagem detalhando os fatos narrados na denúncia do MPF: Tanure e Gilberto Benevides, controlador
  da Upcon, teriam coordenado aporte superior a R$ 100 milhões no capital social da Upcon dias antes do
  laudo de avaliação que definiria a quantidade de ações da Gafisa entregues em pagamento pela aquisição,
  elevando o capital de R$ 10 milhões para R$ 160,8 milhões. O MPF alega uso de offshores em paraísos
  fiscais e do fundo Singular Plus para ocultar a real participação de Tanure, com Benevides tomando empréstimo
  formal da corretora Planner enquanto o lastro real teria vindo de recursos do próprio Tanure.'
