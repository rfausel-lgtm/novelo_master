summary: 'Registra a declaração do presidente do Senado, Davi Alcolumbre, em 01/09/2026: ''A decisão é que tem 109
  pedidos. Isso não é normal. [São] 109 pedidos de impeachment dos 10 ministros do STF'' — sem responder diretamente
  se daria andamento ao pedido contra Alexandre de Moraes. Explica que, pela Lei do Impeachment (1950), cabe à Mesa
  do Senado — não ao presidente isoladamente — receber a denúncia, que segue para a Advocacia do Senado, depois
  para a Comissão Diretora, antes de eventual deliberação em plenário.'
