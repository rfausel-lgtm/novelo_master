title: Mensagens mostram como Rueda e ACM levaram o Master a fundos de previdência
publisher: UOL (coluna de Fabio Serapião)
author: Fabio Serapião, Natália Portinari e Cézar Feitoza
publication_date: '2026-10-16'
url: https://noticias.uol.com.br/colunas/fabio-serapiao/2026/10/16/mensagens-mostram-rueda-e-acm-neto-atuando-em-previdencias-para-o-master.htm
source_type: press
language: pt-BR
summary: >-
  Segundo a reportagem, mensagens "extraídas pela PF" do celular de Daniel Vorcaro, citadas de novembro de
  2023 a julho de 2025, registram contatos de Antônio Rueda, presidente do União Brasil, e de ACM Neto,
  vice-presidente do partido, com Vorcaro e com o diretor comercial do Master, Fernando Mascarenhas, em torno
  da captação de recursos de institutos de previdência de servidores. Descreve: a aprovação de R$ 200 milhões
  no Amapá em 12/07/2024 e, no mesmo dia, um pedido de Rueda a Vorcaro, às 11h45, para que apagasse mensagens;
  uma lista de captações em andamento; a comissão da "consultoria do Ricardo/Raphael", atribuída a Ricardo
  Siqueira Rodrigues, e o registro de R$ 11 milhões como "comissão Amapá" em 01/08/2024; jatos e hotel em São
  Paulo oferecidos a Rueda; a contratação do escritório Rueda & Rueda Advogados em quatro ações (R$ 15,4
  milhões); e encontros de ACM Neto e Rueda com Vorcaro em 2024. Ressalva que as mensagens "não mostram
  pagamento de comissão diretamente aos dois dirigentes do União Brasil". Diz que, com base no material, a PF
  pediu buscas em endereços ligados aos dois e que a operação não chegou a ser autorizada pelo STF. Traz as
  notas de Rueda e de ACM Neto.
