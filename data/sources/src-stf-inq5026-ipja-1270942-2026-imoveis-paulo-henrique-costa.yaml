summary: 'Informação de Polícia Judiciária de Análise de 107 páginas, complementar à IPJ-A nº 1252786/2026, sobre o
  celular de Daniel Vorcaro e diligências em juntas comerciais, cartórios e na CVM. Conclui que Paulo Henrique Costa,
  então presidente do BRB, teria aceitado cerca de R$ 150 milhões em imóveis — seis unidades somando R$ 146,6 milhões
  em São Paulo e Brasília — para agir em favor do Master, e descreve a estrutura usada para ocultar a propriedade:
  seis sociedades anônimas de prateleira (Allora, Lenore, Stanza, Domani, Chesapeake e Milano), com capital aumentado
  entre janeiro e março de 2025 no valor de cada imóvel e controladas pelo FIP Alucard, depois renomeado Abbiamo,
  gerido pela REAG Portfolio Solutions.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente), juntada ao INQ 5.026 em 12/05/2026. Endereços, matrículas e unidades dos
  imóveis, CPFs e nomes de particulares que figuram só como sócios formais ou representantes das empresas não são
  reproduzidos. Hipóteses investigativas da PF.'
