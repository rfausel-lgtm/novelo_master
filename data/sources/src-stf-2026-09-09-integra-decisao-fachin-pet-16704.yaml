summary: 'PDF oficial lido pela equipe. Contém o dispositivo em quatro itens: suspensão da decisão de
  Mendonça de 08/09 na Pet 16.662; sobrestamento do trâmite daquela petição; suspensão da decisão de Dino
  na Pet 16.669; e — item habitualmente omitido na cobertura — ''a suspensão de todo e qualquer procedimento
  que verse sobre potencial investigação em face de integrantes deste Supremo Tribunal Federal, os quais
  devem ser preliminarmente remetidos a esta Presidência''. Suspende também o procedimento de controle
  externo da atividade policial instaurado pela Procuradoria-Geral da República pelo Ofício nº 696/2026.
  Traz a convocação: ''No tocante à Pet 16662, de relatoria do Ministro André Mendonça, considerando que
  o Relator já indicou o feito à pauta, convoco Sessão Plenária Extraordinária para o dia 15 de setembro
  de 2026, às 10 horas''. Fundamenta-se no art. 13, I e III do regimento interno, nos arts. 76, III, 79
  e 82 do Código de Processo Penal, no art. 4º da Lei 8.437/92 e no art. 297 do regimento.'
