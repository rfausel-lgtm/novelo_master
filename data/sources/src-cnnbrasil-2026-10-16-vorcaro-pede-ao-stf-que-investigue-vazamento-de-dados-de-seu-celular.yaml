summary: Relata que a defesa de Daniel Vorcaro pediu, em 16/10/2026, ao presidente do STF, Edson Fachin, a
  abertura de investigação sobre o vazamento de áudios, mensagens e outros conteúdos extraídos do celular
  apreendido na Operação Compliance Zero; descreve os argumentos da petição (acesso restrito das autoridades,
  conversas com advogados, material que não deveria embasar novas investigações contra ele) e o pedido de
  investigação criminal que identifique agentes públicos com acesso funcional ao aparelho e terceiros que
  possam ter recebido as informações. Não traz número de processo, despacho nem posição do STF.
notes: Aberta com lote:fonte em 19/10/2026 (publicada em 16/10 às 20:05, atualizada em 17/10); texto da
  petição parafraseado pela reportagem, sem aspas literais usadas pelo Novelo. A página trata também de
  outros assuntos, que o Novelo não registra.
