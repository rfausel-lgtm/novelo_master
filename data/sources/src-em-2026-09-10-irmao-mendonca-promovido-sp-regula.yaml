source_type: press
summary: 'Alexandre de Almeida Mendonça entrou na SP Regula como gerente em fevereiro de 2024, tornou-se
  superintendente em julho de 2024 e, em julho de 2026 (não maio, como constava), tornou-se
  secretário-executivo. A Prefeitura de São Paulo, em nota, chamou de "irresponsável e sem fundamento"
  insinuar relação entre a atuação de André Mendonça no STF e a contratação do irmão, afirmando que ele
  foi contratado "após um processo de seleção em 2024 que avaliou currículos, histórico de experiências e
  contou também com entrevistas" e que sempre exerceu "funções de gestão administrativa, sem qualquer
  responsabilidade direta pela gestão dos contratos de concessão".'
