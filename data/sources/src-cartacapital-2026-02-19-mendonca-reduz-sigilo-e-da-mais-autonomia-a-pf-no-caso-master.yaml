summary: Relata que Mendonça decidiu em 19/02/2026 reduzir o grau de sigilo do caso e autorizar a perícia da
  PF em cerca de 100 aparelhos sem restrições, que antes só quatro peritos escolhidos por Toffoli poderiam
  acessar; afirma que o sigilo passou de grau 4 para 3 e que a abertura de novas investigações depende de
  autorização prévia do relator. O texto da decisão
  (doc-2026-02-24-decisao-pet15198-planejamento-pericial-100-dispositivos) fala em manutenção do
  nível III e não menciona o grau 4.
