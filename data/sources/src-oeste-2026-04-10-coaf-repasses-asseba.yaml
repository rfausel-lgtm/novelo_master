summary: Registra relatório do Coaf enviado à CPI do Crime Organizado, revelado pelo Estadão em 10/04/2026,
  segundo o qual o Estado da Bahia repassou R$ 140,1 milhões à ASSEBA, associação ligada a Augusto Lima,
  entre maio de 2024 e novembro de 2025 — R$ 65 milhões diretos da Secretaria da Fazenda e R$ 74,1 milhões
  via fundos previdenciários. A ASSEBA teria repassado R$ 101,3 milhões ao Banco Master e R$ 21,7 milhões
  a empresas de Lima. O Coaf aponta fluxo financeiro atípico.
