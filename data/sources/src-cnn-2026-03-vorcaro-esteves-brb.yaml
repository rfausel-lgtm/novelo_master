summary: Mensagens de Vorcaro à namorada em 04/04/2025 relatam encontro com André Esteves 'a pedido do
  Banco Central', com Augusto Lima como testemunha; Esteves teria dito que o Master deveria agradecer
  a proposta dele e 'esquecer o BRB'. Em nota, o BTG afirmou nunca ter tido interesse na aquisição do
  Banco Master, limitando-se à aquisição de ativos não problemáticos para prover liquidez em janelas pontuais.
