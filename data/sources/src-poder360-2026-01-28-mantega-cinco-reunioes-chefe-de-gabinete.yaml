summary: A partir da agenda pública de Marco Aurélio Santana Ribeiro, chefe do Gabinete Pessoal da Presidência,
  registra cinco reuniões com Guido Mantega em 2024 — 11/01, 22/01, 01/04, 29/10 e 04/12. Na de 04/12,
  Mantega chegou acompanhado de Daniel Vorcaro, cujo nome não foi registrado na agenda do assessor, e
  de Augusto Lima; depois dessa reunião os dois pediram audiência com Lula, que os recebeu no mesmo dia.
