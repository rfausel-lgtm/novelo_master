summary: 'Informa que o desembargador federal Mauro Braga, do TRF da 2ª Região, negou em liminar recurso do Banco
  Master e que o processo em que o Rioprevidência busca recuperar os investimentos no banco foi encaminhado ao STF,
  mantida a autorização para o Rioprevidência reter parcelas de consignados que seriam repassadas ao Master. Não
  informa número de processo.'
