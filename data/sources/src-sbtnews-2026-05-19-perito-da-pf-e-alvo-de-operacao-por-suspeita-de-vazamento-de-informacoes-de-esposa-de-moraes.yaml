source_type: press
language: pt-BR
summary: Relata que o STF autorizou em 19/05/2026 operação da PF contra possível vazamento de informações
  sigilosas da Compliance Zero, com dois mandados de busca e apreensão e medidas cautelares contra um perito
  criminal federal suspeito de violação de sigilo funcional, autorizada por Mendonça; diz que, segundo
  apurações do SBT News, o alvo é o perito João Cláudio Nabas, suspeito de ter repassado à imprensa um
  contrato de serviços jurídicos e conversas divulgados pelo jornal O Globo; reproduz a nota do STF sobre
  jornalistas.
notes: Lida por lote:fonte em 23/10/2026. A página capturada traz, ao redor da matéria, listas de notícias e
