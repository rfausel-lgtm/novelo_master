summary: Nota de imprensa da PF, publicada em 27/10/2026 às 08h09 e atualizada às 08h59, sobre nove mandados
  de busca e apreensão cumpridos em São Paulo e Pernambuco na Operação Entressafras, que, segundo a nota,
  investiga possíveis crimes contra o Sistema Financeiro Nacional na gestão de recursos do São Roque Prev
  entre 2022 e 2024 e apura investimentos de cerca de R$ 100 milhões. A nota não nomeia banco, investigados
  nem o juízo que expediu os mandados.
