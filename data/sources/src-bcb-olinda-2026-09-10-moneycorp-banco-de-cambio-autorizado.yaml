summary: 'Consulta direta da equipe à base pública do Banco Central em 10/09/2026. A tabela de bancos comerciais,
  múltiplos e de câmbio retorna a MONEYCORP BANCO DE CÂMBIO S.A., cadastro nacional 08.609.934, segmento declarado
  ''Banco de Câmbio'', com sede na rua Joaquim Floriano, 1.052, Itaim Bibi, São Paulo. Controle metodológico: a
  mesma consulta pelo termo ''BRADESCO'' devolve registros, e a consulta ao cadastro na tabela de sociedades devolve
  conjunto vazio, o que confirma que a instituição está classificada como banco, e não como corretora ou distribuidora.'
notes: 'O contraste com a operadora do CredCesta, verificado na mesma base em 09/09/2026, é direto: aquela não consta
  de nenhuma tabela; esta consta como banco autorizado a funcionar.'
