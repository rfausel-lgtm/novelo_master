notes: 'NOTA DE CONTEXTO DA PLATAFORMA: o Metrópoles recebeu R$ 27,28 milhões do Banco Master e do Will
  Bank entre o segundo semestre de 2024 e outubro de 2025, em contratos de publicidade e patrocínio esportivo
  — movimentação que o Coaf classificou como atípica. O veículo sustenta tratar-se de relação comercial
  regular e pública. Não há acusação formal, indiciamento ou denúncia contra o veículo ou seus dirigentes.
