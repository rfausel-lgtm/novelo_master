source_type: press
summary: 'Registra que a Pollaris Consultoria foi aberta em 30/04/2024 em São Paulo, onde o ISS para consultoria
  é de 5%, e transferida em 03/09/2024 para Barueri, onde é de 2%. O endereço declarado é uma sala em
  unidade de coworking. Traz as manifestações de Mantega: que à época não tinha conhecimento de irregularidades
  do banco; que ''a Pollaris é uma empresa registrada em meu nome, que emite notas fiscais e paga os tributos
  devidos''; que não mantém sala fixa porque o trabalho é feito ''principalmente por videoconferências
  e reuniões nos escritórios dos clientes''; e que não escolheu Barueri ''com a finalidade de reduzir
  carga tributária'', por ser o município ''um grande centro de bancos e empresas de serviços''.'
