summary: EDITORIAL DE OPINIÃO, não reportagem factual. Defende a tese de que Lula, Moraes, Alcolumbre e Hugo Motta
  seguem um 'conchavo' de autoproteção mútua entre os Três Poderes, citando como indícios um jantar de Moraes reunindo
  Lula e Alcolumbre em agosto de 2026 e um almoço no Palácio da Alvorada com os três, além de mencionar genericamente
  o escândalo do INSS e os 'envolvimentos nebulosos' de Alcolumbre e Moraes com Daniel Vorcaro e o Banco Master,
  sem apresentar documento ou fato novo específico para esse último ponto.
notes: Fonte de opinião, tratada no acervo como registro de interpretação política publicada, não como fato apurado;
