summary: 'Leitura de texto integral da decisão de 17/06/2026 (autenticação STF verificada, código A609-5148-E6F8-1408).
  Item I.3 (§38) identifica Eduardo Mendonça Sodré Martins como enteado de Jaques Wagner, filho de Guilherme
  Henrique Sodré Martins, pessoa vinculada à BN Financeira Ltda. O §34 transcreve a mensagem de 04/09/2025:
  ''Em 04/09/2025, EDUARDO teria afirmado: Amanhã vence os boletos e são altos. Em resposta, AUGUSTO afirmou
  que o cenário estava crítico e vinculou a dificuldade financeira ao insucesso da operação Banco Master/BRB,
  sugerindo inclusive que se cancelasse a nota para posterior emissão.'' O documento cita separadamente
  dois valores — R$ 3.500.000,00 (transferência PKL One→BN Financeira, 17/10/2025) e mais de R$ 2.340.000,00
  (planilhas de pagamentos a ''Dudu'' via estruturas societárias interpostas) — sem somá-los em um total;
  qualquer cifra consolidada (ex.: ''R$ 5,84 milhões'') citada por reportagens é inferência jornalística,
  não afirmação do documento primário.'
