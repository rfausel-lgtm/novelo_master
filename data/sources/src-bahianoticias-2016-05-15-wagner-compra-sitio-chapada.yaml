title: Wagner compra sítio de tamanho equivalente a 14 Maracanãs na Chapada Diamantina
publisher: Bahia Notícias
publication_date: '2016-05-15'
url: https://www.bahianoticias.com.br/noticia/190536-wagner-compra-sitio-de-tamanho-equivalente-a-14-maracanas-na-chapada-diamantina.html
source_type: press
summary: 'Reproduz reportagem da revista Época: em dezembro de 2015, Jaques Wagner e Maria de Fátima Mendonça compraram
  76% do Sítio Felicidade (antiga Fazenda Dinamarca), em Andaraí, na Chapada Diamantina, por escritura de R$ 538
  mil, e Guilherme Sodré adquiriu os 24% restantes por meio de empresa grafada "MMSS" na matéria. Wagner declarou:
  "Temos relação familiar e compartilhamos o mesmo local com a finalidade de lazer. Ele é pai do meu enteado e adquiriu
  parte do sítio para o seu filho".'
