source_type: press
summary: 'Reportagem construída sobre documento da Coordenadoria de Auditoria em Regimes de Previdência Social do
  TCE-RJ, com o levantamento mais detalhado disponível sobre a exposição do Rioprevidência ao Banco Master até novembro
  de 2025. Discrimina, fundo a fundo: R$ 50 milhões iniciais e mais de R$ 1 bilhão acumulado no ''Arena Fundo de
  Investimento em Renda Fixa Título Público'' desde 19/12/2024 (um dia após o início das operações do fundo), com
  rentabilidade média de 4,05% contra 9,31% do CDI no mesmo período; dois aportes somando mais de R$ 100 milhões
  no fundo Revolution em março de 2025, o segundo feito no dia útil seguinte ao início das operações; R$ 100 milhões
  no fundo Texas em junho de 2025, reduzidos a R$ 75,751 milhões em um mês; e R$ 301 milhões em três letras financeiras
  ''sem qualquer transparência'', em março de 2025. Soma, segundo o TCE: R$ 2,6 bilhões aportados em títulos ou
  fundos do grupo Master. Registra que a conselheira Marianna Willeman determinou em outubro a interrupção de novos
  aportes nos fundos administrados pela instituição, que o Ministério Público do Rio abriu inquérito, que o Estado
  perdeu o Certificado de Regularidade Previdenciária, e que a maioria dos títulos vence apenas em 2050 e 2060,
  parte sem resgate antecipado. Cita ainda que Eucherio Lerner Rodrigues explicou em plenário do TCE que as taxas
  do Master eram as mais rentáveis à época do credenciamento, e que a Cedae investiu cerca de R$ 237 milhões no
  banco, afirmando que a movimentação seguiu suas políticas de investimento e compliance.'
notes: É a fonte com maior densidade de dados primários entre as consultadas para esta reconciliação, por reproduzir
