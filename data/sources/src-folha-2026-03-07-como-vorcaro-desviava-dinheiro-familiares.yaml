source_type: press
summary: 'Com base em documentos das investigações da PF, descreve o mecanismo pelo qual o Banco Master captava
  recursos via CDBs (mais de R$ 50 bilhões), direcionava-os a fundos de crédito cativos (onde o próprio Master era
  o único cotista) e, a partir deles, concedia ''empréstimos'' fictícios a empresas ligadas a Vorcaro, sua família
  e sócios — dos R$ 3,5 bilhões investidos nesses fundos, R$ 1,8 bilhão teria ido para empresas ligadas aos próprios
  sócios do banco. Cita como exemplo a Clínica Mais Médico, que recebeu R$ 361,1 milhões de um desses fundos por
  meio de um laranja. Descreve ainda um esquema paralelo de inflar ativos do Master com a compra, por fundos da
  Reag, de certificados (''cártulas'') de ações do extinto Besc, papel de valor real ínfimo, artificialmente precificado
  para permitir a emissão de mais CDBs. Nomeia como destinatários dos recursos desviados, além de Henrique Vorcaro
  (pai), a irmã Natália e o primo Felipe, e três parentes não identificados de João Carlos Mansur (dono da Reag).
  Cita despacho da PF: ''a extensão e a complexidade destas cadeias de transações apresentam indícios de que as
  operações foram estruturadas mediante a participação coordenada do Banco Master e da Reag DTVM''.'
notes: Peça anexada como doc. 01 à petição de Henrique Vorcaro (e-Doc 75) — a própria defesa a usa como exemplo
  do que chama de 'linchamento' da imprensa.
