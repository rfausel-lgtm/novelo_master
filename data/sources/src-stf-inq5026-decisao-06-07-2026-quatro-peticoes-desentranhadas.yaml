summary: 'Decisão pública (Resolução STF 427/2010), baixada diretamente do portal do STF, que relata e
  desentranha, para autuação em petições autônomas conexas ao INQ 5.026, quatro pedidos distintos: (a) da
  Deputada Luciene Cavalcante, pedido de inclusão de Mario Frias como investigado, com base em áudio do
  Intercept Brasil de 19/05/2026 em que ele teria agradecido a Vorcaro pelo fomento a obra cinematográfica
  sobre Jair Bolsonaro; (b) da mesma deputada, pedido de inclusão de Ricardo Nunes, Prefeito de São Paulo,
  por suspeita de conexão entre o Banco Master, a Concessionária Cortel SP e a Prefeitura de São Paulo na
  concessão de serviços funerários e cemiteriais de 2023 — a decisão apenas relata a existência da suspeita
  alegada pela parlamentar, sem reproduzir qualquer elemento probatório; (c) da Senadora Eudócia Maria
  Holanda de Araujo Caldas, "Notícia-Crime" pedindo reabertura de inquéritos arquivados por conexão com o
  objeto do INQ 5.026, com teor não detalhado na decisão; (d) do Banco Central do Brasil, comunicação
  oficial (e-Doc. 869) sobre irregularidades no conglomerado liderado pela Entrepay Instituição de
  Pagamento S.A. (da qual faz parte a Octa Sociedade de Crédito Direto S.A.) — negociação de valores
  mobiliários sem lastro suficiente, indução do BCB a erro, uso de artifícios contábeis e desvio de
  recursos — que, segundo o próprio Banco Central, "guardam conexão com os ilícitos que estão sendo
  investigados no âmbito da Operação Compliance Zero".'
notes: Documento público, baixado diretamente do portal do STF. Não depende do certificado digital do
