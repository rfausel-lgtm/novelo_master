source_type: press
summary: 'Repercute a revelação feita pela piauí em 10/09/2026. Segundo o texto, o relatório da PF indica que Toffoli
  poderia ser "beneficiário final" ou "proprietário de fato" do fundo Arleen, que recebeu ao menos R$ 35 milhões de
  Vorcaro; depois de adquirido em fevereiro de 2025, o fundo teve o regulamento alterado em março para permitir
  investimento no exterior, começou a se desfazer de ativos em novembro e transferiu cerca de R$ 34 milhões em
  dezembro à Egide I Holding, nas Ilhas Virgens Britânicas. Registra que o gabinete de Toffoli negou "alteração de voto"
  no caso citado.'
notes: A reportagem original não foi lida diretamente.
