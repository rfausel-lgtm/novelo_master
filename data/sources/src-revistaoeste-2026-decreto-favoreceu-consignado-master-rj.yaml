summary: 'Reproduz apuração original do UOL: a autorização à PKL One para ofertar o CredCesta ao funcionalismo
  fluminense foi formalizada por despacho do então secretário de Estado da Casa Civil, Nicola Miccione,
  em 01/06/2021 — cinco dias após o decreto. Registra que o processo administrativo que embasou a autorização
  não aparece no Sistema Eletrônico de Informações do governo estadual, nem mesmo como registro sigiloso,
  ao contrário do processo que originou o decreto, identificado em seu preâmbulo. Traz o contraditório
  da defesa de Cláudio Castro.'
