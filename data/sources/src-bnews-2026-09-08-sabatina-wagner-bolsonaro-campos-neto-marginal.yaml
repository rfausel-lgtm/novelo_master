summary: 'Entrevista mais recente localizada. Trechos literais: ''Até o governo Michel Temer, o Banco
  Central do Brasil não autorizou este marginal, Daniel Vorcaro, a virar banqueiro... funcionou com o
  Banco Central de Bolsonaro, fechou com o Banco Central do Lula.'' Sobre Flávio Bolsonaro: ''É por isso
  que Daniel deu esse presentão para o Flávio Bolsonaro, foi setenta e tantos milhões... Esse rapaz mente
  de manhã, de tarde, de noite.'' Sobre a Bahia: ''Não tem um centavo da Bahia depositado no Master, não
  tem dinheiro de fundo de previdência nosso depositado no Master.'''
