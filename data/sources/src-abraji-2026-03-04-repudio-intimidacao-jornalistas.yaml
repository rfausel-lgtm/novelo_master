summary: Nota da Abraji repudiando as tentativas de intimidação e silenciamento de jornalistas reveladas
  na Operação Compliance Zero, nomeando Lauro Jardim e registrando que outros jornalistas também foram
  ameaçados; pede que os envolvidos sejam punidos também pelo crime contra a imprensa e a democracia.
  A ANJ e a Fenaj divulgaram notas no mesmo sentido na mesma data.
