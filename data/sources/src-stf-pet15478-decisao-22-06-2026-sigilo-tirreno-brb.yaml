summary: 'Decisão de 21 páginas que defere afastamento de sigilo bancário e fiscal (01/01/2024-31/12/2025)
  de 11 pessoas físicas e 2 grupos empresariais apontados na venda fraudulenta de carteiras de crédito
  consignado (CCBs sem lastro) do Banco Master ao BRB, via a empresa de fachada Tirreno. Traz síntese
  individualizada de cada alvo (Daniel Vorcaro, Augusto Lima, Luiz Bull, Alberto Félix de Oliveira, Ângelo
  Ribeiro da Silva, André Seixas Maia, Henrique Peretto, Paulo Henrique Costa, Dario Oswaldo Garcia Junior,
  Tirreno, Viking Participações, Terra Firme Construções e Incorporações Ltda e Terra Firme da Bahia
  Ltda), com o valor agregado de R$ 17 bilhões transferidos pelo BRB ao Master, dos quais R$ 12,2 bilhões
  em carteiras que o próprio BRB admitia não conseguir auditar.'
notes: 'Peça pública do portal do STF (Resolução 427/2010), obtida em sessão anterior via
