summary: 'Cobre a mesma condenação de Renan Foglia Calamia por gestão temerária (juiz Rubens Petrucci Junior,
  dois anos de prisão em regime aberto, convertidos em prestação de serviços comunitários e multa de oito
  salários mínimos), pela recomendação, em 2017, de aportes irregulares do Iprem de Santo Antônio de Posse
  no fundo Horus Vetor, com absolvição quanto a outros investimentos que teriam causado prejuízo de R$ 5,1
  milhões. Diverge do Brasil 247 quanto à data da decisão: registra 09/12/2025, não 19/01/2026.'
notes: A divergência de data com o Brasil 247 (09/12/2025 aqui, 19/01/2026 naquela) não foi reconciliada;
