summary: 'Compilação de 78 páginas de despachos, mandados de intimação, transcrições de depoimentos e
  petições de defesa do IPL 2026.0009625 (INQ 5.035), sobre o "Projeto DV". Traz as intimações originais
  de Thiago Miranda e de Leonardo Antônio Lima Dias ("Léo Dias"), as transcrições literais dos depoimentos
  de Rony Gabriel e Juliana Moreira Leite, a ata notarial com a conversa de WhatsApp que embasa o caso da
  UNLTD (já explorada na decisão de 10ª fase, já no acervo), e documentos societários — inclusive um
  contrato de locação que identifica a empresa "Leo Dias Comunicação e Jornalismo" (CNPJ 51.568.337/0001-
  30) e seu sócio Ivan Carlos de Oliveira.'
notes: 'Documento obtido pelo próprio Rafael via certificado digital, parte do download completo do INQ
  5.035 (83 peças). Lido por agente de pesquisa dedicado, com filtragem explícita para não repetir o que
  já consta em thiago-miranda.yaml e nas evidências da decisão de 10ª fase — a maior parte do conteúdo
  (acordo UNLTD, multa de R$ 800 mil, André Salvador, Rony Gabriel como denunciante) já estava coberta;
  os achados novos estão registrados em evidências e registros de pessoa próprios.'
