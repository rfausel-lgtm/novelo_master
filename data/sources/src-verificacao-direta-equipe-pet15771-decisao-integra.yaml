summary: 'Leitura de texto integral da decisão monocrática do ministro André Mendonça, de 15/04/2026 (autenticação
  STF código A69F-0DC7-CABB-9CD8). Descreve atuação ''bifronte'' de Paulo Henrique Costa — como agente
  público que teria colocado a presidência do BRB a serviço da liquidez do Master, e como beneficiário
  direto de vantagem indevida de R$ 146.582.649,50 em seis imóveis de alto padrão (Heritage, Arbórea,
  One Sixty, Casa Lafer, Ennius Muniz, Valle dos Ipês), com pagamentos já rastreados superiores a R$ 74,6
  milhões. Narra que o BRB adquiriu cerca de R$ 12,2 bilhões em carteiras de crédito do Master que se
  revelaram falsas, e que Costa teria chancelado a continuidade das operações mesmo após relatório interno
  de fevereiro/2025 apontar ausência de repasses e de documentos comprobatórios. Transcreve mensagens
  de WhatsApp extraídas do celular de Vorcaro: Costa — ''Amigo, Obrigado pela conversa de hoje. [...]
  Conversei com a minha esposa e estaremos em SP na próxima semana. Seria legal mostrar o apartamento
  para ela.'' (fl. 80); Vorcaro, sobre entregar um imóvel a Costa — ''Preciso dele feliz. Reverte isso
  aí.'' (fl. 97); Costa cobrando os imóveis — ''Amigo, pessoal esperando seu de acordo sobre os imóveis
  de São Paulo. Pode ajudar?'' (fls. 100-103). Tipificação penal indicada, em juízo de cognição sumária:
  corrupção passiva (art. 317 CP), lavagem de dinheiro (Lei 9.613/1998), organização criminosa (Lei 12.850/2013)
  e crime contra o SFN (art. 4º, Lei 7.492/1986).'
