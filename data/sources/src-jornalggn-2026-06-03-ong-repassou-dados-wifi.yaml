summary: Baseado em reportagem do Intercept Brasil (bloqueada para leitura direta pela equipe editorial
  — HTTP 403). Relata subcontratos do Instituto Conhecer Brasil com a Talk Communications (R$ 2,7 milhões,
  para 12 campanhas de disparo em massa somando 8,1 milhões de mensagens) e com o Instituto Orbis (R$
  5 milhões, para pesquisas de satisfação), ambos dependentes do repasse de contatos telefônicos de usuários
  cadastrados no wi-fi gratuito, sem termo de consentimento.
