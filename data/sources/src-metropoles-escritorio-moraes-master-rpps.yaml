summary: Reportagem sobre parecer contratado pelo Banco Master junto ao escritório Barci de Moraes em
  julho de 2024, a respeito dos riscos na captação de recursos de regimes próprios de previdência. Segundo
  a reportagem, o parecer concluiu que o banco estava apto a captar recursos de RPPS, mas alertou para
  risco relacionado à responsabilidade objetiva da pessoa jurídica por atos contra a administração pública,
  nos termos da Lei 12.846/2013.
