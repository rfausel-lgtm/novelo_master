source_type: official_court
summary: Na PET 15612, o ministro André Mendonça determinou a abertura de inquérito para apurar o vazamento
  de mensagens extraídas dos celulares de Vorcaro, a pedido da defesa; registra que em 20/02/2026 determinou
  a devolução à CPMI do INSS dos dados obtidos por quebras de sigilo decretadas pela própria comissão
  e que as investigações do STF e da CPMI são autônomas.
