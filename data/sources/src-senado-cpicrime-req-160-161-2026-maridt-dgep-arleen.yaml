summary: 'Requerimentos de 27/01/2026, de teor idêntico, do senador Alessandro Vieira, que convocam José Carlos Dias
  Toffoli (160/2026) e José Eugênio Dias Toffoli (161/2026). A justificação diz que a oitiva deles e de Mario Umberto
  Degani se baseia em indícios que ligam transações imobiliárias e societárias a elementos sob investigação; que os três
  tinham relação societária com a Maridt Participações ou com a DGEP Empreendimentos e Participações, que detinham
  participação no Tayayá Aqua Resort, em Ribeirão Claro (PR); que Maridt e DGEP transferiram cotas ao Arleen FIP
  Multiestratégia, administrado pela CBSF DTVM (antiga Reag Trust), e à PHD Holding; que a Reag foi alvo da Operação
  Carbono Oculto; e que o relator do processo do Master ter "vínculos familiares diretos" com os sócios levanta suspeitas
  sobre "utilização de influência institucional para fins privados".'
notes: 'PDFs oficiais com código de autenticação do Senado, obtidos por uma sessão paralela do projeto e lidos aqui na
  íntegra. As afirmações são do autor do requerimento, não conclusões da CPI.'
