summary: 'Nota do gabinete do ministro Alexandre de Moraes divulgada pela Secretaria de Comunicação do
  STF em 06/03/2026: ''análise técnica'' nos dados telemáticos de Vorcaro tornados públicos pela CPMI
  do INSS teria constatado que as mensagens de visualização única de 17/11/2025 ''não conferem com os
  contatos do ministro''. A reportagem observa que não foi informado quem realizou a análise.'
