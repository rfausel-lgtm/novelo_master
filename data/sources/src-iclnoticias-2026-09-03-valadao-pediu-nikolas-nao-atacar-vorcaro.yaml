summary: 'Reportagem de Juliana Dal Piva e Cleber Lourenço (03/09/2026, atualizada em 04/09) com mensagens e áudios
  entre Daniel Vorcaro e o pastor André Valadão. Em 27/04/2024, Vorcaro escreveu: "De novo pedir sua ajuda com
  Nikolas. Estão usando a fala dele pra me atacar, por conta de patrocínio num evento em Londres." Em áudios de
  29/04/2024, Valadão relatou ter procurado o deputado: "Eu preferia que você falasse com ele primeiro" e
  "Resumindo. Ele nem sabia sobre o banco e você, ''palavras dele'', e daí pediu perdão demais". Traz nota de
  Valadão: conhece Vorcaro há mais de 30 anos, nega envolvimento com os negócios do Master e repudia condutas
  ilícitas.'
