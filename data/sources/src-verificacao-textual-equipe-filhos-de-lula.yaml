summary: 'Busca textual feita pela equipe, com normalização de acentos, nos documentos primários do caso
  Master já em posse do corpus. No relatório da Polícia Federal sobre o celular de Daniel Vorcaro (218
  páginas) e na decisão que autorizou a operação Zona Cinzenta (14 páginas), os termos ''Lulinha'', ''Fábio
  Luís'', ''Luís Cláudio'', ''Marcos Cláudio'', ''Sandro Luís'', ''Lurian'', ''Lula da Silva'', ''Fictor'',
  ''Rubini'' e ''Luchsinger'' retornam zero ocorrências. Controles de extração: ''Vorcaro'' aparece 302
  vezes no relatório da PF e ''Master'' nove vezes na decisão da Zona Cinzenta, confirmando que a camada
  de texto foi lida corretamente.'
