summary: Registro oficial de que o relatório final da comissão parlamentar mista de inquérito sobre o
  INSS foi rejeitado por 19 votos a 12 e de que a comissão encerrou os trabalhos sem relatório aprovado.
  Os pedidos de indiciamento nele contidos, portanto, não produziram efeito institucional.
