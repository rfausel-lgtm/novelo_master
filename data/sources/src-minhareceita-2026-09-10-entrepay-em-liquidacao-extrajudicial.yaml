summary: 'Consulta da equipe em 10/09/2026. O cadastro 17.887.874/0001-05 traz a razão social ''ENTREPAY INSTITUICAO
  DE PAGAMENTO S.A EM LIQUIDACAO EXTRAJUDICIAL'' — a liquidação está averbada no próprio registro federal. A empresa
  existe desde 08/04/2013, é sediada em São Paulo, tem atividade principal de administração de cartões de crédito
  e capital social de R$ 581.377.700,00. Constam três diretores, entre eles Antonio Carlos Freixo Junior, com entrada
  em 18/02/2022. Controle metodológico complementar: o cadastro não aparece em nenhuma tabela da base de instituições
  em funcionamento do Banco Central, o que é coerente com a saída do sistema financeiro por liquidação.'
