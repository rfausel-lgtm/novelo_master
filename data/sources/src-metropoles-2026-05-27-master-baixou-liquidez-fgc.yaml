summary: Reportagem sobre a queda de 41,4% na liquidez do FGC (de R$ 114,1 bilhões para R$ 66,8 bilhões)
  e o aporte extraordinário de R$ 44,4 bilhões dos bancos associados via antecipação de contribuições
  ordinárias, parcelado entre março de 2026 e março de 2028; inclui declaração do presidente do Banco
  Central, Gabriel Galípolo, recusando ampliar a cobertura do FGC.
