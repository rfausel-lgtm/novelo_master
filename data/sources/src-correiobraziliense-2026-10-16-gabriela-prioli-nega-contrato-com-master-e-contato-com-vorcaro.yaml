summary: Relata vídeo publicado por Gabriela Prioli em 16/10/2026 em que ela nega ter feito reunião com
  qualquer pessoa do Banco Master ou representante de Daniel Vorcaro, ter assinado contrato com o banco ou
  empresas ligadas ao banqueiro e ter recebido pagamentos; cobra a apresentação do contrato, dos pagamentos e
  de conversas suas e diz que tomará as medidas cabíveis. Resume a reportagem do Estadão do mesmo dia e a
  resposta anterior dela ao jornal.
notes: Aberta pelo redator no navegador embutido em 17/10/2026 (postada às 19h47, atualizada às 20h36); texto
