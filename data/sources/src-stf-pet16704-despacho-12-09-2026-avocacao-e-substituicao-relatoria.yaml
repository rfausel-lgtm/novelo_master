title: Despacho de Fachin de 12/09/2026 — avocação da Pet 15.041 e Pet 15.556, e substituição formal da relatoria
  da PET 16.662
publisher: Supremo Tribunal Federal
author: Ministro Edson Fachin
publication_date: '2026-09-12'
retrieved_at: '2026-09-13'
url: https://peticionamento.stf.jus.br/visualizarProcesso/7687920/4
source_type: official_court
summary: 'Despacho de duas páginas na Pet 16.704. Resume que a PET 16.662 foi criada porque a IPJ-A nº
  3298613/2026 identificou pessoa que atrai o art. 5º, I, do Regimento Interno (competência do Plenário) —
  sem nomear essa pessoa no texto —, desentranhada da Pet 15.556 (e-Docs 541-547) e liberada para julgamento
  pelo Plenário em 06/09/2026. Em seguida, três determinações: (1) pelo mesmo fundamento e considerando a
  manifestação de Alexandre de Moraes (eDoc 11, p. 20), remete à Presidência as PETs 15.041 (Operação Sem
  Desconto/INSS) e 15.556 (Compliance Zero), com todos os processos a elas relacionados; (2) considerando que
  o resultado do julgamento da PET 16.662 pode ensejar a aplicação do art. 144, IV, do CPC (suspeição), determina,
  com base no art. 13, XV, do RISTF, que a Secretaria Judiciária substitua a relatoria da PET 16.662 para a
  Presidência.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael). É a decisão citada pela certidão da PET
  16.662 (ID 1644b067) como fundamento da substituição da relatoria — mais detalhada que o resumo que o acervo
  já tinha em ev-mendonca-remete-pet16662-a-presidencia-em-cumprimento-a-fachin, que registrava apenas o
  cumprimento por Mendonça, sem a base legal nem a avocação das PETs 15.041 e 15.556.'
