summary: "Relata, a partir do vídeo do depoimento de 15/10/2026, o que Vorcaro disse sobre os imóveis em
  Brasília e em São Paulo: que serviriam de moradia a Paulo Henrique Costa caso ele assumisse cargo no
  conglomerado resultante da fusão, que a reorganização não se concluiu e que Costa nunca morou neles. Informa
  que a defesa de Costa foi consultada e não respondeu até a publicação."
