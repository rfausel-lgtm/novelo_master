summary: Reportagem sobre a fase 'Fluxo Oculto' (28/05/2026) da Operação Carbono Oculto, que bloqueou
  cerca de R$ 85 milhões do Zeus FIDC e R$ 72 milhões do Gran Capital FIDC-NP — fundos dos quais a Trustee
  era CUSTODIANTE (não gestora nem administradora). A empresa negou publicamente ter sido alvo dessa fase
  ou ter recebido qualquer intimação relacionada, afirmando prestar apenas serviço de custódia, sem seleção
  de ativos nem supervisão das operações.
