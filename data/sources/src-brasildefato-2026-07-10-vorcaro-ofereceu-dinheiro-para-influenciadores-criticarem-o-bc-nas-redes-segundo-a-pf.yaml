summary: Reproduz trechos da decisão de Mendonça na 10ª fase da Compliance Zero sobre contatos de Thiago
  Miranda com jornalistas e com Renato Breia, da Nord Investimentos. Publica a nota da Nord e do
  sócio-fundador, que confirmam ter sido procurados por Miranda "insistentemente" para retirar conteúdo
  publicado no Instagram em outubro de 2024 e dizem que Breia está à disposição das autoridades, e a nota da
  defesa de Miranda, que nega irregularidades.
notes: A matéria usa, em voz própria, linguagem sobre a investigação que o Novelo não adota.
