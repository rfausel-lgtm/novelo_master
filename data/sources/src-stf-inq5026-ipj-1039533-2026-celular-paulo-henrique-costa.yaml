summary: 'Informação de Polícia Judiciária preliminar, de 36 páginas, sobre o aparelho de Paulo Henrique Costa,
  ex-presidente do BRB, apreendido em 18/11/2025, no IPL 2025.0087917. Analisa três conversas de WhatsApp e conclui
  que há conteúdo potencialmente relevante em duas frentes: negociação de imóveis de alto padrão, de R$ 4,6 a R$ 6
  milhões, com pedido de sigilo e estruturação por holding "para que não seja direto em meu nome", com minutas de
  contrato deixando o comprador em branco; e mensagem de 06/09/2025 em que ele diz buscar "caminhos para sair da
  operação original do Master" com "uma solução que não depende do Bacen".'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente), juntada ao INQ 5.026 em 12/05/2026. O cabeçalho do relatório traz dados
  técnicos e de acesso do aparelho, números de telefone e CPFs, e o corpo traz nomes de familiares, de empresários
  do setor imobiliário, identificação de unidades e endereços — nada disso é reproduzido. O próprio relatório se diz
  não exaustivo.'
