summary: 'Nota oficial do STF sobre o MS 40.799 (tema conexo — prorrogação da CPMI do INSS, não da CPMI
  do Master), relator André Mendonça: liminar concedida em 23/03/2026, derrubada pelo Plenário em 26/03/2026
  por maioria. Trecho literal do voto vencedor de Flávio Dino: ''Prazo certo não se compatibiliza com
  essa ideia de prorrogações sucessivas.'''
