summary: 'A única denúncia do Ministério Público de São Paulo no ciclo Carbono Oculto com data confirmada
  de forma independente pela equipe: apresentada em 18/08/2026 — quase três semanas antes da liquidação
  de Trustee/Banvox —, mira 16 alvos por esquema de adulteração de combustíveis. Nenhuma fonte localizada
  pela equipe cita nominalmente a Trustee, o Zeus FIDC ou o Gran Capital FIDC-NP entre os denunciados
  nessa peça específica.'
