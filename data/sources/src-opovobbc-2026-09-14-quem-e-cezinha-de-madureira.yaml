source_type: press
summary: 'Perfil biográfico: nome político de Antônio Cezar Correia Freire, nascido em 12/12/1973 em
  Ipiaú/BA; começou como radialista, mudou-se para São Paulo; deputado estadual (2015-2019, eleito 2014);
  deputado federal desde 2019 (reeleito 2022); filiado ao PSD por anos, migrou para o PL em 2026; pastor
  evangélico ligado à Assembleia de Deus Ministério de Madureira, de onde vem o apelido.'
