summary: 'Ano XXXIV, nº 7.915, página 6. Texto integral lido pela equipe. Fixa teto de 60% da remuneração
  bruta, repartido em quatro faixas, das quais a última reserva 10% ''para linha de crédito rotativo''.
  Assinam o prefeito, a secretária de Governo em exercício e o secretário municipal de Gestão. RESSALVA
  DECISIVA: o texto do decreto não nomeia o produto nem a operadora. A definição de ''linha de crédito
  rotativo'' remete a inciso de decreto de 2014 que a apuração não conseguiu ler, de modo que a equivalência
  entre essa faixa e o produto é afirmação de imprensa, não do ato.'
