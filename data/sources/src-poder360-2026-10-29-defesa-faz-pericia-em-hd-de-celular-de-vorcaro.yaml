summary: Reportagem sobre a análise preliminar do assistente técnico contratado pela defesa de Vorcaro, com o
  PDF da íntegra. Registra que o laudo não comprova que o material tenha sido alterado. A matéria não traz
  manifestação da PF nem do STF.
notes: A matéria descreve o teste de edição do formato UFDR como feito sobre registro do próprio celular de
  Vorcaro; o PDF da análise (p. 75) diz que o teste foi feito em arquivo público de treinamento e não demonstra
  alteração do relatório do caso. O acervo segue o PDF e não reproduz o registro usado no teste.
