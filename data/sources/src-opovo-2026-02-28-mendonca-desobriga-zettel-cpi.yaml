summary: Decisão monocrática de André Mendonça, de 27/02/2026, desobriga Fabiano Zettel de comparecer
  à CPI do Crime Organizado do Senado, com base no direito à não autoincriminação — a prerrogativa 'abrange
  a discricionariedade de comparecer ou não ao ato'.
