summary: A autoridade policial requereu prorrogação de prazo para diligências complementares reputadas
  imprescindíveis à ultimação das investigações (e-Doc. 1031); o relator deferiu, com fulcro no art.
  230-C, parágrafo 1º, do RISTF, a prorrogação por mais 60 dias, e remeteu os autos à Polícia Federal
  para continuidade das investigações.
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente), que expõe o acervo completo de peças do processo, e não apenas
  a camada de decisões públicas (Resolução STF 427/2010) já minerada em lotes anteriores. Código de
  autenticação/senha do rodapé de cada página nunca reproduzido no acervo.'
