summary: 'Confirma informação do Metrópoles: em dezembro de 2024 Lula esteve com Vorcaro em encontro fora
  da agenda, com participação de Gabriel Galípolo (então indicado à presidência do BC); a reunião teria
  sido articulada por Guido Mantega, que chegou com Vorcaro e Augusto Lima; Lula teria dito que as questões
  eram técnicas e deviam ir ao Banco Central. O Planalto não respondeu sobre a ausência na agenda.'
