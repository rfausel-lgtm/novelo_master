source_type: press
summary: Registra a oitiva do colaborador em 08/09/2026 e a homologação pelo relator em 09/09/2026. Detalha
  sete transferências que somam US$ 12,3 milhões ao fundo Havengate, realizadas entre fevereiro e setembro
  de 2025 a pedido de Daniel Vorcaro. Descreve Paulo Calixto como advogado brasileiro que administra o
  fundo e 'mantém relação próxima com Eduardo Bolsonaro'. Segundo a matéria, o colaborador relatou que
  'era responsável por obter e entregar grandes quantias de dinheiro em espécie a pessoas indicadas por
  Vorcaro' e que 'parte dos valores era transportada em malas', afirmando não conhecer a finalidade final
  de todos os pagamentos.
