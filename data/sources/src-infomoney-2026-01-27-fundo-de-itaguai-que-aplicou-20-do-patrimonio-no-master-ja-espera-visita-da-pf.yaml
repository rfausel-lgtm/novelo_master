summary: Reportagem sobre as aplicações do Itaprevi (regime próprio de Itaguaí) em letras financeiras do Banco
  Master. Traz a nota de Fernanda Pereira da Silva Machado (investimentos sem decisão pessoal, discricionária
  ou direcionada; melhor proposta em duas ocasiões; política de investimentos que já previa alocação de 2% a
  20% em letras financeiras; credenciamento do Master anterior à sua posse, por gestão anterior) e a versão
  contrária do atual presidente do Itaprevi sobre o teto e sobre o aviso da consultoria. Informa que ela
  assumiu a presidência em 12/06/2024 e deixou o cargo em 1º de janeiro de 2025.
