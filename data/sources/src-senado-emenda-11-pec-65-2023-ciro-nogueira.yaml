summary: 'Emenda assinada eletronicamente por Ciro Nogueira em 13/08/2024 que dá nova redação aos §§ 9º a 11 do art. 164
  da Constituição, na forma da PEC 65/2023: o FGC seria regulado por resolução do CMN, exerceria "função pública,
  inclusive por delegação", e garantiria os créditos de cada pessoa até R$ 1.000.000,00. A justificação defende elevar a
  garantia ordinária de R$ 250 mil para R$ 1 milhão para aumentar a competitividade de instituições menores, citando o
  limite de US$ 250 mil do FDIC americano.'
