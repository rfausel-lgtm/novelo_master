summary: 'Segundo despacho de Fachin dentro da Pet 16.704, distinto do de 03/09: trata especificamente
  da admissibilidade do procedimento que Moraes moveu contra Mendonça (oriundo do Inq 4.781/DF), com prazos
  SEQUENCIAIS — primeiro a PGR (Gonet), depois Mendonça. Trecho literal: ''À Procuradoria-Geral da República,
  dê-se vista para que, no prazo de 5 (cinco) dias úteis, apresente parecer acerca da admissibilidade
  e da regularidade do procedimento [...]. Sucessivamente, ao Ministro André Mendonça, faculte-se, no
  prazo de 5 (cinco) dias úteis, a apresentação de manifestação [...].'''
