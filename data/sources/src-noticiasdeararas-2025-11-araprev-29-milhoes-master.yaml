source_type: press
summary: 'O Serviço de Previdência Social do Município de Araras (Araprev) aplicou R$ 29 milhões em Letras
  Financeiras sem garantia do FGC, em três operações: R$ 10 milhões (04/03/2024), R$ 14 milhões (23/05/2024)
  e R$ 5 milhões (09/12/2024) — 6,2% a 6,8% da carteira total, hoje somando pouco mais de R$ 34 milhões
  com rendimento acumulado. A Prefeitura de Araras confirmou apuração interna, encaminhada à Procuradoria-Geral
  do Município, e afirmou que os investimentos seguiram a Resolução CMN nº 4.963/2021 e a Portaria MTP
  nº 1.467/2022.'
