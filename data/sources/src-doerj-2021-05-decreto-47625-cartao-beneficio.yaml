summary: 'Texto do decreto assinado por Cláudio Castro, reproduzido a partir do Diário Oficial. O art.
  1º inclui o inciso VIII no art. 3º do Decreto 45.563/2016 — ''outras entidades consignatárias devidamente
  autorizadas pelo Estado'' —, criando categoria de consignatária cuja habilitação depende apenas de ato
  estadual, sem remissão ao Banco Central. O art. 4º altera o art. 6º para prever margem de até 20% do
  valor líquido em cartão de benefício, com o §1º determinando que esse cartão ''não compõe a margem consignável''.
  O art. 3º eleva o prazo de amortização de 84 para 96 meses e autoriza contratação por meios digitais.
  Preâmbulo indica o Processo nº SEI-150001/006360/2021, da Secretaria de Estado da Casa Civil. RESSALVA
  DE PROVENIÊNCIA: a página do Diário Oficial de 28/05/2021 não foi recuperada diretamente; o texto vem
  de reprodução integral, e o art. 6º, III e §1º está corroborado palavra por palavra por acórdão do TJRJ.'
