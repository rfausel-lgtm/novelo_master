summary: 'Confirma que o prazo de 5 dias úteis vence sexta-feira, 11/09/2026, sem que nenhuma das quatro
  manifestações formais conste como entregue até 07/09. Traz declaração do ministro Flávio Dino: ''Problemas
  reais e graves estão sendo misturados com interesses eleitorais e econômicos, objetivos estrangeiros
  e até ódios pessoais'' — defendendo a conclusão dos inquéritos em bases técnicas.'
