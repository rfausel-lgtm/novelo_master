summary: Registra que, na busca contra Henrique Vorcaro, a PF apreendeu documento impresso extraído do
  sistema Sinapse — banco de inteligência de acesso restrito —, com captura de tela contendo consulta
  detalhada aos dados pessoais de Augusto Conte, ex-sócio de Vorcaro. Segundo a corporação, Henrique dispunha
  de servidores dispostos a acessar ilicitamente os sistemas internos, com pesquisas sobre 'pessoas consideradas
  estratégicas para os investigados'.
