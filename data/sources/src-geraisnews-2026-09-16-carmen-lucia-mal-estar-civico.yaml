summary: 'Em 15/09/2026, a ministra Cármen Lúcia afirmou que a exposição do STF nas últimas semanas —
  em razão da crise institucional em torno do caso Master — provocou "mal-estar cívico" entre os
  brasileiros, e disse desejar ter contribuído para "acalmar" a crise. Em 16/09/2026, em participação por
  videoconferência em evento sobre Controle Interno, lamentou o cenário de descrença nas instituições
  democráticas: "a democracia vive da confiança que o cidadão tem em suas instituições".'
