url: https://www.metropoles.com/colunas/manoela-alcantara/pf-diz-que-vorcaro-bancou-hotel-de-luxo-para-ciro-nogueira-e-hugo-motta-em-lisboa
source_type: press
language: pt-BR
summary: >-
  Segundo a matéria, relatório da PF enviado a André Mendonça descreve mensagens de 18/06/2024, com
  seguimento em 24/06/2024, em que Vorcaro pede a Leo Serrano, tratado como operador das reservas, quartos no
  Four Seasons Lisboa para si e para "Ciro" e "Hugo"; a PF localizou fatura de cinco diárias no hotel, no
  total de 3.155,71 euros, que associa às duas suítes júnior das mensagens, e diz que só os dois se
  hospedaram no hotel. A identificação é leitura da PF a partir das mensagens, da lista de nomes enviada por
  Vorcaro e da fatura. Não traz posição dos citados.
notes: Publicada às 14h44 de 16/06/2026. A matéria transcreve mensagens, que o Novelo não reproduz.
