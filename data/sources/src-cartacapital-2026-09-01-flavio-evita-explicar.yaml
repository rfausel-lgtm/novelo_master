summary: Questionado no Senado em 01/09/2026, Flávio Bolsonaro disse não tratar dos pagamentos e remeteu
  à produtora ('Pergunte para a produtora que parcela é essa. O valor está na prestação de contas'). A
  transferência de 16/09/2025 contradiz sua declaração à GloboNews (maio) de que o último pagamento fora
  em maio de 2025. Inicialmente negou ter procurado Vorcaro; depois admitiu.
