summary: Representação da PF ao STF pedindo busca pessoal contra Fabiano Campos Zettel e Nelson Sequeiros
  Rodriguez Tanure, e prisão temporária e proibição de saída do país só para Zettel — com anexo de
  inteligência (IPJ nº 14/2026) detalhando as passagens aéreas de ambos, compradas dias antes do embarque
  previsto para 14/01/2026.
notes: 'Peça 35 (e anexo 36) de 50 obtidas por Rafael via certificado digital no peticionamento eletrônico
  do STF (pasta local "Pet 15198-1_50") — mesma política de divulgação já aplicada às demais peças obtidas
  por certificado. Rodapé de impressão com CPF de quem baixou o documento nunca reproduzido no acervo.'
