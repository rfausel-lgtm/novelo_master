summary: 'Trecho literal: ''A entidade, conforme destacou o Coaf, é gerida pelo Instituto Terra Firme,
  fundado por Augusto Lima e atualmente comandado pela sua mulher, Flávia Peres.'' Fonte paralela e independente
  do Jornal Grande Bahia para a mesma alegação — mas, como o JGB, não reproduz o texto do relatório do
  Coaf/PF, nem esclarece se o documento primário usa o termo ''Instituto Terra Firme'' ou ''Terra Firme
  da Bahia Ltda'' — as duas pessoas jurídicas distintas cujo nome a imprensa por vezes trata de forma
  intercambiável sob o rótulo genérico ''Terra Firme''.'
