summary: 'Transcreve manifestação da PGR segundo a qual "o elemento justificador" da cautela foi "a apreensão de
  um termo de opção de compra e venda de imóvel envolvendo o Deputado Federal João Carlos Bacelar", descoberto
  acidentalmente, o que preservaria a validade dos atos de primeira instância. Toffoli julga a reclamação
  parcialmente procedente para reconhecer a competência do STF para supervisionar as investigações da
  Compliance Zero, afirma haver "indícios de que o Deputado Federal acima referido pode estar envolvido em
  prática delitiva", recusa o desmembramento e mantém todas as decisões e constrições já proferidas, além das
  cautelares fixadas pelo TRF-1.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). Decisão de 17 páginas; manda arquivar com o trânsito em julgado.'
