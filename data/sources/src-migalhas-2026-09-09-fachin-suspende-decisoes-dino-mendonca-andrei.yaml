summary: 'Registra que o presidente do Supremo suspendeu, em 09/09/2026, tanto a decisão monocrática de
  André Mendonça que afastara o diretor-geral da Polícia Federal, Andrei Rodrigues, e o diretor de Inteligência
  Policial, Leandro Almada, quanto a decisão de Flávio Dino que os reintegrara. Identifica os feitos envolvidos:
  a PET 16.704, instaurada pela Presidência do tribunal; a PET 16.662, de relatoria de Mendonça, sobrestada;
  e a SL 1.946, pedido da União para suspender a decisão de Mendonça. Reproduz da decisão o trecho ''Delineia-se,
  assim, quadro de conflitos e sobreposições processuais que configuram grave lesão à ordem pública''.
  Segundo esta cobertura, Fachin determinou que Andrei preste informações em 48 horas, cabendo à Presidência
  decidir em seguida sobre sua permanência no cargo. Consigna a convocação de sessão extraordinária para
  15/09/2026, às 10h, presencial.'
