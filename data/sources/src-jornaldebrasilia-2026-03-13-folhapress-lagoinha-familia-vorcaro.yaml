source_type: press
summary: 'Reportagem de Anna Virginia Balloussier (Folhapress): André Valadão celebrou em 2018 o casamento de
  Fabiano Zettel com Natália Vorcaro; Zettel migrou da Bola de Neve para a Lagoinha em 2024 e, segundo a igreja, teve
  papel "voluntário e restrito" a um templo, sendo afastado em novembro; Henrique Vorcaro ajudou a quitar a
  dívida de um BMW comprado por Valadão — que esclarece tratar-se da aquisição de um veículo cerca de 25 anos
  antes, "não a qualquer tipo de presente ou benefício"; o filho de Valadão dançou a valsa com a filha de Daniel
  Vorcaro na festa de 15 anos dela, em 2023. Nota da Lagoinha: não tem vínculo institucional com o Master nem
  está associada às investigações.'
