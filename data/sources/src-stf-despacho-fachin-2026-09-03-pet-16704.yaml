summary: Despacho baixado e lido integralmente pela equipe, com código de autenticação do STF. Autuado
  de ofício pela Presidência, com fundamento no art. 13, I, do Regimento Interno, para velar pelas prerrogativas
  do Tribunal. Fixa quatro objetos de apuração e intima Alexandre de Moraes, André Mendonça, Paulo Gonet
  e Andrei Passos Rodrigues a prestar informações em cinco dias úteis, determinando ainda a juntada da
  íntegra da PET 16.662 e da nota da Secretaria de Comunicação divulgada a pedido do gabinete de Moraes
  em 06/03/2026.
