summary: 'Texto oficial obtido no repositório da Secretaria de Fazenda e lido pela equipe. Define, no
  art. 3º, quem pode ser consignatário na folha do Estado: o inciso V exige que instituições financeiras,
  cooperativas de crédito e administradoras de cartão sejam ''detentoras de autorização de funcionamento
  pelo Banco Central do Brasil''. O art. 6º, na redação original, limitava a soma das consignações facultativas
  a 30% da remuneração bruta, e o art. 4º, X, já previa cartões de benefício dentro dessa margem. O art.
  5º condiciona a habilitação a cadastramento pela Subsecretaria de Gestão de Pessoas e à celebração de
  convênio.'
