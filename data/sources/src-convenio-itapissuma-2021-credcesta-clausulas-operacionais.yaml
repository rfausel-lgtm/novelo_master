summary: 'Instrumento assinado digitalmente em 29/09/2021 e publicado em 03/11/2021, assinado pelo prefeito
  e, pela empresa, por Marcos Oliveira Calmon de Bittencourt e Andrea Lima Novaes. Suas cláusulas descrevem
  a arquitetura do negócio: os saques ''serão liberados por instituição financeira expressamente autorizada
  pela PKL''; a empresa ''poderá ceder o objeto deste Convênio a terceiros, como também a carteira de
  Convênios respectivas, comunicando tal fato previamente ao CONVENIADO''; as operações não podem ser
  canceladas a pedido do servidor sem anuência da empresa; e cabe ao município entregar o cartão aos servidores
  ''por meio da sua Unidade/Órgão de Recursos Humanos''. O convênio é sem ônus para o ente público.'
