source_type: press
summary: Dados da Receita Federal enviados à CPI do Crime Organizado, com base na declaração de imposto
  de renda do banco, apontam que o escritório recebeu R$ 80,2 milhões do Banco Master entre 2024 e 2025.
  Procurado, o escritório disse não confirmar informações 'incorretas e vazadas ilicitamente', lembrando
  que dados fiscais são sigilosos. Em nota de março, o escritório já reconhecera a prestação de 'ampla
  consultoria e atuação jurídica', com 15 advogados, três escritórios subcontratados e 79 reuniões na
  sede do banco, sem revelar o valor.
