source_type: press
summary: Confirma que a proposta de colaboração de João Carlos Mansur é composta por 17 anexos sobre diferentes
  temas, com multa de R$ 40 milhões (valor equivalente ao que Mansur teria recebido da Reag enquanto a
  comandava). Confirma que a audiência de voluntariedade ocorreu no início da tarde de quinta-feira, 03/09/2026,
  conduzida por juiz auxiliar do gabinete de André Mendonça — que ainda precisa analisar os anexos entregues
  e decidir se homologa o acordo. Nenhum dos 17 temas é discriminado individualmente no texto.
