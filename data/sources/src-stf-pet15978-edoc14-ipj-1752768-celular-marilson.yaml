summary: 'Informação de Polícia Judiciária de 117 páginas (IPJ nº 1752768/2026), referente ao inquérito
  2026.0022454-CGRC/DICOR/PF (PET 15.562, "Operação Compliance Zero 3"), com a análise do celular
  apreendido diretamente com Marilson Roseno da Silva — fonte distinta das duas análises já mineradas do
  celular de Daniel Vorcaro (e-Docs 3 e 4). Revela que o próprio Marilson mantinha uma conta secundária de
  WhatsApp Business com número internacional da Turquia, sob o codinome "MISTER", com mensagens
  temporárias auto-apagáveis, e mapeia outros terminais internacionais usados por integrantes da
  organização (Reino Unido, possivelmente de Luiz Phillipi Mourão; Colômbia, provavelmente de Henrique
  Vorcaro). Traz ainda trechos da própria oitiva de Marilson, em que ele tenta minimizar seu papel
  chamando as acusações de "fake news" — versão que a PF classifica como causando "extrema estranheza"
  por suas contradições internas —, e um capítulo extenso (37 páginas) sobre Anderson Wander da Silva
  Lima.'
notes: 'Documento obtido pelo próprio Rafael via certificado digital, parte do download completo da PET
  15.978 (378 peças) — mesma política de divulgação aplicada às demais peças.'
