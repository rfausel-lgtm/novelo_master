source_type: press
summary: 'Na noite de sexta-feira, 11/09/2026, o ministro Gilmar Mendes enviou ofício formal ao presidente
  do STF, Edson Fachin, pedindo o adiamento do julgamento e propondo quatro alternativas: (1) reunir os
  processos de Moraes (Pet 16.662) e de Mendonça (sob vista do próprio Gilmar desde 08/09); (2) Fachin
  assumir a relatoria do processo de Mendonça; (3) organizar e delimitar previamente a matéria a ser
  julgada; (4) se a sessão de terça (15/09) for mantida, o próprio Gilmar apresentaria o caso ao plenário,
  com as preliminares — inclusive o pedido da PGR de nulidade do relatório da PF — analisadas antes do
  mérito. Detalha, em ofício formal, a mesma posição que Gilmar já expressara em entrevista no mesmo dia
  (ver src-timesbrasil-2026-09-11-gilmar-sugere-adiar-julgamento-15-09). Fachin respondeu no dia seguinte,
  12/09/2026, indeferindo o pedido de reunião: manteve a sessão de 15/09 exclusiva à Pet 16.662 e remeteu
  a Pet 16.704 (caso Mendonça) para 23/09 (ver src-stf-pet16704-despacho-12-09-2026-pauta-adiada-23-09).'
