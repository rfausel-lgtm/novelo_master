source_type: press
summary: 'Reportagem que corrobora, com terceira fonte independente (após InfoMoney e A Crítica), os registros
  oficiais de reuniões de Augusto Lima com a cúpula do Banco Central em 2025: com o presidente Gabriel
  Galípolo em 11/04, 08/05, 02/07 e 19/07/2025, e com o diretor de fiscalização Ailton de Aquino em 06/08
  e 14/08/2025 — datas que cercam a aprovação de 24/07 e a efetivação de 11/08 da compra do Voiter. Cita
  também a presença de Renato Gomes (então diretor de Organização do Sistema Financeiro e Resolução) e
  Cristiano Cozer (procurador-geral do BC) em parte dos encontros.'
