summary: Caderno Executivo, Seção I, página 22. O Departamento de Despesa de Pessoal do Estado comunica
  que, conforme o credenciamento publicado em 27/05/2022, a PKL One está autorizada a utilizar o código
  097337-4 para consignação em folha — o mesmo código que seria suspenso em 2026.
