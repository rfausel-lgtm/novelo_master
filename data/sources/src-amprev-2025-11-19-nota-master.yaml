source_type: official_government
summary: 'Comunicado oficial: em coletiva de 18/11/2025 o diretor-presidente Jocildo Lemos anunciou comissão
  para acompanhar a liquidação do Master e habilitação junto ao BC para reaver o valor aplicado; afirmou
  que ao menos 19 instituições aplicaram no Master e que não haverá impacto no pagamento dos benefícios.'
