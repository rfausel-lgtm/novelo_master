summary: Toffoli deixou a relatoria do inquérito da Compliance Zero em 12/02/2026, após a PF informar
  ao STF ter encontrado menção a seu nome em mensagens no celular de Vorcaro, e após reportagens revelarem
  vínculo societário não divulgado dele com a empresa Maridt, que vendeu participação no resort Tayayá
  (Ribeirão Claro/PR) a fundo ligado a Fabiano Zettel, cunhado de Vorcaro — mais de quatro meses depois
  da decisão de Toffoli na PET 14.601 (30/09/2025), que é, portanto, cronologicamente anterior a essa
  revelação.
