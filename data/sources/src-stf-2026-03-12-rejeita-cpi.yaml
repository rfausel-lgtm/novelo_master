summary: O ministro Cristiano Zanin rejeitou, no MS 40791, o pedido do deputado Rodrigo Rollemberg (PSB-DF)
  para determinar a instalação de CPI sobre o Banco Master e o BRB; entendeu não haver prova de omissão
  ilegal da presidência da Câmara (Hugo Motta). O requerimento de CPI fora protocolado em 02/02/2026 com
  201 assinaturas.
