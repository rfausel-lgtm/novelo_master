summary: 'Com base em relatórios da PF, reproduz mensagem em que o fórum jurídico em Londres era apresentado
  como organizado por ConJur, Correio Braziliense e Banco Master; afirma que, dos três, o Master financiava o
  evento; registra a preocupação de Vorcaro com a exposição do banco como financiador e a resposta de Chaer
  de que a formulação do convite ficava "sóbria". A reportagem ressalva que os relatórios policiais citados
  são levantamentos informativos, não conclusões finais sobre crime.'
notes: 'Citação reproduzida por petição de terceiro interessado na Pet 16.662/DF (Pet16662-060-INTERESSADO);
  URL exata do artigo não localizada pela equipe, apenas a citação e a data. Esta mesma reportagem da piauí
  (10/09/2026) já é fonte, por outra matéria do mesmo texto, de ev-pf-hipotese-de-que-toffoli-seria-beneficiario-final-do-fundo-arleen
  — tratar como a mesma edição, ângulos diferentes.'
