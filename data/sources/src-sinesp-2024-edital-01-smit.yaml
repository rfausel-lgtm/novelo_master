summary: 'Publicação oficial do edital de chamamento público que precedeu o Termo de Colaboração 01/SMIT/2024:
  orçamento (R$ 72 milhões em 2024 e R$ 36 milhões em 2025, sujeitos a disponibilidade orçamentária),
  cronograma de desembolso, requisitos técnicos (mínimo de 1.000 usuários simultâneos por comunidade,
  100 Mbps de banda total, disponibilidade de 96%) e prazo de instalação até 31/12/2024. Documento íntegro
  disponível via SEI 101106282.'
