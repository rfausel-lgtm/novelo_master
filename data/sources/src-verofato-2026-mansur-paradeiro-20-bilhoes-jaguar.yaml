summary: 'Alega, segundo a colaboração de Mansur: (1) um fundo em Cayman, o Jaguar Multimarket Fund Ltd,
  para onde o Master teria enviado R$ 494 milhões, com beneficiário formal Benjamin Botelho (ex-dono da
  gestora Sefer), mas real controlador, segundo Mansur, Daniel Vorcaro; (2) que o Master forjou a aquisição
  de uma carteira de crédito de R$ 6 bilhões da Tirreno — operação apenas contábil, sem movimentação financeira
  real —, depois revendida ao BRB por R$ 12 bilhões após manipulação de taxas de juros.'
