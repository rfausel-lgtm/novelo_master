source_type: press
language: pt-BR
summary: >-
  Segundo a matéria, determinação do corregedor nacional assinada em 22/09/2026 abriu sindicância contra o
  desembargador Newton Ramos, a partir de reclamação disciplinar de um advogado, para apurar sua atuação em
  processos de precatórios do setor sucroalcooleiro e possíveis interesses do Banco Master; prazo inicial de 60
  dias, prorrogável; 10 dias para defesa prévia após a intimação; o corregedor pediu ao TRF-1 informações sobre
  processos relacionados ao Master, a empresas do setor e ao escritório de Camilla Ramos. A reclamação cita
  contrato "de até R$ 427 milhões". Segundo o CNJ, nas palavras do veículo, ainda não foi comprovada eventual
  relação entre o crédito analisado por Newton Ramos e o Banco Master, nem a participação do escritório no
  processo.
notes: >-
  Atualizada em 25/09/2026, às 19h37. A frase do CNJ é paráfrase do veículo, sem aspas. A decisão que instaurou
  a sindicância e o seu número não foram localizados. A matéria nomeia o advogado reclamante; o Novelo não o
  registra. O resumo automático do topo da página ("gerado por ferramenta de IA") não foi usado.
