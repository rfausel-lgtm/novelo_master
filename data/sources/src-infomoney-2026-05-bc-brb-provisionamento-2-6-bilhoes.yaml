summary: 'O Banco Central determinou que o BRB fizesse provisionamento de R$ 2,6 bilhões no balanço para
  cobrir a fraude nas carteiras do Master, dando prazo até 29/05/2026 para o banco comprovar capacidade
  financeira, sob risco de intervenção regulatória. O presidente Nelson Souza declarou publicamente, em
  janeiro de 2026: ''O BRB não vai quebrar, não vai ter intervenção, não vai ter liquidação.'''
