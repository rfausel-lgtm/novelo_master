summary: Relatório da PF, com sigilo retirado por André Mendonça em 30/07/2026, aponta indícios (preliminares
  e indiciários, segundo a própria PF) de que Jaques Wagner recebeu 'vantagens econômicas diversas' de
  Augusto Lima e Vorcaro, diretamente ou por familiares, incluindo uso gratuito de aeronaves; registra
  ao menos 70 contatos diretos entre Lima e o senador e diz que a proximidade com Vorcaro se deu por intermédio
  de Lima. Wagner disse ter 'certeza' de que provará sua inocência.
