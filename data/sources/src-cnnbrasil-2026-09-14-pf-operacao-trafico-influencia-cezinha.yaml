summary: 'Terceira fase da Operação Transparência, com quatro mandados de busca e apreensão no DF e em SP,
  autorizados pelo Min. Flávio Dino, contra o deputado federal Cezinha de Madureira (PL-SP) e sua esposa,
  a advogada Valéria Rodrigues Linhares, por suspeita de exploração de prestígio, tráfico de influência,
  corrupção passiva e lavagem de dinheiro — negociação de valores expressivos condicionados ao resultado
  de processos em curso, visando influenciar decisões judiciais. Cita a apreensão de R$ 510 mil em espécie
  com Linhares, em mala, no Aeroporto de Congonhas, em 25/08/2026. A reportagem descreve Cezinha de
  Madureira como próximo do Min. André Mendonça e aponta que ele intermediou o encontro de 2025 entre
  Mendonça e Daniel Vorcaro sobre precatórios.'
