summary: 'A PF representa, em 20/02/2026, pela instauração de procedimento apartado do INQ 5026 para apurar
  suposta corrupção do então governador do Rio de Janeiro, Cláudio Bomfim de Castro e Silva, em razão de
  investimentos de cerca de R$ 2,98 bilhões (R$ 970 milhões em Letras Financeiras mais R$ 2,01 bilhões em
  fundos) da RioPrevidência no Banco Master. Aponta vínculo pessoal com Daniel Vorcaro, que teria custeado
  jantares de luxo em Nova York e um evento de "degustação de whiskey" de mais de US$ 1 milhão; e mensagens do
  operador financeiro Ricardo Siqueira Rodrigues afirmando que a liberação dos investimentos dependia de
  "alinhamento político", referindo-se a um "dono" do órgão e a um "operador político" que "manda lá de
  verdade". A petição pede que o feito NÃO seja avocado de imediato ao STF, para preservar a Operação Barco
  de Papel em curso no Rio, e nota que, se o núcleo da apuração recair só sobre o governador, a competência
  originária é do STJ (art. 105, I, "a", CF). Mendonça autoriza a instauração em 28/04/2026, com anuência da
  PGR, com base no art. 21, XV, do RISTF.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, autenticada por ele). É a peça de origem
  do que o acervo já registrava só pela comunicação oficial de imprensa sobre a busca de 26/05/2026 (Pet
  15.676, ver doc-2026-05-26-decisao-pet-15676-castro) — aqui com a acusação concreta, não só a caracterização
  genérica de "proximidade pessoal e atuação política".'
