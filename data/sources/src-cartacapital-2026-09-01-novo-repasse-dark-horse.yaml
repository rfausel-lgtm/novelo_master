source_type: press
summary: Segundo relatório do Coaf obtido pela revista piauí, Vorcaro transferiu US$ 1,66 milhão ao Havengate
  Development Fund em 16/09/2025, oito dias após áudio de Flávio Bolsonaro cobrando parcelas atrasadas;
  o total conhecido passou de US$ 10,6 mi para US$ 12,3 mi (acordo previa US$ 24 mi em 14 parcelas). Em
  22/10/2025 Thiago Miranda perguntou a Vorcaro se liberaria parcelas e ele respondeu 'Liberei mais uma
  hoje'.
