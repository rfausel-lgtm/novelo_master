source_type: press
summary: A própria Polícia Federal afirma que o documento de 218 páginas, entregue a André Mendonça em
  27/08/2026, 'não possui caráter exaustivo'. O trabalho foi feito em 72 horas e teve por objeto um único
  celular apreendido com Vorcaro; a PF transcreveu apenas as 'menções nominais diretamente identificadas'.
  Outros aparelhos ainda devem passar por perícia.
