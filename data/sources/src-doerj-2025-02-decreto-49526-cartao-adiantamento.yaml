summary: 'Texto integral publicado no Diário Oficial de 25/02/2025 e lido pela equipe. Assinado por Cláudio
  Castro, repete a fórmula do decreto de 2021: inclui o inciso IX no art. 3º (''As administradoras de
  Cartão de Adiantamento Salarial''), o inciso XIII no art. 4º, e no art. 6º o inciso IV determinando
  que o cartão de adiantamento salarial ''não compõe a margem consignável'', com parágrafo único fixando
  limite de até 40% sobre o valor líquido, ''sem incidência de juros''. Corrige a data que o corpus registrava
  como 21/02/2025.'
