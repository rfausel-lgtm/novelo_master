url: https://agenciabrasil.ebc.com.br/justica/noticia/2026-07/pge-rj-cobra-grupo-master-por-prejuizo-de-r-640-mi-ao-rioprevidencia
source_type: press
summary: 'A Procuradoria-Geral do Estado do Rio de Janeiro ajuizou três ações contra a Master Corretora,
  a Trustee DTVM e gestoras ligadas ao Grupo Master (entre elas a Acura, votante em nome do fundo
  Revolution), por perdas de R$ 641,4 milhões do Rioprevidência em dois fundos — Revolution (R$ 481,4
  milhões) e Texas I FIA (R$ 135,1 milhões) —, pedindo medidas cautelares que somam R$ 616,6 milhões. Não
  foram divulgados os números individuais dos três processos.'
