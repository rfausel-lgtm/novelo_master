source_type: press
summary: 'Identifica Alberto Alcolumbre, advogado e irmão do senador Davi Alcolumbre, como integrante do
  Conselho Estadual de Previdência do Amapá em 2023-2024 e, a partir de 2025, do Conselho Fiscal da própria
  Amprev. Relata que a PF e o MP-AP vão apurar se o fundo foi formalmente alertado sobre riscos e recebeu
  pareceres contrários antes de aportar cerca de R$ 100 milhões (de um total de ~R$ 400 milhões) em letras
  do Banco Master em reunião do Comitê de Investimentos de 30/07/2024, na qual o conselheiro Gláucio Bezerra
  se disse "propenso a se posicionar pela suspensão desse investimento até que se faça diligências adicionais
  aos órgãos reguladores e ao TCU".'
