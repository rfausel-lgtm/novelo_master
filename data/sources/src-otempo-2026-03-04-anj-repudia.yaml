summary: A Associação Nacional de Jornais manifestou solidariedade ao jornal O Globo e ao colunista e
  repúdio às intenções reveladas, afirmando que intimidar profissional de imprensa por meio de violência
  é ataque inaceitável à liberdade de expressão. A entidade cumprimentou a PF pela descoberta e o ministro
  André Mendonça pelas providências.
