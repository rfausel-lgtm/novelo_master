title: Indicado por Lula, ministro do STJ atuou em caso do Banco Master mesmo após declarar impedimento
publisher: Times Brasil (CNBC)
author: Da Redação
publication_date: '2026-09-26'
url: https://timesbrasil.com.br/brasil/indicado-por-lula-ministro-do-stj-atuou-em-caso-do-banco-master-mesmo-apos-declarar-impedimento/
source_type: press
language: pt-BR
summary: >-
  Citando Lauro Jardim (O Globo), afirma que Benedito Gonçalves apresentou "em março" declaração de impedimento
  para atuar em processos relacionados ao Banco Master e que, cerca de seis meses depois, como corregedor
  nacional de Justiça, tomou duas decisões que relaciona ao caso (o cancelamento dos 16 precatórios e a
  diligência no gabinete do desembargador Newton Ramos); não registra manifestação do ministro nem tentativa
  de contato.
notes: >-
  Título e enquadramento são do veículo (alegação atribuída). As decisões do CNJ não mencionam o Master. Usada
  só para a pendência e a atribuição no verbete de Benedito Gonçalves.
