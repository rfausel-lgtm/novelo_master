summary: Newsletter de David Ágape, de linha editorial declaradamente crítica ao STF/Moraes. Alega que
  a decisão de Moraes de 03/09/2026 contra Mendonça (assinada às 19h37min53s, segundo metadados) transcreveu
  literalmente 2.313 de 4.628 palavras (50,3%) de um dossiê anônimo de 50 páginas, omitindo 28 graus de
  confiança e 6 ressalvas sobre ausência de valor probatório presentes no documento original; e que os
  metadados do PDF do dossiê têm como autor/criador 'Jefferson.Silva', com título interno 'INQ 4781 -
  novo.pdf'. O próprio artigo qualifica esse último ponto como 'indício, não prova' de autoria — nota
  de rigor metodológico do autor. Verificado pela equipe por leitura direta do HTML bruto do artigo (não
  resumo), confirmando que as citações reproduzidas batem com o texto publicado.
