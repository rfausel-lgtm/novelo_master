summary: 'Cobertura que acrescenta duas informações não encontradas nas demais: situa em 8 de agosto de
  2026 a assinatura do acordo com a Procuradoria-Geral da República — data distinta da que o corpus registrava,
  de 03/09/2026, quando o fechamento foi noticiado — e menciona movimentação em espécie de cerca de R$
  1,3 bilhão entre 2020 e 2025, além de ao menos R$ 61 milhões repassados à produção do filme. Registra
  que a Polícia Federal apura se os recursos custearam ''a permanência de Eduardo'' nos Estados Unidos,
  e que Eduardo Bolsonaro nega ter recebido qualquer valor da produção.'
