summary: Captura recuperada pela equipe que resolve uma contradição aparente do acervo. A operadora tinha
  apenas seis estabelecimentos inscritos no cadastro nacional — matriz em São Paulo e filiais em Vitória,
  Curitiba, Campo Grande, Cuiabá e Guarulhos —, o que parecia incompatível com presença em vinte e quatro
  estados. A página de lojas mostra rede física de 49 unidades distribuídas por AL, AM, AP, BA com dez
  lojas, CE, DF, ES, GO, MA, MG com três, MS, MT, PA, PB, PE, PI, PR, RJ com oito, RN, RO, RS, SC, SE
  e SP com sete. A presença nacional não vinha de filiais próprias, mas de rede de lojas e de correspondentes.
