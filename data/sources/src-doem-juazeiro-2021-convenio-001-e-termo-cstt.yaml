summary: Dois instrumentos no mesmo município. O Termo de Convênio nº 001/2021, processo administrativo
  049/2021, entre o município e a PKL One, foi assinado em 12/03/2021 pela prefeita Suzana Alexandre de
  Carvalho Ramos, com vigência de sessenta meses, e teve extrato publicado na edição 1.961 de 16/03/2021.
  E a Companhia de Segurança, Trânsito e Transporte, empresa estatal municipal, firmou com a mesma operadora
  termo de cooperação técnica não onerosa para consignações do cartão, com vigência de sessenta meses,
  datado de 08/06/2021 e publicado na edição 2.066, página 139. O município editou ainda decretos reservando
  20% da remuneração exclusivamente ao cartão do programa, publicados em 17 e 19/03/2021.
