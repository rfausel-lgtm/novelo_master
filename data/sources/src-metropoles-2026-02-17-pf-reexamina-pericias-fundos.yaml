source_type: press
summary: 'Registra que a Polícia Federal reexaminou perícias de investigações anteriores e identificou
  modus operandi comum e conexões com fundos no atual inquérito do caso Master. Detalha que os fundos
  São Domingos e Monte Carlo, geridos pela Sefer (antiga Foco DTVM), tiveram recursos direcionados a empresas
  do núcleo familiar de Vorcaro, sediadas em Nova Lima (MG) e administradas pelo pai e pela irmã: cerca
  de R$ 64 milhões à Milo Investimentos e mais de R$ 15 milhões à Mercatto Incorporações em menos de oito
  meses, além de Inter Participações, Prime Business Participações e SPE Cesto Incorporadora. Registra
  ainda três transferências diretas à conta pessoal de Vorcaro, somando cerca de R$ 2 milhões, em 2017.
  A coluna não registra manifestação de Vorcaro, do Master ou da Sefer.'
