summary: 'Relata que o FGC concedeu empréstimo emergencial de entre R$ 20 milhões e R$ 30 milhões ao Banco
  Máxima em 2019, como parte da operação que viabilizou a troca de controle; o pedido inicial seria de
  cerca de R$ 100 milhões, reduzido após problemas com imóveis oferecidos em garantia pela família Vorcaro.
  Traz a versão do FGC, segundo fonte com conhecimento direto: o empréstimo foi quitado regularmente,
  não se destinava a financiar a aquisição do banco, e ''o FGC não concede crédito com finalidade de compra''.'
