source_type: press
language: pt-BR
summary: >-
  Os deputados federais Rui Falcão (PT-SP) e Rogério Correia (PT-MG) apresentaram em 12/10/2026 ao STF notícia
  de fato pedindo a investigação do ministro Kassio Nunes Marques, presidente do TSE, sobre possíveis vínculos
  dele e de pessoas próximas com o Banco Master; pedem o envio à PGR e a análise pelo plenário ou por ministro
  sem impedimento ou suspeição; a representação cita mensagens, o julgamento da Destilaria Alcídia, o contrato
  do escritório de Camilla Ewerton Ramos ("poderiam chegar a R$ 427 milhões") e a expressão "Turma do KN", e
  enquadra os fatos em tipos penais; registra as negativas anteriores do ministro e que "as suspeitas
  apresentadas pelos deputados dependem de apuração".
