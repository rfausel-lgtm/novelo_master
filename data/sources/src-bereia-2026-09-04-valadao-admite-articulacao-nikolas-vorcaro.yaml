source_type: press
summary: 'Relata vídeo publicado por André Valadão em 03/09/2026 no qual ele confirma a intermediação: "minha
  participação naquele episódio se restringiu exclusivamente a uma interlocução entre pessoas que eu conheço",
  tendo sugerido que Nikolas Ferreira e Daniel Vorcaro "conversassem diretamente antes de qualquer nova
  manifestação sobre o assunto"; e declara conhecer Vorcaro "há mais de 30 anos, muito antes de quaisquer fatos
  que hoje estão sendo divulgados". A matéria (Gabriella Vicente e Luis Henrique Vieira) aponta vínculos
  financeiros omitidos no vídeo, com base em relatório do COAF, CPMI do INSS e Receita Federal.'
notes: Lida por esta sessão via WebFetch direto. Vale como registro da fala do próprio Valadão; para o teor dos
  áudios, depende da mesma revelação do ICL Notícias.
