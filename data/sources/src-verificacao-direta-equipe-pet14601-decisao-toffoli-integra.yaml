summary: 'Leitura de texto integral (21 páginas, assinatura digital STF). Requerentes: Daniel Leite &
  Advogados Associados e, por retificação na própria decisão, Daniel de Faria Jerônimo Leite pessoalmente.
  Requerido: Ministério Público do Estado do Maranhão. Instrumento: petição noticiando descumprimento
  do Tema nº 309 de repercussão geral (RE 656.558/SP, da própria relatoria de Toffoli), com pedido de
  tutela de urgência — não é reclamação constitucional genérica nem habeas corpus. Fundamento: inexistência
  de improbidade sem dolo, e constitucionalidade da inexigibilidade de licitação para serviços advocatícios
  especializados (art. 25, II, Lei 8.666/93) quando presentes notória especialização e preço compatível.
  Trecho literal: ''os autos dão conta de que a persecução conduzida pelo MPMA carece de lastro mínimo
  acerca de eventual comportamento doloso por parte dos peticionantes''. Dispositivo: trancamento da Notícia
  de Fato nº 003773-253/2025, da 6ª Promotoria de Justiça Especializada de Imperatriz/MA, aberta para
  apurar o 1º Termo Aditivo ao contrato (assinado em 06/04/2024, elevando o valor de R$ 10.900/mês, do
  Pregão 002/2023 original de 05/04/2023, para R$ 15.000/mês, com prorrogação de 12 meses). A decisão
  NÃO menciona, em nenhum momento, Daniel Vorcaro, a Kroll, o BRB, Maurício Quadrado ou João Carlos Mansur.'
