summary: Mendonça formalizou, no domingo 06/09/2026, pedido para que o plenário completo do STF — não
  apenas Fachin — analise o caso, invocando o art. 5º do RISTF (competência do plenário para julgar ministros
  e o PGR por crimes comuns). É pedido de deslocamento de competência/rito, distinto da manifestação de
  mérito pedida no despacho de 03/09; cabe a Fachin agora pautar o caso, sem data definida até a data
  desta apuração.
