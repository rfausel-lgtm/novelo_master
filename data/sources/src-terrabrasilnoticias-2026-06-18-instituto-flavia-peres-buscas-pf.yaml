source_type: press
summary: A sede do Instituto Terra Firme, em Salvador, foi alvo de mandado de busca e apreensão em 18/06/2026,
  na 9ª fase da Operação Compliance Zero, autorizado pelo ministro André Mendonça (STF). A reportagem
  indica que o foco declarado da diligência foi a relação entre Augusto Lima e o senador Jaques Wagner
  (PT-BA), não Flávia Peres pessoalmente, e frisa que ela não é investigada.
