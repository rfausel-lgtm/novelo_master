summary: 'Diario de Pernambuco (30/12/2025): Gonet arquivou o pedido de investigação protocolado pelo advogado
  Enio Martins Murad em 24/12; o arquivamento foi assinado três dias depois; reproduz trechos do despacho
  sobre a falta de elementos concretos ou indícios materiais e sobre o sigilo da fonte; registra a nota de
  Moraes de que tratou com o presidente do BC apenas dos efeitos da Lei Magnitsky.'
