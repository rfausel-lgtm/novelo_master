source_type: press
summary: CPI municipal (aberta em abril/2026) apura R$ 93,15 milhões do São Roque Prev aplicados em letras
  do Master (cerca de 18,8% do patrimônio líquido do instituto) mais R$ 20 milhões no fundo imobiliário
  Neteagle (EAGL11), ligado ao mesmo grupo — rombo total de R$ 113 milhões. O ex-diretor-presidente Vanderlei
  Massarioli nega contato direto com o Master, atribuindo a operação à consultoria contratada pelo instituto.
