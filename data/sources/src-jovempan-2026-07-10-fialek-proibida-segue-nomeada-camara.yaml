source_type: press
summary: 'Confirma que Mariângela Fialek, com salário de aproximadamente R$ 25,9 mil/mês, lotada na
  Diretoria Administrativa (Dirad) da Câmara, com sala no Anexo IV (subsolo, "área de baixa circulação e
  pouca visibilidade pública"), segue formalmente nomeada e recebendo salário mesmo após o Min. Dino
  proibi-la expressamente de exercer "atividades relacionadas à proposição, tramitação ou destinação de
  emendas parlamentares".'
