summary: 'Levantamento feito pela equipe na base pública de julgados de primeiro grau do tribunal, por
  termo e por ano de disponibilização. ''PKL One'': 5 julgados em 2023, 96 em 2024, 216 em 2025 e 114
  até 09/09/2026, somando 431 no histórico. ''Credcesta'': 78 em 2025 e 77 em 2026, 207 no histórico.
  ''Banco Master'': 719 no histórico. Ressalva metodológica: a base indexa julgados publicados, não processos
  distintos — um mesmo processo pode gerar vários registros —, de modo que os números medem intensidade
  de litígio, não total de ações. Buscas por ''lista de instituições financeiras'' e por ''2ª Vara Bancária''
  retornaram conjunto vazio, e a decisão de setembro de 2025 citada pela imprensa não foi localizada na
  base, provavelmente por ser interlocutória.'
