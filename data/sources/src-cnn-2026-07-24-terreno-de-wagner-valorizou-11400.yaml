title: Terreno de Jaques Wagner valorizou 11.400% após rodovia projetada por ele
publisher: CNN Brasil
author: Gabriela Piva
publication_date: '2026-07-24'
url: https://www.cnnbrasil.com.br/politica/terreno-de-jaques-wagner-valorizou-11-400-apos-rodovia-projetada-por-ele/
source_type: press
summary: 'Com base em reportagem da Folha de S.Paulo, informa que Wagner comprou o terreno em 20/03/2000 por R$
  28 mil da Traneves Patrimonial, representada por Antonoaldo Grangeon Trancoso Neves, e tentou vendê-lo por R$
  15 milhões à Lagoons Empreendimentos, de que Alex Grangeon Trancoso Neves é sócio, com valorização de 11.400%;
  que a Via Metropolitana, projetada na gestão Wagner e inaugurada em 19/06/2018, cortou parte do terreno; e que
  o cartório de Camaçari impediu a transmissão por decisão de André Mendonça. Cita Wagner: "talvez tenha sido a
  única obra feita na Bahia para benefício dos baianos que não teve pago desapropriação".'
