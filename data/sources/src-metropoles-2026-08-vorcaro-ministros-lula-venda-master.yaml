source_type: press
summary: Em conversa com jornalista, em 19/08/2025, durante a negociação da venda do Master ao BRB, Vorcaro
  foi questionado sobre quais nomes do governo Lula apoiavam a operação e respondeu "Rui, Jaques, Alexandre
  Silveira" — referindo-se a Rui Costa (então ministro da Casa Civil), Jaques Wagner (então líder do governo
  no Senado) e Alexandre Silveira (ministro de Minas e Energia). O relatório da PF, entregue a Mendonça,
  usa a mensagem para sustentar o pedido contra Wagner; nenhum dos três é investigado por este fato específico.
