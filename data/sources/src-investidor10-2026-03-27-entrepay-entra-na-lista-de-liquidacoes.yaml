summary: Informa que o BC decretou em 27/03/2026 a liquidação da Entrepay, da Acqio e da Octa, ressalva que o
  Banco Central não citou o Master ao decretá-la, reproduz a nota do regulador sobre os motivos e o impacto
  sistêmico (0,009% dos ativos do sistema; sem captações cobertas pelo FGC) e registra que Antonio Carlos
  Freixo Júnior foi alvo de busca na segunda fase da Compliance Zero, em janeiro. A página foi atualizada em
  25/08/2026.
