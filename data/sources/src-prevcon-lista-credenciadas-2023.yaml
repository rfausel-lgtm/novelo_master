summary: Única relação de instituições credenciadas publicada pela autarquia, de junho de 2023, e nunca
  atualizada depois. Enumera dezenove instituições, entre elas BEM DTVM, BTG Pactual, Banco de Brasília,
  Votorantim, BB Gestão de Recursos, Safra, Itaú Unibanco, Rio Bravo, Caixa Econômica Federal, Daycoval
  e Genial. O Banco Master não consta. PDF digitalizado sem camada de texto, submetido a reconhecimento
  óptico pela equipe; trechos conferidos visualmente.
