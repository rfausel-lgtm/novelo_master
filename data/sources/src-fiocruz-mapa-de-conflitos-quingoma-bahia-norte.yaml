summary: Registra que o Decreto estadual nº 15.159, de 28/05/2014, declarou de utilidade pública, para desapropriação,
  terras em Salvador, Lauro de Freitas e Camaçari destinadas à interligação das rodovias BA-099 e BA-526 — a Via
  Metropolitana —, autorizando a Concessionária Bahia Norte a promover a desapropriação.
