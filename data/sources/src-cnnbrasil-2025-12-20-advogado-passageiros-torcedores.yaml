source_type: press
summary: Augusto de Arruda Botelho, que defende o diretor de compliance do Master Luiz Antonio Bull, afirmou
  que os passageiros do jatinho que viajou do Brasil ao Peru para assistir a final da Libertadores eram
  apenas 'torcedores'. O ministro Dias Toffoli, então relator do caso Master no STF, era um dos passageiros.
  A ida ocorreu na manhã de 28/11/2025 e a volta em 30/11/2025; a partida (Palmeiras x Flamengo, vitória
  do Flamengo) foi disputada em Lima; Toffoli e Botelho são ambos palmeirenses. O jatinho é do empresário
  e ex-senador Luiz Osvaldo Pastore. Toffoli não se manifestou publicamente, mas afirmou a interlocutores
  ser amigo de Pastore há anos e não ter proximidade com Botelho. Dois dias após a viagem, Toffoli decretou
  sigilo da ação envolvendo o Master no STF.
