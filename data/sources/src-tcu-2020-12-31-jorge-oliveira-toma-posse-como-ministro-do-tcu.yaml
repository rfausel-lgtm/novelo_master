summary: >-
  Notícia oficial do TCU: Jorge Antonio de Oliveira Francisco tomou posse em 31/12/2020 como ministro do
  Tribunal de Contas da União, empossado pelo decano Walton Alencar Rodrigues, após indicação do presidente
  Jair Bolsonaro e sabatina no Senado. Antes, foi ministro de Estado chefe da Secretaria-Geral da Presidência
  da República e subchefe para Assuntos Jurídicos da Casa Civil.
notes: >-
  Usada para identificar o ministro relator do Acórdão 5163/2026 pelo cargo e afastar homônimos. Lida no
  navegador embutido em 16/10/2026.
