summary: Republicação no Terra (13h42, atualizada às 14h53) da reportagem do Estadão. Segundo o texto,
  mensagens extraídas do celular de Daniel Vorcaro mostram Ana Matos, superintendente de Comunicação e
  Marketing do banco entre 2023 e o final de 2025, relatando a assinatura de contrato de 12 meses com Gabriela
  Prioli e tratando com Vorcaro de roteiros de vídeos dela; os diálogos não revelam o valor pago. Nessa
  versão, Prioli ainda não havia respondido ao jornal (registra-se um vídeo de janeiro de 2026 em que negou
  ter sido contratada) e Ana Matos, procurada, não respondeu.
notes: "Aberta pelo investigador com lote:fonte em 17/10/2026; texto integral relido no cache pelo redator.
  Republicação: conta como a mesma origem do Estadão, não como corroboração. Ficam de fora: dados empresariais da citada, a menção a um grupo de influenciadores sem nomes, trechos de mensagens sobre terceiros e
  o vocabulário próprio do texto."
