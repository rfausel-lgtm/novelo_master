url: https://www.estadao.com.br/politica/pf-detectou-pagamento-anual-de-r-33-milhoes-do-master-a-advogada-citada-como-canal-direto-com-stf/
source_type: press
summary: 'Reportagem que revelou o achado: documentos da auditoria interna do BRB, apreendidos pela PF com dirigentes
  do banco público, registram que os gastos do Banco Master com escritórios de advocacia saltaram de R$ 76 milhões
  em 2023 para R$ 215 milhões em 2024, e que nesse ano o escritório Alves Corrêa, da advogada Dalide Barbosa Alves
  Corrêa, recebeu R$ 33 milhões — pagamento ordenado, segundo diálogos entre executivos, sob o argumento de que
  ela seria ''canal direto com o STF''. A reportagem registra que os diálogos não explicam a expressão e que nenhum
  ministro é nomeado nesse trecho, traz a negativa da advogada e informa que Gilmar Mendes afirma ter se afastado
  dela desde a saída do IDP.'
