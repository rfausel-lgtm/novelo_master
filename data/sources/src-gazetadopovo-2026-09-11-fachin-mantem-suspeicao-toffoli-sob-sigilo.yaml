source_type: press
summary: 'Relata que o relatório da PF entregue a Fachin, com "menções ao magistrado, registros de contatos e informações
  sobre negócios", motivou a arguição de suspeição arquivada e segue sob sigilo. Diz que a PF identificou mensagens entre
  Daniel Vorcaro e Fabiano Zettel indicando "pagamentos de pelo menos R$ 20 milhões do fundo Arleen à Maridt após um
  contrato firmado em 2024", e que num relatório posterior a PF levantou a hipótese de Toffoli ser "beneficiário final
  ou proprietário de fato do próprio Arleen".'
