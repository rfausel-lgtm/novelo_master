source_type: press
summary: 'Reportagem sobre o esforço de Augusto Lima para sustentar o Banco Pleno após assumir seu controle:
  teria gasto cerca de R$ 600 milhões de patrimônio pessoal tentando cobrir o passivo de aproximadamente
  R$ 6 bilhões em CDBs herdados da era Master, antes da liquidação de 18/02/2026 — valor não reconciliado
  com os R$ 160 milhões em dois aportes de capital já registrados no corpus a partir de outra fonte; podem
  descrever medidas distintas (aporte formal de capital vs. gasto total de patrimônio pessoal), mas nenhuma
  fonte localizada concilia os dois números.'
