summary: Cobre o mesmo ato de campanha de 04/09/2026 em São Carlos (SP), com as mesmas citações principais de Flávio
  Bolsonaro contra Alcolumbre. Acrescenta a alegação de Flávio de que 54 pedidos de impeachment contra Moraes especificamente
  estariam parados por recusa de Alcolumbre em pautar votação — número não confirmado por fonte independente, atribuído
  ao próprio Flávio e a aliados da oposição. Registra a referência de Alcolumbre ao financiamento de R$ 130 milhões
  do filme sobre Bolsonaro como contra-ataque à cobrança.
