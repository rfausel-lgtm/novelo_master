summary: Sessão virtual extraordinária da 2ª Turma do STF teve início às 10h de 08/09/2026; Luiz Fux e
  Nunes Marques acompanharam o voto do relator André Mendonça, formando maioria de 3 a 0 para manter o
  afastamento de Andrei Rodrigues; às 10h05 Gilmar Mendes pediu vista, interrompendo a formalização do
  resultado; Dias Toffoli ainda não havia votado até então.
