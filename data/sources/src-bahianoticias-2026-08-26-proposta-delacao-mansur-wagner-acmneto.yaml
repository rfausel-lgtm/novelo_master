source_type: press
summary: 'A proposta de colaboração de João Carlos Mansur, entregue à PGR em 26/08/2026, tinha 17 anexos
  sobre diferentes temas, com foco principal em Daniel Vorcaro. Cita que Jaques Wagner recebeu ingressos
  para show da Taylor Swift avaliados em R$ 63,3 mil; que ACM Neto é cotista exclusivo do fundo Seattle
  95, que aplicou R$ 7,92 milhões em fundos ligados ao Master, com ganho de R$ 4,01 milhões; e que o Jaguar
  Multimarket Fund Ltd. (Ilhas Cayman) recebeu R$ 494 milhões do Banco Master, tendo Benjamim Botelho
  como beneficiário formal, mas — segundo a proposta de Mansur — ''o verdadeiro dono é Vorcaro''. Traz
  a negativa de Wagner: não conhece Mansur nem teve relação com a Reag, e a compra dos ingressos foi ''um
  pedido pessoal a um amigo''. Traz a confirmação de ACM Neto de que é cotista do Seattle 95, mas com
  a ressalva de que são ''recursos próprios de origem declarada e lícita''.'
