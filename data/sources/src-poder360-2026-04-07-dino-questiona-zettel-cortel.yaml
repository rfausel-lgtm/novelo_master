source_type: press
summary: 'Cobertura do despacho de 07/04/2026 do Min. Flávio Dino na ADPF 1.196, no qual requisitou que a
  Prefeitura de São Paulo esclarecesse a relação entre Fabiano Zettel e a concessionária Cortel, após
  reportagem apontar que ele assinou 5 atas como conselheiro usando e-mails institucionais do Banco
  Master. A Cortel nega qualquer vínculo com o banco ou com o signatário.'
notes: Fonte de imprensa independente que corrobora o teor do despacho de 07/04/2026 citado e transcrito
  na decisão de 15/09/2026 (src-stf-adpf1196-decisao-15-09-2026-zettel-cortel-mendonca).
