summary: 'Agência Brasil (27/12/2025): Toffoli decidiu no sábado (27) manter a participação do diretor de
  Fiscalização do Banco Central na acareação prevista para terça-feira (30), no Supremo, em que também seriam
  interrogados Daniel Vorcaro e Paulo Henrique Costa; a decisão respondeu a recurso do BC; Toffoli esclareceu
  que nem o diretor nem o BC são investigados e que a participação dele é de "especial relevância".'
