summary: 'Segundo a Veja (11/06/2026), proposta de delação de Vorcaro relataria pagamento de US$ 30 milhões
  (cerca de R$ 153 mi) a Davi Alcolumbre em conta no exterior, conduzido por Augusto Lima, por apoio a
  demanda do Master; as duas propostas de delação foram rejeitadas pela PF. Alcolumbre: informações ''absolutamente
  falsas''; jamais recebeu valores. A reportagem também cita a parceria do CredCesta com o governo da
  Bahia desde 2007.'
