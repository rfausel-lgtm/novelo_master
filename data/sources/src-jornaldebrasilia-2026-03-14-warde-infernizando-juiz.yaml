source_type: press
summary: Reportagem sobre mensagem atribuída a Walfrido Warde, enviada a Vorcaro horas antes da prisão
  do banqueiro em 17/11/2025, dizendo estar 'infernizando' o juiz federal Ricardo Leite, da 10ª Vara Federal
  de Brasília. Investigadores teriam interpretado a mensagem como possível indício de acesso a informação
  sobre decisão sob sigilo. O escritório respondeu que a informação sobre a investigação veio do próprio
  cliente e de outros escritórios da defesa, negando acesso indevido.
