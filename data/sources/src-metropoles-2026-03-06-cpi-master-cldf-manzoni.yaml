summary: O requerimento de CPI do caso BRB-Master na CLDF, protocolado por deputados do PL em março de
  2026, tinha 7 das 8 assinaturas mínimas necessárias — faltava a do deputado Thiago Manzoni (PL), que
  ainda não havia assinado. Colegiado previsto de 7 membros e prazo de 180 dias para os trabalhos.
