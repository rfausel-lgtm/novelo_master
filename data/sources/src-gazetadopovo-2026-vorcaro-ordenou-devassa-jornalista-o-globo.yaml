summary: 'Detalha a devassa determinada contra a jornalista Malu Gaspar, de O Globo, entre março e abril
  de 2025: levantamento de dados pessoais, familiares, endereço, contas bancárias e informações veiculares,
  executado pelo publicitário Thiago Miranda, que teria informado não ter encontrado nada comprometedor.
  Trecho atribuído a Vorcaro: ''Vamos ter que tentar pegar algo dessa mulher no pessoal''. Registra ainda
  tentativa de cooptação — proposta de contratá-la por R$ 120 mil mensais mais R$ 1,5 milhão de luvas
  para interromper as apurações — e reclamação de Vorcaro de que ''Malu e Lauro vieram com mais fúria
  após a aproximação''.'
