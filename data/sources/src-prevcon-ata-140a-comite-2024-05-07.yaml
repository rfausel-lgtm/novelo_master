summary: 'Ata que autorizou a compra. Não nomeia o Banco Master: delibera a aquisição genérica de cerca
  de R$ 14 milhões em letras financeiras com vencimento em dez anos, por sugestão do consultor financeiro,
  fixando como critério que se optasse por instituições no mínimo S3 e presentes na lista exaustiva da
  Secretaria de Previdência. Não registra análise de risco de crédito, rating, estrutura de capital ou
  solvência do emissor. PDF digitalizado sem camada de texto, submetido a reconhecimento óptico pela equipe;
  trechos conferidos visualmente.'
