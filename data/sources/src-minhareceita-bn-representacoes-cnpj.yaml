summary: Registro cadastral de empresa distinta, também de Bonnie Toaldo Bonilha, como sócia única. Aberta
  em 20/05/2019, microempresa, capital social de R$ 10.000,00. Constava anteriormente como VAMOS FLORIR
  COMERCIO DE FLORES LTDA, com CNAE de floricultura, e passou a BN REPRESENTACOES TECNOLOGICAS LTDA, com
  CNAE principal 6203-1/00 — desenvolvimento e licenciamento de programas não customizáveis —, mudando
  a sede de Salvador para Igaporã, no interior da Bahia. As duas empresas declaram à Receita o mesmo telefone
  e praticamente o mesmo endereço de e-mail, ambos de um escritório de contabilidade.
