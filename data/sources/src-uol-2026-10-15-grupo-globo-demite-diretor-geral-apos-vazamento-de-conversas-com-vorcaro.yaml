summary: Segundo a reportagem, conversas de WhatsApp extraídas pela PF do celular de Daniel Vorcaro mostram
  Frederic Kachar, então diretor-geral de Mídia Impressa e Rádio do Grupo Globo, tratando com o banqueiro de
  patrocínios a eventos do grupo e de reportagens. Cita uma tabela enviada por Kachar segundo a qual o Master
  patrocinou o Baile da Vogue de 2024 (R$ 825 mil) e o camarote da editora no Carnaval de 2023 (R$ 1,6
  milhão); um pedido de Kachar para "destravar o uso do novo contrato" de publicidade; a retirada do nome do
  banco das propostas de 2025; e reclamações de Vorcaro sobre colunas e reportagens de O Globo e do Valor, às
  quais Kachar respondeu, segundo o UOL, defendendo os repórteres. Reproduz a nota do Grupo Globo.
notes: Lida pelo script lote:fonte em 17/10/2026 (texto integral). A reportagem também trata de temas pessoais, de terceiras pessoas sem papel no caso e de familiares de Vorcaro, temas que o Novelo não registra. Não traz
  resposta de Kachar nem informa se ele foi procurado.
