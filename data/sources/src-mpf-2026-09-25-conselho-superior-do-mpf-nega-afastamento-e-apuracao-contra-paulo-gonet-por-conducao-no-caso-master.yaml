source_type: official_prosecutor
language: pt-BR
summary: >-
  Notícia oficial publicada em 25/09/2026, às 18:14. Durante a 1ª Sessão Extraordinária de 2026, o Conselho
  Superior do MPF, acompanhando por unanimidade o relator, subprocurador-geral da República Francisco
  Sanseverino, decidiu pelo não conhecimento dos pedidos de impedimento ou suspeição do procurador-geral da
  República, Paulo Gonet, nas apurações do caso Master, por entender que o Conselho "não possui competência legal
  para analisar alegações de impedimento ou suspeição", questionamento que, segundo o texto, deve ser feito
  diretamente no processo em trâmite no STF, e julgou prejudicados os pedidos de afastamento; por cinco votos a
  quatro, rejeitou a abertura de investigação criminal e a designação de subprocurador-geral, "por ausência de
  elementos mínimos para a tipificação do crime de prevaricação". A notícia não nomeia o requerente, não traz o
  número da Notícia de Fato, não cita as PETs e não nomeia votantes além do relator.
notes: >-
  O texto também menciona a recusa de Gonet a proposta de colaboração premiada de Daniel Vorcaro; o tema pertence
  a outro lote e não é usado aqui. A presidência da sessão (Nicolao Dino) e o número da Notícia de Fato vêm da
  convocação de 23/09/2026. Ata ou certidão da sessão não localizada no portal do MPF.
