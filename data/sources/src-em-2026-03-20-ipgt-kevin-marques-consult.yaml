title: A ligação entre filho de ministro do STF e empresa que recebeu R$ 18 mi de Master e JBS
publisher: Estado de Minas
author: Andrei Megre
publication_date: '2026-03-20'
url: https://www.em.com.br/politica/2026/03/7380504-a-ligacao-entre-filho-de-ministro-do-stf-e-empresa-que-recebeu-rs18-mi-de-master-e-jbs.html
source_type: press
summary: Com base na revista piauí e em registro na Junta Comercial de São Paulo, informa que Kevin Marques detém
  70% do Instituto de Pesquisa e Gestão Tributária (IPGT), constituído em 7 de novembro, e Gabriel Campelo de Carvalho,
  filho do dono da Consult, os outros 30%; e que IPGT e Consult funcionaram na mesma sala, em Barueri, com o mesmo
  e-mail corporativo. Kevin diz que as empresas "são independentes uma da outra"; a Consult nega relação societária
  e fala em compartilhamento temporário. Situa os pagamentos do Master à Consult entre agosto de 2024 e julho de
  2025.
