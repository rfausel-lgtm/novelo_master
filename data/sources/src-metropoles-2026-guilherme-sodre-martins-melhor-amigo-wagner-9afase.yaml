summary: Guilherme Henrique Sodré Martins — ex-marido de Fátima Mendonça (atual esposa de Jaques Wagner)
  e pai biológico de Eduardo Mendonça Sodré Martins (enteado de Wagner) — é descrito pela PF como 'pessoa
  próxima e de confiança' do senador, apelidado 'Guiga', suposto articulador entre o núcleo empresarial
  ligado ao Banco Master, o círculo pessoal do parlamentar e o gabinete. Foi alvo de medidas da PF na
  9ª fase da Compliance Zero (junho de 2026). Não é parente consanguíneo de Wagner.
