summary: 'Relatório semestral do BC que trata da liquidação do conglomerado Master: entre 19/01 e 27/02/2026,
  o FGC desembolsou R$ 37,7 bilhões (93,3% da estimativa de R$ 40,4 bilhões), dos quais R$ 20,77 bilhões
  migraram para títulos de outras instituições financeiras; conclui que a liquidação não gerou efeitos
  sistêmicos no SFN.'
