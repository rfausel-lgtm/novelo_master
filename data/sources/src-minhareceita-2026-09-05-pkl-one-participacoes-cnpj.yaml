summary: 'Consulta direta ao CNPJ 27.490.629/0001-13: razão social ''PKL ONE PARTICIPACOES S.A.'', nome
  fantasia ''CREDCESTA'' — confirma que ''PKL One'' (nome usado em reportagens sobre o Amapá) e ''PKL
  One Participações S.A.'' (nome usado em reportagens sobre a Bahia e na decisão do TJRJ) são a mesma
  pessoa jurídica. O QSA vigente na data da consulta traz apenas um diretor, Marcelo Antonio Bullos Cerqueira,
  com entrada em 16/07/2026 — substituindo Andréa Lima Novaes, que agregadores privados (com dados aparentemente
  defasados) ainda listam como diretora desde 2018.'
