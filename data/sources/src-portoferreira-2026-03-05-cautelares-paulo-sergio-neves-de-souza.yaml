title: Ex-diretor do Banco Central que mora em Guaxupé (MG) é alvo da Polícia Federal
publisher: Porto Ferreira Hoje
publication_date: '2026-03-05'
url: https://www.portoferreirahoje.com.br/noticia/2026/03/05/ex-diretor-do-banco-central-que-mora-em-guaxupe-mg-e-alvo-da-policia-federal/
source_type: press
summary: Relata que o economista Paulo Sérgio Neves de Souza passou a usar tornozeleira eletrônica e a
  cumprir recolhimento domiciliar noturno e nos fins de semana, proibição de deixar a cidade e de manter
  contato com outros investigados. Segundo a Polícia Federal, é suspeito de ter usado influência no Banco
  Central em favor de Daniel Vorcaro.
notes: O texto atribui a relatoria do caso no STF ao ministro Gilmar Mendes, o que diverge das demais
  fontes do corpus e das comunicações do próprio tribunal, que apontam André Mendonça como relator. Esse
  trecho não foi utilizado.
