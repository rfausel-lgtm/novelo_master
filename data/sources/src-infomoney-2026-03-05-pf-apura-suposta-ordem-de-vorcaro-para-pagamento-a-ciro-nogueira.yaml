source_type: wire
language: pt-BR
summary: >-
  Segundo a matéria, lista enviada por Fabiano Zettel a Vorcaro em maio de 2024, com pedido de autorização de
  pagamentos, inclui o item "Pagamento pra Ciro"; a investigação ainda não havia obtido dados bancários para
  verificar o pagamento e se o destinatário era o senador ou outra pessoa chamada Ciro. Ciro Nogueira disse
  que "Inferir que se refere a mim, senador Ciro Nogueira, é definitivamente uma mentira fabricada", citou o
  IBGE ("existem mais de 11 mil pessoas com o nome Ciro no Brasil") e mencionou, segundo a matéria, um "Ciro"
  entre os advogados que atuam na defesa de Vorcaro.
