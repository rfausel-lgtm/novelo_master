summary: A CPMI do INSS aprovou, em 19/03/2026, convite (não convocação obrigatória) ao presidente do
  Banco Central, Gabriel Galípolo, e ao ex-presidente Roberto Campos Neto, para esclarecer a participação
  da autoridade monetária em autorizações a bancos envolvidos no esquema de fraude em descontos consignados
  — pauta mais ampla que o caso Voiter especificamente, sem menção nominal a esse episódio no requerimento.
