source_type: press
summary: PF fez busca e apreensão em 10/08/2026 no Iprev de Maceió (AL), que aplicou entre R$ 97 e R$
  117 milhões (valores variam conforme a fonte, possivelmente por tranches distintas) em letras do Master
  entre dezembro de 2023 e maio de 2024. O ex-presidente do instituto, Ronnie Reyner Teixeira Mota (maio/2023
  a setembro/2025), é apontado pela PF como tendo comprado carro e imóvel em espécie após o aporte.
