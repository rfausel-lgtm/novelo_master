source_type: press
language: pt-BR
summary: >-
  Segundo a matéria, a PF aponta R$ 91.280,59 pagos por Vorcaro por cinco diárias de Ciro Nogueira no Four
  Seasons de Lisboa, e o portal do Senado registra cinco diárias pagas pela Casa ao senador em junho de 2024,
  na mesma data, no valor de R$ 16.784,89; a matéria não explica a diferença. Traz a declaração de Hugo
  Motta: "Era um evento corporativo, encontro jurídico".
notes: Publicada às 03h55 e atualizada às 10h18 de 17/06/2026. O portal do Senado não foi aberto pelo Novelo.
