summary: Segundo fontes da Reuters, o BRB desistiu de adquirir o Banco Master após a rejeição do Banco
  Central em setembro; a operação previa 49% das ordinárias e 100% das preferenciais (58% do capital)
  e tinha aval do Cade; o BRB confirmou o indeferimento em comunicado ao mercado.
