summary: Conjunto normativo levantado pela equipe. Pernambuco, pelo Decreto nº 51.760, de 03/11/2021,
  criou a espécie e fixou teto de 48% dos rendimentos brutos, com faixa de 8% compartilhada entre liquidação
  de dívidas de cartão de crédito consignado e amortização de despesas com cartão de benefício — não é
  margem exclusiva. O Piauí, pela Lei Complementar nº 280, de 12/07/2023, reservou '5% (cinco por cento)
  exclusivamente para a amortização de despesas contraídas por meio de cartão consignado de benefício
  ou para a utilização com a finalidade de saque', regulamentada pelo Decreto nº 22.415, de 15/09/2023.
  Sergipe, pela Lei Complementar nº 413, de 08/04/2024, elevou o teto a 45% e destinou cinco pontos percentuais
  ao cartão de crédito ou ao cartão consignado de benefício, 'ou utilização com finalidade de saque'.
  Em nenhum dos três estados foi localizada, no diário oficial, menção à operadora ou ao produto — buscas
  feitas com controle metodológico.
