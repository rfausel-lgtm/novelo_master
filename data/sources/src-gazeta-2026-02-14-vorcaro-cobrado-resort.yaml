summary: 'Relatório da PF entregue ao STF (via Estadão): em maio de 2024 Vorcaro escreveu a Zettel ''Você
  não resolveu o aporte do fundo Tayayá? Estou em situação ruim''; Zettel listou ''Tayaya - 15'' e Vorcaro
  mandou ''Paga tudo hoje''; em agosto de 2024, ''Cara, me deu um puta problema. Onde tá a grana?''; Zettel:
  ''Pagamos 20 milhões lá atrás. Agora mais 15 milhões''. A Maridt vendeu sua participação a fundos que
  tinham Zettel como acionista, antes de a ação do BRB ser distribuída a Toffoli.'
