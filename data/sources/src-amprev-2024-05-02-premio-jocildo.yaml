summary: Notícia publicada pelo site oficial da Amapá Previdência, assinada pelo editor Wedson Castro,
  sobre premiação recebida por Jocildo Lemos em evento do colunista Charles Pantoja. Reproduz o pronunciamento
  dele, em que agradece nominalmente ao governador pela nomeação e ao senador Davi Alcolumbre pelo convite.
  Publicada dois meses antes das deliberações que levaram R$ 400 milhões ao Banco Master. Página lida
  pela equipe.
