summary: 'Texto oficial consultado pela equipe. O §1º do art. 5º reserva ''o limite de 10% (dez por cento)
  destinado exclusivamente para amortização de despesas efetuadas por meio de cartão de benefício consignado
  e/ou utilização com a finalidade de saque por meio de cartão de benefício consignado'' — trocando a
  expressão ''cartão de crédito'', que constava desde 2016, pela designação exata do produto que a empresa
  já vinha operando havia dois meses. Ponto decisivo para a leitura do caso: o rol de consignações do
  art. 3º é taxativo e estrutura-se por tipo de despesa, não por tipo de entidade; o inciso relativo ao
  cartão de benefício não qualifica quem pode operá-lo, ao contrário do inciso sobre empréstimos, que
  exige instituição bancária ou financeira. Em nenhum ponto da lei, do decreto regulamentar ou da resolução
  há exigência de autorização do Banco Central para o cartão de benefício.'
