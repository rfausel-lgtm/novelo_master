summary: ACM Neto confirma publicamente ter recebido R$ 5,4 milhões do Banco Master entre 2023 e 2025,
  valor que não bate com os R$ 3,6 milhões (Master+Reag, até maio/2024) do relatório do Coaf citado pelo
  Correio Braziliense — divergência não reconciliada por nenhuma fonte, possivelmente por diferença de
  escopo (só Master vs. Master+Reag) ou de período coberto.
