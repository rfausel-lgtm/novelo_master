summary: Demonstrações financeiras completas, em 61 páginas, baixadas e lidas integralmente pela equipe.
  Trazem as notas 20 (recursos de aceites e emissão de títulos) e 21 (instrumentos de dívida elegíveis
  a capital regulatório), que discriminam o estoque de letras financeiras por faixa de prazo e descrevem
  a faixa de taxas praticadas, com os comparativos de 2023. O documento estava publicado no site do próprio
  banco, hoje fora do ar; a cópia hospedada pelo Poder360 tem conteúdo idêntico ao do arquivo original.
