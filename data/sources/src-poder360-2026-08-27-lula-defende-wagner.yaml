summary: Em sabatina da TV Globo (27/08/2026) Lula disse que 'até agora não está provado' elo de Wagner
  com o Master, que a relação era com Augusto Lima antes de sua ligação com o banco, e que não faz política
  'vivendo de ilações'; a PF apura se Wagner recebeu um apartamento como propina. Decretos de 2018 do
  governo da Bahia ampliaram o cartão consignado do Credcesta, negócio depois ligado ao Master; Wagner
  nega irregularidades.
