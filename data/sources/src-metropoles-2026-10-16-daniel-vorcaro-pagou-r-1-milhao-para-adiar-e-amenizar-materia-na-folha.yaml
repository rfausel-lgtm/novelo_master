source_type: press
language: pt-BR
summary: O Metrópoles afirma, com base em mensagens que diz ter obtido entre Daniel Vorcaro e o gestor de
  crise Guilherme Barros, que em 7 e 8/08/2024 Vorcaro prometeu a Barros um "prêmio de R$ 1mm" se a reportagem
  da Folha sobre ele fosse segurada; que Barros escreveu que o diretor de Redação Sérgio Dávila havia
  respondido; que houve encontro na sede da Folha em 12/08/2024; e que o perfil publicado em 30/08/2024 saiu,
  segundo o portal, como o banqueiro queria, com trechos favoráveis depois retirados. Publica as perguntas
  enviadas a Dávila e as respostas da Folha, que negam, e a nota de Guilherme Barros.
notes: "Cache do script lote:fonte (17/10/2026). O Metrópoles é parte interessada: publicou a reportagem um
  dia depois de o UOL, do mesmo grupo da Folha, publicar mensagens sobre o próprio Metrópoles. Revista Fórum e
  Painel Político resumiram as duas versões: não são fontes independentes."
