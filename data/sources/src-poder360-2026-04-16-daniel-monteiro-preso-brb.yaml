summary: Reportagem sobre a prisão do advogado Daniel Lopes Monteiro na Operação Compliance Zero, acusado
  pela PGR de operar 'compliance paralelo' do Banco Master fora dos canais internos de controle, e de
  estruturar empresas de fachada para ocultar imóveis repassados ao ex-presidente do BRB, Paulo Henrique
  Costa. A PGR estima vantagem econômica pessoal dele em cerca de R$ 86,1 milhões; o Master declarou à
  Receita R$ 109 milhões em pagamentos a empresas de que ele é sócio, entre 2022 e 2025.
