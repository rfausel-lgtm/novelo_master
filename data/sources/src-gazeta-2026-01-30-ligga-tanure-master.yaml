summary: Documentos internos da Ligga Telecom (controlada por Nelson Tanure) indicam que parte de cerca
  de R$ 350 milhões do caixa foi aplicada em CCBs do Banco Master, sem montante público; a Moody's rebaixou
  o rating em dezembro de 2025 por 'opacidade de informação'. Tanure foi alvo da 2ª fase da Compliance
  Zero em 14/01/2026.
