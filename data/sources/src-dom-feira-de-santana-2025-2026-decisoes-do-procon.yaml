summary: Três edições lidas pela equipe. A de 13/12/2025 publica, em lista de decisões administrativas, o acolhimento
  da reclamação do processo nº 57613C/2025 e a condenação da PKL One Participações S.A. ao pagamento de penalidade
  administrativa de R$ 11.612,70, com fundamento no artigo 56, inciso I, e parágrafo único do Código de Defesa do
  Consumidor, e determinação de inclusão no cadastro do artigo 44 do mesmo código. As de 07/02/2026 e 08/08/2026
  registram outros dois processos contra a mesma empresa, ambos não acolhidos por ausência da parte reclamante à
  audiência.
notes: A publicação é uma lista de decisões e não descreve os fatos que originaram cada reclamação; do documento
  se extrai a sanção e seu fundamento legal, não a conduta sancionada. A decisão é administrativa e comporta recurso
  no prazo de dez dias úteis, que o documento faculta.
