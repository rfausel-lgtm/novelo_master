summary: Com documentos obtidos por Lei de Acesso à Informação, registra a participação de Andrei Rodrigues
  no 1º Fórum Jurídico Brasil de Ideias, em Londres, de 24 a 26 de abril de 2024, organizado pelo Grupo
  Voto e patrocinado pelo Banco Master, com hospedagem no hotel The Peninsula London. A PF respondeu que
  'não foram pagas diárias ao servidor' e que 'o organizador do evento custeou diretamente as respectivas
  despesas extraordinárias', afirmando que ele 'não recebeu remuneração, cachê, honorário, ajuda de custo
  ou qualquer outro benefício dos organizadores', e declarando desconhecer os valores aplicados pelos
  entes privados.
