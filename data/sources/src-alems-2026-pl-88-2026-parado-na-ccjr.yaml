summary: 'Consulta ao sistema de proposições. O PL 88/2026, do deputado Pedro Kemp, que suspende os descontos
  vinculados ao CredCesta e ao Banco Master, foi lido em 23/06/2026, teve relator designado na Comissão
  de Constituição e Justiça em 01/07/2026 e não registra movimentação desde então. Contraste registrado
  na mesma base: requerimentos de teor genérico sobre endividamento por consignados foram aprovados por
  unanimidade em agosto e setembro de 2026, enquanto o Requerimento 01840/2026, o único que nomeia a PKL
  One e pede à secretaria os convênios e os descontos, permanece aguardando ordem do dia desde 23/06/2026,
  sem ter sido pautado.'
