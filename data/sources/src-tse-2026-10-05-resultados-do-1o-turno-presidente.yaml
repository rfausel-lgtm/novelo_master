  Portal oficial de resultados do TSE, eleição 6257 (1º turno federal de 04/10/2026), cargo Presidente, Brasil:
  "Última atualização 05/10/2026 12:51:05", 499.248 de 499.248 seções totalizadas (100,00%), 119.300.788 votos
