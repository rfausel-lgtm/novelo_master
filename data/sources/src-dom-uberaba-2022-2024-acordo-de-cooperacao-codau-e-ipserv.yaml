summary: Seis edições lidas pela equipe. Em 29/04/2022, o extrato do Acordo de Cooperação entre o município de Uberaba
  e a operadora, para operacionalizar as consignações em folha; em 26/10/2022, o primeiro aditivo, que altera cláusulas
  do acordo; em 24/08/2023, o despacho da inexigibilidade nº 15/2023 da CODAU, companhia municipal de saneamento,
  para celebrar convênio sem ônus para a autarquia; em 27/09/2023, o extrato do Convênio de Consignação em Folha
  nº 02/2023 da própria CODAU; em 22/12/2023, o extrato do termo de convênio de cooperação entre o IPSERV, instituto
  de previdência dos servidores municipais, e a operadora; e, em 09/12/2024, a prorrogação do acordo com o município.
notes: Edições no acervo data.queridodiario.ok.org.br sob o território 3170107, nas datas citadas.
