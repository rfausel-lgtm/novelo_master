summary: Inteiro teor de 108 páginas do acórdão em que a Segunda Turma do STF, por unanimidade (com ressalvas do
  ministro Gilmar Mendes e suspeição declarada por Dias Toffoli), referendou a decisão do relator André Mendonça
  que decretara prisão preventiva e medidas cautelares contra os investigados da Operação Compliance Zero, com base
  na representação da PF de 27/02/2026 (e-Doc 1, já no acervo — lotes 170-171). O voto do relator essencialmente
  adota a narrativa da PF. O voto vogal de Gilmar Mendes acrescenta um capítulo próprio sobre vazamentos à imprensa
  durante o processo, comparando o caso a abusos da Lava Jato, e aponta que uma reportagem do Estadão publicou captura
  de tela mais completa do que a constante dos próprios autos entregues à Turma.
notes: Obtido pela equipe em 11/09/2026, mediante certificado digital do editor, após o levantamento do sigilo da
  PET 15.556 (lote 168). O texto contém duplicação de parágrafos página a página, provável artefato da extração
  do PDF, sem perda de conteúdo substantivo.
