summary: A Segunda Turma referendou, por maioria (Mendonça, Fux, Nunes Marques; divergência parcial de
  Gilmar Mendes; Toffoli não participou por suspeição), as prisões preventivas de Henrique Moura Vorcaro
  (pai) e Felipe Cançado Vorcaro (primo) nas PETs 15978 e 15873. A defesa de Felipe sustentou que as operações
  financeiras seriam regulares.
