summary: O novo advogado, Davi Tangerino, pediu ao STF liberdade provisória (subsidiariamente, prisão
  domiciliar) para Paulo Henrique Costa, argumentando que ele não obstrui investigações e não é reinterrogado
  desde novembro anterior; classificou a posição da PGR sobre a delação recusada como 'leviana e assustadora',
  e afirmou que 'não há rigorosamente nada que se apure no inquérito' quanto ao período posterior ao afastamento
  dele da presidência do BRB. Resultado desse pedido não localizado em busca posterior — status de custódia
  após esta data permanece não confirmado.
