summary: 'Reprodução da mesma coluna com o outro lado: integrantes da PF e da PGR afirmam que o ex-banqueiro
  não trouxe fatos concretos que configurassem maus-tratos e que buscaria pretexto para reabrir a negociação
  de delação. Interlocutores de Andrei Rodrigues dizem que ele jamais teve relação com Vorcaro e que os
  dois se encontraram uma única vez, casualmente, em Londres, em seminário jurídico do grupo Voto patrocinado
  pelo Banco Master. O advogado de Vorcaro e o diretor-geral não retornaram à coluna.'
