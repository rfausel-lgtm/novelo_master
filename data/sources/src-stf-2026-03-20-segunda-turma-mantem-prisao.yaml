source_type: official_court
summary: A Segunda Turma do STF referendou por unanimidade (Mendonça, Fux, Nunes Marques e Gilmar Mendes)
  a prisão preventiva de Daniel Vorcaro e de Fabiano Zettel, descrito como cunhado do banqueiro, e Marilson
  Roseno da Silva; a medida foi excluída quanto a Luiz Phillipi Machado de Moraes Mourão em razão de seu
  falecimento. O ministro Dias Toffoli declarou suspeição por foro íntimo para julgamentos do caso Master
  após ser sorteado relator do MS 40791 (pedido de instalação de CPI na Câmara).
