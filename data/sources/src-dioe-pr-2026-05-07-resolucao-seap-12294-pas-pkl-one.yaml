summary: 'Edição nº 12139, página 14. Instaura processo administrativo sancionatório contra a PKL One
  Participações S.A., identificando o produto como ''Cartão de Benefícios CredCesta'' e a conduta como
  ''efetuar cobrança indevida ao consignado'' e ''agir em prejuízo do consignado ou da Administração Pública''.
  Fundamenta-se no descumprimento do art. 19, incisos I e III, e do art. 25 do Decreto estadual 9.220/2021
  — dispositivos que obrigam o consignatário a devolver em cinco dias úteis valores cobrados a maior e
  a oferecer forma alternativa de pagamento quando o desconto é suspenso. Protocolo 25.463.267-8; assina
  a secretária em exercício. Ressalva registrada pela equipe: no dia seguinte foi publicada resolução
  instaurando processo idêntico contra outro cartão, de modo que a medida integra uma leva e não é ato
  isolado dirigido à empresa.'
