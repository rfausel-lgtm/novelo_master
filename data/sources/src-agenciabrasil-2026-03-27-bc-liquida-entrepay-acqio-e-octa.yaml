source_type: press
summary: Registra que o Banco Central decretou em 27/03/2026 a liquidação extrajudicial da Entrepay Instituição
  de Pagamento, líder do conglomerado, e, por extensão, da Acqio Adquirência Instituição de Pagamento e da Octa
  Sociedade de Crédito Direto. Reproduz a nota da autarquia segundo a qual a medida foi motivada 'pelo comprometimento
  da situação econômico-financeira da instituição líder do Conglomerado, bem como por infringência às normas que
  disciplinam sua atividade e por prejuízos que sujeitam a risco anormal seus credores'. Informa que o conglomerado
  detinha, em dezembro de 2025, cerca de 0,009% do ativo total do sistema financeiro; que as instituições liquidadas
  não têm captações cobertas pelo Fundo Garantidor de Créditos; e que, com a liquidação, os bens dos controladores
  e ex-administradores ficam indisponíveis.
notes: O ato formal é o Ato do Presidente nº 1.381, de 27/03/2026, não lido diretamente pela equipe.
