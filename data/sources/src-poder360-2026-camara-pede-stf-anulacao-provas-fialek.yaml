source_type: press
summary: 'A Mesa Diretora da Câmara dos Deputados, presidida por Hugo Motta, enviou em dezembro/2025 pedido
  ao Min. Flávio Dino solicitando a anulação das provas obtidas pela PF contra Mariângela Fialek ("Tuca")
  e o retorno dela ao cargo na Presidência da Câmara. Fialek ocupa a Chefia da Assessoria Especial do
  Gabinete da Presidência desde março/2021, nomeada por Arthur Lira (então presidente), e manteve o cargo
  mesmo após a saída dele — sob a presidência de Motta, descrito como "afilhado político" de Lira.'
