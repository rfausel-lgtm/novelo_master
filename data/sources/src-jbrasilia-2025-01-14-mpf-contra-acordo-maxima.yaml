source_type: press
summary: 'Registra a resistência do MPF ao acordo de não persecução penal: o procurador Vicente Mandetta
  sustentou que o instituto se destina a casos simples e que as condutas, de alto potencial ofensivo,
  não se qualificam, por terem sido cometidas reiteradamente e envolverem altos valores. O MPF só cedeu
  após o STJ arquivar parte da acusação em 2021, restando a gestão fraudulenta. A defesa sustentou que
  o instituto não se limita a crimes menores; Caló alegou responder apenas pela área jurídica.'
