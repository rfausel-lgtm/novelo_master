summary: Trinta edições de oito municípios, entre 03/10/2023 e 08/08/2026, publicam listas de atendimentos de Procon
  em que a operadora aparece como fornecedora reclamada, quase sempre na classificação 'fundamentada não atendida'
  — o consumidor reclamou, o órgão considerou a reclamação procedente e a empresa não respondeu. Em sete dessas
  edições o Banco Master figura no mesmo registro ou no protocolo vizinho, o que mostra os dois nomes do grupo respondendo
  pelo mesmo atendimento. Estende para a Bahia e o Paraná uma camada que o corpus registrava apenas em municípios
  paulistas.
notes: As listas trazem nomes de consumidores; a apuração registra apenas os totais, a classificação e a presença
  das duas empresas, sem reproduzir dados pessoais. A URL registrada é a da edição de Londrina de 08/07/2026; as
  demais estão no acervo data.queridodiario.ok.org.br sob os territórios de cada município, nas datas citadas.
