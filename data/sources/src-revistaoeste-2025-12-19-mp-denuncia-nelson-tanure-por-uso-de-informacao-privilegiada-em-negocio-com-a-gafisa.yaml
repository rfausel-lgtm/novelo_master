summary: Noticia a denúncia do MPF contra Nelson Tanure por suposto uso de informação privilegiada em
  transações com a Gafisa, protocolada em quarta-feira 17, e o papel atribuído a Gilberto Benevides,
  controlador da Upcon. Registra a nota da defesa de Tanure e a da Gafisa; não traz manifestação de Benevides.
  Situa o inquérito na 9ª Vara Criminal Federal de São Paulo.
