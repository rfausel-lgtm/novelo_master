summary: 'Resume o relatório da PF tornado público em 01/09/2026: contatos desde dezembro de 2023 intermediados
  por Fábio Faria; mensagens de Vorcaro a familiares dizendo estar ''com alexandre moraes'' (nov/2024)
  e ''com Moraes aqui'' (mar/2025); cinco mensagens de visualização única enviadas em novembro de 2025
  ao contato ''Alexandre de Moraes BRASILIA''. Ressalva que o relatório não conclui que Moraes cometeu
  crime e que a PF não realizou diligências contra magistrados ou membros do MP.'
