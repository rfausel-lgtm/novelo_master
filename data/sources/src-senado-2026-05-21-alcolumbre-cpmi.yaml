summary: Em sessão conjunta de 21/05/2026, Davi Alcolumbre afirmou que a leitura de requerimentos de CPMI
  é ato discricionário do presidente do Congresso (arts. 156 e 214 do Regimento) e que o assunto não era
  prioritário naquela sessão; parlamentares governistas e de oposição cobraram a leitura do requerimento
  da CPMI do Master (238 deputados e 42 senadores no pedido de Carlos Jordy).
