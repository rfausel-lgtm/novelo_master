summary: 'Registra a abertura da Petição 16.704, derivada da Pet 16.662, com prazo de cinco dias úteis
  para manifestação de Moraes, Mendonça, Gonet e Andrei Rodrigues sobre quatro pontos: observância da
  LOMAN pela PF em apurações que atinjam autoridades com foro no STF; eventual uso indevido de credenciais
  institucionais para acesso a documentos privados; circunstâncias do despacho que determinou a identificação
  de pessoas na Pet 16.662; e medidas de controle externo da atividade policial.'
