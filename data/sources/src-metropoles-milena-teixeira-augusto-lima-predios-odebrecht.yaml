source_type: press
summary: 'Em outubro de 2025, em meio à crise do Master, Lima repassou à OR (Novonor/ex-Odebrecht), via
  sua holding Terra Firme Realty S.A., o controle de dois empreendimentos residenciais de luxo em Salvador:
  Amarama Barra (203 unidades, R$ 374 mil a R$ 1,35 milhão) e One (unidades de R$ 499 mil a mais de R$
  650 mil). Em fevereiro de 2026, outra empresa do mesmo grupo, a Zermatt Empreendimentos, teve o controle
  transferido da Terra Firme para a Delta Participações, com troca de administradores — movimento posterior
  à prisão de Lima e à liquidação do Master/Pleno.'
