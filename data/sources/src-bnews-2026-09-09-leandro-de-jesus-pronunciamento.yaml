summary: 'Pronunciamento do deputado estadual em vídeo nas redes sociais: ''Alexandre de Moraes coloca
  a Polícia Federal atrás de mim, para me ouvir e me investigar. Já fiz uma apuração inicial e de fato
  saiu a determinação do Moraes. Ainda não sei as motivações e vou me aprofundar sobre o que está acontecendo'';
  e ''para mim não é surpresa estar na mira do Moraes. Mas quero deixar um recado para os meus apoiadores:
  não vou recuar''.'
