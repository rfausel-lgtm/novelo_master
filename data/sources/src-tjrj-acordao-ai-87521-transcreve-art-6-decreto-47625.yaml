summary: PDF lido pela equipe. Transcreve, em citação recuada, o caput, o inciso III e o §1º do art. 6º
  do decreto de 2021, em redação idêntica à das transcrições do diário oficial — o que confere lastro
  judicial ao texto. O tribunal aplica o dispositivo no sentido de que o teto do cartão de benefício é
  de 20% dos rendimentos líquidos 'excluindo-se os descontos legais e as demais consignações facultativas'.
