source_type: official_court
summary: Primeira manifestação de Claudinei Galvão da Silva localizada no corpus — não é uma defesa contra
  as acusações do TCE-PR (já respondidas em processo próprio), mas um pedido direto ao STF para que o
  título de R$ 4 milhões investido pelo FUNPREV de Imbituva no Master seja incluído em eventual restituição
  a RPPS pactuada na proposta de delação premiada de Daniel Vorcaro — citando reportagens não verificadas
  pela equipe sobre uma possível devolução de R$ 3 bilhões a fundos de RPPS, e sobre expectativa de fechamento
  da delação até 03/05/2026.
notes: O rumor de R$ 3 bilhões em devolução a RPPS via delação de Vorcaro é citado pelo peticionário com
  base em reportagem (Investidor Institucional), não verificado de forma independente pela equipe nem
  confirmado por nenhum outro documento do corpus.
