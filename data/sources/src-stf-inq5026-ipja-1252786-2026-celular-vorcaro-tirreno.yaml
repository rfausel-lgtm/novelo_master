summary: 'Informação de Polícia Judiciária de Análise de 228 páginas, no IPL 2025.0087917 (DELEINQUE/SR/PF/DF), sobre o
  aparelho apreendido no cumprimento de mandado de prisão cujas conversas a PF atribui a Daniel Vorcaro. Analisa os
  diálogos com Paulo Henrique Costa, Alberto Félix, Henrique Peretto, Augusto Lima, Ângelo Ribeiro da Silva, Daniel
  Lopes Monteiro e os grupos "INFO – BRB", "DV DLM TM LTA – Urgentes" e "Daniel e os leões". Conclui que a Tirreno foi
  usada como interposta pessoa para ocultar a origem fraudulenta dos créditos cedidos ao BRB, que documentos da
  cessão foram produzidos depois das datas neles declaradas e que Paulo Henrique Costa prestava favorecimento ao
  Master desde 2024.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente), juntada ao INQ 5.026 em 12/05/2026 num bloco de relatórios de análise de
  celulares. Números de telefone, IMEIs e o CPF de um investigado que constam do relatório não são reproduzidos, e
  advogados do escritório citados sem acusação formal não são nomeados. Descreve hipóteses investigativas da PF.'
