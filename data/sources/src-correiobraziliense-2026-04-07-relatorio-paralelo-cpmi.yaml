summary: Registra a entrega, em 07/04/2026, do relatório alternativo da base governista (nunca votado
  pelo colegiado) à Polícia Federal, à CGU e à PGR. O documento identifica Daniel Vorcaro como 'dono do
  Banco Master' e cita Fabiano Zettel, descrito como cunhado do banqueiro, como o maior doador individual
  em campanhas de 2022, com repasses de R$ 2 milhões a Jair Bolsonaro e R$ 3 milhões a Tarcísio de Freitas.
