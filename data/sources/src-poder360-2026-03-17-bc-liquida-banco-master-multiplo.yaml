summary: Informa que o Banco Central decretou em 17/03/2026 a conversão do Raet do Banco Master Múltiplo S.A.
  em liquidação extrajudicial e reproduz a nota da autarquia como "a íntegra da nota do BC". Segundo o
  veículo, a EFB Regimes Especiais de Empresas foi designada para conduzir a liquidação. O texto do veículo
  traz que a Will Financeira foi liquidada em 21/02/2026, data que diverge da nota do BC e do Ato 1.376
  (21/01/2026) e que o Novelo não adota.
notes: Nota do BC transcrita pelo veículo; o texto oficial em bcb.gov.br e a publicação no DOU não foram
  localizados nem verificados. Não corrobora a outra transcrição, pois ambas reproduzem a mesma nota.
