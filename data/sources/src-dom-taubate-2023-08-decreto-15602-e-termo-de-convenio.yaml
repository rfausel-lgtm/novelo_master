summary: 'Duas edições lidas pela equipe. Em 14/08/2023, despacho autoriza o credenciamento da operadora junto ao
  município, regido pelo Decreto nº 15.602/23, para viabilizar o desconto em folha de cartão consignado, no processo
  administrativo eletrônico nº 9.388/23. Em 18/08/2023, o extrato do termo de convênio registra assinatura em 17/08/2023
  e descreve o objeto como credenciamento visando à concessão de cartão consignado de benefícios, nomeando o produto
  entre parênteses: ''cartão Credcesta''.'
notes: A edição de 14/08/2023 está em https://data.queridodiario.ok.org.br/3554102/2023-08-14/b09c03cbc909fd902c62192b36a2122c62eef38f.pdf.
