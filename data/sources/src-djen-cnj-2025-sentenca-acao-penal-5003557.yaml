summary: Íntegra da sentença proferida pelo juiz Nilson Martins Lopes Júnior na ação penal movida pelo
  MPF contra cinco réus — Saul Dutra Sabbá, Alberto Maurício Caló, Benjamim Botelho de Almeida, Gustavo
  Cleto Marsiglia e Octavio Pires Vaz Filho — pelos arts. 4º, 6º e 10 da Lei 7.492/86, por fatos de novembro
  de 2014 a março de 2016 no Banco Máxima. Disponibilizada às partes em 25/04/2025 e publicada no DJEN
  em 06/05/2025. Absolve quatro réus com base no art. 386, V, do CPP e condena apenas Sabbá pelo art.
  4º da Lei 7.492/86, a três anos de reclusão em regime inicial aberto.
