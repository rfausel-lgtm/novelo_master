source_type: press
summary: 'A partir da coluna de Malu Gaspar, em O Globo, relata que o Banco Central tornou públicos os
  votos sobre a transferência de controle do Banco Máxima: em fevereiro de 2019 o diretor Sidnei Corrêa
  Marques indeferiu o pedido por falta de comprovação da origem dos recursos e da capacidade econômica
  dos pretendentes, com registro de que parcela relevante teria saído do próprio banco; o aval veio oito
  meses depois, já sob outra composição da diretoria.'
