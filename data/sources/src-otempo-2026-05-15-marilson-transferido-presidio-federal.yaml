source_type: press
summary: Registra a transferência de Marilson Roseno da Silva para presídio federal em Brasília, por determinação
  de Mendonça, sob o fundamento de que, mesmo preso, ele continuava recebendo informações sigilosas sobre
  operações policiais em curso. A decisão fala em 'rede externa ativa capaz de monitorar diligências policiais
  em curso fora do cárcere' e o descreve como 'líder operacional' do núcleo apelidado de 'A Turma'.
