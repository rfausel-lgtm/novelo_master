summary: Registra o afastamento preventivo da delegada Valéria Vieira Pereira da Silva por decisão de
  André Mendonça, com proibição de contato com outros policiais, de acesso a instalações da PF, proibição
  de deixar o país e entrega de passaporte em 24 horas. Segundo a decisão, sua conduta foi 'além da mera
  proximidade com investigados', assumindo 'relevante papel no fornecimento de informações sigilosas ao
  grupo criminoso'. Traz a negativa do advogado Bruno Correia Lemos.
