summary: 'A PF, sob o diretor-geral Andrei Rodrigues, entregou a Fachin (11-12/02/2026) relatório de cerca
  de 200 páginas sugerindo o afastamento de Toffoli, com base em três frentes: (i) o voo a Lima com Botelho,
  advogado de Bull; (ii) mensagens no celular apreendido de Vorcaro citando Toffoli, indicando possível
  relação de proximidade; (iii) a venda de participação da Maridt (empresa de Toffoli) ao fundo Arleen,
  ligado a Fabiano Zettel.'
