summary: 'Na sessão da Segunda Turma do STF de 16/06/2026, o ministro André Mendonça relatou que recebeu, por
  meio de um advogado, proposta de "delação seletiva" de Daniel Vorcaro: "Perderam o pudor. ''Queremos fazer
  uma delação seletiva''. Falaram na minha face isso" — e afirmou ter respondido "Não faço questão de delação.
  Agora, delação seletiva, comigo não". Na mesma sessão, votou pela manutenção da prisão preventiva de
  parentes de Vorcaro, dizendo que "ainda estão sendo revelados. Tem mais coisa por vir".'
