summary: Reportagem de investigação de longo formato, lida integralmente pela equipe, com base em apuração
  da Polícia Federal. Descreve a criação da Tirreno, empresa identificada pela PF como de fachada, criada
  por Daniel Vorcaro para vender ao BRB créditos por R$ 12,2 bilhões, embutindo prêmio ao banco comprador;
  o Master recebia o valor à vista do BRB sem precisar pagar a Tirreno à vista. Registra que o Banco Central
  questionou o Master em março de 2025 sobre a falta de documentação, que a resposta do banco atribuindo
  a origem dos créditos a duas associações de servidores da Bahia não se sustentou, e que CPFs de diversas
  localidades do país foram usados para simular a origem do crédito, com 130 contratos analisados aleatoriamente
  sem lastro algum.
