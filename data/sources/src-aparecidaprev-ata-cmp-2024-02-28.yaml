summary: Ata da sessão em que o conselho rejeitou, por sete votos a três, a proposta de reduzir a exigência
  de rating da política de investimentos — alteração sem a qual o Banco Master não poderia receber aplicações.
  Registra que o consultor classificou o banco em 'grau altamente especulativo' e que o diretor financeiro
  afirmou ser o Master a única instituição credenciada fora do enquadramento da política, por não constar
  da lista exaustiva. PDF sem camada de texto, submetido a reconhecimento óptico pela equipe a 300 dpi;
  os trechos citados foram conferidos visualmente. Erros residuais de OCR são possíveis em nomes próprios.
