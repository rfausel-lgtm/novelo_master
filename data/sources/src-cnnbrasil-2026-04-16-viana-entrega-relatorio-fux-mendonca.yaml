summary: Registra que o senador Carlos Viana entregou, em 16/04/2026, o texto do relator Alfredo Gaspar
  (rejeitado pelo colegiado, com proposta de 216 indiciamentos) aos ministros do STF Luiz Fux e André
  Mendonça. Segundo Viana, Mendonça informou que o material seria anexado ao inquérito já em curso na
  Corte.
