summary: Texto oficial na base de legislação municipal. Determina que a margem consignável 'fica majorada,
  adicionalmente, em mais 10% (dez por cento), exclusivamente para aquisição de bens e serviços, à vista
  ou mediante financiamento, assim como saques emergenciais por meio de Cartão de Benefício'. Ao contrário
  do desenho estadual, aqui a margem é expressamente adicional. Assinam Ricardo Nunes como prefeito e
  os secretários de Gestão, Casa Civil, Justiça e Governo Municipal. A Portaria 50/SEGES, de 25/07/2022,
  regulamenta o limite em 30% mais até 5% mais 10%.
