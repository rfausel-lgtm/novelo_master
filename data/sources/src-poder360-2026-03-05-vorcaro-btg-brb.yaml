summary: Mensagens de Vorcaro a Martha Graeff (30/03 a 04/04/2025) sugerem que Esteves tentou interferir
  na venda do Master ao BRB junto ao BC; em 04/04/2025 Vorcaro relata visita à casa de Esteves e proposta
  dele para comprar o Master ('esquecer o BRB'). À época circularam rumores de compra de ativos do Master
  pelo BTG por R$ 1, negados pela empresa.
