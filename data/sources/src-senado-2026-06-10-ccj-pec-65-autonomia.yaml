summary: Em 10/06/2026 a CCJ aprovou o substitutivo do senador Plínio Valério à PEC 65/2023, que insere
  na Constituição a autonomia técnica, operacional, administrativa, orçamentária e financeira do Banco
  Central. O primeiro signatário da proposta é o senador Vanderlan Cardoso.
