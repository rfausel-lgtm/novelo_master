summary: 'Poder Executivo, página 2, seção ''Ato do Poder Executivo'', matéria identificada sob o nº 2319731.
  Texto integral lido pela equipe e conferido, palavra por palavra, contra transcrição independente publicada
  em 31/05/2021 — as duas coincidem inclusive nos erros de concordância do original (''quantia devidas'',
  ''poderá também se efetiva''). Ressalva de classificação: não se trata do fac-símile do órgão oficial
  de imprensa fluminense, cujo módulo de consulta exige autenticação e não foi acessado. São duas reproduções
  independentes convergentes, mais citação literal parcial em acórdão do tribunal de justiça estadual.
  O ato é assinado apenas por Cláudio Castro, sem referendo de qualquer secretário, e tem origem no Processo
  SEI-150001/006360/2021.'
