summary: 'Comunicado oficial: em 09/07/2026 a PF deflagrou a 10ª fase para apurar indícios de atuação
  coordenada em redes sociais voltada, em tese, a comprometer a credibilidade da atuação do Banco Central.
  Foram cumpridos dois mandados de busca e apreensão expedidos pelo STF, em Brasília. As investigações
  apuram ainda a atuação de possível organização criminosa dedicada à intimidação de jornalistas, ao monitoramento
  ilícito de pessoas ligadas a autoridades públicas, à obtenção indevida de informações sigilosas e a
  medidas destinadas a interferir em investigações criminais.'
