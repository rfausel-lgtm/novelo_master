source_type: press
summary: Reportagem que veicula alegação de fonte anônima do mercado financeiro e publica, na íntegra,
  a nota dos advogados de Benjamim Botelho de Almeida contestando pontos do texto — entre eles a afirmação
  de que ele seria visto semanalmente na Faria Lima (ele diz ter deixado o Brasil em 2018 e retornado
  apenas três vezes em sete anos), a de que seria operador financeiro de Vorcaro nos Estados Unidos (que
  'repudia veementemente'), e afirmando que a ação penal sobre o Banco Máxima resultou em sua absolvição.
  Também reproduz decisão de Dias Toffoli de 06/01/2026 segundo a qual 'Benjamim Botelho é proprietário
  e controlador da Foco DTVM (atualmente SEFER Investimentos)'.
