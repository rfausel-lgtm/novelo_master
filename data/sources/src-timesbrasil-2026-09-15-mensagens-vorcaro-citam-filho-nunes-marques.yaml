source_type: press
summary: 'Atribui a revelação à Folha de S.Paulo. Descreve as trocas entre Vorcaro e Luiz Rennó: em 04/07/2025,
  "Esse aqui _ 500 mil mês – mantém?"; em 08/08/2025, "Dos pagamentos essenciais está faltando a Consult", seguido
  do reenvio do contato de Kevin Marques. Ressalva que as mensagens não comprovam que Kevin Marques tenha recebido
  R$ 500 mil por mês e traz a nota do advogado: não prestou serviços ao Master nem recebeu de Vorcaro; recebeu R$
  281,6 mil da Consult por serviços tributários.'
