summary: 'Registra que, em 15/06/2026, a PGR rejeitou a segunda proposta de delação de Vorcaro, apresentada
  entre 1º e 02/06/2026, por entender que não trazia elementos novos: as declarações incluíam trechos
  como ''ouvi dizer'' e não havia compromisso com valores específicos. A PF já havia chegado à mesma conclusão.
  Após a rejeição, Vorcaro reorganizou sua equipe de defesa, com o criminalista Sérgio Leonardo assumindo
  a liderança do caso.'
