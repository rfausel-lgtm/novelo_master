summary: A Procuradoria-Geral da República manifestou-se contrariamente às medidas cautelares requeridas
  na terceira fase da Operação Compliance Zero, afirmando não poder ser favorável aos pedidos nem referendá-los;
  o ministro André Mendonça decretou as prisões e as cautelares mesmo assim, registrando lamentar a posição
  do Ministério Público.
