summary: 'Edição nº 11.999, publicada no dia seguinte à liquidação extrajudicial do banco. Veda novas
  consignações e revoga a modalidade de cartão de benefício na folha estadual, preservando, porém, os
  contratos existentes. Precisão registrada porque a cobertura atribui a medida ao Decreto nº 16.690/2025:
  o ato correto é o de número 16.696, de 17/11/2025.'
