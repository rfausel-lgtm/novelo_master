summary: 'Três manifestações da PGR na Pet 16.704. A primeira (11/09, 13h31) constata que a lista de 14 processos
  com sigilo levantado por Mendonça em 10/09 não contém "grande parte dos procedimentos atualmente correlatos"
  à Compliance Zero, e pede levantamento "sem exceção". A segunda (11/09, 16h22), em resposta a despacho que
  pediu a especificação, nomeia os 17 processos omitidos: PET 16.319, 15.711, 15.771, 15.772, 15.773, 15.855,
  15.873, 15.877, 15.625, 15.676, 15.686, 15.497, 16.201, 16.210, 16.229, 16.230, 16.346 e 16.369. A terceira
  (12/09), assinada também por Gonet e dois subprocuradores-gerais, reitera o pedido de que todos os ministros
  tenham conhecimento prévio da integralidade dos dados antes do julgamento.'
notes: 'Peças obtidas via peticionamento.stf.jus.br (sessão do Rafael). A PET 15.873 já está no acervo (ver
  ciro-nogueira.yaml, lote 264) — é a petição sobre a Emenda nº 11 e a busca e apreensão contra o senador; sua
  presença nesta lista mostra que a PGR a considera correlata à Compliance Zero, além do que o acervo já
  documentava sobre ela. Os demais 16 números não foram investigados nesta coleta.'
