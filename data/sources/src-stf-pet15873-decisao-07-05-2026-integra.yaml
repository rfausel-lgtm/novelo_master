summary: 'Decisão de 07/05/2026, com código de autenticação do STF, que decreta a prisão temporária de Felipe Cançado
  Vorcaro, impõe cautelares a Ciro Nogueira, Raimundo Neto e Silva Nogueira Lima e Bernardo Rodrigues de Oliveira Filho
  e suspende as atividades de CNLF Empreendimentos Imobiliários, BRGD S.A., Green Investimentos S.A. e Green Energia
  FIP. Relata, a partir da representação da PF e com concordância do MPF: a entrega da emenda do FGC na residência do
  senador e a frase de Vorcaro "saiu exatamente como mandei"; a retirada de minutas de dois projetos de lei da casa do
  senador em novembro de 2023; a compra de 30% da Green Investimentos pela CNLF por R$ 1 milhão contra valor estimado
  em R$ 13 milhões; repasses mensais de R$ 300 mil a R$ 500 mil pela "parceria BRGD/CNLF"; e viagens, hospedagens e
  despesas custeadas.'
notes: 'Íntegra obtida por uma sessão paralela do projeto a partir de cópia publicada pelo Poder360 e lida aqui em texto
  extraído; a URL registrada é a notícia oficial do STF sobre a fase. Nomes de acompanhante e de terceiros sem imputação
  não são reproduzidos.'
