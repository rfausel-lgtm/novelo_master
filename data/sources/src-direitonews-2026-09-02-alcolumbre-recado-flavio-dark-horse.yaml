summary: 'Registra a fala de Alcolumbre em sessão do plenário do Senado, quarta-feira, 02/09/2026, em meio a cobranças
  pelo impeachment de Moraes: ''Eu vou voltar para a pauta porque senão, terei que responder muitas agressões que,
  como presidente do Senado, estou recebendo nos últimos dias. Apenas um comentário, no momento adequado eu vou
  falar, todo mundo esqueceu que pediram R$ 130 milhões para a mesma pessoa para fazer um filme. E agora o culpado
  é só o ministro Alexandre de Moraes.'' Não cita nominalmente Flávio Bolsonaro, Vorcaro ou ''Dark Horse'' — a reportagem
  interpreta a fala como recado velado, ligando o financiamento do filme ao contra-ataque contra quem pressiona
  pelo impeachment.'
