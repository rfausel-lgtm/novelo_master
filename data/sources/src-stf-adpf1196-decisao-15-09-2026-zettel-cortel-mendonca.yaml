summary: 'Decisão monocrática do relator, Min. Flávio Dino, na ADPF 1.196/SP (privatização dos serviços
  funerários e cemiteriais de São Paulo), proferida em 15/09/2026. Narra a apuração sobre Fabiano Zettel
  como ex-conselheiro da concessionária Cortel SP com uso de e-mails institucionais do Banco Master e do
  Banco Máxima; a cronologia do encontro Mendonça-Vorcaro de 14/03/2025 e do voto de Mendonça contra a
  cautelar em 04/04/2025; o irmão do Min. Mendonça na SP Regula; os contratos sem licitação do Instituto
  ITER com a Prefeitura de SP e a FDE; e determina diligências, inclusive remessa de cópia ao Min. Fachin
  para juntada nos autos que apuram a conduta do Min. Mendonça. Documento assinado digitalmente (código
  de autenticação 780F-75A7-8429-3A72), peça id 15390406836, obtido do portal público do STF (processo
  público, sem sigilo, acesso sem certificado digital).'
