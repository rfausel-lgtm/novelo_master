summary: Decisão de oito páginas, decidida em 13/01/2026 para cumprimento em 14/01/2026, que defere busca
  pessoal e apreensão de objetos contra Fabiano Campos Zettel e Nelson Sequeiros Rodriguez Tanure, prisão
  temporária e apreensão de passaporte específicas para Zettel, e determina que a Polícia Federal explique,
  em 24 horas, o descumprimento de ordem anterior de 12/01/2026.
notes: 'Peça 40 de 50 obtidas por Rafael via certificado digital no peticionamento eletrônico do STF (pasta
  local "Pet 15198-1_50") — mesma política de divulgação já aplicada às demais peças obtidas por
  certificado. O acervo já tinha o essencial deste fato via comunicado de imprensa do STF; esta é a leitura
  da íntegra da decisão. Rodapé de impressão com CPF de quem baixou o documento nunca reproduzido no
  acervo.'
