source_type: press
summary: Com registros de controle de acesso do Gabinete de Segurança Institucional obtidos por Lei de
  Acesso à Informação, documenta entradas de Daniel Vorcaro no Palácio do Planalto em 04/12/2023 às 15h42,
  01/03/2024 às 14h33 e 03/04/2024 às 17h29. A reunião de 04/12/2024 com Lula não consta nem dos registros
  de acesso nem da agenda oficial. O Planalto afirmou que aquelas entradas não corresponderam a reuniões
  com o presidente ou com ministros.
