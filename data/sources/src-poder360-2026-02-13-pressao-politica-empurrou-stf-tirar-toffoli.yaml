summary: 'Reconstitui a reunião fechada de 12/02/2026 dos dez ministros do STF (uma vaga aberta desde a saída
  de Barroso), a partir de apuração própria com diálogos atribuídos aos ministros. Placar antes da solução
  negociada: 8 a favor da permanência de Toffoli (Moraes, André Mendonça, Zanin, Dino, Gilmar Mendes, Fux,
  Nunes Marques e o próprio Toffoli) e 2 contrários (Cármen Lúcia e Fachin). Citações atribuídas: Toffoli
  disse que "não tinha nada a temer" e chamou o relatório da PF de "uma ilegalidade"; Gilmar Mendes disse
  que "o que está por trás disso é que o ministro Toffoli tomou decisões, nesse caso Master, contrárias à
  Polícia Federal. E a Polícia Federal quis retaliar"; Cármen Lúcia citou a repercussão pública ("todo taxista
  que eu pego fala mal do Supremo") mas disse ter "confiança" em Toffoli; Fux disse que Toffoli "tem
  credibilidade" com ele e que seu voto era "por ele. Ponto"; Moraes chamou a apuração da PF de "ilegal" e de
  "trabalho sujo"; Nunes Marques chamou o argumento de suspeição de "nada jurídico"; e Dino, que classificou
  as 200 páginas do relatório como "lixo jurídico" para ele, propôs a solução: uma nota assinada pelos 10
  ministros de apoio a Toffoli, em troca da qual o ministro, "num gesto de grandeza e defesa da
  institucionalidade", encaminharia o caso para redistribuição — o que resultou na nota oficial do mesmo dia e
  na redistribuição a André Mendonça.'
