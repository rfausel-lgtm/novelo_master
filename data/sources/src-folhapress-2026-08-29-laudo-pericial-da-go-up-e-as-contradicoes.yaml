summary: Descreve o laudo pericial que a produtora apresenta como prestação de contas do filme. O documento foi
  elaborado a pedido de Karina Ferreira da Gama, anexado ao processo sobre o contrato de wi-fi com a Prefeitura
  de São Paulo e produzido com base em materiais fornecidos por ela. Aponta gastos no Brasil de US$ 3.728.084,66
  entre 01/06/2025 e 04/06/2026, e afirma que a maior parte desses custos foi coberta por repasses da Go Up Entertainment
  LLC, registrada nos Estados Unidos; outra parte, de US$ 9.664.996,63, foi paga diretamente pelo braço americano.
  O custo total apurado é de US$ 13.393.081,29, equivalentes a R$ 75.182.282,80 pela taxa adotada. A perícia diz
  ter tido acesso ao contrato de investimento do Havengate Development Fund LP, fechado em 24/02/2025, cujo aporte,
  até a assinatura do laudo em 10/06/2026, somava US$ 13.393.081,29 — exatamente o custo total apurado. Afirma ausência
  de recursos públicos, incentivos ou patrocínio. Não identifica os fornecedores que receberam da produtora, não
  apresenta documento fiscal comprovando o destino dos valores, trabalha com categorias gerais de despesa e não
  discute se os valores são compatíveis com o mercado.
