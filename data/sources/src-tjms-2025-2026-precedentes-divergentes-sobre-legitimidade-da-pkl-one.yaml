summary: Conjunto de julgados levantado pela equipe. O precedente mais antigo é o conflito de competência
  1604129-98.2025.8.12.0000, julgado em 27/06/2025 pela 5ª Câmara Cível sob relatoria da desembargadora
  Jaceguara Dantas da Silva, que reproduz decisão da 2ª Vara Bancária de 21/05/2025 afirmando que 'a parte
  ré nem sequer é instituição financeira regulada pelo Banco Central do Brasil' — anterior, portanto,
  à decisão de setembro daquele ano. Em sentido oposto, o agravo 1404577-21.2026.8.12.0000, julgado em
  26/05/2026 pela 3ª Câmara Cível sob relatoria do desembargador Amaury da Silva Kuklinski, reforma a
  exclusão da empresa do polo passivo por ser ela 'administradora operacional do produto Credcesta', com
  base no Código de Defesa do Consumidor. O conflito 1603370-03.2026.8.12.0000, de 27/07/2026, ementa
  a causa como 'demanda ajuizada contra holding de instituição não-financeira'.
