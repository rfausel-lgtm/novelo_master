summary: >-
  Decisão cautelar integral (9 páginas, mais capa do PJe) no Pedido de Providências 0007917-89.2026.2.00.0000,
  requerente Advocacia-Geral da União, requerido TRF-1: suspende os efeitos de decisões da Presidência do TRF-1
  nas SLS 1010037-93.2026.4.01.0000, 1010048-25.2026.4.01.0000 e 1010055-17.2026.4.01.0000; restabelece as
  decisões de 10/09/2026 da 6ª Vara Federal Cível da SJDF; determina o cancelamento, em cinco dias, de 16
  precatórios (R$ 4.738.065.026,73) e a restituição dos valores à Conta Única do Tesouro Nacional; veda
  levantamentos e destaque de honorários até a restituição; pede informações sobre levantamento de
  R$ 16.129.427,04 em 31/07/2026 na conta do Precatório 866/2022; faculta manifestação das beneficiárias em 15
  dias; inclui o feito em pauta para referendo do Plenário. O texto não menciona o Banco Master nem Daniel
  Vorcaro.
notes: >-
  O endereço do PJe (o mesmo impresso no rodapé de cada página) foi aberto em 16/10/2026 e exibe a mensagem
  "A assinatura é válida para o documento"; a visualização do conteúdo depende de aplicativo do PJe. O texto foi
  lido na cópia em PDF hospedada pelo Poder360
  (https://static.poder360.com.br/uploads/2026/09/Decisao-Corregedor-CNJ-cautelar.pdf, sha256
  4f5a50ed391b3215ccd4c2d3b2ab59706c25fa007cfd18585ea86a551c9f3432), cujo rodapé traz o número do documento
  26092223375715800000006198038. A capa da cópia, gerada pelo PJe em 23/09/2026, marca "Segredo de justiça?
  SIM"; a capa da decisão de 28/09 marca "NÃO".
