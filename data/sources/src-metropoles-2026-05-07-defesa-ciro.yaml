summary: O advogado Antônio Carlos de Almeida Castro (Kakay) afirmou em 07/05/2026 que o senador mantinha
  'relação natural de um grande banqueiro com um senador da República' e que a busca e apreensão foi 'medida
  altamente invasiva' baseada 'somente em celulares de terceiros'.
