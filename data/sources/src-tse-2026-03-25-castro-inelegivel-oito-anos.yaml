source_type: official_court
summary: Decisão que declarou a inelegibilidade de Cláudio Castro por oito anos, por abuso de poder político
  e econômico nas eleições de 2022. O tribunal esclareceu depois que não houve cassação de diploma porque
  ele já havia renunciado ao cargo. Desde 23/03/2026 o Estado é governado interinamente pelo presidente
  do Tribunal de Justiça, desembargador Ricardo Couto.
