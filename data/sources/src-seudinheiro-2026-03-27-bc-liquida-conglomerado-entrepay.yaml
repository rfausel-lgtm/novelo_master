source_type: press
summary: Informa que o BC decretou em 27/03/2026 a liquidação extrajudicial da Entrepay Instituição de
  Pagamento, da Acqio Adquirência Instituição de Pagamento e da Octa Sociedade de Crédito Direto, reproduz a
  nota do BC sobre os motivos e a nota do Grupo Entre, que diz já conduzir um processo de descontinuação das
  operações dessas sociedades. Registra que o CEO do grupo, Antonio Carlos Freixo Júnior, foi alvo de busca em
  nova fase da Compliance Zero em janeiro.
