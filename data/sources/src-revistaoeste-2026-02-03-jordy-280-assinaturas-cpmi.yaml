summary: 'Carlos Jordy confirmou 280 assinaturas de deputados e senadores para o requerimento da CPMI do
  Master, muito acima do mínimo (171 deputados e 27 senadores), dizendo: "Muitas CPMIs sequer atingem o
  terço necessário, mas consegui muito mais do que preciso", e que nunca houve tantas assinaturas para
  abertura de uma CPMI — o recorde anterior era da CPMI dos Correios, com 223. Disse que a comissão deve
  investigar "doa a quem doer".'
