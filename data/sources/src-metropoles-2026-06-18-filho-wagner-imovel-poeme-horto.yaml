summary: Em mensagem trocada com Augusto Ferreira Lima, Jaques Wagner repassou pedido atribuído a 'um
  de seus filhos', não identificado pela reportagem, solicitando dados do proprietário formal do apartamento
  nº 1702 do empreendimento Poème Horto (Salvador, avaliado em R$ 2,45 milhões), necessários para emissão
  de Registro de Responsabilidade Técnica (RRT) — frente relacionada à suspeita de propina via imóvel,
  já mapeada no corpus, distinta da disputa acionária do BRB. Não localizada, na reportagem, posição de
  Wagner ou do filho não identificado sobre o episódio.
