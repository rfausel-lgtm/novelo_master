summary: 'Acórdão lido pela equipe, que reproduz a fundamentação da 2ª Vara Bancária em sua formulação
  completa: ''em consulta ao sítio eletrônico oficial da aludida autarquia (bcb.gov.br/meubc/encontreinstituicao),
  constata-se que a parte ré não compõe a lista de instituições financeiras''. O juízo extinguiu parcialmente
  o feito quanto à empresa, por incompetência do juízo especializado. O registro tem valor metodológico:
  o Judiciário sul-mato-grossense fez, por conta própria, a mesma consulta à base pública do Banco Central
  que a equipe realizou, e chegou ao mesmo resultado.'
