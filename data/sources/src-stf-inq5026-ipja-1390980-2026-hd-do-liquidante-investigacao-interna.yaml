summary: 'Informação de Polícia Judiciária de Análise de 66 páginas sobre um arquivo de apresentação, intitulado
  "Investigações internas – Banco Master", encontrado no HD que o liquidante do banco entregou à PF em 27/11/2025 com a
  extração do acervo digital da instituição. A apresentação descreve, entre 18/06 e 24/10/2025, extração de dados de
  clientes da base Credcesta, geração automatizada de CCBs, termos de consentimento e procurações, assinatura em lote,
  remoção de datas de termos e ajuste de comprovantes de transferência, em pastas como "Demanda BRB-Tirreno 2700
  amostras", sob supervisão de Alberto Félix. A PF conclui que as amostras documentais enviadas ao BRB para comprovar
  os créditos atribuídos à Tirreno foram fraudadas por funcionários do próprio Master.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente), juntada ao INQ 5.026 em 12/05/2026. O relatório nomeia e qualifica mais de uma
  dezena de funcionários e ex-funcionários do Master, inclusive a provável autora do arquivo segundo os metadados; como
  não há acusação formal contra eles nas peças lidas, não são nomeados no acervo, e seus endereços e CPFs não são
  reproduzidos.'
