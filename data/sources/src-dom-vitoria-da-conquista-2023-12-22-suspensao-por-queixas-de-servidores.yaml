summary: Ano 16, edição 3.603, página 13. Sob o assunto 'Suspensão de Empréstimos Consignados com a Empresa
  CREDCESTA', determina a suspensão temporária de novas operações após 'reiteradas queixas e denúncias'
  de servidores e do sindicato municipal. Assina o secretário municipal de Gestão e Inovação. É a mais
  antiga reação administrativa ao produto localizada em toda a investigação — quase dois anos antes da
  liquidação do banco, e por motivo alheio a ela.
