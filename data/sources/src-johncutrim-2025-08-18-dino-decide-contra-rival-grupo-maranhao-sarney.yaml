summary: 'Descreve a ruptura política entre Flávio Dino e Carlos Brandão (governador do MA, sucessor articulado
  por Dino em 2022) após a reeleição de Brandão, centrada na disputa por indicações ao TCE-MA — trecho
  literal: ''A decisão de Flávio Dino colocou a PF no rastro dos negócios da família de Carlos Brandão.''
  Relata reaproximação tática entre o grupo de Brandão e a família Sarney, historicamente rival política
  de Dino no estado (Dino perdeu o governo para Roseana Sarney em 2010 e venceu em 2014). Nomeia aliados
  do grupo Dino no Maranhão: Othelino Neto (Solidariedade, ex-presidente da Assembleia), a senadora Ana
  Paula Lobato (PSB, sucessora de Dino no Senado), Carlos Lula (PSB, ex-secretário de Saúde) e Márcio
  Jerry (PCdoB, deputado federal). Fonte única localizada para esse conjunto de afirmações sobre a ruptura
  política; não corroborada por outro veículo até a data desta apuração.'
