summary: 'Traz a manifestação pública de Gonet de 02/09/2026 — anterior ao despacho formal de Fachin —,
  argumentando que a investigação seria nula porque só o plenário, não ministros individualmente, pode
  julgar membros do STF: ''ao juiz não cabe acusar, menos ainda ao juiz cabe realizar investigações pré-processuais''.
  Registra 54 pedidos de impeachment contra Moraes protocolados no Senado, com expectativa de que Alcolumbre
  os rejeite, como fez com 53 pedidos anteriores. Descreve — como leitura jornalística de bastidor, não
  fato documentado — um alinhamento informal entre ministros do STF: favoráveis a Moraes (Dino, Gilmar
  Mendes, Zanin) e a Mendonça (Nunes Marques, Fux, Fachin), com Cármen Lúcia indefinida.'
