summary: 'Cobertura do mesmo achado, com a distribuição dos valores de 2024: R$ 40 milhões ao escritório Barci de
  Moraes e R$ 33 milhões ao Alves Corrêa, dentro dos R$ 215 milhões gastos com advocacia no ano. Registra que a
  orientação de pagamento partiu do diretor financeiro Ângelo Ribeiro ao superintendente executivo de Tesouraria
  Alberto Félix.'
