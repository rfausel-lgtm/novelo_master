summary: 'Sobre o mandado de segurança de Alessandro Vieira e Eduardo Girão (25/03/2026, 53 assinaturas),
  sob relatoria de Kassio Nunes Marques: ''transcorridos 125 dias desde que a ação foi movida pelos senadores,
  Nunes Marques não assinou qualquer despacho.'' Pedido de redistribuição a Mendonça, feito em abril,
  também não foi analisado.'
