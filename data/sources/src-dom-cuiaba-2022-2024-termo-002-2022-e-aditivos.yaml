summary: Três edições lidas pela equipe. Em 17/02/2022, o extrato do Termo de Credenciamento nº 002/2022 entre o
  município de Cuiabá e a operadora, com objeto de concessão de crédito por cartão magnético de benefício mediante
  consignação em folha e vigência de doze meses, assinado pela secretária municipal de Gestão; em 28/02/2023 e em
  26/04/2024, extratos de termos aditivos ao mesmo credenciamento, que mantêm o vínculo em vigor depois de abril
  de 2024.
