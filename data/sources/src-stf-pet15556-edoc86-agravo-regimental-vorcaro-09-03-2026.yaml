summary: 'Agravo Regimental protocolado em 09/03/2026 pela defesa de Daniel Vorcaro contra a decisão de 03/03/2026
  que decretou sua prisão preventiva (convertendo a medida de monitoramento eletrônico vigente desde novembro de
  2025). Argumenta ausência de contemporaneidade dos fatos citados pela PF (todos anteriores a 17/11/2025) e faz
  quatro negativas centrais: (1) nega peremptoriamente a existência de qualquer grupo de mensagens chamado ''A Turma''
  ou a participação de Vorcaro nele; (2) nega que exista bloqueio de R$ 2,24 bilhões em conta de Henrique Vorcaro,
  afirmando que o pai ''não possui tal valor a sua disposição''; (3) acusa autoridades de terem vazado à imprensa
  fotos e diálogos íntimos de Vorcaro e de terceiros sem relação com o caso, incluindo fotos dele dentro da unidade
  prisional; (4) acusa a PF de ter apresentado ''inexistentes diálogos'' entre Vorcaro e ministros do STF, com o
  objetivo de lançar suspeita sobre a própria Corte.'
notes: A negativa sobre o bloqueio de R$ 2,24 bilhões contrasta com os comprovantes de protocolamento SISBAJUD lidos
  pela equipe (lote 171, e-Doc 6), que registram bloqueio efetivamente processado na CBSF DTVM sob o CPF de Henrique
  Vorcaro — ainda que classificado como ativo de baixa liquidez, o que pode explicar, sem necessariamente contradizer,
  a alegação de que o valor não estaria 'à disposição'. A tensão entre as duas fontes primárias é registrada, não
  resolvida.
