summary: Contrato de produção datado de novembro de 2023 e assinado digitalmente por Eduardo Bolsonaro
  em 30/01/2024 traz a GoUp Entertainment (EUA) como produtora e Eduardo Bolsonaro e Mario Frias como
  produtores-executivos, com atribuições ligadas a financiamento e orçamento; Jair Bolsonaro cedeu os
  'direitos de história de vida' para o projeto então intitulado 'O Capitão do Povo'. Eduardo afirmara
  no Instagram (14/05) ter apenas cedido direitos de imagem.
