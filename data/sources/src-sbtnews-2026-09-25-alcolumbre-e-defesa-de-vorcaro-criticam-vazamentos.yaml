summary: >-
  Segundo o texto, a Veja publicou mensagens atribuídas a Daniel Vorcaro e Davi Alcolumbre, encontradas pela
  PF no celular de Vorcaro, com expressões de amizade entre os dois. Traz a nota da Presidência do Senado, que
  chama a reportagem de "injusto ataque", diz que as mensagens são de "teor pessoal" e não indicam ilegalidade
  e anuncia medidas judiciais, e a nota da defesa de Vorcaro, que critica a divulgação "seletiva e fragmentada"
  de supostas conversas privadas e questiona a cadeia de custódia do material.
