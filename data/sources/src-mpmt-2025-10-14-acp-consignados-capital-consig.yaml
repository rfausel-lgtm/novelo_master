summary: 'Ação civil pública ajuizada em 14/10/2025 na Vara Especializada em Ações Coletivas de Cuiabá,
  originada do inquérito civil SIMP nº 009467-001/2025 da 6ª Promotoria de Justiça Cível da capital, sob
  a promotora Valnice Silva dos Santos. Réus: Capital Consig SCD, ClickBank, Grupo Clickdigital, Bem Cartões
  Benefícios, Cartos SCD e ABC Card, descritos como ''uma estrutura montada para enganar o servidor''.
  CredCesta, PKL One e Banco Master não figuram no polo passivo.'
