summary: Perfil de Dario Oswaldo Garcia Júnior após o afastamento da diretoria do BRB. Segundo a matéria, em
  18 de novembro foi alvo de busca e apreensão e afastado por 60 dias por ordem judicial, foi destituído pelo
  conselho de administração do banco no dia seguinte e depôs à PF em 26 de janeiro. Traz nota do advogado
  Ricardo Borges (conduta colaborativa; funções cumpridas de forma legal; conduta decorrente de decisões
  colegiadas anteriores; o cliente seria vítima do episódio) e nota do BRB sobre o retorno ao cargo de origem.
  A matéria registra o que a PF teria apontado ao pedir o afastamento; o Novelo não reproduz essa descrição
  fora de citação atribuída.
notes: Republicação de matéria da Folhapress; a data da nota do advogado não é informada.
