summary: Reproduz, com atribuição equivalente, matéria original do Diário do Centro do Mundo sobre a mesma
  diligência de 18/06/2026 (o domínio do DCM bloqueou acesso automatizado direto). Nomeia Eduardo Mendonça
  Sodré Martins como o enteado do senador Jaques Wagner, controlador da BN Financeira Ltda. (cuja esposa
  consta como sócia), e atribui a ele, em mensagem de 04/09/2025 a Augusto Ferreira Lima, a frase 'Amanhã
  vence os boletos e são altos'. Cita R$ 3,5 milhões transferidos da PKL One à BN Financeira em 17/10/2025
  e R$ 2,34 milhões em pagamentos sob a alcunha 'Dudu' — atribuindo a origem da apuração à decisão do
  ministro André Mendonça (STF), que reproduziria investigação da PF.
