summary: Registra a prisão preventiva do agente Anderson Wander da Silva Lima, lotado na Superintendência
  Regional da PF no Rio de Janeiro, na 6ª fase da Operação Compliance Zero (14/05/2026). A PF o descreve
  como 'agente infiltrado funcionalmente na Polícia Federal em benefício da organização criminosa' e como
  'longa manus' de Marilson Roseno da Silva, tendo recebido propina por consultas em sistemas restritos.
  Procurada, sua defesa não se manifestou.
