summary: Registros da Receita Federal enviados à CPI do Crime Organizado listam transferências do Banco
  Master (2022 a 2025) a escritórios e empresas ligados a Michel Temer (R$ 10 milhões em 2025), Antônio
  Rueda (dois escritórios, R$ 6,4 milhões desde 2023), ACM Neto, Marconi Perillo, Guido Mantega (Pollaris,
  R$ 14 milhões), Fabio Wajngarten, Henrique Meirelles (R$ 18,5 milhões, consultoria macroeconômica 2024-2025)
  e Ricardo Lewandowski. Os citados afirmam que os valores correspondem a serviços prestados; a assessoria
  de Rueda não confirmou e disse que os dados foram 'vazados de forma ilícita'.
