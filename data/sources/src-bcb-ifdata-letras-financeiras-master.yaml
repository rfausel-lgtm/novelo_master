summary: Base regulatória pública do Banco Central, consultada pela equipe via a API OData do Olinda,
  que serve os mesmos dados da interface IF.data. A conta 78291, rotulada 'Letras Financeiras (c3)', permite
  montar a série trimestral do estoque por instituição. O cadastro registra o Banco Master com segmento
  prudencial S3 — exatamente o enquadramento que a Resolução CMN 4.963/2021 exige do emissor para aplicação
  de regimes próprios.
