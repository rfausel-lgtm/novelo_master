summary: '84 peças da Rcl 88.121/DF — a reclamação que fundou a competência do STF sobre a Operação Compliance Zero
  — obtidas por Rafael Fausel via peticionamento eletrônico e lidas por inteiro por esta sessão. Cobrem de 26/02
  a 25/08/2026: a redistribuição a André Mendonça, petições do BRB contra o Banco Master sobre fundos internacionais
  e sobre o Credcesta, adesão do Distrito Federal, habilitações de investigados e o incidente da Operação Encilhamento
  (São Paulo).'
