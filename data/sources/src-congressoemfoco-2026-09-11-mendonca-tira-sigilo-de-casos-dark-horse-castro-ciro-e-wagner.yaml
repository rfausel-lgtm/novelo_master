source_type: press
language: pt-BR
summary: >-
  Segundo a matéria, André Mendonça acolheu em 11/09/2026 pedido do Vice-PGR para retirar o sigilo de 18
  petições e, por iniciativa própria, abriu outros processos, entre eles a Pet 15.674, que concentra fatos
  relacionados ao senador Ciro Nogueira; cita a Pet 15.873 como a que reúne medidas cautelares de uma das
  fases da Compliance Zero. Não menciona a Pet 15.978.
notes: >-
  Atualizada às 20h35 de 11/09/2026; sem autor identificado. A matéria não afirma de forma explícita que a Pet
  15.873 teve o sigilo levantado; isso consta do despacho.
