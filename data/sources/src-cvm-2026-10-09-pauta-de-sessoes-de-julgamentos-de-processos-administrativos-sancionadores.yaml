summary: >-
  Pauta consolidada oficial da CVM, atualizada em 09/10/2026, com sessões de julgamento de processos
  administrativos sancionadores marcadas para 13/10, 20/10, 27/10 e 03/11/2026. O PAS 19957.008699/2019-01 não
  consta da pauta, e nenhum processo listado menciona Benjamim Botelho de Almeida, Sefer, Índigo ou Foco.
