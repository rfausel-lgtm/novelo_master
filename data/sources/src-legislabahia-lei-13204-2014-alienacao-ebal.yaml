summary: Texto oficial lido pela equipe. O art. 36 autoriza o Poder Executivo 'a promover a alienação
  onerosa, integral ou parcial, de sua participação no capital societário, inclusive do controle acionário,
  da Empresa Baiana de Alimentos S.A - EBAL, e/ou dos ativos, bens e direitos desta'. A autorização veio
  embutida numa lei de reforma administrativa, cuja ementa trata genericamente da estrutura organizacional
  do Executivo estadual. Sancionada por Jaques Wagner, no último mês de seu segundo mandato como governador.
