summary: Decisão de vinte páginas, com código de autenticação do STF, baixada e lida integralmente pela
  equipe. Defere medidas cautelares na investigação sobre o Banco Master, com teto de sequestro de R$
  5.775.234.097,25, 38 alvos de busca e afastamento de sigilo de 101 pessoas e entidades no período de
  20/10/2020 a 21/10/2025. Registra que a investigação nasceu de denúncia anônima enviada ao e-mail institucional
  da Polícia Federal. É nesta peça que aparece a expressão 'sócio oculto' aplicada a Nelson Tanure — dentro
  da transcrição da manifestação do procurador-geral, que por sua vez reporta o que a autoridade policial
  afirmou.
