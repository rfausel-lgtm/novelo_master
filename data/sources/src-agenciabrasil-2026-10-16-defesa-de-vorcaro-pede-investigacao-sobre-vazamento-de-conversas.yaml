language: pt-BR
summary: Relata que a defesa de Daniel Vorcaro enviou, em 16/10/2026, petição ao STF endereçada ao presidente,
  Edson Fachin, pedindo a abertura de investigação sobre o vazamento de conversas privadas ligadas ao caso
  Master; reproduz trechos literais em que a defesa fala em "processo de linchamento público", diz que as
  conversas divulgadas não podem resultar em investigações contra ele e que a "única repercussão jurídica" é
  apurar os responsáveis.
notes: "Aberta com lote:fonte em 19/10/2026 (página: publicado em 16/10/2026 às 21:18; edição de Sabrina
  Craide). Apuração própria da agência pública. A republicação do Poder360 (17/10) não é registrada como
  fonte, porque não corroboraria."
