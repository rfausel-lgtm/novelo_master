summary: 'Atribui a revelação original da viagem ao jornal O Globo, confirmada pela CNN Brasil. Cronologia:
  ida em 28/11/2025, volta em 30/11/2025, sigilo decretado por Toffoli em 02/12/2025, decisão de que o
  caso seria supervisionado pelo STF em 03/12/2025. Registra que Toffoli disse a interlocutores ter conversado
  ''só sobre futebol'' durante o voo.'
