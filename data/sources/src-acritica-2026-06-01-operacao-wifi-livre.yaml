summary: Segundo a Promotoria de Justiça do Patrimônio Público e Social da Capital, a apuração trata da
  implantação, operação e manutenção de 5 mil pontos do programa WiFi Livre SP. A SSP-SP informou que
  investiga possíveis crimes de frustração do caráter competitivo de licitação, fraude na execução de
  contrato administrativo e emprego irregular de verbas públicas. O cronograma previa 5 mil pontos até
  junho de 2025, mas apenas 3,2 mil teriam sido instalados, e foram assinados três termos aditivos em
  curto intervalo.
