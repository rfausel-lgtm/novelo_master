summary: Publica o texto do Estadão Conteúdo com título que fala em manutenção do sigilo; diz que o ministro
  manteve o caso em sigilo e ampliou o número de pessoas com acesso dentro da PF; apenas quatro peritos
  autorizados por Toffoli podiam analisar o conteúdo de celulares apreendidos; a PF estimou cerca de cem
  dispositivos e 20 semanas para um perito; novas investigações devem ser antes requeridas ao relator.
