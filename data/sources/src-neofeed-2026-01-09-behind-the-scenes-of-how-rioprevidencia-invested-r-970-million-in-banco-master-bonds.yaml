source_type: press
language: en
summary: Reconstitui, com atas e relatórios obtidos pela Lei de Acesso à Informação, as aplicações do
  Rioprevidência em títulos do Banco Master (R$ 80 milhões em 1º e 10/11/2023; R$ 970 milhões no total entre
  novembro de 2023 e julho de 2024). Descreve a reunião do Comitê de Investimentos de outubro, na qual
  Euchério Lerner Rodrigues e o suplente teriam dito que houve due diligence e análise de balanço feitas
  internamente, exceto a avaliação de rating. Informa que Euchério deixou o cargo em março do ano anterior e
  que a reportagem tentou contato com ele por vários canais, sem resposta.
notes: Versão em inglês da matéria; o endereço em português é o mesmo sem o sufixo /en/. O ano da reunião de
  outubro não é dito de forma expressa no trecho lido; decorre da sequência da matéria (aplicações até julho
  de 2024). A ata não foi aberta pelo Novelo.
