url: https://editor.amapa.gov.br/
source_type: official_gazette
summary: Edição 7.933, página 11. No mesmo despacho de habilitação de consignatárias, a PKL One Participações
  S.A. é inabilitada sob a motivação 'Não se enquadra dentre os tipos de consignatárias', enquanto o Banco
  Master S.A. é habilitado. O ato é posterior ao Decreto estadual 2.692, de 30/03/2023, que reservara
  5% da margem exclusivamente para cartão consignado de benefício.
