summary: Nota de seis páginas assinada pelos advogados de Daniel Vorcaro, em que a defesa diz ter protocolado
  na Comissão Interamericana de Direitos Humanos pedido de medida cautelar e petição individual contra o
  Estado brasileiro e expõe os argumentos e pedidos. É posição da defesa; a petição em si não foi divulgada, e
  a nota não traz documento da CIDH.
notes: Divulgada em 02/11/2026, data em que o Poder360 a publicou e linkou; o rodapé do PDF traz a data
  impressa "Brasília, 03 de novembro de 2026". O acervo registra as duas datas sem inferir a razão da
  diferença. Fonte primária do que a defesa disse; não prova o mérito das alegações.
