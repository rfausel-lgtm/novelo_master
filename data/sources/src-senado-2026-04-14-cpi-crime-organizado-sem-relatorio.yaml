summary: Em 14/04/2026 a CPI do Crime Organizado rejeitou por 6 a 4 o relatório final do senador Alessandro
  Vieira (MDB-SE), que pedia o indiciamento por crimes de responsabilidade dos ministros Dias Toffoli,
  Alexandre de Moraes e Gilmar Mendes e do PGR Paulo Gonet; a CPI, instalada em novembro de 2025, terminou
  sem texto final.
