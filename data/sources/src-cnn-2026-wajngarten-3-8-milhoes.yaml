summary: Documentos da Receita Federal encaminhados à CPI mostram que a WF Comunicação, do advogado Fabio
  Wajngarten, ex-secretário de Comunicação Social do governo Bolsonaro, recebeu ao menos R$ 3,8 milhões
  para atuar na defesa de Vorcaro. Ele confirmou à CNN que integra a equipe de defesa desde o primeiro
  semestre de 2025 e disse que o contrato tem cláusula de confidencialidade.
