kind: source
title: Corregedoria amplia medida sobre precatórios do TRF-1 e determina devolução de R$ 1,8 bilhão
publisher: Conselho Nacional de Justiça (Agência CNJ de Notícias)
author: Jéssica Vasconcelos (texto); Beatriz Borges (edição)
publication_date: '2026-09-28'
url: https://www.cnj.jus.br/corregedoria-amplia-medida-sobre-precatorios-do-trf-1-e-determina-devolucao-de-r-18-bilhao/
source_type: official_court
language: pt-BR
summary: >-
  Notícia oficial: a Corregedoria Nacional determinou em 28/09/2026 o cancelamento de mais 14 precatórios
  expedidos pelo TRF-1 antes do trânsito em julgado da fase de execução, que somam cerca de R$ 1,87 bilhão
  consideradas as datas-base; a decisão estende a cautelar anterior a três cumprimentos de sentença de três
  usinas do setor sucroalcooleiro, com origem no mesmo título; prazo de cinco dias; registra que "a medida não
  analisa se os créditos existem nem qual seria o valor devido". "Processo relacionado: PP
  0007917-89.2026.2.00.0000". Não menciona o Banco Master nem Daniel Vorcaro.
notes: >-
  A notícia chama a cautelar anterior de "decisão proferida pela Corregedoria em 23 de setembro" (data da
  divulgação); a decisão foi assinada em 22/09/2026, às 23h37.
