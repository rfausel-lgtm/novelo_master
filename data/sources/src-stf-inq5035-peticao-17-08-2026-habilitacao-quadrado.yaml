summary: 'Petição de uma página protocolada em 17/08/2026 no Inq 5.035/DF (o inquérito do "Projeto DV",
  sobre a campanha de influenciadores/dossiês a favor de Daniel Vorcaro perante STF e TCU, relatado por
  André Mendonça), em que os advogados de Maurício Antonio Quadrado requerem "a habilitação de seus
  procuradores nos autos do procedimento em epígrafe, bem como em todos os procedimentos correlatos".
  Não especifica em que qualidade Quadrado busca acesso (testemunha, terceiro interessado ou investigado),
  nem quais seriam os "procedimentos correlatos".'
notes: Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, equipe delegada). Certidão de 11/09/2026
  do mesmo inquérito trata de uma habilitação distinta (a de Daniel Vorcaro, renovada em petição de
  25/08/2026) — não confundir as duas.
