summary: Conjunto de atos localizados pela equipe. O Serviço Funerário do Município firmou com a operadora
  o Termo de Autorização para Consignação nº 01/2022, modalidade cartão benefício, assinado em 28/01/2023
  e publicado em 04/04/2023. O Hospital do Servidor Público Municipal deferiu-lhe credenciamento para
  cartão benefício em 23/03/2023 e, dois anos depois, novo credenciamento para empréstimo consignado,
  em 24/03/2025. O mesmo hospital deferiu credenciamento ao Banco Master em 23/04/2025 — sete meses antes
  da liquidação. E o termo de adesão do próprio banco com a secretaria municipal, de 2020, foi aditado
  em 20/10/2023. Para nenhum desses instrumentos foi localizado ato de revogação. Registre-se ainda a
  ata da sessão do conselho deliberativo do instituto de previdência municipal de 21/01/2026, publicada
  em 12/02/2026, em que se questionam os descontos e a administração responde que 'os valores das parcelas
  estão sendo descontados corretamente e depositados na conta responsável pela organização financeira,
  enquanto a situação judicial do banco é regularizada'.
