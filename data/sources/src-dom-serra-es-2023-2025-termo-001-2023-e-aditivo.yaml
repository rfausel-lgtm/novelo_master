summary: Duas edições lidas pela equipe. Em 07/08/2023, o extrato do Termo de Credenciamento nº 001/2023 entre o
  município da Serra, por sua Secretaria Municipal de Gestão e Planejamento, na qualidade de consignante, e a operadora,
  na qualidade de consignatária, no processo nº 29179/2023; em 27/06/2025, o extrato do primeiro aditivo ao mesmo
  termo, que mantém o vínculo depois da metade de 2025.
notes: A edição de 07/08/2023 está em https://data.queridodiario.ok.org.br/3205002/2023-08-07/28d3a7e18c8bb8951643c84789404960ca68223a.pdf.
