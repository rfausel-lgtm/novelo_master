source_type: press
summary: Segundo O Estado de S. Paulo, diálogos obtidos pela PF mostram Vorcaro cobrando de Fabiano Zettel
  aportes ao resort Tayayá (maio e agosto de 2024), com lista de pagamentos 'Tayaya – 15' (R$ 15 milhões,
  segundo a PF) e transferências autorizadas de R$ 35 milhões; a Maridt, empresa da família Toffoli, era
  sócia do resort. Toffoli disse que a Maridt deixou o negócio em fevereiro de 2025 e negou ter recebido
  valores.
