summary: Ano 90, edição nº 15.438, páginas 3 e 4. Assinado pela governadora Fátima Bezerra. Cria o inciso
  IX do art. 5º, admitindo consignação para operações de financiamento e contratação de bens e serviços
  por cartão de benefício consignado 'ou à utilização com a finalidade de saque', e fixa no art. 15 a
  reserva de 10% das vantagens permanentes para essa espécie. O ato é dez meses posterior ao credenciamento
  da empresa no estado, o que inverte a sequência observada na Bahia.
