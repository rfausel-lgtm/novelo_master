summary: Texto conferido integralmente pela equipe para aferir o enquadramento correto. O §7º do art.
  44 dispõe que 'quaisquer pessoas físicas ou jurídicas que atuem como instituição financeira, sem estar
  devidamente autorizadas pelo Banco Central do Brasil, ficam sujeitas à multa referida neste artigo e
  detenção de 1 a 2 anos, ficando a esta sujeitos, quando pessoa jurídica, seus diretores e administradores'.
  A lei pune, portanto, atuar como instituição financeira sem autorização — e não contém vedação textual
  ao uso da expressão 'Banco' na denominação social, matéria remetida a normas infralegais que não foram
  verificadas nesta apuração.
