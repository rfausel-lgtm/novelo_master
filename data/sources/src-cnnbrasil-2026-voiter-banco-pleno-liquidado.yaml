summary: Reportagem sobre a trajetória do Banco Voiter, incorporado ao conglomerado Master no início de
  2024, vendido em julho de 2025 a Augusto Ferreira Lima — ex-sócio de Vorcaro no Master, sócio até maio
  de 2024 — passando a se chamar Banco Pleno, e liquidado por ato próprio do Banco Central em 18/02/2026,
  por deterioração de risco e liquidez, sem relação formal declarada com o esquema do Master.
