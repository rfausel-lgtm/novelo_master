source_type: press
summary: Registra que, na noite de 03/09/2026, Moraes pediu formalmente a Fachin a abertura de apuração
  contra Mendonça por 'abuso de autoridade, improbidade administrativa e crime de responsabilidade' na
  condução dos casos Master e INSS. Em 04/09, às 10h01, Fachin separou o pedido do inquérito das fake
  news, avocou-o para sua própria relatoria e determinou que a PGR se manifeste em cinco dias úteis sobre
  a admissibilidade e regularidade do procedimento adotado por Moraes; Mendonça terá mais cinco dias úteis
  após isso para se manifestar.
