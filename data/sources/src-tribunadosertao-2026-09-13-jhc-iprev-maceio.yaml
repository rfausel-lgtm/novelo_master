source_type: press
summary: 'João Henrique Caldas (JHC), ex-prefeito de Maceió e candidato ao governo de Alagoas pelo PSDB, é
  identificado como estando "no centro" da investigação sobre os R$ 97 milhões que o Iprev de Maceió aportou
  no Banco Master (R$ 80 milhões em 06/12/2023 e R$ 17 milhões em 13/05/2024, já documentados no acervo). Um
  juiz federal registrou que JHC figurava como "responsável legal da unidade gestora perante o Ministério da
  Previdência Social" e tinha autoridade para nomear/exonerar a cúpula do Iprev. O artigo não afirma que JHC
  é formalmente investigado criminalmente — a decisão judicial foi remetida ao STF para análise de
  competência, e "responsabilidades individuais e eventuais ilícitos permanecem sujeitos à apuração".'
notes: Verificado por WebFetch direto. Não confirmada, nesta reportagem, a relação temporal entre os aportes
  e a data de credenciamento do Master junto ao Ministério da Previdência — não incluir essa alegação sem
  fonte primária.
