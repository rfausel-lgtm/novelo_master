summary: O PL 1882/2025, enviado pelo Executivo distrital em regime de urgência, foi aprovado em 19/08/2025
  com 14 votos favoráveis e 7 contrários, em dois turnos, autorizando o BRB a adquirir 49% das ações ordinárias
  e 100% das preferenciais do Banco Master; substitutivo do PT retirou autorizações genéricas. Antes da
  sessão, os deputados se reuniram a portas fechadas com Paulo Henrique Costa, presidente do BRB; deputados
  de oposição criticaram a operação.
