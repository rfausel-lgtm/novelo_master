summary: 'A Operação ''Moral Hazard'' da PF (23/04/2026) cumpriu seis mandados de busca em Santo Antônio
  de Posse e Mogi Mirim (9ª Vara Federal de Campinas), com afastamento de função pública e indisponibilidade
  de bens dos investigados: Hortêncio Lala Neto (ex-diretor-presidente do Iprem-Posse), Marlene Maria
  Vieira Bassani (ex-supervisora de gestão), e os integrantes do comitê de investimentos Hélio Augusto
  Moraes, Maria de Lourdes Villalva e Tatiana Felix dos Reis. O instituto também aplicou R$ 16 milhões
  em fundo imobiliário Golden Tulip (Belo Horizonte), fora do escopo Master.'
