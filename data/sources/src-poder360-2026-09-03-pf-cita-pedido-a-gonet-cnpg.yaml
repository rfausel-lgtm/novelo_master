summary: 'Identifica, a partir da seção 6.1 do IPJ-A 3298613/2026, os nomes que o laudo da PF não confirma
  com certeza: Jarbas Soares Júnior (então procurador-geral de Justiça de Minas Gerais) e Georges Seigneur
  (MPDFT), candidatos à presidência do CNPG em 2024. Poder360 procurou Gonet, Ciro Soares e Jarbas Soares
  Júnior; nenhum respondeu até a publicação.'
