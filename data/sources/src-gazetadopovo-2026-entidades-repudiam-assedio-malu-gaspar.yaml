summary: Em 02/07/2026, Abraji e ANJ publicaram notas de repúdio; a ANJ classificou a conduta como 'métodos
  mafiosos' e pediu apuração sobre o acesso aos dados da jornalista. O Globo repudiou em nota 'a devassa
  determinada pelo acusado na vida da colunista Malu Gaspar', classificando-a como tentativa explícita
  de silenciar a imprensa.
