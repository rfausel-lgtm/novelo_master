source_type: press
language: pt-BR
summary: >-
  Relatório da PF enviado ao STF em 28/09/2026 e com sigilo levantado em 09/10 afirma, segundo a matéria, que
  Ibaneis Rocha, como acionista controlador, "não se limitou ao exercício regular de suas prerrogativas
  institucionais"; descreve o aumento de capital de R$ 750 milhões, a validação de decisões e reunião em
  Zurique em 23/01/2025; traz a nota da defesa (Antônio Carlos de Almeida Castro, Kakay). Não nomeia a PET nem
  o ministro que levantou o sigilo; informa não haver manifestação da defesa de Paulo Henrique Costa.
notes: >-
  Matéria atualizada em 10/10/2026. A manchete usa a expressão "interferência direta"; o corpo atribui ao
  relatório a formulação "interferência política direta na condução da instituição financeira pública". Por
  cautela, nenhuma das duas é usada como proposição. A nota da defesa diz que o nome de Ibaneis "somente é
  mencionado pela Polícia Federal em quatro oportunidades". Reconferida pelo editor em 16/10/2026.
