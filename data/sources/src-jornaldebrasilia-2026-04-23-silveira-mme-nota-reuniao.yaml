title: Conversas indicam que Vorcaro recebeu em casa ministro Silveira e empresário da mineração
publisher: Jornal de Brasília
publication_date: '2026-04-23'
url: https://jornaldebrasilia.com.br/noticias/economia/conversas-indicam-que-vorcaro-recebeu-em-casa-ministro-silveira-e-empresario-da-mineracao/
source_type: press
summary: 'Reportagem relata que, em ligação telefônica na noite de 27 de outubro, Vorcaro disse à namorada
  estar recebendo em casa um ministro e "Duda" (Eduardo Wanderley) — sem que a reunião esteja confirmada
  por outra fonte; é o que Vorcaro afirmou à namorada, não um fato estabelecido. O Ministério de Minas e
  Energia, em nota, negou qualquer irregularidade: "O ministro Alexandre Silveira rechaça, de forma
  categórica, quaisquer ilações que associem agendas institucionais ou compromissos pessoais a interesses
  indevidos", afirmando que ele mantém interações com agentes públicos e privados dentro da normalidade
  institucional, sem favorecimento. A defesa de Vorcaro se recusou a comentar, classificando a informação
  como oriunda de "vazamentos ilegais de material sigiloso". Eduardo Wanderley não respondeu.'
