summary: Autos da petição autuada em 11/06/2026 a partir do Ofício 2368199/2026 da PF (Inq 5.026 e Pet 16.032),
  com a decisão de constrição, agravos e pedidos das defesas, manifestações da PGR, respostas de instituições e
  cartórios e documentos juntados pelas partes — entre eles, pela defesa de Jaques Wagner, a carta-proposta do City
  Football Group de 27/02/2025, a comunicação do adiantamento pago pela EC Bahia SAF e as escrituras de venda e
  de novação do terreno de Camaçari, lavradas em 18/05/2026.
notes: Peças obtidas pelo editor no peticionamento eletrônico do STF; o processo consta com partes e decisões em
  consulta pública no portal. Dados pessoais das peças (documentos, endereços, contas) não são reproduzidos.
