summary: Peça parlamentar que pede acareação entre Eugênio de Souza Kruschewsky (procurador do Estado
  da Bahia), André Kruschewsky Lima (diretor do Banco Master) e Luia Kruschewsky Monteiro (gerente jurídica
  da Ebal), além de Relatório de Inteligência Financeira do Coaf sobre os três. Descreve André como 'primo
  e então sócio' de Eugênio e os trata como 'parentes' — afirmações de autoria parlamentar, não confirmadas
  por documento civil.
