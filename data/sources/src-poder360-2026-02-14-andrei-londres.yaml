summary: A PF citou a participação de Toffoli no 1º Fórum Jurídico Brasil de Ideias (Londres, 24 a 26/04/2024,
  patrocinado pelo Master) no pedido de suspeição do então relator; Andrei Rodrigues, diretor-geral da
  PF, também participou, hospedado no Peninsula London. A PF não respondeu sobre quem pagou sua viagem.
