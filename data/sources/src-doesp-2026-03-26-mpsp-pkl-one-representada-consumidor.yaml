summary: Relatório publicado nos termos do art. 108 da Resolução 1342/2021-CPJ, cobrindo o período de
  17 a 23/03/2026, área consumidor. Registra o procedimento nº 0726.0000657/2025, do município de São
  Paulo, com o Banco Master como reclamado e a PKL One Participações S.A. como representada, sob a ementa
  'irregularidade no atendimento'. É procedimento de consumidor, não de improbidade nem sobre o credenciamento
  — e o único do Ministério Público paulista com a empresa nominada localizado em fonte oficial.
