summary: Despacho que desfaz a designação da sessão de 23/09/2026. Registra a questão de ordem pendente de vista
  na PET 16.662 e conclui que, pela relação direta dos pontos nela contidos com o julgamento da PET 16.704 — 'abarcando
  questionamento sobre a regularidade da própria relatoria' —, a inclusão em pauta 'será oportunamente redesignada'.
  Não fixa nova data.
