summary: 'Comunicado ao mercado, nos termos do art. 157, §4º da Lei das S.A. e da Resolução CVM nº 44/2021:
  o Conselho de Administração aprovou por unanimidade, em 28/03/2025, a celebração do contrato de compra
  e venda de ações com os controladores do Banco Master, para aquisição de 49% das ações ordinárias, 100%
  das preferenciais e 58% do capital total, sujeita à aprovação do Banco Central, do Cade e demais aprovações
  regulatórias. O objetivo declarado era incorporar o Master ao conglomerado prudencial do BRB.'
