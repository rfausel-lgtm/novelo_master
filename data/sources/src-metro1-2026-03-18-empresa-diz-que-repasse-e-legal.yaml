source_type: press
summary: 'Traz a nota da empresa, por seu sócio e advogado Moisés Dantas dos Santos: o serviço prestado
  ''não foi de consultoria, mas de prospecção e indicação, em caráter de exclusividade, de operações e
  convênios de crédito consignado''; os serviços foram prestados de 2022 a 2025; e ''todos os recursos
  recebidos pela BN Financeira se deram de forma oficial, contabilizada e mediante emissão de nota fiscal,
  distribuídos formalmente aos sócios'' e declarados à Receita, ''inexistindo pagamentos não justificados
  a terceiros''.'
