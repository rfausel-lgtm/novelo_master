summary: 'Documento oficial publicado pela secretaria catarinense. Ao final traz aviso dirigido aos servidores:
  ''Em caso de dúvidas referentes ao Cartão Consignado de Benefícios do CREDCESTA (PKL ONE) ou da METTACARD,
  por favor, entre em contato com a Gerência de Gestão dos Consignados''. A empresa não figura entre as
  consignatárias ativas listadas no mesmo arquivo, aparecendo apenas nessa nota de contingência — o que
  indica que já havia sido retirada da relação ativa, sem que a data de sua entrada tenha sido localizada.'
