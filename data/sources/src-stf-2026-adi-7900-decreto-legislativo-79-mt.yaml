summary: 'Ação direta de inconstitucionalidade (número único 0122902-89.2025.1.00.0000) proposta pela
  Confederação Nacional do Sistema Financeiro contra o Decreto Legislativo nº 79/2025 da Assembleia Legislativa
  de Mato Grosso, que suspendia por até 120 dias os efeitos de contratos de cartão consignado e de cartão
  consignado de benefício acima de 35% da remuneração líquida e determinava que força-tarefa estadual
  analisasse os credenciamentos das consignatárias, inclusive quanto à ''eventual descaracterização da
  natureza da operação financeira''. Relator: ministro André Mendonça, que concedeu cautelar em 11/12/2025
  suspendendo a eficácia da norma, com manifestação técnica do Banco Central invocada. O Plenário julgou
  o mérito procedente por unanimidade em abril de 2026, com acórdão publicado em 08/05/2026 e trânsito
  em julgado em 18/05/2026, por usurpação da competência privativa da União para legislar sobre direito
  civil e política de crédito.'
