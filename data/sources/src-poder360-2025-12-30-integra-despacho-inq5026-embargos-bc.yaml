summary: 'Íntegra, hospedada pelo Poder360, do despacho de Toffoli no INQ 5.026/DF, datado de "Brasília, 27 de
  dezembro de 2025": deixa de conhecer dos embargos de declaração opostos pelo Banco Central e por seu diretor
  de Fiscalização, por não serem investigados; afirma que a participação da autoridade reguladora nos
  depoimentos e acareações é "de especial relevância"; justifica a urgência das oitivas; determina os atos
  "sob a condução da autoridade policial competente, com organização pelo juiz auxiliar deste gabinete";
  mantém o sigilo dos autos.'
notes: Aberta com lote:fonte em 23/10/2026 (PDF de duas páginas, texto extraído com pdftotext; sha256 do
  arquivo 1d2a87e6a01c5bea...). Link de leitura da íntegra da decisão da reportagem do Poder360 de 30/12/2025. É
  cópia reproduzida por veículo, não URL oficial do STF, e o portal do STF devolve só a casca da página; por
  isso o despacho não ganha documento próprio e a evidência é C (cópia + Agência Brasil, que cita o mesmo
  trecho), não D. A peça não traz marca de sigilo no corpo, só nas partes ("SOB SIGILO").
