summary: Informa que a 2ª fase da Operação Compliance Zero começou na manhã de 14/01/2026, com 42 mandados de
  busca e apreensão em cinco estados, a prisão temporária de Fabiano Zettel por ordem de Toffoli e Nelson
  Tanure entre os alvos. Atribui à PF o inventário das apreensões (39 celulares, 31 computadores, 30 armas, 23
  veículos avaliados em R$ 16 milhões e R$ 645 mil em espécie), a estimativa de bens e valores acima de R$ 5,7
  bilhões e a ordem do STF de bloquear R$ 24 milhões em contas. Reproduz ainda a crítica da associação dos
  peritos criminais federais à custódia do material e a nota do gabinete de Toffoli.
