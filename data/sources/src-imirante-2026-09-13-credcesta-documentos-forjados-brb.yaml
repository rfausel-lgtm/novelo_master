source_type: press
summary: 'Relatório da PF, tornado público na quebra de sigilo recente, aponta que o Banco Master fabricava
  em escala procurações, cédulas de crédito (CCBs) e outra documentação usando dados de clientes do programa
  CredCesta, com ferramentas de automação de escritório gerando milhares de documentos em lote. A PF
  documentou manipulação digital sistemática — remoção de datas e exclusão de horários de assinaturas
  eletrônicas — para dificultar a rastreabilidade da fraude. Os documentos fabricados eram usados como
  lastro documental para legitimar transações bilionárias com o Banco de Brasília (BRB). O esquema foi
  descoberto por meio de apresentação institucional apreendida e perícia em dispositivos digitais recuperados,
  que continham discussões internas explícitas sobre a manipulação.'
