summary: 'Detalha as multas individuais aplicadas na sessão de 08/09/2026, com base no processo administrativo
  e na sessão de julgamento (ambos hospedados pelo veículo): Daniel Vorcaro R$ 20 milhões; Henrique Vorcaro
  (pai) R$ 20 milhões; Banco Master R$ 12,5 milhões; Entre Investimentos R$ 10 milhões; Antônio Carlos
  Freixo Júnior R$ 5 milhões; Felipe Vorcaro (primo) R$ 5 milhões; Sefer Investimentos R$ 1,3 milhão;
  outros 4 envolvidos R$ 120 mil cada — total de R$ 201,5 milhões. Registra que cinco executivos e empresas
  foram absolvidos das acusações de fraude, que os termos de compromisso propostos (Vorcaro/Master R$
  10,89 milhões; Viking R$ 2,97 milhões; Entre R$ 4,95 milhões; Freixo R$ 2,47 milhões) foram todos rejeitados,
  e que a advogada de Vorcaro, Ana Paula Casagrande, questionou na sessão a falta de provas individualizadas
  de dolo na conduta do empresário.'
