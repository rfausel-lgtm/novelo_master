source_type: press
summary: 'Reconstitui a trajetória patrimonial de Vorcaro a partir de documentos da Receita Federal, PF,
  Banco Central, CVM e MPF: dos R$ 2,8 milhões declarados à Receita em 2015, sua fortuna chegaria a R$
  2,64 bilhões em 2025. Registra que aos 19 anos ele administrava uma editora de livros didáticos do pai,
  vendida por divergências gerenciais, e que antes do banco houve um hotel de luxo para a Copa de 2014,
  empreendimento de R$ 200 milhões que não deu certo.'
