summary: 'Página pública do MS 40.791 (Rodrigo Sobral Rollemberg contra o presidente da Câmara dos Deputados), lida em
  12/09/2026. Registra protocolo em 09/03/2026, autuação em 10/03, distribuição ao ministro Dias Toffoli em 11/03,
  decisão monocrática dele no mesmo dia ("convertido em diligência"), remessa à Presidência e certidão de redistribuição
  de 11/03/2026 ao ministro Cristiano Zanin com a anotação "Impedido(a): MIN. DIAS TOFFOLI", nos termos do art. 67, §
  3º, do RISTF; Zanin negou seguimento ao mandado de segurança em 12/03/2026.'
notes: 'Consulta direta ao portal público, sem autenticação. A íntegra da decisão de Toffoli de 11/03 não foi lida; a
  qualificação do motivo como foro íntimo vem da notícia oficial do STF de 20/03/2026
  (src-stf-2026-03-20-segunda-turma-mantem-prisao).'
