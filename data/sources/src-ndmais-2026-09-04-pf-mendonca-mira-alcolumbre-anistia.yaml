title: 'Mendonça vê Alcolumbre como ''alvo estratégico'' e busca ampliar poder no STF para viabilizar anistia
  a golpistas, diz PF a Moraes'
publisher: ND Mais
author: Vinicios Souza
publication_date: '2026-09-04'
