url: https://ndmais.com.br/justica/mendonca-ve-alcolumbre-como-alvo-estrategico-e-busca-ampliar-poder-no-stf-para-viabilizar-anistia-a-golpistas-diz-pf-a-moraes/
source_type: press
summary: 'Reproduz um trecho do mesmo relatório de inteligência da PF citado na decisão de Moraes de
  03/09/2026 (já no acervo, ev-pf-alcolumbre-alvo-estrategico-rota-de-acesso-rueda) que não constava da
  cobertura anterior: a PF avalia que o "aumento de poder" de Mendonça no STF mirado por meio de Alcolumbre
  se explicaria "provavelmente considerando o aumento das chances de que uma anistia ampla dos crimes
  cometidos no contexto da recente tentativa de golpe de Estado acabe sendo avalizada no Tribunal" — ou seja,
  a PF liga a hipótese de perseguição a Alcolumbre não só ao controle da pauta de impeachment, mas a uma
  possível anistia aos condenados dos atos de 8 de janeiro de 2023, que passaria a depender de uma composição
  favorável do STF. Trecho confirmado verbatim no corpo da matéria, não apenas na manchete.'
