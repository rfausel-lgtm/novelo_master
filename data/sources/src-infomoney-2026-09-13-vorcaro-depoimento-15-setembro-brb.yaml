source_type: press
summary: 'A Polícia Federal marcou depoimento de Daniel Vorcaro para 15/09/2026 — o mesmo dia da sessão
  extraordinária do STF que julga a Pet 16.662 (se Moraes deve ser investigado por suas comunicações com
  Vorcaro) — sobre irregularidades envolvendo o Banco Master e fraudes em operações com o BRB. A oitiva já
  havia sido marcada para o fim de agosto de 2026, mas foi adiada a pedido da defesa; um novo pedido de
  adiamento é esperado, com a alegação de que os advogados não tiveram acesso integral aos documentos
  tornados públicos em 11/09/2026. A reportagem não especifica o número do inquérito/processo.'
notes: Verificado diretamente via WebFetch (não apenas resumo de busca). Não localizado, nesta coleta, o
  número do inquérito ao qual esse depoimento pertence — provavelmente ligado ao Inq 5.026 (Compliance
  Zero/BRB), mas não confirmado.
