title: Viagens de Ciro Nogueira a NY, Lisboa e Courchevel bancadas por Vorcaro custaram R$ 468 mil, diz PF
publisher: Agência O Globo (republicada pela Folha de Pernambuco)
publication_date: '2026-06-16'
url: https://www.folhape.com.br/politica/viagens-de-ciro-nogueira-a-ny-lisboa-e-courchevel-bancadas-por/494388/
source_type: wire
language: pt-BR
summary: >-
  Segundo a matéria, a PF estima em R$ 468.721,78 o "benefício econômico direto" do senador Ciro Nogueira em
  viagens e jantares pagos por Daniel Vorcaro; em Lisboa, cinco diárias em suíte júnior do Four Seasons
  reservadas para Ciro em junho de 2024 custaram R$ 91.280,59, cerca de R$ 18.256,12 por dia; e os
  investigadores indicaram "cautela" ao considerar referências a "Ciro" em listas de pagamentos e diálogos,
  pela possibilidade de homônimo.
