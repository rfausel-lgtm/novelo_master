summary: 'Três comunicações oficiais da cautelar movida pelo Estado do Rio de Janeiro e pelo Rioprevidência contra o
  Banco Master: distribuição à 2ª Vara da Fazenda Pública da Capital em 04/12/2025 (disponibilizada em
  12/12/2025); decisão de 10/03/2026 — "Na forma do artigo 109, I, da CR/88 c/c a súmula 150 do STJ, declino da
  competência para a Justiça Federal"; e decisão de 11/03/2026 em embargos de declaração, que integra o declínio
  para "MANTER os efeitos da tutela deferida, haja vista o potencial efeito lesivo aos cofres públicos de sua
  revogação", remetendo os autos com urgência.'
notes: Consultado por esta sessão diretamente na API pública do DJEN, a partir de levantamento de pesquisa delegada.
  A petição do Banco Central que o acervo associava à mudança de competência não gerou comunicação no DJEN e não
  foi lida; a decisão de declínio não menciona o Banco Central.
