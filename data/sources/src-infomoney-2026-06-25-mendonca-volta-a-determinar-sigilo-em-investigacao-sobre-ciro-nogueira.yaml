summary: >-
  Segundo a matéria, André Mendonça restabeleceu, em despacho de "quarta-feira", o sigilo dos procedimentos
  em que foram decretadas as prisões de Henrique e Felipe Vorcaro, que envolvem também o senador Ciro
  Nogueira, depois de tê-lo levantado para o julgamento das prisões na Segunda Turma, para prosseguimento das
  investigações. Não cita número de Pet.
