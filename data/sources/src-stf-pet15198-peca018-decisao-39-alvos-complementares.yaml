summary: Decisão de seis páginas encampando pedido complementar do PGR, que por sua vez encampa
  manifestação da Procuradoria da República em São Paulo, com lista de 39 alvos de busca e apreensão (34
  pessoas físicas e 5 pessoas jurídicas), endereços indicados pela autoridade policial no bojo do pedido de
  prisão preventiva n. 5009071-26.2025.4.03.6181. Defere parcialmente, excluindo três alvos já alcançados
  por diligências anteriores.
notes: 'Peça 18 de 50 obtidas por Rafael via certificado digital no peticionamento eletrônico do STF (pasta
  local "Pet 15198-1_50") — mesma política de divulgação já aplicada às demais peças obtidas por
  certificado. Rodapé de impressão com CPF de quem baixou o documento nunca reproduzido no acervo.'
