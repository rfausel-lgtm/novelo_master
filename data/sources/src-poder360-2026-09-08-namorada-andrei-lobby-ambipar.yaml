summary: 'Com base em registros do e-Agendas (CGU), mostra Renata Varandas em quatro reuniões federais
  em 2026 (25/02, 17/03, 08/05, 20/07) representando a Ambipar — em três delas constando como ''Diretora
  de Relações Governamentais'' da empresa. Detalha as reuniões: com o ministro Silvio Costa Filho (Portos
  e Aeroportos) e com o então presidente do Ibama, Rodrigo Agostinho, sobre a resolução 398 do Conama;
  com o ministro Alexandre Silveira (Minas e Energia), com executivos da PowerChina presentes; e com o
  procurador-geral adjunto do Banco Central, Erasto Villa Verde de Carvalho Filho, sobre ''assuntos institucionais''
  da Ambipar. Explica que a Ambipar é investigada na Compliance Zero por um mecanismo distinto do já conhecido
  (Texas I FIA/Rioprevidência): venda de títulos de crédito ''podres'' do Master ao BRB, com busca e apreensão
  na residência da então vice-diretora da Ambipar, Luciana Freire Barca Nascimento, em 14/01/2026 (2ª
  fase da operação). O Poder360 procurou Renata Varandas via WhatsApp perguntando a natureza do vínculo,
  os serviços prestados e se Andrei tinha conhecimento — sem resposta até a publicação. Não há manifestação
  da Ambipar nem de Andrei Rodrigues.'
