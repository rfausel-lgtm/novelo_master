summary: 'Documento do próprio operador que descreve o incentivo comercial na ponta. Informa que a contratação
  pode ser feita ''diretamente com seu correspondente bancário'' e distingue os dois seguros oferecidos:
  o seguro de vida ''não é passível de remuneração para o Correspondente'', ao passo que o seguro prestamista
  ''é passível de comissão para o Correspondente'', com ativação no momento da contratação. Registra ainda
  que o cartão opera com bandeira Visa e que ''não está disponível efetuar ou receber portabilidade de
  outras instituições''.'
