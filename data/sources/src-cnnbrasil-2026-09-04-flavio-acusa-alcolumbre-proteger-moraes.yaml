summary: 'Registra declarações do senador e candidato à Presidência Flávio Bolsonaro (PL), em ato de campanha em
  São Carlos (SP), 04/09/2026: ''Eu acho que ele se equivocou ao querer proteger um amigo, ao invés de proteger
  a instituição'' e ''Eu, infelizmente, vejo que o Davi Alcolumbre está muito preocupado, assim como o Alexandre
  de Moraes, com a sua autoproteção.'' Alega, sem apresentar prova, que um encontro entre Alcolumbre e Moraes na
  terça-feira anterior precedeu ações coordenadas com o ministro Flávio Dino contra sua candidatura.'
