summary: Relata que Vorcaro assinou na noite de 19/03/2026 o termo de confidencialidade que formaliza o início
  das tratativas para uma eventual delação, conforme diretrizes da PGR e da PF; diz que a expectativa dos
  advogados dele era concluir o processo, inclusive a homologação, em até 15 dias, e que o teor e o escopo da
  colaboração seguiam sob sigilo; registra a transferência dele para a Superintendência da PF por determinação
  de Mendonça. Não traz conteúdo de colaboração.
