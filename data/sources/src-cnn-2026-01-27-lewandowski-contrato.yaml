summary: Segundo integrantes do governo, o contrato do escritório de Ricardo Lewandowski com o Banco Master
  foi um dos motivos que apressaram sua saída do Ministério da Justiça (10/01/2026); o escritório seguiu
  sob comando de sua mulher e filho e manteve o contrato após a posse. Em nota, Lewandowski confirmou
  a prestação de serviços ao Master, disse ter se retirado do escritório e suspendido o registro na OAB
  ao assumir o ministério em janeiro de 2024, e atribuiu a saída a motivos pessoais.
