source_type: press
summary: Celso Vilardi assume a defesa de Fabiano Zettel em 25/03/2026, em coordenação com José Luis de
  Oliveira Lima ('Juca'), defensor de Daniel Vorcaro. Os advogados anteriores, Maurício Campos e Juliano
  Brasileiro, deixaram a defesa alegando motivos de foro íntimo, após divergência sobre a possibilidade
  de colaboração premiada.
