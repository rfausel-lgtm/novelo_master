summary: 'Decreto que estrutura o Programa Credicesta como plataforma de consignação. Texto integral extraído
  e conferido pela equipe. Art. 2º: linha de crédito pré-aprovado com margem de consignação de 30% da
  remuneração líquida. Art. 3º: assegura ao detentor dos direitos de exploração comercial do cartão ''modificar,
  ampliar, aperfeiçoar ou diversificar as funcionalidades'', podendo associar ''a contratação de serviços,
  inclusive comerciais, creditícios, financeiros, securitários e congêneres''. Art. 12: ''O Estado não
  incorrerá em qualquer custo ou despesa em razão da implementação do Programa Credicesta.'' Assinado
  por Rui Costa, Bruno Dauster (Casa Civil) e Edelvino da Silva Góes Filho (SAEB).'
