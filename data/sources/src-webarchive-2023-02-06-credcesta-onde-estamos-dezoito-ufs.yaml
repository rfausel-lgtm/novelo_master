summary: Captura intermediária que completa a série de cobertura. Traz dezoito unidades da federação mais
  a entrada federal, acrescentando ao conjunto de maio de 2022 os estados de ES, MG, MT, PB, RO e SP.
  A série assim reconstruída — doze em maio de 2022, dezoito em fevereiro de 2023, vinte e uma em fevereiro
  de 2024 — é compatível com os números declarados nos balanços do banco para os fechamentos de exercício,
  de vinte em 2023 e vinte e quatro em 2024.
