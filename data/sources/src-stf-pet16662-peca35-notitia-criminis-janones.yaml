summary: 'Peça 35 dos autos da Pet 16.662/DF (47 págs.), protocolada em 09/09/2026 pelos advogados Paulo César
  R. de Faria (OAB/GO) e Filipe Rocha de Oliveira (OAB/ES), sem vínculo processual identificado com o caso.
  Relata que o deputado federal André Janones publicou vídeo chamando André Mendonça de "vagabundo" e
  acusando-o de ter afastado o diretor-geral da PF, Andrei Rodrigues, para proteger a si mesmo — horas depois
  da decisão de Mendonça de 08/09/2026 que determinou esse afastamento. Pede prisão em flagrante de Janones,
  quebra de sua imunidade parlamentar e remessa do caso ao TSE, citando como precedente a prisão de Daniel
  Silveira (Inq. 4.781, 2021), cuja decisão original foi juntada como documento comprobatório (peça 40 dos
  mesmos autos).'
notes: 'Localizado em varredura das 62 peças da Pet 16.662/DF baixadas por Rafael em 14/09/2026 (extração
  local de texto via pypdf, delegada a agente). Petição de terceiros sem vínculo processual claro com o
  caso Master — mesma categoria de outras petições avulsas já registradas no acervo (ex.: petição 115440).
  Nenhuma cobertura de imprensa independente localizada até esta coleta.'
