summary: 'O advogado Eugênio Aragão (ex-ministro da Justiça) deixou a defesa de Paulo Henrique Costa em
  19/05/2026, em meio à negociação de delação premiada, declarando: ''só participa de iniciativas jurídicas
  pautadas por absoluta seriedade, confiança profissional e responsabilidade'', sem detalhar o motivo
  concreto da saída.'
