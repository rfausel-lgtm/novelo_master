summary: Registra a assinatura, em 02/09/2026, do acordo de colaboração premiada entre a PGR e João Carlos
  Mansur, fundador da Reag — a primeira delação da Operação Compliance Zero. A proposta contempla ao menos
  17 temas e prevê multa de R$ 40 milhões. O material foi enviado ao ministro André Mendonça, relator
  do caso no STF, que deve marcar audiência de voluntariedade antes de decidir pela homologação.
