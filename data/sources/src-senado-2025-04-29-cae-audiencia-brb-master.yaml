summary: Em 29/04/2025 a Comissão de Assuntos Econômicos aprovou convite para que Daniel Vorcaro e Paulo
  Henrique Costa prestassem esclarecimentos sobre a compra de 58% do capital do Master. No requerimento,
  os senadores destacam que, desde 28 de março, noticiava-se a intenção do BRB de comprar 58% do capital
  total por R$ 2 bilhões, o que equivalia a 75% do patrimônio consolidado do banco público.
