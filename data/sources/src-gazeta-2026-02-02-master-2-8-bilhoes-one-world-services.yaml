summary: Diz confirmar por fontes a par da investigação a apuração publicada pela Folha de S.Paulo e detalha
  331 operações justificadas como aumento de capital de uma offshore da One World Services em Miami, com
  apenas 15 dos documentos societários exigidos apresentados. Traz a resposta do Banco Master de que o
  tema foi objeto de acordo com o Banco Central que encerrou o caso na esfera administrativa, sem reconhecimento
  de irregularidade.
