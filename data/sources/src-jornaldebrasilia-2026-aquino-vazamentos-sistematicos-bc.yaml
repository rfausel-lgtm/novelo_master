source_type: press
summary: 'Em depoimento sigiloso à PF em 25/05/2026, o diretor de Fiscalização Ailton de Aquino relatou
  ''vazamentos sistemáticos de informações internas do Banco Central'' — ''tudo vazava: decisões, análises,
  votos ainda em fase de minuta'' — e disse ter escondido de Belline Santana e de Paulo Sérgio Neves de
  Souza a decisão de liquidação do Master. A reportagem ressalva que a autoria dos vazamentos nunca foi
  apurada.'
