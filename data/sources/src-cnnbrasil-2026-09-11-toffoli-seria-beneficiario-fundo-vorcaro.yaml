summary: 'Reproduzindo a revelação da revista piauí sobre o relatório da PF, descreve mensagem de Daniel Vorcaro
  a Fabiano Zettel, em novembro de 2025, afirmando que o "FIP Tayayá" deveria passar a "um amigo que vai comprar"
  e pedindo que esse amigo, identificado só pelo primeiro nome "Alberto", o procurasse — a PF identifica esse
  Alberto como o empresário Alberto Leite. Segundo o texto, o controle do fundo Arleen passou a Leite em
  fevereiro de 2025.'
