summary: 'Cobertura da primeira fase da Operação Barco de Papel, autorizada pela 6ª Vara Federal Criminal
  do Rio de Janeiro. Descreve o objeto — nove operações entre novembro de 2023 e julho de 2024, cerca
  de R$ 970 milhões em letras financeiras do Banco Master sem cobertura do FGC — e os crimes apurados:
  gestão fraudulenta, desvio de recursos, indução de órgão público a erro e fraude a investidores.'
