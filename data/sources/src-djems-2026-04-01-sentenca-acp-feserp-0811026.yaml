summary: Edição 5.839, página 1.450, lida pela equipe. Ação distribuída em 27/02/2026 na 2ª Vara de Direitos
  Difusos, Coletivos e Individuais Homogêneos de Campo Grande, tendo como autora a federação dos servidores
  e como réus o Estado de Mato Grosso do Sul e o município de Campo Grande. A sentença, de 26/03/2026,
  acolhe as preliminares dos réus e julga extinto o feito sem resolução do mérito, com fundamento no inciso
  VI do art. 485 do Código de Processo Civil, sem custas nem honorários por não haver comprovação de má-fé
  da autora. A apelação interposta em abril ainda não havia subido ao tribunal em setembro de 2026, à
  espera de manifestação das procuradorias.
