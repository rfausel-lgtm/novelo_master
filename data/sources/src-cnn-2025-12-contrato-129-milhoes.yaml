summary: 'Com base em reportagem de O Globo: contrato de R$ 129 milhões entre o escritório de Viviane
  Barci de Moraes e o Banco Master, com R$ 3,6 milhões mensais por três anos (2024 a 2027), para atuação
  perante Banco Central, Receita, Congresso e outras instâncias; pagamentos interrompidos com a liquidação.
  A CNN procurou o escritório, o gabinete do ministro e o banco sem retorno até a publicação.'
