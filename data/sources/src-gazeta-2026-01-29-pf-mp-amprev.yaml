source_type: press
summary: Ata de 30/07/2024 do Comitê de Investimentos da Amprev mostra que Jocildo Lemos foi alertado
  por dois conselheiros sobre alto risco e necessidade de consultar o TCU antes do investimento no Master;
  Alberto Alcolumbre, irmão do senador, era representante do governo no Conselho Estadual de Previdência
  e depois conselheiro fiscal. O nome de Davi Alcolumbre não aparece nas investigações; sua assessoria
  nega envolvimento nas nomeações ou decisões.
