summary: Cobertura da Operação Take Over, deflagrada pela Polícia Federal em 10/06/2026 contra o PreviPaulista,
  com dez mandados de busca e apreensão cumpridos em Paulista, no Recife e no Rio de Janeiro. A PF aponta que os
  investimentos no Master 'foram feitos por meio de decisões em desacordo com as normas legais e com os procedimentos
  de governança exigidos', e que a investigação busca esclarecer se houve pagamento de propina a gestores do fundo
  e se a conduta caracteriza gestão temerária ou fraudulenta. A Prefeitura de Paulista reafirmou, em nota, que os
  fatos investigados se referem a atos da administração anterior.
