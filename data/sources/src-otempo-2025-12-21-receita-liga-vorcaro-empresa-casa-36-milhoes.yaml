source_type: press
summary: 'Apuração sobre a Super Empreendimentos que registra que seu principal acionista é o fundo Termópilas,
  administrado pela Reag, o qual por sua vez é controlado por outro fundo, sem que se chegue ao beneficiário
  final. Traz a nota da defesa de Daniel Vorcaro sobre Ana Cláudia Queiroz de Paiva: ela ''é administradora
  de empresas e presta serviços a uma das empresas de Vorcaro'', com contrato que ''não prevê exclusividade''
  e ''se dá dentro da normalidade nesse tipo de serviço''.'
