summary: 'Reproduz a nota do gabinete de André Mendonça de 02/09/2026: recebeu Daniel Vorcaro uma única vez,
  em março de 2025, por iniciativa do próprio empresário, limitando-se a ouvi-lo; no mesmo mês atendeu também
  o advogado do empresário (Ciro Rocha Soares), mantendo os memoriais escritos recebidos; em todas as ocasiões
  o assunto tratado foi a Suspensão de Tutela Provisória (STP) 976, sobre créditos de precatórios de interesse
  do banco, então sob pedido de vista de outro ministro. A nota veio em resposta a reportagem do ICL Notícias
  baseada em mensagens e áudio do celular de Vorcaro — um deles com a frase, atribuída a Ciro Rocha Soares,
  "Levei o André lá no Vasco agora, pra fazer um terno".'
