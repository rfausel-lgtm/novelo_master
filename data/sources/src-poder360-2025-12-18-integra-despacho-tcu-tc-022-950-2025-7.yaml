summary: Íntegra, hospedada pelo Poder360, de despacho de 18/12/2025 no TC 022.950/2025-7, representação do
  Ministério Público junto ao TCU que suscita indícios de falhas na supervisão do Banco Central sobre o Banco
  Master; responsáveis e interessados com identidade preservada. O relator lista elementos posteriores à
  admissão (proposta de aquisição por grupo privado às vésperas da liquidação, tratativas de solução privada
  com o FGC, "indícios de cronologia atípica do processo decisório" e possíveis divergências internas no BC),
  cita como elemento corroborativo a representação da Liderança da Minoria da Câmara (TC 024.329/2025-8) e, em
  juízo preliminar, formula a hipótese de demora na condução de alternativas e de "precipitação na adoção da
  medida extrema de liquidação". Diz que "vislumbro a possibilidade de vir a ser adotada medida cautelar"
  (abstenção de alienar ativos relevantes da massa), mas antes determina (item 12) oitiva prévia do BC, no
  prazo de "72 (setenta e duas) horas", sobre fundamentos da liquidação, alternativas menos gravosas,
  tratativas e cronologia, divergências internas e acesso a peças sigilosas; manda os autos à AudBancos para
  avaliar cautelar e eventual inspeção; dá ciência à Presidência do STF e ao relator da Rcl 88.121. Declara que
  a decisão "possui natureza exclusivamente instrutória".
