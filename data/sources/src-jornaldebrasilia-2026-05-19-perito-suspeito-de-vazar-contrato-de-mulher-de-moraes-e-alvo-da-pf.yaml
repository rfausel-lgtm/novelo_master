source_type: press
language: pt-BR
summary: Informa que o perito criminal federal João Cláudio Nabas foi alvo de ação da PF (7ª fase da Operação
  Compliance Zero) sob suspeita de vazamento de informações obtidas nas investigações. Registra que o Estadão
  procurou a defesa do perito e não houve resposta, e que a Associação Nacional dos Peritos Criminais Federais
  (APCF) disse, em nota, prestar assistência a ele para assegurar a ampla defesa e o contraditório e pediu que
  se evitem conclusões precipitadas. Traz nota do STF sobre a ausência de investigação de profissional da
  imprensa.
notes: Republicação de matéria do Estadão Conteúdo.
