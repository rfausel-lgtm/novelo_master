summary: Depoimento de Thiago Miranda à Polícia Federal em 12/05/2026, em que confirma o projeto com influenciadores,
  sustenta que sua atuação se limitava a fechar contratos e repassar recursos e briefings, e afirma que
  os recursos vieram do produto da venda de sua participação no portal Leo Dias. Cita nomes de perfis
  contratados — lista produzida por investigado, em depoimento, não por decisão judicial.
