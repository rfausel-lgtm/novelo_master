summary: Em 18/03/2026 Antônio Rueda admitiu, em nota, que o escritório Rueda e Rueda advogou para o Master
  ('dezenas de pareceres, centenas de reuniões, mais de 1.000 audiências'), atividade que classificou
  como legítima; dois dias antes dissera não ter relação com Vorcaro além de contatos sociais eventuais.
  Seu nome aparece em mensagens entre Vorcaro e Paulo Henrique Costa.
