summary: >-
  Relatórios da PF apontam, segundo a matéria, atuação de Ibaneis Rocha na compra do Master pelo BRB, com base
  em mensagens entre Paulo Henrique Costa e Daniel Vorcaro; traz a nota da defesa de Ibaneis, atribuída aos
  advogados sem nomeá-los (não pressionou; Costa tinha autonomia; o nome dele "somente é mencionado pela
  Polícia Federal em quatro oportunidades"). Não informa data do relatório, PET nem a reunião em Zurique.
