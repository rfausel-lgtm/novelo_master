summary: 'Três despachos de uma página. Em 23/12/2025, manda dar ciência ao COAF da liminar de 09/12/2025, "a
  qual deve ser observada pelo referido órgão". Em 02/02/2026, integrando o anterior, manda dar ciência ao COAF
  também da decisão de 12/12/2025. Em 09/02/2026, determina ao COAF que encaminhe as informações requisitadas,
  por ofício e de maneira segura, por se tratar de material sigiloso, ao INQ 5.026.'
notes: 'Peças obtidas via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). Agrupadas numa só fonte por serem despachos curtos, do mesmo relator e
  sobre o mesmo destinatário.'
