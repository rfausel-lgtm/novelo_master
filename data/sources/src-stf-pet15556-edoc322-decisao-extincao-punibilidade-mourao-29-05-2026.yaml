summary: Decisão de 29/05/2026 que acolhe parecer favorável da PGR e declara extinta a punibilidade de
  Luiz Phillipi Machado de Moraes Mourão, com base no art. 107, I, do CP (morte do agente), determinando o
  arquivamento parcial das investigações quanto a ele. A decisão especifica, porém, que as medidas
  assecuratórias patrimoniais (sequestro de bens e valores) contra ele permanecem vigentes, por se tratar
  de obrigação de reparação de danos que se transmite aos herdeiros — e determina que os herdeiros, diretamente
  ou pelo inventariante do espólio, ingressem nos autos para acompanhar as restrições patrimoniais. Registra
  ainda que a extinção da punibilidade não impede futuras medidas constritivas ou de levantamento de sigilo
  contra o falecido, se necessárias à elucidação dos ilícitos da organização criminosa.
notes: Confirma e formaliza a morte já registrada no corpus, com a data exata da decisão de extinção de
  punibilidade e o detalhe, até então ausente, de que as medidas patrimoniais persistem contra o espólio.
