summary: Demonstrativo do CadPrev publicado pelo próprio instituto, com camada de texto. Registra, na
  rubrica de ativos de renda fixa emitidos por instituições financeiras do art. 7º, IV, a posição 'LF
  BANCO MASTER IPCA' de R$ 40.000.000,00, equivalente a 4,95% da carteira. A posição não existe no demonstrativo
  de maio de 2024 e aparece pela primeira vez em junho.
