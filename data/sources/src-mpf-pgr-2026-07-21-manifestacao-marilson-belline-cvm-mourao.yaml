title: Manifestação do PGR sobre pedidos de Belline Santana, Marilson Roseno da Silva, restituição de bens de Mourão e oitiva de Vorcaro pela CVM (ASSCRIM/PGR 1151546/2026)
publisher: Ministério Público Federal — Procuradoria-Geral da República
author: Paulo Gonet Branco (Procurador-Geral da República)
publication_date: '2026-07-21'
retrieved_at: '2026-09-11'
