summary: 'Manifestação da PGR de 21/07/2026 respondendo a quatro pedidos pendentes na PET 15.556: (1) opina
  pelo indeferimento do pedido de Belline Santana (16/03/2026) para substituir a monitoração eletrônica por
  comparecimento mensal; (2) opina pelo indeferimento do pedido de revogação da prisão de Marilson Roseno
  da Silva (02/04/2026, já no acervo — lote 185), caracterizando-o como "um dos principais operadores do
  núcleo de coerção da organização criminosa", que "realizava diligências informais para monitorar alvos,
  obter dados pessoais e mapear informações estratégicas" para "antecipar ou neutralizar investigações
  oficiais e ações de jornalistas ou opositores" sob liderança de Luiz Phillipi Mourão; (3) sobre pedido de
  29/05/2026 de Joana Machado de Moraes Mourão e Nathana Lopes Figueiredo para restituição de bens
  apreendidos na busca contra Luiz Phillipi Mourão — um Range Rover SE 4x4 (placa TYM9F99, reivindicado por
  Joana) e um iPhone 17 Pro Max (reivindicado por Nathana) —, opina pelo indeferimento da restituição do
  veículo, por suspeita de origem ilícita dos recursos usados na compra, e pede manifestação policial sobre
  o celular; (4) opina favoravelmente ao pedido da CVM (10/06/2026) de oitiva de Daniel Vorcaro para três
  Inquéritos Administrativos (já no acervo — lote 181, e-Doc 353), facultada a participação voluntária dele.'
notes: 'A caracterização de Marilson como "um dos principais operadores do núcleo de coerção" é mais forte
  que a linguagem usada em documentos anteriores do acervo (que o descreviam como "líder operacional em
  campo" ou responsável por "coleta e repasse de informações"). Também esclarece que a afirmação, na
  petição do próprio Marilson (lote 185), de que "a PGR não recomendou sua prisão preventiva" referia-se à
  manifestação original sobre o decreto de prisão de março de 2026 — não a esta manifestação específica
  sobre o pedido de revogação, na qual a PGR se posiciona contra a soltura dele.'
