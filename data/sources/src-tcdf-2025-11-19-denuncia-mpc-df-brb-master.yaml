title: TCDF recebe nova denúncia sobre operações do BRB relacionadas ao Banco Master
publisher: Tribunal de Contas do Distrito Federal (TCDF)
publication_date: '2025-11-19'
url: https://www2.tc.df.gov.br/tcdf-recebe-nova-denuncia-sobre-operacoes-do-brb-relacionadas-ao-banco-master/
source_type: official_regulator
summary: 'Processo TCDF nº 00600-00003617/2025-75, aberto por denúncia do Ministério Público de Contas
  do DF (MPC-DF), com representação também protocolada por parlamentar da CLDF. Aponta que as operações
  de compra de carteiras de crédito entre BRB e Banco Master "poderiam ter sido realizadas com o objetivo
  de contornar a restrição imposta pelo Banco Central para a aquisição do Banco Master pelo BRB",
  apontando possíveis falhas de governança, ausência de diligência prévia adequada e riscos ao erário
  distrital — e que as respostas do BRB careciam de documentos comprobatórios que fundamentassem as
  operações. Relator não identificado na publicação.'
