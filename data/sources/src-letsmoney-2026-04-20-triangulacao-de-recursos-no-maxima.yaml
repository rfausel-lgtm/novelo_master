summary: 'Detalha o caminho do dinheiro descrito no voto BCB 20/2019: reavaliações de imóveis de duas
  controladas da Viking Participações (WWS Holding, de R$ 1,9 milhão para R$ 92,3 milhões; Superávit Participações,
  de R$ 10,6 milhões para R$ 67,3 milhões), aporte da Viking no fundo Brazil Realty e compra, por esse
  fundo, da participação do antigo controlador Saul Dutra Sabbá. Registra aporte de R$ 15,447 milhões
  do FGC em dezembro de 2017 e aportes de capital de R$ 100 milhões entre março e junho de 2019, além
  de trechos cobertos por tarjas antes da liberação via LAI.'
