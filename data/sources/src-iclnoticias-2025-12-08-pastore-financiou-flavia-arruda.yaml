source_type: press
summary: Luiz Osvaldo Pastore, empresário e ex-senador suplente (ES, 2019-2022), foi o principal financiador
  pessoal da campanha ao Senado de Flávia Arruda (hoje Flávia Peres) em 2022, doando R$ 380 mil — valor
  corroborado por reportagem independente sobre a prestação de contas ao TSE. Flávia Arruda casou-se em
  janeiro de 2024 com Augusto Ferreira Lima, sócio de Daniel Vorcaro no Banco Master. A doação e o casamento
  são anteriores à investigação; a conexão é de círculo social/político pré-existente, não de vínculo
  direto entre Pastore e o núcleo do caso Master.
