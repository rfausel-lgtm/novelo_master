source_type: press
summary: 'Detalha a decisão da 6ª fase: a delegada Valéria acessou, sem atribuição legal, inquérito de
  2024 da Superintendência da PF em São Paulo — exatamente aquele em que Henrique Vorcaro havia sido intimado
  —, pelo sistema e-Pol. Segundo a decisão, ela e o marido, o agente aposentado Francisco José Pereira
  da Silva, são apontados como responsáveis ''pelo repasse de informações sigilosas a Marilson Roseno
  da Silva, mediante consultas indevidas ao sistema e-Pol'', e ''o conteúdo compartilhado teria sido suficientemente
  detalhado, permitindo a identificação do objeto da investigação''.'
