source_type: press
summary: 'Na mesma decisão da 9ª fase da Compliance Zero, o ministro André Mendonça indeferiu
  especificamente o pedido de busca e apreensão contra Bonnie e Patrich Toaldo Bonilha — "Indefiro a
  medida de busca e apreensão em relação a Bonnie Toaldo Bonilha e a Patrich Toaldo Bonilha" —, enquanto
  outros dezoito mandados foram cumpridos na mesma operação. O texto não explica os fundamentos da
  negativa.'
