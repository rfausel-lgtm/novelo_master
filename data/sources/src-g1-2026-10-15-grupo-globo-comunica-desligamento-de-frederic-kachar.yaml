summary: Publicação do g1, veículo do próprio Grupo Globo, com as duas notas oficiais de 15/10/2026. A
  primeira, assinada por Comunicação Globo, comunica o desligamento de Frederic Kachar da direção-geral de
  Mídia Impressa e Rádio e diz que o conteúdo de conversas privadas mantidas com Daniel Vorcaro entre outubro
  de 2023 e julho de 2025, às quais a empresa teve acesso na véspera, "revela uma relação inadequada do
  executivo com um anunciante"; reafirma a independência editorial dos veículos e cita a cobertura do caso
  Master. A segunda, assinada por João Roberto Marinho, repete esses pontos, registra a trajetória de Kachar
  (direção-geral da Editora Globo desde 2008, da Infoglobo desde 2015, Sistema Globo de Rádio desde 2020) e
  informa que Luis Henrique Guimarães, vice-presidente executivo da holding, assume interinamente o cargo.
notes: "Fonte autopublicada: é o que a empresa disse, não apuração independente sobre o conteúdo das
  conversas. A nota não nomeia o anunciante nem descreve o conteúdo das mensagens. O UOL (15/10/2026) reproduz
  a segunda nota com o mesmo texto."
