summary: Relata que a 2ª Câmara do TCU aprovou em 20/10/2026 as contas do BC de 2025, uma semana depois de
  suspender o julgamento, com quitação plena aos diretores do BC envolvidos, incluindo o presidente Gabriel
  Galípolo, e arquivamento. Diz que o TC 008.216/2025-8 (operação BRB–Master) está paralisado à espera de
  elementos do STF e descreve o TC 022.950/2025-7 como investigação sobre possível omissão do BC na
  fiscalização e supervisão do Master, sem informar conclusão; traz o histórico de janeiro de 2026 (inspeção,
  Jhonatan de Jesus, Vital do Rêgo). A matéria usa "suspensão" e "suspendido"; o acórdão diz "sobrestar". Não traz
  manifestação do BC.
notes: Lida em cache (lote:fonte, 21/10/2026, sha256 do texto 39f131c0...). Vale para o relato do desfecho,
  que o acórdão (cópia lida) confirma; para o estado do TC 008.216/2025-8 e do TC 022.950/2025-7 vale só como
  A.
