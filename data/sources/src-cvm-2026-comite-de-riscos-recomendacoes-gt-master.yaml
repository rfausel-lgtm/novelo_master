summary: Registra que a CVM fez treze comunicações formais ao MPF, ao Banco Central, à Receita Federal,
  à SUSEP, ao COAF e à B3/BSM entre junho de 2017 e janeiro de 2026, partindo de cinco superintendências.
  A lista das comunicações não foi divulgada, e nenhum documento público mostra se alguma delas nomeia
  Vorcaro ou o Banco Máxima.
