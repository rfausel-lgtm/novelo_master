source_type: press
summary: 'Detalha casos específicos citados pela PF na investigação sobre Cezinha de Madureira: Mariângela
  Fialek ("Tuca"), apontada como operadora do esquema de emendas parlamentares na Câmara (ex-assessora de
  Arthur Lira), enviava memoriais de processos sob relatoria do Min. Kassio Nunes Marques a Cezinha, que
  confirmava tratativas diretas com o ministro. Cita o caso de Michele Queiroz, então prefeita de
  Beberibe/CE, cujo escritório de Fialek fechou contrato de R$ 500 mil condicionado ao resultado de
  julgamento no STF. Memoriais também endereçados a André Mendonça e Gilmar Mendes. Não há indício de
  participação dos ministros.'
