source_type: press
summary: A partir do relatório da PF cujo sigilo Mendonça levantou na noite de 11/09/2026, descreve o
  contato de Guilherme Sodré com Vorcaro seis dias antes da apresentação da Emenda 11 pedindo discrição
  sobre um "tema importante"; a ligação de 9min19s entre Augusto Lima e Wagner no dia da apresentação
  (13/08/2024), seguida de visita ao gabinete duas semanas depois; e mensagem de Lima a Wagner em 29/03/2025
  ("Você mais do que ninguém sabe de minha história e faz parte disso!!").
