source_type: press
summary: A operação teve o Instituto Conhecer Brasil como principal alvo, com diligências em empresas
  subcontratadas e na Secretaria Municipal para recolher contratos e prestações de contas. A entidade
  teria apresentado ao menos R$ 16,5 milhões em notas fiscais consideradas irregulares. A prefeitura divulgou
  nota em que 'repudia veementemente ilações de desvio de recursos públicos', afirma que o contrato seguiu
  'rigorosamente os princípios da legalidade, transparência e economicidade' e diz colaborar com as investigações.
