source_type: press
language: pt-BR
summary: >-
  Segundo a matéria, o relatório da PF foi "produzido pela corporação em abril deste ano" e tornado público
  em 16/06/2026; mensagens indicam que Vorcaro pediu reservas no Four Seasons para "Ciro e Hugo" em
  18/06/2024; cinco diárias custaram cerca de 3 mil euros (cerca de R$ 18 mil); a fatura, encontrada no
  e-mail de Vorcaro, registra "2x Jr. Suítes". Afirma que "Motta não é investigado pela Polícia Federal" e
  registra que ele se disse tranquilo e que esteve em Lisboa para evento jurídico.
