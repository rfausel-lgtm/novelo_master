summary: 'Em resposta ao Ofício 4208/2026, informa bloqueios em nome de Ana Cláudia Queiroz de Paiva "até atingir o
  limite de R$ 42.000.000,00" — que alcançaram pouco mais de R$ 90 mil entre conta, fundo de investimento, títulos de
  capitalização e previdência — e de R$ 22,01 em nome de Leonardo Augusto Furtado Palhares; para "os outros 9 (nove)
  Requeridos elencados na r. representação da Polícia Federal (fls. 169)", não localizou valores nem relacionamento.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente), juntada como "Petição inicial" em 06/03/2026. CPFs, números de conta e de
  produtos financeiros citados na resposta não são reproduzidos no acervo.'
