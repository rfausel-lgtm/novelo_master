summary: Márcio Chaer, editor do ConJur, confirmou publicamente que atuou na organização da edição de 2024 do
  fórum jurídico em Londres e que o ConJur recebeu patrocínio do Banco Master para o evento; disse ter
  declinado do convite para organizar a edição de 2025.
