title: Ex-tesoureiro do Master fica em silêncio e PF adia depoimentos de dois executivos da Tirreno
publisher: O Tempo
publication_date: '2026-01-26'
url: https://www.otempo.com.br/politica/judiciario/2026/1/26/ex-tesoureiro-do-master-fica-em-silencio-e-pf-adia-depoimentos-de-dois-executivos-da-tirreno
source_type: press
summary: Alberto Félix de Oliveira Neto, ex-superintendente executivo de Tesouraria do Master, optou por
  não responder aos questionamentos da delegada Janaína Palazzo, por orientação da própria defesa, em
  depoimento por videoconferência em sala de audiência do STF, conforme determinação do ministro Dias
  Toffoli. A defesa justificou o silêncio pela falta de acesso à íntegra dos autos da Compliance Zero —
  mesmo argumento usado por outros investigados para adiar depoimentos.
