summary: 'Contraminuta da PGR (ASSCRIM/PGR nº 1097941/2026, 6 páginas) ao agravo regimental interposto em
  30/06/2026 por Leonardo Augusto Furtado Palhares e pela Varajo Consultoria Empresarial contra o bloqueio
  patrimonial de 03/03/2026 (PET 15.563). O agravo nega vínculo com os fatos, defende que o contrato entre
  a Varajo e Belline Santana tinha objeto real (o projeto social "Jovens Potentes"), alega ausência de fumus
  comissi delicti e periculum in mora, e pede a revogação do bloqueio ou, subsidiariamente, seu
  redimensionamento ao valor "efetivamente demonstrado nos autos" de R$ 3.810.000,00. A PGR pede o não
  provimento, mantendo a posição da decisão original de 03/03/2026 e transcrevendo seu item 10.5: Palhares
  "atuou na formalização documental" do contrato usado para "estruturar vínculo contratual que justificasse
  transferências financeiras associadas às atividades desempenhadas pelo servidor público" (Belline Santana);
  trata a Varajo como "empresa de fachada". A PGR reitera também a caracterização, já constante da decisão
  original, do núcleo liderado por Vorcaro como estrutura "de formação de uma milícia violenta, sob os
  comandos de DANIEL VORCARO, para satisfação de seus interesses exclusivamente privados".'
notes: Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, equipe delegada em fork). Não há, até
  esta coleta, notícia do resultado do agravo — pode estar pendente de julgamento pelo relator.
