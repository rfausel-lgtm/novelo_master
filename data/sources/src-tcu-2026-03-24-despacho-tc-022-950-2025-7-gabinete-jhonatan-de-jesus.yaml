summary: >-
  Despacho de 24/03/2026 no TC 022.950/2025-7, representação do Ministério Público junto ao TCU sobre a
  "regularidade e suficiência da atuação do Banco Central do Brasil (BCB) no exercício de suas atribuições de
  supervisão e de resolução em relação ao Banco Master S.A."; responsáveis e interessados com identidade
  preservada. Registra que a inspeção da AudBancos foi concluída, que sobrevieram notícia de sindicância
  interna no BCB, PAD na CGU e apurações no STF (Rcl 88.121, relator André Mendonça), e que o despacho não
  antecipa juízo sobre mérito ou responsabilidades individuais. Decide (item 9.1) "sobrestar o andamento do
  feito, inclusive a apreciação do relatório de inspeção da AudBancos e o julgamento do mérito da
  representação", até elementos oficiais da sindicância do BC, do PAD da CGU e/ou das apurações no STF,
  "notadamente no âmbito da RCL 88.121/STF"; determina à Segecex procedimento de reavaliação do grau de sigilo
  dos autos (9.2), mantém a classificação de sigilo vigente (9.3) e manda oficiar o gabinete do ministro André
  Mendonça com cópia integral dos autos (9.4).
