source_type: press
summary: 'Ação civil pública ajuizada em 10/08/2026 pela Defensoria Pública do Rio contra CredCesta, PKL
  One e Banco Pleno. Em 14/08/2026, a juíza Maria Izabel Gomes Santanna de Araujo, da 3ª Vara Empresarial
  da Capital, deferiu tutela de urgência suspendendo a oferta e contratação do cartão e determinando,
  em 30 dias, canal de atendimento humano para fornecimento gratuito de contratos, memória de cálculo
  e saldo devedor, sob multa diária de R$ 20 mil. A decisão é parcial: indeferiu os pedidos de limitação
  da margem e de revisão do teto de juros.'
