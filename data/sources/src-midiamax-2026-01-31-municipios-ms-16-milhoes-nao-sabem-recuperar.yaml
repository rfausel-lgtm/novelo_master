source_type: press
summary: 'Documento-guarda-chuva das cinco cidades de Mato Grosso do Sul com regime próprio de previdência investido
  no Banco Master: Fátima do Sul, Jateí, São Gabriel do Oeste, Angélica e Campo Grande, somando R$ 16 milhões. Registra
  que o TCE-MS abriu auditoria, por representação do Ministério Público de Mato Grosso do Sul (MPMS), para apurar
  a regularidade das aplicações, com varredura de dados técnicos e análise documental do passo a passo de cada decisão
  — processo sem prazo definido, em fase de planejamento dois meses após a liquidação do banco. Traz posição de
  cada município: Fátima do Sul aguarda retorno da Câmara para decidir medidas; São Gabriel do Oeste instituiu comissão
  para apurar o processo de escolha da instituição; Angélica informou ter resgatado os R$ 2 milhões semanas antes
  da liquidação; Campo Grande ajuizou ação de compensação de créditos contra o banco, usando valores de empréstimos
  consignados que o Master lhe devia, com tutela de urgência concedida pela Justiça; Jateí não respondeu à reportagem.'
