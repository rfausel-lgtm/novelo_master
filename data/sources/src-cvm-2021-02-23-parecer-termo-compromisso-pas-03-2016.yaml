summary: Parecer que registra os cargos exercidos por Benjamim Botelho de Almeida — diretor responsável
  da Foco DTVM de 19/10/2009 a 24/04/2013 e da gestora A.A.M Ltda./AQ3 A.M. Ltda. de 08/07/2011 a 11/01/2016
  — e a acusação de operação fraudulenta no mercado de valores mobiliários, caracterizada pelo 'oferecimento
  de vantagens financeiras ilícitas a prefeitos e gestores de RPPS' para desviar recursos de fundos. Registra
  a rejeição unânime, pelo Colegiado, da proposta de termo de compromisso de R$ 250 mil apresentada por
  ele.
