summary: "Reportagem que publica na íntegra a nota enviada pelo jornalista Reinaldo Azevedo à TMC sobre o
  patrocínio do Banco Master ao podcast Reconversa: contrato de março de 2024, 12 parcelas de R$ 100 mil, sete
  pagas, valores declarados e impostos pagos, entendimentos com a área comercial; e as negativas de ter
  escrito em defesa do banco ou conversado com Daniel Vorcaro ou Fabiano Zettel. A nota é a posição do próprio
  citado."
notes: Aberta pelo redator em 17/10/2026 com lote:fonte (16/10/2026 às 16h19, atualizada às 16h37). Fonte do
  que o citado disse, não prova do conteúdo de mensagens. A nota contém ataques pessoais e referências a
  candidatos e a terceiros que o Novelo não registra (quarentena eleitoral até 25/10/2026); o texto próprio da
  TMC sobre esses trechos também fica de fora.
