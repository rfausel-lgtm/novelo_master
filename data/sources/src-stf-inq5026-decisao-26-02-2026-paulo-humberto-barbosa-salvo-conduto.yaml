summary: Decisão que defere pedido de tutela incidental/habeas corpus preventivo em favor de Paulo
  Humberto Barbosa, dispensando-o de comparecimento obrigatório à CPI do Crime Organizado por figurar
  como investigado no INQ 5.026 — extensão direta, com fundamentação idêntica, da decisão do mesmo dia
  sobre os irmãos Dias Toffoli. A petição de defesa (e-Doc. 376) caracteriza o Requerimento nº 145/2026
  como baseado em suposta "relação ilícita" entre ele e outros convocados.
notes: 'Peça pública do portal do STF (Resolução 427/2010), obtida em sessão anterior via
  scripts/stf_baixar_decisoes.py e ainda não analisada até 12/09/2026. É a própria decisão primária que o
  acervo só conhecia por citação em petição de terceiro (Ibaneis Rocha) — upgrade de fonte. Código de
  autenticação/senha do rodapé de cada página nunca reproduzido no acervo.'
