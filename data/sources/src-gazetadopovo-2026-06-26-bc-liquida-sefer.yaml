summary: Registra a liquidação extrajudicial da Sefer Investimentos DTVM Ltda. decretada pelo Banco Central
  em 26/06/2026, por 'comprometimento da situação econômico-financeira da distribuidora, sujeitando seus
  credores quirografários a risco anormal, bem como por graves violações às normas legais que disciplinam
  a atividade da instituição'. A Sefer foi procurada e não havia se pronunciado até a publicação.
