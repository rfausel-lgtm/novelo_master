summary: 'Apuração própria de Ana Carolina Curvello (publicada em 06/09/2026, 18h41), independente da apuração
  do Poder360 sobre o mesmo fato — bylines distintos, sem menção a agência ou a outro veículo como origem.
  Descreve a ação de André Mendonça como uma "liberação" do caso Moraes-Vorcaro para julgamento pelo plenário
  do STF, sem citar o art. 5º do RISTF (que o Poder360 cita expressamente, ao descrever o mesmo ato como
  "pedido formal" de deslocamento de competência). O fato central — o envio do caso ao plenário em 06/09/2026,
  cabendo a Fachin pautar — é o mesmo nas duas coberturas; a formulação jurídica do ato diverge.'
