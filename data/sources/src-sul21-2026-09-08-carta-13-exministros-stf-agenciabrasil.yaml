source_type: press
summary: 'Treze ex-ministros do STF (Ayres Britto, Carlos Velloso, Celso de Mello, Cezar Peluso, Ellen
  Gracie, Eros Grau, Francisco Rezek, Ilmar Galvão, Joaquim Barbosa, Nelson Jobim, Néri da Silveira, Rosa
  Weber, Sydney Sanches) enviaram carta conjunta ao presidente Edson Fachin, pedindo sessão pública do
  Plenário para ''imediata e rigorosa apuração, sob o devido processo legal, dos gravíssimos fatos cuja
  divulgação vem comprometendo o prestígio e a autoridade desse Tribunal'' — classificando a situação
  como a ''mais aguda crise'' da história da Corte, sem citar nomes ou episódios específicos. Em nota
  separada, o ex-ministro Celso de Mello declarou: ''Quem compromete a própria integridade fere também
  a confiança depositada na instituição. O STF é maior do que todos e que cada um de seus ministros.'''
