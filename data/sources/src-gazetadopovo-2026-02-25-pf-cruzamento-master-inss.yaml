summary: Registra que, em 25/02/2026, a PF pediu e Mendonça autorizou o cruzamento formal de dados entre
  a Operação Compliance Zero (Master) e a Operação Sem Desconto (INSS), para identificar estruturas financeiras
  comuns, operadores recorrentes e eventuais fluxos de recursos compartilhados em fundos geridos pelo
  Master.
