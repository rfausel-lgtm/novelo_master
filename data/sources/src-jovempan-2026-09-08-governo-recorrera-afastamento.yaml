summary: A AGU vai recorrer alegando 'violação de competência' — nomeação e exoneração do diretor-geral
  da PF são prerrogativa exclusiva do Presidente da República (Lei 9.266/1996) — mas o governo orientou
  cumprimento da decisão enquanto contesta, para não repetir discurso de deslegitimação do STF associado
  à oposição.
