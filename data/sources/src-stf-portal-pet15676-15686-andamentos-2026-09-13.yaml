summary: 'Os andamentos públicos das PETs 15.676 (origem DF) e 15.686 (origem RJ), ambas distribuídas por
  prevenção à Pet 15.497 (o caso Cláudio Castro), mostram que a decisão de 25/05/2026 gerou pelo menos 10
  mandados de busca e apreensão na Pet 15.676 e mais 3 ofícios na Pet 15.686 — mais ampla do que a busca
  "na casa do ex-governador" noticiada pela imprensa em 26/05/2026. A Pet 15.686 nomeia um segundo alvo,
  Tharcio Nascimento Salgado. Em 11/08/2026, Mendonça indeferiu pedido formulado por Ricardo Siqueira
  Rodrigues (o operador financeiro da RioPrevidência já identificado no lote 266) na Pet 15.676, mantendo em
  curso as investigações contra ele.'
notes: Lido nas abas de Andamentos e Decisões do portal público (sem certificado); o teor completo das decisões
  sigilosas de 25/05 não é acessível sem certificado ou sessão autenticada — apenas a certidão de quantidade de
  mandados e o despacho de 11/08, que não é sigiloso, ficaram visíveis.
