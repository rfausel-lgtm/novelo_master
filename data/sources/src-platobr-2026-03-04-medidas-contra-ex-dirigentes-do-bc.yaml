summary: Registra que, na fase da Operação Compliance Zero de 04/03/2026, foram alvo de busca e apreensão
  o ex-diretor de fiscalização do Banco Central Paulo Sérgio Neves de Souza e o ex-chefe do Departamento
  de Supervisão Bancária Belline Santana, servidores de carreira já afastados no âmbito de apuração interna
  da autarquia sobre eventuais omissões no caso Master, depois afastados também por decisão judicial.
  Foram 4 mandados de prisão preventiva e 15 de busca e apreensão em São Paulo e Minas Gerais, com bloqueio
  de bens de até R$ 22 bilhões.
