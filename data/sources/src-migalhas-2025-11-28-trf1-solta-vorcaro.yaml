summary: A desembargadora Solange Salgado (10ª Turma do TRF-1) substituiu a prisão preventiva de Vorcaro
  por medidas cautelares (HC 1045014-48.2025.4.01.0000), estendendo a decisão a Augusto Ferreira Lima,
