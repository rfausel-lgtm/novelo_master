summary: Registra que a PF realizou em 14/01/2026 a 2ª fase da Operação Compliance Zero, autorizada pelo
  ministro Dias Toffoli, do STF, com 42 mandados cumpridos e medidas de sequestro e bloqueio de bens e valores
  que superam R$ 5,7 bilhões. Lista como alvos Daniel Vorcaro, Fabiano Zettel (preso temporariamente), Felipe
  Cançado Vorcaro e Nelson Tanure, reproduz a nota da defesa de Vorcaro e a da defesa de Tanure e informa que
  o jornal não localizou contato das defesas de Zettel e de Felipe Vorcaro.
