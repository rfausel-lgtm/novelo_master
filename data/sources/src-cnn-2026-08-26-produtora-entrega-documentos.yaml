source_type: press
summary: Karina Gama comprometeu-se a entregar voluntariamente à PF, até 28/08/2026, documentos e prestação
  de contas do filme, reunindo notas fiscais, contratos e ao menos 300 contratos de pessoas que trabalharam
  na produção. O pedido foi feito por e-mail em 19/08 com prazo de dez dias. Em 26/08 a Polícia Civil
  de São Paulo enviou à PF os dados da operação de junho. A empresária nega os crimes de organização criminosa,
  evasão de divisas e lavagem de dinheiro.
