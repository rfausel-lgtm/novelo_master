source_type: press
summary: A Consult Inteligência Tributária recebeu mais de R$ 6 milhões do Banco Master entre 2024 e 2025
  e cerca de R$ 11 milhões da JBS, e transferiu mais de R$ 250 mil ao escritório de Kevin Nunes Marques,
  filho do ministro. A defesa de Kevin disse que o escritório 'nunca defendeu nenhum processo no STF';
  o ministro, procurado, não comentou; o Master não se manifestou; a JBS justificou a contratação.
