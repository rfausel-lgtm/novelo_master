source_type: press
summary: 'Reproduz a íntegra da nota oficial dos dez ministros do STF de 12/02/2026, assinada por Fachin
  (presidente), Moraes (vice), Gilmar Mendes, Cármen Lúcia, Toffoli, Fux, André Mendonça, Nunes Marques, Zanin
  e Dino. Trechos literais: "Reconhecem, assim, a plena validade dos atos praticados pelo Ministro Dias
  Toffoli na relatoria da Reclamação n. 88.121"; "Expressam, neste ato, apoio pessoal ao Exmo. Min. Dias
  Toffoli, respeitando a dignidade de Sua Excelência"; e que, "considerados os altos interesses
  institucionais, a Presidência do Supremo Tribunal Federal, ouvidos todos os Ministros, acolhe comunicação de
  Sua Excelência quanto ao envio dos feitos" — formalizando a redistribuição do caso.'
