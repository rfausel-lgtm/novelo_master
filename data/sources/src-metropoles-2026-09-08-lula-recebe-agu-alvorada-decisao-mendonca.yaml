summary: 'Lula recebeu no Palácio da Alvorada, na manhã de 08/09/2026, o Advogado-Geral da União Jorge
  Messias e o ministro da Justiça Wellington César Lima e Silva, após a decisão de Mendonça que afastou
  Andrei Rodrigues; Messias saiu por volta de 12h45. O líder do governo na Câmara, José Guimarães, declarou:
  ''essa medida me cheira como eleitoral. Isso não pode!'''
