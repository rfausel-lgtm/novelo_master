summary: 'Consulta ao CNPJ 38.461.854/0001-48 (Banvox Holding Financeira S.A., distinta da corretora Banvox
  DTVM, CNPJ 02.671.743/0001-19). QSA registra dois diretores: Maurício Antonio Quadrado (entrada 15/09/2020)
  e Artur Martins de Figueiredo (entrada 25/09/2020) — nome não mapeado anteriormente no acervo. Como
  sociedade anônima fechada, o QSA da Receita Federal registra apenas diretores/administradores, não o
  quadro acionário completo — a participação de Tanure, via debêntures (instrumento de dívida, não ação),
  não apareceria nesse registro mesmo que existisse.'
