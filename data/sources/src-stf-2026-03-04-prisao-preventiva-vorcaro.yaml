source_type: official_court
summary: 'Comunicação oficial do STF: o ministro André Mendonça, relator da PET 15556, determinou em 04/03/2026
  a prisão preventiva de Daniel Vorcaro, Fabiano Zettel, Luiz Phillipi Machado de Moraes Mourão e Marilson
  Roseno da Silva, a pedido da PF, por ''risco concreto de interferência nas investigações''; determinou
  a suspensão de empresas vinculadas e medidas cautelares a servidores do Banco Central (Paulo Sérgio
  Neves de Souza e Belinne Santana) e a Ana Cláudia Queiroz Paiva e Leonardo Palhares.'
