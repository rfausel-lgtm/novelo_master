summary: Comunicado oficial sobre a Operação Sem Desconto, deflagrada em 23/04/2025 pela PF em conjunto
  com a CGU, que investiga esquema nacional de descontos associativos não autorizados sobre benefícios
  do INSS, com prejuízo estimado em R$ 6,3 bilhões entre 2019 e 2024. Antônio Carlos Camilo Antunes, o
  'Careca do INSS', é apontado como articulador do esquema via entidades associativas.
