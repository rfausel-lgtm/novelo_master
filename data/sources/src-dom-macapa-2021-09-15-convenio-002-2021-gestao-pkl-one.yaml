summary: Edição nº 4.141, páginas 28 a 32, com extrato integral; processo 7.121/2021. Assinado em 15/09/2021
  pelo secretário municipal de Gestão, João Carlos Calage Alvarenga, e por Marcos Oliveira Calmon de Bittencourt
  pela empresa. Vigência de doze meses prorrogáveis até sessenta, o que projeta termo final em 15/09/2026.
  As páginas do diário são imagem sem camada de texto e exigiram reconhecimento óptico. Nenhum ato administrativo
  de rescisão foi publicado; os repasses à empresa somaram R$ 37,99 milhões entre 2023 e 12/06/2026, em
  subconta extra-orçamentária.
