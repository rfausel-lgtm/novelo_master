summary: Cobertura da Operação Presciência, deflagrada pela PF em 25/08/2026 contra o Instituto Municipal de Previdência
  de Campo Grande (IMPCG), com seis mandados de busca e apreensão e afastamento dos sigilos bancário e fiscal dos
  investigados. O inquérito apura gestão temerária, corrupção passiva e corrupção ativa, a partir de Relatório de
  Auditoria Direta — Letras Financeiras da Coordenação-Geral de Auditoria do Ministério da Previdência Social, que
  apontou 'possíveis irregularidades no processo decisório' do investimento de R$ 1,2 milhão. Registra que, à época
  dos fatos, o IMPCG era comandado por Camilla Nascimento, hoje vice-prefeita de Campo Grande e secretária municipal
  de Assistência Social — ambos os endereços foram alvo de diligência.
