summary: Em 01/06/2026 a Polícia Civil de São Paulo deflagrou a Operação Wi-Fi para apurar suspeita de
  fraude no contrato de R$ 108 milhões entre a Prefeitura e o Instituto Conhecer Brasil. Oito mandados
  de busca e apreensão autorizados pela 1ª Vara Regional das Garantias alcançaram o ICB, a Go Up Entertainment,
  endereços ligados a Karina Ferreira da Gama e a Secretaria Municipal de Inovação e Tecnologia. O contrato
  investigado é o Termo de Colaboração 01/SMIT/2024, para 5 mil pontos de wi-fi gratuito em comunidades
  periféricas, com custo mensal de R$ 1,8 mil por ponto.
