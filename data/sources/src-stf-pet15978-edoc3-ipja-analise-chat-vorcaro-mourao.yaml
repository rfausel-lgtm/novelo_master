summary: 'Informação de Polícia Judiciária de Análise de 198 páginas, também baseada no aparelho celular
  de Daniel Bueno Vorcaro (mesmo inquérito 2025.0087917 do e-Doc 4), mas com foco específico e exaustivo
  no chat de WhatsApp entre Vorcaro e Luiz Phillipi Mourão ("Sicário"), cobrindo o período de 18/10/2023
  a 17/11/2025. É a análise técnica mais longa e granular do acervo sobre essa relação: qualifica
  formalmente Marilson Roseno da Silva como líder de "A Turma" a partir do episódio do drone (05-06/04/2024,
  já registrado), narra dia a dia mais de dois anos de trocas entre os dois, e fecha com a análise
  financeira dos repasses mensais via Fabiano Zettel e Ana Cláudia Queiroz de Paiva — inclusive o cálculo
  da própria PF de que Mourão recebeu, no mínimo, R$ 24 milhões ao todo, e "A Turma" R$ 9,6 milhões.
  Revela também episódios de coleta de dados pessoais contra alvos não cobertos em nenhuma outra peça já
  lida, entre eles os quatro advogados responsáveis por um pedido de busca e apreensão contra o Banco
  Master, e uma escalada verbal ("medida mais drástica", "matar esses negócios") contra Vladimir Timerman
  e um advogado não identificado, em agosto de 2024.'
notes: 'Documento obtido pelo próprio Rafael via certificado digital, parte do download completo da PET
  15.978 (378 peças) — mesma política de divulgação aplicada às demais peças. Não foi lido linha a linha
  em sua integralidade: as 170 páginas do chat (seção 2.2) foram varridas por frequência de nomes próprios
  para localizar episódios inéditos, e trechos de alta densidade foram lidos por inteiro.'
