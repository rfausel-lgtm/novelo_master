title: 'CNJ faz operação em gabinete de desembargador Newton Ramos, ligado à ‘Turma do KN’'
publisher: Times Brasil (CNBC)
author: Amanda Souza
publication_date: '2026-09-24'
url: https://timesbrasil.com.br/brasil/cnj-faz-operacao-em-gabinete-de-desembargador-newton-ramos-ligado-a-turma-do-kn/
source_type: press
language: pt-BR
summary: >-
  O CNJ iniciou em 24/09/2026 (quinta-feira) uma correição extraordinária no gabinete do desembargador federal
  Newton Ramos, determinada pelo corregedor nacional, para levantar informações sobre processos do setor
  sucroalcooleiro; o TRF-1 confirmou a diligência e, em nota, afirmou ter determinado "integral colaboração" e
  que o procedimento não representa antecipação de responsabilidade; Newton não foi afastado; o escritório de
  que Camilla Ramos é sócia firmou contrato de honorários de êxito de 5% em 12 processos (até R$ 427 milhões).
notes: >-
  O título usa a expressão do veículo. A frase sobre antecipação de responsabilidade é paráfrase do veículo,
  não citação literal da nota. A matéria descreve Newton Ramos como ex-juiz auxiliar de Nunes Marques na
  vice-presidência do TRF-1; o dado não é registrado neste lote.
