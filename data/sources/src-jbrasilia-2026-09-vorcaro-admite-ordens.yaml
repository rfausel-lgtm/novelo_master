source_type: press
summary: 'Em depoimento ao gabinete de André Mendonça, Vorcaro falou pela primeira vez sobre a suspeita
  de comandar grupo liderado por Luiz Phillipi Mourão: disse que as ordens para agredir ou ameaçar adversários
  foram dadas porque ''estava nervoso'' e que não se concretizaram. Segundo o Estadão, negou crimes financeiros
  na venda ao BRB, disse ter se aproximado de políticos apenas para sua ''proteção'' e afirmou ter delação
  a fazer sobre integrantes do governo.'
