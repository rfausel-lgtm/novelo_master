summary: Petição da PF informando endereços pendentes de alvos da PET 15.198 e pedindo reconsideração
  parcial da decisão de 06/01/2026, que indeferira nova busca no endereço atual de Daniel Vorcaro — citando
  notícias de mídia sobre o "Projeto DV" (contratação de influenciadores para defender a imagem de Vorcaro
  e atacar a legitimidade do Banco Central) como indício de novos crimes que justificariam a medida.
notes: 'Peça 20 (e anexos 21/22) de 50 obtidas por Rafael via certificado digital no peticionamento
  eletrônico do STF (pasta local "Pet 15198-1_50") — mesma política de divulgação já aplicada às demais
  peças obtidas por certificado. O Projeto DV em si já está bem documentado no acervo via INQ 5.035; esta
  peça é a primeira a ligá-lo explicitamente a um pedido de busca dentro da PET 15.198. Rodapé de impressão
  com CPF de quem baixou o documento nunca reproduzido no acervo.'
