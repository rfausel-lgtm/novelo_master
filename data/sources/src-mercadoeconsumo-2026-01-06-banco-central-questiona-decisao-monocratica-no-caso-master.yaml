summary: Informa que o Banco Central opôs embargos de declaração no TCU contra a decisão monocrática de
  Jhonatan de Jesus que determinou inspeção no BC sobre o processo do Banco Master, sustentando que o
  Regimento Interno reserva a decisões colegiadas a determinação de inspeções em órgãos federais, e transcreve
  trecho dos embargos; registra o recesso do TCU até 16/01.
