title: Justiça mantém decisão que proíbe saída de Eduardo Sodré do Brasil; possível fuga é citada em medida
publisher: Bahia Notícias
publication_date: '2026-09-14'
url: https://www.bahianoticias.com.br/noticia/321131-justica-mantem-decisao-que-proibe-saida-de-eduardo-sodre-do-brasil-possivel-fuga-e-citada-em-medida
source_type: press
summary: Relata que o ministro André Mendonça indeferiu pedidos de viagem ao exterior de Eduardo Sodré (França e
  COP17) e de Guilherme Henrique Sodré Martins (Itália, de 3 a 13/09/2026, para "participar como expositor na 61ª
  Bienal de Veneza"), mantendo suspensão de passaporte e impedimento de saída. A defesa de Guilherme alegou passagens
  compradas antes da operação e patrimônio lícito; a decisão citou o estágio embrionário da investigação e a capacidade
  financeira do investigado.
