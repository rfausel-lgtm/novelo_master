source_type: press
summary: A AGU, sob o Advogado-Geral da União Jorge Messias, anunciou que recorreria da decisão de Mendonça
  até 09/09/2026, com o argumento de que ele teria cometido 'violação de competência privativa da Presidência
  da República' ao afastar o diretor-geral da PF monocraticamente. A matéria não indica que o recurso
  já tenha sido protocolado — usa tempo verbal futuro. Fontes secundárias divergem sobre o dispositivo
  legal exato invocado no recurso (Lei 9.266/1996 em algumas coberturas, art. 84, XXV, da Constituição
  em outras); o texto do recurso não foi localizado para verificação direta.
