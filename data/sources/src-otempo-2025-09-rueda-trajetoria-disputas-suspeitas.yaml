source_type: press
summary: 'Perfil biográfico: Rueda assumiu a presidência interina do PSL em 2018, articulou a fusão PSL+DEM
  que criou o União Brasil em 2021 (maior bancada do Congresso) e aliou-se ao ex-presidente da Câmara
  Arthur Lira. Rompeu com Luciano Bivar em agosto de 2023, crise durante a qual imóveis de Rueda e de sua
  irmã no litoral de Pernambuco foram incendiados — caso apurado pelo STF. Cita que seu nome "foi citado em
  investigação da Polícia Federal sobre o envolvimento do PCC", com suspeita de participação oculta em
  jatos executivos usados por membros da facção, já registrada no corpus por outra via (Carbono Oculto).
  Não menciona o Banco Master.'
