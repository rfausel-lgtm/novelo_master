title: PF diz que Vorcaro bancou despesas de viagem de Ciro Nogueira e Hugo Motta para Lisboa
publisher: Estadão Conteúdo (republicado pelo Diario de Pernambuco)
publication_date: '2026-06-16'
url: https://www.diariodepernambuco.com.br/brasil/2026/06/11716738-pf-diz-que-vorcaro-bancou-despesas-de-viagem-de-ciro-nogueira-e-hugo-motta-para-lisboa.html
source_type: wire
language: pt-BR
summary: >-
  Segundo a matéria, Vorcaro encomendou cinco diárias de suíte júnior no Four Seasons de Lisboa para Ciro
  Nogueira e Hugo Motta, em pedido de 18/06/2024; de acordo com a PF, o custo total para cada um seria de
  cerca de R$ 90 mil, com base na cotação do euro da época. Registra que Motta disse ter "muita tranquilidade"
  e que a defesa de Vorcaro não comentou.
notes: >-
  Publicada às 20h16 de 16/06/2026. A cifra por pessoa diverge das demais fontes; o Novelo a registra apenas
  como atribuída ao veículo; o texto diz que, "de acordo com a PF, o custo total para cada um seria de cerca
  de R$ 90 mil", e a fórmula "cerca de R$ 90 mil para cada um" não é literal. A matéria
  também cita um total de despesas de viagem de Ciro com roteiro diferente do da Agência O Globo; esse trecho
  não é usado.
