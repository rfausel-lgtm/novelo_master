summary: O primeiro convênio, nº 01/2021, foi assinado em 09/02/2021 e publicado na edição 2.766 daquele
  dia, página 5, para operacionalização das consignações do Cartão Credcesta. Em 23/08/2021 a Portaria
  SEMAD nº 036/2021 designou servidora como fiscal do instrumento, identificando-o expressamente como
  'PKL ONE PARTICIPAÇÃO S.A. (CONVÊNIO CREDCESTA)'. Um segundo convênio, nº 002/2024, foi assinado em
  31/07/2024 e publicado na edição 4.230 daquele dia, página 8, estendendo o cartão de benefício a servidores
  civis e militares, ativos, inativos, aposentados e pensionistas. É o ato mais recente localizado em
  toda a varredura municipal baiana.
