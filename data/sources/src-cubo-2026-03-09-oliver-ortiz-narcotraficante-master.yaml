summary: 'Reportagem que reconstrói o vínculo de Oliver Ortiz de Zárate Martin, narcotraficante espanhol
  condenado no Brasil em 2013, como cotista de fundos geridos por Benjamim Botelho de Almeida, ligados à
  aquisição do Banco Máxima. Registra que tanto Botelho quanto Ortiz foram procurados por e-mail para se
  manifestar e nenhum dos dois respondeu: "Benjamim Botelho foi procurado por email, assim como Oliver
  Ortiz. Nenhum dos dois enviou resposta."'
