summary: 'Reportagem sobre o envio, pela Receita Federal, dos dados de pagamentos do Banco Master à CPI
  do Crime Organizado. Traz declaração direta de Guido Mantega: ''Prestei consultoria econômica financeira
  para o Banco Master em 2024 e parte de 2025, mediante contrato formal, e emissão de notas fiscais, encerrado
  em agosto de 2025. Quando firmei o contrato não tinha conhecimento de nenhuma irregularidade eventualmente
  cometida por essa instituição financeira.'''
