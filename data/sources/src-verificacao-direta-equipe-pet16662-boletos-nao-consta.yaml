summary: Releitura das 33 páginas da decisão de 08/09/2026 confirma que a expressão 'amanhã vence os boletos'
  não aparece em nenhum lugar do documento, nem qualquer menção a Jaques Wagner, Eduardo Sodré Martins
  ou à BN Financeira — o documento trata exclusivamente do afastamento cautelar de Andrei Rodrigues e
  Leandro Almada da Costa por monitoramento ilícito de Mendonça e da AGU. Fecha, por eliminação e por
  confirmação positiva na Pet 16.229, a origem documental exata da citação dos boletos.
