url: https://www.correiodamanha.com.br/politica/2026/06/294806-motta-diz-que-viajou-em-aviao-de-vorcaro-a-convite-de-ciro-nogueira.html
source_type: press
language: pt-BR
summary: >-
  Segundo a matéria, Hugo Motta admitiu ter viajado a Lisboa no jato de Daniel Vorcaro a convite do senador
  Ciro Nogueira e que a hospedagem foi paga por Vorcaro, mas disse ter "ganho" apenas duas diárias; disse
  ainda, em paráfrase do jornal, que em 2024 desconhecia as irregularidades atribuídas ao banqueiro. O
  relatório da PF, segundo a matéria, conta cinco diárias, de cerca de 3,1 mil euros (cerca de R$ 18,2 mil).
notes: Publicada às 19h00 de 17/06/2026. A matéria não traz as expressões "evento corporativo" ou "encontro jurídico".
