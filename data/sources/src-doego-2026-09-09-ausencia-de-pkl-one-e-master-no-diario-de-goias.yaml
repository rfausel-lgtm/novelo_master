summary: 'Levantamento da equipe no índice de texto integral do diário goiano, com cobertura verificada
  de 2007 a 2026. As buscas por ''PKL One'', ''PKL'', ''CredCesta'', pelo CNPJ 27.490.629 e por ''Banco
  Master'' retornaram conjunto vazio, ao passo que o mesmo índice devolve milhares de ocorrências para
  ''consignação'', o que atesta a validade do método. Conclusão: não há registro de credenciamento da
  operadora nem do banco no diário oficial de Goiás, embora o estado conste da lista de cobertura do produto
  desde 2022 — o que remete os convênios goianos ao nível municipal ou a outros entes.'
