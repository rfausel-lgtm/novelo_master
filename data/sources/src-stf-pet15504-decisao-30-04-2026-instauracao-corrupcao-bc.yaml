summary: 'Decisão pública (Resolução STF 427/2010), baixada diretamente do portal do STF, que autoriza,
  vinculado ao INQ 5.026, a instauração formal de investigação para apurar "eventuais crimes de corrupção
  ativa e passiva, de formação de organização criminosa, de lavagem de capitais, de violação de sigilo
  funcional, além de outros contra o Sistema Financeiro Nacional" que teriam sido praticados por Daniel
  Bueno Vorcaro em coautoria com dois servidores do Banco Central: Paulo Sérgio de Souza e Belline
  Santana. É o ato formal que nomeia, pela primeira vez em um único documento judicial, os três em
  coautoria pelo conjunto de crimes — ambos os dois servidores já eram extensamente documentados no
  acervo por fontes de imprensa, mas não por este ato de instauração. Despachos posteriores (13/07/2026 e
  04/09/2026, também baixados) mostram sucessivas prorrogações de prazo por 60 dias — a investigação
  seguia em curso, sem denúncia, até a data mais recente disponível.'
notes: Documento público, baixado diretamente do portal do STF. Não depende do certificado digital do
  Rafael.
