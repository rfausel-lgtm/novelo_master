summary: 'Consulta direta à API pública do DJEN pelo nome da advogada, feita por esta sessão em 17/09/2026: 177
  publicações distribuídas em 15 processos, no TRF-1, TJDFT, STJ, TJMG, TJRJ e TJMA, concentradas em matéria antiga
  (um cumprimento de sentença de 2008 responde por 99 delas). Nenhum processo tem o Banco Master como parte; as
  ocorrências das palavras ''Master'' e ''BRB'' nos textos vêm de outros processos listados nas mesmas pautas de
  julgamento.'
