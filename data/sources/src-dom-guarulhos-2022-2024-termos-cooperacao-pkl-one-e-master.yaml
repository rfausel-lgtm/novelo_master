summary: 'Três instrumentos com PDF conferido pela equipe. O primeiro termo de cooperação não oneroso
  com a operadora, para cartão benefício, foi assinado em 10/06/2022, com 24 meses, e publicado na edição
  nº 2.407 de 15/06/2022, página 9. O segundo, para cartão benefício consignado, foi assinado em 11/06/2024,
  também com 24 meses, e publicado na edição nº 2.656 daquele dia, página 5. Um terceiro, com o Banco
  Master, para cartão de crédito consignado, foi assinado em 06/10/2023 e publicado em 10/10/2023. Varredura
  de texto integral em 2.069 edições indexadas, mais extração direta das edições de junho a setembro de
  2026, não localizou nenhum ato posterior à liquidação: o termo caducou por decurso de prazo em 11/06/2026,
  sem prorrogação e sem denúncia. Em 27/03/2026 o município publicou três novos termos com outra empresa,
  substituição de fato sem ato formal.'
