source_type: press
summary: 'Confirma a determinação de Zanin (prazo de 23h de domingo, 13/09/2026) e acrescenta que, mais cedo
  no mesmo domingo, a PF já havia informado ter plenas condições técnicas de produzir e enviar cópia dos
  dados do celular de Vorcaro a todos os gabinetes dos ministros — em resposta à intimação de 24h que Fachin
  havia dado no sábado (12/09). Cita a fundamentação de Zanin: "não existe hierarquia entre os ministros do
  Supremo Tribunal Federal" e "não se pode opor aos julgadores qualquer restrição ao acesso a informações".'
notes: Verificado por WebFetch direto. Não localizada, nesta reportagem nem em outra consultada (Migalhas),
