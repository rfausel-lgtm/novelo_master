summary: Registra que, em 15/07/2026, o FGC já havia desembolsado R$ 40,03 bilhões (98,54% do previsto)
  a mais de 718 mil credores nos três bancos do núcleo Master, restando R$ 590 milhões; somado a Pleno
  e Will Bank, o total pendente em todo o conglomerado era de R$ 1,83 bilhão.
