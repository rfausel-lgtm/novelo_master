source_type: press
summary: 'Mensagens do relatório da PF: em 21/12/2023 Faria pediu dados do carro de Vorcaro para autorizar
  a segurança; em 26/12 compartilhou o contato ''Alexandre de Moraes BRASILIA''; em 27/12 combinou almoço
  para 30/12 no Six Senses Botanique; em janeiro de 2024 tratou do prazo do contrato com o escritório
  de Viviane (''4 anos'', ''Mas pode fazer 3'') e confirmou jantar ''com o Alex'' em 02/02/2024; em 13/03/2024
  enviou recorte de conversa própria com Moraes.'
