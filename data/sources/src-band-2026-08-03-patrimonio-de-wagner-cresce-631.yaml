summary: 'Com base nas declarações de bens ao TSE: em 2018 Wagner declarou "um lote de terras em Vila de Abrantes,
  na cidade de Camaçari" por R$ 28 mil e patrimônio de R$ 3,3 milhões; em 2026, R$ 13,8 milhões em crédito decorrente
  da venda desse imóvel à SAF do Bahia e à Lagoons Empreendimentos, e patrimônio de R$ 24,5 milhões.'
