summary: Levantamento dos maiores recebedores de honorários do Banco Master, montado a partir de documentos de inteligência
  financeira tornados públicos por André Mendonça, de dados fiscais enviados à CPI do Crime Organizado e de relatórios
  da PF sobre o celular de Daniel Vorcaro. Lista Barci de Moraes (R$ 80,2 milhões), Monteiro, Rusu, Cameirão e Bercht
  (R$ 79 milhões), Warde (R$ 63,8 milhões), Gabino Kruschewsky (R$ 54 milhões), Alves Corrêa Verissimo Advocacia
  (cerca de R$ 32,9 milhões), Marcus Vinícius Furtado Coelho (R$ 27,5 milhões) e a Mytra Consultoria (R$ 30 milhões).
  É a única cobertura localizada que nomeia por extenso a sociedade Alves Corrêa & Veríssimo, três dias antes da
  reportagem do Estadão.
