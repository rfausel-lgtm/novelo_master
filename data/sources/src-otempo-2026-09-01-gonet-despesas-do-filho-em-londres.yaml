source_type: press
summary: 'Segundo relatório da PF enviado a André Mendonça em 27/08/2026, o procurador-geral teria pedido
  para levar um filho com despesas pagas a evento organizado por Vorcaro em Londres e sugerido a inclusão
  de charutos e uísque Macallan no serviço. Em 29/03/2025 teria perguntado, por meio do advogado Ciro
  Soares, se poderia levar o filho; o banqueiro respondeu ''Óbvio, né''. Cerca de 15 dias depois Vorcaro
  aprovou a inclusão na lista de convidados custeados: ''Pedro e Ciro (Soares), ok. Não dá para bancar
  outros''. O ministro intimou Gonet a se manifestar em até cinco dias.'
