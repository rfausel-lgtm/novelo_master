summary: 'Notícia institucional que comprova a existência do Programa CrediCesta antes de 2018: descreve
  a EBAL apresentando o programa aos servidores do Tribunal, como linha de crédito rotativo com cartão
  magnético, sem anuidade, para compras em mais de 280 lojas da Cesta do Povo em 236 municípios, com desconto
  em folha. O convênio com o TCE-BA foi assinado em 13/05/2014.'
