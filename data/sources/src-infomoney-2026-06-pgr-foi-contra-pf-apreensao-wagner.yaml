summary: Registra parecer da PGR de 16/06/2026, dois dias antes da operação, manifestando-se contra os
  pedidos de apreensão de dinheiro, joias e relógios — sob o argumento de que atrairia 'atenção midiática
  desnecessária' sem contribuir para a apuração — e contra a busca no gabinete parlamentar, que configuraria
  'ingerência entre os poderes'.
