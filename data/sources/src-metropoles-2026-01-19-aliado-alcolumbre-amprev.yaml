source_type: press
summary: José Milton Gonçalves, conselheiro da Amapá Previdência indicado pelo governador Clécio Luís
  e próximo de Josiel Alcolumbre, sugeriu o investimento de R$ 400 milhões em títulos do Master, apoiado
  pelo presidente do fundo, Jocildo Lemos, indicado por Alcolumbre (segundo o Estadão); foi removido em
  dezembro de 2025. Davi Alcolumbre negou qualquer relação com a indicação ou com a aquisição dos papéis.
