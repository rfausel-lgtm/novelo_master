summary: Registra e publica em PDF a íntegra do despacho de Edson Fachin, presidente do STF, de 10/09/2026, na PET
  16.704, determinando a Mendonça a remessa em HD de todos os procedimentos da PET 15.556 e o levantamento do sigilo
  dela, ressalvadas diligências pendentes. Explica que a PET 16.662 foi formada a partir da PET 15.556, e que a
  medida antecede a sessão extraordinária de 15/09/2026, que julgará o relatório da PF sobre conversas entre Moraes
  e Vorcaro e o pedido da PGR de nulidade do relatório.
