source_type: press
summary: 'Afirma que Beto Degani é primo de Dias Toffoli e que o advogado Euclides Gava era amigo de longa data dele;
  que Degani e Gava compraram, em 2000, mais de 100 mil metros quadrados da Fazenda Laranjeira, onde surgiu o resort;
  que a DGEP Empreendimentos, incorporadora do Tayayá, foi registrada em 2006 para a obra; e que em 2025 as
  participações de todos os sócios, inclusive as de Toffoli e parentes, foram compradas pelo advogado Paulo Humberto
  Barbosa. Traz a afirmação de Toffoli de que "todo o seu patrimônio foi declarado à Receita Federal".'
