summary: Thiago Miranda Silva, publicitário, dono da Agência MiThi, ex-CEO e ex-sócio do Grupo Léo Dias;
  apontado pela PF como articulador do 'Projeto DV' via agência Unlimited, com propostas de até R$ 2 milhões
  a influenciadores. Em depoimento à PF em 12/05/2026 confirmou o plano, mas disse que sua atuação se
  limitava a fechar contratos e repassar recursos.
