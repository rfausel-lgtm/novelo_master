source_type: wire
language: pt-BR
summary: Texto da Reuters, de 24/04/2026, que relata, com base em nota do Banco Central, que o CMN aprovou em
  23/04/2026 regra mais rigorosa para bancos que captam com garantia do FGC, com o indicador Ativo de
  Referência (AR) e a obrigação de direcionar parte dos recursos a títulos públicos federais quando a captação
  garantida superar o AR, em vigor a partir de 1º de junho de 2026 com aplicação gradual, além de ajustes de
  exigências de liquidez.
notes: Texto lido por lote:fonte em 23/10/2026. É a única fonte do lote que reproduz a nota do BC com aspas; a
  nota em si não foi aberta. A matéria contextualiza com o caso Master e com menções a Daniel Vorcaro,
  assuntos que o Novelo não importa para este lote. As medidas de liquidez são tratadas por outra resolução
  (ver Capital Aberto) e não entram nos registros.
