summary: 'Despacho de 12/07/2026 que desentranha da PET 15.556, para autuação em procedimentos autônomos
  vinculados à Pet 16.292, duas notícias-crime contra o senador Flávio Bolsonaro — uma da deputada federal
  Luciene Cavalcante, sobre o financiamento do filme Dark Horse (já no acervo), outra do deputado federal
  Henrique dos Santos Vieira Lima, que traz um fato até então não registrado no corpus: segundo colunista
  Igor Gadelha (Metrópoles, 19/05/2026), confirmado pelo próprio Flávio Bolsonaro ao jornal O Globo na
  mesma data, o senador visitou Daniel Vorcaro em sua residência particular em São Paulo no final de 2025,
  período em que o banqueiro já cumpria restrições cautelares impostas pelo Judiciário.'
notes: Confirma os números de processo de quatro petições conexas sobre o Dark Horse — Pet 16.292, 16.078,
  16.063 e 16.059 — as duas últimas já identificadas no lote 182 via petição do PT.
