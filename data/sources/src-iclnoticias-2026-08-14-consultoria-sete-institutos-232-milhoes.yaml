summary: 'Registra a decisão do ministro André Mendonça (STF) que autorizou, em 12/08/2026, busca e apreensão na
  sede da Crédito & Mercado, com apreensão de ''relatórios internos, contratos, notas fiscais, critérios de remuneração,
  relação de clientes, comunicações com representantes do Master e diferentes versões de documentos''. Lista os
  sete institutos identificados como clientes da consultoria que investiram cerca de R$ 232 milhões no Master: Maceió
  (R$ 97 milhões), São Roque (R$ 93,15 milhões), Araras (R$ 29 milhões), Santo Antônio de Posse (R$ 7 milhões),
  São Gabriel do Oeste (R$ 3 milhões), Angélica (R$ 2 milhões) e Campo Grande (R$ 1,2 milhão). Registra que, em
  Araras, a consultoria produziu em fevereiro de 2024 um parecer sobre letras financeiras do Master.'
