summary: Quatro edições lidas pela equipe. Em 07/07/2021, ata de julgamento assinada em 05/07/2021 declara a empresa
  INAPTA ao credenciamento, no processo nº 86248174/2021. Em 22/07/2022, nova ata, de 20/07/2022, a declara APTA,
  no processo nº 22.5.000000352-2. Em 26/08/2022, o Termo de Inexigibilidade de Licitação autoriza o credenciamento
  pelo Chamamento Público nº 004/2022, com fundamento no artigo 25 da Lei 8.666/93, após parecer jurídico nº 96,
  de 05/08/2022. Em 21/09/2022, o extrato do Contrato de Credenciamento nº 059/2022 registra assinatura em 20/09/2022
  e vigência de doze meses, com objeto que alcança servidores ativos e também aposentados e pensionistas vinculados
  ao regime próprio de previdência do município.
