summary: 'Captura recuperada e lida diretamente pela equipe. O seletor traz 21 unidades da federação mais
  a entrada ''BR'': AM, AP, BA, BR, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, SC, SE, SP
  e TO. Ausentes: AC, AL, CE, DF, RR e RS. A entrada ''BR'' corresponde ao convênio federal, coerente
  com o balanço do banco, que separa o consignado do instituto federal da expansão regional.'
