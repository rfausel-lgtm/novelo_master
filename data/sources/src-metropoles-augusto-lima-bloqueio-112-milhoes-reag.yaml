summary: 'A 22ª Vara Cível do TJSP bloqueou, em 29/04/2025, R$ 112,8 milhões de Augusto Lima em conta
  na Reag Trust DTVM (a maior parte de um total de contas bloqueadas), numa execução de dívida movida
  pela família ex-controladora do Banco Voiter (cobrança original de R$ 470,5 milhões contra banqueiros
  do Master). O bloqueio foi suspenso 8 dias depois, em maio/2025, por acordo entre as partes. Há também
  acusação, na mesma ação, de blindagem patrimonial: doação de quotas de holding às duas filhas mais velhas
  de Lima em dezembro de 2019, com retenção de usufruto vitalício dos direitos políticos e econômicos,
  e transferência de imóveis (casa de veraneio e apartamento na Bahia) a estruturas societárias distanciadas
  de sua titularidade direta.'
