summary: Decisão que aceitou as propostas de termo de compromisso no processo sobre as emissões de debêntures
  da Centara e da Simsan. Lista os proponentes, entre eles 'DANIEL BUENO VORCARO, na qualidade de diretor
  da MÁXIMA S.A. CCTVM (intermediária líder), por infração ao item I c/c item II, letra c, da ICVM 8,
  e ao inciso I do artigo 11 da ICVM 476'. Total de R$ 2.325.000, sendo R$ 250 mil de Vorcaro, R$ 1 milhão
  da Máxima CCTVM, R$ 300 mil da Índigo, R$ 300 mil de Benjamim Botelho de Almeida, R$ 250 mil de Luiz
  Antonio Bull, R$ 100 mil da Simsan, R$ 100 mil de Zadra e R$ 25 mil de Saito. Aprovação por unanimidade,
  com o diretor Alexandre Rangel declarando-se impedido.
