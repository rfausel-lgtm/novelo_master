source_type: press
summary: 'Reportagem que reconstitui a privatização: dois leilões desertos com lance mínimo de R$ 81 milhões
  (janeiro de 2016 e março de 2018) e a arrematação em 11/04/2018 por R$ 15 milhões, com único interessado.
  Registra que o Estado pagou cerca de R$ 93 milhões em dívidas remanescentes da Ebal entre 2019 e 2026,
  com base em dados do Transparência Bahia. Afirma textualmente: ''O responsável pela organização do leilão
  foi o então secretário de Desenvolvimento, Jaques Wagner; o governador à época era Rui Costa''.'
