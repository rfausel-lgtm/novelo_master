summary: Representação lida na íntegra pela equipe. Registra a constituição da BN Financeira em 08/07/2021,
  como microempresa de capital social de R$ 45.000,00, e a transferência documentada de R$ 3,5 milhões
  em 17/10/2025, com comprovante bancário. Consigna expressamente que 'o total de repasses às empresas
  vinculadas ao núcleo familiar do Senador JAQUES WAGNER são maiores do que a transferência tratada' e
  que 'possivelmente outras operações foram realizadas'. Ao datar a contratação em 2022 e descrever o
  objeto contratual, remete em nota de rodapé a reportagem de imprensa e a declarações atribuídas ao sócio
  da empresa. Sustenta como hipótese investigativa que 'os contratos tenham sido produzidos para conferir
  aparência de licitude às transferências de valores, que não correspondem à remuneração de serviço efetivamente
  prestado'.
