summary: Informa que a PF cancelou os depoimentos de Augusto Ferreira Lima, de Angelo Antonio Ribeiro da Silva
  e de Robério Cesar Bonfim Mangueira (este descrito como superintendente do BRB), marcados para 27/01/2026, e
  que as defesas alegaram não ter tido acesso ao conteúdo das investigações e, por isso, os investigados não
  responderiam aos questionamentos. Registra que, em 26/01, apenas o ex-diretor financeiro do BRB Dario
  Oswaldo Garcia Junior respondeu às perguntas dos investigadores. O texto descreve a investigação em
  linguagem do próprio veículo, que o Novelo não adota.
