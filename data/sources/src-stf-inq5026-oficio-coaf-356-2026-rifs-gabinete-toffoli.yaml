summary: 'Reportando-se à decisão de 20/02/2026 no INQ 5.026 sobre o pedido da CPMI do INSS de reaver o
  material de suas quebras de sigilo, o COAF informa que, em cumprimento a decisão na Reclamação 88.121,
  dois Relatórios de Inteligência Financeira haviam sido compartilhados com o gabinete do ministro Dias
  Toffoli — um elaborado a pedido da CPMI do INSS e outro espontâneo. Pede orientação sobre se deve
  difundi-los às autoridades competentes (a CPMI, no primeiro caso; PF e MPF, no segundo) e sobre como
  tratar novos pedidos da CPMI e novos RIFs espontâneos.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). Juntada ao INQ 5.026 como petição, encaminhada por e-mail do
  gabinete da presidência do COAF em 25/02/2026. Cita o Ofício SEI nº 231/2026/COAF, não localizado.'
