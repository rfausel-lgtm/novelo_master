summary: 'Seis documentos oficiais da Pet 16.662, obtidos pelo editor via peticionamento eletrônico com
  certificado digital e lidos integralmente pela equipe: (1) petição do Partido Novo de 03/09/2026 pedindo
  prisão preventiva de Andrei Rodrigues (código de autenticação 0C73-8BDB-DAFB-089F); (2) decisão monocrática
  de André Mendonça de 08/09/2026, 33 páginas; (3-6) ofício à Corregedoria-Geral da PF e três mandados
  de intimação (a Andrei Rodrigues, a Leandro Almada da Costa, e ao Ministro da Justiça e Segurança Pública).
  Cada documento tem código de autenticação próprio, verificável no portal do STF.'
