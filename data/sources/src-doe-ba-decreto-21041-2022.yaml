source_type: official_gazette
summary: Decreto que reescreve o art. 15 do Decreto nº 17.251/2016. Texto integral extraído e conferido
  pela equipe. O novo caput faculta a portabilidade apenas quanto às instituições 'mencionadas no art.
  9º' — que trata de instituições financeiras —, e o parágrafo único dispõe que 'às consignações realizadas
  pelas demais consignatárias não se aplica a faculdade prevista no caput'. O art. 2º revoga os incisos
  I a V do art. 15, que continham o procedimento detalhado de portabilidade. Assinado por Rui Costa, Carlos
  Mello (Casa Civil em exercício) e Edelvino Góes Filho.
