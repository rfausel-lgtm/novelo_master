source_type: press
language: pt-BR
summary: Noticia, em 24/09/2026, a decisão na ADI 7.791 que manda a PF instaurar inquérito "para investigar
  possíveis irregularidades na atuação da CVM", com prazo inicial de 60 dias para relatório, e que dá à CVM 72
  horas para enviar a íntegra do processo administrativo; registra que a decisão "não atribui crimes a pessoas
  específicas"; publica a íntegra; e relata que, em 20/09, Dino deu 90 dias à União para avaliar e revisar as
  normas da autarquia, sob coordenação do Ministério da Fazenda.
notes: Aberta com lote:fonte em 21/10/2026. Não traz manifestação da CVM, da PF nem do FGC. É a fonte da
  descrição do teor da decisão de 20/09/2026, cuja íntegra o Novelo não leu.
