source_type: press
language: pt-BR
summary: Coluna que relata que Vorcaro assinou na noite de 19/03/2026 termo de confidencialidade com a PGR e a
  PF; diz que a coluna apurou que o documento abre caminho para tratar de uma possível delação, que a mudança
  do local de custódia foi um dos termos discutidos e foi autorizada por Mendonça, e que a defesa disse,
  segundo interlocutores, que cogitava uma delação e ouviu dos investigadores que a colaboração seria
  bem-vinda. Traz imagens da chegada dele à Superintendência da PF. Não traz conteúdo de colaboração.
notes: Lida por lote:fonte em 23/10/2026 (o endereço canônico da página é o da coluna, com "firma" no slug e
