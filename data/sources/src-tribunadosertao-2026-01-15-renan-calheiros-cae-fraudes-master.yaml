url: https://www.tribunadosertao.com.br/politica/2026/01/15/845117-renan-calheiros-diz-que-senado-vai-acompanhar-de-perto-fraudes-do-banco-master
source_type: press
summary: 'Em publicação nas redes sociais, o senador Renan Calheiros (MDB-AL), presidente da Comissão de
  Assuntos Econômicos (CAE) do Senado, afirmou que a CAE "vai acompanhar de perto as fraudes do Banco
  Master, uma das maiores da história" e que "o Senado não se curva a abusos do sistema financeiro. Vamos
  fiscalizar, cobrar explicações e proteger a economia do país sem blindar quem quer que seja, esteja onde
  estiver."'
