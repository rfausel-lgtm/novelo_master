source_type: press
summary: A PF investiga Jocildo Silva Lemos (então diretor-presidente da Amprev e coordenador do Comitê
  de Investimentos), José Milton Afonso Gonçalves e Jackson Rubens de Oliveira por aprovarem, em julho
  de 2024 e em menos de 20 dias, R$ 400 milhões em letras financeiras do Master sem documentação técnica
  prévia (operação Zona Cinzenta, 06/02/2026, Justiça Federal). Lemos foi tesoureiro de campanha de Alcolumbre
  e indicado por ele. A assessoria do senador não respondeu.
