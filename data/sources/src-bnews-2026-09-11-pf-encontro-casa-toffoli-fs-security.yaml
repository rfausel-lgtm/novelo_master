source_type: press
summary: 'Descreve mensagens analisadas pela PF, de março de 2024, em que Toffoli enviou a Vorcaro um endereço
  residencial no Lago Norte (Brasília) marcando encontro às 9h, e Vorcaro respondeu na manhã seguinte "Bom dia
  tudo bem? A caminho, Pelo waze devo me atrasar uns 15 minutos"; a PF concluiu que o endereço corresponde à
  residência conhecida de Toffoli e classificou a visita como "plausível", sem confirmá-la. Também identifica
  Alberto Leite — dono da empresa de segurança FS Security, amigo de Toffoli — como quem assumiu o controle do
  fundo Arleen, e cita mensagem de Vorcaro a Zettel perguntando "Como chama o FIP?", respondida "FIP Arleen",
  seguida de mensagem de Vorcaro a Leite confirmando disposição de executar o negócio já tratado entre eles.'
