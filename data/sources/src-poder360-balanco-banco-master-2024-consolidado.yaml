summary: 'Demonstrações financeiras auditadas. Na seção Varejo, p. 5: ''o cartão benefício está presente
  em 24 estados (ante 20 em 2023) e 176 municípios (contra 130 em 2023)''. A nota explicativa 14, ''Serviços
