source_type: press
summary: 'Relatório do Coaf (via Estadão e Folha): o Master transferiu R$ 6,6 milhões à Consult em 14
  operações entre outubro de 2024 e julho de 2025; o Coaf aventou uso como ''conta de passagem''; o período
  coincide com a negociação da venda do Master ao BRB. Kevin Marques recebeu R$ 281,6 mil em 11 transferências
  e disse tratar-se de assessoria jurídica por 11 meses; a Consult declarou pagamentos mensais de cerca
  de R$ 25 mil.'
