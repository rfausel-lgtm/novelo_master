summary: Noticia que o MPF denunciou Nelson Tanure por operações na Gafisa, protocoladas em quarta-feira (17),
  e cita Gilberto Benevides, controlador da Upcon, como atuando junto com Tanure segundo a denúncia. Registra
  a nota da defesa de Tanure e a nota da construtora; não traz manifestação de Benevides. Situa o inquérito na
  9ª Vara Criminal Federal de São Paulo.
