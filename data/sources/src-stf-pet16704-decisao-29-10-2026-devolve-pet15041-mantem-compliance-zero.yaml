summary: Decisão de 11 páginas assinada digitalmente em 29/10/2026 pelo Presidente do STF na PET 16.704.
  Devolve ao relator originário, ministro André Mendonça, os autos dos procedimentos da Operação Sem Desconto
  (PET 15.041) remetidos à Presidência em 12/09/2026; mantém na Presidência, em caráter excepcional e
  provisório, só os da Compliance Zero, por no máximo 90 dias contados de 12/09/2026; limita a competência
  transitória da Presidência; lista os eventos que levam à reavaliação e submete o ato ao referendo do
  Plenário. Declara que não reconhece de forma definitiva competência, prevenção ou conexão nem antecipa juízo
  sobre o mérito.
notes: A cópia foi obtida no site do Poder360, que a divulgou; o PDF traz no rodapé o código de autenticação
  do STF, não conferido no portal. Em 30/10/2026 os andamentos públicos da PET 16.704 ainda não registravam a
  decisão (a consulta não confirma nem contradiz a cópia). Reconferir e, se a decisão aparecer no portal,
  trocar a fonte principal. O acervo não reproduz o cabeçalho de partes e advogados nem o código e a senha do
  rodapé.
