source_type: press
summary: Cobertura da 8ª fase da Operação Compliance Zero, mesmo dia da decisão do STF que autorizou busca na casa
  de Cláudio Castro. Confirma que a origem do caso é a Operação Barco de Papel, com os R$ 970 milhões em letras
  financeiras entre outubro de 2023 e julho de 2024, e registra que a nova fase soma ao caso mais recursos aplicados
  em fundos de investimento do mesmo banco, totalizando 'cerca de R$ 3 bilhões' sob investigação enquanto Cláudio
  Castro governava o estado. Cita, com base em dados do Ministério da Previdência até fevereiro de 2026, que 19
  entes federativos — e não mais 18 — haviam aplicado no banco liquidado, incluindo Amprev (R$ 400 milhões), Maceió
  (R$ 97 milhões), São Roque (R$ 93,1 milhões) e Cajamar (R$ 87 milhões).
notes: O número de entes subiu de 18 (levantamento de 19/11/2025, usado como base desta investigação) para 19 (levantamento
  até fevereiro de 2026) — o décimo nono ente não foi nomeado nesta reportagem nem localizado em outra fonte consultada
  pela equipe até 10/09/2026.
