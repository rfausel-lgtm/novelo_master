summary: Resposta do Diretor-Geral da PF ao Min. Dias Toffoli, explicando o descumprimento do prazo de 24
  horas fixado em 12/01/2026 para a deflagração das medidas cautelares — atribuindo o atraso à instabilidade
  de endereços de alvos em viagem e à sobreposição com sete outras operações da DICOR e a 9ª fase da
  Operação Overclean (corrupção ligada a DNOCS/Bahia, sem relação com a Operação Compliance Zero). Pede
  reconsideração da ordem de lacrar os aparelhos apreendidos no gabinete do relator, citando risco de
  "autodestruição lógica de dados" e as "horas de ouro" de perícia em celulares.
notes: 'Peça 50 de 50 obtidas por Rafael via certificado digital no peticionamento eletrônico do STF (pasta
  local "Pet 15198-1_50") — mesma política de divulgação já aplicada às demais peças obtidas por
  certificado. É a versão da própria PF sobre um episódio de atrito institucional que a decisão de Toffoli
  (peça 40 do mesmo processo) registra em tom oposto, como descumprimento deliberado. Rodapé de impressão
  com CPF de quem baixou o documento nunca reproduzido no acervo.'
