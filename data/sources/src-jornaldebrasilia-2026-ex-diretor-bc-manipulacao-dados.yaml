source_type: press
summary: 'Reconstrói a trajetória de Paulo Sérgio Neves de Souza, servidor de carreira desde 1998: deixou
  a diretoria de Fiscalização e, em outubro de 2023, voltou a cargo de chefia como chefe-adjunto do Departamento
  de Supervisão Bancária, passando a atuar subordinado a Belline Santana no departamento que supervisionava
  o Master. Atribui a ele parecer favorável à aquisição do Master pelo BRB sem responder questões de outro
  departamento, e estudo sobre carteiras de crédito que levou a diretoria à convicção de que não havia
  motivo para preocupação. A defesa nega: ''nunca houve manipulação'' e ''todo processo é documentado,
  não sendo passível de manipulação por uma única pessoa''.'
