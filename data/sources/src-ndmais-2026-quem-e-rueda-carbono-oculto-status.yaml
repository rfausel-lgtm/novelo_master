summary: 'Perfil biográfico de Rueda (filho de médica e engenheiro espanhol, formado em direito tributário,
  aproximou-se de Luciano Bivar em 1998, fundou o escritório Rueda & Rueda com a irmã em 2008, presidiu o
  PSL e assumiu o União Brasil em 2024) e situação da apuração da Carbono Oculto sobre ele: segundo fontes
  ligadas ao caso, "não existem provas formais contra o dirigente do União Brasil, apenas indícios que
  estão sendo analisados", sem oitiva, indiciamento, denúncia ou arquivamento até setembro de 2026.'
