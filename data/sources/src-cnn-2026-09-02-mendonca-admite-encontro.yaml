summary: O gabinete de André Mendonça confirmou encontro único com Vorcaro em março de 2025, 'por iniciativa
  do próprio empresário', limitado a ação sobre precatórios em julgamento no STF, em que o ministro se
  restringiu a ouvi-lo; sobre os áudios de Ciro Soares, 'o ministro não comenta diálogos privados entre
  terceiros'. Cezinha de Madureira negou ato ilícito e disse que à época não havia informação pública
  de investigação sobre Vorcaro. Os diálogos foram revelados pelo ICL Notícias e confirmados pela CNN.
