summary: 'Série de publicações societárias levantada pela equipe. Ata de constituição de 20/03/2017: capital
  de R$ 100,00, sede em apartamento na Rua Tucuna, em Perdizes, objeto de mera participação em outras
  sociedades; as demonstrações de 31/12/2017 registram ativo total de R$ 100,00. Assembleia de 24/04/2018
  muda a sede para a Avenida Cidade Jardim, eleva o capital a R$ 1 milhão e dá entrada a Andrea Lima Novaes
  e Marcelo Maia Souza Marques. Assembleia de 07/05/2018 aprova a primeira emissão de debêntures, de subscrição
  privada, com remuneração fixada como percentual do lucro líquido; em 30/10/2018 o teto mensal é removido
  e a remuneração passa a 50% do lucro líquido da companhia. Assembleia de 31/05/2019 aprova o pagamento
  de R$ 15.875.000,00 e R$ 14.700.000,00 ''ao debenturista'', que não é nomeado nos extratos. O estatuto
  consolidado de dezembro de 2018 inclui no objeto social o ''licenciamento de ativos intangíveis não
  financeiros''.'
