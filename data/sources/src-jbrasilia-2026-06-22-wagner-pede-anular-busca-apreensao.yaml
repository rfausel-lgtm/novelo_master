source_type: press
summary: A defesa de Wagner pediu a Mendonça a anulação da busca e apreensão, alegando que ele 'jamais
  atuou no Congresso Nacional para favorecer o Banco Master', que sua única emenda sobre crédito consignado
  'propunha limitar juros... o contrário dos interesses do banco', e que os valores apreendidos 'têm origem
  lícita e comprovada'. Pedido pendente de decisão; se negado, a defesa recorrerá à 2ª Turma.
