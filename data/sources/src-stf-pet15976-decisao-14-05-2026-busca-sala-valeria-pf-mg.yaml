summary: 'Decisão pública (Resolução STF 427/2010), baixada diretamente do portal do STF, que defere pedido
  complementar da Polícia Federal de expedição de mandado de busca e apreensão especificamente na sala de
  trabalho da Delegada de Polícia Federal Valéria Vieira Pereira da Silva, dentro da Superintendência da
  Polícia Federal em Minas Gerais — distinta da busca domiciliar já afastada da decisão anterior.'
