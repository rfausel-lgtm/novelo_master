summary: 'Acórdão de relação 5184/2026 da 2ª Câmara do TCU, sessão de 20/10/2026 (Ata 36/2026), relator Jorge
  Oliveira, no TC 007.138/2026-1 (prestação de contas do Banco Central, exercício 2025; apenso: TC
  022.593/2025-0, relatório de auditoria). Considerandos: a AudBancos propõe julgar regulares as contas; o
  MPTCU, "embora tenha suscitado questão examinada em outro processo", reconheceu que os elementos dos autos
  não evidenciam irregularidades capazes de comprometer a regularidade das contas, e sua proposta subsidiária
  converge com a da unidade técnica. Dispositivo: os ministros acordam em levantar o sobrestamento determinado
  pelo Acórdão 5163/2026, julgar regulares as contas dos nove responsáveis listados, com quitação plena, e
  arquivar os autos. Determinações, recomendações ou orientações: não há.'
notes: "Consulta do editor-master em 21/10/2026 no navegador embutido (aplicação de página única; o endereço
  redireciona para pesquisa.apps.tcu.gov.br/documento/acordao-completo/...); texto registrado com lote:fonte
  --texto, sem os CPFs. O texto do portal coincide com o do PDF do excerto da Relação 34/2026 hospedado pelo
  Poder360 (https://static.poder360.com.br/uploads/2026/10/tcu-bc-master-2025.pdf, lido pelo redator em
  21/10/2026), que traz ainda os dados da sessão (Ata 36/2026, presidência de Jhonatan de Jesus,
  representante do MP na sessão Lucas Rocha Furtado). O resumo gerado por IA exibido pelo portal não é parte
  do acórdão e não foi usado. O portal exibe CPFs mascarados e o PDF, CPFs completos: nenhum é registrado
  (EDITORIAL §6). Captura de texto, sem os CPFs, em
  raw/capturas/2026-10-21/tcu-acordao-5184-2026-segunda-camara-excerto.txt."
