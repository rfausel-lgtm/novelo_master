summary: Descreve o uso de reavaliações imobiliárias para demonstrar capacidade econômica ao Banco Central.
  Registra que um terreno em Jequitibá (MG), regularizado por R$ 2,5 milhões em 2015, foi vendido por
  R$ 57 milhões ao FII São Domingos — valorização de 2.180% em dois anos —, operação que justificou receita
  operacional bruta de R$ 89 milhões da Viking Participações, por sua vez usada para lastrear o aporte
  de R$ 50 milhões exigido pelo BC. O Fundo São Domingos era abastecido por regimes de previdência de
  servidores públicos, teve prejuízo de R$ 109 milhões em 2017, e em 2022 a CVM multou a Foco DTVM e o
  diretor do fundo em mais de R$ 1 milhão por má gestão, incluindo operações que beneficiaram empresas
  da família Vorcaro.
