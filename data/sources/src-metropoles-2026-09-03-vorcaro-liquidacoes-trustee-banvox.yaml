summary: Descreve as duas DTVMs como braços operacionais do ecossistema do Master, administrando carteiras
  de fundos, emitindo debêntures estruturadas e viabilizando transferências de controle acionário. Registra
  bloqueio cautelar de R$ 24,2 milhões determinado pelo ministro Dias Toffoli (STF) envolvendo conjuntamente
  Banvox, Master, Vorcaro e Quadrado.
