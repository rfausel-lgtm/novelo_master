summary: 'Apuração exclusiva: articulação paralela na noite de 08/09/2026 entre integrantes do governo
  Lula e Flávio Dino para reverter o afastamento de Andrei Rodrigues antes de Fachin se posicionar; ao
  menos 4 dos 10 ministros do STF questionaram Fachin, na manhã de 09/09, se ele barraria a decisão de
  Dino por suposta ilegalidade processual; avaliação de que Fachin está cedendo ao grupo Gilmar Mendes-Dino-Moraes,
  que deseja retirar a relatoria do caso Master de Mendonça.'
