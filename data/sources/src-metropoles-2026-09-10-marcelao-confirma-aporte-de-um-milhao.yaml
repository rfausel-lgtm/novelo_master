source_type: press
summary: 'Duas notas publicadas em 10/09/2026, poucas horas depois da queda do sigilo da decisão, identificam o
  remetente de R$ 1 milhão à produtora citado por Flávio Dino: o publicitário Marcello Lopes, o ''Marcellão'', amigo
  pessoal de Flávio Bolsonaro e ex-marqueteiro de sua pré-campanha. Procurado, ele confirmou o repasse, disse tê-lo
  feito como ''investidor'' do filme, em dezembro de 2025, e a pedido do deputado Mário Frias. Entregou à coluna
  o contrato, que registra aporte de US$ 185.185,19 em favor da Go Up Entertainment Ltda. e foi assinado apenas
  em 04/06/2026 — seis meses depois do dinheiro e já com o caso Master deflagrado. Sua explicação para a ordem invertida:
  ''foi firmado ano passado e assinado este ano devido a ajustes de cláusulas entre as partes''. Sobre o motivo
  do aporte, declarou: ''quando parou de ter o dinheiro lá em outubro (de 2025) que Vorcaro investia, a turma toda
  estava gravando em São Paulo, tinham que fazer monte de pagamento e abriram cotas para investimento. Eu achei
  um bom negócio e decidi investir''.'
notes: 'A segunda nota, sobre a data do contrato, está em https://www.metropoles.com/colunas/igor-gadelha/dark-horse-amigo-de-flavio-so-assinou-com-produtora-6-meses-apos-repasse.
  O contrato não foi lido pela equipe: o que se conhece dele são os elementos descritos e as imagens publicadas
  pela coluna.'
