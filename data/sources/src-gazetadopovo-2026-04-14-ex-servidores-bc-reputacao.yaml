summary: Registra que, pouco depois da liberação pelo BC, 'a Justiça chegou a decretar a prisão preventiva
  de Vorcaro por suposta participação em um esquema de desvio de recursos de fundos de previdência que
  atuavam em Roraima, mas a medida não foi cumprida e acabou revogada'. Situa o esquema em Roraima, divergindo
  da versão que aponta Rondônia.
