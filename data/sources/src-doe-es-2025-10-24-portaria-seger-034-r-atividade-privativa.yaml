summary: 'Publicada na página 19 do diário de 24/10/2025; PDF baixado e lido pela equipe. Regulamenta
  o credenciamento de consignatárias e traz, no §2º do art. 2º, a afirmação normativa mais direta localizada
  em todo o acervo sobre a natureza do produto: ''A oferta e administração de cartão consignado de benefício
  constituem atividade privativa de instituição financeira, sendo obrigatória a autorização do Banco Central
  do Brasil - BACEN para o seu funcionamento''. O caput exige ainda previsão expressa da atividade no
  estatuto social da credenciada. O Espírito Santo havia criado, como Rio de Janeiro e Mato Grosso, margem
  adicional de 10% para o produto — e depois restabeleceu por escrito o filtro que outros estados dispensaram
  ou transferiram.'
