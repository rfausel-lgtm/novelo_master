summary: 'Nota de 12/02/2026 do gabinete de Dias Toffoli: admite integrar o quadro societário da Maridt,
  administrada por parentes, que integrou o grupo Tayayá Ribeirão Claro até 21/02/2025 (venda de cotas
  ao Fundo Arllen em 27/09/2021 e do saldo à PHD Holding em 21/02/2025); tudo declarado à Receita; desconhece
  o gestor do Fundo Arllen; jamais teve amizade com Vorcaro nem recebeu valores; a ação do BRB foi distribuída
  a ele em 28/11/2025.'
