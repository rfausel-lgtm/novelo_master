summary: 'Em 03/09/2026 o partido Novo protocolou no STF, perante o relator André Mendonça, dois pedidos
  contra o diretor-geral da PF: prisão preventiva (art. 313 do CPP) e afastamento cautelar com abertura
  de inquérito (art. 319). Os pedidos se baseiam em mensagens de Vorcaro a Alexandre de Moraes reveladas
  pelo Estadão em 01/09 e no depoimento ao gabinete de Mendonça. O gabinete informou que o depoimento
  foi feito a requerimento expresso da defesa, que relatou graves intimidações. A PF não respondeu ao
  veículo até a publicação.'
