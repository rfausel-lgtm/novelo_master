summary: Em 18/02/2026 o BC decretou a liquidação extrajudicial do Banco Pleno S.A. (ex-Voiter, adquirido
  por Augusto Lima com aprovação do BC em julho de 2025) e da Pleno DTVM, por comprometimento econômico-financeiro,
  deterioração de liquidez e infringência às normas; Lima foi sócio de Vorcaro no Master até maio de 2024
  e foi preso na Compliance Zero em novembro de 2025.
