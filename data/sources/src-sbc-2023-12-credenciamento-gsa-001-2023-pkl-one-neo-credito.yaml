summary: 'Edição nº 2.409, página 14, de 431 páginas, com extração integral conferida — a expressão aparece
  uma única vez em toda a edição. Termo assinado em 14/12/2023, vigência de sessenta meses, objeto de
  concessão de empréstimo pessoal e cartão de crédito com desconto em folha, chamamento SB 114563/2023.
  O julgamento de habilitação, publicado na edição nº 2.408 de 08/12/2023, página 11, traz uma anomalia:
  duas razões sociais distintas — ''PKL ONE PARTICIPACOES S.A.'' e ''NEO CRÉDITO LTDA'' — aparecem deferidas
  sob o mesmo cadastro nacional de pessoa jurídica. Ressalva de precisão registrada pela própria apuração:
  o sufixo do número de processo NÃO amarra as duas empresas entre si, pois é compartilhado com um terceiro
  credenciado sem relação com o grupo. Também credenciado no município o Banco Master, por chamamento
  de 2012, com assinatura em 27/04/2023 e sessenta meses.'
