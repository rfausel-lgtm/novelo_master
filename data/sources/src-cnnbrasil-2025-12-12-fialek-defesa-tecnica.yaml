source_type: press
summary: A defesa de Mariângela Fialek afirma que sua atuação na organização de emendas parlamentares era
  "estritamente técnica, apartidária e impessoal", decidida pela Presidência da Câmara e por todos os
  líderes partidários indistintamente, e que a operação contra ela não lhe imputa crime — sem negar,
  ponto a ponto, o desvio de recursos apontado pela investigação.
