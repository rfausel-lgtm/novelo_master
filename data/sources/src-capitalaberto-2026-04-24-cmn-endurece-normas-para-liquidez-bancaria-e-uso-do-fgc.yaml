summary: Relata, com base em comunicado do BC após a reunião do CMN de 23/04/2026, que a Resolução CMN 5.295
  alterou as regras de alocação de títulos públicos federais pelas instituições associadas ao FGC, que o CMN
  introduziu o conceito de Ativo de Referência e que as medidas entram em vigor em 1º de junho; trata em
  separado do reforço de requisitos de liquidez.
notes: Texto lido por lote:fonte em 23/10/2026. Veículo especializado com apuração própria sobre o comunicado
  do BC; o comunicado não foi aberto. A matéria também associa as medidas aos pagamentos do FGC a clientes do
  Master, sem citar fonte.
