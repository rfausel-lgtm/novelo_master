summary: 'Leitura de texto integral. Documento ASSCRIM/PGR nº 940922/2026, assinado digitalmente por Paulo
  Gustavo Gonet Branco, Procurador-Geral da República, em 16/06/2026 18h34. Refere-se conjuntamente às
  Petições 16.201, 16.210, 16.229 e 16.230/DF. Não se opõe à operação de busca e apreensão em geral —
  anui a ela —, mas se opõe especificamente a dois pontos: (1) busca no gabinete parlamentar de Jaques
  Wagner, por violação à separação de poderes (''a incursão súbita no ambiente legislativo federal importa
  severa ingerência de um Poder na sede de outro''), recomendando restringir a diligência a endereço residencial
  e escritórios descentralizados; (2) apreensão de bens de alto valor/dinheiro/joias acima de R$ 20 mil,
  por desproporcionalidade e prematuridade (''a só existência de bens de alto valor nos recintos invadidos
  não é, por si, crime''; ''haverá estrépito social e mediático prescindível''). A decisão de Mendonça
  na Pet 16.229 não acolheu integralmente essa posição.'
