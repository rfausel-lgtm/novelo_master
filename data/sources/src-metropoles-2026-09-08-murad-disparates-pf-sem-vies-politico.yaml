summary: William Murad, diretor-geral interino da PF, discursou na abertura do 63º Curso de Formação Profissional
  da PF, na Academia Nacional de Polícia (Brasília), pouco após assumir o cargo em 08/09/2026, defendendo
  que a corporação atua de forma imparcial e livre de viés político e afirmando 'total confiança' na direção-geral
  afastada. A coluna usa majoritariamente discurso indireto; não foi possível confirmar citações literais
  fechadas por leitura do vídeo/texto integral do discurso.
