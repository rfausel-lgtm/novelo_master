summary: 'Recontextualiza, após a revelação da revista piauí, que o relatório da PF que aponta Toffoli como
  possível "beneficiário final" do Fundo Arleen é de fevereiro de 2026 — já tratado pelos dez ministros do STF
  em reunião fechada de 12/02/2026, na qual a maioria descartou o documento (Dino chamou-o de "lixo jurídico")
  e o STF divulgou nota oficial de apoio a Toffoli no mesmo dia, com a redistribuição do caso a André Mendonça
  em seguida. Contrasta com o tratamento dado a um relatório de agosto (pedido por Mendonça), que teria sido
  analisado, enviado à PGR e teve o sigilo levantado — o de fevereiro sobre Toffoli nunca gerou trâmite
  equivalente.'
