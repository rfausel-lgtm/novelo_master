title: Zanin nega liminar para obrigar Alcolumbre a instalar CPI do Master
publisher: Congresso em Foco
publication_date: '2026-09-23'
url: https://www.congressoemfoco.com.br/noticia/122496/zanin-nega-liminar-para-obrigar-alcolumbre-a-instalar-cpi-do-master
source_type: press
language: pt-BR
summary: >-
  Identifica o processo como o Mandado de Segurança 41.085. Segundo a matéria, Zanin considerou que os
  documentos não permitem concluir de imediato que Alcolumbre tenha cometido omissão inconstitucional,
  destacou a existência de requerimento anterior, também subscrito por Vieira, sobre fatos ligados ao Master,
  e pediu informações ao presidente do Senado, com posterior envio à PGR; escreveu: "Não é possível
  reconhecer, neste momento processual, a relevância do fundamento invocado pelo impetrante". Vieira
  classificou a decisão como uma "decepção" e disse que juntaria novas informações e pediria revisão.
notes: >-
