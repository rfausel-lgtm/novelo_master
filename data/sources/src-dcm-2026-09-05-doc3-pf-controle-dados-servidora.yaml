summary: Coluna de opinião (não matéria factual apurada por redação) que cita trechos apresentados como
  do próprio 'DOC.3' do relatório de inteligência apócrifo da PF (Pet 16.662) e atribui, com base nesses
  trechos, um nome a uma agente da PF descrita como tendo controle concentrado sobre acervos sensíveis
  da operação — incluindo uma crítica sobre inserção indevida, e depois retirada, de material de celular
  do senador Weverton Rocha (caso Tech Office, distinto do Master) em minuta de informação policial. É
  FONTE ÚNICA, de natureza opinativa e linha editorial partidária declarada, sem checagem factual independente
  localizada, sobre pessoa cuja identidade o próprio STF determinou proteger com 'limites mais estritos
  que o documento principal' (decisão de Mendonça, §35). Por decisão editorial, o nome atribuído por esta
  coluna NÃO é reproduzido pela equipe.
