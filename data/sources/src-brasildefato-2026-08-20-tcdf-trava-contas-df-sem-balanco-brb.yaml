title: Tribunal de Contas do DF trava análise das contas de 2025 por falta de balanço auditado do BRB
publisher: Brasil de Fato
publication_date: '2026-08-20'
url: https://www.brasildefato.com.br/2026/08/20/tribunal-de-contas-do-df-trava-analise-das-contas-de-2025-por-falta-de-balanco-auditado-do-brb/
source_type: press
summary: 'Por decisão do conselheiro-relator Paulo Tadeu (Decisão nº 1.687/2026), o TCDF suspendeu o
  prazo regimental de 60 dias para apreciar as contas de 2025 do governo do Distrito Federal até que o
  BRB entregue balanço financeiro auditado completo — o banco não divulga balanço desde novembro de
  2025, por causa da fragilidade deixada pelas operações com o Banco Master. A ausência foi identificada
  pela Secretaria de Macroavaliação Governamental (Semag) em maio de 2026. A Casa Civil do DF e o BRB têm
  30 dias para esclarecer o atraso, inclusive se há vínculo entre a não divulgação do balanço e a
  contratação de um empréstimo de R$ 6,6 bilhões, e se CVM ou Banco Central abriram procedimento por
  conta do atraso.'
