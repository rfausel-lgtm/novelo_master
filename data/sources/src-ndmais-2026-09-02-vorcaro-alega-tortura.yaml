summary: 'Reproduz a coluna de Mônica Bergamo, na Folha de S.Paulo: Vorcaro afirmou, em depoimento por
  vídeo a juiz auxiliar do gabinete de André Mendonça, ter sofrido tortura psicológica, maus-tratos e
  ameaças veladas na prisão para não revelar fatos ligados à Polícia Federal em eventual delação, citando
  o diretor-geral Andrei Rodrigues. Ele negocia a delação desde a prisão, em março.'
