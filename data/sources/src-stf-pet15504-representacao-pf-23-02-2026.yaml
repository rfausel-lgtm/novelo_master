title: Representação da PF que pediu a abertura da PET 15.504 para apurar corrupção de servidores do Banco Central
publisher: Polícia Federal
author: Delegado Victor Arruda de Oliveira (CINQ/CGRC/DICOR/PF)
publication_date: '2026-02-23'
retrieved_at: '2026-09-12'
