source_type: official_police
summary: 'Pede a instauração de petição sigilosa em apartado do INQ 5.026 para apurar indícios de corrupção de
  servidores do alto escalão do Banco Central ligados a Daniel Vorcaro. Diz que os elementos vêm da análise do
  celular atribuído a Vorcaro e de notícia-crime formal enviada pelo próprio Banco Central à PF, e descreve Paulo
  Sérgio Neves de Souza (chefe-adjunto do DESUP) e Belline Santana (chefe do DESUP) como tendo atuado "de forma
  reiterada como consultores informais" de Vorcaro — revisando minutas destinadas ao BC e ao FGC, antecipando
  posicionamentos internos e alinhando estratégias num grupo de mensagens chamado "Master". Enquadra em tese
  corrupção passiva e ativa, lavagem, organização criminosa, violação de sigilo funcional e crimes contra o sistema
  financeiro.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente), juntada como e-Doc. 1 da PET 15.504. Descreve hipóteses investigativas da
  PF, não fatos julgados.'
