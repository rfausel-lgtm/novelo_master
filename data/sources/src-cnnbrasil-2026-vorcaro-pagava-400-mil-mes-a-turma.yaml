source_type: press
summary: 'Descreve a mecânica financeira do grupo: a King Participações Imobiliárias, de Luiz Phillipi
  Mourão, recebia cerca de R$ 1 milhão por mês de empresas do grupo, especialmente a Super Empreendimentos,
  sendo cerca de R$ 400 mil mensais distribuídos entre os integrantes da ''Turma''. A Polícia Federal
  estima cerca de R$ 9,6 milhões movimentados entre 2023 e 2025, com bônus eventuais. Por ordem de Vorcaro,
  Fabiano Zettel e Ana Cláudia usavam o caixa da Super para pagar Mourão.'
