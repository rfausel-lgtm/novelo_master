source_type: press
summary: O relatório da PF indica que o advogado Ciro Soares atuava como interlocutor do procurador-geral
  e enviava mensagens e fotos a Vorcaro. Segundo as mensagens, o PGR teria pedido que o banqueiro financiasse
  a ida do filho ao Fórum Jurídico Brasil de Ideias, cuja 2ª edição, prevista para Londres em 2025, acabou
  não acontecendo. Na 1ª edição, em 2024, houve degustação de uísque Macallan que custou US$ 640.831,88,
  cerca de R$ 3,3 milhões no câmbio de setembro de 2026.
