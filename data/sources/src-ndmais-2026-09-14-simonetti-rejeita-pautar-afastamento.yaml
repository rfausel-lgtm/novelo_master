summary: 'Em reunião do Conselho Federal da OAB de 14/09/2026, o conselheiro Marcelo Tostes (MG) pediu que
  fosse pautada a deliberação sobre afastamento cautelar de Alexandre de Moraes e Dias Toffoli, citando o
  contrato de R$ 120-131 milhões entre o Banco Master e o escritório da esposa de Moraes (Viviane Barci de
  Moraes, já no acervo) e os pedidos de impeachment já aprovados por seccionais estaduais. O presidente
  José Alberto (Beto) Simonetti recusou pautar o tema, alegando que uma comissão formada pela própria
  diretoria do Conselho Federal, junto com presidentes de seccionais, criada na semana anterior, ainda
  estava em andamento para examinar os documentos e redigir relatório sobre a conduta dos ministros. O
  conselheiro Telles criticou publicamente a recusa e defendeu protocolar com urgência a petição já
  apresentada ao STF.'
