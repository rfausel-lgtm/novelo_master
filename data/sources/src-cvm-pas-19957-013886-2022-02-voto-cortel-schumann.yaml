source_type: official_regulator
summary: 'Relatório (24/11/2025, 26 pp.) e voto (25/11/2025, 22 pp.) do processo sancionador sobre as compras de
  cotas do fundo Brazilian Graveyard and Death Care Services (CARE11) pela Cortel Holding entre março e maio de
  2022. Dispositivo: condenação de Roberto Coutinho Schumann (R$ 2.127.992,80) e Marcio Coutinho Schumann
  (R$ 54.048,02) por prática não equitativa; absolvição da Cortel e de Roberto Schumann da acusação de
  manipulação de preços e de Roberto da acusação de operação fraudulenta; comunicação ao MPF. Registra que o
  conselho de administração da Cortel acompanhou a operação, citando e-mail de um conselheiro identificado pelas
  iniciais V.C.N.; e, na síntese das defesas, que o CARE11 detinha 20% da Cortel (54% do patrimônio do fundo) e
  era gerido pela Zion Gestão de Recursos, ligada à Zion Capital, acionista relevante da Cortel que indicara
  V.C.N. ao conselho.'
notes: 'Relatório disponível em https://www.gov.br/cvm/pt-br/assuntos/noticias/anexos/2025/20251124-pas-cvm-19957-013886-2022-02-relatorio-diretora-marina-copola.pdf.
  Ambos lidos por esta sessão (texto extraído dos PDFs oficiais). A CVM usa só iniciais para terceiros; a
  correspondência entre V.C.N. e Vicente Conte Neto vem da imprensa (O Bastidor), não do documento.'
