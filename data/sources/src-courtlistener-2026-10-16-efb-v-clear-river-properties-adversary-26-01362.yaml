summary: 'Docket do adversary proceeding 26-01362 no Tribunal de Falências dos EUA para o Distrito Sul da
  Flórida, juiz Scott M. Grossman, data de autuação 07/10/2026, natureza recuperação de dinheiro ou bens. A
  entrada 1 é a petição inicial (complaint) de EFB Regimes Especiais de Empresas Ltda. contra Clear River
