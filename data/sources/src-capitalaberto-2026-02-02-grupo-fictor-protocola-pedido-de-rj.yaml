summary: Informa que o Grupo Fictor anunciou, em comunicado de domingo (01/02/2026), ter protocolado no
  Tribunal de Justiça de São Paulo pedido de recuperação judicial da Fictor Holding e da Fictor Invest, com
  dívidas de cerca de R$ 4 bilhões e pedido de tutela de urgência para suspender execuções e bloqueios por 180
  dias. Atribui ao grupo a explicação de que a reputação foi atingida por especulações de mercado após a
  liquidação do Banco Master, e registra que o pedido não inclui as subsidiárias.
