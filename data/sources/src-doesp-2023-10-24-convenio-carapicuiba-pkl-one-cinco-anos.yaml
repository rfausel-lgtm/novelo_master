summary: Processo administrativo 52361/2023, para concessão das operações do cartão consignado, assinado
  em 11/10/2023 pelo então prefeito, com vigência de cinco anos — portanto até 11/10/2028. Nenhum ato
  posterior à liquidação foi localizado. O que existe são convênios substitutos assinados pelo novo prefeito
  com três bancos em maio de 2026 e com um quarto em julho, todos sem uma linha sobre a operadora.
