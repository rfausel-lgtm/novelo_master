summary: 'A Pet 15.625 é o inquérito, instaurado em 06/03/2026 a pedido da defesa de Vorcaro (Pet 15.612), sobre
  o vazamento à imprensa de material sigiloso do celular de Vorcaro. A representação da PF de 08/05/2026 e a
  decisão de Mendonça de 18/05/2026 identificam como suspeito o Perito Criminal Federal João Cláudio Nabas, que
  atuava dando apoio técnico à Operação Compliance Zero com acesso ao Laudo Pericial nº 4281/2025 (celular de
  Vorcaro). Segundo a apuração: em 01/12/2025 ele acessou o laudo; em 04/12/2025 criou dois arquivos —
  "Moraes.pdf" (prints de conversas entre Vorcaro e a advogada Viviane Barci de Moraes, e trechos do contrato
  entre ela e o Master) e "Toffoli e esposa.pdf"; em 05/12/2025 enviou os arquivos à delegada que presidia a
  investigação, Janaína Palazzo, e a incentivou a conversar com a jornalista Malu Gaspar, dizendo ser fonte dela
  "há anos"; em 09/12/2025 O Globo publicou reportagem com conteúdo coincidente com o "Moraes.pdf". Auditorias
  nos sistemas SISCRIM e SARD confirmam os acessos; o arquivo "Moraes.pdf" foi excluído do OneDrive institucional
  poucas horas antes de uma reportagem de março de 2026 sobre supostas conversas entre Vorcaro e o ministro
  Alexandre de Moraes — sugerindo que o mesmo perito também estaria ligado ao vazamento que deflagrou a crise
  Moraes-Mendonça. A PGR concordou com o pedido; Mendonça deferiu suspensão da função pública, busca e
  apreensão (domiciliar, pessoal, profissional e veicular), proibição de contato com servidores da PF e
  afastamento de sigilo telemático da conta Google de Nabas.'
notes: 'Peças obtidas via peticionamento.stf.jus.br (sessão do Rafael). Resolve um fio em aberto desde o lote
  168/169 sobre a origem do vazamento das mensagens Vorcaro-Moraes. Dados cadastrais pessoais de Nabas (e-mail,
  ID de conta Google) constam da decisão mas não são reproduzidos aqui.'
