summary: 'Página 45. Convenente: Prefeitura do Município de São Paulo, Secretaria Municipal de Gestão;
  conveniada: PKL One Participações S/A - CREDCESTA, CNPJ 27.490.629/0001-13. Objeto: consignação em folha
  de pagamento; valor: sem ônus para a prefeitura; vigência de dois anos ou até o recadastramento bienal;
  assinatura em 25/08/2022. O credenciamento havia sido autorizado no diário de 19/08/2022, processo 6013.2022/0003474-6,
  com fundamento expresso no decreto municipal de 07/07/2022. Houve aditamento assinado em 26/10/2023.'
