summary: Portaria do secretário municipal de Administração, editada com base no Decreto nº 22.958/2021, que credencia
  a PKL One Participações S.A., pelo cadastro nacional 27.490.629/0001-13, para atuar como entidade consignatária
  na Prefeitura Municipal de Florianópolis, por consignação facultativa na folha de pagamento dos servidores da
  administração. É o primeiro ato localizado em Santa Catarina, estado que já constava do mapa de cobertura do produto
  em maio de 2022 e cuja data de credenciamento estadual o corpus não conseguira localizar porque o portal do diário
  estadual exige autenticação.
