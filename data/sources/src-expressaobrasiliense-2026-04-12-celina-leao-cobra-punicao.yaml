source_type: press
summary: 'A governadora Celina Leão cobrou punição dos responsáveis pela operação entre BRB e Banco
  Master, pediu o afastamento de todos os ocupantes de cargos que tiveram relação com o episódio e
  reiterou não ter sido convidada para qualquer decisão ou tratativa envolvendo as negociações entre as
  instituições: "A minha fala é muito dura com as pessoas que deixaram o banco nessa situação. Espero
  que a Justiça traga clareza e transparência."'
