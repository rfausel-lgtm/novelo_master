summary: 'Publicação oficial na edição nº 28.512, página 3, lida integralmente pela equipe no PDF do diário.
  Autoriza consignações em folha em favor do Banco Master S/A (CNPJ 33.923.798/0001-00) ''para amortização
  de cartão consignado de benefício'', com vigência de 30/05/2023 a 29/05/2028. Assinam: Basílio Bezerra
  Guimarães dos Santos, secretário de Estado de Planejamento e Gestão, pelo consignante; e, pela consignatária,
  Luiz Antonio Bull, diretor, e Allan da Silva Machado, procurador. Registro relevante: o instrumento
  não menciona CredCesta nem PKL One — buscas na base completa do diário oficial mato-grossense não retornam
  nenhuma ocorrência desses nomes.'
