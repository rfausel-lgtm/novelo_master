summary: 'Poder360 (29/12/2025): Paulo Gonet determinou o arquivamento de pedido de investigação sobre a
  possível atuação de Alexandre de Moraes no caso Master, protocolado em 24/12 pelo advogado Enio Martins
  Murad; reproduz trechos do despacho, entre eles a "absoluta ausência de lastro probatório mínimo" e, sobre o
  contrato do escritório de Viviane Barci de Moraes, que "não se vislumbra, a priori, qualquer ilicitude que
  justifique a intervenção desta instância"; registra a nota de Moraes de 23/12, que negou ter tratado do
  Master com o presidente do BC, e a declaração do gabinete de que o escritório nunca atuou na operação de
  venda do Master ao BRB.'
notes: Publica imagem de um trecho do despacho (não lida pelo Novelo; os trechos usados são os do texto da
