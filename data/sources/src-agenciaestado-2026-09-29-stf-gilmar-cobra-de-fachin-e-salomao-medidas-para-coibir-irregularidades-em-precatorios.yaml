title: 'STF: Gilmar cobra de Fachin e Salomão medidas para coibir irregularidades em precatórios'
publisher: Agência Estado (republicado pelo Diário do Grande ABC)
publication_date: '2026-09-29'
url: https://www.dgabc.com.br/Noticia/4349682/stf-gilmar-cobra-de-fachin-e-salomao-medidas-para-coibir-irregularidades-em-precatorios
source_type: wire
language: pt-BR
summary: >-
  Segundo a matéria, no ofício enviado em 29/09/2026 Gilmar Mendes cobrou dos presidentes do STF, Edson Fachin,
  e do STJ, Luís Felipe Salomão, medidas para coibir irregularidades na expedição de precatórios; disse que as
  investigações sobre o Banco Master "revelaram um modelo de negócios parasitário, que drenava recursos
  públicos e a poupança de milhares de investidores"; sugeriu correição extraordinária da Corregedoria
  Nacional de Justiça em todos os tribunais regionais federais, sobretudo no TRF-1; defendeu "sustar todas as
  decisões que determinaram indevidamente a expedição de precatório antes do trânsito em julgado"; cobrou do
  Banco Central e da CVM que apurem como os créditos "foram parar em fundos de investimento e nos balanços de
  bancos"; e afirmou: "Impõe-se uma resposta coordenada das instituições, à altura da gravidade dos fatos
  revelados".
notes: >-
