summary: Registro oficial da audiência pública em que a atual presidente do instituto, Márcia Tinoco,
  e o diretor Khayo Eduardo Pires de Oliveira prestaram esclarecimentos. A autarquia confirma que, por
  não ter havido aprovação do conselho, a assessoria de investimentos não emitiu parecer, e que não houve
  documento formal de aprovação da operação. Informa habilitação como credora na liquidação, com crédito
  atualizado próximo de R$ 47 milhões.
