summary: No decreto de liquidação extrajudicial da Trustee (03/09/2026), o BC incluiu Artur Martins de
  Figueiredo na lista de ex-administradores com bens tornados indisponíveis, junto com Ângelo Pinheiro
  de Castro, Estevam Borali, Flávio Daniel Aguetoni, Luis Fernando de Almeida e Rogério Penteado Felgueiras
  — motivação genérica de 'graves violações às normas legais que disciplinam as atividades das instituições'.
  Figueiredo NÃO consta na lista equivalente da liquidação da Banvox Distribuidora — a indisponibilidade
  parece vinculada especificamente à Trustee.
