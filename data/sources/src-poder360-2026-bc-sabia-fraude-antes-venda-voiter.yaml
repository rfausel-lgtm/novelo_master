source_type: press
summary: Relata que o Banco Central aprovou, em 24/07/2025, a transferência de controle do Banco Voiter
  (depois renomeado Banco Pleno) do Master para Augusto Lima mesmo após técnicos da própria autarquia
  terem identificado irregularidades e 'créditos podres' ligados ao Master, com comunicação formal de
  indícios de fraude ao Ministério Público Federal.
