summary: 'Quatro ofícios do mesmo dia, juntados à Pet 16.704, pedindo que a cópia de segurança dos dados extraídos
  do celular de Daniel Vorcaro (Termo de Apreensão nº 4473731/2025, iPhone 17 Pro) seja compartilhada com todos
  os gabinetes antes do julgamento de 15/09. Moraes (Ofício GMAM 08/2026) pede a mídia e a indexação Cellebrite/IPED
  para verificar "eventual seletividade e direcionamento" na IPJ-A nº 3298613/2026. Zanin (Ofício 14/2026-GMCZ)
  argumenta que o lacre da cópia (nº B0003311945, intocada desde que a PF a entregou ao gabinete de Mendonça em
  08/03/2026) não impede a partilha, pois a cadeia de custódia protege o original, não a cópia, e que os
  advogados de Vorcaro já têm acesso integral ao mesmo material — identificando o aparelho como "01 aparelho
  celular da marca APPLE, modelo IPHONE 17 PRO", IMEI A 358829560150138 (IPJ-A nº 3298613/2026, Laudo nº
  4281/2025-SETEC/SR/PF/SP). Gilmar Mendes (Ofício 005/MGM) adere aos
  fundamentos de Zanin, falando em "acesso assimétrico" que compromete a "paridade entre os integrantes da
  Corte". Moraes retorna no Ofício GMAM 10/2026 citando a resposta de Mendonça (que confirmara o lacre intocado)
  para reiterar o pedido. NOVO (13/09/2026, lido via OCR): no Ofício GMAM 09/2026, Moraes contesta diretamente
  a afirmação de Mendonça de que os sigilos ligados à PET 15.556 já teriam sido levantados e disponibilizados
  a todos os gabinetes — "Não é o que consta dos autos" — anexando prints que mostram a PET 15.556, a PET
  15.976 e a RCL 88.121, entre outras, ainda com peças sigilosas inacessíveis. Acusa Mendonça de "levantamento
  seletivo e direcionado do sigilo... na proteção ostensiva de determinado grupo político", comparando a
  conduta ao "direcionamento de acordos de colaboração premiada", e fala em supressão ao colegiado do
  conhecimento de "18 PETs e de 180 documentos".'
notes: 'Peças obtidas via peticionamento.stf.jus.br (sessão do Rafael). O Ofício 13/2026-GMCZ, anterior ao 14,
  não pôde ser lido (PDF sem texto extraível). ATUALIZAÇÃO (13/09/2026): o Ofício GMAM 09/2026 (datado
  11/09/2026, juntado 13/09/2026), antes marcado como ilegível, foi lido via OCR — ver detalhe em
  ev-moraes-acusa-mendonca-de-levantamento-seletivo-de-sigilo.'
