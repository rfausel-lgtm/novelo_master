summary: Levantamento aponta que Fabiano Zettel recebeu R$ 485 milhões da Super Empreendimentos entre
  julho de 2022 e janeiro de 2026, incluindo 264 transferências só em 2025, somando R$ 160 milhões. Procuradas,
  as defesas de Zettel e Vorcaro não quiseram responder.
