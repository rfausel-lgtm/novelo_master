source_type: press
summary: Reportagem que afirma ter obtido o relatório da PF citado na decisão do ministro André Mendonça
  que autorizou a 5ª fase da Operação Compliance Zero, de 07/05/2026. Segundo a reportagem, André Kruschewsky
  Lima exerceu o cargo de diretor jurídico do Banco Master de março de 2023 a agosto de 2024, e é citado
  no relatório no contexto da emenda nº 11 à PEC 65/2023, que ampliaria a cobertura do FGC de R$ 250 mil
  para R$ 1 milhão por depositante.
