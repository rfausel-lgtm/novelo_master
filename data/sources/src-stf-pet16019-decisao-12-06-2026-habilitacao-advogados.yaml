summary: Decisão pública (Resolução STF 427/2010), baixada diretamente do portal do STF, que defere pedido
  dos advogados de Manoel Mendes Rodrigues de habilitação e acesso temporário aos autos sigilosos da PET
  16.019, com as restrições da Súmula Vinculante 14, e estende o mesmo benefício aos advogados dos demais
  investigados que comprovarem habilitação.
notes: Documento público, baixado diretamente do portal do STF. Não depende do certificado digital do
  Rafael.
