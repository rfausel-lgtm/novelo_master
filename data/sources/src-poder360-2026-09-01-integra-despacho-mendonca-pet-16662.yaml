summary: 'Íntegra assinada digitalmente, lida pela equipe. O item 17 define o encaminhamento do feito:
  ''independentemente de qual venha a ser a manifestação exarada pela douta Procuradoria-Geral da República,
  o caminho inevitável dos presentes autos leva ao Plenário deste Supremo Tribunal Federal, instância
  soberana para analisar, de modo técnico e estritamente jurídico, os novos elementos trazidos pela autoridade
  policial''. O item 18 determina que a deliberação ocorra ''de forma pública e transparante, em sessão
  presencial do Colegiado''. Observação de precisão: o despacho não emprega a expressão ''autorizar investigação
  contra o ministro''. Registre-se ainda aparente erro material no item 7, que data de 17/11/2026 — data
  futura — decisão de vara federal que a cobertura pericial situa em 17/11/2025.'
