summary: 'Registro institucional da Defensoria sobre a audiência de 14/08/2026. A coordenadora do Núcleo
  de Defesa do Consumidor, Luciana Telles, sintetiza o objeto do pedido liminar: ''O Banco Master entrou
  em liquidação, e não há um canal de comunicação com a instituição. Na Ação Civil Pública, pedimos que
  seja criado um canal físico e remoto para que os clientes consigam ter acesso aos contratos. Como podemos
  pedir revisão de juros abusivos se muitos servidores não têm os contratos?'''
