source_type: press
summary: 'Segundo relatório do COAF citado pela reportagem, o Banco Master repassou R$ 3,897 milhões à Amando Vidas
  Produtora e Gravadora Ltda entre março e abril de 2022; a empresa tem como sócios, na Receita Federal, André
  Valadão e a esposa, Cassiane Montosa Valadão. A defesa da produtora "nega veementemente qualquer vínculo ou
  participação em transações nos valores mencionados" e afirma que seus extratos não registram entrada compatível.'
notes: Lida por esta sessão via WebFetch direto. O relatório do COAF não foi lido pela equipe, e a reportagem não
