source_type: press
language: pt-BR
summary: >-
  Publicada em 28/09/2026, às 18:16, sem autor individual. Segundo o texto, a executiva nacional do Novo
  apresentou ao presidente do STF, Edson Fachin, pedido para que o Plenário examine a regularidade do pedido de
  vista de Flávio Dino de 15/09/2026 na questão de ordem sobre a reunião das PET 16.662 e 16.704, reconheça
  "desvio de finalidade" e abuso da prerrogativa regimental, declare a nulidade da vista e afaste o efeito
  suspensivo; subsidiariamente, que o efeito suspensivo seja tido por ineficaz, com retomada do julgamento; e que
  se reconheça empate de 4 a 4, com voto de qualidade do presidente, sob o argumento do partido de que a
  manifestação de Dino já indicava voto pela reunião dos casos. Segundo o texto, a vista teria deixado de cumprir
  sua finalidade e passado a funcionar como interrupção da sessão (paráfrase dos argumentos do requerente). Não
  informa resposta de Dino ou do STF nem a PET em que o pedido foi protocolado.
