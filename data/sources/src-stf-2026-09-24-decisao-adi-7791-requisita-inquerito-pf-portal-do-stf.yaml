summary: Decisão do relator da ADI 7.791, Flávio Dino, datada de "Brasília, 24 de setembro de 2026", com
  "Ciência à PGR" e "Publique-se", servida pelo portal do STF com camada de texto legível (nove páginas). Em
  aditamento à decisão interlocutória de 20/09/2026, requisita à Polícia Federal a instauração de inquérito
  policial e determina à CVM o envio, em 72 horas, da cópia integral do Processo SEI nº 19957.001206/2022-08 e
  das informações listadas no dispositivo. O rodapé de assinatura digital traz o código 7945-FE6E-EABB-E40B, o
  mesmo da cópia hospedada pelo Poder360.
notes: Aberta com lote:fonte em 23/10/2026 (PDF do portal; pdftotext legível, 24.321 caracteres; sha256 do
  texto 2190b11734d6c2e9...; sha256 do arquivo b7adc85e...). O dispositivo (i) a (iv), o prazo de 60 dias, o
  prazo de 72 horas e o fecho coincidem com a transcrição feita em 21/10/2026 a partir da cópia do Poder360. O
  portal registra a decisão nos andamentos da ADI 7791 em 24/09/2026 (convertido em diligência, decisão
  monocrática, Min. Flávio Dino). O formulário de autenticidade por código não foi usado; a conferência foi
  por cotejo do código impresso na peça servida pelo próprio portal.
