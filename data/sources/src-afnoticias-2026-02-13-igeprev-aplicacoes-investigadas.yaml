source_type: press
summary: 'Registra a instauração de inquérito civil pelo Ministério Público do Tocantins em 12/02/2026
  sobre aplicações do Igeprev: R$ 62 milhões na Foco DTVM e R$ 21,1 milhões no Aquilla Fundo de Investimento
  Imobiliário, no período de 2011 a 2014. O promotor Vinícius de Oliveira e Silva registra que ''houve
  aplicação e manutenção de recursos em fundos com riscos aparentemente incompatíveis com a natureza pública''.
  O Igeprev respondeu que não possui qualquer investimento no Banco Master, que as aplicações ocorreram
  em gestão anterior e que hoje 88,12% dos recursos estão em instituições seguras.'
