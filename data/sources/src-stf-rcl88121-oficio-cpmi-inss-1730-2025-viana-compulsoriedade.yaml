summary: 'Informa que a CPMI do INSS aprovou, em 04/12/2025, o Requerimento nº 2749/2025, convocando Daniel
  Vorcaro como testemunha por causa dos empréstimos consignados concedidos pelo Banco Master, e marca o depoimento
  para 05/02/2026. Afirma que Vorcaro cumpria prisão domiciliar por decisão do relator e pede autorização para
  transportá-lo a Brasília, comparecimento compulsório e custódia pela Polícia do Senado. Sustenta que ministros
  do STF erram ao estender às CPIs as ADPFs 395 e 444 sobre condução coercitiva, que a oralidade é essencial às
  CPIs e que vários ministros, inclusive Toffoli, mantiveram a compulsoriedade em outros habeas corpus.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente), protocolada na Rcl 88.121 em 30/01/2026. O número de identificação da
  assinatura digital não é reproduzido no acervo.'
