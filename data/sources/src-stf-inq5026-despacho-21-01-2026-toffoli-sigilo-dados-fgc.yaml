summary: 'A pedido da Polícia Federal, após comunicação do Fundo Garantidor de Créditos (E-doc. 120),
  defere nova determinação de afastamento do sigilo bancário dos investigados que abranja os dados
  consolidados no âmbito do FGC, com ofício complementar autorizando seu envio ao IPL 2025.0087917-SR/PF/DF.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
