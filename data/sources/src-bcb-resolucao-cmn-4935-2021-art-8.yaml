summary: Norma que disciplinava a contratação de correspondentes no país. O art. 8º, vigente durante todo
  o período do contrato entre o Banco Master e a BN Financeira, dispunha que 'depende de prévia autorização
  do Banco Central do Brasil a celebração de contrato de correspondente com entidade não integrante do
  Sistema Financeiro Nacional (SFN) cuja denominação ou nome fantasia empregue termos característicos
  das denominações das instituições do SFN'. O dispositivo foi revogado pela Resolução Conjunta nº 17,
  de 28/11/2025.
