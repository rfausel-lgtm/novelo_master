summary: 'Relata a reclamação de "D.B.V." contra a 10ª Vara Federal do DF — alegando que a PF apreendeu, no
  endereço dele, pasta de um deputado federal com opção de compra e venda de imóvel, e omitiu o nome do
  parlamentar no termo de apreensão —, registra o pedido de acesso do deputado federal João Carlos Paolilo
  Bacelar Filho e defere parcialmente a liminar: suspende as investigações na 10ª Vara e instâncias
  antecedentes, remete ao STF toda a matéria da Compliance Zero, inclusive conexa, mantém por ora todas as
  decisões e constrições já proferidas, concede acesso ao deputado e manda o Banco Central e a PF fornecerem
  documentação e procedimentos.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). Decisão de 24 páginas. Código de autenticação do rodapé nunca
  reproduzido no acervo.'
