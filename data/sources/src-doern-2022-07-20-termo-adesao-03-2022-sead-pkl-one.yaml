summary: Ano 89, edição nº 15.225, páginas 30 e 31. Processo SEI 00110042.001420/2022-39. Credencia a
  PKL One Participações S.A., CNPJ 27.490.629/0001-13, com sede na Rua Tabapuã, em São Paulo, para oferecimento
  de crédito consignado a servidores civis, militares e pensionistas do Executivo potiguar, com vigência
  de doze meses. Assinado em 19/07/2022 por George Luiz Rocha da Câmara pela secretaria e, pela empresa,
  por Marcos Oliveira Calmon de Bittencourt e Andrea Lima Novaes. O objeto declarado é o 'credenciamento
  de instituição financeira, listada no art. 6º do Decreto Estadual nº 31.315, de 23 de março de 2022'
  — mais um ato oficial que enquadra a empresa nessa categoria.
