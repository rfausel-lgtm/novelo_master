source_type: press
summary: Informa que o Grupo Fictor protocolou em 01/02/2026, no TJ-SP, pedido de recuperação judicial da
  Fictor Holding e da Fictor Invest, com dívidas estimadas em cerca de R$ 4 bilhões e pedido de suspensão de
  execuções por 180 dias. Atribui à empresa a versão de que a crise de liquidez decorreu da tentativa
  frustrada de comprar o Banco Master, anunciada em 17/11/2025, e que o pedido não alcança as subsidiárias
  operacionais.
