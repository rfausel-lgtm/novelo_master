summary: Descreve a autora da representação como jornalista e pesquisadora da UnB e relata o pedido ao
  ministro Alexandre de Moraes para investigar David Ágape, Eli Vieira e Eduardo Tagliaferro; diz que o pedido
  foi protocolado em 21 de outubro e encaminhado por Moraes à PGR no dia 30; reproduz a reação de Ágape e
  Vieira em artigo no Poder360. Usada para descrever o instrumento e a reação dos autores.
notes: A data de protocolo (21/10) diverge da de A Investigação (25/10/2025). A página traz outro título no
  elemento title do HTML (Pesquisadora pede a Moraes para investigar autores da Vaza Toga).
