summary: Edição de 37 páginas baixada e lida pela equipe. Publica o primeiro lote de decretos do governo
  Clécio Luís, todos datados de 02/01/2023 e com efeitos a partir de 1º de janeiro. Entre eles, o Decreto
  nº 0028, que nomeia Jocildo Silva Lemos diretor-presidente da Amapá Previdência, e os Decretos nº 0018
  e nº 0019, que nomeiam Alberto Samuel Alcolumbre Tobelem, respectivamente, vogal titular do Colégio
  e presidente da Junta Comercial do Estado do Amapá.
