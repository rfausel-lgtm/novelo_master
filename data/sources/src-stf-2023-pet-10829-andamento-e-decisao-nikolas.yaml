summary: Consulta direta da equipe. Notícia-crime do deputado federal Nikolas Ferreira contra Flávio Dino
  pelos mesmos fatos de 8 de janeiro de 2023, protocolada em 11/01/2023 e distribuída a Alexandre de Moraes.
  Processo PÚBLICO, sem segredo de justiça. Arquivado por decisão de 12/01/2023 — um dia após o protocolo,
  no mesmo dia da conclusão ao relator — com dispositivo publicado no Diário de Justiça Eletrônico em
  16/01/2023 e trânsito em julgado em 07/02/2023. É a petição que gerou a prevenção pela qual as demais
  notícias-crime sobre o mesmo fato foram distribuídas ao mesmo relator. Íntegra da decisão disponível
  publicamente em PDF.
