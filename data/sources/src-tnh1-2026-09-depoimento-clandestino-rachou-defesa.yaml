summary: Registra que a PGR foi comunicada da oitiva às 22h da véspera, sob sigilo máximo, e que o advogado
  Daniel Bialski assinou a petição sozinho, sem os demais advogados — um 'voo solo' que rachou a defesa.
  Ao fim da oitiva, Bialski pediu ao juiz nova possibilidade de colaboração do cliente.
