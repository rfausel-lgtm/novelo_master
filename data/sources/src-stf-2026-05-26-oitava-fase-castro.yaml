summary: Na PET 15676, o ministro André Mendonça autorizou, na 8ª fase da Compliance Zero, busca e apreensão
  na casa do ex-governador do RJ Cláudio Castro e de ex-dirigentes da RioPrevidência, investigados por
  suposto aporte de recursos da autarquia em produtos do Banco Master (cerca de R$ 3,7 bilhões, segundo
  a PGR); a PF apontou proximidade pessoal entre Castro e Vorcaro, com encontros registrados.
