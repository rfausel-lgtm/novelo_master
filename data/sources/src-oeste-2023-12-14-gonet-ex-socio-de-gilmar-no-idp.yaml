summary: 'Reportagem publicada na indicação de Gonet à PGR: ele foi um dos fundadores do IDP, em 1998, ao lado de
  Gilmar Mendes e Inocêncio Mártires Coelho, detinha 43,44% do capital social e vendeu sua participação em 2017,
  por R$ 12 milhões, a Francisco Schertel Mendes, filho do ministro e reitor da instituição.'
