summary: Reportagem sobre o contrato de naming rights da Série D de 2025, com confirmação da CBF de que
  o Metrópoles negociou de forma independente o patrocínio com o Will Bank e de que o contrato foi encerrado
  em 2025. É a peça que documenta a existência e a natureza da contrapartida comercial.
