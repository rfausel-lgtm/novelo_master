summary: Perfil que registra que Vorcaro acertou em 2017 o acordo para assumir o controle do Banco Máxima
  com a promessa de injetar mais de R$ 75 milhões, com aporte inicial de R$ 25 milhões, e que o banco
  precisava de capitalização. Registra também que, após a aprovação da compra em 2019, Vorcaro passou a
  dividir o comando do banco com Armando Miguel Gallo Neto, Felipe Wallace Simonsen e Augusto Ferreira Lima.
