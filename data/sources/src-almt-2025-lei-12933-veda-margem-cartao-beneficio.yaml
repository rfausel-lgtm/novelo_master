summary: Lei que veda a abertura de margem consignável para cartão de crédito, cartão de benefício e congêneres
  e limita as consignações facultativas a 35% da remuneração líquida — encerrando, na prática, a margem
  exclusiva de 10% criada pelo Decreto 257/2023. Originou-se de demandas do Tribunal de Contas do Estado
  e da própria Assembleia.
