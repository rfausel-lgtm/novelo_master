summary: Boletim semanal de legislação federal que lista, entre os atos do Banco Central, os Atos do
  Presidente nº 1.381, 1.382 e 1.383, todos de 27/03/2026, que decretam a liquidação extrajudicial,
  respectivamente, da Entrepay Instituição de Pagamento S.A., da Acqio Adquirência Instituição de Pagamento
  S.A. e da Octa Sociedade de Crédito Direto S.A. O boletim reproduz apenas as ementas dos atos, não o texto.
  A data de divulgação não consta; adotou-se o último dia do período coberto.
