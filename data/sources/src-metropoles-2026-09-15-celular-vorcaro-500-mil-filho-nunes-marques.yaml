source_type: press
summary: Publica prints de conversas extraídas do celular de Daniel Vorcaro em que Luiz Rennó, apresentado como
  então diretor jurídico do Banco Master, encaminha em 04/07/2025, às 10h41, o contato de "Kevin Marques" com a
  pergunta "Esse aqui - 500 mil mês - mantém?", e em 08/08/2025 reenvia planilha com o nome do advogado. Registra
  a negativa de Kevin Marques e a declaração de Nunes Marques de que o filho nunca trabalhou para o Master. Não
  indica processo ou documento de origem das mensagens.
notes: As mensagens vêm do conteúdo integral do celular entregue pela PF aos gabinetes do STF em 14/09/2026, que
  segundo o Poder360 não teve o sigilo levantado. O telefone do contato, borrado no print, não é reproduzido.
