summary: 'Consulta primária à base pública do TSE (DivulgaCandContas, eleição id 2040602022), feita pela
  equipe em navegador. Registra três doações de pessoa física por Fabiano Campos Zettel em 2022, totalizando
  R$ 5.010.000,00, e o classifica como 6º maior doador da eleição (campo nrOrdem). Confirmado por checagem
  cruzada nas fichas de prestação de contas dos candidatos beneficiados. Nota metodológica: os domínios
  de dados abertos do TSE bloqueiam acesso automatizado (HTTP 403 via Akamai); a consulta exige navegador
  real.'
