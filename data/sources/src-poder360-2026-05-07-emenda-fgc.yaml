summary: 'A emenda atribuída pela PF à equipe do Banco Master foi protocolada em agosto de 2024 como Emenda
  nº 11 à PEC 65/2023 (autonomia do Banco Central) e não avançou no Senado; propunha elevar a cobertura
  do FGC de R$ 250 mil para R$ 1 milhão por depositante. Cita o relatório da PF: ''a proposta apresentada
  ao Senado reproduziu integralmente a versão encaminhada pelo banco''.'
