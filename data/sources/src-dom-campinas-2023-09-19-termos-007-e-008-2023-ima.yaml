summary: 'Edição que publica, lado a lado e com a mesma data de 18/09/2023, o Termo de Credenciamento nº 007/2023
  com a operadora e o nº 008/2023 com o Banco Master, ambos derivados do Chamamento Público nº 003/2023 e da Inexigibilidade
  nº 008/2023 da Informática de Municípios Associados S/A — IMA, empresa de economia mista do município de Campinas,
  com vigência de 24 meses contados da publicação. O objeto do chamamento divide os interessados em duas categorias
  explícitas: instituições bancárias e financeiras ''autorizadas pelo Banco Central do Brasil'' e gestoras de cartão
  de crédito ''isentas de autorização do Banco Central do Brasil''.'
