summary: 'Quadro de sócios da Fraction 024 Administração de Bem Próprio S.A. (CNPJ 41.934.366/0001-15),
  proprietária do jato Legacy 650 de prefixo PP-NLR, nos dados abertos da Receita Federal, consultado em
  19/09/2026: Marcus Vinícius da Mata (presidente, desde 13/05/2021) e Artur Martins de Figueiredo
  (diretor, desde 13/05/2021). Situação cadastral ativa. Nenhum dos dois nomes muda desde a constituição
  da empresa — a base não registra Viviane Barci de Moraes nem o escritório Barci de Moraes Sociedade de
  Advogados como sócios em nenhuma data.'
notes: A base registra datas de entrada; a ausência de um nome não prova que uma participação minoritária
  ou uma cessão não registrada não exista — apenas que o quadro societário formal não a reflete.
