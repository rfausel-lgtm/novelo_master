summary: 'Decisão de 02/04/2026, na PET 15.556, que afasta a obrigatoriedade de comparecimento do governador do
  Distrito Federal, Ibaneis Rocha Barros Júnior, convocado para depor em 07/04/2026 na CPI do Crime Organizado,
  por já figurar como investigado. A decisão transcreve a justificativa da própria CPI para a convocação: ele ''encontra-se
  no centro de dois eixos de investigação que convergem de maneira singular'' — o primeiro, as relações comerciais
  do escritório de advocacia que fundou e que leva seu nome com entidades investigadas nas operações Compliance
  Zero e Carbono Oculto; o segundo, seu papel institucional nas decisões do BRB sobre a operação com o Banco Master.
  Aplica a mesma jurisprudência (ADPFs 395 e 444, nemo tenetur se detegere) usada em dispensas anteriores de Paulo
  Sérgio, Belline Santana e dos irmãos de Dias Toffoli.'
notes: Confirma, com fonte primária, uma alegação sobre venda de R$ 38 milhões em honorários de precatório do escritório
  Ibaneis Advocacia ao fundo Reag Legal Claims, que o verbete dele já registrava como classe I, não verificada diretamente.
  A decisão não detalha o valor nem cita nominalmente a Reag Legal Claims — apenas reproduz a caracterização genérica
  da CPI sobre as 'relações comerciais' do escritório com entidades investigadas nas operações Compliance Zero e
  Carbono Oculto. O corpus trata isso como corroboração parcial, não confirmação integral do valor específico.
