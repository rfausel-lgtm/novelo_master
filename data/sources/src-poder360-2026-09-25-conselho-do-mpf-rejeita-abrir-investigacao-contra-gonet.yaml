language: pt-BR
summary: >-
  Publicada às 16:37 e atualizada às 18:15 de 25/09/2026. Segundo o texto, o Conselho Superior do MPF arquivou por
  5 a 4 o pedido de investigação e rejeitou por unanimidade o afastamento de Paulo Gonet do caso Master, pedido
  apresentado pelo Partido Novo; nove dos dez conselheiros com direito a voto participaram, e Gonet não esteve na
  sessão. Reproduz a fala de Gonet no plenário do STF em 15/09/2026: "O único encontro que eu tive com o senhor
  Vorcaro se deu com várias autoridades em abril de 2024". Não traz manifestação de Gonet ou da PGR sobre a votação
  nem do Partido Novo sobre o resultado.
notes: >-
  A matéria nomeia os votantes de cada lado; o Novelo não os registra, porque o MPF não os publica e a grafia de
  nomes diverge entre os veículos.
