summary: Representação apresentada em 09/03/2026 por um advogado, em nome próprio, contra o presidente do
  Senado, Davi Alcolumbre, por suposta prevaricação e abuso de autoridade ao deixar de pautar dezenas de
  pedidos de impeachment contra ministros do STF (cerca de 46 contra Alexandre de Moraes, 10-14 contra Dias
  Toffoli, segundo o peticionário) e obstruir a instalação de CPI sobre o Banco Master — pedindo seu
  afastamento cautelar da presidência do Senado. Argumenta que o Amapá, estado que Alcolumbre representa,
  perdeu R$ 400 milhões do fundo de previdência dos servidores (Amprev) aplicados no Master, como possível
  motivo de conflito de interesse na obstrução.
notes: É petição de pessoa física, sem representar órgão ou classe — não há, no corpus, notícia de que o
  STF tenha dado seguimento ao pedido de afastamento cautelar do presidente do Senado. Os números de pedidos
  de impeachment (46 contra Moraes, 10-14 contra Toffoli) são citados pelo próprio peticionário com base em
  reportagens, não verificados de forma independente pela equipe — contraste com a contagem de 109 pedidos
  totais que o próprio Alcolumbre declarou em 01/09/2026 (evidência já no acervo). A cifra de R$ 400 milhões
  do Amapá já está longamente documentada no acervo (lotes 71-86) de forma independente desta petição.
