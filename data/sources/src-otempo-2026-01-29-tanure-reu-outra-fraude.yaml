summary: 'Reportagem sobre o recebimento da denúncia contra Tanure e Gilberto Benevides em 28/01/2026,
  pela juíza Maria Isabel do Prado, da 5ª Vara Criminal Federal de São Paulo: uso de informação privilegiada
  na aquisição da Upcon pela Gafisa, pena máxima citada de cinco anos, compatível com o art. 27-D da Lei
  6.385/76. Cita trecho da decisão: ''A acusação está baseada em provas da existência de fato que, em
  tese, caracteriza infração penal.'''
