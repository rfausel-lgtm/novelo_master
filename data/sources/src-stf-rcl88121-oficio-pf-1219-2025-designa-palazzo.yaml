summary: 'Em observância à decisão na Reclamação 88.121, o diretor-geral da PF informa a Dias Toffoli que foi
  designada a delegada Janaina Pereira Lima Palazzo, chefe da DELEINQUE/DRPJ/SR/PF/DF, para a continuidade das
  investigações.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). Assinado eletronicamente em 18/12/2025 e protocolado na Rcl 88.121 em
  19/12/2025.'
