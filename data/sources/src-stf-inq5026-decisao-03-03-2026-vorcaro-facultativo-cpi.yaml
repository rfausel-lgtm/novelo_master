summary: A CPI do Crime Organizado convocou Daniel Vorcaro para depor compulsoriamente em 04/03/2026,
  sob custódia da Polícia Legislativa do Senado. Vorcaro peticionou (23612/2026, e-Docs. 434) pedindo
  que lhe fosse garantido o direito de não comparecer, invocando o direito ao silêncio. O relator defere
  o pedido, convertendo a compulsoriedade em facultatividade, nos mesmos termos já aplicados a outros
  convocados da CPI.
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão do Rafael, já autenticada por ele — nunca por
  certificado ou credencial do agente). É a decisão primária que faltava para a evidência já publicada
  ev-mendonca-torna-facultativo-comparecimento-vorcaro-cpi, até então baseada só em cobertura da Agência
  Senado (classe A, document_ids vazio). Código de autenticação/senha do rodapé de cada página nunca
  reproduzido no acervo.'
