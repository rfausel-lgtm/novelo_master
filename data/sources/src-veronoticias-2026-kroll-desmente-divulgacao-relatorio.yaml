summary: 'Registra nota da própria consultoria Kroll contestando a divulgação de seu trabalho: ''nenhum
  relatório, informação, lista ou recomendação foi compartilhado pela Kroll com terceiros'' e ''não existe
  relatório que atribua responsabilidade a pessoas''. Isso qualifica a caracterização de Daniel Leite
  como ''figura instrumental'' — atribuída pela imprensa a um relatório da Kroll — como proveniente de
  via não esclarecida, e não de divulgação direta e reconhecida pela própria consultoria.'
