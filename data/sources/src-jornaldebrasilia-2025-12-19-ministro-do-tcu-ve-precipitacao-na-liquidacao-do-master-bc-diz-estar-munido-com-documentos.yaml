source_type: press
language: pt-BR
summary: Descreve despacho de 18/12/2025 do ministro do TCU Jhonatan de Jesus que deu 72 horas ao Banco
  Central para justificar a liquidação do Banco Master, apontou suposta precipitação, indícios de cronologia
  atípica e demora na condução de alternativas (citando proposta do Grupo Fictor). Segundo o Broadcast, o BC
  recebeu o pedido com tranquilidade e se diz munido de documentos; a matéria não registra nota oficial do BC.
notes: Republicação do Estadão Conteúdo; o despacho não foi localizado. O texto contrapõe o despacho a
  evidências de investigações em linguagem do veículo, que o Novelo não adota. O sobrenome do ministro aparece
  grafado "Jessus" em um trecho da matéria.
