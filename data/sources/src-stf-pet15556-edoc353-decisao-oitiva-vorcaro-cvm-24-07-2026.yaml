summary: Decisão de 24/07/2026 que autoriza a Comissão de Valores Mobiliários (CVM) a colher depoimento de
  Daniel Bueno Vorcaro, preso preventivamente, para instruir três Investigações Administrativas distintas
  da Compliance Zero em curso na autarquia — (i) nº 19957.005195/2025-70, sobre indícios de infrações da
  Ambipar Participações e Empreendimentos S.A. nos mercados à vista e de derivativos em 2024-2025; (ii) nº
  19957.010013/2025-82, sobre irregularidades na emissão de notas comerciais adquiridas pelos fundos
  CITY-02 FIDC NP RI, CITY FIDC NP, MÁXIMA FIM – Crédito Privado 2, MN I FIDC NP e ST 1001 FIDC RL; e (iii)
  nº 19957.012897/2025-18, sobre irregularidades na emissão de Certificados de Recebíveis Imobiliários (CRIs)
  adquiridos pelos mesmos três primeiros fundos. Autoriza a oitiva na própria unidade prisional, resguardado
  o direito ao silêncio.
notes: A investigação sobre a Ambipar já constava do acervo (organizations/ambipar.yaml, via manipulação
  de preço de ações no mecanismo Texas I FIA) — esta decisão confirma que a CVM move processo sancionador
  formal (PAS 19957.005195/2025-70) sobre o mesmo alvo, e revela cinco fundos até então não registrados no
  acervo (CITY-02 FIDC, CITY FIDC, MÁXIMA FIM – Crédito Privado 2, MN I FIDC, ST 1001 FIDC), citados apenas
  de passagem, sem detalhamento adicional no documento consultado.
