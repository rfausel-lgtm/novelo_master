summary: Perícia privada contratada pela Go Up Entertainment e anexada ao processo sobre o Instituto Conhecer
  Brasil declara custo de US$ 13,3 milhões (R$ 75 mi) para o filme; orçamento inicial aprovado de US$
  16 mi. Cita diálogos de Vorcaro com Zettel e Thiago Miranda sobre fluxos de pagamento (12 parcelas de
  US$ 1,6 mi e duas de US$ 2 mi, total US$ 24 mi) e áudio de Flávio Bolsonaro sobre parcelas atrasadas
  em 16/11/2025.
