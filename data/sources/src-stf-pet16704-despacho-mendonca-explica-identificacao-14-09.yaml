summary: 'Resposta de 8 páginas de Mendonça ao despacho de Fachin de 03/09/2026, explicando as circunstâncias
  do despacho que determinou a identificação de pessoas mencionadas na IPJ-M nº 144738439/2026. Segundo
  Mendonça, a medida foi precaução: uma nota enviada por Daniel Vorcaro a interlocutor não identificado, via
  WhatsApp, mencionava "Andrei Augusto Passos Rodrigues, Diretor-Geral da Polícia Federal" e "Paulo Gustavo
  Gonet Branco, Procurador-Geral da República" — e, diante da menção direta a essas duas autoridades,
  Mendonça diz ter agido "sem imputar qualquer suspeita a quem quer que seja", apenas para preservar a
  regularidade dos autos. Também relata que a intimação dos delegados da Pet 15.556 se deu presencialmente
  em seu gabinete em 24/08/2026, às 17h40.'
notes: Peça obtida via peticionamento.stf.jus.br (sessão autenticada de Rafael). É a versão de Mendonça
  sobre um episódio que a defesa de Moraes (mesma data, ver
  src-stf-pet16704-oficio-gmam13-defesa-moraes-121-topicos) caracteriza como parte de um "direcionamento
  ilegal" da investigação.
