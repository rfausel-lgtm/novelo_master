source_type: press
summary: Reportagem sobre indícios apontados pelo Cade de 'gun jumping', triangulação financeira e possíveis
  crimes contra o sistema financeiro nacional na venda da Kovr, aprovada sem restrições em 07/05/2026
  mas com o valor de crédito concedido por dois bancos coincidindo exatamente com o montante que os compradores
  intermediários precisavam pagar no fechamento — levantando suspeita sobre a real função da etapa intermediária.
  O processo foi arquivado em 28/05/2026 por não atingir o faturamento mínimo exigido para análise pelo
  Cade, com os indícios de crime ainda não encaminhados a BC e MPF.
