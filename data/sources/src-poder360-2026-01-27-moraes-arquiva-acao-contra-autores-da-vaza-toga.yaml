language: pt-BR
summary: Informa que o ministro Alexandre de Moraes determinou o arquivamento da ação (petição apresentada ao
  STF em outubro de 2025) contra David Ágape, Eli Vieira e Eduardo Tagliaferro, seguindo recomendação da PGR;
  Moraes disse não haver na petição indícios mínimos da ocorrência de ilícito criminal. Lista crimes que a
  autora pedia que fossem investigados (difamação, injúria e abolição violenta do Estado Democrático de
  Direito, entre outros) e reproduz trechos do parecer da PGR.
notes: Fonte acrescentada pelo redator (não constava da liberação). A manchete e o texto chamam o instrumento
  de "ação"; a decisão em PDF hospedada pelo Poder360 (não aberta em texto) o identifica como petição. O texto
  nomeia a autora; o Novelo não a nomeia.
