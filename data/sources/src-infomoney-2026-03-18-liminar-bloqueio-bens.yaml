summary: Registra a liminar de 17/03/2026 do juiz Adler Batista Oliveira Nobre (3ª Vara de Falências e
  Recuperações Judiciais de São Paulo), a pedido da EFB Regimes Especiais (liquidante do Banco Master),
  proibindo a alienação de bens ligados a Daniel Vorcaro — fundos Astralo 95, Termópilas e Galo Forte,
  a Super Empreendimentos e Participações, participações societárias e imóveis, entre eles a mansão em
  Brasília.
