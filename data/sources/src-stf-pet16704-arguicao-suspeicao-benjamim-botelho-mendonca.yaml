summary: 'Peça protocolada por dependência aos autos da STP nº 976 e da Pet 16.704/DF (baixada na íntegra por
  Rafael, autenticado por certificado digital, em 14/09/2026). Benjamim Botelho de Almeida — investigado na
  Operação Compliance Zero — apresenta arguição de suspeição contra o ministro André Mendonça para a
  relatoria da Pet. 15.198/DF, da Rcl. 88.121/DF e do INQ 5026/DF, com dois fundamentos centrais: (i) o
  reconhecimento público do ministro, em nota de 02/09/2026, de encontro privado com Daniel Vorcaro sem
  advogados presentes, sobre a STP 976 — que discute créditos de precatórios do FIDC MEG, parte do ecossistema
  de fundos ligados a Vorcaro e administrado pela Trustee DTVM, alvo de busca e apreensão na própria Compliance
  Zero; e (ii) o reconhecimento do próprio ministro, em sessão de julgamento de 16/06/2026, de ter recebido,
  por advogado de Vorcaro, proposta de "delação premiada seletiva" — o que a peça argumenta violar o art. 4º,
  §§6º-7º, da Lei 12.850/2013 (vedação a que o relator participe de tratativas de colaboração premiada).
  Alega ainda amizade próxima entre o ministro e o advogado Ciro Rocha Soares (fotos de passeios para comprar
  roupas na mesma alfaiataria) e questiona se o advogado que tratou da delação seletiva era outro que não José
  Luís de Oliveira Lima. Por fim, sustenta que o voto do ministro pela prisão preventiva do pai de Vorcaro se
  apoiou em relatórios policiais com conteúdo de comunicações entre os advogados de defesa (Roberto Podval e
  Sérgio Leonardo) e seus clientes, citando um "ministro revisor" divergente e um "ministro decano" que teria
  comparado a prática a "regimes totalitários" — nenhum dos dois nominalmente identificado no trecho lido.'
notes: 'Peça obtida via peticionamento.stf.jus.br (sessão de Rafael, certificado digital). O acervo não
  localizou, até a data de publicação, cobertura de imprensa desta arguição específica de suspeição — trata-se
  de leitura direta do documento primário, não de reprodução de reportagem. As alegações sobre a amizade com
  Ciro Rocha Soares e sobre o voto na prisão preventiva do pai de Vorcaro são a versão do peticionante, um
  investigado com interesse direto no afastamento do relator; tratadas como alegação (classe A), não fato
  verificado, exceto os dois fundamentos centrais (encontro de 02/09 e delação seletiva de 16/06), já
  corroborados por cobertura de imprensa independente.'
