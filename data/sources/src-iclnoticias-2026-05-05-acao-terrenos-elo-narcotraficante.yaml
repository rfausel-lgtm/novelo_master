summary: 'Segunda reportagem, com lastro documental melhor: baseia-se em ação de restituição de dois terrenos
  em Queimados (RJ), movida por Agera Negócios Imobiliários e Aquilla FII, que tramitou de 2016 a 2023
  na 3ª Vara Criminal Federal do Rio de Janeiro, perante o juiz Vitor Barbosa Valpuesta, e foi arquivada
  em fevereiro de 2023 após decisão desfavorável no STJ. Cita trechos literais da decisão. Traz nota adicional
  da defesa de Botelho. A Sefer e Oliver Ortiz foram procurados e não responderam.'
