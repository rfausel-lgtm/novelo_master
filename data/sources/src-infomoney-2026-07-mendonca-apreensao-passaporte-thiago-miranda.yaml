summary: 'Dois dias após a busca e apreensão, em 11/07/2026, André Mendonça determinou a apreensão do
  passaporte de Thiago Miranda, proibição de deixar o país com inclusão no Sistema de Tráfego Internacional
  e proibição de solicitar novo documento de viagem, com advertência de que o descumprimento gera prisão
  preventiva. O fundamento foi risco concreto de fuga: ele tinha passagem aérea marcada para Miami em
  13/07, além de frequentes trocas de aparelhos celulares e do encerramento da agência.'
