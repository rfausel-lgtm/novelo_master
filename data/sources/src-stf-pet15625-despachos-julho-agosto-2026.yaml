summary: 'Dois despachos posteriores à busca de 18-19/05/2026 contra o perito João Cláudio Nabas. Em 02/07/2026,
  a defesa dele pede perícia de informática e documentoscopia para contestar a autenticidade do arquivo
  "Moraes.pdf" (o mesmo documento que a PF atribui à origem do vazamento à jornalista Malu Gaspar); o relator
  abre vista sucessiva à PF e à PGR. Em 21/08/2026, revela-se que a PF pedira o compartilhamento das provas do
  inquérito com sua própria Corregedoria-Geral, para apuração de infração disciplinar; a PGR opina
  favoravelmente, caracterizando a investigação como apuração de "possível violação de sigilo funcional
  imposto ao cargo de João Cláudio Nabas, que teria fornecido indevidamente informações resguardadas por
  sigilo a jornalista" — a mesma caracterização já registrada no acervo (lote 268), agora com nova citação
  direta da PGR. O relator defere o compartilhamento, com base no precedente do STF (MS 28.003/DF) que admite
  uso de provas criminais em processo administrativo disciplinar. Um ofício de 20/05/2026 da PF confirma que
  as ordens judiciais foram cumpridas em 19/05/2026 (um dia após a autorização).'
notes: Peças obtidas via peticionamento.stf.jus.br (sessão do Rafael, baixadas por equipe delegada em fork).
