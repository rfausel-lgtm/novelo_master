summary: 'Agência Brasil (30/12/2025): Gonet decidiu arquivar o pedido para investigar Moraes e a esposa, a
  advogada Viviane Barci de Moraes, no caso Master; o despacho foi publicado no sábado (27); o pedido foi
  feito pelo advogado Enio Martins Murad com base no que foi divulgado pela imprensa; cita trechos do
  despacho, entre eles que a representação "fundamenta-se estritamente em matérias jornalísticas"; registra a
  afirmação de Moraes, de 23/12, de que as reuniões com Galípolo trataram exclusivamente da Lei Magnitsky.'
