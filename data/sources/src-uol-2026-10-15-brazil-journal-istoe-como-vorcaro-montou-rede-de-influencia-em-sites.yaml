summary: Segundo a reportagem, mensagens extraídas pela PF do celular de Daniel Vorcaro indicam que, por meio
  de patrocínios e investimentos de empresas ligadas a ele, o banqueiro era consultado sobre textos de sites
  e revistas antes da publicação ou pedia alterações. Sobre a CartaCapital, diz que a revista fechou em 2021
  contrato de patrocínio de cinco anos com o Banco Máxima (depois Master), que o banco adiantou R$ 300 mil em
  dezembro de 2020 e que em 2024 a publisher Manuela Carta pediu "adiantamento de publicidade". Traz a nota de
  Manuela Carta e diz ter procurado os demais citados.
notes: "Lida pelo script lote:fonte em 17/10/2026 (texto integral) e reaberta pelo editor no mesmo dia.
