source_type: press
summary: Dados da Receita Federal obtidos pela CNN mostram gasto total de R$ 25,8 milhões com consultorias
  ligadas a Henrique Meirelles, Gustavo Loyola e Pedro Malan entre 2022 e 2025; descontados tributos,
  as empresas receberam cerca de R$ 20,2 milhões. O acesso decorreu da quebra de sigilo fiscal e bancário
  do Master aprovada pela CPI do Crime Organizado, por meio da DIRF.
