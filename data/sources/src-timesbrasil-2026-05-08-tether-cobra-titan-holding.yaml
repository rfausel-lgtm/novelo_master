source_type: press
summary: Reportagem lida integralmente pela equipe. Registra que a Tether entrou com ação no TJSP para
  recuperar US$ 300 milhões emprestados à Titan Holding, empresa de investimentos pessoais de Daniel Vorcaro,
  com empréstimo firmado em março de 2025; a primeira parcela foi transferida em 28/03/2025, mesmo dia
  em que o BRB anunciou a intenção de comprar o Master, e a segunda, quatro dias depois. Nomeia como representantes
  da Titan os ex-diretores Luiz Antônio Bull e Ângelo Antônio Ribeiro da Silva, e aponta a Master Holding
  Financeira e a Master Participações como devedoras solidárias.
