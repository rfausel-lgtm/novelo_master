summary: Noticia, em 19/10/2026, que a PGR encaminhou ao STF no sábado (17/10/2026) parecer segundo o qual não
  há evidências de abuso de autoridade por parte de André Mendonça na condução do caso Master; publica a
  íntegra do parecer; lista os quatro signatários; reproduz trechos do documento; e registra que a decisão
  final cabe ao Plenário do STF. Retoma a representação de Alexandre de Moraes, que apontou "fortes indícios"
  contra o colega.
notes: Aberta com lote:fonte em 20/10/2026 (publicada às 19h52 de 19/10). Não traz manifestação de Moraes, de
  Mendonça ou de Fachin sobre o parecer. Afirmações próprias do veículo sobre o conteúdo dos relatórios da PF
  não são adotadas pelo Novelo.
