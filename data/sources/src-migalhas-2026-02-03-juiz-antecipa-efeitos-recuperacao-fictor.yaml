source_type: press
summary: Informa que o juiz Adler Batista Oliveira Nobre, da 3ª Vara de Falências e Recuperações Judiciais do
  Foro Central Cível de São Paulo, concedeu tutela de urgência à Fictor Holding e à Fictor Invest, antecipando
  por 30 dias efeitos do stay period (suspensão de execuções, da prescrição e de novos atos de constrição),
  mantidos os bloqueios já efetivados, e determinou constatação prévia, ressalvando que isso não significa o
  deferimento do processamento da recuperação. Remete à decisão e ao número do processo.
