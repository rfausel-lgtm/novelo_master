summary: Extrato de termo de convênio entre o município de Feira de Santana, segunda maior cidade da Bahia, e a
  operadora, assinado em 02/05/2019 pelo prefeito Colbert Martins da Silva Filho, com vigência de sessenta meses,
  cujo objeto é disponibilizar aos servidores ativos e inativos, por desconto em folha, 'uma linha de crédito rotativo,
  através do Programa CREDICESTA'. É o instrumento municipal mais antigo localizado em toda a investigação, nove
  meses depois do credenciamento estadual baiano de agosto de 2018.
