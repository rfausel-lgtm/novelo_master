summary: "Gazeta do Povo (27/12/2025): o Banco Central protocolou em 26/12 embargos de declaração no STF
  pedindo esclarecimentos sobre a acareação marcada para 30/12 entre o seu diretor de Fiscalização, Vorcaro e
  Paulo Henrique Costa; registra que Paulo Gonet havia pedido o cancelamento da acareação por entendê-la
  prematura e que Toffoli manteve o agendamento; lista, segundo o Estadão, os quatro questionamentos do BC."
notes: Os quatro questionamentos do BC são atribuídos pela Gazeta ao Estadão, e a expressão "armadilhas
  processuais" ao G1; o pedido da PGR e a manutenção da data aparecem sem atribuição a outro veículo.
