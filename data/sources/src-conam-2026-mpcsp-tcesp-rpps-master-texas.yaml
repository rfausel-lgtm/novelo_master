summary: 'Ação de acompanhamento mais recente do MPC-SP ao TCE-SP identifica sete municípios paulistas
  expostos ao Master, não quatro: além de Araras, Cajamar, Santo Antônio de Posse e Santa Rita d''Oeste,
  também São Roque (R$ 93,15 milhões, a maior exposição individual, já mapeado no corpus), Brodowski (R$
  10 milhões em Letras Financeiras + R$ 5 milhões no Fundo Texas) e Fernão (R$ 3 milhões) — elevando a
  exposição total documentada pelo MPC-SP para R$ 238,15 milhões.'
