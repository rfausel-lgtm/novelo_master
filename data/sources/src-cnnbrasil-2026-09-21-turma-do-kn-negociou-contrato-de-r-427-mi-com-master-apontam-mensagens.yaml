title: '“Turma do KN” negociou contrato de R$ 427 mi com Master, apontam mensagens'
publisher: CNN Brasil
author: Gustavo Uribe e Janaína Camelo
publication_date: '2026-09-21'
url: https://www.cnnbrasil.com.br/politica/turma-do-kn-negociou-contrato-de-r-427-mi-com-master-apontam-mensagens/
source_type: press
language: pt-BR
summary: >-
  Diz que as informações sobre o contrato foram reveladas pelo Metrópoles e confirmadas pela CNN e que o
  documento foi "obtido pela CNN": honorários de 5% líquidos sobre o valor recebido pelo banco em 12 ações do
  setor sucroalcooleiro em que o Master era parte contra a União, que chegariam a R$ 427 milhões em caso de
  vitória, pagos em até cinco dias após a obtenção dos ganhos. Lê "KN", conforme as mensagens, como menção ao
  ministro Kassio Nunes Marques. Traz a manifestação do ministro à CNN (classifica a divulgação como "tentativa
  de criar narrativa para incriminá-lo"; diz que o processo que julgou no STF não tem relação com as ações de
  precatórios da advogada, que tramitavam no STJ) e a nota de Newton Ramos (relação pessoal anterior com
  Vorcaro; Prime You; "nunca julguei qualquer causa de interesse do Banco Master").
notes: >-
  Atualizada em 22/09/2026, às 08h57. Grafa o nome da advogada como "Camila". A expressão "tentativa de criar
  narrativa para incriminá-lo" aparece entre aspas, atribuída ao ministro, na linha fina; no corpo, em paráfrase. Transcreve mensagens privadas que
  o Novelo não reproduz.
