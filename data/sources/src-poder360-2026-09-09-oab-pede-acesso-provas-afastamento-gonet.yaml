summary: 'Em 09/09/2026, o Conselho Federal da OAB, reunido com os presidentes das 27 seccionais em
  Brasília, protocolou pedido ao STF de acesso a provas e documentos sigilosos do caso Master e de
  afastamento do procurador-geral da República, Paulo Gonet, dos casos da Operação Compliance Zero — já
  publicado no acervo (lote 306). Na mesma reunião, em vez de deliberar sobre o afastamento cautelar de
  Alexandre de Moraes e Dias Toffoli, a diretoria decidiu criar uma comissão formada por ela própria e pelos
  presidentes de seccionais para examinar os documentos e redigir relatório sobre a conduta dos ministros.'
notes: 'Verificado por WebFetch direto, via agente de pesquisa delegado. O pedido de afastamento de Gonet já
  estava publicado; o item NOVO aqui é a criação da comissão como alternativa à votação direta.'
