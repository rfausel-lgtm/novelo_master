summary: Registra que Vorcaro pediu a remessa das investigações da Carbono Oculto e da Operação Quasar
  ao STF, alegando conexão com o caso Master. O juiz Sandro Nogueira Leite negou o pedido em 19/12/2025,
  escrevendo que 'ao menos por agora, não há notícia de conexão do peticionário e Banco Master com a investigação';
  o MP indicou que a operação mirava 'outros personagens'.
