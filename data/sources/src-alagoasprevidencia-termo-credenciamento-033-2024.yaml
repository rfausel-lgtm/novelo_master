summary: Documento de três páginas baixado e lido integralmente pela equipe, publicado no portal de transparência
  da autarquia estadual. Processo E:04799.0000008156/2023, datado de 05/04/2024. É o espécime do termo
  de credenciamento do Banco Master cujo texto a auditoria do Ministério da Previdência descreve como
  idêntico em outros quatro regimes próprios. Traz assinaturas digitais de André Kruschewsky Lima e Alberto
  Felix de Oliveira Neto, em 08/04/2024, como representantes legais da instituição interessada no credenciamento.
