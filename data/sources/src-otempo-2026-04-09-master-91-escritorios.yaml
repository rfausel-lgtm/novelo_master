source_type: press
summary: Reportagem com base em dados da Receita Federal enviados à CPI do Crime Organizado. Os pagamentos
  do banco a escritórios de advocacia saltaram de R$ 40,1 milhões em 2022 para R$ 262,4 milhões em 2025;
  quinze escritórios receberam R$ 10 milhões ou mais no período. A reportagem original está sob acesso
  pago; a equipe trabalhou com reprodução autorizada, creditada.
