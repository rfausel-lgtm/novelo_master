summary: A Operação 'Off-Balance' da PF, deflagrada em 13/05/2026, cumpriu seis mandados de busca em Cajamar,
  Boituva e São Paulo, por suspeita de gestão temerária de recursos do RPPS, nomeando como alvos os dirigentes
  Luiz Henrique Miranda Teixeira (diretor-executivo), Milton Marques Dias (diretor administrativo e financeiro)
  e Marcelo Ribas de Oliveira (comitê de investimentos). Há também ação popular movida por moradores na
  2ª Vara de Cajamar (juiz Marcelo Henrique Mariano), com o IPSSC, o Master, Vorcaro, ex-dirigentes, a
  consultoria Mais Valia e o ex-prefeito Danilo Joan como réus — perícia contábil e atuarial determinada
  em abril de 2026.
