summary: 'Agravo interno de 26 páginas, protocolado em 14/09/2026 (véspera da sessão de 15/09), contra os
  itens I, II e IV da decisão de Fachin de 09/09/2026 — que suspendeu a decisão de Mendonça de 08/09 na Pet
  16.662, sobrestou seu trâmite e suspendeu qualquer procedimento sobre investigação de integrantes do STF.
  O Partido Novo, que obtivera medidas cautelares na Pet 16.662, argumenta ter legitimidade recursal por
  ter sido diretamente atingido pela suspensão de provimento que já havia obtido, pede reconsideração ou,
  subsidiariamente, submissão ao Plenário — sem impugnar o item III da mesma decisão (que suspendeu decisão
  de Flávio Dino na Pet 16.669, cuja manutenção o partido considera necessária).'
notes: Peça obtida via peticionamento.stf.jus.br (sessão autenticada de Rafael). Pedido procedimental que,
  se acolhido antes da sessão, poderia alterar o rito de 15/09 — nenhuma fonte localizada até esta coleta
  informa se foi apreciado antes do início da sessão.
