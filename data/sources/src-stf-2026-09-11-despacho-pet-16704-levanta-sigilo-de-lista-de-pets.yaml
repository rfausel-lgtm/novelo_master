summary: >-
  Despacho de uma página. Registra que o Vice-Procurador-Geral da República pediu o levantamento dos sigilos
  de 18 Pets, entre elas a 15.873; anota que esses processos não guardam relação com o objeto da pauta da
  sessão extraordinária seguinte e afirma "não haver impedimento ao levantamento dos correspondentes
  sigilos"; e, de ofício, determina "também o levantamento do sigilo" de outra lista, com os Inquéritos 5.050
  e 5.070 e Pets, entre elas a 15.674. A Pet 15.978 não consta de nenhuma das duas listas.
