summary: 'Cobertura independente do mesmo ofício de Gilmar Mendes a Fachin, enviado na noite de 11/09/2026:
  pedido de reunião dos processos de Moraes e Mendonça, com Fachin assumindo a relatoria, e adiamento do
  julgamento até que a matéria estivesse organizada. Fachin indeferiu o pedido no dia seguinte, 12/09/2026
  (ver src-stf-pet16704-despacho-12-09-2026-pauta-adiada-23-09).'
