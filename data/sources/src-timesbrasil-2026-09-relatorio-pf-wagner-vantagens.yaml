summary: 'Registra que a defesa de Wagner apresentou petição ao gabinete de Mendonça em 30/06/2026 contestando,
  "com dados e fatos, as onze hipóteses de ilegalidade produzidas no inquérito da Polícia Federal", sustentando
  que ele "nunca teve negócios com o Banco Master", "nunca atuou como intermediário de interesses da instituição"
  e "nunca votou a favor de projetos que pudessem beneficiá-la", e que sua atuação foi "contrária aos interesses
  do banco".'
