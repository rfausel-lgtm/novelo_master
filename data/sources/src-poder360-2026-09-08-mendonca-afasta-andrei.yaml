summary: Afastamento preventivo de Andrei Rodrigues e Leandro Almada da Costa (diretor de Inteligência
  Policial), determinado por Mendonça citando 'monitoramento sistemático e ilegal' de mais de 30 dias.
  Pedido original partiu do partido Novo, pedindo 'medidas necessárias para preservar a independência,
  integridade e efetividade das investigações em curso'. O veículo contatou Andrei, PF, AGU e Ministério
  da Justiça — nenhum respondeu até a publicação.
