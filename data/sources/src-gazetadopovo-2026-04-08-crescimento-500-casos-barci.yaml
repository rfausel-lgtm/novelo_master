summary: 'Reportagem de dados, a partir de cadastro processual público do STJ e STF: o volume de processos
  do escritório saltou de 27 (até 22/03/2017, data de posse de Moraes no STF) para 159 depois. Cita ainda
  R$ 80 milhões recebidos do Banco Master entre fevereiro de 2024 e novembro de 2025, segundo dados fiscais
  da Receita Federal.'
