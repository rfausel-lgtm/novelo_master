summary: 'Decisão de 15/12/2025 na Reclamação 88.121/DF (STF, incidente 7450195), então relatada por Dias
  Toffoli — ato público, baixado diretamente do portal do STF sem necessidade de certificado digital,
  pela Resolução 427/2010. É o marco fundador da supervisão do STF sobre o caso Banco Master: determina
  as primeiras diligências preliminares (prazo de 30 dias) — oitiva de investigados perante delegado
  designado pelo Diretor-Geral da PF, oitiva de dirigentes do Banco Central sobre o Master e "possíveis
  desdobramentos envolvendo outras instituições financeiras", e autorização para requisições e pedidos de
  quebra de sigilo. A Rcl 88.121 foi arquivada em 10/02/2026, com questões pendentes transferidas para o
  recém-criado INQ 5.026.'
notes: Documento público, baixado diretamente do portal do STF (Resolução STF 427/2010 e Resolução CNJ
  121/2010 — atos decisórios são públicos). Não depende do certificado digital do Rafael.
