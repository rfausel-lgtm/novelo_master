summary: 'Newsletter de David Ágape. Alega que dois documentos anônimos trazem no rodapé a sigla ''UADIP/CINQ/CGRC/DICOR''
  — apontando, segundo o autor, para a diretoria de Dennis Cali na Polícia Federal — e cita ''Wedson Cajé
  Lopes'' como o único integrante da equipe com acesso a uma decisão de Mendonça. Fontes primárias citadas
  pelo artigo: IPJ-A nº 3298613/2026 e Ofício nº 3305795/2026-CINQ/CGRC/DICOR/PF (27/08/2026) — nenhum
  dos dois foi obtido ou lido pela equipe editorial. Verificação: obtida por resumo assistido, não por
  leitura direta do HTML bruto do artigo (diferente da matéria irmã sobre os metadados do PDF) — nomes
  e siglas não confirmados pela equipe contra documento primário nem contra o texto integral do artigo.'
