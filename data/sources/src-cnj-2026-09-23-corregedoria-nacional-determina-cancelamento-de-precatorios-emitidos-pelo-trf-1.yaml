source_type: official_court
language: pt-BR
summary: >-
  Notícia oficial: a Corregedoria Nacional de Justiça restabeleceu a eficácia das decisões da 6ª Vara Federal
  Cível da Seção Judiciária do Distrito Federal para o cancelamento de 16 precatórios expedidos no âmbito do
  TRF-1 e a devolução dos valores à Conta Única do Tesouro Nacional; a decisão liminar, assinada pelo
  corregedor Benedito Gonçalves, suspende decisões da Presidência do TRF-1; cerca de R$ 4,7 bilhões estavam
  fora da Conta Única desde dezembro de 2023; beneficiárias: Companhia Açucareira Usina Capricho, Una
  Agroindustrial S/A e Companhia Açucareira Vale do Ceará Mirim; prazo de cinco dias. "Processo relacionado:
  PP 0007917-89.2026.2.00.0000". A notícia não menciona o Banco Master nem Daniel Vorcaro.
notes: >-
  Página aberta diretamente em 16/10/2026. A notícia é de 23/09; a decisão foi assinada eletronicamente em
  22/09/2026, às 23h37.
