summary: >-
  Convocação publicada em 23/09/2026, às 09:48, e atualizada em 24/09/2026, às 15:27, com instruções à imprensa:
  sessão extraordinária do Conselho Superior do MPF na sexta-feira, 25/09, a partir das 10h, com transmissão ao
  vivo pelo Canal MPF no YouTube, para apreciar a Notícia de Fato PGR-00385698/2026, sobre a atuação do
  procurador-geral da República, Paulo Gonet Branco, nas apurações do Banco Master, em especial nas PET 15.556/DF
  e 16.662/DF, em trâmite no STF; o Conselho decidiria sobre designar subprocurador-geral para investigar o PGR
  (art. 57, X, da Lei Complementar 75/1993). Presidência do subprocurador-geral Nicolao Dino, vice-presidente do
  Conselho; relatoria do subprocurador-geral Francisco Sanseverino.
