summary: Apresentação protocolada na CPI do Crime Organizado com cronologia de supostas fraudes em regimes
  próprios de previdência social. Registra repasses do Banco Máxima e do grupo Multipar à MAXX Consultoria
  a partir de 2016; transferência de R$ 2 milhões da Milo Investimentos a Benjamim Botelho de Almeida,
  sócio da Foco DTVM, em 31/10/2016; o Pedido de Busca e Apreensão Criminal nº 0001530-26.2019.4.01.4101,
  de 23/01/2019, na Subseção Judiciária de Ji-Paraná (RO); a Operação Fundo Fake, de 15/07/2020; e a existência
  de três inquéritos sucessivos contra Vorcaro (Rolim Previ, trancado por habeas corpus; Ji-Paraná/Fundo
  Fake 2, suspenso; e Pagamentos Suspeitos, em andamento).
