source_type: press
summary: 'Identifica Mario Umberto Degani, o Beto Degani, como "primo do ministro" Dias Toffoli: a mãe do ministro,
  Sebastiana Seixas Dias, era irmã de Iracema Dias Degani, mãe de Beto. Diz que ele fundou o Tayayá em 1999, é dono da
  incorporadora Praia de Cuca, aberta em 2022, e concluiu em julho de 2025 a venda de sua parte no resort ao advogado
  Paulo Humberto Barbosa e a empresas ligadas a ele. A reportagem não conseguiu falar com Degani.'
