summary: Ofício do presidente da CPI, senador Fabiano Contarato, convocando Leonardo Augusto Furtado Palhares
  para depor em 01/04/2026. Acompanha o Requerimento nº 240/2026, do senador Alessandro Vieira, aprovado
  em 11/03/2026, que descreve a organização investigada em quatro núcleos (financeiro, corrupção institucional,
  ocultação patrimonial e intimidação) e sustenta que 'o papel de Leonardo Palhares não se restringe à
  mera formalização documental pontual, posicionando-o [...] como elemento central na estruturação dos
  instrumentos contratuais que conferiram aparência de legalidade ao esquema de pagamentos ilícitos'.
  A reunião de 01/04/2026 foi cancelada e ele nunca depôs.
