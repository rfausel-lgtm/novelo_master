summary: 'Manifestação da PGR ao Min. Dias Toffoli, em atenção a despacho de 23/12/2025, sobre a
  representação da autoridade policial (8ª Vara Criminal Federal de SP) por prisão preventiva de Daniel
  Bueno Vorcaro, busca e apreensão contra 38 alvos, sequestro de bens até R$ 5.775.234.097,25 e quebra de
  sigilo de 101 pessoas/entidades — a petição de origem direta da decisão de Toffoli de 06/01/2026. Traz a
  cronologia processual completa desde a representação original e, em nota de rodapé, os valores de
  bloqueio individualizados por pessoa/entidade.'
notes: 'Peça 6 de 50 obtidas por Rafael via certificado digital no peticionamento eletrônico do STF (pasta
  local "Pet 15198-1_50") — mesma política de divulgação já aplicada às demais peças obtidas por
  certificado. Rodapé de impressão com CPF de quem baixou o documento nunca reproduzido no acervo.'
