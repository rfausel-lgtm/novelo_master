source_type: press
summary: 'Formação em Administração de Empresas pela Universidade Católica de Pernambuco, com pós-graduação
  em Desenvolvimento Gerencial (EAESP/FGV) e Inovação Corporativa (Stanford), mestrado pela Universidade
  de Birmingham e mestrado executivo pela Kellogg School of Management. Carreira: HSBC (1999), Caixa Econômica
  Federal (2001-2018/2019, até vice-presidente de Clientes, Negócios e Transformação Digital), CEO da
  Ebserh (set/2017-mai/2018, governo Temer). Presidiu o BRB de 2019 a novembro de 2025, por indicação
  do governador Ibaneis Rocha; afastado pelo próprio governador em novembro de 2025, já sob suspeita na
  aquisição de carteiras do Master.'
