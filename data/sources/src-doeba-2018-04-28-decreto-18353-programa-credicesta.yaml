summary: 'Ano CII, edição nº 22.408, página 11. Texto integral recuperado pela equipe no índice de busca
  do próprio portal do diário e conferido palavra por palavra. Assinado por Rui Costa no Palácio do Governo
  em 27 de abril de 2018 — o mesmo dia da realização do leilão de alienação da estatal —, com referendo
  dos secretários da Casa Civil e da Administração. O art. 2º fixa margem de consignação de 30% da remuneração
  líquida; o art. 3º assegura ao ''detentor dos direitos de exploração comercial'' a faculdade de diversificar
  as funcionalidades do cartão, associando-lhe ''a contratação de serviços, inclusive comerciais, creditícios,
  financeiros, securitários e congêneres''; o art. 9º atribui à secretaria da Administração o dever de
  disponibilizar as margens e ''garantir a efetivação dos descontos mensais''; e o art. 13 estende ao
  detentor dos direitos os direitos e deveres do decreto. Base normativa: Decreto nº 17.251/2016.'
