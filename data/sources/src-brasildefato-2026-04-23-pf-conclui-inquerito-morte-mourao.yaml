summary: A Polícia Federal concluiu, em abril de 2026, o inquérito sobre a morte de Luiz Phillipi Machado
  de Moraes Mourão, ocorrida após sua prisão em 04/03/2026 na carceragem da superintendência em Belo Horizonte.
  A conclusão é de que ele atentou contra a própria vida e de que 'não houve intervenção externa na ocorrência'.
  O relatório foi enviado ao ministro André Mendonça.
