summary: 'Parecer da Superintendência-Geral do Cade (Processo nº 08700.001346/2026-97), assinado por Alexandre
  Barreto de Souza e Felipe Neiva Mundim, aprovando sem restrições concorrenciais a compra da Kovr Participações
  e da corretora Estrutural pelo PicPay Bank, mas apontando ''indícios que podem configurar a consumação
  prévia de ato de concentração (gun jumping) e eventual triangulação financeira'' na sequência de venda:
  em 19/09/2025, no mesmo dia em que compradores intermediários (ex-minoritários da Kovr) fecharam a compra
  junto à Master Serviços (100% de Vorcaro) e a revenderam ao PicPay, o Banco PicPay e o Banco Original
  concederam a esses intermediários crédito em valor ''exatamente'' igual ao preço de aquisição. O Cade
  abriu procedimento apartado (APAC) e registrou que indícios de crime contra o sistema financeiro seriam
  encaminhados a autoridades competentes, por escaparem de sua jurisdição.'
