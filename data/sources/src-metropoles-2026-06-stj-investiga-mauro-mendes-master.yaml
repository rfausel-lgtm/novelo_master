summary: Apuração aberta a pedido da Procuradoria-Geral da República sobre as condições do credenciamento
  do CredCesta em 2023, sob sigilo no Superior Tribunal de Justiça. Registra que, entre o pedido de credenciamento
  e a aprovação, o então governador estava em Nova York, em evento empresarial, e esteve em restaurante
  na véspera da liberação, na mesma ocasião em que ali se encontrava uma comitiva do Rio de Janeiro. Mauro
  Mendes afirma ter pago as próprias despesas, classifica a coincidência como fortuita, nega ter conversado
  com representantes do banco e sustenta que outras instituições também foram credenciadas em sua gestão,
  não tendo o Master sido o primeiro.
