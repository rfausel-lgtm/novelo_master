summary: 'A inspeção do TCU no Banco Central sobre a liquidação do Banco Master foi concluída em 11/02/2026
  e o relatório final foi enviado ao ministro relator Jhonatan de Jesus. Segundo interlocutores da Corte,
  o documento não analisa o mérito da decisão de liquidar nem aponta irregularidades na atuação da autoridade
  monetária, limitando-se à verificação dos documentos que embasaram a decisão de novembro de 2025. Após
  a conclusão, o relator ampliou o sigilo: o BC deixou de ter acesso automático aos autos.'
