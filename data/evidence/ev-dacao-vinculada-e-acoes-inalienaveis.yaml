id: ev-dacao-vinculada-e-acoes-inalienaveis
kind: evidence
classification: D
proposition: 'A dação em pagamento não é definitiva no sentido comum: o termo estabelece que ela está
  vinculada à conclusão integral dos serviços jurídicos contratados e que o escritório fica obrigado a
  manter a titularidade direta das ações até lá, vedada qualquer alienação, cessão, oneração ou transferência
  sem autorização prévia e por escrito da contratante. Na prática, o pagamento permanece condicionado
  e sob controle de quem paga.'
