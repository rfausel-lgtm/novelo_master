id: ev-master-forjava-documentos-credcesta-para-brb
kind: evidence
classification: A
proposition: 'Relatório da PF, tornado público na quebra de sigilo de setembro de 2026, aponta que o Banco
  Master fabricava em escala procurações, cédulas de crédito (CCBs) e outra documentação usando dados de
  clientes do CredCesta, com ferramentas de automação gerando milhares de documentos em lote, e manipulação
  digital sistemática (remoção de datas, exclusão de horários de assinaturas eletrônicas) para dificultar a
  rastreabilidade. Os documentos fabricados eram usados como lastro documental para legitimar transações
  bilionárias com o BRB.'
