id: ev-pgr-pede-suspensao-da-acareacao-e-toffoli-mantem-a-data
kind: evidence
classification: C
proposition: Segundo O Globo (26/12/2025) e a Gazeta do Povo (27/12/2025), o procurador-geral Paulo Gonet
  pediu a suspensão (ou o cancelamento) da acareação por considerá-la prematura antes dos depoimentos
  individuais, e Toffoli manteve a audiência marcada para 30/12/2025.
source_ids:
