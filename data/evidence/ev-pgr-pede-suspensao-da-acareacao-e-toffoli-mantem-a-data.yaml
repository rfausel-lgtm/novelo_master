  - src-jornaldebrasilia-2025-12-29-stf-da-autonomia-a-pf-sobre-acareacao
date: 2025-12-24
notes: A manifestação da PGR não foi localizada em fonte oficial; o Novelo não a leu. O Globo situa o pedido
  na noite de quarta-feira (24/12/2025). A Gazeta cita o Código de Processo Penal como fundamento descrito
  pela PGR. A data da decisão de Toffoli que rejeitou o pedido não foi confirmada.
