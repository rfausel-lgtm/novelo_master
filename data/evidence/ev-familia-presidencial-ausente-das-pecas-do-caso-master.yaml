id: ev-familia-presidencial-ausente-das-pecas-do-caso-master
kind: evidence
classification: D
proposition: 'Verificação feita pela equipe: os nomes dos quatro filhos e da filha do presidente Lula
  não aparecem nenhuma vez nas peças primárias do caso Master em posse do corpus. No relatório da Polícia
  Federal sobre o celular de Daniel Vorcaro, de 218 páginas, e na decisão que autorizou a operação Zona
  Cinzenta, a busca textual com normalização de acentos por ''Lulinha'', ''Fábio Luís'', ''Luís Cláudio'',
  ''Marcos Cláudio'', ''Sandro Luís'', ''Lurian'' e ''Lula da Silva'' retorna zero ocorrências em todos
  os casos. Os controles de extração confirmam que o texto foi lido: ''Vorcaro'' aparece 302 vezes no
  relatório e ''Master'' nove vezes na decisão.'
