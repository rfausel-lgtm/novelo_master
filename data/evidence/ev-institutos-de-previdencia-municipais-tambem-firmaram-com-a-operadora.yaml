id: ev-institutos-de-previdencia-municipais-tambem-firmaram-com-a-operadora
kind: evidence
classification: C
proposition: A operação alcançou também os regimes próprios de previdência dos municípios, e não apenas
  as prefeituras. Em São Lourenço da Mata, o instituto de previdência municipal firmou instrumento próprio
  com a operadora em novembro de 2024, por cinco anos — já sob a crise do banco. Os institutos de Betim,
  de Belém e de Duque de Caxias figuram como partes em litígios com a empresa, sem que o convênio correspondente
  tenha sido localizado. Em Juazeiro, a companhia estatal municipal de trânsito firmara termo próprio
  em 2021. O padrão de capilaridade para dentro da administração indireta repete o que se observou em
  São Paulo, com o serviço funerário e o hospital do servidor.
