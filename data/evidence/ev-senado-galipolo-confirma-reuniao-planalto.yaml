proposition: Em depoimento à CPI do Crime Organizado (08/04/2026), Gabriel Galípolo confirmou ter participado
  da reunião de dezembro de 2024 no Planalto com Lula, Vorcaro e ministros, e afirmou que sua atuação
  se limitou a encaminhar o caso à análise técnica do BC.
