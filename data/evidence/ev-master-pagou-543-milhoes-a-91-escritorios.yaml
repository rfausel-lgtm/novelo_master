id: ev-master-pagou-543-milhoes-a-91-escritorios
kind: evidence
classification: A
proposition: O Banco Master pagou pelo menos R$ 543 milhões a 91 escritórios de advocacia entre 2022 e
  2025, segundo dados da Receita Federal enviados à CPI do Crime Organizado. Os pagamentos saltaram de
  R$ 40,1 milhões em 2022 para R$ 262,4 milhões em 2025 — mais que sextuplicaram no período em que a instituição
  já enfrentava escrutínio regulatório crescente. Quinze escritórios receberam R$ 10 milhões ou mais.
