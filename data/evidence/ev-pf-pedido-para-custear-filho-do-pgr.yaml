id: ev-pf-pedido-para-custear-filho-do-pgr
kind: evidence
classification: A
proposition: 'Segundo o relatório da PF, em 29/03/2025 o procurador-geral perguntou, por meio do advogado
  Ciro Soares, se poderia levar o filho ao evento organizado por Vorcaro em Londres; o banqueiro respondeu
  ''Óbvio, né''. Cerca de 15 dias depois Vorcaro aprovou a inclusão na lista de convidados com despesas
  pagas: ''Pedro e Ciro (Soares), ok. Não dá para bancar outros''.'
