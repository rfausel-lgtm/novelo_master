id: ev-o-rh-do-ente-publico-era-o-ponto-de-venda-do-credcesta
kind: evidence
classification: D
proposition: 'O convênio-padrão explica como um produto sem rede própria alcançou 176 municípios: quem
  entregava o cartão era o departamento de recursos humanos do próprio ente público. A cláusula obriga
  o município a ''entregar o Cartão Credcesta solicitado pelos respectivos Servidores, por meio da sua
  Unidade/Órgão de Recursos Humanos''. O mesmo instrumento estabelece que os saques ''serão liberados
  por instituição financeira expressamente autorizada pela PKL'' — a operadora autoriza o banco, e não
  o contrário —, que as operações não podem ser canceladas a pedido do servidor sem anuência da empresa,
  e que a empresa ''poderá ceder o objeto deste Convênio a terceiros, como também a carteira de Convênios
  respectivas, comunicando tal fato previamente ao CONVENIADO''. A carteira de convênios públicos é, nos
  termos do contrato, ativo cedível mediante mero aviso. Todos os instrumentos são sem ônus para o ente
  público.'
