id: ev-rpps-lesados-igeprev-e-mapa-nacional
kind: evidence
classification: A
proposition: A Polícia Federal identificou aportes suspeitos de regimes próprios de previdência em pelo
  menos 20 municípios e dez estados direcionados à Foco DTVM — São Paulo, Rio de Janeiro, Minas Gerais,
  Pará, Tocantins, Mato Grosso, Paraná, Santa Catarina, Goiás e Rondônia —, com padrão de aportes altos,
  concentração na mesma administradora e alocação em fundos de altíssimo risco. Os maiores identificados
  são o Igeprev, do Tocantins, com R$ 62 milhões, e o Impremu, de Uberlândia (MG), com R$ 47 milhões.
  Em 12/02/2026, o Ministério Público do Tocantins instaurou inquérito civil sobre as aplicações do Igeprev
  — R$ 62 milhões na Foco DTVM e R$ 21,1 milhões no Aquilla FII, entre 2011 e 2014 —, registrando o promotor
  Vinícius de Oliveira e Silva que 'houve aplicação e manutenção de recursos em fundos com riscos aparentemente
  incompatíveis com a natureza pública'. O Igeprev respondeu que não possui qualquer investimento no Banco
  Master, que as aplicações ocorreram em gestão anterior e que hoje 88,12% dos recursos estão em instituições
  seguras.
