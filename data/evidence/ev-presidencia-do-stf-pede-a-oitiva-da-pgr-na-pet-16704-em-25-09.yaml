id: ev-presidencia-do-stf-pede-a-oitiva-da-pgr-na-pet-16704-em-25-09
kind: evidence
classification: D
proposition: >-
  Em 25/09/2026, na PET 16.704, a Presidência do STF determinou a oitiva da Procuradoria-Geral da República, no
  prazo de cinco dias, sobre todas as providências postuladas nos Docs. 161, 163, 166, 175, 180, 184, 189 e 194,
  inclusive quanto à pertinência, necessidade, adequação e eventual repercussão sobre procedimentos investigativos
  em curso.
document_ids:
- doc-2026-09-25-stf-despacho-da-presidencia-na-pet-16704-ouve-a-pgr
source_ids:
- src-stf-2026-10-16-pet-16704-andamentos
excerpt: >-
  Considerando os requerimentos pendentes, entendo necessária a oitiva da Procuradoria-Geral da República acerca
  de todas as providências postuladas (Docs. 161, 163, 166, 175, 180, 184, 189 e 194)
date: '2026-09-25'
notes: >-
  Depois do despacho, o portal lista petições de manifestação em 25, 26 e 29/09, duas em 08/10 e a Petição 128602
  (12/10, 19:38, remetida à Presidência em 13/10), sem identificar quem peticionou; o Novelo não as atribui a
  ninguém (nem a Petição 128602 à notícia de fato de deputados do PT de 12/10, nem a Petição 122122, de 28/09, na
  PET 16.662, ao pedido do Novo). Até 13/10/2026, última entrada na consulta de 16/10, não há petição identificável
  da PGR, devolução da vista de Flávio Dino (pedida na PET 16.662) nem nova designação de pauta depois de 17/09.
