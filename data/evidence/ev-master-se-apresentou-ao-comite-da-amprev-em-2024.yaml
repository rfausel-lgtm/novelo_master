id: ev-master-se-apresentou-ao-comite-da-amprev-em-2024
kind: evidence
classification: D
proposition: Em 14/03/2024, quatro meses antes das aplicações, o Banco Master apresentou-se ao Comitê
  de Investimentos da Amapá Previdência em reunião convocada 'por solicitação' do próprio banco, representado
  por Paula Vouguinha, de relações institucionais, e Alberto Félix Oliveira, tesoureiro. A ata recita
  o histórico da instituição, incluindo que passou em 2018 'sob a nova gestão de Daniel Vorcaro e Augusto
  Lima'.
