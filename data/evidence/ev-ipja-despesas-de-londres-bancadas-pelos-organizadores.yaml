id: ev-ipja-despesas-de-londres-bancadas-pelos-organizadores
kind: evidence
classification: D
proposition: 'Ainda em 03/04/2024, o contato ''Marcio Conjur'' encaminha a Vorcaro mensagem de pessoa
  que se apresenta como assistente do diretor-geral da Polícia Federal, confirmando interesse na participação
  no evento de Londres e perguntando se ''algum custo (hospedagem, passagem) é coberto pelos organizadores''.
  ''Marcio Conjur'' responde: ''Todas as despesas bancadas por nós''. Em 10/07/2025, no contexto do segundo
  evento de Londres, funcionária de Vorcaro informa que ''O Andrei PF precisa de um Convite formal para
  aceitar Londres'' e pergunta se o ''Grupo Voto pode mandar dele e demais?''; Vorcaro responde ''Pode''.
  O laudo não registra se as viagens ocorreram nem se as despesas foram efetivamente custeadas.'
