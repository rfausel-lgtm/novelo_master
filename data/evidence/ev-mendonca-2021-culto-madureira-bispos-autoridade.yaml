id: ev-mendonca-2021-culto-madureira-bispos-autoridade
kind: evidence
classification: A
proposition: 'Em culto de 12/09/2021 na Assembleia de Deus de Madureira (RJ), pouco depois de ser indicado
  por Jair Bolsonaro ao STF, André Mendonça declarou: "Os senhores são bispos da Assembleia de Deus, mas,
  para além disso, Deus os constituiu bispos sobre a minha vida. Vocês têm autoridade espiritual sobre a
  minha vida." O deputado Cezinha de Madureira, então líder da Frente Parlamentar Evangélica, estava
  presente. Isso documenta uma relação entre os dois anterior em quase quatro anos ao encontro de
  14/03/2025 com Daniel Vorcaro, que Cezinha também intermediou.'
