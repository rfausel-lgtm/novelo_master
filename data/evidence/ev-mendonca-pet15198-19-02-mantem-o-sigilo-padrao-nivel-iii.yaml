id: ev-mendonca-pet15198-19-02-mantem-o-sigilo-padrao-nivel-iii
kind: evidence
classification: D
proposition: Na decisão de 19/02/2026 na Pet 15.198, o ministro André Mendonça determinou a manutenção do
  nível de sigilo dos autos da Operação Compliance Zero sob sua relatoria, aplicando o sigilo padrão, nível
  III, e concedeu acesso aos autos às autoridades policiais diretamente responsáveis pelas investigações.
