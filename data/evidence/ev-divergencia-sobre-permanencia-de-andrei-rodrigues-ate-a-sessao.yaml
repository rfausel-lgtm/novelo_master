id: ev-divergencia-sobre-permanencia-de-andrei-rodrigues-ate-a-sessao
kind: evidence
classification: C
proposition: 'As coberturas divergem sobre a situação imediata do diretor-geral da Polícia Federal. Parte
  da imprensa afirma que, suspensos os dois atos, ele permanece no cargo até a sessão de 15/09. Outra
  registra que a permanência ficou indefinida: Fachin teria determinado que ele preste informações em
  48 horas, cabendo à Presidência decidir em seguida. As duas versões são incompatíveis quanto ao estado
  atual do comando da corporação, e o acervo as mantém registradas sem escolher entre elas até que se
  leia a íntegra da decisão.'
