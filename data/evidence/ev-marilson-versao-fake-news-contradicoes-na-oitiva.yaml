id: ev-marilson-versao-fake-news-contradicoes-na-oitiva
kind: evidence
classification: D
proposition: 'Em oitiva, Marilson Roseno da Silva afirmou que suas próprias mensagens de voz sobre "A
  Turma" — inclusive as que davam satisfação de serviços ou cobravam pagamento a Daniel Vorcaro — eram
  gravadas a pedido de Luiz Phillipi Mourão e não correspondiam à realidade: chamou as acusações contra
  si de "fake news" e disse que Mourão queria apenas receber dinheiro do banqueiro sem que os serviços
  fossem de fato realizados, mas não apresentou explicação para por que aceitaria gravar, sem receber
  nenhum benefício e sem vínculo de amizade ou trabalho com Mourão, "centenas de áudios" direcionados a
  Daniel Vorcaro. Negou inicialmente ter codinome para se referir a Vorcaro, mas, confrontado com
  mensagens já analisadas em IPJ anterior, admitiu usar o termo "SP" ou "São Paulo". Também afirmou nunca
  ter recebido recompensa financeira de Vorcaro, descrevendo apenas duas diligências pontuais sem
  vínculo — a resolução de uma restrição judicial de veículo e o levantamento do drone —, mas relatou, na
  mesma oitiva, que era prática recorrente, todo fim de ano, receber questionamentos de Vorcaro sobre
  eventual mandado de prisão contra membros da organização — hábito que, por sua própria descrição, se
  repetiu por ao menos dois anos.'
