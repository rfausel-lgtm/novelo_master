notes: A PF qualifica a versão de Marilson como contraditória em si mesma e incompatível com os dados
  telemáticos analisados, sem necessidade de outra fonte para essa conclusão — a própria sequência do
  depoimento (negar vínculo, depois descrever um padrão recorrente de dois anos) é a base da observação.
  Fica registrada como leitura da PF sobre a credibilidade do depoimento, não como fato definitivo sobre
  o que de fato ocorreu.
