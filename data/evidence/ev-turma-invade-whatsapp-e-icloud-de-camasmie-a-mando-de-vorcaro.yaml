proposition: A 'Turma', a mando de Daniel Vorcaro, invadiu os perfis de WhatsApp e Instagram e a conta iCloud do
  empresário Luiz Guilherme Atalla Camasmie, crítico público do Banco Master, entre 17 e 18 de outubro de 2024,
  após Vorcaro determinar 'derrubar esse perfil' e localizar o autor de críticas a ele.
