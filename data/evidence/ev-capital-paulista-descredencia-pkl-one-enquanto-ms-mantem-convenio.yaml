id: ev-capital-paulista-descredencia-pkl-one-enquanto-ms-mantem-convenio
kind: evidence
classification: D
proposition: 'As respostas dos entes públicos divergem de forma acentuada. A capital paulista descredenciou
  a empresa em agosto de 2026 e denunciou o convênio, após rejeitar sua defesa administrativa. O Estado
  de São Paulo apenas suspendeu o código de desconto, sem ato de descredenciamento localizado. Mato Grosso
  do Sul não fez nem uma coisa nem outra: seu convênio segue formalmente vigente até março de 2027, e
  a resolução editada como resposta ao superendividamento ressalva expressamente as renovações. Três posturas
  distintas diante do mesmo fato.'
