id: ev-mendonca-recusa-delacao-seletiva-vorcaro
kind: evidence
classification: C
proposition: Em sessão da Segunda Turma do STF de 16/06/2026, o ministro André Mendonça relatou ter recebido,
  por meio de um advogado de Daniel Vorcaro, proposta de "delação premiada seletiva", que diz ter recusado;
  Gilmar Mendes reagiu dizendo que a situação estava "muito invertida", já que a tratativa deveria ir à
  Polícia Federal ou à PGR, e não ao relator; na mesma semana, PF e PGR rejeitaram uma segunda proposta de
  delação de Vorcaro.
