id: ev-rede-de-49-lojas-explica-presenca-nacional-sem-filiais
kind: evidence
classification: D
proposition: 'A operadora tinha apenas seis estabelecimentos inscritos no cadastro nacional — matriz em
  São Paulo e filiais em Vitória, Curitiba, Campo Grande, Cuiabá e Guarulhos —, o que parecia incompatível
  com a presença declarada em vinte e quatro estados. A captura da página de lojas em janeiro de 2026
  resolve a aparente contradição: havia rede física de 49 unidades distribuídas por vinte e quatro unidades
  da federação, com concentração na Bahia, no Rio de Janeiro e em São Paulo. É uma segunda reconstrução
  geográfica, independente da obtida pelo seletor de convênios, e converge com ela. A capilaridade vinha
  de lojas e correspondentes, não de estrutura societária própria.'
