id: ev-juristas-criticam-legalidade-decisao-dino-pet16669
kind: evidence
classification: A
proposition: 'Quatro advogados/juristas ouvidos pela Gazeta do Povo (09/09/2026) criticaram a técnica
  processual da decisão de Flávio Dino na Pet 16.669/DF: Alessandro Chiarottino (professor de Direito
  Constitucional, USP/USCS) — ''o poder geral de cautela não deveria, por si só, transformar um ministro
  em instância revisora de outro'', defendendo que o caminho institucionalmente mais seguro seria levar
  o conflito ao Plenário; Henrique Quintanilha (advogado, mestre em Direito Público pela UFBA) — ''a decisão
  de Dino representa um abuso de poder'', já que nenhum ministro, nem mesmo o presidente do STF, teria
  competência para desfazer decisão de outro ministro em sentido contrário; Enio Viterbo (advogado) —
  ''Fachin foi, mais uma vez, atropelado. Ele já tinha dado 72h para Mendonça se manifestar e Flávio Dino
  resolveu não esperar isso e atropelar o presidente do STF'', observando que nada impediria que Mendonça
  ''atropelasse'' Dino do mesmo modo; e Katia Magalhães (advogada, especialista em responsabilidade civil)
  — ''isso já coloca Dino numa situação de suspeição inequívoca'', por o próprio ministro afirmar que
  só o Plenário é competente e, ainda assim, decidir monocraticamente, impedindo previamente o exercício
  da jurisdição colegiada. Nenhuma manifestação nominal de juristas de maior projeção nacional (buscados
  nominalmente: Lenio Streck, Pierpaolo Bottini, Gustavo Binenbojm, Ives Gandra Martins, Carlos Ayres
  Britto, Fernando Neves, Conrado Hübner Mendes, Oscar Vilhena, Miguel Reale Júnior, Joaquim Falcão, ex-ministros
  do STF/STJ), nem notas da OAB Federal, do IAB ou da ABJD, foram localizadas sobre este episódio específico
  até a data desta apuração — nem em sentido crítico, nem em defesa da decisão. Ressalva editorial: as
  quatro manifestações vêm de uma única reportagem, de veículo com linha editorial crítica ao STF; apenas
  um dos quatro (Chiarottino) tem credencial declarada de professor de direito constitucional — os outros
  três são advogados sem especialização acadêmica declarada na área. Não constitui, portanto, consenso
  doutrinário estabelecido, mas um primeiro conjunto de manifestações técnicas, unidirecionalmente crítico
  e sem contraponto localizado até o momento.'
