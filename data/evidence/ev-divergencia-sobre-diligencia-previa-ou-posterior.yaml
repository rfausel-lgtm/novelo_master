id: ev-divergencia-sobre-diligencia-previa-ou-posterior
kind: evidence
classification: D
proposition: A ata de 19/07/2024 registra que a divergência no colegiado não era sobre investir ou não,
  mas sobre quando diligenciar. Alexandre Flávio Monteiro e Gláucio Bezerra sustentaram que a diligência
  deveria ser prévia, para afastar o risco reputacional. Jocildo Lemos propôs aprovar condicionando a
  visita posterior e 'sem pedidos de documentos'. José Milton sustentou que a diligência já teria sido
  suprida no credenciamento. Prevaleceu a aprovação com diligência posterior.
