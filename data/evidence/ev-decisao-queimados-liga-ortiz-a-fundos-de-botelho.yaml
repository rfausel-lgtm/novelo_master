id: ev-decisao-queimados-liga-ortiz-a-fundos-de-botelho
kind: evidence
classification: A
proposition: 'Decisão da 3ª Vara Criminal Federal do Rio de Janeiro, do juiz Vitor Barbosa Valpuesta,
  em ação de restituição de dois terrenos em Queimados movida por Agera Negócios Imobiliários e Aquilla
  FII (2016-2023, arquivada em fevereiro de 2023 após decisão desfavorável no STJ), registra: ''Oliver
  é, segundo narrativa dos requerentes, cotista dos fundos proprietários dos bens'', e que ''as pessoas
  jurídicas envolvidas – Agera Negócios Imobiliários ltda., Aquilla Fundo de Investimento Imobiliário-FII
  e Verona Fundo de Investimento Imobiliário – FII são geridas pelas mesmas pessoas, Gustavo Cleto Marsiglia
  e Benjamim Botelho de Almeida''. A decisão também consigna não ser possível ''formar juízo positivo
  quanto à boa-fé nas aquisições''. Sustenta o elo Ortiz–Aquilla–Botelho; não sustenta elo com Daniel
  Vorcaro. O número do processo não foi divulgado e a equipe não leu o inteiro teor.'
