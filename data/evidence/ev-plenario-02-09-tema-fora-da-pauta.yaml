id: ev-plenario-02-09-tema-fora-da-pauta
kind: evidence
classification: C
proposition: 'Na sessão plenária de 02/09/2026 — a primeira após a divulgação das mensagens — o tema não
  constou da pauta formal (trataram-se questões tributárias: imunidade de ITBI para incorporadoras e PIS/Cofins
  sobre rendimentos de aplicações financeiras); nenhum ministro comentou o caso publicamente durante a
  sessão. Moraes e Mendonça, sentados lado a lado por critério de antiguidade, não conversaram, segundo
  a reportagem. Cármen Lúcia participou por videoconferência.'
