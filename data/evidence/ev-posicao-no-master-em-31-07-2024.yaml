proposition: 'O demonstrativo de consolidação de ativos da Amprev com posição em 31/07/2024 registra três
  letras financeiras do Banco Master, todas de prazo de dez anos, somando R$ 401.241.332,00: LF002400IP7
  (R$ 201,1 milhões), LF002400JWQ (R$ 100,14 milhões) e LF002400KDZ (R$ 100 milhões). A carteira total
  da entidade na mesma data era de R$ 7.996.271.682,70, somados o Plano Financeiro (R$ 5,043 bilhões)
  e o Plano Previdenciário (R$ 2,953 bilhões).'
