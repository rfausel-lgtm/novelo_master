id: ev-bc-ja-tinha-termo-de-compromisso-antes-da-reuniao
kind: evidence
classification: A
proposition: 'Cronologia que enquadra a reunião do Planalto: em novembro de 2024 — um mês ANTES do encontro
  —, o Banco Central, ainda sob Roberto Campos Neto, já havia enviado termo de compromisso ao Banco Master,
  assinado por Vorcaro, com prazo de 180 dias para reforço de liquidez, gestão de riscos e reestruturação
  de governança, além de restrições a operações de crédito; o prazo venceria em maio de 2025. A sequência
  posterior é documentada: Galípolo assume a presidência da autarquia em janeiro de 2025; em setembro
  de 2025 a diretoria colegiada barra a compra do Master pelo BRB por falta de documentação sobre viabilidade
  econômico-financeira; e em 18/11/2025 o Banco Central decreta a liquidação extrajudicial. Ou seja, a
  mesma autoridade que esteve na sala em dezembro de 2024 é a que barrou a venda e liquidou o banco. O
  intervalo de doze meses entre o ultimato e a liquidação é o objeto legítimo de escrutínio, e é o que
  o TCU inspeciona — não é, por si, prova de complacência.'
