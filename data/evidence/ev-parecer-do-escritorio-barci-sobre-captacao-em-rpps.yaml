id: ev-parecer-do-escritorio-barci-sobre-captacao-em-rpps
kind: evidence
classification: A
proposition: Em julho de 2024 — o mesmo mês em que a Amapá Previdência aplicou R$ 400 milhões — o Banco
  Master contratou o escritório Barci de Moraes para parecer sobre os riscos da captação de recursos de
  regimes próprios de previdência. Segundo a reportagem, o parecer concluiu que o banco estava apto a
  captar recursos de RPPS, mas alertou para o risco decorrente da responsabilidade objetiva da pessoa
  jurídica por atos contra a administração pública. É registro distinto e posterior ao parecer de outro
  escritório que o banco invocara em março perante o comitê do Amapá.
