excerpt: o preço foi fixado em R$ 10.000.000,00 (...) em 16 de abril de 2026, portanto, o preço integral de R$ 10.000.000,00
  encontrava-se rigorosa e tempestivamente quitado
locator: PET 16.230, peça 175, itens 8 a 14
date: '2025-12-23'
notes: O relato é da própria compradora, em petição que instrui os pagamentos com autenticações e comprovantes;
