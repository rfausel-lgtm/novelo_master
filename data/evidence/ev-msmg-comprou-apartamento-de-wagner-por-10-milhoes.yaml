id: ev-msmg-comprou-apartamento-de-wagner-por-10-milhoes
kind: evidence
classification: D
proposition: Em 23/12/2025, a MSMG Patrimonial celebrou com Jaques Wagner e sua mulher, Maria de Fátima Carneiro
  de Mendonça, compromisso de compra e venda do apartamento nº 1302 do condomínio Mansão Victory Tower, em Salvador,
  por R$ 10 milhões, com sinal de R$ 3,5 milhões e quatro parcelas de R$ 1.625.000. Segundo a própria compradora,
  o preço foi integralmente quitado em 16/04/2026, a escritura pública foi lavrada em 06/05/2026 e o título foi
  apresentado a registro em 10/06/2026.
