date: 2026-08-28
notes: "Classe A, e não C: as duas matérias descrevem a mesma decisão sem declarar apuração própria, e outra
  publicação do mesmo dia (não registrada) parte do mesmo material; republicação não corrobora. A decisão sobe
  de classe se for localizada no portal do STF."
