id: ev-imprensa-2026-08-28-mendonca-cancela-indisponibilidades-23-imoveis-6-ccbs-brb
kind: evidence
classification: A
proposition: Segundo o Times Brasil e o Jurinews, que não declaram apuração própria nem acesso ao texto da
  decisão, o ministro André Mendonça (STF) determinou em 28/08/2026, a pedido do BRB, o cancelamento das
  indisponibilidades que ainda atingiam seis CCBs cedidas pelo Banco Master ao BRB e os 23 imóveis dados em
  garantia, por entender que a restrição não se justificava depois que o banco fora excluído das medidas
  patrimoniais. Segundo o Jurinews, a decisão contrariou parecer do Ministério Público Federal/PGR. É decisão
  cautelar de indisponibilidade, sem juízo de mérito sobre o BRB ou o Master; a decisão e o número do processo
  não foram localizados.
attributed_to: Times Brasil e Jurinews (imprensa)
