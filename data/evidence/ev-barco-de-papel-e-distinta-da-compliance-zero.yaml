id: ev-barco-de-papel-e-distinta-da-compliance-zero
kind: evidence
classification: A
proposition: A Operação Barco de Papel, deflagrada em 23/01/2026 pela 6ª Vara Federal Criminal do Rio
  de Janeiro, é operação distinta da Operação Compliance Zero, cuja 8ª fase — de 26/05/2026, sob relatoria
  de André Mendonça no STF — é descrita pela imprensa como expansão dos achados da Barco de Papel. São,
  portanto, duas operações com autorizações judiciais e datas de deflagração distintas, mas investigativamente
  conectadas.
