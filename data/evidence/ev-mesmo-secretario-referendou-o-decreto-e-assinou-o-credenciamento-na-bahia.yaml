id: ev-mesmo-secretario-referendou-o-decreto-e-assinou-o-credenciamento-na-bahia
kind: evidence
classification: D
proposition: A empresa entrou pela porta que o decreto abrira, três meses depois dele, e o ato de credenciamento
  foi assinado pelo mesmo secretário da Administração que referendara o decreto do Programa Credicesta.
  O contrato que se seguiu, de setembro de 2018, reproduz no objeto a fórmula do art. 3º — produtos e
  serviços 'inclusive comerciais, creditícios, financeiros, securitários e congêneres' — e se fundamenta
  expressamente naquele decreto.
