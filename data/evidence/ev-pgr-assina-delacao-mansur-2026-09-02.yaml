id: ev-pgr-assina-delacao-mansur-2026-09-02
kind: evidence
classification: C
proposition: Em 02/09/2026, a PGR assinou o acordo de colaboração premiada com João Carlos Mansur, fundador
  da Reag — a primeira delação da Operação Compliance Zero. A proposta contempla ao menos 17 temas e prevê
  multa de R$ 40 milhões. O material foi enviado a André Mendonça, relator do caso no STF, que deve marcar
  audiência de voluntariedade antes de decidir pela homologação; a audiência ocorreu em 03/09/2026, conduzida
  por juiz auxiliar do gabinete de Mendonça. Não há decisão de homologação até a data desta atualização.
