id: ev-parana-bloqueou-o-codigo-do-credcesta-antes-de-todos-os-outros-estados
kind: evidence
classification: D
proposition: 'O Paraná foi o primeiro ente estadual a restringir o produto, quase três meses antes da
  suspensão paulista: em 24/11/2025 bloqueou novos lançamentos de descontos vinculados ao código 5420,
  identificado como ''CREDCESTA – PKL ONE''. Dois aspectos merecem registro. A medida não foi publicada
  em diário oficial, tendo circulado apenas como comunicado administrativo — o que é coerente com o fato
  de o índice do diário paranaense conter, em todo o acervo, apenas dois documentos com o nome da empresa.
  E o comunicado hoje só é acessível por captura arquivada, porque a página oficial passou a responder
  que o conteúdo ficaria indisponível em razão da legislação eleitoral.'
