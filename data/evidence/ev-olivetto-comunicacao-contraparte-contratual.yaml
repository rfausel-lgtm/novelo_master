id: ev-olivetto-comunicacao-contraparte-contratual
kind: evidence
classification: A
proposition: 'Segundo reportagem do G1, colacionada na Portaria de instauração do IPL sobre o "Projeto
  DV", "o contrato oferecido ao influenciador tem como partes a Miranda Comunicação, em nome de Thiago
  Miranda, e a empresa Olivetto Comunicação. Miranda seria responsável por encaminhar ao influenciador,
  por meio da Olivetto, ''as matérias, links e orientações do tema a ser tratado, com antecedência
  suficiente para produção e validação''."'
document_ids:
