date: '2026-01-09'
attributed_to: reportagem do G1
notes: Nenhum CNPJ, sócio ou outro dado cadastral da Olivetto Comunicação foi localizado nas fontes
  disponíveis. O papel descrito é de intermediária operacional no fluxo de conteúdo para os influenciadores
  contratados, não de parte financeira — os pagamentos documentados saem da conta de Thiago Miranda.
