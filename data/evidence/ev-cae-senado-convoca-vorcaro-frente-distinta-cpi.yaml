date: '2026-02-19'
notes: Frente até então não mapeada no acervo, que já documentava extensamente a CPI do Crime Organizado
  mas não esta segunda via parlamentar. A decisão original de 19/02/2026 (e-Doc. 323) — antes uma lacuna
  explícita — foi localizada e lida, e autoriza o convite da CAE, mas condiciona o comparecimento à
  manifestação prévia e voluntária do próprio investigado, sob o direito à não autoincriminação.
