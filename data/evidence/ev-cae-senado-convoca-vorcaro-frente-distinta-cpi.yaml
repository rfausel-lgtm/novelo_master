notes: Frente até então não mapeada no acervo, que já documentava extensamente a CPI do Crime Organizado
  mas não esta segunda via parlamentar. A decisão de 19/02/2026 (e-Doc. 323), que autorizou a apresentação
  pela primeira vez, não foi localizada nem lida — pista para leitura futura.
