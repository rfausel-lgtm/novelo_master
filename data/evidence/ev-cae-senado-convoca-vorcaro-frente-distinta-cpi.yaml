id: ev-cae-senado-convoca-vorcaro-frente-distinta-cpi
kind: evidence
classification: D
proposition: A Comissão de Assuntos Econômicos do Senado Federal, sob a presidência de Renan Calheiros,
  pediu e obteve do STF autorização para colher depoimento de Daniel Vorcaro — frente institucional
  distinta e paralela à CPI do Crime Organizado, inicialmente autorizada para 24/02/2026, sob a condição
  de adesão voluntária e expressa do próprio Vorcaro, e depois estendida para 10/03/2026.
