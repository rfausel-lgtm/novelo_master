id: ev-folha-obtida-sem-licitacao-propria
kind: evidence
classification: C
proposition: 'O direito de operar o consignado de cerca de 280 mil servidores, aposentados e pensionistas
  baianos nunca foi objeto de licitação, chamamento público ou credenciamento próprio: veio como ativo
  embutido no lote de privatização da Empresa Baiana de Alimentos e só depois foi convertido em plataforma
  financeira por decreto. O leilão fracassou em 27/01/2016 e em março de 2018, ambos com lance mínimo
  de R$ 81 milhões; na terceira tentativa, em 11/04/2018, a estatal foi arrematada por R$ 15 milhões,
  com 49 lojas da Cesta do Povo, por concorrente único. As dívidas da EBAL permaneceram com o Estado:
  segundo o Poder360, R$ 93 milhões foram pagos pelo erário entre 2019 e 2026 — 6,2 vezes o preço de venda.
  Atribui-se ao edital ou ao contrato uma cláusula de exclusividade de quinze anos, até 2033, mas a equipe
  não obteve o edital nem o contrato, e os decretos lidos não contêm a palavra ''exclusividade'' — o ponto
  fica como alegação atribuída.'
