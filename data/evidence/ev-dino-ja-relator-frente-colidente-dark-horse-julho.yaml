id: ev-dino-ja-relator-frente-colidente-dark-horse-julho
kind: evidence
classification: A
proposition: Análise da CNN Brasil de 02/07/2026 — mais de dois meses antes do episódio de reintegração
  de Andrei Rodrigues — já identificava que Flávio Dino (relator da frente sobre emendas parlamentares
  ligadas ao filme 'Dark Horse') e André Mendonça (relator da frente sobre o destino dos recursos de Daniel
  Vorcaro no mesmo caso) tinham jurisdições com potencial de colisão. A publicação anterior ao episódio
  reduz o risco de que a leitura seja mera racionalização retrospectiva do desfecho de 09/09/2026. Reportado
  por fonte única até o momento; tratado como classe A até corroboração por segunda fonte independente.
