id: ev-estatal-municipal-de-transito-de-juazeiro-tambem-firmou-com-a-operadora
kind: evidence
classification: D
proposition: A operação não parou na administração direta. Em Juazeiro, a companhia estatal municipal
  de segurança, trânsito e transporte firmou com a operadora, em 08/06/2021, termo de cooperação técnica
  não onerosa para consignações do cartão, com vigência de sessenta meses, publicado no diário municipal.
  É o equivalente municipal do que se observou em São Paulo, onde a operação se estendeu ao serviço funerário
  e ao hospital do servidor.
