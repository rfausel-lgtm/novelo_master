id: ev-tjms-condena-pkl-one-e-master-solidariamente-rejeita-mera-licenciadora
kind: evidence
classification: D
proposition: 'O primeiro grau sul-mato-grossense vem rejeitando a separação que a defesa sustenta entre
  a operadora e o banco. A tese apresentada é a de que o contrato foi firmado exclusivamente com o Banco
  Master, sendo a PKL One ''mera licenciadora de direitos de exploração do programa CREDCESTA''. Os juízos
  a afastam por dois caminhos: os descontos na folha são lançados em nome da própria PKL One, e o nome
  fantasia ''Credcesta'' figura no cartão entregue ao servidor, o que atrai a solidariedade do Código
  de Defesa do Consumidor e a teoria da aparência. Em Corumbá, as duas foram condenadas solidariamente
  a limitar os descontos a 5% da remuneração bruta consignável.'
