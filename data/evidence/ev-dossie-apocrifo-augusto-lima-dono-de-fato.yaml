id: ev-dossie-apocrifo-augusto-lima-dono-de-fato
kind: evidence
classification: I
proposition: 'Documento de uma página, apócrifo e de autoria não confirmada, foi encontrado pela PF em
  arquivo digital de Daniel Vorcaro (foto de 2022 armazenada em e-mail dele). O texto descreve Augusto
  Lima como ''dono e presidente de fato'' do Banco Master e o próprio Vorcaro como ''laranja'', com a
  frase: ''O lucro do banco vai para a própria empresa do pastinha Augusto Lima que fica com tudo.'' A
  Polícia Federal não confirmou autoria nem veracidade do documento até a publicação da matéria; trata-se
  de material sob investigação, não de conclusão da PF. A defesa de Augusto Lima não se manifestou sobre
  o dossiê quando procurada pela reportagem.'
