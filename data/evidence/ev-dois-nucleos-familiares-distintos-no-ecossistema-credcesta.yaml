id: ev-dois-nucleos-familiares-distintos-no-ecossistema-credcesta
kind: evidence
classification: I
proposition: 'Observa-se, no ecossistema Ebal/CredCesta/PKL One/Master, a presença de dois núcleos de
  sobrenome repetido em posições societárias-chave: o núcleo Kruschewsky (Eugênio de Souza Kruschewsky
  e André Kruschewsky Lima, no escritório de advocacia contratado pelo Master; e Luia Kruschewsky Monteiro,
  diretora estatutária da própria Ebal desde 2018 — grau de parentesco entre eles não verificado) e o
  núcleo Lima Novaes/Pithon (Andréa Lima Novaes e Ana Paula de Almeida Pithon, sócias recorrentes em ao
  menos três empresas do entorno do CredCesta). A existência de vínculos familiares não implica, por si
  só, irregularidade — o achado é registrado como padrão observado, não como conclusão de ilicitude.'
document_ids: []
source_ids: []
inference_basis: Convergência de sobrenomes repetidos em registros societários oficiais de múltiplas empresas
  do mesmo ecossistema, confirmados individualmente por CNPJ, sem que nenhuma fonte estabeleça grau de
  parentesco preciso ou qualquer conduta irregular decorrente disso.
