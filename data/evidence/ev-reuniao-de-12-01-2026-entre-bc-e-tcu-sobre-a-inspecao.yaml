proposition: Em 12/01/2026 o presidente do Banco Central, Gabriel Galípolo, reuniu-se com o presidente do TCU,
  Vital do Rêgo, e com o relator Jhonatan de Jesus; segundo CNN Brasil e Agência Brasil, o encontro levou a
  entendimento para que a inspeção fosse feita pelos técnicos da AudBancos, com respeito ao sigilo bancário,
  e, segundo a Agência Brasil, restrita à documentação que embasou a liquidação.
