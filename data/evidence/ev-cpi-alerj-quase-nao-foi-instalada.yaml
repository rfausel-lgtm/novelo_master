id: ev-cpi-alerj-quase-nao-foi-instalada
kind: evidence
classification: C
proposition: A CPI do Banco Master na Assembleia Legislativa do Rio de Janeiro quase não saiu do papel.
  Aprovada em 12/05/2026 com instalação automática prevista em 48 horas, não foi publicada no Diário Oficial
  dentro do prazo pela Mesa Diretora. O deputado Flávio Serafini, autor do requerimento, impetrou mandado
  de segurança no TJRJ; em 25/05/2026 o desembargador Cherubin Helcias Schwartz Junior negou a liminar,
  sob o fundamento de que era preciso ouvir a Alerj sobre a existência de sete CPIs pendentes desde 2023.
  No dia seguinte, a Alerj instalou quatro outras CPIs — nenhuma delas a do Master. Um segundo requerimento,
  do deputado Anderson Moraes, com mais de 30 assinaturas, foi apresentado em 27/05/2026, e a comissão
  efetivamente passou a funcionar entre o fim de maio e o início de junho, chegando a pelo menos sete
  reuniões até 09/06/2026.
