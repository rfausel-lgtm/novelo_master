id: ev-pf-designou-palazzo-para-o-caso-master-em-dezembro-2025
kind: evidence
classification: D
proposition: Em 18/12/2025, cumprindo decisão da Reclamação 88.121, o diretor-geral da Polícia Federal, Andrei
  Rodrigues, designou a delegada Janaina Pereira Lima Palazzo, chefe da Delegacia de Inquéritos Especiais no DF,
  para dar continuidade às investigações do caso Master sob supervisão do STF.
