notes: A decisão de 15/12/2025 na mesma reclamação previa oitivas por delegado designado pelo diretor-geral da PF
  (ver ev-rcl88121-marco-fundador-supervisao-stf); este ofício é o cumprimento. Oito meses depois, em agosto de
  2026, ela seguia como a autoridade policial destinatária de comunicações do INQ 5.026.
