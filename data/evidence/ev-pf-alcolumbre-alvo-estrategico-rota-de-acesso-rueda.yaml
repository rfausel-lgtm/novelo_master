date: '2026-09-03'
notes: 'O próprio relatório, segundo a reportagem, qualifica a hipótese como de inteligência, não como fato
  comprovado — não há, até esta coleta, qualquer ato concreto (investigação aberta, cautelar, oitiva) contra
  Rueda ou Alcolumbre que a PF ou o STF atribuam a esse motivo específico. Esta é uma hipótese formulada
  pela PRÓPRIA PF sobre a conduta de Mendonça — direção causal distinta e não confirmada por nenhuma fonte
  da hipótese editorial já registrada em open_questions de davi-alcolumbre.yaml (que especulava a via inversa:
  Alcolumbre blindando Moraes por causa do esquema de comissões atribuído a Rueda/ACM Neto). As duas hipóteses
  compartilham os mesmos três nomes (Mendonça, Rueda, Alcolumbre) mas atribuem motivação e direção causal
  opostas; nenhuma delas está estabelecida como fato.'
