id: ev-pf-alcolumbre-alvo-estrategico-rota-de-acesso-rueda
kind: evidence
classification: A
proposition: 'O relatório de inteligência da PF que fundamenta a decisão de Moraes de 03/09/2026 contra
  Mendonça dedica uma seção a "Alcolumbre como ''alvo estratégico''": descreve o presidente do Senado como
  "provável alvo estratégico, considerada sua força política, o favoritismo para manter-se na presidência
  do Senado Federal e o consequente controle da pauta daquela Casa, notadamente quanto ao processamento
  de pedidos de impeachment de ministros do Supremo Tribunal Federal". O documento levanta a hipótese de
  que Mendonça poderia ver no presidente do União Brasil, Antônio Rueda, uma "rota de acesso" a Alcolumbre,
  e relaciona a suspeita à "resistência de Alcolumbre à indicação de Mendonça ao STF durante o governo de
  Jair Bolsonaro", descrevendo-o como "grande empecilho" àquela indicação. NOVO (13/09/2026): o mesmo
  relatório liga esse suposto interesse a um motivo mais amplo — considera "provável" que os movimentos de
  Mendonça integrem estratégia para "ampliar seu poder no Supremo Tribunal Federal" "considerando o aumento
  das chances de que uma anistia ampla dos crimes cometidos no contexto da recente tentativa de golpe de
  Estado acabe sendo avalizada no Tribunal".'
