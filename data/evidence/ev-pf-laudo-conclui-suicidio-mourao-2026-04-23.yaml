id: ev-pf-laudo-conclui-suicidio-mourao-2026-04-23
kind: evidence
classification: A
proposition: Em 23/04/2026, o superintendente da PF em Minas Gerais, delegado Richard Murad Macedo, entregou
  pessoalmente ao ministro André Mendonça (relator) laudo concluindo que a morte de Luiz Phillipi Mourão
  sob custódia, em 04/03/2026, foi causada por suicídio. A investigação examinou as gravações de todo
  o período sob custódia, ouviu testemunhas, analisou comunicações e investigou a possibilidade de Mourão
  ter agido sob efeito de substâncias psicotrópicas. Segundo a PF, nenhum veículo de imprensa teve acesso
  a qualquer um dos cinco relatórios então solicitados. A reportagem não registra resposta da família
  — que, dez dias antes, afirmara não ter tido acesso a imagens, autos nem laudo do IML — à conclusão
  de suicídio.
