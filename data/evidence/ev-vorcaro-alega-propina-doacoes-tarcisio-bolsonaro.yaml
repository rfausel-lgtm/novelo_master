proposition: 'Em proposta de delação premiada apresentada em depoimento de 27/08/2026 na Papuda e rejeitada
  pela terceira vez pela PF e pela PGR — por ''ausência de fatos novos'' —, Vorcaro alegou que R$ 5 milhões
  doados em 2022 pelo cunhado Fabiano Zettel às campanhas de Tarcísio de Freitas (R$ 2 milhões) e Jair
  Bolsonaro (R$ 3 milhões) constituíam ''contrapartidas financeiras'' de um ''ajuste indevido com Gilberto
  Kassab'' para manter o Credcesta em vigor no governo de São Paulo. Kassab negou: ''Refuto com veemência''
  e ''Nunca tratei de doações com Augusto Lima ou Daniel Vorcaro''. A equipe de Tarcísio afirmou que a
  campanha teve mais de 600 doadores e seguiu a legislação eleitoral. A alegação foi formalmente descartada
  pelos investigadores até a data desta atualização.'
