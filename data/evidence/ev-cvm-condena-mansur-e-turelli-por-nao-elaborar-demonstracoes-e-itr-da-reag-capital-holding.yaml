notes: D demonstra o conteúdo do voto e da nota, e nada além da omissão sancionada. É infração formal de
  dever de informação, em primeira instância administrativa e recorrível; o voto e a nota não imputam ato
  intencional nem ligam a condenação ao Banco Master. A ata ou o acórdão do Colegiado não foram lidos além da
  nota.
