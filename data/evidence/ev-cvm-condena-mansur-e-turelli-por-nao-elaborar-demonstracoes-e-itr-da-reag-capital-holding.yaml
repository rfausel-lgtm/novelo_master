id: ev-cvm-condena-mansur-e-turelli-por-nao-elaborar-demonstracoes-e-itr-da-reag-capital-holding
kind: evidence
classification: D
proposition: Em sessão de 29/09/2026, o Colegiado da CVM decidiu, por unanimidade e acompanhando o voto da
  diretora Marina Copola, condenar João Carlos Mansur e Rodolfo Turelli, diretor presidente e diretor
  financeiro da REAG Capital Holding S.A., à multa individual de R$ 170.000,00, pela não elaboração das
  demonstrações financeiras de 2024 (art. 176, caput, da Lei 6.404/1976) e dos ITR do 1º e 2º trimestres de
  2025 (art. 31, II, da Resolução CVM 80), com possibilidade de recurso, com efeito suspensivo, ao CRSFN.
