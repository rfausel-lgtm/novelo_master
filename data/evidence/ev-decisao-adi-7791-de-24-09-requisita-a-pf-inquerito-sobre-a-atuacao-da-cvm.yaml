id: ev-decisao-adi-7791-de-24-09-requisita-a-pf-inquerito-sobre-a-atuacao-da-cvm
kind: evidence
classification: D
proposition: Em decisão de 24/09/2026 na ADI 7.791, o relator, Flávio Dino, requisitou à Polícia Federal a
  instauração de inquérito policial "para apuração dos fatos descritos nesta decisão", entre eles "as
  circunstâncias que conduziram ao arquivamento do Processo SEI nº 19957.001206/2022-08", "a eventual
  interferência indevida na atuação da CVM" (expressão da decisão) nos anos de 2021 e 2022 e "a possível
  ocorrência de vazamento ou ocultação de informações relevantes por agentes da CVM"; determinou à CVM que
  enviasse em 72 horas cópia integral desse processo e informasse unidades com acesso, agentes responsáveis
  pela análise e pelo arquivamento, regime de sigilo, compartilhamento e providências posteriores; e deu
  ciência à PGR. A decisão registra que, segundo o relatório do grupo de trabalho da CVM, o expediente aberto
  a partir de comunicação do FGC em 18/02/2022 foi classificado como "denúncia anônima desprovida de elementos
  suficientes para justificar o prosseguimento da apuração" e arquivado, e que "A qualificação jurídica dos
  fatos, a identificação dos possíveis autores e a definição da competência jurisdicional deverão ser
  reavaliadas à medida que as diligências produzam novos elementos".
