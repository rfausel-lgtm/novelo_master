  ABC. Ressalva: cópia hospedada pelo Poder360; o código de autenticidade não foi conferido no portal do STF.
  Conferência independente do editor-master (21/10/2026): o PDF baixado de novo tem o mesmo sha256; as nove
  páginas renderizadas trazem o rodapé de assinatura digital com o mesmo código e o texto do cabeçalho, das
  seções I e III e do dispositivo (i)-(iv) confere com a transcrição do cache. Os metadados indicam arquivo
  regravado em 24/09/2026 (macOS Quartz), o que explica a camada de texto ilegível.
  Decisão que manda investigar não é condenação nem prova de ilícito; a decisão não nomeia investigados. As
  expressões entre aspas são da decisão.'
