excerpt: (iii) DETERMINAR à Comissão de Valores Mobiliários que encaminhe a este Relator no Supremo Tribunal
  Federal, no prazo improrrogável de 72 (setenta e duas) horas, cópia integral do Processo SEI nº
  19957.001206/2022-08
date: 2026-09-24
locator: Seções I e III e dispositivo (p. 2-4, 7-9)
notes: 'Classe D: decisão judicial com "Publique-se", lida integralmente, sem marca de sigilo, e cujo teor
  coincide com o relatado por Poder360, Congresso em Foco e Diário do Grande ABC. Conferência em 23/10/2026: o
  portal do STF serve a peça (downloadPeca id 15390694465) com texto legível (pdftotext, 24.321 caracteres);
  o rodapé traz o código 7945-FE6E-EABB-E40B, o mesmo da cópia do Poder360, o fecho traz "Brasília, 24 de setembro
  de 2026" e o dispositivo (i)-(iv) coincide com a transcrição feita em 21/10/2026; os andamentos da ADI 7791 no
  portal registram a decisão monocrática de 24/09/2026 (convertido em diligência, Min. Flávio Dino). Com isso
  sai a ressalva anterior (cópia de veículo com código não conferido). O formulário de autenticidade por código não
  foi usado. Conferência anterior do editor-master (21/10/2026), sobre a cópia do Poder360: as nove páginas
  renderizadas traziam o mesmo código, e o arquivo tinha camada de texto ilegível (metadados indicam arquivo
  regravado em 24/09/2026), problema que a peça do portal não tem.
  Decisão que manda investigar não é condenação nem prova de ilícito; a decisão não nomeia investigados. As
  expressões entre aspas são da decisão.'
