notes: >-
  Relatório não localizado como documento: a Pet, a data (a IstoÉ diz que foi produzido em abril de 2026) e
  um PDF não constam das fontes. Todas as reportagens descrevem o mesmo documento, por isso a classe é A, e
  não C. A identificação de "Ciro" e "Hugo" é leitura da PF; a mensagem não traz sobrenomes. Para Motta, a
  declaração dele de 16 e 17/06/2026 (ev-hugo-motta-afirma-que-viajou-no-jato-de-vorcaro-e-teve-duas-diarias-pagas)
  admite parte da hospedagem (diz ter tido duas diárias pagas); para Ciro, não há manifestação específica localizada. Nenhuma mensagem é
  transcrita pelo Novelo.
