id: ev-pf-hospedagem-em-lisboa-em-06-2024-segundo-a-imprensa
kind: evidence
classification: A
proposition: >-
  Segundo a CNN Brasil, o Poder360, a IstoÉ, o Metrópoles e a Agência O Globo (16/06/2026), relatório da PF
  cujo sigilo foi levantado em 16/06/2026 registra que, em 18/06/2024, Daniel Vorcaro pediu a "Leo Serrano"
  reservas no hotel Four Seasons, em Lisboa, para si e para "Ciro" e "Hugo"; que uma fatura do hotel registra
  cinco diárias e 3.155,71 euros, associada pela PF a duas suítes júnior; e que a PF identifica "Ciro" e
  "Hugo" como o senador Ciro Nogueira e o deputado Hugo Motta a partir das mensagens, da lista de nomes
  enviada por Vorcaro e da fatura.
attributed_to_id: policia-federal
