id: ev-favores-paulo-sergio-a-vorcaro
kind: evidence
classification: A
proposition: Segundo apuração da PF citada pela imprensa, Paulo Sérgio Neves de Souza revisava documentos
  do Banco Master antes do envio ao Banco Central, alertava Vorcaro sobre achados do sistema de monitoramento
  do BC e orientava sobre postura e argumentos para reuniões com a diretoria do órgão; teria ainda compartilhado
  a própria notificação de nomeação como prova de credenciais. Em contrapartida, teria recebido contrato
  fictício com a Varajo Consultoria Empresarial e uma viagem à Disney/Universal em Orlando, coordenada
  por Vorcaro. Em depoimento de 28/08/2026, o próprio Vorcaro confirmou a viagem, atribuindo-a à empresa
  de concierge SL Consulting (representada por Léo Serrano) e classificando-a como cortesia pessoal ('agrado'),
  não como contrapartida por serviços prestados; negou que Paulo Sérgio tivesse 'trabalhado' para ele.
