id: ev-plano-simulacao-de-assalto-contra-jornalista
kind: evidence
classification: D
proposition: Segundo a representação da PF de 27/02/2026, houve plano para simular um assalto contra o
  colunista Lauro Jardim, com o objetivo de intimidá-lo e silenciar sua cobertura sobre o Banco Master.
  Em 08/06/2025, Vorcaro reagiu a uma matéria dele com 'Tinha que colocar gente seguindo esse cara. Pra
  pegar tudo dele', ao que Mourão respondeu 'Vou fazer isto'. Em 28/07/2025, Vorcaro escreveu 'Esse lauro
  quero mandar dar um pau nele. Quebrar todos os dentes. Num assalto', com aval de Mourão ('Pode? Vou
  olhar isso' / 'Sim').
