proposition: Em 28/11/2025 a desembargadora Solange Salgado (TRF-1) substituiu a prisão preventiva de
  Vorcaro por medidas cautelares, estendendo a decisão a Augusto Ferreira Lima, Luiz Antonio Bull, Alberto
  Félix de Oliveira e Angelo Antonio Ribeiro da Silva.
