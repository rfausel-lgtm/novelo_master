notes: 'Atualizado em 12/09/2026 (lote 231): corroborado por fonte oficial, além da imprensa. A
  manifestação da PGR de 05/01/2026 cita o mesmo HC (1045014-48.2025.4.01.0000) como razão para excluir
  o pedido de prisão preventiva de Vorcaro na PET 15.198 — confirmando, por documento processual distinto
