id: ev-dalide-entrou-na-agropecuaria-monte-siao-em-2022-nao-consta-mais
kind: evidence
classification: D
proposition: 'Dalide Barbosa Alves Corrêa entrou no quadro societário da Agropecuária Monte Sião Ltda. em 16/08/2022,
  três semanas depois de registrada como suplente de senadora. O cadastro vigente da Receita Federal, consultado
  por esta sessão em 17/09/2026, não a inclui: o único nome no quadro é Vilma Magalhães e Silva, sócia-administradora
  desde a abertura da empresa.'
