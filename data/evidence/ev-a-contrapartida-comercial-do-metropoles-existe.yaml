id: ev-a-contrapartida-comercial-do-metropoles-existe
kind: evidence
classification: C
proposition: 'A contrapartida dos pagamentos existe e é lícita: o Will Bank, do grupo Master, comprou
  os naming rights da Série D de 2025 do Campeonato Brasileiro, em negociação conduzida pelo Metrópoles.
  A CBF confirmou que o veículo negociou o patrocínio de forma independente e que o contrato foi encerrado
  em 2025. Publicidade e patrocínio esportivo são atividade comercial regular, e o volume por si só não
  constitui indício de irregularidade.'
