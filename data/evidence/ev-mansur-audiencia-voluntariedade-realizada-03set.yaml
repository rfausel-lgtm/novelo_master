proposition: A audiência de voluntariedade da colaboração premiada de João Carlos Mansur foi realizada
  no início da tarde de 03/09/2026, conduzida por juiz auxiliar do gabinete de André Mendonça — relator
  do caso Master, a quem cabe analisar os 17 anexos entregues pela defesa e decidir sobre a homologação.
  Até a data desta atualização, não há decisão de homologação confirmada. A multa prevista, R$ 40 milhões,
  corresponde, segundo a imprensa, ao valor que Mansur teria recebido da Reag enquanto a comandava.
