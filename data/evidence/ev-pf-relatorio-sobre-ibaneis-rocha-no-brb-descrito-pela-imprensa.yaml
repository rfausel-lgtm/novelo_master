date: '2026-10-09'
notes: >-
  Mantida em A mesmo com dois veículos de apuração própria: a descrição é do mesmo documento sigiloso e o
  número da PET, o ministro que levantou o sigilo e a data do relatório não constam das fontes lidas. Não se
  usa a expressão "interferência direta" da manchete do Metrópoles (o corpo da matéria atribui ao relatório a
  formulação "interferência política direta na condução da instituição financeira pública"; por cautela, ela
  não é usada como proposição), nem
  "R$ 294 mi" (fonte única, Brasil de Fato), nem a data "25/10/2024" (nenhuma fonte dá o dia).
