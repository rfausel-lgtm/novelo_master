proposition: Em 09/09/2026, Eduardo Mendonça Sodré Martins pediu a liberação de verbas de natureza alimentar invocando
  o art. 580 do Código de Processo Penal e a identidade de circunstâncias com a decisão que desbloqueou os proventos
  do Senado de Jaques Wagner. Até 17/09/2026 o pedido não teve sequer vista à PGR.
