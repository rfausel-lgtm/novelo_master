id: ev-liquidante-mira-4-8-bilhoes-bens-vorcaro
kind: evidence
classification: C
proposition: O liquidante do Banco Master mira pelo menos R$ 4,8 bilhões em bens e fundos ligados a Daniel
  Vorcaro — 19 imóveis, 13 empresas e 3 fundos de investimento, incluindo mansão em Brasília (R$ 36 milhões),
  cobertura no Jardim Paulista (R$ 30 milhões), mansão em Orlando (R$ 180 milhões), o hotel Botanique
  em Campos do Jordão (R$ 150 milhões) e um jato Gulfstream G700 (cerca de US$ 80 milhões). O juiz Adler
  Batista Oliveira Nobre deferiu a indisponibilidade desses bens em 17/03/2026, por indícios de desvio
  anterior à liquidação. A Justiça posteriormente travou parte da venda desses ativos, também por indícios
  de desvios no próprio processo de venda — o que pode atrasar a recuperação de valor para a massa credora.
  Não há dado consolidado de quanto já foi efetivamente convertido em caixa até a data desta atualização.
