id: ev-armadilha-de-homonimia-do-apelido-careca
kind: evidence
classification: D
proposition: Armadilha de homonímia que produz falso positivo em busca textual e precisa ficar registrada.
  No relatório da Polícia Federal sobre o celular de Vorcaro, o apelido 'o Careca' aparece seis vezes
  e a própria PF o identifica como Alexandre de Moraes — a legenda da Figura 33 descreve o diálogo como
  'conversa entre Fábio Faria e Daniel Vorcaro sobre jantar com Alexandre de Moraes'. No caso do INSS,
  'Careca do INSS' é apelido de Antônio Carlos Camilo Antunes, pessoa inteiramente distinta e de outro
  processo. Qualquer cruzamento textual entre os dois casos pelo termo produz vínculo inexistente.
