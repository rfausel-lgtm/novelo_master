id: ev-defesa-vorcaro-2026-10-26-laudo-preliminar-aponta-lacunas-de-custodia
kind: evidence
classification: D
proposition: A análise preliminar do assistente técnico da defesa de Vorcaro, entregue em 26/10/2026, afirma
  que o material recebido, sem os arquivos brutos da coleta, não permite verificar a integridade e a
  integralidade da extração do iPhone, que o laudo da PF não informa a versão do GrayKey, que o termo de
  apreensão não descreve identificação dos aparelhos nem lacres, e que há 657 arquivos com modificação em
  18/11/2025 e 999 até 14/05/2026, posteriores à apreensão; no mesmo documento, o perito escreve que não é
  tecnicamente possível atribuir essas alterações a uma ação humana deliberada e que suas conclusões “se restringem à matéria técnica e não implicam” juízo sobre autoria. É alegação da defesa, não perícia oficial.
