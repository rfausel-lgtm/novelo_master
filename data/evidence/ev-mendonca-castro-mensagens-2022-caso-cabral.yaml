id: ev-mendonca-castro-mensagens-2022-caso-cabral
kind: evidence
classification: A
proposition: 'Em 2022, o então governador do Rio de Janeiro, Cláudio Castro, escreveu a André Mendonça —
  "Amigo, preciso falar" — mencionando o "caso Cabral" (ex-governador Sérgio Cabral) e encaminhando arquivos
  sobre pedidos de habeas corpus. Mendonça respondeu que ligaria em alguns minutos; dias depois, votou pela
  soltura de Sérgio Cabral. Mendonça é hoje o relator do caso RioPrevidência/Banco Master, no qual Castro é
  investigado, e indeferiu em julho de 2026 um pedido de nova busca e apreensão contra Castro, mesmo com
  parecer favorável do PGR.'
