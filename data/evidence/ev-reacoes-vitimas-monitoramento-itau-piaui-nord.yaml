id: ev-reacoes-vitimas-monitoramento-itau-piaui-nord
kind: evidence
classification: C
proposition: 'Reações das pessoas e instituições alvo do monitoramento atribuído a Thiago Miranda, registradas
  para contraditório e para dimensionar o alcance. Milton Maluhy Filho, CEO do Itaú Unibanco, alvo de
  levantamento que a PF atribui a Miranda: procurado, o banco informou que não iria comentar, e não foi localizada
  manifestação posterior. Consuelo Dieguez, da revista piauí: recusou retirar o texto e orientou o envio
  de carta à revista, segundo a decisão; confirmação ou nota da revista sobre o episódio não foi
  localizada. Renato Breia, da Nord Investimentos, foi o único que atendeu ao pedido: havia
  publicado, em outubro de 2024, recomendação para que clientes não investissem no CDB do Master e,
  segundo a decisão citada pela CNN Brasil e pelo Brasil de Fato, retirou o conteúdo, manifestando
  contrariedade com a abordagem. Em nota reproduzida pelo Brasil de Fato (10/07/2026), a Nord e Breia
  confirmaram o contato e disseram que ele está à disposição das autoridades. No caso da jornalista Malu Gaspar, O Globo repudiou em
  nota a devassa, e Abraji e ANJ publicaram notas em 02/07/2026 (a da Abraji trata de ataques on-line contra
  ela) — a ANJ classificou a conduta como ''métodos mafiosos''.'
