id: ev-karina-gama-registra-ata-notarial-sobre-pressao-para-delatar-flavio
kind: evidence
classification: C
proposition: Karina Ferreira da Gama registrou em cartório uma ata notarial relatando ter sido pressionada por pessoas
  ligadas ao governo Lula a prestar depoimento incriminando o senador Flávio Bolsonaro, sob a insinuação de que
  seria presa caso não o fizesse — documento encontrado e apreendido pela Polícia Federal durante a Operação Make
  Up, em 10/09/2026.
