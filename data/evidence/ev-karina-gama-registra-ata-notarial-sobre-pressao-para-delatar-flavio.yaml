notes: A ata notarial em si não está disponível ao corpus, apenas o relato da imprensa sobre seu conteúdo e a apreensão
  pela PF; a reportagem da ND+ é a única a descrever o documento diretamente, enquanto a do Brasil 247 corrobora
  o mesmo episódio de pressão a partir da fala direta de Karina Gama à imprensa, sem citar a ata nominalmente.
