id: ev-distribuicao-das-mencoes-a-moraes-no-relatorio
kind: evidence
classification: D
proposition: 'Classificadas uma a uma, por contexto, as 109 ocorrências de ''Moraes'' no relatório da
  PF dividem-se em 51 referentes a Alexandre de Moraes ou ao contato salvo como ''Alexandre de Moraes
  BRASILIA'' e 58 referentes a Viviane Barci de Moraes e ao escritório. Não há terceiro homônimo nem citação
  processual neutra. A distribuição estrutural, porém, é bem menos equilibrada que a contagem bruta: a
  Seção 5, que ocupa 190 das 218 páginas, chama-se ''Da análise do destinatário das notas'', e apenas
  cerca de 31 dessas páginas tratam dos contratos e pagamentos do escritório. O documento é, na sua arquitetura,
  dedicado ao destinatário identificado — não à razão social.'
