id: ev-atestado-do-rioprevidencia-nao-tem-texto-promocional
kind: evidence
classification: D
proposition: Ao contrário do termo de credenciamento localizado na Alagoas Previdência, o atestado de
  credenciamento do Banco Master no Rioprevidência é sucinto — uma página — e não contém o texto promocional
  copiado do próprio banco. É um documento administrativo padronizado, sem a prosa institucional que caracterizou
  os casos de Alagoas, Amapá, Itaguaí, Aparecida de Goiânia e Congonhas. Não foi localizado dossiê mais
  completo, submetido pelo banco, distinto deste atestado.
