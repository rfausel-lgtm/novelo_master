date: '2026-03-04'
notes: Complementa, com nome, matrícula e local exatos, a evidência já registrada sobre a apreensão do
  veículo e seu conteúdo (ev-david-alves-fuga-com-equipamentos-04-03-2026) — que já tinha o essencial do
  depoimento do policial (então não identificado) mas não a matrícula nem o motivo formal da parada. A
  qualificação da abordagem como decorrente de irregularidade administrativa, e não de suspeita
  criminal, é o ponto que a defesa explora para contestar a tese de fuga; o corpus registra o fato sem
  adotar a conclusão de nenhuma das partes.
