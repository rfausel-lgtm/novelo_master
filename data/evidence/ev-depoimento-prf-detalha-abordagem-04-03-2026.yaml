id: ev-depoimento-prf-detalha-abordagem-04-03-2026
kind: evidence
classification: D
proposition: 'A defesa de Katherine Venâncio Telles transcreveu o depoimento do policial rodoviário
  federal que abordou o veículo Range Rover conduzido por David Henrique Alves na noite de 04/03/2026 —
  Vinicius Martins Alves, matrícula 3263.361 — precisando o local (BR-381, Km 871, próximo a Pouso
  Alegre/MG) e o motivo formal da abordagem: irregularidade administrativa (licenciamento vencido de
  2024), não suspeita de crime. O policial confirmou que o veículo trafegava em velocidade incompatível
  com a via, que os ocupantes eram David (condutor) e Katherine (passageira), que havia no carro "um
  computador grande de mesa, dois ou três notebooks, caixas e malas", e que ambos disseram estar indo
  passar alguns dias na casa de parentes.'
document_ids:
