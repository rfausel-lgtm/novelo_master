id: ev-estoque-de-letras-financeiras-do-master
kind: evidence
classification: D
proposition: 'O estoque de letras financeiras do Banco Master saiu de inexistente para R$ 2,11 bilhões
  em dois anos. A rubrica não continha a linha em 31/12/2022; registrava R$ 486.487 mil em 31/12/2023
  e R$ 2.110.455 mil em 31/12/2024 — alta de 333% no último ano. Somadas as letras financeiras subordinadas,
  que saltaram de R$ 16.976 mil para R$ 962.328 mil no mesmo período, o total chega a R$ 3,07 bilhões.
  No sentido inverso, o estoque de letras de crédito imobiliário caiu 76%, de R$ 764.526 mil para R$ 181.741
  mil: o banco não ampliou a captação por títulos em geral, trocou de instrumento. Até o nome da rubrica
  no balanço mudou — a palavra ''financeiras'' foi acrescentada exatamente quando o instrumento passou
  a existir no passivo.'
