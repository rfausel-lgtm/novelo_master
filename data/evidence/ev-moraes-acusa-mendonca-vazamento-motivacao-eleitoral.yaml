id: ev-moraes-acusa-mendonca-vazamento-motivacao-eleitoral
kind: evidence
classification: A
proposition: 'Na véspera da sessão de 15/09/2026, em ofício formal a Fachin, Alexandre de Moraes acusou
  André Mendonça de ter, pessoalmente, vazado informações à imprensa na semana anterior a 7/9/2026 e
  gravado um vídeo nas redes sociais na véspera de atos políticos "para impulsionar os comícios de
  determinado grupo político" — caracterizando a condução da investigação contra ele e contra o senador
  Davi Alcolumbre como direcionada "por motivos pessoais e políticos", com vistas às eleições de outubro de
  2026. Moraes também insinuou, sem comprovação anexada, que o relatório da PF poderia ter sido produzido
  com auxílio de "órgão externo, provavelmente estrangeiro", e sugeriu relação entre isso e o afastamento
  do diretor-geral da PF.'
document_ids:
