attributed_to_id: alexandre-de-moraes
excerpt: Por motivos políticos-eleitorais, houve direcionamento do magistrado relator para incriminar colega
  do STF, bem como o Presidente do Senado Federal e favorecer determinado grupo político nas eleições de
  outubro de 2026, inclusive com o vazamento pelo próprio relator... reforçado pela gravação de um vídeo nas
  redes sociais pelo próprio Ministro relator, na véspera dos comícios de 7/9.
date: '2026-09-14'
notes: 'ALEGAÇÃO DE PARTE INTERESSADA — o próprio investigado acusando o relator que conduziu a investigação
  contra ele, apresentada como fato consumado ("como todos vocês da imprensa sabem"), sem prova documental
  própria anexada a estas peças nem cobertura jornalística independente localizada que confirme o vazamento
  ou a autoria do vídeo. A insinuação de produção do relatório por "órgão externo, provavelmente
  estrangeiro" é apresentada sem qualquer elemento de sustentação além da observação sobre metadados do
  arquivo (aberto e finalizado no mesmo dia) — interpretação da própria defesa, não conclusão pericial
  independente.'
