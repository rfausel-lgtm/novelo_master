id: ev-relator-homologa-delacao-de-mineiro-em-09-09-2026
kind: evidence
classification: C
proposition: 'O relator do caso Master no Supremo homologou, em 09/09/2026, a colaboração premiada de
  Antonio Carlos Freixo Júnior, um dia após a oitiva do colaborador. O ato altera o estatuto processual
  do material: o corpus registrava até então apenas o fechamento do acordo com a Procuradoria-Geral da
  República, e a homologação lhe confere validade processual, permitindo que instrua as investigações
  em curso. Convém precisar o alcance do ato: homologar não é atestar a veracidade do relato — o juízo
  verifica regularidade, legalidade e voluntariedade, e cada alegação segue dependendo de prova de corroboração.'
