proposition: 'Quatro veículos regionais independentes (Bahia Política, Tia Cândia, Diário Flip, Miranda
  News), todos de 05/08/2026 e atribuindo a informação ao UOL, descrevem de forma mutuamente consistente
  a cadeia societária: PKL One → detida pelo fundo Diamond FIP–Multiestratégia (ex-''Reag34'') → controlado
  por dois fundos, Gardênia (~50%) e Fortress (~50%) → o Gardênia tem entre seus cotistas o fundo MMPG,
  de cotista único, apontado como pertencente a Ângelo Rezende → o Fortress é controlado pela offshore
  WNT Master Fortress (Bahamas), já ligada no corpus a Valério Marega Júnior. Dados públicos de CVM (via
  agregador maisretorno.com) confirmam a existência de cada fundo e a contagem exata de cotistas (2 no
  Diamond, 7 no Gardênia, 1 no MMPG) — estrutura coerente com a narrativa da reportagem —, mas não revelam
  a identidade nominal dos cotistas. A ponta final (nome de Ângelo Rezende) permanece sourced apenas ao
  UOL, sem confirmação por registro primário; mantida como classe A, mas com estrutura societária circunstancialmente
  corroborada.'
