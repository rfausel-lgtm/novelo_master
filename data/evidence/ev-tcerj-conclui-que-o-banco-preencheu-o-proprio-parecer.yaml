excerpt: todos os documentos que compunham a massa comprobatória dos fundamentos da aptidão da referida
  instituição financeira para receber recursos do RPPS de Itaguaí (...) eram integrados, unicamente, por
  certidões e relatórios gerados e enviados pelo próprio Banco Master. Não há registro nesses autos de
  nenhum produto de consulta ou de análise de iniciativa do ITAPREVI
