id: ev-tcerj-conclui-que-o-banco-preencheu-o-proprio-parecer
kind: evidence
classification: D
proposition: 'O Tribunal de Contas do Estado do Rio de Janeiro concluiu, em voto que examina o processo
  peça a peça, que o termo de credenciamento do Banco Master no regime próprio de Itaguaí foi ''integralmente
  preenchido pelo próprio Banco Master''; que apresenta ''natureza predominantemente qualitativa e de
  promoção institucional''; que toda a documentação comprobatória da aptidão da instituição, das páginas
  4 a 105 do processo, era formada ''unicamente por certidões e relatórios gerados e enviados pelo próprio
  Banco Master'', sem qualquer consulta de iniciativa da autarquia — nem mesmo a processos sancionatórios
  na CVM; e que a análise se deu ''no curso de menos de 2 dias úteis''. A constatação foi confirmada pela
  equipe na leitura direta dos autos: o termo aparece duas vezes, uma delas sem assinatura e já preenchida,
  e a documentação foi remetida por mensagem do próprio banco.'
