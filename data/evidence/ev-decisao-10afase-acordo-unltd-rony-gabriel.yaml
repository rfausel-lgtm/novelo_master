id: ev-decisao-10afase-acordo-unltd-rony-gabriel
kind: evidence
classification: D
proposition: Segundo a decisão (PET 16.346, §§21-23), o vereador Rony Gabriel (depoimento por audiovisual
  nº 972020/2026) relatou ter sido procurado por André Salvador (agência UNLTD) para 'trabalho de gerenciamento
  de reputação e gestão de crise para um importante executivo'; após assinar acordo de confidencialidade
  com multa de R$ 800 mil, foi-lhe revelado que deveria gravar vídeos afirmando que o Banco Master fora
  'vítima' de liquidação indevida pelo Banco Central. O acordo, reproduzido na decisão, tem como partes
  a UNLTD Network Brazil Ltda (CNPJ 47.643.948/0001-29) e cita expressamente o 'PROJETO DV'.
