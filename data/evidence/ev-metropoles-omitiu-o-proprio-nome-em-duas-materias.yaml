id: ev-metropoles-omitiu-o-proprio-nome-em-duas-materias
kind: evidence
classification: I
proposition: >-
  A lista de pagamentos do Banco Master a comunicadores e veículos publicada pelo Metrópoles em 09/04/2026,
  que cita Ratinho, Léo Dias e WF Comunicação, não inclui o próprio veículo; no mesmo dia, o Estadão Conteúdo
  (reproduzido pelo Terra) noticiou pagamentos do Master ao Metrópoles registrados pelo Coaf. A matéria do
  Metrópoles de 01/09/2026 sobre as mensagens do relatório da Polícia Federal relativas ao escritório Barci de
  Moraes reproduz três mensagens, e não a que, segundo o mesmo relatório, menciona o próprio veículo. Até
  04/09/2026 a equipe não localizou matéria do veículo sobre o relatório do Coaf que o cita.
document_ids: []
