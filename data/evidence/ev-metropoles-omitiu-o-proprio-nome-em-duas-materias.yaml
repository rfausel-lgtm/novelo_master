updated_at: '2026-10-16'
inference_basis: >-
  Comparação, feita pela equipe, entre o conteúdo de duas publicações do Metrópoles (a lista de 09/04/2026 e a
  matéria de 01/09/2026) e o que outras fontes do acervo registram (a reportagem do Estadão Conteúdo sobre os
  pagamentos e as mensagens do relatório da PF), somada a uma busca sem resultado, até 04/09/2026, por matéria
  do veículo sobre o relatório do Coaf. Limite: a comparação descreve o que as publicações incluem e não
  incluem; não se conclui motivo, intenção ou decisão editorial do veículo, nem que ele estivesse obrigado a se
  citar. O id do registro foi mantido para não romper referências; o título descritivo é a proposição acima.
