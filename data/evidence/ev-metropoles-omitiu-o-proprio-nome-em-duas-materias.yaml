inference_basis: 'Leitura direta, pela equipe, de duas matérias publicadas pelo próprio veículo: a lista
  de pagamentos do Banco Master a comunicadores, de 09/04/2026, que não inclui o Metrópoles; e a matéria
  de 01/09/2026 sobre as mensagens do relatório da Polícia Federal, que reproduz três mensagens literais
  mas não a que menciona o pagamento ao próprio veículo. Somou-se a busca, sem resultado, por matéria
  do veículo sobre o relatório do Coaf que o cita.'
