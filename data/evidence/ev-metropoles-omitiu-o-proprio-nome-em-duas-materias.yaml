id: ev-metropoles-omitiu-o-proprio-nome-em-duas-materias
kind: evidence
classification: I
proposition: Dois artefatos datados de omissão. Em 09/04/2026 — o mesmo dia em que se tornaram públicos
  os R$ 27,28 milhões que recebeu —, o Metrópoles publicou lista de pagamentos do Banco Master a comunicadores
  e veículos, citando Ratinho, Léo Dias e WF Comunicação, sem incluir o próprio veículo. E em 01/09/2026
  publicou matéria sobre as mensagens do relatório da Polícia Federal em que Vorcaro cobra pagamento ao
  escritório Barci de Moraes, reproduzindo três mensagens literais — mas não a que menciona o pagamento
  ao próprio Metrópoles na mesma noite. A equipe não localizou nenhuma matéria do veículo sobre o relatório
  do Coaf que o cita.
