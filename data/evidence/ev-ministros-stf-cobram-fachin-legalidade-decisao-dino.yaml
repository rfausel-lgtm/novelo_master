id: ev-ministros-stf-cobram-fachin-legalidade-decisao-dino
kind: evidence
classification: A
proposition: 'Na manhã de 09/09/2026, ao menos 4 dos 10 ministros do STF questionaram Fachin sobre se
  ele barraria a decisão de Dino — que, na opinião desses ministros, teria incorrido em ilegalidade processual
  por não remeter o caso ao comando do Tribunal, já que ali estava o recurso da AGU, e por atropelar o
  procedimento da Pet 16.704 instaurado pelo próprio Fachin. Avaliação relatada: se Fachin não agir, Mendonça
  sairá fragilizado pela pressão do grupo Gilmar Mendes-Dino-Moraes; o grupo mais próximo de Mendonça
  (Nunes Marques, Fux, Toffoli) avalia que Fachin também será fragilizado se não reagir. Fachin não havia
  respondido aos ministros até a publicação. Busca por corroboração independente que nomeasse ministros
  específicos fazendo essa crítica à decisão de Dino (distinta da crítica do próprio Mendonça, parte interessada
  e já registrada em fonte própria) não localizou outra fonte até a data desta apuração.'
