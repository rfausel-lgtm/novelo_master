id: ev-viagem-a-londres-custeada-e-degustacao
kind: evidence
classification: C
proposition: A viagem de Andrei Rodrigues ao 1º Fórum Jurídico Brasil de Ideias, em Londres, de 24 a 26
  de abril de 2024 — organizado pelo Grupo Voto e patrocinado pelo Banco Master —, teve despesas custeadas
  diretamente pelo organizador, com hospedagem no The Peninsula London. A própria PF confirmou, em resposta
  a pedido de acesso à informação, que 'não foram pagas diárias ao servidor' e que 'o organizador do evento
  custeou diretamente as respectivas despesas extraordinárias', afirmando que ele 'não recebeu remuneração,
  cachê, honorário, ajuda de custo ou qualquer outro benefício dos organizadores' e declarando desconhecer
  os valores aplicados pelos entes privados. Em 25/04/2024, houve degustação de uísque Macallan com charutos
  no George Club, em Mayfair, custeada por Vorcaro ao custo documentado de US$ 640.831,88, com cerca de
  40 presentes — entre eles Alexandre de Moraes, Dias Toffoli, Paulo Gonet, Ricardo Lewandowski, Hugo
  Motta, Benedito Gonçalves e Andrei Rodrigues. O Banco Master era, à época, parte autora em ações no
  STF e no STJ. Registre-se, por proporcionalidade, que o diretor-geral não foi o único nem o de maior
  hierarquia entre os presentes.
