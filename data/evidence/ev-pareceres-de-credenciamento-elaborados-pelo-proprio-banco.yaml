id: ev-pareceres-de-credenciamento-elaborados-pelo-proprio-banco
kind: evidence
classification: D
proposition: 'Os termos de credenciamento do Banco Master em regimes próprios de previdência são idênticos
  entre entes de estados diferentes, e a redação é promocional, feita pelo próprio banco. A constatação
  é agora da equipe, sobre duas cópias lidas integralmente: o Termo de Credenciamento nº 033/2024 da Alagoas
  Previdência e o Termo de Análise e Atestado de Credenciamento nº 001/2024 do Itaprevi, este último obtido
  nos autos do processo administrativo nº 200.000.015/2024. O texto coincide palavra por palavra. Nos
  autos de Itaguaí está também o e-mail pelo qual o banco remeteu a documentação, e o termo aparece duas
  vezes — uma versão sem assinatura, já preenchida, e outra assinada pelo dirigente da autarquia cinco
  dias depois da abertura do processo. A conclusão coincide com a da auditoria do Ministério da Previdência
  e com a do Tribunal de Contas do Estado do Rio de Janeiro, alcançadas de forma independente.'
