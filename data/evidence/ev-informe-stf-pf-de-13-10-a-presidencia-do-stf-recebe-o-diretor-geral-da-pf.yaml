excerpt: >-
  O presidente esclareceu que a eventual realização de atos de investigação de ministro depende de autorização do
  Plenário da Corte
date: '2026-10-13'
notes: >-
  O Informe diz que o diretor-geral "tratou do Ofício 3467748", sem dizer quem o expediu; o Novelo não fixa o
  remetente. O Informe não fixa prazo para relatório nem nomeia
  ministros.
