id: ev-nota-14-master-apoio-operacional-de-convenios-salta-para-202-milhoes
kind: evidence
classification: D
proposition: A nota explicativa dedicada a 'serviços pagos antecipadamente para apoio operacional de convênios'
  salta de R$ 33,3 milhões em 2023 para R$ 202,5 milhões em 2024 — multiplicação por seis em um ano, no
  mesmo exercício em que a cobertura declarada do produto cresce de forma acentuada. Na mesma demonstração,
  'valores a receber de vendas de ativos de crédito' passa de R$ 1,23 bilhão a R$ 3,66 bilhões. A rubrica
  de apoio a convênios é a que mais diretamente traduz, em dinheiro, o esforço de abertura de folhas públicas.
