id: ev-o-filtro-do-banco-central-mantido-em-sp-foi-o-que-permitiu-desligar-a-empresa
kind: evidence
classification: C
proposition: 'A comparação entre os estados sugere uma consequência prática do desenho normativo escolhido.
  São Paulo admitiu no rol de consignatárias empresas administradoras de cartões, mas as amarrou a instituições
  financeiras autorizadas pelo Banco Central, em vez de copiar a fórmula fluminense das ''entidades devidamente
  autorizadas pelo Estado''. Foi exatamente esse vínculo que permitiu desligar a operadora por ato administrativo
  próprio quando o banco parceiro foi liquidado: a suspensão do código de desconto invoca o descumprimento
  do mesmo inciso que a admitira. Onde a exigência foi dispensada, e não transferida, essa via administrativa
  não estava disponível.'
