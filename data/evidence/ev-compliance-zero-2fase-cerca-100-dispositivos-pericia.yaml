date: '2026-02-19'
notes: Primeiro registro no acervo de uma dimensão numérica concreta da perícia digital da Operação
  Compliance Zero — não fala do conteúdo dos dispositivos, só do volume e do prazo técnico estimado. Data corrigida em 23/10/2026 (lote 366) de 24/02 para
  19/02/2026, data de assinatura da decisão.
