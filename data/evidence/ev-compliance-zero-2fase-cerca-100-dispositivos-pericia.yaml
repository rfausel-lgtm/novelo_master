source_ids:
- src-stf-pet15198-decisao-24-02-2026-planejamento-pericial-100-dispositivos
date: '2026-02-24'
notes: Primeiro registro no acervo de uma dimensão numérica concreta da perícia digital da Operação
  Compliance Zero — não fala do conteúdo dos dispositivos, só do volume e do prazo técnico estimado.
