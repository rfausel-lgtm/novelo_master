id: ev-compliance-zero-2fase-cerca-100-dispositivos-pericia
kind: evidence
classification: D
proposition: A 2ª fase da Operação Compliance Zero envolveu a apreensão de cerca de 100 dispositivos
  eletrônicos, cuja perícia de extração o Instituto Nacional de Criminalística estimou em
  aproximadamente 20 semanas de dedicação exclusiva de um único perito; as extrações mais urgentes já
  haviam sido feitas antecipadamente a pedido da PGR, por risco de perda de conteúdo probatório
  perecível.
document_ids:
