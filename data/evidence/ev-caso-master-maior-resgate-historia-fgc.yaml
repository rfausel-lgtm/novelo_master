id: ev-caso-master-maior-resgate-historia-fgc
kind: evidence
classification: C
proposition: O caso Master é descrito por múltiplas fontes independentes como o maior resgate da história
  do FGC (fundado há 30 anos), superando com folga casos anteriores como Banco Santos (déficit revisado
  para R$ 2,236 bilhões), Cruzeiro do Sul (2012, valores entre R$ 1,3 e R$ 3,4 bilhões conforme a métrica)
  e BVA (2012). Mesmo no limite superior desses casos anteriores, o desembolso do caso Master (R$ 40,6+
  bilhões) é pelo menos 12 vezes maior.
