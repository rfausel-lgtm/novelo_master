proposition: Segundo o Estadão, o roteiro de 'Dark Horse' é assinado pelo deputado Mário Frias, que em
  2024 destinou R$ 2 milhões em emendas para a ONG ligada ao filme. Em maio de 2026 a defesa do deputado
  negou ao ministro Flávio Dino qualquer triangulação de emendas, classificando a alegação como 'puramente
  especulativa'.
