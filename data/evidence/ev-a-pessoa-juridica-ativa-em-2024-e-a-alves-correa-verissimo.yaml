id: ev-a-pessoa-juridica-ativa-em-2024-e-a-alves-correa-verissimo
kind: evidence
classification: I
proposition: A pessoa jurídica que podia receber honorários em nome do escritório 'Alves Corrêa' em 2024 é a Alves
  Corrêa & Veríssimo Advocacia, e não a sociedade homônima de 2007.
document_ids:
