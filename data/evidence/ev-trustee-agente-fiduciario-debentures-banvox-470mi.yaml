id: ev-trustee-agente-fiduciario-debentures-banvox-470mi
kind: evidence
classification: A
proposition: A Trustee atuou como agente fiduciário na emissão de R$ 470,5 milhões em debêntures da Banvox
  Holding Financeira, emitidas pela família Rezende Barbosa (ex-donos do Banco Voiter) para capitalizar
  o Master, com fiança solidária de Daniel Vorcaro, Augusto Lima e Maurício Quadrado. Debenturistas destituíram
  a Trustee da administração alegando conflito de interesse, já que Quadrado era ao mesmo tempo controlador
  da Trustee Holding e fiador do negócio.
