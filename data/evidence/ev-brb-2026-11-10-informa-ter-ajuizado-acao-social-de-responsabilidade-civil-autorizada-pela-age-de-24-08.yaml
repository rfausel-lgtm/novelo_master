proposition: Em fato relevante de 10/11/2026, o BRB informou ter ajuizado nessa data ação social de
  responsabilidade civil, com base nos arts. 158 e 159 da Lei 6.404/1976, contra sete ex-administradores, e
  que o ajuizamento foi autorizado pelos acionistas na assembleia geral extraordinária de 24/08/2026. Prova
  apenas o que o BRB declarou; o comunicado não traz número de processo, vara nem juízo, e o acervo não
  localizou registro judicial da ação até 12/11/2026.
