date: '2023-12'
notes: >-
  Rueda não comentou estes itens na nota publicada pelo UOL, que trata da relação "eminentemente profissional"
  e do uso político de trechos isolados. Não se registram o uso efetivo das aeronaves, o "apto" mencionado na
  mensagem nem a viagem de familiares que a reportagem também descreve.
