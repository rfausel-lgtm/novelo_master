id: ev-uol-vorcaro-ofereceu-aeronaves-e-hospedagem-a-rueda
kind: evidence
classification: A
proposition: >-
  Segundo o UOL (16/10/2026), Daniel Vorcaro pôs seus jatos executivos à disposição de Antônio Rueda em
  dezembro de 2023 e, em março de 2024, providenciou-lhe hospedagem em hotel em São Paulo.
attributed_to: UOL (Fabio Serapião, Natália Portinari e Cézar Feitoza)
