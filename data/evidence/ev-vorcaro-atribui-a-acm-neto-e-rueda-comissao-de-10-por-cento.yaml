id: ev-vorcaro-atribui-a-acm-neto-e-rueda-comissao-de-10-por-cento
kind: evidence
classification: A
proposition: Em terceira proposta de colaboração premiada, Daniel Vorcaro afirma que ACM Neto e Antônio Rueda intermediaram
  a entrada de recursos de institutos de previdência do Rio de Janeiro, do Amapá e do Amazonas, e da Cedae, no Banco
  Master, em troca de comissão de 10% do valor aplicado ou 1% ao ano enquanto o dinheiro permanecesse investido,
  o que, sobre os cerca de R$ 2 bilhões captados por essa via, geraria obrigação estimada em R$ 200 milhões.
document_ids:
- doc-2026-09-terceira-proposta-delacao-vorcaro-comissao-politica
attributed_to: Daniel Vorcaro, em proposta de colaboração premiada ainda não aceita pelas autoridades
date: '2026-09-10'
notes: É alegação de um único colaborador, em proposta que as autoridades ainda não aceitaram, e o próprio documento
  não informa se o valor foi efetivamente pago — a diferença entre uma promessa interna e um repasse comprovado
  é o ponto que falta fechar. A soma dos valores efetivamente investidos pelas quatro instituições citadas (R$ 3,62
  bilhões) é quase o dobro dos R$ 2 bilhões que Vorcaro atribui à atuação dos dois políticos — discrepância que
  nenhuma das fontes explica.
