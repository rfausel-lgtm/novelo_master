id: ev-emendas-de-pollon-e-kicis-destinadas-a-sao-paulo-nao-tiveram-repasse
kind: evidence
classification: D
proposition: A decisão registra que a Academia Nacional de Cultura foi indicada como beneficiária de emendas do
  deputado Marcos Pollon (R$ 1 milhão) e da deputada Bia Kicis (R$ 150 mil) destinadas ao estado de São Paulo, embora
  eleitos por Mato Grosso do Sul e pelo Distrito Federal, o que a Controladoria descreveu como aparente desconformidade
  com a exigência de vinculação federativa; nenhum valor chegou a ser repassado, por óbices normativos e técnicos.
