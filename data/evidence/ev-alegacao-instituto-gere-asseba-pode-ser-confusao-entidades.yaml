id: ev-alegacao-instituto-gere-asseba-pode-ser-confusao-entidades
kind: evidence
classification: I
proposition: A alegação de que o Instituto Terra Firme (associação presidida por Flávia Peres) 'gere'
  a Asseba aparece em pelo menos duas reportagens (Jornal Grande Bahia e Bahia Notícias, ambas de 11-12/04/2026,
  citando relatório do Coaf/apuração da PF não lido diretamente pela equipe) — mas o fundamento citado
  por essas mesmas matérias (sobreposição de e-mail corporativo e telefone identificada pela PF) já é
  documentado no corpus como referente à empresa 'Terra Firme da Bahia Ltda' (de Augusto Lima), não ao
  'Instituto Terra Firme' (ONG de Flávia Peres) — duas pessoas jurídicas distintas, com CNPJs diferentes,
  que a cobertura jornalística por vezes trata de forma intercambiável sob o rótulo genérico 'Terra Firme'.
  É possível que a alegação específica de 'gestão pelo Instituto' reflita essa confusão de nomes, em vez
  de um achado adicional e distinto da PF/Coaf sobre o instituto especificamente — sem acesso ao documento
  primário do Coaf ou à representação da PF com o CNPJ exato citado, a equipe não pode decidir entre as
  duas hipóteses.
