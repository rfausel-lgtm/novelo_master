id: ev-mt-convenio-026-2023-texto-e-a-defesa-das-24-instituicoes
kind: evidence
classification: D
proposition: 'O ato que habilitou o Banco Master em Mato Grosso é o Extrato do Termo de Convênio de Consignação
  nº 026/2023 - SEPLAG/MT, publicado em 01/06/2023, com vigência de 30/05/2023 a 29/05/2028 e objeto expresso
  de ''amortização de cartão consignado de benefício''. Assinam o secretário de Planejamento e Gestão
  e, pelo banco, o diretor Luiz Antonio Bull — nome já mapeado no acervo em outra frente do caso — e um
  procurador. Correção metodológica: não existe portaria de credenciamento publicada; o instrumento levado
  a diário oficial é o convênio. Sobre a defesa do ex-governador, de que houve ''24 bancos cadastrados
  para esse serviço e o Master foi apenas mais um e sequer foi o primeiro'': o levantamento da equipe
  no diário oficial confirma a ordem, mas por margem de um dia — duas instituições assinaram em 29/05
  e três, incluindo o Master, em 30/05. O número de 24 instituições, porém, é cumulativo até 2025: em
  todo o ano de 2023 foram dez convênios do produto, e na data em que o Master assinou havia quatro outros,
  nenhum com mais de um dia de antecedência. O extrato do Master foi, ainda, publicado antes dos demais.
  Registro adicional: nem ''CredCesta'' nem ''PKL One'' aparecem em qualquer publicação oficial do diário
  mato-grossense.'
