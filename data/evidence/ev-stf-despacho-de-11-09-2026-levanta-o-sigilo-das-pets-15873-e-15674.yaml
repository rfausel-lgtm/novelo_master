id: ev-stf-despacho-de-11-09-2026-levanta-o-sigilo-das-pets-15873-e-15674
kind: evidence
classification: D
proposition: >-
  Em 11/09/2026, o ministro André Mendonça, em despacho na Pet 16.704/DF, registrou o pedido do
  Vice-Procurador-Geral da República de levantamento do sigilo de 18 Pets, entre elas a 15.873, afirmou não
  haver impedimento ao levantamento dos correspondentes sigilos e, de ofício, determinou também o
  levantamento do sigilo de outra lista de processos, entre eles a Pet 15.674. A Pet 15.978 não consta de
  nenhuma das duas listas.
document_ids:
