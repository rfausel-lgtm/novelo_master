excerpt: >-
  De todo o modo, entendo não haver impedimento ao levantamento dos correspondentes sigilos.
locator: despacho, itens 1 a 3
date: '2026-09-11'
notes: >-
  Liga-se a ev-pgr-lista-17-processos-omitidos-do-levantamento-de-sigilo: a PGR havia pedido o levantamento
  "sem exceção" e listado a Pet 15.873. Limite: o portal público lista como peças baixáveis despachos e
  decisões, e não as peças da PF (relatórios, representações); o levantamento do sigilo da Pet não equivale à
  publicação do relatório.
