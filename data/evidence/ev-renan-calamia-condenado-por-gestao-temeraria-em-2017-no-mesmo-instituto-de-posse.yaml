id: ev-renan-calamia-condenado-por-gestao-temeraria-em-2017-no-mesmo-instituto-de-posse
kind: evidence
classification: C
proposition: A Justiça Federal em São Paulo condenou Renan Foglia Calamia, em 19/01/2026, a dois anos de prisão
  em regime aberto (convertidos em prestação de serviços comunitários e multa) por gestão temerária, referente à
  recomendação, em 2017 — quando a consultoria ainda se chamava PAR Engenharia Financeira —, de aplicação de R$
  1,5 milhão do Iprem de Santo Antônio de Posse no fundo multimercado Horus Vetor, incompatível com as regras de
  RPPS. É o mesmo instituto que, quase uma década depois, voltou a investir por indicação da mesma consultoria —
  agora no Banco Master.
