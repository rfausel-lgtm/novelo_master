date: '2026-01-19'
notes: No mesmo julgamento, Calamia foi absolvido de acusação de ter causado prejuízo de R$ 5,1 milhões ao Iprem
  em outros investimentos, conforme laudo da PF; o corpus não obteve a sentença integral, apenas a cobertura de
  imprensa, e não localizou o número do processo. As duas fontes divergem quanto à data da decisão (19/01/2026
  no Brasil 247, 09/12/2025 na Folha de Alagoas), divergência não reconciliada.
