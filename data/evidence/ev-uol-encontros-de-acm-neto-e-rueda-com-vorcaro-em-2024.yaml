date: '2024-09'
notes: >-
  As mensagens descritas não indicam o assunto dos encontros. A nota de ACM Neto publicada pelo UOL não trata
  dos encontros; nega atuação junto a institutos de previdência e qualquer contato com Fabiano Zettel. Não se
  registram outros participantes, o local exato nem a mensagem posterior de ACM Neto sobre a política em
  Brasília, de assunto genérico, que o Novelo não liga a fundos nem a eleição.
