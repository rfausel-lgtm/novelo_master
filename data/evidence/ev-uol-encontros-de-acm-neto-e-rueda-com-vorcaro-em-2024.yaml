id: ev-uol-encontros-de-acm-neto-e-rueda-com-vorcaro-em-2024
kind: evidence
classification: A
proposition: >-
  Segundo o UOL (16/10/2026), ACM Neto e Antônio Rueda passaram um fim de semana com Daniel Vorcaro em Trancoso
  (BA) em setembro de 2024, e em outubro de 2024 ACM Neto pediu a Vorcaro uma conversa "eu, você e Rueda", que
  ocorreu em São Paulo.
attributed_to: UOL (Fabio Serapião, Natália Portinari e Cézar Feitoza)
document_ids: []
source_ids:
