id: ev-amprev-perguntou-ao-bc-por-que-barrou-o-brb
kind: evidence
classification: D
proposition: Em 11/09/2025, dois meses antes da liquidação, o diretor-presidente da Amapá Previdência
  dirigiu ao presidente do Banco Central ofício cujo assunto se abre com a palavra 'REITERO' — a segunda
  tentativa — pedindo informações sobre processos administrativos, sanções e investigações que envolvessem
  o Banco Master, seus dirigentes ou controladores, e, além disso, esclarecimentos sobre os motivos que
  levaram a autarquia monetária a negar a aquisição de parte do banco pelo Banco de Brasília. O corpus
  não localizou resposta nos autos.
