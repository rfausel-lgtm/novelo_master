date: '2026-01-12'
notes: Elo até então não registrado entre duas frentes já documentadas separadamente no acervo — o
  Projeto DV (INQ 5.035) e a fase cautelar da PET 15.198. A tese de que a campanha configura "novos
  crimes" é alegação da autoridade policial; a existência da campanha em si já está corroborada (C) por
  múltiplas fontes de imprensa independentes registradas em ev-projeto-dv-tres-camadas-influenciadores.
