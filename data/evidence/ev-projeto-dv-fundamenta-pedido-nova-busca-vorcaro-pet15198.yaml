id: ev-projeto-dv-fundamenta-pedido-nova-busca-vorcaro-pet15198
kind: evidence
classification: A
proposition: Em 12/01/2026, a PF pediu reconsideração da decisão de 06/01/2026 que indeferira nova busca
  no endereço atual de Daniel Vorcaro, citando o "Projeto DV" — campanha de influenciadores já mapeada no
  acervo via INQ 5.035 — como indício de novos crimes; a PGR concordou em 12/01/2026.
