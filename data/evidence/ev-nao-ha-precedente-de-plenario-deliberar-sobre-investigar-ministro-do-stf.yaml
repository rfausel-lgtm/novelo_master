id: ev-nao-ha-precedente-de-plenario-deliberar-sobre-investigar-ministro-do-stf
kind: evidence
classification: I
proposition: 'A busca não localizou precedente de deliberação do Plenário sobre a abertura de inquérito
  contra ministro do próprio tribunal, e há convergência de indícios de que não exista. Nenhuma das partes
  cita precedente nesse sentido: o presidente invoca, para a excepcionalidade de suspender decisão de
  ministro, apenas as SL 1.395/SP, de 2020, e SL 1.188/DF, de 2018 — que são de suspensão de decisão,
  não de investigação; o Ministério Público cita precedentes sobre sistema acusatório, nenhum envolvendo
  ministro da corte; e a ADPF 572 tratou do poder de a Presidência instaurar inquérito, não de investigar
  integrante do colegiado. A cobertura afirma tratar-se de situação inédita. Registre-se que uma busca
  negativa exaustiva no acervo de inquéritos e petições do Plenário não foi realizada, de modo que a ausência
  de precedente é fortemente indicada, não provada.'
