id: ev-moraes-acusou-mendonca-de-favorecimento-a-grupos-politicos
kind: evidence
classification: A
proposition: 'A única manifestação de Alexandre de Moraes sobre a crise veio por decisão judicial, e não
  responde ao conteúdo das mensagens atribuídas a ele: acusa o relator do caso Master. No pedido dirigido
  ao presidente do tribunal em 03/09, sustenta haver ''fortes indícios da prática de improbidade administrativa,
  abuso de autoridade e crime de responsabilidade pelo Ministro André Mendonça, no exercício da relatoria
  das PETs 15041 (Operação Sem Desconto) e 15556 (Operação Compliance Zero), com quebra da imparcialidade
  judicial e favorecimento a determinados grupos políticos''.'
