id: ev-tirreno-vendia-creditos-fabricados-ao-brb
kind: evidence
classification: C
proposition: 'O mecanismo por trás dos R$ 12,2 bilhões em carteiras que o BRB adquiriu do Master, já registrado
  no corpus via decisão do STF como tendo ocorrido ''apesar de pareceres técnicos e jurídicos contrários'',
  foi descrito por reportagem baseada em apuração da PF: uma empresa de fachada criada por Vorcaro, a
  Tirreno, vendia os créditos ao BRB embutindo um prêmio ao banco comprador. O Master recebia o valor
  à vista, sem pagar a Tirreno à vista. A investigação concluiu que os créditos nunca existiram na origem.'
