id: ev-tirreno-vendia-creditos-fabricados-ao-brb
kind: evidence
classification: C
proposition: 'O mecanismo por trás dos R$ 12,2 bilhões em carteiras que o BRB adquiriu do Master, já registrado
  no corpus via decisão do STF como tendo ocorrido ''apesar de pareceres técnicos e jurídicos contrários'',
  foi descrito por duas apurações independentes baseadas em depoimentos à PF e ao BC: uma empresa de fachada,
  a Tirreno, vendia créditos ao BRB embutindo um prêmio ao banco comprador; o Master recebia o valor à vista,
  sem pagar a Tirreno à vista; os créditos não puderam ser confirmados na origem.'
document_ids:
- doc-2026-03-apublica-mecanismo-tirreno
source_ids:
- src-apublica-2026-03-reconstrucao-fraude-master
- src-poder360-2026-02-04-bc-poupou-cartos
excerpt: A Tirreno vendia créditos ao BRB por R$ 12,2 bilhões — embutindo um prêmio (lucro) ao banco.
  O Master não precisava pagar a Tirreno à vista, mas recebia do BRB à vista.
date: 2026-03
notes: 'Reclassificação de 12/09/2026: o registro original citava só a Agência Pública (o document_id
  apontado é a mesma reportagem, não uma segunda origem — ver BRIEFING.md). A segunda fonte agora ligada,
  o Poder360, corrobora o mecanismo central (Tirreno como veículo de créditos não confirmados vendidos ao
  BRB), mas diverge sobre QUEM está por trás da Tirreno: atribui sua criação a André Seixas Maia — ex-funcionário
  do Master, ex-diretor da Cartos, hoje diretor da Tirreno —, e não a Daniel Vorcaro, e considera falsa a
  versão pública do próprio Vorcaro de que Henrique Peretto teria criado a empresa. A Cartos nega qualquer
  originação, estruturação ou comercialização de créditos. A proposição acima foi ajustada para não afirmar
  autoria de Vorcaro sobre a Tirreno, que não é ponto corroborado. Atualização de 12/09/2026 (lote 219): a
  leitura direta do IPL 2025.0087917 resolveu a origem societária exata — a empresa foi constituída como
  "SX 016" por Daniel Moreira Bezerra em 04/11/2024, renomeada Tirreno em 02/12/2024, com Seixas Maia
  assumindo a direção em 15/04/2025 — e confirmou o vínculo de Seixas Maia e Peretto com a Cartos por
  documento primário (Banco Central), não apenas pela reportagem. Seixas Maia, Peretto e Daniel Moreira
  Bezerra ganharam registro próprio (ver [[andre-seixas-maia]], [[henrique-peretto]],
  [[daniel-moreira-bezerra]]); Cartos ganhou registro de organização (ver [[cartos]]).'
