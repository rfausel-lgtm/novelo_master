id: ev-pf-nao-cumpre-prazo-24h-pede-reconsideracao-lacracao
kind: evidence
classification: A
proposition: Em 14/01/2026, o Diretor-Geral da PF, Andrei Rodrigues, respondeu à cobrança de Dias Toffoli
  sobre o descumprimento do prazo de 24 horas, atribuindo o atraso a sobrecarga operacional e pedindo que
  os celulares apreendidos não fossem lacrados no gabinete do relator, para permitir perícia imediata.
document_ids:
- doc-2026-01-14-informacao-pf-explica-descumprimento-prazo
source_ids:
- src-stf-pet15198-peca050-informacao-pf-nao-cumprimento-prazo
attributed_to: Andrei Rodrigues, Diretor-Geral da Polícia Federal
date: '2026-01-14'
notes: É a versão da própria PF sobre um episódio que a decisão de Toffoli da mesma data (já registrada no
  acervo) descreve em tom oposto, como "inobservância expressa e deliberada" de ordem judicial. As duas
  peças são dois lados do mesmo confronto institucional — tratadas aqui como alegação da PF, não como fato
  estabelecido sobre a causa do atraso.
