id: ev-cmn-res-5295-ativo-de-referencia-aciona-a-alocacao-em-titulos-publicos-federais
kind: evidence
classification: D
proposition: Segundo o texto consolidado da Resolução CMN 4.222 na redação dada pela Resolução CMN 5.295, a
  instituição associada ao FGC deve manter montante alocado exclusivamente em títulos públicos federais quando
  o Valor de Referência for superior, entre outros limites, ao Ativo de Referência, cuja forma de apuração
  caberá ao BC estabelecer.
document_ids:
  - doc-2026-04-23-res-cmn-5295-redacoes-no-texto-consolidado-da-res-4222
source_ids:
