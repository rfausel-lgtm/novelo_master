excerpt: deve manter montante alocado exclusivamente em títulos públicos federais quando o Valor de Referência
  for superior
locator: art. 2º-B, caput e inciso III; § 3º-B; § 4º, I
date: 2026-04-23
notes: D demonstra o conteúdo do dispositivo no consolidado do BC. O que o Ativo de Referência abrange é
  matéria de regulamentação do BC; as descrições da imprensa sobre sua composição não foram confirmadas em
  documento.
