id: ev-mendonca-afasta-andrei-cautelar-90dias
kind: evidence
classification: C
proposition: André Mendonça, como relator da Pet 16.662 (não a Pet 16.704, avocada por Fachin em 03/09
  para colher apenas explicações por escrito das quatro pessoas envolvidas na crise), determinou em 08/09/2026
  o afastamento cautelar por 90 dias de Andrei Rodrigues (diretor-geral da PF) e Leandro Almada da Costa
  (diretor de Inteligência Policial), sob alegação de monitoramento ilícito do próprio ministro por relatórios
  de inteligência produzidos entre 03 e 31/08/2026. É a concessão, cinco dias depois, de pedido que o
  partido Novo já havia protocolado em 03/09/2026. A decisão determina também abertura de procedimento
  criminal e administrativo-disciplinar pela Corregedoria da PF, e proíbe novos relatórios de inteligência
  sobre magistrados, advocacia pública ou policiais.
