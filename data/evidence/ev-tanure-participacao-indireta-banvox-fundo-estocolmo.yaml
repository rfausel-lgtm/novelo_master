id: ev-tanure-participacao-indireta-banvox-fundo-estocolmo
kind: evidence
classification: A
proposition: Segundo apuração jornalística, Nelson Tanure teria participação indireta na holding da Banvox
  por meio de debêntures conversíveis no fundo Estocolmo — administrado pela Trustee e gerido pela MAM
  Asset —, com termos contratuais sigilosos. Esse dado é apontado como um dos elementos usados pela PF
  para sustentar a hipótese, ainda sob apuração e sem confirmação judicial, de que Tanure seria 'sócio
  oculto' do Master. Tanure nega qualquer vínculo societário com o Master ou suas gestoras.
