attributed_to: Partido Novo (pedido), segundo o Congresso em Foco e o Times Brasil
date: '2026-09-28'
notes: >-
  Classe C só quanto à existência do pedido (duas apurações; o Times Brasil é só em parte Estadão Conteúdo); o
  conteúdo é alegação do requerente (A). A peça e a PET em que foi protocolado não foram identificadas; nenhuma
  decisão de Fachin nem resposta de Dino foi localizada até 16/10/2026.
