id: ev-partido-novo-pede-a-fachin-a-anulacao-do-pedido-de-vista-de-dino
kind: evidence
classification: C
proposition: >-
  Segundo o Congresso em Foco e o Times Brasil (com Estadão Conteúdo), em 28/09/2026 o Partido Novo, por sua
  executiva nacional, pediu ao presidente do STF, Edson Fachin, a anulação do pedido de vista de Flávio Dino de
  15/09/2026 na questão de ordem sobre a reunião das PET 16.662 e 16.704 e, computada a posição de Dino, o
  reconhecimento de empate de 4 a 4 com voto de desempate do presidente; os argumentos ("desvio de finalidade",
  segundo o Congresso em Foco; a vista "deixou de servir ao exame do processo para servir à condução da sessão",
  segundo o Times Brasil) são do requerente.
