id: ev-defesa-de-rodrigo-pimenta-pede-a-fachin-a-revogacao-da-preventiva-segundo-a-imprensa
kind: evidence
classification: A
proposition: Segundo O Antagonista e o Metrópoles, em 22/09/2026 a defesa de Rodrigo Pimenta Franco Avelar
  Campos pediu ao presidente do STF, Edson Fachin, a revogação da prisão preventiva, argumentando que não há
  nos autos elemento concreto de risco de não comparecimento e que ele estava intimado a depor na PF em
  06/10/2026 e compareceria mesmo solto; pediu, subsidiariamente, medidas cautelares diversas (entrega de
  passaporte, proibição de deixar o país, proibição de contato com investigados indicados e comparecimento
  periódico). Segundo O Antagonista, um primeiro pedido fora feito em 20/08/2026 e o PGR se manifestou em
  18/09/2026 pela manutenção da prisão. Tal como relatada, a petição não discute os fatos imputados.
