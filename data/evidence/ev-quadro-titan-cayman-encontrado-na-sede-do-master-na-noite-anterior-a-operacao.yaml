id: ev-quadro-titan-cayman-encontrado-na-sede-do-master-na-noite-anterior-a-operacao
kind: evidence
classification: D
proposition: No dia da Operação Compliance Zero — Fase I (18/11/2025), a equipe policial que cumpriu mandado na
  sede do Banco Master encontrou um quadro com anotações de fluxo financeiro, com valores, referências ao Master
  e a 'DV' (Daniel Vorcaro) e a fundos de investimento, tendo em destaque a inscrição 'TITAN CAYMAN'; uma advogada
  da empresa presente afirmou, na ocasião, que o esboço havia sido elaborado na noite anterior — a mesma noite em
  que Vorcaro tentou embarcar para os Emirados Árabes.
