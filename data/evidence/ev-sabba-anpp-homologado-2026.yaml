id: ev-sabba-anpp-homologado-2026
kind: evidence
classification: C
proposition: 'Em dezembro de 2025 o MPF firmou com Saul Dutra Sabbá acordo de não persecução penal, homologado
  pela Justiça Federal de São Paulo em 5 de fevereiro de 2026, com extinção da punibilidade. Os termos
  incluem o reconhecimento das irregularidades, prestação de serviços comunitários por dois anos e pagamento
  de cerca de R$ 100 mil (70 salários mínimos). O MPF havia resistido ao acordo: o procurador Vicente
  Mandetta sustentou que o instituto se destina a casos simples e que aquelas condutas, de alto potencial
  ofensivo, não se qualificavam, por terem sido cometidas reiteradamente e envolverem altos valores. O
  MPF cedeu depois que o STJ arquivou parte da acusação em 2021, restando apenas a gestão fraudulenta,
  cuja pena mínima de três anos abre a possibilidade do acordo. Procurado, Sabbá não se pronunciou.'
