id: ev-fachin-duas-trilhas-distintas-pet16704
kind: evidence
classification: D
proposition: 'A Pet 16.704 comporta DUAS trilhas processuais distintas, não uma só: (a) uma trilha comum
  e simultânea, aberta em 03/09/2026, com prazo de 5 dias úteis para Moraes, Mendonça, Gonet e Andrei
  Rodrigues se manifestarem sobre condutas da PF (cumprimento da LOMAN, uso de credenciais institucionais,
  sigilo revelado a investigado, controle externo da atividade policial); (b) uma trilha sequencial e
  mais restrita, aberta em 04/09/2026, tratando especificamente da admissibilidade da acusação que Moraes
  apresentou contra Mendonça — primeiro Gonet (5 dias úteis), depois, sucessivamente, Mendonça (mais 5
  dias úteis). Coberturas jornalísticas menos detalhadas tratam os quatro chamados como um bloco único,
  o que não corresponde à estrutura real dos dois despachos.'
