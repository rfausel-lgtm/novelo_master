id: ev-trilha-do-convite-a-londres-no-relatorio-da-pf
kind: evidence
classification: D
proposition: 'O mesmo relatório transcreve, às páginas 212 a 215, a trilha do convite ao diretor-geral
  da PF para o fórum de Londres de abril de 2024. Em 03/04/2024, o contato salvo como ''Fabio Faria''
  encaminha a Vorcaro mensagem de interlocutor não identificado propondo ''o que acha de eu convidar o
  DPF Andrei'', seguida de ''aí fechamos o PGR e o DPF''; Faria responde ''acho ótimo, pode convidar''.
  Cinco minutos depois: ''podem entrar em contato lá na PF. Ele aceitou''. Faria pede que Vorcaro avise
  ''o Marcio'' para fazer ''o convite formal ao delegado geral''. Vorcaro escreve ao contato ''Marcio
  Conjur'' que o ''Ministro fez convite ao andrei PF'' — o relatório não esclarece qual ministro. Em seguida,
  ''Marcio Conjur'' encaminha a Vorcaro mensagem de pessoa que se apresenta como ''EPF Ana Beatriz, assistente
  do Diretor-Geral da Polícia Federal'', confirmando interesse em participar e pedindo para averiguar
  questões logísticas: ''algum custo (hospedagem, passagem) é coberto pelos organizadores?''. A resposta
  de ''Marcio Conjur'' é: ''Todas as despesas bancadas por nós''. Em 10/07/2025, para o segundo evento,
  o contato ''Ana Matos Mkt'' informa que ''o Andrei PF precisa de um Convite formal para aceitar Londres'',
  e Vorcaro autoriza que o Grupo Voto o envie.'
