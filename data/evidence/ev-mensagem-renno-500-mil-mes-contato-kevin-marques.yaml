kind: evidence
id: ev-mensagem-renno-500-mil-mes-contato-kevin-marques
classification: A
proposition: Segundo prints publicados pelo Metrópoles e mensagens reveladas pela Folha de S.Paulo, extraídos do
  celular de Daniel Vorcaro, em 04/07/2025 Luiz Rennó encaminhou a Vorcaro o contato de "Kevin Marques" com a pergunta
  "Esse aqui - 500 mil mês - mantém?", e em seguida "Então esse aqui já era né"; Vorcaro respondeu com risos. A
  imprensa associa o contato ao advogado Kevin de Carvalho Marques, filho do ministro Nunes Marques; as mensagens
  não comprovam pagamento.
