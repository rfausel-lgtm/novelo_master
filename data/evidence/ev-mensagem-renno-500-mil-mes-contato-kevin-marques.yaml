date: '2025-07-04'
notes: 'O material integral do celular foi entregue pela PF aos gabinetes do STF em 14/09/2026 e, segundo o Poder360,
  segue sob sigilo: a publicação não decorre de levantamento de sigilo. A identidade do contato com o filho do ministro
  é associação da imprensa, sem documento que a comprove; o número de telefone do print não é reproduzido.'
