id: ev-renata-varandas-lobby-registrado-ambipar-eagendas
kind: evidence
classification: A
proposition: 'Registros oficiais do e-Agendas (CGU) mostram Renata Varandas — namorada pública do diretor-geral
  da PF, Andrei Rodrigues, desde pelo menos 31/01/2025 — em quatro reuniões federais ao longo de 2026
  (25/02, 17/03, 08/05, 20/07) representando a Ambipar, empresa investigada na Operação Compliance Zero.
  Em três delas consta como ''Diretora de Relações Governamentais'' da Ambipar: com o ministro Silvio
  Costa Filho (Portos e Aeroportos) e o então presidente do Ibama, Rodrigo Agostinho, sobre a resolução
  398 do Conama; com o ministro Alexandre Silveira (Minas e Energia), com executivos da PowerChina; e
  com o procurador-geral adjunto do Banco Central, Erasto Villa Verde de Carvalho Filho, sobre ''assuntos
  institucionais'' da empresa. É lobby formal, registrado em sistema público oficial — não há, nas fontes
  disponíveis, qualquer indício de atuação irregular ou não registrada.'
