id: ev-jequie-reservou-trinta-por-cento-da-remuneracao-ao-programa
kind: evidence
classification: D
proposition: 'O decreto municipal de Jequié fixa teto de 70% da remuneração bruta e destina ''trinta por
  cento da remuneração bruta do servidor exclusivamente para operações de crédito realizadas através do
  Cartão do Programa Credicesta'' — a maior reserva nominal localizada em município com convênio comprovado.
  O convênio, porém, fora assinado dois dias antes do decreto: a operação precede a norma local, e quem
  a autoriza é a norma estadual invocada no próprio instrumento.'
