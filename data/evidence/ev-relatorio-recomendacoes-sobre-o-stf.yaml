kind: evidence
classification: D
proposition: 'A seção 12.3 do relatório rejeitado recomendava: que PF e MPF examinassem os contratos de
  honorários firmados por Enrique de Abreu Lewandowski com o banco, à luz do vínculo familiar com o ex-presidente
  do STF e ex-ministro da Justiça; que examinassem a conduta de Fabiano Campos Zettel, com indícios de
  lavagem de dinheiro; que o Senado, a PF e o MPF examinassem o contrato de honorários firmado por Viviane
  Barci de Moraes, cônjuge do ministro Alexandre de Moraes; e que examinassem o relacionamento entre o
  ministro Dias Toffoli e Daniel Vorcaro. Nos dois últimos casos o texto invoca o art. 52, II, da Constituição,
  sobre crime de responsabilidade.'
