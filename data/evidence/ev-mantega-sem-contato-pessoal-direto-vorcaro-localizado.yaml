id: ev-mantega-sem-contato-pessoal-direto-vorcaro-localizado
kind: evidence
classification: I
proposition: 'Não foi localizado nenhum relato de contato pessoal direto entre Mantega e Vorcaro (mensagem,
  encontro informal, viagem, jantar) além da mediação institucional já registrada — o encontro de 04/12/2024
  no Planalto e as reuniões de Mantega com o chefe de gabinete de Lula. Esse resultado negativo ganha
  algum peso à luz da ausência de ''Mantega'' no relatório do celular de Vorcaro: se houvesse troca direta
  de mensagens salva no aparelho, o nome provavelmente apareceria, como ocorre para outros contatos do
  banqueiro. Não prova ausência de relação pessoal — apenas não há indício dela nas fontes disponíveis.'
document_ids: []
source_ids: []
inference_basis: Ausência de relato de contato pessoal em fontes de imprensa consultadas, combinada com
  a ausência do nome no relatório pericial do celular de Vorcaro.
