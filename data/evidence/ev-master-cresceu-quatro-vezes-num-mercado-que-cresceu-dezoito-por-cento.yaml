id: ev-master-cresceu-quatro-vezes-num-mercado-que-cresceu-dezoito-por-cento
kind: evidence
classification: I
proposition: Enquanto o estoque nacional de letras financeiras registrado na B3 passou de R$ 492,2 bilhões,
  ao fim de 2023, para R$ 584,4 bilhões ao fim de 2024 — alta de 18,7% —, o estoque do Banco Master multiplicou-se
  por 4,34. A participação do banco no mercado saiu de cerca de 0,10% para 0,36%. As bases não são idênticas,
  porque o dado do Banco Central é saldo contábil da instituição e o da B3 é volume registrado do instrumento,
  mas o contraste de ritmo é inequívoco.
