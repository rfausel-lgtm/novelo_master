inference_basis: Divisão direta entre a série do IF.data para o Banco Master e o estoque agregado de letras
  financeiras publicado no boletim diário da B3 nas datas de 29/12/2023 e 30/12/2024, com ressalva explícita
  quanto à diferença de base.
