id: ev-assimetria-entre-fundos-publicos-e-privados
kind: evidence
classification: D
proposition: 'A assimetria que define o caso: enquanto dezoito regimes próprios de previdência compraram
  R$ 1,867 bilhão em letras financeiras do Banco Master, o regime de previdência complementar fechada
  — composto por 265 fundos de pensão privados — não tinha nenhuma aplicação ou posição em ativos do banco,
  conforme consulta da equipe técnica de auditores da Previc nos demonstrativos mensais de investimentos.
  Fundos privados, de gestão profissional e sem cargo de nomeação política, não compraram o papel; fundos
  públicos compraram quase toda a emissão.'
