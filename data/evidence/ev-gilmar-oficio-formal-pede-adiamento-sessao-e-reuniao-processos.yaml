id: ev-gilmar-oficio-formal-pede-adiamento-sessao-e-reuniao-processos
kind: evidence
classification: C
proposition: 'Na noite de 11/09/2026, Gilmar Mendes enviou ofício formal a Fachin pedindo o adiamento do
  julgamento da Pet 16.662 e propondo quatro alternativas: reunir os processos de Moraes e de Mendonça;
  Fachin assumir a relatoria do processo de Mendonça; organizar previamente a matéria a ser julgada; ou,
  mantida a sessão, o próprio Gilmar apresentar o caso ao plenário com as preliminares (inclusive o pedido
  de nulidade da PGR) analisadas antes do mérito. Fachin respondeu no dia seguinte, 12/09/2026: indeferiu a
  reunião dos processos, manteve a sessão de 15/09 exclusiva à Pet 16.662 e remeteu a Pet 16.704 (caso
  Mendonça) para 23/09.'
