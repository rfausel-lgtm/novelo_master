id: ev-conta-corrente-gerencial-do-master-ligava-rpps-credcesta-e-brb
kind: evidence
classification: A
proposition: Segundo a proposta de colaboração de Vorcaro, o Banco Master mantinha uma 'conta corrente gerencial'
  para controlar internamente os valores supostamente devidos a ACM Neto e a Rueda, e essa mesma conta registraria
  não apenas a captação de investidores institucionais como Rioprevidência, Amprev, Amazonprev e Cedae, mas também
  operações relacionadas ao CredCesta e negociações envolvendo o Banco de Brasília (BRB).
document_ids:
- doc-2026-09-terceira-proposta-delacao-vorcaro-comissao-politica
attributed_to: Daniel Vorcaro, em proposta de colaboração premiada ainda não aceita pelas autoridades
date: '2026-09-10'
notes: Se confirmado, é o primeiro indício documental de que as duas maiores frentes do acervo — a captação institucional
  em RPPS e a exploração do CredCesta — corriam sob o mesmo controle financeiro interno do banco, e não como negócios
  separados. Permanece alegação de um único colaborador, sem corroboração independente localizada pela equipe.
