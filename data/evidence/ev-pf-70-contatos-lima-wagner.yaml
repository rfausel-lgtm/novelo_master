proposition: 'Segundo síntese do Poder360, o relatório da PF registraria ao menos 70 contatos diretos entre Augusto
  Lima e Wagner. CORRIGIDO (lote 323): a contagem de 70 contatos não aparece no texto da representação de 98 páginas
  lido pela equipe, e a afirmação anterior de que a proximidade do senador com Vorcaro se deu "por intermédio de
  Lima" foi retirada — o documento atribui os primeiros contatos a Guilherme Sodré (ver
  ev-pf-primeiros-contatos-wagner-vorcaro-via-guilherme-sodre).'
