id: ev-aquilla-veyron-instrumento-da-fraude-no-maxima
kind: evidence
classification: A
proposition: 'Benjamim Botelho de Almeida foi denunciado pelo MPF por gestão fraudulenta de instituição
  financeira (arts. 4º, 6º e 10 da Lei 7.492/86) no Banco Máxima, por fatos de novembro de 2014 a março
  de 2016, pelo suposto uso de fundos do Grupo Aquilla para simular valorização de investimentos e mascarar
  a insuficiência de capital do banco — a mesma mecânica contábil que fundamentou a inabilitação de Saul
  Dutra Sabbá pelo Banco Central em 2018. VERIFICAÇÃO POSTERIOR: a equipe obteve a íntegra da sentença
  e confirmou que Botelho FOI ABSOLVIDO em 25/04/2025, com fundamento no art. 386, V, do CPP, ao lado
  de outros três réus, tendo a sentença assentado que ele não detinha relação de controle, administração
  ou gerência sobre o Banco Máxima, elemento exigido pelo art. 25 da Lei 7.492/86. O MPF apelou e o recurso
  segue pendente na 11ª Turma do TRF3. Ver ev-botelho-absolvido-sentenca-2025.'
