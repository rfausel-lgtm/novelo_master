id: ev-relatorio-de-auditoria-tem-nome-oficial-e-e-sigiloso
kind: evidence
classification: D
proposition: O documento que sustenta a apuração federal sobre os regimes próprios chama-se 'Relatório
  de Auditoria Direta — Letras Financeiras', da Coordenação-Geral de Auditoria do Departamento dos Regimes
  Próprios de Previdência Social. A denominação foi revelada pela própria Polícia Federal, em nota pública
  de 25/08/2026 sobre a operação relativa a Campo Grande — ente que não está entre os quatro citados na
  reportagem original, o que demonstra tratar-se de instrumento por classe de ativo, e não por ente. O
  documento é sigiloso e está com a PF; o ministro da Previdência afirmou publicamente ter recebido ofício
  da corporação classificando os dados como sigilosos.
