id: ev-freixo-alega-1-bilhao-dolares-repasses-flavio-bolsonaro
kind: evidence
classification: A
proposition: Segundo a colaboração premiada de Antonio Carlos Freixo Júnior ('Mineiro'), fechada em 03/09/2026
  — a segunda delação da Operação Compliance Zero —, ele teria movimentado cerca de US$ 1 bilhão para
  Daniel Vorcaro através de sua rede de operações, incluindo repasses relacionados a Flávio Bolsonaro.
  É extensão, em nova ordem de grandeza, do que o corpus já registrava sobre o financiamento do filme
  'Dark Horse' via Havengate Development Fund — tratada aqui como alegação do colaborador, não fato corroborado
  por prova independente.
