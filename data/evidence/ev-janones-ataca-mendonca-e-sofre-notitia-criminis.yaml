id: ev-janones-ataca-mendonca-e-sofre-notitia-criminis
kind: evidence
classification: D
proposition: 'Em 09/09/2026, horas depois da decisão de André Mendonça que afastou o diretor-geral da PF,
  Andrei Rodrigues, o deputado federal André Janones publicou vídeo chamando Mendonça de "vagabundo" e
  acusando-o de ter afastado Rodrigues para proteger a si mesmo. No mesmo dia, dois advogados sem vínculo
  processual identificado com o caso (Paulo César R. de Faria e Filipe Rocha de Oliveira) protocolaram
  notícia-crime contra Janones na Pet 16.662/DF, pedindo prisão em flagrante, quebra de imunidade parlamentar
  e remessa ao TSE, citando o precedente da prisão de Daniel Silveira.'
document_ids:
- doc-2026-09-09-notitia-criminis-janones
source_ids:
- src-stf-pet16662-peca35-notitia-criminis-janones
excerpt: 'Vídeo atribui a Mendonça a expressão "vagabundo" e a acusação de que afastou Andrei Rodrigues para
  proteger a si mesmo; petição pede prisão em flagrante, quebra de imunidade parlamentar e remessa ao TSE.'
date: '2026-09-09'
notes: 'O documento em si (a petição protocolada) é fato verificável em fonte primária (classe D quanto à
  EXISTÊNCIA e ao CONTEÚDO da petição); mas o próprio conteúdo do vídeo de Janones e a legitimidade da
  notícia-crime não foram verificados de forma independente — os peticionantes não têm vínculo processual
  identificado com o caso, e nenhuma cobertura de imprensa localizada até esta coleta corrobora ou contesta
  os fatos narrados.'
