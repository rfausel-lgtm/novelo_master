id: ev-convenio-009-2023-ms-qualifica-pkl-one-como-banco
kind: evidence
classification: D
proposition: No extrato publicado no diário oficial sul-mato-grossense, a convenente é qualificada como
  'Banco PKL One Participações S.A' — designação que não corresponde a nenhuma autorização do Banco Central
  e que desaparece do instrumento de 2025, onde a empresa figura apenas como 'PKL One Participações S.A.'.
  A consulta da equipe à base oficial do Banco Central, registrada no lote anterior, confirmou que a empresa
  não consta da relação de instituições autorizadas a funcionar no país.
