date: '2025-10-28'
notes: Primeira ligação literal e direta, no acervo, entre a operação do Rioprevidência (conduzida por Rennó)
  e o esquema do Iprev de Maceió — até então tratados como casos paralelos sem conexão documental explícita.
  Não está claro se a frase se refere apenas à estruturação de um fundo similar ou a um plano mais amplo.
