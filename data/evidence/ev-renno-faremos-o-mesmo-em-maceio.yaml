id: ev-renno-faremos-o-mesmo-em-maceio
kind: evidence
classification: D
proposition: 'Em 28/10/2025, Luiz Rennó Netto disse a Vorcaro que seria estruturado um fundo para alocar os
  ativos do Rioprevidência, com cessão de cotas posterior, e acrescentou: "Faremos o mesmo em Maceió" — em
  referência ao RPPS de Maceió (Iprev), que aportou R$ 97 milhões no Master (já documentado no acervo, lote
  294). Vorcaro não respondeu ao comentário sobre Maceió, segundo o documento.'
