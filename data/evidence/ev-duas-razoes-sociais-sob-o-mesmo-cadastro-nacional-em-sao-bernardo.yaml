id: ev-duas-razoes-sociais-sob-o-mesmo-cadastro-nacional-em-sao-bernardo
kind: evidence
classification: I
proposition: 'Anomalia documental que merece verificação antes de qualquer leitura. No julgamento de habilitação
  publicado em 08/12/2023, duas razões sociais distintas figuram deferidas sob o mesmo cadastro nacional
  de pessoa jurídica, e ambas têm termo publicado na mesma data, com objeto e vigência idênticos. Como
  o cadastro nacional identifica uma única pessoa jurídica, a hipótese mais econômica é erro material
  em uma das linhas do diário. A apuração retificou expressamente uma leitura anterior que parecia reforçar
  o vínculo: o sufixo do número de processo não amarra as duas empresas entre si, pois é compartilhado
  com um terceiro credenciado alheio ao grupo. Fica registrado como achado a confirmar em fonte cadastral,
  e não como arranjo estabelecido.'
