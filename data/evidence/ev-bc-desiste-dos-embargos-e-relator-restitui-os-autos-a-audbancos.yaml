id: ev-bc-desiste-dos-embargos-e-relator-restitui-os-autos-a-audbancos
kind: evidence
classification: C
proposition: 'Em 13/01/2026 o Banco Central desistiu dos embargos de declaração no TC 022.950/2025-7, e o
  relator, em despacho, restituiu os autos à AudBancos para prosseguimento: "Ante o pedido de desistência dos
  embargos de declaração formulado pelo Banco Central do Brasil, restituo os autos à AudBancos para
  prosseguimento do feito". Segundo a Agência Brasil, com a retirada do recurso a análise poderia seguir sem
  apreciação pelo Plenário; segundo o Times Brasil, o caso deixava de ser analisado pelo Plenário.'
source_ids:
