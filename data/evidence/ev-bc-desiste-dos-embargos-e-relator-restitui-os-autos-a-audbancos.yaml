excerpt: Ante o pedido de desistência dos embargos de declaração formulado pelo Banco Central do Brasil,
  restituo os autos à AudBancos para prosseguimento do feito
locator: Times Brasil, 14/01/2026, trecho do despacho de 13/01
date: 2026-01-13
notes: Classe C (Agência Brasil e Times Brasil). A Agência Brasil diz que a desistência foi formalizada no
  sistema de consulta pública do TCU, que o Novelo não consultou; o despacho de 13/01 não foi lido na íntegra.
  Nenhuma fonte aberta descreve deliberação do Plenário sobre o tema em 21/01/2026.
