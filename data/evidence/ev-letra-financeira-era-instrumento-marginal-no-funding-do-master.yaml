id: ev-letra-financeira-era-instrumento-marginal-no-funding-do-master
kind: evidence
classification: D
proposition: 'Ressalva de proporção que o corpus deve manter: a letra financeira nunca foi o principal
  instrumento de captação do Banco Master. Em 31/12/2024 as captações totais somavam cerca de R$ 53,9
  bilhões, das quais R$ 30,9 bilhões em depósitos a prazo. As letras financeiras representavam cerca de
  3,9% do total. O que as distingue não é o volume no funding do banco, mas o fato de terem sido absorvidas
  quase inteiramente por um único tipo de investidor — os regimes próprios de previdência.'
