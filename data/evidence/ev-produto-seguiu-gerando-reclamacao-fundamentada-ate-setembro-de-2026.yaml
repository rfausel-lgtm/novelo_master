id: ev-produto-seguiu-gerando-reclamacao-fundamentada-ate-setembro-de-2026
kind: evidence
classification: D
proposition: 'O produto seguiu operando e gerando conflito muito depois das liquidações, e há registro
  oficial disso na data de fechamento desta apuração: o diário de Santos de 10/09/2026 traz quatro protocolos
  contra a operadora sob a marca do produto, todos classificados como fundamentada não atendida — o consumidor
  reclamou, o órgão considerou procedente e a empresa não atendeu. Campinas registra processos em quatorze
  edições entre julho de 2025 e junho de 2026; Bauru, sete ocorrências até dezembro de 2025, com pares
  de protocolo que reúnem operadora e banco no mesmo atendimento.'
