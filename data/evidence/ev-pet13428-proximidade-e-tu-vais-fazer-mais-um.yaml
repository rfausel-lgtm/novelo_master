id: ev-pet13428-proximidade-e-tu-vais-fazer-mais-um
kind: evidence
classification: D
proposition: 'Segundo a representação da PF transcrita na Pet 13.428, a relação entre o deputado Cezinha de
  Madureira e Mariângela Fialek "não é meramente funcional": o deputado e sua esposa viajaram juntos a Lisboa e,
  em 02/07/2025, encontraram-se pessoalmente com Fialek, que escreveu depois "Me deve essa". Em 16/10/2025, ao
  encaminhar ao deputado notícia de reunião dele com o presidente da República e com o então advogado-geral da
  União, "tido como futuro indicado a vaga no Supremo Tribunal Federal", Fialek comentou: "Tu vais fazer mais
  um!" — expressão que, para a PF, "sugere a percepção, pelos envolvidos, de que o representado dispunha de
  capacidade de influenciar a própria composição da Corte perante a qual atuavam". A conclusão da Informação
  de Polícia Judiciária 082/2026, citada na decisão, é que Fialek e Valéria "estabeleceram parceria com o fito
  de obter decisões favoráveis em processos judiciais em trâmite no STF, contando com o auxílio de Cezinha de
  Madureira".'
