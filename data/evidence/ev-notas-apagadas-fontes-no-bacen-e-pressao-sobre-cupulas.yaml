excerpt: De pessoas de dentro do Bacen que são meus amigos e ficaram preocupados
date: '2025-10-30'
notes: 'As identificações de "G", "Andrei" e "Paulo" são hipóteses da própria PF, sinalizadas no
  documento com "provavelmente" — não são atribuições estabelecidas, e assim ficam registradas aqui. O
  documento não identifica o interlocutor a quem as notas se dirigiam, nem nomeia as fontes dentro do
  Banco Central. O fato de as duas notas terem sido apagadas minutos após a escrita é usado pela PF como
  indício de que o próprio autor reconhecia o teor como comprometedor. Nada aqui imputa conduta a
  Galípolo, a Andrei Passos Rodrigues ou a Gonet: eles aparecem como pessoas sobre quem Vorcaro
  pretendia influir, não como participantes do esquema.'
