id: ev-notas-apagadas-fontes-no-bacen-e-pressao-sobre-cupulas
kind: evidence
classification: D
proposition: 'Em 30/10/2025, Daniel Vorcaro escreveu duas notas no iPhone e as apagou poucos minutos
  depois; ambas foram recuperadas na extração forense. Na primeira, às 13h13, registrou que viajaria a
  Abu Dhabi para encontrar um interlocutor não identificado e relatou ter recebido de integrantes do
  Banco Central a informação confidencial de que "G" — provavelmente Gabriel Galípolo, presidente do BC
  — e os demais diretores estariam sob forte pressão da PF e do MPF; pediu que o interlocutor reforçasse
  junto a "Andrei" (provavelmente Andrei Passos Rodrigues, diretor-geral da PF) e "Paulo" (provavelmente
  Paulo Gonet, procurador-geral da República) a necessidade de impedir que subordinados praticassem
  "alguma sacanagem", pois "aí vai tudo pro saco". Na segunda, às 13h38, sob o título "De pessoas de
  dentro do Bacen que são meus amigos e ficaram preocupados", afirmou que essas fontes haviam
  participado da reunião e que as informações eram "100% confiáveis", acrescentando que não poderia
  "queimá-los".'
document_ids:
