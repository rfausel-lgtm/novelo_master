id: ev-stf-are-1312127-afetacao-ao-plenario-e-vista-de-fux
kind: evidence
classification: D
proposition: >-
  No ARE 1.312.127 (União x Raízen Energia S.A. e outras), o portal do STF registra que o relator, Gilmar Mendes,
  despachou e incluiu questão de ordem na lista da 2ª Turma em 22/09/2026, proferiu decisão monocrática registrada
  como "Deferido" em 24/09/2026 e, na sessão virtual de 25/09 a 02/10/2026, indicou a afetação do julgamento ao
  Plenário, para referendo dessa decisão, acompanhado por Dias Toffoli, quando Luiz Fux pediu vista.
document_ids:
- doc-2026-10-16-stf-andamentos-do-are-1312127-uniao-x-raizen
source_ids:
- src-stf-2026-10-16-andamentos-do-are-1312127
- src-poder360-2026-09-22-gilmar-quer-levar-ao-plenario-do-stf-caso-de-precatorios-de-vorcaro
excerpt: >-
  Após a indicação pelo Ministro Gilmar Mendes (Relator) de afetação do julgamento do feito ao Plenário, para
  referendo da decisão monocrática exarada em 24.9.2026, no que foi acompanhado pelo Ministro Dias Toffoli, pediu
  vista dos autos o Ministro Luiz Fux.
date: '2026-09-24'
notes: >-
  Os andamentos não mencionam o Banco Master. O Poder360 (22/09) liga a questão de ordem aos precatórios
  descritos nas mensagens do celular de Vorcaro e diz que ela busca uniformizar a tese das usinas; a ligação é
  do veículo. O conteúdo da decisão de 24/09 não aparece no portal ("Sem Descrição") e não foi lido.
