id: ev-tese-de-grupo-economico-entre-master-e-pkl-one
kind: evidence
classification: D
proposition: Na cautelar do Rio, o Estado e o Rioprevidência sustentam que o Banco Master e a PKL One
  Participações administravam de forma conjunta as carteiras de crédito consignado de servidores, aposentados
  e pensionistas, com indícios de atuação integrada e possível configuração de grupo econômico. Afirmam
  que a PKL teria assumido a exploração comercial do produto CredCesta, 'originado dentro da estrutura
  do próprio Banco Master', beneficiando-se dos mesmos fluxos financeiros. É alegação dos autores, reproduzida
  na decisão judicial; não há, no material lido, reconhecimento judicial do grupo econômico.
