id: ev-consignados-retidos-sao-do-credcesta-e-do-mfacil
kind: evidence
classification: D
proposition: Os produtos cujos repasses foram retidos são o cartão MFácil e o Credcesta, conforme os demonstrativos
  que o liquidante extraiu dos sistemas do banco e juntou aos autos, discriminados por servidor, órgão
  de vinculação, competência e valor de parcela. O Credcesta é o mesmo programa de consignado que a investigação
  parlamentar examinou em outra frente.
