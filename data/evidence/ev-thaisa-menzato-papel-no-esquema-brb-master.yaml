id: ev-thaisa-menzato-papel-no-esquema-brb-master
kind: evidence
classification: A
proposition: 'Segundo a decisão de 15/04/2026 que autorizou busca e apreensão contra ela (Pet 15.771/15.772,
  STF), a advogada Thaísa Menzato teria participação recorrente e tecnicamente qualificada no esquema de
  propina imobiliária ao ex-presidente do BRB Paulo Henrique Costa: assinatura de contratos na sede do Banco
  Master, integração de grupo de WhatsApp que geria os pagamentos indevidos, atuação na elaboração dos
  instrumentos jurídicos de criação da empresa Tirreno e dos contratos de cessão Tirreno-Master, explicações
  sobre a origem dos recursos usados para quitar os imóveis (aportes do FIP Triunfo no FIP Alucard), e alertas
  a Daniel Vorcaro sobre notificações de inadimplemento dos imóveis. Um pagamento de 22/07/2025 é atribuído,
  na decisão, à origem "THAIZA" do escritório Monteiro Rusu.'
