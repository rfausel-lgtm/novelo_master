date: '2026-02-17'
notes: 'Atualizado em 12/09/2026: upgrade de A para D. O IPL 5004641-31.2025.4.03.6181 (peça 13 da PET
  15.198), lido por inteiro, confirma documentalmente o reaproveitamento — a Operação Fundo Fake (IPL
  2020.0044085, Rondônia) aparece entre os anexos comprobatórios do próprio inquérito paulista sobre o
  Master, não apenas na versão do Metrópoles. A reportagem de 17/02/2026 permanece como fonte, agora
  corroborada por documento primário.'
