id: ev-pf-recicla-pericias-da-fundo-fake-no-inquerito-master
kind: evidence
classification: A
proposition: 'A frente rondoniense não foi absorvida como processo pela Operação Compliance Zero — a Fundo
  Fake corre na 3ª Vara Federal Criminal da Seção Judiciária de Rondônia, em primeiro grau, enquanto a
  Compliance Zero tramita no STF. Mas foi reaproveitada como prova: a Polícia Federal reexaminou as perícias
  das investigações anteriores e as usou para apontar modus operandi comum e conexões com fundos no atual
  inquérito do caso Master. Os laudos produzidos em Porto Velho em 2020 viraram insumo do inquérito do
  Supremo em 2026.'
