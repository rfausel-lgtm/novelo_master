inference_basis: 'Varredura própria na tabela de negócios do mercado secundário do boletim diário da B3,
  que identifica o emissor, em amostra sistemática de um a cada cinco dias úteis de 2023 e 2024: 105 dias
  amostrados, 91 com dados, 17.959 registros da família de letras financeiras, 46 emissores distintos,
  nenhuma ocorrência do Banco Master. Por ser amostra e não censo, a proposição é registrada como inferência,
  não como constatação documental fechada.'
