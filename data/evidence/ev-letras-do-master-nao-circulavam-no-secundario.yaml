id: ev-letras-do-master-nao-circulavam-no-secundario
kind: evidence
classification: I
proposition: 'Varredura na tabela de negócios do mercado secundário da B3, que identifica o emissor: em
  amostra de 105 dias úteis de 2023 e 2024 — um a cada cinco —, com 91 dias contendo dados e 17.959 registros
  da família de letras financeiras, distribuídos entre 46 emissores distintos, não há nenhuma ocorrência
  do Banco Master. Os papéis não circulavam. O achado é de amostra, não de censo, e é consistente com
  distribuição por esforços restritos e carregamento até o vencimento — e com a metodologia da ANBIMA,
  que só admite no painel de taxas de referência emissores com liquidez mínima e cotação diária de ao
  menos sete instituições contribuidoras.'
