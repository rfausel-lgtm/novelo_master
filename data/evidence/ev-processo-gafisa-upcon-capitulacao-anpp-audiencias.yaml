id: ev-processo-gafisa-upcon-capitulacao-anpp-audiencias
kind: evidence
classification: D
proposition: 'Leitura direta de 17 comunicações judiciais do processo 5008069-89.2023.4.03.6181 (Gafisa/Upcon)
  via DJEN/CNJ confirma: capitulação penal por uso de informação privilegiada (art. 27-D, Lei 6.385/76),
  fatos de 19/12/2019 a 28/02/2020; denúncia recebida em 28/01/2026; MPF negou ANPP a Nelson Tanure por
  ''diversas reiterações de condutas similares... no âmbito da CVM'', mas ofereceu ANPP ao corréu Gilberto
  Benevides, que recusou; processo suspenso de 28/01 a 08/06/2026 aguardando PAS CVM nº 19957.001817/2024-18
  (mesmos fatos, esfera administrativa); decisão de 31/07/2026 indeferiu suspensão e alegação de inépcia,
  manteve assistente de acusação, e designou audiências de instrução para 20/10/2026 e 18/11/2026.'
