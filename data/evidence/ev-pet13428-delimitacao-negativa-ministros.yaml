notes: Evidência de leitura obrigatória para qualquer ligação entre os investigados e ministros citados. A
  representação prevê que, surgindo elemento indicativo de conduta atribuível a magistrado, o relator e o MPF
  serão informados, sem iniciativa autônoma da polícia.
