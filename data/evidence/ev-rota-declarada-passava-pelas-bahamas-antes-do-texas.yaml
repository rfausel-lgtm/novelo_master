proposition: Segundo o colaborador, técnicos do Banco Central haviam identificado fluxo atípico de recursos da Entrepay,
  empresa do Grupo Entre, em que o dinheiro deixava o Brasil, passava pelas Bahamas e seguia para o Texas — onde
  está sediado o fundo que financiou o filme.
