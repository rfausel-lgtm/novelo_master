notes: 'Detalha e formaliza, por ofício assinado (não mais só por decisão judicial), a acusação já registrada
  em ev-moraes-decisao-assimetria-mendonca-2026-09-03 — a novidade é a lista numerada de condutas específicas
  e o pedido concreto de julgamento conjunto, além da denúncia de que o levantamento de sigilo de 10/09 excluiu
  180 documentos. Alegação de uma parte contra outra em disputa institucional aberta; nenhuma apuração externa
  a confirma até esta coleta.'
