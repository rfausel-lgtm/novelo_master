id: ev-moraes-lista-condutas-de-mendonca-e-pede-julgamento-conjunto-pet16704
kind: evidence
classification: A
proposition: 'Em ofício de 11/09/2026 dirigido a Fachin, Alexandre de Moraes atribui a André Mendonça, na
  relatoria das PETs 15.041 e 15.556: (1) "usurpação da direção das investigações das autoridades policiais,
  inclusive com determinação de medidas administrativas que afastaram a observância da cadeia de custódia";
  (2) "condução irregular das tratativas de eventual colaboração premiada"; (3) "direcionamento de determinados
  alvos para investigação (Ministro Alexandre de Moraes e Senador Davi Alcolumbre), por motivos pessoais e
  políticos, inclusive com a indicação prévia de medidas cautelares a serem apresentadas pela Polícia Federal".
  Pede julgamento conjunto das PETs 16.704 e 16.662 "para evitar risco concreto de decisões contraditórias".'
