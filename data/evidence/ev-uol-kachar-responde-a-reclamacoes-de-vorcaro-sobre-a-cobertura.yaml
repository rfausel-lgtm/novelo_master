id: ev-uol-kachar-responde-a-reclamacoes-de-vorcaro-sobre-a-cobertura
kind: evidence
classification: A
proposition: Segundo o UOL (15/10/2026), quando Daniel Vorcaro reclamou de um post da colunista Malu Gaspar
  sobre o fórum de Londres (abril de 2024), de publicação de outro colunista de O Globo (julho) e de reportagem do Valor (setembro), Kachar respondeu
  "Se tiver algum erro na coluna da Malu, peço a correção imediata", "Não tem campanha alguma, claro" e "Eles
  colocaram os dois lados". A Gazeta do Povo diz ter confirmado as conversas, registra a promessa de Kachar de
  conversar com a colunista em outro episódio e afirma que não há confirmação de que a conversa tenha ocorrido
  ou de que a cobertura tenha sido modificada.
source_ids:
