attributed_to: UOL (Renata Agostini e Tiago Dantas) e Gazeta do Povo (Juliet Manfrin)
date: 2026-10-15
notes: Nenhuma das fontes lidas mostra remoção de conteúdo ou alteração da cobertura. Nada aqui é alegação
  sobre a colunista.
