id: ev-brb-2025-06-17-fato-relevante-cade-aprova
kind: evidence
classification: D
proposition: O Fato Relevante do BRB de 17/06/2025 comunica ao mercado que o Cade aprovou, sem restrições, a
  aquisição de 49,0% das ordinárias, 100% das preferenciais e 58,04% da participação total do Banco Master,
  com a conclusão sujeita às demais condições e aprovações regulatórias pendentes. A evidência vale para o
  comunicado do BRB; o ato do Cade não foi localizado e a aprovação não é tratada aqui como fato verificado no
  próprio órgão.
