id: ev-mensagens-zettel-vorcaro-belline-cobrando
kind: evidence
classification: A
proposition: 'Mensagens de WhatsApp entre Fabiano Zettel e Daniel Vorcaro, reproduzidas pela imprensa
  a partir de apuração da PF: Zettel escreve ''Belline cobrando. Paga?'', Vorcaro responde ''Claro'';
  em outra mensagem, Zettel pergunta ''Hoje tem que pagar a primeira do Belline, ok?'', Vorcaro responde
  ''OK'' e instrui o pagamento por intermediários. A reportagem não indica a data das mensagens nem apresenta
  a imagem original das capturas de tela.'
