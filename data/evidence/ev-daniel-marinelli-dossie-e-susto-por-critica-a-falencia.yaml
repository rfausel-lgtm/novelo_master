excerpt: que fosse dado apenas um susto ou outra ação
date: '2024-08-22'
notes: 'Daniel Marinelli Meira é apontado, sem confirmação independente no acervo, como autor de
  publicações críticas ao banco — Vorcaro chega a perguntar se "tinham certeza" de que fora ele antes de
  autorizar a ação. Entra no acervo como alvo do aparato de vigilância e intimidação de Vorcaro, não como
  parte investigada. O documento não relata se o "susto" ou a ação pela PF foram de fato executados.'
