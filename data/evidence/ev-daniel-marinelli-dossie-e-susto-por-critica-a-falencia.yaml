id: ev-daniel-marinelli-dossie-e-susto-por-critica-a-falencia
kind: evidence
classification: D
proposition: 'Em 22/08/2024, Felipe Mourão identificou que um telefone usado para publicar postagens
  sobre um suposto pedido de falência do Banco Master estava cadastrado em nome de Daniel Marinelli
  Meira, e enviou a Vorcaro um documento com dados pessoais dele. "Os Meninos" baniram o WhatsApp
  associado. Perguntado se Vorcaro queria que "A Turma" fosse atrás de Marinelli — "que fosse dado apenas
  um susto ou outra ação" —, Vorcaro respondeu que sim, indicando que fosse por meio da Polícia Federal.'
document_ids:
