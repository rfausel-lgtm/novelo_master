id: ev-vazamento-noticia-fato-brb-master-genese-compliance-zero
kind: evidence
classification: D
proposition: 'Em 16/07/2024, o MPF instaurou Notícia de Fato para apurar a demissão de dois gerentes da
  Caixa Econômica Federal que teriam se posicionado contra a compra, pelo Banco Master, de R$ 500 milhões
  em letras financeiras — episódio que, segundo a PF, constitui o marco inicial da própria Operação
  Compliance Zero, que culminaria na prisão de Daniel Vorcaro em 17/11/2025. Dois dias depois, em
  18/07/2024, Felipe Mourão já enviou a Daniel Vorcaro o arquivo do procedimento reservado, obtido pelo
  acesso ilícito ao sistema Único do MPF. Em 30/07/2024, um novo extrato do procedimento, novamente
  gerado pelo perfil da servidora Alina Boueres, foi enviado a Vorcaro. A PF registra ainda que Vorcaro
  tinha, no próprio celular, a íntegra de um Relatório de Inteligência Financeira (RIF nº
  84719.3.2793.4976) enviado à Procuradoria-Geral da República sobre o mesmo assunto.'
