excerpt: CRIME CONTRA O SISTEMA FINANCEIRO NACIONAL. Apurar eventual ocorrência de crimes contra o sistema
  financeiro nacional e conexos, na aquisição do Banco Master S/A pelo Banco de Brasília - BRB, cujo
  acionista majoritário é o Governo do Distrito Federal - GDF.
date: '2024-07-16'
notes: É o achado mais grave desta cadeia de acessos ilícitos ao MPF — não um procedimento qualquer, mas
  o próprio documento que deu origem à investigação que, 16 meses depois, prenderia Vorcaro. Significa
  que a organização criminosa teve acesso, em tempo real, ao nascimento da investigação que a alcançaria.
  A PF qualifica o documento como de "natureza reservada", o que reforça a irregularidade do acesso.
