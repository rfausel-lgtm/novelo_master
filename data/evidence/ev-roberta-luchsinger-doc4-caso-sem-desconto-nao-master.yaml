id: ev-roberta-luchsinger-doc4-caso-sem-desconto-nao-master
kind: evidence
classification: D
proposition: O 'DOC.4' do relatório de inteligência apócrifo citado na decisão de Mendonça menciona nominalmente
  Roberta Moreira Luchsinger, avaliando se 'a imputação [...] e a medida cautelar requerida em seu desfavor
  observam, de forma consistente, o critério de graduação que a própria representação enunciou' — no contexto
  da Operação Sem Desconto (fraude em descontos do INSS), não do caso Banco Master. É checagem interna
  da PF sobre consistência de critérios entre casos, não nova imputação contra ela. O corpus já havia
  confirmado, por busca textual direta no relatório da PF sobre o celular de Vorcaro, zero ocorrências
  do nome dela ou de termos associados à família presidencial ligados ao Master — esta menção, em documento
  distinto e sobre matéria distinta, não altera aquela conclusão nem estabelece qualquer vínculo dela
  com o Master.
