excerpt: o último valor da demonstração financeira apresentada pelo Banco Master indicam que a captação
  do banco, salvo engano, era até abril de 2024 com captação total de letras financeiras perfaziam um
  montante de mais ou menos R$ 680 milhões, o que o preocupou também em relação a concentração que eventualmente
  a Amprev pode ter nesse produto especifico do emissor
