proposition: 'Inventário dos procedimentos que o alcançam, todos sem decisão até 04/09/2026: representação
  do Partido Novo ao MPF no Distrito Federal por improbidade administrativa e representação à Comissão
  de Ética Pública da Presidência por conflito de interesses, ambas de 04/05/2026, sobre a viagem custeada
  — peças assinadas pelo desembargador aposentado Sebastião Coelho, à época pré-candidato ao Senado pelo
  mesmo partido; convite (não convocação) aprovado em 14/04/2026 na Comissão de Segurança Pública da Câmara,
  sem registro localizado de comparecimento; notícia-crime da oposição à PGR em 01/09/2026; pedido do
  Novo de afastamento cautelar em 02/09 e de prisão preventiva em 03/09, ambos a Mendonça; e a Petição
  16.704, aberta por Fachin em 03/09, com prazo de cinco dias úteis. Não há inquérito instaurado contra
  ele no STF, indiciamento, denúncia, decisão judicial que o atinja, nem procedimento conhecido na Corregedoria-Geral
  da PF. Ele permanece no cargo, sem exoneração, afastamento ou licença; o Palácio do Planalto, procurado,
  não se manifestou.'
