id: ev-sequencia-encontros-vespera-terceira-fase-turma
kind: evidence
classification: D
proposition: A decisão de 13/05/2026 reconstrói, por cruzamento de mensagens e diligências externas, uma
  sequência de encontros e contatos entre Marilson Roseno da Silva, Sebastião Monteiro Júnior, Luiz Phillipi
  Mourão, Henrique Vorcaro e Manoel Mendes Rodrigues nos dias 01 a 03/03/2026 — véspera da 3ª fase da
  Operação Compliance Zero (04/03/2026) — incluindo um encontro reservado de cerca de 1h10 entre Marilson
  e Sebastião em 01/03/2026, e contatos telefônicos simultâneos entre Marilson (dentro do carro de Mourão),
  Henrique Vorcaro e Manoel Mendes em 02-03/03/2026.
