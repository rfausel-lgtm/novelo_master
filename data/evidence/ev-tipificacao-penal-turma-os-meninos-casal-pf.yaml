id: ev-tipificacao-penal-turma-os-meninos-casal-pf
kind: evidence
classification: D
proposition: 'A representação da PF de maio de 2026 imputa a Henrique Moura Vorcaro, Anderson Wander da
  Silva Lima, Sebastião Monteiro Júnior e Manoel Mendes Rodrigues — integrantes de "A Turma" — os tipos
  do art. 2º, §2º, da Lei nº 12.850/2013 (organização criminosa armada, ou com participação de agentes
  de segurança pública) e art. 325, caput, do Código Penal (violação de sigilo funcional). À delegada
  Valéria Vieira Pereira da Silva e ao agente aposentado Francisco José Pereira da Silva imputa apenas o
  art. 325 CP, registrando que o aprofundamento das investigações poderá esclarecer se o casal integra
  a organização criminosa ou praticou atos de corrupção. Ao núcleo "Os Meninos" (David Henrique Alves,
  Rodrigo Pimenta Franco Avelar Campos e Victor Lima Sedlmaier) atribui inserção na mesma organização
  criminosa, como braço de ataques cibernéticos, incluindo invasão de sistemas governamentais para acesso
  a dados sigilosos.'
