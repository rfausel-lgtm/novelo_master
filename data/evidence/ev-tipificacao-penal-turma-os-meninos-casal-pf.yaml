date: '2026-05'
notes: 'O mesmo trecho registra que a PF deixou de imputar o crime de ameaça (art. 147 CP) em desfavor de
  Leandro Garcia e Luis Felipe Woyceichoski por decadência (falta de representação no prazo de 6 meses),
  embora os fatos ameaçadores permaneçam narrados alhures na representação. É a primeira vez que o acervo
  registra a tipificação penal específica atribuída a cada núcleo — até este ponto, os lotes anteriores
  tratavam apenas dos fatos, não do enquadramento legal formal.'
