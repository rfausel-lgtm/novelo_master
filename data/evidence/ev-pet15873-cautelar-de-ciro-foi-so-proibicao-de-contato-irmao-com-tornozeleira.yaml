id: ev-pet15873-cautelar-de-ciro-foi-so-proibicao-de-contato-irmao-com-tornozeleira
kind: evidence
classification: D
proposition: Na decisão de 07/05/2026 da Pet 15.873, a única medida imposta ao senador Ciro Nogueira foi a proibição de
  contato com testemunhas e investigados da Compliance Zero; o irmão dele, Raimundo Neto e Silva Nogueira Lima, e Bernardo
  Rodrigues de Oliveira Filho, descrito como operador de inserção de dinheiro em espécie, receberam proibição de contato,
  de sair do município e do país, com entrega de passaporte, e tornozeleira eletrônica; Felipe Cançado Vorcaro teve
  prisão temporária decretada, e quatro empresas tiveram as atividades suspensas.
document_ids:
