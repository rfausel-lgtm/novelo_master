date: '2026-05-07'
notes: 'As empresas suspensas são CNLF Empreendimentos Imobiliários, BRGD S.A., Green Investimentos S.A. e Green Energia
  FIP Multiestratégia. O MPF concordou integralmente com a representação. Detalha o registro genérico de
  ev-stf-nova-fase-ciro-nogueira-2026-05-07, que falava em cautelares ao senador sem especificá-las.'
