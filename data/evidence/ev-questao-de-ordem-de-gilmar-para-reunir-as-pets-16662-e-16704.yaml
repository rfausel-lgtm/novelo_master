id: ev-questao-de-ordem-de-gilmar-para-reunir-as-pets-16662-e-16704
kind: evidence
classification: D
proposition: Na sessão de 15/09/2026, o que se discutiu não foi o mérito, e sim uma questão de ordem suscitada por
  Gilmar Mendes para (i) reunir, por continência, a PET 16.662 e a PET 16.704; (ii) redistribuir os feitos após
  o apensamento; (iii) certificar todos os magistrados mencionados no processo do Banco Master sobre os quais recaiam
  indícios de recebimento de valores indevidos; e (iv) abrir prazo para manifestação da PGR e dos juízes citados.
