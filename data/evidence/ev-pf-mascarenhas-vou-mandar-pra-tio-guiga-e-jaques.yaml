proposition: Segundo a representação da PF da 9ª fase, em conversa com Daniel Vorcaro sobre o banco ser visto como
  próximo do governo, Fernando de Goes Mascarenhas Filho, diretor comercial do Banco Master, escreveu "vou mandar
  então pra tio guiga e Jaques", que a PF interpreta como referência direta a Guilherme Sodré Martins e ao senador
  Jaques Wagner.
