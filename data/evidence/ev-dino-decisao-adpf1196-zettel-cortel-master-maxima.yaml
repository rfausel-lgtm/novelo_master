id: ev-dino-decisao-adpf1196-zettel-cortel-master-maxima
kind: evidence
classification: D
proposition: 'Na decisão de 15/09/2026 (ADPF 1.196), o Min. Flávio Dino recapitula que, segundo despacho
  próprio de 07/04/2026, "documentos relativos à empresa concessionária Cortel - dentre eles cinco atas
  lavradas no período compreendido entre 2022 e 2025 - teriam sido subscritos por Fabiano Zettel, à época
  conselheiro da concessionária, mediante endereços eletrônicos institucionais vinculados tanto ao Banco
  Master quanto ao Banco Máxima". A Prefeitura de SP juntou o Processo Administrativo
  9310.2026/0000600-9 (SP Regula) sobre o tema; a Cortel, em resposta a ofício da SP Regula de 10/02/2026,
  declarou que Zettel "não é acionista e deixou o conselho em outubro de 2025, negando qualquer vínculo
  financeiro ou societário com o banco mencionado". Há também Inquérito Civil 0695.0000483/2025 no MP-SP
  sobre possíveis irregularidades na concessão e o vínculo Cortel/Banco Master.'
