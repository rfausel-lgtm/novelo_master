notes: Leitura do veículo, sem citar documento. O Poder360 informa que as mudanças foram deliberadas em
  assembleias do FGC em setembro de 2025 e janeiro de 2026 e registra a afirmação do CMN de que não afetam as
  liquidações recentes. O Novelo não afirma nexo causal entre o caso Master e a resolução.
