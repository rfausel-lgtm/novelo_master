id: ev-fgc-impacto-total-574bi-deficit-171bi
kind: evidence
classification: A
proposition: Segundo reportagem que sintetiza o relatório anual de 2025 do FGC, o impacto total do episódio
  Master no balanço do fundo somou R$ 57,4 bilhões (R$ 51,8 bilhões em provisões de pagamento mais R$
  5,6 bilhões em empréstimos/exposições diretas a instituições do grupo), resultando em déficit contábil
  de R$ 17,1 bilhões e queda do patrimônio líquido de R$ 140,4 bilhões (2024) para R$ 123,2 bilhões (fim
  de 2025). A liquidez do fundo caiu 41,4%, de R$ 114,1 bilhões para R$ 66,8 bilhões.
