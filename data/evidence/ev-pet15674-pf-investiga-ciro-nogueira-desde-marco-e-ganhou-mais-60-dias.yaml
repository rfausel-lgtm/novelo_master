id: ev-pet15674-pf-investiga-ciro-nogueira-desde-marco-e-ganhou-mais-60-dias
kind: evidence
classification: D
proposition: Existe no STF, desde 12/03/2026, a PET 15.674, pedido de delegado da Polícia Federal que tem Ciro Nogueira
  como requerido, distribuída a André Mendonça por prevenção ao INQ 5.026; em 20/08/2026 Mendonça prorrogou por 60 dias
  o prazo para as diligências complementares da PF.
document_ids:
