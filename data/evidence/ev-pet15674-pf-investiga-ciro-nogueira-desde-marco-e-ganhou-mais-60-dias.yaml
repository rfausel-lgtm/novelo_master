date: '2026-03-12'
notes: 'O processo antecede em quase dois meses a fase de 07/05/2026 da Pet 15.873, já registrada no acervo, e segue
  aberto com peças sigilosas. O número apareceu numa procuração de Ciro Nogueira no INQ 5.035, apontada por uma sessão
  paralela do projeto, e foi conferido aqui nos andamentos públicos. Com os 60 dias contados de 20/08, o novo prazo vai
  até meados de outubro de 2026. Não há denúncia.'
