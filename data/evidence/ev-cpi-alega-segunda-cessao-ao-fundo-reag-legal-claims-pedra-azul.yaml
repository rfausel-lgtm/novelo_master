proposition: Segundo o Requerimento 310/2026 da CPI do Crime Organizado, reproduzido na petição de Ibaneis Rocha,
  o escritório Ibaneis Advocacia e Consultoria também realizou uma operação de cessão de direitos creditórios com
  o fundo Reag Legal Claims, atualmente operando sob o nome Pedra Azul FIDC — sem que o documento consultado detalhe
  valor ou data dessa segunda operação.
