id: ev-grupo-gilmar-dino-moraes-quer-retirar-relatoria-mendonca
kind: evidence
classification: A
proposition: 'Segundo a Poder360, os ministros Gilmar Mendes, Flávio Dino e Alexandre de Moraes desejam
  retirar a relatoria do caso Banco Master de André Mendonça. Isso está alinhado com apuração anterior
  do mesmo veículo (06/09/2026): esse mesmo grupo (Gilmar, Dino, Cristiano Zanin e Moraes) já articulava,
  àquela data, um acordo com o Planalto para preservar Moraes das suspeitas envolvendo Vorcaro; nesse
  cenário, era ''dado como certo'' que, em caso de reeleição de Lula, haveria forte movimento para retirar
  Mendonça da relatoria dos casos Master e INSS. Busca por corroboração independente (fora da Poder360)
  que nomeasse esse grupo especificamente perseguindo a retirada da relatoria não localizou outra fonte
  verificável até a data desta apuração.'
