id: ev-metade-da-margem-do-cartao-fluminense-e-destinada-a-credito-por-norma
kind: evidence
classification: D
proposition: O dispositivo menos notado do decreto é o que melhor descreve o produto. O §2º do art. 6º
  determina que os compromissos do cartão criado 'para apoiar e facilitar a aquisição de bens e serviços
  no comércio local' sejam distribuídos 'na proporção de 50% da sua respectiva margem de consignação para
  utilização em compras no comércio local e 50% para financiamento de despesas decorrentes de serviços
  creditícios, financeiros, securitários e congêneres contratados por meio do referido cartão'. Um instrumento
  apresentado como apoio ao comércio local tem, por determinação normativa, metade de sua margem destinada
  a crédito, seguro e congêneres. A fórmula 'creditícios, financeiros, securitários e congêneres' é a
  mesma do decreto baiano de 2018 e dos contratos que dele derivaram.
