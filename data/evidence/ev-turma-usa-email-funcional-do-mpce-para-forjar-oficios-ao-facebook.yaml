id: ev-turma-usa-email-funcional-do-mpce-para-forjar-oficios-ao-facebook
kind: evidence
classification: D
proposition: Em outubro de 2024, a 'Turma' usou o e-mail funcional de uma servidora do Ministério Público do Ceará
  para enviar ao Facebook/Meta, pelo canal de solicitações de autoridades, um ofício com aparência de ter sido emitido
  pelo Grupo Especial de Combate à Corrupção do MP-CE — com assinatura sem validade digital e nome do signatário
  divergente do da promotora titular do órgão —, obtendo a remoção da conta-alvo.
