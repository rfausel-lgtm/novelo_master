id: ev-wajngarten-nega-assessor-juridico
kind: evidence
classification: A
proposition: 'Confirmando ter sido contratado pelo Banco Master no primeiro semestre de 2025, por indicação
  dos advogados de Vorcaro, Wajngarten negou atuar como assessor jurídico: ''Onde está escrito serviços
  advocatícios? Quem disse isso?'' Definiu o próprio trabalho como ''defesa de mídia e imprensa. Defesa
  de crises'' — participando de reuniões sobre estratégia de comunicação, sem revelar o conteúdo do contrato,
  protegido por cláusula de confidencialidade.'
