id: ev-rui-costa-admite-que-o-cartao-explicava-o-preco
kind: evidence
classification: C
proposition: 'Contraditório do ex-governador Rui Costa, cuja formulação é relevante por explicitar a natureza
  do ativo: ''Eu vendi um supermercado falido, vocês acompanharam. Teve (leilão) três vezes, só consegui
  vender na terceira vez, um supermercado que dava quase R$ 200 milhões de prejuízo todo ano.'' E, sobre
  o cartão consignado: ''Se não (estivesse inclusa a operação do cartão), nem tinha vendido. Se alguém
  pagou uma merreca de R$ 15 milhões, é porque tinha o cartão.'' A declaração sustenta a defesa da operação
  — uma estatal deficitária que o Estado não conseguia vender — e, ao mesmo tempo, reconhece que o valor
  pago se explicava pelo direito de explorar a folha dos servidores, não pelas lojas. Jaques Wagner, ao
  depor na CPMI do INSS em 26/02/2026, sustentou que a privatização era necessária diante de prejuízos
  anuais de até R$ 80 milhões. Augusto Lima não respondeu aos contatos da reportagem; o governo de Jerônimo
  Rodrigues declarou, em 25/03/2026, aguardar parecer da Procuradoria-Geral do Estado para avaliar o contrato,
  que segue vigente.'
