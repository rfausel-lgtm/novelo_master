proposition: 'Na noite de 08/09/2026, segundo apuração exclusiva da Poder360, houve articulação paralela
  entre integrantes do governo Lula e o ministro Flávio Dino para reverter a decisão de André Mendonça
  (afastamento de Andrei Rodrigues) antes que o presidente do STF, Edson Fachin, se posicionasse — Andrei
  Rodrigues avisou o Planalto que recorreria diretamente a Dino. Fachin não tinha conhecimento dessa articulação:
  passou o dia 08/09/2026 tentando uma solução própria, via recurso da AGU dirigido a ele mesmo, dando
  um prazo de 3 dias a Mendonça para se manifestar. Busca dirigida por corroboração independente (Migalhas,
  Conjur, Metrópoles, CNN Brasil, Estadão, Folha, O Globo, JOTA, Valor) não localizou, até a data desta
  apuração, outra fonte que descrevesse de forma específica e independente essa articulação paralela —
  permanece, portanto, apuração exclusiva da Poder360.'
