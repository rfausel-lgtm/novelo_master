id: ev-cmn-res-5279-estatuto-art-10-par-5-associadas-em-intervencao-ou-liquidacao-extrajudicial-nao-recolhem-contribuicoes
kind: evidence
classification: D
proposition: O texto consolidado da Res. CMN 4.222 (v19, BC) marca como incluído pela Res. CMN 5.279, de
  22/1/2026, o § 5º do art. 10 do estatuto do FGC, segundo o qual as instituições associadas submetidas a
  regime de intervenção ou de liquidação extrajudicial não estão sujeitas ao recolhimento das contribuições ao
  FGC.
