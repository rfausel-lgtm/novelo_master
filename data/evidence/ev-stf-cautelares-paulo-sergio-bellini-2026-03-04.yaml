id: ev-stf-cautelares-paulo-sergio-bellini-2026-03-04
kind: evidence
classification: D
proposition: 'A decisão do ministro André Mendonça na PET 15556, de 04/03/2026, impôs cautelares a servidores
  do Banco Central por suposta interlocução direta com Vorcaro na supervisão bancária do Banco Master.
  Segundo a imprensa, com base na decisão e em apuração da PF, os dois servidores identificados são Paulo
  Sérgio Neves de Souza (ex-diretor de Fiscalização) e Bellini Santana (ex-chefe-adjunto da Desup): tornozeleira
  eletrônica para ambos, e para Paulo Sérgio também proibição de contato com testemunhas, proibição de
  acesso ao BC, restrição de viagem, entrega de passaporte em 48h e suspensão da função pública. Nenhum
  dos dois teve prisão preventiva decretada.'
