id: ev-pas-cvm-03-2016-nunca-julgado
kind: evidence
classification: D
proposition: O processo administrativo sancionador PAS CVM SEI 19957.008699/2019-01 (PAS 03/2016), em
  que Benjamim Botelho de Almeida e outros são acusados de operação fraudulenta caracterizada pelo oferecimento
  de vantagens financeiras ilícitas a prefeitos e gestores de regimes próprios de previdência, NÃO FOI
  JULGADO. Consta da planilha oficial 'Processos a Julgar (Por Relator)' da CVM, na posição de 31/01/2026,
  como Inquérito Administrativo pendente de julgamento, sob relatoria do diretor João Carlos de Andrade
  Uzêda Accioly, com início de relatoria em 24/05/2022. O rastro público das pautas do Colegiado mostra
  que o processo circulou entre relatores por sucessivos impedimentos até a redistribuição de 24/05/2022
  — que é a última menção pública a ele em toda a base da CVM. O Relatório de Atividade Sancionadora do
  1º trimestre de 2026 registra que 'de janeiro a março deste ano, não foram julgados processos pelo Colegiado
  da CVM'; dos 49 processos julgados em 2025, este não estava entre eles. Passaram-se mais de nove anos
  desde a instauração do inquérito, em 02/03/2016, e mais de quatro anos sem registro público de movimentação.
