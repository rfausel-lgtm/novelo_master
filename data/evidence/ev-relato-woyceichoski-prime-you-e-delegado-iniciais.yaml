id: ev-relato-woyceichoski-prime-you-e-delegado-iniciais
kind: evidence
classification: A
proposition: 'Durante o cumprimento do mandado contra ele na 3ª fase da Compliance Zero (04/03/2026, PET 15.562/DF),
  Luís Felipe Woyceichoski relatou espontaneamente à equipe da PF, sem apresentar documento de apoio: que uma pessoa
  identificada como "M.M." figuraria formalmente como proprietário da empresa "Prime You", mas seria, segundo ele,
  testa de ferro de Daniel Vorcaro; que "T.G.", apontada como diretora de operações da mesma empresa, estaria envolvida
  no agenciamento de acompanhantes em festas; que um delegado da Polícia Civil, identificado como "R.M.", teria
  comparecido a uma embarcação a mando de "M.M." para intimidar funcionários; e que uma pessoa identificada apenas
  como "M." o teria ameaçado por WhatsApp, dizendo trabalhar a serviço de Vorcaro e dispor de policiais federais em
  sua "equipe".'
