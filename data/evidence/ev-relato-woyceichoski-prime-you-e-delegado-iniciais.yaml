notes: 'Relato de testemunha única, sem qualquer documento de apoio no material lido — nenhuma outra peça do lote
  cita "Prime You", nem confirma o papel atribuído a cada uma das pessoas mencionadas. Os nomes completos, conhecidos
  pela equipe que leu a peça original, foram substituídos por iniciais nesta publicação por decisão editorial de
  17/09/2026: são acusações criminais graves — inclusive de agenciamento de acompanhantes e de uso da função pública
  por um delegado de polícia — feitas por uma única pessoa, sem lastro documental, contra terceiros que não tiveram
  oportunidade de se manifestar nestes autos. Nenhuma relação de grafo foi criada para "M.M.", "T.G.", "R.M." ou "M.":
  um nó de identidade instável (iniciais, sem outro dado de qualificação) tende a atrair fusão indevida com pessoa
  real no futuro, o que a regra do acervo contra identificação de homônimos sem documento veda. ATENÇÃO PARA A
  DIFERENÇA: o verbete de Woyceichoski já registra, por fonte distinta (extração do celular de Vorcaro, lote 203),
  um "Marcus Vinícius da Mata", presidente da Solar Administração de Bem Próprio S.A., como provável interlocutor
  do áudio em que Vorcaro comenta a ameaça a Woyceichoski. A semelhança de sobrenome com o "M.M." deste relato é
  chamativa, mas nada no material lido identifica os dois como a mesma pessoa — trata-se de hipótese não confirmada,
  registrada aqui apenas para não se perder de vista, nunca como identidade estabelecida.'
