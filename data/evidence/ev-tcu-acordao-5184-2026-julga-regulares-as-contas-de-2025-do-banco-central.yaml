id: ev-tcu-acordao-5184-2026-julga-regulares-as-contas-de-2025-do-banco-central
kind: evidence
classification: D
proposition: Em 20/10/2026, a 2ª Câmara do TCU, no Acórdão 5184/2026 (relator Jorge Oliveira, Ata 36/2026),
  levantou o sobrestamento determinado pelo Acórdão 5.163/2026, julgou regulares as contas de 2025 do Banco
  Central do Brasil (TC 007.138/2026-1), dando quitação plena aos nove responsáveis listados, e arquivou os
  autos.
