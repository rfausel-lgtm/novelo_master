locator: acórdão, dispositivo
date: 2026-10-20
notes: D demonstra o que a 2ª Câmara decidiu no TC 007.138/2026-1, não qualquer fato sobre a supervisão do
  Banco Master pelo BC, que é objeto de outros processos. O acórdão não menciona o TC 022.950/2025-7 nem o TC
  008.216/2025-8. Texto lido no portal de jurisprudência do TCU (21/10/2026), coincidente com o PDF hospedado
  pelo Poder360. CPFs não registrados.
