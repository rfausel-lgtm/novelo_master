id: ev-asteba-asseba-tetos-reais-vs-6-7-bilhoes
kind: evidence
classification: D
proposition: Em 2025, a Asteba e a Asseba somavam 52.176 e 51.111 autorizações de desconto em contracheque,
  respectivamente, segundo ofício da Secretaria de Administração do Estado da Bahia; mesmo na hipótese mais
  generosa, o teto agregado dessas autorizações giraria em torno de R$ 1 bilhão — muito aquém dos R$ 6,7
  bilhões em crédito consignado que a operação Master-BRB atribuiu às duas associações.
