id: ev-eduardo-mendonca-identificado-enteado-pf-234mi
kind: evidence
classification: A
proposition: 'Reportagens (O Antagonista/DCM, Jornal Sete, coluna da Metrópoles) identificam Eduardo Mendonça
  Sodré Martins, sob a alcunha ''Dudu'', como o ''enteado pessoa física'' do senador Jaques Wagner a quem
  a PF atribui o recebimento de R$ 2,34 milhões — valor que já constava no corpus como fato classe D (decisão
  do STF/Pet 16.229, lida diretamente), mas sem nome do beneficiário. A identificação nominal em si é
  secundária: a matéria original do DCM não pôde ser lida diretamente (bloqueio de acesso automatizado),
  e a relação entre esse nome e o quadro societário já conhecido da BN Financeira (Bonnie Toaldo Bonilha,
  Moisés Dantas dos Santos) não foi reconciliada.'
