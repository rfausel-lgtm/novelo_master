proposition: 'CONFIRMADO POR LEITURA DIRETA: a decisão de Mendonça na Pet 16.229 (17/06/2026), lida integralmente
  pela equipe, identifica no item I.3 Eduardo Mendonça Sodré Martins como enteado de Jaques Wagner e transcreve,
  no §34, a mensagem de 04/09/2025 a Augusto Ferreira Lima: ''Amanhã vence os boletos e são altos'', com
  a resposta de Augusto sobre o cenário ''crítico''. O documento cita separadamente R$ 3,5 milhões (transferência
  PKL One→BN Financeira) e mais de R$ 2,34 milhões (pagamentos a ''Dudu''), sem somá-los.'
