id: ev-augusto-lima-devolve-remuneracao-indevida
kind: evidence
classification: D
proposition: Augusto Ferreira Lima recebeu remuneração indevida de R$ 1.089.222,35 entre junho de 2024 e
  agosto de 2025 — período posterior à sua saída formal da sociedade do Banco Master, anunciada em maio de
  2024 —, restituiu integralmente o valor e recebeu do Master, por declaração assinada por Daniel Vorcaro,
  quitação ampla e irrevogável.
