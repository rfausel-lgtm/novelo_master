id: ev-cmn-res-5279-estatuto-art-31-nomes-ao-bc-e-posse-condicionada-a-termos-e-carta-de-confidencialidade
kind: evidence
classification: D
proposition: O texto consolidado da Res. CMN 4.222 (v19, BC) marca como redação dada pela Res. CMN 5.279, de
  22/1/2026, o caput do art. 31 do estatuto do FGC e o caput do seu § 1º, segundo os quais os nomes eleitos
  para o Conselho de Administração e para a Diretoria Executiva são submetidos ao Banco Central para avaliação
  dos requisitos exigidos. O § 1º, I, marcado como incluído pela 5.279, condiciona a posse à assinatura do
  termo de posse, do termo de ciência e acordo ao Código de Conduta Ética do FGC e de carta de compromisso de
  confidencialidade dirigida ao BC.
document_ids:
  - doc-2026-01-22-res-cmn-5279-redacoes-no-texto-consolidado-da-res-4222
