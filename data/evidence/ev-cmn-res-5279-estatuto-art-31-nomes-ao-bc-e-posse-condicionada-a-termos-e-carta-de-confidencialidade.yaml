excerpt: têm sua posse condicionada à assinatura do termo de posse
locator: Anexo I (estatuto), art. 31, caput e § 1º, caput (redação dada); § 1º, I (incluído)
date: 2026-01-22
notes: D demonstra o conteúdo do dispositivo; não diz que o BC tenha avaliado ou rejeitado qualquer nome.
