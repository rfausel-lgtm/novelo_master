summary: ' Correção posterior, a partir da leitura do texto normativo paranaense: o caso do Paraná não
  contradiz a sequência por ausência de norma, e sim porque a norma existia desde 2016 — a lei de 2021
  apenas ajustou a redação do dispositivo de margem, que ainda dizia ''cartão de crédito'', à designação
  do produto já em operação.'
