id: ev-a-empresa-chega-antes-e-a-norma-se-acomoda-depois
kind: evidence
classification: C
proposition: 'Testada com datas exatas, a hipótese de que um decreto criava a margem e o credenciamento
  vinha poucos dias depois só se sustenta em parte dos casos — e a regularidade real é outra. Confirmam
  a sequência a Bahia de 2018, o Amapá de 2023, São Paulo estado (55 dias entre decreto e credenciamento)
  e o município de São Paulo (49 dias). Contradizem-na o Paraná, onde a empresa obteve código de desconto
  em 24/08/2021 sob o regime antigo e a margem exclusiva só nasceu em 28/10/2021, e o Espírito Santo,
  onde ela foi credenciada pela Assembleia Legislativa em 15/09/2022 e pelo município da Serra em 10/07/2023,
  com o decreto de margem vindo apenas em 24/08/2023. Em Mato Grosso do Sul não houve decreto novo: o
  que mudou foi o objeto do convênio. O padrão que resiste ao teste não é ''a norma abre e a empresa entra'',
  mas ''a empresa chega primeiro e a norma se acomoda depois'' — com a ressalva de que, onde a norma veio
  antes, ela criou a categoria jurídica sem a qual uma holding não financeira não poderia consignar.'
