id: ev-mendonca-questiona-procedencia-do-hd-e-nomeia-quatro-delegados
kind: evidence
classification: D
proposition: 'Em despacho de 13/09/2026, André Mendonça reconhece "divergência de informações" sobre as
  circunstâncias em que o material do Ofício nº 33V/2026-CINQ/CGRC/DICOR/PF (08/03/2026, um domingo) chegou ao
  seu gabinete, "não tendo sido indicada nenhuma decisão que contivesse a referida determinação". Pede que a
  Presidência determine, em 24h, que os delegados Daniel Mostardeiro Cola, Wedson Cajé Lopes, Victor Arruda de
  Oliveira e Guilherme Alves de Siqueira — subscritores da representação inicial da Pet 15.556 — prestem
  informações sobre essas circunstâncias e sobre eventuais "constrangimentos sofridos ao longo das
  investigações".'
document_ids:
