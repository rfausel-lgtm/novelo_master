excerpt: divergência de informações em torno das circunstâncias nas quais o material [...] aportou ao Gabinete
  deste Ministro, não tendo sido indicada nenhuma decisão que contivesse a referida determinação
attributed_to: Ministro André Mendonça, em despacho de 13/09/2026
date: '2026-09-13'
notes: Não está estabelecido se há de fato irregularidade na entrega do material a Mendonça em março, ou se é
  apenas lacuna documental a esclarecer; o próprio despacho pede que os delegados relatem "constrangimentos
  sofridos", sem especificar a natureza suspeitada.
