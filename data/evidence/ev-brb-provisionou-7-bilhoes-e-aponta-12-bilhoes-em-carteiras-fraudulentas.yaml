id: ev-brb-provisionou-7-bilhoes-e-aponta-12-bilhoes-em-carteiras-fraudulentas
kind: evidence
classification: A
proposition: Em petição de 20/07/2026, o BRB afirma ter adquirido R$ 22.989.790.491,43 em carteiras do Master e
  do Will Bank entre julho de 2024 e outubro de 2025, das quais estima em cerca de R$ 12 bilhões as carteiras da
  Tirreno como fraudulentas; registra ter provisionado R$ 7.355.253.036,76 conforme a Resolução CMN 4.966/2021 e
  reconhecido R$ 2 bilhões de prejuízo residual depois de substituir parte das carteiras por fundos e CCBs de atacado.
document_ids:
- doc-2026-07-20-brb-peticao-afastamento-resolucao-4966-rcl88121
source_ids:
- src-stf-rcl88121-autos-pecas
attributed_to: Banco de Brasília (BRB), em petição própria
date: '2026-07-20'
notes: Valores declarados pelo próprio BRB para fundamentar pedido de afastamento de norma contábil que lhe é desfavorável;
  não são apuração independente da PF ou de auditoria externa. A notícia de ágio de R$ 2,4 bilhões, citada na mesma
  petição, vem de imprensa e não é confirmada documentalmente nela.
