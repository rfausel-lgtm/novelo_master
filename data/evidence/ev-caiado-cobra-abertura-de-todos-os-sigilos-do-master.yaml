proposition: 'Em 10/09/2026, o governador de Goiás, Ronaldo Caiado, criticou publicamente Alexandre de Moraes
  por anunciar e cancelar minutos depois um pronunciamento — o primeiro do ministro desde que Fachin o
  afastou da relatoria do Inquérito das Fake News — e cobrou a abertura de todos os sigilos ligados ao Banco
  Master, sem exceção de cargo: "O que queremos mesmo é a abertura de TODOS os sigilos do Banco Master:
  ministro, presidente, candidato, senador… todos!"'
