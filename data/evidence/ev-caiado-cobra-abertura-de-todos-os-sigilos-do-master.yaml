notes: É a primeira manifestação de um governador em exercício, no acervo, pedindo publicamente o levantamento
  total dos sigilos do caso Master. Não fica claro a quem exatamente ele se refere com "presidente, candidato,
  senador" — pode ser cobrança genérica.
