id: ev-valadao-intermediou-vorcaro-nikolas-abril-2024
kind: evidence
classification: A
proposition: 'Segundo mensagens e áudios revelados pelo ICL Notícias, em 27/04/2024 Daniel Vorcaro pediu a André
  Valadão: "De novo pedir sua ajuda com Nikolas. Estão usando a fala dele pra me atacar, por conta de patrocínio num
  evento em Londres." Em áudios de 29/04/2024, Valadão relatou ter procurado o deputado Nikolas Ferreira ("Eu
  preferia que você falasse com ele primeiro") e resumiu: "Ele nem sabia sobre o banco e você, ''palavras dele'', e
  daí pediu perdão demais". Em vídeo de 03/09/2026, Valadão confirmou ter feito "uma interlocução entre pessoas que
  eu conheço", sugerindo que os dois conversassem diretamente.'
