id: ev-bc-segundo-nota-citada-pela-imprensa-medidas-visam-mitigar-o-risco-moral-das-captacoes-com-garantia-do-fgc
kind: evidence
classification: A
proposition: Segundo nota do Banco Central citada pela Reuters (Money Times), pelo Capital Aberto e pela
  Folhapress, as medidas aprovadas pelo CMN em 23/04/2026 complementam o arcabouço existente e visam mitigar o
  risco moral associado a captações excessivamente ancoradas na garantia do FGC.
