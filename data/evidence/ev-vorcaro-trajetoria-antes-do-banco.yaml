id: ev-vorcaro-trajetoria-antes-do-banco
kind: evidence
classification: A
proposition: 'Antes de entrar no setor bancário, Vorcaro — nascido em Belo Horizonte em 1983, formado
  em Economia com MBA pelo Ibmec — atuou em empresas do setor imobiliário da família, entre elas a Multipar,
  holding fundada pelo pai, Henrique Moura Vorcaro, e originada das empresas Vorcaro Imóveis e Centro
  Sul Empreendimentos. Há duas versões sobre seu primeiro negócio: em perfil de 2021, ele próprio afirmou
  ter começado aos 19 ou 20 anos prestando consultoria a um sistema educacional e, após a morte do fundador,
  comprado o negócio dos herdeiros para reestruturá-lo e revendê-lo; reportagens posteriores registram
  que ele administrava uma editora de livros didáticos do próprio pai, vendida por divergências gerenciais.
  Antes do banco houve ainda um empreendimento hoteleiro de luxo para a Copa de 2014, de R$ 200 milhões,
  que não deu certo. O patrimônio imobiliário familiar era real e de décadas em Belo Horizonte, mas de
  porte incompatível com a aquisição de um banco.'
