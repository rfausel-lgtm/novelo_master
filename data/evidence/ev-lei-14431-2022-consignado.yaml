id: ev-lei-14431-2022-consignado
kind: evidence
classification: D
proposition: A Lei nº 14.431, de 3 de agosto de 2022, resultante da conversão da Medida Provisória nº
  1.106/2022, elevou o teto de comprometimento da remuneração no consignado de 35% para 40% para empregados
  regidos pela CLT e de 35% para 45% sobre benefícios do RGPS, e autorizou a contratação de empréstimos
  por beneficiários do Benefício de Prestação Continuada e de programas federais de transferência de renda.
