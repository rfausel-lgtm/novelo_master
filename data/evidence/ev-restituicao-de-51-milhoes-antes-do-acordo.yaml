id: ev-restituicao-de-51-milhoes-antes-do-acordo
kind: evidence
classification: A
proposition: 'Contraprova relevante à leitura de leniência: segundo a CNN Brasil, Centara e Simsan restituíram
  mais de R$ 51 milhões aos investidores em junho e julho de 2019 — antes, portanto, da apreciação do
  termo de compromisso. Isso sustenta a tese do relator e da autarquia de que não havia dano a indenizar,
  requisito do art. 11, §5º, II, da Lei 6.385/76, e é elemento que qualquer avaliação do percentual de
  4,7% precisa confrontar.'
