id: ev-moriah-asset-compra-veiculos-luxo-2025
kind: evidence
classification: D
proposition: 'A Moriah Asset Empreendimentos e Participações Ltda (empresa de Fabiano Zettel, já no acervo)
  comprou, em 2025, ao menos três veículos de luxo somando R$ 4,95 milhões: um Range Rover 2024/2025 por
  R$ 1,53 milhão (28/04/2025, dado como entrada para o pagamento de um segundo Range Rover 2024/2025 de R$
  1,17 milhão em 06/06/2025), um Cadillac Escalade por R$ 1,6 milhão (04/12/2025) e um Audi RS6 por R$ 650
  mil (02/12/2025). O COAF registra ter colocado o cliente em "monitoramento reforçado" diante da forma de
  negociação (entradas com veículos usados, trocos elevados) e por informações de que o sócio controlador
  seria "pastor da Igreja Bola de Neve" em São Paulo e Belo Horizonte, além de apontado, segundo publicações
  citadas pelo próprio COAF, como um dos maiores doadores das campanhas do ex-presidente Jair Bolsonaro e
  do atual governador de São Paulo.'
