id: ev-monte-siao-haras-nao-inclui-dalide-nem-vinculo-de-parentesco-confirmado
kind: evidence
classification: D
proposition: O Monte Sião Haras Ltda., aberto em 02/10/2024, tem como sócias Raquel Patrícia Alvarenga Alves Corrêa
  e Renato Pereira de Carvalho. Dalide não integra o quadro, e nenhuma fonte pública localizada afirma parentesco
  entre ela e Raquel — a coincidência é apenas de sobrenome.
