id: ev-ligga-notificacao-socio-minoritario-400-milhoes
kind: evidence
classification: A
proposition: Em 29/01/2026, o sócio minoritário Agnaldo Bastos Lopes (4,13% da Ligga via SR22 Adm. de
  Bens, recebido em 2022 na venda da Nova Fibra Telecom à Ligga) enviou notificação extrajudicial alegando
  que mais de R$ 1 bilhão captado via debêntures incentivadas — que por lei deveria financiar infraestrutura
  — não teve essa destinação, e que cerca de R$ 400 milhões teriam sido desviados para o Banco Master,
  enquanto a companhia enfrentava inadimplência com fornecedores. A notificação também questiona a falta
  de transparência na venda da Ligga à Brasil TecPar; pedidos de informação da minoria estavam pendentes
  desde 05/12/2025.
