inference_basis: Confronto entre dois parágrafos da mesma decisão judicial e o registro societário da
  Receita Federal, que qualifica sua posição como diretoria e não como participação acionária. A impossibilidade
  de verificar o quadro acionário de sociedade anônima fechada impede conclusão definitiva, e isso é registrado
  como limite.
