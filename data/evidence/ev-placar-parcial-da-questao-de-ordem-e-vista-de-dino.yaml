id: ev-placar-parcial-da-questao-de-ordem-e-vista-de-dino
kind: evidence
classification: D
proposition: 'A questão de ordem estava 3 a 4 quando foi interrompida: acolhiam-na Gilmar Mendes, Cristiano Zanin
  e Alexandre de Moraes; não a acolhiam Edson Fachin, identificado na certidão como Presidente e Relator, André
  Mendonça e os votos antecipados de Luiz Fux e Cármen Lúcia. Nunes Marques está impedido, Dias Toffoli afirmou
  suspeição e Flávio Dino pediu vista. Nada foi decidido, e o mérito não chegou a ser votado.'
document_ids:
