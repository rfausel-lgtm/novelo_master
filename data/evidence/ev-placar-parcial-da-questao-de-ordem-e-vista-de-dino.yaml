source_ids:
- src-stf-pet16662-certidao-de-julgamento-15-09-2026
excerpt: pediu vista dos autos o Ministro Flávio Dino. Anteciparam seus votos o Ministro Luiz Fux e a Ministra Cármen
  Lúcia, ambos acompanhando o Presidente. Impedido o Ministro Nunes Marques. Afirmou suspeição o Ministro Dias Toffoli.
date: '2026-09-15'
notes: 'Parte da cobertura descreveu o resultado como decisão de 4 a 3 por analisar separadamente os casos de Moraes
  e de Mendonça. A certidão mostra o contrário: a proposta era reunir os dois feitos, e o placar é parcial, de um
  julgamento suspenso por vista.'
