id: ev-defesa-vorcaro-2026-11-02-alega-uso-de-conversas-com-advogados-e-vazamentos-do-celular
kind: evidence
classification: D
status: unverified
proposition: Segundo a nota da defesa de Daniel Vorcaro, comunicações dele com seus advogados foram extraídas
  do celular apreendido, analisadas em relatórios da Polícia Federal e depois divulgadas sem decisão judicial
  que autorizasse o acesso, e houve vazamento de conteúdos do aparelho; a defesa pede que os vazamentos cessem
  e que essas comunicações sejam retiradas dos autos. É alegação da defesa; não foi localizada manifestação da
  PF, e o acervo não reproduz o conteúdo de nenhuma conversa.
