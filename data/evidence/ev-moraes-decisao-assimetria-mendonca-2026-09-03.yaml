id: ev-moraes-decisao-assimetria-mendonca-2026-09-03
kind: evidence
classification: A
proposition: 'Em decisão de 03/09/2026, Alexandre de Moraes apontou ''fortes indícios da prática de improbidade
  administrativa, abuso de autoridade e crime de responsabilidade'' na condução das investigações por
  André Mendonça, com base em relatório da PF sobre ''assimetria'': (1) tratamento diferenciado por alinhamento
  político — Mendonça teria avaliado o caso de ACM Neto (direita) como dentro da legalidade, enquanto
  tratou de forma distinta casos ligados a nomes da esquerda como Lulinha, apesar de ''similaridade relevante''
  entre os casos; (2) ritmo mais lento de decisões em casos contra políticos de direita frente a decisões
  mais rápidas afetando figuras de esquerda — a própria PF registrou ''baixa'' confiança nessa conclusão,
  por amostra pequena. Moraes alegou ainda ''usurpação da direção'' das Petições 15.041 (Operação Sem
  Desconto, fraude no INSS) e 15.556 (Compliance Zero, Banco Master), com ''intencionalidade preconceituosa''
  contra colegas de Corte e rivais políticos, citando nominalmente o presidente do Senado, Davi Alcolumbre.
  Encaminhou o caso a Fachin para providências. Esclarecimento necessário: o relatório compara a atuação
  do relator em dois inquéritos distintos e sob a mesma relatoria — Compliance Zero, que é o caso do Banco
  Master, e Sem Desconto, que é a fraude no INSS. As pessoas citadas de cada lado são diferentes: ACM
  Neto está do lado do Master; Fábio Luís Lula da Silva e Roberta Luchsinger, do lado do INSS. A co-ocorrência
  dos dois casos num mesmo documento decorre da relatoria comum, e não de vínculo entre as pessoas — a
  busca textual nas peças primárias do caso Master não retorna nenhuma ocorrência dos nomes ligados ao
  caso do INSS.'
