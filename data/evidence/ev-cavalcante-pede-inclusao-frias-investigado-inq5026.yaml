id: ev-cavalcante-pede-inclusao-frias-investigado-inq5026
kind: evidence
classification: D
proposition: A Deputada Luciene Cavalcante apresentou, no INQ 5.026, "Requerimento de inclusão de
  investigado e apuração de fatos novos" em face do Deputado Mario Frias, com base no áudio divulgado pelo
  Intercept Brasil em 19/05/2026 em que ele teria agradecido a Daniel Vorcaro pelo fomento a obra
  cinematográfica sobre Jair Bolsonaro. Em 06/07/2026, o pedido foi desentranhado para autuação em petição
  autônoma, conexa ao inquérito.
