id: ev-marcio-domingues-descreve-noctua-e-excelsior
kind: evidence
classification: D
proposition: Segundo Márcio Domingues dos Santos, Daniel Monteiro tentou constituir, para administrar seus próprios
  investimentos sem pagar gestora externa, a Noctua Asset — assinada por volta de outubro ou novembro de 2025 e
  dissolvida sem nunca operar, por não conseguir contratar os dois CGAs que a ANBIMA passou a exigir a partir de
  janeiro de 2026 — e depois a Excelsior Capital, o mesmo projeto com estrutura menor, que também não chegou a obter
  registro na CVM ou na ANBIMA nem a movimentar um real.
