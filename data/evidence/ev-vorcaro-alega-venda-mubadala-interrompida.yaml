proposition: Em depoimento, Vorcaro afirmou que a venda do Will Bank ao fundo Mubadala Capital (Abu Dhabi)
  estava praticamente concluída, faltando apenas assinaturas, e seria formalizada em 18/11/2025 — mesma
  data em que o BC decretou a liquidação do Master —, mas foi interrompida pela ação da PF e do BC. A
  venda não se concretizou; alegação do próprio Vorcaro, sem confirmação independente localizada.
