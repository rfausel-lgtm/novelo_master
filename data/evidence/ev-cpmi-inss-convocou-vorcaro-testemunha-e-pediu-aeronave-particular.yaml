date: '2026-02-03'
notes: A primeira data marcada foi 05/02/2026 — ofício de 29/01/2026 do presidente da CPMI, Carlos Viana, à
  Reclamação 88.121, que também afirma que Vorcaro cumpria prisão domiciliar por decisão do relator e argumenta
  que as ADPFs 395 e 444 não alcançam as CPIs; o adiamento para 26/02 veio a pedido da defesa. Terceira frente
  parlamentar a buscar o depoimento de Vorcaro no mesmo mês, ao lado da CAE e da CPI
  do Crime Organizado. O pedido de transporte em aeronave particular da defesa contrasta com a decisão de
  19/02/2026 do relator seguinte, André Mendonça, que no caso da CAE vedou expressamente o deslocamento em
  aeronave particular. Não foi localizada decisão sobre este pedido da CPMI nem registro de que Vorcaro
  tenha deposto à comissão em 26/02/2026 — data em que o acervo registra o depoimento de Rui Costa à mesma CPMI.
