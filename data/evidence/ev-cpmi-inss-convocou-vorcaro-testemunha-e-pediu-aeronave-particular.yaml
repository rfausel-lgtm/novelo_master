id: ev-cpmi-inss-convocou-vorcaro-testemunha-e-pediu-aeronave-particular
kind: evidence
classification: D
proposition: A CPMI do INSS convocou Daniel Vorcaro como testemunha para 26/02/2026, recusou depoimento
  por videoconferência e pediu ao então relator, Dias Toffoli, que declarasse o comparecimento compulsório
  e autorizasse o transporte em aeronave particular dos próprios advogados de defesa, com escolta da
  Polícia Legislativa do Senado.
