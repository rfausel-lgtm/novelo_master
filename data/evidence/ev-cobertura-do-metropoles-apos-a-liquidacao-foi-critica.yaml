inference_basis: Leitura comparativa, feita pela equipe, da cobertura publicada pelo veículo sobre o caso
  Banco Master antes e depois da liquidação de 18/11/2025, cotejada com a de veículos comparáveis. Antes,
  a cobertura é factual e em parte institucional; depois, é ampla e em pontos pioneira, incluindo a revelação
  do contrato de R$ 129 milhões do escritório Barci de Moraes, em 09/12/2025.
