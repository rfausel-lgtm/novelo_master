id: ev-cobertura-do-metropoles-apos-a-liquidacao-foi-critica
kind: evidence
classification: I
proposition: 'Teste objetivo, e o resultado é favorável ao veículo: depois da liquidação, a cobertura
  do Metrópoles sobre o caso foi ampla e em vários pontos pioneira. Foi o veículo que revelou, em 09/12/2025,
  o contrato de R$ 129 milhões entre o Banco Master e o escritório Barci de Moraes — matéria contrária
  a interesses poderosos e que se tornou peça central da cobertura nacional. Publicou ainda planilhas
  exclusivas sobre a compra de ativos pelo BRB. É evidência contrária à hipótese de captura editorial,
  e o corpus a registra com o mesmo peso das demais.'
