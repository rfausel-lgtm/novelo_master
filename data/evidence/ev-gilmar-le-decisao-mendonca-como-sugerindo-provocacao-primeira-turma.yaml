excerpt: a decisão de afastamento cautelar registra elementos que sugerem que o relatório de inteligência teria sido produzido pelo Diretor-Geral da Polícia Federal por provocação de membro da Primeira Turma desta Corte
date: '2026-09-08'
notes: 'Verificação de precisão: conferido o texto integral da decisão de Mendonça de 08/09/2026
  (doc-2026-09-08-decisao-mendonca-afasta-andrei-pet16662) — as expressões "provocação" e "Primeira Turma"
  NÃO aparecem nela. Trata-se de leitura/inferência do próprio Gilmar Mendes sobre o que a decisão
  "sugere", não de citação literal de Mendonça. É uma quarta via de atribuição, independente e distinta da
  já registrada em `ev-waldvogel-cita-andrei-relatorios-solicitados-por-moraes` (que trata da alegação de
  que Moraes teria "solicitado" os relatórios, via jornalista Waldvogel citando Andrei, citado por
  Mendonça) — aqui é o próprio Gilmar, por escrito, em voto oficial.'
