id: ev-gilmar-le-decisao-mendonca-como-sugerindo-provocacao-primeira-turma
kind: evidence
classification: A
proposition: 'No voto de vista de 08/09/2026, Gilmar Mendes afirma que "a decisão de afastamento cautelar
  registra elementos que sugerem que o relatório de inteligência teria sido produzido pelo Diretor-Geral da
  Polícia Federal por provocação de membro da Primeira Turma desta Corte; tomada essa premissa nos termos
  em que formulada pelo Relator, a competência para exame dos atos imputados a integrante do Tribunal é do
  Plenário, e não da Segunda Turma". Como Alexandre de Moraes integra a Primeira Turma, a frase admite
  leitura como referência indireta a ele — mas Gilmar não o nomeia expressamente.'
attributed_to: Ministro Gilmar Mendes, em voto de vista de 08/09/2026
