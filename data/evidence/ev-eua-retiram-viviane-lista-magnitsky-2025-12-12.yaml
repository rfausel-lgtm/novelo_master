id: ev-eua-retiram-viviane-lista-magnitsky-2025-12-12
kind: evidence
classification: A
proposition: 'Em 12/12/2025, o governo americano retirou Alexandre de Moraes, Viviane Barci de Moraes
  e o Instituto Lex da lista de sanções da Lei Magnitsky, sem explicação pública do Tesouro. Nem Moraes
  nem Viviane comentaram a remoção. Eduardo Bolsonaro, que dizia ter articulado as sanções originais,
  lamentou a decisão: ''Lamentamos que a sociedade brasileira, diante da janela de oportunidade que teve
  em mãos, não tenha conseguido construir a unidade política''.'
