id: ev-palhares-redigiu-minutas-contrato-viking-barci-de-moraes
kind: evidence
classification: C
proposition: 'Segundo material cujo sigilo foi levantado em 01/09/2026, Leonardo Palhares foi o advogado
  que estruturou o contrato entre a Viking Participações, holding de Daniel Vorcaro, e o escritório Barci
  de Moraes Sociedade de Advogados, da esposa do ministro Alexandre de Moraes — contrato de até R$ 50
  milhões, com R$ 40 milhões pagos em participações societárias em duas empresas proprietárias de aeronaves.
  Em 13/05/2025 Vorcaro lhe envia a minuta; em 16/05/2025 Palhares responde com ''duas minutas para vc
  escolher o deal'', apresentando duas estruturas — transferência imediata dos ativos com opção de recompra
  por R$ 1, ou entrega apenas após a execução do serviço — e alerta para o ''risco reputacional'' de manter
  ativos ainda em nome de Vorcaro sendo usados por terceiros, sugerindo a transferência imediata para
  reduzir exposição. Vorcaro responde: ''os ativos são deles… já''. O contrato é assinado em 19/05/2025.
  Isso liga o mesmo operador jurídico que assinou o instrumento apontado como fictício para pagar um servidor
  do Banco Central à estruturação dos contratos do escritório da esposa do ministro — duas frentes até
  então tratadas separadamente no acervo.'
