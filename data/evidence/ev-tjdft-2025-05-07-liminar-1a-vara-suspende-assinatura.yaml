id: ev-tjdft-2025-05-07-liminar-1a-vara-suspende-assinatura
kind: evidence
classification: D
proposition: Segundo nota de imprensa do TJDFT de 07/05/2025, a 1ª Vara da Fazenda Pública do DF concedeu
  liminar, em ação do MPDFT, que suspende a assinatura do contrato definitivo do BRB para a aquisição parcial
  do Banco Master até a autorização da assembleia de acionistas e a aprovação legislativa. A nota é
  comunicação do próprio tribunal, não o texto da decisão, e atribui a cada parte a sua tese.
