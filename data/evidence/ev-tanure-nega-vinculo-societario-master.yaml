id: ev-tanure-nega-vinculo-societario-master
kind: evidence
classification: A
proposition: Por meio do advogado Pablo Naves Testoni, Nelson Tanure negou categoricamente qualquer vínculo
  societário com o Banco Master, afirmando relação 'estritamente comercial, como cliente'; disse 'jamais
  ter enfrentado qualquer processo criminal' e nunca ter realizado operação que convertesse dívida em
  participação societária no Master, direta ou indiretamente. Anunciou que apresentaria documentos sobre
  a origem lícita de seus negócios e buscaria reverter judicialmente o bloqueio de bens determinado por
  Dias Toffoli.
