id: ev-uol-patrocinio-e-adiantamentos-do-master-a-cartacapital
kind: evidence
classification: A
proposition: Segundo o UOL (15/10/2026), com base em mensagens extraídas pela PF, a CartaCapital fechou em
  2021 contrato de patrocínio de cinco anos com o Banco Máxima (depois Master), que adiantara R$ 300 mil em
  dezembro de 2020; Manuela Carta pediu "mais um recurso para a próxima folha de pagamentos" no início de
  2021, discutiu em 2023 a possível entrada de Vorcaro como sócio, que não se concretizou, e pediu em 2024
  "adiantamento de publicidade".
