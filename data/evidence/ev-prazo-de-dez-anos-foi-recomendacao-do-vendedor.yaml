id: ev-prazo-de-dez-anos-foi-recomendacao-do-vendedor
kind: evidence
classification: D
proposition: O prazo de dez anos — que a decisão judicial trata como elemento da gestão temerária — foi
  recomendado pelo próprio vendedor, na apresentação de março de 2024, com a justificativa de que era
  o vértice que 'paga melhor taxa' e de que se ajustaria ao perfil da carteira de crédito consignado do
  banco, com vencimentos de 60 a 90 meses.
document_ids:
- doc-2024-03-14-ata-4a-ext-ciap-apresentacao-do-master
source_ids:
- src-amprev-ata-4a-ext-ciap-2024
excerpt: letras financeiras com diversos prazos de vencimentos, o melhor é o prazo de dez anos onde paga
  melhor taxa, é justificável o prazo, por conta do perfil da carteira de crédito da instituição, pois
  o crédito consignado tem vencimentos de 60, 70, 80 e 90 meses
