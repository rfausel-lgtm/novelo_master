classification: D
proposition: 'A ata da 140ª reunião do Comitê de Investimentos de Congonhas, de 07/05/2024, registra que
  foi o consultor financeiro Renan Calamia, da Crédito e Mercado, quem sugeriu a compra de cerca de R$
  14 milhões em letras financeiras com vencimento em dez anos, fixando como critério que se optasse por
  instituições no mínimo S3 e presentes na lista exaustiva da Secretaria de Previdência. Ele aparece em
  todas as dez atas do comitê publicadas em 2024. A ata não nomeia o emissor: a identificação com o Banco
  Master decorre do valor, do prazo e da data da compra subsequente.'
