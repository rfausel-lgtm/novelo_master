id: ev-master-argumentou-nao-precisar-da-lista-exaustiva
kind: evidence
classification: D
proposition: Na mesma apresentação, o Banco Master sustentou não estar obrigado a constar da lista exaustiva
  da Secretaria de Previdência, argumentando que a exigência alcança gestores de fundos de investimento
  e não emissores de ativo próprio, e invocando parecer de escritório de advocacia e consulta feita via
  GesCon por um cliente da instituição. Previu que, ainda assim, passaria a constar da lista em julho.
