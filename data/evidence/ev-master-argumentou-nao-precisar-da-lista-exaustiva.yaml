excerpt: em relação a lista exaustiva da Secretaria de Previdência, falou que a obrigatoriedade é para
  gestores de fundos de investimentos, mas o Banco Master oferta o ativo financeiro emitido pelo banco,
  nesse sentido, não há obrigação do Banco Master constar na lista exaustiva
