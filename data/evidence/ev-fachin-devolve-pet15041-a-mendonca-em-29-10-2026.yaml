id: ev-fachin-devolve-pet15041-a-mendonca-em-29-10-2026
kind: evidence
classification: D
proposition: Na decisão de 29/10/2026 na PET 16.704, o Presidente do STF determinou a devolução ao ministro
  André Mendonça, relator originário, dos autos dos procedimentos da Operação Sem Desconto (PET 15.041)
  remetidos à Presidência em 12/09/2026, pela ausência, ao menos no presente momento, de elementos concretos
  e suficientemente individualizados que justifiquem mantê-los na Presidência.
document_ids:
