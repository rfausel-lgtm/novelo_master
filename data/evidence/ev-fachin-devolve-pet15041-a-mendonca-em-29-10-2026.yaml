excerpt: ausência, ao menos no presente momento, de elementos concretos e suficientemente individualizados
locator: PET 16.704/DF, decisão de 29/10/2026, p. 9-10 (dispositivo I)
attributed_to: Presidente do STF, Edson Fachin, decisão de 29/10/2026
date: 2026-10-29
notes: Status unverified até a conferência da cópia (divulgada pelo Poder360) no portal do STF. A decisão não
  afirma nem nega ligação entre as investigações; diz só que não identificou, por ora, elementos de conexão
  com a matéria de competência funcional do Plenário e da Presidência, e que essa conclusão não é afirmação
  definitiva de inexistência de conexão nem juízo sobre os fatos ou as pessoas (p. 9).
