id: ev-celina-leao-nega-ter-participado-das-negociacoes-do-brb-com-o-master
kind: evidence
classification: A
proposition: >-
  Em três manifestações públicas, Celina Leão negou ter participado das negociações do BRB com o Master: em
  vídeo de 15/09/2026, "Seis meses antes de qualquer tipo de operação, eu já era contrária" (Poder360); em
  sabatina ao SBT de 16/09/2026, "Eu não tenho o contato do Daniel Vorcaro" (SBT News); em sabatina de O
  Globo/CBN de 18/09/2026, "Não tem um diálogo onde ele fala que eu participei, que dia que eu participei",
  disse que as mensagens foram "tiradas de contexto" e que só viu Vorcaro em festas públicas (Estadão
  Conteúdo).
