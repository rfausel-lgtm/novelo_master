id: ev-pf-e-pgr-divergem-sobre-o-que-foi-feito
kind: evidence
classification: D
proposition: Há divergência frontal entre dois documentos oficiais sobre a natureza do mesmo ato. A Polícia
  Federal afirma não ter realizado atos de aprofundamento investigativo dirigidos a magistrados. O procurador-geral
  da República sustenta que 'é inegável que houve imersão em elementos dos autos para buscar indicativos
  de envolvimento do Ministro Alexandre de Moraes em ilícitos' e que o relator 'impôs a investigação'
  do ministro. É divergência de qualificação jurídica sobre o mesmo fato, não sobre o fato em si.
