id: ev-emendas-ao-pl-412-circularam-no-celular-de-vorcaro
kind: evidence
classification: D
proposition: Em 22/10/2023, o contato identificado pela PF como José Antonio Ramos Bittencourt enviou a Daniel Vorcaro
  três emendas ao PL 412/2022 — as de números 26, 27 e 28, de autoria do senador Efraim Filho —, dizendo serem 'fundamentais
  serem aplicadas ao PL'. A própria PF confere no sítio do Senado que essas emendas já haviam sido protocoladas
  em 20/09/2023, um mês antes de circularem no celular do banqueiro.
