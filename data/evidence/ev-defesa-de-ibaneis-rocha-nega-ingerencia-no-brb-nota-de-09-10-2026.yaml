id: ev-defesa-de-ibaneis-rocha-nega-ingerencia-no-brb-nota-de-09-10-2026
kind: evidence
classification: A
proposition: >-
  Segundo o Metrópoles, a CNN Brasil e a Jovem Pan (09 e 10/10/2026), a defesa de Ibaneis Rocha (conduzida,
  segundo o Metrópoles, por Antônio Carlos de Almeida Castro, o Kakay) afirmou que ele "não pressionou e
  tampouco teve qualquer ingerência nas operações realizadas pelo BRB", que Paulo Henrique Costa "detinha total
  autonomia para condução das negociações", que Ibaneis "não é interlocutor direto em nenhuma mensagem com
  Daniel Vorcaro" e que "seu nome somente é mencionado pela Polícia Federal em quatro oportunidades".
