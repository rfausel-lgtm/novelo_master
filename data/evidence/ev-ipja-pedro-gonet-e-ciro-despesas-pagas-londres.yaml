id: ev-ipja-pedro-gonet-e-ciro-despesas-pagas-londres
kind: evidence
classification: D
proposition: Em 11/04/2025, funcionária de Vorcaro pergunta se nomes 'estão aprovados por vc para irem
  pra Londres com despesas pagas por nós'; Vorcaro não aprova a lista, mas faz a ressalva de que 'Pedro
  e ciro ok', em referência, segundo o laudo, a Pedro Gonet e Ciro Soares. Em mensagens de 29/03 e 19/06/2025,
  Ciro Soares havia perguntado a Vorcaro se 'o filho dele' e depois 'o Pedrinho filho do PG' poderiam
  ir a Londres com o grupo; Vorcaro respondeu afirmativamente nas duas ocasiões. O evento de Londres referido
  nesse trecho é o mesmo fórum jurídico de 2025 já registrado no corpus (segunda edição, que não chegou
  a se realizar).
