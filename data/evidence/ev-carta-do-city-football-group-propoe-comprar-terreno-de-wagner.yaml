id: ev-carta-do-city-football-group-propoe-comprar-terreno-de-wagner
classification: D
proposition: Em 27/02/2025, o City Football Group (Midco) propôs a Jaques Wagner e Maria de Fátima Mendonça comprar
  o terreno do casal em Tererê, Camaçari — cerca de 44.000 m², 9,6% da área do condomínio planejado junto ao CT
  do Bahia —, em troca de 3,36% do valor de vendas ou da área de lotes, com adiantamento de R$ 4 milhões; a proposta
  foi aceita em 25/04/2025.
