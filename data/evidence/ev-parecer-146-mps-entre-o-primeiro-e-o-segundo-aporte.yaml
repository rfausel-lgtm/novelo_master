id: ev-parecer-146-mps-entre-o-primeiro-e-o-segundo-aporte
kind: evidence
classification: D
proposition: Em 15/07/2024 — três dias depois do primeiro aporte de R$ 200 milhões e quatro dias antes
  do segundo — o Ministério da Previdência Social emitiu o Parecer nº 146/2024 recomendando a avaliação
  de riscos reputacionais antes de aplicações, enumerando sanções do Banco Central e da CVM, investigações,
  exposição negativa na mídia e estrutura societária. O comitê aprovou novo aporte quatro dias depois.
