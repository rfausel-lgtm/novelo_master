id: ev-rj-processo-que-autorizou-a-pkl-nao-consta-do-sistema
kind: evidence
classification: C
proposition: 'Apuração jornalística registra que o processo administrativo que embasou a autorização da
  PKL One, despachada em 01/06/2021 pelo então secretário de Estado da Casa Civil, Nicola Miccione, não
  aparece no Sistema Eletrônico de Informações do governo fluminense — nem mesmo como registro sigiloso,
  condição em que processos protegidos ainda deixam rastro no mecanismo de busca. O contraste é interno
  ao próprio caso: o processo que originou o decreto está identificado no preâmbulo da norma, com número
  e unidade. A equipe também não localizou publicação da autorização no Diário Oficial estadual nas edições
  imediatamente posteriores. Registro adicional: por quase quatro anos a PKL One foi a única empresa autorizada
  a operar cartão de benefício com desconto em folha no Estado, exclusividade que não decorre de cláusula
  normativa — o decreto não a prevê — mas da prática administrativa.'
