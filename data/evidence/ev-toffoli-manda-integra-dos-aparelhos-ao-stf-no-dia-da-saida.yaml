date: '2026-02-12'
notes: 'O fundamento declarado da ordem de Toffoli é garantir às defesas o acesso previsto na Súmula Vinculante
  14, depois de uma delas relatar que a PF condicionava a entrega dos laudos a autorização específica, pelo
  volume dos arquivos; ele já havia mandado dar amplo acesso em 03 e 05/02/2026. A sequência com a decisão de
  Mendonça é registrada como fato cronológico — os dois despachos tratam de fases e peças processuais
  distintas (INQ 5.026 e Pet 15.198), e nenhum menciona o outro. Cobertura jornalística já registrada no
  acervo atribui a Mendonça, em outra operação (Sem Desconto), exigência de envio de extrações brutas ao STF.'
