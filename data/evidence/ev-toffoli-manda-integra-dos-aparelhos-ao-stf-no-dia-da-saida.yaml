id: ev-toffoli-manda-integra-dos-aparelhos-ao-stf-no-dia-da-saida
kind: evidence
classification: D
proposition: Em 12/02/2026 — mesmo dia em que deixou a relatoria do caso — Dias Toffoli determinou à Polícia
  Federal que enviasse imediatamente ao STF, na íntegra, o conteúdo dos aparelhos e mídias apreendidos, os
  laudos periciais sobre esse material e os demais elementos de prova ainda não juntados ao INQ 5.026. Doze
  dias depois, o novo relator, André Mendonça, autorizou a PF a seguir o fluxo pericial ordinário, dispensado
  o encaminhamento global das extrações à relatoria.
