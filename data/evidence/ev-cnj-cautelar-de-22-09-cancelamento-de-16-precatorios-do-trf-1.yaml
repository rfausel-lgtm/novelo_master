excerpt: A devolução não extingue nem reduz o crédito, que seguirá em discussão nas vias próprias.
locator: Num. 6777898, págs. 7-9
date: '2026-09-22'
notes: >-
  D demonstra o conteúdo da decisão, que é cautelar e não decide se os créditos existem. Assinatura eletrônica
  em 22/09/2026, às 23h37; notícia oficial do CNJ em 23/09. A notícia do CNJ de 28/09 chama esta decisão "de 23
  de setembro" (data da divulgação).
