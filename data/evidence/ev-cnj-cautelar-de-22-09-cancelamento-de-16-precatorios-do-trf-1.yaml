id: ev-cnj-cautelar-de-22-09-cancelamento-de-16-precatorios-do-trf-1
kind: evidence
classification: D
proposition: >-
  Em 22/09/2026, o corregedor nacional de Justiça, ministro Benedito Gonçalves, deferiu cautelar no PP
  0007917-89.2026.2.00.0000 (requerente AGU, requerido TRF-1) para suspender decisões da Presidência do TRF-1 em
  três suspensões de liminar, restabelecer decisões de 10/09/2026 da 6ª Vara Federal Cível da SJDF e determinar,
  em cinco dias, o cancelamento de 16 precatórios (R$ 4.738.065.026,73) das beneficiárias Companhia Açucareira
  Usina Capricho, Una Agroindustrial S/A e Companhia Açucareira Vale do Ceará Mirim, com devolução dos valores à
  Conta Única do Tesouro Nacional e vedação de levantamentos e de destaque de honorários até a restituição; a
  decisão foi submetida a referendo do Plenário.
document_ids:
