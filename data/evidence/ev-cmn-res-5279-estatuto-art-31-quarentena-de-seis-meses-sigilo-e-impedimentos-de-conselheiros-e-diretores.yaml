id: ev-cmn-res-5279-estatuto-art-31-quarentena-de-seis-meses-sigilo-e-impedimentos-de-conselheiros-e-diretores
kind: evidence
classification: D
proposition: O texto consolidado da Res. CMN 4.222 (v19, BC) marca como incluídos pela Res. CMN 5.279, de
  22/1/2026, os incisos II, III e IV do § 1º do art. 31 do estatuto do FGC. Pelo inciso II, membros do
  Conselho de Administração e da Diretoria Executiva ficam sujeitos a quarentena de seis meses contados do fim
  do mandato, período em que continuam percebendo a remuneração do cargo. O inciso III trata do dever de
  sigilo sobre as informações recebidas nos termos do art. 11, parágrafo único, com responsabilização civil e
  criminal. O inciso IV veda, durante o mandato e a quarentena, atividade remunerada em instituições
  financeiras, administradoras de recursos de terceiros, outras instituições autorizadas pelo BC, empresas de
  seus conglomerados e entidades de classe do setor.
