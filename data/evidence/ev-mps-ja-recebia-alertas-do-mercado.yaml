id: ev-mps-ja-recebia-alertas-do-mercado
kind: evidence
classification: D
proposition: O Parecer SEI nº 146/2024, de 15/07/2024, registra que o Departamento dos Regimes de Previdência
  vinha recebendo alertas dos próprios participantes do mercado sobre os critérios adotados pelos regimes
  próprios e sobre eventual influência de entes federativos nas escolhas de ativos. Foi assinado três
  dias depois do primeiro aporte da Amprev e quatro dias antes do segundo.
