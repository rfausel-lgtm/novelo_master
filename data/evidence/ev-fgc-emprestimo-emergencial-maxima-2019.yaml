id: ev-fgc-emprestimo-emergencial-maxima-2019
kind: evidence
classification: A
proposition: 'O FGC concedeu ao Banco Máxima, em 2019, empréstimo emergencial de entre R$ 20 milhões e
  R$ 30 milhões, como parte da operação que viabilizou a troca de controle da instituição. O pedido inicial
  seria de cerca de R$ 100 milhões, reduzido a cerca de um quinto após problemas com imóveis oferecidos
  em garantia pela família Vorcaro. Segundo o FGC, o empréstimo foi quitado regularmente e não se destinava
  a financiar a aquisição do banco, mas a socorrer instituição em dificuldades: ''o FGC não concede crédito
  com finalidade de compra''. É operação distinta, em valor e em data, do aporte de R$ 15,447 milhões
  atribuído ao fundo em dezembro de 2017 — nenhuma fonte localizada reconcilia os dois números.'
