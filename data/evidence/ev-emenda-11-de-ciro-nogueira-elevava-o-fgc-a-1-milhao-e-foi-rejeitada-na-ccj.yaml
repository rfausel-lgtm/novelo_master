id: ev-emenda-11-de-ciro-nogueira-elevava-o-fgc-a-1-milhao-e-foi-rejeitada-na-ccj
kind: evidence
classification: D
proposition: A Emenda nº 11 à PEC 65/2023, apresentada por Ciro Nogueira em 13/08/2024, elevava a garantia do FGC de R$
  250 mil para R$ 1 milhão por pessoa e atribuía ao fundo "função pública, inclusive por delegação"; em 10/06/2026, a CCJ
  do Senado aprovou parecer do relator Plínio Valério favorável à PEC na forma de substitutivo e contrário à Emenda nº 11.
