id: ev-pf-imputa-correlacao-e-nao-contrapartida
kind: evidence
classification: A
proposition: O que a Polícia Federal imputa a Wagner, nas expressões da própria autoridade policial, é
  correlação temporal e de comportamento — não autoria de texto favorável ao banco nem contrapartida provada.
  A representação o descreve como 'interlocutor relevante' de temas do Master, qualifica sua participação
  na pauta do consignado como 'elemento de correlação', e afirma que o fluxo de mensagens com Augusto
  Lima sugere, 'em juízo preliminar', 'relação funcionalmente direcionada e não meramente social'. O que
  a PF destaca da atuação de 2022 é o contexto temporal, 'próximo ao início das relações contratuais entre
  o Banco Master e a BN Financeira Ltda.', e o fato de ele ter conclamado os demais parlamentares à conversão
  da MP em lei. Sobre a PEC 65/2023, registra contato frequente com Augusto Lima durante a tramitação,
  incluindo ligação em 13/08/2024, dia da apresentação da Emenda 11, seguida do pedido de vista de Wagner
  em 14/08. O eixo patrimonial é o apartamento nº 1.702 do edifício Poème Horto, em Salvador, de cerca
  de 203 m², avaliado em R$ 2,45 milhões, cuja negociação teria prosseguido mesmo após a prisão de Vorcaro.
  São nomeados como intermediários Guilherme Henrique Sodré Martins, o 'Tio Guiga', e Eduardo Mendonça
  Sodré Martins, enteado do senador.
