id: ev-credcesta-operava-em-municipio-paulista-antes-do-decreto-estadual
kind: evidence
classification: D
proposition: 'A operação municipal precedeu a norma estadual em São Paulo. Extrato publicado no diário
  oficial registra convênio de 26/10/2021 entre a prefeitura de Embu das Artes e o CredCesta para ''cartão
  de benefício consignado'', com vigência de sessenta meses — cinco meses antes do decreto que criaria
  a espécie no âmbito do Estado. O dado é relevante contra uma leitura simples de causalidade: nem sempre
  a norma estadual antecede a operação, como se viu também no Paraná.'
