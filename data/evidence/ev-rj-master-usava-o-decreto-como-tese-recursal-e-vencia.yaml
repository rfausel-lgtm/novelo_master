id: ev-rj-master-usava-o-decreto-como-tese-recursal-e-vencia
kind: evidence
classification: D
proposition: 'O decreto fluminense não apenas abriu a porta administrativa: servia de fundamento judicial.
  Acórdão do Tribunal de Justiça do Rio no Agravo de Instrumento nº 0087521-75.2023.8.19.0000, julgado
  pela 4ª Câmara de Direito Privado em 06/03/2024, tem o Banco Master como agravante e transcreve palavra
  por palavra o art. 6º, III e §1º, do Decreto 45.563/2016 na redação dada pelo Decreto 47.625/2021 —
  o dispositivo que retira o cartão de benefício da margem consignável. O julgado cita quatro precedentes
  no mesmo sentido. Ou seja: em 2023 e 2024, o banco invocava a norma estadual para afastar o teto de
  comprometimento em litígios com servidores, e essa tese prevalecia no tribunal. O acórdão serve, adicionalmente,
  como corroboração judicial da literalidade do dispositivo, cuja página original no Diário Oficial não
  foi recuperada pela equipe.'
