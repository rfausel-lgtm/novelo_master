id: ev-tentativa-venda-mansao-orlando-chosen-vessel
kind: evidence
classification: A
proposition: Em fevereiro de 2026, a Sozo Real Estate — holding controlada por Henrique Vorcaro e Natália
  Vorcaro Zettel — tentou vender de forma privada e sem publicidade a mansão de Windermere (Orlando/FL)
  à Chosen Vessel LLC, empresa registrada em Delaware. Segundo a EFB, o imóvel não foi listado no sistema
  público MLS, padrão do mercado imobiliário americano, e a Sozo não contratou advogado independente para
  a negociação — irregularidades apontadas como indício de tentativa deliberada de evitar publicidade
  da venda. A venda não se consumou.
