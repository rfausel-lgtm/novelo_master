id: ev-frias-transferiu-645-mil-a-produtora-e-a-decisao-questiona-o-lastro
kind: evidence
classification: D
proposition: A decisão registra que o deputado federal Mário Frias transferiu R$ 645.400,00 à produtora Go Up Entertainment
  em menos de sessenta dias e observa que seus rendimentos mensais alcançam R$ 44.008,52, o que, segundo o texto,
  coloca em questão o lastro financeiro das transferências.
document_ids:
- doc-2026-09-03-decisao-dino-pet16669-operacao-make-up
excerpt: Destaca-se, ainda, o envio de R$ 645.400,00 para a Go Up pelo próprio Deputado Federal Mário Frias, cujos
  rendimentos mensais alcançam a monta de R$ 44.008,52
locator: p. 99-100
date: '2026-09-03'
notes: A decisão não afirma origem ilícita desses valores; registra a desproporção como elemento a apurar. Frias
  é produtor executivo e roteirista do filme, o que torna possível a hipótese de aporte pessoal na produção — hipótese
  que o texto não examina.
