proposition: A Terra Firme Realty S.A. é sócia de cinco SPEs administradas por Gustavo Amorim Araújo —
  Morro da Barra, Mark 71, Rsp 70, Barra Lodge e Gavazza Empreendimentos —, sendo que na Mark 71 Empreendimento
  Imobiliário Andréa Lima Novaes consta como sócia/administradora ao lado de Gustavo Amorim Araújo, conectando
  a holding imobiliária de Augusto Lima em Salvador à mesma administradora que geriu a PKL One Participações
  (CredCesta). Fonte é agregador privado de dados públicos de CNPJ, não confirmado por consulta direta
  e independente à Receita Federal para cada SPE — tratado como classe A até verificação primária.
