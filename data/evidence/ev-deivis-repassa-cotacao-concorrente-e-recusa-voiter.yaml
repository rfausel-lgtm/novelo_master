id: ev-deivis-repassa-cotacao-concorrente-e-recusa-voiter
kind: evidence
classification: D
proposition: 'Segundo o documento comprobatório da PF (Pet 15.497), em conversa com Fernando de Goes consta
  cotação de Letras Financeiras do Banco Pine encaminhada a Deivis Marcon Antunes, então presidente do
  Rioprevidência — um banco concorrente do Master. Após o envio da imagem, Fernando afirma: "Estão indo pra
  cima do rj". A própria PF observa: "A situação causa estranheza, uma vez que, à luz do contexto da
  conversa, o presidente do Rioprevidência teria encaminhado cotação de instituição financeira concorrente a
  um captador vinculado ao Banco Master, circunstância que foge à lógica esperada das tratativas." Na
  sequência, Vorcaro reclama que "Rj travou nosso"; Fernando responde "Essa semana sai. Prometi a vc" — sete
  dias depois, em 16/04/2024, o Rioprevidência fez um novo aporte de R$ 120 milhões em LFs do Master (Tabela
  1 do mesmo documento, intermediado pela Planner). No mesmo período (12/03/2024), Maurício Quadrado —
  conselheiro do Banco Voiter, do qual Vorcaro é presidente — tentou vender LFs do Voiter ao Rioprevidência; o
  próprio Deivis recusou por e-mail, alegando que "o Banco Voiter nunca solicitou o credenciamento" — ou seja,
  recusou formalmente o concorrente do Master enquanto, no mesmo período, repassava informação competitiva
  sensível ao grupo Master.'
