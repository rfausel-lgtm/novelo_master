date: '2024-03-12'
notes: 'É o indício mais direto, no acervo, de que a liderança formal do Rioprevidência (Deivis, como
  presidente) tinha canal informal com o grupo Master e agia de forma favorável a ele em detrimento de um
  concorrente. IMPORTANTE — ressalva do próprio documento (capítulo de considerações finais, lido por
  inteiro): a PF NÃO liga esse achado, de forma explícita, à fala de Ricardo Siqueira sobre o "dono" do RPPS
  ("alinhamento político com a figura que... seria o dono do RPPS"). São tratados como duas linhas de indício
  paralelas na própria conclusão do relatório — a proximidade Vorcaro-Castro (jantares) é uma linha; o
  "alinhamento político" com o "dono" não identificado é outra, sem que a PF afirme que Castro ou Deivis É
  essa figura. Não superinterpretar este achado como confirmação da identidade do "dono".'
