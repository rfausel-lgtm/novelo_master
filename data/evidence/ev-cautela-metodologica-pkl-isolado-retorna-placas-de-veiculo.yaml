id: ev-cautela-metodologica-pkl-isolado-retorna-placas-de-veiculo
kind: evidence
classification: D
proposition: Registro metodológico que evita erro em verificações futuras. Buscar o termo 'PKL' isolado
  nos diários municipais retorna 38 municípios, e quase todos os resultados são placas de veículo, no
  formato PKL seguido de quatro dígitos, em editais de notificação de infração de trânsito. Do mesmo modo,
  a palavra 'Credicesta' aparece em decretos municipais de consignação referindo-se ao programa estadual
  criado em 2018, sem qualquer vínculo com a operadora. As buscas que sustentam este acervo usaram o cadastro
  nacional da empresa e sua razão social, cujos resultados convergiram integralmente.
