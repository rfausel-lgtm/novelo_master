id: ev-estadao-lino-properties-imovel-888-brickell-miami
kind: evidence
classification: A
proposition: Segundo reportagem do Estadão baseada em documentos obtidos pelo jornal, a Lino Properties
  (Delaware, EUA), controlada integralmente pela offshore Egide I Holding Limited (Ilhas Virgens Britânicas,
  de Alberto Leite — a mesma offshore citada pela PF na apuração sobre Dias Toffoli e o Fundo Arleen),
  comprou, em contrato assinado em março de 2025, a unidade 41B do empreendimento 888 Brickell Miami por US$
  3.648.750; a PF examina o fluxo de recursos do Arleen até a Egide, sob a hipótese de que Toffoli seja
  beneficiário final desses recursos.
