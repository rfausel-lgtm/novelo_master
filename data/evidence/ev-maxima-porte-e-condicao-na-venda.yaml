id: ev-maxima-porte-e-condicao-na-venda
kind: evidence
classification: C
proposition: O Banco Máxima não era um ativo saudável vendido por sucessão familiar. Tinha, no momento
  da venda, patrimônio líquido de R$ 30 milhões e receita de R$ 180 milhões, e enfrentava dificuldades
  financeiras, com desenquadramento das regras prudenciais, estando à beira de ser liquidado pelo Banco
  Central. Saul Dutra Sabbá desligou-se formalmente da gestão em 2017, no ano seguinte ao período das
  manipulações contábeis apuradas pelo BC e no ano anterior à sua inabilitação.
