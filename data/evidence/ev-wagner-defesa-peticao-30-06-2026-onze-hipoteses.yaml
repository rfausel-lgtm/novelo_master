id: ev-wagner-defesa-peticao-30-06-2026-onze-hipoteses
kind: evidence
classification: A
proposition: A defesa de Jaques Wagner apresentou petição ao gabinete de André Mendonça em 30/06/2026 contestando,
  "com dados e fatos, as onze hipóteses de ilegalidade produzidas no inquérito da Polícia Federal", sustentando
  que o senador "nunca teve negócios com o Banco Master", "nunca atuou como intermediário de interesses da
  instituição" e "nunca votou a favor de projetos que pudessem beneficiá-la", e que sua atuação parlamentar
  foi "contrária aos interesses do banco".
