proposition: 'O laudo fixa a data e o horário exatos da assinatura do primeiro contrato entre o Banco
  Master e o escritório Barci de Moraes: assinado por Daniel Bueno Vorcaro em 23/01/2024, às 15:15:11
  (UTC-3), e por Angelo Antonio Ribeiro da Silva no mesmo dia, às 15:35:38. Ainda em 23/01/2024, Fábio
  Faria informa a Vorcaro que teriam jantar agendado ''com o Alex'' na sexta-feira seguinte, dia 02; em
  outra mensagem, Faria confirma jantar com ''o Careca'' para 02/02/2024.'
