id: ev-bcb-instaura-sindicancias-e-encaminha-pf-09-01-2026
kind: evidence
classification: D
proposition: Em 09/01/2026, o Banco Central instaurou Sindicância Patrimonial contra Belline Santana e Paulo Sérgio
  Neves de Souza, confirmou o afastamento cautelar de ambos (decisão do Diretor de Fiscalização, período inicial
  de 60 dias), e o presidente Gabriel Galípolo assinou o Ofício 935/2026-BCB/SECRE comunicando à Polícia Federal
  indícios de corrupção passiva (art. 317, CP) — ato que efetivamente deflagrou o lado criminal do que se tornaria
  a Operação Compliance Zero.
