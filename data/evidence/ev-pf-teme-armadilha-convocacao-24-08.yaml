id: ev-pf-teme-armadilha-convocacao-24-08
kind: evidence
classification: A
proposition: Segundo reportagens do ICL Notícias e do Diário do Centro do Mundo, em 24/08/2026 André Mendonça
  convocou reunião com delegados da PF sob o pretexto de tratar de diligência em outro tema, mas apresentou
  despacho já pronto determinando a análise do celular de Vorcaro em 72 horas. Investigadores temeram
  que o episódio pudesse ser interpretado como abertura de investigação sobre um ministro sem autorização
  do Plenário, e que a crise institucional resultante pudesse levar à anulação colegiada de outros inquéritos
  sobre os esquemas de Vorcaro. Procurado, Mendonça não se manifestou.
