id: ev-oabpr-pede-afastamento-moraes-suspeicao-gonet
kind: evidence
classification: A
proposition: Em 03/09/2026, a seccional do Paraná da OAB, por nota da diretoria e do conselho pleno, pediu
  'o afastamento cautelar do Ministro Alexandre de Moraes do exercício de suas funções até o encerramento
  das apurações' e 'o reconhecimento da suspeição do Procurador-Geral da República, Paulo Gonet, para
  atuar na Petição 16.662/DF' — argumentando que o relatório da PF traz indícios diretos contra Moraes
  e indiretos contra Gonet, o que, segundo a nota, vicia a condução da apuração por Gonet.
