attributed_to: Polícia Federal, na IPJ-A nº 1252786/2026 (análise do celular de Daniel Vorcaro), juntada ao INQ 5.026
date: '2024-10-31'
notes: 'A PF afirma ainda que Paulo Henrique Costa apresentou o contrato com a Tirreno como passo fundamental para a
  aquisição do Master pelo BRB, e que ele e outros no BRB tentaram por semanas operar com o Master sem contrato de
  auditoria e sem comprovação de averbação. O relatório é anterior à prisão dele na fase de 16/04/2026, já registrada
  no acervo. Hipótese investigativa, sem julgamento.'
