id: ev-pf-paulo-henrique-costa-favorecia-o-master-desde-2024
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, as conversas mostram Paulo Henrique Costa, então presidente do BRB, intervindo em
  favor do Banco Master na aceitação de carteiras desde o segundo semestre de 2024, mesmo depois de o BRB identificar, em
  outubro daquele ano, inconsistências como inadimplência de 28% e dados que exigiriam servidores com salário de R$ 250
  mil; em 31/10/2024, Vorcaro escreveu "Amigo, estamos juntos agora", e ele respondeu "Estamos juntos mesmo para a vida".
