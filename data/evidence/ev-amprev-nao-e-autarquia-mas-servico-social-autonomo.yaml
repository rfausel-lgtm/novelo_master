id: ev-amprev-nao-e-autarquia-mas-servico-social-autonomo
kind: evidence
classification: D
proposition: 'A Amprev não é autarquia: o art. 98 da Lei estadual nº 0915/2005, no texto consolidado publicado
  pela própria entidade, a define como pessoa jurídica de direito privado, sem fins lucrativos, sob a
  forma de serviço social autônomo. O expediente do Diário Oficial do Amapá de 11/02/2026 confirma o enquadramento,
  listando a Amprev sob a rubrica ''Serviço Social Autônomo'' e não entre as autarquias estaduais.'
document_ids:
- doc-2005-08-18-lei-0915-natureza-e-nomeacao-amprev
source_ids:
- src-amprev-lei-0915-2005-consolidada
- src-diofe-8594-2026-02-11
excerpt: Art. 98. A AMAPÁ PREVIDÊNCIA – AMPREV, dotada de personalidade jurídica de direito privado, sem
  fins lucrativos, sob a forma de serviço social autônomo, ente de interesse coletivo e de cooperação
  com o poder público
