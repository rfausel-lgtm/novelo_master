date: '2024-10-11'
notes: 'O DJ-alvo e o "amigo da Interpol" não são identificados no documento. A PF não confirma se o
  ofício forjado chegou a ser efetivamente enviado à Interpol — registra apenas sua produção e o comando
  de Vorcaro para segurar o envio. É o segundo caso, no acervo, de ofício forjado com timbre de órgão de
  persecução penal usado pela organização — já constava o caso do ofício forjado do MP-CE, com as
  credenciais da servidora Nayara Maria Dias Albuquerque de Sá, usado para derrubar um perfil de
  Instagram (ver registro dela, nayara-maria-dias-albuquerque-de-sa). A tentativa de forjar um flagrante
  de drogas e a ameaça via milícia e polícia caso o DJ viesse ao Brasil configuram, segundo a narrativa
  da PF, risco concreto à integridade física de um alvo fora da jurisdição brasileira — tratar com o
  mesmo cuidado editorial já aplicado a outros episódios de intimidação física no acervo (ex.: o plano
  contra o jornalista Lauro Jardim).'
