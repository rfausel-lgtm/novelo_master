id: ev-oficio-forjado-interpol-plano-intimidacao-dj-miami
kind: evidence
classification: D
proposition: 'Em outubro de 2024, Daniel Vorcaro mobilizou Felipe Mourão e "A Turma" para perseguir,
  intimidar e coagir um músico (DJ) residente em Miami/EUA que teria tido uma desavença com o filho de
  Vorcaro, prometendo R$ 10 milhões para o intento. Os planos discutidos incluíram contratar pessoas para
  segui-lo em solo americano, forjar um flagrante de drogas para prendê-lo/constrangê-lo, atraí-lo ao
  Brasil sob pretexto de show para intimidá-lo "pela milícia e polícia", e acionar um "amigo da Interpol"
  contra ele. Em 11/10/2024, "A Turma" produziu um ofício com timbre do Ministério Público Federal e
  citação a um inquérito policial de Roraima (totalmente alheio ao caso), endereçado à Interpol — o
  documento aparenta ter sido redigido em nome do gabinete de Alina Boueres, a mesma servidora do MPF
  cujo login era usado nos acessos ilícitos. Vorcaro mandou não enviá-lo antes de alinharem.'
