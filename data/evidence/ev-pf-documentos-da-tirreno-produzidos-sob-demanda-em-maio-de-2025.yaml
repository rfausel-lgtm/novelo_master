id: ev-pf-documentos-da-tirreno-produzidos-sob-demanda-em-maio-de-2025
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, os contratos entre o Banco Master e a Tirreno, apresentados como celebrados entre
  dezembro de 2024 e janeiro de 2025, foram assinados e produzidos em maio de 2025 — as autenticações em cartório são de
  13 e 14/05/2025, logo depois de Paulo Henrique Costa, então presidente do BRB, repassar a pendência a Vorcaro; um
  instrumento de mandato dado como finalizado em 24/05/2025 traz data de 05/12/2024; e uma versão do contrato de
  parceria citava memorando de 06/05/2024, anterior à própria criação da Tirreno.
document_ids:
