attributed_to: Polícia Federal, na IPJ-A nº 1252786/2026 (análise do celular de Daniel Vorcaro), juntada ao INQ 5.026
date: '2025-05-13'
notes: 'Complementa ev-tirreno-ata-antedatada-peretto-seixas-maia (lote 238), que tratava só da ata de 02/12/2024
  enviada em abril de 2025. Pelo relatório, o CNPJ da Tirreno foi criado em 01/10/2024, e a referência ao memorando
  foi retirada em 06/06/2025 porque, nas palavras de Ângelo Ribeiro da Silva citadas pela PF, era preciso tirar "a
  referência do MOU com o Pereto e qq outra vinculação". A PF também registra que a palavra "Tirreno" só aparece nas
  conversas de Vorcaro com seu advogado em 02/05/2025 e com Ângelo em 06/05/2025, embora as operações atribuídas à
  empresa tivessem começado em janeiro, e lê a ausência como indício de que a Tirreno não originou os créditos.
  Hipótese investigativa, sem denúncia até a data mais recente disponível.'
