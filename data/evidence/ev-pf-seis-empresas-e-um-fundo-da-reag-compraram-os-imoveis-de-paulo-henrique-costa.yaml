attributed_to: Polícia Federal, na IPJ-A nº 1270942/2026, juntada ao INQ 5.026
date: '2025-01-20'
notes: 'O valor e a lista dos seis imóveis já constavam do acervo pela decisão de prisão (ver
  ev-pet15771-mensagens-vorcaro-phc-imoveis); a novidade é a estrutura. As assembleias que aumentaram o capital das
  empresas das duas unidades de Brasília são de 20/01/2025, dez dias depois de Paulo Henrique Costa dizer às
  incorporadoras que a holding estava pronta (ver
  ev-pf-paulo-henrique-costa-negociou-imoveis-por-holding-para-nao-ficar-em-seu-nome). Segundo a PF, Daniel Moreira
  Bezerra, que constituiu a empresa depois transformada na Tirreno, assina como secretário as atas de Lenore e Stanza,
  e os dois sócios originais das seis empresas, registrantes de uma centena de sociedades, foram também fundadores da
  empresa que se tornou a Super Empreendimentos e Participações, ligada a Vorcaro e a Fabiano Zettel. O diretor,
  médico, e o representante da REAG nas atas não são nomeados aqui por não haver acusação formal contra eles. Para a PF,
  fundos do grupo foram usados para disfarçar como operação entre investidores o que seria vantagem indevida. Hipótese
  investigativa, sem denúncia.'
