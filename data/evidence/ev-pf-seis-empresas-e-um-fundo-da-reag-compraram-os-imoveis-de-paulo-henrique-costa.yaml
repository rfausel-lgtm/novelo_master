id: ev-pf-seis-empresas-e-um-fundo-da-reag-compraram-os-imoveis-de-paulo-henrique-costa
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, os seis imóveis de R$ 146,6 milhões atribuídos a Paulo Henrique Costa seriam
  comprados por seis sociedades anônimas de prateleira — Allora, Lenore, Stanza, Domani, Chesapeake e Milano —, cada
  uma com capital aumentado entre janeiro e março de 2025 no valor de um imóvel e controlada pelo FIP Alucard (depois
  renomeado Abbiamo), gerido pela REAG Portfolio Solutions; o diretor das seis empresas é, pela PF, cunhado do advogado
  Daniel Lopes Monteiro.
