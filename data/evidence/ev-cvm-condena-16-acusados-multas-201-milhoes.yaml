id: ev-cvm-condena-16-acusados-multas-201-milhoes
kind: evidence
classification: D
proposition: 'O colegiado da CVM condenou, por unanimidade, 08/09/2026, os 16 acusados do PAS 19957.007976/2020-94
  por operação fraudulenta na 3ª emissão do Brazil Realty FII. Multas individuais, segundo o Poder360:
  Daniel Vorcaro R$ 20 milhões; Henrique Vorcaro R$ 20 milhões; Banco Master R$ 12,5 milhões; Entre Investimentos
  R$ 10 milhões; Antônio Carlos Freixo Júnior R$ 5 milhões; Felipe Vorcaro R$ 5 milhões; Sefer Investimentos
  R$ 1,3 milhão; outros 4 acusados R$ 120 mil cada — total de R$ 201,5 milhões. A Agência Brasil, de forma
  independente, confirma a condenação de Vorcaro (R$ 20 milhões) e do Master (R$ 12,5 milhões), mas relata
  total de R$ 201 milhões, ''todos os 16 acusados condenados'', faixa individual ''entre R$ 5 milhões
  e R$ 24 milhões'', e ''três ex-diretores da Sefer absolvidos'' — divergindo do Poder360, que fala em
  cinco absolvidos. A equipe não teve acesso ao voto/dispositivo final (distinto do relatório lido na
  íntegra) para reconciliar as duas versões.'
