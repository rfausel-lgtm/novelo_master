id: ev-vitoria-da-conquista-desnominalizou-a-margem-apos-a-liquidacao
kind: evidence
classification: D
proposition: 'Em fevereiro de 2026 — três meses depois da liquidação do banco e uma semana antes da liquidação
  de seu sucessor — a prefeitura de Vitória da Conquista editou decreto que eleva a margem consignável
  total a 55% e destina 20% ''exclusivamente à utilização de cartão de crédito consignado e de cartão
  consignado de benefício''. A menção nominal ao programa, que constava dos decretos de 2021 e de 2022,
  desaparece. Ressalva necessária: o ato altera expressamente apenas o caput, e não se localizou revogação
  expressa do parágrafo que trazia o nome, embora haja cláusula genérica de revogação. O que está documentado
  é a desnominalização da margem — não o descredenciamento da empresa, que não deve ser afirmado.'
