attributed_to_id: ana-claudia-queiroz-de-paiva
date: '2024-12-16'
notes: 'Esta descoberta responde, em parte, ao open_question já registrado no verbete de Ana Cláudia
  Queiroz de Paiva: reportagem de imprensa (não repetida aqui) mencionava uma doação de dezembro/2024, de
  cerca de R$ 4,4 milhões, em São Paulo, a pessoa dita denunciada pelo MPF em 2023 por lavagem de dinheiro,
  sem identificar a beneficiária nem quem assinou. Valor, mês e cidade batem com esta escritura — mas o
  RIF do COAF não repete a alegação de denúncia por lavagem contra Karolina Trainotti, então a equipe NÃO
  confirma que se trata da mesma pessoa mencionada pela imprensa.'
