id: ev-super-empreendimentos-doa-apartamento-karolina-trainotti-2024
kind: evidence
classification: D
proposition: 'Por escritura de 16/12/2024, a Super Empreendimentos e Participações S.A. doou a Karolina
  Santos Trainotti um imóvel em São Paulo/SP com valor fiscal atribuído de R$ 4.347.000,00 — mais de três
  vezes o valor de referência da prefeitura —, ato assinado, em nome da doadora, por Ana Cláudia Queiroz de
  Paiva, diretora da empresa. O RIF registra a mesma doação duas vezes (tentativa de registro devolvida em
  30/01/2025 por exigências, e novo registro em 25/02/2025).'
document_ids:
- doc-2026-02-25-rif-140515-coaf
