date: 2026-10-19
notes: "Data: o g1 diz que a decisão foi publicada em 19/10; o Estadão a divulgou em 21/10. O texto da decisão
  e o número do processo não foram localizados (portal do TCE-SP, bloco de mídia, e busca na web); por isso a
  classe é C e não D. É decisão de contas, de primeira instância segundo a defesa, não condenação criminal."
