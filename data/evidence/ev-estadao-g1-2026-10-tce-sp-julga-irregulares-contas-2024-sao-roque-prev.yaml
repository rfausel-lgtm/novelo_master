id: ev-estadao-g1-2026-10-tce-sp-julga-irregulares-contas-2024-sao-roque-prev
kind: evidence
classification: C
proposition: Segundo o Estadão (21/10/2026) e o g1 Sorocaba e Jundiaí (22/10/2026, apuração própria da TV
  TEM), a conselheira substituta Silvia Cristina Monteiro Moraes, do TCE-SP, julgou irregulares as contas de
  2024 do São Roque Prev e imputou ao ex-diretor-presidente Vanderlei Massarioli o ressarcimento de R$ 93,15
  milhões aplicados em letras financeiras do Banco Master, decisão de que cabe recurso e que não é definitiva.
