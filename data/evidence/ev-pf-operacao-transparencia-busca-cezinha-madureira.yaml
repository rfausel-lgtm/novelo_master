id: ev-pf-operacao-transparencia-busca-cezinha-madureira
kind: evidence
classification: C
proposition: 'Em 14/09/2026, a Polícia Federal cumpriu a terceira fase da Operação Transparência — quatro
  mandados de busca e apreensão no Distrito Federal e em São Paulo, autorizados pelo Min. Flávio Dino —
  contra o deputado federal Cezinha de Madureira (PL-SP) e sua esposa, a advogada Valéria Rodrigues
  Linhares, por suspeita de exploração de prestígio, tráfico de influência, corrupção passiva e lavagem de
  dinheiro. A investigação aponta negociação de "pagamento de valores expressivos, condicionados ao
  resultado de processos em curso", com o objetivo de influenciar decisões judiciais em tribunais
  superiores. Em 25/08/2026, a PF já havia apreendido R$ 510 mil em espécie com Linhares, em mala, no
  Aeroporto de Congonhas. A Operação Transparência começou em dezembro de 2025 para apurar irregularidades
  na destinação de emendas parlamentares; esta é sua terceira fase.'
