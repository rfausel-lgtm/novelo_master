id: ev-goiania-declarou-a-operadora-inapta-em-2021-e-apta-em-2022
kind: evidence
classification: D
proposition: A comissão de licitação de Goiânia declarou a operadora INAPTA ao credenciamento em 05/07/2021 e, um
  ano depois, em 20/07/2022, APTA, o que levou ao Contrato de Credenciamento nº 059/2022, assinado em 20/09/2022
  mediante inexigibilidade de licitação.
document_ids:
- doc-2022-09-20-contrato-de-credenciamento-059-2022-de-goiania
excerpt: 'Instituição INAPTA ao credenciamento: PKL ONE PARTICIPAÇÕES S.A. (...) Instituição APTA ao credenciamento:
  PKL ONE PARTICIPAÇÕES S.A.'
date: '2022-07-20'
notes: Os atos lidos não declaram o motivo da inaptidão nem o que mudou entre as duas decisões. A sequência recusa-depois-aprovação
  já aparece em outros pontos da investigação, mas nada nos documentos de Goiânia liga um caso ao outro.
