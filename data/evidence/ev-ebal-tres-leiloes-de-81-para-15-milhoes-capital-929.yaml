id: ev-ebal-tres-leiloes-de-81-para-15-milhoes-capital-929
kind: evidence
classification: C
proposition: 'A Ebal foi a leilão três vezes. Nas duas primeiras — 27/01/2016 e março de 2018 —, com lance
  mínimo de R$ 81 milhões fixado por avaliação econômico-financeira, não houve interessados. No terceiro,
  em 11/04/2018, com um único participante, a companhia foi arrematada por R$ 15 milhões, cerca de R$
  66 milhões abaixo do mínimo originalmente exigido. O registro da Receita Federal mostra que a companhia
  tinha capital social de R$ 929.443.700,00. O lote compreendia o controle acionário, os fundos de comércio
  das 49 lojas da Cesta do Povo, o direito de exploração da marca e o Programa Credicesta; os imóveis
  não foram vendidos, tendo sido incorporados ao patrimônio estadual. As dívidas remanescentes ficaram
  com o Estado, que pagou cerca de R$ 93 milhões entre 2019 e 2026 — 6,2 vezes o valor arrecadado com
  a venda. O passivo era conhecido antes da operação: em dezembro de 2014, dias após a lei autorizativa,
  o então vice-governador falava publicamente em R$ 200 milhões de passivo trabalhista. A composição exata
  dos R$ 93 milhões não foi localizada em fonte pública.'
