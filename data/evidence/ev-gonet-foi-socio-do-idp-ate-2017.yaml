proposition: Paulo Gonet, hoje procurador-geral da República, foi um dos fundadores do IDP em 1998, ao lado de Gilmar
  Mendes e Inocêncio Mártires Coelho, e deixou a sociedade em 2017, vendendo sua participação a Francisco Schertel
  Mendes, filho do ministro e reitor da instituição.
