id: ev-master-nao-estava-na-lista-exaustiva-em-maio-de-2024
kind: evidence
classification: D
proposition: 'Verificação primária: na Lista Exaustiva do Ministério da Previdência atualizada em 06/05/2024,
  o Banco Master S/A (CNPJ 33.923.798) não consta em nenhuma seção. Aparece apenas a Master S.A. Corretora,
  entre as instituições elegíveis para administrar e gerir fundos, tendo ''Banco Master S.A.'' na coluna
  de conglomerado — o que não habilitava o banco a emitir. A seção de instituições elegíveis apenas para
  emitir ativos do art. 7º, IV traz somente o Banco C6.'
