id: ev-pet15563-primeiro-bloqueio-patrimonial-da-compliance-zero
kind: evidence
classification: D
proposition: Em 03/03/2026, na PET 15.563, André Mendonça decretou, a pedido da Polícia Federal, o bloqueio de
  contas e a indisponibilidade de bens, valores mobiliários, veículos, aeronaves e criptoativos dos alvos listados
  na representação policial — entre eles, com papel descrito na decisão, Luiz Phillipi Mourão, Marilson Roseno da
  Silva, Paulo Sérgio Neves de Souza, Belline Santana, Leonardo Augusto Furtado Palhares, Ana Cláudia Queiroz de
  Paiva e a Varajo Consultoria Empresarial.
