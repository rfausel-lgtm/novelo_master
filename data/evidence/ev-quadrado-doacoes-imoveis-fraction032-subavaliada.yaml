id: ev-quadrado-doacoes-imoveis-fraction032-subavaliada
kind: evidence
classification: A
proposition: Segundo o liquidante do Master, Quadrado e a esposa doaram quatro imóveis a familiares entre
  setembro e outubro de 2025, com cláusulas de incomunicabilidade e impenhorabilidade, e venderam um quinto
  imóvel (Edifício Metropolitan, Vila Mariana/SP) por R$ 5,9 milhões à 'Fraction 032', empresa controlada
  pelo próprio casal — valor apontado como subavaliado, já que outros apartamentos no mesmo prédio custaram
  R$ 22 milhões. O TJSP bloqueou bens adicionais do executivo e de familiares em março de 2026. O Fundo
  Albali FIM (administrado pela Trustee) recebeu R$ 230 milhões do Master em 2024 sem contraprestação
  e usou o valor para comprar o Hotel Fasano Itaim por R$ 330 milhões. Alegações do liquidante, ainda
  sob litígio — não fatos definitivamente julgados.
