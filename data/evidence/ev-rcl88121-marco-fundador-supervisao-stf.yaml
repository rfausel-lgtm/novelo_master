date: '2025-12-15'
notes: 'Atualizado em 12/09/2026: não é mais o marco documental mais antigo do acervo. A leitura direta do
  IPL 2025.0087917 (trasladado ao INQ 5.026) revelou uma decisão de Toffoli, na mesma Rcl 88.121, datada de
  03/12/2025 — doze dias anterior a esta — que já exigia aprovação prévia do STF para novas diligências (ver
  ev-toffoli-03-12-2025-e-o-novo-marco-mais-antigo). O conteúdo específico registrado aqui (prazo de 30 dias,
  oitiva de dirigentes do BC, autorização para quebras de sigilo individualizadas) permanece correto para
  15/12/2025 — é a decisão SEGUINTE, mais detalhada, não a primeira.'
