id: ev-rcl88121-marco-fundador-supervisao-stf
kind: evidence
classification: D
proposition: 'Em 15/12/2025, o ministro Dias Toffoli, na Reclamação 88.121/DF, determinou as primeiras
  diligências preliminares do caso Banco Master no STF — prazo de 30 dias para oitiva de investigados por
  delegado designado pelo Diretor-Geral da PF, oitiva de dirigentes do Banco Central sobre o Master "e
  possíveis desdobramentos envolvendo outras instituições financeiras", e autorização para requisições e
  pedidos individualizados de quebra de sigilo. A Rcl 88.121 foi arquivada em 10/02/2026 por trânsito em
  julgado, com questões pendentes transferidas para o recém-criado INQ 5.026.'
document_ids:
- doc-2025-12-15-decisao-rcl88121-diligencias-preliminares
source_ids:
- src-stf-rcl88121-decisao-15-12-2025-diligencias-preliminares
date: '2025-12-15'
notes: É o marco documental mais antigo do acervo sobre a supervisão do STF ao caso — anterior até à
  prisão preventiva de Vorcaro (18/11/2025 é anterior, mas esta é a primeira decisão judicial de
  supervisão investigativa já lida diretamente). Mostra que a preocupação declarada, desde o início,
  incluía "possíveis desdobramentos envolvendo outras instituições financeiras" — formulação genérica que
  antecede e talvez explique o surgimento de frentes posteriores como o INQ 5.026 (BRB) e a investigação
  de corrupção contra dirigentes do Banco Central (PET 15.504).
