id: ev-uol-mascarenhas-informa-aprovacao-de-r-200-mi-no-amapa-em-12-07-2024
kind: evidence
classification: A
proposition: >-
  Segundo o UOL (16/10/2026), cerca de uma hora depois da mensagem de Rueda das 11h45 de 12/07/2024, o diretor
  comercial do Master, Fernando Mascarenhas, escreveu a Vorcaro que o Amapá aprovara R$ 200 milhões "agora".
attributed_to: UOL (Fabio Serapião, Natália Portinari e Cézar Feitoza)
document_ids: []
source_ids:
- src-uol-2026-10-16-mensagens-mostram-como-rueda-e-acm-levaram-o-master-a-fundos-de-previdencia
date: '2024-07-12'
notes: >-
  A aprovação em si é documentada (D) pela ata da 11ª Reunião Extraordinária do CIAP, de 12/07/2024
  (ev-cotacoes-comparadas-na-sessao-de-12-07-2024; src-amprev-ata-11a-ext-ciap-2024), que registra R$ 200
  milhões em letras do Master aprovados por unanimidade. A ata, relida em 16/10/2026, registra abertura da
  reunião às 10h49 e encerramento às 11h13: a aprovação antecede as duas mensagens, e o "agora" de Mascarenhas
  é relato posterior ao encerramento, se os horários do UOL estiverem no horário de Brasília (o UOL não
  informa o fuso). A ata não menciona Rueda.
review_status: published
reviewer: orquestrador
