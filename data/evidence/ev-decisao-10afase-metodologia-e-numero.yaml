proposition: A decisão de André Mendonça que autorizou a 10ª fase (PET 16.346, 24 páginas) narra que a
  Coordenação de Contrainteligência da PF produziu a Informação nº 97765/2026 a partir de fontes abertas,
  o que deu origem a inquérito próprio (Inq. 5.035). Após a publicação de duas reportagens do portal Fatos
  Online, em 30/06 e 01/07/2026, com trechos de mensagens dos aparelhos apreendidos, foi produzida a Informação
  de Polícia Judiciária nº 276/2026-NADIP/DFIN/CGRC/DICOR/PF, que corroborou o conteúdo publicado e identificou
  o papel central de Thiago Miranda no recrutamento de influenciadores.
