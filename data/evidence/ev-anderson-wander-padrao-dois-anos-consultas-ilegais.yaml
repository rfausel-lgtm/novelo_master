date: '2026-05-13'
notes: A alegação sobre Ronald Fred Seikaly ('rede de pedofilia') é atribuída pela decisão a uma mensagem do próprio
  Marilson Roseno, sem qualquer verificação ou confirmação judicial — registrada aqui apenas como o conteúdo da
  demanda feita a Anderson, não como fato apurado sobre a pessoa mencionada, que não é investigada nestes autos.
