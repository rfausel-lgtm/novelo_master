id: ev-anderson-wander-padrao-dois-anos-consultas-ilegais
kind: evidence
classification: D
proposition: 'Mensagens de WhatsApp entre Anderson Wander da Silva Lima e Marilson Roseno da Silva, transcritas
  na decisão de 13/05/2026, documentam padrão de consultas indevidas a sistemas internos da PF desde ao menos agosto
  de 2023: em 05/08/2023, consulta sobre viagem internacional de Renata Alves Moreira; em 15/02/2024 e 23/02/2024,
  sondagem de inquéritos envolvendo Daniel e Henrique Vorcaro; em 30/10/2024, consulta sobre Ronald Fred Seikaly,
  a pedido de Marilson, que alegou (sem que a decisão confirme a veracidade da alegação) que o alvo integraria rede
  de exploração sexual infantil e teria se envolvido com filha de um CEO de banco. Documenta também contrapartidas
  financeiras via Pix, incluindo um ''presente'' pelo vestibular da filha de Anderson (agosto de 2023) e uma ''oferenda''
  de fim de ano (31/12/2025 -01/01/2026, já após a fase ostensiva da operação).'
document_ids:
- doc-2026-05-13-decisao-pet15978-sexta-fase-os-meninos
