date: '2026-05-13'
notes: A pessoa objeto da consulta de 30/10/2024 não é investigada nestes autos. A justificativa que a
  decisão atribui a uma mensagem do próprio Marilson Roseno não tem verificação nem confirmação judicial nem
  documento que a sustente; por isso o Novelo não identifica essa pessoa nem reproduz o teor da alegação
  (lote 354). Fica registrado apenas o fato da demanda feita a Anderson e da consulta.
