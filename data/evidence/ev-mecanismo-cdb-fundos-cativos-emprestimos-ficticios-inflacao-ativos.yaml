id: ev-mecanismo-cdb-fundos-cativos-emprestimos-ficticios-inflacao-ativos
kind: evidence
classification: A
proposition: 'Segundo investigações da PF reportadas pela Folha, o Banco Master captou mais de R$ 50 bilhões via
  venda de CDBs e direcionou parte desses recursos a fundos de crédito dos quais o próprio Master era o único cotista;
  a partir desses fundos, concedia ''empréstimos'' fictícios a empresas ligadas a Daniel Vorcaro, sua família e
  sócios — dos R$ 3,5 bilhões investidos nesses fundos, R$ 1,8 bilhão teria ido a empresas ligadas aos próprios
  sócios do banco (exemplo: Clínica Mais Médico, R$ 361,1 milhões, via laranja). Paralelamente, fundos da Reag compravam
  certificados de ações do extinto Besc, de valor real ínfimo, e os precificavam artificialmente para inflar os
  ativos do Master e permitir a emissão de mais CDBs. O dinheiro desviado teria beneficiado, além de Henrique Vorcaro,
  a irmã Natália Vorcaro Zettel, o primo Felipe Cançado Vorcaro e três parentes não identificados de João Carlos
  Mansur, com destino final numa conta do Master mantida pela Super Empreendimentos e Participações.'
