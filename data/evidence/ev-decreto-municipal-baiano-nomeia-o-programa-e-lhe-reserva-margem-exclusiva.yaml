id: ev-decreto-municipal-baiano-nomeia-o-programa-e-lhe-reserva-margem-exclusiva
kind: evidence
classification: D
proposition: Nos estados, os decretos criaram uma categoria genérica de cartão de benefício e a operadora
  entrou depois, por credenciamento. Em municípios baianos a norma dispensa o rodeio e nomeia o programa
  privado. O decreto de Itapetinga, de 30/03/2021, lido pela equipe no PDF oficial, determina que dos
  20% da remuneração destinados a cartão de crédito, '15% (quinze por cento) exclusivamente para o cartão
  de crédito previsto no Programa CREDICESTA e 05% (cinco por cento) para os outros cartões' — três quartos
  da margem para um programa, um quarto para todos os concorrentes somados. O convênio com a operadora
  viria cerca de três meses depois.
