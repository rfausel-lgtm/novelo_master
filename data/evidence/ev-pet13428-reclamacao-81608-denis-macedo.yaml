date: '2025-07-16'
notes: A decisão também registra que, em 21/08/2025, o gabinete de Nunes Marques deu "resposta protocolar" a
  pedido de audiência feito por e-mail nessa reclamação. A PF liga os valores de êxito à hipótese de pagamento em
  espécie, à margem do sistema financeiro, que tornaria relevante a apreensão de R$ 510 mil em Congonhas.
