id: ev-pet13428-reclamacao-81608-denis-macedo
kind: evidence
classification: D
proposition: 'Segundo a representação da PF transcrita na Pet 13.428, em 16/07/2025 Mariângela Fialek enviou a
  Valéria Rodrigues Linhares, para análise, dois instrumentos ligados à Reclamação 81.608 (relator Nunes
  Marques), movida por Denis de Souza Macedo — ex-secretário de Educação de Belford Roxo/RJ preso em fevereiro
  de 2025 em operação da PF sobre desvios superiores a R$ 112 milhões do FUNDEB e do PNAE: um contrato de cessão
  de crédito pelo qual Igor Rodrigues Advogados Associados cederia à sociedade de Valéria R$ 1 milhão dos
  honorários de êxito, e um aditivo prevendo pagamento adicional de R$ 2 milhões "em caso de sucesso, sendo
  este considerado a concessão da liberdade do contratante, ainda que com a imposição de medidas cautelares".
  Valéria respondeu "Está razoável / Assino?". Em 05/08/2025, Fialek escreveu ao deputado "Cezinha e tem o do
  Rio", que a PF associa a esta reclamação.'
document_ids:
