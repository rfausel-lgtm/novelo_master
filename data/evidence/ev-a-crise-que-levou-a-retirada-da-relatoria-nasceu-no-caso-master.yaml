id: ev-a-crise-que-levou-a-retirada-da-relatoria-nasceu-no-caso-master
kind: evidence
classification: C
proposition: A cadeia que desemboca na retirada da relatoria começa dentro do caso Master, e o acervo
  a acompanhou passo a passo. Em 1º de setembro André Mendonça, relator do caso, levantou o sigilo de
  peças da investigação; o material da Polícia Federal trazia mensagens trocadas entre Alexandre de Moraes
  e Daniel Vorcaro, além de encontros e negociações envolvendo o banco. Em resposta, Moraes encaminhou
  a Fachin relatórios apontando possíveis irregularidades na atuação de Mendonça nos processos do Master
  e do INSS, e pediu em 03/09 a abertura de apuração contra ele por abuso de autoridade, improbidade e
  crime de responsabilidade — valendo-se, para alcançá-lo, do próprio Inquérito 4.781. Em 04/09 Fachin
  separou esse pedido do inquérito das fake news e o avocou para si, dando à Procuradoria-Geral da República
  cinco dias úteis para se manifestar. Em 09/09 retirou de Moraes a relatoria do inquérito. A sequência
  é factual e está documentada; a decisão, porém, declara fundamento institucional, e não disciplinar,
  de modo que atribuir-lhe caráter de sanção seria ir além do que o texto autoriza.
