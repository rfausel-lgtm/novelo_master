id: ev-paraiba-obriga-reserva-integral-da-margem-e-isenta-a-consignataria-de-custas
kind: evidence
classification: D
proposition: 'A Paraíba produziu o desenho mais favorável à consignatária localizado em toda a apuração
  — e num estado onde a operadora do CredCesta não aparece, tendo se credenciado para o produto outra
  empresa, uma instituição de pagamento que também consta credenciada no Rio Grande do Norte. Além de
  reservar 10% da margem e admitir parcelamento em até 84 vezes, o decreto determina que ao solicitar
  o cartão ''o consignado autoriza que toda a sua margem disponível para o produto seja reservada pela
  Consignatária'', e isenta de custas operacionais as instituições de pagamento credenciadas para a rubrica.
  Registre-se em contrapartida que o mesmo ato traz proteções ausentes de outros estados: teto de R$ 25,00
  para a taxa de emissão, vedação de cartão benefício em mais de uma consignatária e exigência de reconhecimento
  biométrico na contratação.'
