id: ev-aporte-feito-apesar-da-rejeicao-do-conselho
kind: evidence
classification: D
proposition: Apesar da rejeição de fevereiro, o AparecidaPrev aplicou R$ 40 milhões em letras financeiras
  do Banco Master em 06/06/2024. O demonstrativo de aplicações da competência de junho de 2024 registra
  a posição 'LF BANCO MASTER IPCA' de R$ 40.000.000,00, equivalente a 4,95% da carteira; a posição não
  existe no demonstrativo de maio. O conselho só registrou conhecimento da operação em setembro, quando
  seu presidente consignou em ata que o valor fora aplicado 'sem consentimento do conselho'.
