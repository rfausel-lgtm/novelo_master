id: ev-cpi-master-16a-posicao-entre-17-pedidos
kind: evidence
classification: C
proposition: Em fevereiro de 2026, o pedido de CPI do Banco Master ocupava a 16ª posição entre 17 requerimentos
  de CPI protocolados na Câmara, atrás de comissões pedidas entre agosto de 2023 (123 Milhas) e julho
  de 2025 (Juntas Médicas) — passando por Crack, Tráfico Infantil, Abuso de Autoridade, Crime Organizado,
  Energia Limpa, Energia Venezuelana, Abuso Sexual/Marajó, Planos de Saúde, Feminicídio, Terras Indígenas,
  Violência Escolar e Redes Sociais, INSS e Crimes Digitais. O Regimento Interno permite apenas cinco
  CPIs em funcionamento simultâneo (art. 35 e art. 35, §2º), e Motta invoca a Questão de Ordem 246/2003
  e o art. 58, §3º da Constituição para justificar a ordem cronológica de instalação.
