id: ev-pf-hipotese-de-que-toffoli-seria-beneficiario-final-do-fundo-arleen
kind: evidence
classification: A
proposition: Segundo relatório da Polícia Federal entregue ao presidente do STF e revelado pela revista piauí em
  10/09/2026, a PF levanta a hipótese de que o ministro Dias Toffoli seja "beneficiário final" ou "proprietário de fato"
  do FIP Arleen, fundo que recebeu R$ 35 milhões de Daniel Vorcaro e transferiu cerca de R$ 34 milhões, em dezembro de
  2025, à holding Egide I, nas Ilhas Virgens Britânicas; o gabinete de Toffoli nega ter tido recursos no exterior ou
  operado naquele território.
