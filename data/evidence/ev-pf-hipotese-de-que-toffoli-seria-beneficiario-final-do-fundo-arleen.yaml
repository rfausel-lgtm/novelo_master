attributed_to: Polícia Federal, em relatório sob sigilo descrito pela revista piauí (10/09/2026) e repercutido por outros veículos
date: '2026-09-10'
notes: 'Hipótese investigativa: os veículos registram que a PF pede "aprofundamento analítico" e não afirma conclusão.
  O relatório não foi lido pelo acervo. A divergência inicial sobre o tamanho (mais de 80 páginas num veículo, 196 em
  outro) foi resolvida: o Correio Braziliense descreve no mesmo texto a IPJ-A nº 893171/2026 e o relatório "de quase
  duzentas páginas", assinado por quatro delegados, como um só documento. Segundo essa reportagem, a PF registra ao
  menos 12 encontros presenciais entre Toffoli e Vorcaro entre o fim de 2023 e o início de 2025 e 167 ligações por
  aplicativo, e os ministros que analisaram o relatório decidiram arquivá-lo. Segundo um dos veículos, o Arleen teve o regulamento alterado em março de 2025
  para permitir aplicação no exterior, e o relatório também recomenda aprofundar a apuração sobre possível influência
  de Vorcaro num voto de Toffoli sobre precatórios, o que o gabinete nega. A cadeia de cotistas do Arleen está em
  ev-cadeia-zettel-fundo-leal-arleen-participacao-maridt-tayaya. Sem denúncia ou investigação formal aberta contra o
  ministro localizada no acervo.'
