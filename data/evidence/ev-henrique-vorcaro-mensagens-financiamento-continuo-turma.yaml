id: ev-henrique-vorcaro-mensagens-financiamento-continuo-turma
kind: evidence
classification: D
proposition: Mensagens de WhatsApp entre Henrique Vorcaro e Marilson Roseno da Silva, transcritas na
  decisão de 13/05/2026, mostram Henrique cobrando e pagando o núcleo "A Turma" mesmo após a 1ª e a 2ª
  fases da Operação Compliance Zero — incluindo a frase "no momento em que estou é que preciso de vocês"
  (09/01/2026) e a promessa de enviar "400" a Marilson, que pede "800k" (06/01/2026) —, além de usar número
  de telefone estrangeiro (Colômbia) e trocar de terminal com frequência. Em 03/03/2026, véspera da 3ª
  fase, reuniu-se pessoalmente com Marilson na empresa One Investimentos, identificado apenas como "H" em
  mensagem de Marilson à esposa, decifrado por cruzamento de dados pela PF.
