id: ev-pkl-one-cnpj-confirma-identidade-unifica-registro
kind: evidence
classification: D
proposition: O CNPJ 27.490.629/0001-13, consultado diretamente na Receita Federal, tem razão social 'PKL
  ONE PARTICIPACOES S.A.' e nome fantasia 'CREDCESTA' — confirma que 'PKL One' (nome usado em reportagens
  sobre a disputa de Macapá) e 'PKL One Participações S.A.' (nome usado em reportagens sobre a Bahia e
  na decisão do TJRJ) são a mesma pessoa jurídica. Os dois registros que o corpus mantinha separados desde
  o lote 86, com essa identidade como pergunta em aberto em ambos, são aqui unificados sob 'pkl-one-participacoes'.
