kind: evidence
id: ev-pf-mensagens-kruschewsky-a-vorcaro-sobre-o-caso-alcidia
classification: A
proposition: Segundo relatório da PF divulgado pela revista piauí e noticiado pelo Estado de Minas, André Kruschewsky,
  diretor jurídico do Banco Master, escreveu a Daniel Vorcaro sobre a ação da destilaria Alcídia no STF que o caso
  "serve de paradigma para nossos casos", perguntou "Vamos nos movimentar?" e ofereceu "Se precisar de ajuda para
  tirar de pauta, avisa!". O julgamento terminou 3 a 2 a favor da Alcídia em 01/10/2024.
source_ids:
