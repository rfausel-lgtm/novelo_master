attributed_to: Polícia Federal, em relatório divulgado pela revista piauí, segundo o Estado de Minas
excerpt: Se precisar de ajuda para tirar de pauta, avisa!
date: '2024'
notes: A equipe não leu o relatório da PF; as datas das mensagens não foram publicadas. O gabinete de Dias Toffoli
  afirmou que ele apresentou o mesmo voto no plenário virtual e no presencial.
