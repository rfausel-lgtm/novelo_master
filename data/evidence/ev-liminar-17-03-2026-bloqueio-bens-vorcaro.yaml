  a alienação de bens ligados a Daniel Vorcaro — os fundos de investimento Astralo 95, Termópilas e Galo
  Forte, a Super Empreendimentos e Participações e imóveis de alto padrão, entre eles a mansão em Brasília
  (cerca de R$ 36 milhões).
