id: ev-quadro-societario-do-instituto-lex-nao-inclui-o-ministro
kind: evidence
classification: D
proposition: O quadro societário do LEX – Instituto de Estudos Jurídicos, na Receita Federal, é formado por Viviane
  Barci de Moraes, sócia-administradora desde a constituição, em 01/06/2000, e por Alexandre Barci de Moraes, Gabriela
  Barci de Moraes e Giuliana Barci de Moraes, sócios desde 20/12/2013. O ministro Alexandre de Moraes não integra
  o quadro.
