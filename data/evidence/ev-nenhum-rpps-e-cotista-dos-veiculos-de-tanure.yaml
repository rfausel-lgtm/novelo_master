id: ev-nenhum-rpps-e-cotista-dos-veiculos-de-tanure
kind: evidence
classification: D
proposition: 'Testada diretamente na base primária da CVM a hipótese de que recursos de regimes próprios
  de previdência teriam chegado a veículos ligados a Nelson Tanure: a resposta é negativa. Os informes
  mensais do FIDC Maranta — fundo citado na decisão judicial — registram zero cotistas de regimes próprios
  em todos os meses de 2023 e 2024; seus únicos cotistas são dois outros fundos, na classe subordinada.
  Os informes trimestrais do Bordeaux FIP e do Fonte de Saúde FIP, entre 2021 e 2023, também registram
  zero cotistas de regimes próprios e zero entidades de previdência complementar. Os fundos administrados
  pela Sefer, no núcleo da operação, igualmente registram zero.'
