id: ev-lista-de-estados-do-credcesta-recuperada-por-capturas-do-site
kind: evidence
classification: D
proposition: 'A lista das unidades da federação onde o CredCesta operou nunca foi divulgada, mas o próprio
  site a expunha: o seletor ''Convênios Atendidos'' listava apenas os estados com convênio ativo. Duas
  capturas foram recuperadas e lidas pela equipe. Em 24/05/2022 constavam doze — AM, AP, BA, GO, MA, MS,
  PA, PE, PR, RJ, SC e SE. Em 21/02/2024 eram 21 mais a entrada federal ''BR'', acrescendo ES, MG, MT,
  PB, PI, RN, RO, SP e TO; seguiam ausentes AC, AL, CE, DF, RR e RS. A lista mede convênios do produto,
  não da operadora: no Amapá, que consta dela, a PKL One foi expressamente inabilitada e quem se habilitou
  foi o Banco Master.'
