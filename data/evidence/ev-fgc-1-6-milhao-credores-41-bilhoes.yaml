proposition: O FGC estimou, em dezembro de 2025, cerca de 1,6 milhão de credores com depósitos e investimentos
  elegíveis à garantia nos bancos do grupo Master (Banco Master, Banco Master de Investimento, Letsbank),
  totalizando cerca de R$ 41 bilhões — a maior operação de ressarcimento da história do fundo. É estimativa
  inicial, não contagem final consolidada.
