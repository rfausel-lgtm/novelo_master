proposition: 'Em 01/09/2026, o Conselho Federal da OAB, por meio do presidente em exercício Délio Lins
  e Silva Jr., manifestou: ''A OAB acompanha com atenção e extrema preocupação as notícias sobre a crise
  que afeta o Supremo Tribunal Federal e outras instituições da República'', defendendo apuração rigorosa
  e imparcial com garantias de devido processo, ampla defesa e presunção de inocência. Não pediu o afastamento
  de nenhum dos envolvidos.'
