id: ev-desenho-juridico-ativo-publico-transferido-dentro-da-empresa
kind: evidence
classification: D
proposition: 'O desenho jurídico que permitiu a um particular explorar o desconto na folha dos servidores
  baianos não foi uma concessão nominal a terceiro — e essa precisão importa. Os decretos nº 18.353 e
  18.354, ambos de 27/04/2018, foram editados dezesseis dias APÓS o leilão e um dia ANTES da homologação.
  O 18.353 mantém o programa ''gerido e operado pela Empresa Baiana de Alimentos S/A – EBAL'' — só que
  a Ebal já havia sido arrematada. Ou seja: o ativo público, o direito de descontar diretamente na folha
  do funcionalismo estadual, foi transferido dentro da própria empresa vendida. O 18.354 completa o arranjo
  alterando o regime geral de consignações para admitir como consignatárias pessoas jurídicas privadas
  que ofertem serviços creditícios ou financeiros. A margem de 30% da remuneração líquida assegurada pelo
  art. 2º é margem própria e adicional, separada do salário já comprometido com outros empréstimos — não
  o teto legal genérico. Verificação artigo por artigo feita pela equipe: nenhum dos dois decretos contém
  prazo de quinze anos nem cláusula de exclusividade.'
