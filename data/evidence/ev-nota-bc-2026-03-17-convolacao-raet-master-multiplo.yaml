id: ev-nota-bc-2026-03-17-convolacao-raet-master-multiplo
kind: evidence
classification: C
proposition: Segundo a nota do BC de 17/03/2026, transcrita na íntegra por Poder360 e Congresso em Foco, o
  Banco Central decretou nessa data a convolação do Raet do Banco Master Múltiplo S.A. em liquidação
  extrajudicial. O texto oficial não foi localizado em bcb.gov.br nem no DOU; as duas transcrições reproduzem
  a mesma nota e não são corroboração independente entre si. O número do ato, Ato do Presidente nº 1.380, de 17/03/2026,
  consta apenas do boletim Alerta Legislação nº 12 (Biblioteca Jurídica do Governo de SP), que transcreve a
  ementa; fonte adicional do número, não corroboração independente do conteúdo, e a publicação no DOU não foi
  verificada.
