id: ev-cronologia-da-relatoria-do-pl-412-2022
kind: evidence
classification: D
proposition: 'Pela cronologia que a própria PF transcreve do sítio do Congresso, Jaques Wagner foi relator do PL
  412/2022 por 23 dias: avocou a relatoria em 30/11/2022, como presidente da Comissão de Meio Ambiente, e a encerrou
  em 23/12/2022, com o fim da 56ª Legislatura. Em 13/03/2023 Leila Barros avocou a relatoria, também como presidente
  da comissão, e nela permaneceu até 04/10/2023.'
