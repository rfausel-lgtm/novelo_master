proposition: 'Quatro dias antes da sessão extraordinária de 15/09/2026, Gilmar Mendes questionou publicamente
  se a Pet 16.662 está em condições de ser julgada: "A rigor, na Pet 16.662, não há nem sequer pedido a ser
  decidido." Apontou como indefinidos quem é investigado, o objeto da investigação e o rito a seguir, e
  propôs que Fachin primeiro reunisse os procedimentos relacionados e assumisse a coordenação, em vez de
  levar o caso ao Plenário nesse estado.'
