proposition: A decisão de 13/05/2026 descreve capítulo específico sobre lavagem de capitais praticada por
  Marilson Roseno da Silva a partir de Erlene Nonato Lacerda (gestora financeira informal, recebedora
  formal de dois pagamentos de R$ 50 mil da King Participações que seriam na verdade destinados a
  Marilson) e Helder Alves de Lima (contador da Roseno & Ribeiro Gestão Empresarial, emissor das notas
  fiscais que formalizavam os repasses), identificando estrutura empresarial e patrimonial destinada ao
  financiamento dos núcleos "A Turma" e "Os Meninos".
