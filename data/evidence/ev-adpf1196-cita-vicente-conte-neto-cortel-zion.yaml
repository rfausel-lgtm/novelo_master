id: ev-adpf1196-cita-vicente-conte-neto-cortel-zion
kind: evidence
classification: D
proposition: 'A decisão do Min. Flávio Dino de 15/09/2026 na ADPF 1.196 transcreve reportagem do O Bastidor
  (26/11/2025) segundo a qual, no julgamento da CVM que multou os irmãos Roberto e Márcio Schumann por uso de
  informação privilegiada com cotas do fundo Brazilian Graveyard and Death Care Services, a defesa de Roberto
  atribuiu as ordens de compra a "Vicente Conte Neto, conselheiro da Cortel, diretor da Zion Capital e um dos
  fundadores do Brazilian Graveyard", e "destacou também a relação entre Vicente e o banqueiro Daniel
  Vorcaro"; o Master era um dos principais cotistas do fundo, administrado pela Master Corretora até a
  liquidação.'
document_ids:
- doc-2026-09-15-decisao-dino-adpf1196-zettel-cortel-mendonca
source_ids:
- src-stf-adpf1196-decisao-15-09-2026-zettel-cortel-mendonca
attributed_to_id: flavio-dino
date: '2026-09-15'
notes: 'O que é classe D é o registro na decisão. O conteúdo transcrito é de imprensa (O Bastidor, não lido
  diretamente: o site bloqueia leitura automatizada) e a caracterização da relação com Vorcaro é argumento de
  defesa de terceiro num processo sancionador — não fato apurado. A CVM absolveu a Cortel por não ter havido
  ganho financeiro para a empresa.'
