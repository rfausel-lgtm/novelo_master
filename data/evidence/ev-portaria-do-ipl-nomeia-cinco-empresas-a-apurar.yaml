id: ev-portaria-do-ipl-nomeia-cinco-empresas-a-apurar
kind: evidence
classification: D
proposition: 'A portaria de instauração do IPL 2025.0087917 (17/08/2025), lida por inteiro pela primeira
  vez em 12/09/2026, nomeia cinco pessoas jurídicas para apuração de vínculos com funcionários e ex-diretores
  do Banco Master: Tirreno, SX 016 Empreendimentos e Participações S.A., Asteba, Asseba, Cartos SCD S/A e
  The-Pay Soluções de Pagamentos Ltda. É o marco documental mais antigo do acervo sobre a origem da
  investigação, quatro meses anterior ao primeiro ato de supervisão do STF já registrado (Rcl 88.121,
  15/12/2025).'
document_ids:
- doc-2025-08-17-portaria-instauracao-ipl-1096304
source_ids:
- src-stf-inq5026-ipl1096304-completo
date: '2025-08-17'
notes: 'Da lista de cinco empresas, Tirreno, Asteba e Asseba já eram conhecidas do acervo antes desta
  leitura. Cartos SCD S/A e The-Pay Soluções de Pagamentos Ltda ganham registro próprio nesta mesma rodada
  de lotes (ver revisões seguintes). SX 016 Empreendimentos e Participações S.A. é citada apenas nominalmente
  na portaria, sem qualquer outro dado localizado até agora — não abrimos registro de organização para ela
  por falta de conteúdo além do nome; fica como pista.'
