proposition: Em 14/05/2026, atendendo a pedido complementar da Polícia Federal, o ministro André Mendonça
  autorizou busca e apreensão especificamente na sala de trabalho da Delegada de Polícia Federal Valéria
  Vieira Pereira da Silva, dentro da Superintendência da Polícia Federal em Minas Gerais — medida distinta
  e adicional à busca domiciliar já afastada em decisão anterior.
