proposition: Segundo o estatuto do FGC na redação dada pela Resolução CMN 5.279, a associação ao fundo implica
  que a instituição autoriza a divulgação ao público de relatórios, consolidados por associada, sobre os
  instrumentos financeiros objeto de garantia do FGC.
