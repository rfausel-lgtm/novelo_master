id: ev-mendonca-decisao-centrada-em-monitoramento-nao-vorcaro
kind: evidence
classification: D
proposition: A decisão de Mendonça de 08/09/2026 NÃO se baseia nas alegações de corrupção/obstrução de
  investigação feitas pelo Partido Novo a partir do depoimento reservado de Vorcaro (ameaças em aeronaves,
  atuação de agentes 'em nome de' Andrei) — o próprio Mendonça registra, no §6, que 'existem outras questões'
  sobre a conduta de Andrei, mas que a decisão 'se centrará' exclusivamente no fato de a PF ter produzido,
  por mais de 30 dias, um relatório de inteligência apócrifo monitorando o próprio Mendonça e o Advogado-Geral
  da União. A prisão preventiva pedida pelo Partido Novo NÃO foi concedida — apenas o afastamento cautelar
  dos cargos.
