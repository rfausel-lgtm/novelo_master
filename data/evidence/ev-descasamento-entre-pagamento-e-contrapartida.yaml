id: ev-descasamento-entre-pagamento-e-contrapartida
kind: evidence
classification: I
proposition: 'Há descasamento temporal entre o início dos pagamentos e a entrega da contrapartida: os
  repasses mensais do Banco Master começam em janeiro de 2025, a competição patrocinada teve início em
  abril, o acordo de naming rights foi anunciado em julho e a marca só passou a aparecer nas placas a
  partir da décima quarta rodada, em 26/07/2025 — cerca de seis meses depois do primeiro pagamento. O
  descasamento é fato verificável; não constitui, por si, prova de irregularidade, e pode ter explicação
  contratual que o corpus não conhece.'
