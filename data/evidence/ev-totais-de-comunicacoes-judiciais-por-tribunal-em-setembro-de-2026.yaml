date: '2026-09-10'
notes: 'Comunicação não é processo: um mesmo feito gera várias. O campo de contagem da API satura em dez mil, de
  modo que os números de São Paulo e do Rio vêm da soma das consultas ano a ano. Precisão sobre registro anterior
  do corpus: os números por tribunal ali publicados descreviam a composição de uma amostra de dez mil comunicações,
  não os totais.'
