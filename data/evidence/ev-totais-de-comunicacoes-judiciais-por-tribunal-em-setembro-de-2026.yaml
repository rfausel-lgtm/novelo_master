id: ev-totais-de-comunicacoes-judiciais-por-tribunal-em-setembro-de-2026
kind: evidence
classification: D
proposition: Em 10/09/2026 o diário eletrônico nacional registrava, com a operadora como parte, 13.944 comunicações
  em São Paulo, 12.436 no Rio de Janeiro, 8.036 na Bahia, 4.364 no Paraná, 3.879 em Mato Grosso do Sul e 3.234 no
  Amazonas, entre outros tribunais.
document_ids:
