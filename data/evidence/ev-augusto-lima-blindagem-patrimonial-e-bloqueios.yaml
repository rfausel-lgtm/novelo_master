id: ev-augusto-lima-blindagem-patrimonial-e-bloqueios
kind: evidence
classification: C
proposition: 'A 22ª Vara Cível do TJSP bloqueou, em 29/04/2025, R$ 112,8 milhões de Augusto Lima (a maior
  parte em conta na Reag Trust DTVM), numa execução movida pela família ex-controladora do Voiter — bloqueio
  suspenso 8 dias depois, por acordo. Há nova cobrança de R$ 247 milhões em curso desde dezembro de 2025,
  contra Lima, Vorcaro e Maurício Quadrado solidariamente, por debêntures da DV Holding. Na mesma ação
  cível, a família ex-controladora do Voiter aponta esquema de blindagem patrimonial: doação de quotas
  da holding AC3 às duas filhas mais velhas de Lima, em dezembro de 2019, com retenção de usufruto vitalício,
  além de imóveis (casa de veraneio e apartamento na Bahia) transferidos a estruturas societárias distanciadas
  de sua titularidade direta.'
