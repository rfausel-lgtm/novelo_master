id: ev-sp-margem-global-sobe-de-35-para-50-quinze-dias-apos-o-decreto
kind: evidence
classification: D
proposition: 'Quinze dias depois de criada a espécie, a Fazenda paulista elevou a margem consignável global
  de 35% para 50% — exatamente os quinze pontos percentuais reservados ao novo produto. O patamar anterior
  está no decreto de 2015, que fixara a margem ''de 30% para 35%''. Formalmente os 15% do cartão de benefício
  são sublimite, e não acréscimo: o §4º condiciona a averbação à existência de margem disponível. Na prática,
  o mesmo movimento normativo que criou o produto abriu na folha espaço novo do tamanho exato dele — e
  o fez por resolução de secretário, ato infralegal, não por decreto.'
document_ids:
