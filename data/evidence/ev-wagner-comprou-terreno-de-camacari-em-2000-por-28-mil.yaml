proposition: Jaques Wagner adquiriu o terreno em Tererê, distrito de Abrantes, Camaçari, por escritura de março
  de 2000, e o declarou ao TSE em 2018 por R$ 28 mil; segundo a Folha, reproduzida pela CNN, o vendedor foi a Traneves
  Patrimonial, representada por Antonoaldo Grangeon Trancoso Neves.
