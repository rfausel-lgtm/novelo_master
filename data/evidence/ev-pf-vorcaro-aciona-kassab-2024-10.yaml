notes: 'NOVO (13/09/2026, fonte primária): documento da PF na Pet 15.497 data o episódio com precisão em
  01/10/2024. Vorcaro afirma a interlocutores ter conseguido tirar do ar uma notícia sobre o tema no site
  "expresso222.com.br" (hoje inexistente) — mas o próprio relatório da PF registra que essa notícia "não foi
  encontrada" pela perícia, ao contrário da postagem do Dep. Luiz Paulo, que "continua acessível até a data da
  elaboração deste relatório". Ou seja, a retirada do ar é alegação do próprio Vorcaro, não fato confirmado de
  forma independente pela PF — pode ser fanfarronice, o site pode nunca ter existido como descrito, ou pode
  ter sido removido antes da checagem.'
