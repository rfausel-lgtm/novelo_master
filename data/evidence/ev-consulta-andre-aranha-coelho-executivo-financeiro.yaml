proposition: 'No terminal internacional de Marilson Roseno da Silva foram encontradas, reencaminhadas
  para seu próprio número brasileiro, diversas imagens de consultas a sistemas internos da PF sobre André
  Aranha Coelho, executivo do setor financeiro (atuação em corporate banking na UBS, Banco PAN e Banco
  Modal, CEO da Saffe e fundador de empresa de Open Finance e inteligência artificial, segundo pesquisa em
  fontes abertas). O documento não identifica quem realizou a consulta.'
