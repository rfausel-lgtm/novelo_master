date: '2024-04-10'
notes: 'Esta descoberta dá conteúdo concreto a um open_question já registrado no verbete da própria Super
  Empreendimentos: que Fabiano Zettel teria recebido R$ 485 milhões da empresa entre 2022 e 2026 sem
  natureza contratual esclarecida. O portfólio imobiliário aqui detalhado mostra PARTE do destino do
  dinheiro da empresa no mesmo período — mas não fecha a pergunta original sobre a origem/natureza dos
  repasses a Zettel pessoalmente, que são um fluxo distinto (a empresa comprando imóveis em nome próprio,
  não necessariamente repassando a ele).'
