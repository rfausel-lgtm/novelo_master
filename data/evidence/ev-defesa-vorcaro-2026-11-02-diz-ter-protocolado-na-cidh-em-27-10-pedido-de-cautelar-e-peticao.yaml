status: unverified
proposition: Em nota divulgada em 02/11/2026, a defesa de Daniel Vorcaro afirmou ter protocolado em
  27/10/2026, na Comissão Interamericana de Direitos Humanos, pedido urgente de medidas cautelares e petição
  individual contra o Estado brasileiro, com os números MC-2068-26 e P-2913-26. A evidência prova apenas o que
  a defesa disse; não há comprovante de protocolo nem documento da CIDH, e o acervo não afirma que a Comissão
  registrou, admitiu ou deu andamento aos pedidos.
