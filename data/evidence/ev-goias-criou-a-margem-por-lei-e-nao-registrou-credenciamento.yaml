id: ev-goias-criou-a-margem-por-lei-e-nao-registrou-credenciamento
kind: evidence
classification: D
proposition: 'Goiás é o único caso examinado em que a margem exclusiva veio por lei aprovada pelo Legislativo,
  e não por decreto do Executivo: dez por cento que ''somam-se'' ao limite das consignações facultativas,
  reduzidos a cinco por cento para celetistas. O estado consta da lista de cobertura do produto desde
  maio de 2022, mas o levantamento da equipe no índice do diário oficial goiano — com controle metodológico,
  já que o mesmo índice devolve milhares de ocorrências para ''consignação'' — não encontrou nenhuma menção
  à operadora, ao produto ou ao banco. Se houve operação em Goiás, não passou pelo diário estadual.'
