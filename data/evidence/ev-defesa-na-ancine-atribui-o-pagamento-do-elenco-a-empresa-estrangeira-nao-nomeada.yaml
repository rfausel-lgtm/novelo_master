attributed_to: The Intercept Brasil, a partir das peças do processo administrativo na Ancine
date: '2026-08-31'
notes: A defesa pede que a multa fique no mínimo legal de R$ 2 mil, quando a autuação pode chegar a R$ 200 mil.
  Procuradas, a produtora e sua dona não responderam à reportagem.
