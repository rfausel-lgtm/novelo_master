id: ev-defesa-na-ancine-atribui-o-pagamento-do-elenco-a-empresa-estrangeira-nao-nomeada
kind: evidence
classification: A
proposition: Na defesa protocolada em 31/08/2026 contra o auto de infração da Ancine de 28/07/2026, a produtora
  brasileira sustenta ter sido apenas prestadora de serviços locais e atribui a contratação e o pagamento do elenco
  principal a uma 'empresa estrangeira' que não nomeia em nenhum ponto — sendo essa empresa a própria estrutura
  americana da mesma dona, que a produtora havia nomeado à mesma agência seis semanas antes.
