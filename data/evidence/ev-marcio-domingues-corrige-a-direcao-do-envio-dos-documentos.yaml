id: ev-marcio-domingues-corrige-a-direcao-do-envio-dos-documentos
kind: evidence
classification: D
proposition: Em depoimento de 28/07/2026, Márcio Domingues dos Santos afirma que foi ele quem enviou a Daniel Lopes
  Monteiro os arquivos do apartamento Poème Horto — retirados da rede do escritório, a pedido de Daniel —, invertendo
  o sentido que a decisão de 19/06/2026 atribuiu ao episódio ('Daniel Lopes Monteiro teria encaminhado a Márcio
  documentos').
