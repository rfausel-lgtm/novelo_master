id: ev-previpaulista-investiu-contra-parecer-e-sem-aprovacao-de-comite
kind: evidence
classification: D
proposition: A PreviPaulista aplicou cerca de R$ 3 milhões no Banco Master em fevereiro de 2024, segundo a própria
  prefeitura, 'à revelia da governança interna, contrariando parecer da consultoria de investimentos contratada
  à época e sem a devida aprovação do Comitê de Investimentos' — a única aprovação, entre os seis institutos examinados,
  formalmente contrária ao parecer técnico contratado.
