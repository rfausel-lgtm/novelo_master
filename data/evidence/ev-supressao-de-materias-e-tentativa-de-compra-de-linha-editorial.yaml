date: '2024-10-11'
notes: 'Cuidado editorial exigido aqui. O que a extração comprova é o que Vorcaro e Mourão escreveram
  entre si: a ordem de derrubar matérias, a crença de Vorcaro de que havia uma "parceria" e de que
  "tínhamos comprado os caras", e a cifra de R$ 50 mil mensais cogitada por ele. O documento NÃO
  demonstra que o Diário do Centro do Mundo tenha recebido pagamento, aceitado proposta ou alterado sua
  cobertura por dinheiro — a menção a que "o pessoal do dcm está perguntando sobre a parceria" é relato
  de Mourão a seu contratante, não prova de acordo, e o veículo não é investigado nesta peça. O corpus
  não localizou manifestação do site sobre o episódio. Por isso o veículo não ganha registro próprio no
  acervo: o que está documentado é a conduta do lado comprador.'
