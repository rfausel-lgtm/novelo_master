id: ev-supressao-de-materias-e-tentativa-de-compra-de-linha-editorial
kind: evidence
classification: D
proposition: 'A extração do celular de Daniel Vorcaro registra ordens reiteradas para retirar do ar
  matérias jornalísticas sobre ele e o Banco Master, com Luiz Phillipi Mourão relatando os resultados
  ("estão tirando todas do ar", "derrubado", "clean permanente") e enviando listas de links já removidos.
  Em 11/07/2023, Mourão comunicou a remoção de conteúdo que, pela URL, tratava de conta de ministros do
  STF em restaurante de luxo em Nova York supostamente paga por um banco — link que a PF confirmou estar
  fora do ar. Em 03/09/2024, diante de reportagem do Diário do Centro do Mundo sobre processo na CVM
  contra Vorcaro e o pai, ele escreveu "Tem que derrubar urgente. Derrubar de vez esse blogo. Achei que
  tinha parceria. E tinhamos comprado os caras."; em seguida Mourão informou que o interlocutor no
  veículo "vai tentar criar filtro lá dentro, pra não conseguirem subir mais títulos com banco master".
  Em 10/10/2024, sobre o mesmo site, Vorcaro determinou "Vamos focar na parceria com essa turma. Veja um
  valor mensal. Não pode sair uma frase com meu nome ou Master"; no dia seguinte, quando Mourão disse que
  "o pessoal do dcm está perguntando sobre a parceria", Vorcaro respondeu "50K mês?". Há ainda registro
  de Mourão separando links negativos no Google para derrubá-los enquanto criava conteúdo positivo para
  ocupar o topo das buscas.'
