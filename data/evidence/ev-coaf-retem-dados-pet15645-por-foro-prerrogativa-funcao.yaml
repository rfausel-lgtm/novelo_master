id: ev-coaf-retem-dados-pet15645-por-foro-prerrogativa-funcao
kind: evidence
classification: D
proposition: 'Em resposta a pedido da PF de compartilhamento do RIF nº 140515, o COAF reteve parte das
  comunicações por identificar possível incidência de foro por prerrogativa de função (competência do STJ
  ou do STF), exigindo autorização judicial específica antes de liberá-las — o que motivou a petição da PF
  na Pet 15.645/DF (10/03/2026) e, mais de seis meses depois, o pedido de Alexandre de Moraes (13/09/2026,
  já no acervo) para que o conteúdo fosse disponibilizado a todo o colegiado antes da sessão de 15/09/2026
  sobre a Pet 16.662.'
document_ids:
- doc-2026-03-10-peticao-inicial-pf-rif-140515-pet15645
source_ids:
- src-stf-pet15645-peticao-inicial-pf-rif-140515
date: '2026-03-10'
notes: A petição não nomeia quem seria o titular de foro por prerrogativa de função cujos dados o COAF
  reteve — nenhuma fonte do acervo confirma se é Alexandre de Moraes, outro ministro, ou autoridade diversa.
