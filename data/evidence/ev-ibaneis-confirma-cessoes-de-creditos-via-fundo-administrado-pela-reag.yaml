id: ev-ibaneis-confirma-cessoes-de-creditos-via-fundo-administrado-pela-reag
kind: evidence
classification: D
proposition: O escritório Ibaneis Advocacia e Consultoria (fundado pelo governador do DF, dele afastado desde 2018)
  cedeu, em duas operações (29/05/2024 e 23/12/2021), créditos de honorários advocatícios de uma ação iniciada em
  2008 contra a União Federal; a cessão de 23/12/2021 foi feita ao Fundo Laguz I FIDC, administrado pela Reag/CBSF
  DTVM, cujo único cotista seria o Banco Original.
