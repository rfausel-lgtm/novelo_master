id: ev-liquidante-aponta-diferenca-de-onze-milhoes
kind: evidence
classification: A
proposition: O liquidante do Banco Master sustenta, com base em relatórios extraídos dos sistemas internos
  da instituição, que o valor devido pelo Estado do Amapá no período seria de R$ 16.632.115,61, e não
  os R$ 5.441.269,38 declarados — o que resultaria em diferença líquida de R$ 11.165.022,70 não retida
  nem provisionada. Alega ainda que o Estado não comprovou o depósito, tendo juntado apenas ordens bancárias
  de retenção, que qualifica como atos administrativos internos insuscetíveis de verificação. É alegação
  de parte, apoiada em documentos unilaterais do próprio banco; o corpus não localizou decisão judicial
  que a acolha ou rejeite.
