id: ev-maxima-precisava-de-capitalizacao-2017
kind: evidence
classification: A
proposition: 'O Banco Máxima precisava de capitalização quando Vorcaro acertou, em 2017, o acordo para
  assumir seu controle, com a promessa de injetar mais de R$ 75 milhões e aporte inicial de R$ 25 milhões.
  É contexto relevante para a leitura do apoio do FGC: uma instituição associada em dificuldade é justamente
  o destinatário previsto no Estatuto do fundo para operações de assistência.'
