id: ev-uol-lista-de-captacoes-em-andamento-de-12-07-2024
kind: evidence
classification: A
proposition: >-
  Segundo o UOL (16/10/2026), em 12/07/2024 Fernando Mascarenhas enviou a Vorcaro uma lista das maiores
  captações em andamento, em milhões de reais: Amapá 400, Rio de Janeiro 350, Amazonas 250, Campos dos
  Goytacazes 160, Maricá 500, Belo Horizonte 100 e Alagoas 200.
attributed_to: UOL (Fabio Serapião, Natália Portinari e Cézar Feitoza)
document_ids: []
source_ids:
- src-uol-2026-10-16-mensagens-mostram-como-rueda-e-acm-levaram-o-master-a-fundos-de-previdencia
date: '2024-07-12'
notes: >-
  Valores de operações em negociação, não de transferências. O UOL não publica um total e o Novelo não o
  registra. As cifras do Amapá no UOL (R$ 400 milhões "confirmado" em abril de 2024, R$ 200 milhões aprovados
  em 12/07/2024 e R$ 300 milhões já transferidos até 01/08/2024) não são reconciliadas pelo veículo nem pelo
  Novelo; o acervo documenta R$ 200 milhões na ata de 12/07/2024 e cerca de R$ 400 milhões no conjunto das
  deliberações de julho de 2024 (evt-2024-07-amprev-aprova-400-mi-letras-master).
review_status: published
reviewer: orquestrador
reviewed_at: '2026-10-16'
created_at: '2026-10-16'
updated_at: '2026-10-16'
