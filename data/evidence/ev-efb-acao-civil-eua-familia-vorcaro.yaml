id: ev-efb-acao-civil-eua-familia-vorcaro
kind: evidence
classification: A
proposition: Por volta de 03/03/2026, a EFB Regimes Especiais (liquidante do Banco Master) moveu ação
  civil nos Estados Unidos contra Henrique Vorcaro e Natália Vorcaro Zettel, por enriquecimento ilícito
  e participação em esquema de dissipação de mais de US$ 1 bilhão em ativos do banco — incluindo repasses
  de cerca de R$ 1,5 bilhão à Super Empreendimentos e Participações e R$ 400 milhões à Moriah Asset Management
  —, pedindo a restituição desses valores à massa liquidanda.
