id: ev-sem-pericia-e-sem-apuracao-contra-agentes
kind: evidence
classification: A
proposition: 'Resultado de verificação: não há registro público de perícia, exame de corpo de delito,
  inspeção ou qualquer verificação material das alegações de maus-tratos, nem manifestação da Defensoria
  Pública, da OAB, do CNMP ou do mecanismo de prevenção à tortura sobre o caso concreto. Tampouco se localizou
  procedimento instaurado contra agente algum — na Corregedoria da PF, no MPF ou no STF —, nem afastamento,
  transferência ou processo disciplinar decorrente dessas alegações. A alegação, embora feita perante
  juiz auxiliar e com integrante do MPF presente, não gerou nenhuma diligência de verificação material.
  O achado negativo é coerente com o parecer da PGR: sem autores identificados, não há a quem apurar.'
