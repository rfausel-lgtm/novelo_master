id: ev-parecer-pgr-opoe-busca-gabinete-apreensao-bens
kind: evidence
classification: D
proposition: 'O parecer da PGR de 16/06/2026 (ASSCRIM nº 940922/2026), assinado por Paulo Gonet, anui
  à operação de busca e apreensão da 9ª fase da Compliance Zero, mas se opõe especificamente a dois pontos:
  a busca no gabinete parlamentar de Jaques Wagner, por violação à separação de poderes, e a apreensão
  de bens de alto valor/dinheiro/joias, por desproporcionalidade e prematuridade. Mendonça não acolheu
  integralmente essa posição na decisão que autorizou a diligência.'
