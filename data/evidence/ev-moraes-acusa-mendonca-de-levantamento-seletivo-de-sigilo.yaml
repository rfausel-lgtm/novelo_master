id: ev-moraes-acusa-mendonca-de-levantamento-seletivo-de-sigilo
kind: evidence
classification: A
proposition: 'No Ofício GMAM nº 09/2026 (datado 11/09/2026), Alexandre de Moraes contesta diretamente a
  afirmação de André Mendonça de que os sigilos ligados à Pet 15.556 já teriam sido levantados e
  disponibilizados a todos os gabinetes: "Não é o que consta dos autos" — anexando prints que mostram a Pet
  15.556, a Pet 15.976 e a Rcl 88.121, entre outras, ainda com peças sigilosas inacessíveis a ele. Acusa
  Mendonça de promover "levantamento seletivo e direcionado do sigilo... na proteção ostensiva de determinado
  grupo político", equiparando a conduta ao "direcionamento de acordos de colaboração premiada" já alegado no
  Ofício GMAM 07/2026, e fala em supressão ao colegiado do conhecimento de "18 PETs e de 180 documentos".'
