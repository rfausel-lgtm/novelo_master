date: '2025-11-25'
notes: 'Corrige o que o acervo publicara no lote 313 a partir de reportagem: a condenação é de 25/11/2025, não de
  2022 (ano das operações), e é por prática não equitativa, com absolvição da acusação de manipulação. Uma terceira
  pessoa, companheira de Roberto, foi absolvida e não é nomeada no acervo. As iniciais V.C.N. são do documento; a
  identificação com Vicente Conte Neto vem da imprensa.'
