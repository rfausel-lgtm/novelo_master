id: ev-cvm-condena-schumann-e-absolve-cortel-care11
kind: evidence
classification: D
proposition: 'Em 25/11/2025, no PAS 19957.013886/2022-02, a CVM condenou Roberto Coutinho Schumann, então diretor
  financeiro da Cortel, e seu irmão Marcio Coutinho Schumann a multas de R$ 2.127.992,80 e R$ 54.048,02 por
  prática não equitativa — negociação de cotas do CARE11 com conhecimento das compras que a própria Cortel fazia
  no fundo entre março e maio de 2022. Absolveu a Cortel e Roberto Schumann da acusação de manipulação de preços e
  Roberto da de operação fraudulenta. O voto registra que o conselho de administração da Cortel acompanhou a
  operação, citando e-mail do conselheiro identificado como V.C.N. que pedia regras para a negociação de cotas por
  administradores, e que a Cortel mirava 25% das cotas do fundo a preço médio abaixo de R$ 5, contra valor
  patrimonial de R$ 8,17.'
document_ids:
- doc-2025-11-25-voto-cvm-pas-cortel-schumann
source_ids:
