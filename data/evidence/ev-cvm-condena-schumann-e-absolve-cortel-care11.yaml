notes: 'Corrige o que o acervo publicara no lote 313 a partir de reportagem: a condenação é de 25/11/2025, não de
  2022 (ano das operações), e é por prática não equitativa, com absolvição da acusação de manipulação. RESOLVIDO
  (19/09/2026, releitura integral do voto): a companheira de Roberto é nomeada por extenso no próprio cabeçalho
  do voto (Priscila Oliveira Gomes) — é parte formal do processo, acusada e depois absolvida, não terceira
  incidental; a cautela da CVM com iniciais vale para testemunhas/terceiros (ex.: V.C.N., F.G.), não para os
  quatro acusados nomeados. As iniciais V.C.N. são do documento; a identificação com Vicente Conte Neto vem da
  imprensa.'
