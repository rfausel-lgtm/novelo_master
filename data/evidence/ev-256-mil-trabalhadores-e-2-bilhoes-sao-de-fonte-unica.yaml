id: ev-256-mil-trabalhadores-e-2-bilhoes-sao-de-fonte-unica
kind: evidence
classification: A
proposition: Os números de 256.016 trabalhadores baianos arrolados e de R$ 2 bilhões em garantias de crédito
  aparecem em uma única reportagem, do Livecoins, que afirma ter acessado mais de duas mil páginas dos
  autos sem reproduzir número de processo, vara, tribunal ou trecho literal do documento. Nenhuma das
  demais reportagens sobre o mesmo processo — que convergem na cifra de dívida de cerca de R$ 1,5 a 1,6
  bilhão — reproduz esses dois números. Tratados como classe A até confirmação documental.
