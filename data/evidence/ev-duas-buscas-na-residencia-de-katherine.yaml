id: ev-duas-buscas-na-residencia-de-katherine
kind: evidence
classification: D
proposition: 'A residência de Katherine Venâncio Telles em Santos/SP foi alvo de duas buscas e
  apreensões distintas. A primeira, em 06/03/2026 por volta das 6h — no dia seguinte ao depoimento dela
  por videoconferência —, quando agentes da PF compareceram e ela entregou espontaneamente celular e
  notebook, sem resistência. A segunda, em 14/05/2026, em cumprimento ao Mandado de Busca e Apreensão nº
  288/2026 (deferido por André Mendonça em 13/05/2026, no bojo da representação da 6ª fase), quando foram
  apreendidos um iPhone 17 Pro Max e um notebook Dell 13 XPS. A defesa afirma não ter localizado nos
  autos o termo de cumprimento e o auto de apreensão dessa segunda diligência.'
document_ids:
- doc-2026-05-28-manifestacao-defesa-katherine
source_ids:
