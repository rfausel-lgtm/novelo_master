date: '2026-03-06'
notes: São dois episódios com aparelhos distintos apreendidos em cada um — não uma única diligência
  contada duas vezes. A alegação da defesa sobre ausência de termo de apreensão da segunda busca nos
  autos é uma questão processual levantada por ela, não um fato confirmado de forma independente pelo
  corpus; fica registrada como ponto em aberto, não como irregularidade estabelecida.
