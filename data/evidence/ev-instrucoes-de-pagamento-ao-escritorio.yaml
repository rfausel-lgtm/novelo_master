id: ev-instrucoes-de-pagamento-ao-escritorio
kind: evidence
classification: D
proposition: 'O relatório reproduz orientações de Daniel Vorcaro e de seus funcionários sobre os pagamentos
  ao escritório: o primeiro, de R$ 3.422.268,14, em 08/02/2024; cobrança de Fábio Faria em 15/03/2024
  — ''O careca não pode atrasar''; determinação de Vorcaro de que o pagamento ''não pode atrasar um dia'',
  de que ''é o pgto mais importante que temos'' e de que se pode ''pagar sempre, sem nota''; orientação,
  em 01/04/2025, de que ninguém tivesse acesso ao contrato; e, em 01/10/2025, de que os pagamentos não
  fossem feitos por PIX. São falas do contratante e de sua equipe, não do escritório.'
