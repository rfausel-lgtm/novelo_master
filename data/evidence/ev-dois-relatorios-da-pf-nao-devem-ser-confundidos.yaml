id: ev-dois-relatorios-da-pf-nao-devem-ser-confundidos
kind: evidence
classification: I
proposition: 'Circulam publicamente dois documentos distintos da Polícia Federal que a cobertura tende
  a embaralhar: o IPJ-A nº 3298613/2026, de 218 páginas, datado de 27/08/2026, assinado por três agentes
  e quatro delegados, produzido na PET 16.662 sobre o celular de Vorcaro; e um relatório de inteligência
  da Dicor, de cerca de cinquenta páginas e sem assinatura, que a própria PF classificou como sem valor
  probatório e que foi usado por Alexandre de Moraes contra André Mendonça no INQ 4.781. A ressalva de
  ausência de valor probatório alcança apenas o segundo. RESSALVA acrescentada após leitura da íntegra
  da decisão da Presidência: ela não qualifica esses relatórios como sem assinatura nem como desprovidos
  de valor probatório — diz apenas que ''provêm de unidade de inteligência diversa da equipe técnica que
  subscreve as representações nos feitos sob relatoria do Ministro André Mendonça''. A caracterização
  registrada neste acervo vem de cobertura jornalística e não foi confirmada em fonte primária; trate-se
  como alegação a verificar, não como fato estabelecido.'
