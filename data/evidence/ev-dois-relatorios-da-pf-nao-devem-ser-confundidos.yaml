inference_basis: Comparação entre a identificação formal do IPJ-A nº 3298613/2026 no próprio relatório
  lido pela equipe — número, data, assinaturas, destinatário e extensão — e a descrição do relatório de
  inteligência da Dicor na cobertura, com extensão, ausência de assinatura e a classificação atribuída
  pela própria corporação.
