id: ev-dois-relatorios-da-pf-nao-devem-ser-confundidos
kind: evidence
classification: I
proposition: 'Circulam publicamente dois documentos distintos da Polícia Federal que a cobertura tende
  a embaralhar: o IPJ-A nº 3298613/2026, de 218 páginas, datado de 27/08/2026, assinado por três agentes
  e quatro delegados, produzido na PET 16.662 sobre o celular de Vorcaro; e um relatório de inteligência
  da Dicor, de cerca de cinquenta páginas e sem assinatura, que a própria PF classificou como sem valor
  probatório e que foi usado por Alexandre de Moraes contra André Mendonça no INQ 4.781. A ressalva de
  ausência de valor probatório alcança apenas o segundo.'
