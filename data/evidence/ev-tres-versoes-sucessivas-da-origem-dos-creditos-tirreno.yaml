id: ev-tres-versoes-sucessivas-da-origem-dos-creditos-tirreno
kind: evidence
classification: D
proposition: 'Segundo apurou o Banco Central, o Banco Master ofereceu ao menos três explicações sucessivas
  e distintas para a origem dos créditos vendidos ao BRB via Tirreno. Primeiro (questionado em março de
  2025), atribuiu a origem a duas associações de servidores da Bahia (Asteba e Asseba) — explicação que não
  se sustentou: os valores hipotéticos máximos das associações (~R$ 1 bilhão) ficavam muito aquém dos R$
  6,7 bilhões alegados, e CPFs de diversas localidades do país foram usados para simular a origem. Depois,
  passou a apresentar a própria Tirreno como originadora direta — versão também questionada, já que a
  Tirreno não teve nenhuma movimentação financeira própria (TEDs, PIX, boletos, câmbio) nem registro no
  Sistema de Informações de Crédito (SCR), e seu único relacionamento no Sistema Financeiro Nacional era com
  o próprio Master. Só em 18/06/2025 o BRB passou a apresentar a Cartos, via seus promotores de crédito, como
  a origem efetiva, amparada por um acordo operacional Tirreno-Cartos de 03/01/2025, assinado à mão e sem
  reconhecimento de firma — segundo o qual a Cartos teria cedido os créditos a três fundos de investimento
  em direitos creditórios (FIDC Noto, FIDC Sueste e FIDC VCK). Nenhuma das três versões foi confirmada pelo
  Banco Central até a data dos documentos lidos.'
