notes: A sucessão de versões, por si só, é o que o Banco Central registra como indício de simulação — não
  se afirma aqui que qualquer uma das três seja verdadeira ou falsa isoladamente, apenas que nenhuma foi
  confirmada e que a origem mudou de explicação repetidamente.
