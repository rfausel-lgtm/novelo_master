id: ev-pf-apura-se-parte-do-dinheiro-do-filme-custeou-permanencia-nos-eua
kind: evidence
classification: A
proposition: 'A linha de apuração em curso não se limita a confirmar as remessas: busca esclarecer se
  a totalidade do valor enviado ao fundo norte-americano foi de fato destinada à produção do filme ou
  se parte teve outra finalidade — especificamente, se custeou a permanência de Eduardo Bolsonaro nos
  Estados Unidos. Eduardo Bolsonaro nega ter recebido qualquer recurso da produção. O fundo é administrado
  por advogado descrito como próximo a ele, e parte da cobertura o identifica como advogado de imigração.'
