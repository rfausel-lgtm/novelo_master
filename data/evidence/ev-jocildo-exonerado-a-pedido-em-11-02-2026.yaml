classification: D
proposition: Cinco dias após a operação Zona Cinzenta, Jocildo Silva Lemos foi exonerado a pedido do cargo
  de diretor-presidente da Amprev, pelo Decreto nº 0757, de 11/02/2026. No mesmo dia, o site oficial da
  autarquia publicou o comunicado em que ele apresenta o pedido, afirmando querer que a Justiça atue com
  independência.
