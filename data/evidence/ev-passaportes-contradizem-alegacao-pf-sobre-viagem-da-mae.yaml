id: ev-passaportes-contradizem-alegacao-pf-sobre-viagem-da-mae
kind: evidence
classification: D
proposition: 'A defesa de Katherine Venâncio Telles apresentou ao STF os passaportes de sua mãe, Erica
  Venancio (nº FV112408), e de seu padrasto, José Marcos e Souza (nº FV109741), ambos emitidos em
  02/02/2018 pela Delegacia da Polícia Federal em Santos/SP, com validade até 01/02/2028, além do bilhete
  aéreo de uma viagem internacional efetivamente realizada entre 03/04/2026 e 19/04/2026. A Polícia
  Federal, em consulta a sistemas internos por volta de março de 2026, já havia afirmado não terem sido
  encontradas reservas de voo para "Erica Venancio ou Fabio Da Silva Teles" — este último identificado
  pela própria PF como o outro genitor de Katherine — e que "Fabio sequer possui passaporte emitido pela
  Polícia Federal".'
