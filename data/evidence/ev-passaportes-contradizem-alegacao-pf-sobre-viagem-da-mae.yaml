date: '2026-05-28'
notes: 'Contraponto direto, com documento, a uma afirmação da PF já registrada no perfil de Katherine
  Venâncio Telles (decisão de 13/05/2026, lote 190): que "nenhum registro de viagem internacional da mãe
  foi localizado em 2026" — alegação que ela deu, em depoimento, para justificar a viagem a Santos como
  planejada com antecedência. Atenção à precisão: os passaportes apresentados são de Erica Venancio (mãe)
  e de José Marcos e Souza (padrasto) — a defesa não apresenta passaporte de Fabio Da Silva Teles, que a
  própria PF nomeia como o segundo genitor e afirma não possuir documento de viagem. Ou seja, os
  documentos comprovam que a mãe e o padrasto tinham passaporte válido e fizeram uma viagem internacional
  efetiva em abril de 2026 — o que contradiz a busca de "reservas de voo" da PF de março — mas não tratam
  especificamente do pai biológico. Registrado com essa distinção para não estender a prova além do que
  ela demonstra.'
