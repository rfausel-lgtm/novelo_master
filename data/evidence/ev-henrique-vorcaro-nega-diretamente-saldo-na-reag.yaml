id: ev-henrique-vorcaro-nega-diretamente-saldo-na-reag
kind: evidence
classification: D
proposition: Em petição própria de 09/03/2026 (não apenas por menção na petição do filho), a defesa de Henrique
  Vorcaro nega que a conta dele na Reag tenha qualquer saldo ou tenha sido usada para repasse de valores, classificando
  a cobertura de imprensa sobre o tema como infundada.
