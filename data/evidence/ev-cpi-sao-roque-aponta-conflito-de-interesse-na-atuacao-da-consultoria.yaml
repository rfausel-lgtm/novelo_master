id: ev-cpi-sao-roque-aponta-conflito-de-interesse-na-atuacao-da-consultoria
kind: evidence
classification: C
proposition: O relatório final da CPI municipal de São Roque aponta que a Crédito & Mercado acumulava o papel de
  emitir pareceres de investimento e de implementar o programa Pró-Gestão RPPS no instituto — potencial conflito
  de interesse — e conclui que os pareceres anteriores aos investimentos no Master não destacaram com clareza riscos
  como a ausência de garantia do FGC, a concentração em emissor único e a baixa liquidez dos papéis, recomendando
  avaliar medidas administrativas e judiciais contra a consultoria.
