id: ev-tcu-acordao-5163-2026-sobresta-as-contas-de-2025-do-banco-central
kind: evidence
classification: D
proposition: >-
  Em 13/10/2026, a 2ª Câmara do TCU, no Acórdão 5163/2026 (relator Jorge Oliveira), decidiu sobrestar o
  julgamento das contas de 2025 do Banco Central do Brasil (TC 007.138/2026-1) até o trânsito em julgado da
  deliberação a ser proferida no TC 022.950/2025-7, quando a unidade técnica deverá avaliar se o TC
  008.216/2025-8 e a Reclamação 88.121 do STF têm potencial para influir no mérito das contas; a unidade
  técnica propunha julgá-las regulares, com quitação plena, e o sobrestamento acompanha o parecer do MPTCU.
document_ids:
- doc-2026-10-13-tcu-acordao-5163-2026-segunda-camara-sobrestamento-das-contas-de-2025-do-bc
source_ids:
- src-tcu-2026-10-13-acordao-5163-2026-segunda-camara-tc-007-138-2026-1
excerpt: >-
  ACORDAM em sobrestar o julgamento destas contas até o trânsito em julgado da deliberação a ser proferida no
  TC Processo 022.950/2025-7
locator: acórdão, dispositivo e considerandos
date: '2026-10-13'
notes: >-
  O acórdão não aponta irregularidade de ninguém; os "responsáveis" listados (o presidente do Banco Central e
  outros oito gestores) são os gestores que prestam as contas. CPFs mascarados exibidos pelo acórdão não são
  registrados. D demonstra o que o TCU decidiu, não qualquer fato sobre a gestão do Banco Central.
