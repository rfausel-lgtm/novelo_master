id: ev-estado-de-sp-suspendeu-o-codigo-mas-manteve-o-credenciamento
kind: evidence
classification: D
proposition: Contradição administrativa documentada em dois atos da mesma diretoria. Em março de 2026
  o Estado de São Paulo determinou a suspensão do código de desconto da operadora, com efeitos retroativos
  a 19/02/2026, por descumprimento do próprio inciso que a admitira. Cinco meses depois, em 10/08/2026,
  o comunicado que fixa o cronograma de recadastramento das consignatárias credenciadas traz, no anexo,
  aquela mesma empresa com aquele mesmo código e data de recadastramento marcada para novembro de 2026.
  As retificações de maio e junho de 2026 mantêm o registro. Código suspenso desde fevereiro, credenciamento
  formalmente preservado em agosto.
