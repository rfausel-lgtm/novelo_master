id: ev-vinte-e-duas-empresas-proibidas-de-contratar-com-o-poder-publico
kind: evidence
classification: D
proposition: A decisão suspendeu o direito de licitar e contratar com o poder público, em qualquer esfera federativa,
  de 22 empresas — a primeira delas a produtora Go Up Entertainment Ltda. — e suspendeu qualquer pagamento oriundo
  de contratos com o poder público a essas empresas, salvo autorização específica do relator.
document_ids:
- doc-2026-09-03-decisao-dino-pet16669-operacao-make-up
excerpt: 'SUSPENDO o direito de licitar e contratar com o Poder Público, em qualquer esfera federativa, das seguintes
  pessoas jurídicas: (1) GO UP ENTERTAINMENT LTDA.'
locator: p. 146-147 (itens III.E e III.F)
date: '2026-09-03'
notes: Entre as 22 estão as empresas de tecnologia que executavam o contrato de wi-fi da prefeitura de São Paulo
  — Complexsys, FastFuture, Ultra IP, Urban Connect e JP Grass —, de modo que a medida alcança contratos públicos
  em execução.
