proposition: 'Elemento pouco explorado: a PGR se opôs à Polícia Federal. Em parecer de 16/06/2026, dois
  dias antes da deflagração da 9ª fase, o órgão manifestou-se contra os pedidos de apreensão de dinheiro,
  joias e relógios — sob o argumento de que atrairia ''atenção midiática desnecessária'' sem contribuir
  para a apuração — e contra a busca no gabinete parlamentar, que configuraria ''ingerência entre os poderes''.
  A reportagem que noticia o parecer não o reproduz nem nomeia seu signatário.'
