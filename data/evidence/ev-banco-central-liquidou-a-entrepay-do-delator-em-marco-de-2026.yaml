id: ev-banco-central-liquidou-a-entrepay-do-delator-em-marco-de-2026
kind: evidence
classification: D
proposition: O Banco Central decretou em 27/03/2026, pelo Ato do Presidente nº 1.381, a liquidação extrajudicial
  da Entrepay Instituição de Pagamento S.A. e de outras duas instituições do mesmo conglomerado, por comprometimento
  da situação econômico-financeira, infringência às normas e prejuízos que sujeitam credores a risco anormal; a
  liquidação está averbada na razão social registrada na Receita Federal, e a empresa é dirigida por Antonio Carlos
  Freixo Júnior desde fevereiro de 2022.
