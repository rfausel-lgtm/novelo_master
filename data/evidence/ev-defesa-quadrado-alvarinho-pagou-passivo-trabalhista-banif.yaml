id: ev-defesa-quadrado-alvarinho-pagou-passivo-trabalhista-banif
kind: evidence
classification: A
proposition: Em agravo regimental, Maurício Quadrado, Luís Fernando de Almeida e Flávio Daniel Aguetoni
  alegam que os R$ 18.268.809,43 captados via notas comerciais subscritas pelo FIDC Alvarinho foram
  integralmente destinados ao pagamento de 32 acordos trabalhistas homologados do passivo do BANIF — Banco
  Internacional do Funchal (Brasil) S.A. —, sem qualquer valor desviado ou revertido em seu favor, com
  documentação (extratos, comprovantes, planilhas) já juntada em petições anteriores.
