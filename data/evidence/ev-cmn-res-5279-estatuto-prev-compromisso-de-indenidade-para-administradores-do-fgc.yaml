id: ev-cmn-res-5279-estatuto-prev-compromisso-de-indenidade-para-administradores-do-fgc
kind: evidence
classification: D
proposition: Segundo o estatuto do FGC com a inclusão feita pela Resolução CMN 5.279, o fundo pode celebrar
  compromisso de indenidade, além de seguro de responsabilidade civil, em favor de membros de seus conselhos,
  da diretoria, de comitês e de funcionários em cargos de gestão, para despesas decorrentes de procedimentos
  relativos a atos de exercício regular de gestão, definidos como os praticados de forma diligente, de boa-fé
  e em cumprimento dos deveres fiduciários.
