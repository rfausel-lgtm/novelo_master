id: ev-pf-estimativa-de-r-468-mil-em-viagens-e-jantares-de-ciro-nogueira
kind: evidence
classification: A
proposition: >-
  Segundo a Agência O Globo (16/06/2026), a PF estima em R$ 468.721,78 o "benefício econômico direto" do
  senador Ciro Nogueira em viagens (Nova York, Lisboa e Courchevel) e jantares pagos por Daniel Vorcaro. O
  valor consta do relatório como estimativa; não há comprovante no corpus.
