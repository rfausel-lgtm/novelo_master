id: ev-cmn-res-5279-estatuto-art-25-composicao-e-impedimentos-do-conselho-de-administracao
kind: evidence
classification: D
proposition: O texto consolidado da Res. CMN 4.222 (v19, BC) marca como redação dada pela Res. CMN 5.279, de
  22/1/2026, o art. 25 do estatuto do FGC, que prevê Conselho de Administração de cinco a nove membros,
  pessoas naturais residentes no país, e traz, nos incisos I e II, as vedações à participação de pessoas
  ligadas a instituições financeiras e a entidades de classe do setor. O inciso III do mesmo artigo consta
  como revogado pela 5.279.
document_ids:
  - doc-2026-01-22-res-cmn-5279-redacoes-no-texto-consolidado-da-res-4222
source_ids:
  - src-bcb-normativos-res-4222-v19-texto-consolidado-2026
excerpt: não é permitida a participação de controladores, administradores ou funcionários de instituições financeiras
locator: Anexo I (estatuto), art. 25, caput e incisos I e II (redação dada); inciso III (revogado)
date: 2026-01-22
notes: D demonstra o conteúdo do dispositivo no texto consolidado; o consolidado não mostra a redação anterior
  nem o que o inciso III revogado previa, e o Novelo não o afirma.
