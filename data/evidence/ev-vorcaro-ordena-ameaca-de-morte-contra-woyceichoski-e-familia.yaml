id: ev-vorcaro-ordena-ameaca-de-morte-contra-woyceichoski-e-familia
kind: evidence
classification: D
proposition: Daniel Vorcaro determinou, a partir de 28/05/2024, levantamento de dados sobre o ex-funcionário Luís
  Felipe Woyceichoski e sua família, e ordenou que a 'Turma' o intimidasse; em 11/07/2025, sete pessoas identificadas
  por Woyceichoski como milicianos foram até seu local de trabalho e o ameaçaram de morte, a ele e à família, em
  nome de Vorcaro.
