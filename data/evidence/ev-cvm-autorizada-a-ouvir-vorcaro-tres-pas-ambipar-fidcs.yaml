date: '2026-07-24'
notes: Confirma que a apuração da CVM sobre a Ambipar (já no acervo) corre como processo sancionador formal
  com Vorcaro pessoalmente na mira, e revela cinco fundos (FIDCs) até então não registrados no acervo — sem
  detalhamento adicional disponível sobre valores ou mecanismo específico de fraude em cada um.
