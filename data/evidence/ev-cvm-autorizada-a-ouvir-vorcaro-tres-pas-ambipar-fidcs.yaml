id: ev-cvm-autorizada-a-ouvir-vorcaro-tres-pas-ambipar-fidcs
kind: evidence
classification: D
proposition: Em 24/07/2026, o STF autorizou a CVM a colher depoimento de Daniel Vorcaro, preso, para
  instruir três Investigações Administrativas sancionadoras da autarquia — sobre a Ambipar (mercados à
  vista e de derivativos, 2024-2025), sobre notas comerciais adquiridas pelos fundos CITY-02 FIDC, CITY
  FIDC, Máxima FIM – Crédito Privado 2, MN I FIDC e ST 1001 FIDC, e sobre CRIs adquiridos pelos três
  primeiros desses fundos.
