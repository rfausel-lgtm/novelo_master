id: ev-mps-rejeitou-a-tese-do-conglomerado
kind: evidence
classification: D
proposition: Em 13/12/2024 o Ministério da Previdência rejeitou formalmente, por nota técnica, a tese
  de que uma instituição bancária se torne elegível a captar recursos de regimes próprios por pertencer
  a conglomerado prudencial cuja líder cumpre os requisitos, e assentou que o art. 21, § 8º, da Resolução
  CMN 4.963/2021 não alcança os emissores do art. 7º, IV. É a variante que mais se aproxima do argumento
  apresentado pelo banco ao comitê do Amapá, apoiado na presença da corretora do grupo na lista.
