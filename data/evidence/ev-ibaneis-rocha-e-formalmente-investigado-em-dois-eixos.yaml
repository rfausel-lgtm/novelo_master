proposition: 'O governador do Distrito Federal, Ibaneis Rocha, é formalmente investigado em dois eixos citados pela
  CPI do Crime Organizado e reconhecidos por decisão do STF de 02/04/2026: as relações comerciais do escritório
  de advocacia que leva seu nome com entidades investigadas nas operações Compliance Zero e Carbono Oculto, e seu
  papel institucional nas decisões do BRB sobre a compra do Banco Master.'
