notes: Registro da divergência, não da conclusão. Os veículos concordam que a PF ganhou autonomia pericial e
  acesso ampliado dentro da corporação e que novas investigações dependem de pedido ao relator; divergem sobre
  se houve "redução" do sigilo. O Novelo não adota nenhuma das leituras dos veículos para além do que o texto
  da decisão diz.
