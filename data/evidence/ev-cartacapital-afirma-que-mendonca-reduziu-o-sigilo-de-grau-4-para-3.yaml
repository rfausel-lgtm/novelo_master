id: ev-cartacapital-afirma-que-mendonca-reduziu-o-sigilo-de-grau-4-para-3
kind: evidence
classification: A
proposition: Segundo a CartaCapital (19/02/2026), Mendonça decidiu reduzir o grau de sigilo do caso Master,
  que teria passado de grau 4 para 3; o título do InfoMoney (Estadão Conteúdo) também fala em redução,
  enquanto o Jovem Pan (mesmo texto do Estadão Conteúdo) intitula que o ministro mantém o sigilo, e a notícia
  do STF e o texto da decisão falam em manutenção do nível III.
