date: '2026-04-30'
notes: É o ato formal que, pela primeira vez em documento único, nomeia os três em coautoria pelo conjunto
  de crimes de corrupção — Paulo Sérgio Neves de Souza e Belline Santana já eram extensamente documentados
  no acervo a partir de reportagens sobre cautelares e sindicâncias internas do BC, mas não a partir deste
  ato formal de instauração de investigação criminal. A prorrogação mais recente (04/09/2026) confirma que
  a investigação segue em curso sem denúncia oferecida, atualizando o open_question já registrado nos
  perfis dos dois. A representação que originou a PET, de 23/02/2026, está registrada em
  ev-pf-descreve-servidores-do-bc-como-consultores-informais-de-vorcaro.
