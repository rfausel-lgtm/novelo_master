id: ev-instauracao-formal-investigacao-corrupcao-vorcaro-bc
kind: evidence
classification: D
proposition: 'Em 30/04/2026, o ministro André Mendonça autorizou, na PET 15.504/DF, a instauração de
  procedimento investigatório vinculado ao INQ 5.026 para apurar corrupção ativa e passiva, organização
  criminosa, lavagem de capitais, violação de sigilo funcional e crimes contra o Sistema Financeiro
  Nacional atribuídos a Daniel Bueno Vorcaro em coautoria com os servidores do Banco Central Paulo Sérgio
  de Souza e Belline Santana, acolhendo representação da Polícia Federal e parecer favorável da PGR. Em
  13/07/2026 e novamente em 04/09/2026, a investigação foi prorrogada por mais 60 dias a cada vez — sem
  denúncia até a data mais recente disponível.'
document_ids:
- doc-2026-04-30-decisao-pet15504-instauracao-corrupcao-bc
source_ids:
