id: ev-pf-2026-10-27-entressafras-nove-mandados-sao-roque-prev
kind: evidence
classification: D
proposition: Segundo nota da PF de 27/10/2026, foram cumpridos nove mandados de busca e apreensão em São Paulo
  e Pernambuco na Operação Entressafras, que investiga possíveis crimes contra o Sistema Financeiro Nacional
  na gestão de recursos do São Roque Prev entre 2022 e 2024 e apura investimentos de cerca de R$ 100 milhões.
  A nota demonstra o que a PF comunicou; não nomeia banco, investigados nem juízo e não é acusação formal.
