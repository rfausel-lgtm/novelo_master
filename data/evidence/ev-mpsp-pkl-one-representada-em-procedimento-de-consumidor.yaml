id: ev-mpsp-pkl-one-representada-em-procedimento-de-consumidor
kind: evidence
classification: D
proposition: 'O único procedimento do Ministério Público paulista com a operadora nominada, localizado
  em fonte oficial, é de natureza consumerista: registra o Banco Master como reclamado e a PKL One como
  representada, sob a ementa ''irregularidade no atendimento''. Não há, no material localizado, apuração
  ministerial dedicada ao credenciamento em si — ao contrário do que ocorre em Mato Grosso, onde o episódio
  chegou ao Superior Tribunal de Justiça.'
