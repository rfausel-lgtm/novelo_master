id: ev-espirito-santo-declara-cartao-de-beneficio-atividade-privativa-de-banco
kind: evidence
classification: D
proposition: 'Um governo estadual afirmou por escrito, em ato publicado, aquilo que até então era leitura
  de terceiros: ''a oferta e administração de cartão consignado de benefício constituem atividade privativa
  de instituição financeira, sendo obrigatória a autorização do Banco Central do Brasil - BACEN para o
  seu funcionamento''. O peso da declaração está no percurso do próprio estado, que em 2023 criara para
  o produto margem adicional de 10%, no mesmo desenho do Rio de Janeiro e de Mato Grosso, e dois anos
  depois restabeleceu o filtro que o Rio dispensara e que São Paulo e Mato Grosso haviam transferido para
  o parceiro bancário. A portaria exige ainda previsão expressa da atividade no estatuto social da credenciada.'
