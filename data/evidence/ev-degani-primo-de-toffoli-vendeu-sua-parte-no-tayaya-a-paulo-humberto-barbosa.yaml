id: ev-degani-primo-de-toffoli-vendeu-sua-parte-no-tayaya-a-paulo-humberto-barbosa
kind: evidence
classification: C
proposition: Mario Umberto Degani, o Beto Degani, fundador do Resort Tayayá, é primo do ministro Dias Toffoli e vendeu em
  2025 sua participação no resort ao advogado Paulo Humberto Barbosa e a empresas ligadas a ele — segundo duas
  reportagens, uma das quais afirma que Barbosa comprou as participações de todos os sócios, inclusive as de Toffoli e
  parentes.
