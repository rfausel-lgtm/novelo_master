date: '2025-07'
notes: 'O Jornal de Brasília detalha o parentesco (Iracema Dias Degani, mãe de Degani, era irmã de Sebastiana Seixas Dias,
  mãe do ministro) e data a venda em julho de 2025. A nota do ministro de 12/02/2026 diz que a Maridt vendeu o saldo de
  sua participação à PHD Holding em 21/02/2025; se a PHD é a holding de Barbosa, a grafia oficial e a data de cada
  operação não foram conferidas. Barbosa figura no acervo como investigado no INQ 5.026 dispensado de comparecimento à
  CPI; esta é a primeira informação sobre o papel dele no caso.'
