id: ev-simonetti-recusa-pautar-afastamento-moraes-toffoli
kind: evidence
classification: C
proposition: 'Em reunião do Conselho Federal da OAB de 14/09/2026, o conselheiro Marcelo Tostes (MG) pediu
  que fosse pautada a deliberação sobre o afastamento cautelar de Alexandre de Moraes e Dias Toffoli,
  citando o contrato do escritório da esposa de Moraes com o Banco Master e os pedidos de impeachment já
  aprovados por seccionais estaduais. O presidente Beto Simonetti recusou pautar o tema, alegando que a
  comissão criada em 09/09/2026 (formada pela própria diretoria do Conselho Federal e por presidentes de
  seccionais) ainda examinava o caso. O conselheiro Telles criticou publicamente a recusa.'
