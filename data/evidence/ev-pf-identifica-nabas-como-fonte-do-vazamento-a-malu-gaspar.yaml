id: ev-pf-identifica-nabas-como-fonte-do-vazamento-a-malu-gaspar
kind: evidence
classification: D
proposition: 'A Polícia Federal apurou, com base em auditorias dos sistemas SISCRIM e SARD e em depoimentos dos
  delegados Janaína Palazzo, Marcelo Botelho e Dennis Cali, que o Perito Criminal Federal João Cláudio Nabas
  acessou o Laudo Pericial nº 4281/2025 (celular de Daniel Vorcaro) em 01/12/2025, criou em 04/12/2025 os
  arquivos "Moraes.pdf" e "Toffoli e esposa.pdf", e em 05/12/2025 encaminhou-os à delegada Janaína Palazzo,
  incentivando-a a conversar com a jornalista Malu Gaspar, de quem disse ser fonte havia anos. Em 09/12/2025, O
  Globo publicou reportagem cujo conteúdo, segundo a PF, corresponde diretamente ao material do arquivo
  "Moraes.pdf" (prints de conversas entre Vorcaro e a advogada Viviane Barci de Moraes, e trechos do contrato
  dela com o Banco Master). A defesa de Vorcaro e a PGR só tiveram acesso ao material em março e janeiro de
  2026, respectivamente — depois da publicação —, o que reforça a hipótese de que o vazamento partiu de quem já
  tinha acesso funcional ao acervo.'
