id: ev-emenda-30-de-wagner-criava-teto-de-juros
kind: evidence
classification: D
proposition: 'Correção relevante, em favor do investigado, sobre ponto amplamente mal reportado. A Emenda
  nº 30 à Medida Provisória 1.106/2022 é de autoria do senador Jaques Wagner e foi apresentada em 22/03/2022
  — mas seu conteúdo NÃO ampliava a margem consignável: propunha que as taxas de juros de todas as modalidades
  de consignado não excedessem 300% da taxa média do CDI. É dispositivo restritivo, e não expansivo. Além
  disso, a emenda NÃO foi incorporada ao texto final da lei. A MP recebeu 66 emendas, teve relatoria de
  Davi Alcolumbre no Plenário e foi convertida na Lei 14.431/2022 em 03/08/2022, com sanção e veto parcial.
  Manchetes que afirmam que Wagner ''defendeu emenda que beneficiaria o Master'' — empregadas por veículos
  de posições editoriais opostas — são imprecisas quanto ao conteúdo do dispositivo que ele assinou.'
