id: ev-itaguai-aplicou-mais-de-vinte-por-cento-da-carteira
kind: evidence
classification: D
proposition: 'O regime próprio de Itaguaí aplicou R$ 29,6 milhões em 28/06/2024 e R$ 30 milhões em 03/07/2024
  — R$ 59,6 milhões — em letras financeiras do Banco Master. A carteira da autarquia era de R$ 279.518.530,17
  em 31/12/2024, de modo que a exposição a um único emissor superava vinte por cento do total. O tribunal
  apontou quatro achados: aplicações irregulares, credenciamento irregular, falha do controle interno
  e falta de transparência.'
