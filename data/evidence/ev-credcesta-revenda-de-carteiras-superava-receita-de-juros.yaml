id: ev-credcesta-revenda-de-carteiras-superava-receita-de-juros
kind: evidence
classification: C
proposition: 'Segundo o balanço de 2024 do Banco Master, o CredCesta chegou a 24 unidades da Federação
  e 176 municípios, contra 20 estados e 130 municípios em 2023, com R$ 10,5 bilhões em direitos a receber
  vinculados ao produto e uma base de clientes com crédito ativo que saltou de 33.685 em 2018 para 5,8
  milhões em 2024. O dado mais revelador sobre a natureza do negócio: em 2024, a receita com REVENDA de
  carteiras do CredCesta foi de R$ 1,6 bilhão, contra R$ 709 milhões de juros das operações originais
  — e, no acumulado de 2022 a 2024, R$ 2,4 bilhões com venda de carteiras contra R$ 1,9 bilhão de juros.
  Ou seja, o negócio principal era vender a carteira, não emprestar. Os juros praticados ficavam entre
  4,72% e 4,98% ao mês, contra média de mercado do consignado público entre 1,37% e 1,59% ao mês. Há divergência
  não conciliada quanto ao número de contratos: 2,75 milhões no INSS em 2024, contra 324.849 contratos
  ativos ao fim de 2025 — provavelmente bases distintas, sem explicação nas fontes.'
