id: ev-newton-ramos-nota-de-21-09-sobre-camilla-ramos-e-vorcaro
kind: evidence
classification: A
proposition: >-
  Em nota publicada pelo Metrópoles e pela CNN Brasil em 21/09/2026, o desembargador Newton Ramos afirmou ser
  casado com a advogada Camilla Ramos, "que atua em causas cíveis para o Banco Master", que o casal mantinha
  "relação pessoal com o ex-banqueiro antes dos fatos ora objeto de investigação", que, "em razão da
  participação societária na empresa Prime You, o empresário foi consultado sobre a disponibilidade de imóveis e
  transportes", e que "nunca julguei qualquer causa de interesse do Banco Master".
attributed_to_id: newton-ramos
