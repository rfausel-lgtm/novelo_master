date: '2026-09-21'
notes: >-
  Trechos conferidos literalmente no Metrópoles em 16/10/2026; a CNN Brasil reproduz a nota a partir da menção à
  Prime You. A nota não esclarece de quem é a participação societária na Prime You; o Novelo não a interpreta.
