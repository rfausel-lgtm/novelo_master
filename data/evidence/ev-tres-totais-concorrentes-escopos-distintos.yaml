id: ev-tres-totais-concorrentes-escopos-distintos
kind: evidence
classification: C
proposition: 'Três cifras totais aparecem na imprensa sobre pagamentos do Master a prestadores de serviços
  jurídicos/consultoria, com escopos DISTINTOS, não contraditórios entre si: (1) R$ 543 milhões a 91 escritórios
  de advocacia, 2022-2025 (quatro anos) — já registrado no corpus; (2) R$ 304,5 milhões a ''ao menos 98''
  escritórios, referente apenas a 2025 — mesma fonte primária (Receita Federal/CPI), recorte temporal
  menor; (3) R$ 870 milhões a ''empresas jovens'' fundadas a partir de 2021, 2022-2025 — universo mais
  amplo que inclui escritórios de advocacia recém-criados E consultorias/agências, não apenas advocacia.
  Nenhuma fonte localizada calcula um total único somando todos os fornecedores do Master de qualquer
  natureza e qualquer idade.'
