id: ev-jose-milton-integrou-a-comissao-de-diligencia
kind: evidence
classification: D
proposition: A comissão enviada a São Paulo para as diligências junto ao Banco Master, entre 21 e 23/07/2024
  — a visita técnica que condicionava o segundo aporte —, era composta por Carlos Roberto dos Anjos Oliveira,
  chefe da Divisão de Investimento e Mercado, e por José Milton Afonso Gonçalves, o próprio membro do
  comitê que propusera as aplicações. O relatório positivo destravou os R$ 100 milhões.
