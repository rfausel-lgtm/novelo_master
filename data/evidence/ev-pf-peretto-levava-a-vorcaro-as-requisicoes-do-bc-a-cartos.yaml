id: ev-pf-peretto-levava-a-vorcaro-as-requisicoes-do-bc-a-cartos
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, Henrique Peretto repassava a Daniel Vorcaro os pedidos do Banco Central à Cartos
  — em 02/07/2025 enviou-lhe, no mesmo dia em que foram assinadas, duas requisições do BC com 13 perguntas sobre as
  cessões BRB-Master-Tirreno-Cartos — e submeteu a ele sucessivas versões das respostas até 20/08/2025, quando a Cartos
  deixou de dizer que uma análise "exaustiva e complexa" não achara CCBs e passou a informar que as operações foram
  interrompidas por falta de liquidação da Tirreno e que o acordo entre as duas empresas fora distratado em 30/07/2025.
