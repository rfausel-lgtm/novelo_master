attributed_to: Polícia Federal, na IPJ-A nº 1252786/2026 (celular de Vorcaro) e no RAPJ nº 21161.02/2026 (celular de Peretto), juntados ao INQ 5.026
date: '2025-07-02'
notes: 'Para a PF, se a Cartos já sabia do distrato de 30/07, não precisaria da análise exaustiva descrita um dia antes, o
  que indica respostas construídas sob demanda. O mesmo relatório registra que, em 16/06/2025, Peretto enviou a Vorcaro
  o acordo operacional Cartos x Tirreno em arquivo editável e sem assinaturas, embora datado de 03/01/2025, e que em
  06/06/2025 lhe mandou um diagrama que espelha a segunda versão apresentada sobre a origem dos créditos. Pelo registro
  na Junta Comercial citado pela PF, Peretto aportou R$ 30 milhões no capital da Tirreno; a análise do celular dele
  aponta um FIDC de R$ 31,44 milhões que ele dizia reservado a esse aumento de capital. Complementa
  ev-pf-resposta-da-cartos-ao-bc-reescrita-sob-supervisao-de-vorcaro. Hipótese investigativa, sem denúncia.'
