id: ev-tres-estados-do-nordeste-autorizaram-expressamente-o-saque-pelo-cartao
kind: evidence
classification: D
proposition: 'O detalhe normativo que converte o cartão de benefício em empréstimo aparece expressamente
  em três estados do Nordeste. O Rio Grande do Norte admite a consignação para operações por cartão de
  benefício ''ou à utilização com a finalidade de saque''; o Piauí reserva 5% ''exclusivamente para a
  amortização de despesas contraídas por meio de cartão consignado de benefício ou para a utilização com
  a finalidade de saque''; Sergipe destina cinco pontos percentuais ao cartão ''ou utilização com finalidade
  de saque''. Pernambuco, por sua vez, não criou faixa exclusiva: sua norma de 2021 estabelece faixa de
  8% compartilhada entre liquidação de dívidas de cartão de crédito consignado e amortização de despesas
  com cartão de benefício.'
