id: ev-gerentes-caixa-asset-destituidos-antes-do-aporte
kind: evidence
classification: D
proposition: A ata do Conselho Estadual de Previdência registra que, em 08/07/2024 — quatro dias antes
  do primeiro aporte —, foi noticiada a destituição de dois gerentes da Caixa Asset que se opunham à compra
  de R$ 500 milhões em letras financeiras do Banco Master, em razão do risco e do valor considerado atípico
  da operação.
document_ids:
- doc-2025-12-16-ata-cep-cronologia-julho-2024
source_ids:
- src-diofe-8556-2025-12-16
excerpt: No dia 8 de julho de 2024, foi noticiado que dois gerentes da Caixa Asset foram destituídos de
  seus cargos por supostamente se oporem à compra de R$ 500 milhões em letras financeiras do Banco Master,
  em razão do risco envolvido e do valor considerado atípico da operação.
date: '2024-07-08'
notes: 'Achado de 12/09/2026: a CAIXA se recusou a entregar ao MPF, em 26/05/2025, os pareceres internos/notas
  técnicas da Caixa Asset sobre essa aquisição, invocando sigilo bancário/comercial/profissional e segredo
  de justiça na Representação TC 017.570/2024-7, em trâmite no TCU — número de processo até então não
  registrado no acervo, útil para consulta direta.'
