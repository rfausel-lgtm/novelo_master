notes: Prova que ele fez essa negativa e essa versão dos fatos — não prova sua veracidade, que contrasta
  com a caracterização da decisão do STF (já no acervo) de que ele estruturou uma "conta de passagem" para
  lavagem de dinheiro via Varajo Consultoria.
