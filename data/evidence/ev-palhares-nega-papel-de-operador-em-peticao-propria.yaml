id: ev-palhares-nega-papel-de-operador-em-peticao-propria
kind: evidence
classification: D
proposition: Em petição de 12/08/2026 — a primeira manifestação dele ou de advogado seu localizada no
  corpus —, Leonardo Augusto Furtado Palhares nega ter atuado como "operador" de Daniel Vorcaro, afirmando
  que sua única conduta no caso foi celebrar, por indicação de Fabiano Zettel, o contrato do projeto social
  "Jovens Potentes" com Belline Santana. Afirma ter respondido a todas as perguntas da Polícia Federal, sem
  exercer o direito ao silêncio, e cita a PET 15.504 como o procedimento com a documentação integral do
  projeto.
