id: ev-suspeicao-benjamim-botelho-fundamentos
kind: evidence
classification: D
proposition: Em 14/09/2026, Benjamim Botelho de Almeida apresentou arguição de suspeição contra o ministro
  André Mendonça, por dependência à STP 976 e à Pet 16.704/DF, alegando (i) encontro privado entre Mendonça e
  Daniel Vorcaro sobre a STP 976 — litígio do FIDC MEG, do ecossistema de fundos de Vorcaro, administrado pela
  Trustee DTVM (alvo da Compliance Zero) — e (ii) recebimento, pelo ministro, de proposta de "delação
  premiada seletiva" por advogado de Vorcaro em sessão de 16/06/2026, o que a peça argumenta violar o art. 4º,
  §§6º-7º, da Lei 12.850/2013. A peça alega ainda amizade próxima entre Mendonça e o advogado Ciro Rocha
  Soares, e que o voto do ministro pela prisão preventiva do pai de Vorcaro se apoiou em relatórios policiais
  com conteúdo de comunicações entre advogados de defesa e seus clientes.
