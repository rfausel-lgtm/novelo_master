date: '2026-09-14'
notes: 'Documento lido integralmente pela equipe (PDF baixado por Rafael via certificado digital). Os dois
  fundamentos centrais (encontro de 02/09 e delação seletiva de 16/06) estão corroborados por imprensa
  independente — ver ev-mendonca-recusa-delacao-seletiva-vorcaro e a atualização de
  rel-daniel-vorcaro-andre-mendonca-allegation. As alegações sobre a amizade com Ciro Rocha Soares e sobre o
  fundamento do voto na prisão preventiva do pai de Vorcaro são a caracterização do peticionante — um
  investigado com interesse direto no afastamento do relator — e não foram confirmadas por fonte
  independente até a data de publicação; tratadas como alegação, não fato estabelecido. A peça cita um
  "ministro revisor" divergente e um "ministro decano" que teria comparado a prática de monitorar
  comunicações de advogados de defesa a "regimes totalitários", sem identificá-los nominalmente no trecho
  lido — identidade não verificada pela equipe.'
