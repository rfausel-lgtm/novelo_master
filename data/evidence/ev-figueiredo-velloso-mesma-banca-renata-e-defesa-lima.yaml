id: ev-figueiredo-velloso-mesma-banca-renata-e-defesa-lima
kind: evidence
classification: D
proposition: 'Confirmado por CNPJ oficial (11.428.814/0001-48): a ''Figueiredo & Velloso Advogados Associados'',
  onde Renata Varandas — namorada pública do diretor-geral afastado da PF, Andrei Rodrigues — é sócia
  da área de comunicação desde 31/01/2025, é a MESMA pessoa jurídica fundada e administrada por Ticiano
  Figueiredo de Oliveira e Pedro Ivo Rodrigues Velloso Cordeiro, os dois advogados que assinaram e depois
  renunciaram (04-05/08/2026) à defesa de Augusto Ferreira Lima — um dos dois investigados centrais da
  Operação Compliance Zero. A defesa de Lima pela banca começou pelo menos na data de sua prisão (18/11/2025),
  gerando sobreposição de cerca de 8,5 meses com a presença de Renata na banca. Não há dois escritórios
  homônimos — nome, sócios-administradores, endereço e área de atuação (criminal, Brasília) coincidem
  em todas as fontes verificadas.'
