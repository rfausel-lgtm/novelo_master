id: ev-terminais-telefonicos-internacionais-da-organizacao
kind: evidence
classification: D
proposition: 'A análise do celular de Marilson Roseno da Silva revelou que ele mantinha, além do número
  brasileiro conhecido, uma conta secundária de WhatsApp Business associada a um número com DDI da
  Turquia (+905386670594), sob o codinome "MISTER", usada para se comunicar com outros integrantes da
  organização com o recurso de mensagens temporárias ativado — motivo pelo qual só havia, no aparelho,
  conversas recentes a partir de fevereiro de 2026. A PF mapeou outros terminais internacionais usados
  pelo grupo: "L.M" (+447529670444, Reino Unido), possivelmente de Luiz Phillipi Mourão; "Sebastião/SP PF"
  (+12012798461, Estados Unidos), utilizado por Sebastião Monteiro Júnior; "Top" (+573028396721,
  Colômbia), provavelmente de Henrique Vorcaro; e "BH" (+447508680629, Reino Unido), também
  aparentemente ligado a Mourão, sem certeza se é dele mesmo ou de outro integrante.'
document_ids:
