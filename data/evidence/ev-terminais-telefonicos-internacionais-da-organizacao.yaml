date: '2026-03-18'
notes: 'A PF qualifica essa identificação como "análise preliminar e não exaustiva". O uso de números
  estrangeiros para dificultar a identificação de titularidade e obter dados de operadoras sujeitas a
  outras legislações é lido pela PF como padrão deliberado, não coincidência. O número colombiano de
  Henrique Vorcaro já constava do acervo de forma genérica ("número registrado na Colômbia", lote 196);
  esta evidência registra a atribuição desse terminal a "Top". A atribuição de "L.M" e "BH" a Mourão
  é qualificada pela própria PF como incerta. Os números dos cinco terminais, que constam do documento,
  foram retirados do registro em 16/10/2026 (EDITORIAL §6).'
