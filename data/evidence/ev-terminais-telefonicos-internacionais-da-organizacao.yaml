id: ev-terminais-telefonicos-internacionais-da-organizacao
kind: evidence
classification: D
proposition: 'A análise do celular de Marilson Roseno da Silva registrou que ele mantinha, além do número
  brasileiro conhecido, uma conta secundária de WhatsApp Business associada a um número da Turquia, sob o
  codinome "MISTER", usada para se comunicar com outros integrantes da organização com o recurso de
  mensagens temporárias ativado — motivo pelo qual só havia, no aparelho, conversas recentes a partir de
  fevereiro de 2026. A PF mapeou outros quatro terminais internacionais usados pelo grupo: "L.M" (Reino
  Unido), possivelmente de Luiz Phillipi Mourão; "Sebastião/SP PF" (Estados Unidos), utilizado por
  Sebastião Monteiro Júnior; "Top" (Colômbia), provavelmente de Henrique Vorcaro; e "BH" (Reino Unido),
  também aparentemente ligado a Mourão, sem certeza se é dele mesmo ou de outro integrante. Os números dos
  terminais não são reproduzidos pelo Novelo.'
