id: ev-mesma-vendedora-em-dois-estados
kind: evidence
classification: D
proposition: 'A mesma representante do Banco Master, Paula Vouguinha, atuou junto a dois regimes próprios
  de previdência em estados diferentes, com três meses de intervalo: participou por videoconferência da
  sessão que credenciou o banco no AparecidaPrev, em Goiás, em 20/12/2023, e apresentou a instituição
  ao Comitê de Investimentos da Amapá Previdência em 14/03/2024. É a demonstração documental de que havia
  uma mesa de captação operando nacionalmente, e não iniciativas locais independentes.'
