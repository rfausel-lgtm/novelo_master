id: ev-curitiba-reproduz-em-escala-municipal-o-desenho-do-rio-e-de-mato-grosso
kind: evidence
classification: D
proposition: 'Se no Paraná estadual não foi preciso abrir porta alguma, na capital o desenho do Rio de
  Janeiro e o de Mato Grosso aparecem reunidos num único ato de junho de 2023: margem de 10% exclusiva
  para cartão consignado de benefício; determinação de que esses descontos ''não estará limitado aos percentuais
  definidos no caput'', que é a lógica da não concorrência entre margens; criação da categoria de consignatária
  ''empresas administradoras de cartão de crédito/benefício''; e dispensa expressa dessa nova categoria
  de uma das etapas do credenciamento. Em sentido contrário, o mesmo decreto exige sede ou filial no município
  — que a empresa mantinha desde agosto de 2021 — e certificado de autorização do Banco Central, sem que
  se tenha podido estabelecer se a dispensa alcança essa exigência.'
