id: ev-gilmar-propoe-retirar-delegados-pf-gabinetes
kind: evidence
classification: A
proposition: O ministro Gilmar Mendes propôs a Fachin a retirada dos seis delegados da PF cedidos ao STF
  — quatro atuando diretamente em gabinetes de ministros —, sob a justificativa de risco de influência
  dos investigadores sobre os próprios ministros investigados. A proposta não havia sido deliberada até
  a data da reportagem.
