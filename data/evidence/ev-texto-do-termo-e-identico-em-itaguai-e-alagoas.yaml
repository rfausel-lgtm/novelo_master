id: ev-texto-do-termo-e-identico-em-itaguai-e-alagoas
kind: evidence
classification: D
proposition: 'A equipe leu as duas cópias e o texto é idêntico, palavra por palavra. O campo ''Histórico
  e experiência de atuação'' do termo de Itaguaí traz a mesma redação do termo publicado pela Alagoas
  Previdência: o banco fundado em 1973, ''com mais de 50 (cinquenta) anos de história, unindo tradição,
  solidez e credibilidade para entregar soluções personalizadas aos seus clientes'', a capitalização de
  mais de 400 milhões após 2019, a ''virada operacional'' e a ''nova fase de crescimento sólido e gradativo''.
  O campo ''Qualificação do corpo técnico'' traz, nos dois documentos, a mesma frase única, sem nome nem
  indicador. Até o link para o código de conduta hospedado no site do banco é o mesmo. A identidade textual
  deixa de ser descrição de auditoria sigilosa e passa a ser constatação da própria equipe, sobre duas
  cópias lidas.'
