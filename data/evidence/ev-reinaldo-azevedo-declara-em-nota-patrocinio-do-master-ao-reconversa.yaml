id: ev-reinaldo-azevedo-declara-em-nota-patrocinio-do-master-ao-reconversa
kind: evidence
classification: A
proposition: Reinaldo Azevedo declarou, em nota enviada à TMC em 16/10/2026, que o Banco Master patrocinou o
  podcast Reconversa por meio da empresa Super, em contrato de março de 2024 de 12 parcelas de R$ 100 mil, das
  quais sete foram pagas, com valores declarados e impostos pagos, e negou ter escrito em defesa do banco ou
  conversado com Daniel Vorcaro ou Fabiano Zettel.
excerpt: "“Há um contrato de patrocínio feito em março de 2024: 12 parcelas de R$ 100 mil.”"
