id: ev-lista-complementar-39-alvos-busca-08-01-2026
kind: evidence
classification: D
proposition: Em 08/01/2026, Dias Toffoli deferiu parcialmente busca e apreensão contra uma lista
  complementar de 39 alvos (34 pessoas físicas e 5 pessoas jurídicas) na investigação sobre o Banco
  Master, excluindo apenas três já alcançados por diligências anteriores — sem deferir, nesta peça,
  qualquer medida de prisão ou nova alegação substantiva.
document_ids:
- doc-2026-01-08-decisao-toffoli-39-alvos-complementares
source_ids:
- src-stf-pet15198-peca018-decisao-39-alvos-complementares
excerpt: 'Por todo o exposto, defiro parcialmente os pedidos complementares de busca e apreensão das
  pessoas acima elencadas, nos respectivos endereços indicados, exceto em relação aos indivíduos sob n. 2
  (endereço 1), 12 e 33 [...], devendo as diligências se realizarem de modo o mais discreto possível,
  vedado o acompanhamento por meios de imprensa ou terceiros, e preservada a intimidade das pessoas
  sujeitas à medida.'
date: '2026-01-08'
notes: Nenhum registro anterior do acervo cobria esta decisão especificamente. É a peça que ampliou, pela
  primeira vez, a busca e apreensão para incluir a residência de Nelson Tanure — distinta e anterior à
  busca pessoal em aeroporto de 14/01/2026 já registrada. Não altera a caracterização já estabelecida no
  acervo sobre o estágio processual dele (investigado, não preso, não indiciado).
