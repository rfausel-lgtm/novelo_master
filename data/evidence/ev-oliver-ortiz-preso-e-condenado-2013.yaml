id: ev-oliver-ortiz-preso-e-condenado-2013
kind: evidence
classification: C
proposition: Oliver Ortiz de Zarate Martin foi preso pela Polícia Federal em 27/06/2013, em cobertura
  na Barra da Tijuca (RJ), com apreensão de R$ 175 mil, US$ 150 mil, € 110 mil, sete imóveis e cerca de
  R$ 20 milhões em bens; segundo o delegado Paulo Telles, da DRE/PF, chefiava quadrilha espanhola ligada
  a cartéis colombianos, atuando em tráfico marítimo. Segundo o ICL Notícias (09/03/2026), reproduzido
  pelo Cubo Jornalismo, foi condenado a 16 anos de prisão por lavagem de dinheiro e tráfico internacional
  de drogas; só o ICL situa a condenação em dezembro de 2013. A sentença e o número do processo não foram
  localizados. A prisão é fato público sobre Ortiz — e não pode ser usada como qualificação de terceiros.
