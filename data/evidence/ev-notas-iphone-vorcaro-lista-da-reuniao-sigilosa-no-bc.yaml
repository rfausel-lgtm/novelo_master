date: '2025-10-21'
notes: 'É um vetor probatório novo no acervo: até aqui, o que se tinha do celular de Vorcaro eram os
  diálogos de WhatsApp. As notas são registros do próprio investigado sobre quem o investigava —
  investigadores identificados por nome e cargo quatro dias depois de uma reunião sigilosa. O documento
  não estabelece quem repassou os nomes a ele. Os policiais e procuradores citados aparecem aqui como
  alvos do monitoramento, não como suspeitos, e por isso não ganham registro próprio no acervo.'
