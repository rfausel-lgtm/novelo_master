id: ev-notas-iphone-vorcaro-lista-da-reuniao-sigilosa-no-bc
kind: evidence
classification: D
proposition: 'Em 17/10/2025, por volta das 09h, a Polícia Federal e integrantes do Banco Central
  realizaram reunião sigilosa sobre a investigação do Banco Master — procedimento que nascera de
  comunicações do próprio BC. Quatro dias depois, em 21/10/2025 às 19h08, Daniel Vorcaro registrou no
  aplicativo "Notas" do seu iPhone a lista nominal dos representantes da PF que estiveram lá: o diretor
  de Investigação e Combate ao Crime Organizado e à Corrupção Dennis Cali, o chefe da Divisão de
  Repressão a Crimes Financeiros Guilherme Alves de Siqueira, o agente Wilker Goulart, a delegada
  Janaína — que presidia o inquérito da 1ª fase — e o delegado Britto, da 2ª fase, que participara
  remotamente. A mesma nota trazia ainda os nomes de três procuradores da República (Ubiratan, Gabriel
  Pimenta e Guilherme) que sequer estiveram na reunião.'
document_ids:
