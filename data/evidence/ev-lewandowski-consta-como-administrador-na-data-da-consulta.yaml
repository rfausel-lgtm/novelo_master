id: ev-lewandowski-consta-como-administrador-na-data-da-consulta
kind: evidence
classification: D
proposition: O registro cadastral da Receita Federal, consultado pela equipe em 05/09/2026, lista Enrique
  Ricardo Lewandowski — nome civil completo do ex-ministro do STF e ex-ministro da Justiça — como sócio-administrador
  da Lewandowski Advocacia, ao lado do filho e da esposa como sócios com capital. Isso contrasta, na data
  desta consulta, com a declaração dele de ter se retirado do escritório ao assumir o Ministério da Justiça
  em janeiro de 2024. A divergência pode decorrer de defasagem na atualização do quadro societário perante
  a Receita, comum mesmo após afastamento efetivo do exercício profissional — a equipe registra a divergência
  como pergunta em aberto, não como contradição estabelecida.
