id: ev-inss-m-facil-consignado-indicios-fraude
kind: evidence
classification: A
proposition: 'O Banco Master operava, entre 2020 e 2025, o consignado ''M Fácil Consignado'' (rebatização
  do CredCesta) dentro de convênio do INSS. Análise conjunta INSS/CGU, noticiada em 05/03/2026, identificou
  indícios de fraude nesses contratos: nomes duplicados, ausência de assinatura do segurado e taxas não
  informadas.'
