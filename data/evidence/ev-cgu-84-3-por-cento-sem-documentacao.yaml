proposition: O relatório cita a Nota de Auditoria da CGU nº 1752268-02, segundo a qual houve ausência
  de envio da documentação contratual em 84,3% das operações do Banco Master entre outubro de 2021 e abril
  de 2023, e registra que 62,5% das averbações entre junho de 2023 e setembro de 2025 foram feitas com
  score de validação biométrica insuficiente para garantir a validade da operação.
