id: ev-marilson-nega-contato-com-vorcaro-em-peticao-propria
kind: evidence
classification: D
proposition: Em petição de 02/04/2026 — a primeira manifestação dele ou de defesa em seu nome localizada
  no corpus —, Marilson Roseno da Silva argumenta que sua conduta se restringiu à coleta e ao repasse de
  informações, sem qualquer ato de violência ou intimidação atribuído a ele especificamente; que nunca
  manteve contato direto com Daniel Vorcaro, apenas com Luiz Phillipi Mourão (já falecido); que foi
  interrogado pela PF em 26/03/2026 e respondeu a todas as perguntas; e que a PGR não recomendou sua prisão
  preventiva.
