date: '2026-04-02'
notes: Prova que ele apresentou essa defesa — não nega os fatos centrais já atribuídos a ele no acervo
  (coleta de dados, rastreamento do drone sobre a casa de Vorcaro em 06/04/2024), apenas argumenta que não
  justificam prisão preventiva.
