id: ev-zettel-salto-patrimonial-e-485-milhoes-recebidos-da-super
kind: evidence
classification: C
proposition: Levantamentos a partir de declarações de Imposto de Renda requisitadas por comissões parlamentares
  e de registros bancários indicam que o patrimônio declarado de Fabiano Zettel passou de R$ 67,5 milhões
  em 2021 para R$ 204,3 milhões em 2024, com R$ 50,9 milhões declarados em joias e relógios em 2024 (aumento
  de R$ 42,2 milhões desde 2021). No mesmo período, ele teria recebido R$ 485 milhões da Super Empreendimentos
  entre julho de 2022 e janeiro de 2026, incluindo 264 transferências apenas em 2025, somando R$ 160 milhões;
  e aportado R$ 48,5 milhões na própria Super em 2022 na forma de AFAC (adiantamento para futuro aumento
  de capital). Procuradas sobre esses números, as defesas de Zettel e de Vorcaro não se manifestaram.
