id: ev-pf-pretende-pedir-aos-eua-a-quebra-de-sigilo-do-fundo
kind: evidence
classification: A
proposition: A Polícia Federal pretende pedir aos Estados Unidos a quebra de sigilo do fundo que recebeu os recursos
  de Daniel Vorcaro, medida que depende de cooperação das autoridades locais e de autorização da Justiça americana,
  e pretende usar a Difusão Prata da Interpol — instrumento voltado a identificar, localizar e reter patrimônio
  de investigados — nesta e em outras investigações do caso.
