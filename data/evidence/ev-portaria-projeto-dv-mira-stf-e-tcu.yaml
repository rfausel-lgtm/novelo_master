id: ev-portaria-projeto-dv-mira-stf-e-tcu
kind: evidence
classification: D
proposition: A Portaria de 28/01/2026 que instaura o IPL sobre o "Projeto DV" — peça formal de abertura
  da investigação, não relato de testemunha — descreve o objetivo da campanha como "auxiliar o empresário
  [Daniel Vorcaro] a influenciar as decisões em curso, tanto perante o Supremo Tribunal Federal, quanto
  perante o Tribunal de Contas da União, contribuindo para a obtenção de êxito nos processos em curso nos
  dois tribunais".
document_ids:
- doc-2026-01-28-portaria-ipl-projeto-dv
source_ids:
- src-stf-inq5035-edoc15-portaria-ipl-projeto-dv
excerpt: tanto perante o Supremo Tribunal Federal, quanto perante o Tribunal de Contas da União
date: '2026-01-28'
notes: 'É a primeira vez que o acervo registra o TCU como alvo declarado do ''Projeto DV'' — a decisão de
  10ª fase (PET 16.346, julho de 2026), já minerada e mais detalhada em outros aspectos, resume o objetivo
  da campanha em relação ao Banco Central e à opinião pública, sem reproduzir esta menção específica ao
  TCU. Os registros já existentes sobre o TCU no acervo (organizations/tribunal-de-contas-da-uniao.yaml,
  evt-2026-02-11-tcu-conclui-inspecao-no-banco-central.yaml) tratam da inspeção institucional do TCU sobre
  o Banco Central, concluída sem irregularidades — um processo distinto do que esta portaria descreve
  como alvo de influência. O documento não detalha qual processo específico do TCU seria o alvo; essa
  especificidade aparece em relato de testemunha, registrado em evidência separada, com o cuidado
  editorial que o caso exige.'
