id: ev-segunda-prestacao-de-contas-nao-foi-apresentada
kind: evidence
classification: D
proposition: A decisão liminar obrigou os autores a prestar contas a cada noventa dias. A primeira prestação
  foi protocolada em 22/04/2026 — segundo o liquidante, com trinta e quatro dias de atraso. A segunda,
  vencida em 17/06/2026, não foi apresentada até a impugnação de agosto de 2026. Nos autos lidos pela
  equipe não há prestação de contas posterior à de abril.
