id: ev-cvm-rejeita-proposta-de-tc-de-fabiana-franco-no-pas-19957-011252-2025-50
kind: evidence
classification: D
proposition: Em reunião de 23/06/2026, o Colegiado da CVM, por unanimidade e acompanhando o parecer do Comitê
  de Termo de Compromisso, rejeitou a proposta de termo de compromisso de Fabiana Franco, diretora financeira
  da Reag Investimentos S.A., no PAS 19957.011252/2025-50. O Comitê apontou a gravidade, em tese, das condutas
  e a existência de outros processos e procedimentos da CVM sobre o grupo econômico da Reag, e concluiu que o
  melhor desfecho seria o julgamento pelo Colegiado.
