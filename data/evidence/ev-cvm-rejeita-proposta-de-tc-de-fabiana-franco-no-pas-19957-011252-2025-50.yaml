excerpt: O Colegiado, por unanimidade, acompanhando o parecer do Comitê, deliberou rejeitar a proposta de
  termo de compromisso apresentada.
locator: ata, item PAS 19957.011252/2025-50 (Reg. 3533/26); nota, item 3
date: 2026-06-23
notes: D demonstra o conteúdo da ata e da nota. A rejeição de uma proposta de termo de compromisso não é
  condenação, não é julgamento do mérito nem reconhecimento de culpa; o parecer descreve as condutas como
  supostas e em tese, e as expressões do Comitê sobre o grupo econômico são dele, não do Novelo. Nem a ata nem
  a nota reproduzem as razões da proponente. O parecer em PDF vinculado na nota não foi aberto; o texto do
  parecer não foi lido; a ata resume os fundamentos dele, e as citações vêm desse resumo.
