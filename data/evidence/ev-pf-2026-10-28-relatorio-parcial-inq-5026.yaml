id: ev-pf-2026-10-28-relatorio-parcial-inq-5026
kind: evidence
classification: D
proposition: O relatório parcial da PF de 28/10/2026 no Inq 5026/STF existe e registra o que a PF conclui e
  pede, não um fato julgado. Nele, a PF indicia 15 pessoas (p. 697-699), afirma que ao menos R$ 12,2 bilhões
  em créditos cedidos pelo Master ao BRB foram comercializados "sem a devida comprovação de sua existência"
  (p. 8) e pede a prorrogação do inquérito por mais 60 dias (p. 702-703).
