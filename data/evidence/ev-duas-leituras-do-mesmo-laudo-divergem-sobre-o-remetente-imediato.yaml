id: ev-duas-leituras-do-mesmo-laudo-divergem-sobre-o-remetente-imediato
kind: evidence
classification: A
proposition: 'Duas reportagens que leram o mesmo laudo divergem sobre quem remeteu o dinheiro ao Brasil: para o
  Intercept, a produtora brasileira recebeu US$ 3,7 milhões do Havengate Development Fund; para o texto distribuído
  pela Folhapress, os gastos no Brasil foram cobertos em sua maior parte por repasses da Go Up Entertainment LLC,
  dos Estados Unidos.'
document_ids:
