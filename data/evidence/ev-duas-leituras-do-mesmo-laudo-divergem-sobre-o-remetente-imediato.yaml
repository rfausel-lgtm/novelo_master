- src-folhapress-2026-08-29-laudo-pericial-da-go-up-e-as-contradicoes
attributed_to: The Intercept Brasil e Folhapress, em leituras distintas do mesmo laudo pericial
date: '2026-09-10'
notes: 'A divergência é sobre o remetente IMEDIATO, não sobre a origem: nas duas versões o dinheiro vem da mesma
  estrutura americana, e acima dela está o fundo. A equipe não leu o laudo e registra as duas leituras sem escolher
  entre elas.'
