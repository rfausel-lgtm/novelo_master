notes: Localizada a decisão primária (antes só conhecida via cobertura da Agência Senado, classe A,
  document_ids vazio) — upgrade para classe D. O recurso da CPI à Segunda Turma (10/03/2026) e seu
  desfecho continuam sem decisão colegiada localizada.
