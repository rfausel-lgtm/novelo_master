id: ev-mendonca-torna-facultativo-comparecimento-vorcaro-cpi
kind: evidence
classification: D
proposition: André Mendonça decidiu, em 03/03/2026, que o comparecimento de Vorcaro à CPI do Crime Organizado
  seria facultativo, tratando-o como investigado — e não testemunha, condição em que fora convocado. A CPI
  contestou a decisão e recorreu, em 10/03/2026, à Segunda Turma do STF, sustentando que Vorcaro havia sido
  convocado como testemunha. Não foi localizada decisão colegiada final sobre o recurso, nem registro de
  novo depoimento de Vorcaro à comissão antes do encerramento dos trabalhos em 14/04/2026.
