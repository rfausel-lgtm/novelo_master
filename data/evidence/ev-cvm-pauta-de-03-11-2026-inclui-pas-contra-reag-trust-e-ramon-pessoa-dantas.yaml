id: ev-cvm-pauta-de-03-11-2026-inclui-pas-contra-reag-trust-e-ramon-pessoa-dantas
kind: evidence
classification: D
proposition: A pauta oficial da CVM atualizada em 09/10/2026 inclui, na sessão de julgamento de 03/11/2026
  (15h), o PAS 19957.017563/2025-22 (relator Igor Muniz, SIN), para apurar as responsabilidades da Reag Trust
  DTVM (hoje CBSF DTVM, em liquidação extrajudicial) e de Ramon Pessoa Dantas, diretor responsável pela
  administração de carteiras à época dos fatos, por infração ao art. 22 da Resolução CVM 21.
