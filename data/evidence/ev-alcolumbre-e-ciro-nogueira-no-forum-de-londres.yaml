id: ev-alcolumbre-e-ciro-nogueira-no-forum-de-londres
kind: evidence
classification: C
proposition: 'Reportagens de fevereiro de 2026 (O Tempo, Jornal de Brasília) identificam os senadores Davi
  Alcolumbre (União Brasil-AP) e Ciro Nogueira (PP-PI) entre os presentes/debatedores do 1º Fórum Jurídico
  Brasil de Ideias (Londres, 24-26/04/2024), evento patrocinado pelo Banco Master que reuniu também os
  ministros do STF Dias Toffoli, Alexandre de Moraes e Gilmar Mendes, o ex-ministro Ricardo Lewandowski,
  o diretor-geral da PF Andrei Rodrigues, o procurador-geral da República Paulo Gonet, o então
  advogado-geral da União Jorge Messias, o ex-presidente Michel Temer e Fábio Faria (então do BTG Pactual).
  É a primeira ligação pessoal direta — não apenas por parentes ou aliados — entre Alcolumbre e um evento
  custeado pelo Banco Master localizada pela equipe.'
