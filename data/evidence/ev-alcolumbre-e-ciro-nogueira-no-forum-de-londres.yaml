date: '2024-04-24'
notes: 'As reportagens listam Alcolumbre e Ciro Nogueira entre os "debatedores"/presentes do fórum, sem
  precisar se participaram também da degustação de Macallan de 25/04 (evento distinto, mais restrito,
  documentado por outra via em ev-viagem-a-londres-custeada-e-degustacao). O corpus não localizou
  manifestação de Alcolumbre ou de Ciro Nogueira sobre a própria presença no fórum.'
