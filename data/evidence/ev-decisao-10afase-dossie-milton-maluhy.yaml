proposition: 'Segundo a decisão (PET 16.346, §§38-41), Vorcaro escreve a Thiago Miranda: ''Estou precisando
  fazer um levantamento do Milton Maluhy. Esta me causando muito problema. Me ajuda nisso?''; Miranda
  responde ''Deixa comigo'' e depois informa estar ''com tudo pronto do Milton'', preferindo ''soltar
  por outro veículo''. Foi localizado documento intitulado ''Família Maluhy — Relatório sobre Execução
  Fiscal — Caso Milton Maluhy Filho e Camila Moretti Maluhy'', com identidade visual da Agência MiThi,
  contendo dados de identificação civil e CPF do executivo e de sua esposa.'
