id: ev-djen-nao-registra-processo-do-master-em-nome-de-dalide
kind: evidence
classification: I
proposition: Nas publicações judiciais em nome de Dalide Corrêa recuperadas no DJEN, não há processo com o Banco
  Master como parte.
document_ids: []
source_ids:
- src-verificacao-direta-djen-2026-09-17-publicacoes-de-dalide-correa
inference_basis: 'Consulta desta sessão à API pública do DJEN pelo nome da advogada, em 17/09/2026, retornou 177
  publicações em 15 processos (TRF-1, TJDFT, STJ, TJMG, TJRJ e TJMA), nenhuma com o Banco Master no polo ativo ou
  passivo; as ocorrências das palavras ''Master'' e ''BRB'' vêm de outros processos listados nas mesmas pautas.
  O que NÃO se conclui: o DJEN cobre publicações a partir de 2025 e indexa pelo nome do advogado que recebe a intimação,
  de modo que causas patrocinadas por outros advogados do escritório, processos anteriores e serviços não contenciosos
  ficam fora do alcance da consulta. O resultado não confirma nem desmente a versão da advogada sobre o conteúdo
  dos serviços prestados.'
