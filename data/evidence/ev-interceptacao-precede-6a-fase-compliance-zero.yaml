notes: Padrão investigativo típico (escuta secreta seguida de ação ostensiva) — o celular de Marilson
  Roseno da Silva, apreendido desde março de 2026, segue sendo a espinha dorsal probatória por trás de
  ambas as fases. Não altera a classificação de nenhum dos dez como investigado, não indiciado nem
  denunciado nesta peça.
