proposition: Em 11/05/2026, o STF autorizou interceptação telefônica e de WhatsApp contra dez integrantes
  apontados de "A Turma" e "Os Meninos" — dois a três dias antes de praticamente todos eles serem alvo de
  prisão, afastamento de cargo ou cautelar patrimonial na 6ª fase da Operação Compliance Zero
  (13-14/05/2026), já registrada no acervo.
