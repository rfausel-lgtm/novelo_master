id: ev-bc-encontrou-130-contratos-sem-lastro-e-cpfs-dispersos
kind: evidence
classification: A
proposition: 'Segundo reportagem da Agência Pública, questionado pelo Banco Central em março de 2025 sobre
  a falta de documentação dos créditos vendidos ao BRB, o Master respondeu que duas associações de servidores
  da Bahia seriam as originadoras do crédito. A explicação não se sustentou: o BC teria identificado CPFs
  de diversas localidades do país usados para justificar a origem, e 130 contratos analisados aleatoriamente
  não tinham lastro algum.'
attributed_to: Agência Pública, 2026-03, com base em apuração da Polícia Federal
document_ids:
- doc-2026-03-apublica-mecanismo-tirreno
source_ids:
- src-apublica-2026-03-reconstrucao-fraude-master
excerpt: O BC questionou o Master em março de 2025 sobre a falta de documentação. A resposta do banco
  — de que duas associações de servidores da Bahia seriam as originadoras do crédito — não se sustentou
date: 2025-03
notes: 'Reclassificação de 12/09/2026: rebaixada de C para A. O document_id ligado é a mesma reportagem
  já citada em source_ids, não uma segunda origem (ver BRIEFING.md). Buscada uma segunda fonte, a coluna de
  Demétrio Vecchioli no Metrópoles (apuração própria, acesso direto ao relatório sigiloso do grupo de trabalho
  do BRB) NÃO corrobora estes números: fala em 47 contratos consultados em 08/04/2026 (dos quais só 8
  existiam, 39 sem informação no Master), sem mencionar associações da Bahia nem março de 2025 como data do
  questionamento do BC. Pode tratar-se de episódio distinto (outra leva de contratos, outro momento da
  apuração) ou de números que ainda não se reconciliam — nenhuma fonte consultada resolve a diferença.'
