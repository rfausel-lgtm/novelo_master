id: ev-bc-encontrou-130-contratos-sem-lastro-e-cpfs-dispersos
kind: evidence
classification: C
proposition: 'Questionado pelo Banco Central em março de 2025 sobre a falta de documentação dos créditos
  vendidos ao BRB, o Master respondeu que duas associações de servidores da Bahia seriam as originadoras
  do crédito. A explicação não se sustentou: o órgão identificou CPFs de diversas localidades do país
  usados para justificar a origem, e que 130 contratos analisados aleatoriamente não tinham lastro algum.'
