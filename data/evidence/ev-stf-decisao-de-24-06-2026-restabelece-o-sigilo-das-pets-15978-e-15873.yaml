id: ev-stf-decisao-de-24-06-2026-restabelece-o-sigilo-das-pets-15978-e-15873
kind: evidence
classification: D
proposition: >-
  Em 24/06/2026, o ministro André Mendonça, em decisão na Pet 15.873/DF, com base no art. 20 do "CCP" (assim
  grafado no texto) e na Súmula Vinculante nº 14, e considerando a necessidade de resguardar o aporte de novas
  informações aos autos para viabilizar futuras diligências, determinou "o restabelecimento do sigilo
  anteriormente vigente no âmbito das PETs nº 15.978 e nº 15.873, para a retomada do trâmite processual".
