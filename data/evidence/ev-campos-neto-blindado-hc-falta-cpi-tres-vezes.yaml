id: ev-campos-neto-blindado-hc-falta-cpi-tres-vezes
kind: evidence
classification: C
proposition: 'Roberto Campos Neto faltou três vezes a convocações da CPI do Crime Organizado para depor
  especificamente sobre os critérios de idoneidade na aprovação do Máxima em 2019, protegido por habeas
  corpus concedido pelo ministro André Mendonça (STF), que o desobrigou de comparecer pessoalmente; ofereceu
  apenas resposta por escrito, considerada insuficiente por membros da comissão. Na sessão de 08/04/2026,
  pensada para tratar do tema, quem compareceu em seu lugar foi o atual presidente do BC, Gabriel Galípolo,
  que declarou: ''O entendimento da área técnica é que ele [Vorcaro] apresentou uma outra origem de recurso
  e que, a partir daí, estava atendido o que antes tinha sido rejeitado'' — e afirmou que auditorias internas
  do BC não atribuem culpa pessoal a Campos Neto pela liquidação. Não há, até a data desta atualização,
  declaração pública do próprio Campos Neto sobre a aprovação de outubro de 2019.'
