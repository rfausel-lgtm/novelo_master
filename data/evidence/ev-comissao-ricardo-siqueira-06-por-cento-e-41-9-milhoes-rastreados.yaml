id: ev-comissao-ricardo-siqueira-06-por-cento-e-41-9-milhoes-rastreados
kind: evidence
classification: D
proposition: 'Em mensagem de 18/06/2024, Ricardo Siqueira Rodrigues informa a Daniel Vorcaro ter captado
  R$ 1,2 bilhão e calcula seu próprio "bônus de desempenho por coordenação" em 0,6% desse valor — R$ 7,2
  milhões —, confirmando o percentual da comissão. A PF rastreia, por conversas entre Vorcaro e funcionários
  do Master (a executiva de tesouraria "Romy" e um interlocutor identificado como "Marcelo Terra Firme"),
  seis pagamentos à Mídias Promotora entre 22/12/2023 e 19/07/2024 somando R$ 41.900.000,00, com ressalva
  expressa de que pode haver dupla contagem entre os registros.'
