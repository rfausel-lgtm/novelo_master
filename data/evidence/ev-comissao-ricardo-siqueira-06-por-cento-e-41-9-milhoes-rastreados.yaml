excerpt: bônus de desempenho por coordenação
date: '2024-06-18'
notes: 'Reconciliação com números já publicados no acervo: o verbete de Ricardo Siqueira já registrava "ao
  menos R$ 22,1 milhões" (0,6% de um total menor, aportado até aquele momento) e "R$ 126 milhões" recebidos
  pela Mídias Promotora do banco entre 2022 e 2025 (escopo mais amplo, todo o relacionamento comercial, não
  só a comissão do Rioprevidência). Os R$ 41,9 milhões aqui registrados são um terceiro recorte — pagamentos
  específicos rastreados por conversa dentro do mesmo período — e não substituem nem contradizem os números
  anteriores; são âmbitos de medição distintos, não reconciliados entre si nesta coleta.'
