id: ev-gilmar-condicionou-reavaliacao-domiciliar-zettel
kind: evidence
classification: D
proposition: O voto-vogal de Gilmar Mendes no referendo da PET 15.556 dedica capítulo próprio ao 'pedido
  de relaxamento da prisão por razões humanitárias formulado pelo investigado Fabiano Campos Zettel'.
  A defesa sustentou que ele 'possui um filho de dois anos com a sua esposa' e 'aguarda o nascimento iminente
  de mais dois filhos do casal, gêmeos, em gravidez de risco'. O ministro registrou que 'a tese de defesa
  é relevante', invocou o art. 227 da Constituição e o HC 165.704/DF, e referendou a prisão 'por ora',
  determinando que, 'tão logo finalizadas as diligências investigativas [...] deve ser reavaliada a possibilidade
  de substituição de sua prisão preventiva por domiciliar', por incidência do art. 318, III, do CPP. Não
  foi localizada, até a data desta apuração, nenhuma decisão que tenha apreciado essa reavaliação.
