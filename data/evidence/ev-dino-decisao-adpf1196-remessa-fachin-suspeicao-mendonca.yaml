id: ev-dino-decisao-adpf1196-remessa-fachin-suspeicao-mendonca
kind: evidence
classification: D
proposition: 'No dispositivo da decisão de 15/09/2026, o Min. Dino determina "IV) Apresentar cópia desta
  decisão ao Exmo. Ministro Edson Fachin, Presidente desta Corte, para juntada nos autos em que se apuram
  condutas do Exmo. Ministro André Mendonça, a fim de que, mediante o contraditório e a ampla defesa, após
  autorização do Plenário, os fatos sejam esclarecidos, já que podem impactar no desfecho destes autos."
  A decisão foi proferida no mesmo dia da sessão extraordinária do Plenário do STF (15/09/2026) sobre a
  investigação/suspeição de Mendonça.'
