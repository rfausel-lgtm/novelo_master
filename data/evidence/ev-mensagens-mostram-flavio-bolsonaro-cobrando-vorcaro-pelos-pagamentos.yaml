id: ev-mensagens-mostram-flavio-bolsonaro-cobrando-vorcaro-pelos-pagamentos
kind: evidence
classification: A
proposition: 'Mensagens extraídas do celular de Daniel Vorcaro, citadas pela PF, mostram Flávio Bolsonaro
  cobrando pessoalmente o andamento dos pagamentos do filme "Dark Horse" ao longo de 2025: em 08/09/2025,
  áudio cobrando pagamentos e citando risco de inadimplemento perante o ator Jim Caviezel e o diretor Cyrus
  Nowrasteh; em 22/10/2025, mensagem afirmando que a produção "estava no limite" e pedindo que Vorcaro avisasse
  com urgência caso não conseguisse fazer o aporte; em 07/11/2025, vídeo afirmando que a produção só estava
  acontecendo por causa da ajuda de Vorcaro; e, em 16/11/2025, véspera da prisão do banqueiro, a mensagem
  "Irmão, estou e estarei contigo sempre, não tem meia conversa entre a gente. Só preciso que me dê uma luz!
  Abs!".'
