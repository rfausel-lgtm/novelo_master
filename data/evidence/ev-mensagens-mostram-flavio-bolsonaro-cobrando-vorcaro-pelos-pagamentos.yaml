attributed_to: Flávio Bolsonaro, em mensagens a Daniel Vorcaro citadas pela PF
date: '2025-11-16'
notes: A prisão de Vorcaro ocorreu na noite seguinte, 17/11/2025, ao tentar embarcar em jato particular com
  destino a Dubai — fato já conhecido do acervo; a mensagem de véspera é nova.
