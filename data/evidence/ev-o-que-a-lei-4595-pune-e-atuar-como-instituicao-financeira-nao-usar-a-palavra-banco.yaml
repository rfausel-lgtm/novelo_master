id: ev-o-que-a-lei-4595-pune-e-atuar-como-instituicao-financeira-nao-usar-a-palavra-banco
kind: evidence
classification: D
proposition: Precisão jurídica necessária para não deslocar o eixo do caso. A lei que estrutura o sistema
  financeiro nacional pune, no §7º do art. 44, quem 'atue como instituição financeira, sem estar devidamente
  autorizada pelo Banco Central do Brasil', com multa e detenção de um a dois anos, estendida a diretores
  e administradores quando se tratar de pessoa jurídica. A lei não contém vedação textual ao uso da expressão
  'Banco' na denominação social — restrição que existe em normas infralegais não verificadas nesta apuração.
  A designação 'Banco PKL One Participações S.A' no diário oficial sul-mato-grossense deve ser lida, portanto,
  como indício documental de como o Estado enxergava a empresa que credenciava, e não como enquadramento
  legal autônomo. O enquadramento relevante, e mais grave, é o do exercício da atividade.
document_ids:
