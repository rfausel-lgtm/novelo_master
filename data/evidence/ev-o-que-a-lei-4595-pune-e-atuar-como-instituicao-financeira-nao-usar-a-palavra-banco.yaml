excerpt: Quaisquer pessoas físicas ou jurídicas que atuem como instituição financeira, sem estar devidamente
  autorizadas pelo Banco Central do Brasil, ficam sujeitas à multa referida neste artigo e detenção de
  1 a 2 anos
