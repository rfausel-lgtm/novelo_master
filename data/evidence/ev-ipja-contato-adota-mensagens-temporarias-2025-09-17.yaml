id: ev-ipja-contato-adota-mensagens-temporarias-2025-09-17
kind: evidence
classification: D
proposition: Segundo o laudo, em 17/09/2025 o contato salvo no aparelho de Vorcaro como 'Alexandre de
  Moraes BRASILIA' passou a adotar, no chat com o banqueiro, a configuração padrão de mensagens temporárias
  para novas conversas, com prazo de 24 horas para exclusão automática. O registro é do ajuste de configuração;
  o conteúdo das mensagens apagadas não foi recuperado.
