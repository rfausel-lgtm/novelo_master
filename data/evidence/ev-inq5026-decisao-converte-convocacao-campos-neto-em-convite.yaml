excerpt: acolho parcialmente o pedido, para convolar o requerimento de convocação em convite
date: '2026-03-02'
notes: 'CORREÇÃO: substitui a caracterização do instrumento como "habeas corpus" (ver
  `ev-campos-neto-blindado-hc-falta-cpi-tres-vezes`, baseada em imprensa) pelo instrumento real, verificado
  no texto integral da decisão. As duas evidências permanecem publicadas — a original documenta o fato do
  não comparecimento via cobertura jornalística; esta documenta o mecanismo jurídico exato via fonte
  primária.'
