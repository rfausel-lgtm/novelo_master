id: ev-inq5026-decisao-converte-convocacao-campos-neto-em-convite
kind: evidence
classification: D
proposition: 'Em 02/03/2026, em petição no INQ 5.026, o ministro André Mendonça converteu a convocação
  obrigatória de Roberto Campos Neto pela CPI do Crime Organizado em convite facultativo, acolhendo a tese
  de "desvio de finalidade": a CPI foi instalada para investigar facções criminosas e milícias, e a
  convocação dele se baseava no colapso do Banco Master, tema estranho ao objeto da comissão. Mendonça
  aplicou "os exatos termos realizados em relação ao atual presidente do Banco Central do Brasil, Gabriel
  Galípolo" — ou seja, o mesmo tratamento facultativo já dado a Galípolo. O instrumento processual real é
  esta decisão em petição do INQ 5.026, não um habeas corpus, como a imprensa noticiou.'
document_ids:
