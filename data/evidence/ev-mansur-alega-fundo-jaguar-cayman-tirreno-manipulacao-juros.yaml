id: ev-mansur-alega-fundo-jaguar-cayman-tirreno-manipulacao-juros
kind: evidence
classification: A
proposition: Segundo trechos vazados da colaboração de João Carlos Mansur — NÃO confirmados pela equipe
  em documento primário, tratados estritamente como alegação do colaborador —, o Master teria enviado
  R$ 494 milhões a um fundo em Cayman (Jaguar Multimarket Fund Ltd), com beneficiário formal distinto
  de Vorcaro (Benjamin Botelho, ex-dono da gestora Sefer) mas controlador real, segundo Mansur, o próprio
  Vorcaro; e que a aquisição de R$ 6 bilhões em créditos da Tirreno pelo Master foi forjada (sem movimentação
  financeira real), sendo os mesmos créditos revendidos ao BRB por R$ 12 bilhões após manipulação de taxas
  de juros — mecanismo mais detalhado do que o já registrado no corpus sobre a Tirreno (prêmio embutido
  na venda ao BRB), mas ainda não corroborado por fonte independente.
