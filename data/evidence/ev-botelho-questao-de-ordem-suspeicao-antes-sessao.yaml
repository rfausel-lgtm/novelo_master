proposition: 'Em 14/09/2026, Benjamim Botelho de Almeida suscitou questão de ordem pedindo que o Plenário
  julgasse primeiro a Arguição de Suspeição nº 253, que ele próprio apresentara em 08/09/2026 contra André
  Mendonça, antes de prosseguir com a sessão extraordinária de 15/09/2026 — ou, alternativamente, que
  sobrestasse o feito principal até a deliberação sobre a suspeição.'
