proposition: 'Localizado e lido o espécime do termo de credenciamento do Banco Master: o Termo nº 033/2024
  da Alagoas Previdência, de 05/04/2024, publicado aberto no portal de transparência da autarquia. O campo
  destinado a registrar a análise do regime próprio contém texto de natureza promocional, com as expressões
  exatas que a auditoria do Ministério da Previdência descreveu como idênticas em outros quatro entes
  — ''mais de 50 anos de história'', ''tradição, solidez e credibilidade para entregar soluções personalizadas
  aos seus clientes'', ''digital, ágil e moderno'', ''virada operacional'', ''nova fase de crescimento
  sólido e gradativo''. No campo de qualificação do corpo técnico há uma única frase, sem nomes nem indicadores.
  O documento é assinado, pelo banco, por André Kruschewsky Lima e Alberto Felix de Oliveira Neto.'
