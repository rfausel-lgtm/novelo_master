excerpt: 'Histórico e experiência de atuação: O Banco Master foi fundado em 1973, na cidade do Rio de
  Janeiro. É um banco com mais de 50 (cinquenta) anos de história, unindo tradição, solidez e credibilidade
  para entregar soluções personalizadas aos seus clientes.'
