id: ev-tcdf-valor-exato-e-unanimidade-segundo-a-agencia-brasil
kind: evidence
classification: A
proposition: >-
  Segundo a Agência Brasil (24/09/2026), o TCDF decidiu por unanimidade, em sessão fechada, e o valor total do
  bloqueio é R$ 2.761.749.206,55; os demais veículos e a nota do TCDF falam em "até R$ 2,7 bilhões" ou não
  informam valor.
