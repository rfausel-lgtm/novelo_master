id: ev-veja-mensagens-entre-alcolumbre-e-vorcaro-em-2025
kind: evidence
classification: A
proposition: >-
  Segundo a Bahia Notícias e o SBT News (25/09/2026), a revista Veja publicou, em matéria de capa da edição que
  chegou às bancas em 25/09/2026, mensagens que teriam sido extraídas pela PF do celular de Daniel Vorcaro, com
  expressões de amizade entre ele e Davi Alcolumbre, uma de 01/02/2025 e outra do fim de março de 2025.
attributed_to: Veja, segundo Bahia Notícias e SBT News
document_ids: []
source_ids:
