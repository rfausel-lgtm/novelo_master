- src-sbtnews-2026-09-25-alcolumbre-e-defesa-de-vorcaro-criticam-vazamentos
date: '2025-02-01'
notes: >-
  A Veja não foi aberta pela equipe; o que se registra é a descrição dos dois veículos. Nas fontes lidas, as
  mensagens não tratam de fundos de previdência, da Amprev nem de nomeações. O Novelo não transcreve as
  mensagens nem localizou documento oficial de origem.
