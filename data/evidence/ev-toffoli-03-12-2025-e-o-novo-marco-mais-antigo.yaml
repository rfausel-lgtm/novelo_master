id: ev-toffoli-03-12-2025-e-o-novo-marco-mais-antigo
kind: evidence
classification: D
proposition: 'Em 03/12/2025, respondendo a pedido de habilitação de Luiz Antônio Bull na Rcl 88.121/DF,
  Dias Toffoli determinou que novas diligências e medidas da investigação fossem previamente submetidas ao
  crivo do STF, ''inclusive sobre outras investigações conexas'', diante de suspeita de foro por prerrogativa
  de função. É doze dias anterior à decisão de 15/12/2025 (mesma Reclamação) até então registrada como o
  marco documental mais antigo do acervo sobre a supervisão do STF ao caso.'
