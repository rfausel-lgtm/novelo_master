id: ev-cnj-correicao-extraordinaria-no-gabinete-de-newton-ramos-em-24-09
kind: evidence
classification: C
proposition: >-
  Em 24/09/2026, segundo a Agência Brasil, o Times Brasil e A Crítica, foi realizada diligência no gabinete do
  desembargador Newton Ramos, no TRF-1, determinada pelo corregedor nacional de Justiça e cumprida pela Polícia
  Federal, com extração de dados de equipamentos eletrônicos (A Crítica), no âmbito de correição extraordinária
  (Times Brasil e A Crítica); o TRF-1 informou em nota que colaborará com o CNJ e que o procedimento não
  antecipa responsabilidade; Newton Ramos continua no cargo.
document_ids: []
