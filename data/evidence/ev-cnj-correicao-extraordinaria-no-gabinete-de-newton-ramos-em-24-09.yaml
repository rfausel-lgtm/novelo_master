- src-acritica-2026-09-24-pf-faz-buscas-em-gabinete-de-desembargador-do-trf-1-citado-em-investigacao-do-banco-master
date: '2026-09-24'
notes: >-
  Não há notícia oficial do CNJ sobre a diligência. "Operação" e "buscas" são termos dos veículos; o Novelo usa
  "correição extraordinária", termo do Times Brasil e de A Crítica (a Agência Brasil fala em "procedimento de
  correição"). A nota do TRF-1 é conhecida por paráfrase dos veículos; o Times Brasil cita entre aspas apenas
  "integral colaboração".
