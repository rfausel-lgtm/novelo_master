id: ev-cavalcante-alega-conexao-master-cortel-sp-ricardo-nunes
kind: evidence
classification: A
proposition: 'A Deputada Luciene Cavalcante apresentou, no INQ 5.026, "Requerimento de apuração de fatos
  novos e inclusão de investigado" em face de Ricardo Nunes, Prefeito de São Paulo à época da concessão dos
  serviços funerários e cemiteriais da capital paulista (2023), "ante a suspeita aventada, segundo a qual
  haveria possível conexão entre o Banco Master, a Concessionária Cortel SP e a Prefeitura do Município de
  São Paulo". Em 06/07/2026, o pedido foi desentranhado para autuação em petição autônoma, conexa ao
  inquérito.'
attributed_to: Deputada Luciene Cavalcante, em requerimento apresentado no INQ 5.026
document_ids:
- doc-2026-07-06-decisao-inq5026-quatro-peticoes-desentranhadas
