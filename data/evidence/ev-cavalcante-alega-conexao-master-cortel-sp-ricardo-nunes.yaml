date: '2026-07-06'
notes: 'Tratamento com cautela reforçada: a decisão do STF apenas relata a existência da suspeita alegada
  pela parlamentar — não reproduz nenhum elemento probatório, documento ou apuração que a sustente, nem
  emite qualquer juízo sobre sua plausibilidade. "Cortel SP" não aparece em nenhuma outra fonte do acervo.
  O arquivo pré-existente de Ricardo Nunes (`ricardo-nunes.yaml`) trata de tema totalmente diferente
  (margem consignável/PKL One). Não é fato apurado; é acusação de parlamentar, sem lastro documental
  apresentado nesta peça, contra prefeito em exercício.'
