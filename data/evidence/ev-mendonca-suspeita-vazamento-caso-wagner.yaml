id: ev-mendonca-suspeita-vazamento-caso-wagner
kind: evidence
classification: A
proposition: 'Ao tornar pública a investigação contra Wagner (Pet 16.210, 30/07/2026), Mendonça registrou
  uma coincidência que trata como possível indício de vazamento: um dos investigados solicitou audiência
  ao seu gabinete no mesmo dia em que chegaram as representações da PF sobre o caso. Não há, na fonte,
  conclusão sobre quem seria o investigado ou confirmação formal de vazamento — é observação do próprio
  ministro, registrada como indício a apurar.'
