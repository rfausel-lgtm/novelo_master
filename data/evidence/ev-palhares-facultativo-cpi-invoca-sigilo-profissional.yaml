id: ev-palhares-facultativo-cpi-invoca-sigilo-profissional
kind: evidence
classification: D
proposition: Leonardo Augusto Furtado Palhares pediu salvo-conduto contra sua convocação pela CPI do
  Crime Organizado, invocando tanto o direito à não autoincriminação quanto sua prerrogativa profissional
  de advogado para recusar depor sobre fatos sob sigilo profissional; em 27/03/2026, o STF deferiu o
  pedido, convertendo a convocação em facultativa.
document_ids:
- doc-2026-03-27-decisao-inq5026-palhares-facultativo-cpi
source_ids:
- src-stf-inq5026-decisao-27-03-2026-palhares-facultativo-cpi
date: '2026-03-27'
notes: A decisão concede o mesmo tratamento facultativo já dado a outros investigados, sem enfrentar
  especificamente o argumento de sigilo profissional — não é possível inferir se o STF reconheceu essa
  prerrogativa específica ou apenas aplicou o fundamento genérico da não autoincriminação.
