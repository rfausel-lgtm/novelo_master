id: ev-relatorio-nao-imputa-conduta-a-magistrado
kind: evidence
classification: D
proposition: O relatório não imputa conduta a Alexandre de Moraes nem a qualquer magistrado. Não contém
  as palavras 'propina', 'vantagem indevida', 'corrupção', 'imputação' ou 'indiciamento'. A própria peça
  consigna, na página 5, que não foram realizados atos de aprofundamento investigativo dirigidos a magistrados
  ou a membros do Ministério Público, limitando-se à exposição objetiva de elementos já existentes no
  material arrecadado. Nenhuma decisão judicial, voto ou ato de ofício do ministro é citado ou cotejado
  em qualquer ponto do documento.
