id: ev-ngvspe-aberta-103-dias-antes-do-leilao-e-cessao-a-pkl
kind: evidence
classification: C
proposition: 'A arrematante do leilão da Ebal, a N.G.V.S.P.E. Empreendimentos e Participações S.A. (CNPJ
  29.334.799/0001-34), foi constituída em 29/12/2017 — 103 dias antes do certame de 11/04/2018 —, com
  CNAE de holding de instituições não-financeiras, sede em São Paulo e telefone cadastrado com DDD da
  Bahia. Seu capital social hoje registrado é de R$ 1 milhão; segundo a imprensa, o capital inicial era
  de R$ 500 e foi elevado pouco antes do leilão. O quadro de administradores registrado na Receita traz
  um único nome, com entrada em fevereiro de 2018. Em 05/06/2018 — mesmo dia da transferência efetiva
  do controle acionário — a NGVSPE cedeu à PKL One Participações os direitos do CredCesta. Ressalva metodológica
  relevante: tanto a NGVSPE quanto a PKL One são sociedades anônimas fechadas, e o registro da Receita
  Federal traz apenas administradores, não o quadro acionário — de modo que a propriedade real dessas
  empresas não é verificável por essa via, e a ausência do nome de Augusto Lima nos registros não desmente
  nem confirma as reportagens que o apontam como o articulador da operação. Uma fonte única menciona que
  a cessão à PKL teria sido por R$ 22 milhões, valor superior ao pago pela empresa inteira — não confirmado.'
