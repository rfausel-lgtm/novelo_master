notes: Qualifica, sem contradizer, a evidência já publicada de que ele "não é dirigente estatutário" da
  Asteba — isso é correto para o período relevante ao caso Master (2018 em diante), mas ele foi, de fato,
  o presidente fundador da associação quinze anos antes.
