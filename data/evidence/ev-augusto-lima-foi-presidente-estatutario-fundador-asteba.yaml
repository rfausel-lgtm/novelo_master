id: ev-augusto-lima-foi-presidente-estatutario-fundador-asteba
kind: evidence
classification: D
proposition: Augusto Ferreira Lima foi presidente estatutário da Asteba de 01/09/2005 a 28/02/2008 — o
  primeiro presidente da associação, fundada em 30/01/2002 —, período anterior ao que é relevante para o
  caso Master. A partir de 2008 (Roque Ribeiro Damásio, falecido em 2017) e sobretudo de 2018 (Nanci Maria
  Prates Pereira, atual), a presidência estatutária deixou de ser dele, ainda que ele continuasse a atuar
  como procurador da associação perante instituições financeiras.
