notes: O anexo do decreto descreve as poligonais só por coordenadas, sem nomear proprietários; a equipe não cruzou
  as coordenadas com o terreno. Nenhum processo de desapropriação ou indenização envolvendo Wagner foi localizado
  no DJEN; ele afirma ter aberto mão da indenização.
