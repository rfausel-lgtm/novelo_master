kind: evidence
id: ev-terreno-de-wagner-confronta-area-desapropriada-da-via-metropolitana
classification: D
proposition: A escritura de 18/05/2026 descreve o terreno de Wagner em Camaçari confrontando com a "ÁREA DECRETO
  Nº 15.159 DE 28 DE MAIO DE 2014", e a carta do City Football Group afirma que a área da matrícula "foi parcialmente
  desapropriada em função da construção do anel metropolitano"; o decreto, assinado pelo governador Jaques Wagner,
  declarou de utilidade pública as áreas da Via Metropolitana e autorizou a Bahia Norte a desapropriar.
