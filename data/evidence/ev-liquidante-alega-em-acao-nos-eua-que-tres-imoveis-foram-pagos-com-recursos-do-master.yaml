id: ev-liquidante-alega-em-acao-nos-eua-que-tres-imoveis-foram-pagos-com-recursos-do-master
kind: evidence
classification: A
proposition: Segundo o liquidante do Banco Master, a EFB Regimes Especiais de Empresas, em ação proposta em
  07/10/2026 no Tribunal de Falências do Distrito Sul da Flórida contra Clear River Properties LLC e Goldbeach
  Properties LLC, três imóveis em Aspen e Miami, comprados à vista entre abril de 2024 e fevereiro de 2025,
  foram pagos com recursos do Master que teriam passado por um fundo nas Bahamas (Mosaic Short Duration Fund);
  o liquidante pede o reconhecimento dos imóveis como patrimônio do Master ou, alternativamente, a restituição
  de ao menos US$ 77 milhões (Clear River) e US$ 92,5 milhões (Goldbeach), além de bloqueio da venda e
  administrador judicial, conforme Times Brasil, Metrópoles e Rio Times.
