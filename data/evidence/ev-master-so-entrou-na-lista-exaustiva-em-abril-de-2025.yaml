id: ev-master-so-entrou-na-lista-exaustiva-em-abril-de-2025
kind: evidence
classification: D
proposition: O Banco Master S/A (CNPJ 33.923.798) só passou a constar da Lista Exaustiva do Ministério
  da Previdência como instituição elegível para emissão de ativos do art. 7º, IV em 11/04/2025. A relação
  oficial de versões publicada pelo próprio ministério não registra nenhuma atualização entre 06/05/2024
  e 11/04/2025 — a lista ficou congelada por onze meses. Capturas datadas de arquivo confirmam que, em
  04/04/2025, o documento vigente ainda era o de 06/05/2024, sem o banco. Durante todo o período em que
  os dezoito regimes próprios compraram R$ 1,876 bilhão em suas letras financeiras, portanto, o Banco
  Master não constava da lista como emissor elegível. A previsão que o próprio banco fizera ao comitê
  do Amapá, de que passaria a constar 'provavelmente em julho' de 2024, não se realizou. Na atualização
  de 18/11/2025 — mesmo dia da liquidação extrajudicial — o banco e a corretora foram removidos.
