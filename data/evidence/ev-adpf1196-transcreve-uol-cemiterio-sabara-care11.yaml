id: ev-adpf1196-transcreve-uol-cemiterio-sabara-care11
kind: evidence
classification: D
proposition: 'A decisão do Min. Flávio Dino de 15/09/2026 na ADPF 1.196 transcreve reportagem do UOL (18/02/2026)
  segundo a qual relatório da PF enviado ao STF aponta que, "na origem do banco, ainda em 2016, está uma fraude
  no fundo Graveyard Death and Care (Care11), inicialmente gerido pela Máxima Asset Management Ltda."; que a VHR
  Empreendimentos, do portfólio do fundo, tinha como principal bem um cemitério em Sabará/MG avaliado pela própria
  empresa em R$ 181 milhões; que uma empresa da família Vorcaro era sócia do cemitério; e que, segundo a PF, "o
  Banco Master, na qualidade de cotista do fundo, deliberou pela aceitação das cotas de uma empresa que pertencia
  ao seu próprio grupo econômico, ao preço que ele mesmo havia estabelecido".'
document_ids:
- doc-2026-09-15-decisao-dino-adpf1196-zettel-cortel-mendonca
source_ids:
- src-stf-adpf1196-decisao-15-09-2026-zettel-cortel-mendonca
attributed_to_id: flavio-dino
date: '2026-09-15'
notes: 'O que é classe D é a transcrição na decisão; o relatório da PF citado pelo UOL não foi lido pela equipe e
  o site do UOL bloqueia leitura automatizada. A empresa da família Vorcaro sócia do cemitério não é nomeada no
  trecho. CORREÇÃO: o lote 315 publicou que o cemitério foi reavaliado para R$ 111,7 milhões em 2020 — número
  que veio de pesquisa delegada e não foi conferido por esta sessão; foi retirado até haver fonte lida.'
