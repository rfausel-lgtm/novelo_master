id: ev-em-uberaba-o-vinculo-alcancou-a-companhia-de-saneamento-e-o-instituto-de-previdencia
kind: evidence
classification: D
proposition: Em Uberaba, além do Acordo de Cooperação com o município, a companhia municipal de saneamento CODAU
  celebrou convênio próprio (nº 02/2023, por inexigibilidade nº 15/2023) e o instituto de previdência dos servidores,
  IPSERV, firmou termo próprio em dezembro de 2023.
document_ids:
- doc-2022-2024-uberaba-acordo-de-cooperacao-e-as-duas-autarquias
date: '2023-12-22'
notes: Repete em Minas Gerais o padrão já documentado em São Paulo, onde serviço funerário, hospital do servidor
  e instituto de previdência mantiveram instrumentos próprios, e em Juazeiro, na Bahia, com a companhia estatal
  de trânsito.
