id: ev-oficio-40-confirma-sigla-uadip-cinq-cgrc-dicor
kind: evidence
classification: D
proposition: A decisão de Mendonça confirma, com base no Ofício nº 40/2026/GAB/PF (assinado pelo próprio
  Andrei Rodrigues), que os relatórios de inteligência apócrifos foram produzidos pela UADIP/CINQ/CGRC/DICOR/PF
  — a mesma sigla que a newsletter de David Ágape ('A Investigação') já havia reportado, em matéria não
  verificada pela equipe contra documento primário na época (lote 100). A confirmação, agora por documento
  oficial do STF, reforça a credibilidade daquela apuração jornalística quanto a este ponto específico
  — sem que isso valide as demais alegações não verificadas da mesma matéria (identificação de servidores
  específicos como possíveis autores).
