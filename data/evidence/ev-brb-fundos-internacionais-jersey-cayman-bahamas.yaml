id: ev-brb-fundos-internacionais-jersey-cayman-bahamas
kind: evidence
classification: D
proposition: 'Em 24/07/2025, o Banco Master alienou ao BRB três fundos internacionais — International Strategies
  Fund Ltd. e Global Navigator Fund Ltd. (Jersey/Cayman) e Liquidity Strategies Fund Ltd. (Bahamas) —, em quitação
  compensada com créditos de dois Termos de Endosso de CCB (Recompra): o nº 45/2025, de US$ 114.218.734,00, e o
  nº 47/2025, de US$ 205.500.613,63. O BRB pediu tutela de urgência, em 16/03/2026, para preservar as cotas desses
  fundos.'
