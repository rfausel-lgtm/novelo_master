proposition: O juiz Sandro Nogueira Leite negou, em 19/12/2025, o pedido de Vorcaro para que as investigações
  da Carbono Oculto e da Operação Quasar fossem remetidas ao STF por suposta conexão com o caso Master,
  escrevendo que 'ao menos por agora, não há notícia de conexão do peticionário e Banco Master com a investigação';
  o MP indicou que a operação mirava outros personagens.
