id: ev-vitoria-da-conquista-suspendeu-o-produto-em-2023-por-queixas-de-servidores
kind: evidence
classification: D
proposition: A mais antiga reação administrativa ao produto localizada em toda a investigação é municipal
  e anterior em quase dois anos à liquidação do banco. Em 22/12/2023, sob o assunto 'Suspensão de Empréstimos
  Consignados com a Empresa CREDCESTA', a prefeitura de Vitória da Conquista determinou a suspensão temporária
  de novas operações após 'reiteradas queixas e denúncias' de servidores e do sindicato municipal. O motivo
  é o próprio produto, não a crise do banco.
