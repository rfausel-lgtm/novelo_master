id: ev-conselho-etica-senado-paralisado-nao-especifico-wagner
kind: evidence
classification: C
proposition: O Partido Novo protocolou representação por quebra de decoro contra Wagner no Conselho de
  Ética do Senado (31/07/2026), mas o órgão está paralisado desde julho de 2024 por falta de instalação
  — mantendo ao menos 19 representações represadas, entre elas a de Wagner. A ministra Cármen Lúcia (STF)
  deu prazo de 10 dias ao Senado, a partir de 06/07/2026, para explicações sobre a paralisia — prazo não
  cumprido até a data desta apuração. A não-tramitação da representação contra Wagner decorre da paralisia
  estrutural do Conselho, não de decisão específica sobre o mérito do caso dele.
