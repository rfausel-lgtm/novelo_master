id: ev-liquidacao-da-trustee-e-da-banvox
kind: evidence
classification: D
proposition: Em 03/09/2026 o Banco Central decretou a liquidação extrajudicial da Trustee DTVM e da Banvox
  DTVM, motivada pela existência de graves violações às normas legais que disciplinam suas atividades.
  Os dados abertos de regimes especiais do próprio Banco Central registram a mesma liquidante para as
  duas, Marilena Simões Valentim. As duas distribuidoras têm em comum o sócio Maurício Antonio Quadrado
  e suas respectivas holdings, e administradores coincidentes.
