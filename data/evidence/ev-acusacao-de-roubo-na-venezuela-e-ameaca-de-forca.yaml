id: ev-acusacao-de-roubo-na-venezuela-e-ameaca-de-forca
kind: evidence
classification: D
proposition: 'Em 18-19/09/2024, Daniel Vorcaro acusou dois nacionais, André Flores Tavares e Gabriel
  Garrido Lacerda, de tê-lo roubado na Venezuela ("Eram faria limas. Não aguentam pressão. Mas foram pra
  Venezuela e me roubaram. Esse é pra ir pra c forca") e determinou que "A Turma" fizesse levantamento
  geral de ambos. Felipe Mourão e Marilson Roseno da Silva mobilizaram o grupo, compilando e trocando
  documentos com dados pessoais dos dois, e Mourão mencionou que "estavam com uma entrada na Interpol"
  contra eles. Em 03/10/2024, Vorcaro voltou a cobrar ação urgente, pedindo que alguém da PF "hoje ainda"
  dissesse haver "denúncia de crime contra sistema financeiro" contra eles, e Mourão respondeu "estou
  indo lá neles" — indo, segundo o áudio de Marilson que se segue, à Superintendência da Polícia Federal.'
