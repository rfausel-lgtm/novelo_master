date: '2024-09-18'
notes: 'A acusação de roubo é alegação do próprio Daniel Vorcaro, sem qualquer elemento independente no
  acervo que a corrobore — trata-se de disputa privada entre ele e os dois nacionais, de natureza e
  origem não esclarecidas no documento. André Flores Tavares e Gabriel Garrido Lacerda entram aqui como
  alvos do aparato de intimidação de Vorcaro, não como investigados nesta apuração, e a frase "pra ir pra
  a forca" — de teor claramente violento — é dele, não fato provado. Chama atenção que a resposta ao que
  Vorcaro descreve como um roubo tenha sido buscar contato na Polícia Federal e cogitar uma notificação à
  Interpol por vias que passam pelo mesmo canal usado para as demais ações do grupo — não uma queixa-crime
  ordinária.'
