id: ev-apr-descreve-letra-de-banco-privado-como-titulo-publico
kind: evidence
classification: D
proposition: A autorização de aplicação que formalizou a compra descreve a operação, no campo de histórico,
  como 'aplicação em títulos públicos conforme decisão comitê de investimento' — quando o ativo identificado
  no mesmo documento é letra financeira do Banco Master, com o CNPJ do banco, enquadrada no art. 7º, IV,
  dispositivo que trata de emissão de instituição financeira. Título público e letra financeira de banco
  privado são categorias distintas, com regimes de risco distintos.
