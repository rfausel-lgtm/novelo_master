proposition: Em mensagem de abril de 2024, Daniel Vorcaro afirma ter bancado 'todos os voos' de Nikolas
  Ferreira durante deslocamentos da campanha presidencial de 2022 no Nordeste. Nikolas confirma que Vorcaro
  ajudou na logística dessas viagens, mas nega relação pessoal com o banqueiro, dizendo tê-lo conhecido
  por intermediação do pastor André Valadão e que, na época, não havia suspeitas públicas sobre seu nome.
