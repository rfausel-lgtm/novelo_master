id: ev-santa-catarina-revogou-a-margem-e-a-categoria-de-consignataria
kind: evidence
classification: D
proposition: 'Santa Catarina produziu a reação regulatória mais completa entre as localizadas. Havia instituído
  em abril de 2025 a margem adicional de dez por cento para cartão consignado de benefícios e admitido
  como consignatárias as administradoras desse tipo de cartão. Em 11 de junho de 2026 revogou os dois
  dispositivos de uma só vez: extinguiu a margem e eliminou a própria figura jurídica que a tornava utilizável.
  Enquanto outros entes suspenderam códigos de desconto ou descredenciaram empresas, o estado fechou a
  categoria inteira.'
