excerpt: A CNN apurou que o investimento foi feito no então banco Master
date: 2026-10-27
notes: "Independência frágil: os dois textos repetem quase literalmente o trecho sobre o prejuízo estimado de
  cerca de R$ 121 milhões, que atribuem à PF e que não está na nota em gov.br. Os valores de R$ 80 milhões em
  letras financeiras e R$ 20 milhões em fundo imobiliário são dos veículos. Pendente: nota complementar ou
  decisão que nomeie o emissor."
