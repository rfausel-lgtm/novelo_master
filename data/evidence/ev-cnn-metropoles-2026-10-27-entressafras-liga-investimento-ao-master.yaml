id: ev-cnn-metropoles-2026-10-27-entressafras-liga-investimento-ao-master
kind: evidence
classification: C
proposition: CNN Brasil e Metrópoles noticiam, em 27/10/2026, que o investimento investigado na Operação
  Entressafras foi feito no Banco Master; a proposição registrada é que os dois veículos o noticiam, não que a
  PF o afirme, pois a nota da PF em gov.br não cita o banco.
source_ids:
