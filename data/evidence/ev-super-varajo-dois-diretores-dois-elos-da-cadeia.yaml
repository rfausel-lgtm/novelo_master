inference_basis: Cruzamento entre o quadro de administradores da Super Empreendimentos e o quadro societário
  da Varajo Consultoria, ambos obtidos do registro da Receita Federal, confrontados com a descrição da
  cadeia de pagamento constante das mensagens reproduzidas na decisão do STF. A inferência é estrutural,
  não causal.
