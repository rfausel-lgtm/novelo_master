id: ev-ricardo-siqueira-reincidente-em-fraudes-de-fundo-de-pensao
kind: evidence
classification: D
proposition: 'O documento comprobatório da PF anexo à Pet 15.497/DF descreve Ricardo Siqueira Rodrigues —
  apontado como intermediário dos aportes da RioPrevidência no Banco Master — como alvo, em outras operações,
  de mandado de prisão preventiva na Operação Rizoma (fraude com déficits bilionários nos fundos de pensão
  Postalis e Serpro, lavagem de dinheiro e evasão de divisas) e citação na Operação Circus Maximus (vantagens
  indevidas a diretores do BRB para viabilizar aportes em empreendimentos hoteleiros de luxo no Rio); e
  registra confissão dele, em termo de declarações da Operação Encilhamento (IPL 0004/2017-11-SR/DPF/SP), de
  pagamento de R$ 1 milhão em comissões a Renato de Matteo, atuando como "financiador estratégico" que recebia
  "prêmios de sucesso".'
