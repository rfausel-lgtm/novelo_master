notes: Estabelece um padrão de reincidência em esquemas de fraude envolvendo fundos de pensão (Postalis,
  Serpro) e corrupção institucional (BRB), anterior ao caso RioPrevidência/Banco Master — Ricardo Siqueira
  não é um operador financeiro estreante neste tipo de esquema. Não há, nesta coleta, notícia de desfecho
  judicial (condenação ou absolvição) das operações Rizoma, Circus Maximus ou Encilhamento.
