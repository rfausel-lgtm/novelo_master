id: ev-mesma-pessoa-assinou-os-dois-campos-do-rpps
kind: evidence
classification: D
proposition: O termo reserva dois campos de assinatura distintos, um para o dirigente da unidade gestora
  e outro para o gestor de recursos do regime próprio. Ambos foram assinados digitalmente pela mesma pessoa,
  Neilton Paixão de Jesus, em 16/01/2024, com dois minutos de diferença — às 17h15min44s e às 17h17min38s.
  A separação de funções que o modelo pressupõe não existiu na prática.
