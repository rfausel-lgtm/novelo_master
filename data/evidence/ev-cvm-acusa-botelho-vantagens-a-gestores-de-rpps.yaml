id: ev-cvm-acusa-botelho-vantagens-a-gestores-de-rpps
kind: evidence
classification: C
proposition: 'No PAS CVM SEI 19957.008699/2019-01 (PAS 03/2016), Benjamim Botelho de Almeida é acusado
  de operação fraudulenta no mercado de valores mobiliários, caracterizada, segundo a acusação, pelo ''oferecimento
  de vantagens financeiras ilícitas a prefeitos e gestores de RPPS'' para desviar recursos de fundos de
  regimes próprios de previdência, com prejuízos de centenas de milhões. Em 23/02/2021, o Colegiado rejeitou
  por unanimidade sua proposta de termo de compromisso de R$ 250 mil, citando a desproporção entre a oferta
  e os prejuízos, a ''gravidade dos fatos'' e o ''histórico de parte dos proponentes''. VERIFICAÇÃO POSTERIOR:
  o processo NÃO foi julgado. Consta da planilha oficial de processos pendentes da CVM, posição de 31/01/2026,
  sob relatoria do diretor João Accioly, parado desde a redistribuição de 24/05/2022 — que é a última
  menção pública a ele na base da autarquia. Permanece, portanto, acusação sem julgamento, mais de nove
  anos após a instauração do inquérito. O sistema oficial de consulta esclarece ainda que o processo tem
  29 acusados e que seu objeto envolve a atuação da Invista Investimentos Inteligentes e a gestão de fundos
  que tinham RPPS entre os cotistas. Em processo distinto sobre emissões de debêntures (PAS SEI 19957.009798/2019-01),
  ele pagou R$ 300 mil em termo de compromisso aceito pela CVM, o que não implica confissão nem reconhecimento
  de culpa.'
