id: ev-decisao-registra-conexao-indireta-entre-o-instituto-e-a-produtora
kind: evidence
classification: D
proposition: A decisão descreve uma possível conexão indireta entre recursos do Instituto Conhecer Brasil e a produtora
  do filme — cerca de R$ 700 mil pagos pelo instituto a duas empresas do grupo de Heric Dias, seguidos de transferência
  de R$ 750 mil da NTT Brasil, do mesmo grupo, à Go Up Entertainment — e afirma expressamente que os elementos disponíveis
  não permitem dizer que os recursos transferidos tenham origem direta nos valores recebidos do instituto.
document_ids:
- doc-2026-09-03-decisao-dino-pet16669-operacao-make-up
excerpt: Embora os elementos disponíveis não permitam afirmar que os recursos transferidos pela NTT Brasil tenham
  origem direta nos valores recebidos do ICB, a coincidência entre os montantes e a proximidade temporal das operações
  são circunstâncias relevantes
locator: p. 105-106
date: '2026-09-03'
notes: É o ponto mais próximo que a decisão chega da tese de que emenda parlamentar teria custeado o filme — e o
  próprio texto marca o limite do que o material sustenta.
