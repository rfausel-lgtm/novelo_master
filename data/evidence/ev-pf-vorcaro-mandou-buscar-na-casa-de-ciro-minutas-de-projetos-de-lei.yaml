attributed_to: Polícia Federal, em representação acolhida por André Mendonça na decisão de 07/05/2026 da Pet 15.873
date: '2023-11'
notes: 'O PL 5.174/2023 institui o Programa de Aceleração da Transição Energética e o PL 412/2022 o Sistema Brasileiro de
  Comércio de Emissões. A decisão registra ainda que interlocutores do banco disseram que a emenda do FGC "sextuplicaria"
  o negócio do Master. O STF descreve a autoria no condicional, e o lastro é de mensagens e da comparação feita pela PF.
  Sem denúncia contra o senador.'
