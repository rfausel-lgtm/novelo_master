id: ev-pf-vorcaro-mandou-buscar-na-casa-de-ciro-minutas-de-projetos-de-lei
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, citada na decisão de 07/05/2026 na Pet 15.873, a emenda do FGC foi enviada por
  André Kruschewsky Lima a Daniel Vorcaro, impressa e entregue em envelope endereçado a "Ciro" na residência do senador,
  que a reproduziu integralmente — e Vorcaro comentou que "saiu exatamente como mandei"; e, em novembro de 2023, Vorcaro
  mandou retirar da casa do senador envelopes com minutas dos PLs 5.174/2023 e 412/2022, revisadas num "escritório" e
  devolvidas com cuidado "para que o motorista não consiga vincular o transporte do documento ao parlamentar".
document_ids:
- doc-2026-05-07-decisao-pet-15873-ciro-nogueira
source_ids:
