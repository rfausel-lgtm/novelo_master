id: ev-contexto-que-enfraquece-a-alegacao-de-vorcaro
kind: evidence
classification: A
proposition: Elementos de contexto que pesam contra a alegação, e que devem constar com o mesmo destaque
  das acusações. A oitiva ocorreu no mesmo dia em que Vorcaro deveria depor à Polícia Federal. É a terceira
  tentativa de delação, tendo as duas anteriores sido rejeitadas por PF e PGR por não trazerem elementos
  novos. Ao fim da oitiva, o advogado Daniel Bialski pediu ao juiz nova possibilidade de colaboração —
  ou seja, a alegação de intimidação e o pedido de reabertura da delação vieram no mesmo ato. A PGR foi
  comunicada da oitiva às 22h da véspera, sob sigilo máximo, e Bialski assinou a petição sozinho, sem
  os demais advogados, num 'voo solo' que rachou a defesa. Investigadores atribuem o relato a estratégia
  processual; a palavra 'teatro', que circulou em manchetes, é interpretação jornalística e não citação
  direta de fonte identificada.
