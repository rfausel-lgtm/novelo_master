kind: evidence
id: ev-epoca-2016-sitio-andarai-wagner-e-guilherme-sodre
classification: A
proposition: Segundo a revista Época, reproduzida pelo Bahia Notícias, em dezembro de 2015 Jaques Wagner e Maria
  de Fátima Mendonça compraram 76% do Sítio Felicidade, em Andaraí (BA), por escritura de R$ 538 mil, e Guilherme
  Sodré ficou com 24% por meio de empresa; Wagner confirmou a compra conjunta, para lazer, dizendo que Guilherme
  "adquiriu parte do sítio para o seu filho".
