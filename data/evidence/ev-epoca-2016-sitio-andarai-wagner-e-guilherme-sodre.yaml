date: 2015-12
notes: Não é o terreno de 51 mil m² na Via Metropolitana vendido em 2025 por R$ 15 milhões. A matéria grafa a empresa
  de Guilherme como "MMSS"; a equipe não confirmou que se trate da MMSM Patrimonial.
