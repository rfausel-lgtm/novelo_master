proposition: Segundo a leitura do laudo pericial feita pelo Intercept, a produtora no Brasil recebeu US$ 3,7 milhões
  do Havengate Development Fund — R$ 20,93 milhões no câmbio da época —, enquanto outros US$ 9,7 milhões teriam
  permanecido nos Estados Unidos, somando os US$ 13,4 milhões que a mesma perícia aponta como custo total da obra.
