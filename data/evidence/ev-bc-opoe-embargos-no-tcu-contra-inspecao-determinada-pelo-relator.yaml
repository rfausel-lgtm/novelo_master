id: ev-bc-opoe-embargos-no-tcu-contra-inspecao-determinada-pelo-relator
kind: evidence
classification: C
proposition: Até 06/01/2026 o Banco Central opôs embargos de declaração no TC 022.950/2025-7 contra a decisão
  monocrática de Jhonatan de Jesus que determinou inspeção no BC (segundo a Reuters, tomada na segunda-feira,
  05/01), sustentando que o Regimento Interno do TCU reserva a órgão colegiado a determinação de inspeção em
  órgão federal; nos embargos, o BC escreve que "serve-se esta autarquia dos presentes embargos de declaração
  para solicitar que tal omissão seja sanada".
source_ids:
  - src-mercadoeconsumo-2026-01-06-banco-central-questiona-decisao-monocratica-no-caso-master
  - src-moneytimes-2026-01-09-ministro-do-tcu-suspende-fiscalizacao-no-banco-central
  - src-itatiaia-2026-01-08-tcu-suspende-inspecao-do-bc-no-caso-master
excerpt: serve-se esta autarquia dos presentes embargos de declaração para solicitar que tal omissão seja
  sanada, mediante a indicação da decisão do referido colegiado acerca da mencionada diligência
locator: Mercado e Consumo (Estadão Conteúdo), 06/01/2026, trecho dos embargos
date: 2026-01-06
notes: "Classe C: Estadão Conteúdo (transcreve os embargos), Reuters e Itatiaia descrevem o recurso e seu
  fundamento. Nem os embargos nem a decisão de inspeção foram lidos na íntegra; a data exata do protocolo não
  aparece nas fontes registradas; 06/01 é a data da notícia do Estadão Conteúdo, e o evento é datado por ela."
