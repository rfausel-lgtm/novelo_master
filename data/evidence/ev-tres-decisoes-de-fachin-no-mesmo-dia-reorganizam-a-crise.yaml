id: ev-tres-decisoes-de-fachin-no-mesmo-dia-reorganizam-a-crise
kind: evidence
classification: I
proposition: 'Os atos de 09/09/2026 formam um conjunto com desenho reconhecível. No mesmo dia, o presidente
  do Supremo suspendeu os dois atos monocráticos que se anulavam sobre o comando da Polícia Federal, retirou
  de Alexandre de Moraes a relatoria do Inquérito 4.781 e convocou o Plenário para 15/09. O efeito combinado
  é retirar dos gabinetes individuais — de Mendonça, de Dino e de Moraes — as três frentes em que a disputa
  vinha sendo travada por decisão monocrática, e devolvê-las ao colegiado ou à Presidência. Trata-se de
  leitura do conjunto, não de motivação declarada: cada decisão invoca fundamento próprio, e nenhuma delas
  formula juízo sobre a conduta dos ministros envolvidos.'
