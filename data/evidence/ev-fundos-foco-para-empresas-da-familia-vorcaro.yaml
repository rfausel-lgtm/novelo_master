id: ev-fundos-foco-para-empresas-da-familia-vorcaro
kind: evidence
classification: A
proposition: 'Segundo a Polícia Federal, que reexaminou perícias de investigações anteriores, os fundos
  São Domingos e Monte Carlo — geridos pela Sefer, antiga Foco DTVM — tiveram recursos direcionados a
  empresas do núcleo familiar de Vorcaro, sediadas em Nova Lima (MG) e administradas pelo pai, Henrique
  Vorcaro, e pela irmã, Natália Vorcaro Zettel: cerca de R$ 64 milhões à Milo Investimentos e mais de
  R$ 15 milhões à Mercatto Incorporações em menos de oito meses, além de aportes a Inter Participações,
  Prime Business Participações e SPE Cesto Incorporadora. Há ainda registro de três transferências diretas
  à conta pessoal de Daniel Vorcaro, somando cerca de R$ 2 milhões, em 2017. A reportagem que trouxe esses
  dados não registra manifestação de Vorcaro, do Banco Master ou da Sefer.'
