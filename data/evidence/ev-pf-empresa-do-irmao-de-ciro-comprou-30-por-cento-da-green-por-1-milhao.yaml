id: ev-pf-empresa-do-irmao-de-ciro-comprou-30-por-cento-da-green-por-1-milhao
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, citada na decisão da Pet 15.873, a CNLF Empreendimentos Imobiliários, administrada
  formalmente por Raimundo Neto e Silva Nogueira Lima, irmão de Ciro Nogueira, comprou 30% da Green Investimentos por R$ 1
  milhão quando o valor dessas ações era de cerca de R$ 13,06 milhões, e recebeu repasses mensais de R$ 300 mil, depois R$
  500 mil, pela "parceria BRGD/CNLF" — BRGD S.A. dirigida por Oscar Vorcaro, pai de Felipe Cançado Vorcaro.
document_ids:
- doc-2026-05-07-decisao-pet-15873-ciro-nogueira
source_ids:
