attributed_to: Polícia Federal, em representação acolhida por André Mendonça na decisão de 07/05/2026 da Pet 15.873
date: '2024-07-25'
notes: 'A decisão transcreve mensagens em que Felipe pergunta a Daniel Vorcaro, em 21 e 24/06/2024 e 25/07/2024, se segue
  "pagando a parceria brgd/cnlf? 300k mes?", e Vorcaro responde "Sim", dizendo que seria algo "muito importante". Segundo
  Felipe, a Green Investimentos recebeu R$ 2,4 milhões de dividendos anuais pela participação de 20% na Trinity Energias
  Renováveis. A decisão também descreve vantagens pessoais custeadas por Vorcaro — hospedagem no Park Hyatt de Nova York,
  restaurantes, viagens e um cartão para despesas —, com Léo Serrano como intermediário; o nome da acompanhante citada não
  é reproduzido. Hipótese investigativa, sem denúncia.'
