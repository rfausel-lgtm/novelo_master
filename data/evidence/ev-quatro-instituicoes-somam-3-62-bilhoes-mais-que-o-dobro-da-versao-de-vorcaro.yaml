id: ev-quatro-instituicoes-somam-3-62-bilhoes-mais-que-o-dobro-da-versao-de-vorcaro
kind: evidence
classification: I
proposition: Somados, os valores já conhecidos investidos no Banco Master pelas quatro instituições citadas na proposta
  de Vorcaro chegam a R$ 3,62 bilhões — Rioprevidência R$ 2,97 bilhões, Amprev R$ 400 milhões, Cedae R$ 200 milhões
  e Amazonprev R$ 50 milhões —, mais que o dobro dos R$ 2 bilhões que o próprio colaborador atribui à intermediação
  de ACM Neto e Rueda, sem que a proposta explique a diferença.
inference_basis: 'Soma aritmética feita pela própria equipe sobre quatro cifras individualmente reportadas, não uma
  cifra publicada como tal por nenhuma fonte — por isso classe I, não C. Ancoragem de cada parcela: Rioprevidência
  e Amprev pela reportagem citada em source_ids (compatível com ev-amprev-equivalia-a-quase-metade-das-letras-do-master,
  classe D, que confirma os R$ 400 milhões finais da Amprev); Cedae e Amazonprev não têm evidência própria neste
  registro. Limite: o próprio acervo já corrigiu o valor da Cedae para R$ 237 milhões, não R$ 200 milhões
  (ev-cedae-investiu-237-milhoes-nao-200, classe D, mesma auditoria do TCE-RJ) — a soma aqui não incorpora essa
  correção; refeita, o total seria de aproximadamente R$ 3,66 bilhões, não R$ 3,62 bilhões. Mantido o valor original
  nesta reclassificação por não ter sido pedida correção aritmética; ver nota.'
