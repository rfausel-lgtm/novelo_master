date: '2026-09-10'
notes: 'Reclassificação de 12/09/2026: de C para I (ver inference_basis — é soma da própria equipe, não corroboração
  por duas fontes independentes). Achado adjacente, não corrigido aqui: o total usa Cedae em R$ 200 milhões, já
  superado no próprio acervo por R$ 237 milhões (ver inference_basis) — corrigir o somatório mudaria o número
  publicado (~R$ 3,66 bi) e, para manter id/slug coerente com o conteúdo, provavelmente exigiria renomear o
  registro e atualizar quem o referencia. Fica para decisão do Rafael, não decidido nesta reclassificação.
  A discrepância entre a soma e os R$ 2 bilhões atribuídos por Vorcaro a ACM Neto/Rueda admite duas leituras não
  excludentes: parte dos recursos pode ter entrado por vias não atribuídas aos dois políticos, ou a estimativa de
  Vorcaro sobre o total captado por eles pode estar simplesmente incompleta. Nenhuma das reportagens resolve a
  questão.'
