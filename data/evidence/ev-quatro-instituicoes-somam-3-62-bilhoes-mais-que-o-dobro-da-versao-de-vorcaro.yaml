date: '2026-09-10'
notes: 'A discrepância admite duas leituras não excludentes: parte dos recursos pode ter entrado por vias não atribuídas
  aos dois políticos, ou a estimativa de Vorcaro sobre o total captado por eles pode estar simplesmente incompleta.
  Nenhuma das reportagens resolve a questão.'
