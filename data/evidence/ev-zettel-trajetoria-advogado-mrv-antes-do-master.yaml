id: ev-zettel-trajetoria-advogado-mrv-antes-do-master
kind: evidence
classification: C
proposition: 'Antes de aparecer no ecossistema do Banco Master, Fabiano Campos Zettel teve carreira de
  advogado empresarial e imobiliário, não de financista: graduado pela Faculdade de Direito Milton Campos
  (1995-2000) e mestre em Direito pela UFMG (2002-2004), foi professor em instituições mineiras e atuou
  como advogado em milhares de processos, tendo como principal cliente a MRV Engenharia e Participações.
  Casou-se com Natália Bueno Vorcaro, irmã do banqueiro, em 2018. Criou a Moriah Asset, gestora de private
  equity de saúde e bem-estar, com participações em Oakberry, Desinchá, Les Cinq Gym e Empório Frutaria,
  entre outras. É também pastor da Igreja Batista da Lagoinha e consta como presidente da pessoa jurídica
  da Lagoinha Belvedere, em Belo Horizonte — a instituição informou que, desde novembro de 2025, ele ''não
  exerce qualquer atividade de pastoreio''. Não foi localizada nenhuma fonte que descreva como ele conheceu
  a família Vorcaro, nem vínculo profissional anterior com o grupo.'
