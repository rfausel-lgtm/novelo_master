id: ev-cnn-brasil-relata-peticao-da-defesa-de-vorcaro-a-fachin-sobre-vazamento-de-dados-do-celular
kind: evidence
classification: A
proposition: Segundo a CNN Brasil (16/10/2026), a defesa de Daniel Vorcaro pediu ao presidente do STF, Edson
  Fachin, a abertura de investigação sobre o vazamento de áudios, mensagens e outros conteúdos extraídos do
  celular apreendido na Operação Compliance Zero; defende que o material obtido por meio dos supostos
  vazamentos não sirva de base para novas investigações contra ele; pede investigação criminal que identifique
  agentes públicos com acesso funcional ao aparelho e terceiros que possam ter recebido as informações; e,
  ainda segundo a reportagem, afirma não confirmar o teor de tudo o que veio a público e sustenta que os
  conteúdos podem ter sido manipulados.
source_ids:
