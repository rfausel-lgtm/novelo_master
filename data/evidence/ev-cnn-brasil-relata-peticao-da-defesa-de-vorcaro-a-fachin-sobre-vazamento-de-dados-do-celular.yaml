attributed_to: Defesa de Daniel Vorcaro, conforme a CNN Brasil (Fernanda Fonseca), 16/10/2026
date: 2026-10-16
notes: "Alegação da defesa, relatada pelo veículo; o Novelo não leu a petição e não localizou número de
  processo, despacho ou resposta do STF, da PF ou da PGR. O Novelo não afirma a autenticidade nem a
  procedência do material nem a tese da defesa. Cada um dos três veículos relata a peça com apuração própria,
  mas todos dependem da mesma petição: corroboram o envio e o conteúdo atribuído, não a veracidade do que a
  defesa alega."
