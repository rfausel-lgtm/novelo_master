id: ev-ricardo-siqueira-condenado-cvm-trump-hotel
kind: evidence
classification: A
proposition: 'Ricardo Siqueira Rodrigues foi condenado pela CVM em dezembro de 2024 — antes, portanto, do
  episódio RioPrevidência/Banco Master — por fraude no empreendimento imobiliário LSH Hotel (que teve
  licença para usar a marca Trump, na Barra da Tijuca): R$ 17,7 milhões de condenação individual, dentro de
  uma fraude total estimada em R$ 45 milhões no projeto. Votou pela aprovação de um laudo que sabia estar
  inflacionado. Co-réu: Paulo Figueiredo Filho, sócio no empreendimento.'
