date: '2024-03-08'
notes: 'A PF não os classifica como integrantes de "A Turma" no sentido operacional do núcleo, mas como
  policiais fora da estrutura criminosa que atenderam pedidos pontuais — o que, se confirmado, amplia a
  rede de violação de sigilo funcional identificada no caso para além dos seis nomes já associados ao
  núcleo. Nenhum deles tem denúncia oferecida ou julgamento no acervo; a natureza de sua participação
  (consciente, em troca de favor, ou enganada quanto ao propósito da consulta) não está esclarecida pelo
  documento. Não há elemento que ligue as buscas sobre Henrique Moura Vorcaro, Nathalia Bueno Ribeiro
  Vorcaro ou Milo Investimento SA a qualquer irregularidade cometida por eles — o resultado da consulta,
  segundo o próprio agente, foi negativo ("não teria nada na PF").'
