id: ev-banvox-dtvm-e-a-antiga-cm-capital-markets
kind: evidence
classification: I
proposition: 'A Banvox DTVM é a antiga CM Capital Markets DTVM: o CNPJ 02.671.743/0001-19 aparece em demonstrações
  financeiras de fundo relativas a 31/12/2023 sob a denominação anterior, e os sócios atuais ingressaram
  no quadro societário em 20/06/2024. É a mesma pessoa jurídica, renomeada — o que precisa ser explicitado
  para que a mudança de nome nos registros não seja lida como erro.'
document_ids: []
