updated_at: '2026-09-04'
inference_basis: Cotejo entre o CNPJ 02.671.743/0001-19, que aparece em demonstrações financeiras de fundo
  relativas a 31/12/2023 sob a denominação CM Capital Markets DTVM, e os registros atuais da mesma inscrição
  sob a denominação Banvox DTVM, com ingresso dos sócios atuais no quadro societário em 20/06/2024. Mesma
  pessoa jurídica, renomeada.
