id: ev-gazetamercantil-vorcaro-proximo-irmaos-conte-desde-2011
kind: evidence
classification: A
proposition: 'Segundo dossiê da Gazeta Mercantil de 24/11/2025, a partir de 2011 Daniel Vorcaro aproximou-se
  dos irmãos Antonio Augusto e Vicente Conte Neto, herdeiros de uma administradora de cemitérios e sócios da
  gestora Blackwood; a parceria teria começado num projeto hoteleiro frustrado (Golden Tulip, Belo Horizonte)
  e evoluído até a aquisição do Banco Máxima.'
