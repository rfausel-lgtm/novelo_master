id: ev-valor-triangulacao-de-recursos-na-compra-do-maxima
classification: A
proposition: Segundo o voto BCB 20/2019, parcela expressiva dos recursos usados na aquisição das ações
  teria se originado no próprio Banco Máxima, por transferências sucessivas entre a instituição, empresas
  de Daniel Vorcaro e fundos de investimento.
