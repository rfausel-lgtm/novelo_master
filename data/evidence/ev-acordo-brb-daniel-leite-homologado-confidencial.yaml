id: ev-acordo-brb-daniel-leite-homologado-confidencial
kind: evidence
classification: A
proposition: O BRB moveu ação civil contra Daniel Vorcaro, Daniel Leite, o Banco Master e outros, na 7ª
  Vara da Fazenda Pública do DF, por suposta tentativa coordenada e oculta de assumir o controle acionário
  do banco. Acordo entre BRB e Daniel Leite foi assinado em 15/04/2026 e homologado em 31/07/2026, com
  ele saindo do processo sob cláusula de confidencialidade e determinação de transferência das ações ao
  BRB. Reportado por fonte única até o momento; tratado como classe A até corroboração por segunda fonte
  independente.
