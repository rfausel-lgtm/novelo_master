id: ev-ipja-ciro-pede-a-gonet-desistencia-de-concorrente
kind: evidence
classification: D
proposition: 'Em 14/04/2024, segundo o IPJ-A 3298613/2026, o advogado Ciro Soares escreve a Daniel Vorcaro:
  ''Amizade é tudo viu irmão'', ''Gonet é firme'', pede que leia mensagem a seguir e reforça ''Fique só
  com vc''. Em áudio subsequente, relatado no laudo, Ciro explica a Vorcaro sobre pedido para retirar
  candidatura de concorrente (''Jarbas'' no laudo, identificado pela imprensa como referência a Jarbas
  Soares Júnior): ''Cara, eu pedi o Gonet ontem, ele me ligou falar um assunto, aí eu falei, Gonet, pede
  o cara para tirar a candidatura, pede o cara que o cara vai tomar uma porrada arretada. Aí o Gonet me
  ligou ontem à noite e falou: Ciro, acabei de ligar para ele, ele vai desistir.'' O laudo registra que
  não há contato salvo como ''Paulo Gonet'' ou ''Gonet'' na agenda do aparelho de Vorcaro; a identificação
  da pessoa citada por Ciro Soares como o procurador-geral é inferência da própria PF (''pode se tratar
  de PAULO GONET''), não confirmação documental direta.'
