id: ev-cmn-res-5279-operacoes-subsidiadas-do-fgc-sob-criterios-de-elegibilidade-e-processo-competitivo
kind: evidence
classification: D
proposition: Segundo o estatuto do FGC na redação dada pela Resolução CMN 5.279, diante de situação
  conjuntural adversa reconhecida pelo BC o Conselho de Administração do fundo pode celebrar operações
  subsidiadas que podem reduzir o patrimônio líquido do FGC, desde que defina critérios de elegibilidade, haja
  processo competitivo entre participantes qualificados e o relatório da administração do exercício seguinte
  informe as razões, os critérios e as partes contratantes.
