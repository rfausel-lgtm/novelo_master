id: ev-mendonca-explica-identificacao-nota-vorcaro-pf-pgr
kind: evidence
classification: D
proposition: 'André Mendonça, em resposta formal a Fachin de 14/09/2026, explicou que determinou a
  identificação de pessoas mencionadas na IPJ-M nº 144738439/2026 porque uma nota enviada por Daniel
  Vorcaro a um interlocutor não identificado, via WhatsApp, mencionava nominalmente o diretor-geral da PF,
  Andrei Rodrigues, e o procurador-geral da República, Paulo Gonet — e que agiu "sem imputar qualquer
  suspeita a quem quer que seja", por cautela, dada a menção direta às duas autoridades.'
