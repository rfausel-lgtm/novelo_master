excerpt: diante da menção direta à pessoa do atual Diretor-Geral da Polícia Federal, bem como do
  Procurador-Geral da República, por cautela, buscando preservar a higidez dos autos e a eficiência das
  investigações — sem imputar qualquer suspeita a quem quer que seja.
date: '2026-09-14'
