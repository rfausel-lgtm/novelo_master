id: ev-gilmar-tese-vicio-legitimidade-ativa-partido-politico
kind: evidence
classification: D
proposition: 'No voto de vista de 08/09/2026, Gilmar Mendes sustenta que "o afastamento cautelar foi
  determinado a partir de solicitação formulada por partido político, em aparente contrariedade ao art.
  282, § 2º, do Código de Processo Penal e ao art. 230-B do Regimento Interno do Supremo Tribunal Federal,
  preceitos que traduzem exigência própria do sistema acusatório" — tese de vício de legitimidade ativa,
  somada ao argumento de que a matéria seria de competência do Plenário, não da 2ª Turma.'
