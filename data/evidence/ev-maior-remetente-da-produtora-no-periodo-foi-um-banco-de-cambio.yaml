excerpt: Figuram, dentre os principais remetentes de recursos para a empresa, a Moneycorp Banco de Câmbio S.A.,
  que enviou R$ 3.920.976,40
date: '2026-09-03'
notes: A decisão não qualifica esse remetente nem o menciona em qualquer outro ponto do documento.
