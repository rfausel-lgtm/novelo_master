id: ev-maior-remetente-da-produtora-no-periodo-foi-um-banco-de-cambio
kind: evidence
classification: D
proposition: A decisão do STF de 03/09/2026 registra que o maior remetente isolado de recursos à Go Up Entertainment
  entre 10/11 e 30/12/2025 foi a Moneycorp Banco de Câmbio S.A., com R$ 3.920.976,40 — mais do que a soma dos valores
  enviados no mesmo período pelo deputado Mário Frias (R$ 645.400,00) e pela NTT Brasil (R$ 750.000,00).
document_ids:
- doc-2026-09-03-decisao-dino-pet16669-operacao-make-up
