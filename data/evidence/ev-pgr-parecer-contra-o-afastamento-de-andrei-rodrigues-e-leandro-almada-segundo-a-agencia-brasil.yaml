id: ev-pgr-parecer-contra-o-afastamento-de-andrei-rodrigues-e-leandro-almada-segundo-a-agencia-brasil
kind: evidence
classification: A
proposition: >-
  Segundo a Agência Brasil (14/10/2026), a PGR enviou ao STF, na noite de 13/10/2026, parecer assinado pelo
  procurador-geral, pelo vice-procurador-geral e por dois subprocuradores-gerais, contrário ao afastamento do
  diretor-geral da PF, Andrei Rodrigues, e do diretor de Inteligência, Leandro Almada; segundo a matéria, o parecer
  afirma que a qualificação negativa do comportamento das autoridades policiais, para justificar a medida,
  "precisaria estar acompanhada de evidências da participação imprópria em atos ilícitos", que
  a posição hierárquica não basta e que o afastamento configuraria "risco à ordem pública".
source_ids:
- src-agenciabrasil-2026-10-14-pgr-se-manifesta-contra-afastamento-de-diretor-geral-da-pf
attributed_to: Agência Brasil
date: '2026-10-13'
notes: >-
  Fonte única. Documento e PET não localizados: nos andamentos públicos das PET 16.704 e 16.662 consultados em
  16/10/2026, a última entrada é de 13/10/2026 e não há petição identificável da PGR. Compatível, sem contradição,
  com o Informe do STF das 18:43 de 13/10, que registrava a Presidência aguardando o pronunciamento da PGR.
