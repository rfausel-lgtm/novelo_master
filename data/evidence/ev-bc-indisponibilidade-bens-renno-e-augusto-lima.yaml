kind: evidence
id: ev-bc-indisponibilidade-bens-renno-e-augusto-lima
classification: C
proposition: Em 05/05/2026, conforme comunicado do Banco Central noticiado pela imprensa, foram declarados indisponíveis
  os bens de Augusto Ferreira Lima e Luiz Rennó Netto, com base no art. 36 da Lei 6.024/1974, pela atuação como
  administradores de fato do Banco Master nos doze meses anteriores ao regime de resolução, conforme comissão de
  inquérito do Ato de Diretor 695/2026 e Parecer Jurídico 543/2026-BCB/PGBC.
