id: ev-comunicado-bacen-nomeia-controladoras-e-ex-administradores
kind: evidence
classification: D
proposition: 'O Comunicado 44.234 do Banco Central, que decretou a liquidação extrajudicial do Banco
  Master em 18/11/2025, lista como controladoras sujeitas a indisponibilidade de bens duas pessoas
  jurídicas até então não mapeadas no acervo — Master Holding Financeira S.A. e 113 Investimentos e
  Participações Ltda —, ao lado das pessoas físicas já conhecidas (Daniel Vorcaro, Armando Miguel Gallo
  Neto, Felipe Wallace Simonsen), e nomeia como ex-administradores Angelo Ribeiro da Silva, Daniel Vorcaro,
  Felipe Wallace Simonsen e Luiz Bull.'
