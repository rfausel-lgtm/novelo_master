id: ev-tcu-relator-suspende-inspecao-no-bc-e-remete-embargos-ao-plenario
kind: evidence
classification: C
proposition: Em despacho de 08/01/2026, Jhonatan de Jesus suspendeu a inspeção no Banco Central e remeteu os
  embargos do BC ao Plenário do TCU, cuja primeira sessão estava marcada para 21/01; segundo trechos
  transcritos pela Reuters e pela Itatiaia, o relator chamou a tese do BC de "leitura restritiva de
  dispositivo regimental", afirmou que o Regimento contempla poderes instrutórios do relator para determinar
  inspeções e justificou a remessa pela "dimensão pública assumida pelo caso".
