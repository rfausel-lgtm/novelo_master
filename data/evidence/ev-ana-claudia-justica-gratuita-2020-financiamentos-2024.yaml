id: ev-ana-claudia-justica-gratuita-2020-financiamentos-2024
kind: evidence
classification: C
proposition: 'Contraste patrimonial documentado, registrado como fato e sem inferência sobre sua causa:
  em 2020, Ana Cláudia Queiroz de Paiva pediu os benefícios da justiça gratuita em disputa judicial, alegando
  não poder arcar com as custas ''sem prejuízo do seu próprio sustento e de sua família'' — a causa envolvia
  cobrança de cerca de R$ 14 mil relativa a um aluguel de R$ 1.550 mensais. Em 2024, quatro anos depois
  e já diretora da Super Empreendimentos, assumiu dois financiamentos imobiliários: um de R$ 2,4 milhões
  em Belo Horizonte, com entrada de R$ 1,1 milhão, e outro de R$ 1,3 milhão em São Paulo. Nenhuma fonte
  localizada informa sua remuneração no período, nem apresenta explicação para a mudança de patamar. O
  corpus não afirma relação entre os dois fatos — registra a sequência.'
