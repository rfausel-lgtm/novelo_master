notes: 'A nota de 16/11 já constava do acervo pela representação de 27/02/2026; o que esta IPJ-A
  acrescenta é o horário exato da criação e a contraposição direta com o horário da publicação — é o
  carimbo de tempo que transforma a coincidência em contradição documentada. Em depoimento de 30/12,
  perguntado pela delegada Janaína Palazzo como soubera da vara antes da prisão, Vorcaro respondeu que
  saíra notícia e que "a gente já sabia, na verdade". A alegação de que Escosteguy recebia dinheiro para
  publicar matérias de interesse do banqueiro é imputação da PF, já registrada no acervo como alegação
  não verificada, e continua nessa condição.'
