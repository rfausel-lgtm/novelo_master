id: ev-alibi-da-materia-do-bastidor-anterior-ao-horario-da-nota
kind: evidence
classification: D
proposition: 'A extração do celular de Vorcaro data a nota em que ele pergunta a um interlocutor se este
  teria proximidade com o juiz federal Ricardo Soares Leite em 16/11/2025, às 15h51min31s — cerca de 19
  horas antes de a imprensa revelar, em 17/11/2025 às 11h08, que havia inquérito sobre a compra do Master
  pelo BRB tramitando na 10ª Vara Federal do DF. O nome do magistrado não fora publicado por veículo
  nenhum. A defesa de Vorcaro sustentou publicamente que só procurou aquela vara depois da reportagem,
  porque "desconhecia o número do inquérito e qual dos juízes era responsável por ele". A PF registra
  ainda que, segundo a análise, a própria reportagem foi construída com participação de Vorcaro, que
  conversou com o jornalista Diego Escosteguy na véspera e no dia, e recebeu dele o texto já publicado
  às 11h11min48s — repassando-o ao advogado Walfrido Warde treze segundos depois.'
