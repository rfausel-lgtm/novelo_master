proposition: >-
  Segundo a Folha de S.Paulo, conforme republicação do Brasil 247 (16/06/2026), mensagens de Vorcaro listam
  Fábio Faria entre os convidados de encontro restrito em Lisboa, e Faria declarou que não esteve em Lisboa
  durante o ano de 2024.
