id: ev-trinta-e-tres-municipios-com-instrumento-documentado-do-credcesta
kind: evidence
classification: D
proposition: 'A varredura elevou de dez para trinta e três o número de municípios com instrumento localizado
  em fonte primária, e acrescentou cerca de vinte com prova de operação sem convênio localizado. Os novos
  concentram-se em Pernambuco, com dez instrumentos em nove municípios, e distribuem-se ainda por Alagoas,
  Goiás, Maranhão, Amapá, Mato Grosso do Sul, Bahia, São Paulo e Espírito Santo. Contra os 176 municípios
  declarados no balanço do banco de 2024, falta ainda a maior parte — mas o gargalo agora é de cobertura
  documental, não de método: Bahia, Sergipe e Mato Grosso do Sul não têm rede agregada útil, e São Paulo,
  Rio de Janeiro e Minas Gerais dependem de diários municipais próprios.'
