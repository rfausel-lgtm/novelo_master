id: ev-convenio-009-2023-ms-objeto-mensalidades-servidores-filiados
kind: evidence
classification: D
proposition: O primeiro convênio que abriu a folha de Mato Grosso do Sul à PKL One, em março de 2023,
  declarava como objeto o desconto de 'contribuições e mensalidades devidas por seus servidores filiados'
  — redação padrão de convênio com entidade sindical ou associativa. O cartão consignado de benefício,
  produto que a empresa efetivamente passou a operar, só apareceu por escrito no instrumento de 2025,
  dois anos depois.
