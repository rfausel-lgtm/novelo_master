id: ev-apcf-2026-10-30-nota-diz-que-modificacoes-em-registros-digitais-nao-significam-necessariamente-adulteracao
kind: evidence
classification: D
status: unverified
proposition: Em nota pública de 30/10/2026, a Associação Nacional dos Peritos Criminais Federais afirmou que a
  eventual identificação de modificações em registros digitais não significa necessariamente que o
  conteúdo probatório tenha sido adulterado, que o questionamento da defesa de Vorcaro não constitui, por si só, comprovação de
  falha na produção da prova pericial e que cabe ao Poder Judiciário avaliar as alegações. A evidência prova
  apenas o que a entidade disse; a nota não analisa arquivos específicos nem o laudo da PF, e não afirma que o
  aparelho foi ou não alterado.
