id: ev-varios-municipios-baianos-reservaram-margem-exclusiva-ao-programa
kind: evidence
classification: C
proposition: Itapetinga não é caso isolado. Senhor do Bonfim, por decreto de 04/10/2020, reservou até
  20% da base de descontos exclusivamente para o cartão do programa; Juazeiro editou decretos no mesmo
  sentido em março de 2021, também com 20%; Barra do Choça previu, em decreto de 08/06/2021, linha de
  crédito rotativo pelo cartão. Registre-se ainda o município de Irará, cujo decreto de 2021 reserva 30%
  da remuneração exclusivamente para operações do programa — a maior margem exclusiva localizada em toda
  a investigação, estadual ou municipal —, embora ali não se tenha localizado convênio nem menção à operadora,
  de modo que o vínculo permanece não estabelecido.
