id: ev-uol-rueda-pediu-que-mensagens-fossem-apagadas-em-12-07-2024
kind: evidence
classification: A
proposition: >-
  Segundo o UOL (16/10/2026), às 11h45 de 12/07/2024 Antônio Rueda, que havia apagado dez mensagens seguidas
  na conversa, escreveu a Daniel Vorcaro pedindo que ele apagasse mensagens.
attributed_to: UOL (Fabio Serapião, Natália Portinari e Cézar Feitoza)
document_ids: []
source_ids:
- src-uol-2026-10-16-mensagens-mostram-como-rueda-e-acm-levaram-o-master-a-fundos-de-previdencia
date: '2024-07-12'
notes: >-
  O UOL não diz o que continham as mensagens apagadas nem informa o fuso horário do horário citado. Rueda não
  comentou este ponto na nota publicada; nega ter participado das negociações do Amapá. A frase do tesoureiro
  do Master, no mesmo dia, sobre Rueda, que repete o relato de outro intermediário, não é registrada (relato de
  terceiro por terceiro).
