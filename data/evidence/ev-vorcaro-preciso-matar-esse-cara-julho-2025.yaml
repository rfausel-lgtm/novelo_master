id: ev-vorcaro-preciso-matar-esse-cara-julho-2025
kind: evidence
classification: D
proposition: 'Em 25/07/2025, Daniel Vorcaro escreveu a Luiz Phillipi Mourão que alguém o havia filmado
  com sua filha e estaria espalhando as imagens na internet, e acrescentou: "Preciso matar esse cara".
  Mourão perguntou "Quem é? me manda tudo que vc tem ou alguma coisa" e, diante da repetição da frase
  por Vorcaro, respondeu: "sabe quem é? Vou pra cima".'
