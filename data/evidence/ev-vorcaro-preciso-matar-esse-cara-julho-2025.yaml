excerpt: Preciso matar esse cara
date: '2025-07-25'
notes: 'A pessoa filmada junto com Vorcaro é filha dele, identificada no documento como Stella; seu nome
  não é reproduzido aqui por ser dado pessoal de terceiro sem relevância para o fato apurado. A análise
  do chat (IPJ-A nº 1070759/2026, lote 206) mostra o desdobramento imediato desta mesma conversa: Vorcaro
  identificou o autor como "Sean" (contato salvo como Sean Monteine, de número internacional) e mandou
  que ligassem "como Polícia Federal do Brasil" para o estabelecimento Amor St Tropez, pedindo os nomes
  de todos à mesa; Felipe Mourão confirmou que "A Turma" ligou para Sean, e há registro de conversas
  diretas entre Marilson Roseno da Silva e ele sobre o episódio. O documento não indica que algo além do
  contato telefônico e do levantamento de dados tenha sido executado. A frase se soma a outras do mesmo
  padrão já no acervo, como o plano de simular assalto contra o jornalista Lauro Jardim e a determinação
  de "sacode" contra ex-funcionários, e é nesse conjunto que a PF a lê.'
