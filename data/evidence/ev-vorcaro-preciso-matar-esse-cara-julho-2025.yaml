excerpt: Preciso matar esse cara
date: '2025-07-25'
notes: 'A pessoa filmada junto com Vorcaro é filha dele e seu nome, que consta do documento, não é
  reproduzido aqui por ser dado pessoal de terceiro sem relevância para o fato apurado. O documento não
  identifica o autor da filmagem, não registra desdobramento da conversa e não indica que algo tenha sido
  executado — o que está documentado é a ordem verbal e a adesão imediata de Mourão. A frase se soma a
  outras do mesmo padrão já no acervo, como o plano de simular assalto contra o jornalista Lauro Jardim
  e a determinação de "sacode" contra ex-funcionários, e é nesse conjunto que a PF a lê.'
