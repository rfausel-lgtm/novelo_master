id: ev-relatorio-pf-sem-contato-salvo-de-andrei
kind: evidence
classification: D
proposition: 'Elemento central e exculpatório do relatório da PF sobre o celular de Vorcaro, ausente do
  registro anterior do corpus: o documento consigna expressamente, à página 211, que ''não foi encontrado
  contato salvo no celular de DANIEL VORCARO com o nome de Andrei Passos ou Andrei'', e que as ocorrências
  localizadas são ''menções a pessoa que pode se tratar de ANDREI PASSOS''. Não há, no acervo, uma única
  mensagem trocada entre Vorcaro e o diretor-geral: todas as menções são de terceiros falando dele. Sobre
  a nota de 30/10/2025, o relatório usa o condicional — os termos ''Andrei'' e ''Paulo'' ''podem indicar''
  referência a Andrei Passos e a Paulo Gonet —, e o suporte é uma nota do próprio aplicativo de Notas
  de Vorcaro, fotografada e enviada por WhatsApp, não mensagem endereçada a ele. O documento traz ainda
  duas autolimitações formais: declara que ''não foram realizados quaisquer atos de aprofundamento investigativo
  direcionados a magistrados ou membros do Ministério Público'', limitando-se à ''identificação e exposição
  objetiva dos elementos já existentes''; e ressalva que, em razão do ''reduzido lapso temporal de 72
  horas'', a análise ''não possui caráter exaustivo''.'
