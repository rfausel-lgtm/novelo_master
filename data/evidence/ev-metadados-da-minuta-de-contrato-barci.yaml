excerpt: O arquivo compartilhado ('MINUTA DE CONTRATO') aponta em seus metadados como autor usuário denominado
  GUILHERME BENAZZI e a última modificação realizada por usuário denominado 'Ministro Alexandre de Moraes'
  às 16:30 -03:00 do dia 11/01/2024.
