id: ev-metadados-da-minuta-de-contrato-barci
kind: evidence
classification: D
proposition: O relatório registra que os metadados da minuta do contrato entre o escritório Barci de Moraes
  e o Banco Master apontam como autor o usuário 'Guilherme Benazzi' e como responsável pela última modificação
  o usuário denominado 'Ministro Alexandre de Moraes' — em 11/01/2024, às 16h30, e novamente na versão
  final, em 15/01/2024, às 23h04. Trata-se do nome da conta de usuário do editor de texto, e não de assinatura
  ou demonstração de autoria pessoal; a própria PF não extrai dele nenhuma conclusão.
