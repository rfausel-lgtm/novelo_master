id: ev-phc-oficio-proprio-ao-bc-junho-2025
kind: evidence
classification: D
proposition: 'Em 18/06/2025, ainda como presidente do BRB, Paulo Henrique Costa assinou, ao lado de Dário
  Oswaldo Garcia Júnior e Robério Bonfim Mangueira, ofício ao Banco Central detalhando o histórico e o
  volume das cessões de crédito do Banco Master ao BRB — R$ 5,99 bilhões em 2024, R$ 7,4 bilhões até
  maio de 2025 — e as garantias e medidas de mitigação adotadas diante de indícios de irregularidade nas
  carteiras. É a primeira manifestação institucional do BRB sobre o episódio já lida diretamente pela
  equipe, cinco meses antes de seu afastamento da presidência.'
