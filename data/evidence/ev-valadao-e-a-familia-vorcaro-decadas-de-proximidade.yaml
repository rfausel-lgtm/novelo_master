notes: Proximidade pessoal não é vínculo com o esquema investigado. Valadão esclarece que o episódio do BMW se refere
  à aquisição de um veículo e não a presente ou benefício; a Lagoinha nega vínculo institucional com o Master.
  Classificado como A por decisão editorial desta frente, embora haja duas apurações independentes.
