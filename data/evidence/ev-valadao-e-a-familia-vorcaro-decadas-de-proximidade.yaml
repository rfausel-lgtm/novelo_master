id: ev-valadao-e-a-familia-vorcaro-decadas-de-proximidade
kind: evidence
classification: A
proposition: 'Duas apurações jornalísticas distintas descrevem proximidade de décadas entre André Valadão e a família
  Vorcaro: segundo O Globo, na inauguração de templo da Lagoinha em Belo Horizonte, em abril de 2025, Valadão chamou
  Henrique e Aline Vorcaro de "amigos da minha vida [...] de anos, de décadas" e falou em "mais de 20 anos de
  relacionamento" com Fabiano Zettel; segundo a Folha de S.Paulo, Valadão celebrou o casamento de Zettel com Natália
  Vorcaro em 2018, seu filho dançou a valsa na festa de 15 anos da filha de Daniel Vorcaro em 2023, e Henrique
  Vorcaro ajudou a quitar a dívida de um BMW comprado por Valadão cerca de 25 anos antes.'
