id: ev-uol-mensagens-de-kachar-e-vorcaro-sobre-patrocinios-a-eventos-do-grupo-globo
kind: evidence
classification: A
proposition: 'Segundo o UOL (15/10/2026), mensagens extraídas pela PF do celular de Daniel Vorcaro mostram
  Frederic Kachar tratando com ele de patrocínios a eventos do grupo: uma tabela enviada por Kachar registra o
  Baile da Vogue de 2024 (R$ 825 mil) e o camarote da editora no Carnaval de 2023 (R$ 1,6 milhão); Kachar
  pediu ajuda para "destravar o uso do novo contrato" de publicidade e, em 2025, escreveu "Tirei o banco nos
  dois casos" sobre as propostas. Segundo o Terra, Vorcaro foi um dos principais patrocinadores do Summit
  Valor Econômico Brazil-USA.'
