id: ev-dezesseis-pedidos-sem-decisao-na-pet-16230
kind: evidence
classification: D
proposition: 'Três meses depois da constrição de 19/06/2026, a PET 16.230 tem dezesseis pedidos sem decisão — sete
  agravos regimentais, pedidos de revogação e de liberação de verbas alimentares — contra apenas três decisões monocráticas
  em todo o processo: a da constrição, a de acesso aos autos, de 26/06, e a do desbloqueio dos proventos do Senado
  de Jaques Wagner, de 29/07. O último andamento é de 10/09/2026.'
