excerpt: Redação dada pela Resolução CMN nº 5.279, de 22/1/2026.
locator: art. 3º, § 1º, do estatuto (e demais marcas ao longo do texto)
date: 2026-01-22
notes: D demonstra o conteúdo do texto consolidado do BC (número, data e dispositivos alterados), não os
  motivos da alteração. O consolidado não traz data de início de vigência da 5.279, ao contrário da 5.295 ("a
  partir de 1º/6/2026"); o Novelo não afirma quando a 5.279 entrou em vigor.
