id: ev-cmn-res-5279-numero-e-data-no-texto-consolidado-da-res-4222
kind: evidence
classification: D
proposition: O texto consolidado da Resolução CMN 4.222/2013 publicado pelo BC registra a Resolução CMN nº
  5.279, de 22/1/2026, como a que deu nova redação, incluiu ou revogou dispositivos do estatuto (Anexo I) e do
  regulamento (Anexo II) do FGC.
document_ids:
  - doc-2026-01-22-res-cmn-5279-redacoes-no-texto-consolidado-da-res-4222
