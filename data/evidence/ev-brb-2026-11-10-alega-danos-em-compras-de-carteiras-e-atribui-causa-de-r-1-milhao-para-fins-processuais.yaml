id: ev-brb-2026-11-10-alega-danos-em-compras-de-carteiras-e-atribui-causa-de-r-1-milhao-para-fins-processuais
kind: evidence
classification: D
status: unverified
proposition: O BRB informou que a ação trata de danos patrimoniais que o banco alega ter sofrido em aquisições
  de carteiras de crédito do Banco Master e de sociedades relacionadas em 2025, que a extensão dos danos será
  apurada em fase processual própria e que atribuiu à causa o valor de R$ 1 milhão “para fins processuais”,
  sem quantificar o dano. Segundo o BRB, a demanda também contempla seis empresas, com “pedidos de natureza
  patrimonial”. É alegação do autor da ação.
