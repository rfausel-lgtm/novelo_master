id: ev-cmn-res-5279-estatuto-art-5-par-5-fgc-pode-gerir-fundos-de-investimento-dos-quais-seja-cotista-exclusivo
kind: evidence
classification: D
proposition: O texto consolidado da Res. CMN 4.222 (v19, BC) marca como incluído pela Res. CMN 5.279, de
  22/1/2026, o § 5º do art. 5º do estatuto do FGC, segundo o qual o fundo pode realizar a gestão de fundos de
  investimentos dos quais seja cotista exclusivo.
document_ids:
  - doc-2026-01-22-res-cmn-5279-redacoes-no-texto-consolidado-da-res-4222
source_ids:
