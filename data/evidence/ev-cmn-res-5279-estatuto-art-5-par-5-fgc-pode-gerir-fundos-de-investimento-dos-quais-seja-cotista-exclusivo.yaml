excerpt: O FGC pode realizar a gestão de fundos de investimentos dos quais seja cotista exclusivo
locator: Anexo I (estatuto), art. 5º, § 5º (incluído)
date: 2026-01-22
notes: D demonstra o conteúdo do dispositivo; não diz que o FGC possua ou gira tais fundos.
