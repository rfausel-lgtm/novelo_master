notes: A PF não conclui se Alina Boueres cedeu as credenciais conscientemente ou se foi vítima de invasão
  — ver o registro dela (alina-boueres) para essa ressalva. O episódio mais grave desta cadeia é o acesso,
  em 24/07/2024, à Notícia de Fato que deu origem à própria Operação Compliance Zero, registrado em
  evidência separada.
