id: ev-mpf-acesso-ilicito-sistema-unico-alina-boueres
kind: evidence
classification: D
proposition: 'Entre fevereiro de 2024 e julho de 2025, a organização de Daniel Vorcaro, por meio de Felipe
  Mourão, acessou reiteradamente o sistema Único do Ministério Público Federal usando o login institucional
  da servidora Alina Boueres (matrícula 14.103, lotada no gabinete PR4-MNM), obtendo consultas processuais
  sobre: o inquérito da DELECOR/DRPJ/SR/PF/SP envolvendo Nelson Tanure, Daniel Vorcaro, Gilberto Benevides
  e Maurício Quadrado (Gafisa/Planner Trustee), aberto a partir de notícia-crime de Vladimir Timerman;
  seis procedimentos sigilosos relacionados a Daniel Vorcaro; e uma busca cruzada pelos termos "BRB AND
  MASTER" para mapear qualquer investigação envolvendo o banco e sua aquisição pelo BRB. Em 23/03/2024,
  uma primeira tentativa de acesso ao inquérito da notícia-crime de Timerman foi barrada por sigilo máximo;
  no dia seguinte, 24/03/2024, o mesmo inquérito foi acessado integralmente pelo login de Alina Boueres.'
