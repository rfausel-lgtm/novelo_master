id: ev-ipja-faria-e-o-convite-ao-diretor-geral-da-pf
kind: evidence
classification: D
proposition: 'Em 03/04/2024, segundo o laudo, o contato salvo como ''Fabio Faria'' encaminha a Vorcaro
  mensagens de interlocutor NÃO identificado: ''O que acha de eu convidar o DPF Andrei'' e, em seguida,
  ''Aí fechamos o PGR e o DPF''. Faria responde ''Acho ótimo'' e ''Pode convidar''. Cinco minutos depois
  encaminha nova mensagem de terceiro não identificado — ''Podem entrar em contato lá na PF. Ele aceitou''
  — e pergunta a Vorcaro: ''Vc avisa pro Marcio entrar em contato com o Andrei?''. Em paralelo, Vorcaro
  diz ao contato ''Marcio Conjur'' que o ''Ministro fez convite ao andrei PF''. A autoria das mensagens
  encaminhadas não é estabelecida pelo laudo, e a identificação de ''Andrei'' como Andrei Rodrigues é
  registrada pela própria PF como pessoa que ''pode se tratar'' dele: não há contato com esse nome salvo
  no aparelho.'
