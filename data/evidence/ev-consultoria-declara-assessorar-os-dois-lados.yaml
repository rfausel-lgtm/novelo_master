id: ev-consultoria-declara-assessorar-os-dois-lados
kind: evidence
classification: D
proposition: A Crédito e Mercado declara à CVM, em formulário de referência público, que seu departamento
  de contratos e licitações presta 'auxílio aos clientes nos processos de credenciamentos das instituições
  financeiras' e, na linha imediatamente seguinte, 'auxílio as Instituições Financeiras nos processos
  de credenciamento'. A empresa assessora, portanto, os dois lados do mesmo procedimento — o que tensiona
  sua defesa pública de que nunca foi consultada sobre os investimentos no Banco Master e de que a decisão
  cabia exclusivamente aos gestores dos regimes próprios. O mesmo documento informa 386 clientes que são
  regimes próprios, de 390 no total, e registra a incorporação da Plena Consultoria de Investimentos em
  31/12/2019.
