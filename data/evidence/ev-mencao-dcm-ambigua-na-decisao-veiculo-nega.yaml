inference_basis: Leitura direta da decisão, que reproduz a sigla sem identificá-la, confrontada com a
  atribuição feita por terceiros na imprensa e com a negativa formal do veículo apontado. A ausência de
  identificação na peça processual e a inexistência de investigado ligado ao veículo impedem qualquer
  atribuição.
