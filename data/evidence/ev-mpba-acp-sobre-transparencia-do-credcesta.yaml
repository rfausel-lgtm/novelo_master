id: ev-mpba-acp-sobre-transparencia-do-credcesta
kind: evidence
classification: D
proposition: Em 19/07/2021 o Ministério Público do Estado da Bahia ajuizou ação civil pública, pela promotora
  Joseane Suzart, pedindo que o Banco Máxima atuasse com transparência nos contratos vinculados ao Cartão
  de Crédito CredCesta, com regras claras de funcionamento, disponibilização de faturas e demonstrativos,
  e cancelamento imediato de cartões enviados sem solicitação prévia. É a primeira atuação de órgão de
  controle baiano sobre o produto localizada pela equipe — ainda que restrita à transparência ao consumidor,
  não à legalidade da privatização ou do contrato de exclusividade.
