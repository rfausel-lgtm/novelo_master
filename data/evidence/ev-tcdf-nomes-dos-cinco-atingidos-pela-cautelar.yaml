id: ev-tcdf-nomes-dos-cinco-atingidos-pela-cautelar
kind: evidence
classification: A
proposition: >-
  Segundo o Metrópoles (23/09/2026), o SBT News (23/09/2026) e o Congresso em Foco (24/09/2026), os cinco
  ex-integrantes da alta administração do BRB alcançados pela cautelar do TCDF são Paulo Henrique Costa
  (ex-presidente), Dario Oswaldo Garcia Júnior, Robério Cesar Bonfim Mangueira, Wily da Silva Leão e Marcelo
  Talarico (ex-presidente do Conselho de Administração); a nota oficial do TCDF não nomeia os atingidos.
attributed_to: Metrópoles (mesmos nomes no SBT News e no Congresso em Foco, sem origem declarada)
document_ids: []
source_ids:
