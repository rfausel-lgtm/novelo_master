- src-sbtnews-2026-09-23-tcdf-bloqueia-r-2-7-bi-de-ex-presidente-do-brb-e-mais-4
- src-congressoemfoco-2026-09-24-tc-df-determina-bloqueio-de-ate-r-2-7-bi-de-ex-dirigentes-do-brb
date: '2026-09-23'
notes: >-
  Classe A, não C: os três veículos listam os mesmos cinco nomes, na mesma ordem e com os mesmos cargos, e
  nenhum cita fonte; Poder360, Jornal de Brasília e Times Brasil atribuem a informação ao Metrópoles (primeira
  publicação, 23/09/2026, 17h33). A independência não está demonstrada e a decisão é sigilosa. Pode subir de
  classe se o extrato do DODF de 05/10/2026 (págs. 53-54), não aberto, nomear os atingidos.
