id: ev-info-brb-grupo-whatsapp-fabricacao-extrato
kind: evidence
classification: A
proposition: Segundo a decisão de 22/06/2026 na PET 15.478, Alberto Félix de Oliveira e Ângelo Antônio
  Ribeiro da Silva integravam um grupo de WhatsApp chamado "INFO-BRB", criado para suprir o BRB dos
  lastros documentais das carteiras do Master, e fabricaram, por determinação de Daniel Vorcaro, um
  extrato artificial da conta vinculada da Tirreno.
document_ids:
- doc-2026-06-22-decisao-pet15478-sigilo-tirreno-brb
source_ids:
- src-stf-pet15478-decisao-22-06-2026-sigilo-tirreno-brb
attributed_to: Autoridade policial, encampada pelo MPF e citada na decisão de André Mendonça
date: '2026-06-22'
notes: Nome próprio do grupo ("INFO-BRB") e cadeia de comando específica (Vorcaro determina, Ribeiro e
  Félix executam) inéditos no acervo até esta leitura — os perfis de ambos já cobriam seus cargos formais
  no Master (tesoureiro e diretor), mas não este episódio específico de fabricação documental nem o nome
  do grupo de WhatsApp.
