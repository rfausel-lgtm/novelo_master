proposition: 'Levantamento do ND Mais publicado em 14/09/2026 lista os maiores recebedores de honorários do Banco
  Master: Barci de Moraes com R$ 80,2 milhões; Monteiro, Rusu, Cameirão e Bercht com R$ 79 milhões; Warde com R$
  63,8 milhões; Gabino Kruschewsky com R$ 54 milhões; Alves Corrêa Verissimo Advocacia com cerca de R$ 32,9 milhões;
  Marcus Vinícius Furtado Coelho com R$ 27,5 milhões; e a Mytra Consultoria com R$ 30 milhões.'
