id: ev-toffoli-oitivas-do-inq5026-com-estrutura-do-stf
kind: evidence
classification: D
proposition: Em 20/01/2026, como relator do INQ 5.026, Dias Toffoli mandou a Secretaria Judiciária do STF
  reservar sala e disponibilizar servidores para as oitivas pedidas pela Polícia Federal, e enviar à PF o
  link de acesso das audiências.
document_ids:
