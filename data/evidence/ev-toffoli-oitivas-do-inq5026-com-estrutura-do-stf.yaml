date: '2026-01-20'
notes: O despacho não diz quem seriam os ouvidos nem as datas. Em 26/01/2026, outro despacho dele registra
  oitivas agendadas pela PF para 26 e 27/01/2026 e remete os pedidos de adiamento das defesas à própria
  autoridade policial, mencionando videoconferência disponível para os atos.
