id: ev-mecanismo-alegado-inflacao-capital-upcon
kind: evidence
classification: A
proposition: Segundo a denúncia do MPF, relatada pela imprensa, Tanure e Benevides teriam coordenado aporte
  superior a R$ 100 milhões no capital social da Upcon dias antes do laudo de avaliação que definiria
  a quantidade de ações da Gafisa entregues em pagamento pela aquisição, elevando o capital de R$ 10 milhões
  para R$ 160,8 milhões — com o excedente de ações recebido por Benevides repassado a Tanure com desconto.
  O MPF alega uso de offshores e do fundo Singular Plus para ocultar a real participação de Tanure, com
  Benevides tomando empréstimo formal da corretora Planner. Uma segunda reportagem cita valores distintos
  (aporte de R$ 150 milhões, inflação de ~1.400%) não reconciliados com os primeiros — possível diferença
  de momento ou métrica da operação, não esclarecida por nenhuma fonte.
