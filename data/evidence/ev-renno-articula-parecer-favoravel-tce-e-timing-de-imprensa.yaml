excerpt: Nao podemos deixar sair essa noticia agora
date: '2024-12-12'
notes: Mostra um mecanismo de gestão de imprensa mais sofisticado do que a simples tentativa de pressão sobre
  Kassab (lote 287/295) — envolve preparar reportagem favorável com documento oficial real (parecer do TCE-RJ),
  coordenar diretamente com repórter, e cronometrar a divulgação para não conflitar com operações financeiras
  em andamento.
