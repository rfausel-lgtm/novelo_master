id: ev-renno-articula-parecer-favoravel-tce-e-timing-de-imprensa
kind: evidence
classification: D
proposition: 'Em 12/12/2024, Luiz Rennó Netto enviou a Vorcaro um parecer do Ministério Público de Contas do
  TCE-RJ (sobre representação de 19/11/2024) favorável à legalidade dos aportes do Rioprevidência no Master
  ("cumpriu todos os critérios legais necessários para receber os recursos previdenciários"), e articulou
  diretamente com um repórter a pauta de divulgação dessa notícia — combinando os temas "Rioprev" e "Tce" —,
  mas aconselhou Vorcaro a não aparecer pessoalmente ("não tem que aparecer nisso"), para não desgastar sua
  imagem. No dia seguinte, Vorcaro pediu que a notícia não saísse naquele momento, mesmo sendo favorável,
  porque tinha "captacao grande pra semana": "Nao podemos deixar sair essa noticia agora" — o timing da
  divulgação era calculado para não coincidir com uma captação de recursos em andamento.'
