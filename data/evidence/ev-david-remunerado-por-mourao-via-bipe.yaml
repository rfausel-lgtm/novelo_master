date: '2026-05-13'
notes: 'Complementa a estrutura já registrada de repasse mensal de R$ 1 milhão de Vorcaro a Mourão: mostra o elo
  seguinte da cadeia, de Mourão ao líder do núcleo tecnológico, e a pessoa jurídica usada como veículo.'
