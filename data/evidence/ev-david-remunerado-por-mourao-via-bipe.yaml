id: ev-david-remunerado-por-mourao-via-bipe
kind: evidence
classification: D
proposition: Segundo a decisão de 13/05/2026 na PET 16.019, David Henrique Alves era remunerado mensalmente por
  Luiz Phillipi Mourão em cerca de R$ 35.000,00, com os recursos ingressando por meio da empresa BIPE Software Brasil
  Ltda., da qual ele seria proprietário exclusivo e sócio-administrador — arranjo que, segundo a Polícia Federal,
  conferia aparência empresarial formal ao financiamento do braço cibernético da organização.
