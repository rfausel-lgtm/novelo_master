id: ev-linha-investigativa-rondonia-vorcaro
kind: evidence
classification: A
proposition: 'Existe linha investigativa federal em Rondônia alcançando Daniel Vorcaro desde janeiro de
  2019 — nove meses antes do aval do Banco Central à transferência de controle do Máxima. Segundo documento
  protocolado na CPI do Crime Organizado, houve Pedido de Busca e Apreensão Criminal nº 0001530-26.2019.4.01.4101,
  de 23/01/2019, na Subseção Judiciária de Ji-Paraná (RO), no âmbito de apuração sobre desvio de recursos
  de regimes próprios de previdência, e três inquéritos sucessivos contra Vorcaro. Apuração posterior
  da equipe confirmou o essencial por fontes independentes — Vorcaro foi de fato alvo da Operação Fundo
  Fake e teve mandado de prisão expedido, nunca cumprido, com o inquérito trancado pelo TRF-1 em 2023
  — mas NÃO confirmou vários pontos específicos da peça da CPI, que é documento de parte protocolado por
  denunciante e não achado oficial. Em particular: (a) não se corroborou a alegação de repasses do Banco
  Máxima e do grupo Multipar à MAXX Consultoria em 2016, e cabe notar que o Máxima só passou ao controle
  de Vorcaro em outubro de 2019; (b) a alegada transferência de R$ 2 milhões da Milo Investimentos para
  Benjamim Botelho de Almeida em 31/10/2016 não foi corroborada, e a única fonte jornalística que trata
  do tema descreve o fluxo em sentido inverso — três transferências dos fundos à conta pessoal de Vorcaro,
  somando cerca de R$ 2 milhões, em 2017; (c) o recorte de R$ 7,7 milhões atribuído nominalmente a Vorcaro
  e Botelho no bloqueio não aparece em fonte independente; (d) a designação ''Fundo Fake 2'' é nomenclatura
  da peça, não da Polícia Federal — o que existe oficialmente em Ji-Paraná é a Operação Caixa de Minas,
  sobre o RPPS do município, sem menção pública a Vorcaro, ao Máxima ou à Foco DTVM.'
