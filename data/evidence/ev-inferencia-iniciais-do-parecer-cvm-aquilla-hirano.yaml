inference_basis: Correspondência entre a gestora 'A.A.M Ltda./atual AQ3 A.M. Ltda.' citada no parecer
  da CVM e a AQ3 Asset Management nomeada como gestora do Aquilla FII no Informe Anual do próprio fundo;
  e entre a narrativa sobre 'Y.F.H.' no parecer e os fatos atribuídos a Yan Felix Hirano no requerimento
  aprovado na CPI do Crime Organizado.
