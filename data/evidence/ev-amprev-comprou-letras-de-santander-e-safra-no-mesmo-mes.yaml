id: ev-amprev-comprou-letras-de-santander-e-safra-no-mesmo-mes
kind: evidence
classification: D
proposition: O mesmo demonstrativo de julho de 2024 mostra que a Amprev adquiriu, naquele mês, letras
  financeiras do Banco Santander (R$ 100.546.673,20, prazo de quatro anos) e do Banco Safra (R$ 100.467.170,76,
  prazo de quatro anos), além de já deter letras do BTG Pactual e do Bradesco. A afirmação policial de
  que o relator das propostas 'rejeitou ofertas de bancos de primeira linha como Santander, BTG Pactual
  e Safra' precisa portanto ser lida como recusa dentro daquela deliberação específica, e não como recusa
  geral desses emissores pela entidade.
