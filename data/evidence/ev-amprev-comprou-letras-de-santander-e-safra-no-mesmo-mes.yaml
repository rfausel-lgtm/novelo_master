id: ev-amprev-comprou-letras-de-santander-e-safra-no-mesmo-mes
kind: evidence
classification: D
proposition: 'A afirmação policial de que o relator das propostas ''rejeitou ofertas de bancos de primeira
  linha como Santander, BTG Pactual e Safra'' não se sustenta na ata da própria sessão: em 12/07/2024
  as cotações dos cinco emissores foram apresentadas lado a lado e o comitê aprovou, por unanimidade e
  na mesma deliberação, R$ 100 milhões em letras do BTG Pactual e R$ 200 milhões em letras do Master.
  O demonstrativo de julho de 2024 confirma a aquisição de letras do Santander e do Safra no mesmo mês.
  O que distingue o Master não é ter sido preferido com exclusão dos demais, mas ter recebido o dobro,
  no vértice mais longo e à taxa mais alta.'
