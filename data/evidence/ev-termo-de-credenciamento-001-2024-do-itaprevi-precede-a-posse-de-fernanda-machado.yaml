id: ev-termo-de-credenciamento-001-2024-do-itaprevi-precede-a-posse-de-fernanda-machado
kind: evidence
classification: D
proposition: O Termo de Análise e Atestado de Credenciamento nº 001/2024 do Banco Master no Itaprevi tem data
  de 16/01/2024; segundo o voto do Acórdão 26.458/2026 do TCE-RJ, Fernanda Pereira da Silva Machado foi
  nomeada presidente do Itaprevi em 12/06/2024. A comparação de datas não diz nada sobre a atuação dela no
  Rioprevidência.
