id: ev-jocildo-defesa-tecnica-em-ata-2025
kind: evidence
classification: D
proposition: Dois meses antes da liquidação do Banco Master, Jocildo Lemos sustentou perante o Conselho
  Estadual de Previdência que o banco 'não era problema quando contratamos', que não havia 'risco identificado'
  à época e que as letras pagaram bônus semestrais em janeiro e julho de 2025, o que demonstraria 'liquidez
  e adimplência'. Confirmou também que as letras têm vencimento em dez anos.
document_ids:
