id: ev-vorcaro-admite-agrado-disney-paulo-sergio
kind: evidence
classification: A
proposition: 'Em depoimento por videoconferência da Papuda, em 28/08/2026, Daniel Vorcaro admitiu ter
  oferecido a Paulo Sérgio Neves de Souza a viagem à Disney/Universal, classificando-a como cortesia:
  ''Ofereci como um agrado. Era um serviço que oferecia para muitas pessoas. Era uma coisa interessante''.
  A viagem, no início de 2024, foi organizada pela empresa SL Consulting, representada pelo empresário
  Léo Serrano. Vorcaro negou que qualquer servidor do Banco Central tivesse ''trabalhado'' para ele.'
