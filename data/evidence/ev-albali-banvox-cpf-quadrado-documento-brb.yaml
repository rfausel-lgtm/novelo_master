classification: A
proposition: 'Documento do próprio BRB (abril/2025), citado literalmente pela reportagem: ''O Albali FIM
  e a Banvox são detidos integralmente pelo sr. Maurício Antonio Quadrado, inscrito no CPF/MF [CPF],
  cuja declaração de imposto de renda referente ao ano calendário de 2023 encontra-se anexa.'' O Fundo
  Albali, controlado por Quadrado, tornou-se acionista do BRB (3.404.079,48 ações ordinárias + 8.136.937,40
  ações adicionais) via pagamento de R$ 100 milhões ao fundo Asterope e R$ 28,6 milhões em recursos próprios,
  em aumento de capital aprovado em 27/12/2024.'
