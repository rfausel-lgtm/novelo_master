notes: É o fundamento jurídico documental (D) para a abertura dos PADs contra Anderson Wander da Silva
  Lima e Valéria Vieira Pereira da Silva, noticiada em 26/06/2026 pelo ICL Notícias e hoje registrada no
  acervo apenas via imprensa (classificação A, `ev-corregedoria-pf-abre-pads`) — as duas evidências se
  complementam, uma documentando a autorização judicial e a outra a execução administrativa que dela
  resultou.
