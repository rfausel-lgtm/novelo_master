id: ev-pet15976-parametros-operacionais-busca-e-apreensao
kind: evidence
classification: D
proposition: 'Na decisão de 13/05/2026 (PET 15.976/DF), o ministro André Mendonça fixou parâmetros
  operacionais específicos para os mandados de busca e apreensão da 6ª fase da Operação Compliance Zero:
  autorização de apreensão de dinheiro em espécie acima de R$ 20.000,00 (ou equivalente em moeda
  estrangeira), joias, obras de arte, veículos e itens de luxo; exigência de acompanhamento de
  representante da OAB em buscas realizadas em escritórios de advocacia (art. 7º, §6º, Lei 8.906/1994);
  determinação de que os mandados fossem cumpridos "de forma serena, respeitosa e discreta, sem qualquer
  espetacularização"; e autorização expressa de compartilhamento de todo o material probatório colhido com
  a Corregedoria da Polícia Federal, para fins de sindicância/PAD contra os policiais federais envolvidos
  na organização.'
document_ids:
