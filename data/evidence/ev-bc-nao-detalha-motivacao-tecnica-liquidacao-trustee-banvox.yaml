id: ev-bc-nao-detalha-motivacao-tecnica-liquidacao-trustee-banvox
kind: evidence
classification: C
proposition: O Banco Central decretou, em 03/09/2026, a liquidação extrajudicial da Trustee e da Banvox
  citando apenas 'graves violações às normas legais que disciplinam as atividades das instituições' —
  nenhuma fonte disponível, entre as consultadas pela equipe, traz o ato normativo completo com motivação
  técnica detalhada. O ato foi assinado pelo diretor de Fiscalização, Ailton de Aquino, substituto do
  presidente Gabriel Galípolo, que estava em viagem a Basileia, Suíça. As duas distribuidoras representavam
  juntas menos de 0,001% do ativo total ajustado do Sistema Financeiro Nacional e 0,76% do volume de administração
  de recursos de terceiros. Com essa decretação, chegou a 17 o número de instituições liquidadas pelo
  BC em 2026 — o maior volume desde 2002 (24 instituições).
