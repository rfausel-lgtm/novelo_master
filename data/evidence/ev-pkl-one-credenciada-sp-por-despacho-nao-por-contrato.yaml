id: ev-pkl-one-credenciada-sp-por-despacho-nao-por-contrato
kind: evidence
classification: D
proposition: A entrada da operadora na folha estadual paulista se deu por despacho de deferimento do secretário
  da Fazenda, em 25/05/2022 — não por contrato nem por convênio, o que confirma documentalmente a versão
  sustentada pelo governo. O ato concede a espécie de consignação 270, Cartão de Benefício, e é publicado
  impessoalmente, sem nome de signatário. O código operacional 097337-4 foi informado em comunicado do
  mês seguinte. Entre o decreto e o credenciamento decorreram 55 dias.
