id: ev-nabas-contesta-autenticidade-do-moraes-pdf-e-caso-vai-a-corregedoria
kind: evidence
classification: D
proposition: 'A defesa de João Cláudio Nabas pediu, em 02/07/2026, perícia de informática e documentoscopia
  para contestar a autenticidade do arquivo "Moraes.pdf" — o mesmo documento que a PF atribui à origem do
  vazamento à jornalista Malu Gaspar. Em 21/08/2026, Mendonça deferiu o compartilhamento das provas do
  inquérito com a Corregedoria-Geral da Polícia Federal para apuração de infração disciplinar, com base em
  parecer da PGR que caracteriza a investigação como apuração de "possível violação de sigilo funcional
  imposto ao cargo de João Cláudio Nabas, que teria fornecido indevidamente informações resguardadas por
  sigilo a jornalista". Um ofício de 20/05/2026 da PF confirma que as buscas autorizadas em 18/05/2026 foram
  efetivamente cumpridas em 19/05/2026.'
