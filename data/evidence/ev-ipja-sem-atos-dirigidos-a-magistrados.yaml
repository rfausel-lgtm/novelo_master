id: ev-ipja-sem-atos-dirigidos-a-magistrados
kind: evidence
classification: D
proposition: 'Ressalva expressa do IPJ-A 3298613/2026 sobre o alcance do trabalho: as análises restringem-se
  aos dados brutos e elementos informacionais já existentes no acervo probatório da Operação Compliance
  Zero. A PF registra que ''não foram realizados quaisquer atos de aprofundamento investigativo direcionados
  a magistrados ou membros do Ministério Público'', tampouco diligências destinadas a apurar condutas
  que em tese configurem ilícito penal, limitando-se o documento à identificação e exposição objetiva
  dos elementos localizados. O laudo, portanto, não imputa crime a ninguém.'
