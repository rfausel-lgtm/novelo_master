notes: D demonstra apenas a existência e a ementa dos atos, vistas em boletim oficial de legislação; os textos
  não foram lidos. A Agência Brasil descreve a liquidação de Acqio e Octa como extensão da decretada para a
  Entrepay; o boletim mostra atos numerados separados, o que o registro anterior (doc do Ato 1.381) não
  distinguia.
