id: ev-atos-1382-e-1383-liquidacao-da-acqio-e-da-octa
kind: evidence
classification: D
proposition: O Banco Central editou, em 27/03/2026, os Atos do Presidente nº 1.382 e nº 1.383, que decretam a
  liquidação extrajudicial da Acqio Adquirência Instituição de Pagamento S.A. e da Octa Sociedade de Crédito
  Direto S.A., respectivamente, no mesmo dia do Ato nº 1.381 (Entrepay).
