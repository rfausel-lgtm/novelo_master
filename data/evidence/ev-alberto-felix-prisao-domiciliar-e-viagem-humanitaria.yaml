id: ev-alberto-felix-prisao-domiciliar-e-viagem-humanitaria
kind: evidence
classification: D
proposition: Em 30/04/2026, o STF autorizou Alberto Felix de Oliveira Neto — então em prisão domiciliar
  com monitoramento eletrônico e proibição de contato com investigados da Operação Compliance Zero (art.
  319, III, CPP) — a se deslocar excepcionalmente a Passos/MG entre 30/04 e 04/05/2026 para o velório e
  sepultamento do pai, Gerson Felix de Oliveira, com flexibilização temporária do monitoramento.
