notes: O perfil anterior registrava apenas a prisão em 18/11/2025 e o silêncio em depoimento de 26/01/2026,
  sem indicar que, por abril/2026, o regime já havia sido convertido para prisão domiciliar, nem o
  falecimento do pai.
