date: 2026-02-01
notes: Versão da empresa em comunicado, sem verificação independente neste registro. Não se conclui que a
  liquidação do Master causou a crise do grupo; o Congresso em Foco registra, ainda, bloqueio cautelar de R$
  150 milhões determinado pela Justiça paulista no fim de janeiro, por descumprimento de garantias de contrato
  de cartões, matéria não verificada aqui.
