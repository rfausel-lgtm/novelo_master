id: ev-fictor-atribui-sua-crise-de-liquidez-a-liquidacao-do-master
kind: evidence
classification: A
proposition: Segundo o próprio Grupo Fictor, a reputação do grupo foi atingida por especulações do mercado
  após a liquidação do Banco Master, o que comprometeu a liquidez da Fictor Holding e da Fictor Invest e
  motivou o pedido de recuperação judicial.
