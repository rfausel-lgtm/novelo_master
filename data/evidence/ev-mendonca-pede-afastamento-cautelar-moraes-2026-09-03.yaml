id: ev-mendonca-pede-afastamento-cautelar-moraes-2026-09-03
kind: evidence
classification: A
proposition: Na noite de 03/09/2026, André Mendonça pediu verbalmente a Edson Fachin o afastamento cautelar
  imediato de Alexandre de Moraes do STF, com petição formal em preparação para submeter o pedido posteriormente
  à confirmação do Plenário. É ação distinta do procedimento de cinco dias úteis aberto por Fachin no
  mesmo dia. Até a data desta atualização, não há registro público de que Fachin tenha decidido sobre
  o pedido.
