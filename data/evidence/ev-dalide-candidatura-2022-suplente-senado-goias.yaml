id: ev-dalide-candidatura-2022-suplente-senado-goias
kind: evidence
classification: D
proposition: Em 2022, Dalide Barbosa Alves Corrêa foi 1ª suplente na candidatura de João Campos de Araújo ao Senado
  por Goiás, pelo Republicanos, com o registro de candidatura considerado apto; não foi eleita. Segundo o TSE, a
  chapa tinha registrado antes dela dois outros suplentes, ambos com candidatura indeferida, o que indica que ela
  entrou por substituição.
