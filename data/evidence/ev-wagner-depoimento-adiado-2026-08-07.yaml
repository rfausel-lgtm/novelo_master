proposition: 'O depoimento de Jaques Wagner à PF, marcado para 07/08/2026, foi adiado a pedido da própria
  defesa, que alegou não ter tido acesso pleno ao conteúdo da investigação por problemas técnicos. Segundo
  o advogado Pablo Domingues: ''O pedido de adiamento decorre exclusivamente do fato de que o acesso ao
  conteúdo da investigação ainda não foi disponibilizado à defesa por problemas técnicos''. Nenhuma nova
  data havia sido remarcada até a data desta atualização; não há denúncia do MPF nem indiciamento formal
  contra Wagner.'
