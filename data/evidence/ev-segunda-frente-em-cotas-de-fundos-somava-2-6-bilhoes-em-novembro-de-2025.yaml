id: ev-segunda-frente-em-cotas-de-fundos-somava-2-6-bilhoes-em-novembro-de-2025
kind: evidence
classification: D
proposition: A partir de dezembro de 2024, mesmo após alertas do TCE-RJ, o Rioprevidência abriu uma segunda frente
  de aportes em cotas de fundos de investimento administrados pelo grupo Master — os fundos Arena, Revolution e
  Texas, mais três letras financeiras adicionais —, que a auditoria do TCE somava, em 25/11/2025, a R$ 2,6 bilhões
  de exposição total ao banco.
