id: ev-fachin-centraliza-na-presidencia-toda-apuracao-contra-ministros
kind: evidence
classification: D
proposition: O item de maior alcance da decisão de 09/09 passou quase despercebido na cobertura. Além
  de suspender os atos de Mendonça e de Dino, o dispositivo determina 'a suspensão de todo e qualquer
  procedimento que verse sobre potencial investigação em face de integrantes deste Supremo Tribunal Federal,
  os quais devem ser preliminarmente remetidos a esta Presidência'. Na prática, toda apuração contra ministros
  passa a depender de triagem prévia da Presidência. A mesma decisão suspende o procedimento de controle
  externo da atividade policial que a Procuradoria-Geral da República instaurara para apurar eventual
  interferência na produção do relatório, e reserva à Presidência 'poder de cautela e de supervisão da
  regularidade da tramitação de feitos, ainda que já distribuídos'.
