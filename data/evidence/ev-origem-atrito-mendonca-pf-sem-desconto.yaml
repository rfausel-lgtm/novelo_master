id: ev-origem-atrito-mendonca-pf-sem-desconto
kind: evidence
classification: A
proposition: O atrito entre Mendonça e a cúpula da PF teve origem em fevereiro de 2026, quando o ministro
  restringiu o acesso aos dados da Compliance Zero a policiais diretamente envolvidos; escalou com determinações
  na condução da Sem Desconto — remessa imediata de documentação ao gabinete do relator, notificação prévia
  para troca de policiais na equipe, e envio de extrações de dados brutos ao STF durante o inquérito em
  curso. A PF recorreu à AGU, que optou por buscar diálogo em vez de embate jurídico direto. O atrito
  seguia sem resolução até setembro de 2026.
