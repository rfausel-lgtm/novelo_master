id: ev-vazamento-de-dados-de-cpmi-do-inss-expos-parceiras-de-investigado
kind: evidence
classification: D
proposition: Segundo o voto de Gilmar Mendes, dados obtidos por quebra de sigilo e compartilhados com a CPMI do
  INSS, sob custódia da Presidência do Senado, vazaram poucas horas depois do compartilhamento, expondo à imprensa
  dados pessoais e conversas íntimas de mulheres com quem um dos investigados mantinha relações afetivas — pessoas
  sem qualquer relação com a investigação.
