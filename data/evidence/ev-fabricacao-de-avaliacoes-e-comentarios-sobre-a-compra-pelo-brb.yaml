id: ev-fabricacao-de-avaliacoes-e-comentarios-sobre-a-compra-pelo-brb
kind: evidence
classification: D
proposition: 'A análise do celular de Daniel Vorcaro identificou estrutura organizada para manipular
  avaliações públicas e fabricar comentários positivos sobre as empresas sob seu controle — orientações
  para elevar notas de aplicativos, inserir avaliações favoráveis e produzir interações artificiais, além
  de comentários elogiosos em redes sociais para ampliar narrativas favoráveis e neutralizar críticas.
  A prática foi aplicada ao próprio negócio que está no centro do caso: diante de reportagens sobre a
  tentativa de aquisição do Banco Master pelo BRB, Vorcaro determinou a publicação imediata de múltiplos
  comentários para transmitir a impressão de que a operação havia sido bem-sucedida, chegando a
  especificar o teor desejado; Mourão respondeu "Já estão subindo" e enviou captura de tela dos
  comentários publicados. Em 28/05/2025, Vorcaro pediu especificamente comentários positivos em matéria
  do portal Metrópoles sobre a negociação.'
document_ids:
