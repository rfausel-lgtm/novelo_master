excerpt: Já estão subindo
date: '2025-05-28'
notes: 'Distingue-se do que o acervo já registrava sobre pagamento a influenciadores: aqui não se trata
  de contratar quem assine o conteúdo, e sim de simular reação espontânea de público — avaliação de
  aplicativo e comentário de leitor. O alvo não é reputação difusa, mas a percepção sobre a compra do
  Master pelo BRB, operação que é o núcleo da investigação. O documento descreve as conversas e remete a
  capturas de tela que não são recuperáveis do texto extraído; os veículos cujas seções de comentários
  foram usadas não são parte no episódio.'
