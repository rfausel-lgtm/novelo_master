id: ev-discrepancia-nao-explicada-entre-3-bilhoes-da-pf-e-3-7-da-pgr
kind: evidence
classification: I
proposition: A diferença de R$ 700 milhões entre a estimativa de 'cerca de R$ 3 bilhões' da própria Polícia Federal
  e a estimativa de R$ 3,7 bilhões da PGR, ambas de 26/05/2026, mais provavelmente decorre de a PGR incluir juros
  e correção monetária acumulados sobre o núcleo de R$ 970 milhões já reconhecidos por decisão judicial, ou projeções
  de perda que a conta da PF não soma ao principal aplicado.
document_ids:
- doc-2026-09-10-reconciliacao-dos-numeros-do-rioprevidencia-no-master
inference_basis: 'As duas estimativas foram divulgadas no mesmo dia, pelas mesmas duas frentes da mesma operação,
  o que afasta a hipótese de escopo temporal distinto. As explicações mais simples e metodologicamente plausíveis
  para uma diferença de 23% entre duas contagens do mesmo objeto, no mesmo dia, são a inclusão de acessórios financeiros
  (juros, correção) ou de perdas projetadas por uma das partes e não pela outra — ambos elementos que naturalmente
  divergem entre um levantamento investigativo (PF, que tende a somar apenas o principal aplicado) e uma peça acusatória
  (PGR, que tende a somar o prejuízo estimado). A inferência é fraca: nenhuma das duas instituições publicou a metodologia
  do cálculo, e a equipe não obteve a representação original da PGR na PET 15676 para verificar a composição do
  valor.'
date: '2026-09-10'
notes: 'Fica expresso o que não se sabe: se a diferença decorre de método de cálculo, de dado adicional que uma
  das partes teria e a outra não, ou de imprecisão editorial de uma das coberturas.'
