id: ev-pf-no-celular-de-andre-maia-a-tirreno-so-aparece-em-abril-de-2025
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, a primeira menção à Tirreno no celular de André Seixas Maia, apresentado como
  responsável pela empresa, é de 04/04/2025 — um texto que parecia a prévia de uma apresentação do que viria a ser a
  Tirreno —, o que contraria os documentos de formalização datados de 02/12/2024 e, somado ao registro na Junta
  Comercial só em 15/04/2025, leva a PF a considerar que a empresa foi constituída em abril de 2025 com data
  retroativa, para dar lastro a transações já feitas entre o BRB e o Master.
