attributed_to: Polícia Federal, no RAPJ nº 21161.01/2026 (análise do celular de André Seixas Maia), juntado ao INQ 5.026
date: '2025-04-04'
notes: 'Converge com a análise do celular de Vorcaro, em que a Tirreno só aparece em maio de 2025 (ver
  ev-pf-documentos-da-tirreno-produzidos-sob-demanda-em-maio-de-2025), e com a ata antedatada já registrada (ver
  ev-tirreno-ata-antedatada-peretto-seixas-maia). A IPJ-A nº 1252786/2026, citando este relatório, acrescenta que em
  05/05/2025 Maia disse a um contato pessoal que estava no banco assinando contratos de um negócio que lhe dava "frio
  na espinha", no mesmo dia em que o advogado Daniel Lopes Monteiro avisava Vorcaro que colhia as assinaturas dos
  contratos da Tirreno. Hipótese investigativa, sem denúncia.'
