id: ev-mansur-alega-vorcaro-dono-real-jaguar-cayman
kind: evidence
classification: A
proposition: Segundo a proposta de delação de João Carlos Mansur, o Jaguar Multimarket Fund Ltd. (Ilhas
  Cayman), que recebeu R$ 494 milhões do Banco Master e tem Benjamim Botelho de Almeida como beneficiário
  formal, teria Daniel Vorcaro como 'verdadeiro dono' — alegação do próprio delator, parte interessada
  em barganhar benefícios processuais, sem corroboração documental independente localizada pela equipe.
  Possível, mas não confirmada, sobreposição com o fundo 'Jaguar Investments' já mapeado no corpus (mesmo
  beneficiário formal, Botelho, na condenação da CVM sobre o Brazil Realty FII) — nenhum documento localizado
  une as duas menções numa só entidade.
