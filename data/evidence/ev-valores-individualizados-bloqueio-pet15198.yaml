id: ev-valores-individualizados-bloqueio-pet15198
kind: evidence
classification: D
proposition: A manifestação da PGR de 05/01/2026 individualiza, em nota de rodapé, os valores de bloqueio
  de bens dentro do teto de R$ 5.775.234.097,25 fixado na decisão de 06/01/2026 — Daniel Bueno Vorcaro e o
  Banco Master, R$ 3.281.486.463,31 cada; Antônio Augusto Conte, César Reginato Ligeiro, Vicente Conte Neto
  e Ricardo Batista De Siqueira Xavier, R$ 1.012.025.000,00 cada.
document_ids:
- doc-2026-01-05-manifestacao-pgr-representacao-pet15198
source_ids:
