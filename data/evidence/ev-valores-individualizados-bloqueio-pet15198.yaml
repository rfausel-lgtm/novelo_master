date: '2026-01-05'
notes: Granularidade ausente dos registros já publicados sobre a decisão de 06/01/2026, que traziam apenas
  o teto agregado. Não há, nas peças lidas, explicação de por que exatamente estas quatro pessoas físicas
  (além de Vorcaro e do próprio banco) receberam valor individualizado de bloqueio acima de R$ 1 bilhão —
  registrado como fato processual, sem inferência sobre o motivo.
