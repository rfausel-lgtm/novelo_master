attributed_to: orquestrador (verificação própria)
date: '2026-09-19'
notes: A ausência do nome no cadastro não prova que nenhuma cessão de cotas minoritária ou não registrada
  tenha ocorrido — só que o quadro societário formal, disponível publicamente, não a reflete. O termo de
  dação já registrava, no próprio texto, que a transferência ficava condicionada à conclusão dos serviços
  jurídicos e vedava alienação sem autorização prévia — o que é consistente com, mas não prova, a
  ausência de registro.
