id: ev-fraction024-qsa-nao-reflete-dacao-barci-de-moraes
kind: evidence
classification: A
proposition: 'Consulta direta ao Cadastro Nacional da Pessoa Jurídica, em 19/09/2026, mostra que o quadro
  de sócios da Fraction 024 Administração de Bem Próprio S.A. (CNPJ 41.934.366/0001-15) — a empresa
  proprietária do jato Legacy 650, cujas cotas de 33,33% o termo de dação em pagamento de 19/05/2025
  previa transferir ao escritório Barci de Moraes — segue registrando os mesmos dois sócios desde a
  constituição da empresa, em 13/05/2021: Marcus Vinícius da Mata (presidente) e Artur Martins de
  Figueiredo (diretor). Viviane Barci de Moraes e o escritório Barci de Moraes Sociedade de Advogados não
  constam em nenhuma data.'
document_ids: []
source_ids:
