id: ev-contrato-de-honorarios-do-master-com-o-escritorio-de-camilla-ramos-existe
kind: evidence
classification: C
proposition: >-
  Existe contrato de honorários entre o Banco Master e o escritório Queiroga, Vieira, Queiroz & Ramos Advocacia
  (do qual a advogada Camilla Ramos é sócia, segundo a Agência Brasil e o Times Brasil), com honorários de êxito
  de 5% líquidos sobre o que o banco recebesse em 12 ações do setor sucroalcooleiro, segundo o Metrópoles e a
  CNN Brasil, que dizem ter obtido o documento; o escritório declarou, em nota de 23/09/2026, ter contrato
  formal com o Master para atuar em processos de precatórios, com taxa de êxito de 5%.
