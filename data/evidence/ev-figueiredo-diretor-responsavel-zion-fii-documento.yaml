id: ev-figueiredo-diretor-responsavel-zion-fii-documento
kind: evidence
classification: D
proposition: Documento regulatório da B3/Fundos.NET (id 472804, 01/06/2023) designa Artur Martins de Figueiredo,
  CPF 073.813.338-80, como 'Diretor Responsável' do fundo imobiliário Zion Capital Real Estate Investment
  Fund (FII), sob gestão da Planner Trustee DTVM. Esse CPF parcial, consistente em três fontes distintas
  (ConsultaSocio, Escavador e este documento oficial), ancora a identidade da mesma pessoa em Trustee,
  Banvox e neste fundo — descartando homônimos (há ao menos um profissional de hotelaria/turismo de mesmo
  nome, sem qualquer relação com o caso).
