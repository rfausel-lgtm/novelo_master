id: ev-sp-inciso-que-abriu-a-porta-foi-o-fundamento-da-suspensao
kind: evidence
classification: D
proposition: O arco normativo paulista se fecha sobre si mesmo. O Estado suspendeu o código de desconto
  da PKL One com efeitos a partir de 19/02/2026 invocando o descumprimento do art. 6º, inciso IX, do decreto
  de consignações — exatamente o inciso criado em 2022 para acolher empresas administradoras de cartões.
  A exigência de convênio com instituição financeira autorizada pelo Banco Central, que fora a porta de
  entrada, tornou-se o fundamento da saída depois da liquidação extrajudicial do Banco Master.
