id: ev-agu-pediu-suspensao-fachin-antes-decisao-dino
kind: evidence
classification: A
proposition: Um dia antes da decisão de Dino, em 08/09/2026, a AGU (Jorge Messias) já havia pedido ao
  presidente do STF, Edson Fachin, a suspensão da decisão de Mendonça que afastou Andrei Rodrigues — por
  via processual distinta (endereçada à Presidência da Corte, não à relatoria de Dino), com fundamento
  na prerrogativa constitucional exclusiva do Presidente da República para prover e demitir o cargo de
  Diretor-Geral da PF. Reportado por fonte única até o momento; tratado como classe A até corroboração
  por segunda fonte independente.
