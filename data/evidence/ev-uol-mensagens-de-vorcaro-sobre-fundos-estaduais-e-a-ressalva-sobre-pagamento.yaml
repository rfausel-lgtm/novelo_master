id: ev-uol-mensagens-de-vorcaro-sobre-fundos-estaduais-e-a-ressalva-sobre-pagamento
kind: evidence
classification: A
proposition: >-
  Segundo o UOL (16/10/2026), mensagens extraídas pela PF do celular de Daniel Vorcaro, citadas de novembro
  de 2023 a julho de 2025, registram contatos de Antônio Rueda e de ACM Neto com Vorcaro e com o diretor
  comercial do Master, Fernando Mascarenhas, em torno da captação de recursos de institutos de previdência de
  servidores; o próprio UOL ressalva que as mensagens não mostram pagamento de comissão diretamente aos dois
  dirigentes do União Brasil.
attributed_to: UOL (Fabio Serapião, Natália Portinari e Cézar Feitoza)
document_ids: []
source_ids:
- src-uol-2026-10-16-mensagens-mostram-como-rueda-e-acm-levaram-o-master-a-fundos-de-previdencia
excerpt: As mensagens, porém, não mostram pagamento de comissão diretamente aos dois dirigentes do União Brasil.
date: '2026-10-16'
notes: >-
  Uma só apuração; as republicações do mesmo dia (Bahia Notícias, Revista Fórum, Goiás 246, Brasil 247, NC
  News) não corroboram. O UOL não informa a Pet, o relatório ou a decisão de origem, e o Novelo não localizou
  documento oficial. Mensagem que exista no aparelho periciado prova que está lá, não que o conteúdo seja
  verdadeiro. A comissão de 10% atribuída a Rueda e ACM Neto continua sendo alegação da terceira proposta de
  colaboração de Vorcaro (ev-vorcaro-atribui-a-acm-neto-e-rueda-comissao-de-10-por-cento), rejeitada pela PF e
  pela PGR segundo o UOL; esta evidência não a promove. Segundo o UOL, a PF pediu buscas em endereços ligados
  aos dois com base no material e a operação não chegou a ser autorizada pelo STF; o Novelo não localizou a
  decisão.
review_status: published
