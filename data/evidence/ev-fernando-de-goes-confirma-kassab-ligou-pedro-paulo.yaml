id: ev-fernando-de-goes-confirma-kassab-ligou-pedro-paulo
kind: evidence
classification: D
proposition: 'No mesmo dia em que Vorcaro pediu a Augusto Lima que acionasse Kassab (01/10/2024), também
  pediu a Fernando de Goes: "Pedi o nando pra ajudar e tentar falar com o kassab". Goes respondeu tê-lo
  pressionado ("Dei uma porrada grande aqui em kassab") e, em seguida, confirmou internamente à equipe de
  Vorcaro que Kassab de fato telefonara ao deputado Pedro Paulo Carvalho, presidente do PSD-RJ: "FERNANDO
  informa que KASSAB ligou para PEDRO PAULO". Relatou o teor da ligação atribuindo a Kassab uma queixa sobre
  o Dep. Luiz Paulo ("o cara não ouve ninguém, xiita") e afirma ter contestado essa caracterização junto a
  eles ("falei com ele que era tudo inverdade o q estava falando").'
