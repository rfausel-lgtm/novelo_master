excerpt: FERNANDO informa que KASSAB ligou para PEDRO PAULO
date: '2024-10-01'
notes: 'Diferente da versão já publicada (Kassab, por assessoria, dizendo à imprensa que conversou com Pedro
  Paulo para entender o tema) — aqui é a própria equipe de Vorcaro confirmando internamente, em tempo real,
  que a ligação ocorreu, o que eleva a confiabilidade do fato de "declaração pública posterior" para
  "confirmação contemporânea por fonte interna". CORREÇÃO (13/09/2026): a menção a "neto" na mesma conversa
  é identificada — trata-se de Luiz Rennó Netto, advogado de confiança de Vorcaro (ver verbete próprio). Sobre
  a suposta "segunda matéria" da qual Vorcaro teria "tirado o nome do banco": o próprio relatório da PF
  registra que a única notícia mencionada, a do site "expresso222.com.br", não foi encontrada pela perícia —
  a retirada do ar é alegação do próprio Vorcaro, não fato confirmado de forma independente. Não está
  definitivamente esclarecido se a "segunda matéria" citada nesta conversa é a mesma do expresso222 ou uma
  peça distinta ainda não identificada.'
