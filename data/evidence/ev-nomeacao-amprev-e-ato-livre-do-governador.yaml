id: ev-nomeacao-amprev-e-ato-livre-do-governador
kind: evidence
classification: D
proposition: Pela Lei estadual nº 0915/2005, art. 101, §2º, os membros da Diretoria Executiva da Amprev
  são nomeados livremente pelo governador do Estado, exigida apenas formação superior em área jurídica,
  econômica, contábil ou administrativa. Não há lista tríplice, sabatina, mandato fixo nem aprovação de
  conselho — de modo que nenhum parlamentar tem atribuição legal no processo.
document_ids:
- doc-2005-08-18-lei-0915-natureza-e-nomeacao-amprev
source_ids:
- src-amprev-lei-0915-2005-consolidada
excerpt: § 2º Os membros da Diretoria Executiva serão nomeados livremente pelo Governador do Estado, entre
  cidadãos que tenham formação superior na área jurídica, econômica, contábil ou administrativa.
