id: ev-pkl-one-notifica-extincao-uso-credcesta
kind: evidence
classification: D
proposition: 'Em 18/09/2025, a PKL One Participações notificou o Banco Master (carta a Luiz Bull) de que,
  a partir daquela data, o Master não poderia mais "averbar" produtos da marca Credcesta sem autorização
  prévia, referenciando o Contrato de Licenciamento de 1º/8/2018. Em 02/10/2025, formalizou a extinção do
  direito de uso da marca, por notificação assinada digitalmente por Andrea Lima Novaes.'
