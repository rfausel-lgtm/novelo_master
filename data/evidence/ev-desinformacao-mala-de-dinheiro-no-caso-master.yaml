id: ev-desinformacao-mala-de-dinheiro-no-caso-master
kind: evidence
classification: C
proposition: 'Circulou em rede social, com imagens manipuladas e alcance de milhares de reações, a alegação
  de que a Polícia Federal teria encontrado mala de dinheiro com o presidente da República em operação
  do caso Master. É falsa: nenhuma operação do caso teve o presidente como alvo. O registro fica no corpus
  como inoculação — o tema é objeto recorrente de fabricação.'
