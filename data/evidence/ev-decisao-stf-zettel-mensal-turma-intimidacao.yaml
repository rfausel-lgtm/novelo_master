id: ev-decisao-stf-zettel-mensal-turma-intimidacao
kind: evidence
classification: D
proposition: 'Segundo a decisão da PET 15.556 (§§ 26 e 34-36), Fabiano Zettel ''atuava na operacionalização
  de pagamentos destinados ao grupo informal conhecido como A Turma'' — estrutura descrita pela decisão
  como destinada a ''monitoramento e coleta de informações'' e à ''prática de atos de coação e intimidação
  de pessoas (dentre as quais, concorrentes empresariais, ex-empregados e jornalistas) que seriam vistas
  por VORCARO como capazes de prejudicar a organização criminosa''. O texto registra ''fortes indícios
  de que FELIPE MOURÃO recebia um milhão por mês de VORCARO por intermédio de FABIANO ZETTEL''. Em mensagem
  transcrita, Mourão detalha a divisão: ''Ele manda o mensal e eu divido entre a turma. Mando pra eles.
  400 divido entre 6. Os meninos mando 75 pra cada, o meu. O DCM e mais dois editores. É este o mensal.''
  A transferência de R$ 1 milhão era operada por Ana Cláudia, funcionária de Vorcaro, para conta da King
  Empreendimentos Imobiliários e Participações.'
