id: ev-stf-avocou-o-inquerito-paulista-do-contrato-de-wifi
kind: evidence
classification: D
proposition: No dispositivo, o ministro avocou ao Supremo Tribunal Federal o inquérito policial e a cautelar de
  busca e apreensão que tramitavam na Vara Estadual das Garantias de Organizações Criminosas e Lavagem de Bens do
  Foro Central Criminal da Barra Funda, em São Paulo, determinando a remessa integral dos feitos em 48 horas e acesso
  por tempo indeterminado à Polícia Federal e à Procuradoria-Geral da República.
document_ids:
- doc-2026-09-03-decisao-dino-pet16669-operacao-make-up
locator: p. 139 (item III.A) e p. 110-115
date: '2026-09-03'
notes: É a unificação, sob o Supremo, da frente paulista do contrato de wi-fi com a frente federal das emendas —
  as duas que o acervo vinha registrando em separado. O fundamento invocado é a conexão probatória do art. 76 do
  Código de Processo Penal e a prerrogativa de foro do parlamentar.
