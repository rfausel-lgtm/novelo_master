proposition: 'Thiago Miranda admitiu publicamente a intermediação do investimento de Daniel Vorcaro no
  filme ''Dark Horse'': ''Sim! Eu fiz exatamente isso. Intermediei o investimento.'' As mensagens apreendidas
  mostram sua atuação continuada na cobrança das parcelas — em 22/09/2025, horas depois de Flávio Bolsonaro
  cobrar valores atrasados, Miranda pergunta a Vorcaro ''Consegue liberar as parcelas do filme?'', e recebe
  ''Sim. Liberei mais uma hoje''. Há, porém, contradição frontal sobre o encontro entre o senador e o
  banqueiro: mensagens de 08/12/2024 registram Miranda confirmando a Vorcaro reunião para ''quarta-feira
  às 17h30 na sua casa de Brasília'' — o que corresponde a 11/12/2024 —, dizendo que o senador queria
  tratar do ''filme do presidente'' e que ''Flávio está ciente de tudo''; Miranda afirma que a reunião
  não chegou a acontecer. A contradição fica registrada sem resolução. Registro adicional: a produtora
  do filme desmentiu Flávio Bolsonaro e negou ter recebido dinheiro de Vorcaro. Não foi localizada manifestação
  específica do senador ou de sua assessoria sobre a participação de Miranda.'
