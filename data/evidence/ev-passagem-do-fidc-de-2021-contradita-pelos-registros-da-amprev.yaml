id: ev-passagem-do-fidc-de-2021-contradita-pelos-registros-da-amprev
kind: evidence
classification: D
proposition: 'A passagem da decisão judicial que descreve deliberações de setembro de 2021 sobre cotas
  de FIDC Multisetorial é contraditada pelos registros públicos da própria Amprev em pontos independentes:
  não houve reunião do Comitê de Investimentos em 14/09/2021 — as extraordinárias de setembro foram em
  06 e 23, e as ordinárias em 24 e 28; nenhum fundo de direitos creditórios consta da carteira em setembro
  de 2021, nem em qualquer mês daquele ano; a Política de Investimentos de 2021 registra alocação de 0,00%
  no segmento; nenhuma das atas do comitê de 2021 com camada de texto menciona FIDC, multisetorial ou
  direitos creditórios; e nenhum dos três investigados integrava o colegiado em 2021 — Jocildo Lemos só
  foi nomeado em 02/01/2023. O corpus registra a existência da passagem, mas não a toma como prova de
  que os fatos nela descritos ocorreram.'
