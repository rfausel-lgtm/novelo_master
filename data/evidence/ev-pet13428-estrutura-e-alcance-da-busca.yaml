date: '2026-09-05'
notes: 'A decisão registra que, à época dos diálogos, Fialek "ocupava função na Câmara dos Deputados, sendo
  apontada nos autos como uma das responsáveis pela elaboração das indicações da Comissão de Integração e pela
  coordenação da destinação de emendas parlamentares". O episódio do encontro de 14/03/2025 entre Vorcaro e um
  ministro, citado pela PF no mesmo pedido, é expressamente ressalvado na representação (par. 39) como vindo de
  fontes abertas, "demanda[ndo] confirmação documental", e usado só como reforço argumentativo — não como
  fundamento da medida.'
