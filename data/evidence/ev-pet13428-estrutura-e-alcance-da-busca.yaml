id: ev-pet13428-estrutura-e-alcance-da-busca
kind: evidence
classification: D
proposition: 'Na decisão de 05/09/2026 na Pet 13.428/DF (cumprida em 14/09), o Min. Flávio Dino transcreve a
  representação da PF segundo a qual a perícia do celular de Mariângela Fialek, apreendido em 12/12/2025 na
  Operação Transparência, revela "atuação articulada e continuada de três pessoas com papéis complementares":
  Fialek, que "capta e formaliza as causas e elabora os memoriais"; Valéria Rodrigues Linhares, advogada e
  esposa do deputado, que "redige, revisa e assina os instrumentos de honorários e de cessão de crédito"; e o
  deputado Cezinha de Madureira, "a quem cabe o suposto contato pessoal e direto com Ministros de Tribunais
  Superiores". A decisão defere busca e apreensão contra o deputado e a sociedade de advocacia de Valéria,
  avoca ao STF os procedimentos sobre os R$ 510 mil apreendidos em Congonhas em 25/08/2026 e indefere a busca
  no gabinete parlamentar, por não reunir as "fundadas razões" exigidas pelo Código de Processo Penal.'
