id: ev-defesa-vorcaro-2026-11-02-alega-demora-na-apreciacao-do-pedido-de-liberdade-de-18-09-e-falta-de-revisao-de-90-dias
kind: evidence
classification: D
status: unverified
proposition: Segundo a nota da defesa de Daniel Vorcaro, o pedido de liberdade apresentado em 18/09/2026
  continua sem decisão e a revisão da prisão preventiva a cada 90 dias não foi feita. É alegação da defesa; a
  decisão do Presidente do STF de 29/10/2026 atribuiu à Presidência, no período, as questões urgentes, em
  especial a revisão periódica da necessidade de prisões preventivas, e não foi localizada manifestação do STF
  sobre o pedido de 18/09.
