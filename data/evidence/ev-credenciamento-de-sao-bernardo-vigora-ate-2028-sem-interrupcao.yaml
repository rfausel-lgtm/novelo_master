id: ev-credenciamento-de-sao-bernardo-vigora-ate-2028-sem-interrupcao
kind: evidence
classification: D
proposition: 'É o credenciamento municipal paulista de maior alcance temporal localizado: assinado em
  14/12/2023, com sessenta meses de vigência, o que o projeta até dezembro de 2028, e sem nenhum ato que
  o tenha interrompido. A extração integral da edição do diário municipal confirma que a expressão aparece
  uma única vez em suas 431 páginas. O Banco Master também consta credenciado no mesmo município, por
  chamamento anterior, com termo assinado em abril de 2023 e igual prazo.'
