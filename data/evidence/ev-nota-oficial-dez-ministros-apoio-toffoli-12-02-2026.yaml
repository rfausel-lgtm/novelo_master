id: ev-nota-oficial-dez-ministros-apoio-toffoli-12-02-2026
kind: evidence
classification: C
proposition: Em 12/02/2026 os dez ministros do STF então em exercício (Fachin, Moraes, Gilmar Mendes, Cármen
  Lúcia, Toffoli, Fux, André Mendonça, Nunes Marques, Zanin e Dino) divulgaram nota oficial reconhecendo "a
  plena validade dos atos praticados pelo Ministro Dias Toffoli na relatoria da Reclamação n. 88.121" e
  expressando "apoio pessoal" a ele; a Presidência do STF, "ouvidos todos os Ministros", acolheu no mesmo ato a
  comunicação de Toffoli sobre o envio dos autos para redistribuição, que coube a André Mendonça.
