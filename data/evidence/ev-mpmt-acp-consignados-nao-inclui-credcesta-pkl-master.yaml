id: ev-mpmt-acp-consignados-nao-inclui-credcesta-pkl-master
kind: evidence
classification: D
proposition: 'O aparato repressivo estadual de Mato Grosso mira outro grupo. A ação civil pública do Ministério
  Público estadual, ajuizada em 14/10/2025 contra o que descreve como ''uma estrutura montada para enganar
  o servidor'', tem seis rés — nenhuma delas o CredCesta, a PKL One ou o Banco Master. O registro é necessário
  para não somar ao caso Master o que pertence a caso distinto: em Mato Grosso, o CredCesta entra por
  uma porta só, a do credenciamento de maio de 2023 e do inquérito que dele decorre no Superior Tribunal
  de Justiça.'
