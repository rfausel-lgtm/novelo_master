attributed_to: Polícia Federal, na IPJ nº 1039533/2026 (análise preliminar do celular de Paulo Henrique Costa), juntada ao INQ 5.026
date: '2025-09-06'
notes: 'A mensagem é do mês em que o Banco Central rejeitou a compra do Master pelo BRB (ver
  evt-2025-09-bc-rejeita-compra-master-pelo-brb), e o Master seria liquidado em 18/11/2025. A PF a descreve como
  "engenharia negocial ligada ao Master/BRB" e não detalha qual seria a solução. Foi enviada numa conversa privada,
  cujo interlocutor não é identificado aqui. Hipótese investigativa.'
