id: ev-pf-paulo-henrique-costa-buscou-solucao-para-o-master-que-nao-dependesse-do-bacen
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, em mensagem de 06/09/2025 Paulo Henrique Costa, então presidente do BRB,
  escreveu que estava "pensando em caminhos para sair da operação original do Master" e que havia construído "uma
  solução que não depende do Bacen e é boa para o BRB", além de "contribuir para a sobrevivência do Master (que é
  importante para o BRB)".
