id: ev-fachin-procedimento-cinco-dias-uteis-2026-09-03
kind: evidence
classification: C
proposition: 'Em 03/09/2026, o presidente do STF, Edson Fachin, abriu procedimento formal e determinou
  que Alexandre de Moraes, André Mendonça, o procurador-geral Paulo Gonet e o diretor-geral da PF, Andrei
  Rodrigues, apresentem explicações por escrito em até cinco dias úteis sobre a condução das investigações
  do Banco Master — incluindo se a PF observou o art. 33 da LOMAN ao lidar com possível crime de magistrado,
  e se houve uso indevido de credenciais institucionais para acessar material privado. A decisão segue
  a divulgação do relatório da PF (01/09), o pedido de anulação de Gonet (01/09) e a decisão de Moraes
  contra Mendonça (mesmo dia). Justificativa: assegurar ''ampla defesa e contraditório''. A sessão do
  plenário sobre o tema, até então sem data, foi adiada para a segunda quinzena de setembro, para aguardar
  o prazo. Nenhum dos quatro se manifestou publicamente sobre a determinação até a data desta atualização.'
