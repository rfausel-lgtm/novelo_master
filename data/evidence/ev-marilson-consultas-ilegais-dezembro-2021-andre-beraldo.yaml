id: ev-marilson-consultas-ilegais-dezembro-2021-andre-beraldo
kind: evidence
classification: D
proposition: Auditoria de sistema (IPJ nº 1813573/2026) mostra que, entre 7 e 13 de dezembro de 2021 —
  quando ainda estava na ativa, quase um ano antes de se aposentar (2022) —, Marilson Roseno da Silva,
  usando seu login institucional "marilson.mrs", realizou diversas consultas no sistema ePol da Polícia
  Federal com os termos "André Beraldo Vorcaro", "Daniel Vorcaro", "Daniel Bueno Vorcaro" e "Banco Máxima"
  (nome do banco, antes de rebatizado Banco Master, que Daniel Vorcaro viria a controlar). Os acessos têm
  registro preciso de data, horário, IP de origem e usuário, e ocorreram em horário incomum — por exemplo,
  às 21h35min e depois de 23h em 07/12/2021 —, fora do expediente normal da corporação.
