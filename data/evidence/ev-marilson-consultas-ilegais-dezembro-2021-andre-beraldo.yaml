date: '2021-12-13'
notes: 'É a evidência mais antiga do acervo de um vínculo entre Marilson e o interesse da família Vorcaro
  — quase três anos antes do episódio do drone em Belo Horizonte (06/04/2024) já registrado no perfil
  dele, e antes mesmo de o banco adotar o nome "Master". A própria PF (nota de rodapé 41 do documento)
  suspeita que "André Beraldo Vorcaro" seja André Beraldo de Morais, apontado por reportagens do jornal
  O Tempo (29/03/2026) e da UOL como alvo de busca e apreensão na 2ª fase da Compliance Zero e suspeito
  de operar empresas de fachada para desviar recursos do Master — mas essa identificação é hipótese da
  PF, não fato estabelecido no documento, e André Beraldo de Morais não tem registro próprio no acervo.
  Tratar com cautela até confirmação por fonte adicional. A manifestação da PGR de 05/05/2026 (lote 199,
  e-Doc 26) confirma que as consultas de Marilson desde 2021 não se limitaram a Daniel Vorcaro, incluindo
  também "pessoas associadas" como Antônio Augusto Conte e Vicente Conte Neto — nomes citados apenas de
  passagem, sem outro contexto no documento; não têm registro próprio no acervo e a relação deles com o
  caso permanece indeterminada.'
