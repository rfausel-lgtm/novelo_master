id: ev-nenhuma-acao-andrei-vinculada-lobby-ambipar-localizada
kind: evidence
classification: I
proposition: 'Não foi localizada, em nenhuma fonte disponível, qualquer ação, omissão, reunião ou decisão
  de Andrei Rodrigues especificamente vinculada ao relacionamento com Renata Varandas ou ao lobby dela
  para a Ambipar. Seu afastamento cautelar em 08/09/2026 (Pet 16.662) teve motivo diverso e já apurado
  no corpus por leitura direta da decisão (lote 105): monitoramento ilícito do ministro André Mendonça
  pela PF, matéria que Mendonça tratou expressamente como não relacionada às alegações do Partido Novo.
  A sobreposição temporal entre o relacionamento, o lobby e a gestão de Andrei na PF é real e documentada,
  mas não configura, por si só, prova de conduta irregular dele — é indício de conflito de interesse potencial,
  registrado como tal.'
