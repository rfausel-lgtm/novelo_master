id: ev-pf-mendonca-sugeriu-beneficio-ilegal-camisotti
kind: evidence
classification: A
proposition: Relatório de 50 páginas da PF (INQ 4781), com sigilo levantado por Alexandre de Moraes em
  03/09/2026, afirma que André Mendonça, nas tratativas de colaboração premiada de Maurício Camisotti
  (Operação Sem Desconto), defendeu a possibilidade de conceder benefício fora das hipóteses previstas
  em lei — uma redução de dois terços da pena, que a PGR considerou desproporcional. A própria PF classifica
  como 'alta' a confiança de que a concessão de tal benefício violaria o princípio da legalidade, e como
  'moderada' a confiança de que a fala de Mendonça ocorreu e sobre seu teor exato. Não há resposta de
  Mendonça registrada até a publicação da matéria.
