proposition: Ao levantar o sigilo, o relator requisitou ao presidente do STF uma sessão pública do plenário
  para que as menções a Moraes, a Gonet e ao diretor-geral da PF sejam analisadas por todos os ministros,
  'instância soberana para analisar, de modo técnico e estritamente jurídico, os novos elementos'. A sessão
  não havia sido pautada.
