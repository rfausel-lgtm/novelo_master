date: '2024-07-30'
notes: 'A data e o teor deste alerta (30/07/2024, sobre um problema de governança do emissor junto à Caixa)
  são distintos do já registrado em glaucio-maciel-bezerra.yaml (voto contrário na 12ª reunião do CIAP, em
  19/07/2024, segundo ata publicada no Diário Oficial) — o corpus não reconcilia se são o mesmo episódio
  descrito com datas diferentes por fontes diferentes, ou dois alertas distintos do mesmo conselheiro em
  reuniões próximas, compatível com as "três deliberações em menos de vinte dias" já registradas em
  amapa-previdencia.yaml. Até a apuração adicional, ambas as datas ficam registradas separadamente.'
