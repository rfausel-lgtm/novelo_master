id: ev-glaucio-bezerra-alerta-30-07-2024-fundo-com-irmao-de-alcolumbre
kind: evidence
classification: A
proposition: 'Em reunião do Comitê de Investimentos da Amprev de 30/07/2024, o conselheiro Gláucio Bezerra
  alertou que "a informação que circulou foi de que esse emissor específico teve um problema envolvendo
  questão política e de governança junto à Caixa Econômica Federal" e se disse "propenso a se posicionar
  pela suspensão desse investimento até que se faça diligências adicionais aos órgãos reguladores e ao
  TCU" — antes da aprovação de cerca de R$ 100 milhões (parte do total de ~R$ 400 milhões aplicados em
  julho de 2024) em letras financeiras do Banco Master. A Polícia Federal e o Ministério Público do Amapá
  apuram se o fundo foi formalmente alertado sobre riscos e recebeu pareceres contrários antes de aportar
  os recursos. Alberto Samuel Alcolumbre Tobelem, identificado pela imprensa como irmão do senador Davi
  Alcolumbre, integrava à época o Conselho Estadual de Previdência (órgão distinto do Comitê de Investimentos),
  e só passou ao Conselho Fiscal da Amprev em 2025 — depois das aprovações.'
