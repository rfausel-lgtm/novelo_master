id: ev-augusto-lima-troca-defesa-agosto-2026
kind: evidence
classification: A
proposition: 'Em agosto de 2026, Augusto Lima decidiu romper o silêncio mantido desde o fim de 2025 e
  passou a sinalizar disposição de falar às autoridades, com troca parcial de equipe de defesa: Sebastián
  Mello e Eduardo Toledo permaneceram; Ticiano Figueiredo, Pedro Ivo Velloso e integrantes do escritório
  anterior (descrito como avesso à colaboração premiada) deixaram o caso. A nova defesa negou categoricamente
  qualquer negociação de delação: ''a defesa constituída repudia de forma veemente qualquer ilação acerca
  de eventual delação e segue confiante de que a inocência de Augusto Lima ficará provada no curso da
  investigação''.'
