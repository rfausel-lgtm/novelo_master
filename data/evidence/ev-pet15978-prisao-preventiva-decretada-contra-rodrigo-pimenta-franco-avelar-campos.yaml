id: ev-pet15978-prisao-preventiva-decretada-contra-rodrigo-pimenta-franco-avelar-campos
kind: evidence
classification: D
proposition: Na decisão de 13/05/2026 na PET 15.978/DF, do ministro André Mendonça, o dispositivo decreta a
  prisão preventiva de sete investigados, entre eles Rodrigo Pimenta Franco Avelar Campos; a nota do STF de
  14/05/2026 o lista entre os presos do núcleo "Os Meninos". A preventiva é medida cautelar e não equivale a
  condenação; a classe D demonstra o conteúdo da decisão e da nota, não os fatos imputados.
