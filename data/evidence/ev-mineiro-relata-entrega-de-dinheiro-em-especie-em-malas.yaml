id: ev-mineiro-relata-entrega-de-dinheiro-em-especie-em-malas
kind: evidence
classification: A
proposition: Além das transferências bancárias ao exterior, o colaborador relata ter sido responsável
  por obter e entregar grandes quantias de dinheiro em espécie a pessoas indicadas pelo banqueiro, parte
  delas transportada em malas, afirmando desconhecer a finalidade final de todos os pagamentos. Segundo
  uma das coberturas, teria dito dispor de vídeos das entregas — elemento que, se existir e for apresentado,
  transforma o relato em prova material. A alegação permanece registrada como declaração do colaborador,
  ainda sem corroboração independente localizada.
