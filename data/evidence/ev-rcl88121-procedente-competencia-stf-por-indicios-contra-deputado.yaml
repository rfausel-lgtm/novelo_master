id: ev-rcl88121-procedente-competencia-stf-por-indicios-contra-deputado
kind: evidence
classification: D
proposition: Em 22/12/2025, Dias Toffoli julgou parcialmente procedente a Reclamação 88.121 e fixou no STF a
  supervisão das investigações da Compliance Zero, com base em "indícios de que o Deputado Federal" João Carlos
  Bacelar "pode estar envolvido em prática delitiva", a partir de um termo de opção de compra e venda de imóvel
  apreendido — e manteve válidos todos os atos e constrições já decretados.
document_ids:
- doc-2025-12-22-decisao-final-rcl88121-competencia-stf-compliance-zero
source_ids:
- src-stf-rcl88121-decisao-final-22-12-2025
date: '2025-12-22'
notes: 'A existência de indícios é afirmação da própria decisão para fixar competência, não conclusão de
  investigação — nenhuma imputação formal ao deputado foi localizada no acervo. A PGR, na manifestação
  transcrita, qualificou a descoberta do documento como acidental e defendeu a validade das provas colhidas em
  primeira instância; Toffoli concordou em mantê-las. A reclamação foi arquivada depois, com as pendências
  transferidas ao INQ 5.026.'
