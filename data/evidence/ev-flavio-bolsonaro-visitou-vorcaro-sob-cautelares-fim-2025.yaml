id: ev-flavio-bolsonaro-visitou-vorcaro-sob-cautelares-fim-2025
kind: evidence
classification: D
proposition: O senador Flávio Bolsonaro visitou Daniel Vorcaro em sua residência particular em São Paulo
  no final de 2025, período em que o banqueiro já cumpria restrições cautelares impostas pelo Poder
  Judiciário — fato noticiado pelo colunista Igor Gadelha (Metrópoles, 19/05/2026) e confirmado pelo
  próprio senador ao jornal O Globo na mesma data, conforme relatado na notícia-crime do deputado Henrique
  dos Santos Vieira Lima.
