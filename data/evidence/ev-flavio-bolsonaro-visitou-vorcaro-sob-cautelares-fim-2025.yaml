date: '2025-12-01'
notes: A data exata da visita não é precisada (apenas "final de 2025"); o fato de o próprio senador tê-la
  confirmado à imprensa (O Globo, 19/05/2026) reduz a controvérsia sobre sua ocorrência, mas o corpus não
  obteve essa reportagem original — apenas a descrição dela feita na notícia-crime.
