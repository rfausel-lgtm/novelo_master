proposition: Em abril de 2025, o advogado Daniel de Faria Jerônimo Leite (São Luís/MA) tomou empréstimo
  de R$ 93,7 milhões, usado majoritariamente para comprar ações do BRB via fundos de investimento, incluindo
  o fundo Verbier, administrado por Maurício Quadrado — operação apontada por relatório da consultoria
  Kroll (contratada pelo BRB) como parte da tentativa de Vorcaro, Quadrado e João Carlos Mansur de adquirir
  participação relevante no banco.
