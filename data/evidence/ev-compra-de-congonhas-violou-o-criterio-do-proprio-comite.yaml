id: ev-compra-de-congonhas-violou-o-criterio-do-proprio-comite
kind: evidence
classification: D
proposition: O Comitê de Investimentos de Congonhas autorizou, em 07/05/2024, a compra de letras financeiras
  sob o critério expresso de que se optasse por instituições no mínimo S3 e 'presentes na lista exaustiva
  da Secretaria de Previdência'. Vinte dias depois, em 27/05/2024, comprou R$ 14 milhões em letras do
  Banco Master — que não constava daquela lista e só passaria a constar em 11/04/2025. A compra violou,
  portanto, a condição que o próprio colegiado havia fixado.
