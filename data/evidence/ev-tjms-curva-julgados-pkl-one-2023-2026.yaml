id: ev-tjms-curva-julgados-pkl-one-2023-2026
kind: evidence
classification: D
proposition: A base pública de julgados de primeiro grau do Tribunal de Justiça de Mato Grosso do Sul
  registra, para o termo 'PKL One', 5 julgados em 2023, 96 em 2024, 216 em 2025 e 114 nos oito primeiros
  meses de 2026 — 431 no total. O produto foi credenciado no estado em março de 2023. A base indexa julgados
  publicados, e não processos distintos, de modo que os números medem intensidade de litígio e não substituem
  a contagem jornalística de mais de mil ações; a curva, porém, é o dado.
