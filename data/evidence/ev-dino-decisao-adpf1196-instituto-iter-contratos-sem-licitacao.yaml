notes: 'A decisão trata os dois contratos citados (Prefeitura/SP e FDE/SP) como parte do "quadro
  indiciário" a esclarecer, sem afirmar irregularidade. O dado dos 55 contratos/R$ 10,8 milhões é achado
  de imprensa independente, não constante da decisão.'
