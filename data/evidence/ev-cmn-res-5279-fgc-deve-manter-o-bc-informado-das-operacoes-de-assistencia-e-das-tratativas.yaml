id: ev-cmn-res-5279-fgc-deve-manter-o-bc-informado-das-operacoes-de-assistencia-e-das-tratativas
kind: evidence
classification: D
proposition: Segundo o estatuto do FGC na redação dada pela Resolução CMN 5.279, o fundo deve manter o BC
  informado das operações de assistência ou suporte financeiro a associadas, incluindo as tratativas que as
  antecederem, a execução dos contratos e as repactuações.
document_ids:
