date: '2026-09-23'
notes: >-
  O Novelo não leu o inteiro teor da decisão; os fundamentos ficam em A, como relato dos veículos. Segundo a
  Agência Brasil, o requerimento de CPI foi protocolado em 09/03 e tem 41 assinaturas; o veículo grafa o nome
  do senador como "Alessandro Viana" em trechos.
