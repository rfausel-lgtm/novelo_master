id: ev-fundamentos-da-liminar-negada-por-zanin-segundo-a-imprensa
kind: evidence
classification: A
proposition: >-
  Segundo a Agência Brasil e o Congresso em Foco (23/09/2026), Zanin entendeu não comprovada, naquele momento,
  a omissão do presidente do Senado, Davi Alcolumbre, em instalar a CPI requerida por Alessandro Vieira;
  destacou a existência de outro requerimento sobre fatos ligados ao Master; pediu informações ao Senado, com
  posterior envio à PGR, e ressalvou que poderá reexaminar o pedido; e lembrou a jurisprudência do STF sobre o
  direito das minorias parlamentares de instalar CPI. Segundo o Congresso em Foco, a decisão diz: "Não é
  possível reconhecer, neste momento processual, a relevância do fundamento invocado pelo impetrante".
