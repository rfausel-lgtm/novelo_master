id: ev-bc-advertiu-pleno-dois-meses-antes-liquidacao
kind: evidence
classification: D
proposition: 'Em 18/12/2025, o Banco Central formalizou advertência ao Banco Pleno (Termo de Comparecimento
  27/2025-BCB/DESUP) sobre agravamento do risco de liquidez — cerca de R$ 475 milhões em CDIs do Banco
  Master em liquidação e R$ 2,5 bilhões em créditos FCVS como ativos de difícil monetização —, registrando
  Índice de Basileia de 6,64% (data-base outubro/2025), abaixo do mínimo regulatório, e determinando
  elevação do Fator de Ponderação de Risco de 20% para 150% sobre os CDIs do Master, com plano de solução
  em 30 dias. É dois meses anterior à liquidação extrajudicial do Pleno, em 18/02/2026.'
