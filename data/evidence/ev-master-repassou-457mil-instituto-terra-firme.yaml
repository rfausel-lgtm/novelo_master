proposition: Segundo dado da Receita Federal citado pela coluna Tácio Lorran (Metrópoles), o Banco Master
  declarou ter repassado R$ 457,2 mil, em dois anos, ao Instituto Terra Firme, associação presidida por
  Flávia Peres. Flávia Peres nega formalmente qualquer relação financeira entre as instituições.
