id: ev-master-descreve-sua-operacao-de-captacao-junto-a-rpps
kind: evidence
classification: D
proposition: 'Na mesma reunião, o Banco Master quantificou a operação de captação institucional que montara:
  iniciada em novembro de 2023, contava então com cinco clientes, quarenta credenciamentos em andamento
  e R$ 700 milhões já captados. O banco declarou ter-se tornado segmento S3 em julho de 2023 e que ''a
  partir desse momento o banco se preparou para atender o mercado de cliente institucional, como RPPS
  e Fundo de Pensão''. É o registro documental de que a captação junto a regimes próprios foi uma estratégia
  deliberada e datada, e não uma sucessão de decisões locais independentes.'
