id: ev-pf-primeiros-contatos-wagner-vorcaro-via-guilherme-sodre
kind: evidence
classification: D
proposition: 'A representação da PF de 98 páginas no INQ 5026/PET 16.032 afirma que, "pelo que consta nos diálogos,
  os primeiros contatos entre o Senador e DANIEL VORCARO foram intermediados por GUILHERME HENRIQUE SODRÉ MARTINS,
  conhecido pelo apelido Tio Guiga, reconhecido pelo próprio Senador JAQUES WAGNER como seu melhor amigo", que em
  19/06/2024 enviou mensagens a Vorcaro "apresentando-se como Guiga e colocando-se à disposição". A PF o descreve
  como "intermediário historicamente vinculado ao Senador" e pai do enteado de Wagner.'
