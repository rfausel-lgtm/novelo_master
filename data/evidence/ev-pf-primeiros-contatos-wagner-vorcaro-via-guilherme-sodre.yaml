notes: 'Corrige registro anterior do acervo (evento de 30/07/2026 e evidência ev-pf-70-contatos-lima-wagner) que,
  com base em síntese de imprensa, atribuía a Augusto Lima a intermediação da proximidade entre Wagner e Vorcaro. O
  documento lido atribui os primeiros contatos a Guilherme Sodré; Lima aparece na sequência de diálogos sobre a
  Emenda 11 da PEC 65/2023 e nos pagamentos à BN Financeira. Trecho na página 76 do PDF.'
