id: ev-tcepr-converte-em-tomada-de-contas-e-nomeia-credito-e-mercado-como-responsavel
kind: evidence
classification: D
proposition: O TCE-PR converteu, em 06/04/2026, representação contra o Fundo de Previdência Municipal de Imbituva
  em Tomada de Contas Extraordinária, por dano ao erário de aproximadamente R$ 4 milhões decorrente de aplicação
  em Letra Financeira do Banco Master, citando como responsáveis solidários, com base no art. 8º-A da Lei 9.717/98,
  os dirigentes do fundo e a consultoria Crédito e Mercado Engenharia Financeira Ltda.
document_ids:
- doc-2026-04-06-despacho-tcepr-imbituva-tomada-contas
source_ids:
- src-tcepr-2026-04-06-despacho-zucchi-imbituva-tomada-contas
date: '2026-04-06'
notes: É a medida de responsabilização mais formal já registrada no acervo entre os RPPS municipais ligados à Crédito
  e Mercado (lotes 164-166) — as demais relações registradas eram de natureza 'professional' (assessoria), sem ato
  de responsabilização equivalente a uma Tomada de Contas Extraordinária nomeando a consultoria.
