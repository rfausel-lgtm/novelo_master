id: ev-fachin-suspende-simultaneamente-os-atos-de-mendonca-e-de-dino
kind: evidence
classification: C
proposition: 'Em 09/09/2026 o presidente do Supremo suspendeu, na mesma decisão, os dois atos monocráticos
  que se anulavam: o de André Mendonça, que em 08/09 afastara o diretor-geral da Polícia Federal, Andrei
  Rodrigues, e o diretor de Inteligência Policial, Leandro Almada; e o de Flávio Dino, que no dia seguinte
  os reintegrara. Nenhum dos dois produz efeito. O fundamento declarado descreve o estado do próprio tribunal:
  ''quadro de conflitos e sobreposições processuais que configuram grave lesão à ordem pública''. Foram
  articulados três feitos — a petição instaurada pela Presidência, a petição de relatoria de Mendonça,
  sobrestada, e a suspensão de liminar pedida pela União. A íntegra revela um quarto item no dispositivo,
  ausente da cobertura: a suspensão de ''todo e qualquer procedimento que verse sobre potencial investigação
  em face de integrantes deste Supremo Tribunal Federal'', que passam a ser previamente remetidos à Presidência;
  e ainda a suspensão do procedimento de controle externo da atividade policial instaurado pela Procuradoria-Geral
  da República.'
