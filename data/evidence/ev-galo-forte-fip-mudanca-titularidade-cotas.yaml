excerpt: 'embora o ASTRALO 95 tenha detido 100% das cotas do GALO FORTE FIP até novembro de 2024, a partir
  de dezembro de 2024, as cotas passaram a ser detidas por DANIEL VORCARO (cerca de 80%) e pelo ASTRALO 95
  (cerca de 20%), em contradição com o conhecimento público que, desde o final de 2023, indicava DANIEL
  VORCARO como o proprietário do GALO FORTE FIP.'
attributed_to: Autoridade policial, na representação encampada pela PGR e transcrita na decisão de Dias
  Toffoli de 06/01/2026
date: '2024-12'
notes: Trecho da decisão fundadora da PET 15.198 não capturado nos registros já publicados sobre ela — a
  autoridade policial aponta a mudança formal de titularidade como indício de dissimulação, não como fato
  de fraude provado.
