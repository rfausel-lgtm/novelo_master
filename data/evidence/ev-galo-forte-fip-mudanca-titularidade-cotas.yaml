id: ev-galo-forte-fip-mudanca-titularidade-cotas
kind: evidence
classification: A
proposition: Embora o Astralo 95 tenha detido 100% das cotas do Galo Forte FIP até novembro de 2024, a
  partir de dezembro de 2024 as cotas passaram a ser detidas por Daniel Vorcaro (cerca de 80%) e pelo
  Astralo 95 (cerca de 20%) — em contradição com o conhecimento público que, desde o final de 2023, já
  indicava Daniel Vorcaro como o proprietário do fundo.
