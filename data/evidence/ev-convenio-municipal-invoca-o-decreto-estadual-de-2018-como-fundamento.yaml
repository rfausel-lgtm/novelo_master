id: ev-convenio-municipal-invoca-o-decreto-estadual-de-2018-como-fundamento
kind: evidence
classification: D
proposition: A ponte entre as duas escalas está escrita no próprio instrumento. O extrato do convênio
  da prefeitura de Jequié com a operadora declara como fundamento legal o 'Decreto nº 18.353, de 27 de
  abril de 2018' — o decreto estadual baiano assinado no dia do leilão da estatal de alimentos, que assegurou
  ao detentor dos direitos de exploração comercial a faculdade de associar ao cartão serviços creditícios,
  financeiros e securitários. Um município invoca a norma do Estado como base jurídica de seu próprio
  ajuste, o que documenta a relação entre o desenho estadual de 2018 e a capilarização municipal do produto.
