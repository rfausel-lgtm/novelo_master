id: ev-pkl-one-participacoes-troca-diretor-nao-explicada
kind: evidence
classification: D
proposition: O quadro societário vigente da PKL One Participações S.A., consultado em 05/09/2026, traz
  como único diretor Marcelo Antonio Bullos Cerqueira, com entrada em 16/07/2026 — substituindo Andréa
  Lima Novaes, que administrava a empresa desde 2018 e que agregadores privados de dados cadastrais (com
  informação aparentemente defasada) ainda listam no cargo. Não foi localizada nenhuma notícia, decisão
  judicial ou nota oficial que explique essa troca — é um fato de registro público sem causa estabelecida;
  não deve ser presumida qualquer relação com a Operação Compliance Zero ou com decisão judicial sem confirmação
  em fonte.
