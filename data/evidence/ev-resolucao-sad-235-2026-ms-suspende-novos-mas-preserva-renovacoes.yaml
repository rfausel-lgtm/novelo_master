id: ev-resolucao-sad-235-2026-ms-suspende-novos-mas-preserva-renovacoes
kind: evidence
classification: D
proposition: 'O ato que Mato Grosso do Sul apresentou como resposta ao superendividamento dos servidores
  suspende apenas credenciamentos novos: o parágrafo único do art. 10 ressalva expressamente que o secretário
  poderá deferir pedidos de renovação. A medida, portanto, não alcança convênios em vigor — entre eles
  o da PKL One, que corre até março de 2027. No preâmbulo, o próprio Estado reconhece que as dívidas de
  consignado passaram a comprometer de forma significativa o orçamento familiar e a saúde mental dos servidores.'
