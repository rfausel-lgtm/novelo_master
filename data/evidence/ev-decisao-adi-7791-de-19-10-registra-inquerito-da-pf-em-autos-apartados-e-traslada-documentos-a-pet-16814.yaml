id: ev-decisao-adi-7791-de-19-10-registra-inquerito-da-pf-em-autos-apartados-e-traslada-documentos-a-pet-16814
kind: evidence
classification: D
proposition: Em decisão de 19/10/2026 na ADI 7.791, o relator, Flávio Dino, registrou que a Gerência de
  Processos Originários Cíveis certificou a ausência de manifestação da CVM em resposta à decisão de
  24/09/2026 (eDOC 215), mas que as informações foram prestadas pela União (íntegra do processo SEI nº
  19957.001206/2022-08, eDOC 211; espelho de tramitação, eDOC 209); considerou "integralmente cumpridas" as
  determinações do eDOC 199; e, "Tendo em vista a instauração de inquérito policial, já comunicada pela
  Polícia Federal em autos apartados", determinou o traslado da decisão, da petição da União e dos eDOCs
  208-211 para a PET 16.814, com ciência à autoridade policial.
