excerpt: Considero, portanto, integralmente cumpridas as determinações constantes do eDOC 199.
date: 2026-10-19
locator: p. 2-3 (dois últimos blocos e fecho)
notes: 'Classe D: decisão judicial com "Publique-se. Intimem-se.", sem marca de sigilo, servida pelo portal do
  STF (downloadPeca id 15391545547) e lida na íntegra com texto legível; o código EFBE-DAF2-CD37-20DE do
  rodapé foi conferido, e a data (19/10/2026) coincide com o fecho e com os andamentos da ADI 7791 (decisão
  monocrática de 19/10; DJe divulgado em 19/10). Prova o que a decisão registra, não o conteúdo do que foi
  entregue: o Novelo não leu a comunicação da PF, a petição da União nem o processo SEI (eDOCs 208-211 e a Pet
  16.814, sigilosa). A decisão não traz o número do inquérito, não nomeia investigados nem os agentes que a
  União diz ter identificado. Decisão que dá por cumpridas diligências não é condenação nem prova de ilícito.
  As expressões entre aspas são da decisão.'
