id: ev-pf-cezinha-fialek-nunes-marques-processos-honorarios-exito
kind: evidence
classification: C
proposition: 'Segundo a decisão do Min. Flávio Dino que autorizou as buscas contra Cezinha de Madureira
  (Operação Transparência, 14/09/2026), comunicações de junho/2025 mostram Mariângela Fialek enviando a
  Cezinha memoriais de processos sob relatoria do Min. Kassio Nunes Marques; Cezinha confirmou
  videoconferência marcada com o ministro para tratar dos casos. Um dos episódios citados: o escritório de
  Fialek fechou, em nome de Valéria Rodrigues Linhares, contrato de R$ 500 mil condicionado ao resultado do
  julgamento de uma Reclamação no STF movida por Michele Queiroz, então prefeita de Beberibe/CE, contra
  investigação do MP-CE. Memoriais semelhantes também foram endereçados aos ministros André Mendonça e
  Gilmar Mendes. Dino classifica o padrão de valores (R$ 500 mil a R$ 2 milhões, condicionados ao
  resultado) como "incompatíveis com a simples atuação técnica", mas explicita que "a investigação não se
  dirige a magistrados de qualquer tribunal superior" e que não há elementos de participação de integrantes
  do Judiciário nos fatos apurados.'
