notes: 'Cautela editorial essencial: a evidência documenta a NEGOCIAÇÃO de acesso/influência por Cezinha,
  Fialek e Linhares — não qualquer conduta dos ministros citados (Nunes Marques, Mendonça, Gilmar Mendes),
  que a própria PF e o próprio Dino excluem expressamente de suspeita.'
