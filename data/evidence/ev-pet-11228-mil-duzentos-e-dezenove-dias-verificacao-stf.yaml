id: ev-pet-11228-mil-duzentos-e-dezenove-dias-verificacao-stf
kind: evidence
classification: D
proposition: 'Verificação direta da equipe no andamento processual público do Supremo Tribunal Federal
  confirma a espinha factual da reportagem que revelou o caso. A Petição 11.228/DF (incidente 6623549,
  número único 0073862-12.2023.1.00.0000) existe, é de classe criminal e corre sob SEGREDO DE JUSTIÇA.
  Foi protocolada em 19/04/2023 às 19h27, autuada em 20/04/2023 e, na mesma data, distribuída por prevenção
  da Pet 10.829 ao ministro Alexandre de Moraes, com conclusão imediata ao relator. As partes constam
  por iniciais, por força do sigilo: requerente L.S.J., com três advogados inscritos na OAB da Bahia;
  requeridos F.D.C.C. e M.E.G.D. — compatíveis com Flávio Dino de Castro e Costa e Marco Edson Gonçalves
  Dias, ambos ''sem representação nos autos'' —, e a Polícia Federal como autoridade policial. O andamento
  não registra nenhum movimento entre a conclusão ao relator, em 20/04/2023, e 21/08/2026: exatamente
  1.219 dias. Nessa data constam, todos no mesmo dia, decisão sob segredo de justiça, vista à PGR, disponibilização
  dos autos à autoridade policial e intimação eletrônica do procurador-geral; em 24 e 25/08/2026, a expedição
  de ofício e de carta de intimação postal.'
