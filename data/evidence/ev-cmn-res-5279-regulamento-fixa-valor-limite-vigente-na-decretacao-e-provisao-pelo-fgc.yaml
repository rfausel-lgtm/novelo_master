id: ev-cmn-res-5279-regulamento-fixa-valor-limite-vigente-na-decretacao-e-provisao-pelo-fgc
kind: evidence
classification: D
proposition: Segundo o regulamento do FGC na redação dada pela Resolução CMN 5.279, o valor limite da
  cobertura da garantia ordinária é o vigente na data da decretação da intervenção ou da liquidação, a partir
  da qual o valor garantido deixa de ser corrigido pelos índices contratuais, e o fundo deve provisionar os
  valores para pagamento das garantias nessa data, depois de recebidas as informações fornecidas pelo
  representante legal da associada.
document_ids:
  - doc-2026-01-22-res-cmn-5279-redacoes-no-texto-consolidado-da-res-4222
source_ids:
  - src-bcb-normativos-res-4222-v19-texto-consolidado-2026
excerpt: O valor limite da cobertura da garantia ordinária é aquele vigente na data da decretação dos eventos
  previstos
locator: Anexo II (regulamento), art. 2º, §§ 10 e 11, e art. 3º e parágrafo único
date: 2026-01-22
notes: O § 12 do mesmo art. 2º, também incluído pela 5.279, manda aplicar ao pagamento da garantia ordinária o
  art. 9º, §§ 2º, 3º e 5º, do regulamento (prazo de até três dias úteis após a decretação, estendido em caso de
  divergência ou atraso nas informações). O consolidado não traz, com a redação da imprensa, o prazo máximo de
  três dias após o recebimento das informações dos liquidantes; ver a evidência de classe A sobre o prazo.
