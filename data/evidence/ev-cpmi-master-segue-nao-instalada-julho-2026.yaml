proposition: 'Até 13/07/2026 — última cobertura direta localizada, sem indício de mudança até 05/09/2026
  — a CPMI do Banco Master nunca teve o requerimento lido em sessão conjunta, apesar de reunir 281 assinaturas.
  Há quatro requerimentos de CPI/CPMI represados nas mesas de Hugo Motta (Câmara) e Davi Alcolumbre (Congresso/Senado).
  Alcolumbre mantém os mesmos argumentos desde maio: a leitura é ''ato discricionário'' da presidência,
  e classifica a mobilização de ''palanque eleitoral''.'
