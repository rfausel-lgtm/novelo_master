id: ev-precedente-de-maio-de-2025-antecede-a-decisao-que-circulou-na-imprensa
kind: evidence
classification: D
proposition: A primeira manifestação judicial localizada sobre a natureza da empresa é anterior à que
  ganhou repercussão. Conflito de competência julgado em 27/06/2025 pela 5ª Câmara Cível reproduz decisão
  da 2ª Vara Bancária de 21/05/2025 segundo a qual 'a parte ré nem sequer é instituição financeira regulada
  pelo Banco Central do Brasil'. A decisão de setembro de 2025, mais citada, não é a primeira — mas ambas
  são posteriores à renovação do convênio estadual, assinada em 11/03/2025, de modo que não havia manifestação
  judicial anterior àquele ato.
