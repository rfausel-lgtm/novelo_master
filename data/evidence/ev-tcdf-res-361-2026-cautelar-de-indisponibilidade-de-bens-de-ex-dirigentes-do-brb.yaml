excerpt: A medida tem por objetivo resguardar eventual ressarcimento aos cofres públicos diante de indícios
  apontados em apurações relacionadas a operações conduzidas pela instituição financeira.
date: '2026-09-23'
notes: >-
  D demonstra o conteúdo da nota institucional e da ficha do e-TCDF, isto é, o que o tribunal diz ter decidido.
  O inteiro teor da decisão (RES nº 361/2026, peça 227, e-DOC 96A3AA16-e) é sigiloso e não foi lido. A
  unanimidade não consta da nota; vem da Agência Brasil (ver evidência própria).
