id: ev-tcdf-res-361-2026-cautelar-de-indisponibilidade-de-bens-de-ex-dirigentes-do-brb
kind: evidence
classification: D
proposition: >-
  Em sessão reservada de 23/09/2026, o TCDF decidiu, em caráter cautelar, determinar a
  indisponibilidade de bens, por um ano, de ex-integrantes da alta administração do BRB, com 30 dias para
  manifestação, instrução prioritária do processo 00600-00003617/2025-75-e para avaliar a extensão a outros
  agentes, conversão em Tomada de Contas Especial, 24 horas para o BRB enviar o relatório da auditoria
  independente, 30 dias para o atual diretor-presidente do BRB justificar o descumprimento de determinação
  anterior e 15 dias para o BRB esclarecer a representação do MPC/DF.
document_ids:
