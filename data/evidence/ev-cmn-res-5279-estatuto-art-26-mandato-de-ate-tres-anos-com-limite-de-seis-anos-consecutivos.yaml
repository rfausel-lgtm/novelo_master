id: ev-cmn-res-5279-estatuto-art-26-mandato-de-ate-tres-anos-com-limite-de-seis-anos-consecutivos
kind: evidence
classification: D
proposition: O texto consolidado da Res. CMN 4.222 (v19, BC) marca como redação dada pela Res. CMN 5.279, de
  22/1/2026, o art. 26 do estatuto do FGC, segundo o qual o mandato dos membros do Conselho de Administração é
  de até três anos, permitidas reeleições, desde que o somatório dos mandatos consecutivos não ultrapasse seis
  anos.
