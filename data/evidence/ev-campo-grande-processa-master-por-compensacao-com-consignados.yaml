id: ev-campo-grande-processa-master-por-compensacao-com-consignados
kind: evidence
classification: D
proposition: O IMPCG ajuizou ação de compensação de créditos contra o Banco Master, sustentando que o banco é devedor
  de R$ 1.427.000,00 (valor atualizado do investimento) e, simultaneamente, credor de valores de empréstimos consignados
  dos servidores — obtendo tutela de urgência que autorizou depósito judicial do valor e suspendeu cobranças e medidas
  restritivas sobre os consignados.
