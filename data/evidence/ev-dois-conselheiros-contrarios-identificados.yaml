id: ev-dois-conselheiros-contrarios-identificados
kind: evidence
classification: D
proposition: Os dois conselheiros que votaram contra a continuidade das aplicações no Banco Master em
  19/07/2024 são Alexandre Flávio Medeiros Monteiro e Gláucio Maciel Bezerra. A ata do Conselho Estadual
  de Previdência registra que a própria 12ª reunião do CIAP foi provocada pelo conselheiro Alexandre,
  preocupado com as movimentações do mercado e com as notícias já veiculadas sobre o banco, e que ambos
  sugeriram que o comitê só decidisse após apreciar o parecer da visita técnica.
