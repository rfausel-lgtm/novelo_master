id: ev-estagio-processual-de-tanure
kind: evidence
classification: D
proposition: 'Distinção que o corpus precisa manter travada: no caso do Banco Master, Nelson Tanure é
  investigado, foi alvo de busca pessoal e de bloqueio de bens, e não está preso, indiciado nem denunciado.
  Ele é réu, porém, em ação penal distinta, sobre uso de informação privilegiada na aquisição da Upcon
  pela Gafisa — processo que chegou a subir ao Supremo e que o relator devolveu à primeira instância em
  27/01/2026, rejeitando expressamente a conexão com o caso Master. Correção de data: a decisão que autorizou
  a busca pessoal foi assinada em 13/01/2026, para cumprimento em 14/01.'
