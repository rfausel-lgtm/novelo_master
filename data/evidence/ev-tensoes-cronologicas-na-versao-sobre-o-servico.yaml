inference_basis: Confronto entre a data de constituição da empresa no cadastro da Receita (08/07/2021),
  a data que a PF atribui à negociação da EBAL/CredCesta (2019), o período de prestação de serviços declarado
  pela própria empresa (2022 a 2025) e as datas dos repasses documentados nos autos.
