id: ev-tensoes-cronologicas-na-versao-sobre-o-servico
kind: evidence
classification: I
proposition: 'Observação da equipe, sinalizada como leitura e não como fato: há duas tensões cronológicas
  entre as versões públicas e o registro cadastral. Primeira, o senador descreveu o serviço como intermediação
  de ''uma negociação no tempo do Bolsonaro'', e a negociação a que a PF associa seu nome — a privatização
  da EBAL e a criação do CredCesta — é datada pela corporação de 2019; mas a BN Financeira só foi constituída
  em 08/07/2021, de modo que não poderia tê-la intermediado. Segunda, ele descreve um evento único e encerrado,
  enquanto a própria empresa descreve contrato de prospecção com exclusividade rendendo pagamentos de
  2022 a 2025 — e os repasses que a PF documenta, planilhas de 2024 e a transferência de outubro de 2025,
  situam-se no período em que ele era líder do governo no Senado. Nenhuma das duas observações imputa
  conduta: são incompatibilidades de datas entre declarações e registro, que o corpus assinala para apuração.'
