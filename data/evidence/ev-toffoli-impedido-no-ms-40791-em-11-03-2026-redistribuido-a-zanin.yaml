id: ev-toffoli-impedido-no-ms-40791-em-11-03-2026-redistribuido-a-zanin
kind: evidence
classification: D
proposition: Em 11/03/2026, o MS 40.791 — mandado de segurança do deputado Rodrigo Rollemberg para obrigar a Câmara a
  instalar a CPI do Banco Master — foi distribuído ao ministro Dias Toffoli e, no mesmo dia, depois de decisão dele,
  redistribuído ao ministro Cristiano Zanin com o registro "Impedido(a) MIN. DIAS TOFFOLI"; Zanin negou seguimento ao
  pedido em 12/03/2026.
document_ids:
