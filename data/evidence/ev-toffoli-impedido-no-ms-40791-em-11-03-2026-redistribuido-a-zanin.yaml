date: '2026-03-11'
notes: 'Corrige o acervo, que atribuía a declaração de suspeição de Toffoli à PET 15.556 e a datava de 20/03/2026 — data
  da notícia oficial do STF que a menciona e a qualifica como suspeição por foro íntimo. Não se confunde com a saída dele
  da relatoria da Rcl 88.121 e do INQ 5.026 em 12/02/2026, a pedido próprio, quando os demais ministros declararam não
  caber suspeição (ver src-cnn-2026-02-12-toffoli-deixa-relatoria). A apuração que levou à correção foi feita por uma
  sessão paralela e conferida aqui nos andamentos públicos do processo.'
