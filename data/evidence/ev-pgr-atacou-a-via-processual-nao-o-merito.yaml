id: ev-pgr-atacou-a-via-processual-nao-o-merito
kind: evidence
classification: D
proposition: A manifestação do procurador-geral da República na PET 16.662, de 01/09/2026, pede a extinção
  do feito por nulidade da ordem e de seu resultado, sustentando que compete ao Plenário do STF investigar
  seus integrantes e que ao relator não cabe dirigir ações policiais. Ela não formula juízo algum sobre
  a veracidade do conteúdo do relatório nem afirma que o ministro nada fez — ataca exclusivamente a via.
  Tomar o pedido de extinção como absolvição de mérito seria erro de leitura.
