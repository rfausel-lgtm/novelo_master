id: ev-mesa-diretora-camara-pede-stf-anulacao-provas-fialek
kind: evidence
classification: C
proposition: 'Em dezembro/2025, a Mesa Diretora da Câmara dos Deputados, presidida por Hugo Motta, enviou
  ao Min. Flávio Dino pedido formal de anulação das provas obtidas pela PF contra Mariângela Fialek e de
  retorno dela ao cargo na Presidência da Câmara. Apesar da proibição expressa de Dino a Fialek de exercer
  "atividades relacionadas à proposição, tramitação ou destinação de emendas parlamentares", ela seguia
  formalmente nomeada e recebendo salário (~R$ 25,9 mil/mês) como chefe da Assessoria Especial do Gabinete
  da Presidência, na Diretoria Administrativa (Dirad), até a data desta coleta.'
