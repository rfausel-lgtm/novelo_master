proposition: No Amazonas, onde nenhum instrumento com a operadora foi localizado, as comunicações judiciais com
  ela como parte passaram de nenhuma em 2022 e uma em 2023 para 56 em 2024, 1.248 em 2025 e 1.929 até setembro de
  2026, alcançando comarcas do interior como Carauari, Parintins e Iranduba.
