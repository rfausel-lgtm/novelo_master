id: ev-cheque-cancelado-a-antonio-mansur-na-casa-de-mourao
kind: evidence
classification: I
proposition: Entre os documentos apreendidos na residência de Luiz Phillipi Mourão em 04/03/2026, havia um cheque
  do Banco Itaú, no valor de R$ 1.802.200,00, da empresa Del Rei S. Adm. Ltda., nominal a uma pessoa identificada
  apenas como 'Antônio Mansur', com inscrição 'cancelado'.
