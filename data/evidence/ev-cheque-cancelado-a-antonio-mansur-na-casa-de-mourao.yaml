inference_basis: 'O documento apreendido nomeia apenas ''Antônio Mansur'', sem CPF nem outro dado de qualificação
  no material lido. O que NÃO se conclui: não há, no material lido, qualquer elemento que identifique essa pessoa
  com João Carlos Falbo Mansur, já conhecido do acervo por outra frente (acionista do BRB, delação premiada) — a
  coincidência de sobrenome não basta, e o acervo registra os dois como pessoas distintas até que apareça documento
  que os identifique.'
