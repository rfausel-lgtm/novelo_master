id: ev-decisao-dino-caos-administrativo-beneficia-investigados-juiz-proprio
kind: evidence
classification: D
proposition: 'Trechos literais adicionais da decisão de Flávio Dino na Pet 16.669/DF (09/09/2026, já mapeada
  no acervo), lida integralmente pela equipe: sobre a interrupção das investigações da PF, ''não é cabível
  que investigações urgentes e com diligências em curso [...] sejam interrompidas em face de caos administrativo
  imposto externamente à Polícia Federal, com a demissão de todo o seu corpo diretivo''; e ''a interrupção
  dos trabalhos de direção de investigações policiais interessa, sobretudo, aos investigados''. A decisão
  também questiona se Mendonça pode ser ''juiz de si mesmo'' ao decidir sobre relatórios da PF que o mencionam
  expressamente.'
