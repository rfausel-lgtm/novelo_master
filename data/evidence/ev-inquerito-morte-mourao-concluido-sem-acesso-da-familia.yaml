id: ev-inquerito-morte-mourao-concluido-sem-acesso-da-familia
kind: evidence
classification: C
proposition: 'A Polícia Federal concluiu, em abril de 2026, o inquérito sobre a morte de Luiz Phillipi
  Machado de Moraes Mourão, apontado como chefe do grupo de intimidação, ocorrida após sua prisão em 04/03/2026
  na carceragem da superintendência da corporação em Belo Horizonte. A conclusão foi de que ele atentou
  contra a própria vida e de que ''não houve intervenção externa na ocorrência''; o relatório foi enviado
  ao ministro André Mendonça. Registro de assimetria que o corpus mantém: o inquérito foi conduzido pela
  própria instituição sob cuja custódia a morte ocorreu e concluído sem que a família, até onde se apurou
  publicamente, tivesse tido acesso às imagens de segurança, aos autos ou ao laudo do IML — situação que
  ela relatava em abril de 2026 e para a qual não foi localizada mudança posterior. Não foi localizada
  nenhuma apuração externa sobre as circunstâncias da morte, seja da Corregedoria da Polícia Federal,
  do Ministério Público Federal ou do Ministério Público estadual, nem divulgação do laudo do IML.'
