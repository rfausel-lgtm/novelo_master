id: ev-marcello-lopes-confirma-aporte-de-um-milhao-como-investidor
kind: evidence
classification: A
proposition: O publicitário Marcello Lopes confirmou publicamente ter transferido R$ 1 milhão à produtora do filme,
  afirmando ter feito o aporte como investidor, em dezembro de 2025, a pedido do deputado Mário Frias, depois que
  os repasses de Daniel Vorcaro pararam em outubro daquele ano e a produção 'abriu cotas para investimento'.
document_ids: []
source_ids:
- src-metropoles-2026-09-10-marcelao-confirma-aporte-de-um-milhao
excerpt: Quando parou de ter o dinheiro lá em outubro (de 2025) que Vorcaro investia, a turma toda estava gravando
  em São Paulo, tinham que fazer monte de pagamento e abriram cotas para investimento. Eu achei um bom negócio e
  decidi investir
attributed_to: Marcello Lopes, ao Metrópoles (coluna Igor Gadelha), 10/09/2026
date: '2026-09-10'
notes: 'A declaração é relevante além do aporte: é a primeira afirmação, feita por um participante e em nome próprio,
  de que dinheiro de Daniel Vorcaro financiava a produção até outubro de 2025. Ela contrasta com a nota de 13/05/2026
  em que Mário Frias, citando a produtora, sustentou não haver ''um único centavo'' de Vorcaro na obra. O corpus
  registra as duas manifestações como o que são: declarações atribuídas, não fatos verificados.'
