kind: evidence
id: ev-pf-guilherme-sodre-e-daniel-monteiro-tratativas-do-apartamento
classification: D
proposition: 'Segundo a representação da PF da 9ª fase, depois da primeira fase da Compliance Zero Guilherme Henrique
  Sodré Martins foi interlocutor do advogado Daniel Lopes Monteiro nas tratativas sobre o apartamento do Poème Horto:
  reunião no escritório de Monteiro em 25/11/2025, pedido de encontro em 04/12/2025, a mensagem de 18/12/2025 "A
  altura do vão é 2,45m", respondida com "Perfeito", que a PF lê como referência ao valor de R$ 2,45 milhões do
  imóvel, e, em 2026, o envio de minuta de venda dos direitos sobre a unidade.'
