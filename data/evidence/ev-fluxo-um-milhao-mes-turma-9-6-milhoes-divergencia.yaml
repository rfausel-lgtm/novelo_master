id: ev-fluxo-um-milhao-mes-turma-9-6-milhoes-divergencia
kind: evidence
classification: C
proposition: 'A King Participações Imobiliárias, de Felipe Mourão, recebia cerca de R$ 1 milhão por mês
  de empresas do grupo Vorcaro — Super Empreendimentos e, em ao menos um registro (13/03/2024), a Viking
  Participações —, dos quais R$ 400 mil mensais eram repassados aos seis integrantes de ''A Turma'', à
  parte bônus eventuais.'
