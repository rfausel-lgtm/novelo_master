date: 2026-03
notes: 'RESOLVIDO (lote 204): a divergência aritmética antes registrada aqui — R$ 9,6 milhões não
  fechavam com 36 meses de R$ 400 mil — está esclarecida pela análise técnica da PF sobre o próprio chat
  (IPJ-A nº 1070759/2026): o período de pagamento mensal comprovado vai de outubro de 2023 a novembro de
  2025, cerca de 24 meses, não 36. A PF calcula, com essa base, que Mourão recebeu no mínimo
  R$ 24.000.000,00 ao todo (R$ 1 milhão × 24 meses, excluídos bônus) e que ''A Turma'' recebeu
  R$ 9.600.000,00 para ratear (R$ 400 mil × 24 meses) — a conta fecha exatamente. O documento também
  registra repasse extra de R$ 1 milhão em 02/07/2024, tratado nas próprias mensagens como bônus, e
  repasses maiores (R$ 2 milhões) em 07/02/2025 e 03/04/2025, não somados ao cálculo mínimo da PF.'
