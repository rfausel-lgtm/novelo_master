id: ev-fluxo-um-milhao-mes-turma-9-6-milhoes-divergencia
kind: evidence
classification: C
proposition: 'Segundo apuração jornalística baseada na investigação, a King Participações Imobiliárias
  recebia cerca de R$ 1 milhão por mês de empresas do grupo, especialmente da Super Empreendimentos, dos
  quais cerca de R$ 400 mil mensais eram distribuídos entre os integrantes do grupo ''A Turma'', com bônus
  eventuais; a Polícia Federal estima cerca de R$ 9,6 milhões movimentados entre 2023 e 2025. Nota aritmética
  que o corpus registra sem resolver: R$ 9,6 milhões distribuídos por 36 meses corresponderiam a cerca
  de R$ 267 mil mensais, valor inferior tanto ao R$ 1 milhão quanto aos R$ 400 mil citados — ou o período
  efetivo de pagamentos é menor do que três anos, ou a estimativa se refere apenas a uma fatia do fluxo.
  As fontes não explicitam a conta.'
