id: ev-decisao-10afase-contatos-consuelo-renato
kind: evidence
classification: D
proposition: Segundo a decisão (PET 16.346, §42), Thiago Miranda contatou a jornalista Consuelo Dieguez
  (revista Piauí) e o consultor Renato Breia (Nord Investimentos) para pedir retirada de conteúdo prejudicial
  a Vorcaro. Consuelo recusou e orientou o envio de carta à revista; Renato atendeu ao pedido, mas registrou
  contrariedade com a abordagem em mensagem de resposta.
