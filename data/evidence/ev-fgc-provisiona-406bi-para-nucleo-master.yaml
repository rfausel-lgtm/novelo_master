id: ev-fgc-provisiona-406bi-para-nucleo-master
kind: evidence
classification: C
proposition: O FGC provisionou R$ 40,6 bilhões para o pagamento de garantia aos credores do Banco Master,
  Master de Investimentos e Letsbank — os três liquidados em 18/11/2025. Até 29/01/2026, já havia pago
  R$ 32,5 bilhões a 580 mil credores (75% dos investidores com direito à garantia). O Banco Central, em
  relatório de maio de 2026, confirma desembolso de R$ 37,7 bilhões entre 19/01 e 27/02/2026 (93,3% de
  uma estimativa de R$ 40,4 bilhões) — pequena variação de valor entre FGC e BC não reconciliada nas fontes,
  tratada como arredondamento ou diferença de corte temporal.
