proposition: Em 03/09/2026, a PGR fechou acordo de colaboração premiada com Antonio Carlos Freixo Júnior
  ('Mineiro'), dono da Entre Investimentos e Participações, apontado como operador das remessas de Vorcaro
  ao Havengate Development Fund. É a segunda delação do caso Banco Master, após a de João Carlos Mansur
  (Reag). Segundo reportagens — não confirmadas por veículo de maior porte quanto aos termos exatos —,
  o acordo registra que os aportes de Vorcaro para o filme foram intermediados por Flávio Bolsonaro. Freixo
  relatou transferências que considerava 'não ortodoxas', incluindo repasses sem lastro documental e movimentação
  de dinheiro em espécie, mas alegou desconhecer a destinação final dos recursos no fundo americano. Eduardo
  Bolsonaro negou ter recebido recursos de Vorcaro; Flávio Bolsonaro alegou que os recursos foram integralmente
  destinados à produção do filme. A defesa de Vorcaro e o fundo Havengate não se manifestaram, atribuído
  ao sigilo do acordo.
