id: ev-suspensao-de-atividades-e-cautelares-bn
kind: evidence
classification: D
proposition: As empresas são alvo formal de medida das mais severas. No dispositivo da decisão de 17/06/2026,
  item 99.6, o ministro André Mendonça determinou 'a suspensão das atividades econômicas e financeiras'
  da BN Financeira Ltda., da BN Representações Tecnológicas Ltda. e da Epítome S.A., abrangendo novos
  negócios, contratos, emissão de notas fiscais, obtenção de crédito, alienação de ativos e alteração
  de quadro societário, sede ou objeto social. No item 99.3, impôs a Bonnie Toaldo Bonilha proibição de
  contato com os demais investigados — ressalvados o senador e o marido, por vínculo familiar —, suspensão
  de passaporte e impedimento de saída do país. A decisão registra que a suspensão de passaporte do próprio
  senador não foi requerida.
