id: ev-pgr-lista-17-processos-omitidos-do-levantamento-de-sigilo
kind: evidence
classification: D
proposition: 'A PGR, em manifestação de 11/09/2026 na Pet 16.704, nomeia 17 processos correlatos à Compliance
  Zero que ficaram de fora do levantamento de sigilo determinado por Mendonça em 10/09 (que cobriu 14 processos):
  PET 16.319, 15.711, 15.771, 15.772, 15.773, 15.855, 15.873, 15.877, 15.625, 15.676, 15.686, 15.497, 16.201,
  16.210, 16.229, 16.230, 16.346 e 16.369. Pede levantamento "sem exceção".'
