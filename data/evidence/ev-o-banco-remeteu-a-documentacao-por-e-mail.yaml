proposition: Os autos contêm as mensagens pelas quais o próprio Banco Master remeteu ao Itaprevi a documentação
  de credenciamento, com o assunto 'Credenciamento Banco Master S.A - Itaguaí/RJ - ITAPREVI' e uma segunda
  mensagem identificada como 'Parte 2'. O corpo enumera os documentos anexados e informa que os demais
  seguiriam depois. A assinatura é de Paula Vouguinha, Relações Institucionais do Banco Master. É a demonstração
  documental de que a instrução do processo partiu do banco, e não da autarquia.
