date: '2026-09-11'
inference_basis: 'Baseia-se em três elementos que, somados, sugerem a hipótese sem prová-la: (1) os irmãos do ministro
  são sócios de empresa (Maridt) já ligada por reportagens ao entorno do caso Master via venda ao fundo Arleen do
  cunhado de Vorcaro; (2) eles constam formalmente como investigados no INQ 5.026/DF, inquérito do mesmo eixo BRB-Master;
  (3) a dispensa deles da CPI antecede em duas semanas o impedimento do próprio ministro no MS 40.791 (11/03/2026). Corrigido em
  12/09/2026: o acervo atribuía a suspeição à PET 15.556 em 20/03; a saída dele do INQ 5.026, em 12/02, foi a pedido
  próprio, com os demais ministros declarando não caber suspeição (ver src-cnn-2026-02-12-toffoli-deixa-relatoria).
  Nenhuma fonte consultada declara expressamente que a suspeição decorre da situação dos irmãos — é a leitura da
  equipe a partir da cronologia e do tema comum, não um fato relatado por qualquer autoridade.'
