inference_basis: Cruzamento entre o CPF parcial registrado na Receita Federal em três CNPJs (âncora de
  identidade confirmada para o investigado) e o perfil público de um advogado homônimo, sem elemento que
  una ou separe definitivamente os dois. Registrado como pendência, não como conclusão.
