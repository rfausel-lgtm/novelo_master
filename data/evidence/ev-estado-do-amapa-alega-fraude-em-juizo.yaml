proposition: Na petição inicial, reproduzida na decisão liminar, o Estado do Amapá e a Amprev sustentam
  que os recursos previdenciários investidos no banco 'sequer poderiam ter sido investidos, dado que isso
  só ocorreu por razões fraudulentas', e que deveriam ter sido devolvidos desde a notificação do desenquadramento
  das normas previdenciárias aplicáveis. É afirmação dos próprios entes públicos, em juízo, sobre o investimento
  que sua autarquia realizou.
