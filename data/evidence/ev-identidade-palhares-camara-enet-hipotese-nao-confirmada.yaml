notes: Formaliza como inferência, com limites explícitos, uma hipótese que já estava registrada em
  `open_questions` no perfil de Leonardo Augusto Furtado Palhares desde o lote 180. Não acrescenta apuração
  nova — dá lastro à aresta correspondente no grafo, que sem isso ficaria sem classe válida.
