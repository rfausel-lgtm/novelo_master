id: ev-despesa-de-captacao-com-letras-financeiras
kind: evidence
classification: D
proposition: 'A despesa de captação com letras financeiras acompanhou a escalada: R$ 5.924 mil em todo
  o exercício de 2023 contra R$ 192.331 mil em 2024 — trinta e duas vezes mais. Para comparação, a despesa
  com letras de crédito imobiliário caiu de R$ 180.883 mil para R$ 173.755 mil no mesmo período.'
