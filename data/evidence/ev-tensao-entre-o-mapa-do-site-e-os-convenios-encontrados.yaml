inference_basis: Confronto entre a lista de unidades da federação extraída das capturas arquivadas do
  site do produto e o resultado da varredura de 23 redes de diários municipais com controle de cobertura,
  complementado pelo mapeamento de partes no diário eletrônico do Judiciário.
