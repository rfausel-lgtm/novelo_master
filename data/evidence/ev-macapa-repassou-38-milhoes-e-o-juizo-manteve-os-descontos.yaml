id: ev-macapa-repassou-38-milhoes-e-o-juizo-manteve-os-descontos
kind: evidence
classification: C
proposition: 'Macapá é o caso municipal de maior volume conhecido e o que melhor expõe o impasse. O convênio
  de setembro de 2021 nunca foi rescindido administrativamente, e os repasses somaram R$ 37,99 milhões
  entre 2023 e junho de 2026. Levado à Justiça, o caso produziu decisão que autoriza reter e provisionar
  os valores e proíbe as rés de cobrar ou negativar servidores sob multa de vinte mil reais por servidor
  — mas mantém os descontos na folha, negando expressamente a suspensão, à conta da pendência do Tema
  1.414 no Superior Tribunal de Justiça. O servidor segue descontado, o dinheiro fica retido e ninguém
  pode cobrá-lo. Registre-se a assimetria federativa: no mesmo estado, a operadora fora inabilitada pelo
  Executivo estadual em 2023 por não se enquadrar entre os tipos de consignatárias, e ainda assim operava
  na folha da capital.'
