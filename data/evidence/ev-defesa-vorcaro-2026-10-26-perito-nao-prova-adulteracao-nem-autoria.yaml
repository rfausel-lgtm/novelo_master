id: ev-defesa-vorcaro-2026-10-26-perito-nao-prova-adulteracao-nem-autoria
kind: evidence
classification: D
proposition: O próprio assistente técnico da defesa escreve que não é tecnicamente possível atribuir as
  alterações registradas a uma ação humana deliberada, embora isso tampouco autorize classificá-las como
  automáticas ou inofensivas, que suas conclusões não implicam juízo sobre autoria,
  que a diferença entre versões do IPED “não indica, por si, erro ou adulteração”, que o teste em que editou um
  relatório UFDR foi feito em arquivo público de treinamento e não demonstra alteração do relatório deste
  caso, e que o hash do arquivo recebido coincide com o consignado no laudo da PF; segundo o Poder360, o laudo
  não comprova que o material tenha sido adulterado.
