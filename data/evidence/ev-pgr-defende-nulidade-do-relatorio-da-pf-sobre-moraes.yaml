id: ev-pgr-defende-nulidade-do-relatorio-da-pf-sobre-moraes
kind: evidence
classification: A
proposition: 'O procurador-geral da República sustenta a nulidade do relatório da Polícia Federal que
  embasa a suspeita contra Alexandre de Moraes, ao argumento de que o relator do caso Master teria direcionado
  a apuração contra o ministro antes de autorização do Plenário. Dois trechos sintetizam a tese: ''Não
  importa o grau de investigação que a providência constitui, é inegável que houve imersão em elementos
  dos autos para buscar indicativos de envolvimento de Moraes em ilícitos'' e ''Ao juiz, não cabe acusar,
  menos ainda ao juiz cabe realizar investigações pré-processuais''. A objeção é de método, não de conteúdo:
  não afirma que o relatório seja falso, e sim que foi produzido por via que reputa inadmissível. PRECISÃO:
  o pedido final da manifestação não é dirigido ao Plenário, e sim ao relator — ''cabe ao relator reconhecê-lo
  e extinguir a Petição''. A peça foi protocolada em 01/09, antes de o feito ser remetido ao colegiado.
  Os dois trechos citados foram conferidos na íntegra e trazem pequenas diferenças de redação em relação
  ao que se registrara: lê-se ''envolvimento do Ministro Alexandre de Moraes em ilícitos'' e ''Ao juiz
  não cabe acusar'', sem vírgula.'
