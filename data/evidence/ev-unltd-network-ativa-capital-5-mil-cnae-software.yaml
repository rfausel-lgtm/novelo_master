id: ev-unltd-network-ativa-capital-5-mil-cnae-software
kind: evidence
classification: C
proposition: 'A UNLTD Network Brazil Ltda (CNPJ 47.643.948/0001-29), agência que segundo a decisão do
  STF recrutou o vereador Rony Gabriel mediante acordo de confidencialidade com multa de R$ 800 mil citando
  expressamente o ''PROJETO DV'', foi aberta em 19/08/2022, tem capital social de R$ 5.000, CNAE principal
  de desenvolvimento de programas de computador sob encomenda e sede em Águas Claras, Brasília. Sua situação
  cadastral na Receita Federal é ATIVA: diferentemente da Varajo, da Moriah Asset, da Super Empreendimentos
  e das duas empresas King, ela não foi alcançada por suspensão judicial de atividades. A agência declarou
  não ter contrato com o Banco Master. O quadro societário retornado pela base da Receita traz um único
  sócio-administrador, ao passo que agregadores comerciais listam outros dois nomes, entre eles o de André
  Salvador, apontado como quem fez as abordagens — divergência não resolvida, que dependeria de certidão
  da Junta Comercial do Distrito Federal. Nem ele nem o outro nome associado à agência foram alvo de busca
  ou de medida cautelar: figuram mencionados na decisão, não como investigados.'
