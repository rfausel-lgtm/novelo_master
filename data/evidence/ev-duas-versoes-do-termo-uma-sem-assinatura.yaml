id: ev-duas-versoes-do-termo-uma-sem-assinatura
kind: evidence
classification: D
proposition: 'O Termo de Credenciamento aparece duas vezes nos mesmos autos. A primeira versão está integralmente
  preenchida e sem qualquer assinatura — inclusive com a razão social e o CNPJ do Banco Master já impressos
  no campo reservado à assinatura do representante legal da instituição interessada. A segunda é a mesma
  peça, assinada digitalmente pelo dirigente do regime próprio em 16/01/2024. A sequência materializa
  o que o Tribunal de Contas do Estado do Rio de Janeiro descreveu: o documento chegou pronto e foi assinado.'
