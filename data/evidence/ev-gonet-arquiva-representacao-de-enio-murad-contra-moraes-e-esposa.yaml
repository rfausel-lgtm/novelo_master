id: ev-gonet-arquiva-representacao-de-enio-murad-contra-moraes-e-esposa
kind: evidence
classification: C
proposition: Segundo o Poder360 (29/12/2025) e a Agência Brasil (30/12/2025), o procurador-geral Paulo Gonet
  arquivou, em despacho de 27/12/2025, o pedido de investigação de Alexandre de Moraes e da esposa, Viviane
  Barci de Moraes, apresentado em 24/12/2025 pelo advogado Enio Martins Murad com base em reportagens;
  escreveu que há "absoluta ausência de lastro probatório mínimo que sustente a acusação formulada", que a
  representação "fundamenta-se estritamente em matérias jornalísticas" e, quanto ao contrato do escritório de
  Viviane Barci de Moraes com o Master, que "não se vislumbra, a priori, qualquer ilicitude que justifique a
  intervenção desta instância".
