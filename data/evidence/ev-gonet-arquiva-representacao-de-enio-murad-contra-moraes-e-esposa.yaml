excerpt: Em uma análise preliminar, é imperativo sublinhar a absoluta ausência de lastro probatório mínimo que
  sustente a acusação formulada.
date: 2025-12-27
notes: O despacho não foi localizado em fonte oficial do MPF nem lido na íntegra; o número do procedimento não
  foi localizado. O arquivamento é decisão da PGR; o Novelo não emite juízo próprio sobre os fatos narrados
  nas reportagens nem sobre o contrato. A data de 27/12 vem da Agência Brasil ("publicado no último sábado
  (27)") e do texto do Estadão Conteúdo republicado pelo Diario de Pernambuco (assinado três dias depois do
  pedido de 24/12).
