id: ev-superintendentes-pf-nota-defesa-andrei-2026-08
kind: evidence
classification: C
proposition: Em 05-06/08/2026, os 27 superintendentes regionais da Polícia Federal divulgaram nota conjunta
  em defesa da direção-geral, em meio a tensão com o ministro André Mendonça sobre determinações na 'Operação
  Sem Desconto' (exigência de remessa ao STF de todas as peças investigativas e de comunicação prévia
  antes de qualquer afastamento ou troca de delegados). A nota caracteriza a PF como 'instituição de Estado'
  cuja atividade investigativa 'não se submete a interesses políticos, ideológicos ou pessoais, mas ao
  estrito cumprimento da lei', defendendo a 'preservação da independência técnica das investigações e
  autonomia administrativa'.
