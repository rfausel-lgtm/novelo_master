id: ev-rcl88121-liminar-leva-compliance-zero-ao-stf
kind: evidence
classification: D
proposition: Em 09/12/2025, na Reclamação 88.121 ajuizada por Daniel Vorcaro, Dias Toffoli suspendeu as
  investigações da Compliance Zero na 10ª Vara Federal do DF e nas instâncias antecedentes, trouxe ao STF toda
  a matéria, inclusive conexa, manteve as decisões e constrições já proferidas e deu acesso aos autos ao deputado
  federal João Carlos Paolilo Bacelar Filho, mencionado em documentos apreendidos.
document_ids:
- doc-2025-12-09-decisao-liminar-rcl88121-remete-compliance-zero-stf
source_ids:
- src-stf-rcl88121-decisao-liminar-09-12-2025
date: '2025-12-09'
notes: 'Na fundamentação, Toffoli afirma ser "imprescindível que o Banco Central do Brasil se abstenha de
  cumprir quaisquer decisões judiciais relativas às instituições bancárias envolvidas na operação Compliance
  Zero que não provenham deste Supremo Tribunal Federal". A decisão fica entre a de 03/12/2025 (aprovação
  prévia de novas diligências) e a de 15/12/2025 (diligências preliminares), ambas já registradas, e é a que
  a PGR citaria em janeiro de 2026 para defender a ratificação das medidas de primeiro grau.'
