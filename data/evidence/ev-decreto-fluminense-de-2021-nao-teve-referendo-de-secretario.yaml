id: ev-decreto-fluminense-de-2021-nao-teve-referendo-de-secretario
kind: evidence
classification: D
proposition: O ato publicado traz apenas a assinatura do governador, sem referendo de qualquer secretário
  de Estado — ao contrário do que ocorre nos decretos equivalentes de São Paulo, Mato Grosso e Espírito
  Santo, todos referendados por titulares de pasta. Sua origem é o Processo SEI-150001/006360/2021. O
  prefixo do processo coincide com o de outro feito da Secretaria de Estado da Casa Civil publicado na
  mesma página, o que sugere aquela pasta como órgão instrutor — inferência, não fato estabelecido. O
  decreto também elevou a 96 meses o prazo de amortização e admitiu contratação por meios digitais e de
  telecomunicação.
