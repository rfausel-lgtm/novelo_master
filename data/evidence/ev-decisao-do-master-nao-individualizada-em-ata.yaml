id: ev-decisao-do-master-nao-individualizada-em-ata
kind: evidence
classification: D
proposition: Ao contrário do padrão documentado em outros regimes próprios de previdência, a decisão de
  comprar letras financeiras do Banco Master nunca aparece nomeada nas atas do Comitê de Investimentos
  do Rioprevidência. A ata de 30/11/2023, coincidente com a semana da primeira aplicação, registra apenas
  a liberação de um teto regulatório genérico — a palavra 'Master' não aparece uma única vez no documento.
  Isso sugere que a escolha específica do emissor foi tomada em nível operacional, na Gerência de Operações
  e Investimentos, sem submissão formal e individualizada ao colegiado.
