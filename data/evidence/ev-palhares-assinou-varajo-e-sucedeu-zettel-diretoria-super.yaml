inference_basis: Cruzamento entre a identificação de Palhares como administrador da Varajo na decisão
  do STF (documental) e a data de entrada dele na diretoria da Super no registro da Receita Federal (documental).
  A coincidência temporal com a saída de Zettel é objetiva; a interpretação não é afirmada por nenhuma
  fonte.
