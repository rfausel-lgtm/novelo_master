id: ev-palhares-assinou-varajo-e-sucedeu-zettel-diretoria-super
kind: evidence
classification: I
proposition: 'Cruzamento entre dois registros já verificados: (a) a decisão do STF na PET 15.556 identifica
  Leonardo Augusto Furtado Palhares como administrador da Varajo Consultoria, autor da assinatura da proposta
  de contratação fictícia do servidor do Banco Central, e como o ''Leo'' que Vorcaro queria que pagasse
  a propina para ocultar a origem do recurso; (b) o registro da Receita Federal mostra que o mesmo Leonardo
  Augusto Furtado Palhares entrou na diretoria da Super Empreendimentos e Participações em 23/07/2024
  — o mesmo mês em que, segundo a imprensa, Fabiano Zettel deixou a diretoria da empresa. A sobreposição
  é factual e verificável; nenhuma fonte localizada estabelece relação causal entre a atuação dele na
  triangulação da propina e sua posterior entrada na diretoria da Super, e não há manifestação dele sobre
  isso.'
