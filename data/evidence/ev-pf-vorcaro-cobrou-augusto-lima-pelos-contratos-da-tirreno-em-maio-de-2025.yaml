attributed_to: Polícia Federal, na IPJ-A nº 1252786/2026 (análise do celular de Daniel Vorcaro), juntada ao INQ 5.026
date: '2025-05-05'
notes: 'Para a PF, as mensagens mostram que Augusto Lima supervisionou a confecção e o envio de documentos da cessão
  atribuída à Tirreno, o que não aparece nas versões apresentadas pelo Master e pelo BRB ao Banco Central. A outra
  negociação citada por Vorcaro envolveria, segundo o relatório, a Will Financeira. A defesa de Augusto Lima nega
  irregularidades (ver o perfil dele), e ele não foi incluído no indiciamento de agosto de 2026. Hipótese
  investigativa.'
