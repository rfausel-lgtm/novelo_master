id: ev-pf-vorcaro-cobrou-augusto-lima-pelos-contratos-da-tirreno-em-maio-de-2025
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, em 05/05/2025 Daniel Vorcaro cobrou de Augusto Lima as CCBs e os contratos da
  Tirreno ("ate agora nao mandamos NADA"), condicionando outra negociação a esse envio; em 08/05 Augusto Lima lhe
  mandou uma tabela de tranches firmadas entre 26/12/2024 e 05/05/2025 cujo valor presente somava cerca de R$ 12
  bilhões; e em 12/05 Vorcaro listou pendências que incluíam a falta de reconhecimento em cartório dos contratos com a
  Tirreno, autenticados dois dias depois.
document_ids:
- doc-2026-03-11-ipja-1252786-analise-celular-vorcaro-tirreno-brb
source_ids:
