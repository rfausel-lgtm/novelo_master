id: ev-wagner-entrevista-folha-patacoada-lava-jato
kind: evidence
classification: A
proposition: Em entrevista à Folha de S.Paulo publicada em 26/06/2026, Jaques Wagner admitiu proximidade
  com Augusto Lima, mas negou favorecimento ilícito, classificou a ação da PF de 18/06/2026 como 'espetacularização'
  e 'patacoada', e acusou o STF de encenar a divulgação do dinheiro apreendido em seu quarto de hotel,
  comparando a condução ao 'reinventar a Lava Jato'. Declaração atribuída diretamente ao próprio senador
  em entrevista nomeada; reportada até o momento por um único veículo consultado (Poder360, relatando a
  entrevista à Folha).
