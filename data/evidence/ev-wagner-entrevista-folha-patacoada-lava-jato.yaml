excerpt: A ordem do André Mendonça fala explicitamente para não ter fotografias. Eles foram ao quarto
  de hotel onde eu moro, botaram lá em cima da cama [as notas de dólares e euros] com o escudinho [da
  PF] e fotografaram. Estão reinventando a Lava Jato.
