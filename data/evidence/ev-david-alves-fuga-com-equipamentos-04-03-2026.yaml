id: ev-david-alves-fuga-com-equipamentos-04-03-2026
kind: evidence
classification: D
proposition: Na noite de 04/03/2026 — data da 3ª fase da Operação Compliance Zero —, David Henrique Alves
  foi abordado pela Polícia Rodoviária Federal dirigindo a Range Rover de Luiz Phillipi Mourão,
  acompanhado de Katherine Venâncio Telles, transportando um computador de mesa, notebooks, caixas e
  malas; no carro havia um RG em nome de Marcelo Souza Gonçalves que, por comparação facial posterior,
  apresentou alta probabilidade de pertencer a Victor Lima Sedlmaier. Na mesma manhã, David havia
  telefonado à imobiliária pedindo para devolver com urgência o apartamento que alugava em Lagoa
  Santa/MG, saindo do condomínio por volta das 15h de forma apressada.
