id: ev-master-nomeou-seus-cinco-clientes-rpps
kind: evidence
classification: D
proposition: 'Na apresentação de 14/03/2024 à Amapá Previdência, o Banco Master nomeou os regimes próprios
  que já captara: ''as instituições captadas são Rio Previdência, Maceió, Paulista, Cajamar, Araras''.
  Os cinco constam da lista final dos dezoito regimes próprios que adquiriram letras financeiras do banco.
  É a peça documental que converte dezoito decisões locais aparentemente independentes em uma operação
  única: o banco usava a carteira já conquistada como argumento de venda para o próximo comprador público.'
