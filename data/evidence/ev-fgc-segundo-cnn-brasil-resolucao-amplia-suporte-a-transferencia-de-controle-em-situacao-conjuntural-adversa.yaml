notes: Descrição do FGC reproduzida pelos veículos, que não são independentes entre si. O consolidado do BC
  marca como da 5.279 os incisos I a III do § 1º do art. 4º do estatuto (limites, encargos e operações
  subsidiadas diante de situação conjuntural adversa reconhecida pelo BC), sem usar a expressão "ampliação".
