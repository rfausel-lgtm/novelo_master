id: ev-fgc-segundo-cnn-brasil-resolucao-amplia-suporte-a-transferencia-de-controle-em-situacao-conjuntural-adversa
kind: evidence
classification: A
proposition: Segundo o FGC, na versão da CNN Brasil, entre as mudanças aprovadas pelo CMN em 22/01/2026 está a
  ampliação do suporte do fundo à transferência de controle ou de ativos e passivos de associadas, mediante
  reconhecimento de situação conjuntural adversa pelo BC; o Poder360 relata o mesmo conteúdo.
