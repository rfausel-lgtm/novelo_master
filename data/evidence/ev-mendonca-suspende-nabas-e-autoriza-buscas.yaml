excerpt: SUSPENDO, nos termos do art. 319, VI, do CPP, o Perito Criminal Federal JOÃO CLÁUDIO NABAS do exercício
  das funções públicas
attributed_to: Ministro André Mendonça, em decisão de 18/05/2026
date: '2026-05-18'
notes: Não há, até esta coleta, notícia do desfecho do inquérito nem confirmação pública de que a busca e
  apreensão foi cumprida.
