id: ev-mendonca-suspende-nabas-e-autoriza-buscas
kind: evidence
classification: D
proposition: 'Em 18/05/2026, André Mendonça, acolhendo a representação da PF e o parecer da PGR, suspendeu João
  Cláudio Nabas do exercício da função de Perito Criminal Federal, deferiu busca e apreensão domiciliar,
  pessoal, profissional e veicular, proibiu contato dele com servidores e policiais federais e acesso às
  dependências da PF, e afastou o sigilo telemático de sua conta Google (dados cadastrais, logs de acesso e
  conteúdo armazenado, no período de 1º/11/2025 até o cumprimento da ordem).'
