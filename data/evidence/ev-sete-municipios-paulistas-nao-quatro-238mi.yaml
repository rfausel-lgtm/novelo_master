proposition: 'A representação do MPC-SP sobre RPPS expostos ao Banco Master cobre SETE municípios paulistas,
  não quatro: Araras, Cajamar, Santo Antônio de Posse, Santa Rita d''Oeste (já citados no corpus), mais
  São Roque (R$ 93,15 milhões, já mapeado separadamente), Brodowski (R$ 10 milhões em Letras Financeiras
  + R$ 5 milhões no Fundo Texas) e Fernão (R$ 3 milhões) — elevando a exposição total documentada pelo
  órgão de controle para R$ 238,15 milhões.'
