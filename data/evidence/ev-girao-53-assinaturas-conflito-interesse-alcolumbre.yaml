excerpt: conflito de interesses
date: '2026-08-24'
notes: Acusação de um parlamentar contra outro; a assessoria de Alcolumbre não a contestou, apenas disse
  que não comentaria. Distinta do episódio de 21/05/2026 (evt-2026-05-21-alcolumbre-cpmi-discricionaria),
  em que Alcolumbre justificou a não leitura do requerimento por critério regimental, sem que o corpus
  tenha reconciliado se ambos os episódios tratam do mesmo requerimento.
