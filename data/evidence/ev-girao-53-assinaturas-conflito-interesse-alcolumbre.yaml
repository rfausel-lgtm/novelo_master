id: ev-girao-53-assinaturas-conflito-interesse-alcolumbre
kind: evidence
classification: A
proposition: Em 24/08/2026, o senador Eduardo Girão (Novo-CE) declarou que Davi Alcolumbre barra a instalação
  da CPI do Banco Master no Senado por "conflito de interesses", afirmando ter reunido 53 assinaturas para
  o requerimento. Citou nominalmente Alberto Alcolumbre (conselheiro fiscal da Amprev, irmão do presidente
  do Senado) e Jocildo Silva Lemos (ex-presidente da Amprev, tesoureiro de campanha de Alcolumbre) como os
  vínculos que fundamentam a acusação.
