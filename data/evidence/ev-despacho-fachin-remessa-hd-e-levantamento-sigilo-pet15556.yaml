id: ev-despacho-fachin-remessa-hd-e-levantamento-sigilo-pet15556
kind: evidence
classification: D
proposition: Edson Fachin, presidente do STF, determinou em despacho de 10/09/2026, na PET 16.704, que André Mendonça
  remeta em HD próprio a todos os gabinetes os procedimentos da PET 15.556 e levante o sigilo dela, ressalvadas
  diligências pendentes cujo sigilo seja imprescindível.
