- src-metropoles-2026-09-10-fachin-derruba-sigilo-inquerito-master
date: '2026-09-10'
notes: Texto do despacho obtido e lido na íntegra pela equipe (PDF de 1 página, assinatura digital verificável pelo
  código 965E-0FFB-9B66-04F0 no portal de autenticação do STF). A ressalva sobre 'diligências cujo sigilo seja imprescindível'
  não especifica quais diligências são essas — o corpus não apurou o que, na prática, permanecerá sob sigilo após
  a medida.
