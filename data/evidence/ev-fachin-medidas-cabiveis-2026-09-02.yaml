proposition: 'Na abertura da 17ª Conferência Brasileiro-Ítalo-Espanhola de Direito Constitucional, em
  Brasília, o presidente do STF declarou: ''Nos próximos dias, concluída a análise necessária dos fatos
  e observados os procedimentos institucionais pertinentes, esta Presidência anunciará, no tempo devido
  e sem precipitação, as medidas cabíveis e necessárias''. Não especificou quais seriam essas medidas.'
