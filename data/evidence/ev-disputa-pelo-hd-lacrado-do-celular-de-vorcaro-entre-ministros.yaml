excerpt: referida cópia de segurança permanece lacrada e intocada até o presente momento, conforme faz prova
  o Lacre nº "B0003311945"
attributed_to: Ministros Alexandre de Moraes, Cristiano Zanin e Gilmar Mendes, em ofícios de 11/09/2026
date: '2026-09-11'
notes: 'Até esta coleta, não foi localizado despacho determinando o compartilhamento pedido; a Presidência
  intimou a PF, em 12/09, a informar em 24h sobre a custódia e o estado do material (ver despacho de 12/09 na
  Pet 16.704), sem decidir o mérito do pedido. ATUALIZAÇÃO (13/09/2026): o prazo de 24h venceu sem que os
  autos registrem qualquer ofício ou informação da Polícia Federal em resposta — nenhum dos andamentos
  datados de 13/09/2026 trata do assunto. A dois dias do julgamento de 15/09, a situação da cópia lacrada
  segue sem resposta oficial da PF sobre custódia e estado do material. CORREÇÃO/ATUALIZAÇÃO (13/09/2026, via
  imprensa): a reportagem indica que a PF de fato respondeu à intimação de Fachin — no domingo, informou ter
  plenas condições técnicas de fornecer cópias a todos os gabinetes sem comprometer a cadeia de custódia — mas
  essa resposta não constava, até a verificação direta desta sessão nos andamentos públicos, como juntada
  formal aos autos da Pet 16.704; pode ter sido comunicação por outro canal, ainda não protocolada, ou juntada
  após a verificação. NOVA ESCALADA (13/09/2026, à noite): mesmo com a PF sinalizando disposição de fornecer
  cópias, Zanin foi além do ofício e determinou formalmente que a PF entregasse a cópia ao seu gabinete até as
  23h de domingo (48h antes da sessão), argumentando que "não existe hierarquia entre os ministros do STF".
  Não verificado, até esta coleta, se a PF cumpriu esse prazo, nem por que Zanin agiu mesmo após a PF sinalizar
  disposição.'
