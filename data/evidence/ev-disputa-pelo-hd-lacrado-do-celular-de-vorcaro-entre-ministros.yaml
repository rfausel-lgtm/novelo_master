id: ev-disputa-pelo-hd-lacrado-do-celular-de-vorcaro-entre-ministros
kind: evidence
classification: D
proposition: 'A cópia de segurança dos dados extraídos do celular de Daniel Vorcaro (iPhone 17 Pro, Termo de
  Apreensão nº 4473731/2025, Laudo nº 4281/2026-SETEC/SR/PF/SP) foi entregue pela Polícia Federal ao gabinete
  de André Mendonça em 08/03/2026, lacrada (lacre nº B0003311945), e permanecia lacrada e intocada em 11/09/2026.
  Moraes, Zanin e Gilmar Mendes pediram, em ofícios separados do mesmo dia, que a mídia e sua indexação
  (Cellebrite/IPED) fossem compartilhadas com todos os gabinetes antes do julgamento de 15/09, argumentando que
  a defesa de Vorcaro já tem acesso ao mesmo material e que o lacre protege a cadeia de custódia do original,
  não da cópia.'
document_ids:
