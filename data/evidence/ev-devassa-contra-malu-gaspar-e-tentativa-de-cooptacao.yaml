id: ev-devassa-contra-malu-gaspar-e-tentativa-de-cooptacao
kind: evidence
classification: C
proposition: 'Entre março e abril de 2025, Daniel Vorcaro determinou levantamento de dados pessoais da
  jornalista Malu Gaspar, de O Globo, em razão de sua cobertura sobre o Banco Master: familiares, endereço,
  contas bancárias e informações veiculares. A execução é atribuída ao publicitário Thiago Miranda, que
  teria informado não ter encontrado nada comprometedor. Trecho atribuído a Vorcaro: ''Vamos ter que tentar
  pegar algo dessa mulher no pessoal''. Segundo mensagens reproduzidas pela CNN Brasil e pela Gazeta do
  Povo, Vorcaro e Miranda trataram de uma possível contratação dela (a CNN cita ''Luva de 1,5 mm e salário de
  120k''); as fontes lidas não registram que a proposta tenha chegado a ela nem resposta dela. Em outra
  mensagem, Vorcaro reclama que ela e o jornalista Lauro Jardim teriam reagido com mais intensidade após uma
  abordagem. Em 04/03/2026, Abraji (cuja nota nomeia Lauro Jardim), ANJ e Fenaj repudiaram, em termos gerais, as
  tentativas de intimidar jornalistas reveladas na operação. Em 02/07/2026, a ANJ repudiou especificamente o
  levantamento sobre Malu Gaspar, e a Abraji, ataques on-line contra ela após reportagem sobre conversas entre
  Alexandre de Moraes e Gabriel Galípolo. Apuração jornalística registra
  que quatro pessoas constam nominalmente da decisão como alvos de monitoramento, mas que o número total
  pode passar de vinte; entre os alvos há também funcionários das residências de Vorcaro, não identificados
  nominalmente.'
