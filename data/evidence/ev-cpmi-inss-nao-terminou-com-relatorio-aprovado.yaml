proposition: 'Tema conexo, útil para não confundir: a CPMI do INSS (distinta da CPMI do Master, nunca
  instalada) encerrou os trabalhos em 28/03/2026 ao fim do prazo de 180 dias, sem prorrogação — o STF
  (Plenário, MS 40.799, 26/03/2026) derrubou a liminar do relator Mendonça que a prorrogaria. O relatório
  final do deputado Alfredo Gaspar foi REJEITADO por 19 a 12 votos; um segundo relatório sequer foi votado.
  Isso já constava corretamente registrado no corpus (ev-relatorio-da-cpmi-do-inss-foi-rejeitado); reafirmado
  aqui com a fonte específica sobre a rejeição da prorrogação.'
