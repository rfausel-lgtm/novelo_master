id: ev-mendonca-autoriza-a-transferencia-de-vorcaro-para-a-superintendencia-da-pf-em-19-03-2026
kind: evidence
classification: C
proposition: Em 19/03/2026, o ministro André Mendonça autorizou a transferência de Daniel Vorcaro da
  Penitenciária Federal de Brasília para a Superintendência da PF em Brasília, e o Metrópoles registra que a
  mudança foi realizada no mesmo dia.
