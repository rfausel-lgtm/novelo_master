id: ev-andrei-permanece-no-cargo-mas-sua-permanencia-sera-apreciada-por-fachin
kind: evidence
classification: D
proposition: 'A divergência entre coberturas se resolve porque as duas estavam metade certas. A liminar
  suspendeu o afastamento, de modo que o diretor-geral da Polícia Federal permanece no cargo — não por
  força da decisão de Dino, também suspensa, mas da liminar da Presidência. Sua permanência, porém, não
  está assegurada: foi intimado a, ''em 48 (quarenta e oito) horas, querendo, prestar informações, prazo
  após o qual sua permanência na Direção-Geral da Polícia Federal, à luz do disposto no art. 33, parágrafo
  único da LOMAN, será apreciada por esta Presidência''. O prazo, contado de 09/09, vence antes da sessão
  de 15/09. O diretor de Inteligência Policial é alcançado pela suspensão, mas não é mencionado no comando
  de intimação.'
