id: ev-cmn-res-5295-cronograma-escalonado-da-alocacao-em-titulos-publicos-de-julho-de-2026-a-julho-de-2028
kind: evidence
classification: D
proposition: Segundo o texto consolidado da Resolução CMN 4.222 na redação dada pela Resolução CMN 5.295, o
  montante a alocar em títulos públicos federais quando a condição for o Ativo de Referência é calculado com
  fatores de 0,05 a partir de 1º de julho de 2026, 0,15 a partir de 1º de janeiro de 2027, 0,30 a partir de 1º
  de julho de 2027, 0,60 a partir de 1º de janeiro de 2028 e 1 a partir de 1º de julho de 2028, aplicados
  sobre a diferença entre o Valor de Referência e o Ativo de Referência.
