locator: art. 2º-B, § 3º-B, II, alíneas a a e
date: 2026-04-23
notes: O Folhapress/Diário do Comércio descreve o mesmo escalonamento em percentuais, associando o primeiro
  degrau (5%) ao início da vigência, em 1º de junho; o PDF fixa 1º de julho de 2026 para o primeiro fator, e
  prevalece.
