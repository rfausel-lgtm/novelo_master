id: ev-taxa-do-amapa-era-o-teto-da-emissao-do-master
kind: evidence
classification: D
proposition: 'A taxa que a Amapá Previdência aceitou — IPCA + 8,35% ao ano — é exatamente o teto da faixa
  de emissão declarada pelo banco em suas demonstrações financeiras de 2024: ''taxa prefixada entre 6,5%
  e 8,35%''. Em 2023 o teto era 8,00%. O Amapá não pagou uma taxa alta dentro do intervalo: pagou o limite
  superior do que o banco emitiu em todo o exercício. As demonstrações registram ainda que, no pós-fixado,
  a faixa abriu de um ponto único de 115% do CDI em 2023 para ''entre 115% e 150% do CDI'' em 2024.'
