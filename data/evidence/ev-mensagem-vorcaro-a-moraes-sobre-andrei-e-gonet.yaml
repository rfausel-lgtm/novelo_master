proposition: 'Texto integral da nota escrita por Vorcaro em 30/10/2025 e enviada, segundo a metodologia
  da PF, ao contato ''Alexandre de Moraes BRASILIA'': ''É importante reforçar com Andrei e Paulo pra nao
  deixar ninguem de baixo fazer uma sacanagem que ai vai tudo pro saco. Estou disponivel pra tratar e
  explicar qq coisa, so nao pode ter sacanagem. Vou te mandar os nomes que tem ido ao Bacen alegando que
  farao algo em breve''. A última frase, ausente das versões publicadas pela imprensa, liga a nota à mensagem
  seguinte, enviada seis minutos depois, com a lista de nomes. O laudo registra a sequência de sistema
  (abertura do Bloco de Notas às 16:28 UTC, captura às 16:32:31, envio às 16:33:03 UTC), não o conteúdo
  recebido pelo destinatário.'
