id: ev-parana-instaura-processo-sancionatorio-contra-pkl-one
kind: evidence
classification: D
proposition: 'O Paraná é o único estado com apuração formal publicada contra a operadora, nominando o
  produto. A resolução de 04/05/2026 instaura processo sancionatório imputando ''efetuar cobrança indevida
  ao consignado'' e ''agir em prejuízo do consignado ou da Administração Pública'', com base em dispositivos
  que obrigam a devolver em cinco dias úteis valores cobrados a maior e a oferecer forma alternativa de
  pagamento quando o desconto é suspenso. Ressalva registrada: no dia seguinte foi instaurado processo
  idêntico contra outro cartão de benefício, de modo que a medida integra uma leva de fiscalização.'
