proposition: O SBT News (apuração própria) e o Estadão (publicado pelo Jornal de Brasília) identificam o
  perito criminal federal João Cláudio Nabas como o alvo da operação de 19/05/2026; a nota do STF e o Band não
  nomeiam o investigado.
