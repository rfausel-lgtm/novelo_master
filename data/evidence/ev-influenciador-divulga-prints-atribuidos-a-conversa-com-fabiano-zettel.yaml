date: 2026-10-16
notes: Fonte partidária; prints não autenticados e não checados por veículo de apuração própria localizado até
  17/10/2026. O texto dos prints não é reproduzido. Vorcaro, Zettel e a empresa Super não se manifestaram nas
  fontes abertas.
