proposition: Em 16/10/2026, o influenciador Paulo Figueiredo divulgou nas redes sociais prints que atribui a
  uma conversa de WhatsApp com Fabiano Zettel e que, segundo Brasil 247, mencionariam um suposto contrato
  relacionado a Reinaldo Azevedo. A evidência registra só a divulgação, não a autenticidade nem o conteúdo dos
  prints.
