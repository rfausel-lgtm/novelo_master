id: ev-master-inflou-carteiras-24-bilhoes-antes-de-vender-ao-brb
kind: evidence
classification: A
proposition: Segundo documento da PF tornado público em abril de 2026, entre julho de 2024 e janeiro de 2025 o Banco
  Master vendeu ao BRB carteiras de crédito com valor contábil de R$ 7,5 bilhões por R$ 9,9 bilhões — ágio de R$
  2,4 bilhões, cerca de 32% — com carteiras individuais infladas em até 93% acima do valor contábil, sob pressão
  de Daniel Vorcaro para obter recursos do banco estatal antes da formalização pública da compra, segundo mensagens
  de seu celular citadas na apuração.
