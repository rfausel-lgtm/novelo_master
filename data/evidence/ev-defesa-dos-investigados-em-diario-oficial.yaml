id: ev-defesa-dos-investigados-em-diario-oficial
kind: evidence
classification: D
proposition: As únicas defesas conhecidas dos três investigados são anteriores à operação e constam de
  ata publicada no Diário Oficial. Interpelados sobre por que houve novas aplicações após o parecer do
  Ministério da Previdência, Jocildo Lemos respondeu que a deliberação de 19/07 não foi unânime — 'houve
  votação de três a dois' — e que o banco pagou os bônus semestrais; José Milton sustentou que a decisão
  vinha de estratégia anterior, aprovada 'na ordem de R$ 800 milhões em letras financeiras'; e Gláucio
  Maciel Bezerra, que votara contra, defendeu o colegiado afirmando que não havia indicativo de inadimplência
  nem descredenciamento do banco pelo Ministério.
