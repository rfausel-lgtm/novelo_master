id: ev-turma-do-kn-leitura-da-imprensa
kind: evidence
classification: A
proposition: >-
  Segundo o Metrópoles e a CNN Brasil (21/09/2026), mensagens de assessores de Daniel Vorcaro, em material
  extraído do celular do banqueiro pela Polícia Federal e enviado ao STF, referem-se ao desembargador Newton Ramos
  e à advogada Camilla Ramos como "Turma do KN"; as duas reportagens leem a sigla como referência ao ministro
  Kassio Nunes Marques, e o Times Brasil (23/09/2026) atribui essa leitura à Polícia Federal.
attributed_to: Metrópoles e CNN Brasil (leitura atribuída à PF pelo Times Brasil)
