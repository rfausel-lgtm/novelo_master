date: '2026-09-21'
notes: >-
  Nenhum documento acessível ao Novelo confirma a leitura "KN = Nunes Marques". O ministro não é parte do
  contrato e nega ter trocado mensagens com Vorcaro ou autorizado alguém a falar em seu nome. As mensagens são
  conteúdo privado, em material não público, e não são transcritas; registra-se apenas a existência e a
  atribuição.
