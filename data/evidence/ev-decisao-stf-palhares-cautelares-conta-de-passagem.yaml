id: ev-decisao-stf-palhares-cautelares-conta-de-passagem
kind: evidence
classification: D
proposition: 'A decisão da PET 15.556, lida integralmente pela equipe, dedica a Leonardo Augusto Furtado
  Palhares a seção I.7 (§§ 71-73) e o trata como investigado. Segundo o texto, ele ''atuou na formalização
  documental de instrumento contratual utilizado no contexto das tratativas mantidas entre integrantes
  do grupo investigado e o servidor público BELLINE SANTANA'', tendo assinado, na condição de administrador
  da Varajo, a proposta de contratação para ''suposto projeto de elaboração de estudo técnico relacionado
  à inserção de jovens no mercado financeiro'', o que ''conferiu aparência de legitimidade à contratação
  e possibilitou a utilização da pessoa jurídica como intermediária''. A petição da PF transcrita na decisão
  vai além: as vantagens indevidas mensais aos servidores do BC ocorriam ''principalmente, por meio da
  estrutura de lavagem de dinheiro orquestrada com o auxílio de LEONARDO AUGUSTO FURTADO PALHARES [...],
  pessoa jurídica cujas contas bancárias serviram como conta de passagem para os recebimentos ilícitos''.
  O dispositivo (item 107.3) impôs a ele proibição de contato com testemunhas e demais investigados, proibição
  de se ausentar do município de residência e do País com entrega do passaporte em 48 horas, e monitoração
  eletrônica por tornozeleira — ele NÃO foi preso. Ressalva de exatidão: parte da imprensa e agregadores
  descrevem sua situação como ''prisão domiciliar com tornozeleira'', o que não corresponde ao dispositivo,
  que não impôs recolhimento domiciliar.'
