id: ev-decisao-stf-ana-claudia-executou-e-explicou-lavagem
kind: evidence
classification: D
proposition: 'A decisão da PET 15.556, lida integralmente pela equipe, dedica a Ana Cláudia Queiroz de
  Paiva a seção I.8 (§§ 74-77). Segundo o texto, ela ''atuou na operacionalização de movimentações financeiras''
  e ''participava da realização e gestão de transferências financeiras destinadas a custear atividades
  desempenhadas por integrantes da estrutura informal conhecida como A Turma''. Dois pontos individualizam
  sua atuação: no § 37, é ela quem pergunta a Vorcaro ''Vai ser 1 mm como normalmente?'', recebe ''Sim''
  e executa a transferência de R$ 1 milhão para conta de empresa do chefe do grupo de intimidação; e no
  § 70 a decisão registra ''o detalhamento da lavagem de dinheiro feito por ANA CLÁUDIA a DANIEL VORCARO'',
  em que ela explica ''como fazem para que o pagamento não saia direto de VORCARO para BELLINE'', o servidor
  do Banco Central. O dispositivo (item 107.4) impôs a ela proibição de contato com testemunhas e investigados,
  proibição de deixar o município e o País com entrega do passaporte, e monitoração eletrônica por tornozeleira
  — ela não foi presa.'
