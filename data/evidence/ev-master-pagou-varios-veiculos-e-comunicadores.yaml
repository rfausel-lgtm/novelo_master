proposition: O Metrópoles não é caso isolado. Segundo apuração sobre as investigações, o Banco Master
  fez pagamentos a diversos veículos e comunicadores no período da crise, entre eles Ratinho, Léo Dias,
  o site O Bastidor, a Vero Notícias e a WF Comunicação. Investigadores examinam a hipótese de contratos
  de publicidade usados para outra finalidade — hipótese de trabalho da apuração, não conclusão.
