id: ev-judiciario-de-ms-consultou-a-base-do-banco-central-e-chegou-ao-mesmo-resultado
kind: evidence
classification: D
proposition: 'O Judiciário sul-mato-grossense fez, por iniciativa própria, a mesma verificação que a equipe
  registrou em lote anterior. A fundamentação preservada em acórdão de abril de 2026 informa o endereço
  consultado e o resultado: ''em consulta ao sítio eletrônico oficial da aludida autarquia (bcb.gov.br/meubc/encontreinstituicao),
  constata-se que a parte ré não compõe a lista de instituições financeiras''. A convergência entre a
  checagem jornalística e a judicial reforça o achado — e mostra que a informação estava disponível a
  qualquer consulta, inclusive à do ente público que credenciou a empresa.'
