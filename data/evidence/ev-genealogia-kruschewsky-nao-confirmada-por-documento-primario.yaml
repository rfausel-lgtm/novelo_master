id: ev-genealogia-kruschewsky-nao-confirmada-por-documento-primario
kind: evidence
classification: A
proposition: 'A alegação de que Eugênio de Souza Kruschewsky, sócio-administrador do escritório que recebeu
  R$ 54 milhões do Master, é primo de André Kruschewsky Lima, diretor jurídico do banco, e de que este
  o teria contratado, vem de reportagem — a equipe não leu documento primário (representação da PF ou
  peça de CPMI) que estabeleça a genealogia ou a autoria da contratação. Registrada como classe C, não
  D, por decisão editorial explícita: o vínculo é plausível e reportado por veículo profissional, mas
  não está documentalmente verificado pela equipe.'
