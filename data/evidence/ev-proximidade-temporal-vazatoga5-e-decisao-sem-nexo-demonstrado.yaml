inference_basis: Comparação entre datas verificadas no andamento processual público e a data de publicação
  da reportagem. A sequência temporal é objetiva; a atribuição de causa entre os dois eventos não é sustentada
  por nenhuma fonte localizada, e há explicação alternativa igualmente compatível.
