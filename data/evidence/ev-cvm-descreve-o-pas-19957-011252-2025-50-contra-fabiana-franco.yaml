id: ev-cvm-descreve-o-pas-19957-011252-2025-50-contra-fabiana-franco
kind: evidence
classification: D
proposition: Segundo a ata e a nota da CVM, o PAS 19957.011252/2025-50 foi instaurado pela Superintendência de
  Relações com Empresas, sem outros acusados, para apurar supostas irregularidades de Fabiana Franco, na
  qualidade de diretora financeira da Reag Investimentos S.A., pela não elaboração das demonstrações
  financeiras anuais completas de 2024 (possível infração ao art. 176 da Lei 6.404/1976) e dos formulários de
  informações trimestrais do 1º e 2º trimestres de 2025 (possível infração ao art. 31 da Resolução CVM
  80/2022); depois de citada, ela propôs pagar R$ 150.000,00 à CVM.
