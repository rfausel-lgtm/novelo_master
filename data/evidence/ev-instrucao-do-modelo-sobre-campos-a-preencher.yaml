id: ev-instrucao-do-modelo-sobre-campos-a-preencher
kind: evidence
classification: D
proposition: O próprio modelo do Ministério da Previdência traz, no rodapé, a instrução de que 'no Termo
  de Credenciamento estão destacados na cor branca os campos que necessitam de preenchimento por parte
  da Unidade Gestora do RPPS'. A linha sobreviveu no documento juntado aos autos — de modo que o documento
  assinado carrega, nele mesmo, a advertência de quais campos cabiam à autarquia preencher.
