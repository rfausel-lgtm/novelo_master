id: ev-felipe-cancado-vorcaro-casa-trancoso-localizada-drone
kind: evidence
classification: D
proposition: A PF identificou, em 13/01/2026, por sobrevoo de drone comparado a fotos públicas de
  Instagram, uma segunda casa de veraneio de Felipe Cançado Vorcaro no distrito de Trancoso, Porto Seguro
  (BA) — além do endereço já conhecido em Nova Lima (MG) —, e a PGR concordou em estender a busca e
  apreensão a esse imóvel.
