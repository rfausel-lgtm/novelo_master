notes: É vigilância policial sobre paradeiro/patrimônio para fins de cumprimento de mandado — não há
  alegação de ilícito associada às duas mulheres citadas nas fotos (Cláudia Resende Soares da Silva e
  Karina Resende Oliveira Vorcaro). O acervo registra apenas a localidade do imóvel (distrito/município),
  nunca endereço, coordenadas ou características que permitam sua identificação exata.
