proposition: Em entrevista de 08/09/2026 (mesma data desta apuração), Wagner atribuiu o escândalo do Master
  a Jair Bolsonaro e Roberto Campos Neto ('funcionou com o Banco Central de Bolsonaro, fechou com o Banco
  Central do Lula'), chamou Vorcaro de 'marginal', e afirmou que Vorcaro deu a Flávio Bolsonaro 'um presentão...
  foi setenta e tantos milhões' — cifra que se aproxima, em ordem de grandeza, do que já se sabia no corpus
  por outra via sobre o financiamento do filme 'Dark Horse' e a colaboração de Antonio Carlos Freixo Júnior
  ('Mineiro'), sem que Wagner cite essa fonte especificamente. Negou qualquer recurso da Bahia ou de fundo
  de previdência baiano aplicado no Master.
