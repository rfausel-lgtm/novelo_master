id: ev-escalada-verbal-contra-timerman-e-seu-advogado
kind: evidence
classification: D
proposition: 'Em 28/08/2024, após Vorcaro encaminhar a Mourão uma Notícia de Fato subscrita por Vladimir
  Timerman contra o fundo ESH Theta Master (endereçada ao Procurador-Chefe do MPF em São Paulo, por
  prevenção a outra notícia de fato envolvendo o Banco Máxima/Master), Mourão disse que se reuniria com
  "A Turma" e que "teriam que tomar uma medida mais drástica contra Vladimir". Vorcaro respondeu "E
  contra o advogado tb". Na sequência do mesmo diálogo, ao ser perguntado se poderia se reunir com "A
  Turma" naquele mesmo dia para alinhar a forma de atuação, Vorcaro respondeu que mandaria "A turma" a
  São Paulo para "matar esses negócios".'
