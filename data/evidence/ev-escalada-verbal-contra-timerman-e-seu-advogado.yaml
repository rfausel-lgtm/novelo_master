excerpt: teriam que tomar uma medida mais drástica contra Vladimir
date: '2024-08-28'
notes: 'O advogado mencionado não é identificado pelo nome no trecho analisado — o documento não permite
  afirmar se é o mesmo "Luis Francisco" citado alhures no acervo em conexão com Timerman e Woyceichoski,
  e por isso a atribuição não é feita aqui. A expressão "matar esses negócios" é lida no contexto de
  disputa processual (resolver, encerrar as pendências jurídicas) e não como ameaça de vida explícita —
  distinta, por isso, da frase "preciso matar esse cara" já registrada em evidência separada sobre outro
  episódio, de teor mais direto. Ainda assim, "medida mais drástica" chega logo depois de uma notícia-crime
  protocolada contra o grupo, e se soma ao padrão de resposta de Vorcaro a quem o processa ou investiga —
  o mesmo padrão documentado contra Woyceichoski, Leandro Garcia e o DJ de Miami. O documento não registra
  o que, na prática, "A Turma" fez em São Paulo depois desta conversa.'
