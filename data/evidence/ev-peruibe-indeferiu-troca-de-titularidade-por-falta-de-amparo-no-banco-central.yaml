id: ev-peruibe-indeferiu-troca-de-titularidade-por-falta-de-amparo-no-banco-central
kind: evidence
classification: D
proposition: Único ato municipal paulista posterior à liquidação que trata diretamente do banco, e é um
  indeferimento com fundamento expresso. O município negou requerimento de troca de titularidade de conta
  corrente em operação de crédito consignado firmada entre o Banco de Brasília e o Banco Master, 'diante
  da inexistência de amparo legal e regulamentar junto ao Banco Central do Brasil, bem como em razão dos
  riscos identificados ao erário público e à segurança financeira dos servidores municipais'.
