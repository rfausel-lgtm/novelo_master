excerpt: O senador estava no Amapá, soube do caso pela imprensa, e o dinheiro seria relativo à atividade
  profissional do irmão.
date: '2022-03-25'
notes: 'Não é documento cartorial (certidão, TSE) — é uma manifestação institucional do gabinete do senador,
  replicada por dois veículos editorialmente independentes (CNN Brasil e Metrópoles), num contexto (apreensão
  policial de dinheiro) totalmente alheio ao Master, o que reduz a hipótese de fabricação para fins da
  narrativa atual. Fica como confirmação institucional reforçada, não como prova documental definitiva —
  o open_question sobre certidão/documento oficial permanece.'
