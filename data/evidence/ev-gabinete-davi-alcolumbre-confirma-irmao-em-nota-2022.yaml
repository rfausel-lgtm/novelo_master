id: ev-gabinete-davi-alcolumbre-confirma-irmao-em-nota-2022
kind: evidence
classification: C
proposition: 'Em março de 2022, por ocasião da apreensão policial de cerca de R$ 500 mil pertencentes a
  Alberto Samuel Alcolumbre Tobelem em São Paulo, o próprio gabinete/assessoria do senador Davi Alcolumbre,
  provocado pela imprensa, confirmou institucionalmente o parentesco, referindo-se a Alberto Samuel como
  "o irmão" do senador — manifestação contemporânea ao fato e independente da cobertura de 2026 sobre o
  Banco Master/Amprev.'
