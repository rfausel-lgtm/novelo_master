id: ev-no-rio-grande-do-norte-o-credenciamento-antecedeu-a-margem-em-dez-meses
kind: evidence
classification: D
proposition: 'No Rio Grande do Norte a sequência se inverte de forma nítida e documentada: a empresa foi
  credenciada em 19/07/2022, e a margem exclusiva de 10% para cartão de benefício só foi criada por decreto
  de 31/05/2023 — dez meses depois. O termo de adesão descreve o objeto como ''credenciamento de instituição
  financeira'', somando-se aos atos de Mato Grosso do Sul e de São Paulo que enquadram nessa categoria
  uma holding de instituições não financeiras. Assina pela empresa Andrea Lima Novaes, a mesma signatária
  dos instrumentos de Mato Grosso do Sul e de Itapissuma.'
