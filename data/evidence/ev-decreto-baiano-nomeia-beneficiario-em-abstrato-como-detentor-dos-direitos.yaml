id: ev-decreto-baiano-nomeia-beneficiario-em-abstrato-como-detentor-dos-direitos
kind: evidence
classification: D
proposition: 'A peculiaridade jurídica que organiza todo o caso está no art. 3º do decreto baiano: o beneficiário
  não é identificado por nome, mas por uma qualidade contratual — ''o detentor dos direitos de exploração
  comercial relativos ao Cartão do Programa Credicesta'' —, a quem se assegura diversificar as funcionalidades
  do cartão e associar-lhe ''a contratação de serviços, inclusive comerciais, creditícios, financeiros,
  securitários e congêneres''. O art. 13 estende a esse detentor os direitos e deveres do decreto. Assinado
  no dia do leilão, o ato produz efeitos para quem viesse a adquirir os direitos, sem que fosse preciso
  nomeá-lo. É essa cláusula que converte um cartão de mercearia estatal em plataforma de crédito, seguro
  e saque — e é ela que os contratos posteriores reproduzem palavra por palavra.'
