id: ev-estadao-relata-mensagens-sobre-contrato-de-12-meses-com-gabriela-prioli
kind: evidence
classification: A
proposition: Segundo o Estadão (16/10/2026), mensagens extraídas do celular de Daniel Vorcaro indicariam que
  Gabriela Prioli gravou vídeos em defesa do Banco Master sob contrato de 12 meses, com roteiros submetidos à
  aprovação do banqueiro, e mostram a então superintendente de Comunicação e Marketing do banco, Ana Matos,
  relatando a assinatura do contrato; os diálogos não revelam o valor pago.
