id: ev-voto-20-2019-rejeita-transferencia-de-controle
classification: C
proposition: Em fevereiro de 2019 o Banco Central indeferiu o pedido de transferência do controle do Banco
  Máxima a Daniel Vorcaro, por falta de comprovação da origem dos recursos e da capacidade econômica e
  financeira dos pretendentes.
