id: ev-stf-are-1327995-impedimento-afastado-e-votos-de-2024-e-2025
kind: evidence
classification: D
proposition: >-
  No ARE 1.327.995 (União x Destilaria Alcidia S.A.), relator Edson Fachin, o portal do STF registra que a 2ª
  Turma suspendeu o julgamento do agravo regimental em 21/02/2024 por empate, com o registro "Impedido o
  Ministro Nunes Marques"; que em 07/03/2024 Nunes Marques despachou afastando o impedimento lançado no sistema;
  que em 17/09/2024 ele pediu vista; que em 01/10/2024 a Turma negou provimento ao agravo da União, por maioria,
  vencidos André Mendonça e Gilmar Mendes; e que em 03/06/2025 rejeitou os embargos da União, por maioria,
  vencidos Gilmar Mendes e André Mendonça, com trânsito em julgado em 10/10/2025.
document_ids:
- doc-2026-10-16-stf-andamentos-do-are-1327995-uniao-x-destilaria-alcidia
source_ids:
