excerpt: Afasto o impedimento lançado no sistema, declarando-me habilitado a votar.
locator: Andamento de 07/03/2024 (despacho)
date: '2024-03-07'
notes: >-
  O portal não nomeia os ministros que formaram a maioria e não menciona o Banco Master. O andamento é compatível
  com a descrição feita pelo próprio ministro em sua nota de 21/09/2026 (impedimento por anotação da Secretaria,
  depois retificado). É processo distinto do ARE 1.312.127.
