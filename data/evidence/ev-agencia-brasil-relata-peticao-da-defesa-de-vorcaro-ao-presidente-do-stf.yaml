id: ev-agencia-brasil-relata-peticao-da-defesa-de-vorcaro-ao-presidente-do-stf
kind: evidence
classification: A
proposition: Segundo a Agência Brasil (16/10/2026), a defesa de Daniel Vorcaro enviou petição ao STF,
  endereçada ao presidente Edson Fachin, para solicitar a abertura de investigação sobre o vazamento de
  conversas privadas ligadas às investigações do caso Master; afirmou que ele sofre um "processo de
  linchamento público" e que as conversas divulgadas não podem resultar em investigações contra ele, sendo a
  "única repercussão jurídica" a instauração de inquérito para averiguar os responsáveis.
