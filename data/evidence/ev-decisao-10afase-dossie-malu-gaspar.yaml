id: ev-decisao-10afase-dossie-malu-gaspar
kind: evidence
classification: D
proposition: Segundo a decisão (PET 16.346, §§30-37), diálogos entre Vorcaro e Thiago Miranda evidenciam
  estratégia de acompanhamento da atividade profissional da jornalista Malu Gaspar (O Globo), com 'constante
  levantamento de informações de natureza pessoal, profissional e patrimonial' — estimativa de renda,
  operações de cartão de crédito, movimentações bancárias, estrutura familiar (filhos) e dados do veículo.
  A PF aponta o uso da plataforma 'NEXTBUSCAS.PRO', associada a esquemas de venda não autorizada de dados
  pessoais sigilosos.
