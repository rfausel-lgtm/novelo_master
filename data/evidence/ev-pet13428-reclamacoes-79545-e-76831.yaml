notes: 'A decisão não identifica a parte da Reclamação 76.831. Um dos parágrafos (43) lista, entre o que só os
  aparelhos do deputado podem revelar, a identidade de interlocutores com quem ele disse ter tratado do tema —
  a própria PF a trata como desconhecida, e o acervo não faz nenhuma identificação. Registrar que um ministro
  foi apontado como destinatário de memorial ou de pedido não afirma que ele o tenha recebido ou atendido:
  ver ev-pet13428-delimitacao-negativa-ministros.'
