proposition: 'Segundo a representação da PF transcrita na Pet 13.428: (1) na Reclamação 79.545, da prefeita de
  Beberibe/CE Michele Cariello de Sá Queiroz Rocha contra investigação do MP-CE (relator Nunes Marques), foi
  firmado contrato entre Daniel Menezes Advocacia e a sociedade de Mariângela Fialek com honorários de R$ 500
  mil "pagos após o julgamento"; em 18/06/2025, perguntado por Fialek se havia despachado, o deputado Cezinha
  de Madureira respondeu "Despachei sim / Ontem"; (2) em 12/06/2025, ao receber memoriais da Reclamação 76.831
  com a advertência "esse pedir vista", o deputado escreveu que o ministro Kassio Nunes Marques o atenderia
  por vídeo às 16h ("Ai vou pedi a ele"); (3) em 18/06/2025, Fialek enviou-lhe três memoriais da Reclamação
  76.831 nominalmente endereçados aos ministros Nunes Marques, André Mendonça e Gilmar Mendes, subscritos por
  ela após receber substabelecimento de outro advogado no mesmo dia em que os documentos passaram a ser
  remetidos ao parlamentar. A PF lê as expressões como compromisso de "formular pedido pessoal e direto ao
  julgador".'
