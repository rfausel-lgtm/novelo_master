id: ev-pf-representa-flavio-bolsonaro-por-lavagem-evasao-corrupcao-dark-horse
kind: evidence
classification: A
proposition: 'A Polícia Federal representa, em petição vinculada ao INQ 5.026, pela apuração de lavagem de
  dinheiro (Lei 9.613/98), evasão de divisas (art. 22, Lei 7.492/86), corrupção passiva e ativa (arts. 317 e
  333, CP) e organização criminosa (Lei 12.850/2013) no financiamento internacional do filme "Dark Horse",
  citando o senador Flávio Bolsonaro como interlocutor direto de Daniel Vorcaro em tratativas sobre os
  aportes — não apenas como terceiro mencionado por outros —, com cobranças de pagamento, reuniões presenciais
  e acompanhamento das gravações. André Mendonça autorizou a instauração do procedimento em 22/07/2026, com
  anuência da PGR; hoje tramita como INQ 5.070.'
