id: ev-plenario-do-stf-decide-em-15-09-se-autoriza-investigacao-contra-moraes
kind: evidence
classification: C
proposition: 'A sessão extraordinária convocada para 15/09/2026, às 10h, presencial, tem alcance inédito:
  o Plenário decidirá se autoriza a abertura de investigação contra Alexandre de Moraes, a pedido de André
  Mendonça — o que, segundo a cobertura, seria a primeira vez que o colegiado delibera sobre abrir inquérito
  contra um de seus próprios integrantes. O objeto da suspeita é o relatório preliminar da Polícia Federal,
  de 218 páginas, produzido sobre o material do celular de Daniel Vorcaro, que indica ter o banqueiro
  consultado o ministro durante investigação sobre fraude bancária. Registre-se, para precisão, que parte
  da cobertura descreve a mesma sessão como destinada a resolver as decisões conflitantes sobre o comando
  da Polícia Federal; se são dois itens da mesma pauta ou matérias distintas, o acervo ainda não estabeleceu.
  CORREÇÃO, a partir da leitura da pauta oficial e da íntegra da convocação: a sessão tem um único item,
  a Petição 16.662, e a controvérsia sobre o comando da Polícia Federal NÃO está nela — migrou para a
  suspensão de liminar, de competência exclusiva da Presidência. Corrige-se também o enunciado: nenhum
  ato oficial emprega a fórmula ''autorizar investigação contra o ministro''; o objeto formal é apreciar
  a petição e os novos elementos trazidos pela autoridade policial. A formulação corrente é moldura de
  imprensa.'
