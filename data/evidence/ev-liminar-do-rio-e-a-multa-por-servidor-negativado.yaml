id: ev-liminar-do-rio-e-a-multa-por-servidor-negativado
kind: evidence
classification: D
proposition: 'A liminar concedida no Rio tem a mesma arquitetura da do Amapá: autoriza a retenção dos
  repasses de empréstimos descontados em folha, com provisionamento em conta específica e prestação de
  contas a cada noventa dias, e proíbe os réus de qualquer medida constritiva contra servidores, aposentados
  e pensionistas — inclusive negativação e protesto. A diferença está na sanção: no Rio, multa de R$ 50.000,00
  por servidor indevidamente negativado; no Amapá, multa diária de R$ 100 mil limitada a R$ 200 milhões.'
