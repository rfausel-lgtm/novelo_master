date: '2026-01-21'
notes: 'Os requerimentos registram que foram enviados ofícios ao Ministério Público e à Polícia Civil do Paraná. O
  acervo não localizou resultado dessas apurações. A exploração de jogos no resort é fato noticiado, não apurado.'
