id: ev-cpi-convocou-irmaos-de-toffoli-por-cassino-relatado-no-tayaya
kind: evidence
classification: D
proposition: Os Requerimentos 140 e 143/2026 da CPI do Crime Organizado, assinados pelo senador Magno Malta e outros,
  convocaram José Eugênio e José Carlos Dias Toffoli com base em reportagem do Metrópoles de 21/01/2026 sobre possível
  exploração de jogos de azar no Resort Tayayá — apostas em dinheiro, "dealers", sem controle de acesso e com crianças
  no ambiente —, pedindo a oitiva dos atuais e antigos proprietários e administradores do resort.
document_ids:
