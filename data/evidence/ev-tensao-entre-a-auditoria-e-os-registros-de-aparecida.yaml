id: ev-tensao-entre-a-auditoria-e-os-registros-de-aparecida
kind: evidence
classification: I
proposition: 'A auditoria do Ministério da Previdência, segundo reportagem, teria identificado em Aparecida
  de Goiânia o mesmo modelo de justificativa de credenciamento encontrado no Amapá, em Itaguaí e em Congonhas.
  Mas o parecer de credenciamento do Banco Master nunca foi publicado pelo instituto — a varredura do
  acervo público do site não retorna nenhum documento além do logotipo do banco —, e a própria autarquia
  afirma que não existe documento formal de aprovação da operação. As duas afirmações não são necessariamente
  incompatíveis: o modelo pode constar de peça de credenciamento não publicada, distinta do parecer de
  aprovação do investimento. Mas a tensão precisa ser registrada enquanto o relatório de auditoria não
  for lido.'
document_ids: []
source_ids:
- src-camara-aparecida-2025-12-08-audiencia
inference_basis: 'Cotejo entre a descrição da auditoria em reportagem especializada, que nomeia Aparecida
  de Goiânia entre os entes com justificativa idêntica, e dois elementos verificados: a ausência de qualquer
  parecer do Banco Master no acervo público do instituto e a declaração da própria direção, em audiência
  legislativa, de que não houve documento formal de aprovação.'
