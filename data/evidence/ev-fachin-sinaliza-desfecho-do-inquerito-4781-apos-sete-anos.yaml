proposition: 'Mais do que trocar o relator, a decisão sinaliza um desfecho. O presidente do tribunal comunicou
  que, após análise, remeterá os autos à autoridade policial e à Procuradoria-Geral da República para
  ''oferecimento da denúncia ou requerimento do arquivamento''. É o encaminhamento que encerra um inquérito:
  ou vira ação penal, ou é arquivado. O procedimento estava aberto desde março de 2019, e nenhum prazo
  foi fixado para essa análise.'
