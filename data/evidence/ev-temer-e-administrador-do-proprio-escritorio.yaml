id: ev-temer-e-administrador-do-proprio-escritorio
kind: evidence
classification: D
proposition: O registro cadastral da Receita Federal, consultado pela equipe, confirma que Michel Miguel
  Elias Temer Lulia — nome civil completo do ex-presidente da República — consta como sócio-administrador
  da Temer Advogados Associados, e não apenas como sócio de capital ou figura honorária. É o próprio ex-presidente
  quem administra o escritório contratado pelo Banco Master.
