id: ev-uol-textos-do-metropoles-enviados-previamente-a-vorcaro
kind: evidence
classification: A
proposition: Segundo levantamento do UOL (15/10/2026) em mensagens extraídas pela PF do celular de Daniel
  Vorcaro, ao menos 14 textos do Metrópoles foram enviados previamente a ele, 11 foram alterados após pedidos
  dele e duas reportagens foram publicadas a pedido dele, entre 2024 e 17/11/2025, numa interlocução direta
  com a CEO Lilian Tahan; depois de reclamação dele sobre uma informação publicada, em 02/04/2025, ela
  respondeu "Tiramos".
