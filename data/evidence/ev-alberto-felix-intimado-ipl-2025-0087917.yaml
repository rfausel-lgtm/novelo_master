proposition: 'Em 12/06/2026, o STF autorizou o deslocamento de Alberto Felix de Oliveira Neto a Brasília,
  em 16/06/2026, para prestar declarações no inquérito policial nº 2025.0087917-SR/PF/DF, no qual figura
  como investigado — inquérito distinto e ainda não identificado no acervo. A mesma decisão estendeu a
  autorização de deslocamento a "os demais investigados com medidas pessoais restritivas de liberdade" no
  âmbito do INQ 5.026.'
