id: ev-estrutura-pagamento-mensal-1-milhao-turma-e-meninos
kind: evidence
classification: D
proposition: Segundo mensagem de WhatsApp de Luiz Phillipi Mourão a Daniel Vorcaro, transcrita na decisão
  de 13/05/2026, Vorcaro repassava R$ 1 milhão mensal a Mourão, que o dividia em R$ 400 mil para o núcleo
  "A Turma" (repassados a Marilson Roseno da Silva) e R$ 75 mil para cada um de seis integrantes do núcleo
  "Os Meninos" (incluindo o próprio Mourão, "o DCM e mais dois editores"), além de bônus eventuais.
