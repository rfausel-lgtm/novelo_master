id: ev-tirreno-ata-antedatada-peretto-seixas-maia
kind: evidence
classification: A
proposition: Henrique Peretto encaminhou a André Seixas Maia, em 17/04/2025, uma ata de assembleia
  extraordinária da Tirreno supostamente realizada em 02/12/2024 — mas o registro da empresa na JUCESP só
  foi homologado em 15/04/2025, dois dias antes; a autoridade policial trata o hiato como indício de
  documento fabricado a posteriori para simular formalização anterior.
document_ids:
- doc-2026-06-22-decisao-pet15478-sigilo-tirreno-brb
source_ids:
