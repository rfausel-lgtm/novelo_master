attributed_to: Autoridade policial, encampada pelo MPF e citada na decisão de André Mendonça
date: '2025-04-17'
notes: 'O acervo já tinha os mesmos marcos temporais da cadeia societária da Tirreno (constituição
  04/11/2024 sob o nome SX 016, renomeação 02/12/2024, contrato com o Master 05/12/2024, Seixas Maia
  assume a direção em 15/04/2025 — ver tirreno.yaml, lote 219), tratados até aqui como sequência
  relativamente linear. Esta peça acrescenta a suspeita processual explícita de antedatação documental e
  estabelece, pela primeira vez, um elo operacional direto entre Peretto e o aparato documental da
  Tirreno — até aqui ele só aparecia ligado à Cartos, com a autoria da Tirreno sendo atribuição disputada
  (e tida por falsa pelo Poder360) feita por Daniel Vorcaro. Tratar como alegação da fase investigativa,
  não fato apurado.'
