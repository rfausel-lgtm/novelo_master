date: '2024-10-07'
notes: 'O autor do perfil falso "@marthagraeff6666" não foi identificado no documento — o alvo da
  investigação de Vorcaro era descobrir quem o criara, não a própria Martha Graeff, que aparece apenas
  como pessoa cujos dados foram usados sem que se afirme qualquer participação dela nos fatos. "Alexandre
  Knuz" é citado apenas de passagem, como um crítico cujo perfil foi derrubado; o corpus não tem mais
  informações sobre ele e não se cria registro dedicado a partir de uma única menção lateral.'
