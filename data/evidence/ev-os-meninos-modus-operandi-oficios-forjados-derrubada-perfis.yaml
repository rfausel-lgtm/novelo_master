id: ev-os-meninos-modus-operandi-oficios-forjados-derrubada-perfis
kind: evidence
classification: D
proposition: 'Além de invadir dispositivos e contas na nuvem, o núcleo "Os Meninos" derrubava perfis de
  redes sociais de críticos de Daniel Vorcaro por meio de ofícios forjados, com aparência de terem sido
  emitidos por autoridades públicas, enviados aos canais de Law Enforcement Information Request das
  próprias plataformas — além de DDoS e robôs contra notícias desfavoráveis. Exemplos documentados: em
  07/10/2024, Daniel Bueno Vorcaro pediu a Felipe Mourão que derrubasse o perfil @marthagraeff6666, um
  perfil falso que usava dados de sua namorada Martha Graeff para se aproximar de sua filha ("Esse filha
  da puta quero achar nem que seja no inferno") — a conta foi banida dois dias depois, via ofício forjado
  do MP-CE (episódio já registrado no perfil de Nayara Maria Dias Albuquerque de Sá); e a derrubada do
  Instagram do perfil @alexandreknuz, que criticava um evento do Banco Master em Londres.'
document_ids:
