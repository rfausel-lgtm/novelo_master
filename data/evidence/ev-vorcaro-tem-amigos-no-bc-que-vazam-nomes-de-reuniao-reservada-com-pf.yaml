id: ev-vorcaro-tem-amigos-no-bc-que-vazam-nomes-de-reuniao-reservada-com-pf
kind: evidence
classification: D
proposition: Daniel Vorcaro registrou em seu celular, em 21/10/2025, os nomes dos representantes da Polícia Federal
  que participaram de uma reunião reservada com o Banco Central em 17/10/2025 (entre eles o DPF Dennis Cali, diretor
  de Investigação e Combate ao Crime Organizado e à Corrupção), atribuindo a informação a 'amigos' dentro do Bacen
  que teriam participado da reunião e que ele não poderia 'queimar'.
