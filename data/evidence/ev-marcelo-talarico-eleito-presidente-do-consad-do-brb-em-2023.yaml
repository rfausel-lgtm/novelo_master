id: ev-marcelo-talarico-eleito-presidente-do-consad-do-brb-em-2023
kind: evidence
classification: D
proposition: >-
  Marcelo Talarico foi eleito, por unanimidade, presidente do Conselho de Administração do BRB na 802ª Reunião
  Ordinária de 30/01/2023.
document_ids:
- doc-2023-01-30-brb-extrato-ata-802-consad-eleicao-do-presidente
source_ids:
