excerpt: resultando eleito, por unanimidade, o senhor Marcelo Talarico
locator: Item 02 do extrato da ata (art. 24, §1º do Estatuto)
date: '2023-01-30'
notes: >-
  A ata prova apenas a eleição de 30/01/2023; o Metrópoles (13/01/2026) afirma que ele presidia o conselho
  "desde 2022", divergência não reconciliada. A renúncia, com efeito imediato, vem do fato relevante do BRB de
  28/01/2026 noticiado pelo Money Times (classe A) e não integra esta evidência.
