id: ev-so-o-seguro-prestamista-remunerava-o-correspondente-do-credcesta
kind: evidence
classification: D
proposition: 'A página de ajuda do próprio operador descreve o incentivo econômico de quem vendia o produto
  na ponta: o seguro de vida oferecido com o cartão ''não é passível de remuneração para o Correspondente'',
  ao passo que o seguro prestamista ''é passível de comissão para o Correspondente'', com ativação no
  momento da contratação. Um dos seguros pagava comissão e o outro não — desenho que orienta a oferta
  e que dialoga com as reclamações de servidores sobre contratação de itens não solicitados. A mesma página
  informa que o cartão não admitia portabilidade para outra instituição, o que dificultava a saída.'
