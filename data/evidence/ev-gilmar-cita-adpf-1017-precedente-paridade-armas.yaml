id: ev-gilmar-cita-adpf-1017-precedente-paridade-armas
kind: evidence
classification: D
proposition: 'No voto de vista de 08/09/2026, Gilmar Mendes invoca como terceira razão jurídica o precedente
  vinculante da ADPF 1.017/AL, "na qual o Plenário assentou, em razão da paridade de armas e do dever de
  neutralidade do Estado em relação aos partidos políticos e candidatos, a inconstitucionalidade de decisões
  jurisdicionais tendentes a promover o desequilíbrio da disputa político-eleitoral" — usado para reforçar
  a crítica de que a medida partiu de provocação de partido político (Partido Novo).'
