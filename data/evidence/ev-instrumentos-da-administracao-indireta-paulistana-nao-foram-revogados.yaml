id: ev-instrumentos-da-administracao-indireta-paulistana-nao-foram-revogados
kind: evidence
classification: D
proposition: O descredenciamento de agosto de 2026 alcançou a secretaria municipal de gestão, mas não
  os instrumentos firmados por entidades da administração indireta da capital. O serviço funerário autorizou
  consignação em 2023; o hospital do servidor credenciou a operadora para cartão benefício em 2023 e novamente
  para empréstimo consignado em março de 2025, e deferiu credenciamento ao próprio banco em abril de 2025
  — sete meses antes da liquidação. Para nenhum deles se localizou ato de revogação. Enquanto isso, a
  ata do conselho deliberativo do instituto de previdência municipal, de janeiro de 2026, registra que
  os descontos seguiam sendo feitos e depositados 'enquanto a situação judicial do banco é regularizada'.
