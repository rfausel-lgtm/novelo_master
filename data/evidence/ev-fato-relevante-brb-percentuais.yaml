id: ev-fato-relevante-brb-percentuais
kind: evidence
classification: D
proposition: O Fato Relevante do BRB registra a aprovação unânime, em 28/03/2025, da compra de 49% das
  ações ordinárias, 100% das preferenciais e 58% do capital total do Banco Master, sujeita à aprovação
  do Banco Central, do Cade e demais órgãos reguladores, com o objetivo de incorporar o Master ao conglomerado
  prudencial do banco público.
