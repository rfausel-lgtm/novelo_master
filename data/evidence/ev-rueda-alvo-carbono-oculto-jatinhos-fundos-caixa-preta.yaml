date: '2025-09-17'
notes: 'Frente distinta da acusação de comissão de 10% sobre aportes de RPPS no Banco Master (delação de
  Vorcaro, 10/09/2026) — aqui a suspeita é de patrimônio oculto ligado ao esquema de combustíveis do PCC,
  sem relação direta estabelecida com o caso Master, exceto a coincidência da mesma pessoa (Rueda) e da
  Trustee DTVM (ligada a Maurício Quadrado, ex-sócio de Vorcaro) ter aparecido em fase anterior da mesma
  Carbono Oculto — sem que o corpus tenha encontrado elo documental entre a Trustee e os fundos aqui citados
  (Bariloche, Viena). Até setembro de 2026, sem oitiva, indiciamento, denúncia ou arquivamento contra Rueda
  nesta frente.'
