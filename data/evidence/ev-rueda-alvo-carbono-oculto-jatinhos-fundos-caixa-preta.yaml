id: ev-rueda-alvo-carbono-oculto-jatinhos-fundos-caixa-preta
kind: evidence
classification: A
proposition: 'A PF investiga, na Operação Carbono Oculto, se Antônio Rueda é dono oculto de jatos executivos
  formalmente registrados em nome de terceiros e de fundos de investimento — o Fundo Bariloche e o Fundo
  Viena (gestora Genial), classificados por reportagem como "fundos caixa-preta". O piloto Mauro Caputti
  Mattosinho declarou à PF que Rueda seria dono oculto de 4 dos 10 jatos operados pela Táxi Aéreo Piracicaba
  (TAP): "Havia um clima de ''boom'' de crescimento na empresa. E isso foi justificado como sendo um grupo
  muito forte, encabeçado pelo Rueda, que vinha com muito dinheiro que precisava gastar". As mesmas
  aeronaves teriam sido usadas por Roberto Augusto Leme da Silva ("Beto Louco") e Mohamad Hussein Mourad
  ("Primo"), foragidos apontados como líderes do esquema de combustíveis do PCC apurado pela Carbono Oculto
  — o piloto diz tê-los transportado cerca de 30 vezes.'
