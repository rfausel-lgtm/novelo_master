date: '2026-10-02'
notes: >-
  O ofício de Fachin não foi localizado e a matéria não traz número. O Informe de 13/10/2026 cita um Ofício
  3467748, da mesma data, sem dizer quem o expediu; o Novelo não afirma se é o mesmo documento nem fixa o remetente.
