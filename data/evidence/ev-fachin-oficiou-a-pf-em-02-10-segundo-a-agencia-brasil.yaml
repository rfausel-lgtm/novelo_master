id: ev-fachin-oficiou-a-pf-em-02-10-segundo-a-agencia-brasil
kind: evidence
classification: A
proposition: >-
  Segundo a Agência Brasil, Edson Fachin enviou ofício à Polícia Federal em 02/10/2026 afirmando que, recebidas as
  informações, "sem exceção de pessoa, os fatos correlatos, serão dados os encaminhamentos devidos", e a reunião
  com o diretor-geral foi prevista para 13/10/2026.
source_ids:
