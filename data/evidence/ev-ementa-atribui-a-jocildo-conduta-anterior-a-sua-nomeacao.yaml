id: ev-ementa-atribui-a-jocildo-conduta-anterior-a-sua-nomeacao
kind: evidence
classification: I
proposition: A ementa da decisão da Zona Cinzenta atribui a 'atuação individualizada de José Milton Afonso
  Gonçalves, Jackson Rubens de Oliveira e Jocildo Silva Lemos' às deliberações do Comitê de Investimentos
  de setembro de 2021. Mas Jocildo Lemos só foi nomeado diretor-presidente da Amprev pelo Decreto nº 0028,
  de 02/01/2023, e não podia integrar o colegiado em 2021. A contradição é entre dois documentos oficiais
  e reforça a leitura de que a ementa funde de modo impreciso duas frentes investigativas distintas —
  a do FIDC de 2021 e a das letras do Master de 2024.
