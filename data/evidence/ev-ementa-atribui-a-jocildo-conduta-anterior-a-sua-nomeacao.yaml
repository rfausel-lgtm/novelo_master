inference_basis: Cotejo entre a ementa da decisão judicial, que nomeia os três investigados no contexto
  das deliberações de setembro de 2021, e o Decreto nº 0028, de 02/01/2023, que nomeia Jocildo Silva Lemos
  com efeitos a contar de 1º de janeiro de 2023 — data posterior em mais de um ano às deliberações referidas.
  Ambos os documentos foram lidos integralmente pela equipe.
