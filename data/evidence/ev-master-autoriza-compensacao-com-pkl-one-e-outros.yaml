id: ev-master-autoriza-compensacao-com-pkl-one-e-outros
kind: evidence
classification: D
proposition: Em 10/11/2025, uma semana antes de sua liquidação extrajudicial, o Banco Master autorizou que
  valores recebidos na cobrança de operações de crédito fossem usados para compensar débitos com a PKL One
  Participações, a Ametrino Participações, uma "Terra Firme" não identificada com precisão entre as
  homônimas do acervo, o Banco Pleno e a Você Pode Saúde.
