  CREDITÓRIO (FIDC)' e 'DELIBERAÇÕES DO COMITÊ DE INVESTIMENTOS EM SETEMBRO DE 2021') e a seção II.2 da
  fundamentação, que trata do 'aporte temerário de quatrocentos milhões de reais em ativos do Banco Master'.
