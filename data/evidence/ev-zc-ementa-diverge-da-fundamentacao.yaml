id: ev-zc-ementa-diverge-da-fundamentacao
kind: evidence
classification: I
proposition: 'A ementa da decisão anuncia como objeto os aportes em fundos de investimento creditório
  e as deliberações de setembro de 2021, ao passo que a fundamentação se dedica quase inteiramente aos
  R$ 400 milhões em letras financeiras do Banco Master aprovados em julho de 2024. As duas trilhas convivem
  no mesmo ato: o relatório descreve o acervo do FIDC e a fundamentação, o do Master. A divergência pode
  indicar que a investigação abrange dois conjuntos de fatos ou apenas um descompasso de redação entre
  ementa e corpo — o corpus não tem elementos para decidir entre as hipóteses. A hipótese de descompasso
  de redação ganhou muita força: verificou-se depois que não houve reunião do comitê em 14/09/2021, que
  não havia FIDC na carteira da Amprev em nenhum mês de 2021 e que nenhum dos três investigados integrava
  o colegiado naquele ano.'
