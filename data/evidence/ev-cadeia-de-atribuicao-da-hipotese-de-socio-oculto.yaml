excerpt: Quanto a NELSON TANURE, a autoridade policial salientou que ele é apontado como o beneficiário
  final da LORMONT PARTICIPAÇÕES S.A. (...) é também assentado como sócio oculto do BANCO MÁSTER, exercendo
  influência por meio de fundos e estruturas societárias complexas
