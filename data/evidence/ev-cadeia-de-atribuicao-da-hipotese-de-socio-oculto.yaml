id: ev-cadeia-de-atribuicao-da-hipotese-de-socio-oculto
kind: evidence
classification: D
proposition: 'A expressão ''sócio oculto'' aplicada a Nelson Tanure não é afirmação do relator. Na decisão
  de 06/01/2026, ela aparece dentro de trecho transcrito entre aspas da manifestação do procurador-geral
  da República, que por sua vez reporta o que ''a autoridade policial salientou''. A cadeia é: a Polícia
  Federal afirma, o Ministério Público Federal encampa, o relator transcreve. Toffoli registra em nome
  próprio que ''a cognição do relator, nessa fase, é necessariamente limitada'' e defere as medidas ''nos
  exatos limites em que formulados''.'
document_ids:
