id: ev-cadeia-de-atribuicao-da-hipotese-de-socio-oculto
kind: evidence
classification: D
proposition: 'A expressão ''sócio oculto'' aplicada a Nelson Tanure não é afirmação do relator. Na decisão
  de 06/01/2026, ela aparece dentro de trecho transcrito entre aspas da manifestação do procurador-geral
  da República, que por sua vez reporta o que ''a autoridade policial salientou''. A cadeia é: a Polícia
  Federal afirma, o Ministério Público Federal encampa, o relator transcreve. Toffoli registra em nome
  próprio que ''a cognição do relator, nessa fase, é necessariamente limitada'' e defere as medidas ''nos
  exatos limites em que formulados''.'
document_ids:
- doc-2026-01-06-decisao-toffoli-pet-15198
source_ids:
- src-stf-decisao-toffoli-2026-01-06-pet-15198
excerpt: 'Quanto a NELSON TANURE, a autoridade policial salientou que ele é apontado como o beneficiário
  final da LORMONT PARTICIPAÇÕES S.A., cujas CCBs de R$ 73,7 milhões concentraram 97% da carteira do FIDC
  MARANTA em operação entre partes relacionadas, é também assentado como sócio oculto do BANCO MÁSTER,
  exercendo influência por meio de fundos e estruturas societárias complexas — razão pela qual o bloqueio
  do seu patrimônio deve ocorrer no mesmo volume daquele em relação a DANIEL VORCARO.'
date: '2026-01-06'
notes: 'Trecho completado em 12/09/2026 (lote 230): a versão anterior deste registro cortava a citação
  exatamente no ponto mais substantivo, com "(...)". O texto integral liga a hipótese de "sócio oculto" a
  dois veículos societários concretos — Lormont Participações e FIDC Maranta (ambos com ficha própria no
  acervo) — e ao pedido de que o bloqueio de bens de Tanure seja equivalente, em volume, ao de Daniel
  Vorcaro. Mantém-se a mesma cadeia de atribuição: alegação da autoridade policial, encampada pela PGR e
  transcrita pelo relator, não fato apurado.'
