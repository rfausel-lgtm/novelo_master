proposition: Segundo o Poder360, no vídeo do depoimento de 15/10/2026 Vorcaro negou irregularidade, atribuiu a
  crise do BRB à liquidação do Master e à sua prisão, sustentou com a analogia de uma promessa de compra de
  casa que a negociação original de carteiras não se concluiu, disse sobre os imóveis "Eu não prometi imóvel
  para ele" e que serviriam de moradia a Paulo Henrique Costa caso a fusão ocorresse, e a delegada contestou
  que a troca posterior de ativos afaste a apuração da negociação original.
