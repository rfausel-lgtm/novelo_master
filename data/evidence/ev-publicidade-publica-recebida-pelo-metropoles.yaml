id: ev-publicidade-publica-recebida-pelo-metropoles
kind: evidence
classification: D
proposition: 'Dimensionamento da receita pública de publicidade do veículo, apurado pela equipe nas planilhas
  oficiais do Portal da Transparência do Distrito Federal: entre 2022 e o primeiro semestre de 2026, o
  Metrópoles recebeu R$ 53,58 milhões da Secretaria de Comunicação do Distrito Federal, em valores brutos,
  somados o site e a rádio — de 7% do total pago pela pasta a veículos em 2022 a 10,1% em 2025. Pelo governo
  federal, os pagamentos diretos ao CNPJ do veículo somam R$ 1,59 milhão desde 2020. O dado serve para
  situar a ordem de grandeza da relação comercial com o Banco Master, não como indício de irregularidade
  — verba pública de publicidade é despesa regular.'
