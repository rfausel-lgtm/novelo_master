id: ev-master-pagou-27-milhoes-ao-metropoles
kind: evidence
classification: C
proposition: O Banco Master pagou R$ 27.283.800 à Metrópoles Marketing e Comunicação entre o segundo semestre
  de 2024 e outubro de 2025 — R$ 838,8 mil em duas operações em 2024 e o restante em parcelas mensais
  entre janeiro e outubro de 2025. Segundo relatório do Coaf citado pela imprensa, a movimentação foi
  classificada como atípica, com registro de 'débito imediato' para empresas ligadas à família de Luiz
  Estevão. O relatório não é público e não foi lido pela equipe.
