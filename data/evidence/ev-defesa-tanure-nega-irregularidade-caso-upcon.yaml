proposition: A defesa de Nelson Tanure, no caso Upcon, sustenta que a CVM nunca apontou irregularidades
  na operação e que a Polícia Federal, ao também investigar os mesmos fatos, não encontrou evidências
  de crime; argumenta que a aquisição foi amplamente discutida no âmbito da Gafisa, com fatos relevantes
  publicados antes e depois do fechamento do negócio, aprovado pela maioria dos acionistas.
