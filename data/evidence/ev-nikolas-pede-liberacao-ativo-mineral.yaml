id: ev-nikolas-pede-liberacao-ativo-mineral
kind: evidence
classification: A
proposition: Em mensagens de 30/03/2025 e 01/04/2025, recuperadas do celular de Daniel Vorcaro, o deputado
  Nikolas Ferreira pede ao banqueiro que avalie um pedido de liberação de ativo mineral apresentado por
  seu ex-assessor e advogado Thiago Rodrigues de Faria, dizendo confiar plenamente nele; Vorcaro se dispõe
  a intermediar o contato e, dias depois, assume o encaminhamento do assunto. Não há confirmação pública
  sobre a liberação do ativo.
