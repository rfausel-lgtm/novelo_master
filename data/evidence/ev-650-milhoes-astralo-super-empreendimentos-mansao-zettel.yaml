date: '2024-05-21'
notes: 'Atualizado em 12/09/2026 (lote 230): upgrade de A para C. A decisão de Dias Toffoli de 06/01/2026
  confirma, com datas e valores idênticos (R$ 800 milhões resgatados, R$ 650 milhões repassados via
  Termópilas), o mesmo fluxo Astralo 95 → Termópilas → Super Empreendimentos, a partir de fonte oficial —
  fonte genuinamente independente da imprensa, e não mero envelope da mesma apuração. A ligação entre a
  Super Empreendimentos e a compra da mansão de Fabiano Zettel permanece sustentada só pela reportagem;
  a decisão do STF não menciona esse desfecho. A mesma decisão revela ainda uma etapa ANTERIOR do fluxo,
  não capturada nesta evidência até agora: a Brain Realty devia R$ 459 milhões ao Master; o Astralo 95 e o
  Reag Growth 95 tornaram-se credores por R$ 450 milhões em CDBs; o desembolso total de R$ 1,45 bilhão
  teve retorno de R$ 1,38 bilhão entre abril e maio de 2024 — precedendo o resgate de 21/05/2024 já
  registrado aqui.'
