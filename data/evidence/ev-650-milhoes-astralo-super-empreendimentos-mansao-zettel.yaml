id: ev-650-milhoes-astralo-super-empreendimentos-mansao-zettel
kind: evidence
classification: C
proposition: Entre 24/04/2024 e 17/05/2024, os fundos Astralo 95 e Reag Growth 95 (cadeia de fundos-sobre-fundos
  administrada pela Reag) compraram CDBs emitidos pelo Master; em 21/05/2024 o Astralo 95 resgatou R$
  800 milhões desses CDBs, dos quais R$ 650 milhões foram para o fundo Termópilas e, deste, para a Super
  Empreendimentos — empresa de Fabiano Zettel, cunhado de Vorcaro, já registrado no corpus por outras
  frentes —, que usou parte dos recursos para comprar uma mansão de R$ 36,1 milhões em Brasília.
