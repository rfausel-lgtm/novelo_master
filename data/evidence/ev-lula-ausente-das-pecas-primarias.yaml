id: ev-lula-ausente-das-pecas-primarias
kind: evidence
classification: D
proposition: 'Resultado de verificação sobre o presidente da República, dito de forma direta. A equipe
  leu integralmente dois documentos primários. No relatório da Polícia Federal IPJ-A nº 3298613/2026,
  de 218 páginas, sobre o celular de Daniel Vorcaro, Lula NÃO aparece — a seção de análise dos citados
  nas notas cobre apenas dois nomes, Paulo Gonet e Andrei Passos, e não há ocorrência do presidente em
  nenhuma página. No relatório final da CPI do Crime Organizado, de 221 páginas, os indiciamentos propostos
  são quatro e apenas quatro — Dias Toffoli, Alexandre de Moraes, Gilmar Mendes e Paulo Gonet —, e Lula
  aparece uma única vez, indiretamente, na passagem sobre a Pollaris, como destinatário da reunião a que
  Mantega levou Vorcaro. Ele não é investigado, não é indiciado, não é alvo, não consta das minutas de
  delação e não é interlocutor de nenhuma mensagem apreendida. Na única mensagem em que seu nome é citado,
  de 17/07/2024, Vorcaro diz a um diretor do banco ''manda pro Lula e pra base aliada'', e o interlocutor
  responde que enviaria a intermediários — de modo que nem o material lhe foi enviado, nem ele participa
  do diálogo. A própria PF consigna que ''a simples menção a autoridades em conversas privadas não significa
  envolvimento em irregularidades''. O que existe é a audiência de 04/12/2024, que ele próprio confirmou
  e descreveu. Ressalva de escopo: trata-se de um relatório, focado no eixo do STF, e não da totalidade
  da investigação.'
