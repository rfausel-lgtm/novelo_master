id: ev-chaer-organizou-forum-com-patrocinio-do-master
kind: evidence
classification: C
proposition: O convite ao fórum jurídico em Londres de abril de 2024 apresentava ConJur, Correio Braziliense
  e Banco Master como organizadores; o editor do ConJur, Márcio Chaer, foi contratado pelos organizadores para
  formatar as mesas do evento e negociou diretamente com Daniel Vorcaro a composição da lista de convidados,
  tranquilizando-o sobre a exposição do banco como financiador. Chaer confirmou publicamente ter organizado a
  edição de 2024 e que o ConJur recebeu patrocínio do Master, dizendo ter declinado de organizar a de 2025.
