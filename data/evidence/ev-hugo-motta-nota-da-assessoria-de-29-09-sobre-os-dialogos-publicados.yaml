id: ev-hugo-motta-nota-da-assessoria-de-29-09-sobre-os-dialogos-publicados
kind: evidence
classification: A
proposition: >-
  Em nota divulgada pela CNN Brasil em 29/09/2026, a assessoria de Hugo Motta afirmou que ele "sempre manteve
  diálogo com os diversos segmentos do empresariado" e que "não existe nenhum ilícito retratado nos diálogos
  publicados"; segundo a versão reproduzida no blog de Matheus Teixeira, a nota também rejeita atribuir a
  interesses impróprios conversas fora de contexto e diz que Motta confia nas autoridades responsáveis. Em
  30/09, sobre o grupo de WhatsApp, Motta não comentou (UOL) e a assessoria disse que os parlamentares não vão
  se pronunciar (Gazeta do Povo).
