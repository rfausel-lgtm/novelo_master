id: ev-delacao-confirma-a-soma-que-a-imprensa-havia-reconstruido-em-duas-fontes
kind: evidence
classification: C
proposition: A convergência aritmética é o achado mais forte do episódio. O corpus registrava, de duas
  apurações independentes e por vias distintas, que o fundo norte-americano recebera ao menos US$ 10,6
  milhões de empresas ligadas a Daniel Vorcaro, conforme o Intercept, mais US$ 1,6 milhão em 16/09/2025,
  conforme relatório do Coaf noticiado pela piauí — soma de US$ 12,2 milhões. O colaborador declara agora
  sete transferências totalizando US$ 12,3 milhões, realizadas entre fevereiro e setembro de 2025. O número
  reconstruído pela imprensa a partir de duas fontes separadas coincide, na prática, com o que o próprio
  operador das remessas confirma — o que eleva a confiança tanto no relato quanto no trabalho de reconstrução
  anterior.
