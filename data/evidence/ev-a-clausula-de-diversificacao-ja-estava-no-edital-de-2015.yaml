id: ev-a-clausula-de-diversificacao-ja-estava-no-edital-de-2015
kind: evidence
classification: D
proposition: A engenharia não foi improvisada em 2018. O edital de alienação de 2015, que não se consumou,
  já previa transferir ao comprador, por cinco anos, 'a titularidade e a gestão plenas do Cartão Credicesta',
  assegurando-lhe 'o direito de modificar, ampliar, aperfeiçoar e/ou diversificar as finalidades do programa'.
  O mesmo documento registra que o cartão fora criado em 1999 pela própria empresa pública, como instrumento
  de compra na rede estatal. A fórmula que o decreto de 2018 formalizaria estava escrita três anos antes.
