id: ev-vorcaro-nao-nomeou-os-agentes
kind: evidence
classification: A
proposition: 'Elemento decisivo para avaliar o peso da alegação: na íntegra do depoimento, Vorcaro NÃO
  nomeia nenhum agente. Os supostos autores das ameaças estavam de máscara ou balaclava e são descritos
  genericamente como integrantes da ''Polícia Penal Estadual'' e da ''Polícia Federal''. O único nome
  citado é o de Andrei Rodrigues — e como pessoa de relação cordial em eventos, não como autor direto
  das ameaças. Entre as falas que atribui aos agentes: ''Vai querer falar disso do chefe? Vai acontecer
  isso''; ''É mais fácil, de repente, jogar ele daqui''; ''quer mexer com os patrões, agora sua vida vai
  virar um inferno''. Há ainda divergência entre versões sobre o veículo: a íntegra fala em helicóptero,
  parte da imprensa noticiou avião, com ameaça de abrir a porta em voo.'
