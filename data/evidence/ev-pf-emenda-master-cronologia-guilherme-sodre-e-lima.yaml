date: '2026-09-11'
notes: A mensagem "faz parte disso" e a caracterização de "padrão de acompanhamento direto de pauta legislativa"
  são elementos novos em relação ao que o corpus já registrava (contato frequente com Lima, ligação de
  13/08/2024, pedido de vista em 14/08) — aprofundam, sem contradizer, o quadro anterior. O número de contatos
  (74 em um ano e meio, contra "ao menos 70" sem período definido) não está reconciliado com precisão; ambos
  podem descrever a mesma contagem com arredondamento diferente.
