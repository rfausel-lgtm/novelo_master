id: ev-pf-emenda-master-cronologia-guilherme-sodre-e-lima
kind: evidence
classification: A
proposition: 'A PF, no relatório cujo sigilo Mendonça levantou em 11/09/2026, reconstrói a cronologia da
  Emenda 11 à PEC 65/2023 (a "Emenda Master") a partir de mensagens: seis dias antes da apresentação de
  13/08/2024, o publicitário Guilherme Henrique Sodré Martins procurou Vorcaro pedindo discrição sobre um
  "tema importante" e avisou que o chefe de gabinete de Wagner entraria em contato; no dia da apresentação,
  Augusto Lima telefonou para Wagner (9min19s de duração) e em seguida enviou o link da emenda; duas semanas
  depois, Lima visitou pessoalmente o gabinete do senador e reenviou o texto da proposta. Em mensagem de
  agosto de 2024, o próprio Wagner escreveu a Lima: "Vamos marcar, que eu precisava conversar com você pra
  saber como estão as coisas do banco". Em 29/03/2025, Lima escreveu a Wagner: "Você mais do que ninguém
  sabe de minha história e faz parte disso!!". Para a PF, essa sequência "configura um padrão de acompanhamento
  direto, por Senador Jaques Wagner, de pauta legislativa de interesse" do Master, com a relação caracterizada
  como aparentemente unidirecional: "o Senador recebe ou solicita vantagens ou favores, e o empresário os
  concede". Reportagem da mesma data registra 74 ligações entre Lima e Wagner em um ano e meio, atualizando
  a contagem de "ao menos 70" já registrada no corpus.'
