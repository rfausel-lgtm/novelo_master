notes: 'Alegação do investigado; status unverified. Divergência de data: a CNN escreve que a oitiva foi em 15
  de setembro (subtítulo e corpo); Poder360, Rádio Itatiaia e Correio da Manhã informam 15/10/2026, data
  registrada. A oitiva antes marcada para 15/09 está em outro evento do acervo. "Comodato" é termo da CNN, não
  aspa de Vorcaro; o Poder360 não o usa.'
