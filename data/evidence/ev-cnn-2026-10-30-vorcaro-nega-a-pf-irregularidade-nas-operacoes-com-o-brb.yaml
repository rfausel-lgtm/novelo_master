id: ev-cnn-2026-10-30-vorcaro-nega-a-pf-irregularidade-nas-operacoes-com-o-brb
kind: evidence
classification: A
proposition: Segundo a CNN Brasil, Vorcaro disse à PF "Fraude não teve", afirmou que nem o BRB nem clientes
  perderam dinheiro, atribuiu a crise do BRB à liquidação do Master e às investigações, pediu perícia por
  empresa estrangeira e o arquivamento, reconheceu problemas com carteiras ligadas à Tirreno e disse que os
  imóveis seriam para moradia de Paulo Henrique Costa se a fusão ocorresse; segundo a CNN, disse também que
  seriam cedidos em comodato, sem transferência de propriedade.
