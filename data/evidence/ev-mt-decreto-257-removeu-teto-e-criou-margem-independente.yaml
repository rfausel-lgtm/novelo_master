id: ev-mt-decreto-257-removeu-teto-e-criou-margem-independente
kind: evidence
classification: D
proposition: 'Em Mato Grosso, a leitura do texto oficial mostra que o decreto que antecedeu o convênio
  fez mais do que criar uma margem. O Decreto nº 257, de 05/05/2023, alterou o regime de consignações
  em quatro pontos que, somados, viabilizaram a operação: criou margem de até 10% para cartão consignado
  de benefício e estabeleceu que ''as margens consignáveis previstas nos incisos deste artigo são independentes,
  de forma que não concorrem entre si'' — invertendo a regra anterior, que previa concorrência; substituiu
  o teto de vigência dos convênios, que era de 24 meses, por remissão à lei de licitações, o que tornou
  possível o prazo de cinco anos; reposicionou o produto no inciso do rol de consignatárias que o próprio
  decreto dispensa de autorização expressa do governador, deixando a decisão na secretaria; e criou a
  figura da instituição financeira que intermedeia cartão de benefício para empresas de meios de pagamento.
  Vinte e cinco dias depois, o Banco Master assinou convênio de cinco anos. O decreto e o convênio têm
  um signatário em comum: o secretário de Planejamento e Gestão.'
