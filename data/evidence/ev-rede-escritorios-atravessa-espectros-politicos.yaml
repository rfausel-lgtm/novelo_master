id: ev-rede-escritorios-atravessa-espectros-politicos
kind: evidence
classification: C
proposition: 'A rede de honorários jurídicos do Banco Master atravessa múltiplos espectros partidários
  e esferas de poder: os dois últimos presidentes nacionais da OAB, de momentos políticos opostos (Marcus
  Vinicius Furtado Coêlho, 2013-2016, e Felipe Santa Cruz, 2019-2022, que teve atritos públicos com o
  governo Bolsonaro); um ex-ministro da Fazenda de governos petistas (Guido Mantega, já registrado no
  corpus); figuras do entorno bolsonarista (ACM Neto, Fabio Wajngarten, já registrados); e um ex-magistrado
  especializado em falências (Marcelo Barbosa Sacramone). A rede não é capturável como alinhamento a um
  único grupo político — é compatível tanto com contratação de expertise genuína de alto mercado quanto
  com cultivo de relações em pontos de possível intervenção regulatória, sem que as fontes disponíveis
  concluam por uma ou outra leitura.'
