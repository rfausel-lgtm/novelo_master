excerpt: Esta decisão não examina a existência ou a extensão do crédito, nem o cabimento dos recursos interpostos nas instâncias judiciais.
locator: Num. 6779874, págs. 1-5
date: '2026-09-28'
notes: >-
  A decisão traz apenas o valor nas datas-base; nenhum valor atualizado é registrado pelo Novelo. A decisão não
  menciona o Master nem Vorcaro, e nenhuma fonte aberta liga as três empresas do aditamento ao Master.
