id: ev-cnj-aditamento-de-28-09-cancelamento-de-14-requisicoes
kind: evidence
classification: D
proposition: >-
  Em 28/09/2026, no mesmo PP, o corregedor nacional deferiu pedido de aditamento da União e estendeu a cautelar
  aos Cumprimentos de Sentença 0017910-79.2008.4.01.3400 (Companhia Agroindustrial Santa Helena),
  0017882-14.2008.4.01.3400 (Agrovale) e 0017886-51.2008.4.01.3400 (Borborema Agro Industrial), determinando o
  cancelamento em cinco dias de 14 requisições (R$ 1.877.143.674,66 nas datas-base, depositados em 26/12/2023)
  e a restituição com rendimentos, e rejeitou a alegação de preclusão apresentada pela Santa Helena.
