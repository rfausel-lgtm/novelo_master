excerpt: Parece que tem um ex-colega da PF que trabalha lá dentro do banco. Felipe falou alguma coisa
  nesse sentido. Não sei se é ex-superintendente, ex-diretor...
attributed_to_id: marilson-roseno-da-silva
date: '2025-12'
notes: É especulação do próprio Marilson em depoimento, não confirmada pela PF — que, aliás, usa o
  restante do depoimento dele para desqualificar sua credibilidade, contrapondo suas declarações às
  conversas de WhatsApp extraídas. A hipótese de um ex-policial "dentro do banco" (isto é, do Banco
  Master) como fonte adicional de vazamento, distinta do próprio núcleo "A Turma", não foi investigada
  a fundo neste documento e permanece em aberto. Não identificado o suposto "ex-colega" nem confirmada
  a existência desse canal de informação.
