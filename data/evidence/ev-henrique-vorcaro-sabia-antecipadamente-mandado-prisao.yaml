id: ev-henrique-vorcaro-sabia-antecipadamente-mandado-prisao
kind: evidence
classification: A
proposition: Em depoimento, Marilson Roseno da Silva relatou que Henrique Vorcaro, antes de ser preso
  (por volta de dezembro de 2025), telefonou-lhe na presença de Luiz Phillipi Mourão e afirmou já saber
  que "vai sair um mandado de prisão" contra ele, perguntando a Marilson se ele sabia de algo. Marilson
  negou. Questionado por que Henrique já sabia, Marilson especulou que haveria um "ex-colega" seu, da PF,
  "que trabalha lá dentro do banco" — possivelmente um "ex-superintendente" ou "ex-diretor" — repassando
  informações a Henrique e a Mourão.
document_ids:
