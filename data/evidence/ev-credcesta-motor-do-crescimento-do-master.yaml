id: ev-credcesta-motor-do-crescimento-do-master
kind: evidence
classification: A
proposition: A escala que o produto alcançou explica por que é descrito como o motor de crescimento do
  banco. A base saiu de 33.685 clientes com crédito ativo no fim de 2018 para 5,8 milhões em 2024, em
  24 estados e 176 municípios; os contratos com o INSS passaram de 104,8 mil em 2022 para 2,75 milhões
  em 2024. No balanço do Master, o consignado saiu de 31,3% da carteira de pessoa física no fim de 2019
  para 85,4% das operações em 2022, e Augusto Lima declarou que em 2023 o CredCesta representava 80% da
  carteira de varejo. A receita atribuída ao produto entre 2022 e 2024 soma R$ 2,4 bilhões em revenda
  de carteiras e R$ 1,9 bilhão em juros — só em 2024, R$ 1,6 bilhão de revenda e R$ 709 milhões de juros
  —, com direitos a receber ligados ao produto de R$ 10,5 bilhões em 2024.
