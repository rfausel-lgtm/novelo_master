id: ev-zc-trilha-anterior-fidc-multisetorial-2021
kind: evidence
classification: D
proposition: A decisão da operação Zona Cinzenta contém passagem descrevendo deliberações do Comitê de
  Investimentos da Amprev em reuniões extraordinárias de setembro de 2021 que teriam aprovado a aquisição
  de cotas de um FIDC Multisetorial, com aportes de R$ 15 milhões, deliberação de 14/09/2021 e Parecer
  Técnico nº 36/2021. A evidência registra a existência da passagem no documento judicial — não a ocorrência
  dos fatos nela descritos, que os registros públicos da própria Amprev contradizem (ver ev-passagem-do-fidc-de-2021-contradita-pelos-registros-da-amprev).
