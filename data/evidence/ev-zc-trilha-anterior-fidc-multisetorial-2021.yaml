excerpt: registros de reuniões extraordinárias realizadas em setembro de 2021, em que se deliberou a aquisição
  de cotas do FIDC Multisetorial (...) Há registros de aportes que totalizam R$ 15.000.000,00, destinados
  ao referido fundo, que se coadunam com a deliberação registrada na reunião de 14/09/2021. Consta, ainda,
  que as deliberações ocorreram com inobservância de alertas técnicos e ausência de certificação profissional
  de membros do comitê
