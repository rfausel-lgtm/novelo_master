id: ev-secretaria-teria-dispensado-o-master-da-lista
kind: evidence
classification: D
proposition: A ata registra a afirmação do banco de que houve consulta formal via GesCon, feita por um
  cliente da instituição, sobre a necessidade de o Master constar da lista exaustiva, e que 'o entendimento
  da secretaria foi de que não era necessário' — além de parecer de escritório de advocacia no mesmo sentido.
  A evidência registra o que o banco declarou ao comitê; a resposta oficial da Secretaria à consulta não
  foi localizada pela equipe.
