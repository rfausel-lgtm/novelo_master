id: ev-convenio-005-2025-ms-parecer-referencial-generico-de-sindicatos
kind: evidence
classification: D
proposition: A renovação de 2025 invoca como fundamento jurídico apenas um parecer referencial da Procuradoria-Geral
  do Estado de 2020 — o mesmo que, na mesma página do diário oficial, embasa o credenciamento de duas
  entidades sindicais. Não há manifestação jurídica individualizada sobre a empresa nem sobre a natureza
  do produto, embora o objeto declarado já mencionasse expressamente o cartão consignado de benefício.
