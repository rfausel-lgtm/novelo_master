date: '2024-04-06'
notes: 'Esclarece, com base documental, a divergência já registrada no acervo entre imprensa (que descrevia Marilson
  Roseno como ''líder operacional'') e a decisão do STF (que atribuía a coordenação a Mourão): os dois papéis coexistem,
  em níveis distintos da mesma estrutura.'
