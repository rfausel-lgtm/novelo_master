id: ev-turma-e-comandada-por-mourao-com-marilson-roseno-como-lider-de-campo
kind: evidence
classification: D
proposition: Segundo a representação da PF, Luiz Phillipi Mourão ('Sicário') comandava, a mando de Daniel Vorcaro,
  o núcleo de intimidação apelidado 'A Turma', remunerado em R$ 1 milhão por mês via a empresa King, enquanto o
  policial federal aposentado Marilson Roseno da Silva atuava como líder operacional do grupo em campo — identificado
  pela PF a partir de um episódio em que rastreou, a pedido de Vorcaro, o responsável por um drone sobre a residência
  do banqueiro em Belo Horizonte, e cujo ingresso no condomínio, em 06/04/2024, foi confirmado pelos registros de
  visitantes autorizados por Vorcaro.
document_ids:
