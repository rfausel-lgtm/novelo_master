id: ev-vazamento-dados-vorcaro-rastreado-cpmi
kind: evidence
classification: A
proposition: Relatório da PF conclui, com 'elevado grau de certeza técnica', que vazamentos de dados sigilosos
  de Daniel Vorcaro — incluindo conversas privadas com Martha Graeff — têm origem no material que havia
  sido disponibilizado à CPMI do INSS. A PF pretendia requerer ao ministro Mendonça imagens do circuito
  de segurança do Congresso e registros de acesso à 'sala-cofre' onde o material sigiloso ficava guardado.
