proposition: Em 24/01/2026, Dias Toffoli ratificou as medidas deferidas pelo juízo de primeiro grau e
  autorizou a Polícia Federal a seguir extraindo e analisando o material apreendido, às vésperas das oitivas
  de 26 e 27/01/2026, nos exatos termos de manifestação favorável da PGR.
