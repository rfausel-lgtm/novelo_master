id: ev-mesma-carteira-de-consignado-tambem-foi-vendida-ao-brb
kind: evidence
classification: A
proposition: Parte dos mesmos contratos de consignado dados em garantia à Tether também integrava a carteira
  vendida ao BRB — episódio que, segundo a reportagem, desencadeou as investigações contra Vorcaro. Se
  confirmada a sobreposição entre os dois conjuntos de recebíveis, isso configuraria oneração dupla dos
  mesmos créditos perante dois credores distintos — um banco público brasileiro e uma financeira internacional
  ligada a stablecoin. A equipe não teve acesso a documento que precise o grau de sobreposição entre as
  duas carteiras.
