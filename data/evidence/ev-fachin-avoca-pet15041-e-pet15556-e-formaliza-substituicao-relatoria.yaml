id: ev-fachin-avoca-pet15041-e-pet15556-e-formaliza-substituicao-relatoria
kind: evidence
classification: D
proposition: 'Em despacho de 12/09/2026 na Pet 16.704, Fachin remete à Presidência do STF as PETs 15.041
  (Operação Sem Desconto, fraude no INSS) e 15.556 (Compliance Zero), com todos os processos a elas relacionados,
  citando a manifestação de Moraes; e determina, com fundamento no art. 13, XV, do RISTF, que a Secretaria
  Judiciária substitua a relatoria da PET 16.662 para a Presidência, diante da possibilidade de aplicação do
  art. 144, IV, do Código de Processo Civil (suspeição). O mesmo despacho registra que a PET 16.662 foi criada
  porque a IPJ-A nº 3298613/2026 identificou pessoa que atrai o art. 5º, I, do RISTF (competência do Plenário),
  desentranhada da Pet 15.556.'
document_ids:
