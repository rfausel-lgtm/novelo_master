excerpt: determino, com fundamento no art. 13, XV, do Regimento Interno do Supremo Tribunal Federal, à
  Secretaria Judiciária, que substitua a relatoria da PET 16.662 para a Presidência do Supremo Tribunal Federal
attributed_to: Ministro Edson Fachin, em despacho de 12/09/2026
date: '2026-09-12'
notes: 'Complementa ev-mendonca-remete-pet16662-a-presidencia-em-cumprimento-a-fachin (lote 253), que registrava
  só o cumprimento por Mendonça — este despacho é o ato que formalmente decreta a substituição, com base legal
  explícita, e amplia a avocação para além da PET 16.662, incluindo as próprias PETs 15.041 e 15.556. O texto
  não nomeia a pessoa identificada pela IPJ-A nº 3298613/2026 que teria atraído o art. 5º, I, do RISTF.'
