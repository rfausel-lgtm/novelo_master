id: ev-pericia-nao-teve-acesso-aos-documentos-do-fundo
kind: evidence
classification: A
proposition: 'A perícia contratada pela produtora não teve acesso aos documentos do fundo Havengate, segundo apuração
  de O Globo, e o laudo, de 32 páginas, não desdobra os valores nem identifica gastos específicos, segundo a piauí:
  não se sabe quanto recebeu cada ator, diretor ou produtor, quais empresas foram contratadas nem em que datas os
  pagamentos ocorreram.'
