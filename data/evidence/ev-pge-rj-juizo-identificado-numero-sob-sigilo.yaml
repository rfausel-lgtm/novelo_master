proposition: A ação da Procuradoria-Geral do Estado do Rio de Janeiro contra o grupo Master, sobre os
  fundos Revolution e Texas I FIA, tramita na 10ª Vara de Fazenda Pública da Capital, perante a juíza
  Aline Massoni. Decisões de 23 e 28/07/2026 determinaram bloqueio de bens da Acura Gestora de Recursos
  e de seus diretores e resgate garantido de R$ 481,5 milhões do Fundo Revolution. A PGE-RJ confirmou
  publicamente ter apresentado duas tutelas cautelares e uma ação de exibição de documentos, em segredo
  de justiça — o que explica a ausência do número do processo em toda a cobertura consultada pela equipe.
