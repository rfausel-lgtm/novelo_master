id: ev-defesa-de-vorcaro-alega-pasta-de-deputado-apreendida
kind: evidence
classification: A
proposition: A defesa de Daniel Vorcaro alegou, na Reclamação 88.121, que a Polícia Federal apreendeu no
  endereço dele uma pasta pertencente a um deputado federal, com opção de compra e venda de imóvel, e lavrou o
  termo de apreensão sem mencionar o nome do parlamentar — o que atrairia a competência do STF.
document_ids:
- doc-2025-12-09-decisao-liminar-rcl88121-remete-compliance-zero-stf
source_ids:
- src-stf-rcl88121-decisao-liminar-09-12-2025
attributed_to: Defesa de Daniel Vorcaro, na petição inicial da Rcl 88.121
attributed_to_id: daniel-vorcaro
date: '2025-11-27'
notes: A petição, transcrita na liminar, identifica o parlamentar só pelas iniciais J.C.B. e o associa, com base
  em notícias de imprensa, à Operação Overclean e a emendas destinadas ao município baiano de Boquira. A liminar
  não confirma a titularidade da pasta — registra apenas que o deputado João Carlos Paolilo Bacelar Filho é
  "referido nos documentos apreendidos".
