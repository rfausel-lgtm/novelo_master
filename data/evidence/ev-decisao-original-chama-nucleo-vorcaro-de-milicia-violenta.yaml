id: ev-decisao-original-chama-nucleo-vorcaro-de-milicia-violenta
kind: evidence
classification: D
proposition: 'O item 10.5 da decisão de medidas assecuratórias de 03/03/2026 (Pet 15.563), segundo a
  transcrição feita pela própria PGR em contraminuta de 10/07/2026, caracteriza o núcleo liderado por Daniel
  Vorcaro como estrutura "de formação de uma milícia violenta, sob os comandos de DANIEL VORCARO, para
  satisfação de seus interesses exclusivamente privados" — a mesma caracterização de fundo do grupo de
  intimidação já documentado no acervo como "A Turma" (lotes 170-171), agora com essa formulação jurídica
  específica na própria decisão original.'
