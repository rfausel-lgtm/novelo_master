id: ev-leitura-da-pf-sobre-a-concentracao-do-funding
kind: evidence
classification: A
proposition: 'A Polícia Federal formulou expressamente a leitura de que a concentração tem significado
  próprio: quando praticamente toda a emissão de letras financeiras de um banco de médio porte é absorvida
  por um mesmo tipo de investidor institucional, isso pode indicar que os demais agentes de mercado rejeitaram
  a operação por considerarem o risco excessivo.'
