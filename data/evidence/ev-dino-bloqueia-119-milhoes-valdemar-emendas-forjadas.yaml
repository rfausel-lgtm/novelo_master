id: ev-dino-bloqueia-119-milhoes-valdemar-emendas-forjadas
kind: evidence
classification: C
proposition: 'Em 10/07/2026, o Min. Flávio Dino bloqueou R$ 119.216.703,15 em bens de Valdemar Costa Neto,
  presidente nacional do PL, e suspendeu a execução de despesas públicas ligadas a 21 emendas
  parlamentares que a PF aponta como forjadas e desviadas em seu benefício — registradas formalmente em
  nome de deputados "para dar aparência de legalidade", mas executadas, segundo a investigação, por
  servidores da Câmara dos Deputados (Mariângela Fialek, Garigham Amarante Pinto e Nara Brum) a mando de
  Valdemar, que não tem mandato parlamentar. Cerca de R$ 104 milhões já haviam sido pagos antes da
  suspensão. Dino classificou os indícios de responsabilidade como "veementes" e determinou a entrega de
  documentação completa pela Câmara em 10 dias. Acusações: peculato-desvio e associação criminosa.'
