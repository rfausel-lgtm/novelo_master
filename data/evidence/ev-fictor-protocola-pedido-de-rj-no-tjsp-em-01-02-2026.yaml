id: ev-fictor-protocola-pedido-de-rj-no-tjsp-em-01-02-2026
kind: evidence
classification: C
proposition: Em 01/02/2026 o Grupo Fictor protocolou, no Tribunal de Justiça de São Paulo, pedido de
  recuperação judicial da Fictor Holding e da Fictor Invest, com dívidas estimadas em cerca de R$ 4 bilhões, e
  pediu tutela de urgência para suspender execuções e bloqueios por 180 dias.
source_ids:
