date: 2026-02-01
notes: Os dois primeiros veículos reportam o comunicado do grupo; o Migalhas descreve a decisão judicial no
  pedido. O valor do passivo é o informado pelo grupo (cerca de R$ 4 bilhões). A petição não foi lida pela
  equipe.
