id: ev-angelo-ribeiro-manipulacao-care11-cvm-2022
kind: evidence
classification: D
proposition: 'Em processo administrativo sancionador concluído em 2022 (PAS 19957.006441/2021-87 + PA
  19957.010180/2022-81), a CVM identificou Angelo Ribeiro da Silva, então operando pelo Banco Máxima, como
  responsável por ordens de manipulação de preços do ativo CARE11, com gravações telefônicas (obtidas pela
  BSM) citadas como evidência de coordenação. O Comitê de Termo de Compromisso aceitou a proposta de acordo
  em 13/09/2022 — R$ 2,208 milhões pagos pelo Banco Máxima e R$ 736 mil por Angelo Ribeiro da Silva.'
