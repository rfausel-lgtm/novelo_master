id: ev-augusto-lima-controla-asteba-asseba-por-procuracao
kind: evidence
classification: C
proposition: 'Augusto Lima, ex-CEO e ex-sócio do Banco Master, é procurador da Asteba e da Asseba perante
  instituições financeiras, com poderes para movimentar recursos — segundo a Polícia Federal, não é dirigente
  estatutário de nenhuma das duas (esses cargos são ocupados por Nanci Maria Prates Pereira e Maria Helena
  Santos Ferreira, respectivamente). O vínculo é sustentado por evidência documental: ambas as associações
  registraram na Receita Federal o mesmo e-mail de contabilidade (''contabilidade@grupoterrafirme.com.br''),
  pertencente à Terra Firme da Bahia Ltda, empresa de propriedade exclusiva de Augusto Lima; a Asseba
  e a Terra Firme compartilham também o mesmo telefone de cadastro.'
