notes: 'Qualificação de 12/09/2026: ele FOI presidente estatutário fundador da Asteba, de 01/09/2005 a
  28/02/2008 (ver ev-augusto-lima-foi-presidente-estatutario-fundador-asteba) — período anterior ao aqui
  relevante. Não contradiz a proposição acima, que trata do período que interessa ao caso Master (2018 em
  diante). Ele também negou, em petição no INQ 5.026, ter poder para movimentar as contas por procuração
  além da que teve com o Banco Bradesco, revogada em 03/01/2020 — ver cited_position em augusto-lima.yaml.'
