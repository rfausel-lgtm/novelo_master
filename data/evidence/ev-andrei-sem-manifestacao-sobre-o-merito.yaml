proposition: 'Estado da resposta: a equipe não localizou uma única manifestação pública, nota oficial
  da Polícia Federal, entrevista ou depoimento em que Andrei Rodrigues trate especificamente do mérito
  das menções ao seu nome no relatório sobre o celular de Vorcaro. O que existe é a resposta institucional
  da PF sobre o custeio da viagem, obtida por Lei de Acesso à Informação; uma declaração genérica de 28/08/2026,
  anterior à divulgação do relatório, em que afirmou que a corporação trabalha ''sem proteger ou perseguir'',
  sem citar o caso; e relatos de interlocutores — não declaração assinada — segundo os quais ele avalia
  que a determinação de Mendonça pode configurar abuso de autoridade e gerar nulidades. O Poder360 registra
  tê-lo procurado em fevereiro e abril de 2026 e novamente na apuração da degustação, sem resposta em
  nenhuma ocasião. Na corporação, segundo o PlatôBR, não houve notas de entidades em sua defesa nem vozes
  internas cobrando investigação específica — ''nem blindagem formal, nem qualquer condenação antecipada''.'
