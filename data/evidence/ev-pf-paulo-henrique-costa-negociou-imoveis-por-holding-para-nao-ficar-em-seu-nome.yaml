id: ev-pf-paulo-henrique-costa-negociou-imoveis-por-holding-para-nao-ficar-em-seu-nome
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, entre novembro de 2024 e janeiro de 2025 Paulo Henrique Costa, então presidente
  do BRB, negociou com incorporadoras de Brasília a compra de apartamentos de R$ 4,67 milhões e de R$ 6,01 milhões,
  pedindo sigilo ("vamos manter o mais restrito possível") e dizendo que providenciaria uma holding patrimonial "para
  que não seja direto em meu nome"; as minutas de contrato vieram com o campo do comprador em branco, a pedido dele.
document_ids:
