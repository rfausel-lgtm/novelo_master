attributed_to: Polícia Federal, na IPJ nº 1039533/2026 (análise preliminar do celular de Paulo Henrique Costa), juntada ao INQ 5.026
date: '2024-11-25'
notes: 'Em 10/01/2025, segundo o relatório, ele informou às duas incorporadoras que a holding estava estruturada. A PF
  classifica o conteúdo como "planejamento patrimonial e sigilo" potencialmente relevante e não afirma, nesta peça
  preliminar, de onde viriam os recursos. As datas coincidem com o período em que outra análise da PF o descreve
  prestando favorecimento ao Master (ver ev-pf-paulo-henrique-costa-favorecia-o-master-desde-2024), mas o relatório
  não liga os imóveis a pagamentos. CORRIGIDO NO LOTE 257: a IPJ-A nº 1270942/2026 inclui esses dois apartamentos
  entre os seis imóveis, de R$ 146,6 milhões no total, que a PF atribui a vantagem indevida paga a ele, comprados por
  empresas de prateleira controladas por um fundo gerido pela REAG (ver
  ev-pf-seis-empresas-e-um-fundo-da-reag-compraram-os-imoveis-de-paulo-henrique-costa). Unidades, endereços e nomes
  dos empresários não são reproduzidos. Hipótese investigativa.'
