  das autoridades para esclarecer os fatos em apuração. De todo modo, as medidas contribuirão para demonstrar
  que os fatos apurados nesta fase da investigação são rigorosamente lícitos. Augusto Lima sempre atuou
  dentro dos limites da lei, com transparência, responsabilidade técnica e observância das normas que
  regem o sistema financeiro e a administração pública.'''
