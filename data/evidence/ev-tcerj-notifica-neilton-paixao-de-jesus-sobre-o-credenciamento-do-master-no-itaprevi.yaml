id: ev-tcerj-notifica-neilton-paixao-de-jesus-sobre-o-credenciamento-do-master-no-itaprevi
kind: evidence
classification: D
proposition: O voto condutor do Acórdão nº 26.458/2026 do TCE-RJ (processo 206.599-7/26, assinado em
  03/08/2026) designa Neilton Paixão de Jesus como Presidente do Itaprevi e Presidente do Comitê de
  Investimentos e determina a sua notificação, no prazo de 15 dias, para apresentar as razões pelas quais
  assinou e validou o termo de credenciamento do Banco Master e, como presidente do Comitê, não incluiu o
  credenciamento na pauta. O mesmo voto registra que as aplicações em letras financeiras do banco ocorreram na
  gestão seguinte, de Fernanda Pereira da Silva Machado, nomeada em 12/06/2024. A notificação pede
  esclarecimentos e não é julgamento de mérito.
