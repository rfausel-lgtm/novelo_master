id: ev-pf-registra-interesse-e-nao-atuacao-parlamentar-no-pl-412
kind: evidence
classification: D
proposition: A PF não afirma que Jaques Wagner tenha atuado no PL 412/2022 em favor de Vorcaro ou de Augusto Lima.
  O que ela registra é interesse dos dois na matéria; nenhuma das mensagens apresentadas tem o senador como interlocutor,
  nada indica que as emendas lhe tenham chegado, e o relatório ressalva que a análise não pode ser considerada exaustiva.
