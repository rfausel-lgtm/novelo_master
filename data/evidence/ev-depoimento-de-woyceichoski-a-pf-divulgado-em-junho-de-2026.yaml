proposition: Segundo a CNN Brasil (18/06/2026), em matéria sobre depoimentos à PF tornados públicos em
  17/06/2026 pelo ministro André Mendonça, o capitão do iate Luis Felipe Woyceichoski disse em depoimento ter sido ameaçado de morte depois de
  registrar os danos que Daniel Vorcaro e convidados fizeram na embarcação, e relatou que "Manoel" lhe falou
  de forma intimidatória sobre a vida dele.
