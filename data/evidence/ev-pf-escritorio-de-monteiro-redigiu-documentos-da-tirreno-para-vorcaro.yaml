id: ev-pf-escritorio-de-monteiro-redigiu-documentos-da-tirreno-para-vorcaro
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, o advogado Daniel Lopes Monteiro e integrantes de seu escritório redigiram, sob
  supervisão de Daniel Vorcaro, documentos em nome da Tirreno, inclusive uma contranotificação ao BRB em nome de André
  Seixas Maia, numa atuação que para a PF extrapolou a assessoria jurídica; em 24/05/2025, ao mandar suprimir trecho que
  atribuía ao Master responsabilidade pelos documentos das carteiras, Vorcaro escreveu "Estamos notificando pra passar
  para os outros nao para assumir".
document_ids:
- doc-2026-03-11-ipja-1252786-analise-celular-vorcaro-tirreno-brb
source_ids:
