attributed_to: Polícia Federal, na IPJ-A nº 1252786/2026 (análise do celular de Daniel Vorcaro), juntada ao INQ 5.026
date: '2025-05-24'
notes: 'O relatório descreve um grupo de WhatsApp com Vorcaro e advogados do escritório criado, segundo Monteiro, "para
  facilitar o fechamento das operações", e registra que em 23/06/2025 Vorcaro, Ângelo Ribeiro da Silva e Alberto Félix
  supervisionaram o envio ao BRB de amostra de 1.785 contratos supostamente originados na Tirreno. Os demais advogados
  citados não são nomeados aqui, por não haver acusação formal contra eles. O perfil de Daniel Lopes Monteiro registra a
  prisão de 16/04/2026 e a posição da defesa. Hipótese investigativa.'
