id: ev-pedidos-do-novo-e-arquivamento-pendentes
kind: evidence
classification: C
proposition: 'Nenhuma das duas frentes teve desfecho até 04/09/2026. Os pedidos do partido Novo — afastamento
  cautelar de Andrei Rodrigues, em 02/09, e prisão preventiva, em 03/09 — seguem sem decisão do relator
  André Mendonça. E o arquivamento das alegações de intimidação é, até aqui, apenas manifestação da PGR:
  Paulo Gonet sustentou que Vorcaro ''não noticiou fato concreto ou juridicamente delimitado capaz de
  impulsionar providências investigativas próprias'' e que o depoimento seria ''flagrantemente inócuo
  e esvaziado de utilidade prática'', mas a decisão cabe a Mendonça e não foi proferida.'
