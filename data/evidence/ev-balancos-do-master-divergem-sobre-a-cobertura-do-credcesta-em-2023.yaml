id: ev-balancos-do-master-divergem-sobre-a-cobertura-do-credcesta-em-2023
kind: evidence
classification: D
proposition: 'A série de cobertura declarada pelo próprio banco não fecha. O balanço de 2024 afirma que
  o cartão de benefício estava em 24 estados e 176 municípios, ''ante 20 em 2023'' e 130 municípios; o
  balanço do exercício de 2023, porém, registrara 23 estados e 135 municípios, e o de 2022 falava em 21
  estados e 130 municípios. São três números irreconciliáveis para a mesma série, em demonstrações auditadas
  sem ressalva. Registre-se ainda que a expressão ''PKL One'' não aparece uma única vez nos balanços de
  2022, 2023 e 2024: a empresa cujo nome consta do contracheque do servidor não figura nas contas do banco
  que emitia o cartão.'
