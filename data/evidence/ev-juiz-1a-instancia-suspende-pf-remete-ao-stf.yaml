id: ev-juiz-1a-instancia-suspende-pf-remete-ao-stf
kind: evidence
classification: D
proposition: 'No mesmo dia 03/12/2025, em decisão distinta e no juízo de origem, o juiz federal substituto
  Antônio Cláudio Macedo da Silva determinou que a Polícia Federal não praticasse mais nenhum ato investigatório
  no IPL 2025.0087917, remetendo o inquérito e as cautelares conexas ao STF ''com urgência'' — por suspeita de
  investigação dirigida contra pessoa com foro por prerrogativa de função, a partir de documento apreendido
  supostamente ligado a parlamentar federal não identificado nos autos (associado à Pet 13.884/BA, Operação
  Overclean). O MPF opôs embargos de declaração, rejeitados em 07/12/2025 pelo mesmo juiz, que manteve a
  remessa com fundamentação atípica citando economia comportamental (Kahneman e Tversky).'
