notes: O parlamentar federal não é identificado nos autos do IPL lidos (referência sob sigilo). A liminar de
  09/12/2025 na Rcl 88.121 registra que o deputado federal João Carlos Paolilo Bacelar Filho é "referido nos
  documentos apreendidos" e lhe concede acesso aos autos — ver ev-rcl88121-liminar-leva-compliance-zero-ao-stf.
  A titularidade da pasta apreendida é alegação da defesa de Vorcaro, não fato apurado.
