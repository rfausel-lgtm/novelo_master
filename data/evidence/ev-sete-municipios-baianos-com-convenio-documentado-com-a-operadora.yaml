id: ev-sete-municipios-baianos-com-convenio-documentado-com-a-operadora
kind: evidence
classification: D
proposition: 'A varredura de 409 sedes municipais baianas localizou instrumentos com a operadora em sete:
  Senhor do Bonfim, com convênio assinado em 21/08/2020 e vigência até 21/08/2025; Alagoinhas, em 09/02/2021,
  renovado em 31/07/2024; Juazeiro, em 12/03/2021; Jacobina, com dois instrumentos, um em março e outro
  em 13/11/2021; Itapetinga, publicado em 08/07/2021; Barra do Choça, assinado digitalmente em 24/11/2021;
  e Alcobaça, publicado em 31/03/2022. A vigência padrão é de sessenta meses improrrogáveis. Somem-se
  aos já registrados Feira de Santana, de 02/05/2019, o mais antigo do estado, e a capital baiana pela
  via estadual.'
