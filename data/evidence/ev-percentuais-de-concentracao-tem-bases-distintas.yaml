id: ev-percentuais-de-concentracao-tem-bases-distintas
kind: evidence
classification: I
proposition: 'Os percentuais que circulam sobre a exposição da Amprev ao Banco Master não se contradizem:
  medem bases diferentes. Os R$ 401 milhões correspondem a 5,0% da carteira total em 31/07/2024, a cerca
  de 10,2% se medidos apenas contra o Plano Previdenciário, e a 4,71% da carteira de R$ 9,1 bilhões que
  Jocildo Lemos declarou em dezembro de 2025 — número que a autarquia divulga. Já os 40% que a decisão
  judicial atribui aos alertas de conselheiros incidem sobre a ''carteira líquida'', expressão que o documento
  não define e cuja base não é rastreável no corpus. Os três primeiros números são verificáveis; o quarto
  não.'
document_ids:
