inference_basis: 'Cálculo direto sobre o demonstrativo de 31/07/2024: R$ 401.241.332,00 sobre R$ 7.996.271.682,70
  de carteira total resulta em 5,02%; sobre os R$ 2.953.069.734,90 do Plano Previdenciário, 13,6% — a
  própria planilha atribui percentuais que situam duas das três letras nesse plano, resultando em concentração
  da ordem de 10%. A decisão judicial atribui os 40% expressamente à ''carteira líquida da entidade'',
  sem definir o termo nem apresentar a memória de cálculo.'
