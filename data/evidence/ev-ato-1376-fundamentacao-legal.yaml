proposition: O Ato do Presidente nº 1.376/2026 funda a liquidação da Will Financeira no art. 12, caput,
  XI, 'a', do Regimento Interno do BC (Resolução BCB 340/2023) e nos arts. 15, I, 'a', §2º, 16 e 51 da
  Lei 6.024/1974, e a decreta 'por extensão' da liquidação do Banco Master, referenciando expressamente
  o processo PE 301874. Fixa o termo legal da liquidação em 24/11/2025 — seis dias após a liquidação do
  Master (18/11/2025), não na data do próprio ato (21/01/2026).
