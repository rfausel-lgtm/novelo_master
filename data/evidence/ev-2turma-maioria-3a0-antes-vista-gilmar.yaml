proposition: Em sessão virtual extraordinária da 2ª Turma do STF iniciada às 10h de 08/09/2026, os ministros
  Luiz Fux e Nunes Marques acompanharam o voto do relator André Mendonça, formando maioria de 3 a 0 para
  manter o afastamento cautelar de Andrei Rodrigues, antes de Gilmar Mendes pedir vista às 10h05 — interrompendo
  a formalização do resultado, com Dias Toffoli ainda sem votar. Pelo regimento interno do STF, Gilmar
  Mendes tem até 90 dias para devolver a vista; o pedido de vista não suspende os efeitos da decisão monocrática,
  que permanece válida enquanto o julgamento colegiado não é concluído.
