notes: 'CORREÇÃO (17/09/2026): a primeira redação registrava a baixa sem a data e deixava em aberto qual pessoa
  jurídica recebeu os R$ 33 milhões de 2024. A data da extinção — 2013 — exclui esta sociedade, e a sociedade ativa
  da mesma titular é a Alves Corrêa & Veríssimo Advocacia (ver ev-a-pessoa-juridica-ativa-em-2024-e-a-alves-correa-verissimo).'
