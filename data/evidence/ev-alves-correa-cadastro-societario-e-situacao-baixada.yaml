id: ev-alves-correa-cadastro-societario-e-situacao-baixada
kind: evidence
classification: D
proposition: A sociedade de advogados Alves Corrêa & Advogados Associados, de Brasília, foi aberta em 14/05/2007
  com capital social de R$ 100 mil e tinha Dalide Barbosa Alves Corrêa como sócia-administradora e David Veríssimo
  de Souza como sócio, ambos desde a constituição; sua situação cadastral na Receita Federal é baixada, com a extinção
  registrada em 27/02/2013.
