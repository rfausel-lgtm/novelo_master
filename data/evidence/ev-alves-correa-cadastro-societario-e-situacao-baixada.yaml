id: ev-alves-correa-cadastro-societario-e-situacao-baixada
kind: evidence
classification: D
proposition: A sociedade de advogados Alves Corrêa & Advogados Associados, de Brasília, foi aberta em 14/05/2007
  com capital social de R$ 100 mil, tem Dalide Barbosa Alves Corrêa como sócia-administradora e David Veríssimo
  de Souza como sócio, ambos desde a constituição, e está com situação cadastral baixada na Receita Federal.
