date: '2026-02-23'
notes: É a descrição com que a PF abriu a apuração em apartado, depois deferida em 30/04/2026 (ver
  ev-instauracao-formal-investigacao-corrupcao-vorcaro-bc). Os elementos citados são a análise do celular de
  Vorcaro e uma notícia-crime do próprio Banco Central. Hipótese investigativa, sem denúncia até a data mais
  recente disponível.
