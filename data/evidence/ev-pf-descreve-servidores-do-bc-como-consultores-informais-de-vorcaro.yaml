id: ev-pf-descreve-servidores-do-bc-como-consultores-informais-de-vorcaro
kind: evidence
classification: A
proposition: Segundo a Polícia Federal, os servidores do Banco Central Paulo Sérgio Neves de Souza e Belline Santana
  atuaram de forma reiterada como consultores informais de Daniel Vorcaro, revisando minutas de documentos
  destinados ao próprio BC e ao FGC, antecipando posicionamentos internos e alinhando estratégias num grupo de
  mensagens chamado "Master", com indícios de vantagens indevidas custeadas pelo empresário.
