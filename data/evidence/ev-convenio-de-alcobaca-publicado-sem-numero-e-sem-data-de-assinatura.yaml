id: ev-convenio-de-alcobaca-publicado-sem-numero-e-sem-data-de-assinatura
kind: evidence
classification: D
proposition: Um dos instrumentos foi publicado incompleto pelo próprio município. O convênio de Alcobaça
  traz o número em branco no título e a data de assinatura igualmente em branco, na fórmula ', de de de
  20', embora estabeleça vigência de sessenta meses improrrogáveis 'a contar da assinatura' que não data.
  A falha importa porque torna indeterminável, pelo documento publicado, quando começa e quando termina
  a vigência do ajuste que autoriza descontos na folha dos servidores.
