proposition: Até 07/09/2026, nenhuma das quatro pessoas chamadas por Fachin (Moraes, Mendonça, Gonet,
  Andrei Rodrigues) havia apresentado manifestação formal por escrito respondendo ao despacho de 03-04/09
  — o prazo comum de 5 dias úteis vence sexta-feira, 11/09/2026. Gonet já havia se manifestado publicamente
  em 02/09/2026, ANTES do despacho formal, pedindo a nulidade do procedimento aberto por Moraes — não
  está claro se essa manifestação satisfaz formalmente o parecer de admissibilidade pedido por Fachin,
  ou se exige reafirmação nos autos.
