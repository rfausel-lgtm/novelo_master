id: ev-cmn-res-5279-estatuto-art-10-pars-3-e-4-devolucao-ou-complemento-de-contribuicoes-corrigidos-pela-taxa-basica
kind: evidence
classification: D
proposition: O texto consolidado da Res. CMN 4.222 (v19, BC) marca como incluídos pela Res. CMN 5.279, de
  22/1/2026, os §§ 3º e 4º do art. 10 do estatuto do FGC. Os valores de contribuições apurados a maior ou a
  menor devem ser restituídos ou complementados, corrigidos pela taxa básica de juros, no período de até
  trinta e seis meses contados do termo final de remessa das informações necessárias ao cálculo, e em até
  cinco dias úteis da requisição de restituição ou da apuração da contribuição.
document_ids:
