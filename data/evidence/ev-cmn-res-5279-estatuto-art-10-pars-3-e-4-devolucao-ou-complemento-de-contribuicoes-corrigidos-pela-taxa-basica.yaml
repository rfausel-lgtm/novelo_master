excerpt: devem ser restituídos ou complementados, conforme o caso, corrigidos pela taxa básica de juros
locator: Anexo I (estatuto), art. 10, §§ 3º e 4º (incluídos)
date: 2026-01-22
notes: D demonstra o conteúdo dos dispositivos; o consolidado não mostra regra anterior sobre o tema.
