id: ev-stf-informa-em-nota-o-cumprimento-de-mandados-contra-perito-criminal-federal-em-19-05-2026
kind: evidence
classification: D
proposition: Em nota de 19/05/2026, o STF informou que, por decisão do relator André Mendonça, tomada em 18/05
  a pedido da PF, estavam sendo cumpridos naquele dia dois mandados de busca e apreensão e medidas cautelares
  diversas da prisão, entre elas a suspensão do exercício da função pública do policial federal investigado,
  em apuração de eventual violação de sigilo funcional.
