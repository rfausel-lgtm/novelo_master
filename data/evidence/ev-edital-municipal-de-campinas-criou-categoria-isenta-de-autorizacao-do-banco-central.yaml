id: ev-edital-municipal-de-campinas-criou-categoria-isenta-de-autorizacao-do-banco-central
kind: evidence
classification: D
proposition: O Chamamento Público nº 003/2023 da empresa municipal IMA, de Campinas, dividiu os interessados entre
  instituições financeiras 'autorizadas pelo Banco Central do Brasil' e gestoras de cartão de crédito 'isentas de
  autorização do Banco Central do Brasil', e credenciou no mesmo dia a operadora (Termo nº 007/2023) e o Banco Master
  (Termo nº 008/2023).
