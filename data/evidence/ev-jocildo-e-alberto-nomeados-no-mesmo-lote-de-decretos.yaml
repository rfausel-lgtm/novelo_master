proposition: Jocildo Silva Lemos e Alberto Samuel Alcolumbre Tobelem foram nomeados por decretos de mesma
  data (02/01/2023), assinados pelo mesmo governador e publicados na mesma edição do Diário Oficial —
  o Decreto nº 0028 dá a Lemos a direção da Amprev; os Decretos nº 0018 e nº 0019 dão a Tobelem assento
  no Colégio e a presidência da Junta Comercial do Estado.
