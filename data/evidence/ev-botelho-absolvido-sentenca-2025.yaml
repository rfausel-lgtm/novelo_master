excerpt: Não se pode negar que o delito considerado como praticado nos presentes autos relaciona-se com
  o ato de gestão fraudulenta do Banco Máxima S/A, em relação ao qual, não tinha, o Réu Benjamim Botelho
  de Almeida, qualquer relação de controle, administração ou gerência de tal Instituição Financeira, conforme
  exige o artigo 25 da Lei nº 7.492/1986.
