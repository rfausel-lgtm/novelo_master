id: ev-gonet-dupla-nulidade-pet-16662
kind: evidence
classification: D
proposition: 'Na manifestação de 01/09/2026, Gonet sustenta que a ordem de investigação e os elementos
  por ela colhidos sofrem ''dupla nulidade'': primeiro, por exceder a competência do relator na fase pré-processual
  (determinar investigação de pessoas específicas sem pedido do Ministério Público nem iniciativa policial,
  em violação ao art. 3º-A do CPP); segundo, porque a competência para investigar ministro do STF é exclusiva
  do Plenário (CF, art. 102, I, ''b''), de modo que o relator, ao suspeitar de um colega, deveria ter
  levado a suspeita ao presidente da Corte, não aprofundado ele mesmo a apuração.'
document_ids:
- doc-2026-09-01-manifestacao-gonet-pet-16662
source_ids:
- src-conjur-2026-09-manifestacao-gonet-pdf
excerpt: A ordem dada à autoridade policial para investigar pessoas específicas, sem pedido do Ministério
  Público e sem iniciativa da autoridade policial, é nula, por exceder os limites de competência do magistrado
  na fase pré-processual.
