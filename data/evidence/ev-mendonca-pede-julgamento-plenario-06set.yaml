id: ev-mendonca-pede-julgamento-plenario-06set
kind: evidence
classification: C
proposition: André Mendonça enviou, em 06/09/2026 (domingo), o caso da acusação de Moraes contra ele para
  julgamento pelo plenário completo do STF — não apenas pelo presidente Fachin. O Poder360 descreve o ato
  como pedido formal de deslocamento de competência, invocando expressamente o art. 5º do RISTF (competência
  do plenário para julgar ministros e o PGR por crimes comuns); a Gazeta do Povo, em apuração própria e
  distinta, descreve o mesmo ato como uma liberação do caso para o plenário, sem citar o dispositivo
  regimental. É rito distinto da resposta de mérito exigida no despacho de 03-04/09; cabe a Fachin pautar
  o caso, sem data definida até a data desta apuração.
