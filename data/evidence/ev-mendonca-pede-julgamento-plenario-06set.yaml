id: ev-mendonca-pede-julgamento-plenario-06set
kind: evidence
classification: C
proposition: André Mendonça formalizou, em 06/09/2026 (domingo), pedido para que o plenário completo do
  STF — não apenas o presidente Fachin — julgue o caso da acusação de Moraes contra ele, invocando o art.
  5º do RISTF (competência do plenário para julgar ministros e o PGR por crimes comuns). É pedido de deslocamento
  de competência/rito, distinto da resposta de mérito exigida no despacho de 03-04/09; cabe a Fachin pautar
  o caso, sem data definida até a data desta apuração.
