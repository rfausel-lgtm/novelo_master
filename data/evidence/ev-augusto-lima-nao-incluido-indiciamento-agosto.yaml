id: ev-augusto-lima-nao-incluido-indiciamento-agosto
kind: evidence
classification: C
proposition: Augusto Lima NÃO foi incluído no indiciamento de agosto de 2026 (inquérito-mãe da Compliance
  Zero) — só Daniel Vorcaro, Paulo Henrique Costa (ex-BRB) e Nelson Tanure foram indiciados. Ele segue
  em prisão domiciliar com tornozeleira eletrônica sem alteração das condições. Seu depoimento, marcado
  para início de agosto de 2026, foi adiado pela terceira vez, remarcado para 'setembro de 2026' sem data
  específica fixada. Em 04/08/2026, sua defesa anterior renunciou em meio a rumor de mudança de estratégia;
  a nova defesa nega categoricamente qualquer negociação de delação premiada.
