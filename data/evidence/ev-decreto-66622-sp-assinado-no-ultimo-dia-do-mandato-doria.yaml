id: ev-decreto-66622-sp-assinado-no-ultimo-dia-do-mandato-doria
kind: evidence
classification: D
proposition: O decreto que criou o cartão de benefício na folha do funcionalismo paulista foi assinado
  em 31 de março de 2022 — último dia do mandato de João Doria, véspera da posse de seu sucessor. Cria
  a espécie como consignação facultativa 'limitada a 15% da margem consignável' e admite como consignatárias
  empresas administradoras de cartões 'conveniadas com instituições financeiras devidamente autorizadas
  pelo Banco Central do Brasil'.
document_ids:
- doc-2022-03-31-decreto-66622-sp-cartao-beneficio
source_ids:
- src-alesp-decreto-66622-2022-cartao-beneficio
excerpt: XI - aquisição de bens e serviços, à vista ou financiada, assim como saques emergenciais, por
  meio de cartão de benefício, limitada a 15% da margem consignável.
