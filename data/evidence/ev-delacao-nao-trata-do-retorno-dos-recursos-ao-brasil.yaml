proposition: 'Nada do que se conhece do conteúdo da colaboração trata do retorno dos recursos ao Brasil: o relato
  do colaborador cobre a saída do dinheiro, entre fevereiro e setembro de 2025, e não menciona a via cambial de
  entrada nem a instituição que, entre 10/11 e 30/12/2025, creditou R$ 3,92 milhões na conta brasileira da produtora.'
