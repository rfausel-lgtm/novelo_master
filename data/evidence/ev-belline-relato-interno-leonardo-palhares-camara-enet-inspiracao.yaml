date: '2026-01-07'
notes: É a versão mais antiga e mais detalhada dele sobre o esquema, dada antes de qualquer repercussão pública
  — mais detalhada que a versão já registrada no verbete (via reportagem de abril/2026) e que cita dois veículos
  adicionais (Câmara e.Net e Inspiração) não mencionados na cobertura de imprensa já no acervo, que fala apenas
  da Varajo Consultoria. Não está estabelecido se são etapas do mesmo esquema ou descrições parcialmente sobrepostas
  — o total de R$ 2 milhões citado aqui coincide com um dos dois contratos da Varajo já registrados (também de R$
  2 milhões).
