id: ev-belline-relato-interno-leonardo-palhares-camara-enet-inspiracao
kind: evidence
classification: D
proposition: Em relato verbal prestado à Corregedoria-Geral do BC em 07/01/2026 — antes de qualquer repercussão
  pública do caso —, Belline Santana admitiu ter recebido de 'Leonardo Palhares' (que se apresentou como ligado
  à Câmara e.Net) uma oferta de R$ 2 milhões por um projeto de inclusão financeira de jovens carentes, mediante
  uso apenas do seu nome e imagem, sem necessidade de trabalho efetivo; recebeu duas parcelas de R$ 500 mil em 2023,
  interrompeu os pagamentos em 2024 'por desconforto', e retomou em 2025, desta vez por meio de uma pessoa jurídica
  criada por ele mesmo, a 'Inspiração', recebendo parcelas mensais de R$ 100 mil. Negou saber que o Banco Master
  estivesse por trás dos pagamentos.
document_ids:
