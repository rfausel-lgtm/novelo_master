proposition: 'Em 02/04/2025, o deputado federal Antônio Carlos Rodrigues (PL/SP) representou ao PGR Paulo
  Gonet, classificando a aquisição do Banco Master pelo BRB como possível "desvio de finalidade
  institucional" e acusando Banco Central, CVM, FGC e Anbima de omissão. É qualificação política do próprio
  deputado, não apuração técnica — mas antecede a instauração formal do IPL 2025.0087917 e foi formalmente
  correlacionada a ele pelo MPF.'
