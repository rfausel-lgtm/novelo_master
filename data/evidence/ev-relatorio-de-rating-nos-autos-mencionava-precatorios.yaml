id: ev-relatorio-de-rating-nos-autos-mencionava-precatorios
kind: evidence
classification: D
proposition: Os autos contêm também o relatório da agência de classificação de risco sobre o banco, em
  inglês, que descreve entre as verticais de negócio mais relevantes da instituição, em junho de 2023,
  os títulos judiciais emitidos pelo governo federal brasileiro — precatórios —, ao lado do crédito consignado,
  do câmbio e de operações de crédito privado securitizadas por meio de seus fundos. A exposição a precatórios,
  que viria a ser o núcleo das acusações de superavaliação de ativos, estava declarada no material que
  instruiu o credenciamento.
