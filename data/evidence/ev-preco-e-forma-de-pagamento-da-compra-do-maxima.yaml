id: ev-preco-e-forma-de-pagamento-da-compra-do-maxima
kind: evidence
classification: A
proposition: Em 15 de setembro de 2017, Daniel Vorcaro contratou a compra, junto a Saul Dutra Sabbá, de
  ações representativas de 56,87% do capital do Banco Máxima por R$ 40 milhões. A forma de pagamento foi
  posteriormente alterada para R$ 36 milhões em cotas do fundo Brazil Realty e R$ 4 milhões em espécie
  — ou seja, apenas um décimo do preço saiu em dinheiro, e o restante em cotas do mesmo fundo que, segundo
  o voto BCB 20/2019, teria recebido recursos originados no próprio Banco Máxima.
