id: ev-figueiredo-bc-trustee-indisponibilidade-bens-nao-banvox
kind: evidence
classification: A
proposition: No decreto de liquidação extrajudicial da Trustee (03/09/2026), o Banco Central incluiu Artur
  Martins de Figueiredo na lista de ex-administradores com bens tornados indisponíveis, junto com Ângelo
  Pinheiro de Castro, Estevam Borali, Flávio Daniel Aguetoni, Luis Fernando de Almeida e Rogério Penteado
  Felgueiras. Ele NÃO aparece na lista equivalente da liquidação da Banvox Distribuidora — a indisponibilidade
  de bens parece vinculada especificamente à Trustee, não à Banvox Holding Financeira.
