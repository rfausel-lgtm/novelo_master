id: ev-moraes-diz-pet15645-nao-teve-sigilo-levantado-antes-do-julgamento
kind: evidence
classification: D
proposition: 'Dois dias antes da sessão extraordinária de 15/09/2026, Moraes informou por escrito a Fachin
  que a Pet 15.645 — distribuída por prevenção a André Mendonça — "não foi levantado o sigilo", apesar da
  ordem de 11/09/2026 que mandava levantar o sigilo de todos os procedimentos ligados à Pet 15.556/Operação
  Compliance Zero. Segundo Moraes, a Pet 15.645 "possui elementos essenciais para o julgamento da PET 16662",
  o processo que decidirá se ele será investigado. Pediu a Fachin que determinasse o levantamento do sigilo
  e a disponibilização dos autos a todo o colegiado antes do julgamento.'
document_ids:
