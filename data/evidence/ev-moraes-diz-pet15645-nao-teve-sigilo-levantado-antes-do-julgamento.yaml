- edson-fachin
- andre-mendonca
notes: A natureza dos "elementos essenciais" que a Pet 15.645 conteria não é detalhada no ofício; não há,
  até esta coleta, notícia de resposta de Fachin ao pedido, nem confirmação de que o sigilo tenha sido
  levantado antes da sessão de 15/09.
