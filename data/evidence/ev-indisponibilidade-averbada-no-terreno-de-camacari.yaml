date: '2026-06-19'
notes: A defesa afirma que o pedido de registro foi feito pela compradora, com procuração dada na escritura, e que
  Wagner só teve ciência da decisão em 26/06/2026. A decisão de 19/06 não menciona o terreno; o bloqueio decorre
  da ordem geral de indisponibilidade na CNIB.
