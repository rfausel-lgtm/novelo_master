kind: evidence
id: ev-indisponibilidade-averbada-no-terreno-de-camacari
classification: C
proposition: A escritura de venda do terreno de Camaçari foi apresentada a registro em 19/06/2026, dia seguinte
  à 9ª fase da Compliance Zero, e o cartório averbou a indisponibilidade decorrente da PET 16.230, de modo que o
  imóvel permaneceu em nome de Jaques Wagner.
document_ids:
- doc-2026-07-20-manifestacao-wagner-pet16230-terreno-camacari
