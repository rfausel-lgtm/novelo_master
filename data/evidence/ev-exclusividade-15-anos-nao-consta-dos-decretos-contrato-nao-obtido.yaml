id: ev-exclusividade-15-anos-nao-consta-dos-decretos-contrato-nao-obtido
kind: evidence
classification: I
proposition: 'A exclusividade de quinze anos sobre a folha dos servidores baianos, até 2033, é repetida
  por diversos veículos e é o lastro invocado para a continuidade do negócio — mas NÃO está nos decretos.
  A equipe leu os Decretos 18.353 e 18.354 artigo por artigo e não localizou prazo nem exclusividade:
  ambos remetem a ''contrato específico'' a ser firmado com o Estado, que detalharia funcionamento, obrigações
  e prazos. Esse contrato não foi obtido. Também não foram localizados, em fonte oficial, o edital do
  leilão e o instrumento de compra e venda: uma única fonte cita ''Edital de Alienação nº 01/2018'' e
  ''Contrato de Aquisição EBAL nº 06/2018'', com cláusula que preveria os quinze anos, mas essa mesma
  fonte contém erros verificáveis de datas, e os números não foram confirmados documentalmente. O Diário
  Oficial do Estado exige cadastro para acesso a edições históricas. Portanto: a existência da exclusividade
  é amplamente noticiada e não contestada, mas seu fundamento documental permanece não verificado pelo
  corpus — assim como a eventual contrapartida exigida em troca dela, que nenhuma fonte descreve.'
