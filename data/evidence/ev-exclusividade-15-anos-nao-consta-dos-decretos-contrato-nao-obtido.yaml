inference_basis: Leitura integral dos dois decretos, com verificação artigo por artigo, confrontada com
  a afirmação corrente na imprensa. A ausência da cláusula no texto legal é fato; sua presença no contrato
  é alegação não verificada, por indisponibilidade do instrumento.
