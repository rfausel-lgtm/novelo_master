proposition: A decisão registra que Jaques Wagner teria encaminhado a Augusto Ferreira Lima os dados do
  empreendimento Poème Horto, do corretor responsável e da unidade nº 1.702, avaliada em cerca de R$ 2.450.000,00;
  que Augusto teria acionado Valério Marega Júnior ('Valério Fundos') para operacionalizar a aquisição;
  e que ela teria sido realizada com o auxílio de Daniel Lopes Monteiro e David Lopes Monteiro.
