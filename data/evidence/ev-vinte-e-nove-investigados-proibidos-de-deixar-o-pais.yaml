id: ev-vinte-e-nove-investigados-proibidos-de-deixar-o-pais
kind: evidence
classification: D
proposition: A decisão proibiu 29 investigados, entre eles o deputado federal Mário Frias e Karina Ferreira da Gama,
  de se ausentarem do território nacional sem autorização do relator, com entrega de passaporte à Polícia Federal,
  e vedou qualquer comunicação, direta ou indireta, entre eles.
document_ids:
- doc-2026-09-03-decisao-dino-pet16669-operacao-make-up
locator: p. 147-149 (itens III.G e III.H)
date: '2026-09-03'
notes: Ao fundamentar o risco de evasão, a decisão cita a existência de empresa do grupo sediada no exterior, a
  Go Up Entertainment LLC, e registra que Frias, em viagem internacional, retardou a prestação de informações no
  curso da PET 16.070/DF.
