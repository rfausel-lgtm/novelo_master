id: ev-lei-12933-2025-mt-encerra-margem-cartao-beneficio-e-sobrevive-ao-stf
kind: evidence
classification: C
proposition: 'A norma que efetivamente inviabilizou o modelo do cartão de benefício em Mato Grosso não
  é nenhuma das duas derrubadas pelo Supremo, e sim a lei estadual sancionada em 18/06/2025, que proíbe
  a abertura de margem consignável para cartão de crédito, cartão de benefício e congêneres e limita as
  consignações a 35% da remuneração líquida. Ela encerrou a margem exclusiva de 10% criada pelo decreto
  de 2023 e permaneceu intacta: não foi objeto da ação direta nem da arguição julgadas em 2026. A distinção
  importa para não confundir o que caiu com o que ficou.'
