id: ev-natalia-vorcaro-zettel-nova-operadora-financeira-a-turma
kind: evidence
classification: A
proposition: Segundo elementos da IPJ nº 2293065/2026, citados na decisão de 19/06/2026 na PET 15.693,
  Natália Bueno Vorcaro Zettel teria assumido o papel de operadora financeira do núcleo "A Turma" após a
  prisão preventiva do marido, Fabiano Campos Zettel, em 04/03/2026.
document_ids:
- doc-2026-06-19-decisao-pet15693-dados-armazenados
