attributed_to: Autoridade policial, com base na IPJ nº 2293065/2026, encampada pela PGR e citada na decisão
  de André Mendonça
date: '2026-06-19'
notes: É o único elemento genuinamente novo entre os 17 nomes desta decisão — a própria PGR, citada no
  texto, afirma que a situação dos demais 15 (fora Mourão) já foi "exercida de modo satisfativo" nas
  Petições 15.556 e 15.978. A IPJ nº 2293065/2026 em si não tem, até esta data, nenhum documento
  correspondente no acervo — referência nova, conhecida apenas indiretamente por esta citação. Tratar como
  alegação em fase de investigação, não fato apurado; nenhuma denúncia ou decisão de mérito contra ela
  consta do acervo.
