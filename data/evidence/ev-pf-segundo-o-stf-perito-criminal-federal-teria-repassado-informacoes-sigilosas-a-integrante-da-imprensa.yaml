id: ev-pf-segundo-o-stf-perito-criminal-federal-teria-repassado-informacoes-sigilosas-a-integrante-da-imprensa
kind: evidence
classification: A
proposition: Segundo a PF, conforme a nota do STF de 19/05/2026, o investigado, na condição de perito criminal
  federal, teria repassado a integrante da imprensa informações sigilosas relacionadas a fatos do início das
  investigações, obtidas da análise de material apreendido em uma das fases da Operação Compliance Zero.
