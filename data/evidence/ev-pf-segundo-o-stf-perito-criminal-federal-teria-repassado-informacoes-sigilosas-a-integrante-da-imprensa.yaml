notes: Alegação da PF no âmbito de uma investigação, em tese; não é conclusão judicial nem conclusão do
  Novelo. A mesma nota diz que a investigação se destina à apuração da conduta de agente público que, em tese,
  teria violado o dever funcional de resguardar informações sigilosas.
