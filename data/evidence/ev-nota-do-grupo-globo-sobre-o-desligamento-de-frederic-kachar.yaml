id: ev-nota-do-grupo-globo-sobre-o-desligamento-de-frederic-kachar
kind: evidence
classification: C
proposition: Em 15/10/2026 o Grupo Globo comunicou o desligamento de Frederic Kachar da direção-geral de Mídia
  Impressa e Rádio e afirmou que as conversas privadas dele com Daniel Vorcaro, às quais teve acesso em 14/10,
  revelam relação inadequada do executivo com um anunciante.
