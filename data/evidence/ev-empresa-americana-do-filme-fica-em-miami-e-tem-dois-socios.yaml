notes: 'O corpus não verificou o registro societário no órgão estadual da Flórida: a consulta pública ao portal
  de corporações do estado está atrás de verificação anti-bot, e a equipe não contorna esse tipo de barreira. A
  informação fica atribuída à reportagem. Registre-se ainda uma divergência menor: um verbete enciclopédico dá a
  sede como Thousand Oaks, na Califórnia.'
