proposition: A Goup Entertainment LLC, empresa americana da produção, é sediada em Miami, na Flórida, e tem como
  sócios a brasileira Karina Ferreira da Gama — a mesma sócia-administradora da empresa brasileira — e Michael Brian
  Davis, brasileiro naturalizado nos Estados Unidos.
