id: ev-precatorios-lista-no-celular-de-vorcaro-segundo-a-imprensa
kind: evidence
classification: A
proposition: >-
  Segundo o SBT News e o Times Brasil (23/09/2026), as três empresas beneficiárias dos 16 precatórios (Usina
  Capricho, Una Agroindustrial e Vale do Ceará Mirim) constam de lista encontrada no celular de Daniel Vorcaro
  como "precatórios a receber"; segundo o Times Brasil, a Usina Capricho consta também de minuta de contrato de
  serviços advocatícios de março de 2024 envolvendo o Banco Master e o escritório Queiroga, Vieira, Queiroz &
  Ramos.
attributed_to: SBT News e Times Brasil
document_ids: []
source_ids:
- src-sbtnews-2026-09-23-cnj-cancela-r-4-7-bilhoes-em-precatorios-ligados-ao-master
- src-timesbrasil-2026-09-23-cnj-manda-cancelar-r-4-7-bilhoes-em-precatorios-ligados-ao-master-e-devolver-valores-ao-tesouro
- src-agenciabrasil-2026-09-23-cnj-cancela-r-4-7-bilhoes-em-precatorios-ligados-ao-master
date: '2026-09-23'
notes: >-
  O Novelo não localizou a lista nem a minuta. A Agência Brasil diz apenas que as usinas "negociaram os créditos
  com o Banco Master", sem documentar. As três empresas do aditamento de 28/09 (Santa Helena, Agrovale e
  Borborema) não são ligadas ao Master por nenhuma fonte aberta. As manchetes "ligados ao Master" não são
  proposição.
