id: ev-capital-nao-comunicou-aos-servidores-o-descredenciamento
kind: evidence
classification: D
proposition: 'Passado quase um mês do descredenciamento, a capital paulista não havia publicado comunicado
  aos servidores sobre a rubrica. A comparação interna dá a medida: ao descredenciar outra consignatária,
  a mesma prefeitura publicou, em 01/09/2026, comunicado próprio suspendendo a rubrica na competência
  de outubro e liberando a margem correspondente. Nada equivalente foi localizado para a operadora do
  CredCesta até 10/09/2026 — de modo que o servidor descontado não foi formalmente informado.'
