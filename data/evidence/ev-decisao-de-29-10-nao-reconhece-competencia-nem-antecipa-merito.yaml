id: ev-decisao-de-29-10-nao-reconhece-competencia-nem-antecipa-merito
kind: evidence
classification: D
proposition: A decisão de 29/10/2026 na PET 16.704 declara que não importa reconhecimento definitivo de
  competência, prevenção ou conexão nem antecipação de juízo sobre o mérito dos procedimentos investigatórios,
  e registra que o reexame da remessa não é juízo sobre a representação apresentada pelo ministro Alexandre de
  Moraes, pendente de apreciação pelo Plenário, único órgão competente para deliberar sobre eventual
  investigação.
