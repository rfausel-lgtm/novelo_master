id: ev-taxas-do-credcesta-versus-mercado
kind: evidence
classification: A
proposition: As taxas do CredCesta são de ordem distinta das do consignado público. Segundo levantamento
  do Poder360 sobre dados de mercado, o produto cobrava cerca de 5% ao mês — 4,72% no fim de 2019 e 4,98%
  no primeiro semestre de 2020 —, contra média de 1,37% a 1,59% ao mês registrada pelo Banco Central para
  o consignado público, e taxas de 1,34% no Bradesco, 1,35% na Caixa e 1,72% no Itaú. A associação de
  servidores e a imprensa baiana falam em encargos acima de 100% ao ano, patamar compatível com rotativo
  de cartão e não com consignado.
