proposition: Ao ser cobrado, em 02/09/2026, sobre o impeachment de Moraes, Alcolumbre respondeu em plenário citando
  que 'pediram R$ 130 milhões para a mesma pessoa para fazer um filme', numa fala interpretada pela imprensa como
  referência velada ao financiamento do Dark Horse por Daniel Vorcaro e como contra-ataque a quem pressiona pelo
  impeachment.
attributed_to: Davi Alcolumbre, em sessão do plenário do Senado
