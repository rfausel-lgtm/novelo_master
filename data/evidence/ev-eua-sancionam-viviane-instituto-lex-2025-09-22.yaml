id: ev-eua-sancionam-viviane-instituto-lex-2025-09-22
kind: evidence
classification: C
proposition: Em 22/09/2025, o Departamento do Tesouro dos EUA ampliou para Viviane Barci de Moraes e para
  o Instituto Lex as sanções da Lei Magnitsky já aplicadas a Alexandre de Moraes em 30/07/2025, classificando-os
  como parte da 'rede de apoio financeiro' do ministro. As sanções incluíram congelamento de eventuais
  ativos nos EUA, proibição de uso de cartões de crédito americanos e restrição de viagem ao país.
