id: ev-palhares-nunca-depos-cpi-reuniao-cancelada
kind: evidence
classification: D
proposition: Leonardo Palhares foi convocado pela CPI do Crime Organizado do Senado por meio do Requerimento
  nº 240/2026, do senador Alessandro Vieira, aprovado em 11/03/2026, e do Ofício nº 223/2026, que marcou
  seu depoimento para 01/04/2026. A reunião foi cancelada, sem que a presidência da comissão divulgasse
  o motivo, e ele nunca depôs; o relatório final da CPI foi rejeitado em 14/04/2026. O requerimento sustenta
  que 'o papel de Leonardo Palhares não se restringe à mera formalização documental pontual, posicionando-o
  [...] como elemento central na estruturação dos instrumentos contratuais que conferiram aparência de
  legalidade ao esquema de pagamentos ilícitos'.
