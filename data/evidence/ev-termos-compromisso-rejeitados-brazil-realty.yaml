id: ev-termos-compromisso-rejeitados-brazil-realty
kind: evidence
classification: D
proposition: Antes do julgamento, Daniel Vorcaro e o Banco Master propuseram termo de compromisso de R$
  10,89 milhões; a Viking Participações, R$ 2,97 milhões; a Entre Investimentos, R$ 4,95 milhões; e Antônio
  Freixo, R$ 2,47 milhões. O colegiado da CVM rejeitou todas as propostas, optando por levar o caso a
  julgamento de mérito, no qual as penas aplicadas superaram largamente os valores oferecidos.
