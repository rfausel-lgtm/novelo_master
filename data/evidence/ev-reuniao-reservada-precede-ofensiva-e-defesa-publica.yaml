id: ev-reuniao-reservada-precede-ofensiva-e-defesa-publica
kind: evidence
classification: A
proposition: Alexandre de Moraes e Davi Alcolumbre se reuniram reservadamente por cerca de três horas na
  residência do senador, no Lago Sul, em 02/09/2026, véspera da decisão de Moraes de 03/09/2026 contra
  Mendonça (que cita Alcolumbre nominalmente como um dos alvos do suposto direcionamento). Horas depois do
  encontro, Alcolumbre saiu em defesa pública de Moraes.
