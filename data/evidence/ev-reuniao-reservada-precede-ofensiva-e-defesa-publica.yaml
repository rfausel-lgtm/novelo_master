date: '2026-09-02'
notes: Coincidência temporal forte (reunião na véspera; decisão no dia seguinte; defesa pública horas depois),
  mas nenhuma fonte estabelece causalidade nem reproduz o conteúdo da conversa — a equipe não confirma que
  a decisão de Moraes tenha sido combinada ou influenciada pelo encontro, apenas registra a sequência.
