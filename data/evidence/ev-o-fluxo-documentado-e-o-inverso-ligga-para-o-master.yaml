id: ev-o-fluxo-documentado-e-o-inverso-ligga-para-o-master
kind: evidence
classification: C
proposition: 'O fluxo financeiro documentado entre a Ligga Telecom e o Banco Master corre no sentido oposto
  ao que a hipótese de aporte sugeriria: foi a operadora que retirou recursos do próprio caixa para aplicar
  em cédulas de crédito bancário do banco, a partir de outubro de 2022. As cifras divergem entre as fontes
  — cerca de R$ 350 milhões segundo apuração jornalística baseada em elementos da investigação, mais de
  R$ 400 milhões segundo notificação extrajudicial de acionista minoritária. Uma agência de classificação
  de risco rebaixou a empresa em novembro de 2025 apontando opacidade de informação sobre a alocação dessas
  aplicações financeiras. A Ligga sustenta não possuir, atualmente, qualquer aplicação financeira no Banco
  Master, direta ou indiretamente.'
