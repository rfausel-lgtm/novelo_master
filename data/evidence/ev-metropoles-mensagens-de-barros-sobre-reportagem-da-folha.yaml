date: 2024-08-08
notes: O Metrópoles é parte interessada (publicou um dia depois da reportagem do UOL sobre ele). A Folha
  contesta cada ponto (ev-folha-responde-ao-metropoles-sobre-a-reportagem-de-2024). Mensagem no aparelho não
  prova o que diz.
