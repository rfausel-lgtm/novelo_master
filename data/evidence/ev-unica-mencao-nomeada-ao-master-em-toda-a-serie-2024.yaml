id: ev-unica-mencao-nomeada-ao-master-em-toda-a-serie-2024
kind: evidence
classification: D
proposition: 'Em toda a série de atas do Comitê de Investimentos do Rioprevidência de 2023 e 2024 examinada
  pela equipe, o nome do Banco Master aparece explicitamente uma única vez: na tabela de posição de fevereiro
  de 2024, publicada na ata de março, no valor de R$ 123.265.936. Não está no corpo deliberativo da ata
  — é anexo de posição de carteira —, e o padrão reverte à anonimização já no mês seguinte, onde a mesma
  linha volta a aparecer apenas como ''LETRA FINANCEIRA IPCA + X%''.'
