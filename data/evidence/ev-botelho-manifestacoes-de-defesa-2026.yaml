id: ev-botelho-manifestacoes-de-defesa-2026
kind: evidence
classification: A
proposition: Contrariando o registro anterior do corpus, Benjamim Botelho de Almeida manifestou-se publicamente.
  Em nota de seus advogados, publicada em 09/03/2026, afirma que deixou definitivamente o Brasil em 2018,
  tendo retornado apenas três vezes em sete anos, e contesta com datas específicas a afirmação de que
  seria visto semanalmente na Faria Lima; sustenta que 'não vai aos Estados Unidos da América há mais
  de nove anos' e 'repudia veementemente' ser descrito como operador financeiro de Daniel Vorcaro naquele
  país; e afirma que a ação penal sobre o Banco Máxima resultou em sua absolvição. Em nota posterior,
  afirma que 'foi diretor contratado da Aquilla por um curto período e nunca foi responsável pela área
  de Compliance e Know Your Client', tendo se desligado voluntariamente 'há mais de 10 anos' — caracterização
  que convive com o registro da CVM de que exerceu a direção responsável da gestora do grupo por cerca
  de quatro anos e meio, até janeiro de 2016. A Sefer, por sua assessoria, declarou que todas as operações
  'observam rigorosamente a legislação do mercado de capitais' e são 'lícitas, regulares e pautadas por
  critérios técnicos'. Em outras ocasiões — sobre a liquidação da Sefer e sobre a menção ao fundo Jaguar
  na delação de João Carlos Mansur — ele não respondeu ou não foi procurado.
