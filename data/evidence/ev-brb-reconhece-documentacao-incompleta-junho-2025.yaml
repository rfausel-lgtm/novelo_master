id: ev-brb-reconhece-documentacao-incompleta-junho-2025
kind: evidence
classification: A
proposition: 'No mesmo ofício de 18/06/2025, o BRB afirma ter identificado, durante o acompanhamento das
  carteiras adquiridas em 2025, que tranches recentes de crédito consignado tinham origem em "promotores
  de vendas com atuação de bancarizadores contratados pelo Banco Master", e atribui a medidas adicionais de
  garantia (R$ 9,3 bilhões) à "intempestividade no envio das informações complementares" pelo Master e à
  "não conclusão dos trabalhos da auditoria independente" contratada.'
attributed_to: Paulo Henrique Costa, Dário Oswaldo Garcia Júnior e Robério Bonfim Mangueira, no Ofício
  PRESI-2025/051 (BRB ao Banco Central)
document_ids:
- doc-2025-06-18-oficio-presi-2025-051-brb-ao-bc
source_ids:
- src-stf-inq5026-ipl1096304-completo
date: '2025-06-18'
notes: É a versão institucional do próprio BRB sobre as causas do problema, não apuração independente do
  Banco Central ou da PF — trata-se da explicação do banco comprador para as medidas que tomou, não uma
  conclusão de terceiro sobre responsabilidade.
