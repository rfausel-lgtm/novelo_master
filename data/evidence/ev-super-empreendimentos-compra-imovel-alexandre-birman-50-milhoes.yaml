proposition: 'Por escritura de 10/05/2024, lavrada em São Paulo/SP, Alexandre Café Birman vendeu um imóvel
  à Super Empreendimentos e Participações S.A. por R$ 50 milhões — valor superior a 100% da avaliação
  fiscal, motivo da comunicação ao COAF pelo tabelião. É a maior transação imobiliária isolada identificada
  no RIF nº 140515 entre as contrapartes da Super Empreendimentos.'
