id: ev-bn-financeira-perfil-cadastral
kind: evidence
classification: D
proposition: 'Perfil cadastral da BN Financeira Ltda., conforme dados abertos da Receita Federal: aberta
  em 08/07/2021, microempresa, capital social de R$ 45.000,00, situação ativa, sede em sala de edifício
  comercial em Salvador. O CNAE principal é 6399-2/00, outras atividades de prestação de serviços de informação,
  e entre os secundários consta 6619-3/02 — correspondentes de instituições financeiras. O quadro societário
  registra Bonnie Toaldo Bonilha como sócia-administradora desde a constituição e o advogado Moisés Dantas
  dos Santos como sócio desde 30/08/2022; um terceiro sócio deixou a empresa em novembro de 2024. Nenhum
  membro da família do senador Jaques Wagner integra o quadro societário — nem ele, nem o enteado. O vínculo
  formal mais próximo é indireto: segundo base de agregador, o enteado Eduardo Mendonça Sodré Martins
  foi sócio do escritório do advogado que depois entrou na BN Financeira.'
