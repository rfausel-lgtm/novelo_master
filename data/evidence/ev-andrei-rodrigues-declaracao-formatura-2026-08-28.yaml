proposition: 'Em formatura de cerca de 700 novos policiais federais, em 28/08/2026 — três dias antes da
  divulgação do laudo sobre o celular de Vorcaro —, Andrei Rodrigues declarou: ''Tenho total tranquilidade
  em afirmar, sem rodeios, que nessa gestão trabalhamos com transparência e foco na missão constitucional,
  sem proteger ou perseguir, com atuação rigorosa e intransigente no combate ao crime organizado''.'
