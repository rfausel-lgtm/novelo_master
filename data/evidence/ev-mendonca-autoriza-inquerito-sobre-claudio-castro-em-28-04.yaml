proposition: 'Em despacho de 28/04/2026 na Pet 15.497, André Mendonça autorizou, com anuência da PGR e com
  base no art. 21, XV, do RISTF, a instauração de procedimento investigatório vinculado ao INQ 5.026 para
  apurar hipótese criminal envolvendo o então governador do Rio de Janeiro, Cláudio Castro, e os aportes da
  RioPrevidência no Banco Master.'
