id: ev-total-contratado-pelo-escritorio
kind: evidence
classification: I
proposition: 'Somados os dois instrumentos, o valor máximo contratado pelo escritório junto ao grupo alcança
  cerca de R$ 181 milhões: R$ 131.275.071,72 em valores brutos no contrato com o Banco Master, ao longo
  de três anos, e o teto de R$ 50 milhões no contrato com a Viking Participações. O corpus não sabe quanto
  foi efetivamente pago — o relatório da Polícia Federal registra um primeiro pagamento de R$ 3.422.268,14
  em 08/02/2024 e cobranças posteriores.'
