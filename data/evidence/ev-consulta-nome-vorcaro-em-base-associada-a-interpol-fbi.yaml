id: ev-consulta-nome-vorcaro-em-base-associada-a-interpol-fbi
kind: evidence
classification: D
proposition: 'Em 24/10/2025, Felipe Mourão enviou a Daniel Vorcaro um print de tela com o logotipo da
  Interpol, em que o campo de identificação de quem fez a pesquisa aparecia deliberadamente oculto, com
  as mensagens "Estamos aguardando o relatório principal do FBI" e "A interpol está limpa". O print
  mostrava o próprio nome de Daniel Vorcaro usado como critério de busca em um site que, segundo Mourão,
  estaria vinculado à Interpol. Ao investigar o episódio, a Polícia Federal consultou o órgão de
  representação da Interpol no Brasil, que respondeu que o layout compartilhado NÃO corresponde a nenhum
  mecanismo de busca disponibilizado pela própria Interpol — mas ponderou que pode se tratar de sistema de
  outro país integrado a uma base de dados "offline", construída a partir do download de Notices
  publicadas pela Interpol (procedimento que, segundo a Interpol, é adotado por exemplo pelos EUA); nesse
  caso, apenas o país que mantém tal sistema poderia identificar o usuário responsável, e é provável que
  não se trate de usuário brasileiro.'
