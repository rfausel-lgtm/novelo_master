excerpt: A interpol está limpa
date: '2025-10-24'
notes: 'É o único indício, em todo o acervo até este ponto, de uma possível dimensão internacional no
  acesso a bases de segurança usadas para monitorar a própria situação de Vorcaro perante a Justiça — os
  demais episódios de acesso ilícito documentados (MPF, PF, ePol) são inteiramente nacionais. A PF NÃO
  conclui que houve corrupção de agente estrangeiro: registra que o print não corresponde a um sistema
  real da Interpol, levanta como hipótese alternativa que os próprios hackers do núcleo "Os Meninos"
  possam ter produzido ou obtido o material, e trata a hipótese de "cooperação obscura" com agentes de
  outros países mediante vantagem financeira como possibilidade a ser considerada, não como fato
  estabelecido — linguagem da própria autoridade policial ("não se pode olvidar", "podem... ter operado").
  Não há identificação de qualquer agente estrangeiro específico, nem confirmação de que o "relatório do
  FBI" mencionado por Mourão exista de fato.'
