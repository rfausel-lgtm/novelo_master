id: ev-vorcaro-identifica-alberto-leite-amigo-comprador-arleen
kind: evidence
classification: A
proposition: Segundo mensagens de Daniel Vorcaro a Fabiano Zettel analisadas pela PF e reveladas pela imprensa
  a partir do relatório citado pela revista piauí, Vorcaro afirmou, em novembro de 2025, que o "FIP Tayayá"
  deveria passar a "um amigo que vai comprar", pediu que esse amigo — identificado só pelo primeiro nome
  "Alberto" — o procurasse, e a PF identifica esse Alberto como o empresário Alberto Leite, que assumiu o
  controle do Fundo Arleen por volta de fevereiro de 2025.
