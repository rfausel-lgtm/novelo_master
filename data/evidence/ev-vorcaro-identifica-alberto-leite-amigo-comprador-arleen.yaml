date: '2025-11-01'
notes: 'As duas fontes consultadas divergem sobre o mês exato em que o controle do fundo passou a Leite
  (novembro x fevereiro de 2025) — divergência registrada em ambos os verbetes de origem, não reconciliada.
  O acervo não teve acesso direto ao relatório da PF nem às mensagens originais; a proposição depende da
  leitura que a imprensa fez do documento.'
