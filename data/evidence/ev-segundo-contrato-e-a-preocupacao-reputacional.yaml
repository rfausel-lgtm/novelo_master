id: ev-segundo-contrato-e-a-preocupacao-reputacional
kind: evidence
classification: D
proposition: Sobre o segundo contrato, de 12/05/2025, entre o escritório e a Vikings Participações — com
  termo de dação em pagamento envolvendo cotas de um jato Legacy 650 (US$ 5.512.951,89) e de um helicóptero
  EC 155 B1 (US$ 1.335.014,01), e fatura de R$ 22.815.120,95 em 24/07/2025 —, o relatório reproduz tratativas
  do advogado de Vorcaro registrando que o 'escritório deles não pode ser parte do contrato, não pode
  ter participação em empresas' e que havia 'risco reputacional grande' na titularidade visível do ativo.
  Registra ainda mensagem em que Viviane responde 'Sim, estamos gostando muito' a comunicação sobre o
  uso das aeronaves.
