id: ev-master-nao-consta-da-lista-de-credenciadas-de-congonhas
kind: evidence
classification: D
proposition: A única relação de instituições credenciadas publicada pelo PREVCON, de junho de 2023 e nunca
  atualizada, enumera dezenove instituições e não inclui o Banco Master. O fluxograma de credenciamento
  da própria autarquia exige aprovação pelo Comitê de Investimentos como condição para autorizar a aplicação,
  e nenhuma ata publicada do comitê registra essa aprovação para o banco.
