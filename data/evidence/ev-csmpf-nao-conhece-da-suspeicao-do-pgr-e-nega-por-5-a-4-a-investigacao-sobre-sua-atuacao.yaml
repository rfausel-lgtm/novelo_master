id: ev-csmpf-nao-conhece-da-suspeicao-do-pgr-e-nega-por-5-a-4-a-investigacao-sobre-sua-atuacao
kind: evidence
classification: D
proposition: >-
  Segundo a notícia oficial do MPF de 25/09/2026, na 1ª Sessão Extraordinária de 2026 o Conselho Superior do MPF,
  relator o subprocurador-geral Francisco Sanseverino, decidiu por unanimidade pelo não conhecimento dos pedidos
  de impedimento ou suspeição do procurador-geral Paulo Gonet nas apurações do caso Master, por não ter
  competência legal para analisá-los, julgou prejudicados os pedidos de afastamento e, por cinco votos a quatro,
  rejeitou a abertura de investigação criminal "por ausência de elementos mínimos para a tipificação do crime de
  prevaricação"; segundo a convocação de 23/09, a sessão apreciou a Notícia de Fato PGR-00385698/2026.
