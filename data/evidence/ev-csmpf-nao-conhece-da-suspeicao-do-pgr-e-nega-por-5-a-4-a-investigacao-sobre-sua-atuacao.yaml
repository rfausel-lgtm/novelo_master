excerpt: por ausência de elementos mínimos para a tipificação do crime de prevaricação
date: '2026-09-25'
notes: >-
  D demonstra o que o MPF diz ter sido decidido, não demonstra nem afasta qualquer fato sobre Gonet. A versão da
  Agência Brasil ("9 votos a 0" para não afastar) não é adotada; vale a da notícia oficial. Ata, certidão e votos
  nominais não localizados em fonte oficial.
