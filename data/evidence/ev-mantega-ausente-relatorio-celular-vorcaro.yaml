id: ev-mantega-ausente-relatorio-celular-vorcaro
kind: evidence
classification: D
proposition: 'O nome ''Mantega'' não ocorre nenhuma vez no texto pesquisável das 218 páginas do relatório
  da PF sobre o celular de Daniel Vorcaro (IPJ-A nº 3298613/2026) — tampouco ''Pollaris'', ''BNDES'',
  ''Caixa Econômica'', ''CVM'' ou ''Fazenda''. A equipe validou a confiabilidade da extração conferindo-a
  contra números já publicados no corpus a partir do mesmo documento: 109 ocorrências de ''Moraes'' e
  zero de ''Alcolumbre'', ambos batendo exatamente. Ressalva: o relatório não é exaustivo (produzido em
  72 horas) e 49 das 52 ''Notas'' do iPhone existem apenas como captura de tela de baixa resolução, ilegíveis
  para busca textual — a ausência não pode ser considerada absoluta.'
