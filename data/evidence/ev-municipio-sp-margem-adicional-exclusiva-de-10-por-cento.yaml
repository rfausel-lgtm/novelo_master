id: ev-municipio-sp-margem-adicional-exclusiva-de-10-por-cento
kind: evidence
classification: D
proposition: 'Na capital paulista o desenho é o oposto do estadual e idêntico ao do Rio de Janeiro e ao
  de Mato Grosso: a margem do cartão de benefício é expressamente adicional, ''majorada, adicionalmente,
  em mais 10%'' sobre os 30% ordinários, além de até 5% para outra finalidade — um teto somado de 45%.
  O decreto é de 07/07/2022, assinado por Ricardo Nunes; seis semanas depois a prefeitura credenciou a
  PKL One invocando-o expressamente, e assinou com ela o Termo de Adesão nº 003/2022 em 25/08/2022.'
