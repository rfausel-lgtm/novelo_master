id: ev-decreto-fluminense-criou-categoria-residual-autorizada-pelo-proprio-estado
kind: evidence
classification: D
proposition: 'O texto integral confirma o dispositivo central: o decreto de 27/05/2021 acrescentou ao
  rol de consignatárias o inciso VIII, ''outras entidades consignatárias devidamente autorizadas pelo
  Estado''. Trata-se de categoria residual, aberta e sem critério objetivo, em que o requisito de habilitação
  é definido pelo mesmo Poder Executivo que concede o credenciamento. Cinco dias depois foi autorizada
  a operadora do CredCesta.'
