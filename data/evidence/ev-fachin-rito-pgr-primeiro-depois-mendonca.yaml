proposition: 'Em 04/09/2026, Fachin retirou a acusação de Moraes contra Mendonça do Inquérito das Fake
  News, avocou a análise à Presidência do STF e sequenciou o prazo de cinco dias úteis em duas etapas:
  primeiro a PGR (Gonet) analisa admissibilidade e regularidade do procedimento apresentado por Moraes;
  somente depois Mendonça se manifesta. Não há, nesta fonte, menção ao pedido de afastamento cautelar
  de Moraes feito verbalmente por Mendonça na noite de 03/09 — permanece sem decisão pública.'
