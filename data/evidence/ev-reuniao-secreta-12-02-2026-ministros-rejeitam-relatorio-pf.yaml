id: ev-reuniao-secreta-12-02-2026-ministros-rejeitam-relatorio-pf
kind: evidence
classification: A
proposition: Segundo apuração do Poder360, na reunião fechada de 12/02/2026 dos dez ministros do STF sobre o
  relatório da PF que investigava Dias Toffoli, oito ministros (Moraes, André Mendonça, Zanin, Dino, Gilmar
  Mendes, Fux, Nunes Marques e o próprio Toffoli) defenderam sua permanência como relator do caso Master
  contra dois (Cármen Lúcia e Fachin); a maioria descartou o relatório da PF como juridicamente inconsistente
  — Flávio Dino teria chamado as 200 páginas de "lixo jurídico" — e Alexandre de Moraes teria classificado a
  apuração da PF como "ilegal" e "trabalho sujo".
