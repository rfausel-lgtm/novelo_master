attributed_to: Poder360, em apuração de bastidor sobre reunião fechada (12-13/02/2026)
date: '2026-02-12'
notes: 'RESSALVA EDITORIAL IMPORTANTE: os diálogos atribuídos aos ministros vêm de apuração de bastidor do
  Poder360, sem gravação ou ata pública localizada pelo acervo. A CNN Brasil, ao reproduzir os mesmos trechos,
  registrou expressamente que "não teve acesso ao conteúdo original e, portanto, não pôde verificar a
  autenticidade" — por isso a classificação permanece A (alegação atribuída a uma única linha de apuração),
  nunca C ou D, e as falas são tratadas como atribuídas pela imprensa, não como transcrição certificada. O
  resultado institucional do encontro (nota de apoio + redistribuição) é corroborado de forma independente
  pela nota oficial do STF (ver ev-nota-oficial-dez-ministros-apoio-toffoli-12-02-2026); são os diálogos
  internos específicos que carecem de confirmação.'
