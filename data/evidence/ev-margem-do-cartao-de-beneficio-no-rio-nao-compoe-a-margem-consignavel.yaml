id: ev-margem-do-cartao-de-beneficio-no-rio-nao-compoe-a-margem-consignavel
kind: evidence
classification: D
proposition: 'A margem fluminense é adicional, e o texto o diz de duas formas. O inciso III do art. 6º
  admite o cartão de benefício até 20% do valor líquido calculado depois de excluídos os descontos legais
  e as demais consignações facultativas; e o §1º afirma sem rodeios: ''O cartão de benefícios não compõe
  a margem consignável prevista neste artigo''. O teto potencial passa, assim, de 35% para 35% mais 20%
  sobre o líquido residual. O tribunal de justiça estadual aplica o dispositivo exatamente nesse sentido.'
