id: ev-angelo-ribeiro-assina-resposta-the-pay
kind: evidence
classification: D
proposition: 'Angelo Ribeiro da Silva e Luiz Bull assinaram, em 25/03/2025, a resposta do Banco Master ao
  Banco Central sobre a recompra de carteiras de crédito originadas pela The-Pay Soluções de Pagamentos —
  informando valor de cerca de R$ 303 milhões, muito inferior aos R$ 1,7 bilhão que o próprio Banco Central
  atribuiria à mesma operação em ofício de agosto de 2025, contradição que o Ministério Público Federal
  registrou expressamente.'
