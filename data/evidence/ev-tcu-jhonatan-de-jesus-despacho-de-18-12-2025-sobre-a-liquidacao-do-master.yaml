id: ev-tcu-jhonatan-de-jesus-despacho-de-18-12-2025-sobre-a-liquidacao-do-master
kind: evidence
classification: C
proposition: >-
  Segundo o texto do despacho, lido em cópia hospedada pelo Poder360, e o relato do Estadão Conteúdo, em
  despacho de 18/12/2025 no TC 022.950/2025-7 (representação do MPTCU sobre a supervisão do Banco Central em
  relação ao Banco Master), o relator Jhonatan de Jesus determinou oitiva prévia do Banco Central, no prazo de 72
  horas, sobre os fundamentos da liquidação, as alternativas menos gravosas, as tratativas de mercado e sua
  cronologia, eventuais divergências internas e o acesso a peças sigilosas; em juízo preliminar, formulou a
  hipótese de demora na condução de alternativas e de "precipitação na adoção da medida extrema de liquidação",
  disse vislumbrar possível cautelar futura sem adotá-la, mandou os autos à AudBancos para propor eventual
  cautelar e eventual inspeção e declarou que a decisão "possui natureza exclusivamente instrutória".
source_ids:
  - src-poder360-2025-12-18-integra-despacho-tcu-tc-022-950-2025-7
  - src-jornaldebrasilia-2025-12-19-ministro-do-tcu-ve-precipitacao-na-liquidacao-do-master-bc-diz-estar-munido-com-documentos
excerpt: >-
  determino a realização de oitiva prévia do Banco Central do Brasil, para que, no prazo de 72 (setenta e duas)
  horas, apresente manifestação circunstanciada
locator: despacho (cópia Poder360), itens 5, 9, 11, 12 e 13
date: '2025-12-18'
notes: >-
  Elevada de A para C no lote 368 (23/10/2026): o despacho foi lido em cópia hospedada pelo Poder360, com o código
  de autenticidade 79499517 no rodapé de todas as páginas; o portal de autenticidade do TCU reconheceu o número
  como documento sigiloso de controle externo, sem exibir o conteúdo, e o arquivo não foi conferido no portal.
  Pelo critério do lote 365 (cópia hospedada por veículo sem conferência no portal oficial), a evidência é C e o
  despacho não ganha documento próprio. A evidência demonstra o que o despacho diz, não que a liquidação tenha
  sido precipitada ou tardia: a hipótese é do relator, em cognição sumária. O relato do Estadão
  Conteúdo (Jornal de Brasília, 19/12/2025), antes a única fonte, segue citado; ele nomeia o Grupo Fictor, que o
  despacho não nomeia (fala em "proposta de aquisição do Banco Master por grupo privado").
