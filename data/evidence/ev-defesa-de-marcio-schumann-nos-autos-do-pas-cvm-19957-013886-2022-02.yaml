id: ev-defesa-de-marcio-schumann-nos-autos-do-pas-cvm-19957-013886-2022-02
kind: evidence
classification: D
proposition: Segundo o Relatório da Diretora Marina Copola no PAS CVM 19957.013886/2022-02 (§§ 78 a 86), a
  defesa conjunta de Marcio Coutinho Schumann e do irmão sustentou que a acusação partia de premissas fáticas
  equivocadas, que a prática não equitativa estaria sendo usada como substituto de insider trading sem
  tipificação para fundo imobiliário, que, ainda que ele fosse considerado insider secundário, não haveria
  evidência de ciência prévia, e que ele agiu apenas como investidor pessoa física, atraído por notícias
  positivas sobre o fundo. O voto (§ 66) avalia como frágeis as justificativas econômicas apresentadas e
  reconhece que não há nos autos provas diretas de que ele tenha tido acesso às informações do irmão.
