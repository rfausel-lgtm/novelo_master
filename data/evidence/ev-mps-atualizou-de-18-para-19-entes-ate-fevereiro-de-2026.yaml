notes: 'Reclassificação de 12/09/2026: rebaixada de C para A. O document_id ligado (''reconciliação'') é análise
  própria da equipe, não uma segunda origem independente (is_official: false, ver o próprio registro) — a
  contagem de 19 entes segue single-sourced na CNN Brasil. Busca por segunda fonte não encontrou confirmação
  específica do número 19 (a apuração da Gazeta do Povo de 09/01/2026, que também citou 18 institutos, é o
  levantamento ANTERIOR, da mesma leva original, não uma atualização independente para 19). Fio em aberto:
  identificar o décimo nono ente exige a mesma consulta primária ao CadPrev que está bloqueada por reCAPTCHA,
  ou nova reportagem que o nomeie.'
