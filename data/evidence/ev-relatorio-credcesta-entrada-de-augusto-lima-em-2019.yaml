proposition: Segundo o relatório, o Credcesta foi criado por Augusto Ferreira Lima e foi pilar fundamental
  de sua entrada no Banco Master em 2019, quando assumiu as funções de sócio e CEO de varejo, tornando-se
  o principal mentor da transição do banco para um modelo de crédito em massa; após deixar o Master, comprou
  o Voiter, renomeado Banco Pleno, também liquidado em fevereiro de 2026.
