id: ev-comite-de-imbituva-manteve-aplicacao-apos-alerta-do-tce
kind: evidence
classification: D
proposition: Em 19/08/2025, o Comitê de Investimentos do Fundo de Previdência de Imbituva deliberou, por unanimidade,
  manter a aplicação em Letra Financeira do Banco Master, mesmo após o TCE-PR ter apontado a irregularidade e determinado
  assembleia para deliberar sobre manutenção ou desinvestimento — decisão tomada cerca de três meses antes da liquidação
  extrajudicial do banco.
