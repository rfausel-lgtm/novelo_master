date: '2026-05-19'
notes: 'A caracterização da hipótese investigativa vem do próprio agravo dos investigados (que a resumem
  para contestá-la), não do texto integral da decisão de 19/05/2026 nem de peça do MPF/PF — não foi possível,
  nesta coleta, acessar diretamente a decisão original ou a representação que a fundamentou. Tratar como
  descrição de segunda mão da hipótese até eventual confirmação por peça primária da acusação. Note-se a
  proximidade de valor com o bloqueio de "R$ 24,2 milhões envolvendo Banvox, Master, Vorcaro e Quadrado"
  já registrado em ev-toffoli-bloqueio-24-2-milhoes-banvox-master-vorcaro-quadrado (atribuído a Toffoli por
  fonte de imprensa, sem número de processo confirmado) — pode ou não ser o mesmo bloqueio; não confirmado.'
