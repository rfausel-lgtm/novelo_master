id: ev-bloqueio-quadrado-almeida-aguetoni-bello-pactum-alvarinho
kind: evidence
classification: D
proposition: 'Decisão monocrática de 19/05/2026 do Ministro André Mendonça, na Pet 15.198/DF, manteve o
  bloqueio de bens e valores de Maurício Quadrado, Luís Fernando de Almeida e Flávio Daniel Aguetoni. Quanto a
  esses três, a hipótese investigativa restringe-se a operações envolvendo a Bello Pactum Participações S.A.
  e o FIDC Alvarinho, com prejuízo patrimonial estimado pela investigação em aproximadamente R$ 24 milhões.'
