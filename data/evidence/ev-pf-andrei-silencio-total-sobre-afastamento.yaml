id: ev-pf-andrei-silencio-total-sobre-afastamento
kind: evidence
classification: C
proposition: Nenhuma reação institucional nova da própria PF, da Fenapef, da ADPF ou dos 27 superintendentes
  regionais foi localizada especificamente sobre o afastamento de Andrei Rodrigues (08/09/2026) — distinta
  da manifestação de agosto/2026 já registrada. A Reuters confirma que nem a PF nem a AGU responderam
  a pedido de comentário, e que Andrei Rodrigues e Leandro Almada da Costa, procurados, também não responderam.
  O próprio Andrei não se manifestou publicamente, direta ou indiretamente, sobre seu afastamento. A Intelis
  e a ADPF, citadas por Mendonça na decisão, são fundamento PRÉVIO usado por ele para decidir — não reação
  posterior ao afastamento.
