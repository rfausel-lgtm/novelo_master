id: ev-cobertura-da-crise-esta-polarizada-em-dois-blocos-espelhados
kind: evidence
classification: I
proposition: 'Registro metodológico útil a quem usar este acervo. A cobertura da crise não é majoritariamente
  favorável a um dos lados: está dividida em dois blocos que se espelham, um enquadrando Moraes como investigado
  sob suspeita e a atuação do presidente como recuo, outro enquadrando Mendonça como autor de decisão
  monocrática abusiva e celebrando a liminar. Os veículos que permaneceram mais próximos dos documentos
  foram os especializados e as agências públicas. Há, porém, um viés que atravessa os dois blocos: quase
  toda a cobertura descreve a sessão de 15/09 como destinada a ''decidir se abre investigação contra Moraes'',
  e nenhuma reproduz o enunciado da pauta oficial.'
