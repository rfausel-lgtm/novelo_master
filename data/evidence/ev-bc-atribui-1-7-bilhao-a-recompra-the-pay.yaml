id: ev-bc-atribui-1-7-bilhao-a-recompra-the-pay
kind: evidence
classification: D
proposition: 'O Banco Central informou ao MPF, em 06/08/2025, que a recompra de 12/02/2025 pelo Master de
  carteiras originadas pela The-Pay e cedidas ao BRB envolveu cerca de R$ 1,7 bilhão — mais de cinco vezes
  o valor de R$ 303 milhões que o próprio Master havia informado ao Banco Central, para a mesma operação,
  em 25/03/2025. O Ministério Público Federal, no despacho que fundamenta o IPL 2025.0087917, qualifica
  essa divergência como "informação contraditória".'
