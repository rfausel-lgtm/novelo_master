id: ev-irmaos-de-toffoli-sao-investigados-no-inq-5026-e-dispensados-da-cpi
kind: evidence
classification: D
proposition: José Eugênio Dias Toffoli e José Carlos Dias Toffoli, irmãos do ministro Dias Toffoli e sócios da empresa
  familiar Maridt, constam como investigados no Inquérito 5.026/DF (a apuração sobre a relação financeira entre
  o Banco Master e o BRB), tendo obtido dispensa de comparecimento à CPI do Crime Organizado em 26/02/2026, precedente
  citado por outra investigada (Belline Santana) para pedir o mesmo benefício.
