notes: 'Upgrade de C para D em 12/09/2026 (lote 241): a própria decisão primária (Petição 20501/2026,
  e-Doc. 355 do INQ 5.026), até aqui conhecida só por citação em petição de terceiro, foi lida por
  inteiro — confirma a condição de investigados e detalha os Requerimentos da CPI que motivaram a
  convocação (140/2026 e 161/2026 para José Eugênio; 143/2026 e 160/2026 para José Carlos).'
