id: ev-toffoli-suspende-apuracao-mpma-daniel-leite
kind: evidence
classification: C
proposition: O Ministério Público do Maranhão apurava possível improbidade administrativa na renovação,
  em abril de 2025 e sem nova licitação, do contrato entre a Câmara Municipal de Imperatriz e o escritório
  de Daniel Leite (cerca de R$ 180 mil/ano, firmado originalmente em abril de 2023). O ministro Dias Toffoli
  (STF) suspendeu monocraticamente essa apuração em 30/09/2025, sob o fundamento de ausência de 'lastro
  mínimo' e de que não há improbidade sem dolo.
