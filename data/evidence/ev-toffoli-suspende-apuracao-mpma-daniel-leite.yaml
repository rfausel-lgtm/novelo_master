id: ev-toffoli-suspende-apuracao-mpma-daniel-leite
kind: evidence
classification: D
proposition: 'CORRIGIDO POR LEITURA DIRETA: o Ministério Público do Maranhão (6ª Promotoria de Justiça
  Especializada de Imperatriz) apurava, na Notícia de Fato nº 003773-253/2025, possível improbidade administrativa
  no 1º Termo Aditivo (assinado em 06/04/2024, não em abril de 2025) ao contrato entre a Câmara Municipal
  de Imperatriz e o escritório de Daniel Leite. O ministro Dias Toffoli (STF) trancou essa apuração em
  30/09/2025, na PET 14.601/MA, com fundamento na tese de repercussão geral do Tema 309 (de sua própria
  relatoria — não há improbidade sem dolo). A decisão, lida integralmente pela equipe, NÃO menciona Vorcaro,
  a Kroll, o BRB, Quadrado ou Mansur — a ligação com o caso Master foi feita pela imprensa, não pelo STF.'
