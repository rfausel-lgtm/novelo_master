date: '2026-09-21'
notes: >-
  Trechos conferidos literalmente no Metrópoles e na CNN Brasil em 16/10/2026. A nota do gabinete reproduzida
  pelo Poder360 (22/09) descreve o julgamento como "um caso específico e delimitado", com alcance "restrito
  àquela causa em particular". Os andamentos oficiais do ARE 1.327.995 registram o impedimento lançado no
  sistema em 21/02/2024 e o despacho que o afastou em 07/03/2024, compatíveis com a descrição da nota.
