id: ev-nunes-marques-nega-vinculos-com-vorcaro-e-o-master-nota-de-21-09
kind: evidence
classification: A
proposition: >-
  Em nota publicada pelo Metrópoles em 21/09/2026, o ministro Kassio Nunes Marques afirmou que "nunca votou a favor
  de Daniel Vorcaro ou do Banco Master, nunca trocou mensagens com o banqueiro e nem pediu nada a ele" e "nunca
  autorizou ninguém a falar em nome dele"; sobre o processo da usina, que "estava impedido por anotação da
  Secretaria porque decidiu o caso como vice-presidente do TRF-1", que depois entendeu não estar impedido "por se
  tratar de tese ampla", pediu retificação e votou, e que "não se tratava de ação sobre o Master". À CNN Brasil,
  classificou a divulgação das mensagens como "tentativa de criar narrativa para incriminá-lo".
attributed_to_id: nunes-marques
