id: ev-6-5-bilhoes-do-tce-nao-e-comparavel-ao-numero-do-master
kind: evidence
classification: D
proposition: 'O valor de R$ 6,5 bilhões, de auditoria extraordinária do TCE-RJ relatada por José Gomes Graciosa,
  não é específico do Banco Master: cobre também o Banco Genial — cuja relação com o Rioprevidência é de mera custódia
  de títulos públicos federais, sem exposição de crédito —, a Mirae Asset e o Banco Digimais, cuja natureza de relação
  com o fundo o Tribunal não detalhou publicamente.'
