id: ev-decreto-do-credicesta-foi-assinado-no-mesmo-dia-do-leilao-da-estatal
kind: evidence
classification: D
proposition: O decreto que transformou o cartão de compras da rede estatal de supermercados em veículo
  de crédito foi assinado em 27 de abril de 2018 — exatamente o dia em que se realizou o leilão que alienou
  a estatal — e publicado no dia seguinte. O texto foi conferido pela equipe no índice do diário oficial
  baiano, com o cabeçalho da edição nº 22.408 de 28/04/2018 e a datação do Palácio do Governo. O ato fixa
  margem de consignação de 30% da remuneração líquida e compromete a secretaria da Administração a 'garantir
  a efetivação dos descontos mensais'.
document_ids:
- doc-2018-04-28-decreto-18353-ba-detentor-dos-direitos-de-exploracao
source_ids:
- src-doeba-2018-04-28-decreto-18353-programa-credicesta
excerpt: O Programa Credicesta consiste em uma linha de crédito pré-aprovado que assegura, inclusive mediante
  o uso do Cartão do Programa Credicesta, uma margem de consignação em folha de pagamentos de 30% (trinta
  por cento) da remuneração líquida dos beneficiários do Programa.
