id: ev-cnj-sindicancia-contra-newton-ramos-segundo-o-metropoles
kind: evidence
classification: A
proposition: >-
  Segundo o Metrópoles (24/09/2026), determinação do corregedor nacional assinada em 22/09/2026 instaurou
  sindicância contra o desembargador Newton Ramos, a partir de reclamação disciplinar de um advogado, para apurar
  sua atuação em processos de precatórios do setor sucroalcooleiro e possíveis interesses do Banco Master, com
  prazo inicial de 60 dias prorrogável e 10 dias para defesa prévia após a intimação; segundo o veículo, o CNJ afirma
  que ainda não foi comprovada eventual relação entre o crédito analisado por Newton Ramos e o Banco Master, nem a
  participação do escritório da mulher dele no processo.
attributed_to: Metrópoles
document_ids: []
source_ids:
- src-metropoles-2026-09-24-cnj-abre-sindicancia-contra-desembargador-newton-ramos
date: '2026-09-22'
notes: >-
  Decisão e número da sindicância não localizados. Esta decisão, segundo o Metrópoles, refere-se a possíveis
  interesses do Master; é distinta das duas decisões do PP 0007917-89.2026.2.00.0000, que não mencionam o banco.
  A frase do CNJ é paráfrase do veículo, sem aspas. O nome do
  advogado reclamante não é registrado.
