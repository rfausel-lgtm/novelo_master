id: ev-leo-serrano-de-lisboa-e-tratado-como-o-intermediario-de-viagens-de-ciro
kind: evidence
classification: I
proposition: >-
  O "Leo Serrano" a quem, segundo reportagens de 16/06/2026, Vorcaro pediu as reservas em Lisboa em junho de
  2024 é tratado pelo Novelo como o Léo Serrano já registrado no acervo, da SL Consulting, que a decisão de
  07/05/2026 na Pet 15.873 descreve como quem "intermediava as operações" de pagamentos relacionados a viagens
  internacionais cujas despesas a representação da PF atribui ao senador Ciro Nogueira.
document_ids:
- doc-2026-05-07-decisao-pet-15873-ciro-nogueira
source_ids:
- src-cnnbrasil-2026-06-16-vorcaro-bancou-suites-em-hotel-de-lisboa-para-hugo-motta-e-ciro-nogueira
- src-metropoles-2026-06-16-pf-diz-que-vorcaro-bancou-hotel-de-luxo-para-ciro-nogueira-e-hugo-motta-em-lisboa
- src-stf-pet15873-decisao-07-05-2026-integra
inference_basis: >-
  Mesmo nome; mesma função descrita (reservas e pagamentos de viagens organizadas por Vorcaro); mesmo tema
  dos relatórios da PF (viagens atribuídas ao senador Ciro Nogueira e custeadas por Vorcaro), embora a Pet do
  relatório sobre Lisboa não tenha sido identificada; a CNN Brasil (16/06/2026) o descreve como intermediário de operações de
  Vorcaro, e a decisão de 07/05/2026 (§ 15) o nomeia como intermediário dos pagamentos de viagens. Limite: as
  fontes lidas sobre Lisboa não dão sobrenome nem empresa do "Leo Serrano"; a identidade plena não está
  documentada. A inferência não amplia o papel dele além de intermediário de reservas e pagamentos de
  viagens, e não lhe atribui conhecimento da finalidade das despesas.
date: '2024-06-18'
