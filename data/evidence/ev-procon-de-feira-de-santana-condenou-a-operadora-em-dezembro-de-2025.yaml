date: '2025-12-13'
notes: É a primeira sanção administrativa contra a operadora localizada na investigação. A decisão comporta recurso
  em dez dias úteis; a apuração não localizou recurso nem execução da multa, e a publicação não descreve a conduta
  sancionada.
