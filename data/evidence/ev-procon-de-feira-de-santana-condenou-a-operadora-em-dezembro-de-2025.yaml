proposition: O Procon municipal de Feira de Santana condenou a PKL One Participações S.A. ao pagamento de penalidade
  administrativa de R$ 11.612,70, em decisão publicada em 13/12/2025, com fundamento no artigo 56, inciso I, do
  Código de Defesa do Consumidor, e determinou sua inclusão no cadastro do artigo 44 do mesmo código.
document_ids:
