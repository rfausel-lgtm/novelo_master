id: ev-cadeia-de-eventos-de-17-11-2025-ate-a-interceptacao-em-guarulhos
kind: evidence
classification: D
proposition: Na véspera da Operação Compliance Zero, em 17/11/2025, Vorcaro recebeu mensagens urgentes de seu advogado
  Walfrido Warde às 07h28, mudou os planos e informou às 08h48 que agendaria voo saindo de Congonhas; às 07h41 conversou
  com o jornalista Diego Escosteguy sobre matéria que seria publicada n'O Bastidor mencionando o inquérito da 10ª
  Vara Federal, recebeu o link após as 11h e o repassou a Warde; Warde protocolou no mesmo dia petição pedindo acesso
  aos autos, citando a matéria como fonte, e disse a Vorcaro estar 'infernizando' o juiz por mensagens diretas de
  WhatsApp; Vorcaro também divulgou à imprensa, no mesmo dia, que o Grupo Fictor teria interesse em comprar o Master;
  à tarde, reuniu-se por videoconferência com o Banco Central — reunião articulada por Paulo Sérgio Neves de Souza
  e Belline Santana, que a consideraram 'fundamental' — na qual comunicou que viajaria a Dubai naquele mesmo dia
  para assinar a venda do banco; horas depois, a Polícia Federal o interceptou no aeroporto de Guarulhos, prestes
  a embarcar em jato particular com destino aos Emirados Árabes.
