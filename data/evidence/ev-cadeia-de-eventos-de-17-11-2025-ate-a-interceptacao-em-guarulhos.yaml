notes: A mesma reunião com o BC foi usada pela defesa de Vorcaro, em pedido de habeas corpus julgado pelo TRF1,
  como argumento CONTRA risco de fuga (por ele ter comunicado formalmente a viagem com antecedência); a PF sustenta,
  na representação, que a reunião foi forçada pelo próprio Vorcaro com apoio de servidores que lhe deviam favores,
  um dia antes da operação de que já tinha ciência prévia, e não prova ausência de intenção de fuga.
