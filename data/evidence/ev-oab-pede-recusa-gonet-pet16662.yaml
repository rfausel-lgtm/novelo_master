id: ev-oab-pede-recusa-gonet-pet16662
kind: evidence
classification: D
proposition: Em manifestação de 09/09/2026 na Pet 16.704/DF, o Conselho Federal da OAB — sob a presidência de
  José Alberto Simonetti, em conjunto com dirigentes de 24 seccionais estaduais — pediu que o procurador-geral
  da República, Paulo Gonet Branco, se abstivesse de oficiar na Pet 16.662/DF, por ter sido pessoalmente
  chamado a prestar esclarecimentos, na Pet 16.704/DF, sobre os mesmos fatos submetidos àquele procedimento.
