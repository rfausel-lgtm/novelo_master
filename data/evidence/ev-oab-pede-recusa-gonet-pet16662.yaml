notes: Documento lido integralmente pela equipe (PDF baixado por Rafael via certificado digital). É posterior
  e mais formal que a nota de "extrema preocupação" do CFOAB de 01/09/2026, já publicada no acervo
  (ev-oab-nacional-extrema-preocupacao-2026-09-01) — esta acrescenta o pedido concreto de abstenção do PGR,
  ausente na manifestação anterior. Não foi localizada cobertura de imprensa desta manifestação específica
  até a data de publicação deste lote.
