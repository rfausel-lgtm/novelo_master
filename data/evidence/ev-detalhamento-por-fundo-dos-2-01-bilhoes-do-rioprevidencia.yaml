excerpt: Os investimentos do RioPrevidência nesses fundos atingiram o montante de R$ 2,01 bilhões
date: '2026-02-20'
notes: Este detalhamento por fundo é mais granular do que a reconciliação prévia do acervo (lote 163, ver
  doc-2026-09-10-reconciliacao-dos-numeros-do-rioprevidencia-no-master), mas não contradiz o total já
  reconciliado — apenas discrimina, com datas e valores por lançamento, o mesmo bloco de "R$ 2,01 bilhões em
  cotas de fundos" ali descrito de forma agregada. Continua distinto do bloco de R$ 970 milhões em Letras
  Financeiras (Operação Barco de Papel).
