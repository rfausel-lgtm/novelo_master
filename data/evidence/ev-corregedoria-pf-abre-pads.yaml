id: ev-corregedoria-pf-abre-pads
kind: evidence
classification: A
proposition: Em 26/06/2026, segundo o ICL Notícias, a Polícia Federal comunicou por boletim eletrônico
  oficial a abertura de processos administrativos disciplinares, conduzidos pela Corregedoria, contra
  policiais investigados na Operação Compliance Zero, citando nominalmente Anderson Wander da Silva Lima
  e Valéria Vieira Pereira da Silva. A corporação não informou o número total de servidores envolvidos,
  e não houve demissão ou expulsão até então. A equipe não conseguiu confirmar a informação em fonte independente
  nem no próprio portal da PF, cujas notas oficiais retornaram 'conteúdo restrito'.
