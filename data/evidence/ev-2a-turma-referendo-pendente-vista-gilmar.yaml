id: ev-2a-turma-referendo-pendente-vista-gilmar
kind: evidence
classification: D
proposition: A decisão de Mendonça foi submetida a referendo da 2ª Turma do STF em sessão virtual extraordinária
  (08/09/2026, 10h às 23h59). Kassio Nunes Marques e Luiz Fux acompanharam Mendonça; Gilmar Mendes pediu
  vista — o colegiado, portanto, ainda NÃO confirmou definitivamente a medida monocrática até a data desta
  apuração.
