id: ev-relato-influenciador-pauta-decisao-tcu-21-janeiro
kind: evidence
classification: A
proposition: 'Em vídeo de denúncia pública, transcrito nos anexos da Portaria do IPL sobre o "Projeto DV",
  um dos influenciadores abordados relata que o conteúdo pedido fazia referência a uma decisão do TCU —
  citando a manchete real "TCU vê indícios de precipitação em liquidação do Master e dá 72 horas para o
  BC se explicar" — e a uma sessão de plenário marcada para 21 de janeiro de 2026 em que se buscaria a
  suspensão da liquidação do Banco Master.'
document_ids:
