id: ev-brb-2026-11-10-pede-liminar-de-indisponibilidade-de-bens-e-ressalva-que-nao-ha-juizo-antecipado
kind: evidence
classification: D
status: unverified
proposition: O BRB informou ter pedido, em caráter liminar, a indisponibilidade de bens dos ex-administradores
  demandados e de seis imóveis em São Paulo e Brasília, e ressalvou que a ação é cível, com tramitação
  independente das esferas criminal, administrativa e de controle, e que o ajuizamento “não implica juízo
  antecipado sobre a responsabilidade dos demandados”. É só o pedido; o acervo não localizou decisão sobre ele
  até 12/11/2026.
