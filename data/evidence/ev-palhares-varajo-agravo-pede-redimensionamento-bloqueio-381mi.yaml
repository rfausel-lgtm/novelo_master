id: ev-palhares-varajo-agravo-pede-redimensionamento-bloqueio-381mi
kind: evidence
classification: A
proposition: 'Em agravo regimental de 30/06/2026 contra o bloqueio de bens de 03/03/2026, Leonardo Augusto
  Furtado Palhares e a Varajo Consultoria Empresarial negam vínculo com os fatos, sustentam que o contrato da
  Varajo com Belline Santana tinha objeto real (o projeto social "Jovens Potentes", com entregas
  comprovadas), alegam ausência de fumus comissi delicti e periculum in mora, e pedem a revogação do
  bloqueio ou, subsidiariamente, seu redimensionamento ao valor "efetivamente demonstrado nos autos" de
  R$ 3.810.000,00 — a primeira cifra específica associada ao bloqueio de bens de Palhares/Varajo no acervo.
  A PGR, em contraminuta de 10/07/2026, pediu o não provimento do agravo. Não há, até esta coleta, notícia do
  julgamento do agravo pelo relator.'
