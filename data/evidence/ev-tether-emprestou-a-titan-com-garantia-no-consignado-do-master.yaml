id: ev-tether-emprestou-a-titan-com-garantia-no-consignado-do-master
kind: evidence
classification: C
proposition: A Tether Investments emprestou US$ 300 milhões à Titan Holding, empresa pessoal de Daniel
  Vorcaro, em março de 2025, dando como garantia a carteira de crédito consignado do Banco Master — que
  inclui operações do CredCesta, a linha baiana já mapeada no corpus por suspeita de fraude. No processo
  movido no TJSP, a Tether pede o bloqueio de ativos financeiros das empresas devedoras e que os fluxos
  da carteira de consignado sejam direcionados para quitar a dívida, calculada com juros e mora em cerca
  de R$ 1,6 bilhão. A Tether afirma não ter recebido nenhum pagamento até a data da reportagem.
