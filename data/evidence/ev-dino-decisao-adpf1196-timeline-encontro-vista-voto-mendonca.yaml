id: ev-dino-decisao-adpf1196-timeline-encontro-vista-voto-mendonca
kind: evidence
classification: D
proposition: 'A decisão narra que, em 13/03/2025, Dino determinou medidas de reforço de transparência e
  fiscalização das concessionárias de cemitério de SP; submetida a referendo do Plenário em 14/03/2025, o
  julgamento foi suspenso em 15/03/2025 por pedido de vista de Mendonça. "Ocorre que, em 14 de março de
  2025 — um dia antes da formulação do referido pedido de vista —, consoante informações confirmadas pelo
  próprio Ministro André Mendonça, Sua Excelência recebeu, na sede de uma empresa privada, em São Paulo, o
  Sr. Daniel Vorcaro." Cita que Fabiano Zettel é vinculado à Igreja Batista da Lagoinha e simultaneamente
  exercia cargo diretivo na Cortel, e que, em entrevista de 02/09/2026, o próprio Mendonça confirmou ter
  recebido Vorcaro a pedido de membros da Igreja Batista da Lagoinha, tendo o Deputado Cezinha de
  Madureira agido como intermediário. Com a retomada em 04/04/2025, "o Exmo. Ministro André Mendonça
  inaugurou a divergência e deixou de referendar a medida cautelar, votando portanto de acordo com os
  pleitos dos cemitérios privados". O relator explicita: "Isso não significa afirmar que exista relação
  causal entre tais circunstâncias (...). Significa, diversamente, reconhecer que a multiplicidade, a
  natureza e a convergência temporal desses pontos de contato constituem, em tese, quadro indiciário
  suficientemente relevante para que a existência — ou inexistência — dessas conexões seja esclarecida."'
