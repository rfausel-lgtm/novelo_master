inference_basis: Confronto entre o andamento processual público, que marca a decisão como sigilosa, e
  a reportagem que afirma tê-la obtido com exclusividade. A estrutura da decisão é corroborável pelos
  movimentos processuais; seu conteúdo literal, não.
