proposition: Na busca e apreensão de 18/06/2026 (9ª fase da Compliance Zero), foram apreendidos US$ 55
  mil e € 33 mil (cerca de R$ 471 mil) em endereços de Jaques Wagner. A defesa pediu ao STF a anulação
  da medida, alegando que os valores 'têm origem lícita e comprovada' e que ele nunca atuou no Congresso
  para favorecer o Master — pedido pendente de decisão até a data desta apuração.
