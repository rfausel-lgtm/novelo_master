id: ev-pgr-pede-que-o-proprio-relator-extinga-a-peticao
kind: evidence
classification: D
proposition: 'O pedido concreto do Ministério Público não é que o Plenário delibere, e sim que o próprio
  relator reconheça a nulidade e extinga o feito: ''Sendo nula a ordem e o seu resultado, cabe ao relator
  reconhecê-lo e extinguir a Petição''. A peça foi endereçada ao relator e protocolada em 01/09, antes
  de ele remeter o processo ao colegiado. A tese quantifica o foco do relatório policial — ''quase 190
  páginas das 218 que compõem o estudo policial'' dedicadas ao ministro — e sustenta que ''compete ao
  Plenário do Supremo Tribunal Federal investigar os seus integrantes'', de modo que o caminho devido
  seria dirigir-se antes ao presidente do tribunal.'
