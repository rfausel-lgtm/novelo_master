id: ev-cadeia-zettel-fundo-leal-arleen-participacao-maridt-tayaya
kind: evidence
classification: C
proposition: 'A aquisição da participação da Maridt — empresa dos irmãos de Dias Toffoli — no Resort Tayayá
  não se deu por ''fundos'' genéricos ligados a Fabiano Zettel, como o acervo registrava, mas por uma
  cadeia nomeada: Zettel figurava como cotista único do Fundo Leal, que por sua vez era cotista único
  do Arleen FIP Multiestratégia, administrado pela Reag, que adquiriu a participação. Toffoli declarou
  publicamente duas operações: venda de ações ao Fundo Arleen em 27/09/2021 e venda do saldo remanescente
  à PHD Holding em 21/02/2025, afirmando que ambas foram declaradas à Receita Federal e feitas ''dentro
  do valor de mercado''. Os valores atribuídos ao aporte de Zettel no fundo divergem entre as fontes (R$
  20 milhões segundo a CNN Brasil; R$ 26 milhões segundo relatório do Coaf citado pela Revista Oeste),
  e o valor pago especificamente pela participação da Maridt não foi localizado. A CPI do Crime Organizado
  aprovou a quebra do sigilo do fundo usado por Zettel; a quebra foi anulada por decisão de Gilmar Mendes.'
