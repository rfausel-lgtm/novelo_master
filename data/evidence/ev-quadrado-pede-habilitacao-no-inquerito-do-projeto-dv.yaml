id: ev-quadrado-pede-habilitacao-no-inquerito-do-projeto-dv
kind: evidence
classification: D
proposition: Em 17/08/2026, advogados de Maurício Quadrado — ex-sócio de Vorcaro no Master e controlador da
  Trustee/Banvox, sem vínculo antes documentado com este inquérito — requereram habilitação de procuradores
  no Inq 5.035/DF (o inquérito do "Projeto DV", que apura a campanha de influenciadores e dossiês a favor de
  Daniel Vorcaro perante STF e TCU) "e em todos os procedimentos correlatos", sem especificar a que título.
