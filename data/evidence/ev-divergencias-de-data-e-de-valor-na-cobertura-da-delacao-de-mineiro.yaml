id: ev-divergencias-de-data-e-de-valor-na-cobertura-da-delacao-de-mineiro
kind: evidence
classification: C
proposition: 'Duas divergências entre coberturas ficam registradas sem que se escolha entre versões. Quanto
  à data do acordo: o corpus registrava 03/09/2026, data em que o fechamento foi noticiado, ao passo que
  a Gazeta do Povo situa a assinatura em 8 de agosto de 2026 — as duas informações são compatíveis se
  a assinatura precedeu a divulgação, mas isso não está estabelecido. Quanto aos valores globais: o corpus
  registrava alegação de movimentação da ordem de US$ 1 bilhão, enquanto a mesma cobertura fala em cerca
  de R$ 1,3 bilhão em espécie entre 2020 e 2025, e em ao menos R$ 61 milhões repassados à produção do
  filme. São grandezas e moedas distintas, e nenhuma delas foi conferida em documento primário.'
