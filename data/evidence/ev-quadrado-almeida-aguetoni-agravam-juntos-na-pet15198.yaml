id: ev-quadrado-almeida-aguetoni-agravam-juntos-na-pet15198
kind: evidence
classification: D
proposition: 'Maurício Quadrado, Luís Fernando de Almeida e Flávio Daniel Aguetoni — os dois últimos já
  documentados como ex-administradores da Trustee DTVM com bens tornados indisponíveis pela liquidação do
  Banco Central (03/09/2026) — atuam conjuntamente como agravantes na Pet 15.198/DF, a petição fundadora da
  Operação Compliance Zero. Resolve, ao menos em parte, a que Quadrado se referia ao pedir habilitação no
  Inq 5.035 "em todos os procedimentos correlatos" (lote 281): a Pet 15.198 é um deles.'
