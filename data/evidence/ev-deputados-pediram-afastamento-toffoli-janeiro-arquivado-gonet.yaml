id: ev-deputados-pediram-afastamento-toffoli-janeiro-arquivado-gonet
kind: evidence
classification: A
proposition: Antes do relatório da PF que fundamentaria, em fevereiro de 2026, o segundo pedido de suspeição
  contra Toffoli, deputados de oposição (Carlos Jordy, Adriana Ventura, Caroline de Toni, e separadamente
  Luiz Philippe de Orleans e Bragança) já haviam apresentado, em janeiro de 2026, representação à PGR
  citando o voo a Lima e pedindo o afastamento de Toffoli da relatoria do caso Master. O procurador-geral
  Paulo Gonet determinou o arquivamento em 23/01/2026, por entender que o caso já era objeto de apuração
  regular pelo STF e pela própria PGR. Reportado por fonte única até o momento; tratado como classe A até
  corroboração por segunda fonte independente.
