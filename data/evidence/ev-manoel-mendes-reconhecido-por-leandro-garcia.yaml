id: ev-manoel-mendes-reconhecido-por-leandro-garcia
kind: evidence
classification: D
proposition: Em procedimento formal de reconhecimento fotográfico (art. 226 do CPP, Resolução CNJ
  484/2022), Leandro Garcia descreveu com precisão as características físicas do homem que participou de
  sua intimidação em Angra dos Reis em 04/06/2024, e reconheceu, com alto grau de certeza, Manoel Mendes
  Rodrigues entre cinco fotografias apresentadas pela Polícia Federal.
