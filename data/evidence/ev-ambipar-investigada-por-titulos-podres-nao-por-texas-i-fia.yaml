proposition: 'A Ambipar é alvo de DUAS linhas distintas de apuração na Operação Compliance Zero, não uma
  só: (1) já registrada no corpus — manipulação de preço de suas ações via compra coordenada pela Trustee
  DTVM, no mecanismo Texas I FIA, causando prejuízo de R$ 135,1 milhões ao Rioprevidência; (2) achado
  novo — venda de títulos de crédito ''podres'' do Banco Master ao BRB envolvendo a empresa, com busca
  e apreensão na residência da então vice-diretora Luciana Freire Barca Nascimento em 14/01/2026 (2ª fase
  da operação). São mecanismos e frentes de apuração diferentes, ainda que a mesma empresa apareça nas
  duas.'
