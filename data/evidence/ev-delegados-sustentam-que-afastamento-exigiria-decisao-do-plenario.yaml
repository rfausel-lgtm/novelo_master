id: ev-delegados-sustentam-que-afastamento-exigiria-decisao-do-plenario
kind: evidence
classification: A
proposition: 'A associação nacional dos delegados da Polícia Federal sustentou que o afastamento do dirigente
  máximo da corporação não poderia ocorrer por decisão monocrática, e registrou não haver inquérito, ação
  penal ou processo disciplinar instaurado contra os dois dirigentes. A nota vai além do caso concreto:
  ''A recorrência desses episódios revela um problema estrutural: a direção da instituição responsável
  pela investigação das mais altas autoridades da República continua submetida a critérios de escolha
  e de permanência'' — e defende lista tríplice para a escolha do diretor-geral.'
