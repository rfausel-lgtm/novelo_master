id: ev-pf-aponta-jantares-e-degustacao-de-whiskey-de-vorcaro-a-claudio-castro
kind: evidence
classification: A
proposition: 'Segundo representação da Polícia Federal na Pet 15.497 (20/02/2026), o governador do Rio de
  Janeiro, Cláudio Bomfim de Castro e Silva, manteve vínculo pessoal próximo e reiterado com Daniel Vorcaro,
  com encontros frequentes em período coincidente com os aportes da RioPrevidência no Banco Master; a PF
  aponta que o banqueiro teria custeado despesas pessoais de Castro, incluindo jantares em restaurante de
  luxo em Nova York e um evento de "degustação de whiskey" cujo custo ultrapassaria US$ 1 milhão, o que "em
  tese" poderia configurar vantagem indevida.'
