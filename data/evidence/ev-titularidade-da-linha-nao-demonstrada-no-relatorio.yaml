id: ev-titularidade-da-linha-nao-demonstrada-no-relatorio
kind: evidence
classification: D
proposition: 'A atribuição do terminal a Alexandre de Moraes repousa exclusivamente no rótulo do contato
  salvo na agenda de Daniel Vorcaro, compartilhado por Fábio Faria em 26/12/2023. O relatório não registra
  ter feito consulta cadastral à operadora, e a redação da própria PF é cuidadosa: afirma que o terminal
  ''está atribuído ao contato salvo como'', e não que pertença ao ministro. A perícia demonstra o envio
  a partir do aparelho de Vorcaro; não há extração do aparelho do destinatário, confirmação de leitura
  nem resposta transcrita.'
