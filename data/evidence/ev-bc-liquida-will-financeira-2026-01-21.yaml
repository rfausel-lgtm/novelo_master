id: ev-bc-liquida-will-financeira-2026-01-21
kind: evidence
classification: D
proposition: O Ato do Presidente nº 1.376/2026 decretou, em 21/01/2026, a liquidação extrajudicial 'por
  extensão' da Will Financeira S.A. CFI (CNPJ 23.862.762/0001-00), controlada pelo Banco Master, por comprometimento
  econômico-financeiro, insolvência e vínculo de interesse evidenciado pelo exercício do poder de controle
  do Master. Nomeou liquidante a EFB Regimes Especiais de Empresas Ltda., com Eduardo Felix Bianchini
  como responsável técnico, e fixou o termo legal da liquidação em 24/11/2025.
