id: ev-minas-descredenciou-o-master-por-falta-de-recadastramento
kind: evidence
classification: D
proposition: O desfecho mineiro é o mais prosaico entre os estados examinados. O processo instaurado em
  janeiro de 2026 e concluído em fevereiro descredenciou o Banco Master da folha estadual não por irregularidade
  no produto nem por revisão do credenciamento, mas 'por não apresentar documentação para o recadastramento'.
  O registro do fundamento correto importa para não converter em sanção o que foi omissão cadastral.
