id: ev-luia-kruschewsky-continuidade-entre-estatal-e-empresa-privatizada
kind: evidence
classification: C
proposition: 'Elemento de continuidade pessoal entre o lado público e o lado privado do mesmo ativo: Luia
  Kruschewsky Monteiro era gerente jurídica da Ebal enquanto a empresa era estatal e permaneceu após a
  privatização, tornando-se diretora estatutária em 16/07/2018, cargo que o registro da Receita Federal
  confirma que ainda ocupa. Requerimento apresentado na CPMI do INSS em 05/11/2025 pede acareação entre
  ela, Eugênio de Souza Kruschewsky — procurador do Estado da Bahia — e André Kruschewsky Lima, diretor
  do Banco Master, além de Relatório de Inteligência Financeira do Coaf sobre os três; a peça descreve
  André como ''primo e então sócio'' de Eugênio e trata os demais como ''parentes'' dele. Ressalva editorial:
  a existência e o teor do requerimento são documentais, mas as afirmações de parentesco são alegação
  de parlamentar, não confirmadas por documento civil — o corpus não as registra como fato. O outro diretor
  da Ebal, Gustavo Castro Lima Carlos de Souza, não foi identificado em nenhuma fonte além do registro
  cadastral, e a coincidência parcial de sobrenome com Augusto Ferreira Lima não autoriza qualquer inferência.'
