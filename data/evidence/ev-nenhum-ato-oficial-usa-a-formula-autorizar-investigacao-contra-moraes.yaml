id: ev-nenhum-ato-oficial-usa-a-formula-autorizar-investigacao-contra-moraes
kind: evidence
classification: D
proposition: Precisão que muda o enunciado do que está em jogo. Nem o despacho do relator de 01/09, nem
  a decisão do presidente de 09/09, nem a nota institucional do tribunal empregam a expressão 'autorizar
  investigação contra o ministro Alexandre de Moraes'. O objeto formal é apreciar a Petição 16.662, que
  o relator descreve como levar ao Plenário 'os novos elementos trazidos pela autoridade policial'. A
  fórmula 'decidir se investiga Moraes' é moldura de imprensa — provavelmente correta quanto ao efeito
  prático, e adotada por praticamente toda a cobertura, mas ausente dos atos oficiais. O acervo registra
  a distinção porque ela altera o que o colegiado formalmente decidirá.
