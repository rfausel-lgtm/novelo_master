id: ev-fachin-mantem-compliance-zero-na-presidencia-por-ate-90-dias-e-limita-sua-competencia
kind: evidence
classification: D
proposition: A mesma decisão mantém na Presidência do STF, em caráter excepcional e provisório, só os autos da
  Compliance Zero remetidos em 12/09/2026, por no máximo 90 dias contados dessa data, com possibilidade de
  reavaliação antecipada; limita a competência transitória da Presidência à conservação dos autos, à
  regularidade da tramitação e às questões urgentes; e submete o ato ao referendo do Plenário.
