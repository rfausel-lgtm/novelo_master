id: ev-pkl-one-disputa-credcesta-macapa
kind: evidence
classification: A
proposition: O liquidante do Banco Master disputa judicialmente com a PKL One, empresa identificada como
  pertencente a Andréa Lima Novaes (prima de Augusto Lima), os repasses do Credcesta relativos à folha
  de servidores da Prefeitura de Macapá — contrato aditado em 11/08/2025, já sob a liquidação do banco
  (decretada em 18/11/2025). Decisão liminar determinou que a prefeitura retenha e provisione os valores
  até definição judicial de quem tem direito aos recursos.
