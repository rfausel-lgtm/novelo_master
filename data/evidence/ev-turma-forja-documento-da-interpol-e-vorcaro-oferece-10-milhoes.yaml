id: ev-turma-forja-documento-da-interpol-e-vorcaro-oferece-10-milhoes
kind: evidence
classification: D
proposition: Em outubro de 2024, Daniel Vorcaro propôs intimidar uma pessoa que teria se aproximado de seu filho,
  oferecendo R$ 10 milhões para 'dar uma lição' nela; a 'Turma' produziu um documento com aparência de ser da Interpol
  para essa finalidade, que a própria Interpol, consultada pela PF, informou não corresponder a nenhum mecanismo
  de busca por ela disponibilizado.
