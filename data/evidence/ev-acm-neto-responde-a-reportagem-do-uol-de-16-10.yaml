id: ev-acm-neto-responde-a-reportagem-do-uol-de-16-10
kind: evidence
classification: A
proposition: >-
  Procurado pelo UOL (16/10/2026), ACM Neto classificou os vazamentos como "seletivos, manipulados e fora de
  contexto" e atribuiu-os a tentativa do governo federal de provocar desgaste político; afirmou que jamais
  atuou para que institutos de previdência aplicassem recursos no Master, entre eles o Amapá Previdência; que
  "sequer conhece Fabiano Zettel"; que os valores recebidos do Master decorreram de consultoria prestada por
  contrato mensal iniciado em janeiro de 2023; e que está à disposição das autoridades desde março de 2026.
