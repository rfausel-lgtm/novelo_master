proposition: 'Em depoimento de 28/08/2026 à PF, cujo vídeo veio a público em 04/09/2026, Daniel Vorcaro
  afirma: ''Eu tenho passado um terror, passado por algo desumano, mas ainda tenho esperança e confiança
  que a verdade ainda vai aparecer.'' Reconhece ''erros'' no processo do Master, mas diz que a venda ao
  BRB e a liquidação ''precisam ser esclarecidas'', afirmando ter sido surpreendido pela decisão de liquidar
  o banco: ''Eu descobri que minha solução não seria nem apreciada e que o banco seria liquidado.'' Sinaliza
  ter ''muitos temas a revelar'' e pede colaboração — declarações de parte, não fatos apurados.'
