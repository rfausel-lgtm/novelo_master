id: ev-cotacoes-comparadas-na-sessao-de-12-07-2024
kind: evidence
classification: D
proposition: 'A ata de 12/07/2024 registra as cotações comparadas naquela sessão: BTG Pactual, cinco anos,
  IPCA + 6,65% ao ano; Santander, quatro anos, pré-fixado em 12,09%; Itaú e Safra, quatro anos, IPCA +
  6,38% e 6,49%; e o Banco Master, dez anos, IPCA + 8,35%. Não houve rejeição das ofertas dos bancos de
  primeira linha: foram aprovadas por unanimidade, na mesma sessão, aplicações de R$ 100 milhões no BTG
  e de R$ 200 milhões no Master. A diferença é que o Master levou o dobro, no vértice mais longo e à taxa
  mais alta.'
