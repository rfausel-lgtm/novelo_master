id: ev-planner-intermediou-510-milhoes-para-o-rioprevidencia
kind: evidence
classification: A
proposition: A Planner Corretora intermediou quatro operações somando R$ 510 milhões em letras financeiras
  do Banco Master para o Rioprevidência, segundo depoimento do ex-presidente da autarquia, que justificou
  a contratação de corretoras porque o órgão não tem mesa de operações. A corretora sustenta atuar apenas
  como intermediária entre as partes, sem formar preços.
