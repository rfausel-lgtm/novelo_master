id: ev-vorcaro-patrimonio-declarado-2015
kind: evidence
classification: A
proposition: Daniel Vorcaro declarou à Receita Federal, em 2015, patrimônio de R$ 2,8 milhões — dois anos
  antes de contratar, em 15/09/2017, a compra de 56,87% do Banco Máxima por R$ 40 milhões. Segundo a mesma
  reconstituição, sua fortuna chegaria a R$ 2,64 bilhões em 2025. A desproporção entre o patrimônio declarado
  e o porte da operação é o ponto que o Banco Central apontaria no voto que rejeitou a transferência de
  controle em 2019.
