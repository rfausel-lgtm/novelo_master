id: ev-proposta-de-internacao-de-desafeto-com-ordem-judicial
kind: evidence
classification: D
proposition: 'Em 14/10/2024, ao organizar com Daniel Vorcaro a publicação de matérias positivas e
  negativas sobre alvos, Luiz Phillipi Mourão apontou como primeiro alvo negativo Antônio Augusto Conte,
  descrevendo-o nos seguintes termos: "desse debil mental do antonio conte que contratou jornalista pra
  publicar coisa falsa. Drogado e louco, nunca passou nem perto do banco". Vorcaro respondeu "Não solta
  nada sem me falar. Nao pode ser assim. Deixa que vou produzir um material". Cinco dias depois, em
  19/10/2024, Mourão propôs a Vorcaro outra via: "Sobre o conti, eu consegui um negócio para resolver mas
  preciso do seu ok. Quer que mande interna-lo?? Estou com um dono de uma clínica psi. E clínica de
  reabilitação. E conseguimos interna-lo com ordem judicial. Só vc (ok)". A Polícia Federal registra que
  a internação assim obtida aparentaria ser forjada ou irregular, e que não há nos autos resposta de
  Vorcaro à proposta.'
