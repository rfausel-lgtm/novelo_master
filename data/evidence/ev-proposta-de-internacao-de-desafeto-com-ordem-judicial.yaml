date: '2024-10-19'
notes: 'As caracterizações sobre Antônio Augusto Conte — inclusive as ofensivas e as relativas a saúde
  mental e uso de drogas — são palavras de Mourão a seu contratante, não apuração de coisa alguma, e o
  acervo não tem elemento independente que as sustente. O documento não registra resposta de Vorcaro à
  proposta, e não há indício de que a internação tenha sido tentada ou consumada. O mesmo nome aparece,
  por outro caminho, entre os alvos das consultas ilegais de Marilson Roseno aos sistemas da PF desde
  2021, conforme a manifestação da PGR de 05/05/2026 — são as duas únicas menções a ele no acervo.'
