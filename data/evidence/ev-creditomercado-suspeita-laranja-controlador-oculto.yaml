id: ev-creditomercado-suspeita-laranja-controlador-oculto
kind: evidence
classification: A
proposition: A PF suspeita que o advogado Cecílio Galvão — já investigado por receber R$ 4 milhões ligados
  à 'Farra do INSS' — seja laranja dos donos reais da consultoria Crédito e Mercado, sucessora direta
  da Plena Consultoria de Investimentos (Operação Fundo Perdido, 2014); o CEO Renan Foglia Calamia (já
  mapeado no corpus por Congonhas e Maceió) e a diretora Samanta Zaniquelli vieram da Plena. Ex-sócios
  da Plena foram condenados por corrupção ativa em 1ª instância, todos absolvidos por prescrição no TRF3
  (maio de 2025), sem julgamento de mérito.
