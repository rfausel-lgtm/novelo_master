id: ev-decreto-257-2023-mt-margens-nao-concorrem-entre-si
kind: evidence
classification: D
proposition: 'O texto oficial do decreto de 05/05/2023, recuperado na base da Fazenda estadual, mostra
  que a margem de 10% criada para o cartão de benefício foi desenhada para não disputar espaço com as
  demais: ''as margens consignáveis previstas nos incisos deste artigo são independentes, de forma que
  não concorrem entre si''. O ato admite como consignatárias entidades administradoras de cartão de benefício
  ''devidamente conveniadas junto a instituições financeiras autorizadas pelo Banco Central'' — fórmula
  que transfere a exigência de autorização para o parceiro bancário, e não para a operadora. O considerando
  invoca apenas ''a necessidade de se promover a desburocratização e a celeridade''.'
