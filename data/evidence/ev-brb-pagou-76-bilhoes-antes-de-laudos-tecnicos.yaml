id: ev-brb-pagou-76-bilhoes-antes-de-laudos-tecnicos
kind: evidence
classification: A
proposition: A mesma perícia aponta que o BRB pagou R$ 7,6 bilhões em 22 operações de aquisição de carteiras do
  Master antes de concluir os ritos internos e os laudos técnicos obrigatórios — 43,41% do total desembolsado nas
  aquisições de varejo —, caracterizando a gestão da diretoria à época, presidida por Paulo Henrique Costa, como
  'gestão fraudulenta', por manipulação de procedimentos de governança e formalização retroativa de controles.
document_ids:
