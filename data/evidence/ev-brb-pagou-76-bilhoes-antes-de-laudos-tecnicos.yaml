attributed_to: Perícia da Polícia Federal, Operação Compliance Zero
date: '2026-08-13'
notes: É a mesma diretoria do BRB, não a do Master, que a perícia qualifica de fraudulenta — o achado atinge o lado
  comprador da operação, distinto das imputações já registradas ao Master como vendedor.
