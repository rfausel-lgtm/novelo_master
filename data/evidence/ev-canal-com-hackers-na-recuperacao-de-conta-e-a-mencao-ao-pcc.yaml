excerpt: tô com os meninos na linha e falei para avisarem esses caras que a turma vai atrás deles. E irei
  atrás de um por um
date: '2024-05-22'
notes: 'A atriz é vítima no episódio e não tem participação em nada que se apure aqui — a invasão de sua
  conta era fato público antes desta extração, e ela aparece apenas como a pessoa cuja conta foi
  recuperada. Por isso não ganha registro próprio no acervo. Sobre a frase "alinha com o pcc rsrs", o
  próprio documento reproduz o "rsrs" que a acompanha e não estabelece contato algum com o Primeiro
  Comando da Capital: o que está documentado é que Vorcaro a escreveu, não que exista vínculo com a
  facção. A conclusão da PF sobre contato de Mourão com pessoas ligadas a facções é inferência, e está
  registrada em evidência separada.'
