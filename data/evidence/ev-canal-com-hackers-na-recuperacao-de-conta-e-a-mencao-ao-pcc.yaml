id: ev-canal-com-hackers-na-recuperacao-de-conta-e-a-mencao-ao-pcc
kind: evidence
classification: D
proposition: 'Em maio de 2024, Daniel Vorcaro acionou Luiz Phillipi Mourão para recuperar a conta de
  Instagram da atriz Monique Alfradique, tomada por terceiros não identificados que, segundo noticiou o
  Metrópoles em 22/05/2024, publicavam em nome dela e induziam seguidores a fazer pagamentos por PIX.
  Vorcaro repassou a Mourão os dados de acesso da conta. Mourão respondeu que estava "com os meninos na
  linha" e que mandara "avisarem esses caras que a turma vai atrás deles. E irei atrás de um por um",
  relatou em seguida que os invasores desconfiavam que "os meninos" quisessem ficar com o controle da
  conta, e encaminhou um áudio que atribuiu a eles próprios, resistindo à devolução. Recuperada a conta,
  ao comentar que várias pessoas diziam ter feito pagamentos por PIX a quem a controlava, Vorcaro
  escreveu a Mourão: "alinha com o pcc rsrs".'
