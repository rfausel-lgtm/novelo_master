id: ev-senadores-mt-pedem-atencao-stf-inq5026-consignado
kind: evidence
classification: D
proposition: Em ofício datado de 14/08/2026 e protocolado no INQ 5.026 em 17/08/2026, três senadores
  representantes do Mato Grosso pediram ao relator "especial atenção" à apuração de operações de crédito
  consignado envolvendo servidores públicos do Estado, ligadas ao caso Banco Master.
document_ids:
- doc-2026-08-14-oficio-senado-001-2026-mt-consignado-inq5026
source_ids:
- src-stf-inq5026-oficio-senado-001-2026-mt-consignado
date: '2026-08-14'
notes: Frente institucional distinta das já registradas (CPI do Crime Organizado, CAE do Senado sob Renan
  Calheiros) — aqui não há convocação nem oitiva, apenas um pedido formal de atenção, mas incorporado aos
  próprios autos do INQ 5.026. O tema consignado em Mato Grosso já é extensamente documentado no acervo
  fora do contexto criminal (decretos estaduais, ADI 7900 e ADPF 1306 — ambas também relatadas por André
  Mendonça); este ofício é o primeiro registro de uma ponte formal entre esse tema e o próprio inquérito.
