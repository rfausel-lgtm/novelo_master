date: '2026-06-22'
notes: 'O teto soma R$ 1,8 milhão para cada um dos três "Meninos" e R$ 9,6 milhões para cada um dos quatro da
  "Turma". Os demais valores achados: R$ 26,26 de Anderson Wander da Silva Lima no Itaú e R$ 0,12 no Santander; R$ 2,77
  de David no Santander; R$ 0,63 de Rodrigo Pimenta Franco Avelar Campos e R$ 0,08 de Manoel Mendes Rodrigues no
  Nubank; R$ 0,66 de Victor Lima Sedlmaier na Coinbase; saldo negativo de Erlene Nonato Lacerda no Santander. Contas
  de David e Victor no Nubank estavam canceladas desde 2024, e o Mercado Pago achou cadastro de cinco requeridos sem
  fundos. Ressalva: bloqueios feitos pelo fluxo automático do SISBAJUD podem não constar das respostas escritas, e a
  99Pay não informou valores; o quadro não é, portanto, um balanço completo do que foi constrito. É o mesmo padrão
  já visto na PET 15.563 (ver ev-pet15563-primeiro-bloqueio-patrimonial-da-compliance-zero). A PGR concordou com o
  pedido da PF em 13/05/2026, no mesmo dia da decisão.'
