id: ev-pet16019-bloqueio-de-43-milhoes-encontrou-contas-vazias
kind: evidence
classification: D
proposition: O bloqueio de até R$ 43,8 milhões decretado em 13/05/2026 na PET 16.019 contra sete integrantes da "Turma"
  e dos "Meninos" encontrou, nas respostas escritas juntadas aos autos até agosto de 2026, contas sem saldo ou com
  centavos, nenhuma embarcação e nenhuma aeronave; os maiores valores localizados foram R$ 735,47 e R$ 120,41 em
  frações de ações de Sebastião Monteiro Júnior e R$ 1.160,12 em quotas de cooperativa de David Henrique Alves, que o
  Sicredi considera impenhoráveis. Das catorze corretoras de criptoativos oficiadas, dez não haviam respondido até
  22/06/2026.
