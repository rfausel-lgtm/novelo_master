id: ev-conselho-rejeitou-a-mudanca-que-viabilizaria-o-master
kind: evidence
classification: D
proposition: Em 28/02/2024 o conselho do AparecidaPrev rejeitou, por sete votos a três, a proposta de
  reduzir a exigência de rating da política de investimentos. A ata registra que um conselheiro perguntou
  expressamente se a mudança seria 'para atender somente ao Banco Master' e que o diretor financeiro respondeu
  ser o Master a única instituição credenciada fora do enquadramento da política, por não constar da lista
  exaustiva da Secretaria de Previdência. O consultor classificara o banco, na mesma sessão, em 'grau
  altamente especulativo'.
