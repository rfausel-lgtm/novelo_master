id: ev-dalide-insercao-politica-e-empresarial-no-tocantins
kind: evidence
classification: A
proposition: Segundo a imprensa regional do Tocantins, Dalide Corrêa é sócia do Grupo Monte Sião, conglomerado agropecuário
  de Porto Nacional, onde comanda o jurídico interno, é filiada ao Agir com domicílio eleitoral no município, é
  próxima do pastor Amarildo Martins e foi sondada em abril de 2026 para a primeira suplência de Carlos Gaguim na
  disputa ao Senado, sem ser escolhida.
