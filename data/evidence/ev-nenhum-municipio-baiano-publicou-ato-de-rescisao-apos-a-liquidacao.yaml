id: ev-nenhum-municipio-baiano-publicou-ato-de-rescisao-apos-a-liquidacao
kind: evidence
classification: D
proposition: 'A varredura não localizou, em nenhuma das 409 sedes municipais baianas consultadas, ato
  de suspensão, rescisão ou descredenciamento posterior à liquidação extrajudicial do banco, em novembro
  de 2025, ou do banco que sucedeu a operação, em fevereiro de 2026. O ato mais recente de toda a série
  é o convênio de Alagoinhas, de 31/07/2024. O silêncio é coerente com o padrão já registrado em outros
  estados: os entes estaduais suspenderam códigos de desconto, e os municípios, em regra, nada publicaram
  — a exceção conhecida continua sendo a capital paulista, que descredenciou e denunciou o convênio.'
