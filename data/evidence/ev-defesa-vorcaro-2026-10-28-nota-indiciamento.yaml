proposition: Em nota de 28/10/2026, a defesa de Daniel Vorcaro chamou o indiciamento de "açodado e afoito" e
  "frágil e absurdo", pediu o arquivamento do inquérito e a revogação da prisão preventiva, e afirmou que
  "Nenhuma perícia oficial apurou qualquer prejuízo". Disse ainda que as carteiras foram substituídas por
  outros ativos e que o próprio pedido de mais prazo mostra que a investigação não está concluída.
