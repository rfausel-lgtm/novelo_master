id: ev-instrumento-usado-contra-mendonca-saiu-das-maos-de-moraes
kind: evidence
classification: I
proposition: 'Observado o conjunto, o Inquérito 4.781 foi progressivamente retirado das mãos de quem o
  presidia, nas duas etapas em que serviu de via para alcançar o relator do caso Master: primeiro Fachin
  destacou dele o pedido de apuração contra Mendonça e o avocou, em 04/09; depois revogou a própria designação
  do relator, em 09/09. O acervo já registrara que a peça usada por Moraes contra Mendonça naquele inquérito
  era um relatório de inteligência da Dicor, sem assinatura, que a própria Polícia Federal classificou
  como desprovido de valor probatório. A leitura é de coerência de trajetória, não de motivação declarada:
  a decisão invoca segurança jurídica e delimitação institucional, e não avalia a idoneidade daquela peça.'
