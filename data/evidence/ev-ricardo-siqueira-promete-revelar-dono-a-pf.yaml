id: ev-ricardo-siqueira-promete-revelar-dono-a-pf
kind: evidence
classification: A
proposition: 'Em entrevista ao Metrópoles publicada em 31/05/2026, dias depois de ser alvo da 8ª fase da
  Compliance Zero, Ricardo Siqueira Rodrigues afirmou que revelará à Polícia Federal ou à PGR a identidade do
  "dono" do esquema no Rioprevidência ("Esse dono específico, com relação ao Rio de Janeiro, eu estou aguardando
  aqui para poder prestar depoimento dentro dos próximos dias à Polícia Federal ou à PGR"), e disse que um
  político ainda não citado nas investigações autorizava as transferências — sem nomeá-lo publicamente.'
