id: ev-arquivo-moraes-pdf-excluido-antes-de-reportagem-de-marco
kind: evidence
classification: D
proposition: 'Auditorias da Polícia Federal indicaram a exclusão definitiva do arquivo "Moraes.pdf" do
  armazenamento em nuvem institucional (OneDrive) vinculado ao usuário de João Cláudio Nabas poucas horas antes
  da publicação de uma reportagem de março de 2026 sobre supostas conversas entre Daniel Vorcaro e o ministro
  Alexandre de Moraes — reportagens que, segundo a PF, têm "semelhança relevante" com o conteúdo do mesmo
  arquivo, inclusive na forma de extração e organização das evidências digitais.'
