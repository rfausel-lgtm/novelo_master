date: '2026-09-29'
notes: >-
  Uma origem; a CNN não diz como obteve os registros nem cita relatório, Pet ou decisão. É metadado e descrição
  do veículo, não conteúdo verificado pelo Novelo, e diz respeito à relação entre Vorcaro e Motta, não ao grupo
  de mensagens publicado pelo UOL. Ficam de fora datas e detalhes de pedidos específicos e assuntos de
  familiares.
