id: ev-cnn-registros-de-chamadas-e-encontros-entre-vorcaro-e-hugo-motta
kind: evidence
classification: A
proposition: >-
  Segundo o blog de Matheus Teixeira na CNN Brasil (29/09/2026), registros extraídos pela PF do celular de
  Daniel Vorcaro mostram, entre março de 2024 e outubro de 2025, ao menos 100 chamadas concluídas e 102 não
  concluídas entre Vorcaro e Hugo Motta e ao menos 19 encontros combinados entre os dois; os temas, segundo o blog, incluem o FGC, a disputa
  pela presidência da Câmara, uma possível sociedade, caronas e camarote.
attributed_to: CNN Brasil (blog de Matheus Teixeira)
