id: ev-defesa-nabas-tenta-adiar-oitiva-alegando-falta-de-acesso
kind: evidence
classification: D
proposition: 'Entre junho e agosto de 2026, a defesa de João Cláudio Nabas pediu repetidamente à PF acesso a
  juntadas do inquérito posteriores a 02/06/2026 e a habilitação de novos advogados substabelecidos, e usou a
  alegação de acesso insuficiente para pedir o adiamento da oitiva de Nabas, agendada para 06/08/2026. A PF
  respondeu que o acesso deveria se dar diretamente pelo processo eletrônico do STF (Pet 15.625), não pela via
  administrativa, e manteve a oitiva, remarcada para 27/08/2026 às 15h, por videoconferência.'
