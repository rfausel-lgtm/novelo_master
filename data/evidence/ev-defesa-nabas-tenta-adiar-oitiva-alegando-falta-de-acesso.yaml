date: '2026-08-27'
notes: Não há, nos e-mails lidos, informação sobre o conteúdo da oitiva em si (se ocorreu, o que foi
  perguntado, qual a posição de Nabas) — apenas a disputa procedimental sobre acesso e data. Ainda sem
  notícia, até esta coleta, do resultado da perícia de autenticidade do "Moraes.pdf" nem do desfecho do PAD
  na Corregedoria da PF.
