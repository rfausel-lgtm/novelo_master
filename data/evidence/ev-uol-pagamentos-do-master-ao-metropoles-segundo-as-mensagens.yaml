attributed_to: UOL (Renata Agostini e Tiago Dantas)
date: 2024-11
notes: Valores segundo as mensagens citadas pelo UOL; o contrato não foi publicado. Publicidade contratada não
  é irregularidade por si; Lilian Tahan diz que o contrato não tinha relação com a cobertura.
