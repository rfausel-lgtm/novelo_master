id: ev-uol-pagamentos-do-master-ao-metropoles-segundo-as-mensagens
kind: evidence
classification: A
proposition: Segundo o UOL (15/10/2026), com base nas mensagens, o Master pagou R$ 1 milhão ao Metrópoles em
  junho de 2024, acertou R$ 900 mil em julho para projetos de "educação financeira" da Kovr e do Will e fechou
  em novembro contrato de publicidade de R$ 20 milhões, quitado em 2025 em parcelas de R$ 5 milhões.
source_ids:
