id: ev-municipio-de-cairu-foi-a-justica-por-nao-saber-a-quem-pagar
kind: evidence
classification: C
proposition: 'O efeito das liquidações sobre os entes públicos aparece em sua forma mais nítida na Bahia:
  o município de Cairu ajuizou consignação em pagamento contra o banco e a operadora, depositando em juízo
  R$ 53.323,91 e as parcelas vincendas, por dúvida sobre quem é o titular dos créditos descontados dos
  servidores. Não é litígio sobre a legalidade do desconto — é a administração declarando que não sabe
  a quem entregar o dinheiro que retém da folha. Macapá havia tentado o mesmo caminho antes, em processo
  extinto por falta de depósito.'
