excerpt: infere-se que o banqueiro possui influência sobre o RioPrevidência, declarando até como deve ser a
  resposta da autarquia às perguntas formuladas pelo jornalista
date: '2024-08'
notes: A própria PF conclui pela influência de Vorcaro sobre a comunicação institucional do órgão. Não
  localizada, nesta coleta, a matéria do Estadão de fato publicada nem seu conteúdo final — não confirmado se
  a resposta ditada por Vorcaro foi usada literalmente. É evidência de captura direta da comunicação
  institucional de um órgão de previdência estadual sobre seus próprios investimentos pelo banco investigado
  — distinto e mais grave, no juízo desta coleta, do que a tentativa de pressão sobre um vídeo de terceiro no
  episódio Kassab (lotes 287/295).
