id: ev-vorcaro-dita-resposta-do-rioprevidencia-ao-estadao
kind: evidence
classification: D
proposition: 'No início de agosto de 2024, o jornal Estadão enviou uma lista de perguntas ao Rioprevidência
  sobre os aportes em LFs do Master. Fernando de Goes recebeu a demanda e pediu orientação a Daniel Vorcaro
  antes de a autarquia responder ao jornal. Vorcaro ditou a estratégia — "Existe Sigilo" e "não podem revelar
  as informações demandadas" — e a redação exata da resposta: "Acho que tem que responder curto dizendo que
  lfs sao titulos de mercado que fazem parte do portfolio. Que nao podem abrir por sigilo os investimentos".
  Fernando confirmou "Isso q será feito irmão" e enviou a Vorcaro imagens da resposta que o Rioprevidência de
  fato preparou para o jornal. Vorcaro orientou ainda que a resposta fosse propositalmente curta: "Pra jornal
  tem que escrever pouco", "Isso ai vai fazer eles fazerem 10 materias" — calculando que uma resposta
  detalhada geraria mais matérias.'
