id: ev-decisao-10afase-febraban-ataques-coordenados
kind: evidence
classification: D
proposition: Segundo a decisão (PET 16.346, §§19-20), além do mapeamento da própria PF, a Federação Brasileira
  de Bancos (Febraban) identificou de forma independente uma série de ataques coordenados ao Banco Central
  nas redes sociais, com outros influenciadores digitais possivelmente contatados ou cooptados por grupo
  ou entidade não especificada.
