id: ev-bc-confirma-pkl-one-nao-consta-instituicoes-autorizadas
kind: evidence
classification: D
proposition: 'Confirmação documental, obtida pela equipe em consulta direta à base pública do Banco Central
  em 09/09/2026: a PKL One Participações NÃO consta da relação oficial de instituições autorizadas a funcionar
  no país. As consultas por CNPJ e pelos termos ''PKL'' e ''CREDCESTA'' retornaram conjunto vazio em todas
  as tabelas da base — sociedades, bancos comerciais e múltiplos, cooperativas e consórcios. Controle
  metodológico aplicado para descartar erro de consulta: a mesma busca com o termo ''BRADESCO'' retorna
  registros normalmente. O dado é coerente com o registro da Receita Federal, que atribui à empresa o
  CNAE principal de holding de instituições não-financeiras, sem nenhum CNAE de atividade privativa de
  instituição financeira. Isso converte em fato verificado o que até aqui o corpus registrava como alegação
  de parlamentares e de decisão judicial de primeira instância.'
