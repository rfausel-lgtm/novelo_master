id: ev-congonhas-baixou-o-ativo-a-um-centavo
kind: evidence
classification: D
proposition: O saldo da letra financeira do Banco Master na carteira do PREVCON era de R$ 16.520.372,81
  em 31/10/2025, equivalente a 2,78% da carteira. Na posição de 30/11/2025 — mesmo mês da liquidação —
  o ativo aparece com saldo de R$ 0,01, e assim permanece nas posições seguintes até julho de 2026. A
  baixa contábil integral contrasta com a nota oficial de 19/11/2025, que sustentava que o ativo não colocava
  em risco o patrimônio do regime próprio.
