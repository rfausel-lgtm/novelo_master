proposition: 'Segundo análise de cientistas políticas nomeadas (Yolanda Tolentino e Emerson Masullo),
  a estratégia de Alcolumbre e Motta é de ''sufocamento por sobreposição de prioridades'': o calendário
  eleitoral de 2026 consome o tema sem que seja preciso negar formalmente a instalação da CPMI. É leitura
  interpretativa de analistas nomeados, não fato comprovado — não há declaração de Alcolumbre ou Motta
  confirmando essa estratégia deliberada.'
