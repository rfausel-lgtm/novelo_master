id: ev-augusto-lima-reunioes-cupula-bc-2025
kind: evidence
classification: C
proposition: Registros oficiais do Banco Central, obtidos e reportados de forma independente por três
  veículos (InfoMoney, A Crítica de Campo Grande e CNN Brasil), mostram Augusto Lima em pelo menos 7 a
  8 reuniões com a cúpula do BC ao longo de 2025 identificado como CEO do Master, apesar da saída formal
  da sociedade anunciada em maio de 2024 — com o presidente Gabriel Galípolo em 11/04, 08/05, 02/07 e
  19/07/2025 (dias antes da aprovação da compra do Voiter), e com o diretor de fiscalização Ailton de
  Aquino em 06/08 e 14/08/2025 (dias em torno da efetivação da compra). Nenhuma fonte localizada prova
  relação causal entre essas reuniões e a aprovação da operação — é hipótese razoável de apuração, não
  fato estabelecido.
