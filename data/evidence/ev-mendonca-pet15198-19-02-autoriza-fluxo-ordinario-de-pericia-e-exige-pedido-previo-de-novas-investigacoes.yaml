proposition: Em decisão de 19/02/2026 na Pet 15.198, o ministro André Mendonça autorizou a adoção do fluxo
  ordinário de trabalho pericial da PF, diligências ordinárias sem reserva de jurisdição e a custódia do
  material apreendido nos depósitos da PF, e determinou que a instauração de qualquer nova investigação ou
  inquérito seja antes requerida a ele.
