date: '2026-05-13'
notes: A PET 16.019 é o processo formal de constrição patrimonial — distinto da PET 15.978 (prisão
  preventiva, mesma data) e da PET 15.976 (busca e apreensão, mesma data) — tramitando em paralelo sob o
  mesmo relator e a mesma investigação (6ª fase da Compliance Zero). É a primeira vez que o acervo registra
  os valores exatos de bloqueio individualizados por pessoa nesta fase, e o mecanismo de bloqueio de
  criptoativos via corretoras nomeadas e a ABcripto.
