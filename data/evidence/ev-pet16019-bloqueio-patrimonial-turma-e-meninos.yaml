id: ev-pet16019-bloqueio-patrimonial-turma-e-meninos
kind: evidence
classification: D
proposition: 'Em 13/05/2026, na PET 16.019/DF, o ministro André Mendonça decretou bloqueio patrimonial
  individualizado contra sete integrantes de "A Turma" e "Os Meninos": David Henrique Alves, Victor Lima Sedlmaier e Rodrigo Pimenta Franco Avelar Campos — R$ 1.800.000,00 cada, núcleo "Os Meninos" — e Manoel Mendes Rodrigues, Anderson Wander da Silva Lima, Sebastião Monteiro Júnior e Erlene Nonato Lacerda — R$ 9.600.000,00 cada, núcleo "A Turma". O
  bloqueio alcança ativos financeiros (SISBAJUD), imóveis (CNIB), veículos (RENAJUD), embarcações
  (Capitanias dos Portos), aeronaves (ANAC), valores mobiliários (CVM) e criptoativos — via ofícios a 14
  corretoras nomeadas (Foxbit, Mercado Bitcoin, Binance, Coinbase, BitcoinTrade/Ripio Trade, NovaDAX,
  BitPreço, Coinext, BitcoinToYou, NoxBitcoin, Flow, BitNuvem, BitBlue e BitCâmbio) e à Associação
  Brasileira de Criptoeconomia (ABcripto).'
document_ids:
- doc-2026-05-13-decisao-pet16019-medidas-assecuratorias
source_ids:
