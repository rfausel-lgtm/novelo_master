notes: >-
  Nenhuma cifra é registrada como fato. As unidades diferem (por diária, cinco diárias, fatura em euros
  convertida, valor por pessoa), e a fonte primária (o relatório da PF) não foi localizada. O Correio
  Braziliense não explica a diferença entre o valor atribuído pela PF e as diárias registradas no portal do
  Senado, que o Novelo não abriu.
