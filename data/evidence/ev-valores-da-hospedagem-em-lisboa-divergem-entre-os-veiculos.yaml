id: ev-valores-da-hospedagem-em-lisboa-divergem-entre-os-veiculos
kind: evidence
classification: A
proposition: >-
  As cifras publicadas sobre a hospedagem em Lisboa em junho de 2024 divergem entre os veículos, e o Novelo não
  as reconcilia: R$ 91.280,59 por cinco diárias atribuídas a Ciro Nogueira (CNN Brasil, Correio Braziliense e
  Agência O Globo, esta com R$ 18.256,12 por dia; o Poder360 dá R$ 91.280 e média de R$ 18.256 por diária);
  custo total de cerca de R$ 90 mil para cada um, segundo a PF, com base na cotação do euro da época (Estadão
  Conteúdo); fatura de 3.155,71 euros por cinco diárias, cerca de R$ 18 mil (IstoÉ, que fala em cerca de 3 mil
  euros), cerca de R$ 18,2 mil (Correio da Manhã) ou R$ 20.038,76 (Gazeta do Povo); e, segundo o Correio
  Braziliense, R$ 16.784,89 de cinco diárias pagas pelo Senado ao senador na mesma data.
attributed_to: >-
  CNN Brasil, Poder360, Agência O Globo e Correio Braziliense (R$ 91.280,59); Estadão Conteúdo (cerca de R$ 90
  mil por pessoa); IstoÉ, Metrópoles, Correio da Manhã e Gazeta do Povo (fatura em euros e conversões);
  Correio Braziliense (diárias pagas pelo Senado)
