excerpt: o Banco Master teria movimentado cerca de R$ 2,8 bilhões em operações de câmbio para uma empresa suspeita de lavar dinheiro para o Primeiro Comando da Capital (PCC)
date: '2026-03-02'
notes: As cifras são alegação do requerimento da CPI, reproduzida por Mendonça ao relatar o pedido — não
  são conclusão da própria decisão nem fato apurado de forma independente pelo acervo. Nenhuma outra fonte
  do acervo, até esta data, relaciona o Banco Master a uma operação de lavagem de dinheiro em favor do PCC.
