id: ev-cpi-justificativa-convocacao-campos-neto-cifras-master-pcc
kind: evidence
classification: A
proposition: 'O requerimento da CPI do Crime Organizado que fundamentou a convocação de Roberto Campos
  Neto — reproduzido na decisão de Mendonça de 02/03/2026 (INQ 5.026) — afirma que "o recente colapso do
  Banco Master, instituição envolvida em um esquema de fraudes que pode alcançar R$ 17 bilhões, conforme
  apurado pela Operação Compliance Zero da Polícia Federal, serve como o principal nexo causal para esta
  convocação", e que "investigações revelaram que o Banco Master teria movimentado cerca de R$ 2,8 bilhões
  em operações de câmbio para uma empresa suspeita de lavar dinheiro para o Primeiro Comando da Capital
  (PCC)".'
attributed_to: Requerimento da CPI do Crime Organizado, reproduzido na decisão de Mendonça de 02/03/2026
document_ids:
- doc-2026-03-02-decisao-inq5026-campos-neto-convite-cpi
source_ids:
