id: ev-marilson-vazamento-busca-13-03-2026-na-prisao
kind: evidence
classification: D
proposition: 'Já preso, Marilson Roseno da Silva soube, por meio de um colega de cárcere não identificado,
  que a Polícia Federal havia realizado busca e apreensão em sua própria residência em 13/03/2026 — nove
  dias após sua prisão em 04/03/2026 — antes mesmo de a PF comunicá-lo oficialmente. Questionado por
  quem soube, recusou-se a identificar a fonte, alegando risco à própria segurança: "Doutor, eu tô
  correndo um risco grande lá que o senhor não tem noção... Desejo não falar porque eu corro risco".'
document_ids:
- doc-2026-05-representacao-pf-pet15978-sexta-fase
source_ids:
- src-stf-pet15978-edoc2-representacao-pf-sexta-fase
date: '2026-03-13'
notes: 'É a evidência primária por trás da afirmação, já registrada no perfil de Marilson a partir da
  notícia de sua transferência ao presídio federal em 15/05/2026, de que ele "continuava recebendo
  informações sigilosas sobre operações policiais mesmo preso" — aqui com o episódio concreto e a data.
  A diligência que Marilson descobriu era justamente a que buscava imagens de câmeras do condomínio
  dele para identificar quem o visitara em 01/03/2026 — encontro que a PF usou para identificar Sebastião
  Monteiro Júnior (evidência relacionada — ev-sequencia-encontros-vespera-terceira-fase-turma). A PF cita
  esse episódio como fundamento direto para a transferência de Marilson ao sistema penitenciário federal.'
