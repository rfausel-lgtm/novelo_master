id: ev-toffoli-submeteu-o-coaf-a-rcl-88121
kind: evidence
classification: D
proposition: Dias Toffoli mandou o COAF observar a liminar de 09/12/2025 da Reclamação 88.121 (despacho de
  23/12/2025), deu-lhe ciência também da decisão de 12/12/2025 (02/02/2026) e, em 09/02/2026, determinou que o
  órgão enviasse as informações requisitadas, de forma sigilosa, ao INQ 5.026.
document_ids:
