date: '2025-12-23'
notes: É a base processual do roteamento que o próprio COAF descreveu em 25/02/2026 — dois RIFs, um pedido pela
  CPMI do INSS e um espontâneo, compartilhados com o gabinete de Toffoli "em cumprimento à decisão proferida na
  Reclamação 88.121" (ver ev-coaf-dois-rifs-enviados-ao-gabinete-toffoli-rcl-88121). Os despachos não descrevem o
  conteúdo das informações requisitadas.
