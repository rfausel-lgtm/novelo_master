id: ev-midias-promotora-laranja-com-antecedentes-criminais
kind: evidence
classification: D
proposition: 'A PF identifica Gilson Bahia Vasconcelos como titular formal das duas empresas "Mídias
  Promotora Ltda" (CNPJ 37.565.625/0001-00 e 44.758.763/0001-71), usadas para receber pagamentos de comissão
  do Banco Master a Ricardo Siqueira Rodrigues — mas nota que o telefone cadastrado na Receita Federal para
  essas empresas está vinculado a Ricardo Siqueira, não a Gilson. Gilson tem histórico de boletins de
  ocorrência por estelionato e organização criminosa, mandado de prisão recente, e recebeu cinco parcelas de
  Auxílio Emergencial — perfil incompatível com o de titular de empresas que movimentaram dezenas de milhões
  de reais. Uma das duas empresas tem conta bancária apenas no próprio Banco Master; a outra nunca teve
  relacionamento bancário algum.'
