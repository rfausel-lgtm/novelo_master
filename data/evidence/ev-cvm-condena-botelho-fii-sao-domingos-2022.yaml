id: ev-cvm-condena-botelho-fii-sao-domingos-2022
kind: evidence
classification: C
proposition: Em 05/07/2022, a CVM julgou o PAS SEI 19957.002315/2021-53, sobre a administração fiduciária
  do FII São Domingos — o mesmo fundo que comprou por R$ 57 milhões o terreno de Jequitibá regularizado
  por R$ 2,5 milhões. Foram condenados a Índigo Investimentos DTVM (denominação então adotada pela antiga
  Foco DTVM), Benjamim Botelho de Almeida e Sérgio Paulino Ferreira, em multas que somam R$ 2,1 milhões.
  A Botelho couberam R$ 450 mil, distribuídos em quatro capitulações, entre elas a falta de monitoramento
  do imóvel San Benedetto. Ele foi absolvido da acusação relativa à cobrança de taxa de administração
  e teve reconhecida ilegitimidade passiva quanto à operação de permuta, por ter ocorrido após sua renúncia
  ao cargo.
