excerpt: o voto de qualidade cabe ao presidente do Conselho de Administração
locator: Anexo I (estatuto), art. 28, § 4º (redação dada) e §§ 4º-A, 4º-B e 4º-C (incluídos)
date: 2026-01-22
notes: D demonstra o conteúdo do dispositivo. O radar citava o bloco como art. 29; no texto consolidado ele
  consta no art. 28 (o art. 29 trata do Conselho Consultivo), e é essa a numeração usada aqui.
