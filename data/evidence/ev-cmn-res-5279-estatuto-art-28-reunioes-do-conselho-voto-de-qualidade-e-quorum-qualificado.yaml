id: ev-cmn-res-5279-estatuto-art-28-reunioes-do-conselho-voto-de-qualidade-e-quorum-qualificado
kind: evidence
classification: D
proposition: O texto consolidado da Res. CMN 4.222 (v19, BC) marca como redação dada pela Res. CMN 5.279, de
  22/1/2026, o § 4º do art. 28 do estatuto do FGC (reunião do Conselho de Administração com a maioria absoluta
  dos membros e deliberação por maioria simples dos presentes) e como incluídos pela mesma resolução os §§
  4º-A, 4º-B e 4º-C, que tratam do voto de qualidade em caso de empate e do quórum de dois terços dos membros
  efetivos para certas deliberações.
document_ids:
