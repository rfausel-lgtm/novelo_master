id: ev-laudo-atribui-ao-havengate-exatamente-o-custo-total-do-filme
kind: evidence
classification: A
proposition: O mesmo laudo registra ter tido acesso ao contrato de investimento do Havengate Development Fund LP,
  fechado em 24/02/2025, e afirma que o aporte do fundo somava, até 10/06/2026, US$ 13.393.081,29 — exatamente o
  custo total de produção que a própria perícia apura.
