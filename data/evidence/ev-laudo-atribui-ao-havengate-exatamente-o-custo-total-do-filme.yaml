date: '2026-06-10'
notes: Pelo documento que a produção apresenta como prestação de contas, o filme inteiro foi financiado pelo fundo
  que, segundo a delação homologada, recebeu US$ 12,3 milhões de Daniel Vorcaro. A perícia afirma ausência de recursos
  públicos, mas não identifica fornecedores nem apresenta documento fiscal do destino dos valores.
