id: ev-liquidacao-fez-ressurgir-descontos-sobre-contratos-ja-quitados
kind: evidence
classification: C
proposition: 'A liquidação produziu um efeito que atinge diretamente quem já havia pago. Segundo apuração
  jornalística com lastro em caso concreto, a nova gestão reprocessou as bases de dados e reenviou listas
  automatizadas ao setor de pessoal do município de Campo Grande, restabelecendo descontos sobre contratos
  encerrados: uma servidora que quitou em janeiro de 2026 teve R$ 293,46 descontados em agosto e, ao reclamar,
  ouviu que ''enquanto o banco mandar vai ser descontado'', enquanto o telefone da instituição ''não existe''.
  No mesmo processo, a liminar obtida pela prefeitura e pelo instituto de previdência determinou que a
  instituição se abstivesse de cobrar ou negativar os servidores — único registro localizado de tutela
  expressa nesse sentido.'
