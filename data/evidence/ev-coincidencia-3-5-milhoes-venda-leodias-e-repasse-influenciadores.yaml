id: ev-coincidencia-3-5-milhoes-venda-leodias-e-repasse-influenciadores
kind: evidence
classification: C
proposition: 'É neste ponto que o caso de Thiago Miranda se decide, e as duas leituras partem da mesma
  cifra. Daniel Vorcaro comprou 10% do Portal Leo Dias de Thiago Miranda por R$ 3,5 milhões, pagos por
  meio da Super Empreendimentos e Participações — a holding ligada a Vorcaro e a Fabiano Zettel. E foram
  exatamente R$ 3,5 milhões os valores que Miranda repassou a influenciadores entre o fim de dezembro
  de 2025 e 5 de janeiro de 2026, no âmbito do ''Projeto DV''. A defesa sustenta que os recursos empregados
  na campanha eram próprios, produto da venda da participação; a Polícia Federal sustenta que vieram do
  esquema, transferidos pela Super. Como o pagamento da venda também partiu da Super, trata-se da mesma
  origem lida de dois modos opostos: dinheiro que se tornou dele por um negócio lícito, na versão da defesa,
  ou repasse do esquema com aparência de contraprestação, na da investigação. Nenhuma fonte localizada
  apresenta a documentação bancária que permitiria distinguir as duas hipóteses.'
