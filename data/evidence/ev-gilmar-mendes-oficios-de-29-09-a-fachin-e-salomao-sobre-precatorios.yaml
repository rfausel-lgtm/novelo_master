id: ev-gilmar-mendes-oficios-de-29-09-a-fachin-e-salomao-sobre-precatorios
kind: evidence
classification: C
proposition: >-
  Segundo o SBT News (Coluna da Basília) e a Agência Estado, em 29/09/2026 Gilmar Mendes enviou ofícios aos
  presidentes do STF, Edson Fachin, e do STJ, Luís Felipe Salomão, sobre a expedição de precatórios: defendeu
  "sustar todas as decisões que determinaram indevidamente a expedição de precatório antes do trânsito em
  julgado" e uma correição extraordinária da Corregedoria Nacional de Justiça em todos os tribunais regionais
  federais, sobretudo no TRF-1; segundo a Agência Estado, cobrou também do Banco Central e da CVM a apuração da
  presença desses créditos em fundos e balanços de bancos. Os dois veículos atribuem ao ofício a frase de que
  as investigações do Master "revelaram um modelo de negócios parasitário, que drenava recursos públicos e a
  poupança de milhares de investidores".
