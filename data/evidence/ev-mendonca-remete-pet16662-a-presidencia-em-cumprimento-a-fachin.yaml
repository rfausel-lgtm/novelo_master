id: ev-mendonca-remete-pet16662-a-presidencia-em-cumprimento-a-fachin
kind: evidence
classification: D
proposition: Em 12/09/2026, André Mendonça encaminhou os autos da PET 16.662 à Presidência do STF, citando como
  fundamento o item IV da decisão do presidente Edson Fachin na Pet 16.704, de 09/09/2026, que suspendeu todo
  procedimento sobre potencial investigação de integrantes da Corte; no mesmo despacho, registrou ter liberado o
  feito para julgamento pelo Plenário em 06/09/2026.
document_ids:
