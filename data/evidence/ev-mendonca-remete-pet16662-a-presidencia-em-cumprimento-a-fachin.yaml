- doc-2026-09-09-integra-decisao-fachin-pet-16704
source_ids:
- src-stf-pet16662-despacho-12-09-2026-remessa-a-presidencia
date: '2026-09-12'
notes: 'O acervo registra a pauta da sessão plenária extraordinária de 15/09/2026, cujo único item é a PET 16.662 (ver
  ev-pauta-de-15-09-tem-um-unico-item-e-nao-inclui-o-caso-andrei). O despacho não diz se a sessão fica mantida,
  e o acervo não localizou, até a coleta, ato alterando a pauta. Mendonça apresenta a remessa como cumprimento da
  ordem do presidente, e não como desistência do rito plenário, que diz ter seguido desde a instauração.'
