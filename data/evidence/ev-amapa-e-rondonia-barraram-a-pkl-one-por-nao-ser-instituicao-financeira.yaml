id: ev-amapa-e-rondonia-barraram-a-pkl-one-por-nao-ser-instituicao-financeira
kind: evidence
classification: D
proposition: Dois estados abriram a margem para cartão de benefício e, ainda assim, barraram a operadora
  — pelo mesmo fundamento que os demais não opuseram. No Amapá, o processo de habilitação de 2023 inabilitou
  a PKL One sob a motivação de que ela 'não se enquadra dentre os tipos de consignatárias', habilitando
  no mesmo despacho o Banco Master. Em Rondônia, a lei complementar de abril de 2024 criou margem de 5%
  para o produto mas exigiu instituição autorizada pelo Banco Central e aderente à autorregulação bancária,
  o que produz o mesmo efeito. Os dois casos demonstram que a objeção era disponível e conhecida à época.
