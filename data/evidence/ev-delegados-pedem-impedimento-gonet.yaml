proposition: A Associação Nacional dos Delegados de Polícia Federal pediu, em 06/09/2026, que Paulo Gonet
  se declare impedido de atuar nos procedimentos da crise Moraes-Mendonça, por seu nome constar nas mensagens
  do celular de Vorcaro — argumentando que sua atuação 'gera um efeito intimidatório em relação aos investigadores'.
  Não localizada resposta de Fachin ou decisão sobre esse pedido.
