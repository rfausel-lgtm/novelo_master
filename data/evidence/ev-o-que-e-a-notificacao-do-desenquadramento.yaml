id: ev-o-que-e-a-notificacao-do-desenquadramento
kind: evidence
classification: D
proposition: 'A ''notificação do desenquadramento'' invocada na petição inicial não é ato de órgão externo
  de controle: é a reação administrativa da própria Amprev ao rebaixamento do rating do banco, que a fez
  deixar de atender ao critério de baixo risco de crédito. Os autores sustentam nos autos que a autarquia
  ''instaurou processo administrativo específico, promoveu notificações formais ao Banco Master, exigiu
  a apresentação de soluções de reenquadramento e iniciou tratativas para substituição ou liquidação dos
  ativos''. O liquidante contesta o efeito jurídico disso, sustentando que o art. 27 da Resolução CMN
  4.963/2021 concede ao gestor do regime próprio até cento e oitenta dias para decidir sobre o desinvestimento
  e que, no caso, ''não houve ordem de resgate emitida pelo Amprev'' antes da liquidação.'
