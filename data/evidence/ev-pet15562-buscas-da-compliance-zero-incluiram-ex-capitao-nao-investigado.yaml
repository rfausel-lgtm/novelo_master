id: ev-pet15562-buscas-da-compliance-zero-incluiram-ex-capitao-nao-investigado
kind: evidence
classification: D
proposition: Em 03/03/2026, na PET 15.562, André Mendonça deferiu busca e apreensão e busca pessoal contra Daniel
  Vorcaro, Fabiano Zettel, Luiz Phillipi Mourão, Marilson Roseno da Silva, Paulo Sérgio Neves de Souza, Belline
  Santana, Leonardo Augusto Furtado Palhares, Ana Cláudia Queiroz de Paiva e cinco empresas — e, sem que figurasse
  como investigado, contra Luís Felipe Woyceichoski, ex-capitão da embarcação de Vorcaro, com a finalidade exclusiva
  de apreender vídeos e contatos que ele teria declarado guardar sobre a "Turma".
document_ids:
- doc-2026-03-03-decisao-pet15562-busca-e-apreensao
source_ids:
- src-stf-pet15562-decisao-03-03-2026-busca-e-apreensao
date: '2026-03-03'
notes: 'É o terceiro processo sigiloso da mesma data, ao lado da PET 15.556 (prisões) e da PET 15.563 (bloqueio de
  bens, ver ev-pet15563-primeiro-bloqueio-patrimonial-da-compliance-zero). As buscas foram cumpridas em 04/03/2026 e
  já constavam do acervo por reportagens (ver ev-buscas-e-cautelares-contra-dois-servidores-do-bc); esta é a ordem
  judicial. A decisão afirma que todos os alvos, com exceção de Woyceichoski, participaram dos ilícitos segundo a
  PF, e chama as cinco empresas (Varajo Consultoria, Moriah Asset, Super Empreendimentos, King Participações
  Imobiliárias e King Motors) de "típicas empresas de fachada". Woyceichoski é a vítima nomeada da ameaça
  atribuída à Turma em Angra dos Reis; a PF queria dele o material que identificaria os demais integrantes. Como na
  PET 15.563, o pedido de mais prazo da PGR chegou depois de esgotadas as 24 horas de vista e foi indeferido.
  Hipóteses investigativas, sem julgamento.'
