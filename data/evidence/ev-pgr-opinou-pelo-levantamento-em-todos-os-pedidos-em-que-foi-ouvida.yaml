id: ev-pgr-opinou-pelo-levantamento-em-todos-os-pedidos-em-que-foi-ouvida
kind: evidence
classification: D
proposition: 'Em todos os pedidos de mérito em que foi ouvida na PET 16.230, a Procuradoria-Geral da República opinou
  a favor do investigado: pelo levantamento do bloqueio de Jaques Wagner (03/07/2026), de André Pissolito Campos
  (21/07), da MSMG Patrimonial e do grupo WNT (30/07), e pelo deferimento do desbloqueio parcial pedido pela BN
  Financeira (26/08). Nos agravos, deixou de contra-arrazoar, por ser o mesmo o motivo que já sustentara contra
  a medida assecuratória.'
