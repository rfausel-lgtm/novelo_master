inference_basis: Ausência de declaração pública localizada de Fachin sobre o fato específico, combinada
  com a constatação de que a decisão de Mendonça se baseou em processo de sua própria relatoria (Pet 16.662),
  distinto do procedimento (Pet 16.704) que o presidente do STF havia avocado cinco dias antes para tratar
  exatamente da mesma crise.
