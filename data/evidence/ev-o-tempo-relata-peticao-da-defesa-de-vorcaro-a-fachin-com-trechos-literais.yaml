id: ev-o-tempo-relata-peticao-da-defesa-de-vorcaro-a-fachin-com-trechos-literais
kind: evidence
classification: A
proposition: Segundo O Tempo (17/10/2026), em petição enviada ao presidente do STF, Edson Fachin, na
  sexta-feira (16/10), a defesa de Daniel Vorcaro requereu a instauração de uma "investigação criminal ampla"
  para apurar os responsáveis pela divulgação de mensagens, "agentes públicos" ou "terceiros"; afirmou que a
  divulgação de diálogos com seus advogados viola o sigilo advogado-cliente; reclamou de "espetacularização
  midiática" do caso; e sustentou que as mensagens extraídas do celular seriam "imprestáveis" para fundamentar
  a responsabilização dele pela Polícia Federal.
