date: 2026-10-16
notes: Alegação da defesa, relatada pelo veículo com trechos que ele atribui à peça; o Novelo não leu a
  petição. Os termos entre aspas são da defesa, não do Novelo, que não afirma a autenticidade nem a
  procedência do material nem a tese de nulidade.
