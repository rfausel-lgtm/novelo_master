id: ev-fgc-nao-cobre-a-amprev-por-dois-fundamentos
kind: evidence
classification: D
proposition: 'A Amprev não tem cobertura alguma do FGC sobre os R$ 400 milhões, por dois fundamentos autônomos
  e cumulativos. Primeiro: a letra financeira não integra o rol taxativo de instrumentos cobertos pelo
  art. 2º do Regulamento — a expressão não aparece uma única vez no documento. Segundo: ainda que integrasse,
  o § 1º, V, ''a'' exclui expressamente da garantia ordinária os créditos de titularidade de regimes próprios
  de previdência social instituídos por Estados. Não há cobertura nem parcial, nem até o teto de R$ 250
  mil.'
document_ids:
