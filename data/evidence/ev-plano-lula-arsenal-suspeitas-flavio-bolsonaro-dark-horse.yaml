id: ev-plano-lula-arsenal-suspeitas-flavio-bolsonaro-dark-horse
kind: evidence
classification: A
proposition: Segundo a Poder360 (06/09/2026), o grupo político de Lula pretende apresentar um 'arsenal
  de suspeitas de ilegalidades' contra o senador Flávio Bolsonaro quando faltarem ao menos 20 dias para
  o 1º turno da eleição (prazo da Lei 9.504/1997 para substituição de candidatos). Parte dessas suspeitas
  seriam indícios de que doações de Vorcaro ao filme 'Dark Horse', atribuídas a Jair Bolsonaro, teriam
  sido, na realidade, direcionadas a integrantes da família Bolsonaro — indícios que constariam da delação
  de Antonio Carlos Freixo Júnior (já mapeado no acervo), recebida pelo procurador-geral Paulo Gonet,
  descrito pela reportagem como próximo de Gilmar Mendes, do grupo que defende Moraes e se opõe a Mendonça.
