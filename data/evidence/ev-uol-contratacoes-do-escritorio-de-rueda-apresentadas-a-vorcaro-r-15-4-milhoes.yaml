id: ev-uol-contratacoes-do-escritorio-de-rueda-apresentadas-a-vorcaro-r-15-4-milhoes
kind: evidence
classification: A
proposition: >-
  Segundo o UOL (16/10/2026), em agosto de 2024 o jurídico do Master apresentou a Vorcaro a contratação do
  escritório Rueda & Rueda Advogados em quatro ações, no total de R$ 15,4 milhões.
attributed_to: UOL (Fabio Serapião, Natália Portinari e Cézar Feitoza)
document_ids: []
source_ids:
- src-uol-2026-10-16-mensagens-mostram-como-rueda-e-acm-levaram-o-master-a-fundos-de-previdencia
date: '2024-08'
notes: >-
  Valor de contratação apresentada, não valor pago. O acervo registra R$ 6,4 milhões repassados a escritórios
  ligados a Rueda, segundo registros da Receita enviados à CPI e divulgados pela imprensa (classe A). Rueda diz
  que os serviços advocatícios foram prestados com emissão de notas fiscais e recolhimento de impostos.
