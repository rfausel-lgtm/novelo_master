id: ev-paulo-sergio-relato-interno-sitio-guaxupe-4-5-milhoes-zettel
kind: evidence
classification: D
proposition: Em relato verbal prestado à Corregedoria-Geral do BC em 07/01/2026, Paulo Sérgio Neves de Souza admitiu
  ter vendido, em janeiro de 2020, por R$ 4,5 milhões, um sítio em Guaxupé/MG que planejava lotear — só descobrindo,
  um ano depois, na escritura, que o comprador era Fabiano Campos Zettel, cunhado de Daniel Vorcaro. Recebeu o valor
  em cinco parcelas, depositadas em conta conjunta com o irmão. O comprador desistiu do loteamento; posteriormente,
  o irmão de Paulo Sérgio passou a arrendar a mesma terra de Zettel para lavoura de café.
document_ids:
