date: '2026-01-07'
notes: Não está estabelecido se esta venda (sítio, Guaxupé/MG, R$ 4,5 milhões, jan/2020, comprador pessoa física)
  é a mesma operação já registrada no verbete dele como 'venda de uma fazenda de café por R$ 3 milhões em 2021 a
  fundo ligado a Fabiano Zettel', ou uma segunda operação distinta — os valores, datas, tipo de comprador (pessoa
  física vs. fundo) e natureza do imóvel divergem o suficiente para não presumir que sejam a mesma.
