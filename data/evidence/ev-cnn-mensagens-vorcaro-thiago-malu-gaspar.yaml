id: ev-cnn-mensagens-vorcaro-thiago-malu-gaspar
kind: evidence
classification: A
proposition: 'Mensagens reproduzidas pela CNN Brasil, com datas entre 31/03/2025 e 08/04/2025: Vorcaro
  escreve ''Agora tenho que frear a Malu Gaspar'', ''Ela vai começar campanha contra se não entrarmos'',
  ''Vamos ter que tentar pegar algo dessa mulher no pessoal'' e, em 08/04, cogita ''Contratar ela. Luva
  de 1,5 mm e salário de 120k o que acha''. Miranda responde ''Vou revirar a vida dela'' e ''Eu preciso
  arrumar uma forma de calar essa mulher. Ela é intragável''.'
