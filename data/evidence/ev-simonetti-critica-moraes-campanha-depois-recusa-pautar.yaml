id: ev-simonetti-critica-moraes-campanha-depois-recusa-pautar
kind: evidence
classification: I
proposition: 'Há uma tensão não resolvida entre duas condutas de Beto Simonetti: na campanha de reeleição à
  presidência da OAB (janeiro/2025), criticou publicamente Alexandre de Moraes, sem nomeá-lo diretamente
  ("a lei brasileira não permite que a vítima julgue seu próprio caso"); menos de oito meses depois, já como
  presidente reeleito e com evidência concreta em mãos (mensagens Vorcaro-Moraes, contrato do escritório da
  esposa de Moraes com o Banco Master), recusou pautar no Conselho Federal a votação sobre o afastamento
  cautelar do próprio ministro, preferindo uma comissão sob controle da diretoria que preside.'
document_ids: []
source_ids:
