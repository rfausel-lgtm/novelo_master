date: '2026-09-14'
inference_basis: 'Nenhuma fonte liga expressamente os dois fatos — a frase de campanha de janeiro/2025 e a
  recusa de pautar de setembro/2026. A tensão é construída pela equipe a partir da cronologia e do conteúdo
  dos dois eventos, não por declaração de terceiro que os associe. Limite explícito: a recusa de pautar foi
  justificada publicamente por razão procedimental (comissão em andamento), não por mudança de opinião
  sobre Moraes — a equipe não tem como distinguir entre justificativa genuína e pretexto.'
