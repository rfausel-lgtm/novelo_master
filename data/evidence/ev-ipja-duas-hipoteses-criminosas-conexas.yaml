id: ev-ipja-duas-hipoteses-criminosas-conexas
kind: evidence
classification: D
proposition: 'Nas considerações finais, a PF informa que as cautelares deferidas na PET 15.556 se apoiam
  em duas hipóteses criminosas conexas, porém distintas: a primeira, sobre suposto pagamento de vantagens
  indevidas a servidores do Banco Central, apurada no IPL nº 2026.0053200 (PET 15.504); a segunda, sobre
  a atuação de grupo denominado ''Turma'', apurada no IPL nº 2026.0029775 (PET 15.499). Ambas estariam
  em estágio avançado, pendentes apenas da conclusão das análises bancárias e do exame do material apreendido,
  com oitivas iniciadas e previsão de conclusão em 60 dias a contar de 27/08/2026.'
