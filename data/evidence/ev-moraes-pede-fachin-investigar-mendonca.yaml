id: ev-moraes-pede-fachin-investigar-mendonca
kind: evidence
classification: A
proposition: Na noite de 03/09/2026, Alexandre de Moraes pediu formalmente a Fachin a abertura de apuração
  contra André Mendonça, por 'abuso de autoridade, improbidade administrativa e crime de responsabilidade'
  na condução dos casos Master e INSS. Em 04/09, Fachin separou o pedido do inquérito das fake news, avocou-o
  para sua própria relatoria e deu à PGR cinco dias úteis para se manifestar sobre a admissibilidade e
  regularidade do procedimento adotado por Moraes.
