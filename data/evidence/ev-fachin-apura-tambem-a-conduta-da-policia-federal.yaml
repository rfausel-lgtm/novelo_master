id: ev-fachin-apura-tambem-a-conduta-da-policia-federal
kind: evidence
classification: D
proposition: 'Ao autuar de ofício a PET 16.704, em 03/09/2026, o presidente do STF fixou objeto que alcança
  a própria atuação da Polícia Federal e a via processual adotada: o cumprimento da Lei Orgânica da Magistratura
  em relação a autoridades com foro; eventuais indícios de uso de credenciais de acesso institucional
  para avaliar documento estritamente particular e de revelação de informação sob sigilo judicial a pessoa
  investigada; as circunstâncias do despacho que determinou a identificação das pessoas mencionadas; e
  as medidas de controle externo da atividade policial. Foram intimados a prestar informações em cinco
  dias úteis Alexandre de Moraes, André Mendonça, Paulo Gonet e Andrei Passos Rodrigues.'
