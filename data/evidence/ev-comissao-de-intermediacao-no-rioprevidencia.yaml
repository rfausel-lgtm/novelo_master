id: ev-comissao-de-intermediacao-no-rioprevidencia
kind: evidence
classification: A
proposition: Segundo PF e PGR, o Banco Master pagou ao menos R$ 22,1 milhões a Ricardo Siqueira Rodrigues
  pela intermediação dos aportes do Rioprevidência — cerca de 0,6% do total —, e a empresa Mídias Promotora
  recebeu R$ 126 milhões do banco entre 2022 e 2025, descrita nas peças como veículo para receber e distribuir
  comissões. É a remuneração do canal de colocação, isto é, o elo que faltava entre o emissor e as portas
  abertas em cada fundo. Alegação de autoridade investigativa, não julgada.
