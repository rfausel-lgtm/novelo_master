id: ev-escritorio-queiroga-vieira-queiroz-e-ramos-contrato-formal-e-nada-recebido
kind: evidence
classification: A
proposition: >-
  Em nota de 23/09/2026, segundo a Agência Brasil, o escritório Queiroga, Vieira, Queiroz e Ramos declarou ter
  contrato formal com o Banco Master para atuar em processos que envolvem precatórios, sem ter recebido qualquer
  pagamento "a título de pró-labore ou de êxito", com taxa de êxito de 5%; segundo o Times Brasil, afirmou não ter
  conhecimento de negociações de transferência dos precatórios a terceiros nem ter participado delas.
