classification: A
proposition: André Kruschewsky Lima, o executivo que assinou o termo de credenciamento do Banco Master
  na Alagoas Previdência, exerceu o cargo de diretor jurídico do banco entre março de 2023 e agosto de
  2024, segundo reportagem que afirma tê-lo apurado a partir de relatório da PF citado na decisão do ministro
  André Mendonça que autorizou a 5ª fase da Operação Compliance Zero. O mesmo relatório o situa no contexto
  da emenda nº 11 à PEC 65/2023 — a mesma emenda sobre ampliação da cobertura do FGC que o corpus já registra
  como hipótese da Polícia Federal atribuída à assessoria do Banco Master, sem confirmação de autoria
  pessoal.
