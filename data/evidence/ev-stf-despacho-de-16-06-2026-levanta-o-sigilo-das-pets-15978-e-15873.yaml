id: ev-stf-despacho-de-16-06-2026-levanta-o-sigilo-das-pets-15978-e-15873
kind: evidence
classification: D
proposition: >-
  Em 16/06/2026, o ministro André Mendonça, em despacho na Pet 15.873/DF, levantou o sigilo das Pets 15.978 e
  15.873, tendo em vista a inclusão em pauta, no mesmo dia e "de última hora", da devolução da vista regimental
  das duas Pets na sessão presencial da Segunda Turma, a necessidade de permitir aos demais ministros do
  colegiado o acesso à integralidade dos feitos e a ausência de prejuízo à investigação.
