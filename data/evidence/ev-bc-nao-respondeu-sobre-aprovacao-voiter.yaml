id: ev-bc-nao-respondeu-sobre-aprovacao-voiter
kind: evidence
classification: A
proposition: O Banco Central e o Banco Pleno não responderam aos questionamentos do Poder360 sobre por
  que a venda do Voiter foi aprovada apesar dos indícios prévios de fraude, até a publicação da reportagem.
  Não foi localizada, em qualquer momento posterior, explicação oficial do BC sobre o episódio específico
  — inclusive na CPMI do INSS, que aprovou apenas convite (não convocação) a Galípolo e Campos Neto, com
  pauta mais ampla sobre autorizações a bancos envolvidos em fraude de consignados, sem menção nominal
  ao caso Voiter no requerimento.
