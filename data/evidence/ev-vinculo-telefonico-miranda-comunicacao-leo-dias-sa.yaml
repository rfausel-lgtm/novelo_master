notes: 'Cautela sobre a identidade das pessoas jurídicas envolvidas: a reportagem cita pelo menos três
  nomes semelhantes — "Léo Dias Comunicação e Jornalismo S.A." (atual, administrada pelo mesmo sócio da
  Miranda Comunicação, sem CNPJ dado pela reportagem), "Léo Dias Comunicação e Jornalismo Ltda SCP VTG"
  (já registrada no acervo, CNPJ 55.062.879/0001-98, Miranda como administrador até 2025) e "Leo Dias
  Comunicação e Jornalismo Ltda" (CNPJ 51.568.337/0001-30, administrada por Ivan Carlos de Oliveira,
  identificada em documento separado — ver ev-leo-dias-intimado-mesmo-despacho-thiago-miranda). As fontes
  disponíveis não esclarecem se são três entidades distintas ou se há erro de nomenclatura em algum dos
  registros. Não é possível, com o material atual, indicar a qual delas o número de telefone compartilhado
  se refere. O CNPJ da própria Agência MiThi permanece não localizado (ver
  ev-miranda-empresas-mithi-cnpj-nao-localizado).'
