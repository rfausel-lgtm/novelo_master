id: ev-vinculo-telefonico-miranda-comunicacao-leo-dias-sa
kind: evidence
classification: A
proposition: 'Segundo reportagem do G1 (09/01/2026), colacionada na Portaria de instauração do IPL sobre
  o "Projeto DV", "há uma relação entre Thiago Miranda e o comunicador Léo Dias. O sócio-administrador da
  Miranda Comunicação também é administrador da empresa Léo Dias Comunicação e Jornalismo S.A. e foi, até
  2025, administrador da Léo Dias Comunicação e Jornalismo Ltda SCP VTG. Um mesmo número de telefone
  aparece registrado no CNPJ da Miranda Comunicação e também no CNPJ da Léo Dias Comunicação e Jornalismo
  S.A." A mesma reportagem cita Flávio Carneiro como detentor de 60% de participação no "Grupo Leo Dias",
  do qual Miranda teria 10%.'
