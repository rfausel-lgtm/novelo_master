proposition: 'Segundo o Jornal Sete (14/05/2026), o desembargador federal Mauro Braga, do TRF da 2ª Região, negou
  em liminar recurso do Banco Master no processo do Rioprevidência, que foi encaminhado ao STF, mantendo a
  autorização para o fundo reter parcelas de consignados devidas ao banco.'
