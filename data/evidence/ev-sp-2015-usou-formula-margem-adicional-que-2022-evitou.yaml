id: ev-sp-2015-usou-formula-margem-adicional-que-2022-evitou
kind: evidence
classification: D
proposition: O contraste interno da própria legislação paulista dá a medida da escolha feita em 2022.
  Quando quis criar margem verdadeiramente adicional, em 2015, a administração escreveu que a margem 'poderá
  ser majorada, adicionalmente, em até 5%', com destinação exclusiva a dívidas de cartão de crédito. Em
  2022, para o cartão de benefício, escolheu a fórmula do sublimite — e chegou ao mesmo resultado elevando
  o teto global. A fórmula 'majorada, adicionalmente' é a que aparece, textualmente, no decreto do município
  de São Paulo e nos atos do Rio de Janeiro e de Mato Grosso.
