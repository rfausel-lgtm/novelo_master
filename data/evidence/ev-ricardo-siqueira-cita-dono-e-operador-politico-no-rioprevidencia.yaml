notes: A PF lê essas mensagens como indício de interferência política externa sobre decisões técnicas do RPPS,
  no contexto da hipótese de corrupção envolvendo o então governador Cláudio Castro; não identifica
  expressamente a quem as expressões "dono" e "operador político" se referem.
