id: ev-ricardo-siqueira-cita-dono-e-operador-politico-no-rioprevidencia
kind: evidence
classification: A
proposition: 'Mensagens de Ricardo Siqueira Rodrigues, operador financeiro apontado como intermediário dos
  aportes da RioPrevidência no Banco Master, citadas na representação da PF na Pet 15.497, afirmam que a
  liberação de investimentos do órgão dependeria de "alinhamento político", mencionando a existência de um
  "dono" do órgão e de um "operador político" que "manda lá de verdade" — sem nomear expressamente quem
  seriam essas pessoas.'
