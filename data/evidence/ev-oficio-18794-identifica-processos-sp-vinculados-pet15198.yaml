proposition: O Ofício nº 18794/2025 do Procurador da República em São Paulo Vicente Solari de Moraes Rêgo
  Mandetta identifica, pela primeira vez de forma citável, os números dos autos paulistas que embasariam
  a decisão de 06/01/2026 na PET 15.198 — o Pedido de Prisão Preventiva n. 5009071-26.2025.4.03.6181 e o
  Inquérito Policial n. 5004641-31.2025.4.03.6181, ambos da 8ª Vara Criminal Federal de São Paulo — e
  registra que a remessa ao STF se deu "com o máximo sigilo", por meio de links do Google Drive.
