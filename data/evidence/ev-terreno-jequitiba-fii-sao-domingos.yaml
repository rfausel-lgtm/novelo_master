id: ev-terreno-jequitiba-fii-sao-domingos
kind: evidence
classification: A
proposition: Um terreno em Jequitibá (MG), regularizado por R$ 2,5 milhões em 2015, foi vendido por R$
  57 milhões ao FII São Domingos — valorização de 2.180% em dois anos. A operação justificou receita operacional
  bruta de R$ 89 milhões da Viking Participações, empresa de Vorcaro, por sua vez usada para lastrear
  o aporte de R$ 50 milhões exigido pelo Banco Central na análise da transferência de controle do Máxima.
  O FII São Domingos era abastecido por regimes próprios de previdência de servidores públicos e teve
  prejuízo de R$ 109 milhões em 2017. Em 2022, a CVM multou a Foco DTVM e o diretor do fundo em mais de
  R$ 1 milhão por má gestão, incluindo operações que beneficiaram empresas da família Vorcaro.
