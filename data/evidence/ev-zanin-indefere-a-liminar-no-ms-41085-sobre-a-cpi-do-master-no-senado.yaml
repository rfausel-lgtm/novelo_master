id: ev-zanin-indefere-a-liminar-no-ms-41085-sobre-a-cpi-do-master-no-senado
kind: evidence
classification: D
proposition: >-
  No Mandado de Segurança 41.085, impetrado por Alessandro Vieira contra o Presidente do Senado Federal e
  protocolado em 15/09/2026, o relator Cristiano Zanin indeferiu a liminar em 22/09/2026, por decisão
  monocrática; em 25/09 houve pedido de reconsideração, em 28/09 foram assinados ofícios ao Presidente do
  Senado e à AGU, em 29/09 foi interposto agravo regimental e, em 14/10/2026, os autos foram com vista à PGR.
document_ids:
