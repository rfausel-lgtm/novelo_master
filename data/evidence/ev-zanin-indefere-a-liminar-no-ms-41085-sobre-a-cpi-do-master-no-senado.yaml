locator: portal do STF, aba de andamentos do MS 41.085
date: '2026-09-22'
notes: >-
  O lastro é o registro oficial de andamentos do portal; o inteiro teor da decisão não foi lido. O MS 41.085 (CPI no Senado) é distinto do MS 40.791 (CPI na Câmara), já no acervo.
  Em 13/10/2026 o portal registra uma petição do tipo "Informações", sem identificar o autor.
