id: ev-mansur-detalha-paradeiro-20bi-imoveis-fundos-astralo
kind: evidence
classification: A
proposition: Segundo a proposta de Mansur, o patrimônio de R$ 20 bilhões atribuído a Vorcaro estaria disperso
  em imóveis, fundos de investimento (com menção nominal ao fundo Astralo, já citado no corpus em repasses
  da Reag), direitos creditórios e ativos em nome de terceiros — não necessariamente disponível para saque
  imediato ou em aplicações de alta liquidez, segundo ressalva da própria reportagem. Reportado por fonte
  única até o momento.
