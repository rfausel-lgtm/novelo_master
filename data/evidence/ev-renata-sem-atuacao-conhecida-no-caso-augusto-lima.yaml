inference_basis: Ausência de qualquer fonte que associe a atuação profissional de Renata Varandas ao caso
  específico de Augusto Lima, combinada com a existência confirmada do vínculo societário entre ela e
  os dois advogados que efetivamente atuaram nesse caso.
