id: ev-renata-sem-atuacao-conhecida-no-caso-augusto-lima
kind: evidence
classification: I
proposition: Não há, em nenhuma fonte localizada, indício de que Renata Varandas tenha atuado — direta
  ou indiretamente — na defesa ou na comunicação de crise de Augusto Lima. Toda a cobertura sobre conflito
  de interesse envolvendo ela trata do lobby registrado para a Ambipar (já registrado no corpus, lote
  107), não do caso de Lima. Nenhuma das partes (a banca, Renata, Andrei, Augusto Lima) se manifestou
  especificamente sobre essa segunda coincidência.
