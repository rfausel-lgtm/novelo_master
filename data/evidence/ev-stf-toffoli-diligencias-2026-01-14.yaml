date: '2026-01-14'
notes: 'Enriquecido em 12/09/2026 (lote 233) com a leitura integral das peças 35 e 40 da PET 15.198: os
  voos exatos (Zettel — Emirates EK0262, Guarulhos–Dubai; Tanure — Latam LA3540, Galeão–Curitiba), a
  apreensão de passaporte e proibição de sair do país como medida específica de Zettel (não de Tanure), e
  a determinação simultânea para que o Diretor-Geral da PF explicasse o descumprimento do prazo de 12/01 —
  ver ev-pf-nao-cumpre-prazo-24h-pede-reconsideracao-lacracao para a resposta da PF a essa cobrança.'
