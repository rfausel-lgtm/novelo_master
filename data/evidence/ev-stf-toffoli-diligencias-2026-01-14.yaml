id: ev-stf-toffoli-diligencias-2026-01-14
kind: evidence
classification: D
proposition: Em 14/01/2026, como relator, Dias Toffoli determinou nova busca e apreensão em endereços
  ligados a Vorcaro, prisão temporária de Fabiano Zettel (até as 07h00 de 14/01) e busca pessoal em Nelson
  Tanure — medidas motivadas por passagens aéreas de ambos com embarque previsto horas antes do prazo de
  cumprimento.
