notes: Conclusão negativa obtida por busca textual sobre a extração integral do PDF, conferida pela equipe. Importa
  para a leitura do caso porque as duas frentes correm com relatores distintos — a do financiamento, com André Mendonça;
  a das emendas, com Flávio Dino — e manchetes que descrevem a operação como investigação do 'financiamento do filme'
  atribuem à decisão um alcance que ela não tem.
