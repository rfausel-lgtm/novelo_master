id: ev-decisao-da-make-up-nao-menciona-vorcaro-nem-o-banco-master
kind: evidence
classification: D
proposition: 'A leitura integral das 150 páginas da decisão de 03/09/2026 não encontra uma única menção a Daniel
  Vorcaro, ao Banco Master, ao Havengate Development Fund, a Flávio Bolsonaro ou a Eduardo Bolsonaro: a frente relatada
  por Flávio Dino trata de emendas parlamentares e contratos administrativos, e não do dinheiro que, segundo o Coaf
  e a imprensa, teria saído do banqueiro para o filme.'
