id: ev-pgr-caracteriza-marilson-como-principal-operador-nucleo-coercao
kind: evidence
classification: A
proposition: Em manifestação de 21/07/2026, a PGR opinou pelo indeferimento do pedido de revogação da
  prisão preventiva de Marilson Roseno da Silva, caracterizando-o como "um dos principais operadores do
  núcleo de coerção da organização criminosa", responsável por diligências informais de monitoramento,
  obtenção de dados pessoais e mapeamento de informações estratégicas para antecipar ou neutralizar
  investigações e ações de jornalistas ou opositores, sob liderança de Luiz Phillipi Mourão.
document_ids:
- doc-2026-07-21-manifestacao-pgr-marilson-belline-mourao-cvm
source_ids:
- src-mpf-pgr-2026-07-21-manifestacao-marilson-belline-cvm-mourao
attributed_to: Procuradoria-Geral da República (Paulo Gonet Branco)
date: '2026-07-21'
notes: É a posição do órgão acusador, mais específica e mais grave que caracterizações anteriores do
  acervo (que o descreviam de forma mais genérica como "líder operacional em campo"); a defesa dele
  já registrou versão distinta no lote 185, negando papel de intimidação ou contato com Vorcaro.
