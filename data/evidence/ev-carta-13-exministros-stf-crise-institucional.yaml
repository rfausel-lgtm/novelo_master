proposition: Treze ex-ministros do STF (Ayres Britto, Carlos Velloso, Celso de Mello, Cezar Peluso, Ellen
  Gracie, Eros Grau, Francisco Rezek, Ilmar Galvão, Joaquim Barbosa, Nelson Jobim, Néri da Silveira, Rosa
  Weber, Sydney Sanches) enviaram, em 08/09/2026, carta conjunta ao presidente do STF, Edson Fachin, pedindo
  sessão pública do Plenário para 'imediata e rigorosa apuração' dos fatos que classificam como a 'mais
  aguda crise' da história da Corte — sem citar nomes ou episódios específicos.
