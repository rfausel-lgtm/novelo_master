excerpt: '[Temos] a absoluta convicção de que Vossa Excelência designará, com toda a urgência, sessão
  pública para que o Pleno determine imediata e rigorosa apuração, sob o devido processo legal, dos gravíssimos
  fatos cuja divulgação vem comprometendo o prestígio e a autoridade desse Tribunal.'
