proposition: A decisão de prisão preventiva de Paulo Henrique Costa (Pet 15.771, STF, 15/04/2026), lida
  integralmente pela equipe, transcreve mensagens de WhatsApp entre ele e Daniel Vorcaro sobre R$ 146.582.649,50
  em seis imóveis de alto padrão, com pagamentos já rastreados superiores a R$ 74,6 milhões, tratados
  como contrapartida por Costa ter chancelado a compra pelo BRB de cerca de R$ 12,2 bilhões em carteiras
  de crédito do Master que se revelaram falsas.
