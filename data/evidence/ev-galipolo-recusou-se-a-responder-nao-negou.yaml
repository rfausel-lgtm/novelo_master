id: ev-galipolo-recusou-se-a-responder-nao-negou
kind: evidence
classification: C
proposition: 'Correção a registro anterior do corpus, em ponto sensível. Gabriel Galípolo NÃO negou ter
  tratado do Banco Master com ministros do STF: ele confirmou reuniões com Alexandre de Moraes e recusou-se
  a dizer se o Master foi discutido, invocando dever fiduciário de sigilo — ''eu tenho acesso ao sigilo
  dos ministros a partir da conversa com eles e com os familiares. E aí eu tenho o dever fiduciário por
  zelar por esse sigilo''. O relator da CPI registrou expressamente em ata que o presidente do Banco Central
  ''não afirmou que não tratou de Banco Master'', acrescentando que ''a simples negativa do fato questionado
  não configuraria rompimento das regras de sigilo bancário, mas o depoente não o fez''. Recusar-se a
  responder não é negar, e o corpus passa a registrar a distinção.'
