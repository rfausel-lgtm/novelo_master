proposition: 'A decisão de 25/05/2026 que autorizou medidas contra Cláudio Castro gerou pelo menos 10 mandados
  de busca e apreensão registrados na Pet 15.676 (origem DF), além de 3 ofícios eletrônicos na Pet 15.686
  (origem RJ, mesma data) — mais ampla do que a busca "na casa do ex-governador" divulgada pela imprensa em
  26/05/2026. A Pet 15.686 nomeia um segundo alvo, Tharcio Nascimento Salgado.'
