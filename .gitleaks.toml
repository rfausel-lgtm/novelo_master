# Configuração do gitleaks para O Novelo Master.
# Usa o conjunto de regras padrão e adiciona apenas allowlists estritas.
title = "O Novelo Master — secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Arquivos que não contêm segredos por construção"
paths = [
  '''package-lock\.json$''',
  '''\.gitleaks\.toml$''',
  '''\.env\.example$''',
]

# Não há exceção por valor aqui, e é de propósito: nenhum token deve ser literal no código-fonte,
# nem quando o valor é público. O beacon do Cloudflare Web Analytics, que já rendeu um alarme, volta
# por variável de ambiente (NEXT_PUBLIC_*) declarada em .env.example — assim não há entropia no fonte
# para o scanner acusar, e a exceção deixa de ser necessária.
