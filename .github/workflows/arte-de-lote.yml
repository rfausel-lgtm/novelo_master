name: Arte de lote

# Entrega a arte gerada pela automação do Codex até a `main`.
#
# POR QUE ISTO EXISTE. A automação `Novelo — artes de lotes novos` gera, valida e empurra a arte para
# um branch em minutos, mas não consegue concluir: o `gh` da máquina autentica pelo keyring do
# Windows e o ambiente isolado dela não alcança o keyring — `gh` responde 401 e o PR nunca é aberto.
# A arte ficava parada em branch até uma pessoa perceber; foi assim que os lotes 136–165 levaram até
# 44 h para aparecer no site. Aqui o token é o do próprio Actions: nenhuma credencial nova precisa
# existir na máquina do Rafael.
#
# POR QUE AS VERIFICAÇÕES RODAM AQUI DENTRO, e não pelo CI de PR. PR aberto com o `GITHUB_TOKEN` não
# dispara o evento `pull_request` — é restrição do GitHub, para não haver laço infinito de workflows.
# Um PR assim nasceria sem verificação nenhuma. Então este workflow roda ele mesmo o que precisa
# passar antes de entregar.
#
# O QUE ELE SE RECUSA A FAZER. Só entrega branch cujo diff contra a `main` seja exclusivamente arte:
# ao menos um `public/social/*.webp` novo e nada fora da lista permitida. Branch que toque `src/`,
# `scripts/`, `data/` ou `.github/` é ignorada — código e dado passam por gente.

on:
  push:
    branches: ["codex/**"]

permissions:
  contents: write

concurrency:
  group: arte-de-lote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  entregar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: A branch é só de arte?
        id: triagem
        run: |
          set -euo pipefail
          base=$(git merge-base origin/main HEAD)
          mudados=$(git diff --name-only "$base" HEAD)
          novas=$(git diff --name-only --diff-filter=A "$base" HEAD | grep -E '^public/social/.+\.webp$' || true)

          if [ -z "$novas" ]; then
            echo "nenhuma arte nova nesta branch; nada a entregar"
            echo "seguir=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Lista permitida: a arte e o changelog, que a automação também escreve. Nada mais.
          fora=$(echo "$mudados" | grep -vE '^(public/social/.+\.webp|CHANGELOG\.md)$' || true)
          if [ -n "$fora" ]; then
            echo "branch mexe em arquivo que não é arte — deixando para revisão humana:"
            echo "$fora" | sed 's/^/    /'
            echo "seguir=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "artes novas:"
          echo "$novas" | sed 's/^/    /'
          echo "seguir=sim" >> "$GITHUB_OUTPUT"
          echo "quantas=$(echo "$novas" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          # Uma linha só, separada por espaço: o nome canônico não admite espaço, então é seguro.
          echo "novas=$(echo $novas | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.triagem.outputs.seguir == 'sim'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.triagem.outputs.seguir == 'sim'

      # As três que decidem se a arte pode ir ao ar: nome canônico e WebP válido, corpus íntegro, e o
      # site inteiro construindo com ela dentro.
      - run: npm run social:check
        if: steps.triagem.outputs.seguir == 'sim'
      - run: npm run data:lint
        if: steps.triagem.outputs.seguir == 'sim'
      - run: npm run build
        if: steps.triagem.outputs.seguir == 'sim'

      # ENTREGA DIRETA, sem PR. O ruleset `proteger-main` só impede deleção e force-push — não exige
      # PR nem verificações —, e as que importam acabaram de rodar acima. Abrir PR aqui esbarraria em
      # "GitHub Actions is not permitted to create or approve pull requests", configuração de
      # repositório desligada; foi como a primeira execução real falhou (run 34664172083).
      #
      # Os arquivos são copiados UM A UM, e não a pasta inteira: `git checkout <ref> -- public/social/`
      # traria a pasta como está na branch e APAGARIA da `main` a arte que chegou depois que a branch
      # nasceu — e a `main` anda o tempo todo, porque a pesquisa publica em rajadas.
      - name: Entregar a arte na main
        if: steps.triagem.outputs.seguir == 'sim'
        env:
          NOVAS: ${{ steps.triagem.outputs.novas }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          origem=$(git rev-parse HEAD)

          # `npm run build`, acima, reescreve public/acervo.txt e public/llms.txt, que são
          # versionados. Com esse resíduo no worktree, o `git checkout -B entrega origin/main` logo
          # abaixo recusa trocar de base sempre que a `main` tiver versão diferente desses arquivos —
          # o mesmo defeito que derrubou o card-de-lote.yml nas runs 34711387952 e 34711774411. As
          # artes a entregar já estão commitadas em `$origem` e voltam de lá arquivo a arquivo, então
          # descartar o worktree não perde nada.
          git checkout -- .

          # Pela mesma razão, a corrida com a `main` se resolve refazendo a entrega sobre a `main`
          # nova, em vez de falhar.
          for tentativa in 1 2 3 4 5; do
            git fetch --quiet origin main
            git checkout -q -B entrega origin/main

            faltando=""
            for arquivo in $NOVAS; do
              if git cat-file -e "origin/main:$arquivo" 2>/dev/null; then
                echo "já está na main, pulando: $arquivo"
              else
                git checkout "$origem" -- "$arquivo"
                faltando="$faltando $arquivo"
              fi
            done

            if [ -z "$faltando" ]; then
              echo "nada a entregar: todas as artes já estão na main"
              exit 0
            fi

            git add -- $faltando
            quantas=$(echo $faltando | wc -w | tr -d ' ')
            git commit -q -F - <<COMMIT
          feat(social): publica arte de lote ($quantas)

          Entrega automática de .github/workflows/arte-de-lote.yml, a partir de
          $BRANCH ($origem).

          O agente do Codex faz a inspeção editorial da seção 7.1 antes de empurrar a
          branch. Aqui passaram social:check, data:lint estrito e build, e a branch foi
          conferida como exclusivamente de arte.
          COMMIT

            if git push origin HEAD:main; then
              echo "entregue na main:$faltando"
              exit 0
            fi
            echo "a main andou durante a entrega; refazendo (tentativa $tentativa)"
          done
          echo "não consegui entregar em 5 tentativas" >&2
          exit 1
